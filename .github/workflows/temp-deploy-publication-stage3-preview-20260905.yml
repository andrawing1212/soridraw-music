name: SORIDRAW Deploy Publication Stage3 PREVIEW 2026-09-05
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-deploy-publication-stage3-preview-20260905.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PREVIEW_DB_NAME: soridraw-explore-preview-db
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2: soridraw-profile-media-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: TypeScript and app build
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install pinned Wrangler
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Apply PREVIEW D1 schema safely
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          cat > /tmp/soridraw-preview-d1.jsonc <<JSON
          {
            "name": "${PREVIEW_WORKER}",
            "main": "./placeholder.js",
            "compatibility_date": "2026-09-04",
            "d1_databases": [{"binding":"DB","database_name":"${PREVIEW_DB_NAME}","database_id":"${PREVIEW_DB_ID}"}]
          }
          JSON

          direct_ok=1
          run_sql() {
            local sql="$1"
            if ! npx wrangler d1 execute "$PREVIEW_DB_NAME" --remote --config /tmp/soridraw-preview-d1.jsonc --command "$sql"; then
              direct_ok=0
              return 1
            fi
          }

          if run_sql "SELECT 1 AS ok"; then
            echo '[Stage3 deploy] direct D1 API available'
            cols="$(npx wrangler d1 execute "$PREVIEW_DB_NAME" --remote --config /tmp/soridraw-preview-d1.jsonc --command "PRAGMA table_info(tracks)" --json)"
            if ! grep -q 'share_schema_version' <<<"$cols"; then run_sql "ALTER TABLE tracks ADD COLUMN share_schema_version INTEGER NOT NULL DEFAULT 0"; fi
            if ! grep -q 'share_payload_json' <<<"$cols"; then run_sql "ALTER TABLE tracks ADD COLUMN share_payload_json TEXT"; fi
            if ! grep -q 'primary_genre' <<<"$cols"; then run_sql "ALTER TABLE tracks ADD COLUMN primary_genre TEXT"; fi
            run_sql "CREATE INDEX IF NOT EXISTS idx_tracks_public_primary_genre ON tracks(is_public, status, primary_genre, published_at DESC, id DESC)"
            run_sql "DROP TRIGGER IF EXISTS trg_music_note_publication_bundle_insert"
            run_sql "DROP TRIGGER IF EXISTS trg_music_note_publication_bundle_update_new"
            run_sql "DROP TRIGGER IF EXISTS trg_music_note_publication_bundle_update_old"
            run_sql "DROP TRIGGER IF EXISTS trg_music_note_publication_bundle_delete"
          else
            echo '[Stage3 deploy] direct D1 API unavailable; using temporary Worker bound only to PREVIEW D1'
            suffix="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
            migrator="soridraw-preview-migrator-${suffix}"
            token="$(openssl rand -hex 24)"
            tmp="$(mktemp -d)"
            cleanup() {
              npx wrangler delete --name "$migrator" --force >/dev/null 2>&1 || true
              rm -rf "$tmp"
            }
            trap cleanup EXIT
            cat > "$tmp/worker.mjs" <<'JS'
          export default {
            async fetch(request, env) {
              if (request.headers.get('X-SORIDRAW-Migrate') !== env.MIGRATE_TOKEN) return new Response('not found', {status:404});
              try {
                const info = await env.DB.prepare('PRAGMA table_info(tracks)').all();
                const cols = new Set((info.results || []).map((r) => String(r.name || '')));
                if (!cols.has('share_schema_version')) await env.DB.prepare('ALTER TABLE tracks ADD COLUMN share_schema_version INTEGER NOT NULL DEFAULT 0').run();
                if (!cols.has('share_payload_json')) await env.DB.prepare('ALTER TABLE tracks ADD COLUMN share_payload_json TEXT').run();
                if (!cols.has('primary_genre')) await env.DB.prepare('ALTER TABLE tracks ADD COLUMN primary_genre TEXT').run();
                await env.DB.batch([
                  env.DB.prepare('CREATE INDEX IF NOT EXISTS idx_tracks_public_primary_genre ON tracks(is_public, status, primary_genre, published_at DESC, id DESC)'),
                  env.DB.prepare('DROP TRIGGER IF EXISTS trg_music_note_publication_bundle_insert'),
                  env.DB.prepare('DROP TRIGGER IF EXISTS trg_music_note_publication_bundle_update_new'),
                  env.DB.prepare('DROP TRIGGER IF EXISTS trg_music_note_publication_bundle_update_old'),
                  env.DB.prepare('DROP TRIGGER IF EXISTS trg_music_note_publication_bundle_delete')
                ]);
                const verifyInfo = await env.DB.prepare('PRAGMA table_info(tracks)').all();
                const verifyCols = new Set((verifyInfo.results || []).map((r) => String(r.name || '')));
                const triggers = await env.DB.prepare("SELECT name FROM sqlite_schema WHERE type='trigger' AND name LIKE 'trg_music_note_publication_bundle_%'").all();
                const ok = ['share_schema_version','share_payload_json','primary_genre'].every((c) => verifyCols.has(c)) && (triggers.results || []).length === 0;
                return Response.json({ok, columns:[...verifyCols].filter((c)=>['share_schema_version','share_payload_json','primary_genre'].includes(c)), triggerCount:(triggers.results||[]).length});
              } catch (error) {
                return Response.json({ok:false,error:String(error?.message || error)}, {status:500});
              }
            }
          };
          JS
            cat > "$tmp/wrangler.jsonc" <<JSON
          {
            "name": "$migrator",
            "main": "./worker.mjs",
            "compatibility_date": "2026-09-04",
            "workers_dev": true,
            "vars": {"MIGRATE_TOKEN": "$token"},
            "d1_databases": [{"binding":"DB","database_name":"${PREVIEW_DB_NAME}","database_id":"${PREVIEW_DB_ID}"}]
          }
          JSON
            npx wrangler deploy --config "$tmp/wrangler.jsonc"
            code="$(curl -sS -o /tmp/migrate.json -w '%{http_code}' -H "X-SORIDRAW-Migrate: $token" "https://${migrator}.andrawing1212.workers.dev/")"
            cat /tmp/migrate.json
            test "$code" = "200"
            grep -q '"ok":true' /tmp/migrate.json
          fi

      - name: Prepare exact active PREVIEW Worker and apply patches 014-017
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          rm -rf .remote-worker && mkdir -p .remote-worker
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
            const deps=await get(`${base}/deployments`); const d=(deps.deployments||deps||[])[0];
            const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!active?.version_id||Number(active.percentage||0)<99.99)throw new Error('No single active PREVIEW version');
            fs.writeFileSync('.remote-worker/before-version.txt',String(active.version_id));
            const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);
            const mods=ver.modules||[]; if(!mods.length)throw new Error('No active modules');
            const mainName=ver.main_module||mods[0].name||'worker.js'; const main=mods.find(m=>m.name===mainName)||mods[0];
            fs.writeFileSync(path.join('.remote-worker','worker.js'),Buffer.from(main.content_base64,'base64'));
            const settings=await get(`${base}/settings`);
            const cfg={
              name,
              main:'./worker.js',
              compatibility_date:String(settings.compatibility_date||'2026-09-04').slice(0,10),
              workers_dev:true,
              keep_vars:true,
              d1_databases:[{binding:'DB',database_name:process.env.PREVIEW_DB_NAME,database_id:process.env.PREVIEW_DB_ID}],
              r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PREVIEW_R2}],
              observability: settings.observability && typeof settings.observability==='object' ? {enabled:settings.observability.enabled!==false,...(typeof settings.observability.head_sampling_rate==='number'?{head_sampling_rate:settings.observability.head_sampling_rate}:{})} : {enabled:true}
            };
            if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)cfg.compatibility_flags=settings.compatibility_flags;
            fs.writeFileSync('.remote-worker/wrangler.jsonc',JSON.stringify(cfg,null,2));
            console.log(`[Stage3 deploy] active before=${active.version_id}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/014-publication-single-r2-bundle.mjs
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/015-publication-share-bundle-v1.mjs
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/016-publication-single-write-hotpath.mjs
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/017-publication-mutation-companions.mjs
          node --check .remote-worker/worker.js
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('.remote-worker/worker.js','utf8');
          function fn(name){const ns=[`async function ${name}(`,`function ${name}(`];let st=-1;for(const n of ns){st=s.indexOf(n);if(st>=0)break;}if(st<0)throw new Error('missing '+name);const b=s.indexOf('{',st);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i];if(q){if(e){e=false;continue;}if(c==='\\'){e=true;continue;}if(c===q)q=null;continue;}if(c==='"'||c==="'"||c==='`'){q=c;continue;}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(st,i+1);}throw new Error('unterminated '+name)}
          const hot=fn('handleMusicNotePublicationSingleWrite016');
          if((hot.match(/INSERT INTO tracks/g)||[]).length!==1)throw new Error('publication canonical tracks write != 1');
          for(const bad of ['track_tags','track_stats (','refreshOrPrebuildPublicProfileTrackWindow(','safelyRefreshExploreFeedR2Bundles(','enforceUserRateLimit('])if(hot.includes(bad))throw new Error('publication hot-path still contains '+bad);
          for(const marker of ['SORIDRAW_PUBLICATION_SINGLE_R2_BUNDLE_014_20260905','SORIDRAW_PUBLICATION_SHARE_BUNDLE_V1_015_20260905','SORIDRAW_PUBLICATION_SINGLE_WRITE_HOTPATH_016_20260905','SORIDRAW_PUBLICATION_MUTATION_COMPANIONS_017_20260905'])if(!s.includes(marker))throw new Error('missing '+marker);
          console.log('[Stage3 deploy] patched worker invariants PASS');
          NODE

      - name: Deploy PREVIEW Worker
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc

      - name: Verify deployed PREVIEW Worker and public integration
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
            let active=null;
            for(let i=0;i<12;i++){
              const deps=await get(`${base}/deployments`); const d=(deps.deployments||deps||[])[0];
              active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
              if(active?.version_id&&Number(active.percentage||0)>=99.99)break;
              await new Promise(r=>setTimeout(r,2500));
            }
            if(!active?.version_id)throw new Error('active deployed version missing');
            const before=fs.readFileSync('.remote-worker/before-version.txt','utf8').trim();
            if(active.version_id===before)throw new Error('PREVIEW Worker active version did not change');
            const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);
            const mods=ver.modules||[];const main=mods.find(m=>m.name===(ver.main_module||mods[0]?.name))||mods[0];const src=Buffer.from(main.content_base64,'base64').toString('utf8');
            for(const marker of ['SORIDRAW_PUBLICATION_SINGLE_R2_BUNDLE_014_20260905','SORIDRAW_PUBLICATION_SHARE_BUNDLE_V1_015_20260905','SORIDRAW_PUBLICATION_SINGLE_WRITE_HOTPATH_016_20260905','SORIDRAW_PUBLICATION_MUTATION_COMPANIONS_017_20260905'])if(!src.includes(marker))throw new Error('deployed marker missing '+marker);
            console.log(`[Stage3 deploy] active after=${active.version_id}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          feed_code="$(curl -sS -o /tmp/feed.json -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=latest&limit=1")"
          test "$feed_code" = "200"
          grep -q '"data"' /tmp/feed.json

          genres_code="$(curl -sS -o /tmp/genres.json -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/genres")"
          test "$genres_code" = "200"
          grep -q '"data"' /tmp/genres.json

          auth_code="$(curl -sS -o /tmp/pub401.json -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" -H 'Content-Type: application/json' -X POST --data '{}' "${PREVIEW_BASE}/v1/publications")"
          test "$auth_code" = "401"

          site_code="$(curl -sS -o /tmp/site.html -w '%{http_code}' "${PREVIEW_ORIGIN}")"
          test "$site_code" = "200"
          echo '[Stage3 deploy] PREVIEW public smoke PASS'
