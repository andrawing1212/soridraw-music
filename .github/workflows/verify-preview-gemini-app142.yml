name: SORIDRAW PREVIEW Gemini Function Tune

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/verify-preview-gemini-app142.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-preview-gemini-function-tune
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROJECT: soridraw-app-866a5
      REGION: us-central1
      PREVIEW_FUNCTION: generateGeminiContentPreview
      SHARED_FUNCTION: generateGeminiContent
      PREVIEW_ORIGIN: https://preview.soridraw.com
      EXPECTED_SHARED_UPDATE_TIME: 2026-08-30T22:58:13.839878918Z
      EXPECTED_SHARED_SOURCE: generateGeminiContent/function-source.zip

    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Functions and verify app145 Gemini latency contract
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          npm ci --no-audit --no-fund
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const src = fs.readFileSync('src/securedIndex.ts', 'utf8');
          const must = [
            'gemini-3.8-flash',
            'gemini-3.7-flash',
            'gemini-3.6-flash',
            'gemini-3.5-flash',
            'requestedThinkingLevel',
            'thinking_level: interactionThinkingLevel',
            '["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"].includes(attemptModel)',
            'thinkingLevel: "low"',
            'export const generateGeminiContentPreview = onRequest',
          ];
          for (const token of must) {
            if (!src.includes(token)) throw new Error('Missing low-thinking contract: ' + token);
          }
          if (!src.includes('"gemini-3.5-flash": 20_000')) throw new Error('3.5 initial timeout is not 20s');
          if (!src.includes('daily_quota_exhausted')) throw new Error('daily quota reason missing');
          if (!src.includes('getGeminiDailyQuotaCooldownMs')) throw new Error('Pacific reset cooldown helper missing');
          const lyricBrief = fs.readFileSync('../src/services/lyricStoryBrief.ts', 'utf8');
          if (lyricBrief.includes('buildCreativeBriefSourceSummary') || lyricBrief.includes('buildMoodDirectorBrief')) {
            throw new Error('duplicated creative/mood source payload returned to lyric brief');
          }
          if (!lyricBrief.includes('Reuse the COMMON SONG CREATIVE BRIEF immediately above')) {
            throw new Error('compact lyric brief reference missing');
          }
          const prefs = fs.readFileSync('../src/services/geminiModelPreferences.ts', 'utf8');
          if (!prefs.includes('daily_quota_exhausted') || !prefs.includes('26 * 60 * 60_000')) {
            throw new Error('client daily quota persistence contract missing');
          }
          console.log('PREVIEW_GEMINI_INITIAL_FLASH_LOW_THINKING=PASS');
          console.log('PREVIEW_GEMINI_CHAIN_ORDER_UNCHANGED=PASS');
          console.log('PREVIEW_GEMINI_35_TIMEOUT_20S=PASS');
          console.log('PREVIEW_GEMINI_DAILY_QUOTA_SKIP=PASS');
          console.log('PREVIEW_GEMINI_PROMPT_DUPLICATE_REMOVAL=PASS');
          NODE

      - name: Authenticate Google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot PREVIEW and shared Functions
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe "$PREVIEW_FUNCTION" --gen2 --region "$REGION" --project "$PROJECT" --format=json > "$RUNNER_TEMP/preview-before.json"
          gcloud functions describe "$SHARED_FUNCTION" --gen2 --region "$REGION" --project "$PROJECT" --format=json > "$RUNNER_TEMP/shared-before.json"
          python3 - "$RUNNER_TEMP/preview-before.json" "$RUNNER_TEMP/shared-before.json" <<'PY'
          import json, os, sys
          preview=json.load(open(sys.argv[1],encoding='utf-8'))
          shared=json.load(open(sys.argv[2],encoding='utf-8'))
          shared_src=(((shared.get('buildConfig') or {}).get('source') or {}).get('storageSource') or {})
          if str(shared.get('updateTime') or '') != os.environ['EXPECTED_SHARED_UPDATE_TIME']:
              raise SystemExit('Shared Gemini Function changed before deploy')
          if str(shared_src.get('object') or '') != os.environ['EXPECTED_SHARED_SOURCE']:
              raise SystemExit('Shared Gemini Function source changed before deploy')
          print('PREVIEW_BEFORE_UPDATE_TIME='+str(preview.get('updateTime') or ''))
          print('SHARED_GEMINI_FUNCTION_PRECHECK=PASS')
          PY

      - name: Deploy PREVIEW Gemini Function only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npx --yes firebase-tools@latest deploy             --project "$PROJECT"             --only "functions:$PREVIEW_FUNCTION"             --non-interactive 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            if printf '%s' "$output" | grep -Fq 'Functions successfully deployed but could not set up cleanup policy'; then
              echo 'FIREBASE_DEPLOY_FUNCTION_CREATED_BUT_CLEANUP_POLICY_WARNING=true'
            else
              exit "$code"
            fi
          fi

      - name: Verify exact PREVIEW Function update and shared isolation
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe "$PREVIEW_FUNCTION" --gen2 --region "$REGION" --project "$PROJECT" --format=json > "$RUNNER_TEMP/preview-after.json"
          gcloud functions describe "$SHARED_FUNCTION" --gen2 --region "$REGION" --project "$PROJECT" --format=json > "$RUNNER_TEMP/shared-after.json"
          python3 - "$RUNNER_TEMP/preview-before.json" "$RUNNER_TEMP/preview-after.json" "$RUNNER_TEMP/shared-before.json" "$RUNNER_TEMP/shared-after.json" <<'PY'
          import json, sys
          pb=json.load(open(sys.argv[1],encoding='utf-8'))
          pa=json.load(open(sys.argv[2],encoding='utf-8'))
          sb=json.load(open(sys.argv[3],encoding='utf-8'))
          sa=json.load(open(sys.argv[4],encoding='utf-8'))
          def ident(d):
              src=(((d.get('buildConfig') or {}).get('source') or {}).get('storageSource') or {})
              return (str(d.get('updateTime') or ''), str(src.get('bucket') or ''), str(src.get('object') or ''))
          if str(pa.get('state') or '') != 'ACTIVE':
              raise SystemExit('Preview Gemini Function not ACTIVE')
          if ident(pb)[0] == ident(pa)[0]:
              raise SystemExit('Preview Gemini Function updateTime did not change')
          if ident(sb) != ident(sa):
              raise SystemExit('Shared Gemini Function changed during PREVIEW-only deploy')
          runtime=str((pa.get('buildConfig') or {}).get('runtime') or '')
          if runtime != 'nodejs22':
              raise SystemExit('Unexpected PREVIEW runtime: '+runtime)
          print('PREVIEW_GEMINI_FUNCTION_UPDATED=PASS')
          print('SHARED_GEMINI_FUNCTION_UNCHANGED=PASS')
          print('PREVIEW_RUNTIME='+runtime)
          PY

          url="https://us-central1-$PROJECT.cloudfunctions.net/$PREVIEW_FUNCTION"
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/body -D /tmp/head -w '%{http_code}' -X OPTIONS               -H "Origin: $PREVIEW_ORIGIN"               -H 'Access-Control-Request-Method: POST'               -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck'               "$url" || true)"
            allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/head)"
            if [ "$code" = "204" ] && [ "$allow" = "$PREVIEW_ORIGIN" ]; then
              echo 'PREVIEW_GEMINI_CORS=PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'PREVIEW_GEMINI_CORS=FAIL'
          cat /tmp/head || true
          exit 1
