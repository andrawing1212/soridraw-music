name: TEMP 080 Fix Release Order Verifier

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-080-fix-like-verifier.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Update verifier for 047
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-explore-like-cost-optimization.mjs')
          s=p.read_text(encoding='utf-8')
          old="""assert.equal(manifest.patches.at(-2), '045-publication-revision-metadata.mjs', '045 publication revision metadata must remain directly before 046');
          assert.equal(manifest.patches.at(-1), '046-publication-write-compaction.mjs', '046 publication write compaction must be the final Worker release patch');"""
          new="""assert.equal(manifest.patches.at(-3), '045-publication-revision-metadata.mjs', '045 publication revision metadata must remain directly before 046');
          assert.equal(manifest.patches.at(-2), '046-publication-write-compaction.mjs', '046 publication write compaction must remain directly before 047');
          assert.equal(manifest.patches.at(-1), '047-publication-state-transition.mjs', '047 publication state transition must be the final Worker release patch');"""
          if old not in s:
              raise SystemExit('release-order verifier anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/verify-explore-like-cost-optimization.mjs
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add scripts/verify-explore-like-cost-optimization.mjs
          git commit -m 'test(preview): accept Worker patch 047 release order'
          git push origin HEAD:preview
