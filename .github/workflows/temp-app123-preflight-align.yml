name: TEMP app123 preflight alignment

on:
  push:
    branches:
      - work/app123-worker-preflight-align
    paths:
      - '.github/workflows/temp-app123-preflight-align.yml'
      - 'scripts/verify-085-liked-profile.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/app123-worker-preflight-align
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verifiers
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-085-liked-profile.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-123-shared-like-cache-repair.mjs
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
