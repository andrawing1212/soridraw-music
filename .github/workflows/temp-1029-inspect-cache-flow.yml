name: Temp 1029 Inspect Cache Flow
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1029-inspect-cache-flow.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - name: Print exact Music Note count and cache-trust blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text()
          for n in ['favoriteTotalCount', 'setFavoriteTotalCount', 'historicalMaxCount', 'readUserProfileCache(currentUser.uid)', 'hasCachedMusicNote', 'shouldVerifyMusicNoteBundle']:
            print('\n###',n)
            pos=0; count=0
            while True:
              i=s.find(n,pos)
              if i<0: break
              print('\nINDEX',i)
              print(s[max(0,i-2200):i+5200])
              pos=i+len(n); count+=1
              if count>=10: break
          PY