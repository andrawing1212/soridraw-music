name: SORIDRAW Follow 549 Live Authority Readonly

on:
  pull_request:
    branches: [preview]
    paths:
      - '.github/workflows/follow-549-live-phase-readonly.yml'
      - 'scripts/verify-567-owner-firebase-live-readonly.mjs'
      - 'scripts/verify-571-owner-epoch-live-readonly.mjs'
  push:
    branches: [preview]
    paths:
      - '.github/workflows/follow-549-live-phase-readonly.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-follow-549-live-phase-readonly
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live legacy/overlay contract using only metadata SELECT
        run: |
          set -euo pipefail
          node scripts/verify-548-follow-live-readonly.mjs --self-test
          node scripts/verify-548-follow-live-readonly.mjs --live
          node scripts/verify-571-owner-epoch-live-readonly.mjs --self-test
          node scripts/verify-571-owner-epoch-live-readonly.mjs --live
          echo 'FOLLOW_549_NO_DEPLOY_NO_USER_CONTENT_SHARED_D1_WRITES_ZERO=PASS'
      - name: Authenticate Firebase Admin project metadata (read-only, never write)
        if: github.event_name == 'pull_request'
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/cloud-platform'
      - name: Inspect deployed Functions and RTDB Rules only (no user rows)
        if: github.event_name == 'pull_request'
        env:
          FIREBASE_READONLY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node scripts/verify-567-owner-firebase-live-readonly.mjs --self-test
          node scripts/verify-567-owner-firebase-live-readonly.mjs --live
          echo 'FOLLOW_567_READONLY_NO_CUSTOMER_DATA_NO_DEPLOY=PASS'
