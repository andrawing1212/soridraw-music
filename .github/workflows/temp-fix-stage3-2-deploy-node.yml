name: SORIDRAW Fix Stage3.2 Deploy Node
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-fix-stage3-2-deploy-node.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 2 }
      - name: Patch deploy workflow to Node 22
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/temp-deploy-stage3-2-preview-20260905.yml')
          s=p.read_text(encoding='utf-8')
          old='- name: Set up Node.js 20\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20'
          new='- name: Set up Node.js 22\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22'
          if s.count(old) != 1: raise SystemExit('node setup anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/temp-deploy-stage3-2-preview-20260905.yml
          git commit -m 'fix(preview): run stage3.2 deploy with Node 22'
          git push origin HEAD:preview
