name: Temporary Functions Only Deploy

on:
  issues:
    types: [opened]

concurrency:
  group: temporary-functions-only-deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-functions:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'DEPLOY SORIDRAW FUNCTIONS ONLY RETRY 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.34.0

      - name: Deploy changed Functions only
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          firebase deploy \
            --only functions:syncAuthUserToFirestore,functions:backfillMissingAuthUsers,functions:getAdminAuthDirectory,functions:adminForceLogoutUser,functions:adminResetEmailVerification,functions:adminDeleteUserAccount \
            --project soridraw-app-866a5 \
            --non-interactive 2>&1 | tee /tmp/firebase-functions-deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '❌ FIREBASE_FUNCTIONS_DEPLOY_DETAILS'
              echo
              echo '```text'
              tail -n 120 /tmp/firebase-functions-deploy.log
              echo '```'
            } > /tmp/firebase-functions-deploy-comment.md
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/firebase-functions-deploy-comment.md
          fi
          exit "$code"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ SORIDRAW_FUNCTIONS_ONLY_SUCCESS project=soridraw-app-866a5"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ SORIDRAW_FUNCTIONS_ONLY_FAILED run_id=${{ github.run_id }}"
