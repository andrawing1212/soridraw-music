name: SORIDRAW Synthetic 044 Probe D1 Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-audit-probe-d1-20260912.yml'

permissions:
  contents: read

jobs:
  audit-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only D1 reference audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const uids = [
            'soridraw044_preview_1788858037027_hz0rqi',
            'soridraw044_preview_1788859541129_1hs088',
            'soridraw044_preview_1788859809967_h2cqp0',
          ];
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.SHARED_D1_ID}/query`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          const qi = (v) => `"${String(v).replaceAll('"','""')}"`;
          const qs = (v) => `'${String(v).replaceAll("'", "''")}'`;
          async function query(sql) {
            const res = await fetch(endpoint, { method: 'POST', headers, body: JSON.stringify({ sql }) });
            const text = await res.text();
            const json = JSON.parse(text);
            if (!res.ok || json.success === false) throw new Error(`D1 ${res.status}: ${text.slice(0,1000)}`);
            return (Array.isArray(json.result) ? json.result : [json.result]).flatMap(b => b?.results || []);
          }
          (async () => {
            const uidCols = ['uid','user_id','user_uid','owner_uid','author_uid','follower_uid','following_uid','target_uid','actor_uid','profile_uid'];
            const schema = await query("SELECT name, sql FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
            const hits = [];
            let checks = 0;
            const inList = uids.map(qs).join(',');
            for (const row of schema) {
              const table = String(row.name || '');
              const ddl = String(row.sql || '');
              if (!table || !ddl) continue;
              for (const col of uidCols) {
                if (!new RegExp(`(^|[^A-Za-z0-9_])${col}([^A-Za-z0-9_]|$)`, 'i').test(ddl)) continue;
                checks += 1;
                const rows = await query(`SELECT COUNT(*) count FROM ${qi(table)} WHERE ${qi(col)} IN (${inList})`);
                const count = Number(rows[0]?.count || 0);
                if (count > 0) hits.push({ table, column: col, count });
              }
            }
            console.log(`D1_CHECKED_CANDIDATES=${uids.length}`);
            console.log(`D1_COLUMN_CHECKS=${checks}`);
            console.log(`D1_REFERENCE_HITS=${hits.length}`);
            console.log(JSON.stringify({ hits }, null, 2));
            if (hits.length) process.exit(2);
            console.log('SYNTHETIC_044_D1_AUDIT=PASS');
            console.log('D1_WRITES=0');
            console.log('D1_DELETES=0');
          })().catch(e => { console.error('SYNTHETIC_044_D1_AUDIT=FAIL', e?.stack || e); process.exit(1); });
          NODE
