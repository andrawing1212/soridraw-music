name: TEMP B Pointer Deploy Dispatch
permissions:
  contents: read
  actions: write
on:
  push:
    branches: [preview-b-pointer-leak-fix]
jobs:
  dispatch-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source commit and dispatch Firebase PREVIEW
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=540b0682c18e4d91b64ee22b1bf1ea7da3e72998
          ACTUAL="$(gh api repos/${{ github.repository }}/branches/preview --jq '.commit.sha')"
          test "$ACTUAL" = "$EXPECTED"
          gh workflow run firebase-hosting-custom-preview.yml --repo "${{ github.repository }}" --ref preview
          echo "Dispatched Firebase Hosting Custom Preview for $ACTUAL"
