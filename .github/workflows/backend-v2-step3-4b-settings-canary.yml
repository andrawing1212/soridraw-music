name: SORIDRAW Backend V2 Step 3-4b Settings Canary

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4b-settings-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_MANIFEST: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z/manifest.json
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      MAX_CANARY_WRITES: '3'

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate exact Firebase project session
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Preflight IAM permissions, quota headroom and rollback checkpoint
        shell: bash
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
          GOOGLE_CLOUD_QUOTA_PROJECT: soridraw-app-866a5
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = process.env.TARGET_PROJECT;
          const bucketName = process.env.TARGET_BUCKET;
          const manifestPath = process.env.BACKUP_MANIFEST;
          const expectedManifestHash = process.env.EXPECTED_MANIFEST_SHA256;
          const canaryWrites = Number(process.env.MAX_CANARY_WRITES || 0);
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          if (bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('BUCKET_PIN_MISMATCH');
          if (canaryWrites !== 3) throw new Error('CANARY_CAP_MISMATCH');

          const getValue = (point) => {
            const raw = point?.value?.int64Value ?? point?.value?.doubleValue ?? 0;
            const value = Number(raw);
            return Number.isFinite(value) && value > 0 ? value : 0;
          };
          const now = new Date();
          const kstDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
          const dayStartMs = Date.parse(`${kstDate}T00:00:00+09:00`);
          const recentStartMs = now.getTime() - 10 * 60_000;
          const queryMetric = async (accessToken, metricType) => {
            const params = new URLSearchParams({
              filter: `metric.type = "${metricType}"`,
              'interval.startTime': new Date(dayStartMs).toISOString(),
              'interval.endTime': now.toISOString(),
              view: 'FULL',
              pageSize: '1000',
            });
            let pageToken = '';
            let today = 0;
            let recent = 0;
            let pointCount = 0;
            let pageCount = 0;
            do {
              if (pageToken) params.set('pageToken', pageToken); else params.delete('pageToken');
              const response = await fetch(`https://monitoring.googleapis.com/v3/projects/${projectId}/timeSeries?${params}`, {
                headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, Accept: 'application/json' },
              });
              const body = await response.text();
              if (!response.ok) {
                const err = new Error(`MONITORING_${response.status}`); err.statusCode = response.status; throw err;
              }
              const payload = body ? JSON.parse(body) : {};
              for (const series of payload.timeSeries || []) {
                for (const point of series.points || []) {
                  const value = getValue(point);
                  const end = Date.parse(String(point?.interval?.endTime || ''));
                  today += value; pointCount += 1;
                  if (Number.isFinite(end) && end >= recentStartMs) recent += value;
                }
              }
              pageToken = String(payload.nextPageToken || '');
              if (++pageCount > 5) throw new Error('MONITORING_PAGINATION_LIMIT');
            } while (pageToken);
            return { today: Math.round(today), recent: Math.round(recent), pointCount };
          };
          const queryFamily = async (accessToken, candidates) => {
            for (const metricType of candidates) {
              try {
                const result = await queryMetric(accessToken, metricType);
                if (result.pointCount > 0) return result;
              } catch (error) {
                if (error?.statusCode === 400 || error?.statusCode === 404) continue;
                throw error;
              }
            }
            return { today: 0, recent: 0, pointCount: 0 };
          };

          (async () => {
            const credential = admin.credential.applicationDefault();
            const token = await credential.getAccessToken();
            const accessToken = String(token?.access_token || '');
            if (!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');

            const iamResponse = await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify({ permissions: ['datastore.entities.get', 'datastore.entities.list', 'datastore.entities.create'] }),
            });
            const iamText = await iamResponse.text();
            if (!iamResponse.ok) throw new Error(`IAM_TEST_${iamResponse.status}`);
            const granted = new Set((JSON.parse(iamText || '{}').permissions || []).map(String));
            const missing = ['datastore.entities.get', 'datastore.entities.list', 'datastore.entities.create'].filter((p) => !granted.has(p));
            console.log('CANARY_IAM=' + JSON.stringify({ get: granted.has('datastore.entities.get'), list: granted.has('datastore.entities.list'), create: granted.has('datastore.entities.create') }));
            if (missing.length) throw new Error('CANARY_IAM_MISSING:' + missing.join(','));

            const [reads, writes, deletes] = await Promise.all([
              queryFamily(accessToken, ['firestore.googleapis.com/document/read_ops_count', 'firestore.googleapis.com/document/read_count']),
              queryFamily(accessToken, ['firestore.googleapis.com/document/write_ops_count', 'firestore.googleapis.com/document/write_count']),
              queryFamily(accessToken, ['firestore.googleapis.com/document/delete_ops_count', 'firestore.googleapis.com/document/delete_count']),
            ]);
            const safeReadCap = Math.min(10_000, Math.max(0, 50_000 - reads.today - 10_000));
            const safeWriteCap = Math.min(5_000, Math.max(0, 20_000 - writes.today - 4_000));
            const estimatedCanaryReads = 12;
            console.log('CANARY_QUOTA=' + JSON.stringify({ todayReads: reads.today, todayWrites: writes.today, todayDeletes: deletes.today, recent10mReads: reads.recent, recent10mWrites: writes.recent, safeReadCap, safeWriteCap, estimatedCanaryReads, maxCanaryWrites: canaryWrites }));
            if (safeReadCap < estimatedCanaryReads || safeWriteCap < canaryWrites) throw new Error('CANARY_QUOTA_PAUSE');

            const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step34b-preflight-${Date.now()}`);
            try {
              const [bytes] = await getStorage(app).bucket(bucketName).file(manifestPath).download();
              const hash = crypto.createHash('sha256').update(bytes).digest('hex');
              if (hash !== expectedManifestHash) throw new Error('ROLLBACK_MANIFEST_HASH_MISMATCH');
              console.log('CANARY_ROLLBACK_CHECKPOINT=' + JSON.stringify({ available: true, manifestHashMatch: true }));
            } finally {
              await deleteApp(app);
            }
          })().catch((error) => {
            console.error('CANARY_PREFLIGHT_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          });
          NODE

      - name: Execute settings-only create canary and verify V1 unchanged
        shell: bash
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');

          const projectId = process.env.TARGET_PROJECT;
          const maxWrites = Number(process.env.MAX_CANARY_WRITES || 0);
          if (projectId !== 'soridraw-app-866a5' || maxWrites !== 3) throw new Error('CANARY_EXECUTION_PIN_MISMATCH');

          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string', 'number', 'boolean'].includes(typeof value)) return value;
            if (Buffer.isBuffer(value)) return { __type: 'buffer', base64: value.toString('base64') };
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return { __type: 'date', iso: value.toISOString() };
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return { __type: 'timestamp', seconds: value.seconds, nanoseconds: value.nanoseconds };
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return { __type: 'geopoint', latitude: value.latitude, longitude: value.longitude };
            if (typeof value?.path === 'string' && value?.firestore) return { __type: 'reference', path: value.path };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));
            throw new Error('UNSUPPORTED_SETTING_VALUE_TYPE');
          };
          const digest = (value) => crypto.createHash('sha256').update(JSON.stringify(canonicalize(value))).digest('hex');

          const app = initializeApp({ credential: applicationDefault(), projectId }, `step34b-settings-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const sourceSnapshot = await db.collection('user_structures').get();
            if (sourceSnapshot.size !== 3) throw new Error(`SETTINGS_SOURCE_COUNT_CHANGED:${sourceSnapshot.size}`);

            const plans = [];
            for (const sourceDoc of sourceSnapshot.docs) {
              const uid = sourceDoc.id;
              if (!uid || uid.includes('/')) throw new Error('INVALID_SOURCE_UID');
              const sourceData = sourceDoc.data();
              const sourceHash = digest(sourceData);
              const destRef = db.doc(`users/${uid}/settings/sections`);
              const destSnap = await destRef.get();
              if (destSnap.exists) {
                const destHash = digest(destSnap.data());
                if (destHash !== sourceHash) throw new Error('SETTINGS_DESTINATION_CONFLICT');
                plans.push({ sourceRef: sourceDoc.ref, destRef, sourceHash, sourceUpdateTime: sourceDoc.updateTime?.toMillis?.() ?? null, action: 'noop' });
              } else {
                plans.push({ sourceRef: sourceDoc.ref, destRef, sourceHash, sourceUpdateTime: sourceDoc.updateTime?.toMillis?.() ?? null, action: 'create', sourceData });
              }
            }

            const creates = plans.filter((p) => p.action === 'create');
            if (creates.length > maxWrites) throw new Error('CANARY_WRITE_CAP_EXCEEDED');
            if (creates.length) {
              const batch = db.batch();
              for (const plan of creates) batch.create(plan.destRef, plan.sourceData);
              await batch.commit();
            }

            for (const plan of plans) {
              const [sourceAfter, destAfter] = await Promise.all([plan.sourceRef.get(), plan.destRef.get()]);
              if (!sourceAfter.exists || !destAfter.exists) throw new Error('CANARY_POSTVERIFY_MISSING_DOCUMENT');
              if (digest(sourceAfter.data()) !== plan.sourceHash) throw new Error('V1_SOURCE_PAYLOAD_CHANGED');
              const afterUpdateTime = sourceAfter.updateTime?.toMillis?.() ?? null;
              if (afterUpdateTime !== plan.sourceUpdateTime) throw new Error('V1_SOURCE_UPDATE_TIME_CHANGED');
              if (digest(destAfter.data()) !== plan.sourceHash) throw new Error('V2_SETTINGS_PAYLOAD_MISMATCH');
            }

            console.log('SORIDRAW_STEP3_4B_SETTINGS_CANARY=' + JSON.stringify({
              sourceDocuments: plans.length,
              created: creates.length,
              noOpExistingIdentical: plans.length - creates.length,
              conflicts: 0,
              maxWriteCap: maxWrites,
              destination: 'users/{uid}/settings/sections',
              v1Writes: 0,
              v1Deletes: 0,
              v2Deletes: 0,
              verifiedSourceUnchanged: true,
              verifiedDestinationPayloads: true,
            }));
          })().finally(async () => {
            await deleteApp(app);
          }).catch((error) => {
            console.error('SORIDRAW_STEP3_4B_SETTINGS_CANARY_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          });
          NODE

      - name: Final repository side-effect check
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${GOOGLE_GHA_CREDS_PATH:-}" gha-creds-*.json
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi
          echo 'Step 3-4b settings canary repository check PASS.'
