name: SORIDRAW Owner Canary Version Routing (APP643)

on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/app643-preview-owner-cors.mjs'
      - '.github/workflows/follow-642-owner-zero-percent.yml'
  push:
    branches: [preview]
    paths:
      - '.deploy/app643-owner-override-cors.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-owner-canary-version-routing
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate exactly one safe-Worker browser preflight addition
        run: |
          node --check scripts/app643-preview-owner-cors.mjs
          node scripts/app643-preview-owner-cors.mjs --self-test

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Enforce previously approved one-canary exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/preview'
          test "$(git rev-parse HEAD^1)" = '4a3ef425b2573fb0928842020d2a5f466db04d78'
          node --check scripts/app643-preview-owner-cors.mjs
          node scripts/app643-preview-owner-cors.mjs --self-test
          file='.deploy/app643-owner-override-cors.trigger'
          test -f "$file"
          grep -Fxq 'mode=safe-off-preflight-cors-100-and-owner-candidate-0' "$file"
          grep -Fxq 'approved_preview_parent=4a3ef425b2573fb0928842020d2a5f466db04d78' "$file"
          grep -Fxq 'safe_off_version=73f64a79-6cac-441b-9906-9ea9e32db66d' "$file"
          grep -Fxq 'candidate_version=6b13cde4-4a53-42d2-873f-361f7cf5a931' "$file"
          expected="$(printf '%s\n' "$file" '.github/workflows/follow-642-owner-zero-percent.yml' 'scripts/app643-preview-owner-cors.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-only HEAD^1 HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo 'APP643_EXACT_SCOPE_AND_PARENT=PASS'
          echo 'APP643_PARENT=4a3ef425b2573fb0928842020d2a5f466db04d78' >> "$GITHUB_ENV"
      - name: Stage exact safe CORS-only version and retain 0-percent owner version
        run: node scripts/app643-preview-owner-cors.mjs --apply-once
