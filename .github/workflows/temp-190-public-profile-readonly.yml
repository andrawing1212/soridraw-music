name: SORIDRAW 190 Public Profile Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-190-public-profile-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect PREVIEW public profile and feed read-only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://soridraw-explore-preview.andrawing1212.workers.dev'
          ORIGIN='https://preview.soridraw.com'
          curl -fsS -D "$RUNNER_TEMP/profile.headers" -H "Origin: $ORIGIN"             "$BASE/v1/profiles/soridraw/first-view?limit=50"             -o "$RUNNER_TEMP/profile.json"
          echo '=== PROFILE HEADERS ==='
          grep -Ei '^(HTTP/|x-soridraw-profile-revision:|x-soridraw-profile-edge-cache:|x-soridraw-d1-read:|x-soridraw-d1-write:)' "$RUNNER_TEMP/profile.headers" || true
          echo '=== PROFILE SUMMARY ==='
          node - "$RUNNER_TEMP/profile.json" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const d=p?.data||{};
          const profile=d.profile||d.snapshot?.profile||{};
          const items=Array.isArray(d.items)?d.items:Array.isArray(d.tracks?.items)?d.tracks.items:Array.isArray(d.snapshot?.items)?d.snapshot.items:[];
          console.log(JSON.stringify({
            ok:p?.ok,
            uid:profile.uid||null,
            handle:profile.handle||null,
            trackCount:profile.trackCount??profile.track_count??null,
            revision:d.revision??d.snapshot?.revision??null,
            itemCount:items.length,
            items:items.map(x=>({id:x.id||x.trackId||null,title:x.title||null,ownerUid:x.ownerUid||x.owner_uid||null,publishedAt:x.publishedAt||x.published_at||null}))
          },null,2));
          NODE

          curl -fsS -D "$RUNNER_TEMP/feed.headers" -H "Origin: $ORIGIN"             "$BASE/v1/feed?sort=latest&limit=40&__soridraw_r2_only=108"             -o "$RUNNER_TEMP/feed.json"
          echo '=== FEED HEADERS ==='
          grep -Ei '^(HTTP/|x-soridraw-feed-revision:|x-soridraw-feed-snapshot:|x-soridraw-d1-read:|x-soridraw-d1-write:)' "$RUNNER_TEMP/feed.headers" || true
          echo '=== OWNER FEED ITEMS ==='
          node - "$RUNNER_TEMP/feed.json" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const items=Array.isArray(p?.data?.items)?p.data.items:[];
          const owner=items.filter(x=>String(x.ownerHandle||x.owner_handle||'').replace(/^@+/,'').toLowerCase()==='soridraw');
          console.log(JSON.stringify({
            totalFeedItems:items.length,
            ownerCount:owner.length,
            ownerItems:owner.map(x=>({id:x.id||x.trackId||null,title:x.title||null,ownerUid:x.ownerUid||x.owner_uid||null,publishedAt:x.publishedAt||x.published_at||null}))
          },null,2));
          NODE
          echo 'READ_ONLY=PASS'
