name: SORIDRAW Backend V2 Step 2-A4d Independent Read-only Verification

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4d-postverify-readonly.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5
      EXPECTED_FAVORITES: '742'
      EXPECTED_STABLE_FAVORITES: '1'
      EXPECTED_LEGACY_FAVORITES: '741'
      EXPECTED_RECENT_BUNDLES: '10'
      EXPECTED_RECENT_ITEMS: '68'
      EXPECTED_RECENT_STABLE_ITEMS: '0'
      EXPECTED_V2_AFTER: '810'
      EXPECTED_V2_STABLE_AFTER: '1'
      EXPECTED_V2_LEGACY_FAVORITE_AFTER: '741'
      EXPECTED_V2_LEGACY_RECENT_AFTER: '68'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - run: npm ci --ignore-scripts

      - name: Independent read-only parity verification
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const projectId=process.env.FIREBASE_PROJECT_ID;
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          initializeApp({credential:applicationDefault(),projectId});
          const db=getFirestore();
          const stable=/^sd_[0-9a-f]{32}$/;
          const reserved=new Set(['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','v2MutationId','legacyRecentIndex','legacyFavoriteId','legacyFavoriteKey']);
          const activeFavorite=(d)=>Boolean(d && d.saved !== false && d.favoriteRemoved !== true);
          const deterministicFavoriteSongId=(path)=>`v1f_${crypto.createHash('sha256').update(path).digest('hex').slice(0,32)}`;
          const norm=(v)=>{
            if (v === null || v === undefined) return v ?? null;
            if (typeof v?.toMillis === 'function') return {__timestampMs:v.toMillis()};
            if (typeof v?.path === 'string' && v.constructor?.name === 'DocumentReference') return {__ref:v.path};
            if (typeof v?.latitude === 'number' && typeof v?.longitude === 'number') return {__geo:[v.latitude,v.longitude]};
            if (Buffer.isBuffer(v) || v instanceof Uint8Array) return {__bytes:Buffer.from(v).toString('base64')};
            if (Array.isArray(v)) return v.map(norm);
            if (typeof v === 'object') { const out={}; for (const k of Object.keys(v).sort()) out[k]=norm(v[k]); return out; }
            return v;
          };
          const equal=(a,b)=>JSON.stringify(norm(a))===JSON.stringify(norm(b));
          const payloadMismatch=(src,dst)=>{
            if (!dst) return true;
            for (const [k,v] of Object.entries(src||{})) {
              if (reserved.has(k)) continue;
              if (!Object.prototype.hasOwnProperty.call(dst,k) || !equal(v,dst[k])) return true;
            }
            return false;
          };

          const [favSnap,recentSnap,v2Snap]=await Promise.all([
            db.collection('favorites').get(),
            db.collection('user_recent_songs').get(),
            db.collectionGroup('songs').get(),
          ]);
          const v2Docs=v2Snap.docs.filter(d=>/^users\/[^/]+\/songs\/[^/]+$/.test(d.ref.path));
          const stableMap=new Map(); const legacyMap=new Map(); const liveFavoriteKeys=new Set();
          let v2Stable=0,v2LegacyFavorite=0,v2LegacyRecent=0;
          for (const d of v2Docs) {
            const data=d.data()||{}; const uid=String(data.uid||d.ref.parent.parent?.id||'').trim();
            if (stable.test(d.id)) {v2Stable++; stableMap.set(`${uid}|${d.id}`,d);}
            const legacy=String(data.legacyFavoriteId||'').trim();
            if (legacy) {v2LegacyFavorite++; legacyMap.set(`${uid}|${legacy}`,d);}
            if (Object.prototype.hasOwnProperty.call(data,'legacyRecentIndex')) v2LegacyRecent++;
          }

          const stats={total:favSnap.size,stableSource:0,legacySource:0,aligned:0,missing:0,stateMismatch:0,payloadMismatch:0,formulaMismatch:0,missingUid:0,orphanLegacyV2:0};
          for (const sourceDoc of favSnap.docs) {
            const src=sourceDoc.data()||{}; const uid=String(src.uid||'').trim();
            if (!uid) {stats.missingUid++; continue;}
            liveFavoriteKeys.add(`${uid}|${sourceDoc.id}`);
            const sid=String(src.soridrawSongId||'').trim();
            const target=stable.test(sid)?stableMap.get(`${uid}|${sid}`):legacyMap.get(`${uid}|${sourceDoc.id}`);
            if (stable.test(sid)) stats.stableSource++; else stats.legacySource++;
            if (!target) {stats.missing++; continue;}
            if (!stable.test(sid) && target.id!==deterministicFavoriteSongId(sourceDoc.ref.path)) stats.formulaMismatch++;
            const p=payloadMismatch(src,target.data()); if (p) stats.payloadMismatch++;
            const s=target.data().musicNote !== activeFavorite(src); if (s) stats.stateMismatch++;
            if (!p && !s && (stable.test(sid) || target.id===deterministicFavoriteSongId(sourceDoc.ref.path))) stats.aligned++;
          }
          for (const d of v2Docs) {
            const data=d.data()||{}; const legacy=String(data.legacyFavoriteId||'').trim(); if (!legacy) continue;
            const uid=String(data.uid||d.ref.parent.parent?.id||'').trim();
            if (!liveFavoriteKeys.has(`${uid}|${legacy}`)) stats.orphanLegacyV2++;
          }

          let recentItems=0,recentStable=0;
          for (const d of recentSnap.docs) {
            const songs=Array.isArray(d.data()?.songs)?d.data().songs:[];
            recentItems += songs.length;
            for (const song of songs) if (stable.test(String(song?.soridrawSongId||'').trim())) recentStable++;
          }

          const result={stats,recent:{bundles:recentSnap.size,totalItems:recentItems,stableItems:recentStable,positionalLegacyExcluded:recentItems-recentStable},v2:{total:v2Docs.length,stable:v2Stable,legacyFavorite:v2LegacyFavorite,legacyRecent:v2LegacyRecent},writes:0,deletes:0,rulesDeploys:0,functionsDeploys:0,hostingDeploys:0};
          console.log('A4D_POSTVERIFY='+JSON.stringify(result));
          const pass=
            stats.total===Number(process.env.EXPECTED_FAVORITES) && stats.stableSource===Number(process.env.EXPECTED_STABLE_FAVORITES) && stats.legacySource===Number(process.env.EXPECTED_LEGACY_FAVORITES) && stats.aligned===Number(process.env.EXPECTED_FAVORITES) && stats.missing===0 && stats.stateMismatch===0 && stats.payloadMismatch===0 && stats.formulaMismatch===0 && stats.missingUid===0 && stats.orphanLegacyV2===0 &&
            recentSnap.size===Number(process.env.EXPECTED_RECENT_BUNDLES) && recentItems===Number(process.env.EXPECTED_RECENT_ITEMS) && recentStable===Number(process.env.EXPECTED_RECENT_STABLE_ITEMS) &&
            v2Docs.length===Number(process.env.EXPECTED_V2_AFTER) && v2Stable===Number(process.env.EXPECTED_V2_STABLE_AFTER) && v2LegacyFavorite===Number(process.env.EXPECTED_V2_LEGACY_FAVORITE_AFTER) && v2LegacyRecent===Number(process.env.EXPECTED_V2_LEGACY_RECENT_AFTER);
          if (!pass) throw new Error('A4D_INDEPENDENT_POSTVERIFY_FAILED');
          console.log('A4D_INDEPENDENT_POSTVERIFY=PASS');
          console.log('A4D_POSTVERIFY_FIRESTORE_WRITES=0');
          console.log('A4D_POSTVERIFY_FIRESTORE_DELETES=0');
          NODE

      - name: Prove read-only verifier scope
        run: |
          echo 'A4D_POSTVERIFY_MODE=READ_ONLY'
          echo 'A4D_POSTVERIFY_RULES_DEPLOYS=0'
          echo 'A4D_POSTVERIFY_FUNCTIONS_DEPLOYS=0'
          echo 'A4D_POSTVERIFY_HOSTING_DEPLOYS=0'
