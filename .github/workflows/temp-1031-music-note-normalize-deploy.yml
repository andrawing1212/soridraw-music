name: Temp 1031 Music Note Normalize + Deploy
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1031-music-note-normalize-deploy.yml']
permissions:
  contents: write
concurrency:
  group: soridraw-music-note-1031
  cancel-in-progress: false
jobs:
  normalize-deploy:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_BASE: c919ee80efad7f4f8aa9158c6addbabd679f9ed2
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30

      - name: Guard current preview source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          if ! git diff --quiet "$EXPECTED_BASE"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json scripts/verify-music-note-1031-normalization.mjs .deploy/apply-1031-music-note-clean-bootstrap-legacy-axis.py; then
            echo 'Application/source guard failed.'
            git diff --name-only "$EXPECTED_BASE"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json scripts/verify-music-note-1031-normalization.mjs .deploy/apply-1031-music-note-clean-bootstrap-legacy-axis.py
            exit 2
          fi
          echo '1031_BASE_GUARD=PASS'

      - name: Apply 1031 normalization
        run: python3 .deploy/apply-1031-music-note-clean-bootstrap-legacy-axis.py

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: 1031 normalization safety guard
        run: node scripts/verify-music-note-1031-normalization.mjs

      - name: Build
        run: npm run build

      - name: Commit and push validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add src/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix(music-note): restore clean bootstrap and legacy order axis'
            git push origin HEAD:preview
          fi
          echo "APP_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Firebase PREVIEW
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok=yes
                  echo "EXACT_BUILD_PASS=$url"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'PRODUCTION_UNCHANGED=PASS'

      - name: Cleanup temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin preview
          git rm .github/workflows/temp-1031-music-note-normalize-deploy.yml
          git commit -m 'chore(preview): remove temporary 1031 workflow'
          git push origin HEAD:preview
