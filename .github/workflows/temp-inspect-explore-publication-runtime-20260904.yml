name: SORIDRAW Validate Explore Republish Delta Sync 2026-09-04

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-explore-publication-runtime-20260904.yml']

permissions:
  contents: read

env:
  ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
  WORKER: soridraw-explore-preview
  EXPECTED_ACTIVE: 095c8346-ce6c-48d5-9817-4bcc62f48f5c

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 012 to active PREVIEW Worker locally only
        run: |
          set -euo pipefail
          rm -rf .remote-worker-012 && mkdir -p .remote-worker-012
          node <<'NODE'
          const fs=require('fs'); const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,'Content-Type':'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,700)}`);return x.result||x}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;const ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];if(!v?.version_id||Number(v.percentage||0)<99.99)throw new Error('active PREVIEW Worker is not 100%');if(v.version_id!==process.env.EXPECTED_ACTIVE)throw new Error(`active Worker changed: ${v.version_id}`);const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`);const mod=(ver.modules||[]).find(m=>(m.name||'')==='worker.js')||(ver.modules||[])[0];if(!mod)throw new Error('worker.js missing');fs.writeFileSync('.remote-worker-012/worker.js',Buffer.from(mod.content_base64,'base64'));console.log('ACTIVE_BASELINE='+v.version_id)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cp .remote-worker-012/worker.js .remote-worker-012/before.js
          node --check cloudflare/explore-worker/patches/012-explore-publication-incremental-feed-sync.mjs
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker-012" node cloudflare/explore-worker/patches/012-explore-publication-incremental-feed-sync.mjs
          node --check .remote-worker-012/worker.js
      - name: Validate mutation cost and republish timestamp semantics
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),before=fs.readFileSync('.remote-worker-012/before.js','utf8'),after=fs.readFileSync('.remote-worker-012/worker.js','utf8');
          function fn(src,name){const needles=[`async function ${name}(`,`function ${name}(`];let start=-1;for(const n of needles){start=src.indexOf(n);if(start>=0)break}if(start<0)throw new Error(name+' missing');const brace=src.indexOf('{',start);let d=0,q=null,e=false;for(let i=brace;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;if(c==='}'&&--d===0)return src.slice(start,i+1)}throw new Error(name+' unterminated')}
          const beforeCore=fn(before,'handlePublicationR2Core'),core=fn(after,'handlePublicationR2Core'),wrapper=fn(after,'handlePublication'),count=(t,n)=>t.split(n).length-1;
          if(wrapper.includes('safelyRefreshExploreFeedR2Bundles'))throw new Error('normal publish still performs full feed rebuild');
          if(!core.includes("COALESCE(tracks.is_public, 0) <> 1 OR COALESCE(tracks.status, '') <> 'published'"))throw new Error('republish timestamp reset missing');
          if(!core.includes('const publicationFeedItem = mapTrackRow(storedOptions);'))throw new Error('stored row feed reuse missing');
          if(!core.includes('LEFT JOIN public_profiles p ON p.uid = t.owner_uid AND p.is_public = 1'))throw new Error('owner join missing');
          if(!core.includes('LEFT JOIN track_stats s ON s.track_id = t.id'))throw new Error('stats join missing');
          if(count(core,'env.DB.prepare(')!==count(beforeCore,'env.DB.prepare('))throw new Error('012 added a normal-path D1 query');
          if(count(core,'env.DB.batch(')!==count(beforeCore,'env.DB.batch('))throw new Error('012 changed D1 batch count');
          console.log('PUBLICATION_NORMAL_PATH_FULL_FEED_D1_RESCAN=0'); console.log('PUBLICATION_ADDED_D1_POINT_QUERIES=0'); console.log('PUBLICATION_R2_DELTA_SYNC=PASS');
          NODE
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect(':memory:'); db.execute('create table tracks(id text primary key,is_public integer,status text,published_at integer)')
          sql="""insert into tracks(id,is_public,status,published_at) values(?,1,'published',?) on conflict(id) do update set is_public=1,status='published',published_at=case when coalesce(tracks.is_public,0) <> 1 or coalesce(tracks.status,'') <> 'published' then excluded.published_at when tracks.published_at is null or tracks.published_at=0 then excluded.published_at else tracks.published_at end"""
          old,republish,later=1787861423140,1788516000000,1788517000000
          db.execute("insert into tracks values('song',0,'private',?)",(old,)); db.execute(sql,('song',republish)); assert db.execute("select published_at from tracks").fetchone()[0]==republish
          db.execute(sql,('song',later)); assert db.execute("select published_at from tracks").fetchone()[0]==republish
          print('REPUBLISH_TIMESTAMP_RESET=PASS'); print('IDEMPOTENT_PUBLICATION_TIMESTAMP_STABLE=PASS')
          PY
      - name: Validate bounded R2 first-page delta
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),src=fs.readFileSync('.remote-worker-012/worker.js','utf8');
          function fn(name){const asyncNeedle=`async function ${name}(`,plainNeedle=`function ${name}(`;let start=src.indexOf(asyncNeedle);if(start<0)start=src.indexOf(plainNeedle);if(start<0)throw new Error(name+' missing');const brace=src.indexOf('{',start);let d=0,q=null,e=false;for(let i=brace;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;if(c==='}'&&--d===0)return src.slice(start,i+1)}throw new Error(name+' unterminated')}
          const code=['getExploreFeedItemLikeCount012','getExploreFeedItemId012','sortExploreFeedItems012','buildExploreFeedCursor012','syncExploreFeedR2Publication012'].map(fn).join('\n');
          const writes=[];let fallback=0;const latest={payload:{data:{items:[{id:'old',publishedAt:100,likeCount:1}],nextCursor:null}},updatedAt:0};const popular={payload:{data:{items:Array.from({length:40},(_,i)=>({id:'p'+i,publishedAt:1000-i,likeCount:10})),nextCursor:'keep'}},updatedAt:0};
          const read=async(_e,k)=>JSON.parse(JSON.stringify(k.includes('popular')?popular:latest)),write=async(_e,k,v)=>writes.push({key:k,value:JSON.parse(JSON.stringify(v))}),safe=async()=>{fallback++},key=s=>'feed:'+s,encode=v=>JSON.stringify(v);
          const run=new Function('readExploreR2Json','writeExploreR2Json','safelyRefreshExploreFeedR2Bundles','exploreFeedR2Key','encodeCursor','EXPLORE_R2_FEED_LIMIT',`${code}; return syncExploreFeedR2Publication012;`)(read,write,safe,key,encode,40);
          (async()=>{await run({}, {id:'new',publishedAt:2000,likeCount:0});if(fallback)throw new Error('unexpected fallback');const lw=writes.find(w=>w.key==='feed:latest');if(!lw||lw.value.payload.data.items[0].id!=='new')throw new Error('latest delta failed');if(writes.some(w=>w.key==='feed:popular'))throw new Error('popular top40 displaced by non-qualifying track');writes.length=0;await run({}, {id:'hot',publishedAt:3000,likeCount:20});const pw=writes.find(w=>w.key==='feed:popular');if(!pw||pw.value.payload.data.items[0].id!=='hot')throw new Error('popular qualifying delta failed');console.log('R2_LATEST_DELTA=PASS');console.log('R2_POPULAR_BOUNDED_TOP40=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo 'LOCAL_ONLY_VALIDATION=PASS'
