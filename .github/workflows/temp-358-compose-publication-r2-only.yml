name: TEMP 358 Compose Publication R2-only

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-358-compose-publication-r2-only.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compose dormant R2-only Worker source
        run: |
          set -euo pipefail
          python .deploy/apply_358_r2_only_publication_read.py
          node scripts/verify-358-publication-r2-only-cutover.mjs
          git diff --check
      - name: Commit generated canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare/explore-worker/canonical/preview-worker.js; then
            echo "Canonical Worker already composed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/explore-worker/canonical/preview-worker.js
          git commit -m "feat(preview): compose dormant publication R2-only Worker"
          git push origin HEAD:preview
