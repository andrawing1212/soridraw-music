name: SORIDRAW Deploy D1 Diagnostics 026 PREVIEW
on:
  push:
    branches:
      - preview
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_024_SHA: 81c016731e3621e387cbfc99c73f2b3a492e6ac1
      FEATURE_SHA: f24b50fe2272148b89eac201c34d19fbb17b0eb4
      MAIN_SHA: 49c799cbb46d137539f74a48c261f7256762336f
      RESTORED_024_VERSION: 2593eda0-d810-4938-ad38-90614123339f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PROD_WORKER: soridraw-explore-api
      PREVIEW_DB_NAME: soridraw-explore-preview-db
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2: soridraw-profile-media-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Guard exact diagnostic-only source scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FEATURE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          actual="$(git diff --name-only "$BASE_024_SHA" HEAD | grep -v '^.github/workflows/temp-deploy-d1-diagnostics-026.yml$' | sort)"
          expected=$'cloudflare/explore-worker/patches/026-d1-query-vs-row-diagnostics.mjs\nsrc/components/CacheDiagnosticsOverlay.tsx\nsrc/lib/cloudflareDiagnostics.ts'
          test "$actual" = "$expected"
          test ! -e cloudflare/explore-worker/patches/025-publication-update-returning-hotpath.mjs
          node --check cloudflare/explore-worker/patches/026-d1-query-vs-row-diagnostics.mjs
          echo 'SOURCE_SCOPE_026=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: TypeScript and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
          echo 'APP_VALIDATE=PASS'

      - name: Snapshot official production hosting
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Prepare diagnostic-only PREVIEW Worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy026 && mkdir .deploy026
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,P=process.env.PREVIEW_WORKER,PROD=process.env.PROD_WORKER;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x;}
          async function active(name){const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${name}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y?.percentage||0)-Number(x?.percentage||0))[0];if(!a?.version_id||Number(a?.percentage||0)<99.99)throw new Error('active version missing '+name);return {base,version:a.version_id};}
          function fn(s,name){let p=s.indexOf(`async function ${name}(`);if(p<0)p=s.indexOf(`function ${name}(`);if(p<0)throw new Error('missing '+name);const b=s.indexOf('{',p);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i],n=s[i+1];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){const z=s.indexOf('\n',i+2);i=z<0?s.length:z;continue}if(c==='/'&&n==='*'){const z=s.indexOf('*/',i+2);i=z<0?s.length:z+1;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(p,i+1)}throw new Error('unterminated '+name)}
          const hash=x=>crypto.createHash('sha256').update(x).digest('hex');
          (async()=>{
            const preview=await active(P),prod=await active(PROD);
            if(preview.version!==process.env.RESTORED_024_VERSION)throw new Error(`PREVIEW is not restored 024: ${preview.version}`);
            fs.writeFileSync('.deploy026/preview-before.txt',preview.version);fs.writeFileSync('.deploy026/prod-before.txt',prod.version);
            const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${P}/versions/${preview.version}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];
            if(!m?.content_base64)throw new Error('PREVIEW main module missing');
            const src=Buffer.from(m.content_base64,'base64').toString('utf8');
            for(const bad of ['finalizeMusicNotePublic025','handleVisibilityR2CoreLegacy025','X-SORIDRAW-D1-Read-Queries'])if(src.includes(bad))throw new Error('unexpected pre-026 token '+bad);
            fs.writeFileSync('.deploy026/original.js',src);fs.writeFileSync('.deploy026/worker.js',src);
            const funcs=['handleMusicNotePublicationSingleWrite016','handleVisibilityR2Core','handleMusicNotePrivate017'];
            fs.writeFileSync('.deploy026/publication-hashes-before.json',JSON.stringify(Object.fromEntries(funcs.map(n=>[n,hash(fn(src,n))])),null,2));
            const settings=await get(`${preview.base}/settings`);
            const config={name:P,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-09-04').slice(0,10),workers_dev:true,keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.PREVIEW_DB_NAME,database_id:process.env.PREVIEW_DB_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PREVIEW_R2}],observability:settings.observability&&typeof settings.observability==='object'?{enabled:settings.observability.enabled!==false}:{enabled:true}};
            if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)config.compatibility_flags=settings.compatibility_flags;
            fs.writeFileSync('.deploy026/wrangler.jsonc',JSON.stringify(config,null,2));
            console.log(`[snapshot] preview=${preview.version} production=${prod.version}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.deploy026" node patches/026-d1-query-vs-row-diagnostics.mjs
          node --check .deploy026/worker.js
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),s=fs.readFileSync('.deploy026/worker.js','utf8');
          function fn(name){let p=s.indexOf(`async function ${name}(`);if(p<0)p=s.indexOf(`function ${name}(`);if(p<0)throw new Error('missing '+name);const b=s.indexOf('{',p);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i],n=s[i+1];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){const z=s.indexOf('\n',i+2);i=z<0?s.length:z;continue}if(c==='/'&&n==='*'){const z=s.indexOf('*/',i+2);i=z<0?s.length:z+1;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(p,i+1)}throw new Error('unterminated '+name)}
          const hash=x=>crypto.createHash('sha256').update(x).digest('hex'),before=JSON.parse(fs.readFileSync('.deploy026/publication-hashes-before.json','utf8'));
          for(const [name,h] of Object.entries(before))if(hash(fn(name))!==h)throw new Error('publication behavior function changed: '+name);
          for(const token of ['X-SORIDRAW-D1-Read-Queries','X-SORIDRAW-D1-Write-Queries','d1ReadQueries','d1WriteQueries'])if(!s.includes(token))throw new Error('026 token missing '+token);
          console.log('PUBLICATION_FUNCTIONS_UNCHANGED=PASS');
          console.log('WORKER_DIAGNOSTICS_026=PASS');
          NODE

      - name: Deploy PREVIEW Worker diagnostics only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          rollback(){ status=$?; if [ "$status" -ne 0 ] && [ "$deployed" = 1 ]; then echo '[rollback] restoring exact 024 Worker'; npx wrangler versions deploy "$RESTORED_024_VERSION@100%" --name "$PREVIEW_WORKER" --yes || true; fi; exit "$status"; }
          trap rollback EXIT
          npx wrangler deploy --strict --config .deploy026/wrangler.jsonc
          deployed=1
          sleep 4
          node <<'NODE'
          const fs=require('fs'),A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER;async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`}}),x=await r.json();if(!r.ok||x.success===false)throw new Error('CF '+r.status);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0],v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${a.version_id}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0],s=Buffer.from(m.content_base64,'base64').toString('utf8');for(const token of ['X-SORIDRAW-D1-Read-Queries','X-SORIDRAW-D1-Write-Queries','classifyD1Query026'])if(!s.includes(token))throw new Error('deployed 026 missing '+token);for(const bad of ['finalizeMusicNotePublic025','handleVisibilityR2CoreLegacy025'])if(s.includes(bad))throw new Error('025 token returned');fs.writeFileSync('.deploy026/preview-after.txt',a.version_id);console.log('PREVIEW_WORKER_VERSION='+a.version_id);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl -fsS -D /tmp/026-headers.txt -o /tmp/026-feed.json -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/feed?sort=latest&limit=1"
          grep -iq '^x-soridraw-d1-read-queries:' /tmp/026-headers.txt
          grep -iq '^x-soridraw-d1-write-queries:' /tmp/026-headers.txt
          test "$(curl -sS -o /tmp/026-genres.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/genres")" = 200
          test "$(curl -sS -o /tmp/026-pub.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" -H 'content-type: application/json' -X POST --data '{}' "$PREVIEW_BASE/v1/publications")" = 401
          trap - EXIT
          echo 'PREVIEW_WORKER_026_DEPLOY=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate Google Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW client
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then ok=yes; echo "EXACT_BUILD_PASS=$url"; break; fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done
          echo 'FIREBASE_PREVIEW_026_DEPLOY=PASS'

      - name: Verify main and production unchanged
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          node <<'NODE'
          const fs=require('fs'),A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PROD_WORKER,before=fs.readFileSync('.deploy026/prod-before.txt','utf8').trim();async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`}}),x=await r.json();if(!r.ok||x.success===false)throw new Error('CF '+r.status);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];if(a?.version_id!==before)throw new Error('production Worker changed');console.log('PRODUCTION_WORKER_UNCHANGED=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo 'MAIN_PRODUCTION_UNCHANGED=PASS'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'

      - name: Package deployed source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zipname="SORIDRAW_PREVIEW_026_d1_query_vs_rows_$(git rev-parse --short=8 HEAD).zip"
          git archive --format=zip --output="$zipname" HEAD -- . ':(exclude).github/workflows/temp-deploy-d1-diagnostics-026.yml'
          test -s "$zipname"
          echo "ZIP_NAME=$zipname" >> "$GITHUB_ENV"
          sha256sum "$zipname"

      - uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_026_d1_query_vs_rows
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
