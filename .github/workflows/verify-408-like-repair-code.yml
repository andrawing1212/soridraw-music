          node scripts/verify-416-like-batch-master.mjs
      - name: Firebase Functions TypeScript build for isolated Stage420 server source
        run: |
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
      - name: Verify large Music Note shared-folder first-match semantics and cost
        run: node scripts/verify-music-note-shared-dedup-linear.mjs
      - name: Verify app428 publication consistency contracts
        run: node scripts/verify-428-publication-consistency.mjs
      - name: Verify app429 independent-audit corrections
        run: |
          node --check cloudflare/explore-worker/patches/100-music-note-next-song-legacy-parity.mjs
          node --check cloudflare/explore-worker/patches/101-publication-live-convergence.mjs
          node scripts/verify-429-integrated-audit-fixes.mjs
          node scripts/verify-430-publication-signal-audit-fixes.mjs
          node scripts/verify-431-server-publication-signal.mjs
          node scripts/verify-432-publication-live-delta.mjs
          node scripts/verify-433-publication-audit-fixes.mjs
          node scripts/verify-434-publication-signal-version-order.mjs
