name: TEMP 127 Bounded Like R2 Repair

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-127-bounded-like-r2-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build isolated repair Worker and static safety check
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          TEMP_WORKER="soridraw-temp-like-repair-127-${GITHUB_RUN_ID}"
          echo "TEMP_WORKER=$TEMP_WORKER" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/repair-worker.mjs" <<'EOF'
          const IDS = [
            'music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_6ca2115f1b474aa7a60f1a2bdabd6317_k4e95q',
            'music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_mdCqNWohZwk6lsKuNWOa',
            'music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_b1ef5cf6fcb04371b33ea71d1950f244_5jt44',
            'music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_6eb4944de4264b12a85f0d17180cd143_1en45bp',
          ];

          const FEED_KEYS = {
            latest: 'internal/explore/shared-feed-v112/latest-40.json',
            popular: 'internal/explore/shared-feed-v112/popular-40.json',
          };
          const cardKey = (id) => 'internal/explore/shared-track-card-v115/' + encodeURIComponent(id) + '.json';
          const itemId = (item) => String(item?.id || item?.trackId || '').trim();
          const likeCount = (item) => Math.max(0, Number(item?.likeCount ?? item?.like_count ?? item?.stats?.likeCount ?? item?.stats?.like_count ?? 0));
          const patchLike = (item, count) => ({
            ...item,
            likeCount: count,
            ...(item?.stats && typeof item.stats === 'object'
              ? { stats: { ...item.stats, likeCount: count } }
              : {}),
          });

          async function readCanonical(env) {
            const placeholders = IDS.map(() => '?').join(',');
            const sql = `
              SELECT t.id,t.title,
                COALESCE(dt.likes,0) AS derived_like_count,
                COALESCE(ts.like_count,0) AS stat_like_count,
                (SELECT COUNT(*) FROM likes l WHERE l.track_id=t.id) AS relation_count
              FROM tracks t
              LEFT JOIN explore_derived_tracks dt ON dt.id=t.id
              LEFT JOIN track_stats ts ON ts.track_id=t.id
              WHERE t.id IN (${placeholders})
              ORDER BY t.id
            `;
            const result = await env.DB.prepare(sql).bind(...IDS).all();
            const rows = Array.isArray(result?.results) ? result.results : [];
            if (rows.length !== 4) throw new Error('canonical row count=' + rows.length);
            for (const row of rows) {
              const relation = Number(row?.relation_count || 0);
              const stat = Number(row?.stat_like_count || 0);
              const derived = Number(row?.derived_like_count || 0);
              if (relation !== 1 || stat !== 1 || derived !== 1) {
                throw new Error('canonical mismatch ' + row.id + ' rel=' + relation + ' stat=' + stat + ' derived=' + derived);
              }
            }
            return rows;
          }

          async function readObject(env, key) {
            const object = await env.PROFILE_MEDIA.get(key);
            if (!object) throw new Error('missing R2 object ' + key);
            const text = await object.text();
            return {
              key,
              text,
              httpMetadata: object.httpMetadata || {},
              customMetadata: object.customMetadata || {},
            };
          }

          async function writeObject(env, original, text, tag) {
            await env.PROFILE_MEDIA.put(original.key, text, {
              httpMetadata: original.httpMetadata,
              customMetadata: {
                ...original.customMetadata,
                boundedLikeRepair: '127',
                boundedLikeRepairTag: tag,
                boundedLikeRepairAt: String(Date.now()),
              },
            });
          }

          async function restoreObject(env, original) {
            await env.PROFILE_MEDIA.put(original.key, original.text, {
              httpMetadata: original.httpMetadata,
              customMetadata: original.customMetadata,
            });
          }

          function patchFeedSnapshot(original, sort) {
            const bundle = JSON.parse(original.text);
            const items = bundle?.payload?.data?.items;
            if (!Array.isArray(items)) throw new Error(sort + ' feed items missing');
            let seen = 0;
            let changed = 0;
            const nextItems = items.map((item) => {
              const id = itemId(item);
              if (!IDS.includes(id)) return item;
              seen += 1;
              if (likeCount(item) === 1) return item;
              changed += 1;
              return patchLike(item, 1);
            });
            if (seen !== 4) throw new Error(sort + ' expected 4 tracks, saw ' + seen);
            if (!changed) return { changed: 0, text: original.text };
            const next = {
              ...bundle,
              updatedAt: Date.now(),
              payload: {
                ...bundle.payload,
                data: { ...bundle.payload.data, items: nextItems },
              },
            };
            return { changed, text: JSON.stringify(next) };
          }

          function patchTrackCard(original, id) {
            const bundle = JSON.parse(original.text);
            const card = bundle?.card;
            if (!card || itemId(card) !== id) throw new Error('track card mismatch ' + id);
            if (likeCount(card) === 1) return { changed: 0, text: original.text };
            const next = {
              ...bundle,
              updatedAt: Date.now(),
              card: patchLike(card, 1),
            };
            return { changed: 1, text: JSON.stringify(next) };
          }

          async function verifyR2(env) {
            for (const [sort, key] of Object.entries(FEED_KEYS)) {
              const current = await readObject(env, key);
              const bundle = JSON.parse(current.text);
              const items = bundle?.payload?.data?.items || [];
              const counts = new Map(items.map((item) => [itemId(item), likeCount(item)]));
              for (const id of IDS) {
                if (counts.get(id) !== 1) throw new Error('verify ' + sort + ' ' + id + '=' + counts.get(id));
              }
            }
            for (const id of IDS) {
              const current = await readObject(env, cardKey(id));
              const bundle = JSON.parse(current.text);
              if (likeCount(bundle?.card) !== 1) throw new Error('verify card ' + id);
            }
          }

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (request.method !== 'POST' || url.pathname !== '/repair') return new Response('Not found', { status: 404 });
              const REPAIR_TOKEN = '__TEMP127_TOKEN__';
              if (request.headers.get('x-repair-token') !== REPAIR_TOKEN) {
                return new Response('Forbidden', { status: 403 });
              }

              const originals = new Map();
              const written = [];
              try {
                const canonicalBefore = await readCanonical(env);

                for (const key of Object.values(FEED_KEYS)) originals.set(key, await readObject(env, key));
                for (const id of IDS) {
                  const key = cardKey(id);
                  originals.set(key, await readObject(env, key));
                }

                const latestPatch = patchFeedSnapshot(originals.get(FEED_KEYS.latest), 'latest');
                const popularPatch = patchFeedSnapshot(originals.get(FEED_KEYS.popular), 'popular');
                const cardPatches = IDS.map((id) => ({ id, key: cardKey(id), ...patchTrackCard(originals.get(cardKey(id)), id) }));

                if (latestPatch.changed) {
                  await writeObject(env, originals.get(FEED_KEYS.latest), latestPatch.text, 'latest');
                  written.push(FEED_KEYS.latest);
                }
                if (popularPatch.changed) {
                  await writeObject(env, originals.get(FEED_KEYS.popular), popularPatch.text, 'popular');
                  written.push(FEED_KEYS.popular);
                }
                for (const row of cardPatches) {
                  if (!row.changed) continue;
                  await writeObject(env, originals.get(row.key), row.text, 'card');
                  written.push(row.key);
                }

                await verifyR2(env);
                const canonicalAfter = await readCanonical(env);

                return Response.json({
                  ok: true,
                  canonicalBefore: canonicalBefore.map((r) => ({
                    id: r.id,
                    relation: Number(r.relation_count),
                    stat: Number(r.stat_like_count),
                    derived: Number(r.derived_like_count),
                  })),
                  canonicalAfter: canonicalAfter.map((r) => ({
                    id: r.id,
                    relation: Number(r.relation_count),
                    stat: Number(r.stat_like_count),
                    derived: Number(r.derived_like_count),
                  })),
                  repair: {
                    latestChangedTracks: latestPatch.changed,
                    popularChangedTracks: popularPatch.changed,
                    changedCards: cardPatches.filter((x) => x.changed).length,
                    r2ObjectWrites: written.length,
                    writtenKeys: written,
                  },
                });
              } catch (error) {
                const rollback = [];
                for (const key of [...written].reverse()) {
                  try {
                    await restoreObject(env, originals.get(key));
                    rollback.push(key);
                  } catch {}
                }
                return Response.json({
                  ok: false,
                  error: String(error?.message || error || 'unknown'),
                  writtenBeforeFailure: written,
                  rollback,
                }, { status: 500 });
              }
            },
          };
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/repair-worker.mjs"

          node - "$RUNNER_TEMP/repair-worker.mjs" <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync(process.argv[2],'utf8');
          for(const forbidden of [/INSERT\s+INTO/i,/UPDATE\s+[a-z_]/i,/DELETE\s+FROM/i,/CREATE\s+(TABLE|INDEX|TRIGGER)/i,/DROP\s+(TABLE|INDEX|TRIGGER)/i,/ALTER\s+TABLE/i,/env\.DB\.batch/]) {
            if(forbidden.test(s)) throw new Error('Forbidden canonical D1 mutation token: '+forbidden);
          }
          if(!s.includes('env.DB.prepare(sql).bind(...IDS).all()')) throw new Error('read-only canonical D1 query missing');
          if(!s.includes('env.PROFILE_MEDIA.put')) throw new Error('bounded R2 repair write missing');
          if(!s.includes('restoreObject')) throw new Error('rollback path missing');
          console.log('TEMP127_STATIC_SAFETY=PASS');
          NODE

          cat > "$RUNNER_TEMP/wrangler.temp127.jsonc" <<EOF
          {
            "name": "$TEMP_WORKER",
            "main": "$RUNNER_TEMP/repair-worker.mjs",
            "compatibility_date": "2026-08-28",
            "workers_dev": true,
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "soridraw-explore-db",
                "database_id": "217ef5b1-5d80-4f7c-afc7-9e07eb05c06b"
              }
            ],
            "r2_buckets": [
              {
                "binding": "PROFILE_MEDIA",
                "bucket_name": "soridraw-profile-media"
              }
            ]
          }
          EOF
          echo 'TEMP127_BUILD=PASS'

      - name: Snapshot protected Worker versions
        shell: bash
        run: |
          set -euo pipefail
          active_version() {
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json'               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$1/deployments"               | jq -er '.result.deployments[0].versions | max_by(.percentage) | select(.percentage >= 99.99) | .version_id'
          }
          printf '%s' "$(active_version "$PREVIEW_WORKER")" > "$RUNNER_TEMP/preview.before"
          printf '%s' "$(active_version "$TEST_WORKER")" > "$RUNNER_TEMP/test.before"
          printf '%s' "$(active_version "$PRODUCTION_WORKER")" > "$RUNNER_TEMP/production.before"
          echo "PREVIEW_PROTECTED_BEFORE=$(cat "$RUNNER_TEMP/preview.before")"
          echo "TEST_PROTECTED_BEFORE=$(cat "$RUNNER_TEMP/test.before")"
          echo "PRODUCTION_PROTECTED_BEFORE=$(cat "$RUNNER_TEMP/production.before")"

      - name: Deploy isolated repair Worker, repair, verify, and delete
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$RUNNER_TEMP/wrangler.temp127.jsonc"
          TOKEN="$(openssl rand -hex 32)"

          cleanup() {
            curl -fsS -X DELETE               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${TEMP_WORKER}"               >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          TOKEN="$TOKEN" node - "$RUNNER_TEMP/repair-worker.mjs" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const token=process.env.TOKEN;
          let s=fs.readFileSync(file,'utf8');
          if(!s.includes('__TEMP127_TOKEN__')) throw new Error('repair token placeholder missing');
          s=s.replace('__TEMP127_TOKEN__', token);
          fs.writeFileSync(file,s);
          NODE
          node "$WRANGLER" deploy --config "$CFG"

          url="https://${TEMP_WORKER}.andrawing1212.workers.dev/repair"
          code="$(curl --retry 4 --retry-delay 1 -sS -o "$RUNNER_TEMP/repair-result.json" -w '%{http_code}'             -X POST -H "x-repair-token: $TOKEN" "$url")"
          cat "$RUNNER_TEMP/repair-result.json"
          test "$code" = 200

          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/repair-result.json','utf8'));
          if(x?.ok!==true) throw new Error('repair not ok: '+JSON.stringify(x));
          if(!Array.isArray(x.canonicalBefore)||x.canonicalBefore.length!==4) throw new Error('canonicalBefore invalid');
          if(!Array.isArray(x.canonicalAfter)||x.canonicalAfter.length!==4) throw new Error('canonicalAfter invalid');
          for(const r of [...x.canonicalBefore,...x.canonicalAfter]){
            if(Number(r.relation)!==1||Number(r.stat)!==1||Number(r.derived)!==1) throw new Error('canonical count changed '+r.id);
          }
          const writes=Number(x?.repair?.r2ObjectWrites||0);
          if(writes<0||writes>6) throw new Error('repair write bound exceeded '+writes);
          if(Number(x?.repair?.latestChangedTracks||0)<0||Number(x?.repair?.latestChangedTracks||0)>4) throw new Error('latest change bound invalid');
          if(Number(x?.repair?.popularChangedTracks||0)<0||Number(x?.repair?.popularChangedTracks||0)>4) throw new Error('popular change bound invalid');
          if(Number(x?.repair?.changedCards||0)<0||Number(x?.repair?.changedCards||0)>4) throw new Error('card change bound invalid');
          console.log('TEMP127_REPAIR_RESULT=PASS');
          console.log('TEMP127_R2_OBJECT_WRITES='+writes);
          console.log('TEMP127_LATEST_CHANGED_TRACKS='+Number(x.repair.latestChangedTracks||0));
          console.log('TEMP127_POPULAR_CHANGED_TRACKS='+Number(x.repair.popularChangedTracks||0));
          console.log('TEMP127_CHANGED_CARDS='+Number(x.repair.changedCards||0));
          NODE

          # Direct live R2-only endpoints must now agree, with D1 R0/W0.
          cat > "$RUNNER_TEMP/ids.txt" <<'EOF'
          music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_6ca2115f1b474aa7a60f1a2bdabd6317_k4e95q
          music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_mdCqNWohZwk6lsKuNWOa
          music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_b1ef5cf6fcb04371b33ea71d1950f244_5jt44
          music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_6eb4944de4264b12a85f0d17180cd143_1en45bp
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/ids.txt"

          for sort in latest popular; do
            curl -fsS -D "$RUNNER_TEMP/${sort}.head" -o "$RUNNER_TEMP/${sort}.json"               -H "Origin: $PREVIEW_ORIGIN"               "$PREVIEW_BASE/v1/feed?sort=${sort}&limit=40&__soridraw_r2_only=108"
            node - "$sort" "$RUNNER_TEMP/${sort}.json" "$RUNNER_TEMP/ids.txt" <<'NODE'
          const fs=require('fs');
          const sort=process.argv[2], data=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const ids=fs.readFileSync(process.argv[4],'utf8').trim().split(/\r?\n/);
          const items=data?.data?.items||[];
          const counts=new Map(items.map(v=>[String(v?.id||v?.trackId||''),Number(v?.likeCount??v?.like_count??v?.stats?.likeCount??0)]));
          for(const id of ids) if(counts.get(id)!==1) throw new Error('live '+sort+' mismatch '+id+'='+counts.get(id));
          console.log('LIVE_'+sort.toUpperCase()+'_FOUR_COUNTS=ALL_1');
          NODE
            reads="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r","");print $2}' "$RUNNER_TEMP/${sort}.head" | tail -1)"
            writes="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r","");print $2}' "$RUNNER_TEMP/${sort}.head" | tail -1)"
            test "$reads" = 0
            test "$writes" = 0
            echo "LIVE_${sort^^}_D1=R0_W0"
          done

          active_version() {
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json'               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$1/deployments"               | jq -er '.result.deployments[0].versions | max_by(.percentage) | select(.percentage >= 99.99) | .version_id'
          }
          test "$(active_version "$PREVIEW_WORKER")" = "$(cat "$RUNNER_TEMP/preview.before")"
          test "$(active_version "$TEST_WORKER")" = "$(cat "$RUNNER_TEMP/test.before")"
          test "$(active_version "$PRODUCTION_WORKER")" = "$(cat "$RUNNER_TEMP/production.before")"
          echo 'PROTECTED_WORKERS_UNCHANGED_BY_REPAIR=PASS'
          echo 'CANONICAL_D1_WRITE=0'
          echo 'D1_SCHEMA_CHANGE=false'
          echo 'USER_ORIGIN_DATA_CHANGE=false'
          echo 'FULL_FEED_REBUILD=false'
          echo 'FIREBASE_CHANGE=false'

          cleanup
          trap - EXIT
          echo 'TEMP127_WORKER_DELETED=PASS'
