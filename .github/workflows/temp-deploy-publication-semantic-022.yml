name: SORIDRAW Deploy Publication Semantic Republish 022 PREVIEW

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FEATURE_SHA: f83e4241d17a73c95b9db2262d8e9176f15a0564
      MAIN_SHA: 49c799cbb46d137539f74a48c261f7256762336f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PROD_WORKER: soridraw-explore-api
      PREVIEW_DB_NAME: soridraw-explore-preview-db
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2: soridraw-profile-media-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Guard feature and main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FEATURE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          grep -Fq 'SORIDRAW_PUBLICATION_SEMANTIC_REPUBLISH_022_20260907' cloudflare/explore-worker/patches/022-publication-semantic-republish.mjs
          test "$(git diff --name-only 39f2d75420b20a303706b4210236f5d75c1f220c HEAD | grep -vE '^\.github/workflows/temp-(audit-publication-022|deploy-publication-semantic-022)\.yml$')" = 'cloudflare/explore-worker/patches/022-publication-semantic-republish.mjs'
          echo 'SOURCE_GUARD=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate app and patch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
          node --check cloudflare/explore-worker/patches/022-publication-semantic-republish.mjs
          echo 'APP_VALIDATE=PASS'

      - name: Install pinned Wrangler
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Fetch active PREVIEW Worker and snapshot production
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .remote-worker && mkdir .remote-worker
          node <<'NODE'
          const fs=require('fs');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,P=process.env.PREVIEW_WORKER,PROD=process.env.PROD_WORKER;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x;}
          async function active(name){const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${name}`;const ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y?.percentage||0)-Number(x?.percentage||0))[0];if(!a?.version_id||Number(a?.percentage||0)<99.99)throw new Error(`single active version missing for ${name}`);return {base,version:a.version_id};}
          (async()=>{const preview=await active(P),prod=await active(PROD);fs.writeFileSync('.remote-worker/preview-before.txt',preview.version);fs.writeFileSync('.remote-worker/prod-before.txt',prod.version);const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${P}/versions/${preview.version}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];if(!m?.content_base64)throw new Error('PREVIEW main module missing');const src=Buffer.from(m.content_base64,'base64').toString('utf8');for(const token of ['handleMusicNotePublicationSingleWrite016','publicationCanonicalUnchanged016','applyPublicationVisibilityTransition021','visibilityTransitionOnly021'])if(!src.includes(token))throw new Error(`PREVIEW prerequisite missing ${token}`);if(src.includes('publicationRepublishSemanticUnchanged022'))throw new Error('022 unexpectedly active before deployment');fs.writeFileSync('.remote-worker/original.js',src);fs.writeFileSync('.remote-worker/worker.js',src);const settings=await get(`${preview.base}/settings`);const config={name:P,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-09-04').slice(0,10),workers_dev:true,keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.PREVIEW_DB_NAME,database_id:process.env.PREVIEW_DB_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PREVIEW_R2}],observability:settings.observability&&typeof settings.observability==='object'?{enabled:settings.observability.enabled!==false}:{enabled:true}};if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)config.compatibility_flags=settings.compatibility_flags;fs.writeFileSync('.remote-worker/wrangler.jsonc',JSON.stringify(config,null,2));console.log(`[before] preview=${preview.version} production=${prod.version}`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Apply and validate semantic republish 022
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/022-publication-semantic-republish.mjs
          node --check .remote-worker/worker.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('.remote-worker/worker.js','utf8');
          function fn(name){let p=s.indexOf(`async function ${name}(`);if(p<0)p=s.indexOf(`function ${name}(`);if(p<0)throw new Error('missing '+name);const b=s.indexOf('{',p);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i],n=s[i+1];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){const z=s.indexOf('\n',i+2);i=z<0?s.length:z;continue}if(c==='/'&&n==='*'){const z=s.indexOf('*/',i+2);i=z<0?s.length:z+1;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(p,i+1)}throw new Error('unterminated '+name)}
          const hot=fn('handleMusicNotePublicationSingleWrite016'),names=['publicationStableJsonValue022','publicationJsonEquivalent022','publicationSearchSignature022','publicationRepublishSemanticUnchanged022'];
          if(!hot.includes('visibilityTransitionOnly022')||hot.includes('visibilityTransitionOnly021'))throw new Error('022 routing invariant failed');
          if((hot.match(/INSERT INTO tracks/g)||[]).length!==1)throw new Error('full UPSERT count changed');
          const ctx={};vm.createContext(ctx);vm.runInContext(names.map(fn).join('\n\n'),ctx);
          const row={id:'t',source_type:'music_note',source_id:'n',source_parent_id:null,legacy_global_id:null,source_subtrack_key:'',source_subtrack_index:null,source_subtrack_id:null,title:'Same title',description:'Same description',cover_url:'cover',duration_seconds:123,lyrics:'same lyrics',style:'same style',prompt:'same prompt',suno_url_primary:'u1',suno_url_secondary:'u2',search_text:'Same title Same description same style Breakbeat Bass Dark',allow_next_song_apply:1,allow_follower_save:1,profile_pinned:0,share_schema_version:1,share_payload_json:'{"selectedKeywords":{"genres":["Breakbeat"]},"nextSong":{"tempoConfig":{"b":2,"a":1}}}',primary_genre:'Breakbeat'};
          const src={sourceType:'music_note',sourceId:'n',sourceParentId:null,legacyGlobalId:null,sourceSubTrackKey:'',sourceSubTrackIndex:null,sourceSubTrackId:null,title:'Same title',description:'Same description',coverUrl:'cover',durationSeconds:123,lyrics:'same lyrics',style:'same style',prompt:'same prompt',sunoUrlPrimary:'u1',sunoUrlSecondary:'u2',searchText:'Same title Same description same style Dark Bass Breakbeat',shareSchemaVersion:1,sharePayloadJson:'{"nextSong":{"tempoConfig":{"a":1,"b":2}},"selectedKeywords":{"genres":["Breakbeat"]}}'};
          const opt={allowNextSongApply:1,allowFollowerSave:1,profilePinned:0};
          if(!ctx.publicationRepublishSemanticUnchanged022(row,src,opt,'Breakbeat'))throw new Error('representation-only equality failed');
          if(ctx.publicationRepublishSemanticUnchanged022(row,{...src,title:'Changed title'},opt,'Breakbeat'))throw new Error('title change was ignored');
          if(ctx.publicationRepublishSemanticUnchanged022(row,{...src,lyrics:'changed lyrics'},opt,'Breakbeat'))throw new Error('lyrics change was ignored');
          if(ctx.publicationRepublishSemanticUnchanged022(row,{...src,sharePayloadJson:'{"nextSong":{"tempoConfig":{"a":9,"b":2}},"selectedKeywords":{"genres":["Breakbeat"]}}'},opt,'Breakbeat'))throw new Error('share payload change was ignored');
          console.log('SEMANTIC_REPUBLISH_VALIDATE=PASS');
          NODE

      - name: Deploy PREVIEW Worker with rollback guard
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          rollback(){ status=$?; if [ "$status" -ne 0 ] && [ "$deployed" = 1 ]; then echo '[rollback] restoring previous PREVIEW Worker'; cp .remote-worker/original.js .remote-worker/worker.js; npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc || true; fi; exit "$status"; }
          trap rollback EXIT
          npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc
          deployed=1
          sleep 4
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER,fs=require('fs');async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}`);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0],before=fs.readFileSync('.remote-worker/preview-before.txt','utf8').trim();if(!a?.version_id||a.version_id===before)throw new Error('PREVIEW version unchanged');const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${a.version_id}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0],s=Buffer.from(m.content_base64,'base64').toString('utf8');for(const token of ['publicationRepublishSemanticUnchanged022','visibilityTransitionOnly022','publicationJsonEquivalent022','publicationSearchSignature022','applyPublicationVisibilityTransition021'])if(!s.includes(token))throw new Error('deployed runtime missing '+token);console.log('[after] preview='+a.version_id)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test "$(curl -sS -o /tmp/feed.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/feed?sort=latest&limit=1")" = '200'
          test "$(curl -sS -o /tmp/genres.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/genres")" = '200'
          test "$(curl -sS -o /tmp/pub401.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" -H 'Content-Type: application/json' -X POST --data '{}' "$PREVIEW_BASE/v1/publications")" = '401'
          test "$(curl -sS -o /tmp/site.html -w '%{http_code}' "$PREVIEW_ORIGIN")" = '200'
          trap - EXIT
          echo 'PREVIEW_WORKER_DEPLOY=PASS'
          echo 'FIREBASE_HOSTING_CHANGED=false'
          echo 'FUNCTIONS_CHANGED=false'

      - name: Verify main and production unchanged
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          node <<'NODE'
          const fs=require('fs'),A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PROD_WORKER;async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}`);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0],before=fs.readFileSync('.remote-worker/prod-before.txt','utf8').trim();if(a?.version_id!==before)throw new Error(`production changed ${before} -> ${a?.version_id}`);console.log('MAIN_PRODUCTION_UNCHANGED=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Package clean source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zipname="SORIDRAW_PREVIEW_f83e4241_publication_semantic_republish_022.zip"
          git archive --format=zip --output="$zipname" HEAD -- . ':(exclude).github/workflows/temp-audit-publication-022.yml' ':(exclude).github/workflows/temp-deploy-publication-semantic-022.yml'
          test -s "$zipname"
          echo "ZIP_NAME=$zipname" >> "$GITHUB_ENV"
          sha256sum "$zipname"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_publication_semantic_republish_022
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
