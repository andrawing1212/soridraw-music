name: Temp 1047 Catalog Authority Fix Deploy

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1047-catalog-authority-fix-deploy.yml']

permissions:
  contents: write

jobs:
  fix-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_RUNTIME_COMMIT: 774e4e3e06716b01549ee4681c2b01372ec41182
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30

      - name: Guard runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_RUNTIME_COMMIT" HEAD
          git diff --exit-code "$EXPECTED_RUNTIME_COMMIT"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json functions cloudflare firestore.rules

      - name: Apply Catalog authority fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/userDataEngine.ts')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              if old not in s: raise SystemExit(f'{label}: anchor missing')
              s=s.replace(old,new,1)

          once(
            "export const SORIDRAW_USER_DATA_ENGINE_LOCAL_CACHE_V5_20260906 = true;",
            "export const SORIDRAW_USER_DATA_ENGINE_LOCAL_CACHE_V5_20260906 = true;\nexport const SORIDRAW_USER_DATA_ENGINE_REMOTE_AUTHORITY_1047 = true;",
            'marker')
          once(
            "const catalogReadInFlight = new Map<string, Promise<SoridrawCatalogSnapshot | null>>();\nconst catalogPublishTimers",
            "const catalogReadInFlight = new Map<string, Promise<SoridrawCatalogSnapshot | null>>();\n// Local IndexedDB is instant paint only until this browser session has actually\n// received a server-authoritative Catalog response for the UID/kind.\nconst catalogRemoteValidatedSessionKeys = new Set<string>();\nconst catalogPublishTimers",
            'session validation set')

          old_remote = """      const headers = await authenticatedHeaders(false);\n      if (!headers) throw new Error('CATALOG_AUTH_NOT_READY');\n      const knownRemoteRevision = Math.max(readKnownRemoteCatalogRevision(kind, uid), Math.floor(minimumRevision || 0));\n      if (knownRemoteRevision > 0) headers['X-Soridraw-Known-Revision'] = String(knownRemoteRevision);\n      const response = await fetch(`${CATALOG_ENDPOINT}/v1/catalog/${kind}`, {\n        method: 'GET',\n        headers,\n        cache: 'no-store',\n      });\n      if (response.status === 404) throw new Error('CATALOG_NOT_MATERIALIZED');\n      if (!response.ok) throw new Error(`CATALOG_READ_${response.status}`);\n      const payload = await response.json();\n      if (!isValidSnapshot(kind, payload)) throw new Error('CATALOG_PAYLOAD_INVALID');\n      if (knownRemoteRevision > 0 && payload.revision < knownRemoteRevision) {\n        throw new Error('CATALOG_REVISION_STALE');\n      }\n      await writeCatalogSnapshotToLocalCache(kind, uid, payload);\n      return payload;"""
          new_remote = """      const headers = await authenticatedHeaders(false);\n      if (!headers) throw new Error('CATALOG_AUTH_NOT_READY');\n      // A normal Catalog read asks for the already-materialized full R2 snapshot.\n      // Profile sync signals are cache-invalidation hints, not permission to force\n      // an expensive Firestore full rebuild on every browser entry. Only explicit\n      // maintenance/mutation callers may pass a hard minimumRevision.\n      const hardMinimumRevision = Math.max(0, Math.floor(minimumRevision || 0));\n      if (hardMinimumRevision > 0) headers['X-Soridraw-Known-Revision'] = String(hardMinimumRevision);\n      const response = await fetch(`${CATALOG_ENDPOINT}/v1/catalog/${kind}`, {\n        method: 'GET',\n        headers,\n        cache: 'no-store',\n      });\n      if (response.status === 404) throw new Error('CATALOG_NOT_MATERIALIZED');\n      if (!response.ok) {\n        let detail = '';\n        try { detail = String(await response.text()).slice(0, 180); } catch {}\n        throw new Error(`CATALOG_READ_${response.status}${detail ? `:${detail}` : ''}`);\n      }\n      const payload = await response.json();\n      if (!isValidSnapshot(kind, payload)) throw new Error('CATALOG_PAYLOAD_INVALID');\n      if (hardMinimumRevision > 0 && payload.revision < hardMinimumRevision) {\n        throw new Error('CATALOG_REVISION_STALE');\n      }\n      await writeCatalogSnapshotToLocalCache(kind, uid, payload);\n      catalogRemoteValidatedSessionKeys.add(catalogKey(kind, uid));\n      return payload;"""
          once(old_remote,new_remote,'remote read contract')

          old_cache = """  const promise = (async () => {\n    const local = await readCatalogSnapshotFromLocalCache(kind, uid);\n    const knownRemoteRevision = readKnownRemoteCatalogRevision(kind, uid);\n    if (local && (knownRemoteRevision <= 0 || local.revision >= knownRemoteRevision)) return local;\n    const remote = await readRemoteCatalogSnapshot(kind, uid, knownRemoteRevision);\n    if (remote) return remote;\n    if (local && knownRemoteRevision > local.revision) return null;\n    return local;\n  })().finally(() => catalogReadInFlight.delete(key));"""
          new_cache = """  const promise = (async () => {\n    const local = await readCatalogSnapshotFromLocalCache(kind, uid);\n    const knownRemoteRevision = readKnownRemoteCatalogRevision(kind, uid);\n    const sessionValidated = catalogRemoteValidatedSessionKeys.has(key);\n\n    // Local cache may paint instantly, but it is never promoted to full-list\n    // authority before one successful server Catalog response in this session.\n    // This prevents an old 37-row cache from permanently masking a 500+ row R2 Catalog.\n    if (local && sessionValidated && (knownRemoteRevision <= 0 || local.revision >= knownRemoteRevision)) {\n      return local;\n    }\n\n    // Normal entry always validates against the already-materialized R2 object.\n    // Do not pass the profile sync signal as a hard Worker rebuild requirement.\n    const remote = await readRemoteCatalogSnapshot(kind, uid, 0);\n    if (remote) return remote;\n\n    // A server-unvalidated local snapshot must not masquerade as complete Catalog.\n    // The caller can keep its legacy localStorage list as provisional paint/error fallback.\n    if (!sessionValidated) return null;\n    if (local && knownRemoteRevision > local.revision) return null;\n    return local;\n  })().finally(() => catalogReadInFlight.delete(key));"""
          once(old_cache,new_cache,'cache first authority')
          p.write_text(s,encoding='utf-8')
          print('SORIDRAW_1047_CATALOG_AUTHORITY_FIX=APPLIED')
          PY

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SORIDRAW_USER_DATA_ENGINE_REMOTE_AUTHORITY_1047' src/lib/userDataEngine.ts
          grep -q 'catalogRemoteValidatedSessionKeys' src/lib/userDataEngine.ts
          grep -q 'readRemoteCatalogSnapshot(kind, uid, 0)' src/lib/userDataEngine.ts
          ! grep -q 'Math.max(readKnownRemoteCatalogRevision(kind, uid), Math.floor(minimumRevision' src/lib/userDataEngine.ts
          grep -q 'if (!sessionValidated) return null' src/lib/userDataEngine.ts
          echo '1047_STATIC_GUARDS=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: App TypeScript and Build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          grep -R -q 'SORIDRAW_USER_DATA_ENGINE_REMOTE_AUTHORITY_1047' dist/assets
          echo '1047_APP_BUILD=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Functions regression safety
        run: |
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle

      - name: Commit runtime source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add src/lib/userDataEngine.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'fix(preview): require server Catalog authority per session'
          git push origin HEAD:preview
          echo "RUNTIME_COMMIT=$(git rev-parse HEAD)"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Firebase PREVIEW hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo '1047_FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact deployed preview build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok=yes; echo "1047_EXACT_BUILD_PASS=$url"; break
                fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo '1047_PRODUCTION_UNCHANGED=PASS'
