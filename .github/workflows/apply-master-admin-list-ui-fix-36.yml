name: Apply master admin list UI fix 36

on:
  push:
    branches: [main]
    paths:
      - .deploy/apply-master-admin-list-ui-fix-36-trigger.txt

concurrency:
  group: apply-master-admin-list-ui-fix-36
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply 36th source patch
        run: python .deploy/apply-master-admin-list-ui-fix-36.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and verify web app
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit source and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MasterPermissionsPage.tsx src/pages/AdminUserManagementPage.tsx
          git rm .github/workflows/apply-master-admin-list-ui-fix-36.yml
          git rm .deploy/apply-master-admin-list-ui-fix-36-trigger.txt
          git rm .deploy/apply-master-admin-list-ui-fix-36.py
          git rm .github/workflows/report-master-admin-list-ui-fix-36.yml || true
          git rm .deploy/report-master-admin-list-ui-fix-36-trigger-note.txt || true
          git commit -m "fix: show only admins in master permissions"
          git push origin HEAD:main
