name: TEMP 130 Approved R2 Catalog Bootstrap

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-130-approved-catalog-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      EXPECTED_PREVIEW_VERSION: 3678c1da-1bb5-4cfc-881f-6d1ad85a7fe0
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
      SHARED_R2: soridraw-profile-media
      PREVIEW_R2: soridraw-profile-media-preview
      EXPECTED_TRACKS: '38'
      EXPECTED_OWNERS: '3'
      EXPECTED_CATALOG_OBJECTS: '432'

    steps:
      - name: Checkout exact approved 068 source
        uses: actions/checkout@v4
        with:
          ref: b07458d9d7db30a9c1a67c9f8e0beea8c3bdb78b
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live Worker, protected environments, bindings, and flags
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){
            const r=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
            const x=await r.json();
            if(!r.ok||x.success===false) throw new Error('Cloudflare '+r.status+': '+JSON.stringify(x).slice(0,1200));
            return x.result||x;
          }
          async function active(name){
            const x=await get('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+name+'/deployments');
            const d=(x.deployments||x||[])[0];
            const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!v?.version_id||Number(v.percentage||0)<99.99) throw new Error('No single active version for '+name);
            return v.version_id;
          }
          (async()=>{
            const preview=await active(process.env.PREVIEW_WORKER);
            const test=await active(process.env.TEST_WORKER);
            const prod=await active(process.env.PRODUCTION_WORKER);
            if(preview!==process.env.EXPECTED_PREVIEW_VERSION) throw new Error('PREVIEW version mismatch '+preview);
            fs.writeFileSync(process.env.RUNNER_TEMP+'/preview.before',preview);
            fs.writeFileSync(process.env.RUNNER_TEMP+'/test.before',test);
            fs.writeFileSync(process.env.RUNNER_TEMP+'/prod.before',prod);
            const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+process.env.PREVIEW_WORKER;
            const settings=await get(base+'/settings');
            const bindings=Array.isArray(settings.bindings)?settings.bindings:[];
            const d1=bindings.find(b=>b.type==='d1'&&b.name==='DB');
            const shared=bindings.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA');
            const local=bindings.find(b=>b.type==='r2_bucket'&&b.name==='EXPLORE_CACHE');
            if(!d1) throw new Error('DB binding missing');
            if(String(shared?.bucket_name||'')!==process.env.SHARED_R2) throw new Error('shared R2 mismatch');
            if(String(local?.bucket_name||'')!==process.env.PREVIEW_R2) throw new Error('preview R2 mismatch');
            for(const name of ['SORIDRAW_R2_CATALOG_V1','SORIDRAW_R2_CATALOG_READ_V1','SORIDRAW_R2_FIRST_PUBLISHER_V1']){
              const b=bindings.find(x=>x?.name===name);
              const raw=String(b?.text??b?.value??b?.json??'').trim();
              if(raw==='1') throw new Error(name+' unexpectedly ON');
              console.log(name+'=OFF_OR_ABSENT');
            }
            console.log('PREVIEW_068_ACTIVE='+preview);
            console.log('PROTECTED_TEST='+test);
            console.log('PROTECTED_PRODUCTION='+prod);
            console.log('BINDINGS_AND_FLAGS_PREFLIGHT=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify repaired profiles and repair at most one missing shared track-card
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"

          node "$WRANGLER" r2 object get "$SHARED_R2/internal/explore/shared-feed-v112/latest-40.json" --file "$RUNNER_TEMP/latest.json" --remote >/dev/null

          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/latest.json','utf8'));
          const items=x?.payload?.data?.items||[];
          const ids=[...new Set(items.map(v=>String(v?.id||v?.trackId||'').trim()).filter(Boolean))];
          const owners=[...new Set(items.map(v=>String(v?.ownerUid||v?.owner_uid||'').trim()).filter(Boolean))];
          if(ids.length!==38) throw new Error('latest track count '+ids.length);
          if(owners.length!==3) throw new Error('owner count '+owners.length);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/track-ids.txt',ids.join('\n')+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/owners.txt',owners.join('\n')+'\n');
          console.log('SHARED_LATEST_TRACKS='+ids.length);
          console.log('SHARED_LATEST_OWNERS='+owners.length);
          NODE

          profile_found=0
          while IFS= read -r uid; do
            [ -n "$uid" ] || continue
            enc="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$uid")"
            node "$WRANGLER" r2 object get "$SHARED_R2/internal/explore/shared-profile-v113/$enc.json" --file "$RUNNER_TEMP/profile-$profile_found.json" --remote >/dev/null
            profile_found=$((profile_found+1))
          done < "$RUNNER_TEMP/owners.txt"
          test "$profile_found" = 3
          echo 'SHARED_PROFILE_REPAIR_PERSISTED=3_3'

          : > "$RUNNER_TEMP/missing-cards.txt"
          card_found=0
          card_missing=0
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            enc="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$id")"
            if node "$WRANGLER" r2 object get "$SHARED_R2/internal/explore/shared-track-card-v115/$enc.json" --file "$RUNNER_TEMP/card-$card_found.json" --remote >/dev/null 2>&1; then
              card_found=$((card_found+1))
            else
              card_missing=$((card_missing+1))
              printf '%s\n' "$id" >> "$RUNNER_TEMP/missing-cards.txt"
            fi
          done < "$RUNNER_TEMP/track-ids.txt"
          echo "SHARED_TRACK_CARD_FOUND_BEFORE=$card_found"
          echo "SHARED_TRACK_CARD_MISSING_BEFORE=$card_missing"
          test "$card_missing" -le 28
          test $((card_found+card_missing)) = 38

          if [ "$card_missing" -gt 0 ]; then
            mkdir -p "$RUNNER_TEMP/repair-cards"
            node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const latest=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/latest.json','utf8'));
          const missing=fs.readFileSync(process.env.RUNNER_TEMP+'/missing-cards.txt','utf8').trim().split(/\r?\n/).filter(Boolean);
          const items=latest?.payload?.data?.items||[];
          let made=0;
          for(const id of missing){
            const item=items.find(v=>String(v?.id||v?.trackId||'').trim()===id);
            if(!item) throw new Error('missing latest source for '+id);
            const likeCount=Math.max(0,Number(item.likeCount??item.like_count??item.stats?.likeCount??0));
            const publishedAt=Math.max(0,Number(item.publishedAt??item.published_at??0));
            const card={
              ...item,
              id,
              ownerUid:String(item.ownerUid||item.owner_uid||'').trim(),
              ownerNickname:String(item.ownerNickname||item.owner_nickname||'').trim(),
              ownerAvatarUrl:String(item.ownerAvatarUrl||item.owner_avatar_url||'').trim(),
              title:String(item.title||'').trim(),
              coverUrl:String(item.coverUrl||item.cover_url||'').trim(),
              sunoUrlPrimary:String(item.sunoUrlPrimary||item.suno_url_primary||'').trim(),
              openUrl:String(item.openUrl||item.sunoUrlPrimary||item.suno_url_primary||item.suno_url_secondary||'').trim(),
              likeCount,
              publishedAt,
              profilePinned:Boolean(item.profilePinned??item.profile_pinned),
              ...(item.stats&&typeof item.stats==='object'?{stats:{...item.stats,likeCount}}:{}),
            };
            const bundle={schemaVersion:1,trackId:id,updatedAt:Date.now(),card};
            const file=path.join(process.env.RUNNER_TEMP,'repair-cards',String(made)+'.json');
            fs.writeFileSync(file,JSON.stringify(bundle));
            made++;
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/repair-card-count.txt',String(made));
          console.log('TRACK_CARD_REPAIR_SOURCE=SHARED_LATEST_ONLY');
          console.log('TRACK_CARD_REPAIR_FILES='+made);
          NODE

            repair_idx=0
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              enc="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$id")"
              node "$WRANGLER" r2 object put "$SHARED_R2/internal/explore/shared-track-card-v115/$enc.json" --file "$RUNNER_TEMP/repair-cards/$repair_idx.json" --content-type application/json --remote --force >/dev/null
              repair_idx=$((repair_idx+1))
            done < "$RUNNER_TEMP/missing-cards.txt"
            test "$repair_idx" = "$(cat "$RUNNER_TEMP/repair-card-count.txt")"
            echo "BOUNDED_SHARED_TRACK_CARD_REPAIR=$repair_idx"
          else
            echo 'BOUNDED_SHARED_TRACK_CARD_REPAIR=0_ALREADY_COMPLETE'
          fi

          final_found=0
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            enc="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$id")"
            node "$WRANGLER" r2 object get "$SHARED_R2/internal/explore/shared-track-card-v115/$enc.json" --file "$RUNNER_TEMP/final-card-$final_found.json" --remote >/dev/null
            node - "$RUNNER_TEMP/final-card-$final_found.json" "$id" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2],id=process.argv[3];
          const x=JSON.parse(fs.readFileSync(file,'utf8'));
          if(Number(x?.schemaVersion||0)!==1||String(x?.trackId||'')!==id||String(x?.card?.id||'')!==id) throw new Error('shared track-card invalid');
          NODE
            final_found=$((final_found+1))
          done < "$RUNNER_TEMP/track-ids.txt"
          test "$final_found" = 38
          echo 'SHARED_TRACK_CARD_COVERAGE=38_38'
          echo 'CANONICAL_D1_WRITE=0'
          echo 'USER_ORIGIN_DATA_CHANGE=false'

      - name: Build R2-only bootstrap worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/bootstrap-token.txt"
          cat > .temp-130-bootstrap.mjs <<'BOOT'
          import {
            EXPLORE_R2_CATALOG_ROOT_066,
            catalogMarkerKeys066,
            catalogMetaKey066,
            catalogArtistMetaKey066,
            catalogArtistMarkerKeys066,
            syncExploreCatalogTrack066,
            syncExploreCatalogArtist066,
          } from './runtime/r2-catalog-v1.js';

          const TOKEN='__BOOTSTRAP_TOKEN__';
          const LATEST_KEY='internal/explore/shared-feed-v112/latest-40.json';
          const PROFILE_PREFIX='internal/explore/shared-profile-v113/';
          const CARD_PREFIX='internal/explore/shared-track-card-v115/';
          const EXPECTED_TRACKS=38;
          const EXPECTED_OWNERS=3;
          const EXPECTED_OBJECTS=432;

          async function readJson(bucket,key){
            const obj=await bucket.get(key);
            if(!obj) return null;
            return JSON.parse(await obj.text());
          }
          async function listAll(bucket,prefix){
            const out=[];
            let cursor;
            for(let round=0;round<20;round++){
              const result=await bucket.list({prefix,limit:1000,cursor,include:['customMetadata']});
              out.push(...(result.objects||[]));
              if(!result.truncated||!result.cursor) return out;
              cursor=result.cursor;
            }
            throw new Error('listAll exceeded rounds');
          }
          function seg(v){ return encodeURIComponent(String(v||'').trim()); }
          function classify(keys){
            const c={meta:0,latest:0,popular:0,profile:0,genre:0,title:0,artistMeta:0,artistName:0,artistHandle:0};
            for(const key of keys){
              if(key.includes('/artist-meta/')) c.artistMeta++;
              else if(key.includes('/artist/name/')) c.artistName++;
              else if(key.includes('/artist/handle/')) c.artistHandle++;
              else if(key.includes('/meta/')) c.meta++;
              else if(key.includes('/latest/')) c.latest++;
              else if(key.includes('/popular/')) c.popular++;
              else if(key.includes('/profile/')) c.profile++;
              else if(key.includes('/genre/')) c.genre++;
              else if(key.includes('/title/')) c.title++;
            }
            return c;
          }
          async function sourceState(env,checkCards=false){
            const bucket=env.PROFILE_MEDIA;
            const latest=await readJson(bucket,LATEST_KEY);
            const items=latest?.payload?.data?.items||[];
            const ids=[...new Set(items.map(v=>String(v?.id||v?.trackId||'').trim()).filter(Boolean))];
            if(ids.length!==EXPECTED_TRACKS) throw new Error('source track count '+ids.length);
            const owners=[...new Set(items.map(v=>String(v?.ownerUid||v?.owner_uid||'').trim()).filter(Boolean))];
            if(owners.length!==EXPECTED_OWNERS) throw new Error('source owner count '+owners.length);
            if(checkCards){
              for(const id of ids){
                const bundle=await readJson(bucket,CARD_PREFIX+seg(id)+'.json');
                const card=bundle?.card;
                if(Number(bundle?.schemaVersion||0)!==1||String(card?.id||card?.trackId||'')!==id) throw new Error('shared track-card missing '+id);
              }
            }
            const profiles=[];
            for(const uid of owners){
              const bundle=await readJson(bucket,PROFILE_PREFIX+seg(uid)+'.json');
              const profile=bundle?.body?.data?.profile;
              if(!profile||!Array.isArray(bundle?.body?.data?.items)) throw new Error('shared profile missing '+uid);
              profiles.push({...profile,uid:String(profile?.uid||bundle?.uid||uid)});
            }
            const expected=new Set();
            for(const item of items){
              expected.add(catalogMetaKey066(String(item?.id||item?.trackId||'')));
              for(const key of catalogMarkerKeys066(item)) expected.add(key);
            }
            for(const profile of profiles){
              expected.add(catalogArtistMetaKey066(profile.uid));
              for(const key of catalogArtistMarkerKeys066(profile)) expected.add(key);
            }
            return {items,ids,owners,profiles,expected,counts:classify([...expected])};
          }
          function assertExpected(state){
            const c=state.counts;
            const required={meta:38,latest:38,popular:38,profile:38,genre:21,title:250,artistMeta:3,artistName:3,artistHandle:3};
            for(const [k,v] of Object.entries(required)) if(Number(c[k]||0)!==v) throw new Error('expected '+k+'='+c[k]+' not '+v);
            if(state.expected.size!==EXPECTED_OBJECTS) throw new Error('expected object set '+state.expected.size);
          }
          async function rollback(env){
            const bucket=env.PROFILE_MEDIA;
            let removed=0;
            for(let round=0;round<20;round++){
              const objects=await listAll(bucket,EXPLORE_R2_CATALOG_ROOT_066+'/');
              if(!objects.length) return removed;
              const keys=objects.map(v=>v.key);
              for(let i=0;i<keys.length;i+=100){
                const part=keys.slice(i,i+100);
                await bucket.delete(part);
                removed+=part.length;
              }
            }
            throw new Error('rollback did not empty namespace');
          }
          function out(payload,status=200){ return new Response(JSON.stringify(payload),{status,headers:{'content-type':'application/json'}}); }
          export default {
            async fetch(request,env){
              const url=new URL(request.url);
              if(request.method!=='POST') return out({ok:false,error:'method'},405);
              if(request.headers.get('x-bootstrap-token')!==TOKEN) return out({ok:false,error:'forbidden'},403);
              try{
                if(url.pathname==='/preflight'){
                  const existing=await listAll(env.PROFILE_MEDIA,EXPLORE_R2_CATALOG_ROOT_066+'/');
                  if(existing.length) throw new Error('catalog namespace not empty: '+existing.length);
                  const state=await sourceState(env,true);
                  assertExpected(state);
                  return out({ok:true,existing:0,tracks:state.ids.length,owners:state.owners.length,expectedObjects:state.expected.size,counts:state.counts,trackCards:state.ids.length});
                }
                if(url.pathname==='/tracks'){
                  const state=await sourceState(env,false);
                  assertExpected(state);
                  const start=Math.max(0,Number(url.searchParams.get('start')||0));
                  const count=Math.min(3,Math.max(1,Number(url.searchParams.get('count')||3)));
                  const slice=state.items.slice(start,start+count);
                  for(const item of slice){
                    const result=await syncExploreCatalogTrack066(env,item,{isPublic:true});
                    if(result?.ok!==true) throw new Error('track sync failed');
                  }
                  return out({ok:true,start,count:slice.length});
                }
                if(url.pathname==='/artists'){
                  const state=await sourceState(env,false);
                  assertExpected(state);
                  for(const profile of state.profiles){
                    const result=await syncExploreCatalogArtist066(env,profile);
                    if(result?.ok!==true) throw new Error('artist sync failed');
                  }
                  return out({ok:true,artists:state.profiles.length});
                }
                if(url.pathname==='/postflight'){
                  const state=await sourceState(env,true);
                  assertExpected(state);
                  const actual=(await listAll(env.PROFILE_MEDIA,EXPLORE_R2_CATALOG_ROOT_066+'/')).map(v=>v.key);
                  const actualSet=new Set(actual);
                  if(actualSet.size!==EXPECTED_OBJECTS) throw new Error('actual object count '+actualSet.size);
                  const missing=[...state.expected].filter(k=>!actualSet.has(k));
                  const extra=[...actualSet].filter(k=>!state.expected.has(k));
                  if(missing.length||extra.length) throw new Error('catalog key mismatch missing='+missing.length+' extra='+extra.length);
                  const counts=classify([...actualSet]);
                  for(const [k,v] of Object.entries(state.counts)) if(Number(counts[k]||0)!==Number(v||0)) throw new Error('actual '+k+' mismatch');
                  for(const id of state.ids){
                    const meta=await readJson(env.PROFILE_MEDIA,catalogMetaKey066(id));
                    if(!meta?.public||String(meta?.trackId||'')!==id) throw new Error('meta invalid');
                  }
                  return out({ok:true,objects:actualSet.size,counts,tracks:state.ids.length,owners:state.owners.length,trackCards:state.ids.length});
                }
                if(url.pathname==='/rollback'){
                  const removed=await rollback(env);
                  const left=(await listAll(env.PROFILE_MEDIA,EXPLORE_R2_CATALOG_ROOT_066+'/')).length;
                  return out({ok:left===0,removed,left},left===0?200:500);
                }
                return out({ok:false,error:'not_found'},404);
              }catch(error){
                return out({ok:false,error:String(error?.message||error)},500);
              }
            }
          };
          BOOT
          node - "$TOKEN" <<'NODE'
          const fs=require('fs');
          const token=process.argv[2];
          const file='.temp-130-bootstrap.mjs';
          let s=fs.readFileSync(file,'utf8');
          if(!s.includes('__BOOTSTRAP_TOKEN__')) throw new Error('token placeholder missing');
          s=s.replace('__BOOTSTRAP_TOKEN__',token);
          fs.writeFileSync(file,s);
          NODE
          cat > .temp-130-wrangler.jsonc <<'JSON'
          {
            "name": "soridraw-temp-130-catalog-bootstrap",
            "main": ".temp-130-bootstrap.mjs",
            "compatibility_date": "2026-08-28",
            "r2_buckets": [
              {
                "binding": "PROFILE_MEDIA",
                "bucket_name": "soridraw-profile-media"
              }
            ]
          }
          JSON
          node --check .temp-130-bootstrap.mjs
          echo 'R2_ONLY_BOOTSTRAP_WORKER_BUILD=PASS'

      - name: Bootstrap exact 432 catalog objects with rollback
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/.temp-130-wrangler.jsonc"
          TOKEN="$(cat "$RUNNER_TEMP/bootstrap-token.txt")"
          DEV_PID=""
          bootstrap_started=0
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$bootstrap_started" = 1 ]; then
              echo 'TEMP130_FAILURE_ROLLBACK=START'
              curl -sS -X POST -H "x-bootstrap-token: $TOKEN" -o "$RUNNER_TEMP/rollback.json" http://127.0.0.1:8788/rollback || true
              cat "$RUNNER_TEMP/rollback.json" 2>/dev/null || true
              echo 'TEMP130_FAILURE_ROLLBACK=ATTEMPTED'
            fi
            if [ -n "$DEV_PID" ]; then
              kill "$DEV_PID" >/dev/null 2>&1 || true
              wait "$DEV_PID" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          node "$WRANGLER" dev --remote --config "$CFG" --ip 127.0.0.1 --port 8788 > "$RUNNER_TEMP/catalog-bootstrap-dev.log" 2>&1 &
          DEV_PID=$!
          ready=0
          for attempt in $(seq 1 180); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8788/preflight || true)"
            if [ "$code" = 403 ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/catalog-bootstrap-dev.log"
            exit 1
          fi
          echo 'CATALOG_REMOTE_DEV_READY=PASS'
          code="$(curl -sS -X POST -H "x-bootstrap-token: $TOKEN" -o "$RUNNER_TEMP/bootstrap-preflight.json" -w '%{http_code}' http://127.0.0.1:8788/preflight)"
          cat "$RUNNER_TEMP/bootstrap-preflight.json"
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/bootstrap-preflight.json','utf8'));
          if(x?.ok!==true||Number(x.existing)!==0||Number(x.tracks)!==38||Number(x.owners)!==3||Number(x.expectedObjects)!==432||Number(x.trackCards)!==38) throw new Error('bootstrap preflight mismatch');
          console.log('CATALOG_BOOTSTRAP_PREFLIGHT=PASS');
          NODE
          bootstrap_started=1
          for start in $(seq 0 3 36); do
            code="$(curl -sS -X POST -H "x-bootstrap-token: $TOKEN" -o "$RUNNER_TEMP/tracks-$start.json" -w '%{http_code}' "http://127.0.0.1:8788/tracks?start=$start&count=3")"
            test "$code" = 200
          done
          echo 'CATALOG_TRACK_BATCHES=PASS'
          code="$(curl -sS -X POST -H "x-bootstrap-token: $TOKEN" -o "$RUNNER_TEMP/artists.json" -w '%{http_code}' http://127.0.0.1:8788/artists)"
          test "$code" = 200
          code="$(curl -sS -X POST -H "x-bootstrap-token: $TOKEN" -o "$RUNNER_TEMP/bootstrap-postflight.json" -w '%{http_code}' http://127.0.0.1:8788/postflight)"
          cat "$RUNNER_TEMP/bootstrap-postflight.json"
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/bootstrap-postflight.json','utf8'));
          const c=x?.counts||{};
          const expected={meta:38,latest:38,popular:38,profile:38,genre:21,title:250,artistMeta:3,artistName:3,artistHandle:3};
          if(x?.ok!==true||Number(x.objects)!==432||Number(x.tracks)!==38||Number(x.owners)!==3||Number(x.trackCards)!==38) throw new Error('postflight summary mismatch');
          for(const [k,v] of Object.entries(expected)) if(Number(c[k]||0)!==v) throw new Error(k+'='+c[k]+' expected '+v);
          console.log('CATALOG_OBJECTS=432');
          console.log('CATALOG_META=38');
          console.log('CATALOG_LATEST=38');
          console.log('CATALOG_POPULAR=38');
          console.log('CATALOG_PROFILE=38');
          console.log('CATALOG_GENRE=21');
          console.log('CATALOG_TITLE=250');
          console.log('CATALOG_ARTIST_META=3');
          console.log('CATALOG_ARTIST_NAME=3');
          console.log('CATALOG_ARTIST_HANDLE=3');
          console.log('CATALOG_SHARED_TRACK_CARD_COVERAGE=38_38');
          console.log('CATALOG_BOOTSTRAP_POSTFLIGHT=PASS');
          NODE
          bootstrap_started=0
          kill "$DEV_PID" >/dev/null 2>&1 || true
          wait "$DEV_PID" >/dev/null 2>&1 || true
          DEV_PID=""
          trap - EXIT
          echo 'CATALOG_REMOTE_DEV_STOPPED=PASS'

      - name: Live postflight flags, first-page cost, and protected Workers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){
            const r=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
            const x=await r.json();
            if(!r.ok||x.success===false) throw new Error('Cloudflare '+r.status+': '+JSON.stringify(x).slice(0,1000));
            return x.result||x;
          }
          async function active(name){
            const x=await get('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+name+'/deployments');
            const d=(x.deployments||x||[])[0];
            return [...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0]?.version_id||'';
          }
          (async()=>{
            const preview=await active(process.env.PREVIEW_WORKER);
            const test=await active(process.env.TEST_WORKER);
            const prod=await active(process.env.PRODUCTION_WORKER);
            if(preview!==fs.readFileSync(process.env.RUNNER_TEMP+'/preview.before','utf8')) throw new Error('PREVIEW Worker changed during bootstrap');
            if(test!==fs.readFileSync(process.env.RUNNER_TEMP+'/test.before','utf8')) throw new Error('TEST Worker changed');
            if(prod!==fs.readFileSync(process.env.RUNNER_TEMP+'/prod.before','utf8')) throw new Error('PRODUCTION Worker changed');
            const settings=await get('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+process.env.PREVIEW_WORKER+'/settings');
            const bindings=settings.bindings||[];
            for(const name of ['SORIDRAW_R2_CATALOG_V1','SORIDRAW_R2_CATALOG_READ_V1','SORIDRAW_R2_FIRST_PUBLISHER_V1']){
              const b=bindings.find(x=>x?.name===name);
              const raw=String(b?.text??b?.value??b?.json??'').trim();
              if(raw==='1') throw new Error(name+' unexpectedly ON after bootstrap');
              console.log(name+'=OFF_AFTER_BOOTSTRAP');
            }
            console.log('PROTECTED_WORKERS_UNCHANGED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          for sort in latest popular; do
            curl -fsS -D "$RUNNER_TEMP/$sort.head" -o "$RUNNER_TEMP/$sort.json" -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/feed?sort=$sort&limit=40&__soridraw_r2_only=108"
            reads="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r","");print $2}' "$RUNNER_TEMP/$sort.head" | tail -1)"
            writes="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r","");print $2}' "$RUNNER_TEMP/$sort.head" | tail -1)"
            test "$reads" = 0
            test "$writes" = 0
            echo "LIVE_$sort=D1_R0_W0"
          done
          echo 'CATALOG_READ_FLAG=false'
          echo 'CATALOG_WRITE_FLAG=false'
          echo 'FIRST_PUBLISHER_FLAG=false'
          echo 'CANONICAL_D1_WRITE=0'
          echo 'D1_SCHEMA_CHANGE=false'
          echo 'USER_ORIGIN_DATA_CHANGE=false'
          echo 'FIREBASE_CHANGE=false'
          echo 'TEST_PRODUCTION_CHANGE=false'
