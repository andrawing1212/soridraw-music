name: SORIDRAW Notification 029 Shared Social Collection Release
on:
  pull_request:
    branches: [preview]
    paths:
      - '.github/workflows/notification-social-029-release.yml'
      - 'scripts/verify-notification-cost-headroom-028.mjs'
      - 'scripts/verify-notification-activation-029.mjs'
      - 'scripts/release-notification-activation-029.mjs'
      - 'scripts/verify-notification-social-gate-029.mjs'
  push:
    branches: [preview]
    paths:
      - '.deploy/notification-social-029.release'
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: soridraw-preview-explore-worker-release
  cancel-in-progress: false
jobs:
  source-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source, retention and explicit owner approval guard
        run: |
          set -euo pipefail
          node --check scripts/verify-notification-cost-headroom-028.mjs
          node --check scripts/verify-notification-activation-029.mjs
          node --check scripts/release-notification-activation-029.mjs
          node --check scripts/verify-notification-social-gate-029.mjs
          node scripts/verify-notification-cost-headroom-028.mjs --self-test
          node scripts/verify-notification-activation-029.mjs --self-test
          node scripts/verify-notification-social-gate-029.mjs --self-test
          node scripts/verify-notification-d1-dot-upgrade-018.mjs --self-test
          node scripts/verify-notification-scheduler-013.mjs
      - name: Rebuild exact active PREVIEW module unchanged; flags only (dry-run)
        run: |
          set -euo pipefail
          node scripts/release-notification-activation-029.mjs --prepare
          echo 'NOTIFICATION_029_EXACT_ACTIVE_WORKER_CONFIG_ONLY=PASS'
          echo 'WORKER_DEPLOY=0;SHARED_D1_WRITES=0;COLLECTOR_OFF=PASS'
  current-live-readonly:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real D1 OFF, exact Stage018 SQL, current PREVIEW and three Workers
        run: |
          set -euo pipefail
          node scripts/verify-notification-d1-dot-upgrade-018.mjs --live-existing
          node scripts/verify-notification-activation-029.mjs --before
          node scripts/verify-notification-cost-headroom-028.mjs --live
          echo 'NOTIFICATION_029_LIVE_READONLY_ALL_ENV_AND_COST=PASS'
  owner-approved-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
    steps:
      - name: Checkout exact approved release guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify one-use director authorization tied to exact PR SHA
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin preview --no-tags
          git show "$GITHUB_SHA:.deploy/notification-social-029.release" > .deploy/notification-social-029.release
          node scripts/verify-notification-social-gate-029.mjs --self-test
          node scripts/verify-notification-social-gate-029.mjs --verify-approval
      - name: Checkout exactly approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.source_sha }}
          fetch-depth: 0
      - name: Validate pinned source, cost, 30-day retention and no canonical changes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD "$GITHUB_SHA"
          node scripts/verify-notification-cost-headroom-028.mjs --self-test
          node scripts/verify-notification-activation-029.mjs --self-test
          node scripts/verify-notification-scheduler-013.mjs
          node scripts/verify-notification-social-gate-029.mjs --self-test
      - name: Prepare frozen active Worker with only two retention flags
        run: |
          set -euo pipefail
          node scripts/release-notification-activation-029.mjs --prepare
      - name: Apply one-row collector activation after preflight; rollback on failure
        run: |
          set -euo pipefail
          node scripts/release-notification-activation-029.mjs --deploy
