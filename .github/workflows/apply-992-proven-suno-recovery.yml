name: Apply 992 Proven Suno Recovery

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/apply-992-proven-suno-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-992-proven-suno-recovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply-992-restore-proven-suno-recovery.py
          grep -Fq 'SORIDRAW_PROVEN_VERCEL_RECOVERY_992' src/services/sunoAudioRecovery.ts
          grep -Fq "ordered.find((url) => url !== normalizedFailed) || ordered[0] || ''" src/services/sunoAudioRecovery.ts
          grep -Fq 'if (!hasExplicitFailedUrl && cached?.audioUrl)' src/services/sunoAudioRecovery.ts
          grep -Fq 'if (!hasExplicitFailedUrl && cached?.failedUntil' src/services/sunoAudioRecovery.ts
          ! grep -Fq 'recoveryOnly: true' src/services/sunoAudioRecovery.ts
          grep -Fq 'recoverAndRetryPlayback' src/contexts/GlobalPlayerContext.tsx
          grep -Fq "fetch(url, { cache: 'no-store' })" src/services/sunoAudioRecovery.ts
          echo 'PROVEN_RECOVERY_CONTRACT=PASS'

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/sunoAudioRecovery.ts
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(preview): restore proven aged Suno recovery behavior'
          git push origin HEAD:preview

      - name: Safety result
        run: |
          echo 'FUNCTIONS_DEPLOY=false'
          echo 'FIRESTORE_MIGRATION=false'
          echo 'CLOUDFLARE_CHANGE=false'
          echo 'VERCEL_DEPLOY=false'
          echo 'MAIN_CHANGE=false'
