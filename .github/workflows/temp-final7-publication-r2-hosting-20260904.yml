name: SORIDRAW Publication R2 PREVIEW Final7 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-final7-publication-r2-hosting-20260904.yml']
permissions:
  contents: read
jobs:
  finish:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEED_PATH: /__soridraw_seed_music_note_publication_r2_20260904_7b4f
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - name: Verify final PREVIEW Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          base='https://soridraw-explore-preview.andrawing1212.workers.dev'
          bundle="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/bundle.json" -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$base/v1/me/music-note-publications-bundle")"
          seed="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/seed.json" -w '%{http_code}' -X POST "$base${SEED_PATH}")"
          feed="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$base/v1/feed?sort=latest&limit=1")"
          echo "RUNTIME bundle=$bundle seed=$seed feed=$feed"
          test "$bundle" = 401
          test "$seed" = 404
          test "$feed" = 200
          echo 'FINAL_WORKER_RUNTIME=PASS'
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: TypeScript and Build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          grep -q '/v1/me/music-note-publications-bundle' src/services/explorePublicationService.ts
          echo 'APP_BUILD=PASS'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Deploy Firebase PREVIEW Hosting only and verify
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://soridraw.web.app/ -o "$RUNNER_TEMP/p0"; sha256sum "$RUNNER_TEMP/p0" | awk '{print $1}' > "$RUNNER_TEMP/h0"
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          for u in https://preview.soridraw.com/ https://soridraw-preview.web.app/ https://soridraw-preview.firebaseapp.com/; do curl -fsS --max-time 30 "$u" -o "$RUNNER_TEMP/x"; grep -q '<div id="root"></div>' "$RUNNER_TEMP/x"; echo "SMOKE_PASS=$u"; done
          curl -fsS https://soridraw.web.app/ -o "$RUNNER_TEMP/p1"; sha256sum "$RUNNER_TEMP/p1" | awk '{print $1}' > "$RUNNER_TEMP/h1"; cmp "$RUNNER_TEMP/h0" "$RUNNER_TEMP/h1"
          echo 'PRODUCTION_UNCHANGED=true'
          echo 'EXPECTED_COLD=Worker1_D1Read0_R2Read1'
          echo 'EXPECTED_WARM=Worker0_D1Read0_R2Read0'
          echo 'PAGE_ENTRY_SERVER_WRITE=0'
