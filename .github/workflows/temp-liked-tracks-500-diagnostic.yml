name: TEMP PREVIEW liked-tracks 500 diagnostic

on:
  push:
    branches:
      - 'tmp/liked-tracks-500-diag-20260915'
    paths:
      - '.github/workflows/temp-liked-tracks-500-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/liked-tracks-500-diag-20260915
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture active PREVIEW Worker and binding metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diag/worker cloudflare/explore-worker/.diag-d1
          node <<'NODE'
          const fs = require('fs');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const worker = process.env.PREVIEW_WORKER;
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };
          async function get(url) {
            const r = await fetch(url, { headers });
            const text = await r.text();
            let body; try { body = JSON.parse(text); } catch { throw new Error(`HTTP ${r.status}: ${text.slice(0,500)}`); }
            if (!r.ok || body.success === false) throw new Error(`HTTP ${r.status}: ${text.slice(0,800)}`);
            return body.result ?? body;
          }
          (async () => {
            const base = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}`;
            const [deps, settings] = await Promise.all([get(`${base}/deployments`), get(`${base}/settings`)]);
            const dep = (deps.deployments || deps || [])[0];
            const active = [...(dep?.versions || [])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];
            if (!active?.version_id || Number(active.percentage||0) < 99.99) throw new Error('single active PREVIEW version missing');
            const version = await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${worker}/versions/${active.version_id}?include=modules`);
            const modules = Array.isArray(version.modules) ? version.modules : [];
            if (modules.length !== 1) throw new Error(`expected one module, got ${modules.length}`);
            const source = Buffer.from(modules[0].content_base64 || '', 'base64').toString('utf8');
            fs.writeFileSync('.diag/worker/worker.js', source);
            fs.writeFileSync('.diag/worker/version.txt', String(active.version_id));
            const d1 = (settings.bindings || []).find(b => b.type === 'd1' && b.name === 'DB');
            if (!d1) throw new Error('DB D1 binding missing');
            const d1id = String(d1.id || d1.database_id || d1.uuid || '').trim();
            const d1name = String(d1.database_name || 'soridraw-explore-preview').trim();
            fs.writeFileSync('cloudflare/explore-worker/.diag-d1/wrangler.jsonc', JSON.stringify({
              name: 'soridraw-liked-tracks-readonly-diag',
              compatibility_date: String(settings.compatibility_date || '2026-08-28').slice(0,10),
              d1_databases: [{ binding:'DB', database_name:d1name, database_id:d1id }]
            }, null, 2) + '\n');
            console.log(`ACTIVE_PREVIEW_WORKER=${active.version_id}`);
            console.log(`WORKER_SOURCE_BYTES=${Buffer.byteLength(source)}`);
            console.log(`PREVIEW_D1=${d1name}/${d1id}`);
            console.log('DEPLOY=NO D1_WRITE=NO USER_DATA_READ=NO');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Inspect liked-tracks runtime shape
        shell: bash
        run: |
          set -euo pipefail
          node --check .diag/worker/worker.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('.diag/worker/worker.js','utf8');
          const needles=['handleMyLikedTracks052','/v1/me/liked-tracks','readExploreLikeR2Bundle','rebuildExploreLikeR2BundleFromD1'];
          for (const n of needles) {
            const idx=s.indexOf(n);
            console.log(`${n}=${idx>=0?'PRESENT':'MISSING'} at=${idx}`);
          }
          function excerpt(token, before=1000, after=8500){
            const i=s.indexOf(token); if(i<0) return '';
            return s.slice(Math.max(0,i-before), Math.min(s.length,i+after));
          }
          fs.writeFileSync('.diag/worker/liked-tracks-excerpt.js', excerpt('async function handleMyLikedTracks052', 0, 14000));
          fs.writeFileSync('.diag/worker/r2-like-excerpt.js', excerpt('async function readExploreLikeR2Bundle', 1200, 9000));
          console.log('LIKED_TRACKS_EXCERPTS_CAPTURED=PASS');
          NODE

      - name: Inspect PREVIEW D1 schema only
        shell: bash
        run: |
          set -euo pipefail
          CFG='cloudflare/explore-worker/.diag-d1/wrangler.jsonc'
          SQL="PRAGMA table_info('likes'); PRAGMA table_info('tracks'); PRAGMA table_info('profiles'); PRAGMA table_info('track_stats'); PRAGMA table_info('explore_derived_profiles'); PRAGMA table_info('explore_profile_snapshots'); SELECT name,type FROM sqlite_master WHERE type IN ('table','view') AND (name LIKE '%profile%' OR name IN ('likes','tracks','track_stats')) ORDER BY name;"
          npx --yes wrangler@4 d1 execute DB --remote --config "$CFG" --command "$SQL" --json | tee .diag/d1-schema.json
          echo 'D1_SCHEMA_READONLY=PASS'

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liked-tracks-500-diagnostic
          path: |
            .diag/worker/worker.js
            .diag/worker/version.txt
            .diag/worker/liked-tracks-excerpt.js
            .diag/worker/r2-like-excerpt.js
            .diag/d1-schema.json
          retention-days: 1
