name: Firestore Music Note createdAtMs Index

on:
  push:
    branches: [preview]
    paths:
      - 'firestore.indexes.json'
      - '.github/workflows/firestore-music-note-createdatms-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-music-note-createdatms-index
  cancel-in-progress: false

jobs:
  deploy-index-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Verify only additive Music Note index target
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('firestore.indexes.json', 'utf8'));
          const target = (data.indexes || []).filter((idx) =>
            idx.collectionGroup === 'favorites' &&
            idx.queryScope === 'COLLECTION' &&
            Array.isArray(idx.fields) &&
            idx.fields.some((f) => f.fieldPath === 'uid' && f.order === 'ASCENDING') &&
            idx.fields.some((f) => f.fieldPath === 'createdAtMs' && f.order === 'DESCENDING')
          );
          if (target.length !== 1) throw new Error(`Expected exactly one favorites uid+createdAtMs index, found ${target.length}`);
          console.log('Index definition verified: favorites uid ASC + createdAtMs DESC');
          NODE

      - name: Authenticate backend Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firestore indexes only
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only firestore:indexes \
            --project soridraw-app-866a5 \
            --config firebase.json \
            --non-interactive
          echo 'Firestore indexes-only deploy requested successfully.'
          echo 'No Firestore Rules, Functions, Hosting, Auth, or user-data mutation performed.'
