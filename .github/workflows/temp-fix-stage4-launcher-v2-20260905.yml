name: SORIDRAW Fix Stage4 Launcher V2
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-fix-stage4-launcher-v2-20260905.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20
      - name: Patch baseline guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('.github/workflows/temp-stage4-recent-musicnote-safety-20260905.yml'); s=p.read_text(); old='          test \"$(git rev-parse HEAD)\" = \"0e3e05b25cbc1f1bd41470b091a3fe453525e378\" || {\n            echo \"preview HEAD moved before stage4 apply; refusing stale patch\"\n            git rev-parse HEAD\n            exit 20\n          }\n'; new='          git merge-base --is-ancestor 0e3e05b25cbc1f1bd41470b091a3fe453525e378 HEAD\n          git diff --quiet 0e3e05b25cbc1f1bd41470b091a3fe453525e378..HEAD -- src/App.tsx functions/src/index.ts || {\n            echo \"preview source moved before stage4 apply; refusing stale patch\"\n            git diff --stat 0e3e05b25cbc1f1bd41470b091a3fe453525e378..HEAD -- src/App.tsx functions/src/index.ts\n            exit 20\n          }\n'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          git diff --check
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/temp-stage4-recent-musicnote-safety-20260905.yml
          git commit -m 'chore(preview): fix stage4 baseline guard'
          git push origin HEAD:preview
