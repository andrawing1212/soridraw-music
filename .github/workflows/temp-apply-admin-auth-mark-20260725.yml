name: Apply admin auth mark UI 20260725

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'RUN ADMIN AUTH MARK UI 20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply UI patch
        run: python .deploy/apply_admin_auth_mark.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Commit and push UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminUserManagementPage.tsx
          git commit -m "style: simplify member auth status to G E marks"
          git push origin HEAD:main

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue comment "$ISSUE_URL" --body "✅ ADMIN_AUTH_MARK_SUCCESS sha=$(git rev-parse HEAD)"
