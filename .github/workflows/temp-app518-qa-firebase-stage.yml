name: APP518 QA Firebase isolated package one-shot
on:
  push:
    branches: [feat/app518-qa-integrated-e2e]
    paths:
      - '.github/workflows/temp-app518-qa-firebase-stage.yml'
      - 'qa/app518/live/stage-qa-firebase518.mjs'
      - 'qa/app518/live/verify-stage-qa-firebase518.mjs'
permissions:
  contents: read
jobs:
  verify-qa-codebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate immutable APP518 functions isolated codebase and both OFF defaults
        shell: bash
        run: |
          set -euo pipefail
          PIN=864f796da24413309567198c9de502b13cdedd50
          git cat-file -e "$PIN^{commit}"
          export APP518_PINNED_CANDIDATE_DIR="$RUNNER_TEMP/app518-pinned-candidate"
          git worktree add --detach "$APP518_PINNED_CANDIDATE_DIR" "$PIN"
          npm ci --prefix "$APP518_PINNED_CANDIDATE_DIR/functions" --ignore-scripts --no-audit --no-fund
          "$APP518_PINNED_CANDIDATE_DIR/functions/node_modules/.bin/tsc" -p "$APP518_PINNED_CANDIDATE_DIR/functions/tsconfig.json"
          node --check qa/app518/live/stage-qa-firebase518.mjs
          node qa/app518/live/verify-stage-qa-firebase518.mjs
          export APP518_QA_FUNCTION_STAGE="$RUNNER_TEMP/app518-qa-firebase-stage-live"
          node qa/app518/live/stage-qa-firebase518.mjs --stage-only
          npm install --prefix "$APP518_QA_FUNCTION_STAGE/functions" --ignore-scripts --no-audit --no-fund --omit=dev
          node "$APP518_QA_FUNCTION_STAGE/functions/verify.mjs"
          echo 'APP518_QA_FIREBASE_SEPARATE_CODEBASE_AND_OFF=PASS; CLOUD_MUTATIONS=0'
