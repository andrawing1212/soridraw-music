name: APP797 approved backend activation (no Hosting)
on:
  push:
    branches: [prep/production-follow-existing-writer]
    paths:
      - 'scripts/app797-activate-backend.mjs'
      - 'scripts/app797-enrollment-activation.py'
      - '.github/workflows/app797-production-follow-candidate.yml'
permissions:
  contents: read
concurrency:
  group: app797-production-backend-activation
  cancel-in-progress: false
jobs:
  activate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: One-time approved activation source pin
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "8d48818ac94704239b170df4e776ff562614c000"
          node --check scripts/app797-activate-backend.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Existing callable exact source and update permission (read-only)
        run: python3 scripts/app797-enrollment-activation.py preflight
      - name: Reuse proven private connection, final version zero-traffic acceptance and backend-only activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/app797-activate-backend.mjs
