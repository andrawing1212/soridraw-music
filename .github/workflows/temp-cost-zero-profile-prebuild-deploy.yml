name: Temp Cost Zero Profile Prebuild Deploy

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-cost-zero-profile-prebuild-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-cost-zero-profile-prebuild-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare exact live Worker plus selective prebuild
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          npm install --no-audit --no-fund
          npm run cf:prepare
          node --check .remote-worker/worker.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('.remote-worker/worker.js','utf8');
          function fn(name){
            const start=src.indexOf(`async function ${name}(`);
            if(start<0) throw new Error(`missing ${name}`);
            const brace=src.indexOf('{',start); let depth=0, quote=null, escaped=false;
            for(let i=brace;i<src.length;i++){
              const c=src[i];
              if(quote){ if(escaped){escaped=false;continue;} if(c==='\\'){escaped=true;continue;} if(c===quote) quote=null; continue; }
              if(c==='"'||c==="'"||c==='`'){quote=c;continue;}
              if(c==='{') depth++;
              if(c==='}' && --depth===0) return src.slice(start,i+1);
            }
            throw new Error(`unterminated ${name}`);
          }
          for(const name of ['handleMyProfileUpdate','handleProfileMediaUpload']){
            if(!fn(name).includes('refreshOrPrebuildPublicProfileFirstView')) throw new Error(`profile prebuild missing ${name}`);
          }
          for(const name of ['handlePublication','handleVisibility']){
            if(!fn(name).includes('refreshOrPrebuildPublicProfileTrackWindow')) throw new Error(`track prebuild missing ${name}`);
          }
          for(const name of ['handleFollow','handleLike']){
            const text=fn(name);
            if(text.includes('refreshOrPrebuildPublicProfileFirstView')||text.includes('refreshOrPrebuildPublicProfileTrackWindow')) throw new Error(`social prebuild forbidden ${name}`);
          }
          if(!src.includes('readPublicProfileFirstViewRowByPrimaryKey')) throw new Error('PK-first reader missing');
          console.log('SELECTIVE_PREBUILD_SOURCE=PASS');
          NODE

      - name: Deploy only prepared Explore Worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:deploy
          echo 'EXPLORE_WORKER_SELECTIVE_PREBUILD_DEPLOY=PASS'

      - name: Re-read deployed Worker and verify persisted wiring
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .remote-worker
          npm run cf:prepare
          node --check .remote-worker/worker.js
          grep -Fq 'refreshOrPrebuildPublicProfileFirstView' .remote-worker/worker.js
          grep -Fq 'refreshOrPrebuildPublicProfileTrackWindow' .remote-worker/worker.js
          grep -Fq 'readPublicProfileFirstViewRowByPrimaryKey' .remote-worker/worker.js
          echo 'LIVE_SELECTIVE_PREBUILD_SOURCE=PASS'

      - name: Verify public profile read-cost contract did not regress
        shell: bash
        run: |
          set -euo pipefail
          base='https://soridraw-explore-api.andrawing1212.workers.dev'
          origin='https://preview.soridraw.com'
          curl -fsS --max-time 30 -o "$RUNNER_TEMP/feed.json" -H "Origin: $origin" -H 'Accept: application/json' "$base/v1/feed?sort=latest&limit=1"
          node - <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/feed.json','utf8'));
          const row=p?.data?.items?.[0]; const uid=String(row?.ownerUid||row?.owner_uid||'').trim();
          if(!uid) throw new Error('No public owner UID'); fs.writeFileSync(process.env.RUNNER_TEMP+'/uid.txt',uid);
          NODE
          uid="$(cat "$RUNNER_TEMP/uid.txt")"
          url="$base/v1/profiles/$uid/first-view?limit=50"
          seen_hit=0
          for n in $(seq 1 8); do
            curl -fsS --max-time 30 -D "$RUNNER_TEMP/p-$n.h" -o "$RUNNER_TEMP/p-$n.json" -H "Origin: $origin" -H 'Accept: application/json' "$url"
            cache="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-profile-edge-cache:/{gsub("\r",""); print toupper($2)}' "$RUNNER_TEMP/p-$n.h" | tail -n1)"
            reads="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/p-$n.h" | tail -n1)"
            writes="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/p-$n.h" | tail -n1)"
            pop="$(awk 'BEGIN{IGNORECASE=1}/^cf-ray:/{gsub("\r",""); split($2,a,"-"); print a[2]}' "$RUNNER_TEMP/p-$n.h" | tail -n1)"
            echo "PROFILE_$n cache=$cache d1_read=$reads d1_write=$writes pop=$pop"
            test "$writes" = '0'
            if [ "$cache" = 'MISS' ]; then test "$reads" = '1'; fi
            if [ "$cache" = 'HIT' ]; then test "$reads" = '0'; seen_hit=1; fi
            sleep 0.4
          done
          test "$seen_hit" = '1'
          echo 'PROFILE_READ_COST_CONTRACT=PASS'

      - name: Safety result
        run: |
          echo 'D1_SCHEMA_MIGRATION=false'
          echo 'D1_BACKFILL=false'
          echo 'FIRESTORE_CHANGE=false'
          echo 'FIREBASE_FUNCTIONS_DEPLOY=false'
          echo 'FIREBASE_HOSTING_DEPLOY=false'
          echo 'VERCEL_DEPLOY=false'
          echo 'MAIN_CHANGE=false'
