name: SORIDRAW Backend V2 Step 2-A4b Independent Postverify

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2-a4b-postverify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview

      - name: Independent static boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          app = Path('src/App.tsx').read_text(encoding='utf-8')
          fav = Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          lib = Path('src/pages/SunoLibraryPage.tsx').read_text(encoding='utf-8')
          boundary = Path('src/data/v1MutationBoundary.ts').read_text(encoding='utf-8')

          if "BACKEND_V2_V1_MUTATION_MIRROR_ENABLED = false" not in boundary:
              raise SystemExit('mirror flag is not OFF')
          if any(x in boundary for x in ['firebase/', 'indexedDbMirrorOutbox', 'v2LiveMutation', 'fetch(', 'axios']):
              raise SystemExit('common boundary has forbidden runtime IO/mirror dependency')

          # Independently inspect all user_recent_songs write expressions.
          recent_blocks = []
          lines = app.splitlines()
          for i, line in enumerate(lines):
              if 'setDoc(ref,' not in line:
                  continue
              nearby = '\n'.join(lines[max(0, i-5):min(len(lines), i+6)])
              if 'user_recent_songs' not in nearby:
                  continue
              recent_blocks.append({'line': i+1, 'wrapped': 'runV1MutationBoundary(' in line, 'text': line.strip()[:180]})
          if len(recent_blocks) != 8 or not all(x['wrapped'] for x in recent_blocks):
              raise SystemExit('recent boundary coverage mismatch: ' + json.dumps(recent_blocks, ensure_ascii=False))

          # Inspect direct favorites content writes and batch commits in known mutation owners.
          known = {'App': app, 'FavoritesPage': fav, 'SunoLibraryPage': lib}
          bypass = []
          for name, text in known.items():
              ls = text.splitlines()
              for i, line in enumerate(ls):
                  if re.search(r"(?:addDoc|updateDoc|deleteDoc)\s*\([^\n]*(?:'favorites'|\"favorites\")", line):
                      window = '\n'.join(ls[max(0, i-6):min(len(ls), i+7)])
                      if 'runV1MutationBoundary(' not in window:
                          bypass.append(f'{name}:{i+1}:{line.strip()}')
          if bypass:
              raise SystemExit('direct Music Note write bypasses boundary: ' + json.dumps(bypass, ensure_ascii=False))

          required = {
            'recent': ['clear','delete-item','save-batch','regenerate','add-lyrics-language','edit','pre-favorite-edit'],
            'musicNote': ['save','restore','unsave','permanent-delete','update','recovery-update','bulk-delete','bulk-lock','bulk-unlock','folder-update','shared-note-save','folder-rename','folder-delete','color-sync'],
          }
          joined = app + '\n' + fav + '\n' + lib
          missing = [f'{domain}:{op}' for domain, ops in required.items() for op in ops if f"domain: '{domain}', operation: '{op}'" not in joined]
          if missing:
              raise SystemExit('operation category missing: ' + json.dumps(missing))

          for text in known.values():
              if any(x in text for x in ['indexedDbMirrorOutbox', 'enqueueMirrorMutation', 'createSoridrawSongId']):
                  raise SystemExit('runtime page unexpectedly activated V2/outbox/stable-ID injection')

          print('STEP2A4B_POSTVERIFY=' + json.dumps({
            'recentV1WritePaths': len(recent_blocks),
            'recentWrapped': sum(1 for x in recent_blocks if x['wrapped']),
            'appBoundaryCalls': app.count('runV1MutationBoundary('),
            'favoritesPageBoundaryCalls': fav.count('runV1MutationBoundary('),
            'sunoLibraryPageBoundaryCalls': lib.count('runV1MutationBoundary('),
            'mirrorEnabled': False,
            'firebaseReads': 0,
            'firebaseWrites': 0,
            'firebaseDeletes': 0,
          }))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx src/data/v1MutationBoundary.contract.ts
      - run: npx tsx src/data/v2LiveMutation.contract.ts
      - run: npx vite build
