name: TEMP Audit Explore shared data 20260909

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-audit-explore-shared-data-20260909.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare canonical row keys read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/explore-audit"
          cat > "$RUNNER_TEMP/explore-audit/worker.mjs" <<'JS'
          const TABLES = {
            tracks:['id'], comments:['id'], curated_picks:['collection_key','track_id'], explore_curators:['uid'],
            follows:['follower_uid','following_uid'], likes:['track_id','user_uid'], profile_stats:['uid'],
            public_folders:['id'], public_folder_tracks:['folder_id','track_id'], public_profiles:['uid'],
            track_stats:['track_id'], track_tags:['track_id','kind','value']
          };
          const qi = v => '"'+String(v).replaceAll('"','""')+'"';
          const keyOf = (row, keys) => keys.map(k=>JSON.stringify(row[k]??null)).join('|');
          async function load(db, table, keys) {
            const r=await db.prepare('SELECT * FROM '+qi(table)).all();
            const rows=r.results||[]; const map=new Map();
            for(const row of rows) map.set(keyOf(row,keys),row);
            return map;
          }
          function relation(a,b) {
            let aOnly=0,bOnly=0,common=0,different=0,aNewer=0,bNewer=0;
            for(const [k,av] of a) {
              if(!b.has(k)){aOnly++;continue;} common++;
              const bv=b.get(k); if(JSON.stringify(av)!==JSON.stringify(bv)){
                different++;
                const au=Number(av.updated_at||0),bu=Number(bv.updated_at||0);
                if(au>bu)aNewer++; else if(bu>au)bNewer++;
              }
            }
            for(const k of b.keys()) if(!a.has(k)) bOnly++;
            return {aOnly,bOnly,common,different,aNewer,bNewer};
          }
          export default { async fetch(req,env){
            if(new URL(req.url).pathname!='/audit'||req.headers.get('X-Audit')!==env.AUDIT_KEY)return new Response('not found',{status:404});
            const out={};
            for(const [table,keys] of Object.entries(TABLES)){
              const [p,v,t]=await Promise.all([load(env.PROD_DB,table,keys),load(env.PREVIEW_DB,table,keys),load(env.TEST_DB,table,keys)]);
              out[table]={counts:{production:p.size,preview:v.size,test:t.size},prod_vs_preview:relation(p,v),preview_vs_test:relation(v,t)};
            }
            return Response.json(out);
          }};
          JS
          cat > "$RUNNER_TEMP/explore-audit/wrangler.jsonc" <<'JSON'
          {
            "name":"soridraw-explore-audit-temp",
            "main":"worker.mjs",
            "compatibility_date":"2026-06-24",
            "d1_databases":[
              {"binding":"PROD_DB","database_name":"soridraw-explore-db","database_id":"217ef5b1-5d80-4f7c-afc7-9e07eb05c06b","remote":true},
              {"binding":"PREVIEW_DB","database_name":"soridraw-explore-preview-db","database_id":"aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f","remote":true},
              {"binding":"TEST_DB","database_name":"soridraw-explore-test-db","database_id":"31817dbd-d06e-415e-9bc0-5553b0f5dc43","remote":true}
            ],
            "vars":{"AUDIT_KEY":"soridraw-audit-20260909-shared-data"}
          }
          JSON
          cd "$RUNNER_TEMP/explore-audit"
          npx --yes wrangler@4.102.0 dev --config wrangler.jsonc --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          pid=$!; trap 'kill $pid >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS -H 'X-Audit: soridraw-audit-20260909-shared-data' http://127.0.0.1:8787/audit -o audit.json; then break; fi
            sleep 2
          done
          test -s audit.json || { cat wrangler-dev.log; exit 1; }
          node - <<'NODE'
          const a=require('./audit.json');
          for(const [table,x] of Object.entries(a)) console.log(table.toUpperCase()+' '+JSON.stringify(x));
          const dangerous=Object.entries(a).filter(([t,x])=>x.prod_vs_preview.aOnly>0).map(([t,x])=>({table:t,prodOnly:x.prod_vs_preview.aOnly}));
          console.log('PROD_ONLY_ROWS='+JSON.stringify(dangerous));
          NODE
