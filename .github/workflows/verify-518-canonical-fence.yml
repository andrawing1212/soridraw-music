      - 'scripts/verify-518-explore-account-budget.mjs'
      - 'scripts/verify-518-account-d1-cutover.mjs'
      - 'scripts/verify-518-legacy-release-gate.mjs'
      - 'scripts/verify-518-account-release-preflight.mjs'
      - 'scripts/verify-518-account-release-preflight-test.mjs'
      - 'scripts/verify-518-protected-restore-compensation.mjs'
