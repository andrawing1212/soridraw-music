name: TEMP 108 Wire R2 Snapshot

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-108-wire-r2-snapshot.trigger'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Wire client and verifier
        run: python3 scripts/temp-108-wire-r2-snapshot.py
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: |
          node --check cloudflare/explore-worker/canonical/preview-entry.js
          node scripts/verify-108-explore-feed-cache-recovery.mjs
          node scripts/verify-107-explore-direct-count-zero-read.mjs
          node scripts/verify-105-explore-like-1min.mjs
          node scripts/verify-103-explore-like-event-batch.mjs
          node scripts/verify-102-explore-public-like-parity.mjs
          npx tsc --noEmit
          npm run build
      - name: Commit candidate and self-clean
        run: |
          set -euo pipefail
          rm -f scripts/temp-108-wire-r2-snapshot.py
          rm -f .github/workflows/temp-108-wire-r2-snapshot.yml
          rm -f .deploy/temp-108-wire-r2-snapshot.trigger
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git commit -m 'fix: use D1-zero R2 snapshot for Explore recovery'
          git push origin HEAD:preview
