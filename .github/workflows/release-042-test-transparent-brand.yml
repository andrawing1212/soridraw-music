name: SORIDRAW 042 TEST Transparent Brand

on:
  push:
    branches: [release-042-test-transparent-brand]
    paths: ['.github/workflows/release-042-test-transparent-brand.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soridraw-042-test-transparent-brand
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAIN_BASE: edae66666b88f4fa80d2a80e49c2b42c55e71214
      PREVIEW_BASE: 3a7de5fe6afa90833acbda233aff78c549eb9183
      FIREBASE_PROJECT: soridraw
    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover verified blue transparent source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/042-test-source.b64 > "$RUNNER_TEMP/test-blue-source.png"
          echo 'e8598062a9ca0322a1c29c05790617435487c2f8c93abbf828d54b0fd780db8d  '"$RUNNER_TEMP/test-blue-source.png" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          import os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'test-blue-source.png')
          im = Image.open(p).convert('RGBA')
          assert im.getchannel('A').getpixel((0, 0)) == 0
          assert im.getchannel('A').getbbox()
          print('TEST_BLUE_SOURCE_042=PASS')
          PY

      - name: Checkout guarded main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main preview --quiet
          test "$(git rev-parse origin/main)" = "$MAIN_BASE"
          test "$(git rev-parse origin/preview)" = "$PREVIEW_BASE"
          git checkout -B test-042-work origin/main

      - name: Apply TEST transparent brand and update notice
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, os, re

          src = Image.open(Path(os.environ['RUNNER_TEMP']) / 'test-blue-source.png').convert('RGBA')
          alpha = src.getchannel('A')
          bbox = alpha.getbbox()
          if not bbox or alpha.getpixel((0,0)) != 0:
              raise SystemExit('invalid transparent TEST source')
          crop = src.crop(bbox)

          def render(size: int, fill: float = 0.94):
              max_side = int(round(size * fill))
              scale = min(max_side / crop.width, max_side / crop.height)
              w = max(1, int(round(crop.width * scale)))
              h = max(1, int(round(crop.height * scale)))
              piece = crop.resize((w, h), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (0,0,0,0))
              canvas.alpha_composite(piece, ((size-w)//2, (size-h)//2))
              return canvas

          brand = Path('public/brand')
          brand.mkdir(parents=True, exist_ok=True)
          outputs = {
              'soridraw-favicon-test-042.png': 96,
              'soridraw-app-test-042.png': 192,
              'soridraw-app-test-042-256.png': 256,
              'soridraw-app-test-042-512.png': 512,
          }
          for name, size in outputs.items():
              im = render(size)
              im.save(brand / name, format='PNG', optimize=False)
              a = im.getchannel('A')
              b = a.getbbox()
              if a.getpixel((0,0)) != 0 or not b or max(b[2]-b[0], b[3]-b[1]) < int(size * 0.90):
                  raise SystemExit(f'bad TEST icon {name}: {b}')

          render(256).save(
              brand / 'soridraw-test-042.ico',
              format='ICO',
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )

          manifest_path = Path('public/manifest.test.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = 'SORIDRAW(T)'
          manifest['short_name'] = 'SORIDRAW(T)'
          manifest['icons'] = [
              {'src':'/brand/soridraw-app-test-042.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'/brand/soridraw-app-test-042-256.png','sizes':'256x256','type':'image/png','purpose':'any'},
              {'src':'/brand/soridraw-app-test-042-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('public/app-version.json').write_text(json.dumps({'version':'042'}, indent=2) + '\n', encoding='utf-8')

          update_service = Path('src/services/appUpdateNotice.ts')
          update_service.write_text("""const CURRENT_APP_VERSION = '042';
const VERSION_URL = '/app-version.json';
const NOTICE_ID = 'soridraw-app-update-notice';
const MIN_CHECK_INTERVAL_MS = 30_000;
let started = false;
let lastCheckedAt = 0;

const showUpdateNotice = () => {
  if (document.getElementById(NOTICE_ID)) return;
  const button = document.createElement('button');
  button.id = NOTICE_ID;
  button.type = 'button';
  button.textContent = '새 업데이트 · 적용';
  button.setAttribute('aria-label', '새 업데이트 적용');
  Object.assign(button.style, {
    position: 'fixed', top: 'max(12px, env(safe-area-inset-top))', right: '12px',
    zIndex: '2147483646', border: '0', borderRadius: '999px', padding: '9px 13px',
    background: '#ffb400', color: '#151515', fontSize: '12px', fontWeight: '700',
    lineHeight: '1', cursor: 'pointer', boxShadow: '0 4px 16px rgba(0,0,0,.22)'
  });
  button.addEventListener('click', () => window.location.reload());
  document.body.appendChild(button);
};

const checkForUpdate = async (force = false) => {
  const now = Date.now();
  if (!force && now - lastCheckedAt < MIN_CHECK_INTERVAL_MS) return;
  lastCheckedAt = now;
  try {
    const response = await fetch(`${VERSION_URL}?t=${now}`, { cache: 'no-store' });
    if (!response.ok) return;
    const payload = await response.json() as { version?: string | number };
    const remoteVersion = String(payload?.version || '').trim();
    if (remoteVersion && remoteVersion !== CURRENT_APP_VERSION) showUpdateNotice();
  } catch {
    // Offline/network errors stay silent and retry on the next app return.
  }
};

export const startAppUpdateNotice = () => {
  if (started || typeof window === 'undefined') return;
  started = true;
  void checkForUpdate(true);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') void checkForUpdate();
  });
  window.addEventListener('focus', () => void checkForUpdate());
};
""", encoding='utf-8')

          main_path = Path('src/main.tsx')
          mt = main_path.read_text(encoding='utf-8')
          anchor = "import { startPreviewVersionSignal } from './services/versionSignalService';\n"
          if "startAppUpdateNotice" not in mt:
              if anchor not in mt:
                  raise SystemExit('main.tsx import anchor missing')
              mt = mt.replace(anchor, anchor + "import { startAppUpdateNotice } from './services/appUpdateNotice';\n", 1)
              mt = mt.replace('void startPreviewVersionSignal();\n', 'void startPreviewVersionSignal();\nstartAppUpdateNotice();\n', 1)
          main_path.write_text(mt, encoding='utf-8')

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')
          text = text.replace("<title>SORIDRAW's Studio</title>", '<title>SORIDRAW(T)</title>', 1)
          text = text.replace(
              '<meta name="apple-mobile-web-app-title" content="SORIDRAW" />',
              '<meta id="soridraw-apple-app-title" name="apple-mobile-web-app-title" content="SORIDRAW(T)" />\n    <meta id="soridraw-application-name" name="application-name" content="SORIDRAW(T)" />',
              1,
          )
          pattern = re.compile(r'\s*<!-- 036: environment-specific app icon / favicon -->.*?document\.documentElement\.dataset\.soridrawEnvironment = environment;\n\s*\}\)\(\);\n\s*</script>', re.S)
          replacement = r'''
    <!-- 042: TEST transparent app icon / favicon + environment names -->
    <link id="soridraw-favicon" rel="icon" type="image/png" sizes="96x96" href="/brand/soridraw-favicon-test-042.png" />
    <link id="soridraw-shortcut-icon" rel="shortcut icon" type="image/x-icon" href="/brand/soridraw-test-042.ico" />
    <link id="soridraw-apple-touch-icon" rel="apple-touch-icon" sizes="192x192" href="/brand/soridraw-app-test-042.png" />
    <link id="soridraw-manifest" rel="manifest" href="/manifest.test.json" crossorigin="use-credentials" />
    <script>
      (function() {
        var host = String(window.location.hostname || '').toLowerCase();
        var environment = 'preview';
        if (host === 'soridraw.com' || host === 'www.soridraw.com' || host === 'soridraw.web.app') {
          environment = 'production';
        } else if (host === 'test.soridraw.com' || host === 'soridraw-test.web.app') {
          environment = 'test';
        }
        var appName = environment === 'production' ? 'SORIDRAW' : environment === 'test' ? 'SORIDRAW(T)' : 'SORIDRAW(P)';
        document.title = appName;
        var appleTitle = document.getElementById('soridraw-apple-app-title');
        var applicationName = document.getElementById('soridraw-application-name');
        if (appleTitle) appleTitle.setAttribute('content', appName);
        if (applicationName) applicationName.setAttribute('content', appName);
        var favicon = document.getElementById('soridraw-favicon');
        var shortcutIcon = document.getElementById('soridraw-shortcut-icon');
        var appleTouchIcon = document.getElementById('soridraw-apple-touch-icon');
        var manifest = document.getElementById('soridraw-manifest');
        if (environment === 'test') {
          if (favicon) { favicon.type = 'image/png'; favicon.href = '/brand/soridraw-favicon-test-042.png'; }
          if (shortcutIcon) { shortcutIcon.type = 'image/x-icon'; shortcutIcon.href = '/brand/soridraw-test-042.ico'; }
          if (appleTouchIcon) appleTouchIcon.href = '/brand/soridraw-app-test-042.png';
          if (manifest) manifest.href = '/manifest.test.json';
        } else {
          var fallbackFavicon = environment === 'production' ? '/brand/soridraw-favicon-production.svg?v=036' : '/brand/soridraw-favicon-preview.png?v=036';
          var fallbackType = environment === 'production' ? 'image/svg+xml' : 'image/png';
          if (favicon) { favicon.type = fallbackType; favicon.href = fallbackFavicon; }
          if (shortcutIcon) { shortcutIcon.type = fallbackType; shortcutIcon.href = fallbackFavicon; }
          if (appleTouchIcon) appleTouchIcon.href = '/brand/soridraw-app-' + environment + '.png?v=036';
          if (manifest) manifest.href = '/manifest.' + environment + '.json?v=036';
        }
        document.documentElement.dataset.soridrawEnvironment = environment;
        document.documentElement.dataset.soridrawAppName = appName;
      })();
    </script>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'index branding block replacement count={count}')
          index_path.write_text(text, encoding='utf-8')
          PY

          grep -F 'SORIDRAW(T)' public/manifest.test.json
          grep -F 'soridraw-app-test-042-512.png' public/manifest.test.json
          grep -F 'soridraw-favicon-test-042.png' index.html
          grep -F 'soridraw-test-042.ico' index.html
          grep -F '"042"' public/app-version.json
          grep -F "CURRENT_APP_VERSION = '042'" src/services/appUpdateNotice.ts
          echo 'APPLY_TEST_042=PASS'

      - name: Validate scope, TypeScript, build and regression
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$MAIN_BASE" -- src/App.tsx
          git diff --name-only "$MAIN_BASE" | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          index.html
          public/app-version.json
          public/brand/soridraw-app-test-042-256.png
          public/brand/soridraw-app-test-042-512.png
          public/brand/soridraw-app-test-042.png
          public/brand/soridraw-favicon-test-042.png
          public/brand/soridraw-test-042.ico
          public/manifest.test.json
          src/main.tsx
          src/services/appUpdateNotice.ts
          EOF
          sort -o "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/allowed.txt"
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/changed.txt"
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-033-explore-feed-revision.mjs
          echo 'VALIDATE_TEST_042=PASS'

      - name: Commit and push main for TEST
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release@users.noreply.github.com'
          git add index.html src/main.tsx src/services/appUpdateNotice.ts public/app-version.json public/manifest.test.json public/brand/soridraw-app-test-042.png public/brand/soridraw-app-test-042-256.png public/brand/soridraw-app-test-042-512.png public/brand/soridraw-favicon-test-042.png public/brand/soridraw-test-042.ico
          git commit -m 'feat(test): add update notice and transparent blue brand'
          FINAL_SHA="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_BASE"
          git push origin HEAD:refs/heads/main
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase TEST only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-test.json --non-interactive
          echo 'FIREBASE_TEST_042=PASS'

      - name: Verify live TEST and production untouched
        shell: bash
        run: |
          set -euo pipefail
          origin='https://test.soridraw.com'
          for attempt in $(seq 1 15); do
            curl -fsS -H 'Cache-Control: no-cache' "$origin/app-version.json?t=$attempt" -o "$RUNNER_TEMP/version.json" || true
            grep -Fq '042' "$RUNNER_TEMP/version.json" && break
            sleep 4
          done
          grep -Fq '042' "$RUNNER_TEMP/version.json"
          curl -fsS -H 'Cache-Control: no-cache' "$origin/" -o "$RUNNER_TEMP/index.html"
          grep -Fq 'SORIDRAW(T)' "$RUNNER_TEMP/index.html"
          grep -Fq 'soridraw-favicon-test-042.png' "$RUNNER_TEMP/index.html"
          curl -fsS -H 'Cache-Control: no-cache' "$origin/manifest.test.json?t=042" -o "$RUNNER_TEMP/live-manifest.json"
          cmp public/manifest.test.json "$RUNNER_TEMP/live-manifest.json"
          for f in soridraw-app-test-042.png soridraw-app-test-042-256.png soridraw-app-test-042-512.png soridraw-favicon-test-042.png soridraw-test-042.ico; do
            curl -fsS -H 'Cache-Control: no-cache' "$origin/brand/$f?t=042" -o "$RUNNER_TEMP/$f"
            cmp "public/brand/$f" "$RUNNER_TEMP/$f"
          done
          curl -fsS -H 'Cache-Control: no-cache' 'https://soridraw.com/' -o "$RUNNER_TEMP/prod-index.html"
          if grep -Fq 'soridraw-app-test-042' "$RUNNER_TEMP/prod-index.html"; then
            echo 'production unexpectedly contains TEST 042 assets' >&2
            exit 1
          fi
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_BASE"
          echo 'LIVE_TEST_042=PASS'

      - name: Package deployed TEST ZIP
        shell: bash
        run: |
          set -euo pipefail
          zipname="SORIDRAW_042_TEST_${FINAL_SHA:0:8}_2026-09-08.zip"
          git archive --format=zip --output="$RUNNER_TEMP/$zipname" "$FINAL_SHA"
          unzip -t "$RUNNER_TEMP/$zipname" >/dev/null
          echo "ZIP_PATH=$RUNNER_TEMP/$zipname" >> "$GITHUB_ENV"

      - name: Upload TEST ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_042_TEST_${{ env.FINAL_SHA }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
