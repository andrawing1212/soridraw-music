name: Update 106 Release State Docs

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/update-106-release-docs.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Update docs
        run: python3 .deploy/update-106-release-docs.py
      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md
          git diff --cached --quiet && { echo 'No docs change'; exit 1; }
          git commit -m 'docs: record Explore public-count separation 106'
          git push origin HEAD:preview
          echo "FINAL_DOC_COMMIT=$(git rev-parse HEAD)"
