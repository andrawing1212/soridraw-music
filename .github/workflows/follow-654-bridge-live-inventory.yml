name: SORIDRAW APP654 read-only actual Follow bridge inventory
on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths: ['.github/workflows/follow-654-bridge-live-inventory.yml']
permissions:
  contents: read
concurrency:
  group: soridraw-app654-bridge-inventory
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'andrawing1212/soridraw-music' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inventory active Cloudflare metadata and Firebase function source (GET only)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview
          python3 - <<'PY'
          import json,os,re,subprocess,tempfile,urllib.request,urllib.error,zipfile
          from pathlib import Path
          A='e1a30fc9ef497fda1d34f4ab3dc1da45'
          PROJECT='soridraw-app-866a5'
          EX='soridraw-explore-preview'
          OW='soridraw-owner-follow-preview-candidate'
          EXPECTED='02576623-2172-4922-85b8-3f08a5216653'
          ZERO='6b13cde4-4a53-42d2-873f-361f7cf5a931'
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          assert len(token)>20 and os.environ.get('CLOUDFLARE_ACCOUNT_ID')==A
          def get(p):
            u='https://api.cloudflare.com/client/v4/accounts/'+A+'/'+p
            req=urllib.request.Request(u,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=25) as f: x=json.load(f)
            if x.get('success') is not True:raise RuntimeError('CF_RESPONSE_NOT_OK')
            return x.get('result') or {}
          cf='HOLD'
          try:
            dp=get('workers/scripts/'+EX+'/deployments?per_page=1')
            v=(dp.get('deployments') or [{}])[0].get('versions') or []
            a=next((i.get('version_id') for i in v if i.get('percentage')==100),None)
            z=next((i.get('version_id') for i in v if i.get('percentage')==0),None)
            print('APP654_ACTIVE_PREVIEW_VERSION='+str(a))
            print('APP654_ZERO_VERSION='+str(z))
            if not a:raise RuntimeError('NO_ACTIVE')
            info=get('workers/scripts/'+EX+'/versions/'+a)
            b=(info.get('resources') or {}).get('bindings') or []
            m={x.get('name'):x for x in b}
            flag=lambda k:m.get(k,{}).get('text','ABSENT')
            print('APP654_PREVIEW_BINDINGS_COUNT='+str(len(b)))
            print('APP654_BRIDGE_READY_607='+str(flag('SORIDRAW_OWNER_FOLLOW_BRIDGE_READY_607')))
            print('APP654_STANDALONE_600='+str(flag('SORIDRAW_OWNER_DO_STANDALONE_600')))
            print('APP654_OWNER_SERVICE_BOUND='+str('OWNER_FOLLOW_RESERVATION_SERVICE_600' in m))
            print('APP654_OWNER_RECEIVER_READY='+str(flag('SORIDRAW_OWNER_FOLLOW_RECEIVER_VERIFIED_607')))
            print('APP654_OWNER_CANARY_SET='+str('SORIDRAW_OWNER_FOLLOW_CANARY_UID_574' in m))
            owner=get('workers/scripts/'+OW+'/deployments?per_page=1')
            ov=(owner.get('deployments') or [{}])[0].get('versions') or []
            print('APP654_STANDALONE_ACTIVE='+str(next((x.get('version_id') for x in ov if x.get('percentage')==100),'NONE')))
            cf='PASS' if a==EXPECTED and z==ZERO and len(b)==35 else 'DRIFT'
          except Exception as err:
            print('APP654_CF_GET_ONLY=HOLD_'+type(err).__name__)
          print('APP654_CF_TOPOLOGY='+cf)
          names=[
            ('publishExploreOwnerFollower542','exploreOwnerFollowerWebhook542','APP542_OWNER_HTTP_COMPILED_OPEN'),
            ('enrollOwnerFollow544Candidate','ownerFollowEnrollment544','APP544_ENROLLMENT_COMPILED_OPEN'),
            ('verifyOwnerFollowEpoch547Candidate','ownerFollowAuthProof547','APP547_AUTH_PROOF_COMPILED_OPEN'),
          ]
          def gcloud(*args):
            return subprocess.run(['gcloud',*args],capture_output=True,text=True,timeout=60)
          # Capability checks only: testIamPermissions does not modify IAM.
          access=gcloud('auth','print-access-token')
          if access.returncode:raise RuntimeError('GCP_ACCESS_TOKEN_UNAVAILABLE')
          bearer=access.stdout.strip()
          issues=[]
          def google_json(url,body=None):
            req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),
              headers={'Authorization':'Bearer '+bearer,'Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          def permissions(label,url,wanted):
            try:
              granted=set(google_json(url,{'permissions':wanted}).get('permissions',[]))
              missing=sorted(set(wanted)-granted)
              print('APP654_IAM_'+label+'_MISSING='+(','.join(missing) or 'NONE'))
              if missing:issues.append('IAM_'+label)
              return not missing
            except urllib.error.HTTPError as error:
              try: detail=json.load(error).get('error',{})
              except Exception: detail={}
              print('APP654_IAM_'+label+'_HTTP='+str(error.code))
              print('APP654_IAM_'+label+'_ERROR='+str(detail.get('message','UNKNOWN'))[:1200])
              issues.append('IAM_CHECK_'+label)
            except Exception as error:
              print('APP654_IAM_'+label+'_CHECK_HOLD='+type(error).__name__)
              issues.append('IAM_CHECK_'+label)
          permissions('PROJECT','https://cloudresourcemanager.googleapis.com/v1/projects/'+PROJECT+':testIamPermissions',
            ['cloudfunctions.functions.sourceCodeSet','cloudfunctions.operations.get'])
          all_flags=[]
          runtime_accounts=set()
          with tempfile.TemporaryDirectory(prefix='soridraw654-') as directory:
            for name,base,symbol in names:
              result=gcloud('functions','describe',name,'--gen2','--region=asia-northeast3',
                            '--project='+PROJECT,'--format=json')
              if result.returncode:
                print('APP654_FN_'+name+'=METADATA_ACCESS_HOLD')
                all_flags.append('UNKNOWN')
                continue
              f=json.loads(result.stdout)
              permissions(name,'https://cloudfunctions.googleapis.com/v2/'+f['name']+':testIamPermissions',
                ['cloudfunctions.functions.get','cloudfunctions.functions.update','cloudfunctions.functions.sourceCodeGet'])
              account=(f.get('serviceConfig') or {}).get('serviceAccountEmail')
              if account:runtime_accounts.add(account)
              env=(f.get('serviceConfig') or {}).get('environmentVariables') or {}
              print('APP654_FN_'+name+'_ACTIVE='+str(f.get('state')=='ACTIVE'))
              print('APP654_FN_'+name+'_UPDATED='+str(f.get('updateTime','UNKNOWN')))
              print('APP654_FN_'+name+'_READY='+str(env.get('SORIDRAW_OWNER_FOLLOW_READY_608')=='1'))
              print('APP654_FN_'+name+'_CANARY_SET='+str(bool(env.get('SORIDRAW_OWNER_FOLLOW_CANARY_UID_574'))))
              print('APP654_FN_'+name+'_GENERAL='+str(env.get('SORIDRAW_OWNER_FOLLOW_GENERAL_PREVIEW_653')=='1'))
              source=((f.get('buildConfig') or {}).get('source') or {}).get('storageSource') or {}
              bucket,object_name=source.get('bucket',''),source.get('object','')
              flag='UNKNOWN'
              if bucket and object_name:
                dest=str(Path(directory)/('source-'+name+'.zip'))
                got=subprocess.run(['gcloud','storage','cp','gs://'+bucket+'/'+object_name,dest,'--quiet'],
                                    stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=90)
                if got.returncode:
                  flag='SOURCE_ARCHIVE_READ_HOLD'
                else:
                  try:
                    with zipfile.ZipFile(dest) as archive:
                      candidate=next((p for p in archive.namelist() if any(
                        p.endswith('/'+s+'/'+base+ext) or p==s+'/'+base+ext
                        for s in ('src','lib') for ext in ('.ts','.js'))),None)
                      if candidate:
                        code=archive.read(candidate).decode('utf8','replace')
                        print('APP654_FN_'+name+'_GENERAL_SCOPE_CODE='+str('ownerFollowScope653' in code))
                        m=re.search(r'\b'+re.escape(symbol)+r'\s*=\s*(true|false)\b',code)
                        flag=m.group(1).upper() if m else 'FLAG_NOT_FOUND'
                      else:flag='SOURCE_FILE_NOT_FOUND'
                  except Exception:flag='SOURCE_ARCHIVE_FORMAT_HOLD'
              else:flag='SOURCE_ARCHIVE_NOT_LISTED'
              all_flags.append(flag)
              print('APP654_FN_'+name+'_DEPLOYED_COMPILED='+flag)
          print('APP654_ALL_THREE_FUNCTIONS_COMPILED_ON='+str(all(x=='TRUE' for x in all_flags)))
          project_act_as=permissions('PROJECT_ACT_AS','https://cloudresourcemanager.googleapis.com/v1/projects/'+PROJECT+':testIamPermissions',
            ['iam.serviceAccounts.actAs'])
          for account in ([] if project_act_as else sorted(runtime_accounts)):
            print('APP654_RUNTIME_ACCOUNT='+account)
            permissions('RUNTIME_ACT_AS','https://iam.googleapis.com/v1/projects/'+PROJECT+'/serviceAccounts/'+account+':testIamPermissions',
              ['iam.serviceAccounts.actAs'])
          for script in ['soridraw-explore-test','soridraw-explore-api']:
            versions=(get('workers/scripts/'+script+'/deployments?per_page=1').get('deployments') or [{}])[0].get('versions') or []
            print('APP654_PROTECTED_'+script+'='+json.dumps(versions,sort_keys=True))
          try:
            rules=google_json('https://soridraw-app-866a5-default-rtdb.firebaseio.com/.settings/rules.json')
            owner_rule=(rules.get('rules') or {}).get('ownerFollowerSync532')
            print('APP654_RTDB_OWNER_RULE='+json.dumps(owner_rule,sort_keys=True))
            if not owner_rule:issues.append('RTDB_OWNER_RULE_MISSING')
          except Exception as error:
            print('APP654_RTDB_RULE_READ_HOLD='+type(error).__name__)
            issues.append('RTDB_RULE_READ')
          print('APP654_READ_ONLY_NO_IAM_FUNCTION_WORKER_DB_OR_USER_MUTATION=PASS')
          if cf!='PASS':issues.append('CF_TOPOLOGY')
          if not all(x=='TRUE' for x in all_flags):issues.append('FUNCTION_SOURCE')
          if issues:raise SystemExit('APP654_RELEASE_CAPABILITY_HOLD='+','.join(issues))
          PY

  active-source:
    if: github.repository == 'andrawing1212/soridraw-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read only the exact active owner bridge source modules
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview
          python3 - <<'PYCODE'
          import base64,json,os,urllib.request,hashlib
          from pathlib import Path
          account='e1a30fc9ef497fda1d34f4ab3dc1da45'
          token=os.environ['CLOUDFLARE_API_TOKEN']
          targets={'soridraw-explore-preview':'02576623-2172-4922-85b8-3f08a5216653',
                   'soridraw-owner-follow-preview-candidate':'e679a602-44fb-4b4d-9e4d-7878c00b68c3'}
          out=Path(os.environ['RUNNER_TEMP'])/'owner-active-source'
          out.mkdir()
          def get(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/'+path,
              headers={'Authorization':'Bearer '+token})
            with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
            assert result.get('success') is True
            return result['result']
          for script,version in targets.items():
            deployed=get('workers/scripts/'+script+'/deployments?per_page=1')['deployments'][0]['versions']
            assert any(x['version_id']==version and x['percentage']==100 for x in deployed)
            modules=get('workers/workers/'+script+'/versions/'+version+'?include=modules')['modules']
            # Source modules only. NEVER export bindings, env, secrets or auth files.
            safe=[]
            for module in modules:
              if script=='soridraw-explore-preview' and module['name']!='owner-follow-entry-607.mjs':continue
              data=base64.b64decode(module['content_base64'])
              safe.append({'name':module['name'],'sha256':hashlib.sha256(data).hexdigest(),
                           'content':data.decode('utf8')})
            assert safe
            (out/(script+'.json')).write_text(json.dumps({'version':version,'modules':safe}))
            print('ACTIVE_SOURCE_READ_ONLY='+script+';version='+version+';modules='+str(len(safe)))
          # APP660: the staged module hashes match, but the deployment checker
          # reported RUNTIME_CHANGED. Print metadata ONLY; no bindings/secrets.
          old_runtime=(get('workers/scripts/soridraw-explore-preview/versions/02576623-2172-4922-85b8-3f08a5216653').get('resources') or {}).get('script_runtime') or {}
          new_runtime=(get('workers/scripts/soridraw-explore-preview/versions/a2e6390d-c879-4e31-83e3-dee8046cb6ed').get('resources') or {}).get('script_runtime') or {}
          print('APP660_RUNTIME_READONLY_COMPARE='+json.dumps({'active':old_runtime,'staged':new_runtime,'exact':old_runtime==new_runtime},sort_keys=True))
          # APP660: investigate the exact inactive stage; no deployment mutation.
          for version in ['02576623-2172-4922-85b8-3f08a5216653','a2e6390d-c879-4e31-83e3-dee8046cb6ed']:
            for include in ['modules','modules,sourcemaps']:
              source=get('workers/workers/soridraw-explore-preview/versions/'+version+'?include='+include)
              modules=source.get('modules') or []
              summary=[{'name':m.get('name'),'type':m.get('content_type'),'sha256':hashlib.sha256(base64.b64decode(m.get('content_base64',''))).hexdigest()} for m in modules]
              print('APP660_SOURCE_INVENTORY='+json.dumps({'version':version,'include':include,'main':source.get('main_module'),'keys':sorted(source),'modules':summary}))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: owner-active-source
          path: ${{ runner.temp }}/owner-active-source/*.json
          retention-days: 1
          if-no-files-found: error
