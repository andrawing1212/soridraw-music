name: TEMP 361 Publication D1 Read Schema Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-361-publication-read-schema-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only publication schema and plans
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          C="$PWD/canonical/wrangler.preview.jsonc"
          node "$W" d1 execute DB --remote --config "$C" --command "SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE (type='trigger' AND tbl_name IN ('tracks','explore_derived_tracks','explore_shared_revision')) OR (type='index' AND tbl_name='tracks') ORDER BY type,tbl_name,name" --json > "$RUNNER_TEMP/publication-schema.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/publication-schema.json','utf8')).flatMap(x=>x.results||[]);
          for (const r of rows) {
            console.log('PUB361_SCHEMA '+r.type+' '+r.tbl_name+' '+r.name);
            if (r.type==='trigger') console.log('PUB361_DDL '+r.name+' '+String(r.sql||'').replace(/\s+/g,' ').trim());
          }
          console.log('PUB361_SCHEMA_OBJECTS='+rows.length);
          NODE
          for sql in             "UPDATE tracks SET is_public=1,updated_at=1 WHERE id='__probe__' AND owner_uid='__probe__' AND source_type='music_note' AND is_public<>1"             "UPDATE tracks SET cover_url='',duration_seconds=1,suno_url_primary='https://probe',suno_url_secondary=NULL,updated_at=1 WHERE id='__probe__' AND owner_uid='__probe__' AND source_type='music_note'"             "UPDATE tracks SET is_public=0,updated_at=1 WHERE id='__probe__' AND owner_uid='__probe__' AND source_type='music_note' AND is_public<>0"; do
            node "$W" d1 execute DB --remote --config "$C" --command "EXPLAIN QUERY PLAN $sql" --json
          done
          echo 'PUB361_SHARED_D1_WRITES=0'
          echo 'PUB361_USER_DATA_READ=0'
