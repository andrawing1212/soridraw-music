name: SORIDRAW Backend V2 Step 2-A4a CI
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2-a4a-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts fake-indexeddb@6.2.5
      - run: npx tsx src/data/v2LiveMutation.contract.ts
      - run: npx tsx src/data/indexedDbMirrorOutbox.contract.ts
      - run: npx tsx src/data/indexedDbLocalCache.contract.ts
      - run: npx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --types node src/data/v2LiveMutation.ts src/data/v2LiveMutation.contract.ts src/data/indexedDbMirrorOutbox.ts src/data/indexedDbMirrorOutbox.contract.ts src/data/indexedDbLocalCache.ts src/data/indexedDbLocalCache.contract.ts src/data/v2Schema.ts
      - run: npx vite build
