name: SORIDRAW M-005 Final Docs Cleanup

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m005-final-doc-cleanup.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0

      - name: Finalize M-005 Master and maintenance docs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          master = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          backlog = Path('docs/SORIDRAW_MAINTENANCE_BACKLOG.md')

          m = master.read_text(encoding='utf-8')
          m = re.sub(
              r'^Status: .*$',
              'Status: IMPLEMENTATION / Step 4 Preview validation IN PROGRESS — M-005 authenticated Preview post-check PASSED and the completed-but-zero-byte Suno audio blocker is CLOSED; current Library visibility/freshness, byte-validated audio response, independent audio/* MIME/readable-byte probe and Firestore result are verified; remaining Step 4 items continue separately',
              m,
              count=1,
              flags=re.M,
          )
          anchor = 'M-005 Suno Library read-only rediagnosis: `docs/SORIDRAW_MAINTENANCE_M005_SUNO_LIBRARY_READONLY_REDIAGNOSIS.md`.'
          addition = '\nM-005 final authenticated Preview post-check: `docs/SORIDRAW_MAINTENANCE_M005_FINAL_AUTHENTICATED_POSTCHECK_RESULT.md`.'
          if addition.strip() not in m and anchor in m:
              m = m.replace(anchor, anchor + addition, 1)
          master.write_text(m, encoding='utf-8')

          b = backlog.read_text(encoding='utf-8')
          b = re.sub(
              r'^Status: .*$',
              'Status: ACTIVE / STEP 2-A4 COMPLETE / STEP 4 IN PROGRESS / M-005 CLOSED AFTER REAL PREVIEW AUTHENTICATED AUDIO POST-CHECK',
              b,
              count=1,
              flags=re.M,
          )
          b = re.sub(
              r'- M-005 provider media: \*\*OPEN\*\*.*$',
              '- M-005 provider media: **PASS / CLOSED** — real Preview login session returned HTTP 200 from `getSunoTrackStatus`, `audioValidationStatus: verified`, two verified audio candidates, and an independent HTTP 206 `audio/mp3` probe with readable bytes; Firestore matched the verified result',
              b,
              count=1,
              flags=re.M,
          )
          b = re.sub(
              r'- deployed `getSunoTrackStatus`:.*$',
              '- deployed `getSunoTrackStatus`: hardened target verified by the final real Preview login-session post-check; no additional Functions deployment was performed during final cleanup',
              b,
              count=1,
              flags=re.M,
          )
          b = re.sub(
              r'Therefore the current Step 4 pre-gate blocker is narrowed to \*\*M-005 provider completed-but-zero-byte audio handling\*\*\..*?M-005 evidence: `docs/SORIDRAW_MAINTENANCE_M005_SUNO_LIBRARY_READONLY_REDIAGNOSIS.md`\.',
              'M-005 is now **CLOSED** for the Step 4 Suno Library playback/visibility pre-gate. The current source-to-Library-bundle/version path is healthy, and the final real Preview login-session post-check verified `getSunoTrackStatus` HTTP 200, `audioValidationStatus: verified`, independent HTTP 206 `audio/mp3` with readable bytes, and a matching Firestore result. New music generation and credit-consuming generation were both 0.\n\nThe separate legacy/public-record `ownerUid` Auth fallback compatibility risk was intentionally not changed in M-005 and is tracked as M-011.\n\nM-005 evidence: `docs/SORIDRAW_MAINTENANCE_M005_SUNO_LIBRARY_READONLY_REDIAGNOSIS.md` and `docs/SORIDRAW_MAINTENANCE_M005_FINAL_AUTHENTICATED_POSTCHECK_RESULT.md`.',
              b,
              count=1,
              flags=re.S,
          )
          b = re.sub(
              r'^\| M-005 \|.*$',
              '| M-005 | Suno Library historical Preview latest-track visibility + provider zero-byte audio blocker from 2-A3-R | HIGH / PRE-GATE | **Resolved.** Current source -> latest Library bundle -> sync version freshness passed; hardened `getSunoTrackStatus` then passed a real Preview Firebase-login post-check with HTTP 200, `verified`, returned validated audio, independent HTTP 206 `audio/mp3` readable bytes, and matching Firestore state. New music/credit use 0. | Was required before Step 4 Suno Library playback/visibility could be fully declared passed. | **CLOSED — REAL PREVIEW AUTHENTICATED POST-CHECK PASS** |',
              b,
              count=1,
              flags=re.M,
          )
          if '| M-011 |' not in b:
              m010 = re.search(r'^\| M-010 \|.*$', b, flags=re.M)
              if not m010:
                  raise SystemExit('M-010 row anchor missing')
              row = "\n| M-011 | Legacy/public Suno record `ownerUid` Auth fallback compatibility | MEDIUM / REVIEW | Some historical/public Suno records may not provide owner identity in the shape required by the current `ownerUid`-based Auth fallback path. M-005 intentionally did not alter this compatibility path because the final owner-track authenticated post-check passed without requiring it. | Review read-only before any public/legacy Suno ownership fallback change; do not bundle into core Backend V2 or M-005 cleanup. | **OPEN / SEPARATE BACKLOG / NO CHANGE IN M-005** |"
              b = b[:m010.end()] + row + b[m010.end():]
          b = re.sub(
              r'### M-005\n\n.*?\n\n### M-006 / M-007',
              '### M-005\n\nM-005 is closed. Final evidence:\n\n- `docs/SORIDRAW_MAINTENANCE_M005_SUNO_LIBRARY_READONLY_REDIAGNOSIS.md`\n- `docs/SORIDRAW_MAINTENANCE_M005_FINAL_AUTHENTICATED_POSTCHECK_RESULT.md`\n- real Preview Firebase-login post-check: function HTTP 200, `audioValidationStatus: verified`, independent HTTP 206 `audio/mp3` with readable bytes, Firestore match, new music generation 0, credit-consuming generation 0\n- temporary Preview post-check route/component and temporary M-005 workflows removed after verification\n\nSeparate deferred compatibility item: M-011 (`ownerUid` Auth fallback for legacy/public Suno records).\n\n### M-006 / M-007',
              b,
              count=1,
              flags=re.S,
          )
          b = b.replace(
              '- M-005 resolve/retest Preview latest-track visibility environment blocker,',
              '- M-005 CLOSED: current Library visibility/freshness and real authenticated byte-validated playback post-check passed; M-011 legacy/public owner fallback remains separate,',
          )
          backlog.write_text(b, encoding='utf-8')
          PY

      - name: Remove this temporary finalizer and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/maintenance-m005-final-doc-cleanup.yml
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md docs/SORIDRAW_MAINTENANCE_BACKLOG.md .github/workflows/maintenance-m005-final-doc-cleanup.yml
          if git diff --cached --quiet; then
            echo 'No final docs changes to commit.'
            exit 0
          fi
          git commit -m 'docs: close M-005 after authenticated Preview postcheck'
          git push origin HEAD:preview
