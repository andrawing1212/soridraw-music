name: Apply 990 Persistent Cache Foundation

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-990-persistent-cache-foundation.py'
      - '.github/workflows/apply-990-persistent-cache-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-990-persistent-cache-foundation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply 990 cache foundation
        run: python3 .deploy/apply-990-persistent-cache-foundation.py

      - name: Verify cache contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SORIDRAW_LONG_TERM_CACHE_STAGE_1_3_990' src/services/exploreSessionCache.ts
          grep -Fq "expiresAt: null" src/services/exploreSessionCache.ts
          ! grep -Fq 'EXPLORE_FEED_SESSION_TTL_MS' src/services/exploreSessionCache.ts
          grep -Fq "sourceType: EXPLORE_LIKE_SOURCE_TYPE" src/services/exploreLikeService.ts
          grep -Fq "sourceType: PUBLICATION_CACHE_SOURCE_TYPE" src/services/explorePublicationService.ts
          grep -Fq 'schemaVersion' src/lib/soridrawPersistentCache.ts
          grep -Fq 'dataVersion' src/lib/soridrawPersistentCache.ts
          grep -Fq 'environment' src/lib/soridrawPersistentCache.ts
          grep -Fq 'syncCursor' src/lib/soridrawPersistentCache.ts
          grep -Fq 'serverRevision' src/lib/soridrawPersistentCache.ts
          grep -Fq 'deletedIds' src/lib/soridrawPersistentCache.ts
          grep -Fq 'pendingMutationId' src/lib/soridrawPersistentCache.ts
          if grep -Fq 'invalidateExploreFeedSessionCache' src/services/exploreLikeService.ts; then
            echo 'Like mutation still invalidates entire Explore feed cache.'
            exit 1
          fi
          echo 'STAGE_1_NO_30S_FEED_REFETCH=PASS'
          echo 'STAGE_2_PERSISTENT_EXPLORE_STATE=PASS'
          echo 'STAGE_3_CACHE_ENVELOPE_READY=PASS'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify safe scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/lib/soridrawPersistentCache\.ts|src/services/exploreSessionCache\.ts|src/services/exploreLikeService\.ts|src/services/explorePublicationService\.ts|src/pages/ExplorePage\.tsx)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected source changes:'
            printf '%s\n' "$bad"
            exit 1
          fi
          echo 'NO_FIRESTORE_SCHEMA_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_FUNCTIONS_CHANGE=true'
          echo 'NO_RULES_CHANGE=true'
          echo 'NO_MAIN_CHANGE=true'

      - name: Commit actual preview source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo '990 already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/soridrawPersistentCache.ts src/services/exploreSessionCache.ts src/services/exploreLikeService.ts src/services/explorePublicationService.ts src/pages/ExplorePage.tsx
          git commit -m 'feat(preview): add persistent cache foundation stages 1-3'
          git push origin HEAD:preview
