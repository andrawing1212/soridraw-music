name: TEMP 1005 Safe Firebase Preview Deploy

on:
  push:
    branches: [preview-perf-memory-wav-stability]
    paths:
      - '.github/workflows/temp-1005-safe-firebase-preview-deploy.yml'

permissions:
  contents: read

concurrency:
  group: temp-1005-safe-firebase-preview-deploy
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-perf-memory-wav-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Safety checks
        run: |
          set -euo pipefail
          node .deploy/check-firebase-hosting-migration-phase1.mjs
          node .deploy/check-firebase-hosting-migration-phase2.mjs
          node .deploy/check-firebase-hosting-migration-phase3.mjs
          node .deploy/check-firebase-custom-preview.mjs
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('firebase.hosting-preview.json','utf8'));
          if (!c.hosting || c.hosting.site !== 'soridraw-preview') throw new Error('wrong preview site');
          for (const k of ['functions','firestore','database','storage']) if (c[k]) throw new Error('backend resource in preview config: '+k);
          console.log('isolated preview hosting config: PASS');
          NODE
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Snapshot production before
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
      - name: Deploy safe branch to Firebase PREVIEW site only
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
      - name: Smoke preview and custom domain
        run: |
          set -euo pipefail
          for url in https://soridraw-preview.web.app/ https://preview.soridraw.com/; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 "$url" -o "$RUNNER_TEMP/preview.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview.html"; then ok=yes; echo "PASS $url"; break; fi
              sleep 10
            done
            test "$ok" = yes
          done
      - name: Verify shared backend boundaries
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/function.txt -w '%{http_code}' -X OPTIONS -H 'Origin: https://preview.soridraw.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' 'https://us-central1-soridraw-app-866a5.cloudfunctions.net/getSunoApiKeyStatus' || true)"
          echo "Functions CORS preflight HTTP: ${code:-network-error}"
          explore="$(curl -sS -o /tmp/explore.txt -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' 'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1' || true)"
          echo "Explore HTTP: ${explore:-network-error}"
      - name: Verify production unchanged
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'Production unchanged: PASS'
