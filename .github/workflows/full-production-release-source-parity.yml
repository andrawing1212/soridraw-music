name: Full PREVIEW to PRODUCTION active source parity (read-only)
on:
  push:
    branches: [prep/full-preview-production-parity]
    paths:
      - 'scripts/full-production-release-source-parity.mjs'
      - '.github/workflows/full-production-release-source-parity.yml'
permissions:
  contents: read
jobs:
  compare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: google-github-actions/auth@v2
        id: firebase
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token
      - name: Compare active code, exact feature routes and existing receivers without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
        run: node scripts/full-production-release-source-parity.mjs
