name: Stage3 Music Note Parent Diagnostic

on:
  push:
    branches: [preview-stage3-pagination]
    paths:
      - '.github/workflows/stage3-music-note-parent-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout stage3 branch
        uses: actions/checkout@v4
        with:
          ref: preview-stage3-pagination

      - name: Extract App Music Note owner paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/App.tsx')
          lines = path.read_text(encoding='utf-8').splitlines()
          patterns = [
              r'hasMoreFavorites', r'loadMoreFavorites', r'onLoadMoreFavorites', r'setFavorites',
              r'favoritesLast', r'favorite.*cursor', r'favorites.*page', r'favoritePage',
              r'fetch.*favorite', r'load.*favorite', r'MUSIC_NOTE', r'favoritesLoading',
              r'listBundle', r'readListBundle', r'createdAtMs', r'startAfter', r'limit\(',
          ]
          rx = re.compile('|'.join(f'(?:{p})' for p in patterns), re.I)
          hits=[i for i,l in enumerate(lines) if rx.search(l)]
          ranges=[]
          for i in hits:
              s,e=max(0,i-16),min(len(lines),i+17)
              if ranges and s <= ranges[-1][1]+2:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],e))
              else: ranges.append((s,e))
          out=[f'# src/App.tsx hits={len(hits)} ranges={len(ranges)}']
          for s,e in ranges:
              out.append(f'\n## lines {s+1}-{e}')
              out.extend(f'{n+1:06d}: {lines[n]}' for n in range(s,e))
          Path('stage3-app-music-note.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Upload App diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: stage3-music-note-parent-diagnostic
          path: stage3-app-music-note.txt
          retention-days: 3
