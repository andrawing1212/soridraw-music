name: Temp Admin Cleanup Typefix 20260831

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-admin-cleanup-typefix-20260831.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Guard clean source
        shell: bash
        run: |
          set -euo pipefail
          test ! -f src/lib/adminStaffListCache.ts
          test -f src/pages/AdminVocalTonesPage.tsx
          test -f src/pages/AdminSectionTagsPage.tsx
          grep -q "where('role', '==', 'admin')" src/pages/MasterPermissionsPage.tsx
          grep -q "const AdminVocalTonesPageLazy" src/App.tsx
          echo 'TYPEFIX_CLEAN_SOURCE_GUARD=PASS'

      - name: Reuse audited patch with strict types
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/temp-admin-read-audit-20260831.yml').read_text(encoding='utf-8')
          begin = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(begin) + len(begin)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])
          script = script.replace(
              "const nextAdmins = admins.map((item) => item.uid === user.uid\\n        ? { ...item, staffRole: 'admin', adminPermissions: { ...permissions } }",
              "const nextAdmins: AppUserInfo[] = admins.map((item) => item.uid === user.uid\\n        ? { ...item, staffRole: 'admin' as StaffRole, adminPermissions: { ...permissions } }",
          )
          if "const nextAdmins: AppUserInfo[]" not in script or "staffRole: 'admin' as StaffRole" not in script:
              raise SystemExit('Strict staff typing patch was not applied to extracted script')
          Path('/tmp/admin-cleanup.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/admin-cleanup.py

      - name: Assert full zero-repeat contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Number.POSITIVE_INFINITY" src/lib/firestoreReadCache.ts
          grep -q "readAdminStaffListCache(masterUid)" src/pages/MasterPermissionsPage.tsx
          grep -q "void loadAdmins(false)" src/pages/MasterPermissionsPage.tsx
          grep -q "loadAdmins(true)" src/pages/MasterPermissionsPage.tsx
          grep -q "const nextAdmins: AppUserInfo\[\]" src/pages/MasterPermissionsPage.tsx
          grep -q "readFirestoreReadCache<NavigationVisibilitySettings>" src/pages/AdminAppSettingsPage.tsx
          grep -q "removeAdminStaffListCache(masterUid)" src/pages/AdminUserManagementPage.tsx
          ! grep -q "AdminVocalTonesPageLazy" src/App.tsx
          ! grep -q "AdminSectionTagsPageLazy" src/App.tsx
          ! grep -q "permission: 'vocalManagement'" src/components/AdminPageLayout.tsx
          ! grep -q "permission: 'sectionTagManagement'" src/components/AdminPageLayout.tsx
          test ! -e src/pages/AdminVocalTonesPage.tsx
          test ! -e src/pages/AdminSectionTagsPage.tsx
          grep -q "onSnapshot(userRef" src/App.tsx
          echo 'ADMIN_REPEAT_READ_CLEANUP=PASS'
          echo 'SECURITY_USER_AUTHORITY_LISTENER=RETAINED'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build preview
        run: npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(preview): make all admin navigation cache first'
          git push origin HEAD:preview
