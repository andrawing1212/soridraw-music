name: Apply 987 Preview Server Pagination

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/apply-987-preview-server-pagination.yml'
      - '.deploy/apply-987-preview-server-pagination-parity.py'

permissions:
  contents: write

concurrency:
  group: apply-987-preview-server-pagination
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Register 987 after legacy prebuild patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('package.json')
          source = path.read_text(encoding='utf-8')
          patch = 'python3 .deploy/apply-987-preview-server-pagination-parity.py'
          if patch in source:
              print('987 already registered in package scripts')
              raise SystemExit(0)
          anchor = 'python3 .deploy/verify-955-suno-audio-url-auto-recovery.py'
          count = source.count(anchor)
          if count != 3:
              raise SystemExit(f'987 package anchor count mismatch: {count}')
          source = source.replace(anchor, f'{anchor} && {patch}')
          path.write_text(source, encoding='utf-8')
          print('987 registered after legacy patch chain in predev/prebuild/prelint')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full production build
        run: npm run build

      - name: Type check final patched source
        run: npx tsc --noEmit

      - name: Verify changed scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          changed="$(git diff --name-only)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(package\.json|src/App\.tsx|src/pages/FavoritesPage\.tsx|src/pages/SunoLibraryPage\.tsx)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            echo "$bad"
            exit 1
          fi

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo '987 source is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx
          git commit -m 'fix: use server-canonical pagination in preview'
          git push origin HEAD:preview
