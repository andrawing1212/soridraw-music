name: Temp Cloudflare Explore Physical Resource Inspect

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-cloudflare-explore-physical-resource-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Inspect physical resources read-only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          echo '=== D1 LIST ==='
          npx wrangler d1 list --json
          echo '=== R2 LIST ==='
          npx wrangler r2 bucket list --json
          echo 'PHYSICAL_RESOURCE_INSPECT_COMPLETE=true'
