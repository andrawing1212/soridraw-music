name: Report master35 current run

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report:
    if: github.event.issue.title == 'REPORT MASTER35 CURRENT RUN'
    runs-on: ubuntu-latest
    steps:
      - name: Report latest runs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha,.created_at] | @tsv' > /tmp/runs.txt
          {
            echo '```text'
            cat /tmp/runs.txt
            echo '```'
          } > /tmp/body.md
          gh issue comment "$ISSUE_URL" --body-file /tmp/body.md
