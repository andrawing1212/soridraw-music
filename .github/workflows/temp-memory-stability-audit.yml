name: TEMP Memory Stability Audit

on:
  push:
    branches: [preview-memory-stability-audit]
    paths:
      - '.github/workflows/temp-memory-stability-audit.yml'

permissions:
  contents: write

concurrency:
  group: temp-memory-stability-audit
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: preview-memory-stability-audit
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic stability patch
        run: python3 .deploy/apply-1001-memory-stability-audit.py

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'src/components/studio/LiteStudioSplitWorkspace.tsx\nsrc/services/presenceService.ts'
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 2
          fi
          grep -q 'SORIDRAW_1001_PRESENCE_PERMISSION_STORM_GUARD' src/services/presenceService.ts
          grep -q 'SORIDRAW_1001_SPLIT_DESKTOP_TABLET_CONTAINMENT' src/components/studio/LiteStudioSplitWorkspace.tsx
          echo '[1001] scope and markers: PASS'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add src/services/presenceService.ts src/components/studio/LiteStudioSplitWorkspace.tsx
          if git diff --cached --quiet; then
            echo '[1001] no source changes to commit'
            exit 0
          fi
          git commit -m 'fix(audit): stop presence retry storm and contain desktop split drag'
          git push origin HEAD:preview-memory-stability-audit
