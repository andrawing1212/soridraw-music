name: Report master35 rerun status

on:
  push:
    branches: [main]
    paths:
      - .deploy/report-master35-rerun-status-trigger.txt

permissions:
  contents: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect latest workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .deploy
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha,.run_attempt,.created_at,.updated_at] | @tsv' > .deploy/master35-rerun-status.txt
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/master35-rerun-status.txt
          git commit -m "chore: report master35 rerun status" || true
          git push origin HEAD:main
