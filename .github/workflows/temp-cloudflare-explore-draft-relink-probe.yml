name: Temp Cloudflare Explore Draft Relink Probe

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-cloudflare-explore-draft-relink-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Probe draft bindings without writes
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          for envname in preview test; do
            worker="soridraw-explore-${envname}"
            cat > "$RUNNER_TEMP/probe-${envname}.mjs" <<'JS'
          export default { async fetch(request, env) {
            const url=new URL(request.url); if(url.pathname!='/__binding_probe') return new Response('not found',{status:404});
            const row=await env.DB.prepare('SELECT 1 AS ok').first();
            return Response.json({ok:Number(row?.ok||0)===1});
          }};
          JS
            cat > "$RUNNER_TEMP/wrangler-${envname}.jsonc" <<JSON
          {
            "name":"${worker}",
            "main":"./probe-${envname}.mjs",
            "compatibility_date":"2026-08-28",
            "workers_dev":true,
            "d1_databases":[{"binding":"DB"}],
            "r2_buckets":[{"binding":"PROFILE_MEDIA"}]
          }
          JSON
            npx wrangler deploy --strict --config "$RUNNER_TEMP/wrangler-${envname}.jsonc"
          done
      - name: Read resulting Worker bindings
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const {spawnSync}=require('node:child_process');
          const run=(a)=>{const r=spawnSync('npx',['wrangler',...a],{encoding:'utf8',env:process.env});if(r.status)throw new Error(r.stderr||r.stdout);return r.stdout.trim()};
          const parse=s=>{try{return JSON.parse(s)}catch{const p=[s.indexOf('{'),s.indexOf('[')].filter(x=>x>=0);return JSON.parse(s.slice(Math.min(...p)))}};
          const who=parse(run(['whoami','--json'])); const account=who.accounts?.[0]?.id; const auth=parse(run(['auth','token','--json']));
          const headers=auth.type==='api_key'?{'X-Auth-Key':auth.key,'X-Auth-Email':auth.email}:{Authorization:`Bearer ${auth.token}`};
          (async()=>{for(const envname of ['preview','test']){const worker=`soridraw-explore-${envname}`;const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/settings`,{headers});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x));const b=x.result?.bindings||[];const db=b.find(v=>v.type==='d1'&&v.name==='DB');const r2=b.find(v=>v.type==='r2_bucket'&&v.name==='PROFILE_MEDIA');console.log(`${envname.toUpperCase()}_DRAFT_DB_ID=${db?.id||db?.database_id||''}`);console.log(`${envname.toUpperCase()}_DRAFT_R2=${r2?.bucket_name||''}`);if(!db?.id&&!db?.database_id)throw new Error(`${envname} draft DB missing`);if((db?.id||db?.database_id)==='217ef5b1-5d80-4f7c-afc7-9e07eb05c06b')throw new Error(`${envname} draft binding resolved to production DB; stopped before writes`);}}
          )().catch(e=>{console.error(e);process.exit(1)});
          JS
          for envname in preview test; do
            code="$(curl -sS --max-time 20 -o /tmp/${envname}-probe.json -w '%{http_code}' "https://soridraw-explore-${envname}.andrawing1212.workers.dev/__binding_probe" || true)"
            test "$code" = 200
            grep -q '"ok":true' /tmp/${envname}-probe.json
            echo "${envname^^}_DRAFT_RUNTIME_PROBE=PASS"
          done
          echo 'DRAFT_RELINK_PROBE=PASS'
