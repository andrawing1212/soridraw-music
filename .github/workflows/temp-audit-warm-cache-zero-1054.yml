name: Temp Warm Catalog Zero 1054

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-audit-warm-cache-zero-1054.yml']

permissions:
  contents: write

jobs:
  implement-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUNTIME_BASE: '2c9a430aa6a5f53be28a1f976b836f46fcec7e29'
      MAIN_BASE: '49c799cbb46d137539f74a48c261f7256762336f'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30

      - name: Guard runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RUNTIME_BASE" HEAD
          git diff --exit-code "$RUNTIME_BASE"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json functions cloudflare firestore.rules
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$MAIN_BASE"

      - name: Apply warm-cache zero Worker policy
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/temp-apply-warm-cache-zero-1054.py

      - name: Static safety guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'canUseWarmCatalogWithoutRemote' src/lib/userDataEngine.ts
          grep -q 'USER_PROFILE_CACHE_EVENT' src/lib/listBundleCache.ts
          grep -q 'catalogRevision: snapshot.revision' src/lib/adaptiveListIndexV2.ts
          grep -q 'profileRevision: knownRemoteRevision' src/lib/userDataEngine.ts
          if grep -q 'local && sessionValidated && (knownRemoteRevision <= 0' src/lib/userDataEngine.ts; then exit 1; fi
          changed="$(git status --porcelain -- src/lib/userDataEngine.ts src/lib/adaptiveListIndexV2.ts src/lib/listBundleCache.ts src/lib/catalogWarmCachePolicy.ts test/catalogWarmCachePolicy.test.mjs | wc -l)"
          test "$changed" -eq 5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Unit tests TypeScript and app Build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test test/catalogWarmCachePolicy.test.mjs
          npx tsc --noEmit
          npm run build
          test -s dist/index.html
          echo 'WARM_CACHE_POLICY_TESTS=PASS'
          echo 'APP_TYPESCRIPT_BUILD=PASS'

      - name: Functions and Library regression
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle
          echo 'FUNCTIONS_BUILD_LIBRARY_REGRESSION=PASS'

      - name: Commit feature to preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add src/lib/catalogWarmCachePolicy.ts test/catalogWarmCachePolicy.test.mjs src/lib/userDataEngine.ts src/lib/adaptiveListIndexV2.ts src/lib/listBundleCache.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'perf(preview): skip Catalog Worker on proven warm cache'
          git push origin HEAD:preview
          echo "FEATURE_COMMIT=$(git rev-parse HEAD)"

      - name: Verify unchanged Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw-media-preview.andrawing1212.workers.dev/health -o "$RUNNER_TEMP/worker-health.json"
          grep -q '"catalogDeltaMode":"base+journal"' "$RUNNER_TEMP/worker-health.json"
          grep -q '"catalogCompactionAfter":200' "$RUNNER_TEMP/worker-health.json"
          echo 'CLOUDFLARE_UNCHANGED_HEALTH=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production before PREVIEW deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Firebase PREVIEW Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact PREVIEW build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          echo "LOCAL_INDEX_SHA=$local_sha"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok=yes
                  echo "EXACT_BUILD_PASS=$url:$remote_sha"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify main and Production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$MAIN_BASE"
          echo 'PRODUCTION_MAIN_UNCHANGED=PASS'

      - name: Cleanup temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git rm .github/workflows/temp-audit-warm-cache-zero-1054.yml .deploy/temp-apply-warm-cache-zero-1054.py
          git commit -m 'chore(preview): remove temporary warm-cache tooling'
          git push origin HEAD:preview
          echo "FINAL_PREVIEW_HEAD=$(git rev-parse HEAD)"
