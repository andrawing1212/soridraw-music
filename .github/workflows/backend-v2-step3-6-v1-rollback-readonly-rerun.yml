name: SORIDRAW Backend V2 Step 3-6 V1 Rollback Readonly Verification Rerun

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-6-v1-rollback-readonly-rerun.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      APPROVED_SCOPE: Step 3-6 V1 retention rollback safety read-only approved 2026-08-26 KST
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true
      - run: npm ci --ignore-scripts
      - name: Step 3-6 V1 retention and rollback safety verification
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$TARGET_PROJECT"
          export GCLOUD_PROJECT="$TARGET_PROJECT"
          export GOOGLE_CLOUD_QUOTA_PROJECT="$TARGET_PROJECT"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = String(process.env.TARGET_PROJECT || '');
          const bucketName = String(process.env.TARGET_BUCKET || '');
          const backupPrefix = String(process.env.BACKUP_PREFIX || '');
          const expectedManifestHash = String(process.env.EXPECTED_MANIFEST_SHA256 || '');
          const approvedScope = String(process.env.APPROVED_SCOPE || '');
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          if (bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('BUCKET_PIN_MISMATCH');
          if (!approvedScope.includes('3-6') || !approvedScope.toLowerCase().includes('read-only')) throw new Error('READONLY_APPROVAL_MARKER_MISSING');

          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string','boolean'].includes(typeof value)) return value;
            if (typeof value === 'number') return Number.isFinite(value) ? value : String(value);
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return {__type:'bytes',base64:Buffer.from(value).toString('base64')};
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return {__type:'date',iso:value.toISOString()};
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return {__type:'timestamp',seconds:value.seconds,nanoseconds:value.nanoseconds};
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return {__type:'geopoint',latitude:value.latitude,longitude:value.longitude};
            if (typeof value?.path === 'string' && value?.firestore) return {__type:'reference',path:value.path};
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((k)=>[k,canonicalize(value[k])]));
            return String(value);
          };
          const digest = (value) => sha256(JSON.stringify(canonicalize(value)));

          const metricValue = (point) => {
            const raw = point?.value?.int64Value ?? point?.value?.doubleValue ?? 0;
            const n = Number(raw); return Number.isFinite(n) && n > 0 ? n : 0;
          };
          const queryMetric = async (accessToken, metricType, startMs, endMs) => {
            const params = new URLSearchParams({filter:`metric.type = "${metricType}"`,'interval.startTime':new Date(startMs).toISOString(),'interval.endTime':new Date(endMs).toISOString(),view:'FULL',pageSize:'1000'});
            let total=0, pointCount=0, pageToken='', pages=0;
            do {
              if (pageToken) params.set('pageToken',pageToken); else params.delete('pageToken');
              const res = await fetch(`https://monitoring.googleapis.com/v3/projects/${projectId}/timeSeries?${params}`,{headers:{Authorization:`Bearer ${accessToken}`,'X-Goog-User-Project':projectId,Accept:'application/json'}});
              const text = await res.text();
              if (!res.ok) { const e=new Error(`MONITORING_${res.status}`); e.statusCode=res.status; throw e; }
              const body=text?JSON.parse(text):{};
              for (const series of body.timeSeries||[]) for (const point of series.points||[]) { total += metricValue(point); pointCount += 1; }
              pageToken=String(body.nextPageToken||''); if (++pages>5) throw new Error('MONITORING_PAGINATION_LIMIT');
            } while(pageToken);
            return {total:Math.round(total),pointCount};
          };
          const queryFamily = async (token,candidates,start,end) => {
            for (const type of candidates) { try { const r=await queryMetric(token,type,start,end); if (r.pointCount>0) return r.total; } catch(e) { if (e?.statusCode===400||e?.statusCode===404) continue; throw e; } }
            return 0;
          };

          const app = initializeApp({credential:applicationDefault(),projectId,storageBucket:bucketName},`step36-${Date.now()}`);
          (async()=>{
            const db=getFirestore(app); const bucket=getStorage(app).bucket(bucketName);
            const cred=admin.credential.applicationDefault(); const tok=await cred.getAccessToken(); const accessToken=String(tok?.access_token||'');
            if(!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');

            const required=['datastore.entities.get','datastore.entities.list'];
            const iam=await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`,{method:'POST',headers:{Authorization:`Bearer ${accessToken}`,'X-Goog-User-Project':projectId,'Content-Type':'application/json'},body:JSON.stringify({permissions:required})});
            if(!iam.ok) throw new Error(`IAM_TEST_${iam.status}`); const granted=new Set(((await iam.json()).permissions||[]).map(String));
            if(required.some((p)=>!granted.has(p))) throw new Error('READONLY_IAM_MISSING');

            const now=new Date(); const kstDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(now); const start=Date.parse(`${kstDate}T00:00:00+09:00`);
            const [todayReads,todayWrites,todayDeletes]=await Promise.all([
              queryFamily(accessToken,['firestore.googleapis.com/document/read_ops_count','firestore.googleapis.com/document/read_count'],start,now.getTime()),
              queryFamily(accessToken,['firestore.googleapis.com/document/write_ops_count','firestore.googleapis.com/document/write_count'],start,now.getTime()),
              queryFamily(accessToken,['firestore.googleapis.com/document/delete_ops_count','firestore.googleapis.com/document/delete_count'],start,now.getTime()),
            ]);
            const safeReadCap=Math.min(10000,Math.max(0,50000-todayReads-10000)); const estimatedReads=1500;
            if(safeReadCap<estimatedReads) throw new Error(`READ_QUOTA_PAUSE:${safeReadCap}`);
            console.log('STEP36_QUOTA='+JSON.stringify({todayReads,todayWrites,todayDeletes,safeReadCap,estimatedReads}));

            const [manifestBytes]=await bucket.file(`${backupPrefix}/manifest.json`).download();
            if(sha256(manifestBytes)!==expectedManifestHash) throw new Error('MANIFEST_HASH_MISMATCH');
            const manifest=JSON.parse(manifestBytes.toString('utf8')); if(manifest?.complete!==true||manifest?.targetProjectId!==projectId) throw new Error('MANIFEST_INVALID');
            const specs=[['structures','user_structures','user_structures.ndjson',3],['recent','user_recent_songs','user_recent_songs.ndjson',10],['favorites','favorites','favorites.ndjson',738],['playlistHeaders','playlist_lists','playlist_lists.ndjson',42],['playlistItems','playlist_items','playlist_items.ndjson',49]];
            const backup={}; let totalBackupBytes=manifestBytes.length;
            for(const [key,id,fileName,count] of specs){const ds=(manifest.datasets||[]).find((x)=>x?.id===id); if(!ds||ds.fileName!==fileName||ds.documentCount!==count) throw new Error(`BACKUP_DATASET_INVALID:${key}`); const [bytes]=await bucket.file(`${backupPrefix}/${fileName}`).download(); totalBackupBytes+=bytes.length; if(sha256(bytes)!==ds.sha256) throw new Error(`BACKUP_DATASET_HASH_MISMATCH:${key}`); const rows=bytes.toString('utf8').split('\n').filter(Boolean).map(JSON.parse); if(rows.length!==count) throw new Error(`BACKUP_COUNT:${key}`); backup[key]=rows;}
            console.log('STEP36_BACKUP='+JSON.stringify({manifestHash:expectedManifestHash,datasets:5,sourceDocuments:842,downloadedBytes:totalBackupBytes,recoverable:true}));

            const [structures,recent,favorites,lists,items]=await Promise.all([db.collection('user_structures').get(),db.collection('user_recent_songs').get(),db.collection('favorites').get(),db.collectionGroup('lists').get(),db.collectionGroup('items').get()]);
            const headerDocs=lists.docs.filter((d)=>/^user_playlists\/[^/]+\/lists\/[^/]+$/.test(d.ref.path)); const itemDocs=items.docs.filter((d)=>/^user_playlists\/[^/]+\/lists\/[^/]+\/items\/[^/]+$/.test(d.ref.path));
            const compare=(key,docs)=>{const map=new Map(backup[key].map((r)=>[String(r.path),r.data])); const live=new Set(docs.map((d)=>d.ref.path)); const missing=[...map.keys()].filter((p)=>!live.has(p)).length; const added=docs.filter((d)=>!map.has(d.ref.path)).length; const mismatch=docs.filter((d)=>map.has(d.ref.path)&&digest(map.get(d.ref.path))!==digest(d.data())).length; return {expected:map.size,live:docs.length,missing,added,mismatch};};
            const v1={structures:compare('structures',structures.docs),recent:compare('recent',recent.docs),favorites:compare('favorites',favorites.docs),playlistHeaders:compare('playlistHeaders',headerDocs),playlistItems:compare('playlistItems',itemDocs)};
            const errors=Object.values(v1).reduce((n,r)=>n+r.missing+r.added+r.mismatch+Math.abs(r.expected-r.live),0); console.log('STEP36_V1='+JSON.stringify({...v1,total:842,errorSignals:errors})); if(errors!==0) throw new Error(`V1_RETENTION_FAILED:${errors}`);

            const repo=fs.readFileSync('src/data/userDataRepository.ts','utf8'); const shadow=fs.readFileSync('src/data/v2ShadowValidation.ts','utf8');
            const checks={v1Only:/BACKEND_V2_RUNTIME_MODE\s*=\s*'v1-only'/.test(repo),readV2Off:/readFromV2:\s*false/.test(repo),writeV2Off:/writeToV2:\s*false/.test(repo),shadowGateOff:/shadowWriteToV2:\s*false/.test(repo),migrateOnReadOff:/migrateOnRead:\s*false/.test(repo),deleteV1Off:/deleteV1:\s*false/.test(repo),shadowRuntimeOff:/BACKEND_V2_SHADOW_WRITE_RUNTIME_ENABLED\s*=\s*false/.test(shadow),backfillRuntimeOff:/BACKEND_V2_BACKFILL_RUNTIME_ENABLED\s*=\s*false/.test(shadow),v1DeleteRuntimeOff:/BACKEND_V2_V1_DELETE_RUNTIME_ENABLED\s*=\s*false/.test(shadow)};
            const forbidden=[/deleteV1:\s*true/,/BACKEND_V2_V1_DELETE_RUNTIME_ENABLED\s*=\s*true/,/BACKEND_V2_BACKFILL_RUNTIME_ENABLED\s*=\s*true/,/BACKEND_V2_SHADOW_WRITE_RUNTIME_ENABLED\s*=\s*true/]; let forbiddenMatches=0; for(const text of [repo,shadow]) for(const p of forbidden) if(p.test(text)) forbiddenMatches++;
            const runtimeSafe=Object.values(checks).every(Boolean)&&forbiddenMatches===0; console.log('STEP36_RUNTIME='+JSON.stringify({checks,forbiddenMatches,runtimeSafe})); if(!runtimeSafe) throw new Error('RUNTIME_ROLLBACK_GUARD_FAILED');

            console.log('STEP36_RESULT='+JSON.stringify({v1SourceDocumentsVerified:842,backupManifestVerified:true,backupDatasetsVerified:5,backupRecoverable:true,runtimeMode:'v1-only',v2ReadRuntimeEnabled:false,v2WriteRuntimeEnabled:false,shadowWriteRuntimeEnabled:false,backfillRuntimeEnabled:false,migrateOnReadEnabled:false,v1DeleteRuntimeEnabled:false,rollbackToV1Available:true,v1Writes:0,v1Deletes:0,v2Writes:0,v2Deletes:0,storageWrites:0,rulesDeploys:0,functionsDeploys:0,hostingDeploys:0}));
          })().catch((e)=>{console.error('STEP36_ERROR='+String(e?.message||e));process.exitCode=1;}).finally(async()=>{await deleteApp(app);});
          NODE
