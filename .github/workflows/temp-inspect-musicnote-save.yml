name: TEMP Inspect Music Note Save

on:
  push:
    branches: [preview-musicnote-save-io-opt]
    paths:
      - '.github/workflows/temp-inspect-musicnote-save.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-musicnote-save-io-opt
      - name: Print bounded save hotpath
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text(encoding='utf-8')
          anchor="const findServerMatchingFavorites = async"
          i=s.index(anchor)
          j=s.index("const saveSignal = buildFavoriteSyncSignal('save', localFavorite", i)
          j=s.index('\n', j+1)
          print(s[i:j])
          PY
