name: Apply app302b Studio Heart Local Layer Cleanup

on:
  push:
    branches:
      - preview
    paths:
      - '.deploy/trigger-app302b-studio-heart-local-layer.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply app302b patch
        run: python3 .deploy/apply-302b-studio-heart-local-layer.py
      - name: Verify app302 contract
        run: node scripts/verify-302-studio-heart-local-first-delayed-remote.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: isolate pending Studio heart from canonical cache"
          git push origin HEAD:preview
