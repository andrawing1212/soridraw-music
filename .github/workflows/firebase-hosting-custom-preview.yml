name: Firebase Hosting Custom Preview

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'firebase.hosting-preview.json'
      - '.deploy/check-firebase-custom-preview.mjs'
      - '.github/workflows/firebase-hosting-custom-preview.yml'

permissions:
  contents: read

concurrency:
  group: firebase-hosting-custom-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BACKEND_PROJECT: soridraw-app-866a5
      HOSTING_PROJECT: soridraw
      PREVIEW_SITE: soridraw-preview
      PREVIEW_DOMAIN: preview.soridraw.com
      APP_CHECK_SITE_KEY: 6Le6bGEtAAAAAOVROhuXew0lxJcpVNVwPZN0ZWKO

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Re-run migration safety checks
        run: |
          node .deploy/check-firebase-hosting-migration-phase1.mjs
          node .deploy/check-firebase-hosting-migration-phase2.mjs
          node .deploy/check-firebase-hosting-migration-phase3.mjs
          node .deploy/check-firebase-custom-preview.mjs

      - name: Build preview app
        run: npm run build

      - name: Type check preview app
        run: npx tsc --noEmit

      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Mint direct Google OAuth token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const credentialPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          if (!credentialPath) throw new Error('GOOGLE_APPLICATION_CREDENTIALS is missing');
          const serviceAccount = JSON.parse(fs.readFileSync(credentialPath, 'utf8'));
          const base64url = (input) => Buffer.from(input).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = base64url(JSON.stringify({
            iss: serviceAccount.client_email,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          }));
          const unsigned = `${header}.${payload}`;
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), serviceAccount.private_key).toString('base64url');
          const assertion = `${unsigned}.${signature}`;
          (async () => {
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth-grant-type:jwt-bearer',
                assertion,
              }),
            });
            const body = await response.json();
            if (!response.ok || !body.access_token) {
              throw new Error(`OAuth token exchange failed: HTTP ${response.status} ${JSON.stringify(body)}`);
            }
            console.log(`::add-mask::${body.access_token}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `ACCESS_TOKEN=${body.access_token}\n`);
            console.log('[Custom Preview] Direct OAuth token: PASS');
          })().catch((error) => {
            console.error(error?.message || error);
            process.exit(1);
          });
          NODE

      - name: Snapshot official production before preview deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"

      - name: Deploy preview branch to soridraw-preview only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project soridraw \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo '[Custom Preview] Hosting deploy to soridraw-preview: PASS'

      - name: Add fixed preview hosts to Firebase Auth authorized domains
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/soridraw-app-866a5/config" \
            -o "$RUNNER_TEMP/auth-config-before.json"

          python3 - "$RUNNER_TEMP/auth-config-before.json" "$RUNNER_TEMP/auth-domain-patch.json" <<'PY'
          import json, sys
          source, target = sys.argv[1:3]
          data = json.load(open(source, encoding='utf-8'))
          wanted = [
              'preview.soridraw.com',
              'soridraw-preview.web.app',
              'soridraw-preview.firebaseapp.com',
          ]
          domains = list(dict.fromkeys([str(v).strip() for v in data.get('authorizedDomains', []) if str(v).strip()] + wanted))
          with open(target, 'w', encoding='utf-8') as f:
              json.dump({'authorizedDomains': domains}, f, ensure_ascii=False)
          missing = [v for v in wanted if v not in domains]
          if missing:
              raise SystemExit(f'Could not stage Auth domains: {missing}')
          print(f'[Custom Preview] Auth authorizedDomains staged: {wanted}')
          PY

          curl -fsS -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/auth-domain-patch.json" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/soridraw-app-866a5/config?updateMask=authorizedDomains" \
            -o "$RUNNER_TEMP/auth-config-after.json"

          python3 - "$RUNNER_TEMP/auth-config-after.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          wanted = {'preview.soridraw.com', 'soridraw-preview.web.app', 'soridraw-preview.firebaseapp.com'}
          domains = set(data.get('authorizedDomains', []))
          missing = sorted(wanted - domains)
          if missing:
              raise SystemExit(f'Firebase Auth domains missing after PATCH: {missing}')
          print('[Custom Preview] Firebase Auth fixed preview domains: PASS')
          PY

      - name: Extend reCAPTCHA Enterprise preview domains when permitted
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/recaptcha-before.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://recaptchaenterprise.googleapis.com/v1/projects/soridraw-app-866a5/keys/$APP_CHECK_SITE_KEY")"

          if [ "$status" = '403' ]; then
            echo 'RECAPTCHA_POLICY_STATUS=permission-gated' >> "$GITHUB_ENV"
            echo '[Custom Preview] reCAPTCHA Enterprise policy remains permission-gated; no IAM role widened and no policy changed.'
            exit 0
          fi
          test "$status" = '200' || { echo "reCAPTCHA key read HTTP $status"; cat "$RUNNER_TEMP/recaptcha-before.json"; exit 6; }

          python3 - "$RUNNER_TEMP/recaptcha-before.json" "$RUNNER_TEMP/recaptcha-patch.json" <<'PY'
          import json, sys
          source, target = sys.argv[1:3]
          data = json.load(open(source, encoding='utf-8'))
          web = data.get('webSettings') or {}
          if web.get('allowAllDomains') is True:
              open(target, 'w', encoding='utf-8').write('')
              print('[Custom Preview] reCAPTCHA allows all domains; patch not needed.')
              raise SystemExit(0)
          wanted = ['preview.soridraw.com', 'soridraw-preview.web.app', 'soridraw-preview.firebaseapp.com']
          domains = list(dict.fromkeys([str(v).strip() for v in web.get('allowedDomains', []) if str(v).strip()] + wanted))
          with open(target, 'w', encoding='utf-8') as f:
              json.dump({'name': data.get('name'), 'webSettings': {'allowedDomains': domains}}, f, ensure_ascii=False)
          print(f'[Custom Preview] reCAPTCHA preview domains staged: {wanted}')
          PY
          echo 'RECAPTCHA_POLICY_STATUS=readable' >> "$GITHUB_ENV"

          if [ -s "$RUNNER_TEMP/recaptcha-patch.json" ]; then
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/recaptcha-patch.json" \
              "https://recaptchaenterprise.googleapis.com/v1/projects/soridraw-app-866a5/keys/$APP_CHECK_SITE_KEY?updateMask=webSettings.allowedDomains" \
              -o "$RUNNER_TEMP/recaptcha-after.json"
            echo '[Custom Preview] reCAPTCHA Enterprise preview domains: PASS'
          fi

      - name: Smoke test Firebase preview site and custom domain
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 "$url" -o "$RUNNER_TEMP/preview-smoke.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview-smoke.html"; then
                ok='yes'
                echo "[Custom Preview] Smoke PASS: $url"
                break
              fi
              sleep 10
            done
            test "$ok" = 'yes' || { echo "Preview smoke failed: $url"; exit 7; }
          done

      - name: Diagnose shared backend origin boundaries
        shell: bash
        run: |
          set -euo pipefail
          function_status="$(curl -sS -o "$RUNNER_TEMP/function-cors.txt" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://preview.soridraw.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
            'https://us-central1-soridraw-app-866a5.cloudfunctions.net/getSunoApiKeyStatus' || true)"
          echo "[Custom Preview] Functions CORS preflight HTTP: ${function_status:-network-error}"
          if [ -f "$RUNNER_TEMP/function-cors.txt" ]; then head -c 400 "$RUNNER_TEMP/function-cors.txt" || true; echo; fi

          explore_status="$(curl -sS -o "$RUNNER_TEMP/explore-cors.txt" -w '%{http_code}' \
            -H 'Origin: https://preview.soridraw.com' \
            'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1' || true)"
          echo "[Custom Preview] Explore feed HTTP: ${explore_status:-network-error}"
          if [ -f "$RUNNER_TEMP/explore-cors.txt" ]; then head -c 400 "$RUNNER_TEMP/explore-cors.txt" || true; echo; fi

      - name: Verify official Firebase production stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          cmp "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '[Custom Preview] Official Firebase production unchanged: PASS'

      - name: Custom preview result
        run: |
          echo 'Custom Firebase preview deployment completed.'
          echo 'Preview URL: https://preview.soridraw.com/'
          echo 'Firebase site: soridraw-preview'
          echo 'Backend remains soridraw-app-866a5.'
          echo "App Check policy inspection: ${RECAPTCHA_POLICY_STATUS:-not-run}"
          echo 'No Functions deploy, Firestore/Database Rules update, user-data migration, main change, or production Hosting release was performed.'

# Manual preview redeploy trigger: 2026-08-30T19:29Z
