name: Apply 991 Vercel Playback Recovery

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/apply-991-vercel-playback-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-991-vercel-playback-recovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded Vercel recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply-991-restore-vercel-playback-recovery.py
          grep -Fq 'SORIDRAW_LIBRARY_PLAYBACK_FAILURE_RECOVERY_991' src/pages/SunoLibraryPage.tsx
          grep -Fq 'return !getAudioUrl(item, group);' src/pages/SunoLibraryPage.tsx
          ! grep -Fq 'SUNO_AUDIO_URL_RECOVERY_AFTER_MS' src/pages/SunoLibraryPage.tsx
          grep -Fq "soridraw.suno.audioRecovery.v3" src/services/sunoAudioRecovery.ts
          grep -Fq "if (normalizedFailed) return ordered.find((url) => url !== normalizedFailed) || '';" src/services/sunoAudioRecovery.ts
          grep -Fq 'recoverAndRetryPlayback' src/contexts/GlobalPlayerContext.tsx
          echo 'VERCEL_RECOVERY_CONTRACT=PASS'

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SunoLibraryPage.tsx src/services/sunoAudioRecovery.ts
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(preview): restore Vercel playback-failure recovery order'
          git push origin HEAD:preview

      - name: Safety result
        run: |
          echo 'FUNCTIONS_DEPLOY=false'
          echo 'FIRESTORE_MIGRATION=false'
          echo 'CLOUDFLARE_CHANGE=false'
          echo 'VERCEL_DEPLOY=false'
          echo 'MAIN_CHANGE=false'
