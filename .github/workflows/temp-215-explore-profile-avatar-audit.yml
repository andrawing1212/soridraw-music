name: TEMP 215 Explore Profile Avatar Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-215-explore-profile-avatar-audit.yml'
      - 'scripts/verify-215-explore-profile-owner-card-sync.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Profile owner card sync verifier
        run: node scripts/verify-215-explore-profile-owner-card-sync.mjs
      - name: Frozen like regressions
        run: |
          node scripts/verify-190-like-card-authority.mjs
          node scripts/verify-192-cross-account-public-like-live.mjs
          node scripts/verify-197-new-public-track-like.mjs
      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -e "process.stdout.write(String(require('./public/app-version.json').version || ''))")" = "193"
          git diff --exit-code ef5b4b054e5455aff7b6f1b7001912f8e60fc797 HEAD -- cloudflare/explore-worker functions firestore.rules database.rules.json || {
            echo 'BACKEND_SCOPE_CHANGED=true'
            exit 1
          }
          echo 'BACKEND_SCOPE_CHANGED=false'
          echo 'USER_DATA_MIGRATION=false'
          echo 'AUDIT_215=PASS'
