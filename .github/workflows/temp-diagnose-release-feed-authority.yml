name: TEMP Converge Shared Feed Authority

on:
  push:
    branches:
      - fix/release-controller-hosting-live-identity
    paths:
      - .github/workflows/temp-diagnose-release-feed-authority.yml

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bounded PREVIEW Feed convergence
        shell: bash
        run: |
          set -euo pipefail
          base="https://soridraw-explore-preview.andrawing1212.workers.dev"
          origin="https://preview.soridraw.com"
          for sort in latest popular; do
            headers="$RUNNER_TEMP/feed-$sort.headers"
            body="$RUNNER_TEMP/feed-$sort.json"
            curl -fsS -o "$body" -D "$headers" -H "Origin: $origin" -H 'Cache-Control: no-cache'               "$base/v1/feed?sort=$sort&limit=40"
            d1r="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$headers")"
            d1w="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$headers")"
            echo "PREVIEW_FEED_CONVERGE $sort D1R=${d1r:-unknown} D1W=${d1w:-unknown}"
          done
          sleep 2
          for sort in latest popular; do
            headers="$RUNNER_TEMP/rev-$sort.headers"
            body="$RUNNER_TEMP/rev-$sort.json"
            curl -fsS -o "$body" -D "$headers" -H "Origin: $origin" -H 'Cache-Control: no-cache'               "$base/v1/feed-revision?sort=$sort"
            source="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-revision-source:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$headers")"
            revision="$(jq -r '.data.revision // empty' "$body")"
            echo "PREVIEW_REVISION_AFTER $sort SOURCE=$source REV=$revision"
            case "$source" in *SHARED*) ;; *) echo "SHARED_AUTHORITY_NOT_READY $sort"; exit 2;; esac
          done
          echo SHARED_FEED_CONVERGENCE=PASS
