name: Temp 223 Explore Audio URL Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-223-explore-audio-url-readonly.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only inspect recent public audio fields
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT id,title,source_type,source_id,source_subtrack_index,source_subtrack_id,
                   suno_url_primary,suno_url_secondary,published_at
            FROM tracks
            WHERE is_public=1 AND status='published'
            ORDER BY published_at DESC
            LIMIT 12;
          " --json > "$RUNNER_TEMP/audio-fields.json"
          cat "$RUNNER_TEMP/audio-fields.json"
      - name: Read-only compare PREVIEW Feed mapping
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=latest&limit=12&__diag223=${GITHUB_RUN_ID}" > "$RUNNER_TEMP/feed.json"
          node <<'NODE'
          const p=require(process.env.RUNNER_TEMP+'/feed.json');
          for(const row of p?.data?.items||[]) {
            console.log(JSON.stringify({
              id:row.id,title:row.title,sourceType:row.sourceType,sourceId:row.sourceId,
              sourceSubTrackIndex:row.sourceSubTrackIndex,sourceSubTrackId:row.sourceSubTrackId,
              sunoUrlPrimary:row.sunoUrlPrimary,openUrl:row.openUrl
            }));
          }
          NODE
