name: Apply 990 Library Aged Audio Recovery

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/apply-990-library-aged-audio-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-990-library-aged-audio-recovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply-990-library-aged-audio-recovery.py
          grep -Fq 'SORIDRAW_LIBRARY_AGED_AUDIO_RECOVERY_990' src/services/sunoAudioRecovery.ts
          grep -Fq 'SORIDRAW_LIBRARY_AGED_AUDIO_RECOVERY_990' src/pages/SunoLibraryPage.tsx
          grep -Fq 'SUNO_AUDIO_URL_RECOVERY_AFTER_MS = 13 * 24 * 60 * 60 * 1000' src/pages/SunoLibraryPage.tsx
          grep -Fq 'disabled={!canPlayOrRecover}' src/pages/SunoLibraryPage.tsx
          ! grep -Fq 'disabled={!audioUrl}' src/pages/SunoLibraryPage.tsx
          echo 'SOURCE_CONTRACT=PASS'

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/sunoAudioRecovery.ts src/pages/SunoLibraryPage.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(preview): restore aged Library audio URL recovery'
          git push origin HEAD:preview

      - name: Safety result
        run: |
          echo 'FIRESTORE_MIGRATION=false'
          echo 'FUNCTIONS_DEPLOY=false'
          echo 'CLOUDFLARE_CHANGE=false'
          echo 'VERCEL_DEPLOY_REQUEST=false'
          echo 'MAIN_CHANGE=false'
