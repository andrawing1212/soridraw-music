name: SORIDRAW Backend V2 Step 3-4f Branch Cleanup

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4f-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Remove accidental temporary branches and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete \
            preview-3-4f-write-temp \
            preview-3-4f-write-temp2 \
            preview-3-4f-write-temp3 \
            preview-3-4f-write-temp4 \
            preview-3-4f-write-temp5
          rm -f .github/workflows/backend-v2-step3-4f-branch-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/backend-v2-step3-4f-branch-cleanup.yml
          git commit -m 'chore: clean temporary Step 3-4f branches'
          git push origin HEAD:preview
