name: Temp Inspect PREVIEW Worker 1028
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-preview-worker-1028.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - name: Inspect publication delta helper
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,900));return x.result||x}
          function fn(src,name){for(const prefix of ['async function ','function ']){const s=src.indexOf(`${prefix}${name}(`);if(s<0)continue;const b=src.indexOf('{',s);let d=0,q=null,e=false;for(let i=b;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;if(c==='}'){d--;if(d===0)return src.slice(s,i+1)}}}return `MISSING ${name}`}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`,ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0],ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`),m=(ver.modules||[]).find(x=>x.name===ver.main_module)||(ver.modules||[])[0],src=Buffer.from(m.content_base64,'base64').toString('utf8');console.log('VERSION='+v.version_id);for(const n of ['syncExploreFeedR2Publication012','getOwnedTrack','refreshTrackSearchIndex','getExploreFeedItemId012'])console.log(`\n===== ${n} =====\n${fn(src,n)}\n===== END ${n} =====`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE