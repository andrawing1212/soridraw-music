name: APP518 QA R2 isolated lifecycle source check
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/media-worker/src/app518QaR2Lifecycle518.js'
      - 'qa/app518/live/verify-r2-lifecycle518.mjs'
      - '.github/workflows/temp-app518-qa-r2-source.yml'
permissions:
  contents: read
jobs:
  r2_qa_scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test exact R2 bootstrap and cleanup with fake in-memory adapters
        run: node qa/app518/live/verify-r2-lifecycle518.mjs
      - name: Check isolated worker entry syntax
        run: node --check cloudflare/media-worker/src/app518QaR2Lifecycle518.js
