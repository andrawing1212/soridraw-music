name: Diagnose header auth rendering 20260725

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'DIAGNOSE HEADER AUTH 20260725 0641C'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect exact App.tsx ranges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('src/App.tsx').read_text(encoding='utf-8').splitlines()
          for idx,(start,end) in enumerate([(3350,3445),(5250,5630)],1):
              out=[f'=== lines {start}-{end} ===']
              for n in range(start,min(end,len(lines))+1):
                  out.append(f'{n}: {lines[n-1]}')
              Path(f'header-diagnostic-{idx}.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Report excerpts
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          for f in header-diagnostic-*.txt; do
            {
              echo '```text'
              cat "$f"
              echo
              echo '```'
            } > body.md
            gh issue comment "$ISSUE_URL" --body-file body.md
          done
