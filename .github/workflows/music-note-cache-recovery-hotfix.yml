name: Music Note Preview Cache Recovery Hotfix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/music-note-cache-recovery-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: music-note-preview-cache-recovery-hotfix
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20

      - name: Lock recovery baseline
        shell: bash
        run: |
          set -euo pipefail
          SAFE_BASE='e8a4ff777d99852f8e0a98111b5eb4c44f9800bb'
          git merge-base --is-ancestor "$SAFE_BASE" HEAD
          git diff --quiet "$SAFE_BASE"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json
          echo '[Music Note Recovery] app baseline unchanged since rollback: PASS'

      - name: Apply non-destructive recovery patch
        run: python3 .deploy/apply-music-note-cache-recovery-1023.py

      - name: Static safety guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SORIDRAW_MUSIC_NOTE_PREVIEW_CACHE_RECOVERY_1023' src/App.tsx
          grep -q "host === 'preview.soridraw.com'" src/App.tsx
          grep -q '(hasCachedMusicNote && !musicNotePreviewCacheRecoveryNeeded)' src/App.tsx
          grep -q '!musicNotePreviewCacheRecoveryNeeded && hasCachedMusicNote' src/App.tsx
          grep -q 'markMusicNotePreviewCacheRecoveryComplete(currentUser.uid)' src/App.tsx
          git diff -U0 -- src/App.tsx > "$RUNNER_TEMP/recovery.diff"
          if grep -E '^\+.*(deleteDoc\(|writeBatch\(|setDoc\(|updateDoc\(|removeItem\(getMusicNotePayloadCacheKey)' "$RUNNER_TEMP/recovery.diff"; then
            echo '[Music Note Recovery] destructive/server mutation added by recovery patch'
            exit 4
          fi
          changed="$(git diff --name-only)"
          test "$changed" = 'src/App.tsx'
          echo '[Music Note Recovery] preview-only merge recovery, no payload/server deletion: PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix(music-note): recover partial preview cache safely'
          git push origin HEAD:preview
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"

      - name: Deploy Firebase PREVIEW only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive

      - name: Verify exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok='yes'
                  echo "[Music Note Recovery] exact build PASS: $url"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = 'yes'
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          cmp "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '[Music Note Recovery] production unchanged: PASS'

      - name: Cleanup temporary recovery files
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin preview
          git rm .github/workflows/music-note-cache-recovery-hotfix.yml .deploy/apply-music-note-cache-recovery-1023.py
          git commit -m 'chore(preview): remove temporary Music Note recovery tools'
          git push origin HEAD:preview
