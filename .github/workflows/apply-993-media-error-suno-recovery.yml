name: Apply 993 Media Error Suno Recovery

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/apply-993-media-error-suno-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-993-media-error-suno-recovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded media error recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply-993-media-error-suno-recovery.py
          grep -Fq 'SORIDRAW_MEDIA_ERROR_RECOVERY_993' src/contexts/GlobalPlayerContext.tsx
          grep -Fq "attemptPlaybackRecovery(track, audio.error || new Error('audio element error'))" src/contexts/GlobalPlayerContext.tsx
          grep -Fq 'const playbackRecoveryAttemptedRef = useRef(false);' src/contexts/GlobalPlayerContext.tsx
          grep -Fq 'getFirebaseAppCheckToken' src/services/sunoAudioRecovery.ts
          grep -Fq "'X-Firebase-AppCheck': appCheckToken" src/services/sunoAudioRecovery.ts
          grep -Fq "ordered.find((url) => url !== normalizedFailed) || ordered[0] || ''" src/services/sunoAudioRecovery.ts
          echo 'MEDIA_ERROR_RECOVERY_CONTRACT=PASS'

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contexts/GlobalPlayerContext.tsx src/services/sunoAudioRecovery.ts
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(preview): recover Suno tracks on late media errors'
          git push origin HEAD:preview

      - name: Safety result
        run: |
          echo 'FUNCTIONS_DEPLOY=false'
          echo 'FIRESTORE_MIGRATION=false'
          echo 'CLOUDFLARE_CHANGE=false'
          echo 'VERCEL_DEPLOY=false'
          echo 'MAIN_CHANGE=false'
