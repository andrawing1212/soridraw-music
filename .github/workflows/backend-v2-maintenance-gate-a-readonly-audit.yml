name: SORIDRAW Backend V2 Maintenance Gate A Read-only Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-maintenance-gate-a-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout preview with Node24-compatible action runtime
        uses: actions/checkout@v7
        with:
          ref: preview

      - name: Set up project Node 20 with Node24-compatible action runtime
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Record runtime contract
        shell: bash
        run: |
          set -euo pipefail
          echo "GATEA_NODE=$(node --version)"
          echo "GATEA_NPM=$(npm --version)"
          test "$(node --version)" = "v20.20.2"

      - name: Install dependencies without lifecycle mutation scripts
        run: npm ci --ignore-scripts

      - name: Full project TypeScript diagnostic
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/gatea-tsc.log 2>&1
          code=$?
          echo "GATEA_TSC_EXIT=${code}"
          cat /tmp/gatea-tsc.log
          exit 0

      - name: Dependency security audit
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/gatea-npm-audit.json
          audit_code=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/gatea-npm-audit.json').read_text())
          meta=data.get('metadata',{}).get('vulnerabilities',{})
          print('GATEA_AUDIT_COUNTS='+json.dumps(meta,sort_keys=True))
          vulns=data.get('vulnerabilities',{})
          rows=[]
          for name,info in sorted(vulns.items()):
              via=[]
              for item in info.get('via',[]):
                  if isinstance(item,str):
                      via.append(item)
                  else:
                      via.append({
                          'source': item.get('source'),
                          'name': item.get('name'),
                          'severity': item.get('severity'),
                          'title': item.get('title'),
                          'url': item.get('url'),
                          'range': item.get('range'),
                      })
              rows.append({
                  'name':name,
                  'severity':info.get('severity'),
                  'isDirect':info.get('isDirect'),
                  'range':info.get('range'),
                  'nodes':len(info.get('nodes',[])),
                  'via':via,
                  'effects':info.get('effects',[]),
                  'fixAvailable':info.get('fixAvailable'),
              })
          print('GATEA_AUDIT_VULNERABILITIES='+json.dumps(rows,ensure_ascii=False,sort_keys=True))
          PY
          echo "GATEA_AUDIT_EXIT=${audit_code}"

      - name: Inventory action runtime references
        shell: bash
        run: |
          set -euo pipefail
          echo 'GATEA_ACTION_REFS_BEGIN'
          grep -RhoE 'uses: (actions/(checkout|setup-node)@v[0-9]+|google-github-actions/auth@v[0-9]+)' .github/workflows | sort | uniq -c || true
          echo 'GATEA_ACTION_REFS_END'
          echo "GATEA_LATEST_POLICY=checkout@v7 setup-node@v7 auth@v3; project commands remain Node20.20.2"

      - name: Authenticate read-only inspection credential
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Inspect deployed Firestore Rules release read-only
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          release_url='https://firebaserules.googleapis.com/v1/projects/soridraw-app-866a5/releases/cloud.firestore'
          release_code="$(curl -sS -o /tmp/gatea-release.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "${release_url}")"
          echo "GATEA_RULES_RELEASE_HTTP=${release_code}"
          if [ "${release_code}" != "200" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/gatea-release.json')
          try:
              d=json.loads(p.read_text())
              err=d.get('error',{})
              print('GATEA_RULES_RELEASE_ERROR='+json.dumps({'code':err.get('code'),'status':err.get('status'),'message':err.get('message')},ensure_ascii=False))
          except Exception:
              print('GATEA_RULES_RELEASE_ERROR=unparseable')
          PY
            exit 0
          fi
          ruleset="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/gatea-release.json')).get('rulesetName',''))
          PY
          )"
          echo "GATEA_DEPLOYED_RULESET=${ruleset}"
          test -n "${ruleset}"
          ruleset_code="$(curl -sS -o /tmp/gatea-ruleset.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "https://firebaserules.googleapis.com/v1/${ruleset}")"
          echo "GATEA_RULESET_HTTP=${ruleset_code}"
          if [ "${ruleset_code}" != "200" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          deployed=json.load(open('/tmp/gatea-ruleset.json'))
          files=deployed.get('source',{}).get('files',[])
          target=None
          for f in files:
              if f.get('name') in ('firestore.rules','cloud.firestore') or 'firestore' in f.get('name',''):
                  target=f.get('content','')
                  break
          if target is None and len(files)==1:
              target=files[0].get('content','')
          repo=Path('firestore.rules').read_text(encoding='utf-8')
          def norm(s):
              return s.replace('\r\n','\n').strip()+'\n'
          deployed_norm=norm(target or '')
          repo_norm=norm(repo)
          print('GATEA_RULES_FILE_COUNT='+str(len(files)))
          print('GATEA_DEPLOYED_RULES_SHA256='+hashlib.sha256(deployed_norm.encode()).hexdigest())
          print('GATEA_REPO_RULES_SHA256='+hashlib.sha256(repo_norm.encode()).hexdigest())
          print('GATEA_RULES_EXACT_MATCH='+str(deployed_norm==repo_norm).lower())
          print('GATEA_DEPLOYED_HAS_V2_SONG_RULE='+str('match /songs/{songId}' in deployed_norm and 'hasValidV2SongMetadata' in deployed_norm).lower())
          print('GATEA_DEPLOYED_HAS_V1_RECENT_RULE='+str('match /user_recent_songs/{uid}' in deployed_norm).lower())
          print('GATEA_DEPLOYED_HAS_FAVORITES_RULE='+str('match /favorites/{favoriteId}' in deployed_norm).lower())
          print('GATEA_RULESET_CREATE_TIME='+str(deployed.get('createTime','')))
          PY

      - name: No-write scope assertion
        shell: bash
        run: |
          set -euo pipefail
          echo 'GATEA_FIREBASE_DATA_READS=0 (Rules API metadata/source only; no Firestore document API invoked)'
          echo 'GATEA_FIREBASE_DATA_WRITES=0'
          echo 'GATEA_FIREBASE_DATA_DELETES=0'
          echo 'GATEA_RULES_DEPLOYS=0'
          echo 'GATEA_FUNCTIONS_DEPLOYS=0'
          echo 'GATEA_HOSTING_DEPLOYS=0'
