name: SORIDRAW APP728 direct PRODUCTION preflight (read only)

on:
  # APP756: one GET-only source-review generation on a vetted main change.
  # No deploy, no artifact of active Worker bytes, no backend/data writes.
  push:
    branches: [main]
    paths:
      - 'scripts/app728-production-source-candidate.mjs'
      - 'scripts/verify-756-production-off-candidate.mjs'
      - '.github/workflows/soridraw-app728-direct-preflight.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact full SHA of current preview HEAD; no TEST promotion or deployment'
        type: string
        required: true
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/app728-binding-diff.mjs'
      - 'scripts/verify-728-binding-diff.mjs'
      - 'scripts/app728-production-binding-candidate.mjs'
      - 'scripts/verify-728-production-binding-candidate.mjs'
      - 'scripts/app728-active-code-provenance.mjs'
      - 'scripts/verify-728-active-code-provenance.mjs'
      - 'scripts/app728-production-source-candidate.mjs'
      - 'scripts/verify-728-production-source-candidate.mjs'
      - 'scripts/app729-production-follow-adapter.mjs'
      - 'scripts/app729-production-follow-entry.mjs'
      - 'scripts/verify-729-production-follow-integration.mjs'
      - 'scripts/app730-source-only-follow-bridge.mjs'
      - 'scripts/verify-730-source-only-follow-bridge.mjs'
      - 'scripts/app743-production-follow-bridge.mjs'
      - 'scripts/verify-743-production-follow-bridge.mjs'
      - 'scripts/app753-production-follow-composition.mjs'
      - 'scripts/verify-753-production-follow-composition.mjs'
      - 'scripts/app754-production-firebase-principal.mjs'
      - 'scripts/verify-754-production-firebase-principal.mjs'
      - 'scripts/app755-production-owner-receipt.mjs'
      - 'scripts/app755-production-follow-backend.mjs'
      - 'scripts/verify-755-production-follow-backend.mjs'
      - 'scripts/verify-762-owner-receipt-archive.mjs'
      - 'scripts/app759-production-owner-alarm.mjs'
      - 'scripts/verify-759-production-owner-alarm.mjs'
      - 'scripts/app761-production-owner-do-runtime.mjs'
      - 'scripts/verify-761-production-owner-do-runtime.mjs'
      - 'scripts/verify-756-production-off-candidate.mjs'
      - '.github/workflows/soridraw-app728-direct-preflight.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-app728-direct-preflight
  cancel-in-progress: false

jobs:
  production_off_candidate_756:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'andrawing1212/soridraw-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin reviewed main and PREVIEW source, without remote changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main preview --no-tags
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA" || {
            echo 'APP756_MAIN_CONTROLLER_MOVED_HOLD'; exit 2;
          }
          PREVIEW_SHA="$(git rev-parse refs/remotes/origin/preview)"
          test "$PREVIEW_SHA" = '4363820117100cb03bcbc44a01e127aeb5de3cf4' || {
            echo 'APP756_PREVIEW_SOURCE_DRIFT_HOLD'; exit 2;
          }
          git worktree add --detach "$RUNNER_TEMP/app756-preview-source" "$PREVIEW_SHA"
          echo "APP728_SOURCE_DIR=$RUNNER_TEMP/app756-preview-source" >> "$GITHUB_ENV"
          echo "APP728_SOURCE_SHA=$PREVIEW_SHA" >> "$GITHUB_ENV"
          echo "APP728_LOCKED_PREVIEW_SHA=$PREVIEW_SHA" >> "$GITHUB_ENV"
      - name: GET-only pinned active PROD Worker and assemble OFF candidate in runner temp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/app728-production-source-candidate.mjs
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$APP728_SOURCE_SHA" || {
            echo 'APP756_PREVIEW_CHANGED_DURING_READ_HOLD'; exit 2;
          }
          echo 'APP756_ACTIVE_PRODUCTION_SOURCE_ONLY_CANDIDATE=PASS; PROD_RELEASE=HOLD; MUTATIONS=0'

  preflight:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 1245 &&
      github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/app728-readonly ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable controller from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Lock exact preview source with no branch changes
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            TARGET_SHA="$(printf '%s' "$COMMENT_BODY" | sed -nE 's@^/app728-readonly ([0-9a-f]{40})$@\1@p')"
          fi
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin preview production --no-tags
          test "$TARGET_SHA" = "$(git rev-parse origin/preview)" || { echo 'PREVIEW_HEAD_DRIFT'; exit 2; }
          git cat-file -e "$TARGET_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/app728-source" "$TARGET_SHA"
          echo "APP728_SOURCE_DIR=$RUNNER_TEMP/app728-source" >> "$GITHUB_ENV"
          echo "APP728_SOURCE_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "APP728_LOCKED_PREVIEW_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "APP728_CONTROLLER_SHA=$GITHUB_WORKFLOW_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offline APP728 release contract tests (no cloud access)
        run: |
          node scripts/verify-728-direct-preflight.mjs
          node scripts/verify-728-release-plan.mjs
          node scripts/verify-728-pinned-worker.mjs

      - name: Build exact preview source once, without deploying
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP728_SOURCE_DIR"
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

      - name: Existing Firebase read permission only
        uses: google-github-actions/auth@v2
        id: firebase_auth
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token

      - name: Active PREVIEW/PRODUCTION contracts (GET only, HOLD on uncertainty)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$APP728_SOURCE_SHA" || { echo 'PREVIEW_HEAD_CHANGED'; exit 2; }
          node scripts/app728-direct-preflight.mjs

      - name: Final source immutability check
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$APP728_SOURCE_SHA"
          test "$(git -C "$APP728_SOURCE_DIR" rev-parse HEAD)" = "$APP728_SOURCE_SHA"
          echo 'APP728_READ_ONLY_COMPLETED=PASS'

  offline_binding_diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check binding comparison with synthetic data only
        run: |
          node --check scripts/app728-binding-diff.mjs
          node scripts/verify-728-binding-diff.mjs
          node --check scripts/app728-production-binding-candidate.mjs
          node scripts/verify-728-production-binding-candidate.mjs
          node --check scripts/app728-active-code-provenance.mjs
          node scripts/verify-728-active-code-provenance.mjs
          node --check scripts/app728-production-source-candidate.mjs
          node scripts/verify-728-production-source-candidate.mjs
          node --check scripts/app729-production-follow-adapter.mjs
          node --check scripts/app729-production-follow-entry.mjs
          node scripts/verify-729-production-follow-integration.mjs
          node --check scripts/app730-source-only-follow-bridge.mjs
          node scripts/verify-730-source-only-follow-bridge.mjs
          node --check scripts/app743-production-follow-bridge.mjs
          node scripts/verify-743-production-follow-bridge.mjs
          node --check scripts/app753-production-follow-composition.mjs
          node scripts/verify-753-production-follow-composition.mjs
          node --check scripts/app754-production-firebase-principal.mjs
          node scripts/verify-754-production-firebase-principal.mjs
          node --check scripts/app755-production-owner-receipt.mjs
          node --check scripts/app755-production-follow-backend.mjs
          node scripts/verify-755-production-follow-backend.mjs
          node scripts/verify-762-owner-receipt-archive.mjs
          node --check scripts/app759-production-owner-alarm.mjs
          node scripts/verify-759-production-owner-alarm.mjs
          node --check scripts/app761-production-owner-do-runtime.mjs
          node scripts/verify-761-production-owner-do-runtime.mjs
          node scripts/verify-756-production-off-candidate.mjs

  binding_diff:
    if: >-
      github.actor == github.repository_owner &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1245 &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/app728-bindings ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock exact current PREVIEW identity
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(printf '%s' "$COMMENT_BODY" | sed -nE 's@^/app728-bindings ([0-9a-f]{40})$@\1@p')"
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin preview --no-tags
          test "$TARGET_SHA" = "$(git rev-parse origin/preview)" || { echo 'PREVIEW_HEAD_DRIFT'; exit 2; }
          echo "APP728_READONLY_PREVIEW_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
      - name: Synthetic binding-diff guards
        run: node scripts/verify-728-binding-diff.mjs
      - name: GET-only active bindings inventory (not release approval)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/app728-binding-diff.mjs
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$APP728_READONLY_PREVIEW_SHA"
          echo 'APP728_BINDING_INVENTORY_CAPTURED=PASS; PRODUCTION_RELEASE=HOLD'

  live_code_provenance:
    if: >-
      github.actor == github.repository_owner &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1245 &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/app728-code ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freeze exact PREVIEW source without modifying repository or cloud
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(printf '%s' "$COMMENT_BODY" | sed -nE 's@^/app728-code ([0-9a-f]{40})$@\1@p')"
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin preview --no-tags
          test "$TARGET_SHA" = "$(git rev-parse origin/preview)" || { echo 'PREVIEW_HEAD_DRIFT'; exit 2; }
          git cat-file -e "$TARGET_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/app728-source" "$TARGET_SHA"
          echo "APP728_SOURCE_DIR=$RUNNER_TEMP/app728-source" >> "$GITHUB_ENV"
          echo "APP728_SOURCE_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "APP728_LOCKED_PREVIEW_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
      - name: Code provenance synthetic negative tests (offline)
        run: node scripts/verify-728-active-code-provenance.mjs
      - name: GET only four active Worker code versions; hashes and evidence flags only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/app728-active-code-provenance.mjs
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$APP728_SOURCE_SHA" || { echo 'PREVIEW_HEAD_CHANGED'; exit 2; }
          echo 'APP728_ACTIVE_CODE_READONLY=PASS; PRODUCTION_RELEASE=HOLD'

  production_source_candidate:
    if: >-
      github.actor == github.repository_owner &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1245 &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/app728-source ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock exact preview source (no cloud writes)
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(printf '%s' "$COMMENT_BODY" | sed -nE 's@^/app728-source ([0-9a-f]{40})$@\1@p')"
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin preview --no-tags
          test "$TARGET_SHA" = "$(git rev-parse origin/preview)" || { echo 'APP728_PREVIEW_HEAD_DRIFT'; exit 2; }
          git worktree add --detach "$RUNNER_TEMP/app728-source" "$TARGET_SHA"
          echo "APP728_SOURCE_DIR=$RUNNER_TEMP/app728-source" >> "$GITHUB_ENV"
          echo "APP728_SOURCE_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "APP728_LOCKED_PREVIEW_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
      - name: Synthetic preservation, source isolation and OFF integration checks
        run: |
          node scripts/verify-728-production-source-candidate.mjs
          node scripts/verify-729-production-follow-integration.mjs
          node scripts/verify-730-source-only-follow-bridge.mjs
          node --check scripts/app743-production-follow-bridge.mjs
          node scripts/verify-743-production-follow-bridge.mjs
          node --check scripts/app753-production-follow-composition.mjs
          node scripts/verify-753-production-follow-composition.mjs
          node --check scripts/app754-production-firebase-principal.mjs
          node scripts/verify-754-production-firebase-principal.mjs
          node --check scripts/app755-production-owner-receipt.mjs
          node --check scripts/app755-production-follow-backend.mjs
          node scripts/verify-755-production-follow-backend.mjs
          node scripts/verify-762-owner-receipt-archive.mjs
          node --check scripts/app759-production-owner-alarm.mjs
          node scripts/verify-759-production-owner-alarm.mjs
          node --check scripts/app761-production-owner-do-runtime.mjs
          node scripts/verify-761-production-owner-do-runtime.mjs
          node scripts/verify-756-production-off-candidate.mjs
      - name: Generate exact production baseline and quarantined PREVIEW modules in runner temp only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/app728-production-source-candidate.mjs
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$APP728_SOURCE_SHA" || { echo 'APP728_PREVIEW_CHANGED_DURING_READ'; exit 2; }
          echo 'APP728_PRODUCTION_SOURCE_CANDIDATE=PASS_SOURCE_ONLY; RUNTIME_RELEASE=HOLD'
