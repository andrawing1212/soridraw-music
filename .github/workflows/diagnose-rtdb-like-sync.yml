name: SORIDRAW Readonly RTDB Like Sync Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/diagnose-rtdb-like-sync.trigger'
      - '.github/workflows/diagnose-rtdb-like-sync.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-readonly-rtdb-like-sync-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Authenticate shared Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Mint read-only diagnostic OAuth token
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          p=os.environ.get('GOOGLE_GHA_CREDS_PATH') or os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
          if not p:
              raise SystemExit('credential file missing')
          creds=service_account.Credentials.from_service_account_file(
              p,
              scopes=['https://www.googleapis.com/auth/firebase.database','https://www.googleapis.com/auth/userinfo.email'],
          )
          creds.refresh(Request())
          if not creds.token:
              raise SystemExit('token unavailable')
          Path(os.environ['RUNNER_TEMP'],'rtdb-token').write_text(creds.token,encoding='utf-8')
          print('RTDB_DIAG_AUTH=PASS')
          PY

      - name: Read live rules and account like-signal summary only
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/rtdb-token")"
          base='https://soridraw-app-866a5-default-rtdb.firebaseio.com'
          curl -fsS --max-time 30 "$base/.settings/rules.json?access_token=$token" -o "$RUNNER_TEMP/live-rules.json"
          python3 - <<'PY'
          import hashlib, json, pathlib
          local=json.loads(pathlib.Path('database.rules.json').read_text())
          remote=json.loads(pathlib.Path(__import__('os').environ['RUNNER_TEMP']+'/live-rules.json').read_text())
          def canon(x):
              return json.dumps(x,sort_keys=True,separators=(',',':')).encode()
          print('LIVE_RTDB_RULES_MATCH_SOURCE=' + ('PASS' if canon(local)==canon(remote) else 'FAIL'))
          print('LIVE_RTDB_RULES_SHA256='+hashlib.sha256(canon(remote)).hexdigest())
          PY

          curl -fsS --max-time 30 "$base/userSync.json?shallow=true&access_token=$token" -o "$RUNNER_TEMP/uids.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time, urllib.parse
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          raw=json.loads((temp/'uids.json').read_text() or 'null') or {}
          uids=list(raw.keys()) if isinstance(raw,dict) else []
          token=(temp/'rtdb-token').read_text().strip()
          base='https://soridraw-app-866a5-default-rtdb.firebaseio.com'
          signals=[]
          for uid in uids:
              url=f"{base}/userSync/{urllib.parse.quote(uid,safe='')}/exploreLike.json?access_token={urllib.parse.quote(token,safe='')}"
              p=subprocess.run(['curl','-fsS','--max-time','10',url],capture_output=True,text=True)
              if p.returncode!=0:
                  continue
              try: data=json.loads(p.stdout or 'null')
              except Exception: continue
              if not isinstance(data,dict): continue
              version=data.get('version')
              prev=data.get('previousVersion')
              rows=data.get('results')
              if isinstance(version,(int,float)):
                  signals.append((int(version),int(prev or 0),len(rows) if isinstance(rows,list) else (len(rows) if isinstance(rows,dict) else 0)))
          signals.sort(reverse=True)
          now=int(time.time()*1000)
          print(f'RTDB_LIKE_SIGNAL_ACCOUNTS={len(signals)}')
          if signals:
              v,p,c=signals[0]
              print(f'RTDB_LATEST_SIGNAL_AGE_SECONDS={max(0,(now-v)//1000)}')
              print(f'RTDB_LATEST_SIGNAL_RESULT_COUNT={c}')
              print(f'RTDB_LATEST_SIGNAL_VERSION_CHAIN_OK={str(v>p).upper()}')
              print(f'RTDB_LATEST_SIGNAL_WITHIN_15_MIN={str(now-v <= 15*60*1000).upper()}')
          else:
              print('RTDB_LATEST_SIGNAL_WITHIN_15_MIN=FALSE')
          print('RTDB_USER_DATA_WRITE=0')
          PY
          rm -f "$RUNNER_TEMP/rtdb-token"
