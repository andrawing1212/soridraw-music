name: SORIDRAW Gate A Dependency Candidate Simulation

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-maintenance-gate-a-dependency-candidate.yml'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Simulate safe non-force remediation in runner only
        shell: bash
        run: |
          set -euo pipefail
          before_pkg="$(sha256sum package.json | awk '{print $1}')"
          set +e
          npm audit fix --ignore-scripts
          fix_code=$?
          set -e
          after_pkg="$(sha256sum package.json | awk '{print $1}')"
          echo "GATEA_CANDIDATE_AUDIT_FIX_EXIT=${fix_code}"
          echo "GATEA_CANDIDATE_PACKAGE_JSON_UNCHANGED=$([ "$before_pkg" = "$after_pkg" ] && echo true || echo false)"
          echo 'GATEA_CANDIDATE_DIFF_NUMSTAT_BEGIN'
          git diff --numstat -- package.json package-lock.json
          echo 'GATEA_CANDIDATE_DIFF_NUMSTAT_END'
          echo 'GATEA_CANDIDATE_PACKAGE_JSON_DIFF_BEGIN'
          git diff -- package.json
          echo 'GATEA_CANDIDATE_PACKAGE_JSON_DIFF_END'
      - name: Audit candidate state
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/gatea-candidate-audit.json
          audit_code=$?
          set -e
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/gatea-candidate-audit.json'))
          meta=d.get('metadata',{}).get('vulnerabilities',{})
          print('GATEA_CANDIDATE_AUDIT_COUNTS='+json.dumps(meta,sort_keys=True))
          high_or_critical=[]
          for name,info in sorted(d.get('vulnerabilities',{}).items()):
              if info.get('severity') in ('high','critical'):
                  high_or_critical.append({
                      'name':name,
                      'severity':info.get('severity'),
                      'isDirect':info.get('isDirect'),
                      'range':info.get('range'),
                      'fixAvailable':info.get('fixAvailable'),
                  })
          print('GATEA_CANDIDATE_HIGH_CRITICAL='+json.dumps(high_or_critical,sort_keys=True))
          PY
          echo "GATEA_CANDIDATE_AUDIT_EXIT=${audit_code}"
      - name: Candidate dependency versions
        shell: bash
        run: |
          set +e
          npm ls axios react-router-dom react-router vite esbuild protobufjs websocket-driver ws @grpc/grpc-js postcss nanoid firebase firebase-admin express jimp --all
          exit 0
      - name: Candidate production build
        run: npx vite build
      - name: Prove simulation did not alter repository
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fdx -e node_modules
          git status --short
          test -z "$(git status --porcelain)"
          echo 'GATEA_CANDIDATE_REPO_PERSISTED_WRITES=0'
          echo 'GATEA_CANDIDATE_FIREBASE_IO=0'
