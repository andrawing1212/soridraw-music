name: TEMP Dispatch SORIDRAW PRODUCTION Release

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-production-promotion.trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch immutable TEST_VERIFIED production release
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_TAG: soridraw-test-v356-0bab8cdb2492
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref preview --arg mode production --arg tag "$MANIFEST_TAG" --arg approval DEPLOY_PRODUCTION '{ref:$ref,inputs:{mode:$mode,manifest_tag:$tag,production_approval:$approval}}')"
          code="$(curl -sS -o "$RUNNER_TEMP/dispatch.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/soridraw-release-promotion.yml/dispatches" \
            -d "$payload")"
          test "$code" = "204"
          echo "SORIDRAW_PRODUCTION_RELEASE_DISPATCH=PASS"
