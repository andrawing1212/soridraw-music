name: TEMP Release Firebase TEST 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-release-test-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-release-firebase-test-20260904
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BACKEND_PROJECT: soridraw-app-866a5
      HOSTING_PROJECT: soridraw
      TEST_SITE: soridraw-test
      TEST_WEB_HOST: soridraw-test.web.app
      TEST_FIREBASE_HOST: soridraw-test.firebaseapp.com
      TEST_CUSTOM_HOST: test.soridraw.com
      TEST_EXPLORE_ORIGIN: https://soridraw-explore-test.andrawing1212.workers.dev
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build exact main
        run: npm run build

      - name: Verify current environment routing
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "https://soridraw-explore-test.andrawing1212.workers.dev" src/config/exploreEnvironment.ts
          grep -Fq "host === 'test.soridraw.com'" src/config/exploreEnvironment.ts
          grep -Fq '"site": "soridraw-test"' firebase.hosting-test.json
          echo '[TEST] Environment routing source: PASS'

      - name: Authenticate Google and Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production before TEST deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Assert Hosting sites exist
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest hosting:sites:list --project "$HOSTING_PROJECT" --json > "$RUNNER_TEMP/sites.json"
          node - "$RUNNER_TEMP/sites.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const candidates = [payload?.result?.sites, payload?.result, payload?.sites, payload];
          const sites = candidates.find(Array.isArray) || [];
          const ids = sites.map((site) => {
            const raw = String(site?.site || site?.siteId || site?.id || site?.name || '');
            return raw.includes('/') ? raw.split('/').filter(Boolean).pop() : raw;
          }).filter(Boolean);
          for (const wanted of ['soridraw', 'soridraw-test']) {
            if (!ids.includes(wanted)) throw new Error(`Missing Hosting site: ${wanted}`);
          }
          console.log('[TEST] Hosting site isolation: PASS');
          NODE

      - name: Deploy main to Firebase TEST only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$HOSTING_PROJECT" \
            --config firebase.hosting-test.json \
            --non-interactive
          echo '[TEST] Firebase Hosting deploy: PASS'

      - name: Smoke TEST hosts
        shell: bash
        run: |
          set -euo pipefail
          for host in "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" "$TEST_CUSTOM_HOST"; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 "https://$host/" -o "$RUNNER_TEMP/test-$attempt.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/test-$attempt.html"; then
                echo "[TEST] Smoke PASS: https://$host/"
                ok=yes
                break
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify TEST Explore physical environment
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/explore.json" -D "$RUNNER_TEMP/explore.headers" -w '%{http_code}' \
            -H "Origin: https://$TEST_CUSTOM_HOST" \
            "$TEST_EXPLORE_ORIGIN/v1/feed?sort=latest&limit=1" || true)"
          allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' "$RUNNER_TEMP/explore.headers")"
          echo "[TEST] Explore HTTP=$code allow=${allow:-none}"
          test "$code" = '200'
          test "$allow" = "https://$TEST_CUSTOM_HOST"
          grep -q 'data' "$RUNNER_TEMP/explore.json"
          echo '[TEST] Explore Worker/D1/R2 route smoke: PASS'

      - name: Verify production Hosting unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo '[TEST] Production Hosting unchanged: PASS'

      - name: Result
        run: |
          echo 'FIREBASE_TEST_DEPLOY_COMPLETE=true'
          echo 'TEST_URL=https://test.soridraw.com/'
          echo 'NO_PRODUCTION_HOSTING_DEPLOY=true'
          echo 'NO_FUNCTIONS_DEPLOY=true'
          echo 'NO_FIRESTORE_OR_RULES_DEPLOY=true'
