name: SORIDRAW app515 Shared Firebase Live Inventory (Read-only)

# Manual only (workflow UI or exact owner-only PR comment). No push/schedule trigger or deployment.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: app515-shared-firebase-readonly
  cancel-in-progress: false

jobs:
  shared-firebase-inventory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 523 &&
       github.actor == 'andrawing1212' &&
       github.event.comment.body == '/app515-firebase-inventory-20261028')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate using existing GitHub secret
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Install Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Inspect exact shared-project Rules and Functions (metadata only)
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
          APP515_REPORT_PATH: ${{ runner.temp }}/app515-shared-firebase-inventory.json
        run: python3 scripts/app515-shared-firebase-readonly.py
      - name: Preserve sanitized report without repository commits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app515-shared-firebase-readonly-result
          path: ${{ runner.temp }}/app515-shared-firebase-inventory.json
          if-no-files-found: warn
          retention-days: 7
