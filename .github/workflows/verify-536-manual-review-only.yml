name: SORIDRAW 536 Isolated Admin Hold Approval Emulator
# One-time source-only test; never deploy. Delete after successful run.
on:
  pull_request:
    branches: [preview]
    types: [opened, reopened, synchronize]
    paths:
      - 'functions/src/ownerFollowManualReview536.ts'
      - 'scripts/test-536-owner-manual-review.mjs'
      - '.github/workflows/verify-536-manual-review-only.yml'
permissions: {contents: read}
concurrency:
  group: soridraw-536-isolated-auth-review
  cancel-in-progress: false
jobs:
  auth-rtdb-firestore:
    if: github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == 'andrawing1212/soridraw-music' && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      APP534_ISOLATED_ONLY: 'yes'
      GCLOUD_PROJECT: demo-soridraw-owner-534
      FIREBASE_PROJECT_ID: demo-soridraw-owner-534
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify demo-only source and config
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = "demo-soridraw-owner-534"
          node --check scripts/test-536-owner-manual-review.mjs
          node -e "const c=JSON.parse(require('fs').readFileSync('scripts/emulator/app534.firebase.json'));if(c.firestore.rules!=='app534.firestore.rules'||c.database.rules!=='app533.database.rules.json')process.exit(3)"
          grep -q 'APP536_ADMIN_RECOVERY_COMPILED_OPEN=false' functions/src/ownerFollowManualReview536.ts
      - name: Install compile and emulator dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
      - name: Strict Functions TypeScript
        run: ./functions/node_modules/.bin/tsc --noEmit --project functions/tsconfig.json
      - name: Run actual isolated Firebase emulator and bounded admin approval scenarios
        run: |
          set -euo pipefail
          env -u GOOGLE_APPLICATION_CREDENTIALS -u FIREBASE_TOKEN npx --yes firebase-tools@14.23.0 emulators:exec \
            --project demo-soridraw-owner-534 \
            --config scripts/emulator/app534.firebase.json \
            --only auth,database,firestore \
            'env -u GOOGLE_APPLICATION_CREDENTIALS -u FIREBASE_TOKEN node --import tsx scripts/test-536-owner-manual-review.mjs'
      - name: No shared resources or deploy
        if: always()
        run: echo 'APP536_DEMO_ONLY_OFF_NO_SHARED_AUTH_DB_WORKER_FUNCTIONS_RULES_HOSTING_DEPLOY'
