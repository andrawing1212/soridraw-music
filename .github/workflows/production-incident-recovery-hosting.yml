name: SORIDRAW PRODUCTION Incident Recovery Hosting

on:
  push:
    branches: [production]
    paths:
      - '.deploy/production-incident-recovery.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-production-incident-recovery-hosting
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT: soridraw
      PRODUCTION_URL: https://soridraw.com
      PRODUCTION_FIREBASE_URL: https://soridraw.web.app

    steps:
      - name: Checkout exact production incident source
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Lock incident scope and unaffected refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main production --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/production)"
          source .deploy/production-incident-recovery.trigger
          test "$INCIDENT" = "music-note-publication-origin-parity-361"
          test "$(git rev-parse "$BASE_PRODUCTION^{commit}")" = "$BASE_PRODUCTION"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/preview)" = "$EXPECTED_PREVIEW"
          changed="$(git diff --name-only "$BASE_PRODUCTION"..HEAD | sort)"
          allowed="$(printf '%s\n'             .deploy/production-incident-recovery.trigger             .github/workflows/production-incident-recovery-hosting.yml             public/app-version.json             scripts/verify-371-music-note-publication-origin-parity.ts             src/pages/FavoritesPage.tsx             src/services/exploreEnvironmentParityPolicy.ts             src/services/explorePublicationService.ts | sort)"
          test "$changed" = "$allowed" || {
            echo "Unexpected production incident scope:"
            printf '%s\n' "$changed"
            exit 3
          }
          echo "PRODUCTION_INCIDENT_SCOPE=PASS"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Focused state and parity regression
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/verify-371-music-note-publication-origin-parity.ts
          npx tsx scripts/verify-367-production-browser-upgrade-contract.ts
          npx tsx scripts/verify-368-live-profile-like-convergence.ts
          npx tsx scripts/verify-369-my-likes-settlement-upgrade.ts
          npx tsx scripts/verify-370-my-likes-navigation-worker-zero.ts
          npx tsx scripts/verify-196-recent-song-sync.ts
          node scripts/verify-301-library-folder-create-delete-cost.mjs
          node scripts/verify-349-studio-heart-settlement-media.mjs
          node -e "const v=require('./public/app-version.json').version;if(v!==361)throw Error('expected app361')"
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/index.sha"
          echo "PRODUCTION_INCIDENT_STATIC_VERIFY=PASS"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PRODUCTION Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --only hosting             --project "$FIREBASE_PROJECT"             --config firebase.hosting-production.json             --non-interactive
          echo "PRODUCTION_INCIDENT_HOSTING_DEPLOY=PASS"

      - name: Verify exact live app361 and unaffected refs
        shell: bash
        run: |
          set -euo pipefail
          source .deploy/production-incident-recovery.trigger
          expected="$(cat "$RUNNER_TEMP/index.sha")"
          for base in "$PRODUCTION_FIREBASE_URL" "$PRODUCTION_URL"; do
            matched=false
            for attempt in $(seq 1 12); do
              version="$(curl -fsS --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$base/app-version.json" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || true)"
              curl -fsS --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$base/" -o "$RUNNER_TEMP/live.html" || true
              actual="$(sha256sum "$RUNNER_TEMP/live.html" 2>/dev/null | cut -d' ' -f1 || true)"
              echo "LIVE_CHECK base=$base attempt=$attempt version=$version index=$actual expected=$expected"
              if [ "$version" = 361 ] && [ "$actual" = "$expected" ]; then
                matched=true
                break
              fi
              sleep 5
            done
            test "$matched" = true
          done
          git fetch origin preview main production --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/preview)" = "$EXPECTED_PREVIEW"
          echo "PRODUCTION_INCIDENT_EXACT_BUILD=PASS"
          echo "TEST_PREVIEW_RUNTIME_NOT_DEPLOYED=PASS"
