name: APP797 existing follow writer production source candidate (read-only)
on:
  push:
    branches: [prep/production-follow-existing-writer]
    paths:
      - 'scripts/app797-stage-inactive-connection.mjs'
      - '.github/workflows/app797-production-follow-candidate.yml'
permissions:
  contents: read
concurrency:
  group: app797-one-time-inactive-connection
  cancel-in-progress: false
jobs:
  candidate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Director-approved isolated connection versions only (no traffic, no deploy)
        run: node scripts/app797-build-production-follow-readonly.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP797_EXISTING_BRIDGE_SECRET: ${{ secrets.SORIDRAW_OWNER_DO_BRIDGE_SECRET_600 }}
          APP797_STAGE_INACTIVE_CONNECTION: '1'
