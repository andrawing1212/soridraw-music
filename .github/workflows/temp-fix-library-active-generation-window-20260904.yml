name: SORIDRAW Library Active Generation Guard PREVIEW 2026-09-04

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-fix-library-active-generation-window-20260904.yml']

permissions:
  contents: write

jobs:
  fix-check-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply generation display guard
        run: |
          set -euo pipefail
          python3 .deploy/temp-fix-library-active-generation-window-20260904.py
          git diff --check
          grep -Fq 'SORIDRAW_LIBRARY_ACTIVE_GENERATION_WINDOW_20260904' src/pages/SunoLibraryPage.tsx
          grep -Fq 'const isLibraryActiveGeneration = (group: any): boolean => {' src/pages/SunoLibraryPage.tsx
          grep -Fq 'const isActiveGeneration = isPendingStatus && isLibraryActiveGeneration(group);' src/pages/SunoLibraryPage.tsx

      - name: TypeScript and build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node .deploy/check-firebase-custom-preview.mjs

      - name: Commit source only
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add src/pages/SunoLibraryPage.tsx
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'fix(preview): show Library generating only for active tasks'
          git push origin HEAD:preview
