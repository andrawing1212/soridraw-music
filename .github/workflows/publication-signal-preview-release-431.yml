name: SORIDRAW PREVIEW Publication Signal 431 Function Release

on:
  # GitHub manual dispatch needs this workflow on the default branch (it is PREVIEW-only).
  # Allow only an explicit PREVIEW trigger file push, never a workflow-code push.
  push:
    branches: [preview]
    paths:
      - '.deploy/publication-signal-preview-release-431.trigger'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact audited preview SHA'
        required: true
        type: string
      audit_result:
        description: 'Must be PASS after independent GPT-6 audit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: soridraw-preview-publication-signal-431
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT: soridraw-app-866a5
      FUNCTION_NAME: publicationRelease431Candidate
      FUNCTION_REGION: asia-northeast3

    steps:
      - name: Checkout release trigger commit (push only)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve exact audited PREVIEW target
        id: source
        shell: bash
        env:
          MANUAL_TARGET_SHA: ${{ inputs.target_sha }}
          MANUAL_AUDIT_RESULT: ${{ inputs.audit_result }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            trigger='.deploy/publication-signal-preview-release-431.trigger'
            test -f "$trigger"
            target="$(sed -n 's/^target_sha=//p' "$trigger" | tail -1 | tr -d '\r')"
            audit="$(sed -n 's/^audit_result=//p' "$trigger" | tail -1 | tr -d '\r')"
            release="$(sed -n 's/^release=//p' "$trigger" | tail -1 | tr -d '\r')"
            test "$release" = 'app434'
            # Initial create is pinned to the independently audited product/release artifact.
            test "$target" = '8eb3264f1c7abaf36a59026248a61c6700e3b9a0'
          else
            test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
            target="$MANUAL_TARGET_SHA"
            audit="$MANUAL_AUDIT_RESULT"
          fi
          test "$audit" = PASS
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          printf 'sha=%s\n' "$target" >> "$GITHUB_OUTPUT"
          echo "LOCKED_AUDITED_431_SHA=$target"

      - name: Checkout exact audited PREVIEW source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Lock audit, source, and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor HEAD origin/preview
          git rev-parse origin/main > "$RUNNER_TEMP/main-before.sha"
          git rev-parse origin/production > "$RUNNER_TEMP/production-before.sha"
          echo "LOCKED_431_SHA=$(git rev-parse HEAD)"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          node scripts/verify-431-server-publication-signal.mjs
          node scripts/verify-432-publication-live-delta.mjs
          node scripts/verify-433-publication-audit-fixes.mjs
          node scripts/verify-434-publication-signal-version-order.mjs

      - name: Build isolated exact Candidate Function package
        shell: bash
        run: |
          set -euo pipefail
          stage_dir=".preview-publication431-functions"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir/lib"
          # The complete default Functions bundle includes unrelated Stage420
          # exports with a secret absent from this project. Never scan them.
          for module in explorePublicationReleaseEndpoint431 explorePublicationRelease431; do
            test -s "functions/lib/$module.js"
            cp "functions/lib/$module.js" "$stage_dir/lib/$module.js"
            cmp "functions/lib/$module.js" "$stage_dir/lib/$module.js"
          done
          node - "$stage_dir/package.json" <<'NODE'
          const fs=require('node:fs');
          const lock=JSON.parse(fs.readFileSync('functions/package-lock.json','utf8'));
          const exact=(name)=>{
            const v=lock.packages?.['node_modules/'+name]?.version;
            if(!/^\d+\.\d+\.\d+$/.test(String(v||'')))
              throw Error('431_PINNED_DEPENDENCY_MISSING '+name);
            return v;
          };
          const pkg={
            name:'soridraw-preview-publication431',private:true,
            main:'lib/index.js',engines:{node:'22'},
            dependencies:{
              'firebase-admin':exact('firebase-admin'),
              'firebase-functions':exact('firebase-functions')
            }
          };
          fs.writeFileSync(process.argv[2],JSON.stringify(pkg,null,2)+'\n');
          NODE
          cat > "$stage_dir/lib/index.js" <<'NODE'
          'use strict';
          const admin=require('firebase-admin');
          admin.initializeApp({
            databaseURL:'https://soridraw-app-866a5-default-rtdb.firebaseio.com'
          });
          const entry=require('./explorePublicationReleaseEndpoint431');
          exports.publicationRelease431Candidate=entry.publicationRelease431Candidate;
          if(Object.keys(exports).join(',')!=='publicationRelease431Candidate')
            throw Error('431_EXACT_SINGLE_EXPORT_DRIFT');
          NODE
          cat > preview.publication431.firebase.json <<'JSON'
          {"functions":{"source":".preview-publication431-functions"}}
          JSON
          if grep -Fl 'SORIDRAW_LIKE_GUARD_HMAC_V1_SECRET' "$stage_dir"/lib/*.js; then
            echo '431_UNRELATED_STAGE420_SECRET_DETECTED'; exit 43
          fi
          npm install --prefix "$stage_dir" --omit=dev --no-audit --no-fund --ignore-scripts
          node - <<'NODE'
          const exports431=require('./.preview-publication431-functions/lib/index.js');
          if(Object.keys(exports431).join(',')!=='publicationRelease431Candidate'
            ||typeof exports431.publicationRelease431Candidate!=='function')
            throw Error('431_EXACT_SINGLE_EXPORT_INVALID');
          console.log('431_EXACT_AUDITED_FUNCTION_ISOLATION=PASS');
          NODE
          echo '431_UNRELATED_STAGE420_SECRETS_EXCLUDED=PASS'

      - name: Authenticate Firebase deploy principal
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Preflight exact one-function initial create
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets describe SORIDRAW_PRIVATE_BATCH416_HMAC_SECRET             --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/431-secret.json"
          gcloud functions list --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/functions-before.json"
          if gcloud functions describe "$FUNCTION_NAME" --gen2 --region "$FUNCTION_REGION"             --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/431-existing.json" 2>"$RUNNER_TEMP/431-existing.err"; then
            echo '431_FUNCTION_ALREADY_EXISTS_STOP'
            exit 41
          fi
          grep -Eiq 'NOT_FOUND|not found|does not exist' "$RUNNER_TEMP/431-existing.err" || {
            cat "$RUNNER_TEMP/431-existing.err" >&2
            echo '431_FUNCTION_PREFLIGHT_UNKNOWN_ERROR'
            exit 42
          }
          echo '431_FUNCTION_INITIAL_CREATE_PREFLIGHT=PASS'

      - name: Deploy only publicationRelease431Candidate
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.30.1 deploy             --project "$FIREBASE_PROJECT"             --config preview.publication431.firebase.json             --only "functions:$FUNCTION_NAME"             --non-interactive
          echo '431_EXACT_ONE_PREVIEW_FUNCTION_DEPLOY=PASS'

      - name: Verify exact one-function delta and protected refs
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/functions-after.json"
          node - "$RUNNER_TEMP/functions-before.json" "$RUNNER_TEMP/functions-after.json" "$FUNCTION_NAME" <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const after=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const target=process.argv[4];
          const key=row=>String(row?.name||'');
          const b=new Map(before.map(row=>[key(row),row]));
          const a=new Map(after.map(row=>[key(row),row]));
          const targetRows=after.filter(row=>key(row).endsWith('/'+target));
          if(targetRows.length!==1)throw Error('431_TARGET_FUNCTION_COUNT_INVALID');
          const created=targetRows[0];
          if(created.state!=='ACTIVE'||created.buildConfig?.runtime!=='nodejs22'||
             !created.serviceConfig?.secretEnvironmentVariables?.some(x=>
               String(x.secret||x.secretName||'').includes('SORIDRAW_PRIVATE_BATCH416_HMAC_SECRET')))
            throw Error('431_TARGET_FUNCTION_POLICY_INVALID');
          if(before.some(row=>key(row).endsWith('/'+target)))
            throw Error('431_TARGET_WAS_NOT_INITIAL_CREATE');
          for(const [name,row] of b){
            const next=a.get(name);
            if(!next)throw Error('431_UNRELATED_FUNCTION_REMOVED '+name);
            if(String(row.updateTime||'')!==String(next.updateTime||''))
              throw Error('431_UNRELATED_FUNCTION_CHANGED '+name);
          }
          if(after.length!==before.length+1)throw Error('431_FUNCTION_INVENTORY_DELTA_INVALID');
          console.log('431_ONLY_APPROVED_FUNCTION_CHANGED=PASS');
          NODE
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          echo '431_MAIN_PRODUCTION_UNCHANGED=PASS'
          echo '431_NO_RULES_WORKER_HOSTING_D1_USER_DATA_CHANGE=PASS'
