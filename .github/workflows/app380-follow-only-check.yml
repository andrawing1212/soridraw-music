name: SORIDRAW Follow-only Candidate Check

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/app380-follow-only-check.yml'
      - 'src/services/exploreLikeService.ts'
      - 'src/services/explorePublicLikeSyncService.ts'
      - 'src/components/CacheDiagnosticsOverlay.tsx'
      - 'src/services/exploreFollowBatchService380.ts'
      - 'src/services/exploreFollowOrdering354.ts'
      - 'src/pages/ExplorePage.tsx'
      - 'src/components/explore/ExploreShell.tsx'
      - 'src/components/studio/StudioSplitEngineWorkspace.tsx'
      - 'public/app-version.json'
      - 'cloudflare/explore-worker/canonical/preview-worker.js'
      - 'cloudflare/explore-worker/canonical/source-sha256.txt'
      - 'cloudflare/explore-worker/canonical/wrangler.preview.jsonc'
      - 'cloudflare/explore-worker/release-patches.json'
      - 'cloudflare/explore-worker/patches/097-follow-abuse-guard.mjs'
      - 'cloudflare/explore-worker/candidates/social-abuse-380.js'
      - 'scripts/verify-354-follow-orchestration.mjs'
      - 'scripts/verify-394-follow-only-worker-freeze.mjs'
      - 'scripts/verify-395-follow-only-release-scope.mjs'
      - 'scripts/verify-396-public-like-reload-and-diagnostics.mjs'
      - 'scripts/verify-303-studio-split-browser-history.mjs'
      - 'scripts/verify-389-social-client-batching.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      # App382-specific byte freeze is a HISTORICAL release test. Running it
      # against modern app397 source gives a false failure before the actual
      # follow regressions. Keep the frozen gate for the exact old release,
      # while testing current follow behavior on every matching preview push.
      - name: Classify historical follow-only release
        id: contract
        run: |
          node -e 'const v=require("./public/app-version.json").version;require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`app_version=${v}\n`);'
      - name: Current Worker source integrity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          node --check cloudflare/explore-worker/canonical/preview-worker.js
      - name: Follow-only release boundary (historical app382 only)
        if: steps.contract.outputs.app_version == '382'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          grep -q 'SORIDRAW_FOLLOW_ABUSE_GUARD_380_20261007' cloudflare/explore-worker/canonical/preview-worker.js
          grep -q 'SORIDRAW_SOCIAL_ABUSE_STATE_380_20261008' cloudflare/explore-worker/canonical/preview-worker.js
          ! grep -q 'SORIDRAW_LIKE_ABUSE_GUARD_390_20261008' cloudflare/explore-worker/canonical/preview-worker.js
          ! grep -q 'acceptLikeReceipt390' cloudflare/explore-worker/canonical/preview-worker.js
          ! grep -q 'readLegacyLikeReplay379' cloudflare/explore-worker/canonical/preview-worker.js
          ! grep -q '098-like-abuse-guard.mjs' cloudflare/explore-worker/release-patches.json
          grep -q '097-follow-abuse-guard.mjs' cloudflare/explore-worker/release-patches.json
          ! grep -Eq 'acceptanceProtocol390|acceptedOperations390|receipt390' src/services/exploreLikeService.ts
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          grep -q '"SORIDRAW_ENVIRONMENT": "preview"' cloudflare/explore-worker/canonical/wrangler.preview.jsonc
          node scripts/verify-394-follow-only-worker-freeze.mjs
          node scripts/verify-395-follow-only-release-scope.mjs
          node scripts/verify-396-public-like-reload-and-diagnostics.mjs
      - name: Current follow regressions (each check reports independently)
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          run_check() {
            name="$1"
            shift
            if "$@"; then
              echo "FOLLOW_CHECK_${name}=PASS"
            else
              echo "::error title=Follow regression failed::${name}"
              failed=1
            fi
          }
          # Only the app382 release gate asserts the app379 whole-Worker
          # freeze. The modern 354/355 runtime fixtures still run in full.
          if [ "${{ steps.contract.outputs.app_version }}" = "382" ]; then
            run_check 354 node scripts/verify-354-follow-orchestration.mjs
          else
            export SORIDRAW_CURRENT_FOLLOW_RUNTIME=1
            run_check 354 node scripts/verify-354-follow-orchestration.mjs
          fi
          run_check 355 node scripts/verify-355-follow-audit-repairs.mjs
          run_check 356 node scripts/verify-356-follow-worker341-legacy-parity.mjs
          run_check 377 node scripts/verify-377-follow-count-list-sync.mjs
          run_check 386 node scripts/verify-386-follow-overlay-count-display.mjs
          run_check 387 env SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-387-follow-abuse-batching.mjs
          run_check 389 node scripts/verify-389-social-client-batching.mjs --follow-only
          run_check 303 node scripts/verify-303-studio-split-browser-history.mjs
          exit "$failed"
