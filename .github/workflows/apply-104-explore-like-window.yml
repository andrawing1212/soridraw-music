name: Record 105 Explore Like State

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-104-explore-like-window.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-apply-explore-like-window
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Record 105 release state
        run: python3 .deploy/apply-105-explore-like-1min.py

      - name: Verify 105 product contract remains intact
        run: node scripts/verify-105-explore-like-1min.mjs

      - name: Verify docs-only boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'DOCS/CURRENT_RELEASE_STATE.md'
          echo 'DOCS_ONLY=PASS'

      - name: Commit release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DOCS/CURRENT_RELEASE_STATE.md
          git diff --cached --quiet && { echo 'No release-state change to commit'; exit 1; }
          git commit -m 'docs: record PREVIEW 105 one-minute candidate'
          git push origin HEAD:preview
          echo "STATE_COMMIT=$(git rev-parse HEAD)"
