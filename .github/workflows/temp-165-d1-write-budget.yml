name: TEMP 165 D1 Like Write Budget Audit
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-165-d1-write-budget.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Read-only 069 single action D1 write lower bound
        run: |
          set -euo pipefail
          test "$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | cut -d' ' -f1)" = b170d05385c3096a98033675a9acbb63b40148bf782017c326845b7ea4c17813
          python3 scripts/verify-132-like-d1-write-budget.py
      - name: Safety boundary
        run: echo 'AUDIT_ONLY=PASS USER_DATA_READ_WRITE=0 DEPLOY=0'
