name: SORIDRAW M005 Docs Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m005-doc-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0
      - name: Apply M005 docs checkpoint
        run: python3 .deploy/finalize-m005-docs.py
      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md docs/SORIDRAW_MAINTENANCE_BACKLOG.md
          git diff --cached --check
          git commit -m "docs: narrow M-005 to zero-byte provider audio blocker"
          git push origin HEAD:preview
