name: Stage4 Domain Connection Setup

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-stage4-domain-connection-diagnostic.yml'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTING_PROJECT: soridraw
      TEST_SITE: soridraw-test
      PROD_SITE: soridraw
      TEST_DOMAIN: test.soridraw.com
      PROD_DOMAIN: soridraw.com
      WWW_DOMAIN: www.soridraw.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Mint OAuth token
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth application-default print-access-token > "$RUNNER_TEMP/google-token"
      - name: Create missing Firebase Hosting custom domains
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/google-token")"
          create_domain() {
            local site="$1" domain="$2" redirect="${3:-}"
            local file="$RUNNER_TEMP/${domain//./_}.json"
            local status
            status="$(curl -sS -o "$file" -w '%{http_code}' -H "Authorization: Bearer $token" "https://firebasehosting.googleapis.com/v1beta1/projects/$HOSTING_PROJECT/sites/$site/customDomains/$domain")"
            if [ "$status" = 200 ]; then
              echo "[FirebaseDomain] already exists: $site <- $domain"
              return 0
            fi
            test "$status" = 404 || { echo "[FirebaseDomain] unexpected GET HTTP $status for $domain"; cat "$file"; exit 3; }
            body='{}'
            if [ -n "$redirect" ]; then body="{\"redirectTarget\":\"$redirect\"}"; fi
            status="$(curl -sS -o "$file" -w '%{http_code}' -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data "$body" "https://firebasehosting.googleapis.com/v1beta1/projects/$HOSTING_PROJECT/sites/$site/customDomains?customDomainId=$domain")"
            echo "[FirebaseDomain] create site=$site domain=$domain http=$status redirect=${redirect:-none}"
            case "$status" in 200|201) ;; *) cat "$file"; exit 4 ;; esac
          }
          create_domain "$TEST_SITE" "$TEST_DOMAIN"
          create_domain "$PROD_SITE" "$PROD_DOMAIN"
          create_domain "$PROD_SITE" "$WWW_DOMAIN" "$PROD_DOMAIN"
      - name: Read Firebase DNS requirements
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/google-token")"
          sleep 5
          for pair in "$TEST_SITE:$TEST_DOMAIN" "$PROD_SITE:$PROD_DOMAIN" "$PROD_SITE:$WWW_DOMAIN"; do
            site="${pair%%:*}"; domain="${pair#*:}"
            file="$RUNNER_TEMP/${domain//./_}-after.json"
            curl -fsS -H "Authorization: Bearer $token" "https://firebasehosting.googleapis.com/v1beta1/projects/$HOSTING_PROJECT/sites/$site/customDomains/$domain" -o "$file"
            echo "[FirebaseDomain] $site <- $domain"
            python3 -c "import json,sys; j=json.load(open(sys.argv[1],encoding='utf-8')); import json as jj; print(' ownershipState=',j.get('ownershipState','')); print(' hostState=',j.get('hostState','')); print(' redirectTarget=',j.get('redirectTarget','')); print(' requiredDnsUpdates=',jj.dumps(j.get('requiredDnsUpdates') or {},ensure_ascii=False)); print(' issues=',jj.dumps(j.get('issues') or [],ensure_ascii=False))" "$file"
          done
      - name: Check Cloudflare DNS API permission
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '[Cloudflare] token missing'; exit 0; }
          status="$(curl -sS -o "$RUNNER_TEMP/zones.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=soridraw.com&status=active')"
          echo "[Cloudflare] zone lookup HTTP $status"
          if [ "$status" != 200 ]; then exit 0; fi
          zone_id="$(python3 -c "import json,sys; j=json.load(open(sys.argv[1],encoding='utf-8')); r=j.get('result') or []; print((r[0] if r else {}).get('id',''))" "$RUNNER_TEMP/zones.json")"
          test -n "$zone_id" || { echo '[Cloudflare] active zone not found'; exit 0; }
          status="$(curl -sS -o "$RUNNER_TEMP/dns-probe.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$TEST_DOMAIN")"
          echo "[Cloudflare] DNS records permission probe HTTP $status"
          if [ "$status" = 200 ]; then echo '[Cloudflare] DNS API readable'; else echo '[Cloudflare] DNS API is permission-gated; no DNS mutation attempted.'; fi
