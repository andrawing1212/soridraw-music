name: Temp Startup Read Context 20260901

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-startup-read-context-20260901.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Print exact startup read contexts
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in '6000,6085' '8660,9060' '10640,10720' '11450,11580' '21890,22040'; do
            echo "===== APP $RANGE ====="
            sed -n "${RANGE}p" src/App.tsx
          done
