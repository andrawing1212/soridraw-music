name: SORIDRAW 049 Explore Feed Integrity PREVIEW Deploy v2

on:
  push:
    branches: [preview-049-explore-feed-integrity-deploy-v2]
    paths:
      - '.github/workflows/preview-049-explore-feed-integrity-deploy-v2.yml'

permissions:
  contents: read

concurrency:
  group: preview-049-explore-feed-integrity-deploy-v2
  cancel-in-progress: false

jobs:
  deploy_preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PREVIEW_SHA: 0c19b23abfa074f69aa40aec4ba9a6069b8cdbf6
      EXPECTED_MAIN_SHA: 431ea22dfa238bfc89b6bde1fd7f3082cdfe10cf
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PREVIEW_DB_NAME: soridraw-explore-preview-db
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2: soridraw-profile-media-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard exact source and unchanged environments
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main
          test "$(git rev-parse HEAD)" = "$EXPECTED_PREVIEW_SHA"
          test "$(git rev-parse origin/preview)" = "$EXPECTED_PREVIEW_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(node -p "require('./public/app-version.json').version")" = 049
          test "$(curl -fsS -H 'Cache-Control: no-cache' https://preview.soridraw.com/app-version.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")" = 048
          for host in test.soridraw.com soridraw.com; do
            curl -fsS -H 'Cache-Control: no-cache' "https://$host/" -o "$RUNNER_TEMP/${host}.before.html"
            sha256sum "$RUNNER_TEMP/${host}.before.html" | awk '{print $1}' > "$RUNNER_TEMP/${host}.before.sha"
            curl -fsS -H 'Cache-Control: no-cache' "https://$host/app-version.json" -o "$RUNNER_TEMP/${host}.before.version"
          done
          echo 'SOURCE_AND_ENV_GUARD=PASS'

      - name: Validate 049
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check cloudflare/explore-worker/patches/030-explore-feed-integrity-self-heal.mjs
          npx tsc --noEmit
          node scripts/verify-033-explore-feed-revision.mjs
          node scripts/verify-045-explore-active-revalidation.mjs
          node scripts/verify-046-catalog-stale-revision-rebuild.mjs
          node scripts/verify-047-stale-chunk-recovery.mjs
          node scripts/verify-048-explore-public-profile-parity.mjs
          node scripts/verify-049-explore-feed-integrity.mjs
          node scripts/verify-runtime-environment-parity-028.mjs
          npm run build
          echo 'PREVIEW_049_VALIDATION=PASS'

      - name: Deploy PREVIEW Worker 030 and verify canonical parity
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false wrangler@4.102.0
          rm -rf .remote-worker && mkdir .remote-worker
          node <<'NODE'
          const fs=require('fs');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,N=process.env.PREVIEW_WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error(`Cloudflare ${r.status} ${JSON.stringify(x).slice(0,800)}`);return x.result||x;}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;
            const ds=await g(base+'/deployments');const d=(ds.deployments||ds||[])[0];const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!active?.version_id)throw Error('active version missing');
            const v=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${active.version_id}?include=modules`);const mods=v.modules||[];const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];
            const s=Buffer.from(m?.content_base64||'','base64').toString('utf8');
            for(const key of ['syncMirroredProfileR2029','repairPublicProfileParityOnColdRead029','handleExploreFeedRevision019','buildExploreFeedR2Payload','readExploreR2Json','writeExploreR2Json'])if(!s.includes(key))throw Error('048 live prerequisite missing: '+key);
            if(s.includes('ensureExploreFeedIntegrity030'))throw Error('030 unexpectedly active before retry');
            fs.writeFileSync('.remote-worker/original.js',s);fs.writeFileSync('.remote-worker/worker.js',s);fs.writeFileSync('.remote-worker/before-version.txt',active.version_id);
            const settings=await g(base+'/settings');const bindings=Array.isArray(settings.bindings)?settings.bindings:[];
            const need=new Map([['BOOTSTRAP_TOKEN','plain_text'],['DB','d1'],['ENV_NAME','plain_text'],['EXPLORE_MIRROR_TOKEN','secret_text'],['PROD_BASE','plain_text'],['PROFILE_MEDIA','r2_bucket'],['SORIDRAW_ENVIRONMENT','plain_text'],['TARGET_BASE','plain_text']]);
            for(const [name,type] of need){const b=bindings.find(x=>x.name===name);if(!b||b.type!==type)throw Error(`binding ${name} mismatch`);}
            if(bindings.some(b=>String(b.type||'').toLowerCase().includes('service')))throw Error('unexpected preview service binding');
            fs.writeFileSync('.remote-worker/bindings-before.json',JSON.stringify(bindings.map(b=>({name:b.name,type:b.type})).sort((a,b)=>a.name.localeCompare(b.name))));
            const cfg={name:N,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-08-28').slice(0,10),workers_dev:true,keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.PREVIEW_DB_NAME,database_id:process.env.PREVIEW_DB_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PREVIEW_R2}],observability:settings.observability&&typeof settings.observability==='object'?{enabled:settings.observability.enabled!==false}:{enabled:true}};
            if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)cfg.compatibility_flags=settings.compatibility_flags;
            fs.writeFileSync('.remote-worker/wrangler.jsonc',JSON.stringify(cfg,null,2));
            console.log('PREVIEW_WORKER_BEFORE='+active.version_id);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          export SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker"
          node patches/030-explore-feed-integrity-self-heal.mjs
          node --check .remote-worker/worker.js
          for key in ensureExploreFeedIntegrity030 handleExploreFeedRevision019Core030 syncMirroredProfileR2029 repairPublicProfileParityOnColdRead029; do grep -Fq "$key" .remote-worker/worker.js; done
          echo 'PATCH_030_DRY_RUN=PASS'
          deployed=0
          rollback(){ code=$?; if [ "$code" -ne 0 ] && [ "$deployed" = 1 ]; then echo 'WORKER_ROLLBACK=START'; cp .remote-worker/original.js .remote-worker/worker.js; npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc || true; fi; exit "$code"; }
          trap rollback EXIT
          npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc
          deployed=1
          sleep 4
          node <<'NODE'
          const fs=require('fs');const A=process.env.CLOUDFLARE_ACCOUNT_ID,N=process.env.PREVIEW_WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error(`Cloudflare ${r.status}`);return x.result||x;}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;const ds=await g(base+'/deployments');const d=(ds.deployments||ds||[])[0];const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];const before=fs.readFileSync('.remote-worker/before-version.txt','utf8').trim();if(!active?.version_id||active.version_id===before)throw Error('version unchanged');const v=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${active.version_id}?include=modules`);const mods=v.modules||[];const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];const s=Buffer.from(m?.content_base64||'','base64').toString('utf8');for(const key of ['ensureExploreFeedIntegrity030','handleExploreFeedRevision019Core030','syncMirroredProfileR2029','repairPublicProfileParityOnColdRead029'])if(!s.includes(key))throw Error('functional runtime missing: '+key);const settings=await g(base+'/settings');const after=(settings.bindings||[]).map(b=>({name:b.name,type:b.type})).sort((a,b)=>a.name.localeCompare(b.name));const beforeB=JSON.parse(fs.readFileSync('.remote-worker/bindings-before.json','utf8'));if(JSON.stringify(after)!==JSON.stringify(beforeB))throw Error('bindings changed');console.log('PREVIEW_WORKER_AFTER='+active.version_id);console.log('WORKER_FUNCTIONAL_RUNTIME=PASS');console.log('BINDINGS_PRESERVED=PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          # Invoke 030. It may heal R2 once; normal users do not pay this D1 check more than once per 5 min globally.
          curl -fsS -H "Origin: $PREVIEW_ORIGIN" -H 'Cache-Control: no-cache' "$PREVIEW_BASE/v1/feed-revision?sort=latest&__deploy=049v2" -o /tmp/rev.json
          node -e "const p=require('/tmp/rev.json');if(!p?.data?.revision)process.exit(1)"
          echo 'INTEGRITY_TRIGGER=PASS'
          # limit=40 is R2 first page; limit=39 bypasses R2 shortcut and is canonical D1. Exact order must match.
          for sort in latest popular; do
            curl -fsS -H "Origin: $PREVIEW_ORIGIN" -H 'Cache-Control: no-cache' "$PREVIEW_BASE/v1/feed?sort=$sort&limit=40&__deploy=049v2" -o "/tmp/$sort-r2.json"
            curl -fsS -H "Origin: $PREVIEW_ORIGIN" -H 'Cache-Control: no-cache' "$PREVIEW_BASE/v1/feed?sort=$sort&limit=39&__deploy=049v2" -o "/tmp/$sort-d1.json"
            SORT="$sort" node <<'NODE'
            const fs=require('fs'),sort=process.env.SORT;const r2p=JSON.parse(fs.readFileSync(`/tmp/${sort}-r2.json`)),d1p=JSON.parse(fs.readFileSync(`/tmp/${sort}-d1.json`));const r2=r2p?.data?.items||[],d1=d1p?.data?.items||[];const id=x=>String(x?.id||x?.trackId||'');if(!r2.length||JSON.stringify(r2.slice(0,d1.length).map(id))!==JSON.stringify(d1.map(id)))process.exit(1);console.log(`EXPLORE_${sort.toUpperCase()}_R2_D1_PARITY=PASS count=${d1.length}`);console.log(`EXPLORE_${sort.toUpperCase()}_NEXT_CURSOR=${Boolean(r2p?.data?.nextCursor)}`);
            NODE
          done
          trap - EXIT

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW 049
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify live PREVIEW and untouched TEST PROD main
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in https://soridraw-preview.web.app/ https://preview.soridraw.com/; do
            ok=''; for n in $(seq 1 15); do curl -fsS -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/live.html" && [ "$(sha256sum "$RUNNER_TEMP/live.html"|awk '{print $1}')" = "$local_sha" ] && { ok=1; break; }; sleep 8; done; test "$ok" = 1; echo "EXACT_BUILD_PASS=$url";
          done
          test "$(curl -fsS -H 'Cache-Control: no-cache' https://preview.soridraw.com/app-version.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")" = 049
          git fetch origin preview main
          test "$(git rev-parse origin/preview)" = "$EXPECTED_PREVIEW_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          for host in test.soridraw.com soridraw.com; do
            curl -fsS -H 'Cache-Control: no-cache' "https://$host/" -o "$RUNNER_TEMP/${host}.after.html"
            test "$(sha256sum "$RUNNER_TEMP/${host}.after.html"|awk '{print $1}')" = "$(cat "$RUNNER_TEMP/${host}.before.sha")"
            curl -fsS -H 'Cache-Control: no-cache' "https://$host/app-version.json" -o "$RUNNER_TEMP/${host}.after.version"
            cmp "$RUNNER_TEMP/${host}.before.version" "$RUNNER_TEMP/${host}.after.version"
          done
          echo 'PREVIEW_049_LIVE=PASS'
          echo 'TEST_UNCHANGED=PASS'
          echo 'PRODUCTION_UNCHANGED=PASS'
          echo 'MAIN_UNCHANGED=PASS'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'
