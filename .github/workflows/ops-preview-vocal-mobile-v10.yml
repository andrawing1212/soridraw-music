name: OPS Preview Vocal Mobile V10

on:
  push:
    branches: [ops-preview-vocal-mobile-v10]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply real mobile vocal member grid fix
        shell: bash
        run: |
          set -euo pipefail
          cat >> src/components/studio/studioLayout.css <<'CSS'

          /* 1010 — Real vocal member grid mobile override.
           * Group mode owns grid-cols-2 in JSX, so target the real member-card grid
           * directly on compact mobile, split mobile-pane, and narrow viewport.
           * The separate male/female add-member button grid remains two columns. */
          .soridraw-studio-compact-mobile-builder .soridraw-vocal-member-grid,
          .soridraw-studio-builder-pane[data-pane-mode="mobile"] .soridraw-vocal-member-grid {
            grid-template-columns: minmax(0, 1fr) !important;
          }

          @media (max-width: 767px) {
            body #root .soridraw-app-root .soridraw-studio-vocal-slot .soridraw-vocal-member-grid {
              grid-template-columns: minmax(0, 1fr) !important;
            }
          }
          CSS
          git diff --check
          git diff -- src/components/studio/studioLayout.css
          grep -n -A 16 '1010 — Real vocal member grid' src/components/studio/studioLayout.css
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Publish validated source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "andrawing1212"
          git config user.email "andrawing1212@gmail.com"
          git add src/components/studio/studioLayout.css
          git commit -m "fix(preview): force real mobile vocal member grid to one column"
          git branch -f preview-vocal-mobile-v10 HEAD
          git push origin preview-vocal-mobile-v10 --force
