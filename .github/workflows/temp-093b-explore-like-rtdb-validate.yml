name: SORIDRAW 093b Explore Like RTDB Validation

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-093b-explore-like-rtdb-validate.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-093b-explore-like-rtdb-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted patch
        run: python3 .deploy/apply-093-explore-like-rtdb-zero-count.py

      - name: Verify source contract
        run: node scripts/verify-093-explore-like-rtdb-zero-count.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile RTDB rules locally
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest emulators:exec \
            --only database \
            --project demo-soridraw-like-sync \
            "node -e \"console.log('RTDB_RULES_EMULATOR=PASS')\""

      - name: Verify boundary
        shell: bash
        run: |
          set -euo pipefail
          git add -N scripts/verify-093-explore-like-rtdb-zero-count.mjs
          git diff --check
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/services/exploreLikeService\.ts|src/services/userDomainSyncService\.ts|src/services/exploreLikeDisplayStateService\.ts|database\.rules\.json|scripts/verify-093-explore-like-rtdb-zero-count\.mjs)$' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          echo 'NO_DEPLOY=true'
          echo 'NO_WORKER_CHANGE=true'
          echo 'NO_FUNCTIONS_CHANGE=true'
          echo 'NO_USER_DATA_CHANGE=true'

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            src/services/exploreLikeService.ts
            src/services/userDomainSyncService.ts
            src/services/exploreLikeDisplayStateService.ts
            database.rules.json
            scripts/verify-093-explore-like-rtdb-zero-count.mjs
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${tracked[@]}"
          git commit -m 'fix: move Explore like sync off Firestore'
          git push origin HEAD:preview
