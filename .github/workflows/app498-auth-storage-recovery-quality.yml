name: SORIDRAW app498 Auth Storage Recovery — No Deploy
on:
  pull_request:
    branches: [preview]
    paths:
      - 'src/App.tsx'
      - 'src/pages/FavoritesPage.tsx'
      - 'src/pages/SunoLibraryPage.tsx'
      - 'src/lib/nextSongPendingBridge.ts'
      - 'src/lib/nextSongOriginalProbe.ts'
      - 'src/lib/songMetadataSearch.ts'
      - 'scripts/verify-song-metadata-search.mjs'
      - 'src/lib/userDataEngine.ts'
      - 'src/services/userDomainSyncService.ts'
      - 'scripts/verify-music-note-multi-folder-persistence.mjs'
      - 'src/components/NextSongOriginalReadOnlyDiagnostic.tsx'
      - 'src/components/CacheDiagnosticsOverlayImpl.tsx'
      - 'scripts/verify-next-song-readonly-source-probe.mjs'
      - 'scripts/verify-468-next-song-navigation.mjs'
      - 'src/firebase.js'
      - 'src/lib/authStorageRecovery.ts'
      - 'src/lib/authRestorePersistence.js'
      - 'scripts/verify-500-auth-sdk-restore.mjs'
      - 'scripts/verify-498-auth-storage-recovery.mjs'
      - '.github/workflows/app498-auth-storage-recovery-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-storage-source-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Auth quota and nondestructive fallback regression
        run: node scripts/verify-498-auth-storage-recovery.mjs
      - name: Pinned Firebase SDK restored account and quota regression
        run: node scripts/verify-500-auth-sdk-restore.mjs
      - name: Next-song quota and Studio navigation regression
        run: node scripts/verify-468-next-song-navigation.mjs
      - name: Historical menu, command and authored lyric next-song regression
        run: node scripts/verify-next-song-direct-inputs.mjs
      - name: Exact old-song original field location read-only probe
        run: node scripts/verify-next-song-readonly-source-probe.mjs
      - name: Music Note multi-folder canonical and Catalog persistence regression
        run: node scripts/verify-music-note-multi-folder-persistence.mjs
      - name: Music Note and Library keyword / lyric search regression
        run: node scripts/verify-song-metadata-search.mjs
      - name: Auth navigation readiness regression
        run: node scripts/verify-035-auth-nav-readiness.mjs
      - name: Studio Rap AUTO and lyric style reset regression
        run: node scripts/verify-studio-reset-rap-lyrics.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Confirm read-only quality run
        run: echo 'APP498_SOURCE_QA_ONLY;NO_FIREBASE_CLOUDFLARE_DEPLOYMENT;NO_SHARED_DATA_CHANGE'
