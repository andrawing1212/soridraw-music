name: Temp Cost Zero Feed Source Inspect

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-cost-zero-feed-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print exact live feed functions read-only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/patches"
          shopt -s nullglob
          for f in patches/*.mjs; do mv "$f" "$RUNNER_TEMP/patches/"; done
          npm run cf:prepare
          node --check .remote-worker/worker.js
          node - <<'NODE'
          const fs=require('fs'); const src=fs.readFileSync('.remote-worker/worker.js','utf8');
          function fn(name){
            const start=src.indexOf(`async function ${name}(`); if(start<0) throw new Error(`missing ${name}`);
            const brace=src.indexOf('{',start); let depth=0,quote=null,escaped=false;
            for(let i=brace;i<src.length;i++){
              const c=src[i]; if(quote){if(escaped){escaped=false;continue;}if(c==='\\'){escaped=true;continue;}if(c===quote)quote=null;continue;}
              if(c==='"'||c==="'"||c==='`'){quote=c;continue;} if(c==='{')depth++; if(c==='}'&&--depth===0)return src.slice(start,i+1);
            } throw new Error(`unterminated ${name}`);
          }
          for(const name of ['handleFeed','handleFeedWithEdgeCache']){
            console.log(`===== ${name} =====`); console.log(fn(name));
          }
          console.log('READ_ONLY_LIVE_SOURCE=true');
          NODE
