name: Apply 105 Explore Like 1min

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-104-explore-like-window.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-apply-explore-like-window
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted 105 one-minute patch
        run: python3 .deploy/apply-105-explore-like-1min.py

      - name: Verify 105 contract
        run: node scripts/verify-105-explore-like-1min.mjs

      - name: Worker syntax
        run: node --check cloudflare/explore-worker/canonical/preview-entry.js

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Wrangler PREVIEW dry-run
        run: npx wrangler deploy --dry-run --config cloudflare/explore-worker/canonical/wrangler.preview.jsonc

      - name: Restore generated dist before source boundary check
        run: git restore --worktree --staged -- dist

      - name: Verify change boundary
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(cloudflare/explore-worker/canonical/preview-entry\.js|src/services/exploreLikeService\.ts|src/services/exploreRevisionRequestCache\.ts|src/pages/ExplorePage\.tsx|public/app-version\.json)$'
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev "$allowed"; then
            echo 'Unexpected product file change' >&2
            exit 1
          fi
          test -z "$(git diff --name-only -- cloudflare/explore-worker/canonical/wrangler.preview.jsonc functions firestore.rules database.rules.json src/components src/styles)"
          echo 'CHANGE_BOUNDARY=PASS'
          echo 'WORKER_DELAY_ONLY=YES'
          echo 'NO_D1_SCHEMA_MIGRATION=true'
          echo 'NO_FIREBASE_FUNCTIONS_RULES_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
          echo 'NO_UI_CSS_CHANGE=true'

      - name: Commit product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            cloudflare/explore-worker/canonical/preview-entry.js \
            src/services/exploreLikeService.ts \
            src/services/exploreRevisionRequestCache.ts \
            src/pages/ExplorePage.tsx \
            public/app-version.json
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'test: shorten PREVIEW Explore like window to one minute'
          git push origin HEAD:preview
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
