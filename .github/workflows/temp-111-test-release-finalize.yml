name: TEMP 111 TEST Release Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-111-test-release-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Record TEST promotion state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = 'bb1305660ca694dd057f3ed4184bdafea60f5b18'
          test "$(git rev-parse origin/production)" = 'a8971fae1014ce107927fcfb5491d202d4c68fbe'
          grep -q '^enabled=false$' .deploy/release-promotion.trigger
          python - <<'PY'
          from pathlib import Path
          p=Path('DOCS/CURRENT_RELEASE_STATE.md')
          text=p.read_text(encoding='utf-8')
          old='최종 갱신: 2026-09-16 KST — PREVIEW 111 공개프로필 invalid-ref 서버 누수 방어 배포/실측 완료'
          text=text.replace(old,'최종 갱신: 2026-09-16 KST — PREVIEW 111 전체본 TEST 승격 완료',1)
          marker='> 새 채팅은 이 문서 + 실제 GitHub/Firebase/Cloudflare 상태를 기준으로 이어간다. 문서와 실제 상태가 다르면 실제 상태 우선.\n'
          if marker not in text:
              raise SystemExit('CURRENT_RELEASE_STATE marker missing')
          section='''\n\n## 0L. TEST 승격 — PREVIEW 111 전체본 배포 완료\n\n- 사용자 명시 승인 `테스트 배포해`에 따라 검증된 PREVIEW 전체본을 TEST로 승격했다. **PRODUCTION 승격 승인은 아니며 PRODUCTION은 변경하지 않았다.**\n- 승격 source PREVIEW SHA: `a3ba265357fa672cd4c9f6f58204003bb61d9ab0`. 당시 제품은 앱 **110** + Explore Worker 111 누수 방어를 포함한다.\n- 고정 Release Promotion Run: `35109891755` **SUCCESS**, mode `test_only`. TypeScript PASS / Build PASS / release static guard PASS / TEST+PRODUCTION Worker dry-run PASS / shared canonical D1 SELECT-only preflight PASS(`tables=6`, `explore032 triggers=18`, `seeded=1`) / migration·seed 없음.\n- `main`은 기존 `3b574c05589230f077eceff98190edd4b5195f75` 위에 exact PREVIEW tree를 새 forward commit으로 승격했고, 현재 TEST 기준 SHA는 **`bb1305660ca694dd057f3ed4184bdafea60f5b18`**. force-push 없음.\n- Firebase TEST Hosting `soridraw-test` 배포 PASS. `https://soridraw-test.web.app`와 `https://test.soridraw.com` 모두 exact `index.html` hash + `app-version.json=110` PASS.\n- TEST Explore Worker `soridraw-explore-test`: 이전 `0b9cfe5c-1e29-4485-ac97-36f87832b41e` → **`498f6180-f199-4d3d-b9c5-2744fe7889e0`**. Worker smoke PASS, schedules `[]` 보존, 고정 cron 추가 없음.\n- TEST Worker는 공유 canonical D1 `soridraw-explore-db`를 그대로 사용하고 TEST 전용 `RATE_DB`/R2 derived cache를 유지한다. 사용자 원본 데이터 이동/복제/백필/삭제 없음.\n- 실제 TEST 검증: Feed HTTP/CORS PASS, `/v1/feed-revision` HEAD-ONLY-036 PASS, Firebase Functions `getSunoApiKeyStatus`/`generateGeminiContent` TEST origin CORS PASS.\n- PRODUCTION 기준 branch는 **`a8971fae1014ce107927fcfb5491d202d4c68fbe`** 그대로이며 PRODUCTION Hosting hash도 TEST 승격 전후 동일 확인. PRODUCTION Worker/Hosting 단계는 모두 SKIP.\n- Firestore Rules 배포 없음 / Functions 배포 없음 / D1 schema migration 없음 / 사용자 데이터 migration 없음.\n- Release trigger는 완료 직후 다시 `enabled=false`로 잠갔고 no-op 확인 Run `35110202022` SUCCESS.\n- **현재 단계:** TEST 코드/인프라 배포는 완료. 정식배포 전에는 `test.soridraw.com`에서 PC/모바일 실사용 최종 검증이 필요하다. 특히 Explore 교차계정 좋아요/공개숫자/공개프로필, Music Note 60초 묶음저장, Library Local First/재진입 비용, 업데이트 후 캐시 유지, PC↔모바일 동기화를 확인한다.\n- PRODUCTION은 사용자의 별도 명확한 `정식배포` 승인 전 금지.\n'''
          text=text.replace(marker,marker+section,1)
          p.write_text(text,encoding='utf-8')

          Path('DOCS/NEXT_CODEX_TASK.md').write_text('''# SORIDRAW NEXT CODEX TASK\n\n최종 갱신: 2026-09-16 KST — TEST 승격 완료 / 정식배포 전 실사용 검증\n\n## 현재 기준\n\n- PREVIEW branch: `preview`\n- TEST branch: `main` = `bb1305660ca694dd057f3ed4184bdafea60f5b18`\n- TEST release source PREVIEW: `a3ba265357fa672cd4c9f6f58204003bb61d9ab0`\n- PREVIEW/TEST app: **110**\n- TEST URL: `https://test.soridraw.com`\n- TEST Explore Worker: `498f6180-f199-4d3d-b9c5-2744fe7889e0`\n- TEST promotion Run: `35109891755` SUCCESS\n- PRODUCTION branch: `a8971fae1014ce107927fcfb5491d202d4c68fbe` (비변경)\n- Release trigger: disabled\n\n## TEST 자동 검증 결과\n\nPASS:\n- TypeScript / Build / release static guard\n- TEST/PRODUCTION Worker dry-run\n- shared canonical D1 SELECT-only prerequisite check\n- TEST main exact PREVIEW tree promotion\n- TEST Worker deploy + smoke\n- Firebase TEST Hosting deploy\n- `soridraw-test.web.app` + `test.soridraw.com` exact build/app-version 110\n- TEST Feed/CORS + revision HEAD-ONLY-036\n- TEST Functions CORS\n- PRODUCTION branch/Hosting 비변경\n- 사용자 데이터 migration/backfill/delete 0\n- Firestore Rules/Functions deploy 0\n\n## 다음 작업 — 사용자 TEST 실사용 검증\n\n정식배포 전 다음을 TEST에서 확인한다.\n1. PC/모바일 업데이트 후 기존 Music Note/Library/Explore 데이터가 그대로 보이는지.\n2. Music Note 편집이 로컬 즉시 반영되고 약 60초 묶음 저장이 유지되는지.\n3. Library warm 재진입이 불필요한 Firestore 전체 read를 만들지 않는지.\n4. Explore 최신/인기/추천 warm 재진입과 공개프로필 재진입이 정상이고 불필요한 D1 read/write가 없는지.\n5. Master/Admin 등 교차계정 좋아요 숫자가 약 1분 event batch 후 동일하게 수렴하는지.\n6. 같은 계정 PC↔모바일 heart membership 동기화 및 공개숫자 정합성.\n7. 공개/비공개/팔로우/프로필 수정이 변경된 항목만 반영되고 기존 데이터가 손상되지 않는지.\n8. PC/모바일 UI/반응형이 PREVIEW와 동일한지.\n\n실사용 FAIL이 나오면 PRODUCTION 승격 금지, 원인 수정은 다시 preview에서 시작한다.\n\n## PRODUCTION\n\n- 아직 승인 없음.\n- 사용자가 명확히 `정식배포`를 승인한 경우에만 현재 검증된 TEST tree를 PRODUCTION으로 승격한다.\n- 사용자 데이터는 이동/복제하지 않는다.\n''',encoding='utf-8')
          PY
          git diff --check
          git config user.name soridraw-release-bot
          git config user.email actions@users.noreply.github.com
          git add DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md
          git commit -m 'docs: record TEST promotion of PREVIEW 111'
          git push origin HEAD:preview
          echo "FINAL_TEST_DOC_SHA=$(git rev-parse HEAD)"
