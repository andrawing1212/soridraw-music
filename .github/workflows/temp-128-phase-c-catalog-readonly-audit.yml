name: TEMP 128 Phase C Catalog Readonly Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-128-phase-c-catalog-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      SHARED_DB_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
      PREVIEW_RATE_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      SHARED_R2: soridraw-profile-media
      PREVIEW_CACHE_R2: soridraw-profile-media-preview

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit live PREVIEW Worker flags and bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker=process.env.PREVIEW_WORKER;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){
            const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});
            const x=await r.json();
            if(!r.ok||x.success===false) throw new Error('Cloudflare '+r.status+': '+JSON.stringify(x).slice(0,1000));
            return x.result||x;
          }
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}`;
          const [deployments,settings]=await Promise.all([get(base+'/deployments'),get(base+'/settings')]);
          const ds=deployments.deployments||deployments||[];
          const active=[...(ds[0]?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
          if(!active?.version_id||Number(active.percentage||0)<99.99) throw new Error('No single active PREVIEW Worker');
          const bindings=Array.isArray(settings.bindings)?settings.bindings:[];

          function requireBinding(name,type,expected){
            const b=bindings.find(x=>x?.name===name&&x?.type===type);
            if(!b) throw new Error('Missing binding '+name+':'+type);
            const actual=String(
              type==='d1' ? (b.id||b.database_id||b.uuid||'') :
              type==='r2_bucket' ? (b.bucket_name||b.bucket||'') : ''
            ).trim();
            if(expected&&actual!==expected) throw new Error('Binding mismatch '+name+' expected='+expected+' actual='+actual);
            return b;
          }
          requireBinding('DB','d1',process.env.SHARED_DB_ID);
          requireBinding('RATE_DB','d1',process.env.PREVIEW_RATE_DB_ID);
          requireBinding('PROFILE_MEDIA','r2_bucket',process.env.SHARED_R2);
          requireBinding('EXPLORE_CACHE','r2_bucket',process.env.PREVIEW_CACHE_R2);

          const flags=['SORIDRAW_R2_CATALOG_V1','SORIDRAW_R2_CATALOG_READ_V1','SORIDRAW_R2_FIRST_PUBLISHER_V1'];
          const states={};
          for(const name of flags){
            const b=bindings.find(x=>x?.name===name);
            const raw=String(b?.text??b?.value??b?.json??'').trim();
            states[name]=raw==='1'?'ON':'OFF_OR_ABSENT';
            if(raw==='1') throw new Error(name+' unexpectedly ON');
          }

          console.log('ACTIVE_PREVIEW_WORKER='+active.version_id);
          console.log('BINDING_DB=SHARED_CANONICAL_PASS');
          console.log('BINDING_RATE_DB=PREVIEW_ONLY_PASS');
          console.log('BINDING_PROFILE_MEDIA=SHARED_R2_PASS');
          console.log('BINDING_EXPLORE_CACHE=PREVIEW_ONLY_PASS');
          for(const [k,v] of Object.entries(states)) console.log(k+'='+v);
          console.log('PHASE_C_FLAG_SAFETY=PASS');
          NODE

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Read canonical public-track baseline only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          SQL="SELECT COUNT(*) AS public_tracks, COUNT(DISTINCT owner_uid) AS public_owners FROM tracks WHERE is_public=1 AND status='published'; SELECT id,title,owner_uid,published_at FROM tracks WHERE is_public=1 AND status='published' ORDER BY published_at DESC,id DESC LIMIT 8;"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "$SQL" --json > "$RUNNER_TEMP/public-baseline.json"
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/public-baseline.json','utf8'));
          const sets=x.flatMap(v=>Array.isArray(v?.results)?[v.results]:[]);
          const summary=(sets[0]||[])[0]||{};
          const sample=sets[1]||[];
          if(!Number.isFinite(Number(summary.public_tracks))) throw new Error('public track count missing');
          console.log('PUBLIC_TRACK_COUNT='+Number(summary.public_tracks||0));
          console.log('PUBLIC_OWNER_COUNT='+Number(summary.public_owners||0));
          console.log('PUBLIC_SAMPLE_COUNT='+sample.length);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/sample-ids.txt',sample.map(v=>String(v.id||'').trim()).filter(Boolean).join('\n')+'\n');
          console.log('CANONICAL_BASELINE_READ_ONLY=PASS');
          NODE

      - name: Probe R2 catalog meta for bounded public sample
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          total=0
          found=0
          missing=0
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            total=$((total+1))
            encoded="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$id")"
            key="$SHARED_R2/internal/explore/catalog-v1/meta/${encoded}.json"
            if node "$WRANGLER" r2 object get "$key" --file "$RUNNER_TEMP/catalog-meta-${total}.json" --remote >/dev/null 2>&1; then
              found=$((found+1))
              node - "$RUNNER_TEMP/catalog-meta-${total}.json" "$id" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2],id=process.argv[3];
          const x=JSON.parse(fs.readFileSync(file,'utf8'));
          if(String(x?.trackId||'')!==id) throw new Error('catalog meta id mismatch '+id);
          if(Number(x?.schemaVersion||0)!==1) throw new Error('catalog meta schema mismatch '+id);
          NODE
            else
              missing=$((missing+1))
            fi
          done < "$RUNNER_TEMP/sample-ids.txt"
          echo "CATALOG_SAMPLE_TOTAL=$total"
          echo "CATALOG_SAMPLE_META_FOUND=$found"
          echo "CATALOG_SAMPLE_META_MISSING=$missing"
          if [ "$total" -gt 0 ] && [ "$missing" -gt 0 ]; then
            echo 'CATALOG_COMPLETENESS=INCOMPLETE'
          elif [ "$total" -gt 0 ]; then
            echo 'CATALOG_SAMPLE_COMPLETENESS=PASS_SAMPLE_ONLY'
          else
            echo 'CATALOG_COMPLETENESS=NO_PUBLIC_TRACKS'
          fi
          echo 'R2_WRITE=0'

      - name: Confirm legacy live routes remain active while flags are off
        shell: bash
        env:
          PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
          PREVIEW_ORIGIN: https://preview.soridraw.com
        run: |
          set -euo pipefail
          for path in "/v1/feed?sort=latest&limit=40&__soridraw_r2_only=108" "/v1/feed?sort=popular&limit=40&__soridraw_r2_only=108"; do
            curl -fsS -D "$RUNNER_TEMP/head" -o "$RUNNER_TEMP/body" -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE$path"
            grep -qi '^x-soridraw-d1-read: 0' "$RUNNER_TEMP/head"
            grep -qi '^x-soridraw-d1-write: 0' "$RUNNER_TEMP/head"
          done
          echo 'FIRST_PAGE_SHARED_R2_D1_R0_W0=PASS'
          echo 'USER_DATA_WRITE=0'
          echo 'D1_SCHEMA_CHANGE=false'
          echo 'DEPLOYMENT=false'
          echo 'TEST_PRODUCTION_CHANGE=false'
