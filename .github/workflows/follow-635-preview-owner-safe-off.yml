name: SORIDRAW APP635 PREVIEW Owner Follow Safe OFF

on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/app635-preview-explore-exact-safe-off.mjs'
      - '.github/workflows/follow-635-preview-owner-safe-off.yml'
  push:
    branches: [preview]
    paths:
      - '.deploy/app635-preview-owner-safe-off.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-app635-preview-owner-safe-off
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify recovery tool before approval
        run: |
          set -euo pipefail
          node --check scripts/app635-preview-explore-exact-safe-off.mjs
          node scripts/app635-preview-explore-exact-safe-off.mjs --self-test

  recover:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin exact approved one-shot PREVIEW change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/preview'
          node --check scripts/app635-preview-explore-exact-safe-off.mjs
          node scripts/app635-preview-explore-exact-safe-off.mjs --self-test
          file='.deploy/app635-preview-owner-safe-off.trigger'
          test -f "$file"
          grep -Fxq 'mode=exact-preview-owner-follow-safe-off' "$file"
          grep -Fxq 'approved_preview_parent=afeb59d14427cfb559df9bd9ff890d2169cfa8aa' "$file"
          grep -Fxq 'active_version=5d0f74b1-84bf-4f96-a9e4-51bea25736fa' "$file"
          grep -Fxq 'safe_off_version=d5d14cf8-c65a-4aa2-b58f-ed08bcdc92fd' "$file"
          test "$(git rev-parse HEAD^1)" = 'afeb59d14427cfb559df9bd9ff890d2169cfa8aa'
          expected="$(printf '%s\n' '.deploy/app635-preview-owner-safe-off.trigger' '.github/workflows/follow-635-preview-owner-safe-off.yml' 'scripts/app635-preview-explore-exact-safe-off.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-only HEAD^1 HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual"
          echo 'APP635_EXACT_APPROVED_PREVIEW_PUSH_AND_SCOPE=PASS'
          echo 'APP635_APPROVED_PARENT=afeb59d14427cfb559df9bd9ff890d2169cfa8aa' >> "$GITHUB_ENV"
      - name: Recover exact PREVIEW Explore Worker OFF
        run: node scripts/app635-preview-explore-exact-safe-off.mjs --recover-once
