name: SORIDRAW 044 Stage A PREVIEW

on:
  push:
    branches: [release-044-explore-like-cost-parity]
    paths: ['.github/workflows/release-044-stage-a-preview.yml']

permissions:
  contents: write
  id-token: write

concurrency:
  group: soridraw-044-stage-a-preview
  cancel-in-progress: false

jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PREVIEW_BASE: 3a7de5fe6afa90833acbda233aff78c549eb9183
      MAIN_BASE: 2fadb2dc666fadecbbbd93e92cfb104ed567f233
      FIREBASE_PROJECT: soridraw
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact baselines and verified D1 runtime probe
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main --quiet
          test "$(git rev-parse origin/preview)" = "$PREVIEW_BASE"
          test "$(git rev-parse origin/main)" = "$MAIN_BASE"
          git diff --quiet origin/main origin/preview -- functions
          git diff --quiet origin/main origin/preview -- cloudflare
          git diff --name-only origin/main origin/preview -- src | sort > "$RUNNER_TEMP/src-before.txt"
          printf '%s\n' src/App.tsx src/services/appUpdateNotice.ts | sort > "$RUNNER_TEMP/src-expected.txt"
          diff -u "$RUNNER_TEMP/src-expected.txt" "$RUNNER_TEMP/src-before.txt"
          grep -Fq 'verified_run_id=34197373670' .github/release-044-runtime-probe-pass.txt
          grep -Fq 'verified_job_id=101968007250' .github/release-044-runtime-probe-pass.txt
          grep -Fq 'rate_returning_count=1' .github/release-044-runtime-probe-pass.txt
          grep -Fq 'track_stats_returning_like_count=1' .github/release-044-runtime-probe-pass.txt
          grep -Fq 'cleanup_ok=true' .github/release-044-runtime-probe-pass.txt
          grep -Fq 'temporary_worker_deleted_by_workflow=true' .github/release-044-runtime-probe-pass.txt
          cp cloudflare/explore-worker/patches/028-explore-like-o1.mjs "$RUNNER_TEMP/028-explore-like-o1.mjs"
          cp scripts/release-044-stage-a-workers.sh "$RUNNER_TEMP/release-044-stage-a-workers.sh"
          chmod +x "$RUNNER_TEMP/release-044-stage-a-workers.sh"
          echo 'STEP_1_D1_RUNTIME_RETURNING=PASS'

      - name: Prepare and validate exact PREVIEW 044 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B preview-044-work origin/preview
          cp "$RUNNER_TEMP/028-explore-like-o1.mjs" cloudflare/explore-worker/patches/028-explore-like-o1.mjs
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/services/appUpdateNotice.ts')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const CURRENT_APP_VERSION = '[^']+';", "const CURRENT_APP_VERSION = '044';", s, count=1)
          if n != 1: raise SystemExit('appUpdateNotice version anchor missing')
          p.write_text(s,encoding='utf-8')
          Path('public/app-version.json').write_text('{\n  "version": "044"\n}\n',encoding='utf-8')
          PY
          node --check cloudflare/explore-worker/patches/028-explore-like-o1.mjs
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-033-explore-feed-revision.mjs
          node scripts/verify-035-auth-nav-readiness.mjs
          git diff --check
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release@users.noreply.github.com'
          git add src/services/appUpdateNotice.ts public/app-version.json cloudflare/explore-worker/patches/028-explore-like-o1.mjs
          git commit -m 'fix(preview): reduce Explore like cost and bump 044'
          PREVIEW_FINAL_SHA="$(git rev-parse HEAD)"
          echo "PREVIEW_FINAL_SHA=$PREVIEW_FINAL_SHA" >> "$GITHUB_ENV"
          echo "STEP_2_PREVIEW_044_VALIDATION=PASS SHA=$PREVIEW_FINAL_SHA"

      - name: Deploy identical 044 Workers with rollback and smoke
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-044-stage-a-workers.sh"
          echo 'STEP_3_WORKERS_044=PASS'

      - name: Push exact PREVIEW 044 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_FINAL_SHA"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          git push origin HEAD:refs/heads/preview
          echo 'PREVIEW_SOURCE_044_PUSH=PASS'

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy and verify Firebase PREVIEW 044
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-preview.json --non-interactive
          for host in https://soridraw-preview.web.app https://preview.soridraw.com; do
            ok=''
            for i in $(seq 1 20); do
              curl -fsS -H 'Cache-Control: no-cache' "$host/app-version.json?t=$i" -o "$RUNNER_TEMP/pv.json" || true
              if grep -Fq '044' "$RUNNER_TEMP/pv.json"; then ok=yes; break; fi
              sleep 3
            done
            test "$ok" = yes
          done
          curl -fsS -H 'Cache-Control: no-cache' https://preview.soridraw.com/manifest.preview.json -o "$RUNNER_TEMP/preview-manifest.json"
          grep -Fq 'SORIDRAW(P)' "$RUNNER_TEMP/preview-manifest.json"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          echo "STEP_4_PREVIEW_HOSTING_044=PASS SHA=$PREVIEW_FINAL_SHA"
          echo 'MAIN_TEST_PRODUCTION_HOSTING_UNCHANGED=PASS'
