name: TEMP 357 First Publication Fanout Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-357-first-publication-fanout-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read live first-publication fanout schema only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          query() {
            node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "$1" --json
          }

          query "SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE sql IS NOT NULL AND (tbl_name IN ('tracks','track_stats','explore_derived_tracks','explore_derived_profiles','explore_shared_revision') OR (type='trigger' AND (sql LIKE '%tracks%' OR sql LIKE '%explore_shared_revision%'))) ORDER BY type,tbl_name,name; PRAGMA index_list('tracks');" > "$RUNNER_TEMP/schema.json"
          query "SELECT COUNT(*) AS total_tracks, SUM(CASE WHEN source_type='music_note' THEN 1 ELSE 0 END) AS music_note_tracks, SUM(CASE WHEN source_type='music_note' AND is_public=1 AND status='published' THEN 1 ELSE 0 END) AS public_music_note_tracks FROM tracks;" > "$RUNNER_TEMP/counts.json"

          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/schema.json','utf8'));
          const sets=raw.flatMap(x=>Array.isArray(x.results)?[x.results]:[]);
          const rows=sets.flat();
          const indexes=rows.filter(r=>r.type==='index'&&r.tbl_name==='tracks');
          const triggers=rows.filter(r=>r.type==='trigger'&&r.tbl_name==='tracks');
          console.log('TRACK_INDEX_COUNT='+indexes.length);
          for(const x of indexes) console.log('TRACK_INDEX='+JSON.stringify({name:x.name,sql:x.sql}));
          console.log('TRACK_TRIGGER_COUNT='+triggers.length);
          for(const x of triggers) console.log('TRACK_TRIGGER='+JSON.stringify({name:x.name,sql:x.sql}));
          const shared=rows.filter(r=>r.type==='trigger'&&String(r.sql||'').includes('explore_shared_revision'));
          for(const x of shared) console.log('SHARED_REV_TRIGGER='+JSON.stringify({name:x.name,tbl_name:x.tbl_name,sql:x.sql}));
          const counts=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/counts.json','utf8')).flatMap(x=>x.results||[])[0]||{};
          console.log('TRACK_COUNTS='+JSON.stringify(counts));
          console.log('REMOTE_D1_WRITES=0');
          console.log('USER_DATA_MUTATION=0');
          NODE
