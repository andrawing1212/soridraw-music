name: TEMP 111 Profile Negative Cache Prepare

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-111-profile-negative-cache-prepare.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify app baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          git restore --worktree --staged dist

      - name: Build guarded canonical Worker and run contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/soridraw-111"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/soridraw-111/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/soridraw-111" node cloudflare/explore-worker/patches/057-public-profile-negative-cache-guard.mjs
          cp "$RUNNER_TEMP/soridraw-111/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt

          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node --check cloudflare/explore-worker/canonical/preview-entry.js
          node scripts/verify-111-explore-profile-negative-cache.mjs
          node scripts/verify-110-explore-liked-public-count.mjs
          node scripts/verify-109-mobile-feed-refresh-zero.mjs
          node scripts/verify-108-explore-feed-cache-recovery.mjs
          node scripts/verify-107-explore-direct-count-zero-read.mjs
          node scripts/verify-105-explore-like-1min.mjs
          node scripts/verify-103-explore-like-event-batch.mjs
          node scripts/verify-102-explore-public-like-parity.mjs
          node scripts/verify-explore-deploy-preflight.mjs
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          printf 'CANDIDATE_CHANGED=%s\n' "${changed[*]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'cloudflare/explore-worker/canonical/preview-worker.js'
          test "${changed[1]}" = 'cloudflare/explore-worker/canonical/source-sha256.txt'
          grep -q 'SORIDRAW_PUBLIC_PROFILE_NEGATIVE_CACHE_057_20260916' cloudflare/explore-worker/canonical/preview-worker.js
          echo 'PREDEPLOY_111=PASS'

      - name: Commit generated canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soridraw-worker-bot
          git config user.email actions@users.noreply.github.com
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git commit -m 'fix: harden invalid public profile reads'
          git push origin HEAD:preview
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
