name: Temp 1029 Inspect Cache Flow
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1029-inspect-cache-flow.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - name: Print favoriteCount/profile blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text()
          for n in ['favoriteCount', 'readUserProfileCache(', 'writeUserProfileCache(', 'syncVersions.musicNote', 'syncVersions.favorites']:
            print('\n###',n)
            pos=0; count=0
            while True:
              i=s.find(n,pos)
              if i<0: break
              print('\nINDEX',i)
              print(s[max(0,i-1800):i+4000])
              pos=i+len(n); count+=1
              if count>=12: break
          PY