name: Verify app450 Existing Remote Config Split Setting (No Deploy)

on:
  pull_request:
    branches: [preview]
    paths:
      - 'src/services/versionSignalService.ts'
      - 'src/services/navigationVisibilitySyncService.ts'
      - 'src/components/MasterSplitFramePanel.tsx'
      - 'functions/src/masterSplitFrameMode450.ts'
      - 'functions/src/index.ts'
      - 'scripts/verify-214-navigation-visibility-sync.mjs'
      - 'scripts/verify-450-remote-config-master.mjs'
      - 'scripts/build-450-single-function-package.mjs'
      - '.github/workflows/verify-app450-existing-remote-config.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund
      - name: Verify existing navigation and app450 remote config contract
        run: |
          node scripts/verify-214-navigation-visibility-sync.mjs
          node scripts/verify-303-studio-split-browser-history.mjs
          node scripts/verify-418-rtdb-rules-delta.mjs --self-test
          node scripts/verify-434-publication-rtdb-additive.mjs --self-test
      - name: Verify Master ETag, ABA and shared data protection
        run: node scripts/verify-450-remote-config-master.mjs
      - name: TypeScript React
        run: npx tsc --noEmit
      - name: Build React
        run: npm run build
      - name: Build Firebase Functions
        run: npm --prefix functions run build
      - name: Stage precisely ONE callable without deployment
        run: |
          node scripts/build-450-single-function-package.mjs
          npm install --prefix .app450-only-functions --omit=dev --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const target=require('./.app450-only-functions/lib/index.js');
          if(Object.keys(target).join(',')!=='masterSetSplitFrameMode' ||
            typeof target.masterSetSplitFrameMode!=='function')
            throw Error('450_STAGE_NOT_SINGLE_FUNCTION');
          console.log('450_ONLY_MASTER_SPLIT_FUNCTION_STAGED=PASS');
          NODE
      - name: Explicitly forbid deployment
        run: echo '450_NO_SHARED_RTDB_RULES_CHANGE_NO_DEPLOY=PASS'
