name: Report finalize master35 failure

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    if: github.event.issue.title == 'REPORT FINALIZE MASTER35 FAILURE'
    runs-on: ubuntu-latest
    steps:
      - name: Report failed log tail
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          gh run view 30159245393 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failure.log || true
          tail -n 120 /tmp/failure.log > /tmp/failure-tail.log
          gh issue comment "$ISSUE_URL" --body '```text'
          gh issue comment "$ISSUE_URL" --body "$(cat /tmp/failure-tail.log)"
          gh issue comment "$ISSUE_URL" --body '```'
