name: TEMP 078 Worker Marker Check

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-078-worker-marker-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - name: Verify canonical PREVIEW Worker contains 043 044 045
        shell: bash
        run: |
          set -euo pipefail
          worker='cloudflare/explore-worker/canonical/preview-worker.js'
          entry='cloudflare/explore-worker/canonical/preview-entry.js'
          test -s "$worker"
          test -s "$entry"
          grep -q 'SORIDRAW_PUBLICATION_TARGETED_R2_HOTPATH_043_20260913' "$worker"
          grep -q 'SORIDRAW_LOCAL_FIRST_COST_HOTPATH_044_20260913' "$worker"
          grep -q 'SORIDRAW_PUBLICATION_REVISION_METADATA_045_20260913' "$worker"
          grep -q '/v1/me/music-note-publications-revision' "$worker"
          grep -q 'PROFILE_MEDIA.head(musicNotePublicationR2Key' "$worker"
          grep -q 'SORIDRAW_FEED_REVISION_HEAD_ONLY_044_20260913' "$entry"
          echo 'CANONICAL_043=PASS'
          echo 'CANONICAL_044=PASS'
          echo 'CANONICAL_045=PASS'
          echo 'REVISION_R2_HEAD_ONLY=PASS'
