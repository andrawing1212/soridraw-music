name: SORIDRAW Inspect PREVIEW Worker Env 027

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-inspect-preview-worker-env-027.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect active PREVIEW runtime literals
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x;}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;
            const ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y?.percentage||0)-Number(x?.percentage||0))[0];
            if(!a?.version_id)throw new Error('active version missing');
            const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${a.version_id}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];
            const s=Buffer.from(m.content_base64,'base64').toString('utf8');
            console.log('PREVIEW_VERSION='+a.version_id);
            const needles=['preview.soridraw.com','test.soridraw.com','soridraw.com','soridraw-explore-preview','soridraw-explore-test','soridraw-explore-api','soridraw-preview.web.app','soridraw-test.web.app','soridraw.web.app'];
            for(const needle of needles){
              const hits=[];let p=0;while((p=s.indexOf(needle,p))>=0&&hits.length<20){hits.push(p);p+=needle.length;}
              console.log(`LITERAL ${needle} COUNT=${(s.split(needle).length-1)}`);
              for(const at of hits){console.log('  '+s.slice(Math.max(0,at-120),Math.min(s.length,at+needle.length+180)).replace(/\s+/g,' '));}
            }
            console.log('ENV_LITERAL_INSPECT_027=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
