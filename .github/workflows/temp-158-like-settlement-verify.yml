name: TEMP 158 Personal Like Settlement Dry Run
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-158-like-settlement-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Generate isolated Worker 072-076 candidate and run tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | cut -d' ' -f1)" = b170d05385c3096a98033675a9acbb63b40148bf782017c326845b7ea4c17813
          mkdir -p "$RUNNER_TEMP/worker-candidate"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/worker-candidate/worker.js"
          for patch in 072-personal-like-r2-revision.mjs 073-server-like-queue-order.mjs 074-personal-like-r2-cas.mjs 075-targeted-canonical-like-read.mjs 076-like-canonical-settlement-gate.mjs; do
            SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/worker-candidate" node "cloudflare/explore-worker/patches/$patch"
          done
          node --check "$RUNNER_TEMP/worker-candidate/worker.js"
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/worker-candidate/worker.js" node scripts/verify-128-like-concurrency.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/worker-candidate/worker.js" node scripts/verify-129-like-legacy-repair-gate.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/worker-candidate/worker.js" node scripts/verify-130-like-settlement-gate.mjs
          echo 'WORKER071_CANONICAL_UNCHANGED=PASS'
      - name: Prior releases and candidate regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-127-atomic-personal-like.mjs
          node scripts/verify-126-explore-entry-like-count.mjs
          node scripts/verify-125-like-preservation.mjs
          node scripts/verify-124-mobile-shared-cache-repair.mjs
          node scripts/verify-123-shared-like-cache-repair.mjs
          node scripts/verify-110-explore-liked-public-count.mjs
      - name: TypeScript and Build
        run: |
          npm run lint
          npm run build
      - name: Safety boundary
        run: echo 'DRY_RUN_ONLY=PASS DEPLOY=0 USER_DATA_WRITE=0 MAIN_PRODUCTION_UNCHANGED=PASS'
