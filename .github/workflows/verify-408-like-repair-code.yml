          node scripts/verify-423-personal-like-r2.mjs
          node scripts/verify-424-like-rtdb-signal.mjs
      - name: Stage420 two-hour like abuse policy (pure source; not server enforcement)
        run: |
          node scripts/verify-420-like-abuse-policy.mjs
          node scripts/verify-420-server-like-abuse-gate.mjs
          node scripts/verify-420-permit-renewal.mjs
          node scripts/verify-420-approval-recovery.mjs
          node scripts/verify-420-journal-cost-envelope.mjs
          node scripts/verify-420-atomic-ledger-candidate.mjs
          node scripts/verify-420-atomic-cutover-barrier.mjs
          node scripts/verify-420-permit-expiry-replay.mjs
          node scripts/verify-420-private-rules-candidate.mjs
          node scripts/verify-420-guarded-transport.mjs
          node scripts/verify-420-mandatory-upgrade.mjs
          node scripts/verify-420-master-policy.mjs
          node scripts/verify-420-master-ui.mjs
          node scripts/prepare-420-held-alert-policy.mjs --self-test
      - name: Stage416 five-minute private candidate and server clock (source only)
        run: |
          node --check cloudflare/explore-worker/runtime/private-window-gate-416.mjs
          node scripts/verify-416-private-5min-batch.mjs
          node scripts/verify-416-shared-writer-d1.mjs
          node scripts/verify-416-private-rtdb-batch.mjs
          node scripts/verify-416-client-rtdb-binding.mjs
          node scripts/verify-416-private-like-intent.mjs
