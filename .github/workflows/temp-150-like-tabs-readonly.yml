name: TEMP 150 Explore Like Readonly Source Parity
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-150-like-tabs-readonly.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6303a014c43fb47418a8ce48f56501bccb9030d3
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only two reported songs across canonical local shared API and revisions
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          npm install --no-audit --no-fund --package-lock=false
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$W" d1 execute DB --remote --config "$CFG" --command "SELECT t.id,COALESCE(s.like_count,0) AS canonical_count,(SELECT COUNT(*) FROM likes l WHERE l.track_id=t.id) AS relation_count,d.likes AS derived_count,json_extract(d.row_json,'$.like_count') AS derived_json_count FROM tracks t LEFT JOIN track_stats s ON s.track_id=t.id LEFT JOIN explore_derived_tracks d ON d.id=t.id WHERE t.is_public=1 AND t.status='published' LIMIT 201" --json > "$RUNNER_TEMP/canonical150.json"
          for sort in latest popular; do
            curl -fsS --retry 2 --max-time 20 -D "$RUNNER_TEMP/api-$sort.head" -o "$RUNNER_TEMP/api-$sort.json" -H 'Origin: https://preview.soridraw.com' "$PREVIEW_BASE/v1/feed?sort=$sort&limit=40&__soridraw_r2_only=108"
            curl -fsS --retry 2 --max-time 20 -o "$RUNNER_TEMP/revision-$sort.json" "$PREVIEW_BASE/v1/feed-revision?sort=$sort"
            node "$W" r2 object get "soridraw-profile-media-preview/internal/explore/feed-v1/$sort-40.json" --file "$RUNNER_TEMP/local-$sort.json" --remote >/dev/null
            node "$W" r2 object get "soridraw-profile-media/internal/explore/shared-feed-v112/$sort-40.json" --file "$RUNNER_TEMP/shared-$sort.json" --remote >/dev/null
          done
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto'),root=process.env.RUNNER_TEMP;
          const rows=JSON.parse(fs.readFileSync(root+'/canonical150.json','utf8')).flatMap(x=>x.results||[]);
          const reference=new Map(rows.map(x=>[String(x.id),x]));
          const hashes={};
          const targetIds=new Set();
          const knownNames=['Leaving One Step Open','Left Unsaid'];
          const parsed={};
          for (const scope of ['api','local','shared']) for (const sort of ['latest','popular']) {
            const bundle=JSON.parse(fs.readFileSync(root+'/'+scope+'-'+sort+'.json','utf8'));
            if(bundle.ok===false) throw Error('failed '+scope+' '+sort);
            const items=bundle?.data?.items||bundle?.payload?.data?.items||[];
            if(!Array.isArray(items)) throw Error('bad rows '+scope+' '+sort);
            parsed[scope+'-'+sort]=items;
            for(const item of items){
              const title=String(item.title||'');
              if(knownNames.some(name=>title.includes(name))) targetIds.add(String(item.id||item.trackId||''));
            }
            console.log('SCOPE='+scope+' SORT='+sort+' N='+items.length);
          }
          if(targetIds.size!==2) throw Error('Expected 2 target songs, got '+targetIds.size);
          for(const id of targetIds){
            const row=reference.get(id);
            if(!row) throw Error('Target canonical track missing');
            const hash=crypto.createHash('sha256').update(id).digest('hex').slice(0,10);
            const values=[];
            for(const scope of ['api','local','shared'])for(const sort of ['latest','popular']){
              const item=parsed[scope+'-'+sort].find(x=>String(x.id||x.trackId||'')===id);
              values.push(scope+'-'+sort+'='+(item?String(item.likeCount??item.stats?.likeCount??'null'):'ABSENT'));
            }
            console.log('TARGET_SHA10='+hash+' D1='+row.canonical_count+' RELATION='+row.relation_count+' DERIVED='+row.derived_count+' DERIVED_JSON='+row.derived_json_count+' '+values.join(' '));
          }
          for(const sort of ['latest','popular']){
            const data=JSON.parse(fs.readFileSync(root+'/revision-'+sort+'.json','utf8'));
            console.log('REVISION_SORT='+sort+' OK='+data.ok+' REV='+String(data?.data?.revision||'null').slice(0,70));
            const headers=fs.readFileSync(root+'/api-'+sort+'.head','utf8');
            console.log('D1_HEADER_SORT='+sort+' '+headers.split(/\r?\n/).filter(line=>/^x-soridraw-d1-(read|write):/i.test(line)).join(' '));
          }
          console.log('READONLY=PASS D1_WRITE=0 R2_WRITE=0 DEPLOY=0');
          NODE
