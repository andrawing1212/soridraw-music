name: SORIDRAW 541 Owned Worker Follow and Firebase E2E (No Deploy)
# Single PR owned DB and demo Firebase only; remove this workflow after PASS.
on:
  pull_request:
    branches: [preview]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/verify-541-owner-off-integration.yml'
      - 'cloudflare/explore-worker/runtime/owner-follow-inline-canonical-540.mjs'
      - 'scripts/verify-540-inline-worker-parity.mjs'
      - 'scripts/test-539-real-worker-http-e2e.mjs'
      - 'scripts/measure-532-isolated-auth-generation-d1.mjs'
permissions: {contents: read}
concurrency:
  group: soridraw-541-isolated-pr914
  cancel-in-progress: false
jobs:
  offline:
    if: github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == 'andrawing1212/soridraw-music' && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify OFF gates, canonical parity, epoch safety, and syntax
        run: |
          set -euo pipefail
          node --check cloudflare/explore-worker/runtime/owner-follow-inline-canonical-540.mjs
          node --check scripts/verify-540-inline-worker-parity.mjs
          node --check scripts/measure-532-isolated-auth-generation-d1.mjs
          node --check scripts/test-539-real-worker-http-e2e.mjs
          node scripts/verify-540-inline-worker-parity.mjs
          node scripts/measure-532-isolated-auth-generation-d1.mjs --self-test
  physical:
    needs: offline
    if: github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == 'andrawing1212/soridraw-music' && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Measure exact candidate vs legacy follow SQL on owned D1 ONLY
        run: node scripts/measure-532-isolated-auth-generation-d1.mjs
      - name: Always remove only run-owned temporary D1
        if: always()
        run: node scripts/measure-532-isolated-auth-generation-d1.mjs cleanup
  emulator:
    needs: offline
    if: github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == 'andrawing1212/soridraw-music' && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal'
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      APP534_ISOLATED_ONLY: 'yes'
      GCLOUD_PROJECT: demo-soridraw-owner-534
      FIREBASE_PROJECT_ID: demo-soridraw-owner-534
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: No live routing or secrets
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = "demo-soridraw-owner-534"
          grep -q 'APP540_INLINE_CANONICAL_COMPILED_OPEN = false' cloudflare/explore-worker/runtime/owner-follow-inline-canonical-540.mjs
          grep -q 'APP539_FUNCTIONS_HTTP_COMPILED_OPEN=false' functions/experiments/owner-follow-http-539.mjs
          grep -q 'APP539_WORKER_HTTP_BRIDGE_COMPILED_OPEN=false' cloudflare/explore-worker/runtime/owner-follow-http-539.mjs
          ! grep -q 'owner-follow-inline-canonical-540' cloudflare/explore-worker/canonical/preview-entry.js
          node -e "const c=JSON.parse(require('fs').readFileSync('scripts/emulator/app534.firebase.json'));if(c.database.rules!=='app533.database.rules.json'||c.firestore.rules!=='app534.firestore.rules')process.exit(3)"
      - name: Install demo source dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
      - name: Existing app and Functions TypeScript
        run: |
          ./node_modules/.bin/tsc --noEmit
          ./functions/node_modules/.bin/tsc --noEmit --project functions/tsconfig.json
      - name: Old/new Worker count with actual Firebase Auth/Firestore/RTDB and HTTP
        run: |
          set -euo pipefail
          env -u GOOGLE_APPLICATION_CREDENTIALS -u FIREBASE_TOKEN npx --yes firebase-tools@14.23.0 emulators:exec \
            --project demo-soridraw-owner-534 \
            --config scripts/emulator/app534.firebase.json \
            --only auth,database,firestore \
            'env -u GOOGLE_APPLICATION_CREDENTIALS -u FIREBASE_TOKEN node --import tsx scripts/test-539-real-worker-http-e2e.mjs'
      - name: Confirm shared resources were never accessed
        if: always()
        run: echo 'APP541_DEMO_FIREBASE_ONLY;OWNED_EPHEMERAL_CLOUDFLARE_D1_ONLY;NO_DEPLOY'
