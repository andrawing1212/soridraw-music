name: SORIDRAW Implement D1 Diagnostics 026
on:
  push:
    branches: [preview]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 5
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply client diagnostic split
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, expected=1, label='replace'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new)

          p = Path('src/lib/cloudflareDiagnostics.ts')
          s = p.read_text()
          s = replace_exact(s,
              '  d1RowsWritten: number;\n  r2ClassA: number;',
              '  d1RowsWritten: number;\n  d1ReadQueries: number;\n  d1WriteQueries: number;\n  r2ClassA: number;',
              2, 'types')
          s = replace_exact(s,
              '  d1RowsWritten: 0,\n  r2ClassA: 0,',
              '  d1RowsWritten: 0,\n  d1ReadQueries: 0,\n  d1WriteQueries: 0,\n  r2ClassA: 0,',
              2, 'empty states')
          s = replace_exact(s,
              '        d1RowsWritten: normalizeCount(state?.d1RowsWritten),\n        r2ClassA: normalizeCount(state?.r2ClassA),',
              '        d1RowsWritten: normalizeCount(state?.d1RowsWritten),\n        d1ReadQueries: normalizeCount(state?.d1ReadQueries),\n        d1WriteQueries: normalizeCount(state?.d1WriteQueries),\n        r2ClassA: normalizeCount(state?.r2ClassA),',
              1, 'stored path')
          s = replace_exact(s,
              '      d1RowsWritten: normalizeCount(parsed?.d1RowsWritten),\n      r2ClassA: normalizeCount(parsed?.r2ClassA),',
              '      d1RowsWritten: normalizeCount(parsed?.d1RowsWritten),\n      d1ReadQueries: normalizeCount(parsed?.d1ReadQueries),\n      d1WriteQueries: normalizeCount(parsed?.d1WriteQueries),\n      r2ClassA: normalizeCount(parsed?.r2ClassA),',
              1, 'stored total')
          s = replace_exact(s,
              "  const d1RowsWritten = metered ? readUsageHeader(response, 'X-SORIDRAW-D1-Write') : 0;\n  const r2ClassA = metered ? readUsageHeader(response, 'X-SORIDRAW-R2-A') : 0;",
              "  const d1RowsWritten = metered ? readUsageHeader(response, 'X-SORIDRAW-D1-Write') : 0;\n  const d1ReadQueries = metered ? readUsageHeader(response, 'X-SORIDRAW-D1-Read-Queries') : 0;\n  const d1WriteQueries = metered ? readUsageHeader(response, 'X-SORIDRAW-D1-Write-Queries') : 0;\n  const r2ClassA = metered ? readUsageHeader(response, 'X-SORIDRAW-R2-A') : 0;",
              1, 'headers')
          s = replace_exact(s,
              '    d1RowsWritten: previous.d1RowsWritten + d1RowsWritten,\n    r2ClassA: previous.r2ClassA + r2ClassA,',
              '    d1RowsWritten: previous.d1RowsWritten + d1RowsWritten,\n    d1ReadQueries: previous.d1ReadQueries + d1ReadQueries,\n    d1WriteQueries: previous.d1WriteQueries + d1WriteQueries,\n    r2ClassA: previous.r2ClassA + r2ClassA,',
              1, 'total accumulate')
          s = replace_exact(s,
              '        d1RowsWritten: previousPath.d1RowsWritten + d1RowsWritten,\n        r2ClassA: previousPath.r2ClassA + r2ClassA,',
              '        d1RowsWritten: previousPath.d1RowsWritten + d1RowsWritten,\n        d1ReadQueries: previousPath.d1ReadQueries + d1ReadQueries,\n        d1WriteQueries: previousPath.d1WriteQueries + d1WriteQueries,\n        r2ClassA: previousPath.r2ClassA + r2ClassA,',
              1, 'path accumulate')
          p.write_text(s)

          p = Path('src/components/CacheDiagnosticsOverlay.tsx')
          s = p.read_text()
          top_needle = 'Cloudflare 앱 · LOCAL {formatNumber(cloudflare.localCacheHits)} · Worker {formatNumber(cloudflare.workerRequests)} · D1 읽기 {cloudflareMetered ? formatNumber(cloudflare.d1RowsRead) : \'—\'} · 쓰기 {cloudflareMetered ? formatNumber(cloudflare.d1RowsWritten) : \'—\'}'
          at = s.find(top_needle)
          if at < 0: raise SystemExit('overlay total needle missing')
          start = s.rfind('<div', 0, at)
          end = s.find('</div>', at)
          if start < 0 or end < 0: raise SystemExit('overlay total div missing')
          end += len('</div>')
          indent_start = s.rfind('\n', 0, start) + 1
          indent = s[indent_start:start]
          top_new = f'''<div className="whitespace-nowrap text-[12px] font-bold text-[#c6b5ff]">
{indent}  Cloudflare 앱 · LOCAL {{formatNumber(cloudflare.localCacheHits)}} · Worker {{formatNumber(cloudflare.workerRequests)}}
{indent}</div>
{indent}<div className="whitespace-nowrap text-[11px] font-bold text-[#c6b5ff]/80">
{indent}  D1 쿼리 읽기 {{cloudflareMetered ? formatNumber(cloudflare.d1ReadQueries) : '—'}} · 쓰기 {{cloudflareMetered ? formatNumber(cloudflare.d1WriteQueries) : '—'}} · 행 읽기 {{cloudflareMetered ? formatNumber(cloudflare.d1RowsRead) : '—'}} · 쓰기 {{cloudflareMetered ? formatNumber(cloudflare.d1RowsWritten) : '—'}}
{indent}</div>'''
          s = s[:start] + top_new + s[end:]

          path_needle = 'LOCAL {formatNumber(state.localCacheHits)} · Worker {formatNumber(state.workerRequests)} · D1 읽기 {formatNumber(state.d1RowsRead)} · 쓰기 {formatNumber(state.d1RowsWritten)}'
          at = s.find(path_needle)
          if at < 0: raise SystemExit('overlay path needle missing')
          span_start = s.rfind('<span', 0, at)
          span_end = s.find('</span>', at)
          if span_start < 0 or span_end < 0: raise SystemExit('overlay path span missing')
          span_end += len('</span>')
          old_span = s[span_start:span_end]
          new_span = '<span className="shrink-0 whitespace-nowrap tabular-nums">LOCAL {formatNumber(state.localCacheHits)} · Worker {formatNumber(state.workerRequests)}</span>'
          s = s[:span_start] + new_span + s[span_end:]
          parent_end = s.find('</div>', span_start + len(new_span))
          if parent_end < 0: raise SystemExit('overlay path parent div missing')
          parent_end += len('</div>')
          line_start = s.rfind('\n', 0, parent_end) + 1
          parent_indent = s[line_start:parent_end - len('</div>')]
          if '<' in parent_indent: parent_indent = '                    '
          extra = '''
                    <div className="flex min-w-0 items-center justify-between gap-2 text-[10px] font-bold text-[#c6b5ff]/68">
                      <span className="shrink-0 whitespace-nowrap tabular-nums">D1 쿼리 읽기 {formatNumber(state.d1ReadQueries)} · 쓰기 {formatNumber(state.d1WriteQueries)}</span>
                      <span className="shrink-0 whitespace-nowrap tabular-nums">행 읽기 {formatNumber(state.d1RowsRead)} · 쓰기 {formatNumber(state.d1RowsWritten)}</span>
                    </div>'''
          s = s[:parent_end] + extra + s[parent_end:]
          p.write_text(s)
          PY
          node --check cloudflare/explore-worker/patches/026-d1-query-vs-row-diagnostics.mjs
          git diff --check
          grep -Fq 'D1 쿼리 읽기' src/components/CacheDiagnosticsOverlay.tsx
          grep -Fq "X-SORIDRAW-D1-Read-Queries" src/lib/cloudflareDiagnostics.ts
      - name: Validate app
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/cloudflareDiagnostics.ts src/components/CacheDiagnosticsOverlay.tsx
          git commit -m 'feat(preview): split D1 query counts from row billing'
          git push origin HEAD:preview
