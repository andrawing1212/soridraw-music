name: TEMP Exact PREVIEW backend + TEST + PRODUCTION v4 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-preview-to-test-prod-v4-20260904.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 71007256858d0f950db29ea95cc810f8e34d2d05
      HOSTING_PROJECT: soridraw
      FUNCTIONS_PROJECT: soridraw-app-866a5
      TEST_CUSTOM_HOST: test.soridraw.com
      TEST_WEB_HOST: soridraw-test.web.app
      TEST_FIREBASE_HOST: soridraw-test.firebaseapp.com
      PROD_CUSTOM_HOST: soridraw.com
      PROD_WEB_HOST: soridraw.web.app
      PROD_FIREBASE_HOST: soridraw.firebaseapp.com
      TEST_EXPLORE_ORIGIN: https://soridraw-explore-test.andrawing1212.workers.dev
      PROD_EXPLORE_ORIGIN: https://soridraw-explore-api.andrawing1212.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout exact current PREVIEW
        uses: actions/checkout@v4
        with:
          ref: 71007256858d0f950db29ea95cc810f8e34d2d05
          fetch-depth: 1

      - name: Lock PREVIEW SHA
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/preview | awk '{print $1}')"
          echo "EXPECTED=$SOURCE_SHA CURRENT=$remote"
          test "$remote" = "$SOURCE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build exact PREVIEW app and shared Functions source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          grep -Fq 'https://preview.soridraw.com' functions/src/index.ts
          grep -Fq 'https://test.soridraw.com' functions/src/index.ts
          grep -Fq 'https://soridraw.com' functions/src/index.ts
          grep -Fq 'https://soridraw-test.web.app' functions/src/index.ts
          grep -Fq 'https://soridraw.web.app' functions/src/index.ts
          echo 'EXACT_PREVIEW_BUILD_AND_FUNCTION_CORS_SOURCE=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy current rescue Functions from PREVIEW shared backend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only functions:rescueSunoTrackAudio,functions:sunoWavRescueCallback \
            --project "$FUNCTIONS_PROJECT" \
            --non-interactive
          echo 'SHARED_RESCUE_FUNCTIONS_DEPLOY=PASS'

      - name: Verify shared Firebase backend CORS on all live environments
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://us-central1-$FUNCTIONS_PROJECT.cloudfunctions.net/rescueSunoTrackAudio"
          for origin in \
            'https://preview.soridraw.com' \
            'https://test.soridraw.com' \
            'https://soridraw-test.web.app' \
            'https://soridraw-test.firebaseapp.com' \
            'https://soridraw.com' \
            'https://soridraw.web.app' \
            'https://soridraw.firebaseapp.com'; do
            ok=''
            for attempt in $(seq 1 12); do
              code="$(curl -sS -o /tmp/cors-body -D /tmp/cors-head -w '%{http_code}' -X OPTIONS \
                -H "Origin: $origin" \
                -H 'Access-Control-Request-Method: POST' \
                -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
                "$endpoint" || true)"
              allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/cors-head)"
              echo "FUNCTION_CORS origin=$origin code=$code allow=${allow:-none} attempt=$attempt"
              if { [ "$code" = '200' ] || [ "$code" = '204' ]; } && [ "$allow" = "$origin" ]; then ok=yes; break; fi
              sleep 8
            done
            test "$ok" = yes
          done
          echo 'SHARED_FUNCTIONS_ALL_ENV_CORS=PASS'

      - name: Prepare canonical current Explore Worker with PREVIEW patch set
        working-directory: cloudflare/explore-worker
        shell: bash
        env:
          SORIDRAW_SKIP_PATCH_REPLAY: '1'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run cf:prepare
          for patch in \
            patches/002-explore-feed-edge-cache.mjs \
            patches/003-cost-zero-profile-first-view.mjs \
            patches/004-cost-zero-profile-first-view-materializer.mjs \
            patches/005-cost-zero-profile-first-view-pk-read.mjs \
            patches/006-cost-zero-profile-prebuild-on-mutation.mjs \
            patches/007-profile-revision-revalidation.mjs \
            patches/008-explore-community-lightweight-social.mjs; do
            SORIDRAW_REMOTE_WORKER_DIR=.remote-worker node "$patch"
          done
          node - <<'NODE'
          const fs=require('fs'); const src=fs.readFileSync('.remote-worker/worker.js','utf8');
          for (const m of ['handleFeedWithEdgeCache','handlePublicProfileFirstViewSnapshot','materializePublicProfileFirstView','readPublicProfileFirstViewRowByPrimaryKey','refreshOrPrebuildPublicProfileFirstView','readPublicProfileFirstViewRevisionOnly','adjustExploreFollowCountersDelta','adjustExploreLikeCounterDelta','handleMyFollowStates','handleProfileConnections']) if(!src.includes(m)) throw new Error(`missing ${m}`);
          const cfg=JSON.parse(fs.readFileSync('.remote-worker/wrangler.jsonc','utf8'));
          if(cfg.name!=='soridraw-explore-api') throw new Error('unexpected production Worker name');
          const test={...cfg,name:'soridraw-explore-test',workers_dev:true};
          delete test.route; delete test.routes;
          test.d1_databases=[{binding:'DB',database_name:'soridraw-explore-test-db',database_id:'31817dbd-d06e-415e-9bc0-5553b0f5dc43'}];
          test.r2_buckets=[{binding:'PROFILE_MEDIA',bucket_name:'soridraw-profile-media-test'}];
          fs.writeFileSync('.remote-worker/wrangler.test.release.jsonc',JSON.stringify(test,null,2)+'\n');
          console.log('EXPLORE_WORKER_PREPARED=PASS');
          NODE

      - name: Deploy Explore Worker to TEST
        working-directory: cloudflare/explore-worker
        run: npx wrangler deploy --strict --config .remote-worker/wrangler.test.release.jsonc

      - name: Verify TEST Explore Worker
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/test-feed -D /tmp/test-head -w '%{http_code}' -H "Origin: https://$TEST_CUSTOM_HOST" "$TEST_EXPLORE_ORIGIN/v1/feed?sort=latest&limit=1")"
          allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/test-head)"
          echo "TEST_EXPLORE feed=$code allow=$allow"
          test "$code" = 200 && test "$allow" = "https://$TEST_CUSTOM_HOST"
          first="$(curl -sS -o /tmp/test-first -w '%{http_code}' -H "Origin: https://$TEST_CUSTOM_HOST" "$TEST_EXPLORE_ORIGIN/v1/profiles/__release_probe_missing__/first-view?limit=1" || true)"
          echo "TEST_EXPLORE first-view-route=$first"
          test "$first" = 404

      - name: Deploy exact PREVIEW to Firebase TEST Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$HOSTING_PROJECT" --config firebase.hosting-test.json --non-interactive

      - name: Verify TEST exact PREVIEW artifact
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for host in "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" "$TEST_CUSTOM_HOST"; do
            curl -fsS --retry 8 --retry-delay 5 -H 'Cache-Control: no-cache' "https://$host/?release=$SOURCE_SHA" -o "/tmp/${host//./-}.html"
            live_sha="$(sha256sum "/tmp/${host//./-}.html" | awk '{print $1}')"
            echo "TEST_HOST $host local=$local_sha live=$live_sha"
            test "$live_sha" = "$local_sha"
          done
          echo 'TEST_EXACT_PREVIEW=PASS'

      - name: Deploy Explore Worker to PRODUCTION
        working-directory: cloudflare/explore-worker
        run: npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc

      - name: Verify PRODUCTION Explore Worker
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/prod-feed -D /tmp/prod-head -w '%{http_code}' -H "Origin: https://$PROD_CUSTOM_HOST" "$PROD_EXPLORE_ORIGIN/v1/feed?sort=latest&limit=1")"
          allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/prod-head)"
          echo "PROD_EXPLORE feed=$code allow=$allow"
          test "$code" = 200 && test "$allow" = "https://$PROD_CUSTOM_HOST"
          first="$(curl -sS -o /tmp/prod-first -w '%{http_code}' -H "Origin: https://$PROD_CUSTOM_HOST" "$PROD_EXPLORE_ORIGIN/v1/profiles/__release_probe_missing__/first-view?limit=1" || true)"
          echo "PROD_EXPLORE first-view-route=$first"
          test "$first" = 404

      - name: Deploy exact PREVIEW to Firebase PRODUCTION Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$HOSTING_PROJECT" --config firebase.json --non-interactive

      - name: Verify PRODUCTION exact PREVIEW artifact
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for host in "$PROD_WEB_HOST" "$PROD_FIREBASE_HOST" "$PROD_CUSTOM_HOST"; do
            curl -fsS --retry 8 --retry-delay 5 -H 'Cache-Control: no-cache' "https://$host/?release=$SOURCE_SHA" -o "/tmp/${host//./-}.html"
            live_sha="$(sha256sum "/tmp/${host//./-}.html" | awk '{print $1}')"
            echo "PROD_HOST $host local=$local_sha live=$live_sha"
            test "$live_sha" = "$local_sha"
          done
          echo 'PRODUCTION_EXACT_PREVIEW=PASS'

      - name: Result
        run: |
          echo "SOURCE_PREVIEW_SHA=$SOURCE_SHA"
          echo 'TEST_HOSTING_EXACT_PREVIEW=true'
          echo 'PRODUCTION_HOSTING_EXACT_PREVIEW=true'
          echo 'TEST_EXPLORE_WORKER_CURRENT=true'
          echo 'PRODUCTION_EXPLORE_WORKER_CURRENT=true'
          echo 'SHARED_RESCUE_FUNCTIONS_CURRENT=true'
          echo 'SHARED_FUNCTIONS_TEST_PROD_CORS=true'
          echo 'FIRESTORE_RULES_REDEPLOY=false'
          echo 'D1_DATA_WRITE=false'
          echo 'R2_DATA_WRITE=false'
