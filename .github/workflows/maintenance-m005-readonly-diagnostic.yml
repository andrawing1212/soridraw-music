name: SORIDRAW M-005 Suno Library Readonly Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m005-readonly-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5
      FIREBASE_PROJECT_NUMBER: '91309780603'
      FIREBASE_WEB_APP_ID: '1:91309780603:web:cde703895e2cf31ecffcde'
      PREVIEW_HOST: soridraw-music-git-preview-andrawing1212.vercel.app
      MAIN_HOST: soridraw-music.vercel.app
      PROD_HOST: soridraw.web.app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Fresh Firestore quota gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import datetime as dt
          import json, os, urllib.parse, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          project=os.environ['FIREBASE_PROJECT_ID']
          creds=service_account.Credentials.from_service_account_file(
              os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
              scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request())
          headers={'Authorization':f'Bearer {creds.token}','X-Goog-User-Project':project,'Accept':'application/json'}
          now=dt.datetime.now(dt.timezone.utc)
          kst=dt.timezone(dt.timedelta(hours=9))
          start=now.astimezone(kst).replace(hour=0,minute=0,second=0,microsecond=0).astimezone(dt.timezone.utc)

          def metric(candidates):
              last=(candidates[0],0,0)
              for name in candidates:
                  params={'filter':f'metric.type = "{name}"','interval.startTime':start.isoformat().replace('+00:00','Z'),'interval.endTime':now.isoformat().replace('+00:00','Z'),'view':'FULL','pageSize':'1000'}
                  r=requests.get(f'https://monitoring.googleapis.com/v3/projects/{project}/timeSeries?{urllib.parse.urlencode(params)}',headers=headers,timeout=20)
                  if r.status_code in (400,404):
                      continue
                  r.raise_for_status()
                  total=points=0
                  for series in r.json().get('timeSeries',[]):
                      for p in series.get('points',[]):
                          raw=p.get('value',{}).get('int64Value',p.get('value',{}).get('doubleValue',0))
                          try: total += max(0,float(raw))
                          except Exception: pass
                          points += 1
                  last=(name,round(total),points)
                  if points: return last
              return last

          reads=metric(['firestore.googleapis.com/document/read_ops_count','firestore.googleapis.com/document/read_count'])
          writes=metric(['firestore.googleapis.com/document/write_ops_count','firestore.googleapis.com/document/write_count'])
          deletes=metric(['firestore.googleapis.com/document/delete_ops_count','firestore.googleapis.com/document/delete_count'])
          safe_read=min(10000,max(0,50000-reads[1]-10000))
          result={'kstDate':str(now.astimezone(kst).date()),'reads':reads[1],'writes':writes[1],'deletes':deletes[1],'safeReadCap':safe_read,'requiredReads':1500}
          print('M005_QUOTA='+json.dumps(result,ensure_ascii=False))
          if reads[2] == 0 or writes[2] == 0 or safe_read < 1500:
              raise SystemExit('M005_QUOTA_GATE_BLOCKED')
          print('M005_QUOTA_GATE=PASS')
          PY

      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts

      - name: Read-only Library source bundle and media audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import https from 'node:https';
          import http from 'node:http';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const projectId=process.env.FIREBASE_PROJECT_ID;
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          initializeApp({ credential:applicationDefault(), projectId });
          const db=getFirestore();
          const hash=s=>crypto.createHash('sha256').update(String(s||'')).digest('hex').slice(0,10);
          const createdMs=v=>{
            if (!v) return 0;
            if (typeof v?.toMillis==='function') return v.toMillis();
            if (typeof v?.seconds==='number') return v.seconds*1000+Math.floor(Number(v.nanoseconds||0)/1e6);
            if (typeof v==='number') return v;
            const t=new Date(v).getTime(); return Number.isFinite(t)?t:0;
          };
          const extractAudioUrls=(obj)=>{
            const out=[];
            const seen=new Set();
            const walk=(value,key='',depth=0)=>{
              if (depth>8 || value==null) return;
              if (typeof value==='string') {
                if (/^https?:\/\//i.test(value) && /(audio|stream|download|mp3|wav|m4a|cdn)/i.test(key+' '+value)) {
                  if (!seen.has(value)) { seen.add(value); out.push(value); }
                }
                return;
              }
              if (Array.isArray(value)) return value.forEach(v=>walk(v,key,depth+1));
              if (typeof value==='object') Object.entries(value).forEach(([k,v])=>walk(v,k,depth+1));
            };
            walk(obj);
            return out.slice(0,8);
          };
          const probe=async url=>new Promise(resolve=>{
            let parsed;
            try { parsed=new URL(url); } catch { return resolve({host:'invalid',status:0,bytes:0,type:'',length:''}); }
            const lib=parsed.protocol==='http:'?http:https;
            const req=lib.request(parsed,{method:'GET',headers:{Range:'bytes=0-1023','User-Agent':'SORIDRAW-M005-Readonly/1.0'},timeout:12000},res=>{
              let bytes=0;
              const finish=()=>resolve({host:parsed.hostname,status:res.statusCode||0,bytes,type:String(res.headers['content-type']||''),length:String(res.headers['content-length']||'')});
              res.on('data',chunk=>{ bytes+=chunk.length; if (bytes>=1024) res.destroy(); });
              res.on('end',finish);
              res.on('close',finish);
            });
            req.on('timeout',()=>{req.destroy(); resolve({host:parsed.hostname,status:-1,bytes:0,type:'timeout',length:''});});
            req.on('error',()=>resolve({host:parsed.hostname,status:-2,bytes:0,type:'error',length:''}));
            req.end();
          });

          const [trackGroup,bundleGroup,userSnap]=await Promise.all([
            db.collectionGroup('tracks').get(),
            db.collectionGroup('bundles').get(),
            db.collection('users').get(),
          ]);
          const trackDocs=trackGroup.docs.filter(d=>/^suno_tracks\/[^/]+\/tracks\/[^/]+$/.test(d.ref.path));
          const bundleDocs=bundleGroup.docs.filter(d=>/^user_list_caches\/[^/]+\/bundles\/library_latest_10_sets$/.test(d.ref.path));
          const users=new Map(userSnap.docs.map(d=>[d.id,d.data()||{}]));
          const bundles=new Map(bundleDocs.map(d=>[d.ref.parent.parent?.id||'',d.data()||{}]));
          const byUid=new Map();
          for (const d of trackDocs) {
            const uid=d.ref.parent.parent?.id||'';
            const data=d.data()||{};
            const row={id:d.id,data,created:createdMs(data.createdAt)||createdMs(data.updatedAt)||Number(data.createdAtMs||0)||Number(data.updatedAtMs||0)};
            const arr=byUid.get(uid)||[]; arr.push(row); byUid.set(uid,arr);
          }
          let totalBundleMissingLatest=0,totalBundleIdMismatch=0,totalSyncVersionBehind=0;
          const latestProbeCandidates=[];
          for (const [uid,rows] of byUid) {
            rows.sort((a,b)=>b.created-a.created);
            const latest=rows.slice(0,10);
            const bundle=bundles.get(uid)||null;
            const items=Array.isArray(bundle?.items)?bundle.items:[];
            const bundleIds=new Set(items.map(x=>String(x?.id||'')).filter(Boolean));
            const sourceIds=new Set(latest.map(x=>x.id));
            const newest=latest[0];
            const newestInBundle=Boolean(newest && bundleIds.has(newest.id));
            const overlap=[...sourceIds].filter(id=>bundleIds.has(id)).length;
            const remoteVersion=Number(users.get(uid)?.syncVersions?.library||0);
            const bundleVersion=Number(bundle?.updatedAtMs||0);
            if (newest && !newestInBundle) totalBundleMissingLatest++;
            if (items.length && overlap===0) totalBundleIdMismatch++;
            if (bundleVersion>0 && remoteVersion>0 && remoteVersion<bundleVersion) totalSyncVersionBehind++;
            console.log('M005_USER_LIBRARY='+JSON.stringify({
              uidHash:hash(uid),sourceTrackCount:rows.length,latestSourceIdHash:newest?hash(newest.id):null,
              latestSourceCreatedAt:newest?.created?new Date(newest.created).toISOString():null,
              bundlePresent:Boolean(bundle),bundleItemCount:items.length,bundleHasLatest:newestInBundle,
              latest10BundleOverlap:overlap,bundleVersion,remoteLibraryVersion:remoteVersion,
              versionDelta:remoteVersion-bundleVersion,
            }));
            if (newest) latestProbeCandidates.push({uid,id:newest.id,data:newest.data,created:newest.created});
          }
          console.log('M005_LIBRARY_PARITY='+JSON.stringify({sourceTracks:trackDocs.length,libraryBundles:bundleDocs.length,usersWithTracks:byUid.size,bundleMissingLatestUsers:totalBundleMissingLatest,bundleNoOverlapUsers:totalBundleIdMismatch,syncVersionBehindUsers:totalSyncVersionBehind}));

          for (const row of latestProbeCandidates.slice(0,10)) {
            const urls=extractAudioUrls(row.data);
            const results=[];
            for (const url of urls.slice(0,4)) results.push(await probe(url));
            const status=String(row.data.status||row.data.state||row.data.generationStatus||'');
            console.log('M005_LATEST_MEDIA='+JSON.stringify({uidHash:hash(row.uid),trackHash:hash(row.id),createdAt:row.created?new Date(row.created).toISOString():null,status,urlCandidates:urls.length,probes:results}));
          }
          console.log('M005_FIRESTORE_READONLY=PASS');
          NODE

      - name: Read-only Auth and App Check configuration audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          project=os.environ['FIREBASE_PROJECT_ID']; number=os.environ['FIREBASE_PROJECT_NUMBER']; appid=os.environ['FIREBASE_WEB_APP_ID']
          preview=os.environ['PREVIEW_HOST']; main=os.environ['MAIN_HOST']; prod=os.environ['PROD_HOST']
          creds=service_account.Credentials.from_service_account_file(os.environ['GOOGLE_APPLICATION_CREDENTIALS'],scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request()); headers={'Authorization':f'Bearer {creds.token}','X-Goog-User-Project':project,'Accept':'application/json'}
          def get(url):
              try:
                  r=requests.get(url,headers=headers,timeout=20)
                  body=r.json() if 'json' in r.headers.get('content-type','') else {}
                  return r.status_code,body
              except Exception as e:
                  return -1,{'error':type(e).__name__}
          status,body=get(f'https://identitytoolkit.googleapis.com/admin/v2/projects/{project}/config')
          domains=body.get('authorizedDomains',[]) if isinstance(body,dict) else []
          print('M005_AUTH_DOMAINS='+json.dumps({'status':status,'count':len(domains),'preview':preview in domains,'main':main in domains,'prod':prod in domains},ensure_ascii=False))

          app_name=f'projects/{number}/apps/{appid}'
          status,body=get(f'https://firebaseappcheck.googleapis.com/v1/{app_name}/recaptchaEnterpriseConfig')
          print('M005_APPCHECK_WEB_CONFIG='+json.dumps({'status':status,'configured':status==200,'hasSiteKey':bool(body.get('siteKey')) if isinstance(body,dict) else False,'tokenTtl':body.get('tokenTtl') if isinstance(body,dict) else None},ensure_ascii=False))

          status,body=get(f'https://firebaseappcheck.googleapis.com/v1/projects/{number}/services')
          services=[]
          if status==200 and isinstance(body,dict):
              for s in body.get('services',[]):
                  name=str(s.get('name','')).split('/')[-1]
                  if any(x in name for x in ['firestore','identitytoolkit','cloudfunctions']):
                      services.append({'service':name,'enforcementMode':s.get('enforcementMode')})
          print('M005_APPCHECK_SERVICES='+json.dumps({'status':status,'services':services},ensure_ascii=False))

          status,body=get(f'https://recaptchaenterprise.googleapis.com/v1/projects/{project}/locations/global/keys')
          preview_allowed=main_allowed=prod_allowed=None
          matched=False
          if status==200 and isinstance(body,dict):
              for k in body.get('keys',[]):
                  web=k.get('webSettings') or {}
                  allowed=web.get('allowedDomains') or []
                  if allowed:
                      if preview in allowed or main in allowed or prod in allowed:
                          matched=True
                          preview_allowed=preview in allowed; main_allowed=main in allowed; prod_allowed=prod in allowed
          print('M005_RECAPTCHA_DOMAIN_AUDIT='+json.dumps({'status':status,'matchedRelevantKey':matched,'previewAllowed':preview_allowed,'mainAllowed':main_allowed,'prodAllowed':prod_allowed},ensure_ascii=False))
          PY

      - name: Compare Preview and main Library and Firebase source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          for f in src/firebase.js src/pages/SunoLibraryPage.tsx src/lib/listBundleCache.ts .deploy/apply-900-library-session-cache.py .deploy/apply-902-list-bundle-cache.py .deploy/apply-936-library-version-sync-only.py functions/src/index.ts; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              if git diff --quiet origin/main -- "$f"; then echo "M005_SOURCE_COMPARE SAME $f"; else echo "M005_SOURCE_COMPARE DIFFERENT $f"; fi
            else
              echo "M005_SOURCE_COMPARE MAIN_MISSING $f"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/firebase.js').read_text(encoding='utf-8')
          preview='soridraw-music-git-preview-andrawing1212.vercel.app'
          main='soridraw-music.vercel.app'
          print('M005_FIREBASE_SOURCE_HOSTS='+str({'previewLiteral':preview in s,'mainLiteral':main in s,'appCheckConditionMentionsPreview':preview in s[s.find('shouldInitializeAppCheck')-1200:s.find('shouldInitializeAppCheck')+500]}))
          PY

      - name: Verify effective prebuild Library path
        shell: bash
        run: |
          set -euo pipefail
          npm run prebuild
          python3 - <<'PY'
          from pathlib import Path
          lib=Path('src/pages/SunoLibraryPage.tsx').read_text(encoding='utf-8')
          helper=Path('src/lib/listBundleCache.ts').read_text(encoding='utf-8')
          firebase=Path('src/firebase.js').read_text(encoding='utf-8')
          checks={
            'marker900':'SORIDRAW_900_LIBRARY_SESSION_CACHE' in lib,
            'marker902':'SORIDRAW_902_LIST_BUNDLE_CACHE' in lib,
            'marker936':'SORIDRAW_936_LIBRARY_VERSION_SYNC_ONLY' in lib,
            'bundleSubscription':"subscribeListBundle('library'" in lib,
            'versionGate':'shouldVerifyLibraryBundle' in lib,
            'profileEvent':'USER_PROFILE_CACHE_EVENT' in lib,
            'pagedFallback':'startPagedSourceFallback' in lib,
            'sourceQuery':"collection(db, 'suno_tracks', uid, 'tracks')" in lib,
            'remoteVersionPublish':"'syncVersions.library': libraryVersion" in helper,
            'previewAppCheckHost':'soridraw-music-git-preview-andrawing1212.vercel.app' in firebase,
            'mainAppCheckHost':'soridraw-music.vercel.app' in firebase,
          }
          print('M005_EFFECTIVE_BUILD_PATH='+str(checks))
          required=['marker900','marker902','marker936','bundleSubscription','versionGate','profileEvent','pagedFallback','sourceQuery','remoteVersionPublish']
          if not all(checks[x] for x in required): raise SystemExit('M005_EFFECTIVE_LIBRARY_PATH_INCOMPLETE')
          PY

      - name: Preview and main public host response
        shell: bash
        run: |
          set -euo pipefail
          for host in "$PREVIEW_HOST" "$MAIN_HOST"; do
            code=$(curl -L -sS -o /tmp/m005-page -w '%{http_code}' --max-time 20 "https://$host/")
            bytes=$(wc -c </tmp/m005-page | tr -d ' ')
            echo "M005_HOST_RESPONSE host=$host code=$code bytes=$bytes"
            test "$code" = "200"
          done

      - name: Prove approved read-only scope
        run: |
          echo 'M005_NEW_GENERATION=0'
          echo 'M005_MUSIC_API_CREDITS_USED=0'
          echo 'M005_FIRESTORE_WRITES=0'
          echo 'M005_FIRESTORE_DELETES=0'
          echo 'M005_RULES_DEPLOYS=0'
          echo 'M005_FUNCTIONS_DEPLOYS=0'
          echo 'M005_HOSTING_DEPLOYS=0'
          echo 'M005_MAIN_CHANGES=0'
