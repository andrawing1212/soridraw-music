name: TEMP 1002 Console Presence Cleanup

on:
  push:
    branches: [preview-console-presence-cleanup]
    paths:
      - '.github/workflows/temp-1002-console-presence-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: temp-1002-console-presence-cleanup
  cancel-in-progress: false

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: preview-console-presence-cleanup
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic cleanup
        run: python3 .deploy/apply-1002-console-presence-cleanup.py

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'index.html\nsrc/firebase.js\nsrc/pages/SunoLibraryPage.tsx\nsrc/services/presenceService.ts'
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected source files:'
            printf '%s\n' "$changed"
            exit 2
          fi
          ! grep -q 'Shared page browser check:' src/pages/SunoLibraryPage.tsx
          ! grep -q 'token status: available' src/firebase.js
          grep -q '<meta name="mobile-web-app-capable" content="yes" />' index.html
          grep -q 'const DEVICE_HISTORY_SYNC_ENABLED = false;' src/services/presenceService.ts
          test "$(grep -c 'if (DEVICE_HISTORY_SYNC_ENABLED && !devicePresenceDenied)' src/services/presenceService.ts)" = '3'
          echo '[1002] exact source scope and console/presence markers: PASS'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add index.html src/firebase.js src/pages/SunoLibraryPage.tsx src/services/presenceService.ts
          git commit -m 'fix(preview): clean console noise and stop failing optional presence writes'
          git push origin HEAD:preview-console-presence-cleanup
