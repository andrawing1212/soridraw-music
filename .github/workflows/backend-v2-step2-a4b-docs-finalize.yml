name: SORIDRAW Backend V2 Step 2-A4b Docs Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2-a4b-docs-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Update Master Plan
        run: |
          set -euo pipefail
          python3 .deploy/finalize-backend-v2-step2-a4b-docs.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git commit -m 'docs: mark Step 2-A4b complete and Gate A due'
          git push origin HEAD:preview

      - name: Remove temporary finalizer
        run: |
          set -euo pipefail
          git pull --rebase origin preview
          git rm .deploy/finalize-backend-v2-step2-a4b-docs.py .github/workflows/backend-v2-step2-a4b-docs-finalize.yml
          git commit -m 'chore: remove Step 2-A4b docs finalizer'
          git push origin HEAD:preview
