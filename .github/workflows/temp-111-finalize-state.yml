name: TEMP 111 Finalize State

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-111-finalize-state.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Record 111 final state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('DOCS/CURRENT_RELEASE_STATE.md')
          text = p.read_text(encoding='utf-8')
          title = '# SORIDRAW CURRENT RELEASE STATE\n'
          if not text.startswith(title):
              raise SystemExit('unexpected CURRENT_RELEASE_STATE header')
          marker = '> 새 채팅은 이 문서 + 실제 GitHub/Firebase/Cloudflare 상태를 기준으로 이어간다. 문서와 실제 상태가 다르면 실제 상태 우선.\n'
          if marker not in text:
              raise SystemExit('state insertion marker missing')
          old_head = text[:text.index(marker) + len(marker)]
          rest = text[text.index(marker) + len(marker):]
          old_head = old_head.replace('최종 갱신: 2026-09-16 KST — PREVIEW 110 Explore 전체 서버 누수 감사', '최종 갱신: 2026-09-16 KST — PREVIEW 111 공개프로필 invalid-ref 서버 누수 방어 배포/실측 완료')
          section = '''\n\n## 0K. PREVIEW 111 — 공개프로필 invalid-ref 서버 누수 방어 배포/실측 완료\n\n- 사용자 요청으로 PREVIEW 110 Explore 전체 누수 감사에서 발견된 **존재하지 않는 공개프로필 ref 반복 404 → 매 요청 D1R1** abuse gap만 최소 수정했다. 앱 UI/Hosting은 변경하지 않았고 PREVIEW 앱은 **110** 유지.\n- **111 Worker 제품 candidate:** `c81ff2cf5e6aea820b6da45779b7d207f839257c`. 핵심 patch는 `057-public-profile-negative-cache-guard.mjs` + `058-public-profile-negative-cache-shape-compat.mjs`.\n- **PREVIEW Worker Release Run:** `35108113433` SUCCESS. 실제 PREVIEW Explore Worker version은 **`c638d60f-8724-4d4a-bb05-0766d50a8dae`**. 이전 `d8eae38a-09a9-4f37-9500-57f217ee1d8c`에서 승격. TEST/PRODUCTION Worker는 비변경 PASS.\n- 동작: 존재하지 않는 동일 profile ref의 404를 Cloudflare `caches.default`에 **60초 negative cache**로 보관한다. 정상 valid profile의 기존 positive edge cache는 cold-ref 방어 예산보다 먼저 사용한다. 서로 다른 cold invalid ref 난사는 기존 Cloudflare limiter를 독립 key prefix `profile-cold:`로 재사용해 현재 계약상 **client key당 분당 60회**로 bounded 한다.\n- live legacy 404 body `{ok:false,error:"Profile not found"}` 및 `NOT_FOUND` code/Korean equivalent를 negative-cache 대상으로 인식한다. D1 schema/data 변경 없음.\n- **배포 후 실제 감사 Run `35108725305` SUCCESS:** 동일 Cloudflare `SEA` edge에서 같은 invalid ref 5회 연속: `R1/W0 MISS → R0/W0 HIT → R0/W0 HIT → R0/W0 HIT → R0/W0 HIT`. 따라서 일반적인 동일 사용자의 반복 새로고침은 첫 판정 뒤 TTL 동안 D1로 재진입하지 않는다.\n- 같은 live 감사에서 **latest Feed warm R0/W0 / popular Feed warm R0/W0 / 정상 public-profile warm R0/W0 / latest revision warm R0/W0 / popular revision warm R0/W0** 모두 PASS. 사용자 데이터 write 0.\n- **Cloudflare edge 특성:** Cache API negative entry는 POP/colo 지역 캐시다. 다른 edge가 같은 invalid ref를 처음 받으면 그 edge에서 최초 D1R1이 생길 수 있다. 이를 전세계 단일 negative store처럼 해석하지 않는다. 무작위 unique ref는 limiter로 별도 bounded 한다.\n- 1분 event-driven like aggregate 유지, fixed cron 0. Firebase Functions/Firestore Rules/RTDB Rules 변경 없음. D1 migration/backfill 없음. 사용자 원본 데이터 변경 없음. UI/CSS 변경 없음.\n- 표준 PREVIEW Worker release gate에서 이미 삭제된 과거 display-overlay 구조를 요구하던 stale verifier 호출을 현재 111 계약에 맞게 정리했다. 제품 기능 수정이 아니라 릴리스 검사기 유지보수다.\n- 111 작업용 임시 prepare/audit/tooling/postdeploy workflow는 최종 실측 후 모두 삭제했다. formal Work 독립 감사는 미실행; 자동 계약검사 + 실제 PREVIEW 배포 smoke + live cost audit PASS.\n- **판정:** 이번에 감사한 Explore 추천/최신/인기/revision/정상 공개프로필 warm + 동일 invalid-ref 반복 누수 경로는 PASS. TEST 승격은 사용자의 명시적 `테스트배포` 승인 전 금지.\n'''
          p.write_text(old_head + section + rest, encoding='utf-8')

          Path('DOCS/NEXT_CODEX_TASK.md').write_text('''# SORIDRAW NEXT CODEX TASK\n\n최종 갱신: 2026-09-16 KST — PREVIEW 111 Explore 누수 방어 완료\n\n## 현재 기준\n\n- branch: `preview`\n- PREVIEW app: **110**, `https://preview.soridraw.com`\n- 110 product commit: `4723fe9450869dd80b0e684309681535a8512dcd`\n- PREVIEW Explore Worker product candidate: `c81ff2cf5e6aea820b6da45779b7d207f839257c`\n- PREVIEW Explore Worker live version: `c638d60f-8724-4d4a-bb05-0766d50a8dae`\n- Worker release Run: `35108113433` SUCCESS\n- postdeploy live leak audit Run: `35108725305` SUCCESS\n- TEST/PRODUCTION: 비변경\n\n## Explore 111 최종 비용 판정\n\nPASS:\n- 추천/최신 정상 첫 페이지 및 warm: R2/edge 경로, warm D1 R0/W0.\n- 인기 warm: D1 R0/W0.\n- Feed revision latest/popular warm: D1 R0/W0.\n- 정상 공개프로필 warm: D1 R0/W0.\n- 동일 invalid 공개프로필 ref 반복: 같은 edge에서 최초 R1/W0 뒤 60초 negative-cache HIT로 R0/W0. 실제 SEA edge 5회 `R1 → R0 → R0 → R0 → R0` 검증.\n- unique cold invalid ref: 기존 Cloudflare limiter의 독립 `profile-cold:` key로 client key당 분당 60회 bounded.\n- 좋아요: 1분 event-driven 유지, idle fixed cron 0.\n- 사용자 데이터 write 0, D1 schema/migration/backfill 0.\n\n주의:\n- negative cache는 Cloudflare POP/colo별 edge cache다. 다른 POP의 최초 invalid-ref 요청은 그 POP에서 D1R1이 발생할 수 있다. 전역 단일 negative cache가 아니다.\n- PREVIEW 앱은 110 그대로이며 111은 Worker-only 비용 방어 수정이다.\n- 103 Durable Object migration v1 유지. pre-103 Worker 직접 rollback 금지; rollback 필요 시 migration을 유지한 forward-compatible build 사용.\n\n## 다음 작업\n\n- 현재 111 Explore 누수 방어 작업은 완료. 새 기능/버그 요청이 없으면 추가 서버 수정하지 않는다.\n- 사용자가 `테스트배포`를 명확히 승인하면, 현재 검증된 PREVIEW 전체본을 main/TEST로 승격하는 릴리스 절차를 수행한다. 사용자 데이터는 이동/복제하지 않는다.\n- TEST 승격 전 현재 preview HEAD와 문서/실제 Worker version을 다시 고정 확인하고 TypeScript/Build/필요 회귀검사를 통과시킨다.\n- PRODUCTION은 별도 명확한 정식배포 승인 전 절대 변경하지 않는다.\n''', encoding='utf-8')
          PY
          git diff --check
          git config user.name soridraw-release-bot
          git config user.email actions@users.noreply.github.com
          git add DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md
          git commit -m 'docs: record PREVIEW 111 leak guard release'
          git push origin HEAD:preview
          echo "FINAL_STATE_SHA=$(git rev-parse HEAD)"
