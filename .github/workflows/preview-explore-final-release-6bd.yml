name: SORIDRAW PREVIEW Explore Final Release 6bd

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/preview-explore-final-release-6bd.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-preview-explore-final-6bd
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: 6bd01324493c7c3d048aed825c5b8604f755d2cf
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
      PREVIEW_RATE_D1_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com

    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: 6bd01324493c7c3d048aed825c5b8604f755d2cf
          fetch-depth: 0

      - name: Lock protected refs and sites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main production --no-tags
          git rev-parse origin/main > "$RUNNER_TEMP/main-before.sha"
          git rev-parse origin/production > "$RUNNER_TEMP/production-before.sha"
          for host in test.soridraw.com soridraw.com; do
            curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://$host/?protect=before" -o "$RUNNER_TEMP/${host}.before.html"
            sha256sum "$RUNNER_TEMP/${host}.before.html" | awk '{print $1}' > "$RUNNER_TEMP/${host}.before.sha"
          done
          test "$(node -p "require('./public/app-version.json').version")" = '052'
          echo 'TARGET_AND_PROTECTED_BASELINES=PASS'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Validate app target
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npx tsc --noEmit
          node scripts/verify-033-explore-feed-revision.mjs
          node scripts/verify-045-explore-active-revalidation.mjs
          node scripts/verify-048-explore-public-profile-parity.mjs
          node scripts/verify-049-explore-feed-integrity.mjs
          node scripts/verify-051-explore-shared-canonical-data.mjs
          node scripts/verify-explore-cache-mutations.mjs
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/preview-index.sha"
          echo 'APP_TARGET_VERIFY=PASS'

      - name: Set up Node 22 for Worker
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify live D1 readiness without writes
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/preflight-wrangler.jsonc" <<JSON
          {"name":"$PREVIEW_WORKER","main":"./worker.js","compatibility_date":"2026-09-09","d1_databases":[{"binding":"DB","database_name":"soridraw-explore-db","database_id":"$SHARED_D1_ID"}]}
          JSON
          cp placeholder.js "$RUNNER_TEMP/worker.js"
          npx wrangler d1 execute DB --remote --config "$RUNNER_TEMP/preflight-wrangler.jsonc" --command "SELECT seeded,seq,(SELECT COUNT(*) FROM explore_derived_tracks) AS tracks,(SELECT COUNT(*) FROM explore_derived_profiles) AS profiles FROM explore_derived_state WHERE id=1;" --json > "$RUNNER_TEMP/d1-ready.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/d1-ready.json'),r=x?.[0]?.results?.[0];if(!r||r.seeded!==1||r.tracks!==35||r.profiles!==3)throw Error(JSON.stringify(r));console.log('D1_READY='+JSON.stringify(r))"
          echo 'LIVE_D1_READY_READONLY=PASS'

      - name: Prepare exact current PREVIEW Worker and bindings
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .remote-worker && mkdir -p .remote-worker
          node <<'NODE'
          const fs=require('fs'),account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,h={Authorization:`Bearer ${token}`,Accept:'application/json'};
          async function get(url){const r=await fetch(url,{headers:h});const t=await r.text();let x;try{x=JSON.parse(t)}catch{throw Error(`Cloudflare ${r.status}: ${t.slice(0,800)}`)}if(!r.ok||x.success===false)throw Error(`Cloudflare ${r.status}: ${t.slice(0,1000)}`);return x.result??x}
          async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`),d=(p.deployments||p||[])[0],v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];if(!v?.version_id||Number(v.percentage||0)<99.99)throw Error('No single active version '+name);return String(v.version_id)}
          (async()=>{const preview=await active(process.env.PREVIEW_WORKER),test=await active(process.env.TEST_WORKER),prod=await active(process.env.PRODUCTION_WORKER);for(const [n,v] of [['preview',preview],['test',test],['prod',prod]])fs.writeFileSync(`.remote-worker/${n}-before.txt`,v);const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${process.env.PREVIEW_WORKER}/versions/${preview}?include=modules`),mods=ver.modules||[],m=mods.find(x=>x.name===(ver.main_module||mods[0]?.name))||mods[0],source=Buffer.from(m?.content_base64||'','base64').toString('utf8');if(source.length<5000||!source.includes('exploreCacheBucket031'))throw Error('PREVIEW 031 prerequisite missing');fs.writeFileSync('.remote-worker/original.js',source);fs.writeFileSync('.remote-worker/worker.js',source);const s=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${process.env.PREVIEW_WORKER}/settings`),b=s.bindings||[],id=x=>String(x?.id||x?.database_id||x?.uuid||''),db=b.find(x=>x.type==='d1'&&x.name==='DB'),rate=b.find(x=>x.type==='d1'&&x.name==='RATE_DB');if(id(db)!==process.env.SHARED_D1_ID)throw Error('DB binding mismatch');if(id(rate)!==process.env.PREVIEW_RATE_D1_ID)throw Error('RATE_DB binding mismatch');const r2=b.filter(x=>x.type==='r2_bucket').map(x=>({binding:x.name,bucket_name:String(x.bucket_name||x.bucket||'')}));for(const name of ['PROFILE_MEDIA','EXPLORE_CACHE'])if(!r2.some(x=>x.binding===name&&x.bucket_name))throw Error('Missing R2 '+name);const cfg={name:process.env.PREVIEW_WORKER,main:'./worker.js',compatibility_date:String(s.compatibility_date||'2026-09-09').slice(0,10),workers_dev:true,keep_vars:true,d1_databases:[{binding:'DB',database_name:'soridraw-explore-db',database_id:process.env.SHARED_D1_ID},{binding:'RATE_DB',database_name:'soridraw-explore-preview-db',database_id:process.env.PREVIEW_RATE_D1_ID}],r2_buckets:r2,observability:s.observability&&typeof s.observability==='object'?{enabled:s.observability.enabled!==false,...(typeof s.observability.head_sampling_rate==='number'?{head_sampling_rate:s.observability.head_sampling_rate}:{})}:{enabled:true}};if(Array.isArray(s.compatibility_flags)&&s.compatibility_flags.length)cfg.compatibility_flags=s.compatibility_flags;fs.writeFileSync('.remote-worker/wrangler.jsonc',JSON.stringify(cfg,null,2));console.log('PREVIEW_BINDINGS_EXACT=PASS');console.log('WORKERS_BEFORE='+JSON.stringify({preview,test,prod}))})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Generate and verify target 032 Worker
        shell: bash
        run: |
          set -euo pipefail
          export SORIDRAW_REMOTE_WORKER_DIR="$PWD/cloudflare/explore-worker/.remote-worker"
          node cloudflare/explore-worker/patches/031-explore-shared-canonical-data.mjs
          node cloudflare/explore-worker/patches/032-derived-change-cache.mjs
          node --check cloudflare/explore-worker/.remote-worker/worker.js
          grep -Fq "'Cache-Control': 'public,max-age=10'" cloudflare/explore-worker/runtime/derived-cache.js
          ! grep -Fq 'max-age=0' cloudflare/explore-worker/runtime/derived-cache.js
          grep -Fq 'explore_derived_changes' cloudflare/explore-worker/.remote-worker/worker.js
          grep -Fq 'Explore derived state must be seeded before enabling runtime' cloudflare/explore-worker/.remote-worker/worker.js
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/.remote-worker/worker.js" node scripts/verify-explore-derived-cache.mjs
          node scripts/verify-explore-deploy-preflight.mjs
          echo 'GENERATED_TARGET_032=PASS'

      - name: Deploy PREVIEW Worker with mandatory preflight and live zero-read smoke
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          rollback(){ status=$?; if [ "$status" -ne 0 ] && [ "$deployed" = 1 ]; then echo "PREVIEW_WORKER_ROLLBACK_STATUS=$status"; cp .remote-worker/original.js .remote-worker/worker.js; node scripts/derived-deploy-preflight.mjs --config .remote-worker/wrangler.jsonc || true; echo 'PREVIEW_WORKER_ROLLBACK=ATTEMPTED'; fi; exit "$status"; }
          trap rollback EXIT
          node scripts/derived-deploy-preflight.mjs --config .remote-worker/wrangler.jsonc
          deployed=1
          sleep 5
          feed_code="$(curl -sS -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=latest&limit=5")"; test "$feed_code" = 200
          owner="$(node -e "const p=require(process.env.RUNNER_TEMP+'/feed.json'),x=p?.data?.items?.[0]||{};process.stdout.write(String(x.ownerUid||x.owner_uid||''))")"; test -n "$owner"
          profile_code="$(curl -sS -o "$RUNNER_TEMP/profile.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/profiles/${owner}/first-view?limit=50")"; test "$profile_code" = 200
          for n in 1 2; do code="$(curl -sS -D "$RUNNER_TEMP/rev-${n}.head" -o "$RUNNER_TEMP/rev-${n}.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed-revision?sort=latest")"; test "$code" = 200; echo "REVISION_${n}_D1_HEADERS"; grep -i '^x-soridraw-d1-' "$RUNNER_TEMP/rev-${n}.head" || true; done
          read2="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r","");print $2}' "$RUNNER_TEMP/rev-2.head"|tail -1)"; write2="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r","");print $2}' "$RUNNER_TEMP/rev-2.head"|tail -1)"; echo "REVISION_2_ROWS_READ=$read2 ROWS_WRITTEN=$write2"; test "$read2" = 0; test "$write2" = 0
          node <<'NODE'
          const fs=require('fs'),account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,h={Authorization:`Bearer ${token}`,Accept:'application/json'};async function get(url){const r=await fetch(url,{headers:h}),x=await r.json();if(!r.ok||x.success===false)throw Error(JSON.stringify(x).slice(0,800));return x.result??x}async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`),d=(p.deployments||p||[])[0],v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];return String(v?.version_id||'')}(async()=>{const preview=await active(process.env.PREVIEW_WORKER),test=await active(process.env.TEST_WORKER),prod=await active(process.env.PRODUCTION_WORKER);if(!preview||preview===fs.readFileSync('.remote-worker/preview-before.txt','utf8').trim())throw Error('PREVIEW Worker unchanged');if(test!==fs.readFileSync('.remote-worker/test-before.txt','utf8').trim())throw Error('TEST Worker changed');if(prod!==fs.readFileSync('.remote-worker/prod-before.txt','utf8').trim())throw Error('PRODUCTION Worker changed');const v=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${process.env.PREVIEW_WORKER}/versions/${preview}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0],source=Buffer.from(m?.content_base64||'','base64').toString('utf8');if(!source.includes('explore_derived_changes')||!source.includes('Explore derived state must be seeded before enabling runtime'))throw Error('Deployed 032 runtime missing');console.log('PREVIEW_WORKER_AFTER='+preview);console.log('TEST_PRODUCTION_WORKERS_UNCHANGED=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          trap - EXIT
          echo 'PREVIEW_WORKER_LIVE_ZERO_READ=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_HOSTING_DEPLOY=PASS'

      - name: Verify PREVIEW exact build and protected environments
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/preview-index.sha")"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''; for attempt in $(seq 1 15); do if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${url}?final6bd=${attempt}" -o "$RUNNER_TEMP/live.html"; then actual="$(sha256sum "$RUNNER_TEMP/live.html"|awk '{print $1}')"; if [ "$actual" = "$expected" ]; then ok=yes; break; fi; fi; sleep 8; done; test "$ok" = yes; echo "PREVIEW_EXACT_BUILD=$url"; done
          version="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' 'https://preview.soridraw.com/app-version.json?final6bd=1' | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"; test "$version" = 052
          for host in test.soridraw.com soridraw.com; do curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://$host/?protect=after" -o "$RUNNER_TEMP/${host}.after.html"; sha256sum "$RUNNER_TEMP/${host}.after.html"|awk '{print $1}' > "$RUNNER_TEMP/${host}.after.sha"; cmp "$RUNNER_TEMP/${host}.before.sha" "$RUNNER_TEMP/${host}.after.sha"; done
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          echo 'PREVIEW_APP_VERSION=052'
          echo 'TEST_PRODUCTION_HOSTING_AND_REFS_UNCHANGED=PASS'
          echo 'PREVIEW_RELEASE_FINAL_6BD=PASS'
