name: Full PREVIEW production release candidate (offline assembly)
on:
  push:
    branches: [prep/full-preview-production-parity]
    paths:
      - 'scripts/build-full-production-release-candidate.mjs'
      - 'scripts/verify-full-production-notification-host.mjs'
      - 'src/services/notifications/notificationPreviewHost022.ts'
      - 'src/services/notifications/notificationInbox004.ts'
      - '.github/workflows/full-production-release-source-parity.yml'
permissions:
  contents: read
jobs:
  compare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble exact existing code and verify imports (no cloud writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-vm-modules scripts/build-full-production-release-candidate.mjs
      - run: npm ci --no-audit --no-fund
      - run: node scripts/verify-full-production-notification-host.mjs
      - run: npm run lint
