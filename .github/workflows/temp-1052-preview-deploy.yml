name: Temp 1052 Preview Deploy

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1052-preview-deploy.yml']

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_RUNTIME_COMMIT: ebf4533088176368ff05173f146fefcfaefeadf3
      EXPECTED_BASELINE_HEAD: 53bd4b348f49cf3dedfa8bc7c2384459acb2fff5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 40

      - name: Guard latest runtime
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_RUNTIME_COMMIT" HEAD
          git merge-base --is-ancestor "$EXPECTED_BASELINE_HEAD" HEAD
          git diff --exit-code "$EXPECTED_BASELINE_HEAD"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json functions cloudflare firestore.rules
          grep -q 'SORIDRAW_LIBRARY_FULL_CATALOG_AUTHORITY_1051' src/pages/SunoLibraryPage.tsx
          grep -q 'UI pagination only' src/pages/SunoLibraryPage.tsx
          ! grep -q 'bootstrapCachelessLibraryFromServerOnce' src/pages/SunoLibraryPage.tsx
          ! grep -q 'WORKSPACE_SERVER_PAGE_SIZE' src/pages/SunoLibraryPage.tsx
          ! grep -q 'WORKSPACE_SERVER_FETCH_SIZE' src/pages/SunoLibraryPage.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: TypeScript and app build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
          test -s dist/index.html
          echo '1052_APP_BUILD=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Functions build and Library regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle
          echo '1052_FUNCTIONS_LIBRARY_TESTS=PASS'

      - name: Verify existing Catalog Worker health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 30 https://soridraw-media-preview.andrawing1212.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"catalogSchemaVersion":4'
          echo '1052_WORKER_HEALTH=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production before deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Firebase PREVIEW Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo '1052_FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact deployed preview build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok=yes
                  echo "1052_EXACT_BUILD_PASS=$url"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo '1052_PRODUCTION_UNCHANGED=PASS'
