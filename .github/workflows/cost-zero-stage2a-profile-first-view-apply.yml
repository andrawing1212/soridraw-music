name: Cost Zero Stage 2A Profile First View Apply

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-cost-zero-stage2a-profile-first-view.py'
      - '.github/workflows/cost-zero-stage2a-profile-first-view-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Stage 2A source patch
        run: python .deploy/apply-cost-zero-stage2a-profile-first-view.py

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Validate Worker patch against exact live source without deploy
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          npm install --no-audit --no-fund --package-lock=false
          npm run cf:prepare
          node --check .remote-worker/worker.js
          grep -n "SORIDRAW_COST_ZERO_PROFILE_FIRST_VIEW_003" .remote-worker/worker.js
          grep -n "handlePublicProfileFirstViewSnapshot" .remote-worker/worker.js | head -n 20
          echo 'WORKER_SOURCE_VALIDATED=true'
          echo 'WORKER_DEPLOYED=false'
          echo 'D1_MIGRATION_APPLIED=false'

      - name: Verify bounded source scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          rm -f cloudflare/explore-worker/package-lock.json
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
            'src/services/exploreProfileFirstViewService.ts',
            'src/pages/ExplorePage.tsx',
            'cloudflare/explore/migrations/009_cost_zero_profile_first_view.sql',
            'cloudflare/explore-worker/patches/003-cost-zero-profile-first-view.mjs',
          }
          lines = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) >= 4}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected Stage 2A files: {unexpected}')
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f'Missing expected Stage 2A files: {missing}')
          print('STAGE2A_SCOPE_OK=true')
          PY

      - name: Commit verified Stage 2A source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/services/exploreProfileFirstViewService.ts src/pages/ExplorePage.tsx cloudflare/explore/migrations/009_cost_zero_profile_first_view.sql cloudflare/explore-worker/patches/003-cost-zero-profile-first-view.mjs
          git commit -m 'feat(preview): add cached public profile first-view snapshot path'
          git push origin HEAD:preview
