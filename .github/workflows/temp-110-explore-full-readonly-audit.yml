name: TEMP 110 Explore Full Readonly Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-110-explore-full-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - name: Inspect valid and invalid profile request cost
        shell: bash
        run: |
          set -euo pipefail
          owner='rcZ2GZrBndOZzT8C635eiNBjYIJ2'
          for n in 1 2; do
            code="$(curl -sS -D "$RUNNER_TEMP/v-${n}.head" -o /dev/null -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/profiles/${owner}/first-view?limit=50")"
            echo "VALID_${n}=HTTP${code}"
            grep -i '^x-soridraw-' "$RUNNER_TEMP/v-${n}.head" || true
          done
          bad='__soridraw_nonexistent_profile_110_audit__'
          for n in 1 2 3; do
            code="$(curl -sS -D "$RUNNER_TEMP/b-${n}.head" -o /dev/null -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/profiles/${bad}/first-view?limit=50")"
            echo "INVALID_${n}=HTTP${code}"
            grep -i '^x-soridraw-' "$RUNNER_TEMP/b-${n}.head" || true
          done
