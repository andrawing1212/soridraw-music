name: SORIDRAW M-005 Target SignBlob Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m005-target-signblob-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout preview
        uses: actions/checkout@v7
        with:
          ref: preview

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Authenticate cross-project diagnostic session
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install existing Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Test IAM signBlob target-project Firebase custom token
        working-directory: functions
        env:
          FIREBASE_PROJECT_ID: soridraw-app-866a5
          FIREBASE_API_KEY: AIzaSyB_XyRUffNmJ5iugtvqx_3yY-rLi6PaumA
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin=require('firebase-admin');
          const project=process.env.FIREBASE_PROJECT_ID;
          const clean=(v)=>String(v||'').replace(/eyJ[A-Za-z0-9._-]+/g,'[REDACTED_TOKEN]').replace(/AIza[A-Za-z0-9_-]+/g,'[REDACTED_API_KEY]').slice(0,300);
          const b64url=(buf)=>Buffer.from(buf).toString('base64url');
          (async()=>{
            const {GoogleAuth}=require('google-auth-library');
            const auth=new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient(); const t=await client.getAccessToken(); const access=t.token;
            const list=await fetch(`https://iam.googleapis.com/v1/projects/${project}/serviceAccounts?pageSize=100`,{headers:{authorization:`Bearer ${access}`,'x-goog-user-project':project}}); const lb=await list.json();
            if(!list.ok) throw new Error('service account list failed: '+clean(lb?.error?.message));
            const candidates=(lb.accounts||[]).map(x=>x.email).filter(x=>/firebase-adminsdk|appspot|compute@developer/.test(x));
            console.log('M005_SIGNBLOB_CANDIDATES='+candidates.length);
            if(!admin.apps.length) admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:project});
            const snap=await admin.firestore().collectionGroup('tracks').limit(100).get();
            const owner=snap.docs.map(d=>({d,data:d.data()||{},uid:d.ref.parent.parent?.id||''})).find(x=>x.uid&&x.data.taskId);
            if(!owner) throw new Error('no owner candidate');
            const now=Math.floor(Date.now()/1000); const aud='https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit';
            for(const email of candidates){
              const kind=email.includes('firebase-adminsdk')?'firebase-adminsdk':email.includes('appspot')?'appspot':'compute';
              const header=b64url(JSON.stringify({alg:'RS256',typ:'JWT'}));
              const payload=b64url(JSON.stringify({iss:email,sub:email,aud,iat:now,exp:now+3600,uid:owner.uid}));
              const unsigned=`${header}.${payload}`;
              try{
                const s=await fetch(`https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${encodeURIComponent(email)}:signBlob`,{method:'POST',headers:{authorization:`Bearer ${access}`,'content-type':'application/json','x-goog-user-project':project},body:JSON.stringify({payload:Buffer.from(unsigned).toString('base64')})});
                const sb=await s.json().catch(()=>({}));
                console.log('M005_SIGNBLOB_ATTEMPT='+JSON.stringify({kind,http:s.status,error:clean(sb?.error?.message)}));
                if(!s.ok||!sb.signedBlob) continue;
                const jwt=`${unsigned}.${Buffer.from(sb.signedBlob,'base64').toString('base64url')}`;
                const ex=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(process.env.FIREBASE_API_KEY)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:jwt,returnSecureToken:true})});
                const eb=await ex.json().catch(()=>({}));
                console.log('M005_SIGNBLOB_EXCHANGE='+JSON.stringify({kind,http:ex.status,success:Boolean(ex.ok&&eb.idToken),error:clean(eb?.error?.message)}));
                if(ex.ok&&eb.idToken){ console.log('M005_SIGNBLOB_AUTH_PATH=PASS'); return; }
              }catch(e){console.log('M005_SIGNBLOB_EXCEPTION='+JSON.stringify({kind,message:clean(e?.message||e)}));}
            }
            console.log('M005_SIGNBLOB_AUTH_PATH=UNAVAILABLE');
          })().catch(e=>{console.error('M005_SIGNBLOB_DIAGNOSTIC_ERROR='+clean(e?.message||e));process.exit(1)});
          NODE

      - name: Scope proof
        if: always()
        run: |
          echo 'M005_DIAGNOSTIC_ONLY=YES'
          echo 'M005_CONFIG_CHANGES=0'
          echo 'M005_FIRESTORE_WRITES=0'
          echo 'M005_FUNCTION_DEPLOYS=0'
          echo 'M005_RULES_DEPLOYS=0'
          echo 'M005_HOSTING_DEPLOYS=0'
          echo 'M005_MAIN_CHANGES=0'
