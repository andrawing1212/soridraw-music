name: Firebase Hosting Migration Phase 3 Auth Boundary

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/firebase-hosting-migration-phase3-auth.yml'
      - '.deploy/check-firebase-hosting-migration-phase3.mjs'
      - 'src/firebase.js'
      - 'firebase.hosting-only.json'

permissions:
  contents: read

concurrency:
  group: firebase-hosting-migration-phase3-auth
  cancel-in-progress: true

jobs:
  auth-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      BACKEND_PROJECT: soridraw-app-866a5
      APP_CHECK_SITE_KEY: 6Le6bGEtAAAAAOVROhuXew0lxJcpVNVwPZN0ZWKO

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Re-run Phase 1 boundary check
        run: node .deploy/check-firebase-hosting-migration-phase1.mjs

      - name: Re-run Phase 2 boundary check
        run: node .deploy/check-firebase-hosting-migration-phase2.mjs

      - name: Verify Phase 3 boundary
        run: node .deploy/check-firebase-hosting-migration-phase3.mjs

      - name: Build current preview app
        run: npm run build

      - name: Type check built workspace
        run: npx tsc --noEmit

      - name: Authenticate Firebase CLI with existing service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Mint direct Google OAuth token without IAM Credentials API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const credentialPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          if (!credentialPath) throw new Error('GOOGLE_APPLICATION_CREDENTIALS is missing');
          const serviceAccount = JSON.parse(fs.readFileSync(credentialPath, 'utf8'));
          if (!serviceAccount.client_email || !serviceAccount.private_key) {
            throw new Error('Service account JSON is missing client_email/private_key');
          }

          const base64url = (input) => Buffer.from(input).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = base64url(JSON.stringify({
            iss: serviceAccount.client_email,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          }));
          const unsigned = `${header}.${payload}`;
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), serviceAccount.private_key).toString('base64url');
          const assertion = `${unsigned}.${signature}`;

          (async () => {
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion,
              }),
            });
            const body = await response.json();
            if (!response.ok || !body.access_token) {
              throw new Error(`OAuth token exchange failed: HTTP ${response.status} ${JSON.stringify(body)}`);
            }
            console.log(`::add-mask::${body.access_token}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `ACCESS_TOKEN=${body.access_token}\n`);
            console.log('[Phase 3] Direct service-account OAuth token: PASS');
          })().catch((error) => {
            console.error(error?.message || error);
            process.exit(1);
          });
          NODE

      - name: Snapshot official Firebase Hosting before Phase 3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"

      - name: Deploy rebuilt app to existing Firebase Canary channel only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest hosting:channel:deploy phase2-preview \
            --project soridraw \
            --config firebase.hosting-only.json \
            --expires 7d \
            --json | tee "$RUNNER_TEMP/phase3-canary-deploy.json"

          canary_url="$(grep -oE 'https://[^"[:space:]]+\.web\.app' "$RUNNER_TEMP/phase3-canary-deploy.json" | head -n 1 || true)"
          test -n "$canary_url" || { echo 'Could not extract Firebase Hosting Canary URL'; exit 3; }
          canary_host="${canary_url#https://}"
          canary_host="${canary_host%/}"
          echo "$canary_host" | grep -Eq '^soridraw--phase2-preview-[a-z0-9]+\.web\.app$' || {
            echo "Unexpected Canary hostname: $canary_host"; exit 4;
          }
          echo "CANARY_URL=$canary_url" >> "$GITHUB_ENV"
          echo "CANARY_HOST=$canary_host" >> "$GITHUB_ENV"
          echo "[Phase 3] Canary host: $canary_host"

      - name: Read Firebase Auth authorized domains
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCESS_TOKEN"
          curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/soridraw-app-866a5/config" \
            -o "$RUNNER_TEMP/auth-config-before.json"

          python3 - "$RUNNER_TEMP/auth-config-before.json" "$RUNNER_TEMP/auth-authorized-domains-patch.json" "$CANARY_HOST" <<'PY'
          import json, sys
          source, target, host = sys.argv[1:4]
          data = json.load(open(source, encoding='utf-8'))
          domains = list(dict.fromkeys([str(v).strip() for v in data.get('authorizedDomains', []) if str(v).strip()]))
          if host not in domains:
              domains.append(host)
          with open(target, 'w', encoding='utf-8') as f:
              json.dump({'authorizedDomains': domains}, f, ensure_ascii=False)
          print(f'[Phase 3] Auth authorizedDomains count: {len(domains)}; canary_present={host in domains}')
          PY

      - name: Add Canary to Firebase Auth authorized domains
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/auth-authorized-domains-patch.json" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/soridraw-app-866a5/config?updateMask=authorizedDomains" \
            -o "$RUNNER_TEMP/auth-config-after.json"

          python3 - "$RUNNER_TEMP/auth-config-after.json" "$CANARY_HOST" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          host = sys.argv[2]
          domains = data.get('authorizedDomains', [])
          if host not in domains:
              raise SystemExit(f'Canary host missing from Firebase Auth authorizedDomains: {host}')
          print('[Phase 3] Firebase Auth Canary domain: PASS')
          PY

      - name: Read reCAPTCHA Enterprise App Check domain policy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://recaptchaenterprise.googleapis.com/v1/projects/soridraw-app-866a5/keys/$APP_CHECK_SITE_KEY" \
            -o "$RUNNER_TEMP/recaptcha-key-before.json"

          python3 - "$RUNNER_TEMP/recaptcha-key-before.json" "$RUNNER_TEMP/recaptcha-domain-patch.json" "$CANARY_HOST" <<'PY'
          import json, sys
          source, target, host = sys.argv[1:4]
          data = json.load(open(source, encoding='utf-8'))
          web = data.get('webSettings') or {}
          if web.get('allowAllDomains') is True:
              open(target, 'w', encoding='utf-8').write('')
              print('[Phase 3] reCAPTCHA key allows all domains; no patch needed.')
              raise SystemExit(0)
          domains = list(dict.fromkeys([str(v).strip() for v in web.get('allowedDomains', []) if str(v).strip()]))
          if host not in domains:
              domains.append(host)
          patch = {
              'name': data.get('name'),
              'webSettings': {'allowedDomains': domains},
          }
          with open(target, 'w', encoding='utf-8') as f:
              json.dump(patch, f, ensure_ascii=False)
          print(f'[Phase 3] reCAPTCHA allowedDomains count: {len(domains)}; canary_present={host in domains}')
          PY

      - name: Add Canary to reCAPTCHA Enterprise allowed domains when required
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/recaptcha-domain-patch.json" ]; then
            echo '[Phase 3] reCAPTCHA domain patch skipped because allowAllDomains=true.'
            exit 0
          fi

          curl -fsS -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/recaptcha-domain-patch.json" \
            "https://recaptchaenterprise.googleapis.com/v1/projects/soridraw-app-866a5/keys/$APP_CHECK_SITE_KEY?updateMask=webSettings.allowedDomains" \
            -o "$RUNNER_TEMP/recaptcha-key-after.json"

          python3 - "$RUNNER_TEMP/recaptcha-key-after.json" "$CANARY_HOST" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          host = sys.argv[2]
          web = data.get('webSettings') or {}
          if web.get('allowAllDomains') is not True and host not in web.get('allowedDomains', []):
              raise SystemExit(f'Canary host missing from reCAPTCHA allowedDomains: {host}')
          print('[Phase 3] reCAPTCHA Enterprise Canary domain: PASS')
          PY

      - name: Smoke test rebuilt Firebase Canary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$CANARY_URL/" -o "$RUNNER_TEMP/canary-index.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/canary-index.html"
          echo '[Phase 3] Firebase Canary root: PASS'

      - name: Verify Firebase Auth handler remains on existing backend project
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o "$RUNNER_TEMP/auth-handler.html" -w '%{http_code}' --max-time 30 \
            'https://soridraw-app-866a5.firebaseapp.com/__/auth/handler')"
          test "$status" = '200' || { echo "Auth handler HTTP $status"; exit 5; }
          echo '[Phase 3] Existing backend Auth handler reachable: PASS'

      - name: Verify official Firebase Hosting stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          cmp "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '[Phase 3] Official Firebase Hosting unchanged.'

      - name: Phase 3 result
        run: |
          echo 'Phase 3 Auth boundary repair passed.'
          echo "Canary URL: $CANARY_URL"
          echo "Authorized Firebase Auth/App Check host: $CANARY_HOST"
          echo 'Existing backend remains soridraw-app-866a5.'
          echo 'No live Hosting release, Functions deploy, Firestore/Database Rules update, or user-data migration was performed.'
