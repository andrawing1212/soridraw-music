name: SORIDRAW app288 RTDB Ack Version Audit

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app288-rtdb-ack-audit.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-app288-rtdb-ack-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e a79b8fe53eb56e59a22ba23a2532a7967f54d6ee^{commit}
          allowed='^(src/App\.tsx|public/app-version\.json|scripts/verify-287-save-live-sync\.mjs|scripts/verify-288-rtdb-ack-version-domain\.mjs|\.github/workflows/temp-288-rtdb-ack-audit\.yml|\.deploy/app288-rtdb-ack-audit\.trigger)$'
          unexpected="$(git diff --name-only a79b8fe53eb56e59a22ba23a2532a7967f54d6ee..HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected app288 files:"; echo "$unexpected"; exit 1; }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Focused regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-277-music-note-sync-cost.mjs
          node scripts/verify-278-music-note-cross-device.mjs
          node scripts/verify-279-legacy-recent-heart.mjs
          node scripts/verify-280-music-note-resurrection.mjs
          node scripts/verify-281-suno-url-cross-device.mjs
          node scripts/verify-282-title-cross-device.mjs
          node scripts/verify-283-legacy-recent-heart.mjs
          node scripts/verify-284-recent-heart-linked-authority.mjs
          node scripts/verify-285-save-unsave-same-identity.mjs
          npx tsx scripts/verify-286-heart-direction-authority.ts
          node scripts/verify-287-save-live-sync.mjs
          node scripts/verify-288-rtdb-ack-version-domain.mjs
          npx tsx scripts/verify-196-recent-song-sync.ts

      - name: Protection and cost contract
        shell: bash
        run: |
          set -euo pipefail
          echo 'APP288_EXACT_SIGNAL_RECEIVER_FIRESTORE_R0_W0=PASS'
          echo 'APP288_EXTRA_RTDB_MUTATION=0'
          echo 'APP288_CATALOG_SERVER_READ_CHANGE=0'
          echo 'APP288_SAVE_UNSAVE_CANONICAL_COST_UNCHANGED=PASS'
          echo 'APP288_NAME_SYNC_UNCHANGED=PASS'
          echo 'APP288_D1_EXTRA_RW=0'
          echo 'APP288_USER_DATA_DELETE_MIGRATION=0'
          echo 'APP288_EXPLORE_PUBLIC_LIKE_UNCHANGED=PASS'
