name: Diagnose Preview Pagination Source

on:
  push:
    branches:
      - preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Inspect Music Note pagination source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('src/App.tsx').read_text(encoding='utf-8').splitlines()
          needles = [
              'mergeFavoriteFirstPageWithCache',
              'runFavoritesFullCacheRecoveryOnce',
              'attachLegacyFavoritesFallback',
              'loadMoreFavorites =',
          ]
          hits = sorted({i for i,line in enumerate(lines) if any(n in line for n in needles)})
          for i in hits:
              lo=max(0,i-90); hi=min(len(lines),i+220)
              print(f'--- context line {i+1} ---')
              for j in range(lo,hi): print(f'{j+1:06d}: {lines[j]}')
          PY

      - name: Inspect Library pagination source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('src/pages/SunoLibraryPage.tsx').read_text(encoding='utf-8').splitlines()
          for lo,hi in [(1060,1245),(2570,2640),(6440,6520)]:
              print(f'--- library lines {lo}-{hi} ---')
              for i in range(lo-1,min(hi,len(lines))): print(f'{i+1:06d}: {lines[i]}')
          PY
