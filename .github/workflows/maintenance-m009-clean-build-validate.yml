name: SORIDRAW Maintenance M-009 Clean Build Validate

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m009-clean-build-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Execute the exact Vercel build command from a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          echo 'M009_NPM_RUN_BUILD=PASS'

      - name: Full TypeScript verification of generated runtime
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          echo 'M009_FULL_TSC=PASS'

      - name: Verify Backend V2 mutation gates and generated V1 boundary coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          app = Path('src/App.tsx').read_text(encoding='utf-8')
          boundary = Path('src/data/v1MutationBoundary.ts').read_text(encoding='utf-8')
          repo = Path('src/data/userDataRepository.ts').read_text(encoding='utf-8')
          shadow = Path('src/data/v2ShadowValidation.ts').read_text(encoding='utf-8')
          cache = Path('src/data/indexedDbLocalCache.ts').read_text(encoding='utf-8')

          assert 'BACKEND_V2_V1_MUTATION_MIRROR_ENABLED = false' in boundary
          assert "BACKEND_V2_RUNTIME_MODE = 'v1-only'" in repo
          assert re.search(r'writeToV2:\s*false', repo)
          assert re.search(r'deleteV1:\s*false', repo)
          assert re.search(r'BACKEND_V2_SHADOW_WRITE_RUNTIME_ENABLED\s*=\s*false', shadow)
          assert re.search(r'BACKEND_V2_LOCAL_CACHE_RUNTIME_ENABLED\s*=\s*false', cache)

          lines = app.splitlines()
          persist_calls = []
          for i, line in enumerate(lines):
              if 'persistRecentSongsDocument(' in line and 'const persistRecentSongsDocument' not in line:
                  context = '\n'.join(lines[max(0, i-3):min(len(lines), i+4)])
                  persist_calls.append({'line': i+1, 'wrapped': 'runV1MutationBoundary' in context})
          assert len(persist_calls) >= 4, persist_calls
          assert all(item['wrapped'] for item in persist_calls), persist_calls

          # 912/913 intentionally changed edit/pre-favorite-edit from immediate
          # Firestore operations into local pending states. They are committed only
          # at the heart boundary through flushRecentSongTextWrite(), whose actual
          # persistRecentSongsDocument() calls are verified above to remain wrapped.
          assert 'SORIDRAW_912_HEART_TRIGGERED_RECENT_SAVE' in app
          assert 'SORIDRAW_913_RECENT_SAVE_RUNTIME_FIX' in app
          assert re.search(
              r"queueRecentSongTextWrite\s*=\s*useCallback\(\(uid: string, songs: any\[\], operation: 'regenerate' \| 'edit' \| 'pre-favorite-edit'\)",
              app,
          )
          assert "recentSongTextWritePendingRef.current = { uid, songs: nextSongs, operation };" in app
          assert "operation: recentSongTextWritePendingRef.current?.operation || 'pre-favorite-edit'" in app
          assert 'await flushRecentSongTextWrite();' in app

          required_recent_persisted_ops = ['delete-item', 'save-batch', 'regenerate', 'add-lyrics-language']
          missing_recent_persisted_ops = [
              op for op in required_recent_persisted_ops
              if f"operation: '{op}'" not in app
          ]
          assert not missing_recent_persisted_ops, missing_recent_persisted_ops

          required_music_ops = ['save', 'restore', 'unsave', 'permanent-delete', 'update', 'bulk-delete', 'bulk-lock', 'bulk-unlock']
          missing_music_ops = [op for op in required_music_ops if f"operation: '{op}'" not in app]
          assert not missing_music_ops, missing_music_ops

          print('M009_BOUNDARY_AUDIT=' + json.dumps({
              'persistRecentCalls': len(persist_calls),
              'persistRecentWrapped': sum(1 for x in persist_calls if x['wrapped']),
              'recentPersistedOpsMissing': missing_recent_persisted_ops,
              'deferredLocalEditOpsVerified': ['edit', 'pre-favorite-edit'],
              'musicNoteRequiredOpsMissing': missing_music_ops,
              'mirrorEnabled': False,
              'runtimeMode': 'v1-only',
          }, ensure_ascii=False))
          PY

      - name: Verify permanent deploy scripts are syntactically valid
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .deploy/apply-874-build-safety.py \
            .deploy/apply-901-music-note-10-incremental-sync.py \
            .deploy/apply-905-recent-songs-cache-live-accounting.py \
            .deploy/apply-910-recent-text-batch-unsave-fix.py \
            .deploy/apply-912-heart-triggered-recent-save.py \
            .deploy/apply-913-recent-save-runtime-fix.py
          echo 'M009_DEPLOY_SCRIPT_COMPILE=PASS'

      - name: Prove validator contains no Firebase mutation or deployment
        if: always()
        run: |
          echo 'M009_FIREBASE_DATA_READS=0'
          echo 'M009_FIREBASE_DATA_WRITES=0'
          echo 'M009_FIREBASE_DATA_DELETES=0'
          echo 'M009_RULES_DEPLOYS=0'
          echo 'M009_FUNCTIONS_DEPLOYS=0'
          echo 'M009_HOSTING_DEPLOYS=0'
