name: TEMP Diagnose Like Queue 119

on:
  push:
    branches:
      - fix/explore-feed-single-authority-119
    paths:
      - .github/workflows/temp-diagnose-feed-authority-119.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Inspect canonical likes and pending queue read-only
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/cloudflare/explore-worker/canonical/wrangler.preview.jsonc"
          ids="'music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_6ca2115f1b474aa7a60f1a2bdabd6317_k4e95q','music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_mdCqNWohZwk6lsKuNWOa','music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_b1ef5cf6fcb04371b33ea71d1950f244_5jt44','music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_6eb4944de4264b12a85f0d17180cd143_1en45bp','music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2_rs_sd_39b4f82d4bff4698a10af069654804e8_6npdve'"

          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command             "SELECT d.id,d.likes AS derivedLikes,COALESCE((SELECT COUNT(*) FROM likes l WHERE l.track_id=d.id),0) AS canonicalLikes FROM explore_derived_tracks d WHERE d.id IN ($ids) ORDER BY d.published_at DESC"             --json > "$RUNNER_TEMP/counts.json"

          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command             "SELECT batch_id,user_uid,created_at,mutation_json FROM explore_like_batches_069 WHERE mutation_json LIKE '%music_note_rcZ2GZrBndOZzT8C635eiNBjYIJ2%' ORDER BY created_at ASC LIMIT 50"             --json > "$RUNNER_TEMP/queue.json"

          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command             "SELECT COUNT(*) AS pending069 FROM explore_like_batches_069"             --json > "$RUNNER_TEMP/pending.json"

          node - <<'NODE'
          const fs=require('fs');
          const flat=p=>JSON.parse(fs.readFileSync(p,'utf8')).flatMap(x=>x.results||[]);
          const counts=flat(process.env.RUNNER_TEMP+'/counts.json');
          const queue=flat(process.env.RUNNER_TEMP+'/queue.json').map(x=>({
            batch_id:x.batch_id,
            created_at:x.created_at,
            mutation_json:x.mutation_json
          }));
          const pending=flat(process.env.RUNNER_TEMP+'/pending.json')[0]||{};
          console.log('COUNTS='+JSON.stringify(counts));
          console.log('MATCHED_QUEUE_ROWS='+JSON.stringify(queue));
          console.log('PENDING069='+Number(pending.pending069||0));
          NODE
          echo D1_WRITE=NONE
          echo LIKE_QUEUE_DIAG119=PASS
