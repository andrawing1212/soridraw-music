name: SORIDRAW app347 Studio Heart Recovery

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app347-studio-heart-recovery.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-app347-studio-heart-recovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Apply focused recovery
        run: node scripts/apply-347-studio-heart-reconcile.mjs
      - name: Focused regression
        run: |
          set -euo pipefail
          node scripts/verify-347-studio-heart-reconcile.mjs
          node scripts/verify-302-studio-heart-local-first-delayed-remote.mjs
          node scripts/verify-290-studio-heart-batch.mjs
          node scripts/verify-289-music-note-compact-heart-sync.mjs
          node scripts/verify-291-recent-lyrics-live-preview.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit focused product change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "soridraw-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx public/app-version.json
          git diff --cached --quiet && { echo "No product diff"; exit 1; }
          git commit -m "fix(preview): reconcile Studio heart canonical state"
          git push origin HEAD:preview
