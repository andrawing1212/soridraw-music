name: SORIDRAW 192 Navigation Visibility Build

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-192-navigation-settings-build.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-192-navigation-settings-build
  cancel-in-progress: false

jobs:
  build-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PREVIEW
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Apply bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/apply-214-navigation-visibility-sync.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app
        run: npm ci --no-audit --no-fund

      - name: App TypeScript
        run: npx tsc --noEmit

      - name: App Build
        run: npm run build

      - name: Verify 214
        run: node scripts/verify-214-navigation-visibility-sync.mjs

      - name: Verify prior protected flow
        run: node scripts/verify-213-explore-more-page-cache.mjs

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Functions TypeScript no-deploy
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          npx tsc --noEmit

      - name: Commit exact product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soridraw-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             src/services/navigationVisibilitySyncService.ts             database.rules.json             functions/src/index.ts             src/pages/AdminAppSettingsPage.tsx             src/App.tsx             public/app-version.json
          git diff --cached --check
          git commit -m "fix(preview): sync navigation visibility across devices"
          git push origin HEAD:preview
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
          echo "APP_VERSION=$(node -e "process.stdout.write(String(require('./public/app-version.json').version))")"
