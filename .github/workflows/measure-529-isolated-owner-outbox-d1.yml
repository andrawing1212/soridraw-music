name: SORIDRAW 529 Owned Follower D1 Physical Measurement
# Director-approved APP529 cost/recovery investigation only. Never deploy.
on:
  pull_request:
    branches: [preview]
    types: [synchronize, opened, reopened]
    paths:
      - 'scripts/measure-529-isolated-owner-outbox-d1.mjs'
      - '.github/workflows/measure-529-isolated-owner-outbox-d1.yml'
permissions:
  contents: read
concurrency:
  group: soridraw-529-ephemeral-one-owned-d1
  cancel-in-progress: false
jobs:
  offline:
    if: github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == 'andrawing1212/soridraw-music' && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-only isolated 529 DDL and local tests
        run: |
          set -euo pipefail
          node --check scripts/measure-529-isolated-owner-outbox-d1.mjs
          node scripts/measure-529-isolated-owner-outbox-d1.mjs --self-test
          python3 scripts/verify-529-owner-outbox-sql.py
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/verify-529-owner-sync.mjs
  physical:
    if: github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == 'andrawing1212/soridraw-music' && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One newly-owned synthetic Cloudflare D1, exact 529 physical meters
        run: node scripts/measure-529-isolated-owner-outbox-d1.mjs
      - name: Always owned-ID-only cleanup
        if: always()
        run: node scripts/measure-529-isolated-owner-outbox-d1.mjs cleanup
      - name: Shared resources unchanged
        run: echo '529_SYNTHETIC_ONLY;NO_SHARED_D1;NO_DEPLOYMENT;COMPILE_GATES_OFF'
