name: TEMP 110 Finalize Release State

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-110-finalize.trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Record PREVIEW 110 and clean temporary release files
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/record-110-release.py 4723fe9450869dd80b0e684309681535a8512dcd 35095168722
          find .github/workflows -maxdepth 1 -type f -name 'temp-109-*.yml' -delete || true
          find .github/workflows -maxdepth 1 -type f -name 'temp-110-*.yml' -delete || true
          find .deploy -maxdepth 1 -type f -name 'temp-109-*' -delete || true
          find .deploy -maxdepth 1 -type f -name 'temp-110-*' -delete || true
          rm -f .deploy/apply-110-liked-public-count.py .deploy/record-110-release.py
          git diff --check
          git config user.name soridraw-release-bot
          git config user.email actions@users.noreply.github.com
          git add -A DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md .github/workflows .deploy
          git commit -m 'docs: record PREVIEW 110 release and clean temp files'
          git push origin HEAD:preview
          echo "FINAL_PREVIEW_HEAD=$(git rev-parse HEAD)"
