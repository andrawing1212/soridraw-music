name: SORIDRAW APP732 Existing QA APP730 Bridge Candidate (offline only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/explore-worker/experiments/owner-follow-qa730-bridge.mjs'
      - 'cloudflare/explore-worker/experiments/owner-follow-qa730-entry.mjs'
      - 'scripts/verify-732-qa730-bridge.mjs'
      - '.github/workflows/app732-qa730-source-only.yml'

permissions:
  contents: read

jobs:
  isolated_qa_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compose QA candidate from exact protected PREVIEW source (runner temp only)
        run: |
          set -euo pipefail
          LOCKED_PREVIEW_SHA=4363820117100cb03bcbc44a01e127aeb5de3cf4
          git fetch origin preview --no-tags
          test "$(git rev-parse origin/preview)" = "$LOCKED_PREVIEW_SHA" || {
            echo 'APP732_PREVIEW_HEAD_DRIFT_HOLD'; exit 2;
          }
          git worktree add --detach "$RUNNER_TEMP/app732-preview" "$LOCKED_PREVIEW_SHA"
          mkdir -p "$RUNNER_TEMP/app732-preview/scripts"
          cp scripts/app730-source-only-follow-bridge.mjs "$RUNNER_TEMP/app732-preview/scripts/"
          cp scripts/verify-732-qa730-bridge.mjs "$RUNNER_TEMP/app732-preview/scripts/"
          cp scripts/app775-unified-follow-ingress.mjs "$RUNNER_TEMP/app732-preview/scripts/"
          cp cloudflare/explore-worker/experiments/owner-follow-qa730-bridge.mjs \
            "$RUNNER_TEMP/app732-preview/cloudflare/explore-worker/experiments/"
          cp cloudflare/explore-worker/experiments/owner-follow-qa730-entry.mjs \
            "$RUNNER_TEMP/app732-preview/cloudflare/explore-worker/experiments/"
          cp cloudflare/explore-worker/experiments/owner-follow-qa-real-auth-749.mjs \
            "$RUNNER_TEMP/app732-preview/cloudflare/explore-worker/experiments/"
          cp cloudflare/explore-worker/experiments/owner-follow-qa-shadow-778.mjs \
            "$RUNNER_TEMP/app732-preview/cloudflare/explore-worker/experiments/"
          cd "$RUNNER_TEMP/app732-preview"
          node --check scripts/app730-source-only-follow-bridge.mjs
          node --check cloudflare/explore-worker/experiments/owner-follow-qa730-bridge.mjs
          node --check cloudflare/explore-worker/experiments/owner-follow-qa730-entry.mjs
          node scripts/verify-732-qa730-bridge.mjs
          echo 'APP732_SOURCE_CANDIDATE=PASS_OFFLINE; QA_WORKER_DEPLOY=NOT_RUN; PRODUCTION=HOLD'
