name: Temporary 17th Test and Functions Deploy

on:
  issues:
    types: [opened]

concurrency:
  group: temporary-17-test-functions-deploy
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'DEPLOY SORIDRAW 17 TEST FUNCTIONS RETRY 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified 17th ZIP patch
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/17_patch_part_00.txt \
              .deploy/17_patch_part_01.txt \
              .deploy/17_patch_part_02.txt \
              .deploy/17_patch_part_03a.txt \
              .deploy/17_patch_part_03b.txt \
            | base64 --decode > /tmp/soridraw17_patch.tgz
          echo 'b386ee671a7f14b3635fab4e9353a0ae797496ee02e0a828286e8f5191da829d  /tmp/soridraw17_patch.tgz' | sha256sum --check
          tar -xzf /tmp/soridraw17_patch.tgz
          test "$(git hash-object src/pages/AdminUserManagementPage.tsx)" = "65e110e26ee43c2be10609f596d43cb5cb7e03ed"
          test "$(git hash-object src/types.ts)" = "3b4fc608a24d594babdf34664a3ef2e69c1d2169"
          test "$(git hash-object functions/src/index.ts)" = "535cec764f35824745942bce6e7d10769c510739"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Type check app
        run: npm run lint

      - name: Build test app
        run: npm run build

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Commit approved 17th changes to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .deploy/17_patch_part_00.txt \
                .deploy/17_patch_part_01.txt \
                .deploy/17_patch_part_02.txt \
                .deploy/17_patch_part_03.txt \
                .deploy/17_patch_part_03a.txt \
                .deploy/17_patch_part_03b.txt \
                .deploy/17_deploy_trigger_note.txt \
                .github/workflows/temporary-17-test-functions-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminUserManagementPage.tsx src/types.ts functions/src/index.ts .deploy .github/workflows
          git commit -m "feat: deploy admin auth management update"
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.34.0

      - name: Deploy changed Firebase Functions only
        run: >-
          firebase deploy
          --only functions:syncAuthUserToFirestore,functions:backfillMissingAuthUsers,functions:getAdminAuthDirectory,functions:adminForceLogoutUser,functions:adminResetEmailVerification,functions:adminDeleteUserAccount
          --project soridraw-app-866a5
          --non-interactive

      - name: Wait for Vercel test deployment
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 20 https://soridraw-music.vercel.app/ >/dev/null; then
              echo "Test app is responding."
              exit 0
            fi
            sleep 15
          done
          echo "Test app did not respond within the verification window." >&2
          exit 1

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ SORIDRAW_17_TEST_FUNCTIONS_SUCCESS sha=${DEPLOY_SHA} test=https://soridraw-music.vercel.app/ functions_project=soridraw-app-866a5"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ SORIDRAW_17_TEST_FUNCTIONS_FAILED run_id=${{ github.run_id }} sha=${DEPLOY_SHA:-not-pushed}"
