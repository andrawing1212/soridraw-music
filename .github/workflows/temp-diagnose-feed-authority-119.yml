name: TEMP Diagnose Feed Authority 119

on:
  push:
    branches:
      - fix/explore-feed-single-authority-119
    paths:
      - .github/workflows/temp-diagnose-feed-authority-119.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Compare D1, shared R2 and live PREVIEW feed
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/cloudflare/explore-worker/canonical/wrangler.preview.jsonc"

          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command             "SELECT d.id,d.likes AS likeCount,d.published_at AS publishedAt,c.title FROM explore_derived_tracks d JOIN tracks c ON c.id=d.id WHERE d.active=1 AND c.is_public=1 AND c.status='published' ORDER BY d.published_at DESC,d.id DESC LIMIT 40"             --json > "$RUNNER_TEMP/d1-latest.json"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command             "SELECT d.id,d.likes AS likeCount,d.published_at AS publishedAt,c.title FROM explore_derived_tracks d JOIN tracks c ON c.id=d.id WHERE d.active=1 AND c.is_public=1 AND c.status='published' ORDER BY d.likes DESC,d.published_at DESC,d.id DESC LIMIT 40"             --json > "$RUNNER_TEMP/d1-popular.json"

          node "$WRANGLER" r2 object get "soridraw-profile-media/internal/explore/shared-feed-v112/latest-40.json" --file "$RUNNER_TEMP/r2-latest.json" --remote
          node "$WRANGLER" r2 object get "soridraw-profile-media/internal/explore/shared-feed-v112/popular-40.json" --file "$RUNNER_TEMP/r2-popular.json" --remote

          curl -fsS -H 'Origin: https://preview.soridraw.com' -H 'Cache-Control: no-cache'             'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed?sort=latest&limit=40&__diag119=1' > "$RUNNER_TEMP/live-latest.json"
          curl -fsS -H 'Origin: https://preview.soridraw.com' -H 'Cache-Control: no-cache'             'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed?sort=popular&limit=40&__diag119=1' > "$RUNNER_TEMP/live-popular.json"

          node - <<'NODE'
          const fs=require('fs');
          const flatD1=p=>JSON.parse(fs.readFileSync(p,'utf8')).flatMap(x=>x.results||[]);
          const r2=p=>JSON.parse(fs.readFileSync(p,'utf8')).payload?.data?.items||[];
          const live=p=>JSON.parse(fs.readFileSync(p,'utf8')).data?.items||[];
          const pick=rows=>rows.slice(0,15).map(x=>({id:x.id,likeCount:Number(x.likeCount??x.stats?.likeCount??x.likes??0),title:x.title||''}));
          for (const sort of ['latest','popular']) {
            const d=pick(flatD1(process.env.RUNNER_TEMP+'/d1-'+sort+'.json'));
            const r=pick(r2(process.env.RUNNER_TEMP+'/r2-'+sort+'.json'));
            const l=pick(live(process.env.RUNNER_TEMP+'/live-'+sort+'.json'));
            console.log('=== '+sort.toUpperCase()+' D1 ==='); console.log(JSON.stringify(d));
            console.log('=== '+sort.toUpperCase()+' SHARED_R2 ==='); console.log(JSON.stringify(r));
            console.log('=== '+sort.toUpperCase()+' LIVE_PREVIEW ==='); console.log(JSON.stringify(l));
            console.log(sort.toUpperCase()+'_D1_EQ_R2='+(JSON.stringify(d)===JSON.stringify(r)));
            console.log(sort.toUpperCase()+'_R2_EQ_LIVE='+(JSON.stringify(r)===JSON.stringify(l)));
          }
          NODE
          echo D1_WRITE=NONE
          echo DIAG119=PASS
