name: Full production existing receiver authentication proof
on:
  push:
    branches: [prep/full-preview-production-parity]
    paths:
      - 'scripts/full-production-existing-receiver-proof.mjs'
      - '.github/workflows/full-production-runtime-plan.yml'
permissions:
  contents: read
jobs:
  plan:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: google-github-actions/auth@v2
        id: firebase
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token
      - name: Prove existing receiver signature without valid user mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
        run: node scripts/full-production-existing-receiver-proof.mjs
