name: SORIDRAW 045 Explore Mirror Binding Diagnose

on:
  push:
    branches: [preview-045-explore-sync-recovery]
    paths: ['.github/workflows/preview-045-explore-binding-diagnose.yml']

permissions:
  contents: read

jobs:
  diagnose-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Inspect active source and bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN;
          const workers={preview:'soridraw-explore-preview',test:'soridraw-explore-test',production:'soridraw-explore-api'};
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status} ${JSON.stringify(x).slice(0,500)}`);return x.result||x}
          async function source(worker){const b=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${worker}`;const ds=await get(`${b}/deployments`);const d=[...(ds.deployments||ds||[])].sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0))[0];const a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${worker}/versions/${a.version_id}?include=modules`);const mods=v.modules||[];const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];return Buffer.from(m.content_base64,'base64').toString('utf8')}
          (async()=>{
            for(const [env,worker] of Object.entries(workers)){
              const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${worker}`;
              const s=await source(worker);
              const settings=await get(`${base}/settings`);
              const bindings=(settings.bindings||[]).map(x=>({name:x.name,type:x.type,service:x.service||null}));
              console.log(`BINDINGS_${env.toUpperCase()}=${JSON.stringify(bindings)}`);
              const mirrorCode=s.includes('EXPLORE_MIRROR_ROUTE_020')&&s.includes('fanoutProductionExploreFeedMirror020');
              console.log(`MIRROR_CODE_${env.toUpperCase()}=${mirrorCode}`);
              if(!s.includes('RETURNING count')||!s.includes('RETURNING like_count'))throw new Error(`044 like optimization missing ${env}`);
              if(env==='production'){
                const names=new Set(bindings.map(x=>x.name));
                if(names.has('EXPLORE_MIRROR_PREVIEW')||names.has('EXPLORE_MIRROR_TEST')) throw new Error('production mirror service binding unexpectedly present');
                if(!mirrorCode) throw new Error('production mirror source code missing');
              }
            }
            console.log('ROOT_CAUSE_MIRROR_BINDINGS_DROPPED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
