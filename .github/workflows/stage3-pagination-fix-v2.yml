name: Stage3 Pagination Fix V2

on:
  push:
    branches: [preview-stage3-pagination]
    paths:
      - '.github/workflows/stage3-pagination-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stage3 branch
        uses: actions/checkout@v4
        with:
          ref: preview-stage3-pagination
          fetch-depth: 0

      - name: Reuse Stage3 V1 source patch exactly
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/stage3-pagination-fix.yml \
            | sed '1d;$d;s/^          //' > "$RUNNER_TEMP/stage3-v1-patch.py"
          test -s "$RUNNER_TEMP/stage3-v1-patch.py"
          python3 "$RUNNER_TEMP/stage3-v1-patch.py"

      - name: Fix pagination completion constant scope only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          declaration = "const MUSIC_NOTE_PAGINATION_COMPLETE_STORAGE_BASE = 'soridraw_music_note_pagination_complete_v1';\n"
          if text.count(declaration) != 1:
              raise SystemExit(f'expected one temporary completion declaration, got {text.count(declaration)}')
          text = text.replace(declaration, '', 1)
          anchor = "const MUSIC_NOTE_PAGINATION_CURSOR_STORAGE_BASE = 'soridraw_music_note_pagination_cursor_v1';\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'module cursor storage anchor mismatch: {text.count(anchor)}')
          text = text.replace(anchor, anchor + declaration, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Static Stage3 assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "WORKSPACE_SERVER_PAGE_SIZE + 1" src/pages/SunoLibraryPage.tsx
          grep -Fq "soridraw_suno_tracks_page_meta_v1_" src/pages/SunoLibraryPage.tsx
          grep -Fq "LIBRARY_COMPATIBILITY_SCAN_LIMIT" src/pages/SunoLibraryPage.tsx
          grep -Fq "FAVORITES_SERVER_FETCH_SIZE" src/App.tsx
          grep -Fq "MUSIC_NOTE_COMPATIBILITY_SCAN_LIMIT" src/App.tsx
          test "$(grep -Fc "const MUSIC_NOTE_PAGINATION_COMPLETE_STORAGE_BASE = 'soridraw_music_note_pagination_complete_v1';" src/App.tsx)" = "1"
          grep -Fq "skipBundleWrite: true" src/App.tsx
          ! grep -Fq "filteredFavorites.length >= MUSIC_NOTE_VISIBLE_BATCH_SIZE" src/pages/FavoritesPage.tsx

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Append successful work memo
        shell: bash
        run: |
          cat >> DOCS/WORK_LOG.md <<'EOF'

          ## 2026-08-30 — Stage 3 페이지네이션 소스 수정 2차 검증 PASS
          - 브랜치: `preview-stage3-pagination`
          - 변경 파일: `src/App.tsx`, `src/pages/FavoritesPage.tsx`, `src/pages/SunoLibraryPage.tsx`.
          - 라이브러리: 로컬 track cache와 별도로 `hasMore/cursor/fallback` 페이지 메타를 저장·복원. 10개 표시를 위해 11개 lookahead 조회로 다음 페이지를 정확히 판정. ordered pagination 끝에서만 최대 2,000건의 읽기 전용 호환 스캔으로 `createdAt` 없는 레거시 문서를 로컬 캐시에 병합.
          - 뮤직노트: 20개 표시를 위해 21개 lookahead 조회. 기존 캐시의 깊은 pagination state를 first-page bundle이 덮지 않게 분리. 페이지 끝에서만 최대 2,000건 읽기 전용 호환 스캔으로 레거시 문서를 로컬 캐시에 병합하고 완료 마커를 저장.
          - UI: 캐시 잔량 전체를 `남음`으로 표시하지 않고 다음에 실제 표시할 개수만 안내. 서버 `hasMore`가 true면 현재 필터 결과가 20개 미만이어도 더보기 요청 가능.
          - 1차 실패 보정: 완료 마커 storage 상수를 module scope로 이동. 다른 수정 로직은 1차 패치를 그대로 재사용.
          - 데이터 안전: favorites/suno_tracks 원본 문서 쓰기·삭제·백필 없음. Functions/Rules/Hosting/Auth 변경 없음.
          - 검증: 정적 assertions PASS, TypeScript PASS, Vite build PASS.
          - 다음: 임시 workflow 제거 후 diff 감사 → `preview` 반영 및 Firebase Preview 배포 → Music Note 493개/Library 더보기 실사용 확인.
          EOF

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "andrawing1212"
          git config user.email "andrawing1212@gmail.com"
          git add src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx DOCS/WORK_LOG.md
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "fix(stage3): restore pagination metadata and legacy reads"
          git push origin HEAD:preview-stage3-pagination
