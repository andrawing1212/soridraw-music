name: Apply 071 Explore Like Count Refresh Recovery

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-071-explore-like-count-refresh.py'
      - '.github/workflows/apply-071-explore-like-count-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-071-explore-like-count-refresh
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted 071 client fix
        run: python3 .deploy/apply-071-explore-like-count-refresh.py

      - name: Verify 071 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_COUNT_REFRESH_RECOVERY_071_20260912' src/pages/ExplorePage.tsx
          grep -Fq 'EXPLORE_LIKE_REFRESH_STORAGE_PREFIX_071' src/pages/ExplorePage.tsx
          grep -Fq 'forceLikeCountRefreshRef071' src/pages/ExplorePage.tsx
          grep -Fq 'cachedRevision === serverRevision && !forceLikeCountRefresh071' src/pages/ExplorePage.tsx
          grep -Fq 'patchExplorePublicProfileFirstViewTrack(track.ownerUid, track.id, { likeCount: track.likeCount })' src/pages/ExplorePage.tsx
          grep -Fq 'scheduleAggregateCountRefresh071();' src/pages/ExplorePage.tsx
          grep -Fq '"version": "071"' public/app-version.json
          # Preserve the validated 069 server-side W1/deferred-count contract.
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_W1_DELAYED_COUNT_069_20260912' src/services/exploreLikeService.ts
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_W1_DELAYED_COUNT_040_20260912' cloudflare/explore-worker/canonical/preview-worker.js
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_REVERSAL_ORDER_041_20260912' cloudflare/explore-worker/canonical/preview-worker.js
          echo '071_STATIC_CONTRACT=PASS'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify change boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/pages/ExplorePage\.tsx|public/app-version\.json)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected generated changes:'
            echo "$bad"
            exit 1
          fi
          echo 'NO_WORKER_RUNTIME_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_FIREBASE_FUNCTIONS_CHANGE=true'
          echo 'NO_FIRESTORE_RULES_CHANGE=true'
          echo 'NO_USER_DATA_CHANGE=true'
          echo 'NO_UI_CSS_CHANGE=true'

      - name: Commit actual PREVIEW 071 source
        shell: bash
        run: |
          set -euo pipefail
          tracked=(src/pages/ExplorePage.tsx public/app-version.json)
          if git diff --quiet -- "${tracked[@]}"; then
            echo '071 already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${tracked[@]}"
          git commit -m 'fix: recover deferred Explore like count refresh'
          git push origin HEAD:preview
