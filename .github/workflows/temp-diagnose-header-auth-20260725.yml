name: Diagnose header auth rendering 20260725

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'DIAGNOSE HEADER AUTH 20260725 0641E'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect auth initialization excerpts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines = Path('src/App.tsx').read_text(encoding='utf-8').splitlines()
          rx = re.compile(r'const \[user|isAuthReady|onAuthStateChanged|setUser\(|auth\.currentUser', re.I)
          ranges=[]
          for i,line in enumerate(lines,1):
              if rx.search(line):
                  ranges.append((max(1,i-12),min(len(lines),i+20)))
          merged=[]
          for start,end in sorted(ranges):
              if not merged or start>merged[-1][1]+1:
                  merged.append([start,end])
              else:
                  merged[-1][1]=max(merged[-1][1],end)
          out=[]
          for start,end in merged:
              out.append(f'=== lines {start}-{end} ===')
              for n in range(start,end+1):
                  out.append(f'{n}: {lines[n-1]}')
          Path('auth-init-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Report excerpts
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          {
            echo '```text'
            head -c 60000 auth-init-diagnostic.txt
            echo
            echo '```'
          } > body.md
          gh issue comment "$ISSUE_URL" --body-file body.md
