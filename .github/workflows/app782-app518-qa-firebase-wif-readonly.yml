name: APP782 APP518 QA Firebase WIF authentication (read-only, no Cloud Shell)

# Owner-only manual command on pinned draft PR #528. This uses GitHub OIDC
# and a QA-project-specific service account, never an operating credential.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: soridraw-app782-qa-firebase-wif-readonly
  cancel-in-progress: false

jobs:
  qa_firebase_auth_readonly:
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-firebase-auth 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify pinned QA identity only (no Google call)
        id: gate
        env:
          QA_WIF_PROVIDER: projects/1083981050742/locations/global/workloadIdentityPools/soridraw-qa-github/providers/app518-readonly
          QA_SERVICE_ACCOUNT: soridraw-qa-gh-reader@soridraw-app.iam.gserviceaccount.com
        shell: bash
        run: |
          set -euo pipefail
          test "$QA_WIF_PROVIDER" = 'projects/1083981050742/locations/global/workloadIdentityPools/soridraw-qa-github/providers/app518-readonly'
          test "$QA_SERVICE_ACCOUNT" = 'soridraw-qa-gh-reader@soridraw-app.iam.gserviceaccount.com'
          echo 'APP782_QA_PROJECT=soridraw-app; QA_PROJECT_NUMBER=1083981050742'
          echo 'APP782_QA_PROVIDER_AND_SERVICE_ACCOUNT=PINNED; REMOTE_IDENTITY=UNVERIFIED'
          echo 'APP782_PRODUCTION_CREDENTIALS=NOT_USED; QA_MUTATIONS=0'
          echo 'APP782_CLOUD_SHELL=NOT_USED'
      - name: Authenticate QA Google Cloud through short-lived GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1083981050742/locations/global/workloadIdentityPools/soridraw-qa-github/providers/app518-readonly
          service_account: soridraw-qa-gh-reader@soridraw-app.iam.gserviceaccount.com
          project_id: soridraw-app
          create_credentials_file: true
          export_environment_variables: true
      - name: Install Cloud SDK for QA metadata GET only
        uses: google-github-actions/setup-gcloud@v2
      - name: Query exact QA project number and existing Functions names only
        shell: bash
        run: |
          set -euo pipefail
          project="$(gcloud config get-value project 2>/dev/null)"
          test "$project" = 'soridraw-app' || {
            echo 'APP782_QA_FIREBASE_WIF=HOLD_AUTH_PROJECT_NOT_QA'
            exit 2
          }
          number="$(gcloud projects describe soridraw-app --format='value(projectNumber)' 2>/dev/null)" || {
            echo 'APP782_QA_FIREBASE_WIF=HOLD_QA_PROJECT_METADATA_PERMISSION'
            exit 2
          }
          test "$number" = '1083981050742' || {
            echo 'APP782_QA_FIREBASE_WIF=HOLD_QA_PROJECT_NUMBER_MISMATCH'
            exit 2
          }
          # Metadata only. Never enumerate Firestore, Auth users, secrets,
          # deployed source archives, data, or billing accounts.
          gcloud functions list --regions=asia-northeast3 \
            --project=soridraw-app --format=json > "$RUNNER_TEMP/qa-app518-functions.json" || {
            echo 'APP782_QA_FIREBASE_WIF=HOLD_FUNCTIONS_LIST_PERMISSION_OR_API'
            exit 2
          }
          python3 - "$RUNNER_TEMP/qa-app518-functions.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf8'))
          assert isinstance(d,list) and len(d)<100, 'QA_FUNCTIONS_LIST_FORMAT_HOLD'
          names=[str(x.get('name','')).split('/')[-1] for x in d]
          assert all(names) and all('/' not in n for n in names), 'QA_FUNCTION_NAMES_INVALID'
          print('APP782_QA_FIREBASE_WIF=PASS_SHORT_LIVED_GITHUB_OIDC')
          print('APP782_QA_FUNCTIONS_LIST_READ_ONLY=PASS')
          print('APP782_QA_FUNCTIONS_COUNT='+str(len(names)))
          print('APP782_EXISTING_FOLLOW_FUNCTION_PRESENT='+str('publishExploreOwnerFollower542' in names).lower())
          print('APP782_APP518_EXACT_SOURCE_FUNCTION_PRESENT='+str('app518ExactFavoriteSource' in names).lower())
          print('APP782_APP518_CHANGE_FUNCTION_PRESENT='+str('app518FavoriteCatalogChanged' in names).lower())
          print('APP782_QA_SERVER_MUTATIONS=0; FUNCTIONS_DEPLOY=0; CLOUD_SHELL=NOT_USED')
          PY


  qa_exact_source_stage:
    # No Google or Cloudflare credentials. Only stage the pinned APP518
    # exact-source Firebase function, not the shared securedIndex or trigger.
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-stage 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build only the pinned PR candidate source; never deploy
        shell: bash
        run: |
          set -euo pipefail
          SHA=864f796da24413309567198c9de502b13cdedd50
          git cat-file -e "$SHA^{commit}" || {
            echo 'APP783_QA_EXACT_SOURCE_SHA_UNAVAILABLE';exit 2;
          }
          git worktree add --detach "$RUNNER_TEMP/app518-source" "$SHA"
          npm --prefix "$RUNNER_TEMP/app518-source/functions" ci --no-audit --no-fund
          npm --prefix "$RUNNER_TEMP/app518-source/functions" run build
          test -f "$RUNNER_TEMP/app518-source/functions/lib/app518ServerTransport.js"
          node qa/app518/firebase/stage.mjs "$RUNNER_TEMP/app518-source/functions/lib"
          NODE_PATH="$RUNNER_TEMP/app518-source/functions/node_modules" \
            node qa/app518/firebase/verify.mjs
          node --check qa/app518/firebase/index.cjs
          echo 'APP783_QA_ONLY_ONE_SOURCE_FUNCTION_STAGED=PASS'
          echo 'APP783_FIREBASE_FUNCTIONS_DEPLOY=0; FIRESTORE_MUTATIONS=0'
      - name: Preserve uncredentialed source-only package for exact QA review
        uses: actions/upload-artifact@v4
        with:
          name: app783-qa-exact-source-off
          path: |
            qa/app518/firebase/index.cjs
            qa/app518/firebase/package.json
            qa/app518/firebase/lib/app518CanonicalSourceProvider.js
            qa/app518/firebase/lib/app518EventSafetyFence.js
            qa/app518/firebase/lib/app518ServerTransport.js
          if-no-files-found: error
          retention-days: 7


  qa_runtime_preflight:
    # APP784: verify Firebase/Google QA metadata without reading user data,
    # modifying IAM, enabling APIs, deploying Functions, or touching billing.
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-runtime-preflight 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1083981050742/locations/global/workloadIdentityPools/soridraw-qa-github/providers/app518-readonly
          service_account: soridraw-qa-gh-reader@soridraw-app.iam.gserviceaccount.com
          project_id: soridraw-app
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Bounded QA-only cloud metadata inspection
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = "soridraw-app"
          test "$(gcloud projects describe soridraw-app --format='value(projectNumber)' 2>/dev/null)" = "1083981050742"
          set +e
          gcloud firestore databases list --project=soridraw-app --format=json > "$RUNNER_TEMP/app784-firestore.json" 2> "$RUNNER_TEMP/app784-firestore.err"
          firestore_status=$?
          gcloud services list --enabled --project=soridraw-app --format=json > "$RUNNER_TEMP/app784-services.json" 2> "$RUNNER_TEMP/app784-services.err"
          service_status=$?
          gcloud functions list --regions=asia-northeast3 --project=soridraw-app --format=json > "$RUNNER_TEMP/app784-functions.json" 2> "$RUNNER_TEMP/app784-functions.err"
          functions_status=$?
          set -e
          F=$firestore_status S=$service_status FN=$functions_status python3 - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          def load(file,status):
            if int(status)!=0:return None
            try:
              data=json.loads((base/file).read_text('utf8'))
              return data if isinstance(data,list) and len(data)<=100 else None
            except Exception:return None
          db=load('app784-firestore.json',os.environ['F'])
          services=load('app784-services.json',os.environ['S'])
          functions=load('app784-functions.json',os.environ['FN'])
          print('APP784_QA_PROJECT_AND_NUMBER=PASS')
          if db is None:
            detail=(base/'app784-firestore.err').read_text('utf8',errors='replace').lower()
            cause=('PERMISSION_DENIED' if ('permission' in detail or '403' in detail)
              else 'API_DISABLED' if ('not enabled' in detail or 'disabled' in detail)
              else 'CLI_INVALID' if ('invalid choice' in detail or 'unrecognized arguments' in detail)
              else 'UNKNOWN')
            print('APP784_QA_FIRESTORE_DATABASE_METADATA=HOLD_'+cause)
          else:
            print('APP784_QA_FIRESTORE_DATABASE_METADATA=PASS_READONLY')
            print('APP784_QA_FIRESTORE_DEFAULT_EXISTS='+str(any(x.get('name','').endswith('/databases/(default)') for x in db)).lower())
          if services is None: print('APP784_QA_ENABLED_APIS=HOLD_UNAVAILABLE')
          else:
            enabled={x.get('config',{}).get('name','') for x in services}
            print('APP784_QA_ENABLED_APIS=PASS_READONLY')
            for name in ('cloudfunctions.googleapis.com','run.googleapis.com','cloudbuild.googleapis.com','artifactregistry.googleapis.com','secretmanager.googleapis.com','firestore.googleapis.com','iamcredentials.googleapis.com'):
              print('APP784_API_'+name.split('.')[0].upper()+'='+str(name in enabled).lower())
          if functions is None: print('APP784_QA_FUNCTIONS=HOLD_UNAVAILABLE')
          else:
            names=[x.get('name','').rsplit('/',1)[-1] for x in functions]
            print('APP784_QA_FUNCTIONS_LIST=PASS_READONLY')
            print('APP784_QA_EXISTING_FOLLOW_PRESERVED='+str('publishExploreOwnerFollower542' in names).lower())
            print('APP784_QA_APP518_ALREADY_DEPLOYED='+str(any('app518' in x.lower() for x in names)).lower())
            print('APP784_QA_FUNCTION_COUNT='+str(len(names)))
          print('APP784_QA_DATA_READS=0; MUTATIONS=0; PRODUCTION_ACCESS=0; CLOUD_SHELL=0')
          # A missing/undiscoverable QA Firestore database is a blocker,
          # not a green cloud readiness result.
          if db is None or not any(x.get('name','').endswith('/databases/(default)') for x in db):
            print('APP784_QA_FULL_E2E_READY=HOLD_FIRESTORE_DATABASE_UNVERIFIED')
            raise SystemExit(2)
          if services is None or functions is None:
            print('APP784_QA_FULL_E2E_READY=HOLD_METADATA_INCOMPLETE')
            raise SystemExit(2)
          print('APP784_QA_FULL_E2E_READY=PASS_READONLY_METADATA_ONLY')
          PY


  qa_windows_bootstrap_lint:
    # Offline syntax and safety check; does NOT call Google/Cloudflare.
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-bootstrap-lint 864f796da24413309567198c9de502b13cdedd50'
    runs-on: windows-2022
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Parse Windows PowerShell and verify QA-only guardrails
        shell: pwsh
        run: |
          $f='scripts/app786-qa-windows-bootstrap.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'APP786_QA_PS_PARSE_FAIL'
          }
          $raw=Get-Content -Raw -Encoding UTF8 $f
          foreach($required in @(
            "1083981050742",
            "soridraw-qa-app518-runtime@soridraw-app.iam.gserviceaccount.com",
            "soridraw-qa-gh-deployer@soridraw-app.iam.gserviceaccount.com",
            "principalSet://iam.googleapis.com/projects/",
            "2026-12-01T15:00:00Z",
            "soridraw-qa-github",
            "APP786_QA_BOOTSTRAP_PASS",
            "SORIDRAW-QA"
          )){
            if(!$raw.Contains($required)){throw "APP786_MISSING_REQUIRED_GUARDRAIL"}
          }
          foreach($forbidden in @(
            "gcloud config set project",
            "service-accounts keys create",
            "firestore databases delete",
            "roles/owner",
            "roles/editor",
            "soridraw-app-866a5"
          )){
            if($raw.Contains($forbidden)){throw "APP786_UNSAFE_OPERATION_FOUND"}
          }
          Write-Host 'APP786_QA_WINDOWS_POWERSHELL_PARSE=PASS'
          Write-Host 'APP786_EXACT_PROJECT_BUDGET_WIF_EXPIRY_GUARDS=PASS'
          Write-Host 'APP786_GOOGLE_IAM_MUTATIONS=0_OFFLINE_ONLY'


  qa_deployer_admission:
    # One-shot read-only check after local APP786 bootstrap. No deploy.
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-deployer-admission 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1083981050742/locations/global/workloadIdentityPools/soridraw-qa-github/providers/app518-readonly
          service_account: soridraw-qa-gh-deployer@soridraw-app.iam.gserviceaccount.com
          project_id: soridraw-app
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Exact QA Firestore and Functions runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = 'soridraw-app'
          test "$(gcloud projects describe soridraw-app --format='value(projectNumber)')" = '1083981050742'
          gcloud firestore databases describe --database='(default)' \
            --project=soridraw-app --format=json > "$RUNNER_TEMP/app786-db.json"
          gcloud functions list --regions=asia-northeast3 \
            --project=soridraw-app --format=json > "$RUNNER_TEMP/app786-functions.json"
          python3 - "$RUNNER_TEMP/app786-db.json" "$RUNNER_TEMP/app786-functions.json" <<'PY'
          import json,sys
          db=json.load(open(sys.argv[1],encoding='utf8'))
          functions=json.load(open(sys.argv[2],encoding='utf8'))
          if not isinstance(functions,list):raise SystemExit('APP786_HOLD_QA_FUNCTIONS_INVALID')
          if db.get('name')!='projects/soridraw-app/databases/(default)':
            raise SystemExit('APP786_HOLD_DEFAULT_DB_ID')
          if db.get('locationId')!='asia-northeast3' or db.get('type')!='FIRESTORE_NATIVE':
            raise SystemExit('APP786_HOLD_DEFAULT_DB_LOCATION_OR_TYPE')
          if db.get('databaseEdition','STANDARD')!='STANDARD':
            raise SystemExit('APP786_HOLD_DEFAULT_DB_EDITION')
          names=[x.get('name','').split('/')[-1] for x in functions]
          if 'publishExploreOwnerFollower542' not in names:
            raise SystemExit('APP786_HOLD_ORIGINAL_QA_FOLLOW_FUNCTION_MISSING')
          if any(x.lower().startswith('app518') for x in names):
            raise SystemExit('APP786_HOLD_UNEXPECTED_APP518_QA_DEPLOY')
          print('APP786_QA_DEPLOYER_GITHUB_OIDC=PASS')
          print('APP786_QA_DEFAULT_FIRESTORE_METADATA=PASS')
          print('APP786_QA_EXISTING_FOLLOW_FUNCTION=PASS')
          print('APP786_QA_CLOUD_MUTATIONS=0; QA_APP518_E2E=NOT_TESTED')
          PY

  qa_active_rules_readonly:
    # APP787: exact QA project, owner-triggered single GET-only inspection.
    # Temporary roles/firebaserules.viewer grant must be revoked by QA admin after run.
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app787-qa-active-rules 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1083981050742/locations/global/workloadIdentityPools/soridraw-qa-github/providers/app518-readonly
          service_account: soridraw-qa-gh-reader@soridraw-app.iam.gserviceaccount.com
          project_id: soridraw-app
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Get exactly active QA firestore release and ruleset (no writes)
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = 'soridraw-app'
          test "$(gcloud projects describe soridraw-app --format='value(projectNumber)')" = '1083981050742'
          export APP787_QA_BEARER
          APP787_QA_BEARER="$(gcloud auth print-access-token)"
          python3 - <<'PY'
          import hashlib,json,os,re,sys,urllib.error,urllib.request
          PROJECT='soridraw-app'
          NUMBER='1083981050742'
          ROOT='https://firebaserules.googleapis.com/v1/'
          token=os.environ.get('APP787_QA_BEARER','')
          if len(token)<20: raise SystemExit('APP787_HOLD_QA_OIDC_TOKEN_UNAVAILABLE')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):
              raise RuntimeError('APP787_HOLD_UNEXPECTED_REDIRECT')
          opener=urllib.request.build_opener(NoRedirect())
          def get(path):
            if not path.startswith('projects/') or '?' in path or '#' in path:
              raise SystemExit('APP787_HOLD_INVALID_RULES_RESOURCE_PATH')
            request=urllib.request.Request(ROOT+path,method='GET',headers={
              'Authorization':'Bearer '+token,'Accept':'application/json'})
            try:
              with opener.open(request,timeout=20) as response:
                if response.status!=200: raise SystemExit('APP787_HOLD_UNEXPECTED_HTTP')
                return json.load(response)
            except urllib.error.HTTPError as err:
              raise SystemExit('APP787_HOLD_RULES_HTTP_'+str(err.code))
            except (urllib.error.URLError,TimeoutError):
              raise SystemExit('APP787_HOLD_RULES_NETWORK')
          release=get(f'projects/{PROJECT}/releases/cloud.firestore')
          ids={PROJECT,NUMBER}
          matched_release=re.fullmatch(r'projects/([^/]+)/releases/cloud[.]firestore',
                                      str(release.get('name','')))
          if not matched_release or matched_release.group(1) not in ids:
            raise SystemExit('APP787_HOLD_RELEASE_NOT_QA')
          ruleset_name=release.get('rulesetName','')
          matched_ruleset=re.fullmatch(r'projects/([^/]+)/rulesets/([A-Za-z0-9_-]+)',
                                      str(ruleset_name))
          if not matched_ruleset or matched_ruleset.group(1) not in ids:
            raise SystemExit('APP787_HOLD_RULESET_NOT_QA')
          ruleset=get(ruleset_name)
          if str(ruleset.get('name',''))!=ruleset_name:
            raise SystemExit('APP787_HOLD_RULESET_ID_MISMATCH')
          files=(ruleset.get('source') or {}).get('files')
          if not isinstance(files,list) or len(files)!=1 or not isinstance(files[0],dict):
            raise SystemExit('APP787_HOLD_UNEXPECTED_RULE_SOURCE_FILES')
          src=files[0].get('content')
          if not isinstance(src,str) or not src or len(src)>32768:
            raise SystemExit('APP787_HOLD_INVALID_RULE_SOURCE')
          # Strict full-file match, not merely finding "if false" beside broader allow rules.
          no_comments=re.sub(r'/[*].*?[*]/|//[^\n]*','',src,flags=re.S)
          actual=''.join(no_comments.split())
          expected="rules_version='2';servicecloud.firestore{match/databases/{database}/documents{match/{document=**}{allowread,write:iffalse;}}}"
          if actual!=expected:
            raise SystemExit('APP787_HOLD_ACTIVE_RULES_NOT_EXACT_DENY_ALL')
          print('APP787_QA_ACTIVE_FIRESTORE_RELEASE=PASS')
          print('APP787_QA_ACTIVE_RULESET_EXACT_DENY_ALL=PASS')
          print('APP787_QA_RULE_SOURCE_SHA256='+hashlib.sha256(src.encode()).hexdigest())
          print('APP787_QA_READ_ONLY=PASS; RULES_WRITES=0; FIRESTORE_DOC_READS=0')
          PY

  qa_live_readiness:
    # APP518 exact pinned QA Cloudflare+Firebase GET/SQL SELECT only.
    # No Firebase Rules Viewer re-grant, no Firestore data read, no secret value print.
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-live-readiness 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulated foreign-resource and unmetered D1 denial
        run: node qa/app518/live/verify-readiness518.mjs
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1083981050742/locations/global/workloadIdentityPools/soridraw-qa-github/providers/app518-readonly
          service_account: soridraw-qa-gh-deployer@soridraw-app.iam.gserviceaccount.com
          project_id: soridraw-app
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Exact live isolated QA GET and D1 sqlite_master SELECT only
        env:
          CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
          CLOUDFLARE_QA_STORAGE_READ_TOKEN: ${{ secrets.CLOUDFLARE_QA_STORAGE_READ_TOKEN }}
          CLOUDFLARE_QA_DATA_TOKEN: ${{ secrets.CLOUDFLARE_QA_DATA_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gcloud projects describe soridraw-app --format='value(projectNumber)')" = '1083981050742'
          node qa/app518/live/readiness518.mjs --live-readonly
