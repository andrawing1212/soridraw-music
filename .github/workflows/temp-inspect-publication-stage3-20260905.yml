name: SORIDRAW Inspect Publication Stage3 2026-09-05
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-publication-stage3-20260905.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inspect exact active PREVIEW publication write path
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          function functions(src){
            const out=[]; const re=/(async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(/g; let m;
            while((m=re.exec(src))){
              const start=m.index, brace=src.indexOf('{', re.lastIndex); if(brace<0) continue;
              let depth=0,quote=null,escaped=false,end=-1;
              for(let i=brace;i<src.length;i++){
                const c=src[i];
                if(quote){if(escaped){escaped=false;continue;} if(c==='\\\\'){escaped=true;continue;} if(c===quote)quote=null;continue;}
                if(c==='"'||c==="'"||c==='`'){quote=c;continue;}
                if(c==='{')depth++; else if(c==='}'&&--depth===0){end=i+1;break;}
              }
              if(end>start) out.push({name:m[2],text:src.slice(start,end)});
            }
            return out;
          }
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
            const deps=await get(`${base}/deployments`); const d=(deps.deployments||deps||[])[0];
            const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!active?.version_id||Number(active.percentage||0)<99.99)throw new Error('No single active PREVIEW version');
            const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);
            const mods=ver.modules||[]; if(!mods.length)throw new Error('No active modules');
            const mainName=ver.main_module||mods[0].name||'worker.js'; const main=mods.find(m=>m.name===mainName)||mods[0];
            const src=Buffer.from(main.content_base64,'base64').toString('utf8');
            const fns=functions(src); const byName=new Map(fns.map(f=>[f.name,f.text]));
            console.log(`[Stage3 audit] active=${active.version_id} functions=${fns.length}`);
            const wanted=['handlePublicationR2Core','enforceUserRateLimit','applyPublicationOptions','getOrEnsurePublicationOwnerProfile013','upsertPublicProfileFromFirebase','refreshProfileSearchIndex','syncExploreFeedR2Publication012','refreshOrPrebuildPublicProfileTrackWindow','materializePublicProfileFirstView','refreshPublicProfileFirstViewTrackWindow','syncMusicNotePublicationR2AfterMutation','refreshPublicationTrackSearchIndex013'];
            for(const n of wanted){console.log(`\n===== ${n} =====\n${byName.get(n)||'[MISSING]'}\n===== END ${n} =====`);}
            const needles=['track_stats','track_tags','rate_limit','profile_search_fts','track_search_fts','INSERT INTO tracks','UPDATE tracks'];
            console.log('\n===== RELATED MUTATION FUNCTIONS =====');
            for(const f of fns){
              if(needles.some(n=>f.text.includes(n))){
                const sql=(f.text.match(/\b(?:INSERT|UPDATE|DELETE|REPLACE)\b[^`\n]*/gi)||[]).slice(0,20);
                console.log(`[related] ${f.name}: ${sql.join(' | ')}`);
              }
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
