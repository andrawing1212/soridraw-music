name: TEMP 147 Like Parity Postflight
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-147-like-parity-postflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Worker CLI
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Compare entire canonical public set to live Feed latest and popular
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          node "$W" d1 execute DB --remote --config "$PWD/canonical/wrangler.preview.jsonc" --command "SELECT t.id,COALESCE(s.like_count,0) AS canonical_count,(SELECT COUNT(*) FROM likes l WHERE l.track_id=t.id) AS relation_count,d.likes AS derived_count,json_extract(d.row_json,'$.like_count') AS derived_json_count FROM tracks t LEFT JOIN track_stats s ON s.track_id=t.id LEFT JOIN explore_derived_tracks d ON d.id=t.id WHERE t.is_public=1 AND t.status='published' LIMIT 201" --json > "$RUNNER_TEMP/canonical147.json"
          for sort in latest popular;do
            curl -fsS --retry 3 --max-time 25 -D "$RUNNER_TEMP/$sort.head" -o "$RUNNER_TEMP/api-$sort.json" -H 'Origin: https://preview.soridraw.com' "https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed?sort=$sort&limit=40&__soridraw_r2_only=108"
          done
          node <<'NODE'
          const fs=require('fs'),r=process.env.RUNNER_TEMP;
          const rows=JSON.parse(fs.readFileSync(r+'/canonical147.json','utf8')).flatMap(x=>x.results||[]);
          if(rows.length!==37)throw Error('public total drift '+rows.length);
          const baseline=new Map(rows.map(x=>[String(x.id),Number(x.canonical_count)]));
          for(const x of rows){
            const c=Number(x.canonical_count);
            if([x.relation_count,x.derived_count,x.derived_json_count].some(v=>Number(v)!==c))throw Error('canonical vs relation or derived mismatch');
          }
          for(const sort of ['latest','popular']){
            const payload=JSON.parse(fs.readFileSync(r+'/api-'+sort+'.json','utf8'));
            if(payload.ok===false)throw Error('API '+sort+' returned error');
            const items=payload?.data?.items||[];
            if(items.length!==37||new Set(items.map(x=>String(x.id||x.trackId||''))).size!==37)throw Error('live '+sort+' cardinality drift');
            for(const item of items){
              const id=String(item.id||item.trackId||''),count=Number(item.likeCount??item.stats?.likeCount??0);
              if(!baseline.has(id)||count!==baseline.get(id))throw Error('live '+sort+' count mismatch');
            }
            console.log('LIVE_'+sort.toUpperCase()+'_ALL_37_CANONICAL_LIKE_PARITY=PASS');
          }
          console.log('CANONICAL_RELATION_DERIVED_37=PASS');
          console.log('D1_WRITE=0 R2_WRITE=0');
          NODE
      - name: Verify pinned 071 source and protected live Workers unchanged
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | cut -d' ' -f1)"
          test "$actual" = "$expected"
          test "$actual" = b170d05385c3096a98033675a9acbb63b40148bf782017c326845b7ea4c17813
          active(){
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$1/deployments" | jq -er '.result.deployments[0].versions|max_by(.percentage)|select(.percentage>=99.99)|.version_id'
          }
          test "$(active soridraw-explore-preview)" = f0a910a4-104e-47f7-8e3b-2c2c6454d8cf
          test "$(active soridraw-explore-test)" = 6e8dca9c-2c58-42ea-ae7d-765e10afef8f
          test "$(active soridraw-explore-api)" = d6b0a284-6e3c-4b57-aebf-0a7d1c3513e0
          test "$(curl -fsS -H 'Cache-Control: no-cache' https://preview.soridraw.com/app-version.json | node -pe "JSON.parse(require('fs').readFileSync(0)).version")" = 124
          echo 'WORKER_PIN=PASS; PREVIEW_LIVE_STILL_070=PASS; TEST_PRODUCTION_UNCHANGED=PASS; APP_LIVE_STILL_124=PASS'
          echo 'DEPLOY=0 FIREBASE_WRITE=0'
