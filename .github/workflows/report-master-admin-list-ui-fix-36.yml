name: Report master admin list UI fix 36

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    if: github.event.issue.title == 'REPORT MASTER ADMIN LIST UI FIX 36'
    runs-on: ubuntu-latest
    steps:
      - name: Report run status
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow apply-master-admin-list-ui-fix-36.yml --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > /tmp/runs.json
          gh issue comment "$ISSUE_URL" --body "$(cat /tmp/runs.json)"
