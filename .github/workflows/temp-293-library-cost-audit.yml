name: TEMP app293 Library Cost Audit
on:
  push:
    branches: [preview]
    paths:
      - 'src/services/playlistService.ts'
      - 'src/pages/SunoLibraryPage.tsx'
      - 'src/pages/FavoritesPage.tsx'
      - 'database.rules.json'
      - 'scripts/verify-293-library-playlist-delta-cost.mjs'
      - '.github/workflows/temp-293-library-cost-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: app293 focused verifier
        run: node scripts/verify-293-library-playlist-delta-cost.mjs
      - name: Library playlist zero-read regression
        run: node scripts/verify-101-library-playlist-zero-read.mjs
      - name: Library warm-cache regression
        run: node scripts/verify-030-library-warm-cache-no-idle-read.mjs
      - name: Music Note + Library warm-cost regression
        run: node scripts/verify-116-music-note-library-warm-cost.mjs
      - name: Music Note detail batching regression
        run: node scripts/verify-031-music-note-detail-batched-draft.mjs
      - name: app289 heart regression
        run: node scripts/verify-289-music-note-compact-heart-sync.mjs
      - name: app290 Recent batching regression
        run: node scripts/verify-290-recent-edit-batch.mjs
      - name: app290 Studio heart regression
        run: node scripts/verify-290-studio-heart-batch.mjs
      - name: app291 lyrics preview regression
        run: node scripts/verify-291-recent-lyrics-live-preview.mjs
      - name: Build
        run: npm run build
