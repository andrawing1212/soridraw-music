concurrency:
  group: soridraw-408-preview-safe-repair
  cancel-in-progress: false
jobs:
  product-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout pinned code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app
        run: npm ci --no-audit --no-fund
      - name: Check exact entry syntax
        run: |
          node --check cloudflare/explore-worker/canonical/preview-entry.js
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node --check cloudflare/explore-worker/patches/060-shared-profile-r2-parity.mjs
          node --check cloudflare/explore-worker/patches/062-shared-track-card-r2.mjs
          node --check scripts/verify-412-shared-projection-cas.mjs
          node scripts/verify-412-shared-projection-cas.mjs
          node --check scripts/verify-413-like-exit-flush.mjs
          node scripts/verify-413-like-exit-flush.mjs
          node --check scripts/verify-414-pending-only-lifecycle.mjs
          node scripts/verify-414-pending-only-lifecycle.mjs
      - name: Stage419 isolated actual-171 SQL cutover regression
        run: |
          node --check cloudflare/explore-worker/runtime/like-d1only-batch-adapter-420.mjs
          node --check scripts/verify-419-like-w2-cutover.mjs
          node scripts/verify-419-like-w2-cutover.mjs
          node --check cloudflare/explore-worker/runtime/like-public-r2-publisher-421.mjs
          node --check cloudflare/explore-worker/runtime/like-batch-composition-422.mjs
          node scripts/verify-421-like-r2-publisher.mjs
          node scripts/verify-423-personal-like-r2.mjs
          node scripts/verify-424-like-rtdb-signal.mjs
      - name: Stage420 two-hour like abuse policy (pure source; not server enforcement)
        run: |
          node scripts/verify-420-like-abuse-policy.mjs
          node scripts/verify-420-server-like-abuse-gate.mjs
          node scripts/verify-420-permit-renewal.mjs
          node scripts/verify-420-approval-recovery.mjs
          node scripts/verify-420-journal-cost-envelope.mjs
          node scripts/verify-420-atomic-ledger-candidate.mjs
          node scripts/verify-420-atomic-cutover-barrier.mjs
          node scripts/verify-420-permit-expiry-replay.mjs
          node scripts/verify-420-private-rules-candidate.mjs
          node scripts/verify-420-guarded-transport.mjs
          node scripts/verify-420-mandatory-upgrade.mjs
          node scripts/verify-420-master-policy.mjs
          node scripts/verify-420-master-ui.mjs
          node scripts/prepare-420-held-alert-policy.mjs --self-test
      - name: Stage416 five-minute private candidate and server clock (source only)
        run: |
          node --check cloudflare/explore-worker/runtime/private-window-gate-416.mjs
          node scripts/verify-416-private-5min-batch.mjs
          node scripts/verify-416-shared-writer-d1.mjs
          node scripts/verify-416-private-rtdb-batch.mjs
          node scripts/verify-416-client-rtdb-binding.mjs
          node scripts/verify-416-private-like-intent.mjs
          node scripts/verify-401-cross-device-opposite-like.mjs
          node scripts/verify-402-private-heart-count-pair.mjs
          node scripts/verify-416-canonical-no-early-flush.mjs
          node scripts/verify-416-server-rtdb-seal.mjs
          node scripts/verify-416-server-only-click.mjs
          node scripts/verify-416-private-callable-master.mjs
          node scripts/verify-416-private-handoff-atomic.mjs
          node scripts/verify-416-cross-env-ordering.mjs
          node scripts/verify-432-stage416-settlement-stale-cache.mjs
          node scripts/verify-433-stage416-public-5min-gap.mjs
          node scripts/verify-434-stage416-public-window-core.mjs
          node scripts/verify-435-stage416-public-window-register.mjs
          node scripts/verify-436-stage416-public-register-checkpoint.mjs
          node scripts/verify-437-stage416-public-projection.mjs
          node scripts/verify-438-stage416-public-release.mjs
          node scripts/verify-439-stage416-public-release-routing.mjs
          node scripts/verify-440-stage416-public-window-coalescing.mjs
          node scripts/verify-444-stage416-master-public-e2e.mjs
          node scripts/verify-445-stage416-activation-release-infra.mjs
          node scripts/verify-416-public-function-inventory.mjs selftest
          node scripts/verify-441-stage416-public-manifest-scale.mjs
          node scripts/verify-416-private-final-publisher.mjs
          node scripts/verify-416-public-coalescing-gap.mjs
          node scripts/verify-416-finalize-e2e.mjs
          node scripts/verify-416-signed-worker-issuer.mjs
          node scripts/verify-416-complete-private-window.mjs
          node scripts/verify-416-private-deadline.mjs
          node scripts/verify-explore-like-noop-render.mjs
          node scripts/verify-416-private-task-routing.mjs
          node scripts/verify-416-expired-window-requeue-e2e.mjs
          node scripts/verify-411-stage416-controlled-proof.mjs
          node scripts/verify-416-preview-backend-release.mjs
          node scripts/verify-416-worker-route-runtime.mjs
          node scripts/verify-416-like-batch-master.mjs
      - name: Firebase Functions TypeScript build for isolated Stage420 server source
        run: |
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
      - name: Verify large Music Note shared-folder first-match semantics and cost
        run: node scripts/verify-music-note-shared-dedup-linear.mjs
      - name: Verify lazy generation settings loading behavior
        run: node scripts/verify-studio-generation-modal-lazy.mjs
      - name: Verify lazy Master diagnostics original reset behavior
        run: node scripts/verify-217-cache-live-update-reset.mjs
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify active PREVIEW guest browser smoke (on-demand only)
        if: contains(github.event.head_commit.message, '[browser-smoke]')
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          node scripts/verify-393-preview-browser-smoke.mjs
          node scripts/verify-393-modal-component-browser.mjs
          node scripts/verify-394-split-chrome.mjs
      - name: Strict existing personal-like and catalog contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-127-atomic-personal-like.mjs
          node scripts/verify-175-explore-like-catalog-reentry.mjs
          node scripts/verify-180-like-live-signal-and-cached-paint.mjs
          node scripts/verify-412-stale-like-outbox-gate.mjs
      - name: 191 and remaining frozen like contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-178-final-like-architecture.mjs
          node scripts/verify-191-bounded-public-like-convergence.mjs
          node scripts/verify-192-cross-account-public-like-live.mjs
          node scripts/verify-197-new-public-track-like.mjs
          node scripts/verify-390-like-acceptance-receipt.mjs
          node scripts/verify-417-bounded-like-proof.mjs
      # Stage418: a release will edit shared RTDB rules only after comparing
      # the actual remote policy. Check the same condition here READ ONLY,
      # before any Worker/Hosting version is promoted.
      - name: Authenticate Firebase for read-only shared Rules audit
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Verify live shared RTDB Rules are additive-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds_path = os.environ.get('GOOGLE_GHA_CREDS_PATH') or os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
          if not creds_path:
              raise SystemExit('Firebase read-only credential path missing')
          creds = service_account.Credentials.from_service_account_file(
              creds_path,
              scopes=['https://www.googleapis.com/auth/firebase.database',
                      'https://www.googleapis.com/auth/userinfo.email'])
          creds.refresh(Request())
          url='https://soridraw-app-866a5-default-rtdb.firebaseio.com/.settings/rules.json'
          response=requests.get(url,params={'access_token':creds.token},timeout=30)
          if response.status_code != 200:
              raise SystemExit('Shared RTDB Rules read-only GET failed HTTP '+str(response.status_code))
          Path(os.environ['RUNNER_TEMP'], 'rtdb-live-418.json').write_text(
              response.text,encoding='utf-8')
          print('418_SHARED_RTDB_LIVE_READ_ONLY=PASS')
          PY
          node scripts/verify-418-rtdb-rules-delta.mjs "$RUNNER_TEMP/rtdb-live-418.json"
      - name: Confirm no product deployment
        run: echo '408_QUALITY=PASS;NO_DEPLOYMENT;NO_SHARED_DATA_CHANGE'
