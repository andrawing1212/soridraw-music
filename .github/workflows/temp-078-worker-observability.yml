name: TEMP 078 Worker Observability Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-078-worker-observability.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - name: Query recent PREVIEW Worker 5xx logs read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const to=Date.now();
          const from=to-(4*60*60*1000);
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/observability/telemetry/query`;
          async function run(filters, needle, label){
            const body={
              queryId:`soridraw-078-${label}-${to}`,
              timeframe:{from,to},
              view:'events',
              limit:100,
              dry:true,
              parameters:{
                datasets:['cloudflare-workers'],
                filterCombination:'and',
                filters,
                needle: needle ? {value:needle,isRegex:false,matchCase:false}:undefined,
                limit:100
              }
            };
            const r=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
            const text=await r.text();
            console.log(`QUERY_${label}_HTTP=${r.status}`);
            if(!r.ok){console.log(text.slice(0,2000));return false;}
            let j; try{j=JSON.parse(text);}catch{console.log(text.slice(0,2000));return false;}
            const events=j?.result?.events?.events||[];
            console.log(`QUERY_${label}_COUNT=${events.length}`);
            for(const e of events){
              const m=e?.$metadata||{};
              const w=e?.$workers||{};
              const out={
                timestamp:e?.timestamp||m?.timestamp||m?.startTime||null,
                script:w?.scriptName||m?.service||null,
                status:m?.statusCode||w?.event?.response?.status||null,
                url:m?.url||w?.event?.request?.url||null,
                trigger:m?.trigger||null,
                level:m?.level||null,
                message:m?.message||null,
                error:m?.error||null,
                outcome:w?.outcome||null
              };
              console.log('EVENT='+JSON.stringify(out));
            }
            return true;
          }
          const statusFilter=[{key:'$metadata.statusCode',operation:'gte',type:'number',value:500}];
          const ok=await run(statusFilter,'/v1/tracks/','TRACK_5XX');
          if(!ok){
            await run([], '/v1/tracks/', 'TRACK_ANY');
          }
          console.log('OBSERVABILITY_READ_ONLY=PASS');
          NODE
