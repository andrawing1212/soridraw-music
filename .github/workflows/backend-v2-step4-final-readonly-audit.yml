name: SORIDRAW Backend V2 Step 4 Final Readonly Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step4-final-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Fresh Firestore quota gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import datetime as dt
          import json, os, urllib.parse, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          project=os.environ['FIREBASE_PROJECT_ID']
          creds=service_account.Credentials.from_service_account_file(
              os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
              scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request())
          headers={'Authorization':f'Bearer {creds.token}','X-Goog-User-Project':project,'Accept':'application/json'}
          now=dt.datetime.now(dt.timezone.utc)
          kst=dt.timezone(dt.timedelta(hours=9))
          start=now.astimezone(kst).replace(hour=0,minute=0,second=0,microsecond=0).astimezone(dt.timezone.utc)

          def metric(candidates):
              last=(candidates[0],0,0)
              for name in candidates:
                  params={'filter':f'metric.type = "{name}"','interval.startTime':start.isoformat().replace('+00:00','Z'),'interval.endTime':now.isoformat().replace('+00:00','Z'),'view':'FULL','pageSize':'1000'}
                  r=requests.get(f'https://monitoring.googleapis.com/v3/projects/{project}/timeSeries?{urllib.parse.urlencode(params)}',headers=headers,timeout=20)
                  if r.status_code in (400,404):
                      continue
                  r.raise_for_status()
                  total=points=0
                  for series in r.json().get('timeSeries',[]):
                      for p in series.get('points',[]):
                          raw=p.get('value',{}).get('int64Value',p.get('value',{}).get('doubleValue',0))
                          try: total += max(0,float(raw))
                          except Exception: pass
                          points += 1
                  last=(name,round(total),points)
                  if points: return last
              return last

          reads=metric(['firestore.googleapis.com/document/read_ops_count','firestore.googleapis.com/document/read_count'])
          writes=metric(['firestore.googleapis.com/document/write_ops_count','firestore.googleapis.com/document/write_count'])
          deletes=metric(['firestore.googleapis.com/document/delete_ops_count','firestore.googleapis.com/document/delete_count'])
          safe_read=min(10000,max(0,50000-reads[1]-10000))
          result={'kstDate':now.astimezone(kst).date().isoformat(),'reads':reads[1],'writes':writes[1],'deletes':deletes[1],'safeReadCap':safe_read,'requiredReads':2500}
          print('STEP4_FINAL_QUOTA='+json.dumps(result,ensure_ascii=False))
          if reads[2] == 0 or writes[2] == 0 or safe_read < 2500:
              raise SystemExit('STEP4_FINAL_QUOTA_BLOCKED')
          print('STEP4_FINAL_QUOTA_GATE=PASS')
          PY

      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts

      - name: Verify M-005 temporary cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -f src/m005PreviewSessionPostcheck.tsx
          ! grep -R --line-number --fixed-strings 'm005-postcheck' src/main.tsx src 2>/dev/null
          if find .github/workflows -maxdepth 1 -type f -iname '*m005*' -print | grep -q .; then
            echo 'M005_TEMP_WORKFLOW_REMAINS'
            find .github/workflows -maxdepth 1 -type f -iname '*m005*' -print
            exit 1
          fi
          grep -q "createRoot(document.getElementById('root')!).render" src/main.tsx
          echo 'STEP4_M005_TEMP_CLEANUP=PASS'

      - name: Read-only final V1 V2 and Library audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const projectId=process.env.FIREBASE_PROJECT_ID;
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          initializeApp({ credential:applicationDefault(), projectId });
          const db=getFirestore();
          const stable=/^sd_[0-9a-f]{32}$/;
          const activeFavorite=d=>Boolean(d && d.saved !== false && d.favoriteRemoved !== true);
          const legacyId=path=>`v1f_${crypto.createHash('sha256').update(path).digest('hex').slice(0,32)}`;
          const forbidden=/^(googleGeminiApiKey|geminiApiKey|apiKey|accessToken|idToken|refreshToken|authorization|password|secret)$/i;
          const hasForbidden=(value)=>{
            if (Array.isArray(value)) return value.some(hasForbidden);
            if (!value || typeof value !== 'object') return false;
            return Object.entries(value).some(([k,v])=>forbidden.test(k) || hasForbidden(v));
          };
          const toMs=(v)=>{
            if (!v) return 0;
            if (typeof v === 'number' && Number.isFinite(v)) return v;
            if (typeof v?.toMillis === 'function') return v.toMillis();
            if (typeof v?.seconds === 'number') return v.seconds*1000 + Math.floor(Number(v.nanoseconds||0)/1e6);
            const parsed=new Date(v).getTime();
            return Number.isFinite(parsed)?parsed:0;
          };
          const trackMs=(d)=>Number(d?.createdAtMs||0)||toMs(d?.createdAt)||Number(d?.updatedAtMs||0)||toMs(d?.updatedAt)||0;
          const idsForTrack=(docId,d)=>new Set([docId,d?.firestoreId,d?.id,d?.trackId,d?.sunoTrackId].map(v=>String(v||'').trim()).filter(Boolean));
          const idsForBundle=(d)=>new Set([d?.firestoreId,d?.id,d?.trackId,d?.sunoTrackId].map(v=>String(v||'').trim()).filter(Boolean));
          const overlaps=(a,b)=>[...a].some(x=>b.has(x));

          const [favSnap,recentSnap,v2Snap,listSnap,itemSnap,structureSnap,userSnap,trackSnap,bundleSnap]=await Promise.all([
            db.collection('favorites').get(),
            db.collection('user_recent_songs').get(),
            db.collectionGroup('songs').get(),
            db.collectionGroup('lists').get(),
            db.collectionGroup('items').get(),
            db.collection('user_structures').get(),
            db.collection('users').get(),
            db.collectionGroup('tracks').get(),
            db.collectionGroup('bundles').get(),
          ]);

          const v2Docs=v2Snap.docs.filter(d=>/^users\/[^/]+\/songs\/[^/]+$/.test(d.ref.path));
          const v2ByPath=new Map(v2Docs.map(d=>[d.ref.path,d]));
          const v2ByLegacy=new Map();
          for (const d of v2Docs) {
            const data=d.data()||{};
            const uid=String(data.uid||d.ref.parent.parent?.id||'').trim();
            const lf=String(data.legacyFavoriteId||'').trim();
            if (lf) v2ByLegacy.set(`${uid}|${lf}`,d);
            if (hasForbidden(data)) throw new Error('V2_FORBIDDEN_SECRET_FIELD');
          }

          let favAligned=0,favMissing=0,favStateMismatch=0,favFormulaMismatch=0,stableFavorites=0,activeFavorites=0;
          for (const source of favSnap.docs) {
            const src=source.data()||{};
            const uid=String(src.uid||'').trim();
            if (!uid) throw new Error('FAVORITE_MISSING_UID');
            if (activeFavorite(src)) activeFavorites++;
            const sid=String(src.soridrawSongId||'').trim();
            let target;
            if (stable.test(sid)) {
              stableFavorites++;
              target=v2ByPath.get(`users/${uid}/songs/${sid}`);
            } else {
              target=v2ByLegacy.get(`${uid}|${source.id}`);
              if (target && target.id !== legacyId(source.ref.path)) favFormulaMismatch++;
            }
            if (!target) { favMissing++; continue; }
            if (target.data().musicNote !== activeFavorite(src)) { favStateMismatch++; continue; }
            favAligned++;
          }

          let recentItems=0,recentStable=0,recentStableAligned=0,recentStableMismatch=0;
          for (const bundle of recentSnap.docs) {
            const songs=Array.isArray(bundle.data()?.songs)?bundle.data().songs:[];
            recentItems += songs.length;
            for (const song of songs) {
              const sid=String(song?.soridrawSongId||'').trim();
              if (!stable.test(sid)) continue;
              recentStable++;
              const target=v2ByPath.get(`users/${bundle.id}/songs/${sid}`);
              if (target?.data()?.recentVisible === true) recentStableAligned++;
              else recentStableMismatch++;
            }
          }

          const listDocs=listSnap.docs.filter(d=>/^user_playlists\/[^/]+\/lists\/[^/]+$/.test(d.ref.path));
          const itemDocs=itemSnap.docs.filter(d=>/^user_playlists\/[^/]+\/lists\/[^/]+\/items\/[^/]+$/.test(d.ref.path));
          const listPaths=new Set(listDocs.map(d=>d.ref.path));
          let orphanPlaylistItems=0;
          for (const item of itemDocs) {
            const parentListPath=item.ref.parent.parent?.path || '';
            if (!listPaths.has(parentListPath)) orphanPlaylistItems++;
          }

          const usersById=new Map(userSnap.docs.map(d=>[d.id,d.data()||{}]));
          let structureDocs=0,sectionVersionedDocs=0,sectionTokenMismatch=0,sectionStructures=0,sectionCustomSections=0,sectionCustomTags=0,musicFolderDocs=0,musicFolderShapeErrors=0,myNoteFolderCount=0,sharedNoteFolderCount=0;
          for (const d of structureSnap.docs) {
            structureDocs++;
            const data=d.data()||{};
            const sectionVersion=Number(data.sectionCustomVersion||data.customDataUpdatedAt||0);
            if (sectionVersion>0) {
              sectionVersionedDocs++;
              const remote=Number(usersById.get(d.id)?.syncVersions?.sectionCustom||0);
              if (remote>0 && remote!==sectionVersion) sectionTokenMismatch++;
            }
            const structures=Array.isArray(data.structures)?data.structures:[];
            const customSections=Array.isArray(data.customSections)?data.customSections:[];
            const customTags=Array.isArray(data.customSectionTags)?data.customSectionTags:[];
            sectionStructures += structures.length;
            sectionCustomSections += customSections.length;
            sectionCustomTags += customTags.length;
            if (structures.length>20 || customSections.length>40 || customTags.length>120) throw new Error('SECTION_CUSTOM_BOUND_EXCEEDED');
            const stored=data.musicNoteFolders||{};
            const my=Array.isArray(stored.myNote)?stored.myNote:(Array.isArray(data.myNoteFolders)?data.myNoteFolders:[]);
            const shared=Array.isArray(stored.sharedNote)?stored.sharedNote:(Array.isArray(data.sharedNoteFolders)?data.sharedNoteFolders:[]);
            if (my.length || shared.length) {
              musicFolderDocs++;
              myNoteFolderCount += my.length;
              sharedNoteFolderCount += shared.length;
              const validate=(arr)=>{
                const ids=arr.map(x=>String(x?.id||'').trim());
                return ids.some(x=>!x) || new Set(ids).size!==ids.length;
              };
              if (validate(my) || validate(shared)) musicFolderShapeErrors++;
            }
          }

          const sourceTracks=trackSnap.docs.filter(d=>/^suno_tracks\/[^/]+\/tracks\/[^/]+$/.test(d.ref.path));
          const sourcesByUid=new Map();
          for (const d of sourceTracks) {
            const uid=d.ref.parent.parent?.id||'';
            if (!uid) continue;
            const arr=sourcesByUid.get(uid)||[];
            arr.push({doc:d,data:d.data()||{}});
            sourcesByUid.set(uid,arr);
          }
          const libraryBundles=bundleSnap.docs.filter(d=>/^user_list_caches\/[^/]+\/bundles\/library_latest_10_sets$/.test(d.ref.path));
          const libraryBundleByUid=new Map(libraryBundles.map(d=>[d.ref.parent.parent?.id||'',d]));
          let libraryUsers=0,libraryMissingNewest=0,libraryNoOverlap=0,libraryVersionBehind=0,libraryBundleItemCount=0;
          const libraryDetails=[];
          for (const [uid,entries] of sourcesByUid.entries()) {
            libraryUsers++;
            entries.sort((a,b)=>trackMs(b.data)-trackMs(a.data));
            const latest=entries.slice(0,10);
            const bdoc=libraryBundleByUid.get(uid);
            if (!bdoc) { libraryMissingNewest++; libraryNoOverlap++; libraryDetails.push({uidSuffix:uid.slice(-6),source:entries.length,bundle:0,newest:false,overlap:0,versionMatch:false}); continue; }
            const bdata=bdoc.data()||{};
            const items=Array.isArray(bdata.items)?bdata.items:[];
            libraryBundleItemCount += items.length;
            const itemIds=items.map(idsForBundle);
            const newestIds=idsForTrack(latest[0].doc.id,latest[0].data);
            const newestPresent=itemIds.some(ids=>overlaps(newestIds,ids));
            if (!newestPresent) libraryMissingNewest++;
            let overlap=0;
            for (const entry of latest) {
              const sourceIds=idsForTrack(entry.doc.id,entry.data);
              if (itemIds.some(ids=>overlaps(sourceIds,ids))) overlap++;
            }
            if (overlap===0) libraryNoOverlap++;
            const bundleVersion=Number(bdata.updatedAtMs||0);
            const remoteVersion=Number(usersById.get(uid)?.syncVersions?.library||0);
            const versionMatch=remoteVersion===0 || bundleVersion===remoteVersion;
            if (remoteVersion>0 && bundleVersion<remoteVersion) libraryVersionBehind++;
            libraryDetails.push({uidSuffix:uid.slice(-6),source:entries.length,bundle:items.length,newest:newestPresent,overlap,versionMatch,bundleVersion,remoteVersion});
          }

          const result={
            favorites:{total:favSnap.size,active:activeFavorites,stable:stableFavorites,aligned:favAligned,missing:favMissing,stateMismatch:favStateMismatch,formulaMismatch:favFormulaMismatch},
            recent:{bundles:recentSnap.size,items:recentItems,stableItems:recentStable,stableAligned:recentStableAligned,stableMismatch:recentStableMismatch},
            v2:{total:v2Docs.length},
            playlists:{headers:listDocs.length,items:itemDocs.length,orphanItems:orphanPlaylistItems},
            structures:{docs:structureDocs,sectionVersionedDocs,sectionTokenMismatch,sectionStructures,sectionCustomSections,sectionCustomTags,musicFolderDocs,myNoteFolderCount,sharedNoteFolderCount,musicFolderShapeErrors},
            library:{sourceTracks:sourceTracks.length,bundles:libraryBundles.length,users:libraryUsers,bundleItems:libraryBundleItemCount,missingNewest:libraryMissingNewest,noOverlap:libraryNoOverlap,versionBehind:libraryVersionBehind,details:libraryDetails},
            firestoreWrites:0,firestoreDeletes:0,rulesDeploys:0,functionsDeploys:0,hostingDeploys:0,
          };
          console.log('STEP4_FINAL_DATA='+JSON.stringify(result));

          const hardAnomaly=favMissing || favStateMismatch || favFormulaMismatch || recentStableMismatch || orphanPlaylistItems || sectionTokenMismatch || musicFolderShapeErrors || libraryMissingNewest || libraryNoOverlap || libraryVersionBehind;
          if (hardAnomaly) throw new Error('STEP4_FINAL_DATA_ANOMALY');
          console.log('STEP4_FINAL_DATA_PARITY=PASS');
          NODE

      - name: Exact production build and M-004 bundle audit
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/step4-build.log
          test -d dist/assets
          main_bytes=$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s\n' | sort -nr | head -1)
          largest_js=$(find dist/assets -maxdepth 1 -type f -name '*.js' -printf '%s %f\n' | sort -nr | head -1)
          main_bytes=${main_bytes:-0}
          echo "STEP4_M004_MAIN_INDEX_BYTES=${main_bytes}"
          echo "STEP4_M004_LARGEST_JS=${largest_js}"
          if grep -q 'Some chunks are larger than 1500 kB after minification' /tmp/step4-build.log; then
            echo 'STEP4_M004_LARGE_CHUNK_WARNING=YES'
          else
            echo 'STEP4_M004_LARGE_CHUNK_WARNING=NO'
          fi
          if [ "$main_bytes" -gt 2883584 ]; then
            echo 'STEP4_M004_MATERIAL_GROWTH=YES'
          else
            echo 'STEP4_M004_MATERIAL_GROWTH=NO'
          fi
          echo 'STEP4_PRODUCTION_BUILD=PASS'

      - name: Prove read-only scope
        run: |
          echo 'STEP4_FINAL_FIRESTORE_WRITES=0'
          echo 'STEP4_FINAL_FIRESTORE_DELETES=0'
          echo 'STEP4_FINAL_RULES_DEPLOYS=0'
          echo 'STEP4_FINAL_FUNCTIONS_DEPLOYS=0'
          echo 'STEP4_FINAL_HOSTING_DEPLOYS=0'
          echo 'STEP4_FINAL_MAIN_CHANGES=0'

# trigger after workflow registration
