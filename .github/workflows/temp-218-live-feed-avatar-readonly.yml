name: TEMP 218 Live Feed Avatar Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-218-live-feed-avatar-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      API_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare live Feed owner avatars with public profiles
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const clean=v=>String(v||'').trim();
          const api=process.env.API_BASE;
          const readJson=async url=>{
            const r=await fetch(url,{headers:{Accept:'application/json'}});
            if(!r.ok) throw new Error(url+' HTTP '+r.status);
            return r.json();
          };
          const sorts=['latest','popular'];
          let totalMismatch=0;
          for(const sort of sorts){
            const feed=await readJson(api+'/v1/feed?sort='+sort+'&limit=40');
            const items=feed?.data?.items||[];
            const owners=new Map();
            for(const item of items){
              const uid=clean(item.ownerUid||item.owner_uid);
              if(!uid || owners.has(uid)) continue;
              owners.set(uid,{
                uid,
                feedAvatar:clean(item.ownerAvatarUrl||item.avatarUrl||item.owner_avatar_url),
                handle:clean(item.ownerHandle||item.owner_handle)
              });
            }
            const rows=[];
            for(const owner of owners.values()){
              const profile=await readJson(api+'/v1/profiles/'+encodeURIComponent(owner.uid)+'/first-view?limit=1');
              const p=profile?.data?.profile||{};
              const profileAvatar=clean(p.avatarUrl||p.avatar_url);
              const match=owner.feedAvatar===profileAvatar;
              if(!match) totalMismatch++;
              rows.push({
                uid:owner.uid,
                handle:clean(p.handle)||owner.handle,
                match,
                feedHost:(()=>{try{return new URL(owner.feedAvatar).host}catch{return owner.feedAvatar?'non-url':''}})(),
                profileHost:(()=>{try{return new URL(profileAvatar).host}catch{return profileAvatar?'non-url':''}})()
              });
            }
            console.log(sort.toUpperCase()+'_OWNER_AVATAR_ROWS='+JSON.stringify(rows));
            console.log(sort.toUpperCase()+'_OWNER_AVATAR_MISMATCH='+rows.filter(x=>!x.match).length);
          }
          console.log('TOTAL_OWNER_AVATAR_MISMATCH='+totalMismatch);
          console.log('READ_ONLY=true');
          NODE
