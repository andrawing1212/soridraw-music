        run: node scripts/verify-studio-generation-modal-lazy.mjs
      - name: Verify lazy Master diagnostics original reset behavior
        run: node scripts/verify-217-cache-live-update-reset.mjs
      - name: Verify app500 durable authentication quota recovery
        run: node scripts/verify-498-auth-storage-recovery.mjs
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify active PREVIEW guest browser smoke (on-demand only)
        if: contains(github.event.head_commit.message, '[browser-smoke]')
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          node scripts/verify-393-preview-browser-smoke.mjs
          node scripts/verify-393-modal-component-browser.mjs
          node scripts/verify-394-split-chrome.mjs
      - name: Strict existing personal-like and catalog contracts
        shell: bash
        run: |
          set -euo pipefail
