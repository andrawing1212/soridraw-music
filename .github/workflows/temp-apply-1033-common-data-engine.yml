name: Temp Verify Common Data Engine 1034

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-apply-1033-common-data-engine.yml']

permissions:
  contents: write

jobs:
  apply_test_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 5

      - name: Apply 1034 revision proof
        run: python3 .deploy/apply-1034-user-data-engine-revision-proof.py

      - name: Static correctness guards
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SORIDRAW_USER_DATA_ENGINE_REVISION_PROOF_1034' src/lib/userDataEngine.ts >/dev/null
          grep -F 'readKnownRemoteCatalogRevision' src/lib/userDataEngine.ts >/dev/null
          grep -F 'Boolean(previousCompleteSnapshot)' src/lib/userDataEngine.ts >/dev/null
          ! grep -A20 -F 'const unsaveUpdates = sanitizeForFirestore({' src/App.tsx | grep -F 'createdAtMs: unsavedAt'
          grep -F 'persistRecentSongsDocument' src/App.tsx >/dev/null
          grep -F "operation: 'music-note-unsave'" src/App.tsx >/dev/null
          echo 'STATIC_1034_GUARDS=PASS'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: App build
        run: npm run build

      - name: Commit verified refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add src/lib/userDataEngine.ts
          git diff --cached --check
          git commit -m 'fix(preview): harden catalog revision and completeness proof'
          git push origin HEAD:preview
