name: Cloudflare Media R2 Preview Deploy

# app517: NEVER deploy a Worker merely because source was merged into preview.
# Only a manual dispatch, with a pinned SHA and explicit deploy confirmation.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Approved 40-character commit SHA on preview (not a branch)'
        required: true
        type: string
      approve_preview_deploy:
        description: 'Type DEPLOY_PREVIEW_MEDIA to authorize this specific deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Shared across preview deployment and all-three-worker cutover. Never
  # overlap a legacy preview rollback with TEST/PRODUCTION activation.
  group: soridraw-media-shared-r2-mutation
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.approve_preview_deploy == 'DEPLOY_PREVIEW_MEDIA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      BUCKET: soridraw-media-preview
      CATALOG_BUCKET: soridraw-user-catalog
      WORKER_URL: https://soridraw-media-preview.andrawing1212.workers.dev
    steps:
      - name: Checkout explicitly approved commit (no moving preview HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify SHA is exact and reachable from preview
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Expected exact 40-character commit SHA'; exit 2; }
          test "$(git rev-parse HEAD)" = "${APPROVED_SHA,,}" || { echo 'Checkout SHA mismatch'; exit 2; }
          git fetch origin preview --no-tags --quiet
          git merge-base --is-ancestor "$APPROVED_SHA" FETCH_HEAD || { echo 'SHA not in preview'; exit 2; }
          echo "APPROVED_PREVIEW_SHA=$APPROVED_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install media Worker dependencies
        working-directory: cloudflare/media-worker
        run: npm install --no-audit --no-fund

      - name: Validate Worker build
        working-directory: cloudflare/media-worker
        run: npm run check

      - name: Preflight shared Catalog authority compatibility (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-356-shared-private-catalog-authority.mjs

      - name: Verify existing private R2 bindings (no bucket creation)
        working-directory: cloudflare/media-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          npx wrangler r2 bucket info "$BUCKET" --json > "$RUNNER_TEMP/r2-info.json"
          npx wrangler r2 bucket info "$CATALOG_BUCKET" --json > "$RUNNER_TEMP/catalog-r2-info.json"
          node - "$RUNNER_TEMP/r2-info.json" "$RUNNER_TEMP/catalog-r2-info.json" <<'NODE'
          const fs = require('fs');
          const media = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const catalog = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if ((media.name || media.result?.name) !== 'soridraw-media-preview'
              || (catalog.name || catalog.result?.name) !== 'soridraw-user-catalog') {
            throw new Error('Unexpected preview R2 buckets');
          }
          console.log('EXISTING_R2_BINDINGS=PASS');
          NODE

      - name: Verify existing media signing secret (no secret creation)
        working-directory: cloudflare/media-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > "$RUNNER_TEMP/media-secrets.json"
          node - "$RUNNER_TEMP/media-secrets.json" <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(list) || !list.some((item) => item?.name === 'MEDIA_SIGNING_SECRET')) {
            throw new Error('Required stable MEDIA_SIGNING_SECRET missing; fail closed');
          }
          console.log('EXISTING_MEDIA_SIGNING_SECRET=PASS');
          NODE

      - name: Enforce source-installed legacy release guard (before any Worker mutation)
        shell: bash
        run: |
          set -euo pipefail
          # An older SHA that lacks the audited controller must never deploy.
          test -f cloudflare/media-worker/src/catalogSharedWriterRolloutGate518.js
          test -f .deploy/release-media-worker-runtime.mjs
          grep -q 'verifyLegacyMediaMutationAllowed518' .deploy/release-media-worker-runtime.mjs
          node scripts/verify-518-shared-writer-rollout.mjs
          # AUTHORITY: immutable hashes are in this workflow, not in the
          # untrusted pinned deployment source being checked out.
          SAFE_MEDIA_BASE_518=430d64e5d7f3f573a8ca1c7c7c4d23561408624e
          git cat-file -e "${SAFE_MEDIA_BASE_518}^{commit}" || { echo 'HOLD_518_SAFE_BASE_UNAVAILABLE'; exit 2; }
          git merge-base --is-ancestor "$SAFE_MEDIA_BASE_518" HEAD || { echo 'HOLD_518_RELEASE_SHA_PREDATES_SAFE_BASE'; exit 2; }
          while read -r expected file; do
            actual="$(git hash-object "$file" 2>/dev/null)" || { echo "HOLD_518_MISSING_SAFE_SOURCE:$file"; exit 2; }
            test "$actual" = "$expected" || { echo "HOLD_518_UNAUDITED_SOURCE_HASH:$file"; exit 2; }
          done <<'AUDITED_MEDIA_GIT_BLOBS_518'
          5baa599744aecf67a90d2f2ee6dcdf614b4b7f7b cloudflare/media-worker/src/index.js
          be1a5f2cfa94a0c62130ff7ed5fe4f1f6f043889 cloudflare/media-worker/src/catalogSharedWriterRolloutGate518.js
          89c55674adcd4e9ec5fb909a04e818333117d1a1 .deploy/release-media-worker-runtime.mjs
          81f2a797c30dfd1d7e700e542bbd29c88987198f cloudflare/media-worker/package.json
          01e6d7a6f280d421cf982552a3c9f2e824f60264 scripts/verify-518-shared-writer-rollout.mjs
          AUDITED_MEDIA_GIT_BLOBS_518
          echo 'PREVIEW_MEDIA_518_SAFE_BASE_AND_BLOBS=PASS'
          echo 'PREVIEW_MEDIA_518_FENCE_SOURCE=PASS'

      - name: Deploy preview media Worker via common guarded release controller
        shell: bash
        run: |
          set -euo pipefail
          node .deploy/release-media-worker-runtime.mjs preview upload | tee "$RUNNER_TEMP/preview-media-upload.log"
          uploaded="$(sed -n 's/^PREVIEW_MEDIA_WORKER_UPLOADED_VERSION=//p' "$RUNNER_TEMP/preview-media-upload.log" | tail -1)"
          [[ "$uploaded" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'No immutable uploaded Worker version'; exit 2; }
          RELEASE_MEDIA_WORKER_VERSION="$uploaded" node .deploy/release-media-worker-runtime.mjs preview activate
          echo 'PREVIEW_MEDIA_DEPLOY_GUARDED=PASS'

      - name: Smoke Worker health and Preview CORS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$WORKER_URL/health" -o "$RUNNER_TEMP/health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/health.json"
          grep -q '"r2Binding":true' "$RUNNER_TEMP/health.json"
          grep -q '"automaticWavGeneration":false' "$RUNNER_TEMP/health.json"
          grep -q '"catalogBinding":true' "$RUNNER_TEMP/health.json"
          shared_flag="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('cloudflare/media-worker/wrangler.jsonc','utf8'));process.stdout.write(String(c.vars.SORIDRAW_SHARED_CATALOG_V1||''))")"
          test "$shared_flag" = '0' -o "$shared_flag" = '1'
          expected_mode='legacy-media'
          [ "$shared_flag" = '1' ] && expected_mode='shared-catalog'
          grep -q "\"catalogAuthorityMode\":\"$expected_mode\"" "$RUNNER_TEMP/health.json"
          node scripts/verify-356-shared-private-catalog-authority.mjs

          code="$(curl -sS -o "$RUNNER_TEMP/options-body" -D "$RUNNER_TEMP/options-head" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://preview.soridraw.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
            "$WORKER_URL/v1/archive/resolve")"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://preview.soridraw.com' "$RUNNER_TEMP/options-head"
          echo 'MEDIA_WORKER_HEALTH_CORS=PASS'

      - name: Safety result
        run: |
          echo 'TARGET_ENV=PREVIEW'
          echo 'R2_BUCKET=soridraw-media-preview'
          echo 'CATALOG_R2_BUCKET=soridraw-user-catalog'
          echo 'R2_PUBLIC_BUCKET=false'
          shared_flag="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('cloudflare/media-worker/wrangler.jsonc','utf8'));process.stdout.write(String(c.vars.SORIDRAW_SHARED_CATALOG_V1||''))")"
          echo "CATALOG_SHARED_CUTOVER=$([ "$shared_flag" = '1' ] && echo true || echo false)"
          echo 'LAZY_ARCHIVE_MIN_AGE_DAYS=14'
          echo 'AUTOMATIC_WAV_GENERATION=false'
          echo 'NO_MUSIC_API_CALL=true'
          echo 'NO_FIRESTORE_WRITE=true'
          echo 'NO_FIREBASE_FUNCTIONS_DEPLOY=true'
          echo 'NO_FIREBASE_HOSTING_DEPLOY=true'
          echo 'NO_MAIN_CHANGE=true'
          echo 'NO_PRODUCTION_CHANGE=true'
