name: TEMP catalog no-fullscan fix

on:
  push:
    branches: ['tmp/catalog-no-fullscan-20260915']
    paths: ['.github/workflows/temp-catalog-no-fullscan-20260915.yml']

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/catalog-no-fullscan-20260915
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch catalog read path
        run: python3 scripts/temp-catalog-no-fullscan-patch.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node --check cloudflare/media-worker/src/index.js
          node scripts/verify-046-catalog-stale-revision-rebuild.mjs
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/userDataEngine.ts cloudflare/media-worker/src/index.js scripts/verify-046-catalog-stale-revision-rebuild.mjs
          git commit -m 'fix: stop catalog page reads from rebuilding firestore'
          git push origin HEAD:tmp/catalog-no-fullscan-20260915
