name: SORIDRAW Backend V2 Step 2-A4d Read-only Gap Review

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4d-readonly-review.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-backend-v2-step2a4d-readonly-review
  cancel-in-progress: false

jobs:
  review:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Authenticate read-only review session
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          create_credentials_file: true

      - name: Fresh same-day Firestore quota gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import datetime as dt
          import json, os, urllib.parse, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          project=os.environ['FIREBASE_PROJECT_ID']
          creds=service_account.Credentials.from_service_account_file(
              os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
              scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request())
          headers={'Authorization':f'Bearer {creds.token}','X-Goog-User-Project':project,'Accept':'application/json'}
          now=dt.datetime.now(dt.timezone.utc)
          kst=dt.timezone(dt.timedelta(hours=9))
          start=now.astimezone(kst).replace(hour=0,minute=0,second=0,microsecond=0).astimezone(dt.timezone.utc)

          def metric(candidates):
              last=(candidates[0],0,0)
              for name in candidates:
                  params={'filter':f'metric.type = "{name}"','interval.startTime':start.isoformat().replace('+00:00','Z'),'interval.endTime':now.isoformat().replace('+00:00','Z'),'view':'FULL','pageSize':'1000'}
                  r=requests.get(f'https://monitoring.googleapis.com/v3/projects/{project}/timeSeries?{urllib.parse.urlencode(params)}',headers=headers,timeout=20)
                  if r.status_code in (400,404): continue
                  r.raise_for_status()
                  total=points=0
                  for series in r.json().get('timeSeries',[]):
                      for p in series.get('points',[]):
                          raw=p.get('value',{}).get('int64Value',p.get('value',{}).get('doubleValue',0))
                          try: total += max(0,float(raw))
                          except Exception: pass
                          points += 1
                  last=(name,round(total),points)
                  if points: return last
              return last

          reads=metric(['firestore.googleapis.com/document/read_ops_count','firestore.googleapis.com/document/read_count'])
          writes=metric(['firestore.googleapis.com/document/write_ops_count','firestore.googleapis.com/document/write_count'])
          deletes=metric(['firestore.googleapis.com/document/delete_ops_count','firestore.googleapis.com/document/delete_count'])
          result={'kstDate':now.astimezone(kst).date().isoformat(),'reads':reads[1],'writes':writes[1],'deletes':deletes[1],'readPoints':reads[2],'writePoints':writes[2],'policy':{'readsMax':40000,'writesMax':10000,'deletesMax':5000,'estimatedReviewReadsMax':2000}}
          print('A4D_FRESH_QUOTA='+json.dumps(result,ensure_ascii=False))
          if reads[2] == 0 or writes[2] == 0: raise SystemExit('quota metrics incomplete')
          if reads[1] >= 40000 or writes[1] >= 10000 or deletes[1] >= 5000: raise SystemExit('fresh quota gate blocked')
          print('A4D_FRESH_QUOTA_GATE=PASS')
          PY

      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts

      - name: Read-only V1-V2 gap analysis
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const projectId=process.env.FIREBASE_PROJECT_ID;
          initializeApp({credential:applicationDefault(),projectId});
          const db=getFirestore();
          const stable=/^sd_[0-9a-f]{32}$/;
          const reserved=new Set(['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','v2MutationId','legacyRecentIndex','legacyFavoriteId','legacyFavoriteKey']);
          const activeFavorite=(d)=>Boolean(d && d.saved !== false && d.favoriteRemoved !== true);
          const norm=(v)=>{
            if (v === null || v === undefined) return v ?? null;
            if (typeof v?.toMillis === 'function') return {__timestampMs:v.toMillis()};
            if (typeof v?.path === 'string' && v.constructor?.name === 'DocumentReference') return {__ref:v.path};
            if (typeof v?.latitude === 'number' && typeof v?.longitude === 'number') return {__geo:[v.latitude,v.longitude]};
            if (Buffer.isBuffer(v)) return {__bytes:v.toString('base64')};
            if (Array.isArray(v)) return v.map(norm);
            if (typeof v === 'object') {
              const out={};
              for (const k of Object.keys(v).sort()) out[k]=norm(v[k]);
              return out;
            }
            return v;
          };
          const equal=(a,b)=>JSON.stringify(norm(a))===JSON.stringify(norm(b));
          const payloadMismatch=(src,dst)=>{
            if (!dst) return true;
            for (const [k,v] of Object.entries(src||{})) {
              if (reserved.has(k)) continue;
              if (!Object.prototype.hasOwnProperty.call(dst,k) || !equal(v,dst[k])) return true;
            }
            return false;
          };

          const [favSnap,recentSnap,v2Snap]=await Promise.all([
            db.collection('favorites').get(),
            db.collection('user_recent_songs').get(),
            db.collectionGroup('songs').get(),
          ]);

          const v2Docs=v2Snap.docs.filter(d=>/^users\/[^/]+\/songs\/[^/]+$/.test(d.ref.path));
          const v2ByPath=new Map(v2Docs.map(d=>[d.ref.path,{id:d.id,uid:d.ref.parent.parent?.id||'',data:d.data()||{}}]));
          const v2ByStable=new Map();
          const v2ByLegacyFavorite=new Map();
          let v2LegacyRecent=0,v2LegacyFavorite=0,v2Stable=0;
          for (const d of v2Docs) {
            const data=d.data()||{};
            if (stable.test(d.id)) {v2Stable++; v2ByStable.set(`${d.ref.parent.parent?.id||''}|${d.id}`,{id:d.id,data});}
            if (typeof data.legacyFavoriteId === 'string' && data.legacyFavoriteId) {v2LegacyFavorite++; v2ByLegacyFavorite.set(`${String(data.uid||d.ref.parent.parent?.id||'')}|${data.legacyFavoriteId}`,{id:d.id,data});}
            if (Object.prototype.hasOwnProperty.call(data,'legacyRecentIndex')) v2LegacyRecent++;
          }

          const favoriteStats={total:favSnap.size,stableSource:0,legacySource:0,stableAligned:0,stableMissing:0,stableStateMismatch:0,stablePayloadMismatch:0,legacyAligned:0,legacyMissing:0,legacyStateMismatch:0,legacyPayloadMismatch:0,missingUid:0};
          const eligibleTargets=new Set();
          const liveFavoriteIdsByUid=new Set();
          for (const d of favSnap.docs) {
            const src=d.data()||{};
            const uid=String(src.uid||'').trim();
            if (!uid) {favoriteStats.missingUid++; continue;}
            liveFavoriteIdsByUid.add(`${uid}|${d.id}`);
            const sid=String(src.soridrawSongId||'').trim();
            const wantMusicNote=activeFavorite(src);
            if (stable.test(sid)) {
              favoriteStats.stableSource++;
              const target=v2ByStable.get(`${uid}|${sid}`);
              if (!target) {favoriteStats.stableMissing++; eligibleTargets.add(`${uid}|${sid}`); continue;}
              const stateMismatch=target.data.musicNote !== wantMusicNote;
              const pMismatch=payloadMismatch(src,target.data);
              if (stateMismatch) favoriteStats.stableStateMismatch++;
              if (pMismatch) favoriteStats.stablePayloadMismatch++;
              if (stateMismatch || pMismatch) eligibleTargets.add(`${uid}|${sid}`); else favoriteStats.stableAligned++;
            } else {
              favoriteStats.legacySource++;
              const target=v2ByLegacyFavorite.get(`${uid}|${d.id}`);
              if (!target) {favoriteStats.legacyMissing++; eligibleTargets.add(`legacy:${uid}|${d.id}`); continue;}
              const stateMismatch=target.data.musicNote !== wantMusicNote;
              const pMismatch=payloadMismatch(src,target.data);
              if (stateMismatch) favoriteStats.legacyStateMismatch++;
              if (pMismatch) favoriteStats.legacyPayloadMismatch++;
              if (stateMismatch || pMismatch) eligibleTargets.add(`${uid}|${target.id}`); else favoriteStats.legacyAligned++;
            }
          }

          let orphanLegacyFavoriteV2=0,orphanLegacyMusicNoteTrue=0;
          for (const d of v2Docs) {
            const data=d.data()||{};
            const legacyId=String(data.legacyFavoriteId||'').trim();
            if (!legacyId) continue;
            const uid=String(data.uid||d.ref.parent.parent?.id||'').trim();
            if (!liveFavoriteIdsByUid.has(`${uid}|${legacyId}`)) {
              orphanLegacyFavoriteV2++;
              if (data.musicNote === true) {orphanLegacyMusicNoteTrue++; eligibleTargets.add(`${uid}|${d.id}`);}
            }
          }

          const recentStats={bundles:recentSnap.size,totalItems:0,stableItems:0,positionalLegacyExcluded:0,stableAligned:0,stableMissing:0,stableStateMismatch:0,stablePayloadMismatch:0,missingUidBundles:0};
          for (const d of recentSnap.docs) {
            const uid=d.id;
            if (!uid) {recentStats.missingUidBundles++; continue;}
            const songs=Array.isArray(d.data()?.songs)?d.data().songs:[];
            recentStats.totalItems += songs.length;
            for (const song of songs) {
              const sid=String(song?.soridrawSongId||'').trim();
              if (!stable.test(sid)) {recentStats.positionalLegacyExcluded++; continue;}
              recentStats.stableItems++;
              const target=v2ByStable.get(`${uid}|${sid}`);
              if (!target) {recentStats.stableMissing++; eligibleTargets.add(`${uid}|${sid}`); continue;}
              const stateMismatch=target.data.recentVisible !== true;
              const pMismatch=payloadMismatch(song,target.data);
              if (stateMismatch) recentStats.stableStateMismatch++;
              if (pMismatch) recentStats.stablePayloadMismatch++;
              if (stateMismatch || pMismatch) eligibleTargets.add(`${uid}|${sid}`); else recentStats.stableAligned++;
            }
          }

          const summary={
            favorites:favoriteStats,
            recent:recentStats,
            v2:{canonicalSongDocs:v2Docs.length,stableDocs:v2Stable,legacyFavoriteDocs:v2LegacyFavorite,legacyRecentDocs:v2LegacyRecent,orphanLegacyFavoriteV2,orphanLegacyMusicNoteTrue},
            proposedCatchup:{uniqueTargetWrites:eligibleTargets.size,writeCapRecommendation:Math.max(10,Math.min(100,eligibleTargets.size)),positionalLegacyRecentWrites:0},
            safety:{v1Authoritative:true,v1DeletesPlanned:0,v2DeletesPlanned:0,positionalLegacyRecentExcluded:true,wholeCollectionRewrite:false}
          };
          console.log('A4D_GAP_SUMMARY='+JSON.stringify(summary));
          console.log('A4D_READONLY_FIRESTORE_WRITES=0');
          console.log('A4D_READONLY_FIRESTORE_DELETES=0');
          console.log('A4D_READONLY_RULES_DEPLOYS=0');
          console.log('A4D_READONLY_FUNCTIONS_DEPLOYS=0');
          console.log('A4D_READONLY_HOSTING_DEPLOYS=0');
          NODE

      - name: Prove read-only scope
        if: always()
        run: |
          echo 'A4D_REVIEW_MODE=READ_ONLY'
          echo 'A4D_V1_WRITES=0'
          echo 'A4D_V1_DELETES=0'
          echo 'A4D_V2_WRITES=0'
          echo 'A4D_V2_DELETES=0'
          echo 'A4D_RULES_DEPLOYS=0'
          echo 'A4D_FUNCTIONS_DEPLOYS=0'
          echo 'A4D_HOSTING_DEPLOYS=0'
