name: OPS Preview Vocal Mobile V9

on:
  push:
    branches: [ops-preview-vocal-mobile-v8]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current preview vocal markup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview
          git switch --detach origin/preview
          echo "PREVIEW_HEAD=$(git rev-parse HEAD)"
          echo '--- vocalMembers contexts ---'
          grep -n -B 14 -A 44 'vocalMembers' src/App.tsx | head -n 700 || true
          echo '--- vocal member grid class in App ---'
          grep -n -B 8 -A 20 'soridraw-vocal-member-grid' src/App.tsx || true
          echo '--- member count label contexts ---'
          grep -n -B 10 -A 50 '멤버 (' src/App.tsx | head -n 300 || true
