name: Production title candidate and remaining connections (GET only)
on:
  push:
    branches: [qa/production-title-compatibility-20261128]
    paths: ['.github/workflows/qa-production-title-compatibility-20261128.yml', 'scripts/qa-production-title-compatibility-20261128.mjs']
permissions:
  contents: read
concurrency:
  group: soridraw-production-title-read-only
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'andrawing1212/soridraw-music' && github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check scripts/qa-production-title-compatibility-20261128.mjs
      - uses: google-github-actions/auth@v2
        id: firebase
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token
      - name: GET-only pinned module preparation and binding review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
        run: node scripts/qa-production-title-compatibility-20261128.mjs
