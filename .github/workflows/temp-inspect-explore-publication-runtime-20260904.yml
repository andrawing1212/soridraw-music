name: SORIDRAW Inspect Explore Publication Runtime 2026-09-04

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-explore-publication-runtime-20260904.yml']

permissions:
  contents: write

env:
  ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
  DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect live PREVIEW D1 and latest Explore feed
        run: |
          set -euo pipefail
          mkdir -p .deploy
          node <<'NODE' > .deploy/explore-live-publication-inspection-20260904.json
          const A=process.env.ACCOUNT,DB=process.env.DB_ID,T=process.env.CLOUDFLARE_API_TOKEN;
          const out={inspectedAt:new Date().toISOString()};
          async function cfQuery(sql,params=[]){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${A}/d1/database/${DB}/query`,{method:'POST',headers:{Authorization:`Bearer ${T}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
            const text=await r.text(); let x={}; try{x=JSON.parse(text)}catch{};
            if(!r.ok||x.success===false) throw new Error(`D1 ${r.status}: ${text.slice(0,800)}`);
            const result=Array.isArray(x.result)?x.result[0]:x.result; return Array.isArray(result?.results)?result.results:[];
          }
          async function feed(){
            const u='https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed?sort=latest&limit=40';
            const r=await fetch(u,{headers:{Origin:'https://preview.soridraw.com',Accept:'application/json','Cache-Control':'no-cache'}}); const text=await r.text(); let x={}; try{x=JSON.parse(text)}catch{};
            if(!r.ok) throw new Error(`feed ${r.status}: ${text.slice(0,800)}`);
            const items=Array.isArray(x?.data?.items)?x.data.items:[];
            return {status:r.status,cache:r.headers.get('x-soridraw-cache')||r.headers.get('cf-cache-status')||null,count:items.length,match:items.filter(i=>String(i?.title||'').includes('골목길 탐험대')).map(i=>({id:i.id,title:i.title,publishedAt:i.publishedAt||i.published_at,ownerUid:i.ownerUid||i.owner_uid})),top10:items.slice(0,10).map(i=>({id:i.id,title:i.title,publishedAt:i.publishedAt||i.published_at}))};
          }
          (async()=>{
            try{out.d1Matches=await cfQuery(`SELECT t.id,t.owner_uid,t.source_type,t.source_id,t.title,t.is_public,t.status,t.published_at,p.is_public AS profile_is_public,p.nickname FROM tracks t LEFT JOIN public_profiles p ON p.uid=t.owner_uid WHERE t.title LIKE ? ORDER BY t.published_at DESC LIMIT 20`,['%골목길 탐험대%']);}catch(e){out.d1Error=String(e?.message||e)}
            try{out.recentMusicNoteTracks=await cfQuery(`SELECT id,title,is_public,status,published_at FROM tracks WHERE source_type='music_note' ORDER BY published_at DESC LIMIT 10`);}catch(e){out.d1RecentError=String(e?.message||e)}
            try{out.latestFeed=await feed();}catch(e){out.feedError=String(e?.message||e)}
            console.log(JSON.stringify(out,null,2));
          })();
          NODE
      - name: Commit live inspection result
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add .deploy/explore-live-publication-inspection-20260904.json
          git commit -m 'chore(preview): record live Explore publication state'
          git push origin HEAD:preview
