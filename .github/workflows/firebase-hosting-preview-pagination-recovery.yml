name: Firebase Preview Pagination Recovery

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-979-music-note-legacy-cache-cursor-recovery.py'
      - '.deploy/apply-980-library-pagination-metadata-recovery.py'
      - '.deploy/apply-981-music-note-load-more-self-heal.py'
      - '.deploy/apply-982-music-note-loaded-metadata-hydration.py'
      - '.deploy/apply-983-music-note-cursor-chain-repair.py'
      - '.deploy/apply-984-music-note-server-first-more.py'
      - '.deploy/apply-985-music-note-normalized-page-chain.py'
      - '.deploy/verify-955-suno-audio-url-auto-recovery.py'
      - '.github/workflows/firebase-hosting-preview-pagination-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-preview-pagination-recovery
  cancel-in-progress: true

jobs:
  build-and-deploy-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Capture official production before preview deploy
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Generate final app source with existing build chain
        run: |
          set -euo pipefail
          npm run prebuild
          grep -Fq 'SORIDRAW_979_MUSIC_NOTE_LEGACY_CACHE_CURSOR_RECOVERY' src/App.tsx
          grep -Fq 'SORIDRAW_981_MUSIC_NOTE_LOAD_MORE_SELF_HEAL' src/App.tsx
          grep -Fq 'SORIDRAW_982_MUSIC_NOTE_LOADED_METADATA_HYDRATION' src/App.tsx
          grep -Fq 'SORIDRAW_982_MUSIC_NOTE_LOADED_METADATA_HYDRATION' src/pages/FavoritesPage.tsx
          grep -Fq 'SORIDRAW_983_MUSIC_NOTE_CURSOR_CHAIN_REPAIR' src/App.tsx
          grep -Fq 'SORIDRAW_983_MUSIC_NOTE_CURSOR_CHAIN_REPAIR' src/pages/FavoritesPage.tsx
          echo '[pagination] 979 + 981 + 982 + 983 generated: PASS'

      - name: Apply normalized Music Note server paging
        run: |
          set -euo pipefail
          python3 .deploy/apply-984-music-note-server-first-more.py
          python3 .deploy/apply-985-music-note-normalized-page-chain.py
          grep -Fq 'SORIDRAW_984_MUSIC_NOTE_SERVER_FIRST_MORE' src/pages/FavoritesPage.tsx
          grep -Fq 'SORIDRAW_985_MUSIC_NOTE_NORMALIZED_PAGE_CHAIN' src/App.tsx
          echo '[pagination] 984 + 985 generated: PASS'

      - name: Apply Library pagination metadata recovery
        run: |
          set -euo pipefail
          python3 .deploy/apply-980-library-pagination-metadata-recovery.py
          grep -Fq 'SORIDRAW_980_LIBRARY_PAGINATION_METADATA_RECOVERY' src/pages/SunoLibraryPage.tsx
          echo '[pagination] 980 generated: PASS'

      - name: Verify normalized Music Note invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx').read_text(encoding='utf-8')
          start = app.index('  const loadMoreFavorites = useCallback(async () => {')
          end = app.index('  const syncMusicNoteIncrementalFromRemoteVersion = useCallback', start)
          block = app[start:end]
          required = [
              "where('uid', '==', currentUser.uid)",
              "orderBy('createdAtMs', 'desc')",
              'const fetchActivePage = async (startCursor: any) => {',
              'if (!isFavoriteSoftRemoved(mapped))',
              'const merged = mergeFavoritePages(baseItems, nextPage.items);',
              'favoritePaginationCursorRef.current = nextPage.cursor || cursor;',
          ]
          for marker in required:
              if marker not in block:
                  raise SystemExit(f'missing normalized Music Note marker: {marker}')
          if "orderBy('createdAt', 'desc')" in block:
              raise SystemExit('mixed-type createdAt still present in Music Note loadMore block')
          print('[pagination] createdAtMs normalized active-song page chain: PASS')
          PY
          grep -Fq 'session.lastDoc = bundle.cursorCreatedAtMs > 0 ? new Date(bundle.cursorCreatedAtMs) : null;' src/pages/SunoLibraryPage.tsx
          grep -Fq 'session.hasMore = bundle.hasMore;' src/pages/SunoLibraryPage.tsx
          grep -Fq 'startAfter(workspaceLastTrackDocRef.current)' src/pages/SunoLibraryPage.tsx
          echo '[pagination] bounded Library paths: PASS'

      - name: Typecheck and build generated source
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx vite build
          echo '[pagination] typecheck + Vite build: PASS'

      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy only soridraw-preview Hosting site
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project soridraw \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo '[pagination] preview Hosting deploy: PASS'

      - name: Smoke custom preview
        run: |
          set -euo pipefail
          ok=''
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 30 https://preview.soridraw.com/ -o "$RUNNER_TEMP/preview.html" \
              && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview.html"; then
              ok='yes'
              break
            fi
            sleep 10
          done
          test "$ok" = 'yes'
          echo '[pagination] preview.soridraw.com smoke: PASS'

      - name: Verify official production unchanged
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo '[pagination] official Firebase production unchanged: PASS'

      - name: Result
        run: |
          echo 'Music Note paging now uses uid + createdAtMs and appends 20 active saved songs per click on soridraw-preview only.'
          echo 'URL/colour restoration is intentionally not part of 985 validation.'
          echo 'No main change, production Hosting release, Functions deploy, Firestore/Database Rules change, or user-data migration in this workflow.'
