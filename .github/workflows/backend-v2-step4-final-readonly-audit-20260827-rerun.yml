name: SORIDRAW Backend V2 Step 4 Final Readonly Audit 20260827 Rerun

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step4-final-readonly-audit-20260827-rerun.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5
      ORIGINAL_STEP4_COMMIT: d950865647a0316c42f2e1de536e4c3580f31c24
      ORIGINAL_STEP4_PATH: .github/workflows/backend-v2-step4-final-readonly-audit-20260827.yml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Run original Step 4 audit with quota-only fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${ORIGINAL_STEP4_COMMIT}"
          git show "${ORIGINAL_STEP4_COMMIT}:${ORIGINAL_STEP4_PATH}" > /tmp/original-step4.yml
          python3 -m pip install --user --disable-pip-version-check -q pyyaml
          python3 - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path

          workflow = yaml.safe_load(Path('/tmp/original-step4.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['audit']['steps']
          wanted = [
              'Fresh Firestore quota gate',
              'Install dependencies without project scripts',
              'Verify M-005 temporary cleanup',
              'Read-only final V1 V2 and Library audit',
              'Exact production build and M-004 bundle audit',
              'Prove read-only scope',
          ]
          by_name = {step.get('name'): step for step in steps if isinstance(step, dict) and step.get('name')}
          missing = [name for name in wanted if name not in by_name]
          if missing:
              raise SystemExit(f'ORIGINAL_STEP4_MISSING_STEPS:{missing}')

          old_gate = 'reads[2] == 0 or writes[2] == 0 or safe_read < 2500'
          new_gate = 'reads[2] == 0 or safe_read < 2500'

          for name in wanted:
              script = by_name[name].get('run')
              if not isinstance(script, str) or not script.strip():
                  raise SystemExit(f'ORIGINAL_STEP4_NO_RUN:{name}')
              if name == 'Fresh Firestore quota gate':
                  if old_gate not in script:
                      raise SystemExit('ORIGINAL_STEP4_QUOTA_EXPRESSION_NOT_FOUND')
                  script = script.replace(old_gate, new_gate, 1)
                  print('STEP4_QUOTA_ZERO_WRITE_FIX=APPLIED', flush=True)
              print(f'===== ORIGINAL STEP START: {name} =====', flush=True)
              subprocess.run(['bash', '-c', 'set -euo pipefail\n' + script], check=True, env=os.environ.copy())
              print(f'===== ORIGINAL STEP PASS: {name} =====', flush=True)

          print('STEP4_ORIGINAL_AUDIT_WITH_QUOTA_FIX=PASS', flush=True)
          PY
