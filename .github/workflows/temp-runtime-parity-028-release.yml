name: SORIDRAW Runtime Parity 028 FINAL PRODUCTION

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-runtime-parity-028-release.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-runtime-parity-028
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FEATURE_SHA: 32b1f7088a4bf4003c52c3a4884b6f5023af15bf
      MAIN_RELEASE_SHA: da3f70ca3e8574f20a5eabf96a4c517c51b4038c
      FIREBASE_PROJECT: soridraw
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TEST_MEDIA_URL: https://soridraw-media-test.andrawing1212.workers.dev
      PROD_MEDIA_URL: https://soridraw-media.andrawing1212.workers.dev
    steps:
      - name: Checkout PREVIEW control
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Guard exact source and promoted MAIN
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a56ceca9e02de442e6bef0ed5f97b082346bd2ec'
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = '.github/workflows/temp-runtime-parity-028-release.yml'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_RELEASE_SHA"
          git cat-file -e "$FEATURE_SHA^{commit}"
          node scripts/verify-runtime-environment-parity-028.mjs
          echo 'FINAL_GUARD_028=PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build exact MAIN release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/main-028"
          git worktree add --detach "$RUNNER_TEMP/main-028" "$MAIN_RELEASE_SHA"
          cd "$RUNNER_TEMP/main-028"
          node scripts/verify-runtime-environment-parity-028.mjs
          npm ci
          npx tsc --noEmit
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/release-index.sha"
          echo 'MAIN_FINAL_BUILD_028=PASS'

      - name: Verify PREVIEW and TEST still match exact MAIN frontend
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for origin in 'https://preview.soridraw.com' 'https://soridraw-test.web.app' 'https://test.soridraw.com'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/" -o "$RUNNER_TEMP/live-check.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/live-check.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 5
            done
            test "$ok" = yes
            echo "FRONTEND_PARITY_PASS=$origin"
          done
          curl -fsS --max-time 30 "$TEST_MEDIA_URL/health" -o "$RUNNER_TEMP/test-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/test-health.json"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://test.soridraw.com' -H 'Access-Control-Request-Method: GET' "$TEST_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '204'
          echo 'TEST_RECHECK_028=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify or repair PRODUCTION media runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028/cloudflare/media-worker"
          npm install --no-audit --no-fund

          check_prod() {
            local ok=''
            for attempt in $(seq 1 15); do
              status="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/prod-health.json" -w '%{http_code}' "$PROD_MEDIA_URL/health" || true)"
              echo "PROD_MEDIA_HEALTH_ATTEMPT=$attempt HTTP=$status BODY=$(head -c 300 "$RUNNER_TEMP/prod-health.json" 2>/dev/null || true)"
              if [ "$status" = '200' ] && grep -q '"ok":true' "$RUNNER_TEMP/prod-health.json"; then ok=yes; break; fi
              sleep 4
            done
            test "$ok" = yes
          }

          if ! check_prod; then
            echo 'PROD_MEDIA_REDEPLOY_REQUIRED=true'
            npx wrangler deploy --env production
            check_prod
          fi

          code="$(curl -sS --max-time 30 -o /dev/null -D "$RUNNER_TEMP/prod-options.headers" -w '%{http_code}' -X OPTIONS -H 'Origin: https://soridraw.com' -H 'Access-Control-Request-Method: GET' "$PROD_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://soridraw.com' "$RUNNER_TEMP/prod-options.headers"
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -H 'Origin: https://soridraw.com' "$PROD_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '401'
          npx wrangler deployments list --env production --json > "$RUNNER_TEMP/prod-deployments.json" || true
          echo 'PRODUCTION_MEDIA_FINAL_028=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy exact MAIN to Firebase PRODUCTION
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.json --non-interactive
          echo 'FIREBASE_PRODUCTION_DEPLOY_028=PASS'

      - name: Verify PRODUCTION exact build and media runtime
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for origin in 'https://soridraw.web.app' 'https://soridraw.com'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/" -o "$RUNNER_TEMP/prod-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/prod-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 5
            done
            test "$ok" = yes
            echo "PRODUCTION_FRONTEND_PASS=$origin"
          done
          curl -fsS --max-time 30 "$PROD_MEDIA_URL/health" -o "$RUNNER_TEMP/prod-health-final.json"
          grep -q '"ok":true' "$RUNNER_TEMP/prod-health-final.json"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://soridraw.com' -H 'Access-Control-Request-Method: GET' "$PROD_MEDIA_URL/v1/catalog/library")"
          test "$code" = '204'
          echo 'PRODUCTION_FULL_STACK_028=PASS'

      - name: Package exact TEST and PRODUCTION ZIPs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028"
          short="$(git rev-parse --short=8 HEAD)"
          git archive --format=zip --output="$RUNNER_TEMP/SORIDRAW_TEST_028_${short}.zip" HEAD
          cp "$RUNNER_TEMP/SORIDRAW_TEST_028_${short}.zip" "$RUNNER_TEMP/SORIDRAW_PRODUCTION_028_${short}.zip"
          sha256sum "$RUNNER_TEMP/SORIDRAW_TEST_028_${short}.zip"
          sha256sum "$RUNNER_TEMP/SORIDRAW_PRODUCTION_028_${short}.zip"
          echo 'RELEASE_ZIPS_FINAL_028=PASS'

      - name: Upload TEST ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_TEST_028
          path: ${{ runner.temp }}/SORIDRAW_TEST_028_*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload PRODUCTION ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PRODUCTION_028
          path: ${{ runner.temp }}/SORIDRAW_PRODUCTION_028_*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Final result
        shell: bash
        run: |
          set -euo pipefail
          echo "FEATURE_SHA=$FEATURE_SHA"
          echo "MAIN_RELEASE_SHA=$MAIN_RELEASE_SHA"
          echo 'PREVIEW_RUNTIME_PARITY=PASS'
          echo 'TEST_RUNTIME_PARITY=PASS'
          echo 'PRODUCTION_RUNTIME_PARITY=PASS'
          echo 'SORIDRAW_RELEASE_028_FINAL=PASS'
