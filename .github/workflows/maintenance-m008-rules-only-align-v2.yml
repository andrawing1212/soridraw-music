name: SORIDRAW Maintenance M-008 Rules-Only Alignment V2

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m008-rules-only-align-v2.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-maintenance-m008-rules-only
  cancel-in-progress: false

jobs:
  align-firestore-rules:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5

    steps:
      - name: Checkout exact preview
        uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20.20.2
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Verify repository canonical-song Rules source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rules = Path('firestore.rules').read_text(encoding='utf-8')
          for marker in [
              'SORIDRAW_BACKEND_V2_STEP2B_ADDITIVE_RULES',
              'function hasValidV2SongMetadata(data)',
              'function ownerCreatesWithoutMigrationProvenance()',
              'function ownerPreservesMigrationProvenance()',
              'match /songs/{songId}',
              'data.schemaVersion == 2',
              'data.musicNote is bool',
              'data.recentVisible is bool',
              'data.v2UpdatedAtMs is int',
              'match /favorites/{favoriteId}',
              'match /user_recent_songs/{uid}',
              'match /user_playlists/{uid}/lists/{playlistId}',
              'match /suno_tracks/{uid}/tracks/{trackId}',
          ]:
              if marker not in rules:
                  raise SystemExit(f'M-008 repository marker missing: {marker}')
          print('M008_REPO_SOURCE=PASS')
          PY

      - name: Authenticate with existing service-account key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          create_credentials_file: true

      - name: Mint direct OAuth token from service-account key
        id: oauth
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds = service_account.Credentials.from_service_account_file(
              os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
              scopes=['https://www.googleapis.com/auth/cloud-platform'],
          )
          creds.refresh(Request())
          token = creds.token
          if not token:
              raise SystemExit('M-008 direct OAuth token mint failed')
          print(f'::add-mask::{token}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'access_token={token}\n')
          print('M008_DIRECT_OAUTH=PASS')
          PY

      - name: Preflight deployed Rules and construct canonical-song-only target
        id: preflight
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.oauth.outputs.access_token }}
        run: |
          set -euo pipefail
          API='https://firebaserules.googleapis.com/v1'
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API/projects/$FIREBASE_PROJECT_ID/releases/cloud.firestore" > /tmp/m008-before-release.json
          RULESET_NAME="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/m008-before-release.json', encoding='utf-8'))
          n=d.get('rulesetName')
          if not n: raise SystemExit('M-008 before release missing rulesetName')
          print(n)
          PY
          )"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API/$RULESET_NAME" > /tmp/m008-before-ruleset.json

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          repo = Path('firestore.rules').read_text(encoding='utf-8').replace('\r\n','\n')
          payload = json.load(open('/tmp/m008-before-ruleset.json', encoding='utf-8'))
          files = payload.get('source',{}).get('files',[])
          if len(files) != 1:
              raise SystemExit(f'M-008 unexpected deployed rules file count: {len(files)}')
          before = files[0].get('content','').replace('\r\n','\n')
          if not before:
              raise SystemExit('M-008 deployed rules content empty')

          start = '      // SORIDRAW_BACKEND_V2_STEP2B_ADDITIVE_RULES'
          end = '      // V2 private playlists.'
          anchor = '    }\n\n    // Vocal tone configuration'
          if repo.count(start) != 1 or repo.count(end) != 1:
              raise SystemExit('M-008 repository V2 block markers not unique')
          canonical = repo[repo.index(start):repo.index(end)]
          if 'match /songs/{songId}' not in canonical:
              raise SystemExit('M-008 canonical extraction failed')
          if 'match /playlists/{playlistId}' in canonical or "settingsId == 'sections'" in canonical:
              raise SystemExit('M-008 extraction exceeded canonical-song scope')

          before_song = 'match /songs/{songId}' in before
          before_playlists = 'match /playlists/{playlistId}' in before
          before_settings = "settingsId == 'sections'" in before
          if before_song:
              target = before
              deploy_needed = False
          else:
              if before.count(anchor) != 1:
                  raise SystemExit(f'M-008 deployed user close anchor mismatch: {before.count(anchor)}')
              target = before.replace(anchor, canonical + anchor, 1)
              if target.replace(canonical, '', 1) != before:
                  raise SystemExit('M-008 narrow-scope reconstruction failed')
              deploy_needed = True

          # Existing V1/deployed content remains untouched; only canonical block may be inserted.
          for marker in [
              'match /favorites/{favoriteId}',
              'match /user_recent_songs/{uid}',
              'match /user_structures/{uid}',
              'match /user_list_caches/{uid}/bundles/{bundleId}',
              'match /user_playlists/{uid}/lists/{playlistId}',
              'match /suno_tracks/{uid}/tracks/{trackId}',
              'match /user_api_keys/{uid}',
          ]:
              if marker not in before or marker not in target:
                  raise SystemExit(f'M-008 V1 preservation marker failed: {marker}')
          if ('match /playlists/{playlistId}' in target) != before_playlists:
              raise SystemExit('M-008 unapproved V2 playlists state change')
          if ("settingsId == 'sections'" in target) != before_settings:
              raise SystemExit('M-008 unapproved V2 settings state change')

          Path('m008.firestore.rules').write_text(target, encoding='utf-8')
          Path('m008.firebase.json').write_text(json.dumps({'firestore': {'rules': 'm008.firestore.rules'}}, indent=2), encoding='utf-8')
          h=lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
          info={
              'beforeRuleset': payload.get('name'),
              'beforeSha256': h(before),
              'targetSha256': h(target),
              'deployNeeded': deploy_needed,
              'beforeHasCanonicalSong': before_song,
              'beforeHasV2Playlists': before_playlists,
              'beforeHasV2Settings': before_settings,
          }
          Path('/tmp/m008-preflight.json').write_text(json.dumps(info), encoding='utf-8')
          print('M008_PREFLIGHT=' + json.dumps(info, ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"deploy_needed={'true' if deploy_needed else 'false'}\n")
              out.write(f"before_sha={info['beforeSha256']}\n")
              out.write(f"target_sha={info['targetSha256']}\n")
          PY

      - name: Deploy Firestore canonical-song Rules only
        if: steps.preflight.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --config m008.firebase.json \
            --non-interactive
          echo 'M008_RULES_ONLY_DEPLOY=PASS'

      - name: Post-deploy exact verification
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.oauth.outputs.access_token }}
        run: |
          set -euo pipefail
          API='https://firebaserules.googleapis.com/v1'
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API/projects/$FIREBASE_PROJECT_ID/releases/cloud.firestore" > /tmp/m008-after-release.json
          RULESET_NAME="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/m008-after-release.json', encoding='utf-8'))
          n=d.get('rulesetName')
          if not n: raise SystemExit('M-008 after release missing rulesetName')
          print(n)
          PY
          )"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API/$RULESET_NAME" > /tmp/m008-after-ruleset.json

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          pre=json.load(open('/tmp/m008-preflight.json',encoding='utf-8'))
          before=json.load(open('/tmp/m008-before-ruleset.json',encoding='utf-8'))['source']['files'][0]['content'].replace('\r\n','\n')
          after_payload=json.load(open('/tmp/m008-after-ruleset.json',encoding='utf-8'))
          after=after_payload['source']['files'][0]['content'].replace('\r\n','\n')
          target=Path('m008.firestore.rules').read_text(encoding='utf-8').replace('\r\n','\n')
          h=lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
          if h(after) != h(target):
              raise SystemExit(f'M-008 post hash mismatch after={h(after)} target={h(target)}')
          for marker in [
              'function hasValidV2SongMetadata(data)',
              'function ownerCreatesWithoutMigrationProvenance()',
              'function ownerPreservesMigrationProvenance()',
              'match /songs/{songId}',
              'data.schemaVersion == 2',
              'data.musicNote is bool',
              'data.recentVisible is bool',
              'data.v2UpdatedAtMs is int',
              'match /favorites/{favoriteId}',
              'match /user_recent_songs/{uid}',
              'match /user_playlists/{uid}/lists/{playlistId}',
              'match /suno_tracks/{uid}/tracks/{trackId}',
          ]:
              if marker not in after:
                  raise SystemExit(f'M-008 post marker missing: {marker}')
          if ('match /playlists/{playlistId}' in after) != pre['beforeHasV2Playlists']:
              raise SystemExit('M-008 post scope violation: playlists state changed')
          if ("settingsId == 'sections'" in after) != pre['beforeHasV2Settings']:
              raise SystemExit('M-008 post scope violation: settings state changed')
          result={
              'beforeRuleset': json.load(open('/tmp/m008-before-ruleset.json',encoding='utf-8')).get('name'),
              'afterRuleset': after_payload.get('name'),
              'beforeSha256': h(before),
              'targetSha256': h(target),
              'afterSha256': h(after),
              'deployNeeded': pre['deployNeeded'],
              'canonicalSongPresentAfter': True,
              'v1Preserved': True,
              'v2PlaylistsStateUnchanged': True,
              'v2SettingsStateUnchanged': True,
          }
          print('M008_POST_VERIFY=' + json.dumps(result, ensure_ascii=False))
          PY

      - name: Prove approved Firebase scope only
        if: always()
        shell: bash
        run: |
          echo 'M008_FIRESTORE_DATA_READS=0'
          echo 'M008_FIRESTORE_DATA_WRITES=0'
          echo 'M008_FIRESTORE_DATA_DELETES=0'
          echo 'M008_RTDB_DATA_CHANGES=0'
          echo 'M008_FUNCTIONS_DEPLOYS=0'
          echo 'M008_HOSTING_DEPLOYS=0'
          echo 'M008_FIRESTORE_INDEX_DEPLOYS=0'
          echo 'M008_APPROVED_SCOPE=firestore_rules_canonical_song_only'
