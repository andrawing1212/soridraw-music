name: SORIDRAW Gate A Dependency Remediation Plan

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-maintenance-gate-a-dependency-plan.yml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Installed vulnerable dependency paths
        shell: bash
        run: |
          set +e
          npm ls axios react-router-dom react-router vite esbuild protobufjs websocket-driver ws @grpc/grpc-js postcss nanoid firebase firebase-admin express jimp --all
          exit 0
      - name: Candidate current registry versions
        shell: bash
        run: |
          set -euo pipefail
          for pkg in axios react-router-dom react-router vite esbuild firebase firebase-admin express jimp protobufjs websocket-driver ws @grpc/grpc-js postcss nanoid; do
            printf 'GATEA_NPM_LATEST %s=' "$pkg"
            npm view "$pkg" version
          done
      - name: Non-mutating audit fix dry-run
        shell: bash
        run: |
          set +e
          npm audit fix --dry-run --ignore-scripts --json > /tmp/audit-fix-dry.json 2>&1
          code=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/audit-fix-dry.json').read_text()
          try:
              d=json.loads(raw)
          except Exception:
              print('GATEA_AUDIT_DRYRUN_PARSE=false')
              print(raw[-12000:])
              raise SystemExit(0)
          print('GATEA_AUDIT_DRYRUN_PARSE=true')
          print('GATEA_AUDIT_DRYRUN_METADATA='+json.dumps(d.get('metadata',{}).get('vulnerabilities',{}),sort_keys=True))
          print('GATEA_AUDIT_DRYRUN_ADDED='+str(d.get('added',0)))
          print('GATEA_AUDIT_DRYRUN_REMOVED='+str(d.get('removed',0)))
          print('GATEA_AUDIT_DRYRUN_CHANGED='+str(d.get('changed',0)))
          PY
          echo "GATEA_AUDIT_DRYRUN_EXIT=$code"
      - name: No-write assertion
        run: |
          git diff --exit-code
          echo 'GATEA_DEP_PLAN_REPO_WRITES=0'
          echo 'GATEA_FIREBASE_IO=0'
