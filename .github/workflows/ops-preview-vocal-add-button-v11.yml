name: OPS Preview Vocal Add Button V11

on:
  push:
    branches: [ops-preview-vocal-add-button-v11]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current preview theme source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview
          git switch --detach origin/preview
          python - <<'PY'
          from pathlib import Path
          for fn in ['src/App.tsx','src/index.css']:
              p=Path(fn); lines=p.read_text(encoding='utf-8').splitlines()
              print('\nFILE',fn)
              keys=['data-soridraw-theme','isDarkMode','darkMode','themeMode','setAttribute','classList.add(\'dark\'','classList.remove(\'dark\'','theme === \'light\'','theme === \'dark\'','studio-black','classic']
              for i,l in enumerate(lines):
                  if any(k in l for k in keys):
                      print(f'{i+1:06d}: {l}')
          PY
