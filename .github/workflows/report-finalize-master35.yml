name: Report finalize master35

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    if: github.event.issue.title == 'REPORT FINALIZE MASTER35'
    runs-on: ubuntu-latest
    steps:
      - name: Report recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --limit 10 --json databaseId,name,status,conclusion,headSha,createdAt,updatedAt,url > /tmp/runs.json
          gh issue comment "$ISSUE_URL" --body "$(cat /tmp/runs.json)"
