name: SORIDRAW Stage416 Live Worker Compatibility Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/stage416-live-worker-compat-readonly.yml'
      - 'scripts/verify-416-live-worker-compatibility.mjs'
      - 'cloudflare/explore-worker/scripts/stage416-ordering-compat-patch.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch active TEST and PRODUCTION Worker source read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {mkdirSync,writeFileSync}=require('node:fs');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN;
          const targets={TEST:'soridraw-explore-test',PRODUCTION:'soridraw-explore-api'};
          async function g(url){
            const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});
            const x=await r.json();
            if(!r.ok||x.success===false)throw Error('CF '+r.status+' '+JSON.stringify(x).slice(0,700));
            return x.result||x;
          }
          (async()=>{
            mkdirSync('.stage416-live',{recursive:true});
            for(const [stage,name] of Object.entries(targets)){
              const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${name}`;
              const ds=await g(base+'/deployments');
              const d=(ds.deployments||ds||[])[0];
              const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
              if(!active?.version_id||Number(active.percentage||0)<99.99)throw Error(stage+' single active version missing');
              const v=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${name}/versions/${active.version_id}?include=modules`);
              const mods=v.modules||[];
              const main=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];
              if(!main?.content_base64)throw Error(stage+' main module unavailable');
              const source=Buffer.from(main.content_base64,'base64').toString('utf8');
              writeFileSync('.stage416-live/'+stage.toLowerCase()+'.js',source);
              console.log(stage+'_ACTIVE_VERSION='+active.version_id);
              console.log(stage+'_SOURCE_BYTES='+Buffer.byteLength(source));
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify Stage416 optional-field compatibility target
        run: |
          node scripts/verify-416-live-worker-compatibility.mjs .stage416-live/test.js TEST
          node scripts/verify-416-live-worker-compatibility.mjs .stage416-live/production.js PRODUCTION

      - name: Dry-run exact compatibility patch against both live Workers
        shell: bash
        run: |
          set -euo pipefail
          cp .stage416-live/test.js .stage416-live/test-patched.js
          cp .stage416-live/production.js .stage416-live/production-patched.js
          node cloudflare/explore-worker/scripts/stage416-ordering-compat-patch.mjs .stage416-live/test-patched.js
          node cloudflare/explore-worker/scripts/stage416-ordering-compat-patch.mjs .stage416-live/production-patched.js
          node --check .stage416-live/test-patched.js
          node --check .stage416-live/production-patched.js
          node scripts/verify-416-live-worker-compatibility.mjs .stage416-live/test-patched.js TEST_PATCHED
          node scripts/verify-416-live-worker-compatibility.mjs .stage416-live/production-patched.js PRODUCTION_PATCHED
          python3 - <<'PY'
          from pathlib import Path
          for stage in ('test','production'):
              before=Path(f'.stage416-live/{stage}.js').read_text()
              after=Path(f'.stage416-live/{stage}-patched.js').read_text()
              marker="json_type(j.value, '$.mutationAt') = 'integer'"
              if marker in before:
                  assert after == before
                  assert before.count(marker) == 1
                  print(stage.upper()+'_416_ALREADY_COMPAT_NO_DIFF=PASS')
                  continue
              assert before != after
              assert after.count(marker) == 1
              # Only the aggregate CTE optional-time projection may change.
              b0=before.index('function exploreLikeAggregateSnapshotCte039')
              a0=after.index('function exploreLikeAggregateSnapshotCte039')
              b1=before.index('\n}\n',b0)+3
              a1=after.index('\n}\n',a0)+3
              assert before[:b0] == after[:a0]
              assert before[b1:] == after[a1:]
              print(stage.upper()+'_416_EXACT_CTE_ONLY_DIFF=PASS')
          PY
          echo 'REMOTE_WRITES=0'
          echo 'WORKER_DEPLOY=0'

      - name: Verify live TEST compatibility smoke and bindings read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N='soridraw-explore-test';
          const EXPECTED='ddd2255a-75cc-4db9-8905-b47338558cb0';
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status+' '+JSON.stringify(x).slice(0,500));return x.result||x}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;
            const ds=await g(base+'/deployments');const d=(ds.deployments||ds||[])[0];
            const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(active?.version_id!==EXPECTED||Number(active?.percentage||0)<99.99)throw Error('TEST active version mismatch '+active?.version_id);
            const settings=await g(base+'/settings');const b=Array.isArray(settings.bindings)?settings.bindings:[];
            const byName=new Map(b.map(x=>[String(x.name),x]));
            const db=byName.get('DB'),rate=byName.get('RATE_DB'),media=byName.get('PROFILE_MEDIA'),cache=byName.get('EXPLORE_CACHE');
            if(String(db?.id||db?.database_id||db?.uuid||'')!=='217ef5b1-5d80-4f7c-afc7-9e07eb05c06b')throw Error('TEST shared DB binding drift');
            if(String(rate?.id||rate?.database_id||rate?.uuid||'')!=='31817dbd-d06e-415e-9bc0-5553b0f5dc43')throw Error('TEST RATE_DB binding drift');
            if(String(media?.bucket_name||media?.bucket||'')!=='soridraw-profile-media')throw Error('TEST shared PROFILE_MEDIA drift');
            if(String(cache?.bucket_name||cache?.bucket||'')!=='soridraw-profile-media-test')throw Error('TEST EXPLORE_CACHE drift');
            if(!byName.has('LIKE_RATE_LIMITER'))throw Error('TEST rate limiter missing');
            if(!byName.has('EXPLORE_LIKE_BATCH_SCHEDULER'))throw Error('TEST scheduler binding missing');
            const feed=await fetch('https://soridraw-explore-test.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1',{headers:{Origin:'https://test.soridraw.com','Cache-Control':'no-cache'}});
            if(feed.status!==200)throw Error('TEST feed HTTP '+feed.status);
            if(String(feed.headers.get('access-control-allow-origin')||'')!=='https://test.soridraw.com')throw Error('TEST feed CORS');
            const w=feed.headers.get('x-soridraw-d1-write');if(w!==null&&String(w).trim()!=='0')throw Error('TEST feed D1 write '+w);
            console.log('TEST_STAGE416_COMPAT_ACTIVE='+EXPECTED);
            console.log('TEST_STAGE416_BINDINGS_UNCHANGED=PASS');
            console.log('TEST_STAGE416_FEED_SMOKE=PASS');
            console.log('REMOTE_WRITES=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Inspect live PRODUCTION binding shape read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N='soridraw-explore-api';
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status+' '+JSON.stringify(x).slice(0,500));return x.result||x}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;
            const settings=await g(base+'/settings');
            const bindings=Array.isArray(settings.bindings)?settings.bindings:[];
            const summary=bindings.map(b=>({type:String(b.type||''),name:String(b.name||''),
              id:String(b.id||b.database_id||b.uuid||''),bucket:String(b.bucket_name||b.bucket||''),
              service:String(b.service||b.service_name||''),namespace_id:String(b.namespace_id||'')}))
              .sort((a,b)=>a.name.localeCompare(b.name));
            console.log('PRODUCTION_BINDING_SHAPE='+JSON.stringify(summary));
            console.log('PRODUCTION_COMPATIBILITY_BINDING_READONLY=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

# stage416-readonly-rerun: 2026-10-12T02:42Z
