name: Diagnose Music Note Active Count Read-only

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - 'functions/scripts/diagnose-music-note-active-count-readonly.cjs'
      - '.github/workflows/diagnose-music-note-active-count-readonly.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-music-note-active-count-readonly
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Authenticate read-only diagnostic session
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Diagnose active vs removed Music Note rows
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
        run: |
          set -euo pipefail
          cd functions
          node scripts/diagnose-music-note-active-count-readonly.cjs

      - name: Confirm no deployment or mutation
        run: |
          echo 'READ-ONLY diagnostic complete.'
          echo 'No Firestore writes/deletes, Rules deploy, Functions deploy, Hosting deploy, main change, or user-data migration performed.'
