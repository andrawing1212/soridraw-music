name: Firebase Functions Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/firebase-functions-deploy.yml

concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    name: Build and deploy Firebase Functions only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build secured Functions entrypoint
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.34.0

      - name: Deploy Firebase Functions only
        run: firebase deploy --only functions --project soridraw-app-866a5 --non-interactive
