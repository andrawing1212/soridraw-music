name: SORIDRAW Backend V2 Step 2-A4c Live Read-only Verify

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4c-live-readonly-verify.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-backend-v2-step2a4c-live-readonly-verify
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Authenticate read-only verification session
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          create_credentials_file: true

      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts

      - name: Verify latest stable-ID Music Note save mirrored into V2
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const projectId = process.env.FIREBASE_PROJECT_ID;
          initializeApp({ credential: applicationDefault(), projectId });
          const db = getFirestore();
          const now = Date.now();
          const cutoff = now - 4 * 60 * 60 * 1000;
          const stableId = /^sd_[0-9a-f]{32}$/;

          const toMillis = (value) => {
            if (typeof value === 'number' && Number.isFinite(value)) return value;
            if (value && typeof value.toMillis === 'function') return value.toMillis();
            return 0;
          };
          const activeFavorite = (data) => data && data.saved !== false && data.favoriteRemoved !== true;

          const favoritesSnap = await db.collection('favorites').get();
          const candidates = favoritesSnap.docs
            .map((docSnap) => {
              const data = docSnap.data() || {};
              const sid = String(data.soridrawSongId || '').trim();
              const ts = toMillis(data.createdAtMs) || toMillis(data.createdAt) || toMillis(data.updatedAtMs) || toMillis(data.updatedAt);
              return { docId: docSnap.id, data, sid, ts };
            })
            .filter((item) => stableId.test(item.sid) && activeFavorite(item.data) && item.ts >= cutoff)
            .sort((a, b) => b.ts - a.ts)
            .slice(0, 10);

          console.log(`A4C_LIVE_VERIFY_FAVORITES_SCANNED=${favoritesSnap.size}`);
          console.log(`A4C_LIVE_VERIFY_RECENT_STABLE_FAVORITE_CANDIDATES=${candidates.length}`);
          if (candidates.length === 0) {
            throw new Error('No recent active V1 favorite carrying a stable soridrawSongId was found in the bounded window.');
          }

          const rows = [];
          const recentCache = new Map();
          for (const candidate of candidates) {
            const uid = String(candidate.data.uid || '').trim();
            if (!uid) continue;
            const v2Snap = await db.doc(`users/${uid}/songs/${candidate.sid}`).get();
            let recentSnap = recentCache.get(uid);
            if (!recentSnap) {
              recentSnap = await db.doc(`user_recent_songs/${uid}`).get();
              recentCache.set(uid, recentSnap);
            }
            const recentSongs = recentSnap.exists && Array.isArray(recentSnap.data()?.songs) ? recentSnap.data().songs : [];
            const recentMatch = recentSongs.find((song) => String(song?.soridrawSongId || '').trim() === candidate.sid) || null;
            const v2 = v2Snap.exists ? (v2Snap.data() || {}) : null;
            const secretKeys = ['googleGeminiApiKey','geminiApiKey','apiKey','accessToken','idToken','refreshToken','authorization','password','secret'];
            const v2HasSecretKey = Boolean(v2 && secretKeys.some((key) => Object.prototype.hasOwnProperty.call(v2, key)));
            rows.push({
              candidate,
              uid,
              v2Exists: v2Snap.exists,
              v2Schema2: v2?.schemaVersion === 2,
              v2MusicNote: v2?.musicNote === true,
              v2RecentVisible: v2?.recentVisible === true,
              v2StableIdMatch: String(v2?.soridrawSongId || '').trim() === candidate.sid,
              v2MutationId: typeof v2?.v2MutationId === 'string' && v2.v2MutationId.length > 0,
              v2UpdatedAtMs: Number(v2?.v2UpdatedAtMs || 0),
              v2HasSecretKey,
              recentStableMatch: Boolean(recentMatch),
            });
          }

          const passing = rows.filter((row) => row.v2Exists && row.v2Schema2 && row.v2MusicNote && row.v2StableIdMatch && row.v2MutationId && !row.v2HasSecretKey);
          console.log(`A4C_LIVE_VERIFY_V2_MIRROR_MATCHES=${passing.length}`);
          if (passing.length === 0) {
            const diagnostic = rows.map((row) => ({
              ageMinutes: Math.round((now - row.candidate.ts) / 60000),
              v2Exists: row.v2Exists,
              v2Schema2: row.v2Schema2,
              v2MusicNote: row.v2MusicNote,
              v2StableIdMatch: row.v2StableIdMatch,
              v2MutationId: row.v2MutationId,
              recentStableMatch: row.recentStableMatch,
            }));
            console.log('A4C_LIVE_VERIFY_DIAGNOSTIC=' + JSON.stringify(diagnostic));
            throw new Error('No bounded V1 favorite candidate has a valid V2 shadow mirror.');
          }

          const latest = passing.sort((a, b) => b.candidate.ts - a.candidate.ts)[0];
          const fingerprint = crypto.createHash('sha256').update(`${latest.uid}\n${latest.candidate.sid}`).digest('hex').slice(0, 12);
          const summary = {
            fingerprint,
            ageMinutes: Math.round((now - latest.candidate.ts) / 60000),
            v1FavoriteStableId: true,
            v1RecentSameStableId: latest.recentStableMatch,
            v2Exists: latest.v2Exists,
            v2SchemaVersion2: latest.v2Schema2,
            v2MusicNote: latest.v2MusicNote,
            v2RecentVisible: latest.v2RecentVisible,
            v2StableIdMatch: latest.v2StableIdMatch,
            v2MutationIdPresent: latest.v2MutationId,
            v2UpdatedAtMsPresent: latest.v2UpdatedAtMs > 0,
            v2ContainsForbiddenSecretKey: latest.v2HasSecretKey,
          };
          console.log('A4C_LIVE_VERIFY_RESULT=' + JSON.stringify(summary));
          console.log('A4C_LIVE_SHADOW_MIRROR=PASS');
          console.log('A4C_LIVE_VERIFY_FIRESTORE_WRITES=0');
          console.log('A4C_LIVE_VERIFY_FIRESTORE_DELETES=0');
          NODE

      - name: Prove deployment scope stayed read-only
        if: always()
        run: |
          echo 'A4C_LIVE_VERIFY_RULES_DEPLOYS=0'
          echo 'A4C_LIVE_VERIFY_FUNCTIONS_DEPLOYS=0'
          echo 'A4C_LIVE_VERIFY_HOSTING_DEPLOYS=0'
