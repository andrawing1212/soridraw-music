name: OPS Preview Vocal Add Button V11

on:
  push:
    branches: [ops-preview-vocal-add-button-v11]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current preview vocal buttons
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview
          git switch --detach origin/preview
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          lines=p.read_text(encoding='utf-8').splitlines()
          hits=[i for i,l in enumerate(lines) if 'data-vocal-add-member' in l or '남성 멤버 추가' in l or '여성 멤버 추가' in l]
          print('HITS', [i+1 for i in hits])
          shown=set()
          for i in hits:
              s=max(0,i-35); e=min(len(lines),i+40)
              if (s,e) in shown: continue
              shown.add((s,e))
              print(f'--- {s+1}-{e} ---')
              for n in range(s,e): print(f'{n+1:06d}: {lines[n]}')
          PY
