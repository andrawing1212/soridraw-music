name: SORIDRAW Backend V2 Step 2-A4 Static Code Review

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2-a4-static-code-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Inspect current mutation boundaries without network or data access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          app = Path('src/App.tsx').read_text(encoding='utf-8')
          cache = Path('src/data/indexedDbLocalCache.ts').read_text(encoding='utf-8')
          repo = Path('src/data/userDataRepository.ts').read_text(encoding='utf-8')
          rules = Path('firestore.rules').read_text(encoding='utf-8')

          def count(pattern, text=app):
              return len(re.findall(pattern, text, flags=re.I | re.M))

          patterns = {
              'recentCollectionMentions': r"user_recent_songs",
              'recentDocWritesNearby': r"(?:setDoc|updateDoc|deleteDoc)\s*\([^\n]{0,300}user_recent_songs|user_recent_songs[^\n]{0,500}(?:setDoc|updateDoc|deleteDoc)",
              'favoritesCollectionMentions': r"favorites",
              'addDocCalls': r"\baddDoc\s*\(",
              'setDocCalls': r"\bsetDoc\s*\(",
              'updateDocCalls': r"\bupdateDoc\s*\(",
              'deleteDocCalls': r"\bdeleteDoc\s*\(",
              'favoriteSyncSignalMentions': r"favoriteSyncSignal",
              'recentSyncVersionMentions': r"syncVersions\.recentSongs|recentSongsSyncVersion|RECENT.*SYNC.*VERSION",
              'musicNoteSyncVersionMentions': r"syncVersions\.musicNote|MUSIC_NOTE.*SYNC.*VERSION",
              'toggleFavoriteMentions': r"toggleFavorite",
              'recentFavoriteIdMentions': r"favoriteFirestoreId",
              'recentPersistNamedHelpers': r"(?:persist|save|flush|sync)[A-Za-z0-9_]*Recent[A-Za-z0-9_]*",
          }
          counts = {key: count(value) for key, value in patterns.items()}

          # Extract only function/declaration lines and Firestore mutation lines around the two V1 domains.
          lines = app.splitlines()
          selected = []
          domain_terms = ('user_recent_songs', "collection(db, 'favorites')", 'favoriteSyncSignal', 'favoriteFirestoreId')
          mutation_terms = ('setDoc(', 'updateDoc(', 'addDoc(', 'deleteDoc(', 'runTransaction(', 'writeBatch(')
          for i, line in enumerate(lines):
              if any(term in line for term in domain_terms):
                  start = max(0, i - 8)
                  end = min(len(lines), i + 9)
                  context = lines[start:end]
                  if any(any(m in x for m in mutation_terms) for x in context) or 'favoriteSyncSignal' in line or 'favoriteFirestoreId' in line:
                      selected.append({
                          'line': i + 1,
                          'context': [f'{start+j+1}:{x.strip()}' for j, x in enumerate(context) if x.strip()][:17],
                      })
          # Keep log bounded.
          selected = selected[:30]

          declarations = []
          for i, line in enumerate(lines):
              if re.search(r'\b(?:const|function)\s+[A-Za-z0-9_]*(?:Recent|Favorite|MusicNote)[A-Za-z0-9_]*', line):
                  if any(k in line.lower() for k in ('save','persist','flush','sync','favorite','recent')):
                      declarations.append(f'{i+1}:{line.strip()}')
          declarations = declarations[:80]

          static = {
              'counts': counts,
              'indexedDbRuntimeEnabled': 'BACKEND_V2_LOCAL_CACHE_RUNTIME_ENABLED = true' in cache,
              'indexedDbStores': re.findall(r"^\s*(\w+):\s*'([^']+)'", cache, flags=re.M),
              'outboxTerms': count(r'outbox|pendingMutation|pendingMutations|mutationQueue', cache),
              'runtimeModeV1Only': "BACKEND_V2_RUNTIME_MODE = 'v1-only'" in repo,
              'v2WriteGateFalse': bool(re.search(r'writeToV2:\s*false', repo)),
              'v1DeleteGateFalse': bool(re.search(r'deleteV1:\s*false', repo)),
              'ownerCreateBlocksLegacyProvenance': 'ownerCreatesWithoutMigrationProvenance' in rules,
              'contexts': selected,
              'declarations': declarations,
          }
          print('STEP2A4_CODE=' + json.dumps(static, ensure_ascii=False))
          print('STEP2A4_CODE_RESULT=' + json.dumps({
              'readOnly': True,
              'networkCalls': 0,
              'firebaseReads': 0,
              'firebaseWrites': 0,
              'firebaseDeletes': 0,
          }))
          PY
