      - 'scripts/verify-518-server-transport.mjs'
      - 'scripts/verify-518-server-bridge.mjs'
      - 'scripts/verify-518-compaction-recovery.mjs'
      - 'scripts/verify-518-compaction-recovery-sql.py'
      - 'scripts/verify-518-hard-delete-receipt.mjs'
      - 'scripts/verify-518-hard-delete-source.mjs'
      - 'scripts/verify-518-indexed-writer.mjs'
      - 'scripts/verify-518-stale-save-delete-race.mjs'
      - 'scripts/verify-518-index-advance-sql.py'
      - 'scripts/verify-518-index-delta-recovery.mjs'
