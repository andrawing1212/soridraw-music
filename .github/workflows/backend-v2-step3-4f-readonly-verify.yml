name: SORIDRAW Backend V2 Step 3-4f Independent Readonly Verify

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4f-readonly-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      EXPECTED_FAVORITES: '738'
      EXPECTED_RECENT_BUNDLES: '10'
      EXPECTED_RECENT_ITEMS: '68'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - run: npm ci --ignore-scripts

      - name: Independent read-only verification
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$TARGET_PROJECT"
          export GCLOUD_PROJECT="$TARGET_PROJECT"
          export GOOGLE_CLOUD_QUOTA_PROJECT="$TARGET_PROJECT"
          node <<'NODE'
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = String(process.env.TARGET_PROJECT || '');
          const bucketName = String(process.env.TARGET_BUCKET || '');
          const backupPrefix = String(process.env.BACKUP_PREFIX || '');
          const expectedManifestHash = String(process.env.EXPECTED_MANIFEST_SHA256 || '');
          const expectedFavorites = Number(process.env.EXPECTED_FAVORITES || 0);
          const expectedRecentBundles = Number(process.env.EXPECTED_RECENT_BUNDLES || 0);
          const expectedRecentItems = Number(process.env.EXPECTED_RECENT_ITEMS || 0);
          if (projectId !== 'soridraw-app-866a5' || bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('TARGET_PIN_MISMATCH');
          if (expectedFavorites !== 738 || expectedRecentBundles !== 10 || expectedRecentItems !== 68) throw new Error('VERIFY_SCOPE_MISMATCH');

          const nonEmptyString = (value) => typeof value === 'string' && value.trim() ? value.trim() : null;
          const stableHash = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const deterministicFavoriteSongId = (path) => `v1f_${stableHash(path).slice(0, 32)}`;
          const deterministicRecentSongId = (uid, path, index) => `v1r_${stableHash(`${uid}\n${path}\n${index}`).slice(0, 32)}`;
          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string', 'boolean'].includes(typeof value)) return value;
            if (typeof value === 'number') {
              if (Number.isNaN(value)) return { __type: 'number', value: 'NaN' };
              if (value === Infinity) return { __type: 'number', value: 'Infinity' };
              if (value === -Infinity) return { __type: 'number', value: '-Infinity' };
              if (Object.is(value, -0)) return { __type: 'number', value: '-0' };
              return value;
            }
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return { __type: 'bytes', base64: Buffer.from(value).toString('base64') };
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return { __type: 'date', iso: value.toISOString() };
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return { __type: 'timestamp', seconds: value.seconds, nanoseconds: value.nanoseconds };
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return { __type: 'geopoint', latitude: value.latitude, longitude: value.longitude };
            if (typeof value?.path === 'string' && value?.firestore) return { __type: 'reference', path: value.path };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));
            throw new Error('UNSUPPORTED_VALUE_TYPE');
          };
          const digest = (value) => stableHash(JSON.stringify(canonicalize(value)));

          const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step34f-readonly-verify-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const bucket = getStorage(app).bucket(bucketName);

            const credential = admin.credential.applicationDefault();
            const token = await credential.getAccessToken();
            const accessToken = String(token?.access_token || '');
            if (!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');
            const requiredPermissions = ['datastore.entities.get', 'datastore.entities.list'];
            const iamResponse = await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify({ permissions: requiredPermissions }),
            });
            const iamText = await iamResponse.text();
            if (!iamResponse.ok) throw new Error(`IAM_TEST_${iamResponse.status}`);
            const granted = new Set((JSON.parse(iamText || '{}').permissions || []).map(String));
            if (requiredPermissions.some((permission) => !granted.has(permission))) throw new Error('READONLY_IAM_MISSING');

            const [manifestBytes] = await bucket.file(`${backupPrefix}/manifest.json`).download();
            if (stableHash(manifestBytes) !== expectedManifestHash) throw new Error('MANIFEST_HASH_MISMATCH');
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            const favoriteDataset = (manifest.datasets || []).find((entry) => entry?.id === 'favorites');
            const recentDataset = (manifest.datasets || []).find((entry) => entry?.id === 'user_recent_songs');
            if (!favoriteDataset || favoriteDataset.documentCount !== expectedFavorites || !recentDataset || recentDataset.documentCount !== expectedRecentBundles) throw new Error('BACKUP_DATASET_MISMATCH');
            const [[favoriteBackupBytes], [recentBackupBytes]] = await Promise.all([
              bucket.file(`${backupPrefix}/${favoriteDataset.fileName}`).download(),
              bucket.file(`${backupPrefix}/${recentDataset.fileName}`).download(),
            ]);
            if (stableHash(favoriteBackupBytes) !== favoriteDataset.sha256 || stableHash(recentBackupBytes) !== recentDataset.sha256) throw new Error('BACKUP_FILE_HASH_MISMATCH');
            const favoriteBackup = favoriteBackupBytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
            const recentBackup = recentBackupBytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
            const favoriteBackupByPath = new Map(favoriteBackup.map((record) => [String(record.path), record.data]));
            const recentBackupByPath = new Map(recentBackup.map((record) => [String(record.path), record.data]));

            const favoritesSnap = await db.collection('favorites').get();
            if (favoritesSnap.size !== expectedFavorites) throw new Error(`LIVE_FAVORITE_COUNT_MISMATCH:${favoritesSnap.size}`);
            const favorites = favoritesSnap.docs.map((doc) => ({ doc, path: doc.ref.path, favoriteId: doc.id, uid: nonEmptyString(doc.data().uid), payload: doc.data(), updateTimeMs: doc.updateTime?.toMillis?.() })).sort((a,b) => a.path.localeCompare(b.path));
            if (favorites.some((favorite) => !favorite.uid || !Number.isInteger(favorite.updateTimeMs))) throw new Error('FAVORITE_OWNER_OR_TIME_INVALID');
            if (favorites.some((favorite) => !favoriteBackupByPath.has(favorite.path) || digest(favoriteBackupByPath.get(favorite.path)) !== digest(favorite.payload))) throw new Error('V1_FAVORITE_DRIFT');

            let verifiedFavorites = 0;
            for (let offset = 0; offset < favorites.length; offset += 100) {
              const chunk = favorites.slice(offset, offset + 100);
              const refs = chunk.map((favorite) => db.doc(`users/${favorite.uid}/songs/${deterministicFavoriteSongId(favorite.path)}`));
              const snaps = await db.getAll(...refs);
              for (let i = 0; i < chunk.length; i += 1) {
                const favorite = chunk[i];
                const snap = snaps[i];
                if (!snap.exists) throw new Error('V2_FAVORITE_MISSING');
                const data = snap.data();
                const stripped = { ...data };
                for (const key of ['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','legacyFavoriteId','legacyFavoriteKey']) delete stripped[key];
                if (digest(stripped) !== digest(favorite.payload)) throw new Error('V2_FAVORITE_PAYLOAD_MISMATCH');
                if (data.schemaVersion !== 2 || data.musicNote !== true || data.recentVisible !== false || data.v2UpdatedAtMs !== favorite.updateTimeMs || data.legacyFavoriteId !== favorite.favoriteId) throw new Error('V2_FAVORITE_METADATA_MISMATCH');
                const favoriteKey = nonEmptyString(favorite.payload.favoriteKey);
                if ((favoriteKey || null) !== (nonEmptyString(data.legacyFavoriteKey) || null)) throw new Error('V2_FAVORITE_KEY_MISMATCH');
                verifiedFavorites += 1;
              }
            }

            const recentSnap = await db.collection('user_recent_songs').get();
            if (recentSnap.size !== expectedRecentBundles) throw new Error('LIVE_RECENT_BUNDLE_COUNT_MISMATCH');
            const recentSongs = [];
            for (const doc of recentSnap.docs.sort((a,b) => a.ref.path.localeCompare(b.ref.path))) {
              const match = /^user_recent_songs\/([^/]+)$/.exec(doc.ref.path);
              if (!match) throw new Error('RECENT_PATH_INVALID');
              const backupData = recentBackupByPath.get(doc.ref.path);
              if (!backupData || digest(backupData) !== digest(doc.data())) throw new Error('V1_RECENT_DRIFT');
              const songs = Array.isArray(doc.data().songs) ? doc.data().songs : [];
              for (let index = 0; index < songs.length; index += 1) recentSongs.push({ uid: match[1], path: doc.ref.path, index, payload: songs[index] });
            }
            if (recentSongs.length !== expectedRecentItems) throw new Error('LIVE_RECENT_ITEM_COUNT_MISMATCH');
            const recentRefs = recentSongs.map((song) => db.doc(`users/${song.uid}/songs/${deterministicRecentSongId(song.uid, song.path, song.index)}`));
            const recentV2 = await db.getAll(...recentRefs);
            let verifiedRecent = 0;
            for (let i = 0; i < recentV2.length; i += 1) {
              const snap = recentV2[i];
              const source = recentSongs[i];
              if (!snap.exists) throw new Error('V2_RECENT_MISSING');
              const data = snap.data();
              const stripped = { ...data };
              for (const key of ['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','legacyRecentIndex']) delete stripped[key];
              if (digest(stripped) !== digest(source.payload) || data.schemaVersion !== 2 || data.musicNote !== false || data.recentVisible !== true || data.legacyRecentIndex !== source.index) throw new Error('V2_RECENT_VERIFY_MISMATCH');
              verifiedRecent += 1;
            }

            console.log('STEP34F_READONLY_VERIFY=' + JSON.stringify({ favoritesSource: favorites.length, favoritesV2Verified: verifiedFavorites, recentSourceItems: recentSongs.length, recentV2Verified: verifiedRecent, v1FavoriteDrift: 0, v1RecentDrift: 0, missing: 0, payloadMismatch: 0, metadataMismatch: 0, firestoreWrites: 0, firestoreDeletes: 0, storageWrites: 0, rulesDeploys: 0, functionsDeploys: 0, hostingDeploys: 0 }));
          })().catch((error) => {
            console.error('STEP34F_READONLY_VERIFY_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          }).finally(async () => {
            await deleteApp(app);
          });
          NODE
