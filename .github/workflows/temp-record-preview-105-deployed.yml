name: TEMP Record PREVIEW 105 Deployed

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-record-preview-105-deployed.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Update current release state
        run: python3 .deploy/record-preview-105-deployed.py
      - name: Commit release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DOCS/CURRENT_RELEASE_STATE.md
          git diff --cached --quiet && { echo 'No release-state change'; exit 1; }
          git commit -m 'docs: record PREVIEW 105 deployment complete'
          git push origin HEAD:preview
