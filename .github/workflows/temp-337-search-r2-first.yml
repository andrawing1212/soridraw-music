name: TEMP 337 Search R2 First Apply

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-337-search-r2-first.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-337-search-r2-first
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Apply app337 Worker patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply_337_search_r2_first.py
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node scripts/verify-337-search-r2-first.mjs

      - name: Regression
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-336-r2-hybrid-read.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-197-new-public-track-like.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-210-targeted-personal-like-settlement.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs

      - name: TypeScript and Build
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build

      - name: Commit verified app337 product and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-337-search-r2-first.yml
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git commit -m 'fix(preview): apply app337 R2-first search runtime'
          git push origin HEAD:preview
          echo "APP337_PRODUCT_COMMIT=$(git rev-parse HEAD)"
