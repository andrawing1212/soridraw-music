name: TEMP 109 Implement Mobile Feed + Refresh Zero

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-109-implement.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-preview-109-implement
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Apply exact 109 repair
        run: |
          python .deploy/apply-109-mobile-feed-refresh-zero.py
          python .deploy/apply-109-verifier-compat.py

      - name: Verify 109 and preserved contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-109-mobile-feed-refresh-zero.mjs
          node scripts/verify-108-explore-feed-cache-recovery.mjs
          node scripts/verify-107-explore-direct-count-zero-read.mjs
          node scripts/verify-105-explore-like-1min.mjs
          node scripts/verify-103-explore-like-event-batch.mjs
          node scripts/verify-user-control-revision-foundation.mjs
          npx tsc --noEmit
          npm run build

      - name: Enforce exact product boundary
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}" > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          public/app-version.json
          scripts/verify-103-explore-like-event-batch.mjs
          scripts/verify-105-explore-like-1min.mjs
          scripts/verify-108-explore-feed-cache-recovery.mjs
          scripts/verify-109-mobile-feed-refresh-zero.mjs
          src/App.tsx
          src/services/exploreSessionCache.ts
          EOF
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          if git diff -- src/App.tsx src/services/exploreSessionCache.ts | grep -E '^[-+].*(className=|\.css|style=)' ; then
            echo 'Unexpected UI/CSS-oriented change' >&2
            exit 1
          fi
          echo '109_EXACT_CHANGE_BOUNDARY=PASS'

      - name: Commit product 109
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/app-version.json scripts/verify-103-explore-like-event-batch.mjs scripts/verify-105-explore-like-1min.mjs scripts/verify-108-explore-feed-cache-recovery.mjs scripts/verify-109-mobile-feed-refresh-zero.mjs src/App.tsx src/services/exploreSessionCache.ts
          git commit -m 'fix: recover mobile Explore cache and zero refresh reads'
          git push origin HEAD:preview
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
