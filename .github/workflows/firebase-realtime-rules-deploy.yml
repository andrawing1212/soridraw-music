name: Firebase Realtime Database Rules Deploy

on:
  issues:
    types: [opened]

concurrency:
  group: firebase-realtime-rules-deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-realtime-rules:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'DEPLOY FIREBASE REALTIME RULES 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Prepare deployment permissions and API
        id: prepare
        shell: bash
        run: |
          set +e
          sa_email=$(jq -r '.client_email // empty' "$GOOGLE_APPLICATION_CREDENTIALS")
          home_project=$(printf '%s' "$sa_email" | sed -E 's/^[^@]+@([^.]+)\.iam\.gserviceaccount\.com$/\1/')
          echo "$sa_email" > active-account.txt
          echo "home_project=$home_project" > prepare.log

          gcloud auth activate-service-account "$sa_email" --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >> prepare.log 2>&1
          activate_code=$?
          echo "activate_code=$activate_code" >> prepare.log

          gcloud services enable firebasedatabase.googleapis.com --project="$home_project" >> prepare.log 2>&1
          api_code=$?
          echo "api_enable_code=$api_code" >> prepare.log

          gcloud projects add-iam-policy-binding soridraw-app-866a5 \
            --member="serviceAccount:${sa_email}" \
            --role="roles/firebasedatabase.admin" \
            --condition=None >> prepare.log 2>&1
          iam_code=$?
          echo "iam_grant_code=$iam_code" >> prepare.log

          echo "api_code=$api_code" >> "$GITHUB_OUTPUT"
          echo "iam_code=$iam_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.34.0

      - name: Deploy Realtime Database rules only
        id: deploy
        shell: bash
        run: |
          set +e
          firebase deploy \
            --only database \
            --project soridraw-app-866a5 \
            --non-interactive 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 60 deploy.log > deploy-tail.log
          tail -n 100 firebase-debug.log > firebase-debug-tail.log 2>/dev/null || true
          exit 0

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        shell: bash
        run: |
          if [ "$EXIT_CODE" = "0" ]; then
            status=success
          else
            status=failure
          fi
          {
            echo "REALTIME_RULES_DEPLOY_RESULT status=${status} run_id=${RUN_ID}"
            echo
            echo 'Active account:'
            echo '```text'
            cat active-account.txt 2>/dev/null || true
            echo '```'
            echo
            echo 'Preparation:'
            echo '```text'
            tail -n 80 prepare.log 2>/dev/null || true
            echo '```'
            echo
            echo 'Deploy output:'
            echo '```text'
            cat deploy-tail.log 2>/dev/null || true
            echo '```'
            echo
            echo 'Firebase debug tail:'
            echo '```text'
            cat firebase-debug-tail.log 2>/dev/null || true
            echo '```'
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file comment.md
          if [ "$EXIT_CODE" != "0" ]; then
            exit "$EXIT_CODE"
          fi
