          new_effect = r'''  const flushAllMusicNoteLocalChangesForPageExit = async () => {
    if (!user?.uid) return;
    const uid = user.uid;
    if (favoriteDetailDraftPersistInFlightRef.current) await favoriteDetailDraftPersistInFlightRef.current;
