name: TEMP 1008 Music Note IO V2

on:
  push:
    branches: [preview-musicnote-save-unsave-io-v2]
    paths:
      - '.github/workflows/temp-1008-musicnote-io-v2.yml'

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-musicnote-save-unsave-io-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply IO reduction
        run: python3 .deploy/temp-1008-musicnote-io-v2.py
      - name: Verify scope and contracts
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/App.tsx src/lib/firestoreMeasured.ts "
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          measured=Path('src/lib/firestoreMeasured.ts').read_text(encoding='utf-8')
          assert "options?: { trustedRecentStudio?: boolean }" in app
          assert 'canTrustRecentStudioLocalIdentity' in app
          assert 'remoteMusicNoteVersion <= localMusicNoteVersion' in app
          assert 'buildRecentFavoriteDocumentId' in app
          assert "setDoc(favoriteDocRef, favoritePayload, { merge: false })" in app
          assert "toggleFavorite(heartSnapshot as SongResult, { trustedRecentStudio: true })" in app
          # Plain heart toggles keep local recent cache but only flush an existing
          # text-edit write. They must not synthesize a new recent server write.
          heart_start=app.index('const handleToggleCurrentStudioFavorite = async')
          heart_end=app.index('const isRecentSongSectionEditing', heart_start)
          heart=app[heart_start:heart_end]
          assert 'const pendingRecentTextWrite = recentSongTextWritePendingRef.current;' in heart
          assert 'if (pendingRecentTextWrite)' in heart
          assert "operation: recentSongTextWritePendingRef.current?.operation || 'pre-favorite-edit'" not in heart
          assert 'saveRecentSongsCache(user.uid' in heart
          # Existing real text edits still retain their server commit helper.
          assert 'const flushRecentSongTextWrite = useCallback' in app
          assert 'persistRecentSongsDocument(ref, pending.songs)' in app
          # Local optimistic listener events are not billed/read-counted.
          assert "snapshot?.metadata?.hasPendingWrites === true" in measured
          print('1008 IO contracts: PASS')
          PY
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit verified source only
        run: |
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/lib/firestoreMeasured.ts
          git commit -m "perf(preview): cut Music Note heart server IO"
          git push origin HEAD:preview-musicnote-save-unsave-io-v2
