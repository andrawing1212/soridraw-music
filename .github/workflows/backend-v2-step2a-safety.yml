name: SORIDRAW Backend V2 Step 2-A Safety

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - 'src/data/**'
      - '.github/workflows/backend-v2-step2a-safety.yml'

permissions:
  contents: write

jobs:
  v1-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Verify Step 2-A safety contract
        id: contract
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('src/data/userDataRepository.ts', 'utf8');
          const required = [
            "BACKEND_V2_RUNTIME_MODE = 'v1-only'",
            'readFromV2: false',
            'writeToV2: false',
            'shadowWriteToV2: false',
            'migrateOnRead: false',
            'deleteV1: false',
          ];
          for (const marker of required) {
            if (!source.includes(marker)) throw new Error(`Missing safety marker: ${marker}`);
          }
          if (/from\s+['\"]firebase\//.test(source) || /from\s+['\"]\.\.\/firebase/.test(source)) {
            throw new Error('Step 2-A scaffold must not import Firebase runtime code');
          }
          console.log('Backend V2 Step 2-A safety contract verified');
          NODE

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success' && steps.contract.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        if: steps.install.outcome == 'success' && steps.contract.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Record safety outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          INSTALL='${{ steps.install.outcome }}'
          CONTRACT='${{ steps.contract.outcome }}'
          TYPECHECK='${{ steps.typecheck.outcome }}'
          BUILD='${{ steps.build.outcome }}'
          if [ "$INSTALL" = success ] && [ "$CONTRACT" = success ] && [ "$TYPECHECK" = success ] && [ "$BUILD" = success ]; then
            STATUS=success
          else
            STATUS=failure
          fi
          {
            echo "status=${STATUS}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "source_commit=${GITHUB_SHA}"
            echo "runtime_mode=v1-only"
            echo "v2_reads=false"
            echo "v2_writes=false"
            echo "v2_shadow_writes=false"
            echo "migrate_on_read=false"
            echo "delete_v1=false"
            echo "install=${INSTALL}"
            echo "contract=${CONTRACT}"
            echo "typecheck=${TYPECHECK}"
            echo "build=${BUILD}"
            echo "firebase_deploy=0"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deploy/backend-v2-step2a-safety.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/backend-v2-step2a-safety.txt
          git commit -m "ci: record Backend V2 Step 2-A safety result" || true
          git pull --rebase origin preview
          git push origin HEAD:preview

      - name: Fail if any safety gate failed
        if: always()
        shell: bash
        run: |
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.contract.outcome }}' = success
          test '${{ steps.typecheck.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
