name: TEMP 081 Prepare Page Exit Batch

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-081-prepare-page-exit-batch.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-081-page-exit-batch
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply 081 client batching
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              return text.replace(old, new, 1)

          # 1) Explore likes: local durable outbox only while page is open.
          p = Path('src/services/exploreLikeService.ts')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, "import { doc, updateDoc } from 'firebase/firestore';", "import { doc, updateDoc } from '../lib/firestoreMeasured';", 'like measured Firestore')
          if 'SORIDRAW_PAGE_EXIT_LIKE_OUTBOX_081_20260914' not in s:
              s = s.replace('// SORIDRAW_EXPLORE_SOCIAL_SNAPSHOT_075_20260913', '// SORIDRAW_EXPLORE_SOCIAL_SNAPSHOT_075_20260913\n// SORIDRAW_PAGE_EXIT_LIKE_OUTBOX_081_20260914', 1)
          count_anchor = "const persistLikeOutbox = (uid: string, outbox: ExploreLikeOutbox) => {"
          idx = s.index(count_anchor)
          # insert count after the persist function, identified by next dispatch helper
          dispatch_anchor = '\nconst dispatchLikeSync = (detail: ExploreLikeSyncEventDetail) => {'
          dispatch_idx = s.index(dispatch_anchor, idx)
          count_code = """

export const getPendingExploreLikeMutationCount = (uid: string): number => Object.values(readLikeOutbox(uid))
  .filter((pending) => pending.desiredLiked !== pending.baseLiked)
  .length;
"""
          if 'export const getPendingExploreLikeMutationCount' not in s:
              s = s[:dispatch_idx] + count_code + s[dispatch_idx:]
          # no automatic network send from timer/read/UI/retry; explicit coordinator flush owns server timing
          s = re.sub(r'^\s*resumePendingLikes\(user\);\s*$', '', s, flags=re.M)
          s = re.sub(r'^\s*schedulePendingLikes\(user(?:,\s*[^;]+)?\);\s*$', '', s, flags=re.M)
          # Add explicit wrapper after flush function and before resume helper.
          resume_anchor = '\nconst resumePendingLikes = (user: User) => {'
          resume_idx = s.index(resume_anchor)
          if 'export const flushPendingExploreLikesForPageExit' not in s:
              wrapper = """

export const flushPendingExploreLikesForPageExit = async (user: User): Promise<void> => {
  clearPendingLikeTimer(user.uid);
  await flushPendingLikes(user);
  if (getPendingExploreLikeMutationCount(user.uid) > 0) {
    throw new Error('좋아요 변경분을 서버에 반영하지 못했습니다. 다음 페이지 이동 또는 재접속에서 다시 시도합니다.');
  }
};
"""
              s = s[:resume_idx] + wrapper + s[resume_idx:]
          p.write_text(s, encoding='utf-8')

          # 2) Publication state: optimistic local state + durable final-state outbox.
          p = Path('src/services/explorePublicationService.ts')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
