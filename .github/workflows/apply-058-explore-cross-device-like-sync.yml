name: Apply 058 Explore Cross Device Like Sync

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-058-explore-cross-device-like-sync.py'
      - '.github/workflows/apply-058-explore-cross-device-like-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-058-explore-cross-device-like-sync
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted cross-device like patch
        run: python3 .deploy/apply-058-explore-cross-device-like-sync.py

      - name: Verify targeted contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_CROSS_DEVICE_REVALIDATION_058_20260911' src/services/exploreLikeService.ts
          grep -Fq 'export const refreshExploreLikedTrackStates' src/services/exploreLikeService.ts
          grep -Fq 'const refreshIds = normalized.filter((trackId) => cache.has(trackId));' src/services/exploreLikeService.ts
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_CROSS_DEVICE_REVALIDATION_058_20260911' src/services/exploreSessionCache.ts
          grep -Fq 'if (previousRevision === nextRevision) return [];' src/services/exploreSessionCache.ts
          grep -Fq 'readTrackLikeCount(previous) !== normalized.likeCount' src/services/exploreSessionCache.ts
          grep -Fq 'revalidateChangedPersonalLikes(likeRevalidationRows);' src/services/exploreSessionCache.ts
          grep -Fq '"version": "058"' public/app-version.json
          if grep -Eq 'setInterval|setTimeout\([^,]+,[[:space:]]*(60000|[0-9]{1,5})' src/services/exploreSessionCache.ts; then
            echo 'Unexpected polling/timer introduced in session cache'
            exit 1
          fi
          echo 'CROSS_DEVICE_PERSONAL_LIKE_TARGETED_REVALIDATION=PASS'
          echo 'NO_POLLING=PASS'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify change boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/services/exploreLikeService\.ts|src/services/exploreSessionCache\.ts|public/app-version\.json)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected generated changes:'
            echo "$bad"
            exit 1
          fi
          echo 'NO_FIREBASE_FUNCTIONS_CHANGE=true'
          echo 'NO_FIRESTORE_SCHEMA_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_WORKER_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'

      - name: Commit actual PREVIEW source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo '058 already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/exploreLikeService.ts src/services/exploreSessionCache.ts public/app-version.json
          git commit -m 'fix: sync personal Explore likes across devices'
          git push origin HEAD:preview
