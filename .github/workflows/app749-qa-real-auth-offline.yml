name: SORIDRAW APP749 Isolated QA Real Firebase Auth (offline only)
on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/explore-worker/experiments/owner-follow-qa-real-auth-749.mjs'
      - 'cloudflare/explore-worker/experiments/owner-follow-qa730-entry.mjs'
      - 'cloudflare/explore-worker/experiments/owner-follow-qa-shadow-778.mjs'
      - 'cloudflare/explore-worker/experiments/owner-follow-qa-ingress-779.mjs'
      - 'scripts/app775-unified-follow-ingress.mjs'
      - 'scripts/verify-778-signed-status-shadow.mjs'
      - 'scripts/verify-779-qa-unified-signed-ingress.mjs'
      - 'scripts/verify-749-qa-real-auth.mjs'
      - 'scripts/app749-qa-real-login-cloudshell.mjs'
      - 'scripts/verify-749-qa-real-login-cloudshell.mjs'
      - 'qa/app749/qa749.html'
      - 'qa/app749/qa749.js'
      - 'qa/app749/qa749.css'
      - 'scripts/app749-qa-hosting-fix-ui-init.mjs'
      - 'scripts/verify-749-qa-hosting-fix-ui-init.mjs'
      - 'scripts/app749-qa-hosting-scoped-csp.mjs'
      - 'scripts/verify-749-qa-hosting-scoped-csp.mjs'
      - 'scripts/__fixtures__/qa749-inline-original.html'
      - 'scripts/app749-qa-hosting-repair-csp.mjs'
      - 'scripts/verify-749-qa-hosting-repair-csp.mjs'
      - 'scripts/app749-qa-hosting-add-page.mjs'
      - 'scripts/verify-749-qa-hosting-add-page.mjs'
      - '.github/workflows/app749-qa-real-auth-offline.yml'
permissions:
  contents: read
jobs:
  public_firebase_keys_readonly:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm actual Google Firebase Auth JWKS JSON (public, GET only)
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const code=readFileSync('cloudflare/explore-worker/experiments/owner-follow-qa-real-auth-749.mjs','utf8');
          const url='https://www.googleapis.com/service_accounts/v1/metadata/jwk/securetoken@system.gserviceaccount.com';
          assert(code.includes("const AUTH_JWKS='"+url+"'"),'APP749_PUBLIC_KEYS_URL_DRIFT');
          const response=await fetch(url,{method:'GET',redirect:'error',
            headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000)});
          assert.equal(response.status,200,'APP749_PUBLIC_KEYS_HTTP_'+response.status);
          const data=await response.json();
          assert(Array.isArray(data?.keys)&&data.keys.length>0&&data.keys.length<=30,
            'APP749_PUBLIC_KEYS_FORMAT');
          assert(data.keys.some(k=>k?.kty==='RSA'&&k?.n&&k?.e&&
            /^[A-Za-z0-9_-]{1,256}$/.test(k?.kid||'')&&
            (!k.alg||k.alg==='RS256')&&(!k.use||k.use==='sig')),
            'APP749_PUBLIC_KEYS_CONTENT_FILTER');
          console.log('APP749_REAL_GOOGLE_FIREBASE_PUBLIC_JWKS=PASS');
          console.log('APP749_QA_SECRETS_AND_USER_DATA=NOT_ACCESSED');
          NODE
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: QA signed Firebase Auth and App Check behavior, no cloud mutations
        run: |
          set -euo pipefail
          node --check cloudflare/explore-worker/experiments/owner-follow-qa-real-auth-749.mjs
          node --check cloudflare/explore-worker/experiments/owner-follow-qa730-entry.mjs
          node --check cloudflare/explore-worker/experiments/owner-follow-qa-shadow-778.mjs
          node --check scripts/verify-778-signed-status-shadow.mjs
          node scripts/verify-778-signed-status-shadow.mjs
          node --check cloudflare/explore-worker/experiments/owner-follow-qa-ingress-779.mjs
          node --check scripts/verify-779-qa-unified-signed-ingress.mjs
          node scripts/verify-779-qa-unified-signed-ingress.mjs
          node --check scripts/app749-qa-real-login-cloudshell.mjs
          node scripts/verify-749-qa-real-login-cloudshell.mjs
          node scripts/verify-749-qa-hosting-fix-ui-init.mjs
          node scripts/verify-749-qa-hosting-scoped-csp.mjs
      - name: Pin historical APP583 QA and build new entry in temporary worktree ONLY
        run: |
          set -euo pipefail
          QA_BASE=4363820117100cb03bcbc44a01e127aeb5de3cf4
          git fetch origin preview --no-tags
          test "$(git rev-parse origin/preview)" = "$QA_BASE" || {
            echo APP749_QA_PREVIEW_BASE_DRIFT_HOLD; exit 2;
          }
          git worktree add --detach "$RUNNER_TEMP/app749-preview" "$QA_BASE"
          cp scripts/app730-source-only-follow-bridge.mjs \
            "$RUNNER_TEMP/app749-preview/scripts/"
          cp scripts/verify-749-qa-real-auth.mjs \
            "$RUNNER_TEMP/app749-preview/scripts/"
          cp scripts/app775-unified-follow-ingress.mjs \
            "$RUNNER_TEMP/app749-preview/scripts/"
          for name in owner-follow-qa730-bridge.mjs owner-follow-qa730-entry.mjs owner-follow-qa-real-auth-749.mjs owner-follow-qa-shadow-778.mjs owner-follow-qa-ingress-779.mjs; do
            cp "cloudflare/explore-worker/experiments/$name" \
              "$RUNNER_TEMP/app749-preview/cloudflare/explore-worker/experiments/"
          done
          (cd "$RUNNER_TEMP/app749-preview" && node scripts/verify-749-qa-real-auth.mjs)
          cd "$RUNNER_TEMP/app749-preview/cloudflare/explore-worker"
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const input=JSON.parse(readFileSync('wrangler.owner-qa-583.json','utf8'));
          assert.equal(input.name,'soridraw-owner-qa-583');
          assert.equal(input.account_id,'b60fcd62c679c64db19f0b0e0c2f3429');
          assert.equal(input.main,'./experiments/owner-follow-isolated-558-entry.mjs');
          assert.deepEqual(input.durable_objects.bindings,
            [{name:'OWNER558_DO',class_name:'OwnerFollowIsolated558'}]);
          assert.equal(input.d1_databases,undefined);
          assert.equal(input.r2_buckets,undefined);
          assert.equal(input.vars.SORIDRAW_ENVIRONMENT,'preview');
          assert.equal(input.vars.SORIDRAW_OWNER_FOLLOW_W2_PUSH_555,'1');
          const candidate={...input,main:'./experiments/owner-follow-qa730-entry.mjs',
            vars:{...input.vars,SORIDRAW_QA749_REAL_AUTH:'1'}};
          writeFileSync('wrangler.app749.json',JSON.stringify(candidate,null,2)+'\n');
          console.log('APP749_QA_CONFIG_EXISTING_DO_NO_SHARED_DB_R2=PASS');
          NODE
          npx --yes wrangler@4.102.0 deploy --dry-run \
            --config wrangler.app749.json \
            --outdir "$RUNNER_TEMP/app749-qa-bundle"
          echo 'APP749_QA_WRANGLER_BUNDLE_ONLY=PASS; QA_DEPLOY=0; REAL_TOKENS=NOT_TESTED'

  qa_live_bounded:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 1254 &&
      github.event.issue.pull_request != null &&
      (startsWith(github.event.comment.body, '/app749-qa-auth ') ||
       startsWith(github.event.comment.body, '/app749-qa-browser '))
    concurrency:
      group: soridraw-app736-qa-zero-traffic
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin main, known isolated QA baseline, and build exact QA config
        env:
          DIRECTOR_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$DIRECTOR_COMMAND" | sed -nE 's#^/app749-qa-(auth|browser) ([0-9a-f]{40})$#\2#p')"
          test -n "$SHA" && test "$SHA" = "$(git rev-parse HEAD)" || exit 2
          test "$SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)" || exit 2
          git fetch origin preview --no-tags
          BASE=4363820117100cb03bcbc44a01e127aeb5de3cf4
          test "$(git rev-parse origin/preview)" = "$BASE" || exit 2
          git worktree add --detach "$RUNNER_TEMP/app749-qa" "$BASE"
          cp scripts/app730-source-only-follow-bridge.mjs "$RUNNER_TEMP/app749-qa/scripts/"
          cp scripts/app775-unified-follow-ingress.mjs "$RUNNER_TEMP/app749-qa/scripts/"
          for name in owner-follow-qa730-bridge.mjs owner-follow-qa730-entry.mjs owner-follow-qa-real-auth-749.mjs owner-follow-qa-shadow-778.mjs owner-follow-qa-ingress-779.mjs; do
            cp "cloudflare/explore-worker/experiments/$name" \
              "$RUNNER_TEMP/app749-qa/cloudflare/explore-worker/experiments/"
          done
          cd "$RUNNER_TEMP/app749-qa/cloudflare/explore-worker"
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const old=JSON.parse(readFileSync('wrangler.owner-qa-583.json','utf8'));
          assert.equal(old.name,'soridraw-owner-qa-583');
          assert.equal(old.account_id,'b60fcd62c679c64db19f0b0e0c2f3429');
          assert.equal(old.main,'./experiments/owner-follow-isolated-558-entry.mjs');
          assert.deepEqual(old.durable_objects.bindings,
            [{name:'OWNER558_DO',class_name:'OwnerFollowIsolated558'}]);
          assert.deepEqual(old.migrations,
            [{tag:'v1',new_sqlite_classes:['OwnerFollowIsolated558']}]);
          assert.deepEqual(old.vars,
            {SORIDRAW_ENVIRONMENT:'preview',SORIDRAW_OWNER_FOLLOW_W2_PUSH_555:'1'});
          assert.equal(old.d1_databases,undefined);
          assert.equal(old.r2_buckets,undefined);
          const qa={...old,main:'./experiments/owner-follow-qa730-entry.mjs',
            vars:{...old.vars,SORIDRAW_QA749_REAL_AUTH:'1'},
            secrets:{required:['OWNER583_QA_CONFIG']}};
          writeFileSync('wrangler.app749-live.json',JSON.stringify(qa,null,2)+'\n');
          console.log('APP749_QA_EXACT_CONFIG_ONLY_NO_SHARED_RESOURCES=PASS');
          NODE
      - name: Verify original APP583 100 percent and exact four QA bindings (GET)
        env:
          CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
        run: node scripts/app735-qa-version-bindings.mjs
      - name: Upload inactive QA candidate and pin immutable version ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b60fcd62c679c64db19f0b0e0c2f3429
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || exit 2
          cd "$RUNNER_TEMP/app749-qa/cloudflare/explore-worker"
          TAG="app749-qa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx --yes wrangler@4.102.0 versions upload \
            --config wrangler.app749-live.json --tag "$TAG" \
            --message 'QA APP749 signed-only login, auto APP583 restore' \
            2>&1 | tee "$RUNNER_TEMP/app749-upload.log"
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const raw=readFileSync(process.env.RUNNER_TEMP+'/app749-upload.log','utf8')
            .replace(/\x1b\[[0-9;]*m/g,'');
          const ids=[...raw.matchAll(/Worker Version ID:\s*([0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12})/g)];
          if(ids.length!==1)throw Error('APP749_QA_UPLOAD_ID_NOT_UNIQUE_HOLD');
          writeFileSync(process.env.RUNNER_TEMP+'/app749-version-id',ids[0][1]+'\n',{mode:0o600});
          console.log('APP749_QA_CANDIDATE_UPLOADED_INACTIVE=PASS');
          NODE
          echo "APP749_VERSION_ID=$(cat "$RUNNER_TEMP/app749-version-id")" >> "$GITHUB_ENV"
      - name: Verify exact five isolated bindings and old 100 percent before cutover (GET)
        env:
          CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const account='b60fcd62c679c64db19f0b0e0c2f3429';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account;
          const id=process.env.APP749_VERSION_ID;
          const required={OWNER558_DO:'durable_object_namespace',
            OWNER583_QA_CONFIG:'secret_text',SORIDRAW_ENVIRONMENT:'plain_text',
            SORIDRAW_OWNER_FOLLOW_W2_PUSH_555:'plain_text',
            SORIDRAW_QA749_REAL_AUTH:'plain_text'};
          const get=async url=>{
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_QA_API_TOKEN,
              Accept:'application/json','Cache-Control':'no-store'},
              signal:AbortSignal.timeout(15000)});
            return {status:r.status,body:await r.json().catch(()=>null)};
          };
          const dep=await get(root+'/workers/scripts/soridraw-owner-qa-583/deployments');
          const vs=dep.body?.result?.deployments?.[0]?.versions;
          if(dep.status!==200||vs?.length!==1||
             vs[0].version_id!=='4ed70845-6a4b-4a80-9c51-ed95d0becc38'||
             Number(vs[0].percentage)<99.99)
            throw Error('APP749_QA_OLD_TRAFFIC_DRIFT_HOLD');
          let ok=false;
          for(let n=0;n<10;n++){
            const r=await get(root+'/workers/workers/soridraw-owner-qa-583/versions/'+id);
            if(r.status===404&&n<9){
              await new Promise(resolve=>setTimeout(resolve,2000));continue;
            }
            const x=r.body?.result;
            if(r.status!==200||r.body?.success!==true||x?.id!==id||
               x.bindings?.length!==5)throw Error('APP749_QA_NEW_VERSION_DRIFT_HOLD');
            const m=new Map(x.bindings.map(b=>[b.name,b.type]));
            if(m.size!==5||Object.entries(required).some(([k,v])=>m.get(k)!==v))
              throw Error('APP749_QA_NEW_BINDINGS_MISMATCH_HOLD');
            if(['DB','PROFILE_MEDIA','RATE_DB','EXPLORE_CACHE'].some(k=>m.has(k)))
              throw Error('APP749_QA_SHARED_BINDING_HOLD');
            ok=true;break;
          }
          if(!ok)throw Error('APP749_QA_VERSION_NOT_VISIBLE_HOLD');
          console.log('APP749_QA_FIVE_BINDINGS_OLD100=PASS');
          NODE
      - name: Activate exact candidate only within isolated QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b60fcd62c679c64db19f0b0e0c2f3429
        run: |
          set -euo pipefail
          ID="$(cat "$RUNNER_TEMP/app749-version-id")"
          [[ "$ID" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]] || exit 2
          node --input-type=module - <<'NODE'
          const id=process.env.APP749_VERSION_ID;
          const uri='https://api.cloudflare.com/client/v4/accounts/'+
            'b60fcd62c679c64db19f0b0e0c2f3429/workers/scripts/'+
            'soridraw-owner-qa-583/versions/'+id;
          let seen=false;
          for(let n=0;n<12;n++){
            const r=await fetch(uri,{headers:{
              Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
              Accept:'application/json','Cache-Control':'no-store'},
              signal:AbortSignal.timeout(15000)});
            if(r.status===200){
              const x=await r.json().catch(()=>null);
              if(x?.success!==true||x?.result?.id!==id)
                throw Error('APP749_QA_WRONG_SCRIPT_VERSION_HOLD');
              seen=true;break;
            }
            if(r.status!==404)throw Error('APP749_QA_SCRIPT_API_HTTP_'+r.status);
            if(n<11)await new Promise(resolve=>setTimeout(resolve,2500));
          }
          if(!seen)throw Error('APP749_QA_SCRIPT_API_NOT_READY_HOLD');
          console.log('APP749_QA_SCRIPT_API_VERSION_EXACT=PASS');
          NODE
          touch "$RUNNER_TEMP/app749-route-attempted"
          cd "$RUNNER_TEMP/app749-qa/cloudflare/explore-worker"
          for attempt in 1 2 3 4 5; do
            log="$RUNNER_TEMP/app749-deploy-$attempt.log"
            if npx --yes wrangler@4.102.0 versions deploy "$ID@100%" \
              --config wrangler.app749-live.json --yes > "$log" 2>&1; then
              echo 'APP749_QA_EXACT_NEW_VERSION_100_PERCENT=PASS';exit 0
            fi
            if grep -Fq '[code: 100146]' "$log" &&
               ! grep -Fq 'Deployed soridraw-owner-qa-583 version' "$log"; then
              echo "APP749_QA_KNOWN_WRANGLER_100146_RETRY=$attempt"
              if [ "$attempt" -lt 5 ]; then sleep 4; fi
              continue
            fi
            echo 'APP749_QA_UNEXPECTED_DEPLOY_FAIL_HOLD';exit 2
          done
          echo 'APP749_QA_CANNOT_ACTIVATE_EXACT_ID_HOLD';exit 2
      - name: Physical QA 403 boundary and APP583 legacy compatibility (no tokens, no writes)
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const root='https://soridraw-owner-qa-583.soridraw-qa.workers.dev';
          const req=async(method,path,extra={})=>{
            const r=await fetch(root+path,{method,redirect:'manual',
              headers:{Accept:'application/json','Cache-Control':'no-store',...extra},
              signal:AbortSignal.timeout(12000)});
            return {status:r.status,body:await r.json().catch(()=>null)};
          };
          let active=false;
          for(let n=0;n<10;n++){
            const r=await req('GET','/qa730/verified/status?qa749='+n);
            if(r.status===403&&r.body?.ok===false&&r.body?.syntheticOnly===true){
              active=true;break;
            }
            if(r.status!==403||r.body?.ok!==false||r.body?.syntheticOnly===true)
              throw Error('APP749_QA_DEFAULT_ROUTE_UNEXPECTED_HOLD');
            if(n<9)await new Promise(resolve=>setTimeout(resolve,2500));
          }
          if(!active)throw Error('APP749_QA_NEW_DEFAULT_NOT_VISIBLE_HOLD');
          // During Cloudflare propagation, the original APP583 (also 403)
          // can still be seen after the first new-version response.
          // Never tolerate a 200, a non-403 or a missing ok:false response.
          let fenced=false;
          for(let attempt=0;attempt<10;attempt++){
            const bad=[
              await req('PUT','/qa730/verified/follow'),
              await req('PUT','/qa730/verified/ingress'),
              await req('PUT','/qa730/verified/follow',{'X-Owner583-Token':'not-a-token'}),
              await req('GET','/qa730/verified/status',{Authorization:'Bearer invalid.jwt.token'})
            ];
            console.log('APP749_QA_AUTH_BOUNDARY_PROBE_'+attempt+'='+
              bad.map(x=>x.status+'/'+(x.body?.ok===false?'DENIED':'OTHER')+
                '/'+(x.body?.syntheticOnly===true?'QA749':'LEGACY')).join(','));
            if(bad.some(r=>r.status!==403||r.body?.ok!==false))
              throw Error('APP749_QA_AUTH_BYPASS_OR_UNEXPECTED_HTTP_HOLD');
            if(bad.every(r=>r.body.syntheticOnly===true)){
              fenced=true;break;
            }
            if(attempt<9)await new Promise(resolve=>setTimeout(resolve,2500));
          }
          if(!fenced)throw Error('APP749_QA_NEW_AUTH_ROUTE_NOT_CONVERGED_HOLD');
          // Cloudflare runtime must fetch Google keys itself. A deliberately
          // impossible kid forces signed-verifier public key discovery, but can
          // never authenticate or reach DO, RTDB, Functions or user data.
          const b64=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const bogusToken=[
            b64({alg:'RS256',typ:'JWT',kid:'app749-no-matching-qa-probe-kid'}),
            b64({iat:1,exp:2}),Buffer.alloc(256).toString('base64url'),
          ].join('.');
          const keyProbe=await req('GET','/qa730/verified/status',{
            Origin:'https://soridraw-qa-owner-584.web.app',
            Authorization:'Bearer '+bogusToken,
            'X-Firebase-AppCheck':'qa-public-key-probe-not-a-token'
          });
          const safeStage=String(keyProbe.body?.qa749AuthStage||'UNKNOWN');
          console.log('APP749_QA_EDGE_PUBLIC_KEYS_STAGE='+
            safeStage.replace(/[^A-Z_]/g,''));
          if(keyProbe.status!==403||safeStage!=='AUTH_KID_MISMATCH')
            throw Error('APP749_QA_EDGE_PUBLIC_KEYS_NOT_VERIFIED_HOLD');
          console.log('APP749_QA_EDGE_FIREBASE_KEYS_READ=PASS; REAL_TOKENS=0; MUTATIONS=0');
          const legacy=await req('GET','/qa583/status');
          if(legacy.status!==403||legacy.body?.ok!==false||
             legacy.body?.syntheticOnly===true)
            throw Error('APP749_QA_LEGACY_ROUTE_CHANGED_HOLD');
          console.log('APP749_QA_LIVE_UNSIGNED_AND_PROBE_ONLY_DENIED=PASS');
          console.log('APP749_QA_LIVE_APP583_LEGACY_UNCHANGED=PASS');
          console.log('APP749_REAL_QA_AUTH_TOKENS_FOLLOW_UNFOLLOW=NOT_TESTED');
          NODE
      - name: Allow bounded QA A/B browser and two-device sync physical test
        if: startsWith(github.event.comment.body, '/app749-qa-browser ')
        run: |
          echo 'APP749_QA_BROWSER_REAL_AUTH_WINDOW=OPEN_30_MINUTES'
          echo 'APP749_QA_BROWSER_TEST_HUMAN_RESULT=NOT_AUTOMATICALLY_ASSERTED'
          sleep 1800
      - name: Always restore historical APP583 exact 100 percent
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b60fcd62c679c64db19f0b0e0c2f3429
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/app749-route-attempted" ]; then
            echo 'APP749_QA_ACTIVE_TRAFFIC_NOT_CHANGED';exit 0
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || exit 2
          cd "$RUNNER_TEMP/app749-qa/cloudflare/explore-worker"
          npx --yes wrangler@4.102.0 versions deploy \
            '4ed70845-6a4b-4a80-9c51-ed95d0becc38@100%' \
            --config wrangler.owner-qa-583.json --yes
