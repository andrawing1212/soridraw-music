name: SORIDRAW Inspect Publication Cost PREVIEW 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-publication-cost-20260904.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inspect active worker publication cost helpers
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,'Content-Type':'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,800)}`);return x.result||x}
          function extract(src,name){const n1=`async function ${name}(`,n2=`function ${name}(`;let s=src.indexOf(n1);if(s<0)s=src.indexOf(n2);if(s<0)return 'MISSING';const b=src.indexOf('{',s);let d=0,q=null,e=false;for(let i=b;i<src.length;i++){const c=src[i],n=src[i+1];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){const z=src.indexOf('\n',i);i=z<0?src.length:z;continue}if(c==='/'&&n==='*'){const z=src.indexOf('*/',i+2);i=z<0?src.length:z+1;continue}if(c==='{')d++;if(c==='}'&&--d===0)return src.slice(s,i+1)}return 'UNTERMINATED'}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;const ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`);const mod=(ver.modules||[]).find(m=>(m.name||'')==='worker.js')||(ver.modules||[])[0];const src=Buffer.from(mod.content_base64,'base64').toString('utf8');console.log('ACTIVE_VERSION='+v.version_id);for(const name of ['applyPublicationOptions','readOrMaterializePublicProfileFirstView','refreshPublicProfileFirstViewTrackWindow','materializePublicProfileFirstView','buildMusicNotePublicationR2Payload','enforceUserRateLimit','invalidatePublicProfileFirstViewEdgeCache','syncExploreFeedR2Publication012']){console.log(`\n===== ${name} =====\n${extract(src,name)}`)}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
