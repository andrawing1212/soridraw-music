name: Apply and deploy SORIDRAW 861 once

on:
  push:
    branches: [preview]
    paths:
      - .deploy/apply-861-trigger.txt

permissions:
  contents: write

concurrency:
  group: apply-deploy-soridraw-861-once
  cancel-in-progress: false

jobs:
  apply-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply 861 source changes
        run: python3 .deploy/apply-861.py

      - name: Validate app build
        run: |
          npm ci
          npm run build

      - name: Validate Functions build
        run: |
          npm ci --prefix functions
          npm --prefix functions run build

      - name: Commit 861 source changes
        run: |
          git config user.name "andrawing1212"
          git config user.email "andrawing1212@gmail.com"
          git add src/services/geminiService.ts src/services/geminiModelPreferences.ts functions/scripts/apply-gemini-latency.cjs
          git diff --cached --check
          git commit -m "feat(861): refine Japanese semantics and 3.7 latency policy"
          git push origin HEAD:preview

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy generateGeminiContent only
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only functions:generateGeminiContent --project soridraw-app-866a5 --non-interactive 2>&1 | tee /tmp/gemini-861-deploy.log

      - name: Record 861 result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then STATUS=success; else STATUS=failure; fi
          {
            echo "status=${STATUS}"
            echo "version=861"
            echo "app_build=success"
            echo "functions_build=success"
            echo "function=generateGeminiContent"
            echo "target_project=soridraw-app-866a5"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- deploy log tail ---"
            tail -n 120 /tmp/gemini-861-deploy.log 2>/dev/null || true
          } > .deploy/apply-861-result.txt
          git add .deploy/apply-861-result.txt
          git commit -m "chore(861): record build and function deploy result" || true
          git push origin HEAD:preview

      - name: Fail when Function deploy failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
