name: SORIDRAW 191 Publication Profile Build

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-191-publication-profile-build.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-191-publication-profile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Apply 091 to canonical PREVIEW source and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/candidate/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/candidate" node cloudflare/explore-worker/patches/091-publication-shared-profile-parity.mjs
          node --check "$RUNNER_TEMP/candidate/worker.js"
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/candidate/worker.js" node scripts/verify-212-publication-shared-profile-parity.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/candidate/worker.js" node scripts/verify-082-publication-batch.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/candidate/worker.js" node scripts/verify-083-publication-pk-read.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/candidate/worker.js" node scripts/verify-084-publication-write-returning.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/candidate/worker.js" node scripts/verify-113-shared-profile-parity.mjs
          cp "$RUNNER_TEMP/candidate/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          echo "NEW_CANONICAL_SHA256=$(cat cloudflare/explore-worker/canonical/source-sha256.txt)"
      - name: Commit canonical source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soridraw-release-bot"
          git config user.email "soridraw-release-bot@users.noreply.github.com"
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git diff --cached --quiet && { echo 'No canonical change'; exit 1; }
          git commit -m "fix(preview): lock publication shared profile parity worker"
          git push origin HEAD:preview
          echo "CANONICAL_COMMIT=$(git rev-parse HEAD)"
