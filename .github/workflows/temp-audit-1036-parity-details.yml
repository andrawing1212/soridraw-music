name: Temp Audit 1036 Parity Details

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-audit-1036-parity-details.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Print exact catalog control flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def around(path, needles, before=35, after=85):
              lines=Path(path).read_text(encoding='utf-8').splitlines()
              hits=[]
              for i,l in enumerate(lines):
                  if any(n in l for n in needles): hits.append(i)
              ranges=[]
              for i in hits:
                  a=max(0,i-before); b=min(len(lines),i+after)
                  if ranges and a<=ranges[-1][1]: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
                  else: ranges.append((a,b))
              print(f'===== {path} =====')
              for a,b in ranges:
                  print(f'--- {a+1}-{b} ---')
                  for j in range(a,b): print(f'{j+1}: {lines[j]}')
          around('src/App.tsx', ['const mergeFavoriteFirstPageWithCache', 'musicNoteCacheNeedsBoundedVerification', 'subscribeListBundle(\'musicNote\'', 'const loadMoreFavorites ='], 45, 110)
          around('src/pages/FavoritesPage.tsx', ['canShowCachedMusicNoteMore', 'canRequestMoreMusicNotePage', 'onLoadMoreFavorites?.'], 30, 70)
          around('src/pages/SunoLibraryPage.tsx', ['readPreviewAdaptiveListIndexV2', 'subscribeListBundle(\'library\'', 'libraryWorkspaceSession', 'hasMore:', 'loadMore'], 35, 80)
          PY
