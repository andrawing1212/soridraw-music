name: Full release isolated physical handoff QA
on:
  push:
    branches: [qa/full-release-handoff-safety]
    paths: ['scripts/full-release-handoff-qa-worker.mjs','scripts/full-release-handoff-qa-runner.mjs','.github/workflows/full-release-handoff-physical.yml']
permissions:
  contents: read
concurrency:
  group: soridraw-app736-qa-zero-traffic
  cancel-in-progress: false
jobs:
  physical:
    if: github.repository == 'andrawing1212/soridraw-music' && github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
      CLOUDFLARE_QA_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source checks and isolated free QA physical test
        run: |
          node --check scripts/full-release-handoff-qa-worker.mjs
          node --check scripts/full-release-handoff-qa-runner.mjs
          node scripts/full-release-handoff-qa-runner.mjs run
      - name: Always remove exact temporary Worker and check original
        if: always()
        run: node scripts/full-release-handoff-qa-runner.mjs cleanup
