name: Approved exact production title-only activation
on:
  push:
    branches: [qa/production-title-compatibility-20261128]
    paths: ['.github/workflows/production-title-activation-approved-20261128.yml']
permissions:
  contents: read
concurrency:
  group: soridraw-full-production-backend-activation
  cancel-in-progress: false
jobs:
  activate:
    if: >-
      github.repository == 'andrawing1212/soridraw-music' && github.actor == github.repository_owner && github.run_attempt == 1 && github.event.head_commit.message == 'release: director approved exact production title activation 20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin previously passing candidate (no repeat QA)
        run: |
          test "$(git rev-parse HEAD^)" = afbc2f7c38ecbcc3c7352d144e8af1ea058d0aee
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/production-title-activation-approved-20261128.yml
      - name: Director-approved title-only upload, activation, readback and owned rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {executeTitleActivation} from './scripts/qa-production-title-activation-20261128.mjs';
          import {createTitleActivationTransport} from './scripts/lib/production-title-activation-transport-20261128.mjs';
          const api=createTitleActivationTransport({token:process.env.CLOUDFLARE_API_TOKEN});
          const result=await executeTitleActivation({api,approval:'ACTIVATE_PRODUCTION_TITLE_WORKER_20261128'});
          console.log(JSON.stringify(result));
          NODE
