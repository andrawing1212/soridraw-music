name: SORIDRAW M-005 Target Project Signer Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m005-target-signer-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout preview
        uses: actions/checkout@v7
        with:
          ref: preview

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Authenticate cross-project diagnostic session
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install existing Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Discover target-project signer and test token exchange
        working-directory: functions
        env:
          FIREBASE_PROJECT_ID: soridraw-app-866a5
          FIREBASE_API_KEY: AIzaSyB_XyRUffNmJ5iugtvqx_3yY-rLi6PaumA
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin=require('firebase-admin');
          const fs=require('fs');
          const sanitize=(v)=>String(v||'').replace(/eyJ[A-Za-z0-9._-]+/g,'[REDACTED_TOKEN]').replace(/AIza[A-Za-z0-9_-]+/g,'[REDACTED_API_KEY]').slice(0,300);
          const cred=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));
          const project=process.env.FIREBASE_PROJECT_ID;
          const accessToken=async()=>{
            const {GoogleAuth}=require('google-auth-library');
            const auth=new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']}); const client=await auth.getClient(); const t=await client.getAccessToken(); return t.token;
          };
          (async()=>{
            const token=await accessToken();
            const list=await fetch(`https://iam.googleapis.com/v1/projects/${project}/serviceAccounts?pageSize=100`,{headers:{authorization:`Bearer ${token}`}});
            const listBody=await list.json();
            console.log('M005_TARGET_SA_LIST_HTTP='+list.status);
            if(!list.ok) { console.log('M005_TARGET_SA_LIST_ERROR='+sanitize(listBody?.error?.message)); return; }
            const accounts=(listBody.accounts||[]).map(x=>x.email).filter(Boolean);
            const preferred=accounts.filter(x=>/firebase-adminsdk|appspot|compute@developer/.test(x));
            console.log('M005_TARGET_SIGNER_CANDIDATE_COUNT='+preferred.length);
            const base=admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:project},'m005-base');
            const snap=await base.firestore().collectionGroup('tracks').limit(100).get();
            const chosen=snap.docs.map(doc=>({doc,data:doc.data()||{},uid:doc.ref.parent.parent?.id||''})).find(x=>x.uid&&x.data.taskId);
            if(!chosen) throw new Error('no owner uid candidate');
            for(const email of preferred){
              const label=email.split('@')[0].replace(/[A-Za-z0-9_-]{8,}/g,'candidate');
              try{
                const app=admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:project,serviceAccountId:email},'signer-'+Math.random().toString(36).slice(2));
                const custom=await app.auth().createCustomToken(chosen.uid);
                const payload=JSON.parse(Buffer.from(custom.split('.')[1],'base64url').toString('utf8'));
                const ex=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(process.env.FIREBASE_API_KEY)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:custom,returnSecureToken:true})});
                const body=await ex.json().catch(()=>({}));
                console.log('M005_SIGNER_ATTEMPT='+JSON.stringify({type:label,issuerProjectMatch:String(payload.iss||'').endsWith(`@${project}.iam.gserviceaccount.com`)||String(payload.iss||'').includes(project),http:ex.status,success:Boolean(ex.ok&&body.idToken),error:sanitize(body?.error?.message)}));
                if(ex.ok&&body.idToken){ console.log('M005_TARGET_SIGNER_EXCHANGE=PASS'); return; }
              } catch(e){
                console.log('M005_SIGNER_ATTEMPT_ERROR='+JSON.stringify({type:label,message:sanitize(e?.message||e)}));
              }
            }
            console.log('M005_TARGET_SIGNER_EXCHANGE=UNAVAILABLE');
          })().catch(e=>{console.error('M005_TARGET_SIGNER_DIAGNOSTIC_ERROR='+sanitize(e?.message||e));process.exit(1)});
          NODE

      - name: Scope proof
        if: always()
        run: |
          echo 'M005_DIAGNOSTIC_ONLY=YES'
          echo 'M005_CONFIG_CHANGES=0'
          echo 'M005_FIRESTORE_WRITES=0'
          echo 'M005_FUNCTION_DEPLOYS=0'
          echo 'M005_RULES_DEPLOYS=0'
          echo 'M005_HOSTING_DEPLOYS=0'
          echo 'M005_MAIN_CHANGES=0'
