name: TEMP 1004 Layout Hotpath Stability

on:
  push:
    branches: [preview-layout-hotpath-stability]
    paths:
      - '.github/workflows/temp-1004-layout-hotpath-stability.yml'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-layout-hotpath-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply conservative resize hotpath cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          ts_path = Path('src/components/studio/LiteStudioSplitWorkspace.tsx')
          css_path = Path('src/components/studio/liteSplitWorkspace.css')
          ts = ts_path.read_text()
          css = css_path.read_text()

          old = """    broadcastLitePaneResponsiveWidths(builderWidth, resultWidth, true);\n    const splitterLeft = metricsRef.current.left + builderWidth;\n    commitRootMeasurements(builderWidth, splitterLeft);\n\n    const nativeWindowResize = document.documentElement.classList.contains('soridraw-window-resizing');\n"""
          new = """    // 1004 — Window resize already runs through one rAF owner. Do not force a\n    // second pane-width publication on every native resize frame; CSS/container\n    // width handles continuous geometry and the final resting refresh still\n    // performs the forced synchronization once after resize-end.\n    const nativeWindowResize = document.documentElement.classList.contains('soridraw-window-resizing');\n    broadcastLitePaneResponsiveWidths(builderWidth, resultWidth, !nativeWindowResize);\n    const splitterLeft = metricsRef.current.left + builderWidth;\n    commitRootMeasurements(builderWidth, splitterLeft);\n\n"""
          if ts.count(old) != 1:
              raise SystemExit(f'expected refreshMetrics block once, found {ts.count(old)}')
          ts = ts.replace(old, new, 1)

          old = """    if (nativeWindowResize) {\n      // 748 — The native-resize Generate bar consumes the builder geometry that\n      // was committed above. Do not publish a second pair of action-bar custom\n      // properties from JS on every frame.\n      clearLiveExternalGeometry();\n    } else {\n"""
          new = """    if (nativeWindowResize) {\n      // 1004 — Resize-start clears stale drag-only inline geometry once. Keeping\n      // the external cache stable during the live resize prevents repeated\n      // removeProperty/cache-reset work on every animation frame. Root geometry\n      // above remains the single live owner until the resize-end reconciliation.\n    } else {\n"""
          if ts.count(old) != 1:
              raise SystemExit(f'expected native resize branch once, found {ts.count(old)}')
          ts = ts.replace(old, new, 1)

          old = """        } else {\n          root.style.removeProperty('--soridraw-action-resize-measured-inset-left');\n          root.style.removeProperty('--soridraw-action-resize-measured-inset-right');\n        }\n        root.classList.add('soridraw-window-resizing');\n"""
          new = """        } else {\n          root.style.removeProperty('--soridraw-action-resize-measured-inset-left');\n          root.style.removeProperty('--soridraw-action-resize-measured-inset-right');\n        }\n        // Clear any drag-only external inline geometry once at native resize\n        // start. The live resize path then reuses the committed root variables\n        // without resetting these styles/caches every frame.\n        clearLiveExternalGeometry();\n        root.classList.add('soridraw-window-resizing');\n"""
          if ts.count(old) != 1:
              raise SystemExit(f'expected resize-start block once, found {ts.count(old)}')
          ts = ts.replace(old, new, 1)
          ts_path.write_text(ts)

          marker = '/* 1004 — native window resize leaf isolation.'
          if marker not in css:
              css += dedent(r'''

          /* 1004 — native window resize leaf isolation.
           * Reuse the already-proven drag-time browser-native containment only while the
           * OS/browser window is actively resizing. Visible rows still reflow normally;
           * off-screen Music Note/Library leaves may be skipped, and all resting styles
           * are restored automatically when `soridraw-window-resizing` is removed. */
          @media (min-width: 1100px) {
            html.soridraw-window-resizing[data-soridraw-theme="studio-black"]
            .soridraw-lite-studio-split-workspace
            .soridraw-musicnote-song-card:not(.soridraw-list-perf-item--active) {
              content-visibility: auto;
              contain-intrinsic-size: auto 92px;
            }

            html.soridraw-window-resizing[data-soridraw-theme="studio-black"]
            .soridraw-lite-studio-split-workspace
            .soridraw-library-playlist-row:not(.soridraw-list-perf-item--active),
            html.soridraw-window-resizing[data-soridraw-theme="studio-black"]
            .soridraw-lite-studio-split-workspace
            .soridraw-library-workspace-track-row {
              content-visibility: auto;
              contain-intrinsic-size: auto 76px;
            }

            html.soridraw-window-resizing[data-soridraw-theme="studio-black"]
            .soridraw-lite-studio-split-workspace
            :is(
              .soridraw-musicnote-song-card:not(.soridraw-list-perf-item--active),
              .soridraw-library-playlist-row:not(.soridraw-list-perf-item--active),
              .soridraw-library-workspace-track-row
            ) {
              contain: layout style paint;
            }

            html.soridraw-window-resizing[data-soridraw-theme="studio-black"]
            .soridraw-lite-studio-split-workspace
            :is(
              .soridraw-musicnote-song-card,
              .soridraw-library-playlist-row,
              .soridraw-library-workspace-track-row,
              .soridraw-studio-menu-card,
              .soridraw-result-prompt-card,
              .soridraw-result-lyrics-card
            ) {
              transition: none !important;
              animation-play-state: paused !important;
            }
          }
          ''')
          css_path.write_text(css)
          PY
      - name: Verify patch scope
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/components/studio/LiteStudioSplitWorkspace.tsx src/components/studio/liteSplitWorkspace.css "
          grep -q "broadcastLitePaneResponsiveWidths(builderWidth, resultWidth, !nativeWindowResize)" src/components/studio/LiteStudioSplitWorkspace.tsx
          grep -q "1004 — native window resize leaf isolation" src/components/studio/liteSplitWorkspace.css
          if git diff -U0 -- src/components/studio/LiteStudioSplitWorkspace.tsx | grep -E '^[-+].*(handlePointerMove|schedulePointer|flushPointer|purePaneHybridLive|writeLiveSplitGeometry\(builderWidth, resultWidth, directGeometryLive\))'; then
            echo 'Unexpected split-drag hotpath change detected' >&2
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npm run lint
      - name: Commit verified source changes
        run: |
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/studio/LiteStudioSplitWorkspace.tsx src/components/studio/liteSplitWorkspace.css
          git commit -m "perf(preview): reduce native resize duplicate layout work"
          git push origin HEAD:preview-layout-hotpath-stability
