name: TEMP CPU Hover Audit
on:
  push:
    branches: [preview-cpu-hover-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect card mousemove handlers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Favorites handler definitions ==='
          grep -nE 'const handleSelectionDragMove|function handleSelectionDragMove|const handleCardLongPressMove|function handleCardLongPressMove|const handleSelectionDragEnter|const handleCardLongPressStart|selectionDrag' src/pages/FavoritesPage.tsx | head -n 220 || true
          echo '=== Favorites likely definition neighborhoods ==='
          sed -n '3300,3565p' src/pages/FavoritesPage.tsx
          echo '=== Library handler definitions ==='
          grep -nE 'const handleLibraryDragSelectMove|function handleLibraryDragSelectMove|const handleLibraryCardLongPressMove|function handleLibraryCardLongPressMove|const handleLibraryDragSelectEnter|const handleLibraryCardLongPressStart|libraryDragSelect' src/pages/SunoLibraryPage.tsx | head -n 260 || true
          echo '=== Library likely definition neighborhoods A ==='
          sed -n '1180,1385p' src/pages/SunoLibraryPage.tsx
          echo '=== Library likely definition neighborhoods B ==='
          sed -n '5550,5750p' src/pages/SunoLibraryPage.tsx
          echo '=== Mousemove props all pages ==='
          grep -n 'onMouseMove=' src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx | head -n 240 || true
