name: Temp 1048 MusicNote Livepath Audit

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1048-musicnote-livepath-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Trace Music Note render and overwrite path
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FAVORITES PAGE ALL COUNT/SLICE/MORE MARKERS ==='
          grep -n -E "favorites|filtered|visible|display|slice\(|더보기|남음|더 불러오기|PAGE_SIZE|renderBatch|visibleCount|showCount|limitCount" src/pages/FavoritesPage.tsx | head -2600
          echo '=== FAVORITES PAGE CONTEXT AROUND KOREAN MORE LABELS ==='
          grep -n -B 80 -A 100 -E "더보기|남음|더 불러오기" src/pages/FavoritesPage.tsx | head -2200 || true
          echo '=== APP ALL FAVORITES STORE WRITES ==='
          grep -n -B 18 -A 40 -E "favoritesStore\.setFavorites|setFavorites\(" src/App.tsx | head -2800
          echo '=== STORE IMPLEMENTATION ==='
          grep -R -n -B 15 -A 80 -E "class.*Favorites|favoritesStore|setFavorites" src | grep -v "src/App.tsx" | head -1800 || true
