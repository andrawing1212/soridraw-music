name: SORIDRAW PREVIEW Explore Worker Release

# Fast PREVIEW loop: one repository-owned complete Worker, one preflight, one deploy.
# No live-source download, no patch replay, no D1/user-data migration, no dynamic config rebuild.
# 103 adds one additive SQLite Durable Object namespace and removes the fixed like cron.
on:
  push:
    branches: [preview]
    paths:
      - '.deploy/preview-worker-release.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-preview-explore-worker-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com

    steps:
      - name: Resolve exact approved PREVIEW source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          trigger_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.deploy/preview-worker-release.trigger"
          target="$(curl -fsSL "$trigger_url" | sed -n 's/^product_code_target=//p' | tail -1 | tr -d '\r')"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "LOCKED_PREVIEW_SHA=$target"

      - name: Checkout exact PREVIEW source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: One-shot preflight
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < canonical/source-sha256.txt)"
          actual="$(sha256sum canonical/preview-worker.js | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          node --check canonical/preview-worker.js
          node --check canonical/preview-entry.js
          grep -q 'SORIDRAW_EXPLORE_REVISION_HEAD_ONLY_036_20260911' canonical/preview-entry.js
          grep -q 'SORIDRAW_EXPLORE_LIKE_EVENT_BATCH_103_20260916' canonical/preview-entry.js
          grep -q 'SORIDRAW_PERSONAL_LIKE_R2_REVISION_072_20260920' canonical/preview-worker.js
          grep -q '/v1/me/likes-revision' canonical/preview-worker.js
          generated="$PWD/canonical/preview-worker.js"
          (
            cd ../..
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-111-explore-profile-negative-cache.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-082-publication-batch.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-083-publication-pk-read.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-084-publication-write-returning.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-085-liked-profile.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-110-explore-liked-public-count.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-109-mobile-feed-refresh-zero.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-108-explore-feed-cache-recovery.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-107-explore-direct-count-zero-read.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-105-explore-like-1min.mjs
            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-102-explore-public-like-parity.mjs
            node scripts/verify-103-explore-like-event-batch.mjs
            node scripts/verify-156-shared-like-snapshot-repair.mjs
            node scripts/verify-191-bounded-public-like-convergence.mjs
            node scripts/verify-explore-deploy-preflight.mjs
          )

          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT type,name FROM sqlite_schema WHERE name IN ('explore_like_batches_035','idx_explore_like_batches_035_created','explore_like_processor_035','explore_like_batches_069') ORDER BY name" --json > "$RUNNER_TEMP/like-schema.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/like-schema.json');const rows=r.flatMap(x=>x.results||[]);const got=new Set(rows.map(x=>x.name));for(const n of ['explore_like_batches_035','idx_explore_like_batches_035_created','explore_like_processor_035','explore_like_batches_069'])if(!got.has(n))throw new Error('Missing live like prerequisite: '+n);console.log('LIVE_LIKE_D1_SCHEMA=PASS')"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT id,lease_until,owner FROM explore_like_processor_035 WHERE id=1; SELECT COUNT(*) AS pending035 FROM explore_like_batches_035; SELECT COUNT(*) AS pending069 FROM explore_like_batches_069" --json > "$RUNNER_TEMP/like-state.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/like-state.json');const rows=r.flatMap(x=>x.results||[]);if(!rows.some(x=>Number(x.id)===1))throw new Error('035 processor row missing');const a=rows.find(x=>'pending035' in x),b=rows.find(x=>'pending069' in x);console.log('LIVE_LIKE_D1_STATE=PASS pending035='+Number(a?.pending035||0)+' pending069='+Number(b?.pending069||0))"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN SELECT * FROM tracks WHERE id IN ('__a__','__b__','__c__')" --json > "$RUNNER_TEMP/publication-pk-plan.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/publication-pk-plan.json');const detail=r.flatMap(x=>x.results||[]).map(x=>String(x.detail||'')).join(' | ');if(!detail.includes('sqlite_autoindex_tracks_1')||!detail.includes('(id=?)'))throw new Error('Publication PK lookup plan unavailable: '+detail);console.log('LIVE_PUBLICATION_PK_PLAN=PASS '+detail)"

          (
            cd canonical
            node ../node_modules/wrangler/bin/wrangler.js deploy --config wrangler.preview.jsonc --dry-run
          )
          echo "CANONICAL_WORKER_SHA256=$actual"
          echo 'PREVIEW_RELEASE_PREFLIGHT=PASS'

      - name: Snapshot protected Worker versions
        shell: bash
        run: |
          set -euo pipefail
          active_version() {
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$1/deployments" \
              | jq -er '.result.deployments[0].versions | max_by(.percentage) | select(.percentage >= 99.99) | .version_id'
          }
          preview="$(active_version "$PREVIEW_WORKER")"
          test_worker="$(active_version "$TEST_WORKER")"
          production="$(active_version "$PRODUCTION_WORKER")"
          printf '%s' "$preview" > "$RUNNER_TEMP/preview-before.txt"
          printf '%s' "$test_worker" > "$RUNNER_TEMP/test-before.txt"
          printf '%s' "$production" > "$RUNNER_TEMP/production-before.txt"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}/schedules" \
            | jq -c '.result.schedules // [] | map({cron})' > "$RUNNER_TEMP/preview-crons-before.json"
          echo "PREVIEW_BEFORE=$preview"
          echo "TEST_BEFORE=$test_worker"
          echo "PRODUCTION_BEFORE=$production"

      - name: Deploy canonical PREVIEW Worker once and verify
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          before="$(cat "$RUNNER_TEMP/preview-before.txt")"
          deployed=0

          restore_previous() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$deployed" = 1 ]; then
              echo "SMOKE_FAILED_ROLLBACK_TO=$before"
              node "$WRANGLER" rollback "$before" --name "$PREVIEW_WORKER" --config "$CFG" --message 'automatic rollback after PREVIEW smoke failure' || true
              curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
                --data-binary @"$RUNNER_TEMP/preview-crons-before.json" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}/schedules" >/dev/null || true
              echo 'PREVIEW_ROLLBACK=ATTEMPTED'
            fi
            exit "$status"
          }
          trap restore_previous EXIT

          # Transition guard: do not remove the old 10-minute cron while a 069
          # batch is already waiting under the old Worker. Retry release after the
          # old cron drains it instead of risking an unscheduled orphan row.
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT COUNT(*) AS pending069 FROM explore_like_batches_069" --json > "$RUNNER_TEMP/like069-before-deploy.json"
          pending069="$(node -e "const r=require(process.env.RUNNER_TEMP+'/like069-before-deploy.json');const x=r.flatMap(v=>v.results||[]).find(v=>'pending069' in v);process.stdout.write(String(Number(x?.pending069||0)))")"
          echo "PRE_DEPLOY_PENDING_069=$pending069"
          test "$pending069" = 0

          (
            cd canonical
            node ../node_modules/wrangler/bin/wrangler.js deploy --config wrangler.preview.jsonc
          )
          deployed=1

          # Wrangler does not delete a previously configured cron merely because the
          # new config omits triggers. 103 intentionally has no fixed like cron, so
          # clear PREVIEW schedules explicitly after the new version is active.
          printf '[]' > "$RUNNER_TEMP/preview-crons-103.json"
          curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/preview-crons-103.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}/schedules" >/dev/null
          echo 'PREVIEW_FIXED_CRON_CLEAR=PASS'

          feed_code="$(curl --retry 3 --retry-delay 1 -sS -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=latest&limit=40")"
          test "$feed_code" = 200
          owner="$(node -e "const p=require(process.env.RUNNER_TEMP+'/feed.json'),x=p?.data?.items?.[0]||{};process.stdout.write(String(x.ownerUid||x.owner_uid||''))")"
          test -n "$owner"
          profile_code="$(curl --retry 3 --retry-delay 1 -sS -o "$RUNNER_TEMP/profile.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/profiles/${owner}/first-view?limit=50")"
          test "$profile_code" = 200
          batch_code="$(curl -sS -o "$RUNNER_TEMP/batch.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Origin: ${PREVIEW_ORIGIN}" --data '{"mutations":[]}' "${PREVIEW_BASE}/v1/me/likes/batch")"
          test "$batch_code" != 404
          test "$batch_code" -ge 400
          test "$batch_code" -lt 500
          like_revision_code="$(curl -sS -o "$RUNNER_TEMP/likes-revision.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/me/likes-revision")"
          test "$like_revision_code" != 404
          test "$like_revision_code" -ge 400
          test "$like_revision_code" -lt 500

          warm_ok=0
          revision_mode=''
          for attempt in 1 2 3; do
            curl -sS -o /dev/null -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed-revision?sort=latest"
            sleep 1
            curl -sS -D "$RUNNER_TEMP/revision.head" -o /dev/null -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed-revision?sort=latest"
            read_rows="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r","");print $2}' "$RUNNER_TEMP/revision.head" | tail -1)"
            write_rows="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r","");print $2}' "$RUNNER_TEMP/revision.head" | tail -1)"
            revision_mode="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-revision-mode:/{gsub("\r","");print $2}' "$RUNNER_TEMP/revision.head" | tail -1)"
            echo "WARM_REVISION_ATTEMPT=$attempt R=${read_rows:-missing} W=${write_rows:-missing} MODE=${revision_mode:-missing}"
            if [ "$read_rows" = 0 ] && [ "$write_rows" = 0 ] && [ "$revision_mode" = 'HEAD-ONLY-036' ]; then warm_ok=1; break; fi
            sleep 1
          done
          test "$warm_ok" = 1

          schedules="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}/schedules")"
          test "$(printf '%s' "$schedules" | jq -r '[.result.schedules[]?.cron] | length')" = 0

          active_version() {
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$1/deployments" \
              | jq -er '.result.deployments[0].versions | max_by(.percentage) | select(.percentage >= 99.99) | .version_id'
          }
          after="$(active_version "$PREVIEW_WORKER")"
          test_worker="$(active_version "$TEST_WORKER")"
          production="$(active_version "$PRODUCTION_WORKER")"
          test "$after" != "$before"
          test "$test_worker" = "$(cat "$RUNNER_TEMP/test-before.txt")"
          test "$production" = "$(cat "$RUNNER_TEMP/production-before.txt")"
          echo "PREVIEW_AFTER=$after"
          echo 'FEED_SMOKE=PASS'
          echo 'PROFILE_SMOKE=PASS'
          echo "LIKE_BATCH_ROUTE_HTTP=$batch_code"
          echo "LIKE_REVISION_ROUTE_HTTP=$like_revision_code"
          echo 'REVISION_HEAD_ONLY_036=PASS'
          echo 'WARM_REVISION_R0_W0=PASS'
          echo 'LIKE_AGGREGATE_FIXED_CRON_DISABLED=PASS'
          echo 'DURABLE_OBJECT_EVENT_SCHEDULER_DEPLOY=PASS'
          echo 'TEST_PRODUCTION_WORKERS_UNCHANGED=PASS'

          # 156 is an explicitly approved, one-time, four-track derived R2 repair.
          # A temporary PREVIEW-only cron wakes the existing scheduled handler,
          # then the original (empty) cron configuration is restored. No user
          # record, schema, TEST or PRODUCTION environment is modified here.
          # Inspect the triggering commit, NOT the pinned product-source commit.
          # An earlier product source may retain a one-time repair flag even when
          # the current release request explicitly disables it.
          request_trigger_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.deploy/preview-worker-release.trigger"
          if curl -fsSL "$request_trigger_url" | grep -Fxq 'repair_shared_like_snapshot_156=true'; then
            test "$(cat "$RUNNER_TEMP/preview-crons-before.json")" = '[]'
            marker_key="soridraw-profile-media/internal/explore/repair-v156/verified-first-page.json"
            marker_file="$RUNNER_TEMP/like156-repair-marker.json"
            printf '[{"cron":"* * * * *"}]' > "$RUNNER_TEMP/repair156-cron.json"
            curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/repair156-cron.json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}/schedules" \
              | jq -e '.success == true' >/dev/null
            echo '156_PREVIEW_TEMP_CRON=ENABLED'
            repaired=0
            # Cloudflare documents that cron configuration changes can take up to
            # 15 minutes to propagate. The previous 3x75s window rolled the Worker
            # back before the temporary cron could run, leaving shared R2 at zero.
            # Bound waiting to 18 minutes, verify marker and the actual shared R2
            # before clearing the cron, then fail closed if it did not converge.
            for attempt in $(seq 1 24); do
              sleep 45
              if node "$WRANGLER" r2 object get "$marker_key" --file "$marker_file" --remote >/dev/null 2>&1; then
                if node - "$marker_file" <<'NODE'
          const fs=require('fs');
          const marker=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(marker.schemaVersion!==1||marker.tracks!==4)process.exit(1);
          console.log('156_R2_REPAIR_MARKER=PASS');
          NODE
                then repaired=1; break; fi
              fi
              echo "156_REPAIR_WAIT_ATTEMPT=$attempt"
            done
            printf '[]' > "$RUNNER_TEMP/repair156-original-cron.json"
            curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/repair156-original-cron.json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}/schedules" \
              | jq -e '.success == true' >/dev/null
            echo '156_PREVIEW_CRON_RESTORED=PASS'
            test "$repaired" = 1
            for sort in latest popular; do
              curl -fsS -H "Origin: ${PREVIEW_ORIGIN}" \
                "${PREVIEW_BASE}/v1/feed?sort=$sort&limit=40&__soridraw_r2_only=108" > "$RUNNER_TEMP/repair156-$sort.json"
              SORT="$sort" node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/repair156-'+process.env.SORT+'.json','utf8'));
          if(p?.ok!==true)throw Error('156 shared R2 not available');
          for(const name of ['Leaving One Step Open','Left Unsaid','Through the Night','Just Stay Here Awhile']){
            const x=(p?.data?.items||[]).filter(x=>String(x?.title||'').includes(name));
            if(x.length!==1||Number(x[0].likeCount??x[0].stats?.likeCount??0)!==1)throw Error('156 shared R2 canonical count mismatch: '+name);
          }
          console.log('156_PUBLIC_SHARED_R2_'+process.env.SORT.toUpperCase()+'=PASS');
          NODE
            done
            echo '156_BOUNDED_SHARED_R2_REPAIR=PASS'
          fi

          # 191: explicitly requested one-time repair of proven shared public like
          # drift. Reuses the established preview-only temporary cron with an
          # R2 marker and finally-restored schedules. Never mutates canonical D1.
          if curl -fsSL "$request_trigger_url" | grep -Fxq 'repair_shared_like_snapshot_191=true'; then
            test "$(cat "$RUNNER_TEMP/preview-crons-before.json")" = '[]'
            marker_key="soridraw-profile-media/internal/explore/repair-v191/bounded-first40.json"
            marker_file="$RUNNER_TEMP/like191-repair-marker.json"
            printf '[{"cron":"* * * * *"}]' > "$RUNNER_TEMP/repair191-cron.json"
            curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/repair191-cron.json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}/schedules" \
              | jq -e '.success == true' >/dev/null
            echo '191_PREVIEW_TEMP_CRON=ENABLED'
            repaired=0
            for attempt in $(seq 1 24); do
              sleep 45
              if node "$WRANGLER" r2 object get "$marker_key" --file "$marker_file" --remote >/dev/null 2>&1; then
                if node - "$marker_file" <<'NODE'
          const fs=require('fs');
          const marker=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(marker.schemaVersion!==1||!Number.isSafeInteger(marker.changedTracks)||marker.changedTracks<0||marker.changedTracks>80)process.exit(1);
          console.log('191_R2_REPAIR_MARKER=PASS changed='+marker.changedTracks);
          NODE
                then repaired=1; break; fi
              fi
              echo "191_REPAIR_WAIT_ATTEMPT=$attempt"
            done
            printf '[]' > "$RUNNER_TEMP/repair191-original-cron.json"
            curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/repair191-original-cron.json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}/schedules" \
              | jq -e '.success == true' >/dev/null
            echo '191_PREVIEW_CRON_RESTORED=PASS'
            test "$repaired" = 1
            node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT d.id,COALESCE(s.like_count,0) AS canonical_count FROM explore_derived_tracks d INDEXED BY idx_explore_rank_latest LEFT JOIN track_stats s ON s.track_id=d.id WHERE d.active=1 ORDER BY d.published_at DESC,d.id DESC LIMIT 40" --json > "$RUNNER_TEMP/like191-canonical.json"
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/like191-canonical.json','utf8')).flatMap(x=>x?.results||[]);
          const byId=new Map(rows.map(x=>[String(x.id),Number(x.canonical_count)]));
          let sampled=0,bad=0;
          for(const sort of ['latest','popular']) {
            const url=process.env.PREVIEW_BASE+'/v1/feed?sort='+sort+'&limit=40&__soridraw_r2_only=108';
            const response=await fetch(url,{headers:{Origin:process.env.PREVIEW_ORIGIN}});
            if(!response.ok)throw Error('191 '+sort+' HTTP '+response.status);
            const payload=await response.json();
            if(!Array.isArray(payload?.data?.items))throw Error('191 '+sort+' malformed');
            let matches=0,mismatches=0;
            for(const row of payload.data.items) {
              const id=String(row?.id||row?.trackId||'');
              if(!byId.has(id))continue;
              matches++;
              if(Number(row?.likeCount??row?.stats?.likeCount??0)!==byId.get(id))mismatches++;
            }
            console.log('191_'+sort.toUpperCase()+'_SAMPLED='+matches+' MISMATCH='+mismatches);
            sampled+=matches;bad+=mismatches;
          }
          if(sampled<10||bad!==0)throw Error('191 shared public like still differs from canonical');
          console.log('191_SHARED_PUBLIC_LIKE_CANONICAL_PARITY=PASS');
          NODE
          fi
          trap - EXIT
