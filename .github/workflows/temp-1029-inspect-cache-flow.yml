name: Temp 1029 Inspect Cache Flow
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1029-inspect-cache-flow.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Print targeted soft-remove and bundle flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text()
          needles=['const isFavoriteSoftRemoved', 'function isFavoriteSoftRemoved', 'const writeFavoritesCache', 'scheduleListBundleWrite(\'musicNote\'', 'favoriteCount']
          for n in needles:
            print('\n---',n,'---')
            start=0; found=0
            while True:
              i=s.find(n,start)
              if i<0: break
              print(s[max(0,i-1600):i+4200])
              found+=1; start=i+len(n)
              if found>=4: break
          PY