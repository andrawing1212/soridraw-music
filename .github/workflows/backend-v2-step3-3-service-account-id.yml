name: SORIDRAW Backend V2 Step 3-3 Service Account ID

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-3-service-account-id.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Print service-account email only
        env:
          CREDS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const raw = process.env.CREDS_JSON || '';
          const parsed = JSON.parse(raw);
          const email = String(parsed.client_email || '');
          if (!email.endsWith('.iam.gserviceaccount.com')) {
            throw new Error('Expected service-account client_email');
          }
          console.log('SORIDRAW_BACKUP_SERVICE_ACCOUNT=' + email);
          NODE
