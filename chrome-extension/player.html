<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SORIDRAW Player</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(176, 82, 73, 0.22), transparent 38%),
        #0d0d0f;
      color: #f4eeea;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .player {
      width: min(720px, calc(100vw - 40px));
      padding: 26px;
      border-radius: 28px;
      background: rgba(26, 24, 25, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 28px 90px rgba(0,0,0,0.48);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.45em;
      color: #d99387;
      font-weight: 800;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 18px;
      line-height: 1.2;
    }
    audio {
      width: 100%;
      margin: 14px 0 16px;
    }
    .url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: rgba(244,238,234,0.58);
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.035);
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: #9d5148;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(157,81,72,0.28);
    }
    .manual {
      display: none;
      margin-top: 12px;
    }
    .hint {
      color: rgba(244,238,234,0.66);
      font-size: 13px;
      line-height: 1.55;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="player">
    <div class="eyebrow">SORIDRAW PLAYER</div>
    <h1>Music Note 재생창</h1>
    <audio id="audio" controls autoplay playsinline></audio>
    <button id="manualPlay" class="manual" type="button">재생하기</button>
    <div id="url" class="url"></div>
    <div class="hint">다음 곡을 재생하면 이 창에서 바로 다음 URL로 전환됩니다.</div>
  </main>
  <script src="player.js"></script>
</body>
</html>
