name: SORIDRAW Backend V2 Step 3-3 Finalize Simple

on:
  push:
    branches:
      - preview
    paths:
      - '.github/workflows/backend-v2-step3-3-finalize-simple.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 2

      - name: Apply master patch
        run: python3 .deploy/backend-v2-step3-3-finalize.py

      - name: Validate docs-only scope
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md'
          grep -Fq 'Step 3-3 Firebase Storage rollback backup complete and verified' docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          grep -Fq 'Step 3 — Backup, backfill and verification (3/6 complete; Step 3-4 next)' docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md

      - name: Commit final status and remove one-time helpers
        run: |
          set -euo pipefail
          git rm .deploy/backend-v2-step3-3-finalize.py .github/workflows/backend-v2-step3-3-finalize-simple.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git commit -m 'docs: mark Backend V2 Step 3-3 backup complete'
          git push origin HEAD:preview
