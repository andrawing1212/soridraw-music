name: SORIDRAW C profile follower real-time completion
on:
  pull_request:
    branches: [preview]
    paths:
      - 'src/services/explorePublicFollowSync668.ts'
      - 'cloudflare/explore-worker/runtime/public-follow-dual-ack-671.mjs'
      - 'scripts/c-profile-follow-*'
      - 'scripts/app660-preview-owner-*'
      - 'scripts/lib/owner-follow-general660.mjs'
      - 'scripts/lib/public-follow-bridge-680.mjs'
      - 'scripts/lib/public-follow-active-patch-671.mjs'
      - 'cloudflare/explore-worker/runtime/owner-follow-precommit-557.mjs'
      - 'cloudflare/explore-worker/runtime/public-follow-http-669.mjs'
      - '.github/workflows/c-profile-follow-finish.yml'
  workflow_dispatch:
    inputs:
      confirm_rules_maintenance:
        description: 'Type FREEZE_CONFIRMED only after pausing other shared RTDB Rules deployments'
        required: true
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('soridraw-c-profile-pr-{0}', github.event.pull_request.number) || 'soridraw-shared-rtdb-rules-release' }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate only C profile signal and rollback-safe code
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund
          npx --prefix functions tsc -p functions/tsconfig.json
          npx tsc --noEmit
          python3 -m py_compile scripts/c-profile-follow-server-firebase.py scripts/c-profile-follow-rules.py
          bash -n scripts/c-profile-receiver-invoker.sh
          python3 scripts/c-profile-follow-server-firebase.py --package-check
          node --check scripts/c-profile-follow-server-worker.mjs
          node scripts/verify-667-public-follow-rules-syntax.mjs
          node scripts/verify-671-public-follow-dual-ack.mjs
          node scripts/verify-680-public-unenrolled-follow.mjs
          node scripts/verify-660-general-owner-live-modules.mjs
          node scripts/verify-669-public-follow-commit-proof.mjs
          npx tsx scripts/verify-669-public-follow-endpoint.ts
          npx tsx scripts/verify-669-follow-deletion.ts
          npx tsx scripts/verify-668-visitor-follow-signal.ts
          node --check scripts/app660-preview-owner-workers.mjs
          node --check scripts/lib/public-follow-bridge-680.mjs
          node scripts/verify-653-owner-general-scope.mjs
          python3 scripts/app660-preview-owner-functions.py --package-check
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/preview' && inputs.confirm_rules_maintenance == 'FREEZE_CONFIRMED' && github.repository == 'andrawing1212/soridraw-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_C_PROFILE_APPROVED_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      C_PROFILE_RULES_MAINTENANCE_CONFIRMED: ${{ inputs.confirm_rules_maintenance }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5
      - uses: google-github-actions/setup-gcloud@v2
      - name: Lock approved single-C-profile release
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview
          test "$APP_C_PROFILE_APPROVED_SHA" = "$GITHUB_SHA"
          node scripts/verify-671-active-service-patch.mjs
          node scripts/verify-667-public-follow-rules-syntax.mjs
          node scripts/verify-671-public-follow-dual-ack.mjs
          node --check scripts/c-profile-follow-server-worker.mjs
          python3 -m py_compile scripts/c-profile-follow-server-firebase.py scripts/c-profile-follow-rules.py
          bash -n scripts/c-profile-receiver-invoker.sh
      - name: Compile exact existing receiver and deletion hook
        run: |
          set -euo pipefail
          npm --prefix functions ci --no-audit --no-fund
          npx --prefix functions tsc -p functions/tsconfig.json
          python3 scripts/c-profile-follow-server-firebase.py --package-check
      - name: Grant only new HMAC-protected C-profile receiver its required public invoker
        run: bash scripts/c-profile-receiver-invoker.sh
      - name: Verify existing OFF endpoint is accessible only via HMAC receiver
        run: |
          set -euo pipefail
          url=https://asia-northeast3-soridraw-app-866a5.cloudfunctions.net/publishExplorePublicFollow669
          code="$(curl -sS --max-time 25 -o /tmp/c-profile-off-endpoint.json -w '%{http_code}' "$url")"
          # Existing receiver may already be enabled by a prior successful
          # partial release; only the exact unsigned GET refusal is accepted.
          ready="$(python3 -c "import json; print(json.load(open('/tmp/c-profile-function.json'))['serviceConfig']['environmentVariables']['SORIDRAW_PUBLIC_FOLLOW_READY_669'])")"
          if [ "$ready" = 0 ]; then
            test "$code" = 503 && grep -Fq PREVIEW_PUBLIC_FOLLOW_DISABLED /tmp/c-profile-off-endpoint.json || {
              echo C_PROFILE_OFF_RECEIVER_DRIFT; exit 2;
            }
          elif [ "$ready" = 1 ]; then
            test "$code" = 405 && grep -Fq '"ok":false' /tmp/c-profile-off-endpoint.json || {
              echo C_PROFILE_ENABLED_RECEIVER_UNSIGNED_GET_NOT_DENIED; exit 2;
            }
          else
            echo C_PROFILE_UNEXPECTED_RECEIVER_STATE; exit 2
          fi
          echo C_PROFILE_RECEIVER_UNSIGNED_GET_DENIED=PASS
      - name: Read-only exact shared RTDB Rules preflight
        run: |
          pip -q install google-auth
          python3 scripts/c-profile-follow-rules.py --preflight
      - name: Deploy account deletion protection then enable existing isolated receiver
        run: python3 scripts/c-profile-follow-server-firebase.py --apply
      - name: Add ONLY C public counter read Rules child, preserve every sibling
        run: python3 scripts/c-profile-follow-rules.py --apply
      - name: Switch ONLY PREVIEW Explore to already proven public follow bridge
        run: node scripts/c-profile-follow-server-worker.mjs --apply
      - name: Trigger existing guarded PREVIEW Hosting release for the visitor subscriber
        run: |
          set -euo pipefail
          test -f c-profile-worker-result.json
          gh workflow run firebase-hosting-custom-preview.yml --repo "$GITHUB_REPOSITORY" --ref preview -f target_sha="$GITHUB_SHA"
          echo C_PROFILE_PREVIEW_HOSTING_WORKFLOW_DISPATCHED=PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-profile-follow-activation-result
          path: |
            c-profile-worker-result.json
            c-profile-rules-backup.json
          if-no-files-found: ignore
          retention-days: 14

  release_all_preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/preview' && inputs.confirm_rules_maintenance == 'GENERAL_PREVIEW_CONFIRMED' && github.repository == 'andrawing1212/soridraw-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP660_APPROVED_PARENT: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check exact current PREVIEW Worker versions BEFORE any shared Functions changes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview
          test "$APP660_APPROVED_PARENT" = "$GITHUB_SHA"
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund
          npx --prefix functions tsc -p functions/tsconfig.json
          node scripts/verify-660-general-owner-live-modules.mjs
          node scripts/verify-680-public-unenrolled-follow.mjs
          node scripts/verify-671-public-follow-dual-ack.mjs
          node scripts/verify-653-owner-general-scope.mjs
          node --check scripts/app660-preview-owner-workers.mjs
          python3 scripts/app660-preview-owner-functions.py --package-check
          node scripts/app660-preview-owner-workers.mjs --preflight
      - name: Activate only existing three PREVIEW-scoped Auth-backed owner Functions
        run: python3 scripts/app660-preview-owner-functions.py --apply-once
      - name: Activate existing PREVIEW owner DO then Explore Worker with public-only durable lane
        run: node scripts/app660-preview-owner-workers.mjs --apply-once
      - name: Trigger existing safeguarded PREVIEW Hosting release
        run: |
          set -euo pipefail
          test -f app680-workers-result.json
          test -f app660-functions-result.json
          gh workflow run firebase-hosting-custom-preview.yml --repo "$GITHUB_REPOSITORY" --ref preview -f target_sha="$GITHUB_SHA"
          echo APP680_PREVIEW_HOSTING_DISPATCHED=PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app680-follow-all-preview-release
          path: |
            app660-functions-result.json
            app680-workers-result.json
          if-no-files-found: ignore
          retention-days: 14
