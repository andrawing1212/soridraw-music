          scripts/verify-029-music-note-library.mjs
          src/components/GlobalPlayer.tsx
          src/lib/musicNoteDetailCache.ts
          src/lib/userDataEngine.ts
          src/pages/FavoritesPage.tsx
          src/pages/SunoLibraryPage.tsx'
          actual="$(git diff --name-only "$BASE_PREVIEW_SHA" "$CLEAN_SHA")"
          test "$actual" = "$expected"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$BASE_PREVIEW_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          git push origin HEAD:preview-029-fix
          echo 'CLEAN_WORKTREE_029=PASS'

      - name: Promote exact validated tree to PREVIEW only
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/clean.env"
          git push origin "$CLEAN_SHA":refs/heads/preview
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$CLEAN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo 'PREVIEW_PROMOTION_029=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy exact validated frontend to Firebase PREVIEW
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          echo "$local_sha" > "$RUNNER_TEMP/local-index.sha"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-preview.json --non-interactive
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/live-index.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/live-index.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  echo "PREVIEW_EXACT_BUILD_PASS=$url"
                  ok=yes
                  break
                fi
              fi
              sleep 8
            done
            test "$ok" = yes
          done
          echo 'FIREBASE_PREVIEW_029=PASS'

      - name: Verify PREVIEW media endpoint and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          worker='https://soridraw-media-preview.andrawing1212.workers.dev'
          ok=''
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 30 "$worker/health" -o "$RUNNER_TEMP/media-health.json" \
              && grep -q '"ok":true' "$RUNNER_TEMP/media-health.json"; then
              ok=yes
              break
            fi
            sleep 6
          done
          test "$ok" = yes
          code="$(curl -sS -o /dev/null -D "$RUNNER_TEMP/media-options.headers" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://preview.soridraw.com' \
            -H 'Access-Control-Request-Method: GET' \
            "$worker/v1/catalog/library')"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://preview.soridraw.com' "$RUNNER_TEMP/media-options.headers"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo 'PREVIEW_MEDIA_HEALTH_029=PASS'
          echo 'MAIN_UNCHANGED_029=PASS'

      - name: Package clean PREVIEW source ZIP
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/clean.env"
          short="$(git rev-parse --short=8 "$CLEAN_SHA")"
          git archive --format=zip --output="$RUNNER_TEMP/SORIDRAW_PREVIEW_029_${short}.zip" "$CLEAN_SHA"
          sha256sum "$RUNNER_TEMP/SORIDRAW_PREVIEW_029_${short}.zip"
          echo "ZIP_PATH=$RUNNER_TEMP/SORIDRAW_PREVIEW_029_${short}.zip" >> "$GITHUB_ENV"
          echo 'PREVIEW_ZIP_029=PASS'

      - name: Upload PREVIEW ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_029
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Final result
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/feature.env"
          source "$RUNNER_TEMP/clean.env"
          echo "FEATURE_SHA=$FEATURE_SHA"
          echo "CLEAN_PREVIEW_SHA=$CLEAN_SHA"
          echo 'FIREBASE_CHANGED=true'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'
          echo 'CLOUDFLARE_MEDIA_SOURCE_CHANGED=true'
          echo 'EXPLORE_WORKER_CHANGED=false'
          echo 'TEST_CHANGED=false'
          echo 'PRODUCTION_CHANGED=false'
          echo 'SORIDRAW_PREVIEW_029=PASS'
