name: Stage4 Production Custom Domain Explore CORS

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-stage4-production-explore-cors.yml'

permissions:
  contents: read

concurrency:
  group: stage4-production-explore-cors
  cancel-in-progress: false

jobs:
  exact-live-worker-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_ORIGIN: https://soridraw.com
    steps:
      - name: Checkout preview tooling
        uses: actions/checkout@v4
        with:
          ref: preview
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact live Worker and add only production custom origin
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN secret is unavailable'; exit 2; }
          npm install --no-audit --no-fund
          npm run cf:prepare
          cp .remote-worker/worker.js "$RUNNER_TEMP/worker.before.js"
          for origin in \
            'https://soridraw-music.vercel.app' \
            'https://preview.soridraw.com' \
            'https://soridraw-test.web.app' \
            'https://soridraw-test.firebaseapp.com' \
            'https://test.soridraw.com'; do
            grep -Fq "$origin" .remote-worker/worker.js
          done
          python3 - "$RUNNER_TEMP/worker.before.js" .remote-worker/worker.js "$PROD_ORIGIN" <<'PY'
          from pathlib import Path
          import sys
          before=Path(sys.argv[1]).read_text(encoding='utf-8'); target=Path(sys.argv[2]); wanted=sys.argv[3]
          if f'"{wanted}"' in before:
              raise SystemExit('Production origin already exists in source while live CORS audit returned 403')
          anchor='  "https://test.soridraw.com",\n'
          if anchor not in before: raise SystemExit('Validated custom TEST CORS anchor missing')
          addition=f'  "{wanted}",\n'
          expected=before.replace(anchor,anchor+addition,1)
          if len(expected)-len(before)!=len(addition): raise SystemExit('Unexpected Worker source delta')
          target.write_text(expected,encoding='utf-8')
          if target.read_text(encoding='utf-8')!=expected: raise SystemExit('Worker exact patch mismatch')
          print('[Explore CORS] added only',wanted)
          PY
          grep -Fq "$PROD_ORIGIN" .remote-worker/worker.js
      - name: Deploy only prepared Explore Worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:deploy
          echo '[Explore CORS] Worker deploy: PASS'
      - name: Re-read live Worker and verify all validated origins
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .remote-worker
          npm run cf:prepare
          for origin in \
            'https://soridraw-music.vercel.app' \
            'https://preview.soridraw.com' \
            'https://soridraw-test.web.app' \
            'https://soridraw-test.firebaseapp.com' \
            'https://test.soridraw.com' \
            "$PROD_ORIGIN"; do
            grep -Fq "$origin" .remote-worker/worker.js
          done
          for origin in 'https://test.soridraw.com' "$PROD_ORIGIN"; do
            code="$(curl -sS -o /tmp/body -D /tmp/head -w '%{http_code}' -H "Origin: $origin" \
              'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1' || true)"
            allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/head)"
            echo "[Explore CORS] origin=$origin http=$code allow=${allow:-none}"
            test "$code" = 200; test "$allow" = "$origin"
          done
          echo 'EXPLORE_PRODUCTION_CUSTOM_CORS_COMPLETE=true'
          echo 'NO_D1_MIGRATION=true'
          echo 'NO_D1_WRITE=true'
          echo 'NO_R2_DATA_WRITE=true'
          echo 'NO_FIREBASE_PRODUCTION_HOSTING_DEPLOY=true'
