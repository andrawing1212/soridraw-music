name: TEMP 085 Prepare Liked Profile

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-085-liked-profile.trigger'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch own-profile liked collection UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/ExplorePage.tsx')
          text = path.read_text(encoding='utf-8')

          def once(before, after, label):
              global text
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: anchor count={count}')
              text = text.replace(before, after, 1)

          once(
              "} from '../services/exploreLikeService';\n",
              "} from '../services/exploreLikeService';\nimport { getExploreLikedTracks, rememberExploreLikedTrack } from '../services/exploreLikedTracksService';\n",
              'liked service import',
          )

          once(
              "  const [profileTracks, setProfileTracks] = useState<ExploreTrack[]>([]);\n  const [profileLoading, setProfileLoading] = useState(false);",
              "  const [profileTracks, setProfileTracks] = useState<ExploreTrack[]>([]);\n  const [profileCollection, setProfileCollection] = useState<'public' | 'liked'>('public');\n  const [profileLikedTracks, setProfileLikedTracks] = useState<ExploreTrack[]>([]);\n  const [profileLikedLoading, setProfileLikedLoading] = useState(false);\n  const [profileLikedError, setProfileLikedError] = useState('');\n  const [profileLoading, setProfileLoading] = useState(false);",
              'profile liked states',
          )

          once(
              "      setProfileTracks([]);\n      setProfileError('');\n      setFollowState(null);",
              "      setProfileTracks([]);\n      setProfileCollection('public');\n      setProfileLikedTracks([]);\n      setProfileLikedLoading(false);\n      setProfileLikedError('');\n      setProfileError('');\n      setFollowState(null);",
              'profile reset empty',
          )

          once(
              "    let cancelled = false;\n    setProfileLoading(true);\n    setProfileError('');",
              "    let cancelled = false;\n    setProfileCollection('public');\n    setProfileLikedTracks([]);\n    setProfileLikedLoading(false);\n    setProfileLikedError('');\n    setProfileLoading(true);\n    setProfileError('');",
              'profile reset load',
          )

          once(
              "  }, [profileUid, user]);\n\n  const visibleTracks = profileUid ? profileTracks : tracks;",
              "  }, [profileUid, user]);\n\n  const profileIsOwn = Boolean(profile && user?.uid === profile.uid);\n\n  useEffect(() => {\n    if (!profileUid || !profile || !user || user.uid !== profile.uid || profileCollection !== 'liked') return;\n    let cancelled = false;\n    setProfileLikedLoading(true);\n    setProfileLikedError('');\n    getExploreLikedTracks(user)\n      .then((rows) => {\n        if (cancelled) return;\n        setProfileLikedTracks(rows.map(normalizeTrack).filter((track) => track.id));\n      })\n      .catch((reason: unknown) => {\n        if (cancelled) return;\n        console.error('Explore liked track collection load failed:', reason);\n        setProfileLikedError(reason instanceof Error ? reason.message : '좋아요 곡을 불러오지 못했어요.');\n      })\n      .finally(() => {\n        if (!cancelled) setProfileLikedLoading(false);\n      });\n    return () => { cancelled = true; };\n  }, [profileUid, profile, user, profileCollection, likeAccountSyncSignal]);\n\n  const visibleTracks = profileUid\n    ? (profileIsOwn && profileCollection === 'liked' ? profileLikedTracks : profileTracks)\n    : tracks;",
              'liked collection loader',
          )

          once(
              "    setTracks(patch);\n    setProfileTracks(patch);\n  };",
              "    setTracks(patch);\n    setProfileTracks(patch);\n    setProfileLikedTracks(patch);\n  };",
              'liked count patch',
          )

          once(
              "      setLikedTrackIds((prev) => ({ ...prev, [track.id]: result.liked }));\n      updateTrackLikeCount(track.id, result.likeCount);",
              "      setLikedTrackIds((prev) => ({ ...prev, [track.id]: result.liked }));\n      rememberExploreLikedTrack(user.uid, track as unknown as Record<string, unknown>, result.liked);\n      setProfileLikedTracks((previous) => {\n        if (!result.liked) return previous.filter((item) => item.id !== track.id);\n        return previous.some((item) => item.id === track.id) ? previous : [track, ...previous];\n      });\n      updateTrackLikeCount(track.id, result.likeCount);",
              'liked local detail patch',
          )

          old_grid = """            {profileTracks.length === 0 ? (\n              <div className=\"soridraw-explore-state soridraw-explore-state--empty\">\n                <Music2 aria-hidden=\"true\" />\n                <strong>아직 공개된 곡이 없어요.</strong>\n              </div>\n            ) : (\n              <>\n                {profileTracks.some((track) => track.profilePinned) && (\n                  <div className=\"soridraw-explore-profile-section-label\"><Pin aria-hidden=\"true\" /> 고정된 공개곡</div>\n                )}\n                {renderTrackGrid(profileTracks, `${profile.nickname} 공개곡`)}\n              </>\n            )}"""
          new_grid = """            {profileIsOwn && (\n              <nav className=\"soridraw-explore-tabs\" aria-label=\"내 공개 프로필 곡 보기\">\n                <button\n                  type=\"button\"\n                  className={profileCollection === 'public' ? 'is-active' : undefined}\n                  onClick={() => setProfileCollection('public')}\n                  aria-current={profileCollection === 'public' ? 'page' : undefined}\n                >\n                  공개곡\n                </button>\n                <button\n                  type=\"button\"\n                  className={profileCollection === 'liked' ? 'is-active' : undefined}\n                  onClick={() => setProfileCollection('liked')}\n                  aria-current={profileCollection === 'liked' ? 'page' : undefined}\n                >\n                  좋아요 곡\n                </button>\n              </nav>\n            )}\n\n            {profileIsOwn && profileCollection === 'liked' ? (\n              profileLikedLoading ? (\n                <div className=\"soridraw-explore-state\" role=\"status\"><Loader2 className=\"soridraw-explore-spinner\" aria-hidden=\"true\" /> 좋아요 곡을 불러오는 중</div>\n              ) : profileLikedError ? (\n                <div className=\"soridraw-explore-state\">{profileLikedError}</div>\n              ) : profileLikedTracks.length === 0 ? (\n                <div className=\"soridraw-explore-state soridraw-explore-state--empty\">\n                  <Heart aria-hidden=\"true\" />\n                  <strong>아직 좋아요한 곡이 없어요.</strong>\n                </div>\n              ) : (\n                renderTrackGrid(profileLikedTracks, `${profile.nickname} 좋아요 곡`)\n              )\n            ) : profileTracks.length === 0 ? (\n              <div className=\"soridraw-explore-state soridraw-explore-state--empty\">\n                <Music2 aria-hidden=\"true\" />\n                <strong>아직 공개된 곡이 없어요.</strong>\n              </div>\n            ) : (\n              <>\n                {profileTracks.some((track) => track.profilePinned) && (\n                  <div className=\"soridraw-explore-profile-section-label\"><Pin aria-hidden=\"true\" /> 고정된 공개곡</div>\n                )}\n                {renderTrackGrid(profileTracks, `${profile.nickname} 공개곡`)}\n              </>\n            )}"""
          once(old_grid, new_grid, 'profile collection tabs/grid')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Materialize Worker 052 from current canonical
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$temp_dir/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$temp_dir" node cloudflare/explore-worker/patches/052-liked-track-collection.mjs
          cp "$temp_dir/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js

      - name: Set app version 085
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'public/app-version.json';
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          value.version = '085';
          fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          NODE

      - name: Install and validate
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-085-liked-profile.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-084-publication-write-returning.mjs

      - name: Commit prepared 085 code only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ExplorePage.tsx public/app-version.json cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git diff --cached --check
          git commit -m 'feat(preview): add own-profile liked song collection'
          git push origin HEAD:preview
