name: Apply 987 Preview Server Pagination

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/apply-987-preview-server-pagination.yml'
      - '.deploy/apply-987-preview-server-pagination-parity.py'

permissions:
  contents: write

concurrency:
  group: apply-987-preview-server-pagination
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Apply 987 pagination patch
        run: python3 .deploy/apply-987-preview-server-pagination-parity.py

      - name: Verify changed scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          changed="$(git diff --name-only)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/App\.tsx|src/pages/FavoritesPage\.tsx|src/pages/SunoLibraryPage\.tsx)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            echo "$bad"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo '987 source is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx
          git commit -m 'fix: use server-canonical pagination in preview'
          git push origin HEAD:preview
