name: TEMP Inspect Music Note IO V2

on:
  push:
    branches: [preview-musicnote-save-unsave-io-v2]
    paths:
      - '.github/workflows/temp-inspect-musicnote-io-v2.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-musicnote-save-unsave-io-v2
          fetch-depth: 0
      - name: Persist focused inspection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text(encoding='utf-8')
          lines=s.splitlines()
          terms=[
            'const findServerMatchingFavorites = async',
            'const findServerExistingFavorite = async',
            "showToast('저장되었습니다.')",
            'recentFavoriteDetachedAt',
            "scheduleListBundleWrite('musicNote'",
            "subscribeListBundle('musicNote'",
            'const syncMusicNoteIncrementalFromRemoteVersion',
            'MUSIC_NOTE_SYNC_VERSION_EVENT',
          ]
          chunks=[]
          seen=set()
          for term in terms:
            for idx,line in enumerate(lines,1):
              if term in line:
                lo=max(1,idx-80); hi=min(len(lines),idx+180)
                key=(lo,hi)
                if key in seen: continue
                seen.add(key)
                chunks.append(f'\n===== {term} @ {idx} =====\n')
                chunks.extend(f'{n}: {lines[n-1]}\n' for n in range(lo,hi+1))
          Path('.deploy/tmp-musicnote-io-inspect.txt').write_text(''.join(chunks),encoding='utf-8')
          PY
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .deploy/tmp-musicnote-io-inspect.txt
          git commit -m "chore(preview): persist Music Note IO inspection"
          git push origin HEAD:preview-musicnote-save-unsave-io-v2
