name: TEMP 144 All Public Like Parity
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-144-all-public-like-parity.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 889c66c01775459efd0c383b30f4c7dd07fbb94b
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Count total public catalog before bounded one-time audit
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          node "$W" d1 execute DB --remote --config "$PWD/canonical/wrangler.preview.jsonc" --command "SELECT COUNT(*) AS public_total FROM tracks WHERE is_public=1 AND status='published'" --json > "$RUNNER_TEMP/count144.json"
          node <<'NODE'
          const fs=require('fs'),rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/count144.json','utf8')).flatMap(x=>x.results||[]);
          if(rows.length!==1)throw Error('D1 count missing');
          const n=Number(rows[0].public_total);
          console.log('ALL_PUBLIC_TOTAL='+n);
          if(!Number.isSafeInteger(n)||n>200)throw Error('Public count exceeds bounded audit; pagination needed');
          NODE
      - name: Read-only full current public set with canonical, relation and derived counts
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          node "$W" d1 execute DB --remote --config "$PWD/canonical/wrangler.preview.jsonc" --command "SELECT t.id,COALESCE(s.like_count,0) AS canonical_count,(SELECT COUNT(*) FROM likes l WHERE l.track_id=t.id) AS relation_count,d.row_json AS derived_json,s.updated_at AS stats_updated_at,t.updated_at AS track_updated_at FROM tracks t LEFT JOIN track_stats s ON s.track_id=t.id LEFT JOIN explore_derived_tracks d ON d.id=t.id WHERE t.is_public=1 AND t.status='published' ORDER BY t.published_at DESC LIMIT 201" --json > "$RUNNER_TEMP/all144.json"
          for sort in latest popular;do
            node "$W" r2 object get "soridraw-profile-media/internal/explore/shared-feed-v112/$sort-40.json" --file "$RUNNER_TEMP/shared-$sort.json" --remote >/dev/null
            node "$W" r2 object get "soridraw-profile-media-preview/internal/explore/feed-v1/$sort-40.json" --file "$RUNNER_TEMP/local-$sort.json" --remote >/dev/null
          done
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),r=process.env.RUNNER_TEMP,rows=JSON.parse(fs.readFileSync(r+'/all144.json','utf8')).flatMap(x=>x.results||[]);
          const hash=id=>crypto.createHash('sha256').update(id).digest('hex').slice(0,10);
          const get=(scope,sort)=>JSON.parse(fs.readFileSync(r+'/'+scope+'-'+sort+'.json','utf8'))?.payload?.data?.items||[];
          const maps={};
          for(const scope of ['shared','local'])for(const sort of ['latest','popular'])maps[scope+sort]=new Map(get(scope,sort).map(x=>[String(x.id||x.trackId||''),x]));
          const count=x=>Number(x?.likeCount??x?.stats?.likeCount??x?.like_count??0);
          let relation=0,derived=0,cache=0,missing=0;
          for(const row of rows){
            const id=String(row.id),canonical=Number(row.canonical_count||0),rel=Number(row.relation_count||0);
            let d={};try{d=JSON.parse(row.derived_json||'{}');}catch{}
            const dcount=count(d);
            const vals=Object.fromEntries(Object.entries(maps).map(([k,v])=>[k,v.has(id)?count(v.get(id)):'ABSENT']));
            if(canonical!==rel)relation++;
            if(canonical!==dcount)derived++;
            if(Object.values(vals).some(x=>x==='ABSENT'))missing++;
            if(Object.values(vals).some(x=>typeof x==='number'&&x!==canonical))cache++;
            if(canonical!==rel||canonical!==dcount||Object.values(vals).some(x=>x!==canonical)){
              console.log('ALL_SONG_MISMATCH hash='+hash(id)+' canonical='+canonical+' relation='+rel+' derived='+dcount+' sharedLatest='+vals.sharedlatest+' sharedPopular='+vals.sharedpopular+' localLatest='+vals.locallatest+' localPopular='+vals.localpopular+' statsUpdated='+row.stats_updated_at+' trackUpdated='+row.track_updated_at);
            }
          }
          console.log('ALL_SONG_SUMMARY checked='+rows.length+' canonicalRelationMismatch='+relation+' derivedMismatch='+derived+' feedCountMismatch='+cache+' missingFirstPage='+missing);
          console.log('D1_WRITE=0 R2_WRITE=0 DEPLOY=0');
          NODE
