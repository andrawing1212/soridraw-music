name: SORIDRAW Maintenance M-009 Docs Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m009-docs-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0
      - name: Patch maintenance backlog and master status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('docs/SORIDRAW_MAINTENANCE_BACKLOG.md')
          s=p.read_text(encoding='utf-8')
          def r(old,new,label):
              global s
              c=s.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1, got {c}')
              s=s.replace(old,new,1)
          r('Status: ACTIVE / GATE A REPO-SIDE SAFETY CLEARED / M-008 RULES ALIGNMENT BLOCKS 2-A4c','Status: ACTIVE / GATE A REPO-SIDE SAFETY CLEARED / M-008 RULES + M-009 VERCEL PREBUILD BLOCK 2-A4c','backlog status')
          r('- M-008 — **CRITICAL BLOCKER CONFIRMED**: read-only inspection proved the currently deployed Firestore Rules do not contain the V2 `users/{uid}/songs/{songId}` rule that exists in repository source.\n\nTherefore **2-A4c remains blocked**. No 2-A4c write-capable workflow may be created or armed until a separately approved Rules-only alignment/deployment clears M-008.','- M-008 — **CRITICAL BLOCKER CONFIRMED**: read-only inspection proved the currently deployed Firestore Rules do not contain the V2 `users/{uid}/songs/{songId}` rule that exists in repository source.\n- M-009 — **HIGH BLOCKER CONFIRMED**: Vercel Preview `npm run build` currently stops in the historical prebuild patch chain with `normal update updatedAtMs anchor mismatch: 0`; the same failure existed before the Gate A dependency lockfile change.\n\nTherefore **2-A4c remains blocked**. M-009 Preview build health and M-008 Rules alignment must both be cleared before any 2-A4c write-capable workflow is created or armed.','checkpoint')
          anchor='| M-008 | Deployed Firestore Rules do not yet contain the repository V2 canonical-song rule | CRITICAL / BLOCKER FOR 2-A4c | Read-only Rules API inspection succeeded. Deployed ruleset `8d0a2de9-fa29-4988-801e-cc45d3f0af1b` retains V1 recent/favorites rules but lacks `users/{uid}/songs/{songId}` + `hasValidV2SongMetadata`. Repo/deployed normalized Rules hashes differ. | **Mandatory before 2-A4c shadow writes.** Revalidate source, then deploy Rules only under separate exact approval; verify deployed hash/features afterward. | **OPEN / CRITICAL BLOCKER** |'
          r(anchor,anchor+'\n| M-009 | Vercel Preview `npm run build` fails in historical prebuild source-patch chain | HIGH / BLOCKER FOR 2-A4c | Vercel deployments for commits `c695776...` and `e505ce7...` both failed with `normal update updatedAtMs anchor mismatch: 0`. GitHub `npx vite build` passes because it bypasses npm lifecycle `prebuild`; therefore final Preview HEAD is not yet proven deployable through the real Vercel path. | **Before 2-A4c Preview activation.** Audit the exact stale patch owner, make only the minimum source/build-pipeline correction, require full `npm run build`, contracts and exact Vercel READY verification. No Firebase change in this fix. | **OPEN / HIGH BLOCKER** |','table')
          r('No Rules deployment was performed because Gate A approval explicitly prohibited it.','No Rules deployment was performed because Gate A approval explicitly prohibited it.\n\n### M-009\n\nPost-Gate-A Vercel inspection found two Preview deployments failing before Vite with the same historical prebuild patch error: `normal update updatedAtMs anchor mismatch: 0`. This failure predates the Gate A dependency lockfile change. Full detail: `docs/SORIDRAW_MAINTENANCE_M009_VERCEL_PREBUILD_BLOCKER.md`.','m009 evidence')
          r('3. **M-008 RULES ALIGNMENT REQUIRED NOW**\n   - repository V2 Rules source revalidation,\n   - Rules-only deployment only after separate exact approval,\n   - deployed post-check must prove the V2 canonical-song rule is present while V1 compatibility rules remain.\n4. **2-A4c** — only after M-008 is cleared and then separately approved for its exact V2 shadow-write scope; V1-first/V2-shadow with fresh quota gate.','3. **M-009 PREVIEW BUILD PIPELINE REPAIR REQUIRED NOW**\n   - audit the current `prebuild` patch chain,\n   - correct only the stale/required patch ownership,\n   - require the real `npm run build` path and exact Vercel Preview READY verification,\n   - no Firebase data/Rules/Functions/Hosting change in this repair.\n4. **M-008 RULES ALIGNMENT AFTER M-009**\n   - repository V2 Rules source revalidation,\n   - Rules-only deployment only after separate exact approval,\n   - deployed post-check must prove the V2 canonical-song rule is present while V1 compatibility rules remain.\n5. **2-A4c** — only after both M-009 and M-008 are cleared and then separately approved for its exact V2 shadow-write scope; V1-first/V2-shadow with fresh quota gate.','order')
          s=s.replace('5. **2-A4d**','6. **2-A4d**').replace('6. **Maintenance Gate B','7. **Maintenance Gate B').replace('7. **Step 4','8. **Step 4').replace('8. **Maintenance Gate C','9. **Maintenance Gate C').replace('9. **Step 5','10. **Step 5').replace('10. `user_plans`','11. `user_plans`')
          p.write_text(s,encoding='utf-8')

          p=Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          s=p.read_text(encoding='utf-8')
          old='Status: IMPLEMENTATION / Maintenance Gate A repo-side safety complete — full TypeScript is clean, dependency critical/high findings are 0/0, and Node24-compatible migration Action majors are verified; read-only inspection confirmed deployed Firestore Rules still lack the V2 canonical-song rule, so M-008 is the critical blocker and 2-A4c/Step 4 remain blocked pending separately approved Rules-only alignment'
          new='Status: IMPLEMENTATION / Maintenance Gate A repo-side safety complete — full TypeScript is clean, dependency critical/high findings are 0/0, and Node24-compatible migration Action majors are verified; two blockers now remain before 2-A4c: M-009 Vercel Preview `npm run build` fails in the historical prebuild patch chain, and M-008 deployed Firestore Rules still lack the V2 canonical-song rule; Step 4 remains blocked'
          if s.count(old)!=1: raise SystemExit('master top status anchor mismatch')
          s=s.replace(old,new,1)
          old='### Step 2 — V2 code implementation on preview (2-A4b + Gate A repo-side safety complete; M-008 Rules alignment + 2-A4c/d still gated) 🔄'
          new='### Step 2 — V2 code implementation on preview (2-A4b + Gate A repo-side safety complete; M-009 Preview build + M-008 Rules alignment + 2-A4c/d still gated) 🔄'
          if s.count(old)!=1: raise SystemExit('master step2 heading anchor mismatch')
          s=s.replace(old,new,1)
          old='    - [~] Maintenance Gate A: M-001 TypeScript CLOSED; M-002 critical/high dependency findings cleared to 0/0 with residual low/moderate debt retained for Step 5; M-003 Actions runtime CLOSED; M-008 deployed Rules missing V2 canonical-song rule remains CRITICAL blocker before 2-A4c.'
          new=old+'\n    - [ ] M-009 Vercel Preview build blocker: real `npm run build` fails at `normal update updatedAtMs anchor mismatch: 0`; must be repaired and exact Preview READY verified before M-008 deployment/2-A4c activation.'
          if s.count(old)!=1: raise SystemExit('master gate tracker anchor mismatch')
          s=s.replace(old,new,1)
          old='### Step 4 — Preview validation (0/12; blocked pending M-008 Rules alignment + separately approved 2-A4c/d write stages) ⏳'
          new='### Step 4 — Preview validation (0/12; blocked pending M-009 Preview build repair + M-008 Rules alignment + separately approved 2-A4c/d write stages) ⏳'
          if s.count(old)!=1: raise SystemExit('master step4 anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit docs and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_MAINTENANCE_BACKLOG.md docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git commit -m 'docs: track Vercel Preview prebuild blocker M-009'
          git push origin HEAD:preview
          git pull --rebase origin preview
          git rm .github/workflows/maintenance-m009-docs-finalize.yml
          git commit -m 'chore: remove M-009 docs finalizer'
          git push origin HEAD:preview
