name: APP713 isolated server-held follow contract
on:
  push:
    branches: [fix/app713-server-owned-follow]
    paths:
      - '.github/workflows/app713-isolated-contract-check.yml'
      - 'cloudflare/explore-worker/runtime/owner-follow-*-713.mjs'
      - 'scripts/verify-713-*.mjs'
      - 'scripts/lib/follow-server-owned-patch-713.mjs'
      - 'scripts/app713-preview-stage-inactive.mjs'
      - 'src/services/exploreFollowServerOwned713.ts'
      - 'functions/src/ownerFollowActorVerify713.ts'
      - 'functions/scripts/test-713-current-actor.cjs'
      - 'scripts/app713-create-actor-proof-off.py'
      - 'scripts/app713-canary-live-readonly.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test private server-owned follow chain with no real user writes
        run: |
          node scripts/verify-713-follow-server-intent.mjs
          node scripts/verify-713-follow-click-ingress.mjs
          node scripts/verify-713-follow-trusted-canonical.mjs
          node scripts/verify-713-follow-private-pipeline.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Follow client TypeScript and Vite build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
          node scripts/verify-389-social-client-batching.mjs --follow-only
          node scripts/verify-713-follow-browser-receipt.mjs
          node scripts/verify-713-follow-actor-oracle.mjs
      - name: Build canary-only Firebase actor proof without deployment
        run: |
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm run build --prefix functions
          node functions/scripts/test-713-current-actor.cjs
          python3 scripts/app713-create-actor-proof-off.py --package-check
      - name: GET-only exact active private Worker release preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-713-active-module-patches.mjs
      - name: GET-only inactive Worker staging preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP713_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/app713-preview-stage-inactive.mjs --preflight
      # Director-approved inactive staging: exact active versions must match;
      # do not deploy traffic, enable the feature, or write shared user data.
      - name: Stage APP713 OFF once without deploying traffic
        if: github.event.head_commit.message == 'APP713_STAGE_INACTIVE_ONCE' || github.event.head_commit.message == 'APP713_PREPARE_OFF_ONCE'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP713_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/app713-preview-stage-inactive.mjs --stage-inactive
      - name: Authenticate existing Firebase for one new inactive actor verifier
        if: github.event.head_commit.message == 'APP713_PREPARE_OFF_ONCE'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5
      # One-shot OFF-only preparation. Canary write route stays disabled.
      - name: Create exactly one isolated canary actor verifier (runtime OFF)
        if: github.event.head_commit.message == 'APP713_PREPARE_OFF_ONCE'
        env:
          APP713_APPROVED_SHA: ${{ github.sha }}
        run: python3 scripts/app713-create-actor-proof-off.py --create-off
      - name: Authenticate Firebase only for APP713 read-only canary gate
        if: github.event.head_commit.message == 'APP713_READONLY_CANARY_PREFLIGHT'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5
      - name: GET-only Cloudflare and Firebase canary release eligibility
        if: github.event.head_commit.message == 'APP713_READONLY_CANARY_PREFLIGHT'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/app713-canary-live-readonly.mjs
