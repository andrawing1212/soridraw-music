name: SORIDRAW Backend V2 Step 3-5 Per-user Readonly Verification

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-5-per-user-readonly-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      EXPECTED_STRUCTURES: '3'
      EXPECTED_RECENT_BUNDLES: '10'
      EXPECTED_RECENT_ITEMS: '68'
      EXPECTED_FAVORITES: '738'
      EXPECTED_PLAYLIST_HEADERS: '42'
      EXPECTED_PLAYLIST_ITEMS: '49'
      APPROVED_SCOPE: Step 3-5 per-user automatic verification read-only approved 2026-08-26 KST

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - run: npm ci --ignore-scripts

      - name: Step 3-5 per-user read-only verification
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$TARGET_PROJECT"
          export GCLOUD_PROJECT="$TARGET_PROJECT"
          export GOOGLE_CLOUD_QUOTA_PROJECT="$TARGET_PROJECT"
          node <<'NODE'
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = String(process.env.TARGET_PROJECT || '');
          const bucketName = String(process.env.TARGET_BUCKET || '');
          const backupPrefix = String(process.env.BACKUP_PREFIX || '');
          const expectedManifestHash = String(process.env.EXPECTED_MANIFEST_SHA256 || '');
          const expected = {
            structures: Number(process.env.EXPECTED_STRUCTURES || 0),
            recentBundles: Number(process.env.EXPECTED_RECENT_BUNDLES || 0),
            recentItems: Number(process.env.EXPECTED_RECENT_ITEMS || 0),
            favorites: Number(process.env.EXPECTED_FAVORITES || 0),
            playlistHeaders: Number(process.env.EXPECTED_PLAYLIST_HEADERS || 0),
            playlistItems: Number(process.env.EXPECTED_PLAYLIST_ITEMS || 0),
          };
          const approvedScope = String(process.env.APPROVED_SCOPE || '');

          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          if (bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('BUCKET_PIN_MISMATCH');
          if (!approvedScope.includes('3-5') || !approvedScope.toLowerCase().includes('read-only')) throw new Error('READONLY_APPROVAL_MARKER_MISSING');
          if (JSON.stringify(expected) !== JSON.stringify({structures:3,recentBundles:10,recentItems:68,favorites:738,playlistHeaders:42,playlistItems:49})) throw new Error('EXPECTED_SCOPE_MISMATCH');

          const stableHash = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const nonEmptyString = (value) => typeof value === 'string' && value.trim() ? value.trim() : null;
          const deterministicRecentSongId = (uid, path, index) => `v1r_${stableHash(`${uid}\n${path}\n${index}`).slice(0, 32)}`;
          const deterministicFavoriteSongId = (path) => `v1f_${stableHash(path).slice(0, 32)}`;

          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string', 'boolean'].includes(typeof value)) return value;
            if (typeof value === 'number') {
              if (Number.isNaN(value)) return { __type: 'number', value: 'NaN' };
              if (value === Infinity) return { __type: 'number', value: 'Infinity' };
              if (value === -Infinity) return { __type: 'number', value: '-Infinity' };
              if (Object.is(value, -0)) return { __type: 'number', value: '-0' };
              return value;
            }
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return { __type: 'bytes', base64: Buffer.from(value).toString('base64') };
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return { __type: 'date', iso: value.toISOString() };
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return { __type: 'timestamp', seconds: value.seconds, nanoseconds: value.nanoseconds };
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return { __type: 'geopoint', latitude: value.latitude, longitude: value.longitude };
            if (typeof value?.path === 'string' && value?.firestore) return { __type: 'reference', path: value.path };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));
            throw new Error('UNSUPPORTED_VALUE_TYPE');
          };
          const digest = (value) => stableHash(JSON.stringify(canonicalize(value)));

          const metricValue = (point) => {
            const raw = point?.value?.int64Value ?? point?.value?.doubleValue ?? 0;
            const value = Number(raw);
            return Number.isFinite(value) && value > 0 ? value : 0;
          };
          const queryMetric = async (accessToken, metricType, startMs, endMs) => {
            const params = new URLSearchParams({
              filter: `metric.type = "${metricType}"`,
              'interval.startTime': new Date(startMs).toISOString(),
              'interval.endTime': new Date(endMs).toISOString(),
              view: 'FULL',
              pageSize: '1000',
            });
            let pageToken = '';
            let total = 0;
            let pointCount = 0;
            let pages = 0;
            do {
              if (pageToken) params.set('pageToken', pageToken); else params.delete('pageToken');
              const response = await fetch(`https://monitoring.googleapis.com/v3/projects/${projectId}/timeSeries?${params}`, {
                headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, Accept: 'application/json' },
              });
              const text = await response.text();
              if (!response.ok) {
                const error = new Error(`MONITORING_${response.status}`);
                error.statusCode = response.status;
                throw error;
              }
              const payload = text ? JSON.parse(text) : {};
              for (const series of payload.timeSeries || []) for (const point of series.points || []) { total += metricValue(point); pointCount += 1; }
              pageToken = String(payload.nextPageToken || '');
              if (++pages > 5) throw new Error('MONITORING_PAGINATION_LIMIT');
            } while (pageToken);
            return { total: Math.round(total), pointCount };
          };
          const queryFamily = async (accessToken, candidates, startMs, endMs) => {
            for (const metricType of candidates) {
              try {
                const result = await queryMetric(accessToken, metricType, startMs, endMs);
                if (result.pointCount > 0) return result.total;
              } catch (error) {
                if (error?.statusCode === 400 || error?.statusCode === 404) continue;
                throw error;
              }
            }
            return 0;
          };

          const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step35-readonly-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const bucket = getStorage(app).bucket(bucketName);

            const credential = admin.credential.applicationDefault();
            const token = await credential.getAccessToken();
            const accessToken = String(token?.access_token || '');
            if (!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');

            const requiredPermissions = ['datastore.entities.get', 'datastore.entities.list'];
            const iamResponse = await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify({ permissions: requiredPermissions }),
            });
            if (!iamResponse.ok) throw new Error(`IAM_TEST_${iamResponse.status}`);
            const granted = new Set(((await iamResponse.json()).permissions || []).map(String));
            if (requiredPermissions.some((permission) => !granted.has(permission))) throw new Error('READONLY_IAM_MISSING');

            const now = new Date();
            const kstDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
            const dayStartMs = Date.parse(`${kstDate}T00:00:00+09:00`);
            const [todayReads, todayWrites, todayDeletes] = await Promise.all([
              queryFamily(accessToken, ['firestore.googleapis.com/document/read_ops_count', 'firestore.googleapis.com/document/read_count'], dayStartMs, now.getTime()),
              queryFamily(accessToken, ['firestore.googleapis.com/document/write_ops_count', 'firestore.googleapis.com/document/write_count'], dayStartMs, now.getTime()),
              queryFamily(accessToken, ['firestore.googleapis.com/document/delete_ops_count', 'firestore.googleapis.com/document/delete_count'], dayStartMs, now.getTime()),
            ]);
            const safeReadCap = Math.min(10_000, Math.max(0, 50_000 - todayReads - 10_000));
            const estimatedReads = 3_000;
            if (safeReadCap < estimatedReads) throw new Error(`READ_QUOTA_PAUSE:${safeReadCap}`);
            console.log('STEP35_QUOTA=' + JSON.stringify({ todayReads, todayWrites, todayDeletes, safeReadCap, estimatedReads }));

            const [manifestBytes] = await bucket.file(`${backupPrefix}/manifest.json`).download();
            if (stableHash(manifestBytes) !== expectedManifestHash) throw new Error('MANIFEST_HASH_MISMATCH');
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            if (manifest?.complete !== true || manifest?.targetProjectId !== projectId) throw new Error('MANIFEST_INVALID');

            const specs = [
              ['structures','user_structures','user_structures.ndjson',expected.structures],
              ['recent','user_recent_songs','user_recent_songs.ndjson',expected.recentBundles],
              ['favorites','favorites','favorites.ndjson',expected.favorites],
              ['playlistHeaders','playlist_lists','playlist_lists.ndjson',expected.playlistHeaders],
              ['playlistItems','playlist_items','playlist_items.ndjson',expected.playlistItems],
            ];
            const backup = {};
            for (const [key,id,fileName,count] of specs) {
              const dataset = (manifest.datasets || []).find((entry) => entry?.id === id);
              if (!dataset || dataset.fileName !== fileName || dataset.documentCount !== count) throw new Error(`BACKUP_DATASET_INVALID:${key}`);
              const [bytes] = await bucket.file(`${backupPrefix}/${fileName}`).download();
              if (stableHash(bytes) !== dataset.sha256) throw new Error(`BACKUP_DATASET_HASH_MISMATCH:${key}`);
              const records = bytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
              if (records.length !== count) throw new Error(`BACKUP_RECORD_COUNT_MISMATCH:${key}`);
              backup[key] = records;
            }

            const summary = new Map();
            const ensureUser = (uid) => {
              if (!summary.has(uid)) summary.set(uid, {
                settings:{v1:0,v2:0,ok:0}, playlists:{v1:0,v2:0,ok:0}, playlistItems:{v1:0,v2:0,ok:0}, recent:{v1:0,v2:0,ok:0}, favorites:{v1:0,v2:0,ok:0}, errors:[]
              });
              return summary.get(uid);
            };
            const fail = (uid, code) => { ensureUser(uid).errors.push(code); };

            const structuresSnap = await db.collection('user_structures').get();
            if (structuresSnap.size !== expected.structures) throw new Error(`LIVE_STRUCTURES_COUNT:${structuresSnap.size}`);
            const structureBackup = new Map(backup.structures.map((r) => [String(r.path), r.data]));
            for (const doc of structuresSnap.docs) {
              const uid = doc.id;
              const s = ensureUser(uid); s.settings.v1 += 1;
              if (!structureBackup.has(doc.ref.path) || digest(structureBackup.get(doc.ref.path)) !== digest(doc.data())) fail(uid,'settings-v1-drift');
              const v2 = await db.doc(`users/${uid}/settings/sections`).get();
              if (!v2.exists) fail(uid,'settings-v2-missing');
              else { s.settings.v2 += 1; if (digest(v2.data()) === digest(doc.data())) s.settings.ok += 1; else fail(uid,'settings-payload-mismatch'); }
            }

            const headerSnap = await db.collectionGroup('lists').get();
            const liveHeaders = headerSnap.docs.filter((doc) => /^user_playlists\/[^/]+\/lists\/[^/]+$/.test(doc.ref.path));
            if (liveHeaders.length !== expected.playlistHeaders) throw new Error(`LIVE_PLAYLIST_HEADER_COUNT:${liveHeaders.length}`);
            const headerBackup = new Map(backup.playlistHeaders.map((r) => [String(r.path), r.data]));
            for (const doc of liveHeaders) {
              const m = /^user_playlists\/([^/]+)\/lists\/([^/]+)$/.exec(doc.ref.path); if (!m) throw new Error('HEADER_PATH_INVALID');
              const [,uid,playlistId] = m; const s = ensureUser(uid); s.playlists.v1 += 1;
              if (!headerBackup.has(doc.ref.path) || digest(headerBackup.get(doc.ref.path)) !== digest(doc.data())) fail(uid,'playlist-header-v1-drift');
              const v2 = await db.doc(`users/${uid}/playlists/${playlistId}`).get();
              if (!v2.exists) fail(uid,'playlist-header-v2-missing');
              else { s.playlists.v2 += 1; if (digest(v2.data()) === digest(doc.data())) s.playlists.ok += 1; else fail(uid,'playlist-header-payload-mismatch'); }
            }

            const itemSnap = await db.collectionGroup('items').get();
            const liveItems = itemSnap.docs.filter((doc) => /^user_playlists\/[^/]+\/lists\/[^/]+\/items\/[^/]+$/.test(doc.ref.path));
            if (liveItems.length !== expected.playlistItems) throw new Error(`LIVE_PLAYLIST_ITEM_COUNT:${liveItems.length}`);
            const itemBackup = new Map(backup.playlistItems.map((r) => [String(r.path), r.data]));
            for (const doc of liveItems) {
              const m = /^user_playlists\/([^/]+)\/lists\/([^/]+)\/items\/([^/]+)$/.exec(doc.ref.path); if (!m) throw new Error('ITEM_PATH_INVALID');
              const [,uid,playlistId,itemId] = m; const s = ensureUser(uid); s.playlistItems.v1 += 1;
              if (!itemBackup.has(doc.ref.path) || digest(itemBackup.get(doc.ref.path)) !== digest(doc.data())) fail(uid,'playlist-item-v1-drift');
              const v2 = await db.doc(`users/${uid}/playlists/${playlistId}/items/${itemId}`).get();
              if (!v2.exists) fail(uid,'playlist-item-v2-missing');
              else { s.playlistItems.v2 += 1; if (digest(v2.data()) === digest(doc.data())) s.playlistItems.ok += 1; else fail(uid,'playlist-item-payload-mismatch'); }
            }

            const recentSnap = await db.collection('user_recent_songs').get();
            if (recentSnap.size !== expected.recentBundles) throw new Error(`LIVE_RECENT_BUNDLE_COUNT:${recentSnap.size}`);
            const recentBackup = new Map(backup.recent.map((r) => [String(r.path), r.data]));
            let recentItemsTotal = 0;
            for (const doc of recentSnap.docs) {
              const uid = doc.id; const s = ensureUser(uid);
              if (!recentBackup.has(doc.ref.path) || digest(recentBackup.get(doc.ref.path)) !== digest(doc.data())) fail(uid,'recent-v1-drift');
              const songs = Array.isArray(doc.data().songs) ? doc.data().songs : [];
              recentItemsTotal += songs.length; s.recent.v1 += songs.length;
              for (let index = 0; index < songs.length; index += 1) {
                const v2 = await db.doc(`users/${uid}/songs/${deterministicRecentSongId(uid, doc.ref.path, index)}`).get();
                if (!v2.exists) { fail(uid,'recent-v2-missing'); continue; }
                s.recent.v2 += 1;
                const data = v2.data(); const stripped = {...data};
                for (const key of ['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','legacyRecentIndex']) delete stripped[key];
                if (digest(stripped) === digest(songs[index]) && data.schemaVersion === 2 && data.musicNote === false && data.recentVisible === true && data.legacyRecentIndex === index) s.recent.ok += 1;
                else fail(uid,'recent-v2-mismatch');
              }
            }
            if (recentItemsTotal !== expected.recentItems) throw new Error(`LIVE_RECENT_ITEM_COUNT:${recentItemsTotal}`);

            const favoritesSnap = await db.collection('favorites').get();
            if (favoritesSnap.size !== expected.favorites) throw new Error(`LIVE_FAVORITES_COUNT:${favoritesSnap.size}`);
            const favoriteBackup = new Map(backup.favorites.map((r) => [String(r.path), r.data]));
            for (const doc of favoritesSnap.docs) {
              const uid = nonEmptyString(doc.data().uid); if (!uid) throw new Error('FAVORITE_UID_MISSING');
              const s = ensureUser(uid); s.favorites.v1 += 1;
              if (!favoriteBackup.has(doc.ref.path) || digest(favoriteBackup.get(doc.ref.path)) !== digest(doc.data())) fail(uid,'favorite-v1-drift');
              const v2 = await db.doc(`users/${uid}/songs/${deterministicFavoriteSongId(doc.ref.path)}`).get();
              if (!v2.exists) { fail(uid,'favorite-v2-missing'); continue; }
              s.favorites.v2 += 1;
              const data = v2.data(); const stripped = {...data};
              for (const key of ['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','legacyFavoriteId','legacyFavoriteKey']) delete stripped[key];
              const keyOk = (nonEmptyString(doc.data().favoriteKey) || null) === (nonEmptyString(data.legacyFavoriteKey) || null);
              if (digest(stripped) === digest(doc.data()) && data.schemaVersion === 2 && data.musicNote === true && data.recentVisible === false && data.legacyFavoriteId === doc.id && keyOk) s.favorites.ok += 1;
              else fail(uid,'favorite-v2-mismatch');
            }

            const uids = [...summary.keys()].sort();
            const publicRows = [];
            let totalErrors = 0;
            for (let i = 0; i < uids.length; i += 1) {
              const uid = uids[i]; const row = summary.get(uid);
              totalErrors += row.errors.length;
              const songSnap = await db.collection(`users/${uid}/songs`).get();
              const playlistSnap = await db.collection(`users/${uid}/playlists`).get();
              const expectedSongs = row.recent.v1 + row.favorites.v1;
              if (songSnap.size !== expectedSongs) row.errors.push(`song-collection-count:${songSnap.size}/${expectedSongs}`);
              if (playlistSnap.size !== row.playlists.v1) row.errors.push(`playlist-collection-count:${playlistSnap.size}/${row.playlists.v1}`);
              totalErrors = totalErrors - 0 + row.errors.length - row.errors.length + totalErrors;
              publicRows.push({
                user: `user-${String(i+1).padStart(2,'0')}`,
                settings: row.settings,
                playlists: row.playlists,
                playlistItems: row.playlistItems,
                recent: row.recent,
                favorites: row.favorites,
                expectedSongDocs: expectedSongs,
                actualSongDocs: songSnap.size,
                expectedPlaylistDocs: row.playlists.v1,
                actualPlaylistDocs: playlistSnap.size,
                errors: [...new Set(row.errors)].sort(),
              });
            }
            const finalErrorCount = publicRows.reduce((n,row) => n + row.errors.length, 0);
            console.log('STEP35_PER_USER=' + JSON.stringify(publicRows));
            console.log('STEP35_RESULT=' + JSON.stringify({
              users: publicRows.length,
              settings: expected.structures,
              playlistHeaders: expected.playlistHeaders,
              playlistItems: expected.playlistItems,
              recentSongs: expected.recentItems,
              favorites: expected.favorites,
              totalMigratedV2DocumentsExpected: expected.structures + expected.playlistHeaders + expected.playlistItems + expected.recentItems + expected.favorites,
              usersPassed: publicRows.filter((row) => row.errors.length === 0).length,
              usersFailed: publicRows.filter((row) => row.errors.length > 0).length,
              totalErrorCategories: finalErrorCount,
              allPayloadParity: finalErrorCount === 0,
              v1Writes: 0,
              v1Deletes: 0,
              v2Writes: 0,
              v2Deletes: 0,
              storageWrites: 0,
              rulesDeploys: 0,
              functionsDeploys: 0,
              hostingDeploys: 0,
            }));
            if (finalErrorCount > 0) throw new Error(`PER_USER_VERIFICATION_FAILED:${finalErrorCount}`);
          })().catch((error) => {
            console.error('STEP35_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          }).finally(async () => { await deleteApp(app); });
          NODE
