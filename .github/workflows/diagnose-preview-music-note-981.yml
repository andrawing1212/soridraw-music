name: Diagnose Preview Music Note 981

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/diagnose-preview-music-note-981.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate current final source
        run: npm run prebuild
      - name: Record final Music Note batch size
        shell: bash
        run: |
          grep -n -E 'MUSIC_NOTE_VISIBLE_BATCH_SIZE|FAVORITES_PAGE_SIZE' src/pages/FavoritesPage.tsx src/App.tsx || true
      - name: Print current Music Note pagination state only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          lines = s.splitlines()
          needles = [
              'const FAVORITES_PAGE_SIZE',
              'const loadMoreFavorites = useCallback',
              'const hasCachedMusicNote',
              'const shouldVerifyMusicNoteBundle',
              'favoritePaginationCursorRef.current',
              'favoritePaginationExhaustedRef.current',
              'favoritePaginationFallbackModeRef.current',
              'setHasMoreFavorites(',
              'readMusicNotePaginationCursor',
              'writeMusicNotePaginationCursor',
              'bundle.cursorCreatedAtMs',
              'bundle.hasMore',
          ]
          hits = set()
          for i, line in enumerate(lines):
              if any(n in line for n in needles):
                  for j in range(max(0, i-8), min(len(lines), i+28)):
                      hits.add(j)
          if not hits:
              raise SystemExit('No Music Note pagination anchors found')
          last = -2
          for j in sorted(hits):
              if j > last + 1:
                  print('\n---')
              print(f'{j+1:06d}: {lines[j]}')
              last = j
          PY
      - name: Print FavoritesPage load-more gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          lines = s.splitlines()
          needles = ['MUSIC_NOTE_VISIBLE_BATCH_SIZE', 'canShowCachedMusicNoteMore', 'onLoadMoreFavorites', 'hasMoreFavorites']
          hits = set()
          for i, line in enumerate(lines):
              if any(n in line for n in needles):
                  for j in range(max(0, i-5), min(len(lines), i+16)):
                      hits.add(j)
          last = -2
          for j in sorted(hits):
              if j > last + 1:
                  print('\n---')
              print(f'{j+1:06d}: {lines[j]}')
              last = j
          PY
      - name: Fail closed if current pagination anchors are missing
        shell: bash
        run: |
          grep -Fq 'const loadMoreFavorites = useCallback' src/App.tsx
          grep -Fq 'favoritePaginationCursorRef.current' src/App.tsx
          grep -Fq 'favoritePaginationExhaustedRef.current' src/App.tsx
          grep -Fq 'setHasMoreFavorites(' src/App.tsx
          grep -Fq 'SORIDRAW_979_MUSIC_NOTE_LEGACY_CACHE_CURSOR_RECOVERY' src/App.tsx
