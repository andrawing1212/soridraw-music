name: TEMP app124 common cache repair validation

on:
  push:
    branches:
      - work/app124-one-time-feed-cache-repair
    paths:
      - '.github/workflows/temp-app124-cache-repair-validate.yml'
      - 'src/pages/ExplorePage.tsx'
      - 'public/app-version.json'
      - 'scripts/verify-124-mobile-shared-cache-repair.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/app124-one-time-feed-cache-repair
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: App124 verifier
        run: node scripts/verify-124-mobile-shared-cache-repair.mjs
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
