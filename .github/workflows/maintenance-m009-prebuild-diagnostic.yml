name: SORIDRAW Maintenance M-009 Prebuild Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m009-prebuild-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Prepare disposable semantic compatibility v2
        shell: bash
        run: |
          python3 .deploy/m009_diagnostic_compat.py
          python3 .deploy/m009_fix_generated_874.py
          python3 -m py_compile .deploy/apply-874-build-safety.py .deploy/apply-901-music-note-10-incremental-sync.py .deploy/apply-905-recent-songs-cache-live-accounting.py .deploy/apply-910-recent-text-batch-unsave-fix.py

      - name: Execute complete real prebuild and capture next blocker
        shell: bash
        run: |
          set +e
          npm run prebuild > /tmp/m009.log 2>&1
          code=$?
          set -e
          echo "M009_PREBUILD_EXIT=${code}"
          echo 'M009_LOG_TAIL_BEGIN'
          tail -n 900 /tmp/m009.log
          echo 'M009_LOG_TAIL_END'
          echo 'M009_DIFF_BEGIN'
          git diff --stat
          git diff --name-only
          echo 'M009_DIFF_END'
          exit 0

      - name: Prove no Firebase change
        if: always()
        run: |
          echo 'M009_FIREBASE_DATA_READS=0'
          echo 'M009_FIREBASE_DATA_WRITES=0'
          echo 'M009_FIREBASE_DATA_DELETES=0'
          echo 'M009_RULES_DEPLOYS=0'
          echo 'M009_FUNCTIONS_DEPLOYS=0'
          echo 'M009_HOSTING_DEPLOYS=0'
