name: SORIDRAW Publication 1-1 024 Final PREVIEW

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 1b8c960526bc0f98ba90e8c7031cb2f4ccaa9bab
      FEATURE_SHA: 3e1e7251a3e39c36b4f7fcb9776f11d9be7d6ffd
      MAIN_SHA: 49c799cbb46d137539f74a48c261f7256762336f
      CLEAN_PREVIEW_RUNTIME_VERSION: 74eed373-e8c9-4109-98bc-1d46c364504a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PROD_WORKER: soridraw-explore-api
      PREVIEW_DB_NAME: soridraw-explore-preview-db
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2: soridraw-profile-media-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Guard exact feature and main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FEATURE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          actual="$(git diff --name-only "$BASE_SHA" HEAD | grep -v '^.github/workflows/temp-deploy-publication-one-read-one-write-024-v3.yml$' | sort)"
          test "$actual" = 'cloudflare/explore-worker/patches/024-publication-one-read-one-write.mjs'
          node --check cloudflare/explore-worker/patches/024-publication-one-read-one-write.mjs
          echo 'SOURCE_GUARD=PASS'
          echo 'TS_BUILD_REUSED_FROM_RUN=34074540923'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Normalize PREVIEW schema and deploy clean final Worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy024final && mkdir .deploy024final

          node <<'NODE'
          const fs=require('fs');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,P=process.env.PREVIEW_WORKER,PROD=process.env.PROD_WORKER,CLEAN=process.env.CLEAN_PREVIEW_RUNTIME_VERSION;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,800)}`);return x.result||x;}
          async function active(name){const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${name}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y?.percentage||0)-Number(x?.percentage||0))[0];if(!a?.version_id||Number(a?.percentage||0)<99.99)throw new Error('active version missing '+name);return a.version_id;}
          (async()=>{const activePreview=await active(P),prod=await active(PROD);fs.writeFileSync('.deploy024final/prod-before.txt',prod);const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${P}/versions/${CLEAN}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];if(!m?.content_base64)throw new Error('clean runtime missing');const clean=Buffer.from(m.content_base64,'base64').toString('utf8');for(const t of ['publicationRepublishSemanticUnchanged022','publicationResolveProfileHandle023','patchExploreProfileR2Mutation019','AND is_public <> 1','AND is_public <> 0'])if(!clean.includes(t))throw new Error('clean runtime prerequisite missing '+t);for(const bad of ['__soridraw_index_migrate_024_','__soridraw_readonly_schema_024_'])if(clean.includes(bad))throw new Error('clean runtime has temp route');fs.writeFileSync('.deploy024final/clean.js',clean);fs.writeFileSync('.deploy024final/worker.js',clean);const settings=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${P}/settings`);const config={name:P,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-09-04').slice(0,10),workers_dev:true,keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.PREVIEW_DB_NAME,database_id:process.env.PREVIEW_DB_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PREVIEW_R2}],observability:settings.observability&&typeof settings.observability==='object'?{enabled:settings.observability.enabled!==false}:{enabled:true}};if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)config.compatibility_flags=settings.compatibility_flags;fs.writeFileSync('.deploy024final/wrangler.jsonc',JSON.stringify(config,null,2));console.log(`[snapshot] active=${activePreview} clean=${CLEAN} prod=${prod}`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),clean=fs.readFileSync('.deploy024final/clean.js','utf8'),token=crypto.randomBytes(24).toString('hex'),route='/__soridraw_schema024_'+crypto.randomBytes(8).toString('hex'),re=/async\s+fetch\(([^)]*)\)\s*\{/,m=clean.match(re);if(!m)throw new Error('fetch anchor missing');const [req,env]=m[1].split(',').map(s=>s.trim());const probe=`\n      if (new URL(${req}.url).pathname === ${JSON.stringify(route)}) {\n        if (${req}.headers.get('x-soridraw-migrate') !== ${JSON.stringify(token)}) return new Response('Not Found',{status:404});\n        await ${env}.DB.batch([\n          ${env}.DB.prepare(\"CREATE INDEX IF NOT EXISTS idx_tracks_owner_profile_order ON tracks (owner_uid, profile_pinned DESC, published_at DESC, id DESC)\"),\n          ${env}.DB.prepare(\"CREATE INDEX IF NOT EXISTS idx_tracks_latest_order ON tracks (published_at DESC, id DESC)\"),\n          ${env}.DB.prepare(\"CREATE INDEX IF NOT EXISTS idx_tracks_primary_genre_latest ON tracks (primary_genre, published_at DESC, id DESC)\"),\n          ${env}.DB.prepare(\"DROP INDEX IF EXISTS idx_tracks_owner_public_pinned\"),\n          ${env}.DB.prepare(\"DROP INDEX IF EXISTS idx_tracks_public_latest\"),\n          ${env}.DB.prepare(\"DROP INDEX IF EXISTS idx_tracks_public_primary_genre\")\n        ]);\n        const [indexes,triggers,profilePlan,latestPlan,genrePlan]=await Promise.all([\n          ${env}.DB.prepare(\"SELECT name,sql FROM sqlite_master WHERE type='index' AND tbl_name='tracks' ORDER BY name\").all(),\n          ${env}.DB.prepare(\"SELECT name,sql FROM sqlite_master WHERE type='trigger' AND tbl_name='tracks' ORDER BY name\").all(),\n          ${env}.DB.prepare(\"EXPLAIN QUERY PLAN SELECT id FROM tracks INDEXED BY idx_tracks_owner_profile_order WHERE owner_uid=? AND is_public=1 ORDER BY profile_pinned DESC,published_at DESC,id DESC LIMIT 24\").bind('__audit__').all(),\n          ${env}.DB.prepare(\"EXPLAIN QUERY PLAN SELECT id FROM tracks INDEXED BY idx_tracks_latest_order WHERE is_public=1 ORDER BY published_at DESC,id DESC LIMIT 50\").all(),\n          ${env}.DB.prepare(\"EXPLAIN QUERY PLAN SELECT id FROM tracks INDEXED BY idx_tracks_primary_genre_latest WHERE is_public=1 AND status='published' AND primary_genre=? ORDER BY published_at DESC,id DESC LIMIT 50\").bind('__audit__').all()\n        ]);\n        return new Response(JSON.stringify({indexes:indexes.results||[],triggers:triggers.results||[],profilePlan:profilePlan.results||[],latestPlan:latestPlan.results||[],genrePlan:genrePlan.results||[]}),{status:200,headers:{'content-type':'application/json','cache-control':'no-store'}});\n      }\n`;fs.writeFileSync('.deploy024final/migrator.js',clean.replace(m[0],m[0]+probe));fs.writeFileSync('.deploy024final/token.txt',token);fs.writeFileSync('.deploy024final/route.txt',route);
          NODE

          deployed_temp=0
          cleanup_on_fail(){
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "[024 final recovery] status=$status; restoring clean 023 Worker"
              cp .deploy024final/clean.js .deploy024final/worker.js
              npx wrangler deploy --strict --config .deploy024final/wrangler.jsonc >/tmp/024final-recover.log 2>&1 || cat /tmp/024final-recover.log
            fi
            exit "$status"
          }
          trap cleanup_on_fail EXIT

          cp .deploy024final/migrator.js .deploy024final/worker.js
          npx wrangler deploy --strict --config .deploy024final/wrangler.jsonc >/tmp/024final-migrator.log 2>&1
          deployed_temp=1
          token="$(cat .deploy024final/token.txt)"; route="$(cat .deploy024final/route.txt)"
          code=''
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o .deploy024final/schema.json -w '%{http_code}' -H "x-soridraw-migrate: $token" -X POST "$PREVIEW_BASE$route" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('.deploy024final/schema.json','utf8')),by=new Map((x.indexes||[]).map(r=>[r.name,String(r.sql||'')]));for(const n of ['idx_tracks_owner_profile_order','idx_tracks_latest_order','idx_tracks_primary_genre_latest'])if(!by.has(n))throw new Error('replacement index missing '+n);for(const n of ['idx_tracks_owner_public_pinned','idx_tracks_public_latest','idx_tracks_public_primary_genre'])if(by.has(n))throw new Error('old visibility index remains '+n);if([...by].some(([,sql])=>/\bis_public\b/.test(sql)))throw new Error('is_public still indexed');if((x.triggers||[]).length)throw new Error('tracks trigger remains');for(const p of [x.profilePlan,x.latestPlan,x.genrePlan]){const d=(p||[]).map(r=>String(r.detail||'')).join(' | ');if(!/USING (?:COVERING )?INDEX/.test(d))throw new Error('replacement plan missing: '+d);}console.log('D1_SCHEMA_024=PASS');
          NODE

          cp .deploy024final/clean.js .deploy024final/worker.js
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.deploy024final" node patches/024-publication-one-read-one-write.mjs
          node --check .deploy024final/worker.js
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('.deploy024final/worker.js','utf8');function fn(name){let p=s.indexOf(`async function ${name}(`);if(p<0)p=s.indexOf(`function ${name}(`);if(p<0)throw new Error('missing '+name);const b=s.indexOf('{',p);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i],n=s[i+1];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){const z=s.indexOf('\n',i+2);i=z<0?s.length:z;continue}if(c==='/'&&n==='*'){const z=s.indexOf('*/',i+2);i=z<0?s.length:z+1;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(p,i+1)}throw new Error('unterminated '+name)}const read=fn('publicationReadState016'),resolver=fn('publicationResolveProfileHandle023'),pub=fn('handleMusicNotePublicationSingleWrite016'),profile=fn('patchExploreProfileR2Mutation019');if(read.includes('JOIN ')||read.includes('track_stats')||read.includes('public_profiles')||!read.includes('FROM tracks'))throw new Error('D1 read > canonical row');if(resolver.includes('env.DB')||!resolver.includes('readExploreR2Json'))throw new Error('profile handle still D1');if(!pub.includes('publicationReadProfileR2024(env, authContext)')||!pub.includes('if (!profile && !previous?.id)'))throw new Error('existing publish profile D1 fallback remains');if(profile.includes('env.DB')||!profile.includes('previous?.likeCount')||!profile.includes('previous?.stats'))throw new Error('R2 engagement preserve failed');console.log('WORKER_SOURCE_024=PASS');
          NODE

          npx wrangler deploy --strict --config .deploy024final/wrangler.jsonc
          sleep 4

          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER,fs=require('fs');async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error('CF '+r.status);return x.result||x;}function fn(s,name){let p=s.indexOf(`async function ${name}(`);if(p<0)p=s.indexOf(`function ${name}(`);if(p<0)throw new Error('deployed missing '+name);const b=s.indexOf('{',p);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i],n=s[i+1];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){const z=s.indexOf('\n',i+2);i=z<0?s.length:z;continue}if(c==='/'&&n==='*'){const z=s.indexOf('*/',i+2);i=z<0?s.length:z+1;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(p,i+1)}throw new Error('unterminated '+name)}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0],v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${a.version_id}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0],s=Buffer.from(m.content_base64,'base64').toString('utf8');for(const bad of ['__soridraw_schema024_','__soridraw_index_migrate_024_','__soridraw_readonly_schema_024_'])if(s.includes(bad))throw new Error('temp route leaked');const read=fn(s,'publicationReadState016'),resolver=fn(s,'publicationResolveProfileHandle023'),pub=fn(s,'handleMusicNotePublicationSingleWrite016');if(read.includes('JOIN ')||read.includes('track_stats')||read.includes('public_profiles')||!read.includes('FROM tracks'))throw new Error('deployed canonical read invalid');if(resolver.includes('env.DB')||!resolver.includes('readExploreR2Json'))throw new Error('deployed resolver D1');if(!pub.includes('publicationReadProfileR2024'))throw new Error('deployed R2 profile path missing');fs.writeFileSync('.deploy024final/preview-version.txt',a.version_id);console.log('PREVIEW_VERSION='+a.version_id);console.log('DEPLOYED_RUNTIME_024=PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE

          test "$(curl -sS -o /tmp/feed.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/feed?sort=latest&limit=1")" = 200
          test "$(curl -sS -o /tmp/genres.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/genres")" = 200
          test "$(curl -sS -o /tmp/pub.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" -H 'content-type: application/json' -X POST --data '{}' "$PREVIEW_BASE/v1/publications")" = 401
          test "$(curl -sS -o /tmp/site.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$PREVIEW_ORIGIN")" = 200
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"

          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PROD_WORKER,fs=require('fs'),before=fs.readFileSync('.deploy024final/prod-before.txt','utf8').trim();async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error('CF '+r.status);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];if(a?.version_id!==before)throw new Error('PRODUCTION Worker changed');console.log('MAIN_PRODUCTION_UNCHANGED=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE

          trap - EXIT
          echo 'PREVIEW_024_DEPLOY=PASS'
          echo 'FIREBASE_HOSTING_CHANGED=false'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'

      - name: Package deployed source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zipname="SORIDRAW_PREVIEW_024_publication_1read_1write_$(git rev-parse --short=8 HEAD).zip"
          git archive --format=zip --output="$zipname" HEAD -- . ':(exclude).github/workflows/temp-deploy-publication-one-read-one-write-024-v3.yml'
          test -s "$zipname"
          echo "ZIP_NAME=$zipname" >> "$GITHUB_ENV"
          sha256sum "$zipname"

      - uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_024_publication_1read_1write
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
