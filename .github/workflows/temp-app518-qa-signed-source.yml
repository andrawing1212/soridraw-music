name: APP518 QA signed admission source check
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/media-worker/src/app518QaGithubOidc518.js'
      - 'cloudflare/media-worker/src/app518QaSignedEntry518.js'
      - 'qa/app518/live/verify-github-signed518.mjs'
      - '.github/workflows/temp-app518-qa-signed-source.yml'
permissions:
  contents: read
jobs:
  signed_token_gate_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify signed source guard in networkless fake JWT mode
        run: node qa/app518/live/verify-github-signed518.mjs
      - name: Stage alongside immutable PR528 and verify default remains OFF
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "864f796da24413309567198c9de502b13cdedd50^{commit}"
          git worktree add --detach "$RUNNER_TEMP/app518-pinned-candidate" 864f796da24413309567198c9de502b13cdedd50
          (cd "$RUNNER_TEMP/app518-pinned-candidate/cloudflare/media-worker" && npm install --ignore-scripts --no-audit --no-fund --no-save)
          APP518_PINNED_CANDIDATE_DIR="$RUNNER_TEMP/app518-pinned-candidate" \
            node qa/app518/live/verify-signed-worker-entry518.mjs
      - name: Make sure no cloud mutation function was introduced
        shell: bash
        run: |
          set -euo pipefail
          ! grep -En 'wrangler[[:space:]]+deploy|firebase[[:space:]]+deploy|gcloud[[:space:]].*add-iam-policy-binding|fetch\([^)]*method:[[:space:]]*.(POST|PUT|DELETE)' qa/app518/live/verify-github-signed518.mjs
          echo 'APP518_QA_OIDC_SOURCE_ONLY_NO_CLOUD_MUTATIONS=PASS'
