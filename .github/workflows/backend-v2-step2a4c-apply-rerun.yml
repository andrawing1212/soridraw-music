name: SORIDRAW Backend V2 Step 2-A4c Apply Rerun

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4c-apply-rerun.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-backend-v2-step2a4c-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Apply approved 2-A4c runtime source
        run: python3 .deploy/run-backend-v2-step2a4c.py

      - name: Apply build-patcher compatibility
        run: python3 .deploy/apply-backend-v2-step2a4c-build-compat.py

      - name: Install and validate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm ci --ignore-scripts
          npx tsc --noEmit
          python3 .deploy/verify-backend-v2-step2a4c.py source
          npx tsx .deploy/test-backend-v2-step2a4c-boundary.ts

      - name: Save intended source before build-time patchers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a4c-intended/src/data /tmp/a4c-intended/.deploy
          cp src/App.tsx /tmp/a4c-intended/src/App.tsx
          cp src/data/v1MutationBoundary.ts /tmp/a4c-intended/src/data/v1MutationBoundary.ts
          cp src/data/indexedDbMirrorOutbox.ts /tmp/a4c-intended/src/data/indexedDbMirrorOutbox.ts
          cp src/data/v2PreviewShadowMirror.ts /tmp/a4c-intended/src/data/v2PreviewShadowMirror.ts
          cp .deploy/apply-910-recent-text-batch-unsave-fix.py /tmp/a4c-intended/.deploy/apply-910-recent-text-batch-unsave-fix.py
          cp .deploy/apply-912-heart-triggered-recent-save.py /tmp/a4c-intended/.deploy/apply-912-heart-triggered-recent-save.py
          cp .deploy/apply-913-recent-save-runtime-fix.py /tmp/a4c-intended/.deploy/apply-913-recent-save-runtime-fix.py

      - name: Exact production build path
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npx tsc --noEmit
          python3 .deploy/verify-backend-v2-step2a4c.py built

      - name: Restore intended source
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/a4c-intended/src/App.tsx src/App.tsx
          cp /tmp/a4c-intended/src/data/v1MutationBoundary.ts src/data/v1MutationBoundary.ts
          cp /tmp/a4c-intended/src/data/indexedDbMirrorOutbox.ts src/data/indexedDbMirrorOutbox.ts
          cp /tmp/a4c-intended/src/data/v2PreviewShadowMirror.ts src/data/v2PreviewShadowMirror.ts
          cp /tmp/a4c-intended/.deploy/apply-910-recent-text-batch-unsave-fix.py .deploy/apply-910-recent-text-batch-unsave-fix.py
          cp /tmp/a4c-intended/.deploy/apply-912-heart-triggered-recent-save.py .deploy/apply-912-heart-triggered-recent-save.py
          cp /tmp/a4c-intended/.deploy/apply-913-recent-save-runtime-fix.py .deploy/apply-913-recent-save-runtime-fix.py
          git diff --check
          npx tsc --noEmit
          python3 .deploy/verify-backend-v2-step2a4c.py final

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/data/v1MutationBoundary.ts src/data/indexedDbMirrorOutbox.ts src/data/v2PreviewShadowMirror.ts .deploy/apply-910-recent-text-batch-unsave-fix.py .deploy/apply-912-heart-triggered-recent-save.py .deploy/apply-913-recent-save-runtime-fix.py
          git commit -m "feat: activate Preview V1-first V2 shadow mirror"
          git push origin HEAD:preview
