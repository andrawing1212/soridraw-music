name: TEMP Restore Explore Like Worker Bindings 117

on:
  push:
    branches:
      - release/restore-like-worker-bindings-117
    paths:
      - .github/workflows/temp-restore-like-worker-bindings-117.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      RELEASE_SOURCE_SHA: b9b612adbfe49a462c72c98f9efc65165d32b31c
    steps:
      - name: Checkout exact approved PREVIEW source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          node scripts/verify-release-promotion-system.mjs
          echo WORKER_BINDING_RELEASE_SOURCE=PASS

      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: D1 SELECT-only preflight
        shell: bash
        run: |
          set -euo pipefail
          # Generate config without changing traffic.
          node .deploy/release-worker-runtime.mjs test dry-run
          cfg="$PWD/cloudflare/explore-worker/.release-system/test/wrangler.jsonc"
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          node "$WRANGLER" d1 execute DB --remote --config "$cfg" --command "SELECT (SELECT COUNT(*) FROM sqlite_schema WHERE type='table' AND name IN ('explore_derived_state','explore_derived_changes','explore_derived_tracks','explore_derived_profiles','explore_like_batches_035','explore_like_processor_035')) AS required_tables,(SELECT seeded FROM explore_derived_state WHERE id=1) AS seeded" --json > "$RUNNER_TEMP/d1.json"
          node -e "const p=require(process.env.RUNNER_TEMP+'/d1.json'),r=p.flatMap(x=>x.results||[])[0];if(!r||+r.required_tables<6||+r.seeded!==1)throw Error('D1 preflight failed')"
          echo D1_SELECT_ONLY_PREFLIGHT=PASS

      - name: Restore TEST Worker required bindings
        shell: bash
        run: |
          set -euo pipefail
          node .deploy/release-worker-runtime.mjs test upload | tee "$RUNNER_TEMP/test-upload.log"
          test_version="$(sed -n 's/^TEST_WORKER_UPLOADED_VERSION=//p' "$RUNNER_TEMP/test-upload.log" | tail -1)"
          test -n "$test_version"
          RELEASE_WORKER_VERSION="$test_version" node .deploy/release-worker-runtime.mjs test activate
          node .deploy/release-worker-runtime.mjs test verify
          echo "TEST_RESTORED_VERSION=$test_version"

      - name: Verify TEST live required bindings
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/soridraw-explore-test/settings"             > "$RUNNER_TEMP/test-settings.json"
          jq -e '.result.bindings[] | select(.name=="LIKE_RATE_LIMITER" and .type=="ratelimit")' "$RUNNER_TEMP/test-settings.json" >/dev/null
          jq -e '.result.bindings[] | select(.name=="EXPLORE_LIKE_BATCH_SCHEDULER" and .type=="durable_object_namespace" and .class_name=="ExploreLikeBatchScheduler103")' "$RUNNER_TEMP/test-settings.json" >/dev/null
          echo TEST_REQUIRED_LIKE_BINDINGS=PASS

      - name: Restore PRODUCTION Worker required bindings
        shell: bash
        run: |
          set -euo pipefail
          node .deploy/release-worker-runtime.mjs production upload | tee "$RUNNER_TEMP/prod-upload.log"
          prod_version="$(sed -n 's/^PRODUCTION_WORKER_UPLOADED_VERSION=//p' "$RUNNER_TEMP/prod-upload.log" | tail -1)"
          test -n "$prod_version"
          RELEASE_WORKER_VERSION="$prod_version" node .deploy/release-worker-runtime.mjs production activate
          node .deploy/release-worker-runtime.mjs production verify
          echo "PRODUCTION_RESTORED_VERSION=$prod_version"

      - name: Final three-environment binding audit
        shell: bash
        run: |
          set -euo pipefail
          for worker in soridraw-explore-preview soridraw-explore-test soridraw-explore-api; do
            body="$RUNNER_TEMP/$worker.json"
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/settings" > "$body"
            jq -e '.result.bindings[] | select(.name=="LIKE_RATE_LIMITER" and .type=="ratelimit")' "$body" >/dev/null
            jq -e '.result.bindings[] | select(.name=="EXPLORE_LIKE_BATCH_SCHEDULER" and .type=="durable_object_namespace" and .class_name=="ExploreLikeBatchScheduler103")' "$body" >/dev/null
            echo "$worker REQUIRED_LIKE_BINDINGS=PASS"
          done
          echo THREE_ENV_REQUIRED_LIKE_BINDINGS=PASS
          echo USER_DATA_MUTATION=NONE
          echo FUNCTIONS_RULES_CHANGE=NONE
          echo HOSTING_CHANGE=NONE
