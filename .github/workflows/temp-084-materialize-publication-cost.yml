name: TEMP 084 Materialize Publication Cost

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-084-materialize.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-084-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize Worker 051 and verifier contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/explore-worker/patches/051-publication-write-returning.mjs
          tmp="$RUNNER_TEMP/worker051"
          mkdir -p "$tmp"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$tmp/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$tmp" node cloudflare/explore-worker/patches/051-publication-write-returning.mjs
          cp "$tmp/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt

          node <<'NODE'
          const fs=require('fs');
          const path='cloudflare/explore-worker/release-patches.json';
          const manifest=JSON.parse(fs.readFileSync(path,'utf8'));
          const patch='051-publication-write-returning.mjs';
          if (manifest.patches.at(-1)!=='050-publication-primary-key-batch-read.mjs') throw new Error('unexpected manifest tail: '+manifest.patches.at(-1));
          if (!manifest.patches.includes(patch)) manifest.patches.push(patch);
          fs.writeFileSync(path,JSON.stringify(manifest,null,2)+'\n');

          const replace=(file,before,after,label)=>{
            let text=fs.readFileSync(file,'utf8');
            const count=text.split(before).length-1;
            if(count!==1) throw new Error(label+' anchor count='+count);
            fs.writeFileSync(file,text.replace(before,after));
          };

          replace(
            'scripts/verify-083-publication-pk-read.mjs',
            "assert.equal(manifest.patches.at(-1),'050-publication-primary-key-batch-read.mjs');\nassert.match(worker,/SORIDRAW_PUBLICATION_PK_BATCH_READ_050_20260914/);",
            "assert.equal(manifest.patches.at(-2),'050-publication-primary-key-batch-read.mjs');\nassert.equal(manifest.patches.at(-1),'051-publication-write-returning.mjs');\nassert.match(worker,/SORIDRAW_PUBLICATION_PK_BATCH_READ_050_20260914/);\nassert.match(worker,/SORIDRAW_PUBLICATION_WRITE_RETURNING_051_20260914/);",
            '083 manifest tail'
          );

          replace(
            'scripts/verify-explore-like-cost-optimization.mjs',
            "assert.equal(manifest.patches.at(-6), '045-publication-revision-metadata.mjs', '045 must remain before 046/047/048/049/050');\nassert.equal(manifest.patches.at(-5), '046-publication-write-compaction.mjs', '046 must remain before 047/048/049/050');\nassert.equal(manifest.patches.at(-4), '047-publication-state-transition.mjs', '047 must remain before 048/049/050');\nassert.equal(manifest.patches.at(-3), '048-page-exit-publication-batch.mjs', '048 must remain before 049/050');\nassert.equal(manifest.patches.at(-2), '049-publication-internal-batch-compaction.mjs', '049 must remain before 050');\nassert.equal(manifest.patches.at(-1), '050-publication-primary-key-batch-read.mjs', '050 publication PK batch read must be final');",
            "assert.equal(manifest.patches.at(-7), '045-publication-revision-metadata.mjs', '045 must remain before 046/047/048/049/050/051');\nassert.equal(manifest.patches.at(-6), '046-publication-write-compaction.mjs', '046 must remain before 047/048/049/050/051');\nassert.equal(manifest.patches.at(-5), '047-publication-state-transition.mjs', '047 must remain before 048/049/050/051');\nassert.equal(manifest.patches.at(-4), '048-page-exit-publication-batch.mjs', '048 must remain before 049/050/051');\nassert.equal(manifest.patches.at(-3), '049-publication-internal-batch-compaction.mjs', '049 must remain before 050/051');\nassert.equal(manifest.patches.at(-2), '050-publication-primary-key-batch-read.mjs', '050 must remain before 051');\nassert.equal(manifest.patches.at(-1), '051-publication-write-returning.mjs', '051 publication write-returning must be final');",
            'global manifest tail'
          );

          let v82=fs.readFileSync('scripts/verify-082-publication-batch.mjs','utf8');
          v82=v82.replace(
            "assert.equal(manifest.patches.at(-2),'049-publication-internal-batch-compaction.mjs');\nassert.equal(manifest.patches.at(-1),'050-publication-primary-key-batch-read.mjs');",
            "assert.equal(manifest.patches.at(-3),'049-publication-internal-batch-compaction.mjs');\nassert.equal(manifest.patches.at(-2),'050-publication-primary-key-batch-read.mjs');\nassert.equal(manifest.patches.at(-1),'051-publication-write-returning.mjs');"
          );
          v82=v82.replace(
            "assert.match(batch,/SELECT \\* FROM tracks\\s+WHERE id IN/);\nassert.match(batch,/canonicalRows = \\(rows\\.results \\|\\| \\[\\]\\)\\.filter/);\nassert.match(batch,/String\\(row\\?\\.owner_uid \\|\\| ''\\) === authContext\\.uid/);\nassert.match(batch,/env\\.DB\\.batch\\(statements\\)/);\nassert.match(batch,/if \\(Number\\(item\\.row\\.profile_pinned \\|\\| 0\\) !== nextPinned\\) \\{ sets\\.push\\('profile_pinned=\\?'\\)/);\nassert.match(batch,/PUBLICATION_BATCH_STATS_PREFLIGHT_FAILED/);",
            "assert.match(batch,/readMusicNotePublicationR2Payload\\(env, authContext\\.uid\\)/);\nassert.match(batch,/env\\.DB\\.batch\\(updateStatements\\)/);\nassert.match(batch,/RETURNING \\*/);\nassert.match(batch,/unresolvedTrackIds/);\nassert.match(batch,/env\\.DB\\.batch\\(statements\\)/);\nassert.match(batch,/String\\(row\\?\\.owner_uid \\|\\| ''\\) !== authContext\\.uid/);\nassert.doesNotMatch(batch,/FROM track_stats WHERE track_id IN/);"
          );
          v82=v82.replace(
            "console.log('PASS 082: registered publication changes share canonical reads/batch writes; 083 PK lookup preserves the 082 contract; missing R2 forces one canonical self-heal.');",
            "console.log('PASS 082: publication batching and missing-R2 self-heal remain protected; 084 warm writes use RETURNING with bounded cold/unresolved reads.');"
          );
          fs.writeFileSync('scripts/verify-082-publication-batch.mjs',v82);
          NODE

          node --check cloudflare/explore-worker/canonical/preview-worker.js

      - name: Install and validate app
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

      - name: Run cost regression suite
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-082-publication-batch.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-083-publication-pk-read.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-084-publication-write-returning.mjs
          node scripts/verify-explore-deploy-preflight.mjs

      - name: Commit validated 084 product code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'soridraw-release-bot@users.noreply.github.com'
          git add \
            cloudflare/explore-worker/canonical/preview-worker.js \
            cloudflare/explore-worker/canonical/source-sha256.txt \
            cloudflare/explore-worker/release-patches.json \
            scripts/verify-082-publication-batch.mjs \
            scripts/verify-083-publication-pk-read.mjs \
            scripts/verify-explore-like-cost-optimization.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_PRODUCT_CHANGES'; exit 1; }
          git commit -m 'fix(preview): compact publication reads with write returning'
          git push origin HEAD:preview
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
