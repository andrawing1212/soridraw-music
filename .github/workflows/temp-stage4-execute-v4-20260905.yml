name: SORIDRAW Stage4 Execute V4

on:
  push:
    branches:
      - preview
    paths:
      - '.github/workflows/temp-stage4-execute-v4-20260905.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30

      - name: Verify source baseline unchanged
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0e3e05b25cbc1f1bd41470b091a3fe453525e378 HEAD
          if ! git diff --quiet 0e3e05b25cbc1f1bd41470b091a3fe453525e378..HEAD -- src/App.tsx functions/src/index.ts; then
            echo 'Source files changed since audited baseline; refusing stale patch.'
            git diff --stat 0e3e05b25cbc1f1bd41470b091a3fe453525e378..HEAD -- src/App.tsx functions/src/index.ts
            exit 20
          fi

      - name: Apply Stage4 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/run-stage4-patch-20260905.py
          git diff --check
          grep -Fq 'RECENT_SONGS_MUTATION_EPOCH_STORAGE_BASE' src/App.tsx
          grep -Fq 'processMusicNoteBulkPage' src/App.tsx
          grep -Fq 'MUSIC_NOTE_BULK_PAGE_LIMIT = 120' functions/src/index.ts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: App TypeScript and build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node scripts/audit-broad-reads.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Functions TypeScript build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix functions
          npm run build --prefix functions
          test -f functions/lib/securedIndex.js
          grep -Fq 'processMusicNoteBulkPage' functions/lib/securedIndex.js

      - name: Capture main before
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote origin refs/heads/main | awk '{print $1}' > /tmp/main-before.sha
          test -s /tmp/main-before.sha

      - name: Commit tested source to preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx functions/src/index.ts
          git diff --cached --check
          git commit -m 'fix(preview): bound Music Note bulk and block recent resurrection'
          git push origin HEAD:preview
          git rev-parse HEAD > /tmp/source.sha

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy bounded Music Note function
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only functions:processMusicNoteBulkPage \
            --project soridraw-app-866a5 \
            --non-interactive

      - name: Deploy Firebase PREVIEW Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project soridraw \
            --config firebase.hosting-preview.json \
            --non-interactive

      - name: Verify preview hosts
        shell: bash
        run: |
          set -euo pipefail
          for host in soridraw-preview.web.app preview.soridraw.com; do
            code=$(curl -sS -L --max-time 30 -o /tmp/${host//./_}.html -w '%{http_code}' https://$host/)
            test "$code" = '200'
            grep -q '<div id="root"></div>' /tmp/${host//./_}.html
            grep -q '/assets/index-' /tmp/${host//./_}.html
          done
          a=$(grep -oE '/assets/index-[^" ]+\.js' /tmp/soridraw-preview_web_app.html | head -n1)
          b=$(grep -oE '/assets/index-[^" ]+\.js' /tmp/preview_soridraw_com.html | head -n1)
          test -n "$a"
          test "$a" = "$b"
          echo "PREVIEW_ASSET=$a"

      - name: Verify main unchanged
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote origin refs/heads/main | awk '{print $1}' > /tmp/main-after.sha
          cmp /tmp/main-before.sha /tmp/main-after.sha
          echo "SOURCE_COMMIT=$(cat /tmp/source.sha)"
          echo 'MAIN_CHANGED=false'
          echo 'PREVIEW_DEPLOY=PASS'
