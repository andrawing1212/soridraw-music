name: Temp List Index Audit
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-list-index-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 2
      - name: Capture patch anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          specs={
            'src/App.tsx':['listBundleCache','const writeFavoritesCache ='],
            'src/pages/SunoLibraryPage.tsx':['listBundleCache','const saveWorkspaceTrackCache ='],
            'src/lib/firestoreMeasured.ts':['export const setDoc =','export const writeBatch =','export const runTransaction ='],
          }
          for name, needles in specs.items():
            lines=Path(name).read_text(encoding='utf-8').splitlines()
            print('===== '+name+' =====')
            for needle in needles:
              for i,line in enumerate(lines):
                if needle in line:
                  a=max(0,i-8); b=min(len(lines),i+24)
                  print(f'--- {needle} lines {a+1}-{b} ---')
                  for j in range(a,b): print(f'{j+1:06d}: {lines[j]}')
                  break
          PY
