name: Temp Suno Track Live Source Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-suno-track-live-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Authenticate Google read-only inspection
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Verify deployed App Check mode and preview CORS
        shell: bash
        run: |
          set -euo pipefail
          project='soridraw-app-866a5'
          region='us-central1'
          fn='getSunoTrackStatus'
          endpoint='https://us-central1-soridraw-app-866a5.cloudfunctions.net/getSunoTrackStatus'

          gcloud functions describe "$fn" --gen2 --region "$region" --project "$project" --format=json > "$RUNNER_TEMP/function.json"
          python3 - "$RUNNER_TEMP/function.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          env=((d.get('serviceConfig') or {}).get('environmentVariables') or {})
          value=str(env.get('ENFORCE_APP_CHECK','')).lower()
          print('LIVE_ENFORCE_APP_CHECK_PRESENT='+str('ENFORCE_APP_CHECK' in env).lower())
          print('LIVE_ENFORCE_APP_CHECK_TRUE='+str(value=='true').lower())
          print('LIVE_UPDATE_TIME='+str(d.get('updateTime') or ''))
          PY

          headers="$RUNNER_TEMP/cors.headers"
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS "$endpoint" \
            -H 'Origin: https://preview.soridraw.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck')
          echo "PREVIEW_CORS_HTTP=$code"
          python3 - "$headers" <<'PY'
          import sys
          h={}
          for line in open(sys.argv[1],encoding='utf-8',errors='ignore'):
            if ':' in line:
              k,v=line.split(':',1);h[k.strip().lower()]=v.strip()
          print('PREVIEW_CORS_ALLOW_ORIGIN='+h.get('access-control-allow-origin',''))
          print('PREVIEW_CORS_ALLOW_HEADERS='+h.get('access-control-allow-headers',''))
          PY

          test "$code" = '204'
          grep -qi '^Access-Control-Allow-Origin: https://preview.soridraw.com' "$headers"
          grep -qi 'X-Firebase-AppCheck' "$headers"
          echo 'READ_ONLY=true'
          echo 'FUNCTION_DEPLOY=false'
          echo 'FIRESTORE_WRITE=false'
          echo 'DATA_DELETE=false'
