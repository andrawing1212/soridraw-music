name: TEMP 361 Materialize Publication Read Compaction

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-361-materialize-publication-read-compaction.yml'

permissions:
  contents: write

concurrency:
  group: temp-361-materialize-publication-read-compaction
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply only 094 to canonical Worker copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/soridraw-361"
          mkdir -p "$RUNNER_TEMP/soridraw-361"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/soridraw-361/worker.js"
          export SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/soridraw-361"
          node --check cloudflare/explore-worker/patches/094-publication-d1-read-compaction.mjs
          node cloudflare/explore-worker/patches/094-publication-d1-read-compaction.mjs
          node --check "$RUNNER_TEMP/soridraw-361/worker.js"
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/soridraw-361/worker.js" node scripts/verify-361-publication-read-compaction.mjs
          echo 'TEMP_361_MATERIALIZE_VERIFY=PASS'

      - name: Commit canonical Worker only
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/soridraw-361/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release-bot@users.noreply.github.com'
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git diff --cached --quiet && { echo 'No canonical source change'; exit 0; }
          git commit -m 'build(preview): materialize publication read compaction'
          git push origin HEAD:preview
          echo 'TEMP_361_CANONICAL_COMMIT=PASS'
