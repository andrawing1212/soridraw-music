name: SORIDRAW 093 Live RTDB Validation

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-093c-explore-like-rtdb-validate.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-093-live-rtdb-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify source contract
        run: node scripts/verify-093-explore-like-rtdb-zero-count.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile RTDB rules locally
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest emulators:exec \
            --only database \
            --project demo-soridraw-like-sync \
            "node -e \"console.log('RTDB_RULES_EMULATOR=PASS')\""

      - name: Verify no source side effects
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          test -z "$changed" || { echo 'Unexpected source changes during validation:'; echo "$changed"; exit 1; }
          echo 'EXPLORE_LIKE_FIRESTORE_SIGNAL_WRITE=0_TARGET'
          echo 'RTDB_RULES_LIVE_PAYLOAD_COMPATIBLE=PASS'
          echo 'NO_DEPLOY=true'
          echo 'NO_WORKER_CHANGE=true'
          echo 'NO_FUNCTIONS_CHANGE=true'
          echo 'NO_FIRESTORE_RULE_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_USER_DATA_CHANGE=true'
