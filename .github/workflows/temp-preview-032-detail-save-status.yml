name: SORIDRAW PREVIEW 032 Detail Save Status

on:
  push:
    branches: [preview-032-detail-save-status]
    paths:
      - '.github/workflows/temp-preview-032-detail-save-status.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-preview-032-detail-save-status
  cancel-in-progress: false

jobs:
  validate-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_PREVIEW_SHA: 36ff6fa09d589f20ebb5acdca9cd36bbab68f548
      BASE_MAIN_SHA: da3f70ca3e8574f20a5eabf96a4c517c51b4038c
      FIREBASE_PROJECT: soridraw
    steps:
      - name: Checkout isolated 032 branch
        uses: actions/checkout@v4
        with:
          ref: preview-032-detail-save-status
          fetch-depth: 0

      - name: Guard exact PREVIEW and MAIN baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$BASE_PREVIEW_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          git diff --name-only "$BASE_PREVIEW_SHA" HEAD | sort > "$RUNNER_TEMP/bootstrap-actual.txt"
          printf '%s\n' \
            '.deploy/apply-032-detail-save-status.py' \
            '.github/workflows/temp-preview-032-detail-save-status.yml' | sort > "$RUNNER_TEMP/bootstrap-expected.txt"
          cmp "$RUNNER_TEMP/bootstrap-expected.txt" "$RUNNER_TEMP/bootstrap-actual.txt"
          echo 'BASELINE_GUARD_032=PASS'

      - name: Apply 032 save status UX
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/apply-032-detail-save-status.py
          git diff --check
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          echo 'PATCH_032=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: TypeScript build and regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-runtime-environment-parity-028.mjs
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/local-index.sha"
          echo 'APP_VALIDATION_032=PASS'

      - name: Create exact clean PREVIEW commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Preview Bot'
          git config user.email 'soridraw-preview@users.noreply.github.com'
          git read-tree "$BASE_PREVIEW_SHA^{tree}"
          git add \
            src/pages/FavoritesPage.tsx \
            scripts/verify-032-music-note-detail-save-status.mjs
          tree_sha="$(git write-tree)"
          clean_sha="$(printf '%s\n' 'feat(preview): show Music Note detail save status' | git commit-tree "$tree_sha" -p "$BASE_PREVIEW_SHA")"
          echo "CLEAN_SHA=$clean_sha" >> "$GITHUB_ENV"
          git diff --name-only "$BASE_PREVIEW_SHA" "$clean_sha" | sort > "$RUNNER_TEMP/clean-actual.txt"
          printf '%s\n' \
            'scripts/verify-032-music-note-detail-save-status.mjs' \
            'src/pages/FavoritesPage.tsx' | sort > "$RUNNER_TEMP/clean-expected.txt"
          cmp "$RUNNER_TEMP/clean-expected.txt" "$RUNNER_TEMP/clean-actual.txt"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$BASE_PREVIEW_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo "CLEAN_PREVIEW_SHA=$clean_sha"
          echo 'CLEAN_TREE_032=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW and verify exact build
        shell: bash
        run: |
          set -euo pipefail
          production_before="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ | sha256sum | awk '{print $1}')"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-preview.json --non-interactive
          local_sha="$(cat "$RUNNER_TEMP/local-index.sha")"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/live-index.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/live-index.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  echo "PREVIEW_EXACT_BUILD_PASS=$url"
                  ok=yes
                  break
                fi
              fi
              sleep 8
            done
            test "$ok" = yes
          done
          production_after="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ | sha256sum | awk '{print $1}')"
          test "$production_before" = "$production_after"
          echo 'FIREBASE_PREVIEW_032=PASS'
          echo 'PRODUCTION_HOSTING_UNCHANGED_032=PASS'

      - name: Promote exact clean commit to PREVIEW only
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$CLEAN_SHA":refs/heads/preview
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$CLEAN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo 'PREVIEW_PUSH_032=PASS'
          echo 'MAIN_UNCHANGED_032=PASS'

      - name: Package PREVIEW ZIP
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=8 "$CLEAN_SHA")"
          zip_path="$RUNNER_TEMP/SORIDRAW_PREVIEW_032_${short}.zip"
          git archive --format=zip --output="$zip_path" "$CLEAN_SHA"
          sha256sum "$zip_path"
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo 'PREVIEW_ZIP_032=PASS'

      - name: Upload PREVIEW ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_032
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Final result
        shell: bash
        run: |
          set -euo pipefail
          echo "CLEAN_PREVIEW_SHA=$CLEAN_SHA"
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'
          echo 'CLOUDFLARE_CHANGED=false'
          echo 'TEST_CHANGED=false'
          echo 'PRODUCTION_CHANGED=false'
          echo 'SORIDRAW_PREVIEW_032=PASS'
