name: Temp 1040 Catalog Runtime Route Fix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-1040-catalog-runtime-route-fix.yml'

permissions:
  contents: write

jobs:
  fix-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HOSTING_PROJECT: soridraw
      PREVIEW_SITE: soridraw-preview
      PREVIEW_DEFAULT_HOST: soridraw-preview.web.app
      PREVIEW_CUSTOM_HOST: preview.soridraw.com
      PRODUCTION_HOST: soridraw.web.app
      WORKER_URL: https://soridraw-media-preview.andrawing1212.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20

      - name: Apply 1040 patch
        run: python3 .deploy/apply-1040-catalog-runtime-route-fix.py

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "authenticatedHeaders(false)" src/lib/userDataEngine.ts
          grep -q "legacy partial fallback blocked" src/lib/listBundleCache.ts
          grep -q "if (isPreviewAdaptiveListIndexEnabled()) return null;" src/lib/listBundleCache.ts
          grep -q "requireCatalogReadIdentity" cloudflare/media-worker/src/index.js
          echo '1040_STATIC_GUARDS=PASS'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: App checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
          grep -R -q "legacy partial fallback blocked" dist/assets
          grep -R -q "soridraw_user_data_engine_v4" dist/assets
          echo '1040_APP_CHECKS=PASS'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle
          cd cloudflare/media-worker
          npm install --no-audit --no-fund
          npm run check

      - name: Commit runtime source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add src/lib/userDataEngine.ts src/lib/listBundleCache.ts cloudflare/media-worker/src/index.js
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix(preview): route catalog reads through v4 runtime'
          git push origin HEAD:preview
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-sha"
          echo "RUNTIME_COMMIT=$(cat "$RUNNER_TEMP/runtime-sha")"

      - name: Deploy PREVIEW Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cd cloudflare/media-worker
          npx wrangler deploy
          cd ../..
          ok=''
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 20 "$WORKER_URL/health?attempt=$attempt" -o "$RUNNER_TEMP/health.json" && grep -q '"catalogSchemaVersion":4' "$RUNNER_TEMP/health.json"; then
              ok=yes
              break
            fi
            sleep 5
          done
          test "$ok" = yes
          cat "$RUNNER_TEMP/health.json"
          root_status="$(curl -sS -o "$RUNNER_TEMP/root.json" -w '%{http_code}' "$WORKER_URL/")"
          test "$root_status" = 404
          grep -q '"code":"NOT_FOUND"' "$RUNNER_TEMP/root.json"
          echo 'WORKER_ROOT_404_EXPECTED=PASS'
          echo '1040_WORKER_DEPLOY=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot Production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "https://$PRODUCTION_HOST/" -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Firebase PREVIEW Hosting
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./firebase.hosting-preview.json').hosting.site")" = "$PREVIEW_SITE"
          npx --yes firebase-tools@latest deploy --only hosting --project "$HOSTING_PROJECT" --config firebase.hosting-preview.json --non-interactive
          echo '1040_FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact PREVIEW and Production unchanged
        shell: bash
        run: |
          set -euo pipefail
          for host in "$PREVIEW_DEFAULT_HOST" "$PREVIEW_CUSTOM_HOST"; do
            ok=''
            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://$host/?v=$(cat "$RUNNER_TEMP/runtime-sha")-$attempt" -o "$RUNNER_TEMP/${host//./_}.html" && cmp -s dist/index.html "$RUNNER_TEMP/${host//./_}.html"; then
                ok=yes
                break
              fi
              sleep 6
            done
            test "$ok" = yes
            echo "PREVIEW_EXACT_BUILD_PASS=https://$host/"
          done
          curl -fsS --max-time 30 "https://$PRODUCTION_HOST/" -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          diff -u "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'PRODUCTION_UNCHANGED=PASS'
          echo 'MAIN_CHANGED=false'
          echo 'FUNCTIONS_DEPLOYED=false'
          echo 'FIRESTORE_RULES_DEPLOYED=false'
