name: SORIDRAW Backend V2 Step 2-A4 Docs Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2-a4-docs-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Update Master Plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
            (
              'Status: IMPLEMENTATION / Step 3 complete — V1 rollback source and Step 3-3 backup verified, but live V1 activity after backfill produced 3 new favorites and one rotated 10-item recent bundle while V2 runtime remains v1-only; Step 4 is blocked pending Step 2-A4 live mutation/sync risk review',
              'Status: IMPLEMENTATION / Step 2-A4 read-only live mutation/sync risk review complete — current live data has no universal stable song ID, positional recent IDs are unsafe, current recent V1 writes are spread across multiple call-sites, and no durable mirror outbox exists; Step 4 remains blocked pending separately approved inert 2-A4a/b implementation and later write-approved shadow/catch-up stages'
            ),
            (
              '2-A3 report: `docs/SORIDRAW_BACKEND_V2_STEP2A3_LOW_RISK_READ_ACTIVATION.md`.',
              '2-A3 report: `docs/SORIDRAW_BACKEND_V2_STEP2A3_LOW_RISK_READ_ACTIVATION.md`.\n2-A4 live mutation/sync risk review: `docs/SORIDRAW_BACKEND_V2_STEP2_A4_LIVE_MUTATION_SYNC_RISK_REVIEW.md`.'
            ),
            (
              '### 2-B complete — additive V2 schema/rules source',
              '### 2-A4-R complete — live recent/Music Note mutation & sync risk review (read-only)\n- Live review run `32881884462` completed SUCCESS with 0 writes/deletes/deploys; same-day sampled Firestore usage was 16,018 reads / 833 writes / 0 deletes and the bounded review remained inside the conservative read gate.\n- Current 68 recent items have no universal `soridrawSongId`/canonical/provider/track identity; 3 newly observed items expose `favoriteFirestoreId`, but positional `v1r_` migration IDs are explicitly unsafe for live use because list rotation changes indexes.\n- Current 741 Music Note/favorite documents also have no universal canonical ID; legacy `v1f_` path-based IDs remain valid migration provenance, while future live objects require a provider-neutral immutable `soridrawSongId`.\n- Static current-source run `32882035866` confirmed the actual `preview/src/App.tsx` still has multiple direct `user_recent_songs` mutation sites, so a mirror attached to only one save path would miss legitimate mutations. Historical `.deploy` patch scripts are not treated as runtime truth when current App code differs.\n- Current IndexedDB scaffold has entity/view/meta stores only and no durable mirror outbox; V2 runtime/write/delete/local-cache gates remain OFF.\n- Safe activation order is V1-authoritative write first, then changed-object V2 mirror best-effort, with bounded durable retry and stale-version protection; V2 failure must never roll back a successful V1 user save.\n- Step 4 stays blocked. Next safe stage is 2-A4a inert stable-ID + mirror/outbox contract with runtime OFF; later call-site centralization, shadow writes and live-gap catch-up each remain separate gates.\n- Full detail: `docs/SORIDRAW_BACKEND_V2_STEP2_A4_LIVE_MUTATION_SYNC_RISK_REVIEW.md`.\n\n### 2-B complete — additive V2 schema/rules source'
            ),
            (
              '### Step 2 — V2 code implementation on preview (2-D source complete; 2-A4 high-risk activation still blocked) 🔄',
              '### Step 2 — V2 code implementation on preview (2-A4 risk review complete; implementation/activation still gated) 🔄'
            ),
            (
              '  - [ ] 2-A4 Critical generation/recent-save/Music Note mutation activation gate only after separate risk review and explicit approval.',
              '  - [~] 2-A4 Critical generation/recent-save/Music Note live connection — risk review complete; runtime activation remains blocked.\n    - [x] 2-A4-R Read-only live identity/mutation/cost risk review complete; stable provider-neutral ID, V1-first mirror ordering and durable retry are required.\n    - [ ] 2-A4a Inert `soridrawSongId` + mirror/outbox contract and tests; runtime OFF, no Firebase writes.\n    - [ ] 2-A4b Centralize all current V1 recent/Music Note mutation boundaries while V2 mirror remains OFF; prove V1 parity/cost unchanged.\n    - [ ] 2-A4c Preview shadow mirror only after separate exact write approval + deployed-Rules verification + fresh quota gate.\n    - [ ] 2-A4d Bounded current live-gap catch-up/verification only after separate exact write approval; no positional recent overwrite.'
            ),
            (
              '### Step 4 — Preview validation (0/12; blocked pending Step 2-A4 live mutation/sync review) ⏳',
              '### Step 4 — Preview validation (0/12; blocked pending Step 2-A4a/b implementation + separately approved 2-A4c/d write stages) ⏳'
            ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Master Plan replacement anchor missing: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git diff --cached --check
          git commit -m 'docs: record Step 2-A4 risk review gate'
          git push origin HEAD:preview
      - name: Remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin preview
          git rm .github/workflows/backend-v2-step2-a4-docs-finalize.yml
          git commit -m 'chore: remove Step 2-A4 docs finalizer'
          git push origin HEAD:preview
