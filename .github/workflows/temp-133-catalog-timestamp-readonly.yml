name: TEMP 133 Catalog Timestamp Readonly
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-133-catalog-timestamp-readonly.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf4ff0fa59894249676c6efdd2e5d894a011823f
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Check timestamp format and last updates with bounded SELECT only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT id,is_public,status,updated_at,published_at FROM tracks ORDER BY updated_at DESC LIMIT 8;
            SELECT track_id,like_count,updated_at FROM track_stats ORDER BY updated_at DESC LIMIT 8;
            SELECT 'tracks' AS kind,COUNT(*) AS count,MAX(updated_at) AS max_at FROM tracks;
            SELECT 'track_stats' AS kind,COUNT(*) AS count,MAX(updated_at) AS max_at FROM track_stats;
            SELECT 'likes' AS kind,COUNT(*) AS count,MAX(created_at) AS max_at FROM likes;
          " --json > "$RUNNER_TEMP/probe.json"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/probe.json','utf8'));
          if(!Array.isArray(r)||r.length!==5||r.some(x=>x.success===false))throw new Error('D1 bounded probe failed');
          const mask=s=>crypto.createHash('sha256').update(String(s||'')).digest('hex').slice(0,10);
          const [tracks,stats,...totals]=r.map(x=>x.results||[]);
          for(const t of tracks) console.log('TRACK_HASH='+mask(t.id)+' public='+t.is_public+' updated='+t.updated_at+' published='+t.published_at);
          for(const s of stats) console.log('STAT_HASH='+mask(s.track_id)+' likes='+s.like_count+' updated='+s.updated_at);
          for(const c of totals)console.log('TABLE_SUMMARY='+JSON.stringify(c[0]||{}));
          console.log('D1_TIMESTAMP_READONLY=PASS');
          NODE
