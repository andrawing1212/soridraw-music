name: Verify Music Note createdAtMs Index Read-only

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/verify-music-note-createdatms-index-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Authenticate read-only session
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Verify createdAtMs page chain
        run: |
          set -euo pipefail
          cd functions
          node - <<'NODE'
          const admin = require('firebase-admin');
          if (!admin.apps.length) admin.initializeApp({ projectId: 'soridraw-app-866a5' });
          const db = admin.firestore();
          const removed = (r) => Boolean(r?.favoriteRemoved === true || r?.saved === false || r?.favoriteRemovedAt || r?.unlikedAt || r?.unsavedAt);
          const toMonth = (d) => {
            const v = Number(d?.createdAtMs || 0);
            return v > 0 ? new Date(v).toISOString().slice(0,7) : null;
          };
          (async () => {
            const users = await db.collection('users').get();
            let uid = ''; let max = -1;
            for (const doc of users.docs) {
              const n = Number((doc.data() || {}).favoriteCount || 0);
              if (n > max) { max = n; uid = doc.id; }
            }
            if (!uid) throw new Error('target account not found');
            let q = db.collection('favorites').where('uid','==',uid).orderBy('createdAtMs','desc').limit(21);
            const pages = [];
            let cursor = null;
            for (let page = 1; page <= 3; page += 1) {
              const snap = cursor ? await q.startAfter(cursor).get() : await q.get();
              const docs = snap.docs.slice(0,20);
              if (!docs.length) break;
              const rows = docs.map(d => d.data() || {});
              pages.push({
                page,
                raw: docs.length,
                active: rows.filter(r => !removed(r)).length,
                firstMonth: toMonth(rows[0]),
                lastMonth: toMonth(rows[rows.length - 1]),
                hasMore: snap.docs.length > 20,
              });
              cursor = docs[docs.length - 1];
            }
            console.log(JSON.stringify({
              mode:'READ_ONLY_CREATED_AT_MS_INDEX_VERIFY',
              profileFavoriteCount:max,
              pages,
              firestoreWrites:0,
              firestoreDeletes:0,
              deployments:0
            }, null, 2));
          })().catch((e) => { console.error(e?.stack || e); process.exit(1); });
          NODE
      - name: Safety confirmation
        run: echo 'READ-ONLY only; no Firestore writes/deletes or deployments performed.'
