name: Deploy getAdminPresence once

on:
  push:
    branches:
      - main
    paths:
      - .deploy/functions-get-admin-presence-trigger.txt

concurrency:
  group: deploy-get-admin-presence-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy getAdminPresence to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Apply 29th ZIP getAdminPresence schema patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('functions/src/index.ts')
          source = path.read_text(encoding='utf-8')
          start = source.index('export const getAdminPresence = onCall(')
          end = source.index('export const adminForceLogoutUser', start)
          block = source[start:end]

          old_empty = 'return { ok: true, checkedAt: Date.now(), presence: {} };'
          new_empty = 'return { ok: true, schemaVersion: 2, checkedAt: Date.now(), presence: {} };'
          if old_empty in block:
              block = block.replace(old_empty, new_empty, 1)
          elif new_empty not in block:
              raise SystemExit('Could not locate empty getAdminPresence response')

          old_result = '''    return {
            ok: true,
            checkedAt: Date.now(),
            presence,
          };'''
          new_result = '''    return {
            ok: true,
            schemaVersion: 2,
            checkedAt: Date.now(),
            presence,
          };'''
          if old_result in block:
              block = block.replace(old_result, new_result, 1)
          elif new_result not in block:
              raise SystemExit('Could not locate populated getAdminPresence response')

          source = source[:start] + block + source[end:]
          path.write_text(source, encoding='utf-8')
          print('getAdminPresence schemaVersion=2 patch applied')
          PY

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy getAdminPresence only
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only functions:getAdminPresence --project soridraw-app-866a5 --non-interactive 2>&1 | tee /tmp/get-admin-presence-deploy.log

      - name: Verify deployed Functions list
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest functions:list --project soridraw-app-866a5 --non-interactive 2>&1 | tee /tmp/get-admin-presence-verify.log
          grep -i getAdminPresence /tmp/get-admin-presence-verify.log

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "status=${JOB_STATUS}"
            echo "run_id=${RUN_ID}"
            echo "commit=${COMMIT_SHA}"
            echo "target_project=soridraw-app-866a5"
            echo "function=getAdminPresence"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f /tmp/get-admin-presence-deploy.log ]; then
              echo
              echo "--- deploy log tail ---"
              tail -n 60 /tmp/get-admin-presence-deploy.log
            fi
            if [ -f /tmp/get-admin-presence-verify.log ]; then
              echo
              echo "--- verify log tail ---"
              tail -n 30 /tmp/get-admin-presence-verify.log
            fi
          } > .deploy/functions-get-admin-presence-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/functions-get-admin-presence-result.txt
          git commit -m "chore: record getAdminPresence deployment result" || true
          git push
