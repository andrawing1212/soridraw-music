name: Firebase Production Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Build and deploy Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout approved production commit
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Deploy official Firebase Hosting site only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW_APP_866A5 }}
          channelId: live
          projectId: soridraw-app-866a5
          target: production
