name: Cost Zero Stage 2A D1 Readonly Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only Cloudflare GraphQL usage analytics: no generated Worker, Wrangler,
      # D1 SQL, user records, migrations, credentials printed, or deployment.
      - name: Account-wide D1 usage and shared D1 cost estimate (GraphQL, read-only)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
          SORIDRAW_D1_COST_DAYS: '7'
        run: |
          set -euo pipefail
          # Existing scoped token: no SQL, no user data, no Worker deployment.
          # If GraphQL Analytics Read permission is missing, fail honestly.
          node scripts/report-cloudflare-d1-usage-readonly.mjs
