name: TEMP Update 107 Release Docs

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-update-107-docs.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Update 107 docs
        run: python3 .deploy/temp-update-107-docs.py

      - name: Self-clean temporary updater
        shell: bash
        run: |
          set -euo pipefail
          git rm .deploy/temp-update-107-docs.py
          git rm .deploy/temp-update-107-docs.trigger
          git rm .github/workflows/temp-update-107-docs.yml

      - name: Commit release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md
          git diff --cached --quiet && { echo 'No docs change'; exit 1; }
          git commit -m 'docs: record PREVIEW 107 release state'
          git push origin HEAD:preview
          echo "FINAL_DOC_HEAD=$(git rev-parse HEAD)"
