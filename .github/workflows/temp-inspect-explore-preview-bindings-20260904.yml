name: SORIDRAW Inspect Explore PREVIEW Bindings 2026-09-04

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-inspect-explore-preview-bindings-20260904.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
    steps:
      - name: Inspect sanitized active Worker settings
        run: |
          node <<'NODE'
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          const get=async(path)=>{const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${A}${path}`,{headers:{Authorization:`Bearer ${T}`}});const text=await r.text();let x={};try{x=JSON.parse(text)}catch{};if(!r.ok||x.success===false)throw new Error(`${r.status} ${text.slice(0,800)}`);return x.result||x};
          (async()=>{
            const settings=await get(`/workers/scripts/${W}/settings`);
            const d=await get(`/workers/scripts/${W}/deployments`); const dep=(d.deployments||d||[])[0]; const v=[...(dep?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            const ver=await get(`/workers/scripts/${W}/versions/${v.version_id}`);
            const sanitize=(value)=>{
              if(Array.isArray(value)) return value.map((b)=>({name:b?.name||null,type:b?.type||null,id:b?.id||b?.database_id||b?.namespace_id||null,bucket_name:b?.bucket_name||b?.bucket||null}));
              if(value&&typeof value==='object') return Object.fromEntries(Object.entries(value).map(([k,b])=>[k,{name:b?.name||k,type:b?.type||null,id:b?.id||b?.database_id||b?.namespace_id||null,bucket_name:b?.bucket_name||b?.bucket||null}]));
              return value??null;
            };
            console.log('ACTIVE='+v.version_id);
            console.log('SETTINGS_KEYS='+JSON.stringify(Object.keys(settings||{})));
            console.log('SETTINGS_BINDINGS='+JSON.stringify(sanitize(settings?.bindings)));
            console.log('VERSION_KEYS='+JSON.stringify(Object.keys(ver||{})));
            console.log('VERSION_RESOURCE_KEYS='+JSON.stringify(Object.keys(ver?.resources||{})));
            console.log('VERSION_BINDINGS='+JSON.stringify(sanitize(ver?.resources?.bindings||ver?.bindings)));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
