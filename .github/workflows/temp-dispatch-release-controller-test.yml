name: TEMP Dispatch Release Controller PRODUCTION

on:
  push:
    branches:
      - fix/release-controller-hosting-live-identity
    paths:
      - .github/workflows/temp-dispatch-release-controller-test.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact TEST_VERIFIED manifest to PRODUCTION
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_TAG: soridraw-test-v116-fc3895884356
        run: |
          set -euo pipefail
          gh workflow run soridraw-release-promotion.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref preview \
            -f mode=production \
            -f target_sha= \
            -f manifest_tag="$MANIFEST_TAG" \
            -f production_approval=DEPLOY_PRODUCTION
          echo "DISPATCH_RELEASE_PRODUCTION=PASS"
