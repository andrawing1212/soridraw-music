name: SORIDRAW Publication R2 PREVIEW Verify6 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-final6-publication-r2-verify-20260904.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
      SEED_PATH: /__soridraw_seed_music_note_publication_r2_20260904_7b4f
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify active PREVIEW Worker source and routes only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN,S=process.env.SEED_PATH;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`,ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];if(!v?.version_id||Number(v.percentage||0)<99.99)throw new Error('active version not 100%');const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`),m=(ver.modules||[]).find(x=>x.name===ver.main_module)||(ver.modules||[])[0],src=Buffer.from(m.content_base64,'base64').toString('utf8');for(const q of ['SORIDRAW_MUSIC_NOTE_PUBLICATION_R2_BUNDLE_20260904','/v1/me/music-note-publications-bundle','Read-only recovery: page entry never writes','syncMusicNotePublicationR2AfterMutation'])if(!src.includes(q))throw new Error('missing '+q);if(src.includes(S))throw new Error('temporary seed route still active');console.log('ACTIVE_WORKER_SOURCE_PASS='+v.version_id)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          base='https://soridraw-explore-preview.andrawing1212.workers.dev'
          bundle="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/bundle.json" -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$base/v1/me/music-note-publications-bundle")"
          seed="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/seed.json" -w '%{http_code}' -X POST "$base${SEED_PATH}")"
          feed="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$base/v1/feed?sort=latest&limit=1")"
          echo "ROUTES bundle=$bundle seed=$seed feed=$feed"
          test "$bundle" = 401
          test "$seed" = 404
          test "$feed" = 200
          echo 'ACTIVE_WORKER_ROUTES=PASS'
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: TypeScript and Build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          grep -q '/v1/me/music-note-publications-bundle' src/services/explorePublicationService.ts
          echo 'APP_BUILD=PASS'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Deploy Firebase PREVIEW Hosting only and protect production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://soridraw.web.app/ -o "$RUNNER_TEMP/p0"; sha256sum "$RUNNER_TEMP/p0" | awk '{print $1}' > "$RUNNER_TEMP/h0"
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          for u in https://preview.soridraw.com/ https://soridraw-preview.web.app/ https://soridraw-preview.firebaseapp.com/; do curl -fsS --max-time 30 "$u" -o "$RUNNER_TEMP/x"; grep -q '<div id="root"></div>' "$RUNNER_TEMP/x"; echo "SMOKE_PASS=$u"; done
          curl -fsS https://soridraw.web.app/ -o "$RUNNER_TEMP/p1"; sha256sum "$RUNNER_TEMP/p1" | awk '{print $1}' > "$RUNNER_TEMP/h1"; cmp "$RUNNER_TEMP/h0" "$RUNNER_TEMP/h1"
          echo 'PRODUCTION_UNCHANGED=true'
          echo 'EXPECTED_COLD=Worker1_D1Read0_R2Read1'
          echo 'EXPECTED_WARM=Worker0_D1Read0_R2Read0'
          echo 'PAGE_ENTRY_SERVER_WRITE=0'
