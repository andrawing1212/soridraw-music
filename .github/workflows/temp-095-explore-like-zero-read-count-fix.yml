name: SORIDRAW 095 Explore Like Zero-Read Count Fix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-095-explore-like-zero-read-count-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply 095 zero-read like-count fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/exploreLikeDisplayStateService.ts')
          s = p.read_text()
          imports = """import { EXPLORE_API_BASE } from '../config/exploreEnvironment';\nimport { auth, getFirebaseAppCheckToken } from '../firebase';\nimport { recordCloudflareResponse } from '../lib/cloudflareDiagnostics';\nimport { readSoridrawPersistentCache } from '../lib/soridrawPersistentCache';\n\n"""
          assert imports in s
          s = s.replace(imports, '', 1)
          s = s.replace('// SORIDRAW_EXPLORE_LIKE_ZERO_COUNT_RECOVERY_093_20260915\n', '// SORIDRAW_EXPLORE_LIKE_ZERO_READ_DISPLAY_095_20260915\n', 1)
          s = s.replace('const DISPLAY_TTL_MS_091 = 30 * 60_000;', 'const DISPLAY_TTL_MS_091 = 7 * 24 * 60 * 60_000;', 1)
          old = "export const updateExploreLikeCanonicalCounts091 = (\n  uid: string,\n  rows: ExploreLikeCanonicalCount091[],\n  confirmAccepted = false,\n) => {"
          new = "export const updateExploreLikeCanonicalCounts091 = (\n  uid: string,\n  rows: ExploreLikeCanonicalCount091[],\n) => {"
          assert old in s
          s = s.replace(old, new, 1)
          assert 'if (aggregateCaughtUp || confirmAccepted) {' in s
          s = s.replace('if (aggregateCaughtUp || confirmAccepted) {', 'if (aggregateCaughtUp) {', 1)
          start = s.index("const ZERO_COUNT_RECOVERY_ROUTE_093 = '/v1/me/liked-tracks';")
          end = s.index('export const getExploreLikeDisplayCount091 = (', start)
          s = s[:start] + s[end:]
          old = """  if (state && state.expiresAt > Date.now()) {\n    if (state.displayLikeCount === 0 && state.desiredLiked) queueZeroCountRecovery093(normalizedUid, normalizedTrackId);\n    return state.displayLikeCount;\n  }\n  if (state) {\n    states.delete(normalizedTrackId);\n    persistStates091(normalizedUid, states);\n  }\n  const resolved = getExploreLikeCanonicalCount091(normalizedUid, normalizedTrackId, fallbackLikeCount);\n  if (resolved === 0 && isPersistentlyLiked093(normalizedUid, normalizedTrackId)) {\n    queueZeroCountRecovery093(normalizedUid, normalizedTrackId);\n  }\n  return resolved;"""
          new = """  if (state && state.expiresAt > Date.now()) return state.displayLikeCount;\n  if (state) {\n    states.delete(normalizedTrackId);\n    persistStates091(normalizedUid, states);\n  }\n  return getExploreLikeCanonicalCount091(normalizedUid, normalizedTrackId, fallbackLikeCount);"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """  if (typeof window !== 'undefined') {\n    zeroCountRecoveryTimerByUid093.forEach((timer) => window.clearTimeout(timer));\n  }\n  zeroCountRecoveryQueueByUid093.clear();\n  zeroCountRecoveryTimerByUid093.clear();\n  zeroCountRecoveryInflightByUid093.clear();\n  zeroCountRecoveryFailureUntil093.clear();\n"""
          assert old in s
          s = s.replace(old, '', 1)
          p.write_text(s)

          p = Path('src/pages/ExplorePage.tsx')
          s = p.read_text()
          old = """      const refreshDeadline = activeUid ? readExploreLikeRefreshDeadline071(activeUid) : 0;\n      const aggregateConfirmed = Boolean(feedRequest && forceLikeCountRefresh071 && refreshDeadline > 0 && Date.now() >= refreshDeadline);\n      if (activeUid) {\n        if (feedRequest) updateExploreLikeCanonicalCounts091(activeUid, canonicalRows, aggregateConfirmed);\n        else seedExploreLikeCanonicalCounts091(activeUid, canonicalRows);\n      }"""
          new = """      if (activeUid) {\n        if (feedRequest) updateExploreLikeCanonicalCounts091(activeUid, canonicalRows);\n        else seedExploreLikeCanonicalCounts091(activeUid, canonicalRows);\n      }"""
          assert old in s
          s = s.replace(old, new, 1)
          old = "updateExploreLikeCanonicalCounts091(activeUid, normalized.map((track) => ({ trackId: track.id, likeCount: track.likeCount })), false);"
          assert old in s
          s = s.replace(old, "updateExploreLikeCanonicalCounts091(activeUid, normalized.map((track) => ({ trackId: track.id, likeCount: track.likeCount })));", 1)
          p.write_text(s)

          p = Path('src/lib/cloudflareDiagnostics.ts')
          s = p.read_text()
          anchor = "  if (/^\\/v1\\/tracks\\/[^/]+\\/like$/.test(pathname)) return '/v1/tracks/:id/like';\n"
          labels = """  if (pathname === '/v1/me/liked-tracks') return '내 좋아요 곡 확인';\n  if (pathname === '/v1/me/likes/batch') return '좋아요 변경 묶음 저장';\n  if (pathname === '/v1/me/likes') return '좋아요 상태 확인';\n"""
          assert anchor in s
          s = s.replace(anchor, labels + anchor, 1)
          p.write_text(s)

          p = Path('scripts/verify-093-explore-like-rtdb-zero-count.mjs')
          s = p.read_text()
          a = s.index("must(display.includes('SORIDRAW_EXPLORE_LIKE_ZERO_COUNT_RECOVERY_093_20260915')")
          b = s.index("console.log('EXPLORE_LIKE_FIRESTORE_SYNC_WRITE=0_TARGET');", a)
          block = """must(display.includes('SORIDRAW_EXPLORE_LIKE_ZERO_READ_DISPLAY_095_20260915'), 'zero-read display marker missing');\nmust(!display.includes('/v1/me/liked-tracks'), 'display count path must not call liked-tracks D1 recovery');\nmust(!display.includes('fetch('), 'display count path must remain network-free');\nmust(!display.includes('ZERO_COUNT_RECOVERY_'), 'legacy zero-count recovery state remains');\nmust(display.includes('if (aggregateCaughtUp) {'), 'accepted count must clear only when canonical aggregate catches up');\nmust(!display.includes('confirmAccepted'), 'forced accepted-count clear remains');\nmust(!/setInterval\\s*\\(/.test(display), 'polling introduced in display state');\nmust(!/firebase\\/firestore|getDocs\\(|collection\\(/.test(display), 'display state must not read Firestore/full collections');\n\n"""
          s = s[:a] + block + s[b:]
          s = s.replace("console.log('LIKED_ZERO_COUNT_TARGETED_BATCH_RECOVERY=PASS');", "console.log('LIKED_ZERO_COUNT_NETWORK_RECOVERY=REMOVED');")
          s = s.replace("console.log('FAKE_ZERO_TO_ONE_FLOOR=ABSENT');", "console.log('ACKNOWLEDGED_LOCAL_COUNT=CANONICAL_CATCHUP_ONLY');")
          p.write_text(s)

          Path('scripts/verify-095-explore-like-zero-read-display.mjs').write_text("""import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nconst display = readFileSync('src/services/exploreLikeDisplayStateService.ts', 'utf8');\nconst service = readFileSync('src/services/exploreLikeService.ts', 'utf8');\nconst page = readFileSync('src/pages/ExplorePage.tsx', 'utf8');\nconst diagnostics = readFileSync('src/lib/cloudflareDiagnostics.ts', 'utf8');\nconst likedTracks = readFileSync('src/services/exploreLikedTracksService.ts', 'utf8');\nassert.ok(display.includes('SORIDRAW_EXPLORE_LIKE_ZERO_READ_DISPLAY_095_20260915'));\nfor (const needle of ['/v1/me/liked-tracks','ZERO_COUNT_RECOVERY_','getFirebaseAppCheckToken','recordCloudflareResponse','readSoridrawPersistentCache','fetch(']) assert.ok(!display.includes(needle));\nassert.ok(display.includes('const DISPLAY_TTL_MS_091 = 7 * 24 * 60 * 60_000;'));\nassert.ok(display.includes('if (aggregateCaughtUp) {'));\nassert.ok(!display.includes('confirmAccepted'));\nassert.ok(!page.includes('aggregateConfirmed'));\nassert.ok(service.includes('SORIDRAW_EXPLORE_SESSION_BATCH_094_20260915'));\nassert.ok(service.includes("requestExploreLike(user, '/v1/me/likes/batch'"));\nassert.ok(likedTracks.includes('LOCAL HIT · 좋아요 곡 전체 캐시'));\nassert.ok(likedTracks.includes('/v1/me/liked-tracks'));\nassert.ok(diagnostics.includes("pathname === '/v1/me/liked-tracks') return '내 좋아요 곡 확인'"));\nassert.ok(diagnostics.includes("pathname === '/v1/me/likes/batch') return '좋아요 변경 묶음 저장'"));\nconsole.log('PASS 095: acknowledged count persists locally until real canonical catch-up; normal display/re-entry has no liked-tracks recovery read; diagnostics are Korean.');\n""")
          PY
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Verify 093 RTDB zero-read supersession
        run: node scripts/verify-093-explore-like-rtdb-zero-count.mjs
      - name: Verify 094 session batching
        run: node scripts/verify-094-explore-session-like-batch.mjs
      - name: Verify 095 zero-read display
        run: node scripts/verify-095-explore-like-zero-read-display.mjs
      - name: Switch to Node 24 for sqlite cost verifier
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify like cost
        run: node scripts/verify-explore-like-cost-optimization.mjs
      - name: Verify liked profile regressions
        run: |
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
      - name: Commit verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/services/exploreLikeDisplayStateService.ts src/pages/ExplorePage.tsx src/lib/cloudflareDiagnostics.ts scripts/verify-093-explore-like-rtdb-zero-count.mjs scripts/verify-095-explore-like-zero-read-display.mjs
          test -n "$(git status --porcelain)"
          git commit -m 'fix: keep Explore like counts local until canonical catch-up'
          git push origin HEAD:preview
