name: SORIDRAW Cleanup Final 044 Probe Record

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-cleanup-last-044-probe-20260912.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate Firebase cleanup
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Guard final synthetic record
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin=require('firebase-admin');
          admin.initializeApp({projectId:'soridraw-app-866a5'});
          const db=admin.firestore(), auth=admin.auth();
          const uid='soridraw044_preview_1788857732210_a1o4qg';
          const DISPLAY='SORIDRAW 044 preview Probe';
          const emptySub=async p=>(await db.collection(p).limit(1).get()).empty;
          const emptyRef=async(c,f)=>(await db.collection(c).where(f,'==',uid).limit(1).get()).empty;
          (async()=>{
            const snap=await db.collection('users').doc(uid).get();
            if(!snap.exists) throw new Error('Final probe user doc missing');
            const d=snap.data()||{};
            if(d.displayName!==DISPLAY) throw new Error('Display marker mismatch');
            if(String(d.email||'')!=='') throw new Error('Unexpected email present');
            if(String(d.role||'free')!=='free') throw new Error('Unexpected role');
            if(Number(d.songGeneratedCount||0)!==0||Number(d.favoriteCount||0)!==0) throw new Error('Nonzero content counters');
            try{ await auth.getUser(uid); throw new Error('Active Auth exists'); }catch(e){ if(e?.code!=='auth/user-not-found') throw e; }
            const direct=await Promise.all(['user_recent_songs','user_structures','user_api_keys','gemini_request_guards'].map(c=>db.collection(c).doc(uid).get()));
            if(direct.some(s=>s.exists)) throw new Error('Direct account data exists');
            const subs=await Promise.all([
              emptySub(`users/${uid}/songs`),emptySub(`users/${uid}/playlists`),emptySub(`users/${uid}/settings`),
              emptySub(`suno_tracks/${uid}/tracks`),emptySub(`user_list_caches/${uid}/bundles`),emptySub(`user_playlists/${uid}/lists`),
            ]);
            if(subs.some(v=>!v)) throw new Error('Nested data exists');
            const refs=await Promise.all([
              emptyRef('favorites','uid'),emptyRef('suno_shares','ownerUid'),emptyRef('music_note_shares','ownerUid'),emptyRef('admin_permission_audit','targetUid'),
            ]);
            if(refs.some(v=>!v)) throw new Error('Referenced data exists');
            console.log('FINAL_044_FIREBASE_GUARD=PASS');
          })().catch(e=>{console.error(e?.stack||e);process.exit(1)});
          NODE
      - name: Guard D1 references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const uid='soridraw044_preview_1788857732210_a1o4qg';
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.SHARED_D1_ID}/query`;
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'};
          const qi=v=>`"${String(v).replaceAll('"','""')}"`; const qs=v=>`'${String(v).replaceAll("'","''")}'`;
          async function query(sql){const r=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({sql})});const t=await r.text();const j=JSON.parse(t);if(!r.ok||j.success===false)throw new Error(`D1 ${r.status}: ${t.slice(0,800)}`);return(Array.isArray(j.result)?j.result:[j.result]).flatMap(b=>b?.results||[])}
          (async()=>{
            const cols=['uid','user_id','user_uid','owner_uid','author_uid','follower_uid','following_uid','target_uid','actor_uid','profile_uid'];
            const schema=await query("SELECT name, sql FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
            let hits=0,checks=0;
            for(const row of schema){const table=String(row.name||''),ddl=String(row.sql||'');for(const col of cols){if(!table||!new RegExp(`(^|[^A-Za-z0-9_])${col}([^A-Za-z0-9_]|$)`,'i').test(ddl))continue;checks++;const rows=await query(`SELECT COUNT(*) count FROM ${qi(table)} WHERE ${qi(col)}=${qs(uid)}`);hits+=Number(rows[0]?.count||0)}}
            if(hits!==0) throw new Error(`D1 refs exist: ${hits}`);
            console.log(`FINAL_044_D1_GUARD=PASS checks=${checks} hits=${hits}`);
          })().catch(e=>{console.error(e?.stack||e);process.exit(1)});
          NODE
      - name: Delete final synthetic Firestore record
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin=require('firebase-admin');admin.initializeApp({projectId:'soridraw-app-866a5'});const db=admin.firestore();
          const uid='soridraw044_preview_1788857732210_a1o4qg';
          (async()=>{const ref=db.collection('users').doc(uid);const snap=await ref.get();const d=snap.data()||{};if(!snap.exists||d.displayName!=='SORIDRAW 044 preview Probe'||String(d.email||'')!==''||String(d.role||'free')!=='free'||Number(d.songGeneratedCount||0)!==0||Number(d.favoriteCount||0)!==0)throw new Error('Final deletion guard refused');await ref.delete();console.log('DELETED_FINAL_044_PROBE=1')})().catch(e=>{console.error(e?.stack||e);process.exit(1)});
          NODE
      - name: Postcheck no 044 probes remain
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin=require('firebase-admin');admin.initializeApp({projectId:'soridraw-app-866a5'});const db=admin.firestore();
          (async()=>{const snap=await db.collection('users').where('displayName','==','SORIDRAW 044 preview Probe').limit(20).get();if(!snap.empty)throw new Error(`044 probe docs remain: ${snap.size}`);console.log('ALL_044_PROBE_DOCS_REMOVED=PASS');console.log('REAL_USER_DATA_CHANGED=0');console.log('D1_ROWS_DELETED=0')})().catch(e=>{console.error(e?.stack||e);process.exit(1)});
          NODE
