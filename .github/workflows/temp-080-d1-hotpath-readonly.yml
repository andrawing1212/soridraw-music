name: TEMP 082 Publication D1 Hotpath Readonly
# rerun-20261004-app333-index-migration-preflight

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-080-d1-hotpath-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read live publication hotpath schema only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE sql IS NOT NULL AND (tbl_name IN ('tracks','track_stats','public_profiles','profile_stats','explore_derived_tracks','explore_derived_profiles','explore_shared_revision','track_search_fts','profile_search_fts','track_tags') OR name LIKE 'track_search_fts%' OR name LIKE 'profile_search_fts%' OR (type='trigger' AND (sql LIKE '%tracks%' OR sql LIKE '%track_search_fts%' OR sql LIKE '%profile_search_fts%' OR sql LIKE '%explore_shared_revision%'))) ORDER BY type,tbl_name,name; PRAGMA index_list('tracks'); PRAGMA index_list('track_tags');" --json > "$RUNNER_TEMP/schema.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/schema.json','utf8'));
          const sets=raw.flatMap(x=>Array.isArray(x.results)?[x.results]:[]);
          for(const rows of sets){
            for(const r of rows){
              if (r.sql || r.type) {
                console.log(`--- ${r.type||'pragma'} ${r.name||''} ON ${r.tbl_name||'tracks'} ---`);
                if (r.sql) console.log(String(r.sql));
              } else console.log('PRAGMA_INDEX='+JSON.stringify(r));
            }
          }
          const rows=sets.flat();
          const trackIndexes=rows.filter(r=>r.type==='index'&&r.tbl_name==='tracks').map(r=>({name:r.name,sql:r.sql}));
          const trackTriggers=rows.filter(r=>r.type==='trigger'&&r.tbl_name==='tracks').map(r=>({name:r.name,sql:r.sql}));
          console.log('TRACK_INDEXES='+JSON.stringify(trackIndexes));
          console.log('TRACK_TRIGGERS='+JSON.stringify(trackTriggers));
          console.log('SEARCH_SCHEMA_AUDIT_20260918=PASS\nREMOTE_D1_WRITES=0');
          NODE

      - name: Audit candidate publication indexes and fallback plans only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT name,sql FROM sqlite_schema WHERE type='index' AND name IN ('idx_tracks_owner_suno_url','idx_tracks_source_type_latest','idx_tracks_owner_profile_order','idx_tracks_owner_latest') ORDER BY name;
            EXPLAIN QUERY PLAN SELECT id FROM tracks WHERE owner_uid='__audit__' AND is_public=1 AND status='published' ORDER BY profile_pinned DESC,published_at DESC,id DESC LIMIT 25;
            EXPLAIN QUERY PLAN SELECT id FROM tracks INDEXED BY idx_tracks_owner_latest WHERE owner_uid='__audit__' AND is_public=1 AND status='published' ORDER BY profile_pinned DESC,published_at DESC,id DESC LIMIT 25;
            EXPLAIN QUERY PLAN SELECT id,source_id FROM tracks WHERE owner_uid='__audit__' AND source_type='music_note' AND source_id IS NOT NULL AND source_id<>'' LIMIT 200;
            SELECT COALESCE(MAX(n),0) AS max_tracks_per_owner, COALESCE(AVG(n),0) AS avg_tracks_per_owner FROM (SELECT owner_uid,COUNT(*) AS n FROM tracks GROUP BY owner_uid);
          " --json > "$RUNNER_TEMP/index-preflight.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/index-preflight.json','utf8'));
          const sets=raw.flatMap(x=>Array.isArray(x.results)?[x.results]:[]);
          sets.forEach((rows,i)=>console.log('INDEX_PREFLIGHT_SET_'+i+'='+JSON.stringify(rows)));
          console.log('PUBLICATION_INDEX_MIGRATION_PREFLIGHT_READONLY=PASS');
          console.log('REMOTE_D1_WRITES=0');
          NODE

      - name: Read D1 query insights only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 insights DB --config "$CFG" --sort-type=sum --sort-by=writes --sort-direction=DESC --limit=30 --time-period=1d --json > "$RUNNER_TEMP/insights.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/insights.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw?.result||[]);
          console.log('D1_TOP_WRITE_INSIGHTS='+JSON.stringify(rows));
          console.log('REMOTE_D1_INSIGHTS_READONLY=PASS');
          NODE

          node "$WRANGLER" d1 insights DB --config "$CFG" --sort-type=avg --sort-by=writes --sort-direction=DESC --limit=100 --time-period=1d --json > "$RUNNER_TEMP/insights-avg.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/insights-avg.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw?.result||[]);
          const target=rows.filter((row)=>{
            const q=String(row?.query||'');
            return /(?:INSERT INTO tracks|UPDATE tracks SET|UPDATE explore_derived_tracks|UPDATE explore_shared_revision)/i.test(q);
          });
          console.log('D1_AVG_WRITE_TARGET_INSIGHTS='+JSON.stringify(target));
          console.log('REMOTE_D1_AVG_INSIGHTS_READONLY=PASS');
          NODE
