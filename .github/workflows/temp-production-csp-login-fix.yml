name: Temporary Production CSP Login Fix

on:
  issues:
    types: [opened]

concurrency:
  group: temp-production-csp-login-fix
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-hosting:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'PRODUCTION CSP LOGIN FIX RETRY3 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Deploy official Firebase Hosting only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          channelId: live
          projectId: soridraw

      - name: Verify production headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSIL --max-time 30 https://soridraw.web.app/)"
          printf '%s\n' "$headers"
          if printf '%s\n' "$headers" | grep -qi '^content-security-policy:'; then
            echo 'Unexpected Content-Security-Policy header remains.' >&2
            exit 1
          fi
          curl -fsS --max-time 30 https://soridraw.web.app/ >/dev/null

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue comment "$ISSUE_URL" --body "✅ PRODUCTION_CSP_LOGIN_FIX_SUCCESS sha=$(git rev-parse HEAD) url=https://soridraw.web.app/"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue comment "$ISSUE_URL" --body "❌ PRODUCTION_CSP_LOGIN_FIX_FAILED sha=$(git rev-parse HEAD) run_id=${{ github.run_id }}"
