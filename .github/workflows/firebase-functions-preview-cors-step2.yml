name: Firebase Functions Preview CORS Step 2

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/firebase-functions-preview-cors-step2.yml'

permissions:
  contents: read

concurrency:
  group: firebase-functions-preview-cors-step2
  cancel-in-progress: false

jobs:
  deploy-api-key-write-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BACKEND_PROJECT: soridraw-app-866a5
      PREVIEW_ORIGIN: https://preview.soridraw.com
      OFFICIAL_ORIGIN: https://soridraw.web.app

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and build Functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix functions --no-audit --no-fund
          npm --prefix functions run build
          for origin in \
            'https://preview.soridraw.com' \
            'https://soridraw-preview.web.app' \
            'https://soridraw-preview.firebaseapp.com'; do
            grep -Fq "$origin" functions/lib/securedIndex.js
          done
          git diff --exit-code -- firestore.rules database.rules.json firebase.json
          echo '[Functions CORS Step 2] build/scope gate: PASS'

      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy only API-key save/delete Functions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only functions:saveSunoApiKey,functions:deleteSunoApiKey \
            --project "$BACKEND_PROJECT" \
            --non-interactive
          echo '[Functions CORS Step 2] save/delete deploy: PASS'

      - name: Verify preview and official CORS on both endpoints
        shell: bash
        run: |
          set -euo pipefail
          for function_name in saveSunoApiKey deleteSunoApiKey; do
            url="https://us-central1-${BACKEND_PROJECT}.cloudfunctions.net/${function_name}"
            for origin in "$PREVIEW_ORIGIN" "$OFFICIAL_ORIGIN"; do
              ok=''
              for attempt in $(seq 1 18); do
                curl -sS -D "$RUNNER_TEMP/${function_name}.headers" -o /dev/null -X OPTIONS \
                  -H "Origin: $origin" \
                  -H 'Access-Control-Request-Method: POST' \
                  -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
                  "$url" || true
                status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$RUNNER_TEMP/${function_name}.headers")"
                allow="$(grep -i '^access-control-allow-origin:' "$RUNNER_TEMP/${function_name}.headers" | tail -n 1 | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//' || true)"
                echo "[Functions CORS Step 2] $function_name origin=$origin attempt=$attempt HTTP=${status:-missing} allow=${allow:-missing}"
                if [ "$status" = '204' ] && [ "$allow" = "$origin" ]; then ok='yes'; break; fi
                sleep 10
              done
              test "$ok" = 'yes'
            done
          done
          echo '[Functions CORS Step 2] preview + official CORS verification: PASS'

      - name: Result
        run: |
          echo 'Deployed only saveSunoApiKey and deleteSunoApiKey.'
          echo 'No authenticated POST was executed, so no API key or user data was written/deleted by this workflow.'
          echo 'No getSunoTrackStatus deploy, Rules update, Hosting release, main change, or migration was performed.'
