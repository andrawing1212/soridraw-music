name: Temp 1038 Music Note Root Cause Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-1038-musicnote-rootcause-audit.yml'

permissions:
  contents: read

jobs:
  r2_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUCKET: soridraw-media-preview
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Authenticate Firebase read-only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install admin SDK
        working-directory: functions
        run: npm ci

      - name: Read only user ids and anonymize
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const admin=require('./functions/node_modules/firebase-admin');
          admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:'soridraw-app-866a5'});
          const db=admin.firestore();
          (async()=>{
            const snap=await db.collection('users').select().get();
            const rows=snap.docs.map(d=>({uid:d.id,hash:crypto.createHash('sha256').update(d.id).digest('hex').slice(0,10)}));
            fs.writeFileSync(process.env.RUNNER_TEMP+'/r2-users.json',JSON.stringify(rows));
            console.log(`USERS_READ=${rows.length}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Install Worker tooling
        working-directory: cloudflare/media-worker
        run: npm install --no-audit --no-fund

      - name: Read-only R2 V3 Music Note object counts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          node - "$RUNNER_TEMP/r2-users.json" <<'NODE' > "$RUNNER_TEMP/r2-users.tsv"
          const fs=require('fs'); const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const r of rows) process.stdout.write(r.uid+'\t'+r.hash+'\n');
          NODE
          while IFS=$'\t' read -r uid hash; do
            [ -n "$uid" ] || continue
            encoded="$(node -p "encodeURIComponent(process.argv[1])" "$uid")"
            target="$RUNNER_TEMP/catalog-${hash}.json"
            if (cd cloudflare/media-worker && npx wrangler r2 object get "$BUCKET/catalog/v3/$encoded/musicNote.json" --file "$target" --remote >/dev/null 2>&1); then
              node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));console.log('R2_OWNER='+process.argv[2]+' itemCount='+p.itemCount+' revision='+p.revision+' complete='+p.complete+' generatedAtMs='+p.generatedAtMs)" "$target" "$hash"
            else
              echo "R2_OWNER=$hash MISSING"
            fi
          done < "$RUNNER_TEMP/r2-users.tsv"
          echo 'R2_READONLY_AUDIT=PASS'

      - name: Safety result
        run: |
          echo 'AUDIT_ONLY=YES'
          echo 'FIRESTORE_WRITES=0'
          echo 'R2_WRITES=0'
          echo 'DEPLOYMENTS=0'
          echo 'MAIN_PRODUCTION=UNTOUCHED'
