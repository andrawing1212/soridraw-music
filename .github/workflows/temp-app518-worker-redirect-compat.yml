name: APP518 QA Workers fetch redirect compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/media-worker/src/app518QaGithubOidc518.js'
      - 'cloudflare/media-worker/src/app518QaR2Lifecycle518.js'
      - 'qa/app518/live/verify-github-signed518.mjs'
      - 'qa/app518/live/verify-r2-lifecycle518.mjs'
      - '.github/workflows/temp-app518-worker-redirect-compat.yml'
permissions:
  contents: read
jobs:
  qa_518_compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact RSA gate and Cloudflare GET redirect=manual
        run: |
          set -euo pipefail
          node qa/app518/live/verify-github-signed518.mjs
          node qa/app518/live/verify-r2-lifecycle518.mjs
          echo APP518_QA_WORKER_MANUAL_REDIRECT_SUPPORTED_WITH_STATUS_GUARDS_PASS
