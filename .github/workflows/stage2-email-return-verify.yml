name: Stage2 Email Return Verify

on:
  push:
    branches: [preview-stage2-email-return]
    paths:
      - 'src/constants/emailVerification.ts'
      - '.github/workflows/stage2-email-return-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: preview-stage2-email-return
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Firebase preview return origins
        shell: bash
        run: |
          set -euo pipefail
          file='src/constants/emailVerification.ts'
          grep -Fq "'https://preview.soridraw.com'" "$file"
          grep -Fq "'https://soridraw-preview.web.app'" "$file"
          grep -Fq "'https://soridraw-preview.firebaseapp.com'" "$file"
          grep -Fq "'https://soridraw-music-git-preview-andrawing1212.vercel.app'" "$file"
          echo 'Email verification return-origin parity: PASS'
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
