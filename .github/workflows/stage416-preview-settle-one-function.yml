name: Stage416 PREVIEW Settle Task Collision Hotfix

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/stage416-preview-settle-one-function.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-stage416-preview-backend-release
  cancel-in-progress: false

jobs:
  settle-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT: soridraw-app-866a5
      TASK_NAME: stage416SettlePrivateWindowCandidate
      TASK_REGION: us-central1

    steps:
      - name: Lock exact PREVIEW code and protected branches
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse unexpected source or environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = preview
          trigger=.deploy/stage416-preview-settle-one-function.trigger
          target="$(sed -n 's/^product_code_target=//p' "$trigger")"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          test "$(grep -c '^product_code_target=' "$trigger")" -eq 1
          grep -Fxq 'scope=preview_existing_settle_task_only' "$trigger"
          grep -Fxq 'shared_d1_change=false' "$trigger"
          grep -Fxq 'shared_rtdb_rules_change=false' "$trigger"
          grep -Fxq 'worker_change=false' "$trigger"
          grep -Fxq 'hosting_change=false' "$trigger"
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "$target" origin/preview
          test "$target" = "$(git rev-parse HEAD^)"
          git rev-parse origin/main > "$RUNNER_TEMP/main-before"
          git rev-parse origin/production > "$RUNNER_TEMP/prod-before"
          git checkout --detach "$target"
          grep -Fq "result.reason==='NOT_DUE'?1_000:0" functions/src/exploreLikePrivateDeadline416.ts
          grep -Fq "SETTLEMENT_TASK_NOT_DELIVERED" functions/src/exploreLikePrivateTask416.ts
          echo "LOCKED_SETTLE_TASK_SOURCE=$target"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify exact like and task behavior
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/verify-416-private-deadline.mjs
          node scripts/verify-416-private-task-routing.mjs
          node scripts/verify-416-private-final-publisher.mjs
          node scripts/verify-416-finalize-e2e.mjs
          node scripts/verify-401-cross-device-opposite-like.mjs
          node scripts/verify-402-private-heart-count-pair.mjs
          npm run lint
          npm run build
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          echo 'STAGE416_SINGLE_TASK_PREFLIGHT=PASS'

      - name: Prepare only the pre-existing settle Function
        shell: bash
        run: |
          set -euo pipefail
          d=.stage416-settle-patch
          mkdir -p "$d/lib"
          for file in exploreLikePrivateTask416 exploreLikePrivateDeadline416 \
             exploreLikePrivateCommit416 exploreLikePrivateSeal416 \
             exploreLikePrivateHandoff416; do
            cp "functions/lib/$file.js" "$d/lib/$file.js"
          done
          cat > "$d/package.json" <<'JSON'
          {
            "name": "soridraw-stage416-settle-patch",
            "private": true,
            "main": "lib/index.js",
            "engines": {"node":"22"},
            "dependencies": {
              "firebase-admin": "^12.0.0",
              "firebase-functions": "^4.5.0"
            }
          }
          JSON
          cat > "$d/lib/index.js" <<'NODE'
          "use strict";
          const admin=require("firebase-admin");
          admin.initializeApp({
            databaseURL:"https://soridraw-app-866a5-default-rtdb.firebaseio.com"
          });
          exports.stage416SettlePrivateWindowCandidate =
            require("./exploreLikePrivateTask416").stage416SettlePrivateWindowCandidate;
          NODE
          cat > stage416.settle-patch.firebase.json <<'JSON'
          {"functions":{"source":".stage416-settle-patch"}}
          JSON
          npm install --prefix "$d" --omit=dev --no-audit --no-fund
          node - <<'NODE'
          const mod=require('./.stage416-settle-patch/lib/index.js');
          if(Object.keys(mod).join(',')!=='stage416SettlePrivateWindowCandidate')
            throw Error('SETTLE_FUNCTION_EXPORT_SCOPE_DRIFT');
          console.log('EXACTLY_ONE_EXISTING_TASK_FUNCTION=PASS');
          NODE

      - name: Authenticate Firebase deploy principal
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Verify existing Function HMAC and Cloud Task queue before deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe "$TASK_NAME" --gen2 --region "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/settle-before.json"
          gcloud tasks queues list --location "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/queue-before.json"
          node - "$RUNNER_TEMP/settle-before.json" "$RUNNER_TEMP/queue-before.json" <<'NODE'
          const fs=require('fs');
          const fn=JSON.parse(fs.readFileSync(process.argv[2]));
          const q=JSON.parse(fs.readFileSync(process.argv[3])).find(x=>
            String(x.name||'').endsWith('/'+process.env.TASK_NAME));
          if(fn.state!=='ACTIVE'||q?.state!=='RUNNING')
            throw Error('SETTLE_FUNCTION_OR_QUEUE_NOT_READY');
          if(!fn.serviceConfig?.secretEnvironmentVariables?.some(x=>
            String(x.secret||x.secretName||'').includes('SORIDRAW_PRIVATE_BATCH416_HMAC_SECRET')))
            throw Error('SETTLE_HMAC_SECRET_NOT_BOUND');
          console.log('EXISTING_TASK_QUEUE_AND_SECRET_PRECHECK=PASS');
          NODE

      - name: Deploy only PREVIEW Stage416 settle Task Function
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --project "$FIREBASE_PROJECT" \
            --config stage416.settle-patch.firebase.json \
            --only functions:stage416SettlePrivateWindowCandidate \
            --non-interactive --force
          echo 'PREVIEW_ONE_SETTLE_TASK_FUNCTION_DEPLOY=PASS'

      - name: Verify Task queue still RUNNING and protected branches unchanged
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe "$TASK_NAME" --gen2 --region "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/settle-after.json"
          gcloud tasks queues list --location "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/queue-after.json"
          node - "$RUNNER_TEMP/settle-after.json" "$RUNNER_TEMP/queue-after.json" <<'NODE'
          const fs=require('fs');
          const fn=JSON.parse(fs.readFileSync(process.argv[2]));
          const q=JSON.parse(fs.readFileSync(process.argv[3])).find(x=>
            String(x.name||'').endsWith('/'+process.env.TASK_NAME));
          if(fn.state!=='ACTIVE'||q?.state!=='RUNNING')
            throw Error('SETTLE_FUNCTION_OR_QUEUE_CHANGED_UNEXPECTEDLY');
          if(!fn.serviceConfig?.secretEnvironmentVariables?.some(x=>
            String(x.secret||x.secretName||'').includes('SORIDRAW_PRIVATE_BATCH416_HMAC_SECRET')))
            throw Error('SETTLE_HMAC_SECRET_LOST');
          console.log('SETTLE_FUNCTION_AND_QUEUE_LIVE=PASS');
          NODE
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/prod-before")"
          echo 'MAIN_PRODUCTION_UNCHANGED=PASS'
          echo 'NO_SHARED_D1_R2_RULES_WORKER_HOSTING_DATA_MUTATION=PASS'
