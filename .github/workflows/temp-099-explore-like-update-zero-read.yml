name: SORIDRAW 099 Explore Like Update Zero Read

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-099-explore-like-update-zero-read.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-099-explore-like-update-zero-read
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply 099 update zero-read cache preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/services/exploreLikeService.ts')
          source = path.read_text(encoding='utf-8')

          old_social = dedent('''
          import {
            clearExplorePersonalSocialSnapshot,
            getExplorePersonalSocialSnapshot,
            patchExplorePersonalSocialLike,
          } from './exploreSocialSnapshotService';
          import {
            invalidateExploreLikedTrackCollection,
            patchExploreLikedTrackMembership,
          } from './exploreLikedTracksService';
          ''').lstrip()
          new_social = dedent('''
          import {
            getExplorePersonalSocialSnapshot,
            patchExplorePersonalSocialLike,
          } from './exploreSocialSnapshotService';
          import { patchExploreLikedTrackMembership } from './exploreLikedTracksService';
          ''').lstrip()
          if old_social not in source:
              raise SystemExit('099 preflight: old social/liked cache imports missing')
          source = source.replace(old_social, new_social, 1)

          marker = '// SORIDRAW_EXPLORE_LIKE_ATOMIC_SIGNAL_098_20260916\n'
          if marker not in source:
              raise SystemExit('099 preflight: 098 marker missing')
          source = source.replace(marker, marker + '// SORIDRAW_EXPLORE_UPDATE_ZERO_READ_099_20260916\n', 1)

          start = source.find('  // If previousVersion does not match, this browser slept through at least one')
          end = source.find('\n\n  // 097:', start)
          if start < 0 or end <= start:
              raise SystemExit('099 preflight: missed-signal invalidation block missing')
          replacement = dedent('''
            // 099: a version gap/reconnect is not cache corruption. 098 already retains
            // recent approved deltas in RTDB, so preserve known-good local membership,
            // card and social caches and merge only the retained results below. Never turn
            // an app update or wake-up into a full liked-track verification/read.
            const cache = getLikedStateCache(uid);
          ''').rstrip()
          source = source[:start] + replacement + source[end:]

          dispatch_start = source.find("\n  if (missedSignal && typeof window !== 'undefined') {")
          dispatch_end = source.find('\n};', dispatch_start)
          if dispatch_start < 0 or dispatch_end <= dispatch_start:
              raise SystemExit('099 preflight: missed-signal event dispatch block missing')
          source = source[:dispatch_start] + source[dispatch_end:]
          path.write_text(source, encoding='utf-8')

          Path('scripts/verify-099-explore-like-update-zero-read.mjs').write_text(dedent(r'''
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const service = readFileSync('src/services/exploreLikeService.ts', 'utf8');
          const liked = readFileSync('src/services/exploreLikedTracksService.ts', 'utf8');
          const persistent = readFileSync('src/lib/soridrawPersistentCache.ts', 'utf8');

          assert.ok(service.includes('SORIDRAW_EXPLORE_UPDATE_ZERO_READ_099_20260916'));
          assert.ok(!service.includes('invalidateExploreLikedTrackCollection'));
          assert.ok(!service.includes('clearExplorePersonalSocialSnapshot'));

          const observerStart = service.indexOf('export const observeExploreLikeAccountSyncSignal');
          const observerEnd = service.indexOf('\nexport const ', observerStart + 20);
          assert.ok(observerStart >= 0);
          const observer = service.slice(observerStart, observerEnd > observerStart ? observerEnd : service.length);
          assert.ok(observer.includes('const cache = getLikedStateCache(uid);'));
          assert.ok(!observer.includes('cache.clear()'));
          assert.ok(!observer.includes('missedSignal'));
          assert.ok(!observer.includes('invalidateExploreLikedTrackCollection'));
          assert.ok(!observer.includes('clearExplorePersonalSocialSnapshot'));
          assert.ok(!observer.includes('EXPLORE_LIKE_ACCOUNT_INVALIDATION_EVENT'));
          assert.ok(observer.includes('rememberAccountSyncResults(uid, effectiveResults)'));
          assert.ok(observer.includes('patchExploreLikedTrackMembership(uid, result.trackId, result.liked)'));
          assert.ok(!observer.includes('fetch('));
          assert.ok(!observer.includes('requestLikedTracks'));

          // The full canonical liked-id request remains only the true cache-miss path.
          const getterStart = liked.indexOf('export const getExploreLikedTracks');
          assert.ok(getterStart >= 0);
          const getter = liked.slice(getterStart);
          assert.ok(getter.includes('if (cache.canonicalLikedTrackIds === null)'));
          assert.ok(getter.includes('requestLikedTracks(user, [])'));
          assert.ok(liked.includes('patchExploreLikedTrackMembership'));

          // App version is not part of the persistent cache key/compatibility identity.
          assert.ok(persistent.includes("const CACHE_STORAGE_PREFIX = 'soridraw_cache_envelope_v1'"));
          assert.ok(!persistent.includes('app-version.json'));
          assert.ok(!persistent.includes('APP_VERSION'));

          console.log('PASS 099: app update/wake version gaps preserve liked membership/card caches; no full liked-track verification or D1/Firestore read is introduced by reconnect.');
          ''').lstrip(), encoding='utf-8')
          PY

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify 094-099 like path
        run: |
          node scripts/verify-094-explore-session-like-batch.mjs
          node scripts/verify-095-explore-like-zero-read-display.mjs
          node scripts/verify-096-explore-like-cross-device-replay.mjs
          node scripts/verify-097-explore-like-pending-ack.mjs
          node scripts/verify-098-explore-like-atomic-signal.mjs
          node scripts/verify-099-explore-like-update-zero-read.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify cost and liked-profile regressions
        run: |
          node scripts/verify-explore-like-cost-optimization.mjs
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs

      - name: Guard exact product scope
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- dist 2>/dev/null || true
          git add src/services/exploreLikeService.ts scripts/verify-099-explore-like-update-zero-read.mjs
          git diff --cached --check
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged.txt"
          test "$(cat "$RUNNER_TEMP/staged.txt")" = $'scripts/verify-099-explore-like-update-zero-read.mjs\nsrc/services/exploreLikeService.ts'

      - name: Commit verified 099 product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: preserve liked cache across update reconnects'
          git push origin HEAD:preview
          echo "PRODUCT_SHA=$(git rev-parse HEAD)"
          echo 'NO_DEPLOY=true'
          echo 'NO_WORKER_CHANGE=true'
          echo 'NO_FUNCTIONS_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_FIRESTORE_CHANGE=true'
          echo 'NO_RTDB_RULE_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
