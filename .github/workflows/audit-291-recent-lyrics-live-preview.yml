name: audit app291 recent lyrics live preview

on:
  push:
    branches: [preview]
    paths:
      - 'src/App.tsx'
      - 'scripts/verify-291-recent-lyrics-live-preview.mjs'
      - '.github/workflows/audit-291-recent-lyrics-live-preview.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: app291 lyrics live preview
        run: node scripts/verify-291-recent-lyrics-live-preview.mjs
      - name: app290 cost batching regression
        run: |
          node scripts/verify-290-recent-edit-batch.mjs
          node scripts/verify-290-studio-heart-batch.mjs
      - name: app289 Music Note heart regression
        run: node scripts/verify-289-music-note-compact-heart-sync.mjs
      - name: Music Note detail batch regression
        run: node scripts/verify-031-music-note-detail-batched-draft.mjs
      - name: Build
        run: npm run build
