name: Apply 093 Explore Like RTDB Zero Count

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/trigger-093-explore-like-rtdb-zero-count.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-093-explore-like-rtdb-zero-count
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted 093 patch
        run: python3 .deploy/apply-093-explore-like-rtdb-zero-count.py

      - name: Verify 093 cost and correctness contract
        run: node scripts/verify-093-explore-like-rtdb-zero-count.mjs

      - name: Verify RTDB Rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('RTDB_RULES_JSON=PASS')"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Set up Java 21 for RTDB emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile RTDB rules in local emulator only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest emulators:exec \
            --only database \
            --project demo-soridraw-like-sync \
            "node -e \"console.log('RTDB_RULES_EMULATOR=PASS')\""

      - name: Verify strict change boundary
        shell: bash
        run: |
          set -euo pipefail
          git add -N scripts/verify-093-explore-like-rtdb-zero-count.mjs
          git diff --check
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/services/exploreLikeService\.ts|src/services/userDomainSyncService\.ts|src/services/exploreLikeDisplayStateService\.ts|database\.rules\.json|scripts/verify-093-explore-like-rtdb-zero-count\.mjs)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected source changes:'
            echo "$bad"
            exit 1
          fi
          echo 'NO_FIREBASE_FUNCTIONS_CHANGE=true'
          echo 'NO_FIRESTORE_RULE_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_WORKER_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
          echo 'NO_HOSTING_DEPLOY=true'
          echo 'NO_CLOUDFLARE_DEPLOY=true'

      - name: Commit validated PREVIEW source
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            src/services/exploreLikeService.ts
            src/services/userDomainSyncService.ts
            src/services/exploreLikeDisplayStateService.ts
            database.rules.json
            scripts/verify-093-explore-like-rtdb-zero-count.mjs
          )
          if git diff --quiet -- "${tracked[@]}"; then
            echo '093 already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${tracked[@]}"
          git commit -m 'fix: move Explore like sync off Firestore'
          git push origin HEAD:preview
