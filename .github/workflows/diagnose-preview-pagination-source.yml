name: Diagnose Preview Pagination Source

on:
  push:
    branches:
      - preview
    paths:
      - '.github/workflows/diagnose-preview-pagination-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Inspect catalog publish callers
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -B 8 -A 18 "schedulePreviewAdaptiveListIndexPublishIfDirty" src/App.tsx src/pages/SunoLibraryPage.tsx src | head -320
