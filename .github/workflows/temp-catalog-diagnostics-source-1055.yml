name: Temp Catalog Diagnostics Source 1055

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-catalog-diagnostics-source-1055.yml']

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUNTIME_BASE: '24972df9ac309c9fca5b16c915d58c5ae59b8bb5'
      MAIN_BASE: '49c799cbb46d137539f74a48c261f7256762336f'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 40

      - name: Guard runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RUNTIME_BASE" HEAD
          git diff --exit-code "$RUNTIME_BASE"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json functions cloudflare firestore.rules
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$MAIN_BASE"

      - name: Apply exact Catalog provenance fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: anchor missing')
              return text.replace(old, new, 1)

          p = Path('src/lib/userDataEngine.ts')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              "const catalogReadInFlight = new Map<string, Promise<SoridrawCatalogSnapshot | null>>();",
              """const catalogReadInFlight = new Map<string, Promise<SoridrawCatalogSnapshot | null>>();
          type CatalogReadSource = 'cache' | 'remote' | 'none';
          const catalogLastReadSources = new Map<string, CatalogReadSource>();

          export const readLastCatalogReadSource = (
            kind: SoridrawCatalogKind,
            uid: string,
          ): CatalogReadSource => catalogLastReadSources.get(catalogKey(kind, uid)) || 'none';""",
              'userDataEngine source map',
          )
          s = once(
              s,
              """    if (local && canUseWarmCatalogWithoutRemote({
                localRevision: local.revision,
                profileRevision: knownRemoteRevision,
                sessionValidated,
              })) {
                return local;
              }""",
              """    if (local && canUseWarmCatalogWithoutRemote({
                localRevision: local.revision,
                profileRevision: knownRemoteRevision,
                sessionValidated,
              })) {
                catalogLastReadSources.set(key, 'cache');
                return local;
              }""",
              'warm local provenance',
          )
          s = once(
              s,
              """    const remote = await readRemoteCatalogSnapshot(kind, uid, 0, local);
              if (remote) return remote;

              // A server-unvalidated local snapshot must not masquerade as complete Catalog.
              // The caller can keep its legacy localStorage list as provisional paint/error fallback.
              if (!sessionValidated) return null;
              if (local && knownRemoteRevision > local.revision) return null;
              return local;""",
              """    const remote = await readRemoteCatalogSnapshot(kind, uid, 0, local);
              if (remote) {
                catalogLastReadSources.set(key, 'remote');
                return remote;
              }

              // A server-unvalidated local snapshot must not masquerade as complete Catalog.
              // The caller can keep its legacy localStorage list as provisional paint/error fallback.
              if (!sessionValidated) {
                catalogLastReadSources.set(key, 'none');
                return null;
              }
              if (local && knownRemoteRevision > local.revision) {
                catalogLastReadSources.set(key, 'none');
                return null;
              }
              catalogLastReadSources.set(key, local ? 'cache' : 'none');
              return local;""",
              'remote/fallback provenance',
          )
          p.write_text(s, encoding='utf-8')

          p = Path('src/lib/adaptiveListIndexV2.ts')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              "  readCatalogSnapshotCacheFirst,\n",
              "  readCatalogSnapshotCacheFirst,\n  readLastCatalogReadSource,\n",
              'adaptive source import',
          )
          s = once(
              s,
              "  catalogRevision: number;\n};",
              "  catalogRevision: number;\n  fromCache: boolean;\n};",
              'adaptive source type',
          )
          s = once(
              s,
              "    catalogRevision: snapshot.revision,\n  };",
              "    catalogRevision: snapshot.revision,\n    fromCache: readLastCatalogReadSource(kind, uid) === 'cache',\n  };",
              'adaptive source return',
          )
          p.write_text(s, encoding='utf-8')

          p = Path('src/lib/listBundleCache.ts')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              "  catalogRevision?: number;\n};",
              "  catalogRevision?: number;\n  fromCache?: boolean;\n};",
              'bundle source type',
          )
          s = once(
              s,
              "if (revision > latestCatalogRevision) deliverAdaptiveBundle(bundle, { fromCache: false }, true);",
              "if (revision > latestCatalogRevision) deliverAdaptiveBundle(bundle, { fromCache: bundle.fromCache === true }, true);",
              'delta source delivery',
          )
          s = once(
              s,
              "deliverAdaptiveBundle(adaptiveBundle, { fromCache: false });",
              "deliverAdaptiveBundle(adaptiveBundle, { fromCache: adaptiveBundle.fromCache === true });",
              'startup source delivery',
          )
          p.write_text(s, encoding='utf-8')
          print('CATALOG_DIAGNOSTIC_SOURCE_PATCH=APPLIED')
          PY

      - name: Static diagnostic safety guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/lib/adaptiveListIndexV2.ts src/lib/listBundleCache.ts src/lib/userDataEngine.ts "
          grep -q "catalogLastReadSources.set(key, 'cache')" src/lib/userDataEngine.ts
          grep -q "catalogLastReadSources.set(key, 'remote')" src/lib/userDataEngine.ts
          grep -q "fromCache: readLastCatalogReadSource(kind, uid) === 'cache'" src/lib/adaptiveListIndexV2.ts
          grep -q "fromCache: adaptiveBundle.fromCache === true" src/lib/listBundleCache.ts
          grep -q "fromCache: bundle.fromCache === true" src/lib/listBundleCache.ts
          if grep -q "deliverAdaptiveBundle(adaptiveBundle, { fromCache: false })" src/lib/listBundleCache.ts; then exit 1; fi
          echo 'DIAGNOSTIC_PROVENANCE_GUARDS=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: TypeScript app build and warm-cache tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test test/catalogWarmCachePolicy.test.mjs
          npx tsc --noEmit
          npm run build
          test -s dist/index.html
          echo 'APP_TYPESCRIPT_BUILD=PASS'

      - name: Functions and Library regression
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle
          echo 'FUNCTIONS_BUILD_LIBRARY_REGRESSION=PASS'

      - name: Commit diagnostics fix to preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add src/lib/userDataEngine.ts src/lib/adaptiveListIndexV2.ts src/lib/listBundleCache.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix(preview): report warm Catalog cache reads accurately'
          git push origin HEAD:preview
          echo "FEATURE_COMMIT=$(git rev-parse HEAD)"

      - name: Verify unchanged Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw-media-preview.andrawing1212.workers.dev/health -o "$RUNNER_TEMP/worker-health.json"
          grep -q '"catalogDeltaMode":"base+journal"' "$RUNNER_TEMP/worker-health.json"
          grep -q '"catalogCompactionAfter":200' "$RUNNER_TEMP/worker-health.json"
          echo 'CLOUDFLARE_UNCHANGED_HEALTH=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production before PREVIEW deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Firebase PREVIEW Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact PREVIEW build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          echo "LOCAL_INDEX_SHA=$local_sha"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok=yes
                  echo "EXACT_BUILD_PASS=$url:$remote_sha"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify main and Production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$MAIN_BASE"
          echo 'PRODUCTION_MAIN_UNCHANGED=PASS'

      - name: Cleanup temporary workflow and package exact source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git rm .github/workflows/temp-catalog-diagnostics-source-1055.yml
          git commit -m 'chore(preview): remove temporary Catalog diagnostics workflow'
          git push origin HEAD:preview
          final_head="$(git rev-parse HEAD)"
          echo "FINAL_PREVIEW_HEAD=$final_head"
          git archive --format=zip --prefix="SORIDRAW_PREVIEW_${final_head:0:8}/" -o "SORIDRAW_PREVIEW_${final_head:0:8}_catalog_diagnostics_fix.zip" "$final_head"
          test -s "SORIDRAW_PREVIEW_${final_head:0:8}_catalog_diagnostics_fix.zip"
          sha256sum "SORIDRAW_PREVIEW_${final_head:0:8}_catalog_diagnostics_fix.zip"
          echo "ZIP_PATH=SORIDRAW_PREVIEW_${final_head:0:8}_catalog_diagnostics_fix.zip" >> "$GITHUB_ENV"

      - name: Upload deployed source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_catalog_diagnostics_fix
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 7
