name: TEMP update catalog release docs

on:
  push:
    branches: ['tmp/catalog-no-fullscan-20260915']
    paths: ['.github/workflows/temp-update-catalog-release-docs.yml']

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/catalog-no-fullscan-20260915
          fetch-depth: 2
      - name: Update docs
        run: python3 scripts/temp-update-catalog-release-docs.py
      - name: Verify docs and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Catalog Firestore 전체조회 차단' DOCS/CURRENT_RELEASE_STATE.md
          grep -Fq 'Catalog 전체 Firestore 재구성 차단 코드 반영' DOCS/NEXT_CODEX_TASK.md
          git diff --check
          git config user.name 'soridraw-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md
          git commit -m 'docs: record catalog full-scan prevention state'
          git push origin HEAD:tmp/catalog-no-fullscan-20260915
