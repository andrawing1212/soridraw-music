name: SORIDRAW 100 Liked Card Retention Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-100-liked-card-retention-audit.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-100-liked-card-retention-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Verify liked-path regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
          node scripts/verify-087-liked-card-consistency.mjs
          node scripts/verify-094-explore-session-like-batch.mjs
          node scripts/verify-095-explore-like-zero-read-display.mjs
          node scripts/verify-096-explore-like-cross-device-replay.mjs
          node scripts/verify-097-explore-like-pending-ack.mjs
          node scripts/verify-098-explore-like-atomic-signal.mjs
          node scripts/verify-099-explore-like-update-zero-read.mjs
          node scripts/verify-100-liked-card-retention.mjs
          node scripts/verify-explore-like-cost-optimization.mjs
      - name: Guard no backend or UI scope change
        shell: bash
        run: |
          set -euo pipefail
          base=0dab8ac8bf42f949c1ceb0c48702f0eb5f15fec5
          files="$(git diff --name-only "$base"...HEAD | grep -v '^.github/workflows/temp-100-liked-card-retention-audit.yml$' || true)"
          printf '%s\n' "$files"
          allowed='^(src/services/exploreLikedTracksService.ts|scripts/verify-100-liked-card-retention.mjs)$'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "$file" | grep -Eq "$allowed"
          done <<< "$files"
          ! echo "$files" | grep -Eq '(^|/)(cloudflare|functions|database.rules.json|firestore.rules|src/components|src/pages)/'
