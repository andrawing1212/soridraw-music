name: TEMP app120 actor-count validation

on:
  push:
    branches:
      - work/app120-like-actor-count-lock

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: App 120 regression
        run: node scripts/verify-120-explore-like-actor-count-lock.mjs
