name: OPS Preview Classic Mobile Keywords V16

on:
  push:
    branches:
      - ops-preview-classic-mobile-keywords-v16

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect classic keyword color and spacing owners
        shell: bash
        run: |
          set -euo pipefail
          echo '=== chip class function ==='
          grep -n -C 20 'getAppliedSelectionKeywordChipClass' src/App.tsx || true
          echo '=== selected keyword text class function ==='
          grep -n -C 20 'getAppliedSelectionKeywordTextClass' src/App.tsx || true
          echo '=== classic light keyword CSS ==='
          sed -n '4825,4925p' src/index.css
          echo '=== builder keyword CSS outside Studio Black ==='
          grep -n -C 10 'soridraw-builder-live-keywords' src/index.css || true
