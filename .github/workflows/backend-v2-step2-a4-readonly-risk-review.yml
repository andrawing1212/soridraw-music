name: SORIDRAW Backend V2 Step 2-A4 Readonly Sync Risk Review

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2-a4-readonly-risk-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      APPROVED_SCOPE: Step 2-A4 recent Music Note V1 to V2 sync risk review read-only approved 2026-08-26 KST

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - run: npm ci --ignore-scripts

      - name: Step 2-A4 read-only live identity and mutation-risk review
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$TARGET_PROJECT"
          export GCLOUD_PROJECT="$TARGET_PROJECT"
          export GOOGLE_CLOUD_QUOTA_PROJECT="$TARGET_PROJECT"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = String(process.env.TARGET_PROJECT || '');
          const bucketName = String(process.env.TARGET_BUCKET || '');
          const backupPrefix = String(process.env.BACKUP_PREFIX || '');
          const expectedManifestHash = String(process.env.EXPECTED_MANIFEST_SHA256 || '');
          const approvedScope = String(process.env.APPROVED_SCOPE || '');
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          if (bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('BUCKET_PIN_MISMATCH');
          if (!approvedScope.includes('2-A4') || !approvedScope.toLowerCase().includes('read-only')) throw new Error('READONLY_APPROVAL_MISSING');

          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string','boolean'].includes(typeof value)) return value;
            if (typeof value === 'number') return Number.isFinite(value) ? value : String(value);
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return { t:'bytes', v:Buffer.from(value).toString('base64') };
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return { t:'date', v:value.toISOString() };
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return { t:'ts', s:value.seconds, n:value.nanoseconds };
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return { t:'geo', a:value.latitude, o:value.longitude };
            if (typeof value?.path === 'string' && value?.firestore) return { t:'ref', p:value.path };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((k) => [k, canonicalize(value[k])]));
            return String(value);
          };
          const digest = (value) => sha256(JSON.stringify(canonicalize(value)));

          const metricValue = (point) => {
            const raw = point?.value?.int64Value ?? point?.value?.doubleValue ?? 0;
            const n = Number(raw);
            return Number.isFinite(n) && n > 0 ? n : 0;
          };
          const queryMetric = async (accessToken, metricType, startMs, endMs) => {
            const params = new URLSearchParams({
              filter: `metric.type = "${metricType}"`,
              'interval.startTime': new Date(startMs).toISOString(),
              'interval.endTime': new Date(endMs).toISOString(),
              view: 'FULL',
              pageSize: '1000',
            });
            let total = 0, pointCount = 0, pageToken = '', pages = 0;
            do {
              if (pageToken) params.set('pageToken', pageToken); else params.delete('pageToken');
              const response = await fetch(`https://monitoring.googleapis.com/v3/projects/${projectId}/timeSeries?${params}`, {
                headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, Accept: 'application/json' },
              });
              const text = await response.text();
              if (!response.ok) {
                const error = new Error(`MONITORING_${response.status}`);
                error.statusCode = response.status;
                throw error;
              }
              const body = text ? JSON.parse(text) : {};
              for (const series of body.timeSeries || []) for (const point of series.points || []) { total += metricValue(point); pointCount += 1; }
              pageToken = String(body.nextPageToken || '');
              if (++pages > 5) throw new Error('MONITORING_PAGINATION_LIMIT');
            } while (pageToken);
            return { total: Math.round(total), pointCount };
          };
          const queryFamily = async (token, candidates, start, end) => {
            for (const type of candidates) {
              try {
                const result = await queryMetric(token, type, start, end);
                if (result.pointCount > 0) return result.total;
              } catch (error) {
                if (error?.statusCode === 400 || error?.statusCode === 404) continue;
                throw error;
              }
            }
            return 0;
          };

          const candidateFields = [
            'soridrawSongId','canonicalSongId','id','songId','sourceId','trackId','originalTrackId',
            'favoriteKey','favoriteFirestoreId','musicNoteFavoriteId','provider','audioUrl','streamAudioUrl','audio_url',
            'createdAtMs','generatedAtMs','createdAt','generatedAt'
          ];
          const summarizeCoverage = (items) => {
            const result = {};
            for (const field of candidateFields) {
              const values = items.map((item) => item?.[field]).filter((value) => value !== undefined && value !== null && String(value).trim() !== '');
              const normalized = values.map((value) => typeof value === 'object' ? digest(value) : String(value).trim());
              result[field] = { present: values.length, unique: new Set(normalized).size };
            }
            return result;
          };
          const fieldsPresent = (item) => candidateFields.filter((field) => item?.[field] !== undefined && item?.[field] !== null && String(item[field]).trim() !== '');

          const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step2a4-readonly-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const bucket = getStorage(app).bucket(bucketName);
            const cred = admin.credential.applicationDefault();
            const token = await cred.getAccessToken();
            const accessToken = String(token?.access_token || '');
            if (!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');

            const requiredPermissions = ['datastore.entities.get', 'datastore.entities.list'];
            const iamResponse = await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify({ permissions: requiredPermissions }),
            });
            if (!iamResponse.ok) throw new Error(`IAM_TEST_${iamResponse.status}`);
            const granted = new Set(((await iamResponse.json()).permissions || []).map(String));
            if (requiredPermissions.some((permission) => !granted.has(permission))) throw new Error('READONLY_IAM_MISSING');

            const now = new Date();
            const kstDate = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit' }).format(now);
            const dayStartMs = Date.parse(`${kstDate}T00:00:00+09:00`);
            const [todayReads, todayWrites, todayDeletes] = await Promise.all([
              queryFamily(accessToken, ['firestore.googleapis.com/document/read_ops_count','firestore.googleapis.com/document/read_count'], dayStartMs, now.getTime()),
              queryFamily(accessToken, ['firestore.googleapis.com/document/write_ops_count','firestore.googleapis.com/document/write_count'], dayStartMs, now.getTime()),
              queryFamily(accessToken, ['firestore.googleapis.com/document/delete_ops_count','firestore.googleapis.com/document/delete_count'], dayStartMs, now.getTime()),
            ]);
            const estimatedReads = 800;
            const safeReadCap = Math.min(10000, Math.max(0, 50000 - todayReads - 10000));
            if (safeReadCap < estimatedReads) throw new Error(`READ_QUOTA_PAUSE:${safeReadCap}`);
            console.log('STEP2A4_QUOTA=' + JSON.stringify({ todayReads, todayWrites, todayDeletes, safeReadCap, estimatedReads }));

            const [manifestBytes] = await bucket.file(`${backupPrefix}/manifest.json`).download();
            if (sha256(manifestBytes) !== expectedManifestHash) throw new Error('MANIFEST_HASH_MISMATCH');
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            const getBackup = async (id) => {
              const dataset = (manifest.datasets || []).find((entry) => entry?.id === id);
              if (!dataset) throw new Error(`BACKUP_DATASET_MISSING:${id}`);
              const [bytes] = await bucket.file(`${backupPrefix}/${dataset.fileName}`).download();
              if (sha256(bytes) !== dataset.sha256) throw new Error(`BACKUP_DATASET_HASH:${id}`);
              return bytes.toString('utf8').split('\n').filter(Boolean).map(JSON.parse);
            };
            const [backupFavorites, backupRecent] = await Promise.all([getBackup('favorites'), getBackup('user_recent_songs')]);

            const [favoriteSnap, recentSnap] = await Promise.all([
              db.collection('favorites').get(),
              db.collection('user_recent_songs').get(),
            ]);
            const liveFavorites = favoriteSnap.docs.map((doc) => ({ path: doc.ref.path, data: doc.data() }));
            const liveRecentItems = recentSnap.docs.flatMap((doc) => {
              const songs = Array.isArray(doc.data()?.songs) ? doc.data().songs : [];
              return songs.map((song, index) => ({ ...song, __bundlePath: doc.ref.path, __index: index }));
            });
            const backupFavoritePaths = new Set(backupFavorites.map((row) => String(row.path)));
            const newFavorites = liveFavorites.filter((row) => !backupFavoritePaths.has(row.path));

            const backupRecentByPath = new Map(backupRecent.map((row) => [String(row.path), row.data]));
            const newlyAddedRecentItems = [];
            let changedRecentBundles = 0;
            for (const doc of recentSnap.docs) {
              const path = doc.ref.path;
              const liveSongs = Array.isArray(doc.data()?.songs) ? doc.data().songs : [];
              const backupSongs = Array.isArray(backupRecentByPath.get(path)?.songs) ? backupRecentByPath.get(path).songs : [];
              if (digest(doc.data()) === digest(backupRecentByPath.get(path))) continue;
              changedRecentBundles += 1;
              const counts = new Map();
              for (const song of backupSongs) {
                const key = digest(song);
                counts.set(key, (counts.get(key) || 0) + 1);
              }
              for (const song of liveSongs) {
                const key = digest(song);
                const count = counts.get(key) || 0;
                if (count > 0) counts.set(key, count - 1);
                else newlyAddedRecentItems.push(song);
              }
            }

            console.log('STEP2A4_IDENTITY_RECENT=' + JSON.stringify({
              liveItems: liveRecentItems.length,
              coverage: summarizeCoverage(liveRecentItems),
              changedBundlesSinceBackup: changedRecentBundles,
              newlyAddedItemsSinceBackup: newlyAddedRecentItems.length,
              newItemFieldSets: newlyAddedRecentItems.map((item, index) => ({ item:`recent-new-${index + 1}`, fields: fieldsPresent(item) })),
            }));
            console.log('STEP2A4_IDENTITY_FAVORITES=' + JSON.stringify({
              liveDocuments: liveFavorites.length,
              coverage: summarizeCoverage(liveFavorites.map((row) => row.data)),
              newSinceBackup: newFavorites.length,
              newItemFieldSets: newFavorites.map((row, index) => ({ item:`favorite-new-${index + 1}`, fields: fieldsPresent(row.data) })),
            }));

            const repositorySource = fs.readFileSync('src/data/userDataRepository.ts','utf8');
            const shadowSource = fs.readFileSync('src/data/v2ShadowValidation.ts','utf8');
            const cacheSource = fs.readFileSync('src/data/indexedDbLocalCache.ts','utf8');
            const appSource = fs.readFileSync('src/App.tsx','utf8');
            const rulesSource = fs.readFileSync('firestore.rules','utf8');
            const staticReview = {
              runtimeV1Only: /BACKEND_V2_RUNTIME_MODE\s*=\s*'v1-only'/.test(repositorySource),
              v2WriteGateOff: /writeToV2:\s*false/.test(repositorySource),
              v1DeleteGateOff: /deleteV1:\s*false/.test(repositorySource),
              shadowWriteRuntimeOff: /BACKEND_V2_SHADOW_WRITE_RUNTIME_ENABLED\s*=\s*false/.test(shadowSource),
              localCacheRuntimeOff: /BACKEND_V2_LOCAL_CACHE_RUNTIME_ENABLED\s*=\s*false/.test(cacheSource),
              indexedDbOutboxStorePresent: /outbox|pendingMutation|pendingMutations|mutationQueue/i.test(cacheSource),
              recentWholeBundlePersistenceHelperPresent: /persistRecentSongsDocument/.test(appSource),
              recentSyncVersionSignalPresent: /syncVersions\.recentSongs/.test(appSource),
              favoriteMutationSignalPresent: /favoriteSyncSignal/.test(appSource),
              v2OwnerSongCreateRulePresent: /match \/songs\/\{songId\}/.test(rulesSource) && /ownerCreatesWithoutMigrationProvenance/.test(rulesSource),
              v2OwnerCannotCreateLegacyProvenance: /ownerCreatesWithoutMigrationProvenance/.test(rulesSource),
            };
            console.log('STEP2A4_STATIC=' + JSON.stringify(staticReview));

            console.log('STEP2A4_RESULT=' + JSON.stringify({
              readOnly:true,
              firebaseWrites:0,
              firebaseDeletes:0,
              storageWrites:0,
              rulesDeploys:0,
              functionsDeploys:0,
              hostingDeploys:0,
              currentV2RuntimeActivated:false,
              positionalRecentIdsSafeForLiveUse:false,
              durableMirrorRetryOutboxExists:false,
              step4MayStart:false,
            }));
          })().catch((error) => {
            console.error('STEP2A4_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          }).finally(async () => {
            await deleteApp(app);
          });
          NODE
