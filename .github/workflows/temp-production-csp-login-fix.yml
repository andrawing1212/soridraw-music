name: Temporary Production CSP Login Fix

on:
  issues:
    types: [opened]

concurrency:
  group: temp-production-csp-login-fix
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-hosting:
    if: github.event.issue.title == 'PRODUCTION CSP LOGIN FIX 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.34.0

      - name: Deploy Firebase Hosting only
        run: firebase deploy --only hosting --project soridraw-app-866a5 --non-interactive

      - name: Verify production headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSIL --max-time 30 https://soridraw.web.app/)"
          printf '%s\n' "$headers"
          if printf '%s\n' "$headers" | grep -qi '^content-security-policy:'; then
            echo 'Unexpected Content-Security-Policy header remains.' >&2
            exit 1
          fi
          curl -fsS --max-time 30 https://soridraw.web.app/ >/dev/null

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue comment "$ISSUE_URL" --body "✅ PRODUCTION_CSP_LOGIN_FIX_SUCCESS sha=$(git rev-parse HEAD) url=https://soridraw.web.app/"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue comment "$ISSUE_URL" --body "❌ PRODUCTION_CSP_LOGIN_FIX_FAILED sha=$(git rev-parse HEAD)"
