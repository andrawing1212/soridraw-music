name: TEMP Dispatch SORIDRAW TEST Release

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-test-promotion.trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact PREVIEW TEST release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 1d488e5cecf14ef20e687049a9da47779a3d3ba5
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref preview --arg mode test --arg target "$TARGET_SHA" '{ref:$ref,inputs:{mode:$mode,target_sha:$target}}')"
          code="$(curl -sS -o "$RUNNER_TEMP/dispatch.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/soridraw-release-promotion.yml/dispatches" \
            -d "$payload")"
          test "$code" = "204"
          echo "SORIDRAW_TEST_RELEASE_DISPATCH=PASS"
