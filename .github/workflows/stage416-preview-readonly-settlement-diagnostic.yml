      - name: Compare one public curated card with shared R2 card and canonical D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
          SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const base='https://soridraw-explore-preview.andrawing1212.workers.dev';
          const safeGet=async(url)=>{
            const resp=await fetch(url,{headers:{Accept:'application/json',Origin:'https://preview.soridraw.com','Cache-Control':'no-cache'}});
            if(!resp.ok)throw Error('CURATED_PUBLIC_READ_HTTP_'+resp.status);
            const body=await resp.json();
            if(body?.ok!==true)throw Error('CURATED_PUBLIC_BAD_RESPONSE');
            return body.data;
          };
          const data=await safeGet(base+'/v1/curated?collection=soridraw&limit=20');
          const entries=Array.isArray(data?.items)?data.items:[];
          console.log('STAGE416_PUBLIC_CURATED_ITEM_COUNT='+entries.length);
          console.log('STAGE416_PUBLIC_CURATED_FIRST_ROW_KEYS='+
            JSON.stringify(Object.keys(entries[0]||{}).filter(x=>/track|id|title|name/i.test(x)).slice(0,8)));
          console.log('STAGE416_PUBLIC_CURATED_FIRST_TRACK_KEYS='+
            JSON.stringify(Object.keys(entries[0]?.track||{}).filter(x=>/id|title|name|like|count/i.test(x)).slice(0,10)));
          // Titles may be stored in other public display fields or contain
          // invisible separators. Do not reveal account identifiers or IDs.
          const rows=entries.map(row=>row?.track||row);
          const candidates=rows.map(row=>({
            row,
            title:String(row?.title||row?.name||row?.trackTitle||row?.displayTitle||'')
              .normalize('NFKC').replace(/\\s+/g,'').trim(),
          }));
          const matches=candidates.filter(x=>x.title.includes('골목길')&&
            x.title.includes('탐험대')).map(x=>x.row);
          console.log('STAGE416_PUBLIC_CURATED_MATCH_COUNT='+matches.length);
          console.log('STAGE416_PUBLIC_CURATED_TITLE_FIELD_COUNT='+
            candidates.filter(x=>x.title.length>0).length);
          if(matches.length!==1)throw Error('CURATED_TRACK_TITLE_NOT_UNIQUE_OR_ABSENT_'+matches.length);
          const publicTrack=matches[0];
          const trackId=String(publicTrack?.id||publicTrack?.trackId||'').trim();
          if(!trackId||trackId.length>512)throw Error('CURATED_TRACK_ID_INVALID');
          console.log('STAGE416_SINGLE_PUBLIC_TRACK_HASH12='+createHash('sha256').update(trackId).digest('hex').slice(0,12));
          const curatedCount=Number(publicTrack.likeCount??publicTrack?.stats?.likeCount);
          if(!Number.isSafeInteger(curatedCount)||curatedCount<0)
            throw Error('CURATED_LIKE_COUNT_INVALID');
          const changed=await safeGet(base+'/v1/public-like-cards?trackIds='+encodeURIComponent(trackId));
          const card=(changed.items||[]).find(row=>row.trackId===trackId);
          const r2Count=card?Number(card.likeCount):null;
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID,db=process.env.SHARED_D1_ID;
          const sql='SELECT COALESCE(s.like_count,0) AS like_count FROM tracks t LEFT JOIN track_stats s ON s.track_id=t.id WHERE t.id=? AND t.is_public=1 AND t.status=\'published\' LIMIT 1';
          const resp=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,
            {method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
             body:JSON.stringify({sql,params:[trackId]})});
          const payload=await resp.json();
          const result=payload?.result?.[0];
          if(!resp.ok||payload?.success!==true||result?.success!==true||
             !Array.isArray(result.results)||result.results.length!==1)
            throw Error('CURATED_CANONICAL_D1_EXACT_READ_FAILED');
          const rowsRead=Number(result.meta?.rows_read??0),rowsWritten=Number(result.meta?.rows_written??0);
          if(rowsWritten!==0||rowsRead>10)
            throw Error('CURATED_EXACT_D1_COST_EXCEEDED');
          const canonicalCount=Number(result.results[0].like_count);
          console.log('STAGE416_PUBLIC_TRACK_CURATED_COUNT='+curatedCount);
          console.log('STAGE416_PUBLIC_TRACK_R2_CARD_COUNT='+(r2Count===null?'ABSENT':r2Count));
          console.log('STAGE416_PUBLIC_TRACK_CANONICAL_D1_COUNT='+canonicalCount);
          console.log('STAGE416_PUBLIC_TRACK_CURATED_EQUALS_CANONICAL='+String(curatedCount===canonicalCount).toUpperCase());
          console.log('STAGE416_PUBLIC_TRACK_R2_EQUALS_CANONICAL='+(r2Count===null?'CARD_MISSING':String(r2Count===canonicalCount).toUpperCase()));
          console.log('STAGE416_PUBLIC_TRACK_D1_ROWS_READ='+rowsRead);
          console.log('STAGE416_PUBLIC_TRACK_D1_ROWS_WRITTEN='+rowsWritten);
          // Compare materialized track_stats with the exact changed-track
          // like records, but ONLY when a track_id lookup uses an index.
          const query=async(statement)=>{
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,
              {method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
               body:JSON.stringify({sql:statement,params:[trackId]})});
            const doc=await response.json();
            const value=doc?.result?.[0];
            if(!response.ok||doc?.success!==true||value?.success!==true)
              throw Error('STAGE416_TRACK_LIKE_READONLY_QUERY_FAILED');
            if(Number(value?.meta?.rows_written||0)!==0)
              throw Error('STAGE416_TRACK_LIKE_READONLY_WRITE_DETECTED');
            return value;
          };
          const plan=await query('EXPLAIN QUERY PLAN SELECT user_uid FROM likes WHERE track_id=? LIMIT 1');
          const indexed=(plan.results||[]).some(row=>
            /SEARCH.+USING.+INDEX/i.test(String(row?.detail||'')));
          console.log('STAGE416_SINGLE_TRACK_LIKES_INDEXED='+String(indexed).toUpperCase());
          if(indexed){
            const countRow=await query('SELECT COUNT(*) AS like_rows FROM likes WHERE track_id=?');
            const likeRows=Number(countRow.results?.[0]?.like_rows);
            const readCost=Number(countRow.meta?.rows_read||0);
            if(!Number.isSafeInteger(likeRows)||likeRows<0||readCost>50)
              throw Error('STAGE416_EXACT_TRACK_LIKE_COUNT_COST_OR_VALUE_INVALID');
            console.log('STAGE416_SINGLE_TRACK_LIKES_ROW_COUNT='+likeRows);
            console.log('STAGE416_SINGLE_TRACK_LIKES_ROWS_READ='+readCost);
            console.log('STAGE416_SINGLE_TRACK_LIKE_ROWS_EQUAL_STATS='+
              String(likeRows===canonicalCount).toUpperCase());
          }else{
            console.log('STAGE416_SINGLE_TRACK_LIKES_ROW_COUNT=NOT_CHECKED_UNINDEXED');
          }
          console.log('STAGE416_SINGLE_TRACK_PUBLIC_AUDIT_READONLY=PASS');
          NODE

