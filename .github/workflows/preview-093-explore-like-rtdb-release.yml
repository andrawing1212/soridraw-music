name: SORIDRAW PREVIEW 093 Explore Like RTDB Release

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/preview-093-explore-like-rtdb-release.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-preview-093-explore-like-rtdb-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOSTING_PROJECT: soridraw
      SHARED_DATA_PROJECT: soridraw-app-866a5
      RTDB_RULES_URL: https://soridraw-app-866a5-default-rtdb.firebaseio.com/.settings/rules.json
      PREVIEW_URL: https://preview.soridraw.com/
      TEST_URL: https://test.soridraw.com/
      PRODUCTION_URL: https://soridraw.com/

    steps:
      - name: Checkout exact approved PREVIEW source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Lock source and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/preview
          git rev-parse origin/main > "$RUNNER_TEMP/main-before.sha"
          git rev-parse origin/production > "$RUNNER_TEMP/production-before.sha"
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$TEST_URL" -o "$RUNNER_TEMP/test-before.html"
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$PRODUCTION_URL" -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/test-before.html" | awk '{print $1}' > "$RUNNER_TEMP/test-before.sha"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          echo "LOCKED_PREVIEW_SHA=$GITHUB_SHA"

      - name: Verify 093 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -e "process.stdout.write(String(require('./public/app-version.json').version || ''))")" = '093'
          node scripts/verify-093-explore-like-rtdb-zero-count.mjs
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_RTDB_SIGNAL_093_20260915' src/services/exploreLikeService.ts
          grep -Fq 'userSync/${safeUid}/exploreLike' src/services/userDomainSyncService.ts
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_ZERO_COUNT_RECOVERY_093_20260915' src/services/exploreLikeDisplayStateService.ts
          echo 'PREVIEW_093_SOURCE_CONTRACT=PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile RTDB rules locally
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest emulators:exec \
            --only database \
            --project demo-soridraw-like-sync \
            "node -e \"console.log('RTDB_RULES_EMULATOR=PASS')\""

      - name: Authenticate Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Mint RTDB OAuth token locally from service-account key
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          path = os.environ.get('GOOGLE_GHA_CREDS_PATH') or os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
          if not path:
              raise SystemExit('service-account credential file missing')
          creds = service_account.Credentials.from_service_account_file(
              path,
              scopes=[
                  'https://www.googleapis.com/auth/firebase.database',
                  'https://www.googleapis.com/auth/userinfo.email',
              ],
          )
          creds.refresh(Request())
          if not creds.token:
              raise SystemExit('RTDB OAuth token unavailable')
          Path(os.environ['RUNNER_TEMP'], 'rtdb-access-token').write_text(creds.token, encoding='utf-8')
          print('RTDB_OAUTH_TOKEN_LOCAL_MINT=PASS')
          PY

      - name: Deploy shared RTDB rules through official REST endpoint
        shell: bash
        run: |
          set -euo pipefail
          RTDB_ACCESS_TOKEN="$(cat "$RUNNER_TEMP/rtdb-access-token")"
          test -n "$RTDB_ACCESS_TOKEN"
          auth_url="${RTDB_RULES_URL}?access_token=${RTDB_ACCESS_TOKEN}"

          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/rtdb-rules-before.json" -w '%{http_code}' "$auth_url")"
          if [ "$code" != '200' ]; then
            echo "RTDB_RULES_READ_HTTP=$code"
            cat "$RUNNER_TEMP/rtdb-rules-before.json" || true
            exit 1
          fi
          python3 -m json.tool "$RUNNER_TEMP/rtdb-rules-before.json" >/dev/null

          code="$(curl -sS --max-time 30 -X PUT \
            -H 'Content-Type: application/json' \
            --data-binary @database.rules.json \
            -o "$RUNNER_TEMP/rtdb-rules-put.json" -w '%{http_code}' "$auth_url")"
          if [ "$code" != '200' ]; then
            echo "RTDB_RULES_PUT_HTTP=$code"
            cat "$RUNNER_TEMP/rtdb-rules-put.json" || true
            exit 1
          fi
          python3 -m json.tool "$RUNNER_TEMP/rtdb-rules-put.json" >/dev/null

          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/rtdb-rules-after.json" -w '%{http_code}' "$auth_url")"
          test "$code" = '200'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          local = json.loads(Path('database.rules.json').read_text(encoding='utf-8'))
          remote = json.loads(Path(os.environ['RUNNER_TEMP'] + '/rtdb-rules-after.json').read_text(encoding='utf-8'))
          if remote != local:
              raise SystemExit('RTDB deployed rules do not match approved source')
          print('SHARED_RTDB_RULES_EXACT_MATCH=PASS')
          PY
          rm -f "$RUNNER_TEMP/rtdb-access-token"
          echo 'SHARED_RTDB_RULES_093_DEPLOY=PASS'
          echo 'NO_FIRESTORE_RULE_DEPLOY=true'
          echo 'NO_FUNCTIONS_DEPLOY=true'
          echo 'NO_USER_DATA_MIGRATION=true'

      - name: Deploy PREVIEW Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$HOSTING_PROJECT" \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo 'FIREBASE_PREVIEW_093_DEPLOY=PASS'

      - name: Verify PREVIEW exact build and version
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          ok=''
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$PREVIEW_URL" -o "$RUNNER_TEMP/preview.html"; then
              remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
              if [ "$remote_sha" = "$local_sha" ]; then
                ok=yes
                break
              fi
            fi
            sleep 2
          done
          test "$ok" = yes
          remote_version="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${PREVIEW_URL}app-version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).version||'')))")"
          test "$remote_version" = '093'
          echo "PREVIEW_APP_VERSION=$remote_version"
          echo 'PREVIEW_EXACT_BUILD=PASS'

      - name: Verify TEST and PRODUCTION code unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$TEST_URL" -o "$RUNNER_TEMP/test-after.html"
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$PRODUCTION_URL" -o "$RUNNER_TEMP/prod-after.html"
          test "$(sha256sum "$RUNNER_TEMP/test-after.html" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/test-before.sha")"
          test "$(sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/prod-before.sha")"
          echo 'TEST_PRODUCTION_CODE_HOSTING_UNCHANGED=PASS'
          echo 'NOTE_SHARED_RTDB_RULES_ARE_INTENTIONALLY_COMMON=true'

      - name: Release summary
        shell: bash
        run: |
          echo "PREVIEW_093_RELEASE_SHA=$GITHUB_SHA"
          echo 'TYPECHECK_BUILD_RULES_HOSTING=PASS'
          echo 'NO_WORKER_DEPLOY=true'
          echo 'NO_FUNCTIONS_DEPLOY=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_USER_DATA_CHANGE=true'
