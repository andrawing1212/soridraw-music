name: TEMP 218 Unified Explore Avatar Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-218-unified-explore-avatar-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      API_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 40
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unified Explore avatar verifier
        run: node scripts/verify-215-explore-profile-owner-card-sync.mjs
      - name: Global avatar verifier
        run: node scripts/verify-216-global-profile-avatar-authority.mjs
      - name: Frozen like regressions
        run: |
          node scripts/verify-190-like-card-authority.mjs
          node scripts/verify-192-cross-account-public-like-live.mjs
          node scripts/verify-197-new-public-track-like.mjs
      - name: Live Feed and public-profile avatar parity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const clean=v=>String(v||'').trim();
          const api=process.env.API_BASE;
          const readJson=async url=>{
            const r=await fetch(url,{headers:{Accept:'application/json'}});
            if(!r.ok) throw new Error(url+' HTTP '+r.status);
            return r.json();
          };
          let mismatch=0;
          for(const sort of ['latest','popular']){
            const feed=await readJson(api+'/v1/feed?sort='+sort+'&limit=40');
            const items=feed?.data?.items||[];
            const owners=new Map();
            for(const item of items){
              const uid=clean(item.ownerUid||item.owner_uid);
              if(!uid || owners.has(uid)) continue;
              owners.set(uid,{uid,avatar:clean(item.ownerAvatarUrl||item.avatarUrl||item.owner_avatar_url)});
            }
            for(const owner of owners.values()){
              const profile=await readJson(api+'/v1/profiles/'+encodeURIComponent(owner.uid)+'/first-view?limit=1');
              const avatar=clean(profile?.data?.profile?.avatarUrl||profile?.data?.profile?.avatar_url);
              if(owner.avatar!==avatar) mismatch++;
            }
          }
          console.log('LIVE_FEED_PROFILE_AVATAR_MISMATCH='+mismatch);
          if(mismatch) throw new Error('Live Feed/public-profile avatar mismatch: '+mismatch);
          NODE
      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -e "process.stdout.write(String(require('./public/app-version.json').version || ''))")" = "196"
          git diff --exit-code c6fdb77a3b9a739ccd08297b65b5a2f60f40976a HEAD -- cloudflare/explore-worker functions firestore.rules database.rules.json
          echo 'BACKEND_CODE_CHANGED=false'
          echo 'SERVER_IO_ADDED=0'
          echo 'USER_DATA_CHANGED=false'
          echo 'AUDIT_218=PASS'
