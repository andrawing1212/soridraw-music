name: SORIDRAW Audit Publication Index 024 PREVIEW

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PREVIEW_DB_NAME: soridraw-explore-preview-db
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2: soridraw-profile-media-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Wrangler
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Temporarily expose token-guarded read-only schema probe, inspect, restore
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit024 && mkdir .audit024
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x;}
          async function active(name){const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${name}`;const ds=await get(base+'/deployments');const d=(ds.deployments||ds||[])[0];const a=[...(d?.versions||[])].sort((x,y)=>Number(y?.percentage||0)-Number(x?.percentage||0))[0];if(!a?.version_id||Number(a?.percentage||0)<99.99)throw new Error('single active version missing');return {base,version:a.version_id};}
          (async()=>{const p=await active(N);fs.writeFileSync('.audit024/before.txt',p.version);const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${p.version}?include=modules`);const mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];if(!m?.content_base64)throw new Error('main module missing');const original=Buffer.from(m.content_base64,'base64').toString('utf8');const token=crypto.randomBytes(24).toString('hex');const route='/__soridraw_readonly_schema_024_'+crypto.randomBytes(8).toString('hex');const re=/async\s+fetch\(([^)]*)\)\s*\{/;const match=original.match(re);if(!match)throw new Error('fetch handler anchor missing');const params=match[1].split(',').map(s=>s.trim());if(params.length<2)throw new Error('fetch params unexpected');const requestName=params[0],envName=params[1];const probe=`\n      if (new URL(${requestName}.url).pathname === ${JSON.stringify(route)}) {\n        if (${requestName}.headers.get('x-soridraw-audit') !== ${JSON.stringify(token)}) return new Response('Not Found', { status: 404 });\n        const [indexes,triggers,profilePlan,ownerPlan] = await Promise.all([\n          ${envName}.DB.prepare(\"SELECT name, sql FROM sqlite_master WHERE type='index' AND tbl_name='tracks' ORDER BY name\").all(),\n          ${envName}.DB.prepare(\"SELECT name, sql FROM sqlite_master WHERE type='trigger' AND tbl_name='tracks' ORDER BY name\").all(),\n          ${envName}.DB.prepare(\"EXPLAIN QUERY PLAN SELECT id FROM tracks WHERE owner_uid=? AND is_public=1 ORDER BY profile_pinned DESC, published_at DESC, id DESC LIMIT 24\").bind('__audit__').all(),\n          ${envName}.DB.prepare(\"EXPLAIN QUERY PLAN SELECT id FROM tracks WHERE owner_uid=? AND is_public=1 ORDER BY published_at DESC, id DESC LIMIT 50\").bind('__audit__').all()\n        ]);\n        return new Response(JSON.stringify({indexes:indexes.results||[],triggers:triggers.results||[],profilePlan:profilePlan.results||[],ownerPlan:ownerPlan.results||[]},null,2), { status: 200, headers: { 'content-type':'application/json', 'cache-control':'no-store' } });\n      }\n`;
          const patched=original.replace(match[0],match[0]+probe);fs.writeFileSync('.audit024/original.js',original);fs.writeFileSync('.audit024/worker.js',patched);fs.writeFileSync('.audit024/token.txt',token);fs.writeFileSync('.audit024/route.txt',route);const settings=await get(`${p.base}/settings`);const config={name:N,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-09-04').slice(0,10),workers_dev:true,keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.PREVIEW_DB_NAME,database_id:process.env.PREVIEW_DB_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PREVIEW_R2}],observability:settings.observability&&typeof settings.observability==='object'?{enabled:settings.observability.enabled!==false}:{enabled:true}};if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)config.compatibility_flags=settings.compatibility_flags;fs.writeFileSync('.audit024/wrangler.jsonc',JSON.stringify(config,null,2));console.log('[audit024] prepared token-guarded read-only probe');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          deployed=0
          restore(){ status=$?; if [ "$deployed" = 1 ]; then echo '[audit024] restoring original PREVIEW Worker'; cp .audit024/original.js .audit024/worker.js; npx wrangler deploy --strict --config .audit024/wrangler.jsonc >/tmp/audit024_restore.log 2>&1 || { cat /tmp/audit024_restore.log; exit 1; }; fi; exit "$status"; }
          trap restore EXIT
          npx wrangler deploy --strict --config .audit024/wrangler.jsonc >/tmp/audit024_probe_deploy.log 2>&1
          deployed=1
          token="$(cat .audit024/token.txt)"
          route="$(cat .audit024/route.txt)"
          for attempt in $(seq 1 10); do
            code="$(curl -sS -o .audit024/result.json -w '%{http_code}' -H "x-soridraw-audit: $token" "$PREVIEW_BASE$route" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "${code:-}" = 200
          echo '=== READ-ONLY LIVE D1 SCHEMA AUDIT ==='
          cat .audit024/result.json
          cp .audit024/original.js .audit024/worker.js
          npx wrangler deploy --strict --config .audit024/wrangler.jsonc >/tmp/audit024_restore.log 2>&1
          deployed=0
          trap - EXIT
          node <<'NODE'
          const fs=require('fs');const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER,before=fs.readFileSync('.audit024/before.txt','utf8').trim();async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}`);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];if(!a?.version_id||a.version_id===before)throw new Error('restore did not create a new restored version');const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${a.version_id}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0],src=Buffer.from(m.content_base64,'base64').toString('utf8'),original=fs.readFileSync('.audit024/original.js','utf8');if(src!==original)throw new Error('restored runtime differs from original');console.log('READ_ONLY_D1_AUDIT_024=PASS');console.log('PREVIEW_WORKER_RESTORED=PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
