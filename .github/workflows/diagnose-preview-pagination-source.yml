name: Diagnose Preview Pagination Source

on:
  push:
    branches:
      - preview
    paths:
      - '.github/workflows/diagnose-preview-pagination-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Print exact line anchors only
        shell: bash
        run: |
          set -euo pipefail
          echo 'APP_ANCHORS'
          grep -n -E "mergeFavoriteFirstPageWithCache|subscribeListBundle\('musicNote'|firstPageFavs|favoritePaginationExhaustedRef|setHasMoreFavorites" src/App.tsx | head -80
          echo 'FAVORITES_ANCHORS'
          grep -n -E "MUSIC_NOTE_VISIBLE_BATCH_SIZE|남음|canShowCachedMusicNoteMore|visibleCount|hasMoreFavorites" src/pages/FavoritesPage.tsx | head -120
