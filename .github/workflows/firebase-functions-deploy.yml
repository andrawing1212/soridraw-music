name: Firebase Functions Deploy

on:
  workflow_dispatch:
  issues:
    types:
      - opened

concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  deploy-functions:
    if: github.event_name != 'issues' || github.event.issue.title == 'DEPLOY FIREBASE FUNCTIONS'
    name: Build and deploy Firebase Functions only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build secured Functions entrypoint
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.34.0

      - name: Deploy Music API Functions only
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          firebase deploy \
            --only functions:saveSunoApiKey,functions:deleteSunoApiKey,functions:getSunoApiKeyStatus,functions:fetchSunoShareMetadata,functions:getSunoRemainingCredits,functions:getSunoRemainingCreditsAfterComplete,functions:createSunoTrack,functions:getSunoTrackStatus \
            --project soridraw-app-866a5 \
            --non-interactive 2>&1 | tee firebase-functions-deploy.log

      - name: Report result to trigger issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const fs = require('fs');
            const outcome = process.env.DEPLOY_OUTCOME || 'unknown';
            let log = '';
            try {
              log = fs.readFileSync('firebase-functions-deploy.log', 'utf8');
            } catch {}
            const lines = log.split('\n').slice(-120).join('\n').slice(-9000);
            const body = outcome === 'success'
              ? `✅ Music API Firebase Functions deployment succeeded.\n\nProject: \`soridraw-app-866a5\`\nHosting was not deployed.\nThe unrelated legacy \`syncAuthUserToFirestore(us-east1)\` function was not modified.\n\n<details><summary>Deployment log tail</summary>\n\n\`\`\`text\n${lines}\n\`\`\`\n</details>`
              : `❌ Music API Firebase Functions deployment failed.\n\nProject: \`soridraw-app-866a5\`\nHosting was not deployed.\nThe unrelated legacy \`syncAuthUserToFirestore(us-east1)\` function was not modified.\n\n<details><summary>Error log tail</summary>\n\n\`\`\`text\n${lines}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail when deployment failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
