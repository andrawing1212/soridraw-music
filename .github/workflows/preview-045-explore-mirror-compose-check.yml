name: SORIDRAW 045 Explore Mirror Compose Check

on:
  push:
    branches: [preview-045-explore-sync-recovery]
    paths: ['.github/workflows/preview-045-explore-mirror-compose-check.yml']

permissions:
  contents: read

jobs:
  compose-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Compose proven 034 mirror onto current 044 runtime without deploying
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main preview-034-explore-public-feed-mirror --quiet
          test "$(git rev-parse origin/main)" = '2fadb2dc666fadecbbbd93e92cfb104ed567f233'
          TMP="$RUNNER_TEMP/mirror-045"
          mkdir -p "$TMP"
          git show fcfe6a931bd7fc7e2d05bc4c10c96fb7acf9a48d:cloudflare/explore-worker/patches/020-explore-production-feed-mirror.mjs > "$TMP/020.mjs"
          git show fcfe6a931bd7fc7e2d05bc4c10c96fb7acf9a48d:cloudflare/explore-worker/patches/022-explore-mirror-strict-sync.mjs > "$TMP/022.mjs"
          git show fcfe6a931bd7fc7e2d05bc4c10c96fb7acf9a48d:cloudflare/explore-worker/patches/023-explore-mirror-service-bindings.mjs > "$TMP/023.mjs"
          node <<'NODE'
          const fs=require('fs'); const crypto=require('crypto');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN;
          const names=['soridraw-explore-preview','soridraw-explore-test','soridraw-explore-api'];
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,500));return x.result||x}
          async function active(worker){const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${worker}`;const ds=await get(`${base}/deployments`);const d=[...(ds.deployments||ds||[])].sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0))[0];const a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${worker}/versions/${a.version_id}?include=modules`);const mods=v.modules||[];const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];return Buffer.from(m.content_base64,'base64').toString('utf8')}
          (async()=>{let common='';let canonical='';for(const n of names){const s=await active(n);const h=sha(s);if(!common)common=h;else if(h!==common)throw new Error('live Worker source mismatch');if(!s.includes('RETURNING count')||!s.includes('RETURNING like_count'))throw new Error('044 like optimization missing');if(s.includes('SORIDRAW_EXPLORE_PRODUCTION_FEED_MIRROR_020_20260908'))throw new Error('mirror unexpectedly already present');canonical=s}fs.writeFileSync(process.env.RUNNER_TEMP+'/mirror-045/worker.js',canonical);console.log('LIVE_044_COMMON_SHA='+common)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          SORIDRAW_REMOTE_WORKER_DIR="$TMP" node "$TMP/020.mjs"
          SORIDRAW_REMOTE_WORKER_DIR="$TMP" node "$TMP/022.mjs"
          SORIDRAW_REMOTE_WORKER_DIR="$TMP" node "$TMP/023.mjs"
          node --check "$TMP/worker.js"
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync(process.env.RUNNER_TEMP+'/mirror-045/worker.js','utf8');
          for(const token of [
            'RETURNING count','RETURNING like_count','patchExploreProfileR2Like020','syncExploreLikeR2AfterMutation','patchExploreFeedR2LikeCount',
            'SORIDRAW_EXPLORE_PRODUCTION_FEED_MIRROR_020_20260908','SORIDRAW_EXPLORE_MIRROR_STRICT_SYNC_022_20260908','SORIDRAW_EXPLORE_MIRROR_SERVICE_BINDINGS_023_20260908',
            'EXPLORE_MIRROR_PREVIEW','EXPLORE_MIRROR_TEST','service.fetch(request)'
          ]) if(!s.includes(token)) throw new Error('composed runtime missing '+token);
          if(/SELECT\s+count\s+FROM\s+api_rate_limits/i.test(s)) throw new Error('044 rate-limit read regression');
          console.log('MIRROR_034_ON_044_COMPOSE=PASS');
          console.log('LIKE_COST_044_PRESERVED=PASS');
          console.log('NO_DEPLOY_PERFORMED=PASS');
          NODE
