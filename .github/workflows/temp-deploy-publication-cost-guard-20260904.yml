name: SORIDRAW Deploy Publication Cost Guard PREVIEW 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-deploy-publication-cost-guard-20260904.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
      EXPECTED_ACTIVE: 8fb000d8-2685-4aa6-a410-e29b93684dcc
      BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch active PREVIEW Worker and preserve bindings
        run: |
          set -euo pipefail
          rm -rf .remote-worker-013 && mkdir -p .remote-worker-013
          node <<'NODE'
          const fs=require('fs');
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,'Content-Type':'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;
            const ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!v?.version_id||Number(v.percentage||0)<99.99)throw new Error('active PREVIEW Worker is not 100%');
            if(v.version_id!==process.env.EXPECTED_ACTIVE)throw new Error(`unexpected active version ${v.version_id}`);
            const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`);
            const mod=(ver.modules||[]).find(m=>(m.name||'')==='worker.js')||(ver.modules||[])[0]; if(!mod)throw new Error('worker.js missing');
            fs.writeFileSync('.remote-worker-013/worker.js',Buffer.from(mod.content_base64,'base64'));
            const settings=await g(`${base}/settings`),bindings=settings.bindings||[];
            const d1=bindings.find(b=>b.type==='d1'&&b.name==='DB');
            const r2=bindings.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA');
            if(!d1||!r2)throw new Error('required PREVIEW bindings missing');
            const cfg={name:W,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-08-28').slice(0,10),keep_vars:true,d1_databases:[{binding:'DB',database_name:d1.database_name||'soridraw-explore-preview',database_id:d1.id||d1.database_id}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:r2.bucket_name}]};
            if(settings.compatibility_flags?.length)cfg.compatibility_flags=settings.compatibility_flags;
            fs.writeFileSync('.remote-worker-013/wrangler.jsonc',JSON.stringify(cfg,null,2)+'\n');
            console.log('BASELINE_VERSION='+v.version_id);
            console.log('BINDINGS_PRESERVED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Apply 013 and validate source
        run: |
          set -euo pipefail
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker-013" node cloudflare/explore-worker/patches/013-explore-publication-idempotent-cost-guard.mjs
          node --check .remote-worker-013/worker.js
          grep -Fq 'SORIDRAW_EXPLORE_PUBLICATION_COST_GUARD_013_20260904' .remote-worker-013/worker.js
          grep -Fq 'await getOrEnsurePublicationOwnerProfile013(env, authContext, now);' .remote-worker-013/worker.js
          grep -Fq 'FTS refresh skipped after successful publication' .remote-worker-013/worker.js
          if grep -Fq 'await refreshTrackSearchIndex(env, source.id);' .remote-worker-013/worker.js; then echo 'blocking legacy FTS path remains'; exit 1; fi
          echo 'SOURCE_VALIDATION=PASS'
      - name: Deploy Cloudflare PREVIEW Worker only
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 deploy --cwd .remote-worker-013 --keep-vars
          echo 'CLOUDFLARE_PREVIEW_DEPLOY=PASS'
      - name: Verify deployed Worker and smoke
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,'Content-Type':'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x}
          (async()=>{for(let attempt=1;attempt<=12;attempt++){
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;
            const ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(v?.version_id&&v.version_id!==process.env.EXPECTED_ACTIVE&&Number(v.percentage||0)>=99.99){
              const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`);
              const mod=(ver.modules||[]).find(m=>(m.name||'')==='worker.js')||(ver.modules||[])[0];const src=Buffer.from(mod.content_base64,'base64').toString('utf8');
              if(!src.includes('SORIDRAW_EXPLORE_PUBLICATION_COST_GUARD_013_20260904'))throw new Error('013 marker missing in active Worker');
              if(src.includes('await refreshTrackSearchIndex(env, source.id);'))throw new Error('legacy blocking FTS remains in active Worker');
              console.log('ACTIVE_VERSION='+v.version_id); return;
            }
            await new Promise(r=>setTimeout(r,4000));
          }throw new Error('new Worker version did not become active');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          feed_code="$(curl -sS --max-time 30 -D "$RUNNER_TEMP/feed-h" -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$BASE/v1/feed?sort=latest&limit=40&probe=publication013')"
          test "$feed_code" = '200'
          tr -d '\r' < "$RUNNER_TEMP/feed-h" > "$RUNNER_TEMP/feed-h.clean"
          d1="$(awk -F': ' 'tolower($1)=="x-soridraw-d1-read"{print $2}' "$RUNNER_TEMP/feed-h.clean" | tail -1)"
          test "${d1:-0}" = '0'
          pub_code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://preview.soridraw.com' -H 'Content-Type: application/json' --data '{}' "$BASE/v1/publications")"
          test "$pub_code" = '401'
          prod_code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H 'Origin: https://soridraw.com' 'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1')"
          test "$prod_code" = '200'
          echo 'PREVIEW_FEED_D1_ZERO=PASS'
          echo 'PUBLICATION_AUTH_GATE=PASS'
          echo 'PRODUCTION_EXPLORE_UNTOUCHED=PASS'
