name: SORIDRAW Release Current Preview 027 TEST PRODUCTION

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-release-current-preview-027-test-production.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-release-current-preview-027
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PREVIEW_BASELINE_SHA: 8c2410578617ab103628dadee401e40135c07e7a
      EXPECTED_MAIN_SHA: 49c799cbb46d137539f74a48c261f7256762336f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIREBASE_PROJECT: soridraw
      TEST_ORIGIN: https://test.soridraw.com
      PROD_ORIGIN: https://soridraw.com
      PROD_WEB: https://soridraw.web.app

    steps:
      - name: Checkout release control commit
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Guard exact validated PREVIEW baseline
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PREVIEW_BASELINE_SHA^{commit}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          changed="$(git diff --name-only "$PREVIEW_BASELINE_SHA" HEAD | sort)"
          expected=$'.deploy/temp-release-027-cloudflare.mjs\n.github/workflows/temp-release-current-preview-027-test-production.yml'
          test "$changed" = "$expected"
          echo 'PREVIEW_RELEASE_GUARD=PASS'

      - name: Promote exact validated PREVIEW tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git fetch origin main preview
          rm -rf "$RUNNER_TEMP/soridraw-main-release"
          git worktree add -b release-current-preview-027 "$RUNNER_TEMP/soridraw-main-release" origin/main
          cd "$RUNNER_TEMP/soridraw-main-release"
          git read-tree --reset -u "$PREVIEW_BASELINE_SHA"
          git add -A
          git commit -m 'release: promote validated PREVIEW 027 snapshot'
          release_sha="$(git rev-parse HEAD)"
          preview_tree="$(git rev-parse "$PREVIEW_BASELINE_SHA^{tree}")"
          release_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$release_tree" = "$preview_tree"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$release_sha"
          echo "MAIN_RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "RELEASE_ROOT=$RUNNER_TEMP/soridraw-main-release" >> "$GITHUB_ENV"
          echo "MAIN_RELEASE_SHORT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_RELEASE_SHA=$release_sha"
          echo 'MAIN_TREE_EQUALS_VALIDATED_PREVIEW=PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: TypeScript and production build from exact main release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT"
          npm ci
          npx tsc --noEmit
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/release-index.sha"
          echo 'MAIN_RELEASE_BUILD=PASS'

      - name: Set up Node.js 22 for Cloudflare
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT/cloudflare/explore-worker"
          npm install --no-audit --no-fund --package-lock=false

      - name: Snapshot production Hosting before TEST
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$PROD_WEB/" -o "$RUNNER_TEMP/prod-hosting-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-hosting-before.html"
          sha256sum "$RUNNER_TEMP/prod-hosting-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-hosting-before.sha"

      - name: Deploy Cloudflare TEST from validated PREVIEW logic
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_RELEASE_ROOT="$RELEASE_ROOT" node "$GITHUB_WORKSPACE/.deploy/temp-release-027-cloudflare.mjs" test

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy exact main build to Firebase TEST
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT"
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT" \
            --config firebase.hosting-test.json \
            --non-interactive
          echo 'FIREBASE_TEST_DEPLOY=PASS'

      - name: Verify TEST app and TEST Explore
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          ok=''
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$TEST_ORIGIN/" -o "$RUNNER_TEMP/test-index.html"; then
              actual="$(sha256sum "$RUNNER_TEMP/test-index.html" | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then ok=yes; break; fi
            fi
            sleep 6
          done
          test "$ok" = yes
          code="$(curl -sS -o "$RUNNER_TEMP/test-feed.json" -D "$RUNNER_TEMP/test-feed.headers" -w '%{http_code}' -H "Origin: $TEST_ORIGIN" 'https://soridraw-explore-test.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1')"
          test "$code" = 200
          grep -qi "access-control-allow-origin: $TEST_ORIGIN" "$RUNNER_TEMP/test-feed.headers"
          echo 'TEST_FULL_STACK_VERIFY=PASS'

      - name: Verify PRODUCTION still unchanged before production release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$PROD_WEB/" -o "$RUNNER_TEMP/prod-hosting-mid.html"
          sha256sum "$RUNNER_TEMP/prod-hosting-mid.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-hosting-mid.sha"
          diff -u "$RUNNER_TEMP/prod-hosting-before.sha" "$RUNNER_TEMP/prod-hosting-mid.sha"
          echo 'PRODUCTION_UNCHANGED_BEFORE_APPROVED_RELEASE=PASS'

      - name: Deploy Cloudflare PRODUCTION from validated PREVIEW logic
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_RELEASE_ROOT="$RELEASE_ROOT" node "$GITHUB_WORKSPACE/.deploy/temp-release-027-cloudflare.mjs" production

      - name: Deploy exact main build to Firebase PRODUCTION
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT"
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT" \
            --config firebase.json \
            --non-interactive
          echo 'FIREBASE_PRODUCTION_DEPLOY=PASS'

      - name: Verify PRODUCTION app and Explore
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for origin in 'https://soridraw.web.app' 'https://soridraw.com'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/" -o "$RUNNER_TEMP/prod-index.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/prod-index.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 6
            done
            test "$ok" = yes
            echo "PRODUCTION_HOST_PASS=$origin"
          done
          code="$(curl -sS -o "$RUNNER_TEMP/prod-feed.json" -D "$RUNNER_TEMP/prod-feed.headers" -w '%{http_code}' -H "Origin: $PROD_ORIGIN" 'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1')"
          test "$code" = 200
          grep -qi "access-control-allow-origin: $PROD_ORIGIN" "$RUNNER_TEMP/prod-feed.headers"
          echo 'PRODUCTION_FULL_STACK_VERIFY=PASS'

      - name: Verify final main still exact release snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_RELEASE_SHA"
          cd "$RELEASE_ROOT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$PREVIEW_BASELINE_SHA^{tree}")"
          echo 'FINAL_MAIN_RELEASE_TREE=PASS'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_DEPLOY_CHANGED=false'
          echo 'SHARED_FIREBASE_BACKEND_ALREADY_ACTIVE=true'

      - name: Package TEST and PRODUCTION release ZIPs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT"
          test_zip="SORIDRAW_TEST_027_${MAIN_RELEASE_SHORT}.zip"
          prod_zip="SORIDRAW_PRODUCTION_027_${MAIN_RELEASE_SHORT}.zip"
          git archive --format=zip --output="$test_zip" HEAD
          cp "$test_zip" "$prod_zip"
          unzip -t "$test_zip" >/dev/null
          unzip -t "$prod_zip" >/dev/null
          sha256sum "$test_zip" "$prod_zip"
          echo "TEST_ZIP=$RELEASE_ROOT/$test_zip" >> "$GITHUB_ENV"
          echo "PROD_ZIP=$RELEASE_ROOT/$prod_zip" >> "$GITHUB_ENV"

      - name: Upload release ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_027_TEST_PRODUCTION_RELEASE
          path: |
            ${{ env.TEST_ZIP }}
            ${{ env.PROD_ZIP }}
          retention-days: 30
