name: Temp Verify Preview Stale Fix 20260901

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-verify-preview-stale-fix-20260901.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify actual preview response and deployed assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --max-time 30 'https://preview.soridraw.com/' -o "$RUNNER_TEMP/live.headers"
          CACHE_CONTROL="$(tr -d '\r' < "$RUNNER_TEMP/live.headers" | awk -F': ' 'tolower($1)=="cache-control" {print tolower($2); exit}')"
          echo "LIVE_CACHE_CONTROL=$CACHE_CONTROL"
          echo "$CACHE_CONTROL" | grep -q 'no-cache'
          echo "$CACHE_CONTROL" | grep -q 'no-store'
          echo "$CACHE_CONTROL" | grep -q 'must-revalidate'
          echo 'LIVE_NO_STALE_CACHE=PASS'

          curl -fsS --max-time 30 'https://preview.soridraw.com/' -o "$RUNNER_TEMP/live.html"
          LOCAL_INDEX="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"
          LIVE_INDEX="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' "$RUNNER_TEMP/live.html" | head -1)"
          echo "LOCAL_INDEX=$LOCAL_INDEX"
          echo "LIVE_INDEX=$LIVE_INDEX"
          test "$LOCAL_INDEX" = "$LIVE_INDEX"
          echo 'LIVE_INDEX_CURRENT=PASS'

          MASTER_ASSET="$(basename "$(ls dist/assets/MasterPermissionsPage-*.js | head -1)")"
          LAYOUT_ASSET="$(basename "$(ls dist/assets/AdminPageLayout-*.js | head -1)")"
          USER_ASSET="$(basename "$(ls dist/assets/AdminUserManagementPage-*.js | head -1)")"
          curl -fsS --max-time 30 "https://preview.soridraw.com/assets/$MASTER_ASSET" -o "$RUNNER_TEMP/master.js"
          curl -fsS --max-time 30 "https://preview.soridraw.com/assets/$LAYOUT_ASSET" -o "$RUNNER_TEMP/layout.js"
          curl -fsS --max-time 30 "https://preview.soridraw.com/assets/$USER_ASSET" -o "$RUNNER_TEMP/users.js"
          grep -q 'admin-permissions' "$RUNNER_TEMP/master.js"
          ! grep -q '보컬 관리' "$RUNNER_TEMP/layout.js"
          ! grep -q '섹션 태그' "$RUNNER_TEMP/layout.js"
          grep -q 'admin-user-list' "$RUNNER_TEMP/users.js"
          echo "LIVE_MASTER_ASSET=$MASTER_ASSET"
          echo "LIVE_LAYOUT_ASSET=$LAYOUT_ASSET"
          echo "LIVE_USER_ASSET=$USER_ASSET"
          echo 'LIVE_ADMIN_ASSETS_CURRENT=PASS'
