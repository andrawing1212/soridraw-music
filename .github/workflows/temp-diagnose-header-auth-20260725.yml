name: Diagnose header auth rendering 20260725

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'DIAGNOSE HEADER AUTH 20260725 0641D'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect auth state range
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('src/App.tsx').read_text(encoding='utf-8').splitlines()
          start,end=5250,5630
          out=[f'=== lines {start}-{end} ===']
          for n in range(start,min(end,len(lines))+1):
              out.append(f'{n}: {lines[n-1]}')
          Path('auth-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Report auth range
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          {
            echo '```text'
            cat auth-diagnostic.txt
            echo
            echo '```'
          } > body.md
          gh issue comment "$ISSUE_URL" --body-file body.md
