name: SORIDRAW 045 Main Parity Candidate Validation

on:
  push:
    branches: [release-045-preview-main-parity]
    paths: ['.github/workflows/release-045-preview-main-parity.yml']

permissions:
  contents: read

concurrency:
  group: soridraw-045-main-parity-candidate
  cancel-in-progress: false

jobs:
  validate_candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PREVIEW_BASE: 5008e9ba81fe3b1469e31dae15ee7384c6ecdcbc
      MAIN_BASE: 2fadb2dc666fadecbbbd93e92cfb104ed567f233
    steps:
      - name: Checkout validation controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Guard exact baselines
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main --quiet
          test "$(git rev-parse origin/preview)" = "$PREVIEW_BASE"
          test "$(git rev-parse origin/main)" = "$MAIN_BASE"
          test "$(curl -fsS -H 'Cache-Control: no-cache' 'https://preview.soridraw.com/app-version.json?t=045-candidate-guard' | tr -d '\r\n ')" = '{"version":"045"}'
          test "$(curl -fsS -H 'Cache-Control: no-cache' 'https://test.soridraw.com/app-version.json?t=045-candidate-guard' | tr -d '\r\n ')" = '{"version":"042"}'
          test "$(curl -fsS -H 'Cache-Control: no-cache' 'https://soridraw.com/app-version.json?t=045-candidate-guard' | tr -d '\r\n ')" = '{"version":"043"}'
          echo 'CANDIDATE_BASELINE_GUARD=PASS'

      - name: Build exact main candidate from PREVIEW functional deltas
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B release-045-main-candidate origin/main
          for f in \
            src/App.tsx \
            src/pages/ExplorePage.tsx \
            src/services/appUpdateNotice.ts \
            public/app-version.json \
            scripts/verify-035-auth-nav-readiness.mjs \
            scripts/verify-045-explore-active-revalidation.mjs \
            cloudflare/explore-worker/patches/028-explore-like-o1.mjs; do
            mkdir -p "$(dirname "$f")"
            git show "origin/preview:$f" > "$f"
          done

          git add -N cloudflare/explore-worker/patches/028-explore-like-o1.mjs \
            scripts/verify-035-auth-nav-readiness.mjs \
            scripts/verify-045-explore-active-revalidation.mjs 2>/dev/null || true

          git diff --quiet origin/preview -- src functions cloudflare firestore.rules database.rules.json

          git diff --name-only origin/main -- > "$RUNNER_TEMP/candidate-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          cloudflare/explore-worker/patches/028-explore-like-o1.mjs
          public/app-version.json
          scripts/verify-035-auth-nav-readiness.mjs
          scripts/verify-045-explore-active-revalidation.mjs
          src/App.tsx
          src/pages/ExplorePage.tsx
          src/services/appUpdateNotice.ts
          EOF
          sort -o "$RUNNER_TEMP/candidate-files.txt" "$RUNNER_TEMP/candidate-files.txt"
          sort -o "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/candidate-files.txt"

          grep -F "CURRENT_APP_VERSION = '045'" src/services/appUpdateNotice.ts
          grep -F '"version": "045"' public/app-version.json
          echo 'FUNCTIONAL_TREE_PARITY=PASS'
          echo 'CANDIDATE_FILE_SCOPE=PASS'

      - name: Validate TypeScript build and regression guards
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-033-explore-feed-revision.mjs
          node scripts/verify-035-auth-nav-readiness.mjs
          node scripts/verify-045-explore-active-revalidation.mjs
          node scripts/verify-runtime-environment-parity-028.mjs
          node --test test/catalogWarmCachePolicy.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const listBundle = fs.readFileSync('src/lib/listBundleCache.ts', 'utf8');
          const engine = fs.readFileSync('src/lib/userDataEngine.ts', 'utf8');
          const adaptive = fs.readFileSync('src/lib/adaptiveListIndexV2.ts', 'utf8');
          const library = fs.readFileSync('src/pages/SunoLibraryPage.tsx', 'utf8');

          // Current 1036+ architecture intentionally removed the retired Favorites full-recovery function.
          assert.equal(app.includes('const runFavoritesFullCacheRecoveryOnce = async () =>'), false);
          assert.equal(app.includes('Cacheless Music Note full bootstrap failed'), false);
          assert.ok(app.includes("subscribeListBundle('musicNote'"));
          assert.ok(app.includes('bundle.schemaVersion === 1001'));

          // Music Note bootstrap is route-gated and uses the shared private Catalog cache path.
          assert.ok(listBundle.includes('MUSIC_NOTE_BUNDLE_PAGE_ENTRY_EVENT'));
          assert.ok(listBundle.includes('readPreviewAdaptiveListIndexV2'));
          assert.ok(listBundle.includes("if (kind === 'musicNote')"));
          assert.ok(adaptive.includes('readCatalogSnapshotCacheFirst'));

          // Warm refresh may return IndexedDB directly when the already-paid profile revision proves freshness.
          assert.ok(engine.includes('canUseWarmCatalogWithoutRemote'));
          assert.ok(engine.includes("catalogLastReadSources.set(key, 'cache')"));
          assert.ok(engine.includes('const remote = await readRemoteCatalogSnapshot(kind, uid, 0, local)'));

          // Keep the separate Library cold-read invariant too.
          assert.equal(/const\s+snapshot\s*=\s*await\s+getDocs\(tracksRef\)\s*;/.test(library), false);
          console.log('CURRENT_MUSIC_NOTE_CATALOG_SAFETY=PASS');
          NODE
          grep -F 'RETURNING count' cloudflare/explore-worker/patches/028-explore-like-o1.mjs
          grep -F 'RETURNING like_count' cloudflare/explore-worker/patches/028-explore-like-o1.mjs
          git diff --check
          echo 'TYPESCRIPT_BUILD=PASS'
          echo 'MUSIC_NOTE_GUARDS=PASS'
          echo 'EXPLORE_044_045_GUARDS=PASS'
          echo 'MAIN_045_CANDIDATE_VALIDATION=PASS'

      - name: Confirm no repository branch changed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_BASE"
          echo 'NO_MAIN_OR_PREVIEW_MUTATION=PASS'
