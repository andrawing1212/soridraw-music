name: APP518 QA Signed Pin — One-shot Source Test
on:
  push:
    branches:
      - fix/app518-qa-signed-entry-pinned-jwks
    paths:
      - '.github/workflows/temp-app518-qa-signed-pin.yml'
      - 'cloudflare/media-worker/src/app518QaSignedEntry518.js'
      - 'qa/app518/live/verify-signed-worker-entry518.mjs'
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact immutable PR528 candidate and QA signed key gates
        shell: bash
        run: |
          set -euo pipefail
          PIN=864f796da24413309567198c9de502b13cdedd50
          git cat-file -e "$PIN^{commit}"
          dir="$RUNNER_TEMP/app518-pinned-candidate"
          git worktree add --detach "$dir" "$PIN"
          npm --prefix "$dir/cloudflare/media-worker" install --no-audit --no-fund --ignore-scripts --no-save
          node --check cloudflare/media-worker/src/app518QaSignedEntry518.js
          node --check qa/app518/live/verify-signed-worker-entry518.mjs
          APP518_PINNED_CANDIDATE_DIR="$dir" node qa/app518/live/verify-signed-worker-entry518.mjs
          echo 'APP518_QA_SIGNED_PIN_SOURCE=PASS'
          echo 'APP518_QA_SERVER_MUTATIONS=0; DEPLOY=0'
