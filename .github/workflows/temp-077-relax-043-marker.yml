name: TEMP 077 Relax 043 Marker Guard

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-077-relax-043-marker.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - name: Relax marker-only prerequisite and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('cloudflare/explore-worker/patches/044-local-first-cost-hotpath.mjs')
          s = p.read_text()
          needle = "  'SORIDRAW_PUBLICATION_TARGETED_R2_HOTPATH_043_20260913',\n"
          if needle not in s:
              raise SystemExit('043 marker prerequisite anchor missing')
          p.write_text(s.replace(needle, '', 1))
          PY
          rm -f .github/workflows/temp-077-relax-043-marker.yml
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release-bot@users.noreply.github.com'
          git add cloudflare/explore-worker/patches/044-local-first-cost-hotpath.mjs .github/workflows/temp-077-relax-043-marker.yml
          git diff --cached --check
          git commit -m 'fix(preview): use runtime prerequisites for Worker 044'
          git push origin HEAD:preview
