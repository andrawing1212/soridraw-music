name: SORIDRAW APP640 READONLY Live Follow Limiter Source

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/follow-640-readonly-live-limiter.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: GET-only inspect actual PREVIEW follow limiter function
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const ACCOUNT='e1a30fc9ef497fda1d34f4ab3dc1da45';
          const NAME='soridraw-explore-preview';
          // Read the currently deployed 100% active PREVIEW version, not a frozen 2026-11-15 ID.
          const token=String(process.env.CLOUDFLARE_API_TOKEN||'');
          const halt=x=>{throw Error('APP640_HOLD_'+x)};
          if(process.env.GITHUB_REF!=='refs/heads/preview'||
             process.env.CLOUDFLARE_ACCOUNT_ID!==ACCOUNT||token.length<20)halt('CONTEXT');
          async function get(p){
           const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT+'/'+p,{
            headers:{Authorization:'Bearer '+token,Accept:'application/json'},
            signal:AbortSignal.timeout(25000)});
           const j=await r.json();
           if(!r.ok||j.success!==true)halt('GET_'+r.status);
           return j.result;
          }
          const d=await get('workers/scripts/'+NAME+'/deployments?per_page=1');
          const v=d?.deployments?.[0]?.versions;
          if(v?.length!==1||!v[0]?.version_id||Number(v[0].percentage)!==100)
           halt('PREVIEW_ACTIVE_VERSION_SPLIT_OR_MISSING');
          const active=v[0].version_id;
          console.log('APP640_PREVIEW_ACTIVE_VERSION='+active);
          const w=await get('workers/workers/'+NAME+'/versions/'+active+'?include=modules');
          if(!Array.isArray(w?.modules)||w.modules.length<1)halt('MODULE_SET');
          const terms=['enforceFollowEdgeRateLimit355','consumeSocialAbuse380','socialAbuseLimited380',
           'FOLLOW_ABUSE_GUARD_380','RATE_LIMITED','FOLLOW_ORDER_REQUIRED','FOLLOW_REVISION_CONFLICT','follow:'];
          for(const m of w.modules){
           const t=Buffer.from(m.content_base64||'','base64').toString('utf8');
           const matches=terms.map(x=>[x,t.split(x).length-1]).filter(x=>x[1]>0);
           if(matches.length===0)continue;
           console.log('APP640_MODULE='+m.name+';MATCHES='+JSON.stringify(matches));
           for(const term of ['enforceFollowEdgeRateLimit355','consumeSocialAbuse380']){
            const p=t.indexOf(term);
            if(p<0)continue;
            const chunk=t.slice(Math.max(0,p-80),Math.min(t.length,p+1150))
             .replace(/[A-Za-z0-9_-]{30,}/g,'<redacted>');
            console.log('APP640_SOURCE_CONTEXT_'+term+'='+JSON.stringify(chunk));
           }
           console.log('APP640_MODULE_SHA256='+createHash('sha256').update(t).digest('hex'));
          }
          const entry=w.modules.find(m=>m.name==='preview-entry.mjs');
          if(!entry)halt('ACTIVE_ENTRY_MISSING');
          const src=Buffer.from(entry.content_base64||'','base64').toString('utf8');
          for(const name of ['handleFollowOverlay354','readFollowStateSnapshot354','readEffectiveFollowMembership348','orchestrateFollowOverlay354','handleFollowState','enforceFollowEdgeRateLimit355']){
            const re=new RegExp('(?:async\\s+)?function\\s+'+name+'\\s*\\(');
            const at=src.search(re);
            if(at<0){console.log('APP698_'+name+'_MISSING');continue;}
            const tail=src.slice(at,at+7200);
            const cut=tail.search(/\n__name\(/);
            const code=(cut>0?tail.slice(0,cut):tail).replace(/[A-Za-z0-9_-]{48,}/g,'<redacted>');
            console.log('APP698_'+name+'_SOURCE='+JSON.stringify(code).slice(0,8000));
          }
          // APP700: inspect read-only real deployed abuse policy and rate-limit
          // helpers; never log user rows, secrets or full bundled source.
          for(const name of ['socialAbusePolicy380','socialAbuseLimited380','consumeSocialAbuse380']){
            const at=src.indexOf('function '+name+'(');
            if(at<0){console.log('APP700_'+name+'_NOT_FOUND');continue;}
            const tail=src.slice(at,at+8500);
            const cut=tail.indexOf('__name('+name);
            const code=(cut>0?tail.slice(0,cut):tail)
              .replace(/[A-Za-z0-9_-]{48,}/g,'<redacted>');
            console.log('APP700_'+name+'_SOURCE='+JSON.stringify(code).slice(0,10000));
          }
          console.log('APP640_GET_ONLY_SOURCE_INSPECTION=PASS');
          console.log('APP640_NO_DATA_OR_WORKER_MUTATION=PASS');
          NODE

      - name: Read exact Andy.j to SoulForceMusic relation (SELECT only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=String(process.env.CLOUDFLARE_API_TOKEN||'');
          const account='e1a30fc9ef497fda1d34f4ab3dc1da45';
          const database='217ef5b1-5d80-4f7c-afc7-9e07eb05c06b';
          if(process.env.GITHUB_REF!=='refs/heads/preview'||token.length<20)throw Error('READONLY_CONTEXT');
          const query=async(sql,params=[])=>{
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+database+'/query',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(25000)});
            const j=await r.json();
            if(!r.ok||j.success!==true||!Array.isArray(j.result))throw Error('READONLY_D1_'+r.status);
            return j.result[0]?.results||[];
          };
          // Named public profile lookup only, never log UIDs or raw rows.
          const profiles=await query("SELECT uid,nickname,handle FROM public_profiles WHERE nickname IN ('Andy.j','Andy.J','andy.j','소울포스뮤직') OR handle IN ('andy.j','andyj','soulforcemusic','soulforcemusi') LIMIT 12");
          const actor=profiles.filter(p=>String(p.nickname||'').toLowerCase()==='andy.j'||['andy.j','andyj'].includes(String(p.handle||'').toLowerCase()));
          const target=profiles.filter(p=>p.nickname==='소울포스뮤직'||['soulforcemusic','soulforcemusi'].includes(String(p.handle||'').toLowerCase()));
          console.log('PAIR_DIAG_PUBLIC_ACTOR_MATCHES='+actor.length);
          console.log('PAIR_DIAG_PUBLIC_TARGET_MATCHES='+target.length);
          if(actor.length!==1||target.length!==1) {
            console.log('PAIR_DIAG_UNAMBIGUOUS_IDENTIFICATION=HOLD');
          } else {
            const baseline=await query('SELECT COUNT(*) AS n FROM follows WHERE follower_uid=? AND following_uid=?',[actor[0].uid,target[0].uid]);
            console.log('PAIR_DIAG_FROZEN_BASELINE_PRESENT='+(Number(baseline[0]?.n||0)>0));
            const overlay=await query('SELECT following,baseline_following FROM explore_follow_overrides_348 WHERE follower_uid=? AND following_uid=? LIMIT 1',[actor[0].uid,target[0].uid]);
            console.log('PAIR_DIAG_OVERLAY_ROWS='+overlay.length);
            console.log('PAIR_DIAG_OVERLAY_FOLLOWING='+(overlay.length===1?String(overlay[0].following):'ABSENT'));
            console.log('PAIR_DIAG_OVERLAY_BASELINE='+(overlay.length===1?String(overlay[0].baseline_following):'ABSENT'));
            const cols=await query('PRAGMA table_info(explore_follow_overrides_348)');
            console.log('PAIR_DIAG_OVERLAY_COLUMNS='+cols.map(c=>String(c.name||'')).join(','));
            const phase=await query('SELECT id,phase,schema_version,updated_at FROM explore_follow_cutover_control_348 WHERE id=1 LIMIT 1');
          console.log('APP698_CUTOVER_PHASE='+String(phase[0]?.phase||'MISSING'));
          console.log('APP698_CUTOVER_SCHEMA='+String(phase[0]?.schema_version||'MISSING'));
          console.log('APP698_CUTOVER_PRESENT='+(phase.length===1));
          const publicUrl='https://soridraw-explore-preview.andrawing1212.workers.dev/v1/profiles/'+encodeURIComponent(target[0].uid)+'/followers?limit=30';
          const res=await fetch(publicUrl,{method:'GET',headers:{Accept:'application/json'},signal:AbortSignal.timeout(25000)});
          console.log('APP698_PUBLIC_FOLLOWERS_HTTP='+res.status);
          if(res.ok){
            const payload=await res.json();
            const items=Array.isArray(payload?.data?.items)?payload.data.items:[];
            console.log('APP698_PUBLIC_FOLLOWERS_COUNT='+items.length);
            console.log('APP698_PUBLIC_FOLLOWERS_HAS_ACTOR='+items.some(row=>row.uid===actor[0].uid));
            console.log('APP698_PUBLIC_FOLLOWERS_MORE='+Boolean(payload?.data?.nextCursor));
          }
          console.log('PAIR_DIAG_ONLY_NAMED_PAIR_READ=PASS');
          }
          console.log('PAIR_DIAG_READ_ONLY_NO_USER_DATA_CHANGE=PASS');
          NODE

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read only Andy.j per-user APP380 and APP355 rate receipts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix cloudflare/explore-worker --no-audit --no-fund --package-lock=false
          node scripts/app702-read-andyj-follow-receipt.mjs
