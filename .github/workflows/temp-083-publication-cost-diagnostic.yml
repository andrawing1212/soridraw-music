name: TEMP 083 Publication Cost Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-083-publication-cost-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only live D1 publication cost diagnostic
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          echo '=== TRACK INDEXES ==='
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT name,sql FROM sqlite_schema WHERE type='index' AND tbl_name='tracks' ORDER BY name" --json
          echo '=== TRACK TRIGGERS ==='
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT name,sql FROM sqlite_schema WHERE type='trigger' AND tbl_name='tracks' ORDER BY name" --json
          echo '=== PLAN owner+id IN ==='
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN SELECT * FROM tracks WHERE owner_uid='__diag__' AND id IN ('__a__','__b__','__c__')" --json
          echo '=== PLAN id IN then owner validate ==='
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN SELECT * FROM tracks WHERE id IN ('__a__','__b__','__c__')" --json
          echo '=== TRACK UPDATE TRIGGERS COUNT ==='
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT COUNT(*) AS update_trigger_count FROM sqlite_schema WHERE type='trigger' AND tbl_name='tracks' AND upper(sql) LIKE '%AFTER UPDATE%'" --json
          echo 'READ_ONLY_DIAGNOSTIC=PASS'
