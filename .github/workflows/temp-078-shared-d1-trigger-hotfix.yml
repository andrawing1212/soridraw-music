name: TEMP 078 Shared D1 Trigger Hotfix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-078-shared-d1-trigger-hotfix.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-shared-d1-release
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      EXPECTED_MIGRATION_BLOB: 3b097279ca46d5adf30ee02f1999f0a1e0b47e06
      MAIN_SHA: 3b574c05589230f077eceff98190edd4b5195f75
      PRODUCTION_SHA: a8971fae1014ce107927fcfb5491d202d4c68fbe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact migration and branch guards
        shell: bash
        run: |
          set -euo pipefail
          file='cloudflare/explore-worker/migrations/20260913_02_publication_trigger_conflict_fix.sql'
          test "$(git hash-object "$file")" = "$EXPECTED_MIGRATION_BLOB"
          grep -q '^DROP TRIGGER IF EXISTS explore032_derived_track_update;' "$file"
          grep -q '^CREATE TRIGGER explore032_derived_track_update' "$file"
          test "$(grep -c 'NOT EXISTS' "$file")" -eq 2
          ! grep -Eq '\b(?:DELETE|ALTER TABLE|DROP TABLE|UPDATE tracks|INSERT INTO tracks)\b' "$file"
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/production)" = "$PRODUCTION_SHA"
          echo 'MIGRATION_STATIC_GUARD=PASS'
      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only preflight and capture exact old trigger
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import('./scripts/derived-deploy-preflight.mjs').then(m=>m.assertDerivedBaseD1Ready('./canonical/wrangler.preview.jsonc'))"
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT sql FROM sqlite_schema WHERE type='trigger' AND name='explore032_derived_track_update';" --json > "$RUNNER_TEMP/old-trigger.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/old-trigger.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          if(rows.length!==1) throw new Error('Expected exactly one live explore032_derived_track_update trigger');
          const sql=String(rows[0].sql||'');
          if((sql.match(/INSERT OR IGNORE INTO explore_derived_profiles\(uid\)/g)||[]).length!==2) throw new Error('Live trigger no longer matches approved broken shape');
          if(sql.includes('NOT EXISTS')) throw new Error('Live trigger already has the hotfix unexpectedly');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/rollback.sql',`DROP TRIGGER IF EXISTS explore032_derived_track_update;\n${sql};\n`);
          console.log('LIVE_BROKEN_TRIGGER_PREFLIGHT=PASS');
          NODE
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT seeded,seq FROM explore_derived_state WHERE id=1;" --json
          echo 'READ_ONLY_PREFLIGHT=PASS'
      - name: Apply exact trigger-only hotfix with rollback guard
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          MIG="$PWD/migrations/20260913_02_publication_trigger_conflict_fix.sql"
          applied=0
          rollback() {
            echo 'POST_APPLY_VERIFY_FAILED: restoring exact previous trigger definition'
            node "$WRANGLER" d1 execute DB --remote --config "$CFG" --file "$RUNNER_TEMP/rollback.sql" --yes || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ] && [ "$applied" = 1 ]; then rollback; fi; exit "$status"' EXIT
          applied=1
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --file "$MIG" --yes
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT sql FROM sqlite_schema WHERE type='trigger' AND name='explore032_derived_track_update';" --json > "$RUNNER_TEMP/new-trigger.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/new-trigger.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          if(rows.length!==1) throw new Error('Hotfix trigger missing after apply');
          const sql=String(rows[0].sql||'');
          if(sql.includes('INSERT OR IGNORE INTO explore_derived_profiles(uid)')) throw new Error('Broken nested conflict pattern remains');
          if((sql.match(/NOT EXISTS/g)||[]).length!==2) throw new Error('Expected two NOT EXISTS profile guards');
          for(const token of ["'feed'","'profile:' || NEW.owner_uid",'track_count = MAX(0, track_count + NEW.active - OLD.active)']) {
            if(!sql.includes(token)) throw new Error(`Required compatibility semantics missing: ${token}`);
          }
          console.log('POST_APPLY_TRIGGER_VERIFY=PASS');
          NODE
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT seeded,seq FROM explore_derived_state WHERE id=1;" --json
          applied=0
          trap - EXIT
          echo 'SHARED_D1_TRIGGER_HOTFIX=PASS'
      - name: Verify code branches unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/production)" = "$PRODUCTION_SHA"
          echo 'TEST_PRODUCTION_BRANCHES_UNCHANGED=PASS'
