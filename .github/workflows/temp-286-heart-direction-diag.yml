name: SORIDRAW app286 Heart Direction Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app286-heart-direction-diag.trigger'
      - '.github/workflows/temp-286-heart-direction-diag.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - working-directory: functions
        run: npm ci --no-audit --no-fund
      - name: Read current target and latest signal
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
        run: |
          node <<'NODE'
          const crypto=require('crypto'); const admin=require('firebase-admin');
          admin.initializeApp({projectId:'soridraw-app-866a5',databaseURL:'https://soridraw-app-866a5-default-rtdb.firebaseio.com'});
          const db=admin.firestore(), rtdb=admin.database(), TARGET='스쳐간 이름 뒤에';
          const h=v=>{const s=String(v||'').trim();return s?crypto.createHash('sha256').update(s).digest('hex').slice(0,12):''};
          const ms=v=>!v?0:typeof v.toMillis==='function'?v.toMillis():typeof v.seconds==='number'?v.seconds*1000:Number(v)||0;
          const state=(x,id='')=>({
            idHash:h(id||x?.id||x?.firestoreId), title:String(x?.title||x?.koreanTitle||''),
            saved:x?.saved===true, removed:x?.favoriteRemoved===true,
            removedAt:ms(x?.favoriteRemovedAt), unsavedAt:ms(x?.unsavedAt), unlikedAt:ms(x?.unlikedAt),
            generationBatchHash:h(x?.appliedKeywords?.generationBatchId), generationIndex:Number(x?.appliedKeywords?.generationIndex||0),
            soridrawSongIdHash:h(x?.soridrawSongId), recentSongSyncKeyHash:h(x?.recentSongSyncKey),
            favoriteFirestoreIdHash:h(x?.favoriteFirestoreId), musicNoteFavoriteIdHash:h(x?.musicNoteFavoriteId),
            detachedAt:ms(x?.recentFavoriteDetachedAt), explicitUnsaveAt:ms(x?.recentFavoriteExplicitlyUnsavedAt),
            healedAt:ms(x?.recentFavoriteIdentityHealedAt), updatedAtMs:Number(x?.updatedAtMs||0)||ms(x?.updatedAt)
          });
          (async()=>{
            const [a,b]=await Promise.all([
              db.collection('favorites').where('title','==',TARGET).limit(10).get(),
              db.collection('favorites').where('koreanTitle','==',TARGET).limit(10).get()
            ]);
            const m=new Map(); [...a.docs,...b.docs].forEach(d=>m.set(d.id,d));
            const docs=[...m.values()]; if(!docs.length) throw new Error('target not found');
            const uid=String(docs[0].data()?.uid||'');
            const recent=await db.collection('user_recent_songs').doc(uid).get();
            const songs=Array.isArray(recent.data()?.songs)?recent.data().songs:[];
            const tr=songs.find(s=>[s?.title,s?.koreanTitle,s?.englishTitle].some(v=>String(v||'').trim()===TARGET));
            const sig=(await rtdb.ref(`userSync/${uid}/musicNote`).get()).val()||{};
            let item=null; try{item=sig.itemJson?JSON.parse(sig.itemJson):null}catch{}
            console.log(JSON.stringify({
              safety:{firestoreWrites:0,firestoreDeletes:0,rtdbWrites:0},
              targetFavorites:docs.map(d=>state(d.data(),d.id)),
              targetRecent:tr?state(tr):null,
              signal:{
                version:Number(sig.version||0), operation:String(sig.operation||''), removed:sig.removed===true,
                originHash:h(sig.originDeviceId), documentIdHashes:Array.isArray(sig.documentIds)?sig.documentIds.map(h):[],
                itemJsonLength:String(sig.itemJson||'').length,
                item:Array.isArray(item)?item.map(x=>state(x)):item?state(item):null
              }
            },null,2));
            await admin.app().delete();
          })().catch(async e=>{console.error(e?.stack||e);try{await admin.app().delete()}catch{}process.exit(1)});
          NODE
