name: TEMP Finish Explore Like Worker Binding Restore 117

on:
  push:
    branches:
      - release/restore-like-worker-bindings-117
    paths:
      - .github/workflows/temp-restore-like-worker-bindings-117.yml

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      RELEASE_SOURCE_SHA: b9b612adbfe49a462c72c98f9efc65165d32b31c
    steps:
      - name: Checkout exact approved PREVIEW source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source and install Worker tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          node scripts/verify-release-promotion-system.mjs
          cd cloudflare/explore-worker
          npm install --no-audit --no-fund --package-lock=false
          echo RELEASE_SOURCE_STATIC=PASS

      - name: Confirm TEST migration and required bindings are live
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$api/workers/scripts/soridraw-explore-test/settings" > "$RUNNER_TEMP/test-settings.json"
          jq -e '.result.bindings[] | select(.name=="LIKE_RATE_LIMITER" and .type=="ratelimit")' "$RUNNER_TEMP/test-settings.json" >/dev/null
          jq -e '.result.bindings[] | select(.name=="EXPLORE_LIKE_BATCH_SCHEDULER" and .type=="durable_object_namespace" and .class_name=="ExploreLikeBatchScheduler103")' "$RUNNER_TEMP/test-settings.json" >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$api/workers/scripts/soridraw-explore-test/deployments"             | jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id'             | sed 's/^/TEST_ACTIVE_VERSION=/'
          echo TEST_REQUIRED_LIKE_BINDINGS_LIVE=PASS

      - name: Repair TEST derived Feed cache from shared canonical R2 only
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          for sort in latest popular; do
            file="$RUNNER_TEMP/shared-$sort.json"
            node "$WRANGLER" r2 object get "soridraw-profile-media/internal/explore/shared-feed-v112/$sort-40.json" --file "$file" --remote
            node -e "const j=require(process.argv[1]);if(!j?.payload?.data||!Array.isArray(j.payload.data.items))throw Error('invalid shared Feed snapshot')" "$file"
            node "$WRANGLER" r2 object put "soridraw-profile-media-test/internal/explore/feed-v1/$sort-40.json" --file "$file" --remote
          done
          echo TEST_DERIVED_FEED_CACHE_REPAIRED_FROM_SHARED=PASS
          echo USER_ORIGINAL_DATA_CHANGE=NONE

      - name: Wait out TEST revision edge cache then verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 70
          node .deploy/release-worker-runtime.mjs test verify
          status="$(curl -sS -o "$RUNNER_TEMP/test-like.json" -w '%{http_code}'             -X POST -H 'Origin: https://test.soridraw.com' -H 'Content-Type: application/json'             --data '{"mutations":[]}'             https://soridraw-explore-test.andrawing1212.workers.dev/v1/me/likes/batch)"
          test "$status" -ge 400
          test "$status" -lt 500
          echo "TEST_LIKE_BATCH_UNAUTH_STATUS=$status"
          echo TEST_LIKE_PATH_NO_5XX=PASS

      - name: Prepare PRODUCTION derived Feed cache from shared canonical R2
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          for sort in latest popular; do
            file="$RUNNER_TEMP/shared-$sort.json"
            test -s "$file"
            node "$WRANGLER" r2 object put "soridraw-profile-media/internal/explore/feed-v1/$sort-40.json" --file "$file" --remote
          done
          echo PRODUCTION_DERIVED_FEED_CACHE_PREPARED_FROM_SHARED=PASS
          echo USER_ORIGINAL_DATA_CHANGE=NONE

      - name: Bootstrap PRODUCTION Durable Object migration and required bindings
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          old_version="$(curl -fsS "${auth[@]}" "$api/workers/scripts/soridraw-explore-api/deployments" | jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id')"
          old_schedules="$(curl -fsS "${auth[@]}" "$api/workers/scripts/soridraw-explore-api/schedules" | jq -c '.result | if type=="array" then . elif ((.schedules // null)|type)=="array" then .schedules else [] end | map({cron:(.cron // "")}) | map(select(.cron != "")) | sort_by(.cron)')"

          node .deploy/release-worker-runtime.mjs production dry-run
          cfg="$PWD/cloudflare/explore-worker/.release-system/production/wrangler.jsonc"
          node "$WRANGLER" deploy --config "$cfg"
          curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json'             --data "$old_schedules" "$api/workers/scripts/soridraw-explore-api/schedules" >/dev/null
          new_version="$(curl -fsS "${auth[@]}" "$api/workers/scripts/soridraw-explore-api/deployments" | jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id')"
          test "$new_version" != "$old_version"
          echo "PRODUCTION_WORKER_BEFORE=$old_version"
          echo "PRODUCTION_WORKER_AFTER=$new_version"
          echo PRODUCTION_BINDING_BOOTSTRAP_DEPLOY=PASS

      - name: Wait out PRODUCTION revision edge cache then verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 70
          node .deploy/release-worker-runtime.mjs production verify
          status="$(curl -sS -o "$RUNNER_TEMP/prod-like.json" -w '%{http_code}'             -X POST -H 'Origin: https://soridraw.com' -H 'Content-Type: application/json'             --data '{"mutations":[]}'             https://soridraw-explore-api.andrawing1212.workers.dev/v1/me/likes/batch)"
          test "$status" -ge 400
          test "$status" -lt 500
          echo "PRODUCTION_LIKE_BATCH_UNAUTH_STATUS=$status"
          echo PRODUCTION_LIKE_PATH_NO_5XX=PASS

      - name: Final three-environment live audit
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for worker in soridraw-explore-preview soridraw-explore-test soridraw-explore-api; do
            body="$RUNNER_TEMP/$worker.json"
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$api/workers/scripts/$worker/settings" > "$body"
            jq -e '.result.bindings[] | select(.name=="LIKE_RATE_LIMITER" and .type=="ratelimit")' "$body" >/dev/null
            jq -e '.result.bindings[] | select(.name=="EXPLORE_LIKE_BATCH_SCHEDULER" and .type=="durable_object_namespace" and .class_name=="ExploreLikeBatchScheduler103")' "$body" >/dev/null
            echo "$worker REQUIRED_LIKE_BINDINGS=PASS"
          done
          echo THREE_ENV_REQUIRED_LIKE_BINDINGS=PASS
          echo HOSTING_CHANGE=NONE
          echo D1_WRITE=NONE
          echo FUNCTIONS_RULES_CHANGE=NONE
