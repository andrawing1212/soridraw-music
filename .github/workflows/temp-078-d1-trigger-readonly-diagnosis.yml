name: TEMP 078 D1 Trigger Readonly Diagnosis

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-078-d1-trigger-readonly-diagnosis.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read live schema and validate corrected publication trigger locally
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          SQL="SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE sql IS NOT NULL AND tbl_name IN ('tracks','track_stats','explore_derived_tracks','explore_derived_profiles','explore_derived_changes','explore_derived_state','explore_shared_revision') ORDER BY CASE type WHEN 'table' THEN 1 WHEN 'index' THEN 2 WHEN 'trigger' THEN 3 ELSE 4 END,name;"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "$SQL" --json > "$RUNNER_TEMP/schema.json"
          python3 <<'PY'
          import json, os, sqlite3
          raw=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'schema.json'),encoding='utf-8'))
          rows=[r for group in raw for r in group.get('results',[])]
          print('REMOTE_SCHEMA_OBJECTS='+str(len(rows)))

          trigger_row=next((r for r in rows if r.get('type')=='trigger' and r.get('name')=='explore032_derived_track_update'),None)
          if not trigger_row:
              raise RuntimeError('explore032_derived_track_update missing')
          live_trigger=trigger_row['sql']
          old_old="""  INSERT OR IGNORE INTO explore_derived_profiles(uid)
  SELECT OLD.owner_uid
  WHERE OLD.owner_uid IS NOT NEW.owner_uid
     OR OLD.active IS NOT NEW.active;"""
          new_old="""  INSERT INTO explore_derived_profiles(uid)
  SELECT OLD.owner_uid
  WHERE (OLD.owner_uid IS NOT NEW.owner_uid OR OLD.active IS NOT NEW.active)
    AND NOT EXISTS (
      SELECT 1 FROM explore_derived_profiles WHERE uid = OLD.owner_uid
    );"""
          old_new="""  INSERT OR IGNORE INTO explore_derived_profiles(uid)
  SELECT NEW.owner_uid
  WHERE OLD.owner_uid IS NOT NEW.owner_uid
     OR OLD.active IS NOT NEW.active;"""
          new_new="""  INSERT INTO explore_derived_profiles(uid)
  SELECT NEW.owner_uid
  WHERE (OLD.owner_uid IS NOT NEW.owner_uid OR OLD.active IS NOT NEW.active)
    AND NOT EXISTS (
      SELECT 1 FROM explore_derived_profiles WHERE uid = NEW.owner_uid
    );"""
          if live_trigger.count(old_old)!=1 or live_trigger.count(old_new)!=1:
              raise RuntimeError('live trigger anchors changed')
          fixed_trigger=live_trigger.replace(old_old,new_old).replace(old_new,new_new)

          def build(fixed=False):
              conn=sqlite3.connect(':memory:')
              conn.execute('PRAGMA recursive_triggers=OFF')
              for r in rows:
                  sql=r.get('sql')
                  if not sql: continue
                  if r.get('type')=='trigger' and r.get('name')=='explore032_derived_track_update' and fixed:
                      sql=fixed_trigger
                  conn.execute(sql)
              conn.execute("INSERT INTO explore_derived_state(id,seq,seeded) VALUES(1,0,1)")
              conn.execute("INSERT INTO explore_shared_revision(scope,revision,updated_at) VALUES('global',1,0)")
              conn.execute("""INSERT INTO tracks (
                  id,owner_uid,source_type,source_id,title,cover_url,suno_url_primary,search_text,
                  is_public,status,published_at,created_at,updated_at
                ) VALUES (?,?,?,?,?,?,?,?,1,'published',?,?,?)""",
                ('__soridraw_sim_track__','__soridraw_sim_uid__','music_note','__sim_source__','sim','','https://example.invalid/audio','sim',1000,1000,1000))
              conn.execute("INSERT INTO track_stats(track_id,like_count,comment_count,play_count,updated_at) VALUES(?,0,0,0,?)",('__soridraw_sim_track__',1000))
              conn.commit()
              return conn

          broken=build(False)
          try:
              broken.execute("UPDATE tracks SET is_public=0, updated_at=2000 WHERE id='__soridraw_sim_track__' AND owner_uid='__soridraw_sim_uid__'")
              broken.commit()
              raise RuntimeError('live trigger unexpectedly did not reproduce private failure')
          except sqlite3.IntegrityError as e:
              broken.rollback()
              msg=str(e)
              print('LIVE_TRIGGER_REPRODUCED='+msg)
              if 'UNIQUE constraint failed: explore_derived_profiles.uid' not in msg:
                  raise

          conn=build(True)
          def snap(label):
              t=conn.execute("SELECT is_public,status,published_at,updated_at FROM tracks WHERE id='__soridraw_sim_track__'").fetchone()
              d=conn.execute("SELECT active,published_at,pinned,likes FROM explore_derived_tracks WHERE id='__soridraw_sim_track__'").fetchone()
              p=conn.execute("SELECT active,track_count FROM explore_derived_profiles WHERE uid='__soridraw_sim_uid__'").fetchone()
              s=conn.execute("SELECT seq FROM explore_derived_state WHERE id=1").fetchone()
              r=conn.execute("SELECT revision FROM explore_shared_revision WHERE scope='global'").fetchone()
              c=conn.execute("SELECT scope,kind,id,seq FROM explore_derived_changes WHERE id='__soridraw_sim_track__' ORDER BY scope").fetchall()
              print(label+'='+json.dumps({'track':t,'derived':d,'profile':p,'seq':s,'revision':r,'changes':c},ensure_ascii=False))
              return t,d,p,s,r,c

          snap('FIXED_BEFORE_PRIVATE')
          before=conn.total_changes
          conn.execute("UPDATE tracks SET is_public=0, updated_at=2000 WHERE id='__soridraw_sim_track__' AND owner_uid='__soridraw_sim_uid__'")
          conn.commit()
          private_changes=conn.total_changes-before
          t,d,p,s,r,c=snap('FIXED_AFTER_PRIVATE')
          print('FIXED_PRIVATE_LOGICAL_ROW_CHANGES='+str(private_changes))
          assert t[0] == 0 and d[0] == 0, (t,d)
          assert p and p[1] == 0, p
          assert {x[0] for x in c} >= {'feed','profile:__soridraw_sim_uid__'}, c

          before=conn.total_changes
          conn.execute("UPDATE tracks SET is_public=1,published_at=3000,updated_at=3000 WHERE id='__soridraw_sim_track__' AND owner_uid='__soridraw_sim_uid__'")
          conn.commit()
          public_changes=conn.total_changes-before
          t,d,p,s,r,c=snap('FIXED_AFTER_PUBLIC')
          print('FIXED_PUBLIC_LOGICAL_ROW_CHANGES='+str(public_changes))
          assert t[0] == 1 and d[0] == 1, (t,d)
          assert p and p[1] == 1, p
          print('LOCAL_TRIGGER_FIX_SIMULATION=PASS')
          print('REMOTE_D1_WRITES=0')
          PY
