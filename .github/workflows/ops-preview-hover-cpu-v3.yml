name: OPS Preview Hover CPU V3
permissions:
  contents: write
on:
  push:
    branches:
      - ops-preview-hover-cpu-v3
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch on clean preview
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/apply-hover-cpu-v3.py" > /tmp/apply-hover-cpu-v3.py
          git fetch origin preview
          git switch --detach origin/preview
          test "$(git rev-parse HEAD)" = "61881735e75ce6638e9a4eeab0c6d8920e36945e"
          python3 /tmp/apply-hover-cpu-v3.py
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx "
          if git diff --name-only | grep -E 'StudioSplitWorkspace\.tsx|LiteStudioSplitWorkspace\.tsx|studioLayout\.css|liteSplitWorkspace\.css|firestore|functions|rules|firebase'; then
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Publish validated source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "andrawing1212"
          git config user.email "andrawing1212@gmail.com"
          git add src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx
          git commit -m "perf(preview): reduce idle Studio hover CPU"
          git push origin HEAD:refs/heads/preview-hover-cpu-v3 --force
