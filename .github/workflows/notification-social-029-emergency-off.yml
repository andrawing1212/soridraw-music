name: SORIDRAW Notification 029 Emergency Collector OFF
on:
  pull_request:
    branches: [preview]
    paths:
      - '.github/workflows/notification-social-029-emergency-off.yml'
      - 'scripts/disable-notification-collection-029.mjs'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DISABLE_SORIDRAW_NOTIFICATION_COLLECTION to stop new notifications'
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-only:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manual OFF scope only
        run: |
          set -euo pipefail
          node --check scripts/disable-notification-collection-029.mjs
          node scripts/disable-notification-collection-029.mjs --self-test
          echo 'NOTIFICATION_029_NO_LIVE_SERVER_ON_PR=PASS'
  emergency-off:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'DISABLE_SORIDRAW_NOTIFICATION_COLLECTION' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: soridraw-notification-shared-collection-change
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit PREVIEW branch manual dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/preview'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          echo 'NOTIFICATION_029_MANUAL_EMERGENCY_ONLY=PASS'
      - name: Disable one notification collection latch without touching originals
        run: |
          set -euo pipefail
          node scripts/disable-notification-collection-029.mjs --self-test
          node scripts/disable-notification-collection-029.mjs --disable
