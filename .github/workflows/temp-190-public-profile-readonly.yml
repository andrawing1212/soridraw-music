name: SORIDRAW 190 Public Profile Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-190-public-profile-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Inspect PREVIEW canonical and public projections read-only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://soridraw-explore-preview.andrawing1212.workers.dev'
          ORIGIN='https://preview.soridraw.com'
          OWNER_UID='rcZ2GZrBndOZzT8C635eiNBjYIJ2'

          curl -fsS -D "$RUNNER_TEMP/profile.headers" -H "Origin: $ORIGIN"             "$BASE/v1/profiles/soridraw/first-view?limit=50&__diag190=$(date +%s)"             -o "$RUNNER_TEMP/profile.json"
          echo '=== PROFILE SUMMARY ==='
          node - "$RUNNER_TEMP/profile.json" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const d=p?.data||{};
          const profile=d.profile||d.snapshot?.profile||{};
          const items=Array.isArray(d.items)?d.items:Array.isArray(d.tracks?.items)?d.tracks.items:Array.isArray(d.snapshot?.items)?d.snapshot.items:[];
          console.log(JSON.stringify({trackCount:profile.trackCount??profile.track_count??null,revision:d.revision??d.snapshot?.revision??null,itemCount:items.length,items:items.map(x=>({id:x.id||x.trackId||null,title:x.title||null,ownerUid:x.ownerUid||x.owner_uid||null}))},null,2));
          NODE

          curl -fsS -D "$RUNNER_TEMP/feed.headers" -H "Origin: $ORIGIN"             "$BASE/v1/feed?sort=latest&limit=40&__soridraw_r2_only=108&__diag190=$(date +%s)"             -o "$RUNNER_TEMP/feed.json"
          echo '=== FEED OWNER UID SUMMARY ==='
          node - "$RUNNER_TEMP/feed.json" "$OWNER_UID" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const uid=process.argv[3];
          const items=Array.isArray(p?.data?.items)?p.data.items:[];
          const owner=items.filter(x=>String(x.ownerUid||x.owner_uid||'')===uid);
          console.log(JSON.stringify({totalFeedItems:items.length,ownerCount:owner.length,ownerItems:owner.map(x=>({id:x.id||x.trackId||null,title:x.title||null,ownerUid:x.ownerUid||x.owner_uid||null}))},null,2));
          NODE

          WRANGLER="$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js"
          CFG="$GITHUB_WORKSPACE/cloudflare/explore-worker/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command             "SELECT id,title,is_public,status,source_id,published_at,updated_at FROM tracks WHERE owner_uid='$OWNER_UID' AND source_type='music_note' ORDER BY updated_at DESC"             --json > "$RUNNER_TEMP/canonical.json"
          echo '=== CANONICAL D1 MUSIC NOTE PUBLICATION ==='
          node - "$RUNNER_TEMP/canonical.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=r.flatMap(x=>x.results||[]);
          const pub=rows.filter(x=>Number(x.is_public)===1&&String(x.status)==='published');
          console.log(JSON.stringify({total:rows.length,publicCount:pub.length,public:pub.map(x=>({id:x.id,title:x.title,sourceId:x.source_id,publishedAt:x.published_at,updatedAt:x.updated_at}))},null,2));
          NODE
          echo 'READ_ONLY_D1_WRITE=0'
