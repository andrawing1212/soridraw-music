name: SORIDRAW Verify Live Publication Stage3 PREVIEW 2026-09-05
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-publication-stage3-20260905.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify active Worker code and public smoke
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          function fn(src,name){
            const ns=[`async function ${name}(`,`function ${name}(`];let st=-1;
            for(const n of ns){st=src.indexOf(n);if(st>=0)break;}
            if(st<0)throw new Error('missing function '+name);
            const b=src.indexOf('{',st);let d=0,q=null,e=false;
            for(let i=b;i<src.length;i++){
              const c=src[i];
              if(q){if(e){e=false;continue;}if(c==='\\'){e=true;continue;}if(c===q)q=null;continue;}
              if(c==='"'||c==="'"||c==='`'){q=c;continue;}
              if(c==='{')d++; else if(c==='}'&&--d===0)return src.slice(st,i+1);
            }
            throw new Error('unterminated '+name);
          }
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
            const deps=await get(`${base}/deployments`);const d=(deps.deployments||deps||[])[0];
            const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!active?.version_id||Number(active.percentage||0)<99.99)throw new Error('No single active PREVIEW Worker version');
            const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);
            const mods=ver.modules||[];const main=mods.find(m=>m.name===(ver.main_module||mods[0]?.name))||mods[0];
            if(!main)throw new Error('active main module missing');
            const src=Buffer.from(main.content_base64,'base64').toString('utf8');
            for(const token of ['handleMusicNotePublicationSingleWrite016','handlePublicationR2CoreLegacy016','handleMusicNotePublicationOptions017','handleMusicNotePrivate017','primary_genre','share_payload_json'])if(!src.includes(token))throw new Error('deployed token missing '+token);
            if(src.includes('__soridraw_stage3_migrate'))throw new Error('temporary migration endpoint still deployed');
            const hot=fn(src,'handleMusicNotePublicationSingleWrite016');
            if((hot.match(/INSERT INTO tracks/g)||[]).length!==1)throw new Error('live publication tracks write statement != 1');
            for(const bad of ['track_tags','track_stats (','refreshOrPrebuildPublicProfileTrackWindow(','safelyRefreshExploreFeedR2Bundles(','enforceUserRateLimit('])if(hot.includes(bad))throw new Error('live hot-path still contains '+bad);
            const options=fn(src,'handleMusicNotePublicationOptions017');
            const priv=fn(src,'handleMusicNotePrivate017');
            if((options.match(/UPDATE tracks/g)||[]).length!==1)throw new Error('live option path tracks update != 1');
            if((priv.match(/UPDATE tracks/g)||[]).length!==1)throw new Error('live private path tracks update != 1');
            console.log(`[Stage3 live] active=${active.version_id}`);
            console.log('[Stage3 live] code invariants PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          feed_code="$(curl -sS -o /tmp/feed.json -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=latest&limit=1")"
          test "$feed_code" = "200"
          grep -q '"data"' /tmp/feed.json
          genres_code="$(curl -sS -o /tmp/genres.json -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/genres")"
          test "$genres_code" = "200"
          grep -q '"data"' /tmp/genres.json
          auth_code="$(curl -sS -o /tmp/pub401.json -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" -H 'Content-Type: application/json' -X POST --data '{}' "${PREVIEW_BASE}/v1/publications")"
          test "$auth_code" = "401"
          site_code="$(curl -sS -o /tmp/site.html -w '%{http_code}' "${PREVIEW_ORIGIN}")"
          test "$site_code" = "200"
          echo '[Stage3 live] public smoke PASS'
