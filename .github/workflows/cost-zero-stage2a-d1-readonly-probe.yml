name: Cost Zero Stage 2A D1 Readonly Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare exact live Worker settings
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_READONLY_TOKEN unavailable'; exit 2; }
          npm install --no-audit --no-fund --package-lock=false
          npm run cf:prepare
          node --check .remote-worker/worker.js

      - name: Read-only D1 capability probe
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute soridraw-explore-db \
            --remote \
            --command 'SELECT 1 AS ok;' \
            --config .remote-worker/wrangler.jsonc
          echo 'D1_READONLY_EXECUTE=PASS'
          echo 'D1_WRITE_REQUESTED=false'

      - name: Account-wide D1 usage and shared D1 cost estimate (GraphQL, read-only)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
          SORIDRAW_D1_COST_DAYS: '7'
        run: |
          set -euo pipefail
          # Existing scoped token: no SQL, no user data, no Worker deployment.
          # If GraphQL Analytics Read permission is missing, fail honestly.
          node scripts/report-cloudflare-d1-usage-readonly.mjs
