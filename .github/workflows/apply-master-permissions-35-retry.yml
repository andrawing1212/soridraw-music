name: Apply master permissions 35 retry

on:
  push:
    branches: [main]
    paths:
      - .deploy/apply-master-permissions-35-retry-trigger.txt

concurrency:
  group: apply-master-permissions-35-retry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Decode and apply 35th source patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          base64 -d .deploy/master35-core.patch.gz.b64 | gzip -d > /tmp/master35.patch
          git apply --check /tmp/master35.patch
          git apply /tmp/master35.patch

      - name: Set up Node.js 20
        if: steps.patch.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install web dependencies
        id: web_install
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Type check web
        id: web_lint
        if: steps.web_install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Build web
        id: web_build
        if: steps.web_lint.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Install Functions dependencies
        id: functions_install
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Build Functions
        id: functions_build
        if: steps.functions_install.outcome == 'success'
        continue-on-error: true
        run: npm --prefix functions run build

      - name: Authenticate to Google Cloud
        id: google_auth
        if: steps.web_build.outcome == 'success' && steps.functions_build.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy selected admin Functions
        id: functions_deploy
        if: steps.google_auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy \
            --only functions:ensureMasterAccess,functions:masterSetAdminAccess,functions:backfillMissingAuthUsers,functions:getAdminAuthDirectory,functions:getAdminPresence,functions:adminForceLogoutUser,functions:adminResetEmailVerification,functions:adminDeleteUserAccount \
            --project soridraw-app-866a5 --non-interactive 2>&1 | tee /tmp/master35-functions.log

      - name: Deploy Firestore Rules
        id: rules_deploy
        if: steps.google_auth.outcome == 'success' && steps.functions_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only firestore:rules --project soridraw-app-866a5 --non-interactive 2>&1 | tee /tmp/master35-rules.log

      - name: Bootstrap representative master account
        id: master_bootstrap
        if: steps.rules_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee /tmp/master35-bootstrap.log
          const admin = require('./functions/node_modules/firebase-admin');
          admin.initializeApp({ credential: admin.credential.applicationDefault(), projectId: 'soridraw-app-866a5' });
          (async () => {
            const authUser = await admin.auth().getUserByEmail('andrawing1212@gmail.com');
            await admin.firestore().collection('users').doc(authUser.uid).set({
              role: 'admin',
              staffRole: 'master',
              adminPermissions: {
                userManagement: true,
                vocalManagement: true,
                sectionTagManagement: true,
                sunoApiManagement: true,
                appSettings: true,
                geminiAudit: true,
              },
              staffRoleUpdatedAt: admin.firestore.FieldValue.serverTimestamp(),
              staffRoleUpdatedBy: authUser.uid,
              masterBootstrapSource: 'github-actions-approved-deploy-retry',
            }, { merge: true });
            console.log(`MASTER_BOOTSTRAP_SUCCESS uid=${authUser.uid}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Record result and publish only when safe
        if: always()
        shell: bash
        env:
          PATCH: ${{ steps.patch.outcome }}
          WEB_INSTALL: ${{ steps.web_install.outcome }}
          WEB_LINT: ${{ steps.web_lint.outcome }}
          WEB_BUILD: ${{ steps.web_build.outcome }}
          FUNCTIONS_INSTALL: ${{ steps.functions_install.outcome }}
          FUNCTIONS_BUILD: ${{ steps.functions_build.outcome }}
          GOOGLE_AUTH: ${{ steps.google_auth.outcome }}
          FUNCTIONS_DEPLOY: ${{ steps.functions_deploy.outcome }}
          RULES_DEPLOY: ${{ steps.rules_deploy.outcome }}
          MASTER_BOOTSTRAP: ${{ steps.master_bootstrap.outcome }}
        run: |
          mkdir -p .deploy
          {
            echo "patch=${PATCH}"
            echo "web_install=${WEB_INSTALL}"
            echo "web_lint=${WEB_LINT}"
            echo "web_build=${WEB_BUILD}"
            echo "functions_install=${FUNCTIONS_INSTALL}"
            echo "functions_build=${FUNCTIONS_BUILD}"
            echo "google_auth=${GOOGLE_AUTH}"
            echo "functions_deploy=${FUNCTIONS_DEPLOY}"
            echo "rules_deploy=${RULES_DEPLOY}"
            echo "master_bootstrap=${MASTER_BOOTSTRAP}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- functions deploy log tail ---"
            tail -n 80 /tmp/master35-functions.log 2>/dev/null || true
            echo
            echo "--- rules deploy log tail ---"
            tail -n 60 /tmp/master35-rules.log 2>/dev/null || true
            echo
            echo "--- master bootstrap log tail ---"
            tail -n 40 /tmp/master35-bootstrap.log 2>/dev/null || true
          } > .deploy/master-permissions-35-retry-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$PATCH" == "success" && "$WEB_BUILD" == "success" && "$FUNCTIONS_BUILD" == "success" && "$GOOGLE_AUTH" == "success" && "$FUNCTIONS_DEPLOY" == "success" && "$RULES_DEPLOY" == "success" && "$MASTER_BOOTSTRAP" == "success" ]]; then
            git add firestore.rules functions/src/index.ts src/App.tsx src/components/AdminPageLayout.tsx src/constants/adminPermissions.ts src/pages/AdminSectionTagsPage.tsx src/pages/AdminUserManagementPage.tsx src/pages/AdminVocalTonesPage.tsx src/pages/MasterPermissionsPage.tsx src/types.ts .deploy/master-permissions-35-retry-result.txt
            git rm .github/workflows/apply-master-permissions-35-retry.yml
            git rm .deploy/apply-master-permissions-35-retry-trigger.txt
            git rm .deploy/master35-core.patch.gz.b64
            git commit -m "feat: add master and page-level admin permissions"
            git push origin HEAD:main
          else
            git add .deploy/master-permissions-35-retry-result.txt
            git commit -m "chore: record failed master35 deployment retry" || true
            git push origin HEAD:main
            exit 1
          fi
