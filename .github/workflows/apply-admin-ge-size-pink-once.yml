name: Apply admin G E size and pink color once

on:
  push:
    branches:
      - main
    paths:
      - .deploy/apply-admin-ge-size-pink-trigger.txt

concurrency:
  group: apply-admin-ge-size-pink-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply G E size and color update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/AdminUserManagementPage.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ('text-[15px] font-black tracking-[-0.04em] text-sky-300', 'text-[18px] font-black tracking-[-0.04em] text-sky-300'),
            ("text-[15px] font-black tracking-[-0.04em]', isVerified ? 'text-violet-300' : 'text-white'", "text-[18px] font-black tracking-[-0.04em]', isVerified ? 'text-pink-400' : 'text-white'"),
            ('inline-flex items-center gap-0.5 text-[13px] font-black tracking-[-0.06em]', 'inline-flex items-center gap-0.5 text-[16px] font-black tracking-[-0.06em]'),
            ("isEmailVerified ? 'text-violet-300' : 'text-white'", "isEmailVerified ? 'text-pink-400' : 'text-white'"),
            ('text-[15px] font-black text-white', 'text-[18px] font-black text-white'),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Commit source update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminUserManagementPage.tsx
          git rm .github/workflows/apply-admin-ge-size-pink-once.yml
          git rm .deploy/apply-admin-ge-size-pink-trigger.txt
          git commit -m "style: enlarge G E marks and use pink email color"
          git push origin HEAD:main
