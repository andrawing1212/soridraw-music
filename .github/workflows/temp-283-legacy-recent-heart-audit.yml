name: SORIDRAW app283 Legacy Recent Heart Audit

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app283-legacy-recent-heart-audit.trigger'
      - '.github/workflows/temp-283-legacy-recent-heart-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 4f5820c3ea3fd48fa872c5b82a9f5a012689560a^{commit}
          allowed='^(src/App\.tsx|src/lib/userDataEngine\.ts|src/services/userDomainSyncService\.ts|public/app-version\.json|scripts/verify-282-title-cross-device\.mjs|scripts/verify-283-legacy-recent-heart\.mjs|\.github/workflows/temp-283-legacy-recent-heart-audit\.yml|\.deploy/app283-legacy-recent-heart-audit\.trigger)$'
          unexpected="$(git diff --name-only 4f5820c3ea3fd48fa872c5b82a9f5a012689560a..HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected app283 files:"; echo "$unexpected"; exit 1; }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Focused regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-278-music-note-cross-device.mjs
          node scripts/verify-279-legacy-recent-heart.mjs
          node scripts/verify-280-music-note-resurrection.mjs
          node scripts/verify-281-suno-url-cross-device.mjs
          node scripts/verify-282-title-cross-device.mjs
          node scripts/verify-283-legacy-recent-heart.mjs
          npx tsx scripts/verify-196-recent-song-sync.ts

      - name: Cost contract
        shell: bash
        run: |
          set -euo pipefail
          echo 'APP283_RECEIVER_FIRESTORE_READS=0'
          echo 'APP283_EXTRA_RTDB_MUTATIONS=0'
          echo 'APP283_USER_DATA_MIGRATION=0'
          echo 'APP283_PUBLIC_EXPLORE_LIKE_CODE_CHANGED=0'
