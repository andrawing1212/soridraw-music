name: SORIDRAW 089 Like Consistency Readonly Audit
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-089-like-consistency-readonly.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve PREVIEW D1 binding
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          rm -rf .readonly-089 && mkdir -p .readonly-089
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
            const [deps,settings]=await Promise.all([get(`${base}/deployments`),get(`${base}/settings`)]);
            const d=(deps.deployments||deps||[])[0];
            const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!active?.version_id||Number(active.percentage||0)<99.99) throw new Error('No single active PREVIEW Worker');
            const bindings=settings.bindings||[];
            const d1=bindings.find(b=>b.type==='d1'&&b.name==='DB');
            if(!d1) throw new Error('Active PREVIEW D1 binding missing');
            const d1id=String(d1.id||d1.database_id||d1.uuid||'').trim();
            const d1name=String(d1.database_name||'soridraw-explore-preview').trim();
            fs.writeFileSync('.readonly-089/wrangler.jsonc',JSON.stringify({name:'soridraw-089-like-readonly',compatibility_date:String(settings.compatibility_date||'2026-08-28').slice(0,10),d1_databases:[{binding:'DB',database_name:d1name,database_id:d1id}]},null,2)+'\n');
            console.log(`ACTIVE_PREVIEW_WORKER=${active.version_id}`);
            console.log(`PREVIEW_D1=${d1name}/${d1id}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Read-only like consistency audit
        shell: bash
        run: |
          set -euo pipefail
          CFG='cloudflare/explore-worker/.readonly-089/wrangler.jsonc'
          SQL="SELECT t.id, t.title, COALESCE(dt.likes,0) AS derived_like_count, COALESCE(ts.like_count,0) AS stat_like_count, (SELECT COUNT(*) FROM likes l WHERE l.track_id=t.id) AS relation_count FROM tracks t LEFT JOIN explore_derived_tracks dt ON dt.id=t.id LEFT JOIN track_stats ts ON ts.track_id=t.id WHERE t.is_public=1 AND t.status='published' AND (t.title LIKE '%소스록%' OR t.title LIKE '%설렘%' OR t.title LIKE '%Left Unsaid%' OR t.title LIKE '%Secret Code%' OR COALESCE(dt.likes,0)>2 OR COALESCE(ts.like_count,0)>2) ORDER BY MAX(COALESCE(dt.likes,0),COALESCE(ts.like_count,0)) DESC, t.updated_at DESC LIMIT 40; SELECT track_id,user_uid,COUNT(*) AS duplicate_rows FROM likes GROUP BY track_id,user_uid HAVING COUNT(*)>1 LIMIT 20; SELECT '035' AS queue_name, COUNT(*) AS pending_batches FROM explore_like_batches_035 UNION ALL SELECT '069', COUNT(*) FROM explore_like_batches_069;"
          npx --yes wrangler@4 d1 execute DB --remote --config "$CFG" --command "$SQL" --json | tee "$RUNNER_TEMP/like-audit-089.json"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/home/runner/work/_temp/like-audit-089.json')
          data=json.loads(p.read_text())
          print('LIKE_AUDIT_089_READONLY=PASS')
          print(json.dumps(data, ensure_ascii=False)[:12000])
          PY
