name: SORIDRAW Backend V2 Maintenance Gate A Safe Apply

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-maintenance-gate-a-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0

      - name: Capture protected Firebase/backend baselines
        shell: bash
        run: |
          set -euo pipefail
          sha256sum firestore.rules firestore.indexes.json database.rules.json src/firebase.js functions/src/index.ts > /tmp/gatea-protected.sha256
          sha256sum package.json > /tmp/gatea-package-json.sha256

      - name: Apply the two approved behavior-preserving TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('src/App.tsx')
          app=app_path.read_text(encoding='utf-8')
          pattern=re.compile(
              r"(?P<before>\s*: mode === 'pure-pane'\n\s*\? 'pure-pane')\n"
              r"\s*: mode === 'pure-pane-hybrid'\n\s*\? 'pure-pane-hybrid'\n"
              r"(?P<after>\s*: mode === 'pure-pane-live')"
          )
          app2,count=pattern.subn(lambda m: m.group('before')+'\n'+m.group('after'), app, count=1)
          if count != 1:
              raise SystemExit(f'App unreachable pure-pane-hybrid branch: expected 1 replacement, got {count}')
          app_path.write_text(app2, encoding='utf-8')

          gem_path=Path('src/services/geminiService.ts')
          gem=gem_path.read_text(encoding='utf-8')
          old="appliedKeywords: { ...(result.appliedKeywords || {}) },"
          new="appliedKeywords: { ...result.appliedKeywords },"
          if gem.count(old) != 1:
              raise SystemExit(f'Gemini appliedKeywords anchor count={gem.count(old)}')
          gem_path.write_text(gem.replace(old,new,1), encoding='utf-8')
          print('GATEA_TS_FIXES_APPLIED=2')
          PY
          git diff --check

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install exact baseline dependencies
        run: npm ci --ignore-scripts

      - name: Apply npm non-force remediation within existing declared ranges
        shell: bash
        run: |
          set +e
          npm audit fix --ignore-scripts
          code=$?
          set -e
          echo "GATEA_AUDIT_FIX_EXIT=${code}"
          sha256sum --check /tmp/gatea-package-json.sha256
          test -z "$(git diff --name-only -- package.json)"
          echo 'GATEA_PACKAGE_JSON_UNCHANGED=true'
          echo 'GATEA_DEPENDENCY_DIFF_BEGIN'
          git diff --numstat -- package-lock.json
          echo 'GATEA_DEPENDENCY_DIFF_END'

      - name: Reinstall from remediated lockfile for reproducibility
        run: npm ci --ignore-scripts

      - name: Require zero critical/high dependency findings
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/gatea-final-audit.json
          audit_code=$?
          set -e
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/gatea-final-audit.json'))
          meta=d.get('metadata',{}).get('vulnerabilities',{})
          print('GATEA_FINAL_AUDIT_COUNTS='+json.dumps(meta,sort_keys=True))
          if int(meta.get('critical',0)) != 0 or int(meta.get('high',0)) != 0:
              raise SystemExit('Gate A dependency blocker remains: critical/high is not zero')
          PY
          echo "GATEA_FINAL_AUDIT_EXIT=${audit_code} (nonzero is expected while low/moderate findings remain)"

      - name: Full-project TypeScript gate
        run: npx tsc --noEmit --pretty false

      - name: Backend V2 regression contracts
        shell: bash
        run: |
          set -euo pipefail
          npx tsx src/data/v1MutationBoundary.contract.ts
          npx tsx src/data/v2LiveMutation.contract.ts

      - name: Production build
        run: npx vite build

      - name: Final protected-scope checks
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check /tmp/gatea-protected.sha256
          sha256sum --check /tmp/gatea-package-json.sha256
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={'src/App.tsx','src/services/geminiService.ts','package-lock.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Gate A apply scope mismatch: changed={sorted(changed)} expected={sorted(allowed)}')
          print('GATEA_APPLY_SCOPE_PASS='+','.join(sorted(changed)))
          PY
          echo 'GATEA_FIREBASE_DATA_READS=0'
          echo 'GATEA_FIREBASE_DATA_WRITES=0'
          echo 'GATEA_FIREBASE_DATA_DELETES=0'
          echo 'GATEA_RULES_DEPLOYS=0'
          echo 'GATEA_FUNCTIONS_DEPLOYS=0'
          echo 'GATEA_HOSTING_DEPLOYS=0'

      - name: Commit validated Gate A safe fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/services/geminiService.ts package-lock.json
          git commit -m 'fix: clear Gate A type and high-risk dependency findings'
          git push origin HEAD:preview

      - name: Remove temporary Gate A execution tools
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin preview
          git rm \
            .github/workflows/backend-v2-maintenance-gate-a-readonly-audit.yml \
            .github/workflows/backend-v2-maintenance-gate-a-source-context.yml \
            .github/workflows/backend-v2-maintenance-gate-a-dependency-plan.yml \
            .github/workflows/backend-v2-maintenance-gate-a-dependency-candidate.yml \
            .github/workflows/backend-v2-maintenance-gate-a-apply.yml
          git commit -m 'chore: remove temporary Maintenance Gate A tools'
          git push origin HEAD:preview
