name: TEMP 138 Shared Feed 070 Verify
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-138-shared-feed-070-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2720607faa9ede08221e4b9a15c5a30967c622bc
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 070 candidate and run regression
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/worker070"
          mkdir -p "$work"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/9d9d11b86cb3a866feed1c25e3a3cf2567f37311/cloudflare/explore-worker/canonical/preview-worker.js" -o "$work/worker.js"
          export SORIDRAW_REMOTE_WORKER_DIR="$work"
          node --check cloudflare/explore-worker/patches/070-shared-feed-legacy-writer-guard.mjs
          node cloudflare/explore-worker/patches/070-shared-feed-legacy-writer-guard.mjs
          node --check "$work/worker.js"
          SORIDRAW_GENERATED_WORKER="$work/worker.js" node scripts/verify-070-shared-feed-guard.mjs
          cmp "$work/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          echo '070_CANONICAL_MATCHES_OFFICIAL_PATCH=PASS'
          actual="$(sha256sum "$work/worker.js" | awk '{print $1}')"
          test "$actual" = 91d154aaa9524dbf1349d48d0d14eadd09738602f103fedfbcf360270c340000
          echo "070_SHA256=$actual"
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          echo '070_OFFLINE_PATCH_AND_REGRESSION=PASS'
          echo 'DEPLOY=0 DATA_WRITE=0'

      - name: TypeScript and app build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          echo '070_TYPESCRIPT_BUILD=PASS'
      - name: PREVIEW Worker dry run only
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          npm install --no-audit --no-fund --package-lock=false
          cd canonical
          node ../node_modules/wrangler/bin/wrangler.js deploy --config wrangler.preview.jsonc --dry-run
          echo '070_WORKER_DRY_RUN=PASS'
          echo 'D1_ORIGIN_WRITE=0; R2_REMOTE_WRITE=0; DEPLOY=0'
