name: SORIDRAW app288 Failed Save Readonly Forensics

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app288-failed-save-forensics.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - working-directory: functions
        run: npm ci --no-audit --no-fund
      - name: Read exact target state and latest live signal
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
        run: |
          node <<'NODE'
          const crypto=require('crypto'); const admin=require('firebase-admin');
          admin.initializeApp({projectId:'soridraw-app-866a5',databaseURL:'https://soridraw-app-866a5-default-rtdb.firebaseio.com'});
          const db=admin.firestore(), rtdb=admin.database(), TARGET='스쳐간 이름 뒤에';
          const h=v=>{const s=String(v||'').trim();return s?crypto.createHash('sha256').update(s).digest('hex').slice(0,12):''};
          const ms=v=>!v?0:typeof v.toMillis==='function'?v.toMillis():typeof v.seconds==='number'?v.seconds*1000:Number(v)||0;
          const shape=(x,id='')=>({
            idHash:h(id||x?.id||x?.firestoreId), title:String(x?.title||x?.koreanTitle||''),
            saved:x?.saved===true, favoriteRemoved:x?.favoriteRemoved===true, hidden:x?.hidden===true, favoriteHidden:x?.favoriteHidden===true,
            removedAt:ms(x?.favoriteRemovedAt), unsavedAt:ms(x?.unsavedAt), unlikedAt:ms(x?.unlikedAt),
            updatedAtMs:Number(x?.updatedAtMs||0)||ms(x?.updatedAt), createdAtMs:Number(x?.createdAtMs||0)||ms(x?.createdAt),
            generationBatchHash:h(x?.appliedKeywords?.generationBatchId), generationIndex:Number(x?.appliedKeywords?.generationIndex||0),
            soridrawSongIdHash:h(x?.soridrawSongId), recentSongSyncKeyHash:h(x?.recentSongSyncKey),
            favoriteFirestoreIdHash:h(x?.favoriteFirestoreId), musicNoteFavoriteIdHash:h(x?.musicNoteFavoriteId)
          });
          (async()=>{
            const [a,b]=await Promise.all([
              db.collection('favorites').where('title','==',TARGET).limit(20).get(),
              db.collection('favorites').where('koreanTitle','==',TARGET).limit(20).get()
            ]);
            const m=new Map(); [...a.docs,...b.docs].forEach(d=>m.set(d.id,d));
            const docs=[...m.values()]; if(!docs.length) throw new Error('target not found');
            const uid=String(docs[0].data()?.uid||'');
            const targetIdentity=docs[0].data()?.appliedKeywords||{};
            const recentSnap=await db.collection('user_recent_songs').doc(uid).get();
            const songs=Array.isArray(recentSnap.data()?.songs)?recentSnap.data().songs:[];
            const targetRecent=songs.find(s=>String(s?.appliedKeywords?.generationBatchId||'')===String(targetIdentity?.generationBatchId||'')
              && Number(s?.appliedKeywords?.generationIndex||0)===Number(targetIdentity?.generationIndex||0));
            const signalRaw=(await rtdb.ref(`userSync/${uid}/musicNote`).get()).val()||{};
            let item=null; try{item=signalRaw.itemJson?JSON.parse(signalRaw.itemJson):null}catch{}
            const now=Date.now();
            console.log(JSON.stringify({
              safety:{firestoreWrites:0,firestoreDeletes:0,rtdbWrites:0},
              now,
              targetFavorites:docs.map(d=>shape(d.data(),d.id)),
              targetRecent:targetRecent?shape(targetRecent):null,
              signal:{
                version:Number(signalRaw.version||0), at:Number(signalRaw.at||0),
                ageMs: now-Number(signalRaw.at||signalRaw.version||0),
                operation:String(signalRaw.operation||''), removed:signalRaw.removed===true,
                originHash:h(signalRaw.originDeviceId),
                documentIdHashes:Array.isArray(signalRaw.documentIds)?signalRaw.documentIds.map(h):[],
                itemJsonLength:String(signalRaw.itemJson||'').length,
                item:Array.isArray(item)?item.map(x=>shape(x)):item?shape(item):null
              }
            },null,2));
            await admin.app().delete();
          })().catch(async e=>{console.error(e?.stack||e);try{await admin.app().delete()}catch{}process.exit(1)});
          NODE
