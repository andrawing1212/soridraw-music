name: Apply 106B Explore Canonical Public Count

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-106b-explore-public-count-canonical-only.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply canonical-only public count rule
        run: python3 .deploy/apply-106b-explore-public-count-canonical-only.py

      - name: Verify like contracts
        run: |
          node scripts/verify-106-explore-public-count-separation.mjs
          node scripts/verify-105-explore-like-1min.mjs
          node scripts/verify-103-explore-like-event-batch.mjs
          node scripts/verify-102-explore-public-like-parity.mjs
          node scripts/verify-explore-like-cost-optimization.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Restore generated dist
        run: git restore --worktree --staged dist

      - name: Change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'CHANGED=%s\n' "${changed[*]}"
          allowed='^(src/services/exploreLikeDisplayStateService\.ts|src/services/exploreLikeService\.ts|scripts/verify-106-explore-public-count-separation\.mjs)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected changed file: $path"; exit 1; }
          done
          test "${#changed[@]}" -eq 3
          ! git diff --name-only | grep -E '^(cloudflare/|functions/|firestore|database|src/components/|src/.*\.css$|public/app-version\.json$)' || {
            echo 'Forbidden backend/UI/version boundary change'; exit 1;
          }
          echo 'CHANGE_BOUNDARY=PASS'

      - name: Commit refined 106 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/services/exploreLikeDisplayStateService.ts \
            src/services/exploreLikeService.ts \
            scripts/verify-106-explore-public-count-separation.mjs
          git diff --cached --quiet && { echo 'No refinement changes'; exit 1; }
          git commit -m 'fix: make Explore public like count canonical-only'
          git push origin HEAD:preview
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo 'DEPLOYMENT=NONE'
          echo 'USER_DATA_CHANGE=NONE'
          echo 'WORKER_CHANGE=NONE'
          echo 'UI_CSS_CHANGE=NONE'
