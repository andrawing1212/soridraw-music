name: TEMP 365 Materialize Publication Canonical Like Cache

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-365-materialize-publication-like-cache.yml'

permissions:
  contents: write

concurrency:
  group: temp-365-materialize-publication-like-cache
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 095 to canonical Worker copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/soridraw-365"
          mkdir -p "$RUNNER_TEMP/soridraw-365"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/soridraw-365/worker.js"
          export SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/soridraw-365"
          node --check cloudflare/explore-worker/patches/095-publication-canonical-like-request-cache.mjs
          node cloudflare/explore-worker/patches/095-publication-canonical-like-request-cache.mjs
          node --check "$RUNNER_TEMP/soridraw-365/worker.js"
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/soridraw-365/worker.js" node scripts/verify-365-publication-canonical-like-request-cache.mjs
      - name: Commit canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/soridraw-365/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release-bot@users.noreply.github.com'
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git diff --cached --quiet && { echo 'No canonical source change'; exit 0; }
          git commit -m 'build(preview): materialize publication canonical-like cache'
          git push origin HEAD:preview
