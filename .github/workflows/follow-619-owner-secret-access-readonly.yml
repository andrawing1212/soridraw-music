name: SORIDRAW APP619 Exact Owner Secrets Access Readonly
on:
  push:
    branches: [feat/app600-owner-standalone-isolated]
    paths:
      - '.github/workflows/follow-619-owner-secret-access-readonly.yml'
permissions:
  contents: read
concurrency:
  group: soridraw-app619-secret-access-preflight
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check read access only, never print or save secret bytes
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test "$GITHUB_REF" = refs/heads/feat/app600-owner-standalone-isolated
          test "$(gcloud projects describe soridraw-app-866a5 --format='value(projectId)')" = soridraw-app-866a5
          for name in SORIDRAW_OWNER_FOLLOW_HMAC_539 SORIDRAW_OWNER_FOLLOW_ENROLL_HMAC_544; do
            if gcloud secrets versions access latest --project=soridraw-app-866a5 --secret="$name" >/dev/null 2>&1; then
              echo "APP619_EXACT_SECRET_VERSION_ACCESS_${name}=PASS"
            else
              echo "APP619_EXACT_SECRET_VERSION_ACCESS_${name}=HOLD_PERMISSION"
              exit 3
            fi
          done
          echo APP619_NO_SECRET_BYTES_EXPORTED_AND_NO_MUTATION=PASS
