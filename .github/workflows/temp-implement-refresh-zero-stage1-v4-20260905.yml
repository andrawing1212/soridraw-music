name: SORIDRAW Refresh Zero Firestore 1021 Runner
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-implement-refresh-zero-stage1-v4-20260905.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply refresh-zero patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/fix-1021-card-anchor.py
          python3 .deploy/apply-1021-refresh-zero-firestore-listeners.py
          git diff --check
      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SORIDRAW_ROOT_USER_REFRESH_ZERO_1021' src/App.tsx
          grep -Fq 'subscribeUserControlRevision(' src/App.tsx
          grep -Fq 'subscribeMusicNoteStructureCache(uid' src/pages/FavoritesPage.tsx
          grep -Fq 'getDocFromCache(ref)' src/services/musicNoteStructureCache.ts
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          page=Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          if "        attachUserRoleListener();\n\n        // Fetch favorites for the user." in app:
              raise SystemExit('unconditional users listener remains')
          if "targetSession.unsubscribe = onSnapshot(\n      doc(db, 'user_structures', uid)" in page:
              raise SystemExit('billed user_structures listener remains')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx src/pages/FavoritesPage.tsx src/services/musicNoteStructureCache.ts src/services/userDomainSyncService.ts src/data/v1MutationBoundary.ts
          git diff --cached --check
          git commit -m 'fix(cost): make refresh Firestore reads cache-driven'
          git push origin HEAD:preview

