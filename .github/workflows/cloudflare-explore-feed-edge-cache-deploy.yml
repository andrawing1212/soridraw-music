name: Cloudflare Explore Feed Edge Cache Deploy

on:
  push:
    branches: [preview]
    paths:
      - 'cloudflare/explore-worker/patches/002-explore-feed-edge-cache.mjs'
      - '.github/workflows/cloudflare-explore-feed-edge-cache-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-explore-feed-edge-cache-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout preview tooling
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare exact live Worker plus cache patch
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          npm install --no-audit --no-fund
          npm run cf:prepare
          node --check .remote-worker/worker.js
          grep -Fq 'SORIDRAW_EXPLORE_FEED_EDGE_CACHE_002' .remote-worker/worker.js
          grep -Fq 'handleFeedWithEdgeCache(request, url, env, cors)' .remote-worker/worker.js
          grep -Fq 'X-SORIDRAW-Edge-Cache' .remote-worker/worker.js
          test "$(grep -Fc 'if (response.ok) await invalidateExploreFeedEdgeCache(request);' .remote-worker/worker.js)" -ge 4
          echo 'EDGE_CACHE_SOURCE_VALIDATION=PASS'

      - name: Deploy only prepared Explore Worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:deploy
          echo 'EXPLORE_WORKER_EDGE_CACHE_DEPLOY=PASS'

      - name: Re-read deployed Worker and verify persisted source
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .remote-worker
          npm run cf:prepare
          node --check .remote-worker/worker.js
          grep -Fq 'SORIDRAW_EXPLORE_FEED_EDGE_CACHE_002' .remote-worker/worker.js
          grep -Fq 'handleFeedWithEdgeCache(request, url, env, cors)' .remote-worker/worker.js
          echo 'LIVE_EDGE_CACHE_SOURCE=PASS'

      - name: Verify second public-feed request is D1-free edge HIT
        shell: bash
        run: |
          set -euo pipefail
          url='https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=40'
          for n in 1 2; do
            curl -fsS --max-time 30 -D "$RUNNER_TEMP/feed-$n.headers" -o "$RUNNER_TEMP/feed-$n.json" \
              -H 'Origin: https://preview.soridraw.com' \
              -H 'Accept: application/json' \
              "$url"
            grep -q '"ok":true' "$RUNNER_TEMP/feed-$n.json"
            echo "[feed $n]"
            grep -iE '^(x-soridraw-edge-cache|x-soridraw-d1-read|x-soridraw-cf-worker|cache-control):' "$RUNNER_TEMP/feed-$n.headers" || true
          done
          grep -qi '^x-soridraw-edge-cache: HIT' "$RUNNER_TEMP/feed-2.headers"
          grep -qi '^x-soridraw-d1-read: 0' "$RUNNER_TEMP/feed-2.headers"
          echo 'SECOND_FEED_EDGE_HIT_D1_ZERO=PASS'

      - name: Safety result
        run: |
          echo 'NO_D1_MIGRATION=true'
          echo 'NO_FIRESTORE_CHANGE=true'
          echo 'NO_FIREBASE_RULES_CHANGE=true'
          echo 'NO_FIREBASE_FUNCTIONS_DEPLOY=true'
          echo 'NO_FIREBASE_PRODUCTION_HOSTING_DEPLOY=true'
