name: TEMP Fix 107 Next Doc

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-fix-107-next-doc.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Fix doc
        run: python3 .deploy/temp-fix-107-next-doc.py
      - name: Self clean and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .deploy/temp-fix-107-next-doc.py
          git rm .deploy/temp-fix-107-next-doc.trigger
          git rm .github/workflows/temp-fix-107-next-doc.yml
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DOCS/NEXT_CODEX_TASK.md
          git commit -m 'docs: align 107 current task state'
          git push origin HEAD:preview
