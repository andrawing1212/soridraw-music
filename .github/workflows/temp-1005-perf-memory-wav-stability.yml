name: TEMP 1005 Perf Memory WAV Stability

on:
  push:
    branches: [preview-perf-memory-wav-stability]
    paths:
      - '.github/workflows/temp-1005-perf-memory-wav-stability.yml'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-perf-memory-wav-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply conservative stability patch
        run: python3 .deploy/temp-1005-perf-memory-wav-stability.py
      - name: Verify patch scope and safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          echo "changed=$changed"
          test "$changed" = "src/components/studio/LiteStudioSplitWorkspace.tsx src/components/studio/liteSplitWorkspace.css src/pages/SunoLibraryPage.tsx src/services/sunoAudioRecovery.ts "
          grep -q "1005 — During a native window resize" src/components/studio/LiteStudioSplitWorkspace.tsx
          grep -q "1005 — wide-PC drag + native-resize containment" src/components/studio/liteSplitWorkspace.css
          grep -q "getCompletedSunoRescueUrl" src/pages/SunoLibraryPage.tsx
          grep -q "real listener leak on route changes" src/pages/SunoLibraryPage.tsx
          grep -q "existingRescueUrl" src/services/sunoAudioRecovery.ts
          if grep -q "rescueSunoTrackAudio" src/services/sunoAudioRecovery.ts; then exit 1; fi
          if grep -q "/api/v1/wav/generate" src/services/sunoAudioRecovery.ts; then exit 1; fi
          if git diff -U0 -- src/components/studio/LiteStudioSplitWorkspace.tsx | grep -E '^[-+].*(handlePointerMove|schedulePointer|flushPointer|purePaneHybridLive|writeLiveSplitGeometry\()'; then
            echo 'Unexpected split drag JS hotpath change detected' >&2
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/studio/LiteStudioSplitWorkspace.tsx src/components/studio/liteSplitWorkspace.css src/pages/SunoLibraryPage.tsx src/services/sunoAudioRecovery.ts
          git commit -m "fix(preview): reduce layout hotpath load and reuse completed WAV safely"
          git push origin HEAD:preview-perf-memory-wav-stability
