name: SORIDRAW Backend V2 Step 2-A4c Docs Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4c-docs-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0

      - name: Finalize Master Plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          text = path.read_text(encoding='utf-8')

          old_status = 'Status: IMPLEMENTATION / M-008 Firestore canonical-song Rules alignment and M-009 Vercel Preview prebuild blocker are both closed; 2-A4c Preview shadow writes are now the next gated step and remain OFF pending separate exact write approval + fresh quota gate; Step 4 remains blocked'
          new_status = 'Status: IMPLEMENTATION / Step 2-A4c Preview V1-first -> V2 shadow mirror complete and one real authenticated Music Note save verified live; legacy Recent fallback remains intentional; 2-A4d bounded live-gap catch-up is next and requires separate exact write approval + fresh quota gate; Step 4 remains blocked pending 2-A4d'
          if old_status not in text:
              raise SystemExit('Master top status anchor mismatch')
          text = text.replace(old_status, new_status, 1)

          report_anchor = '2-A4b V1 mutation-boundary result: `docs/SORIDRAW_BACKEND_V2_STEP2_A4B_V1_MUTATION_BOUNDARY_RESULT.md`.\n'
          report_line = '2-A4c Preview shadow-mirror result: `docs/SORIDRAW_BACKEND_V2_STEP2_A4C_PREVIEW_SHADOW_MIRROR_RESULT.md`.\n'
          if report_line not in text:
              if report_anchor not in text:
                  raise SystemExit('Master report-link anchor mismatch')
              text = text.replace(report_anchor, report_anchor + report_line, 1)

          section_anchor = '### Maintenance M-009 complete — real Vercel prebuild path repaired and verified\n'
          section = '''### 2-A4c complete — Preview V1-first -> V2 shadow mirror activated and live-verified\n- Fresh quota and deployed canonical-song Rules gates passed before activation; V1 remained authoritative and no V1 delete was enabled.\n- Runtime activation commit `564459d1175c7ac47bb3c31c4b054e9b6096d34f` passed the exact production build path, TypeScript, V1-first boundary contract and 910/912/913 generated-runtime compatibility checks before Preview deployment.\n- The Preview-only post-success hook mirrors only explicit stable `sd_` targets after a successful V1 mutation; failures remain best-effort through the bounded durable IndexedDB outbox and cannot roll back V1 success.\n- Real authenticated verification run `32953223584` / job `98129139786` completed SUCCESS after one Preview heart-ON action: 742 V1 favorites were scanned, exactly one recent active stable-ID favorite candidate was found, and exactly one same-ID canonical V2 document matched with `schemaVersion:2`, `musicNote:true`, mutation/version metadata present and no forbidden secret fields.\n- The test item was a legacy Recent entry. Its V1 Recent bundle did not carry the newly assigned stable ID and the V2 canonical document therefore remained `recentVisible:false`; this is intentional legacy fallback, not a mirror failure, because historical Recent entries must never be positional re-keyed or guessed from title/lyrics/prompt/hash.\n- A future Step 4 test of a newly created stable-ID Recent song will separately validate the normal `recentVisible:true` path.\n- The live verifier itself performed 0 writes/deletes and 0 Rules/Functions/Hosting deploys. Temporary 2-A4c write/preflight/source-inspection/live-verification workflows were removed immediately after verification.\n- 2-A4c is complete. Next write stage is 2-A4d bounded live-gap catch-up, which must receive a separate exact approval after a new quota gate and exact eligible-write count.\n- Full detail: `docs/SORIDRAW_BACKEND_V2_STEP2_A4C_PREVIEW_SHADOW_MIRROR_RESULT.md`.\n\n'''
          if '### 2-A4c complete — Preview V1-first -> V2 shadow mirror activated and live-verified\n' not in text:
              if section_anchor not in text:
                  raise SystemExit('Master 2-A4c section anchor mismatch')
              text = text.replace(section_anchor, section + section_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -q '2-A4c Preview shadow-mirror result' docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          grep -q '### 2-A4c complete' docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md

      - name: Commit final docs and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/backend-v2-step2a4c-docs-finalize.yml
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git commit -m "docs: finalize Step 2-A4c live verification"
          git push origin HEAD:preview
