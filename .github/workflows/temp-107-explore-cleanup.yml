name: TEMP 107 Final Cleanup

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-107-explore-cleanup.trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Remove generated dist and temporary 107 machinery
        shell: bash
        run: |
          set -euo pipefail
          base='742e349307534e85da7ecca300c97e65a301ad80'
          mapfile -t added_dist < <(git diff --name-only --diff-filter=A "$base"..HEAD -- dist)
          if ((${#added_dist[@]})); then
            git rm -- "${added_dist[@]}"
          fi
          git rm .deploy/temp-apply-107-explore-cleanup.py
          git rm .deploy/temp-107-explore-cleanup.trigger
          git rm .github/workflows/temp-107-explore-cleanup.yml

      - name: Verify final source tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/services/exploreLikeDisplayStateService.ts
          test -e scripts/verify-107-explore-direct-count-zero-read.mjs
          test "$(node -e "process.stdout.write(String(require('./public/app-version.json').version))")" = '107'
          git diff --cached --name-only | tee /tmp/cleanup.txt
          if grep -E '^(src/|public/app-version.json$|cloudflare/|functions/)' /tmp/cleanup.txt; then
            echo 'Final cleanup unexpectedly changes product/runtime source' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: clean temporary 107 release files'
          git push origin HEAD:preview
          echo "FINAL_107_CLEAN_HEAD=$(git rev-parse HEAD)"
