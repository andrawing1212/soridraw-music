name: SORIDRAW Follow 031 Persistent Cooldown Regression
on:
  pull_request:
    branches: [preview]
    paths:
      - 'src/services/exploreFollowBatchService380.ts'
      - 'src/pages/ExplorePage.tsx'
      - 'scripts/verify-031-follow-cooldown.mjs'
      - 'cloudflare/explore-worker/runtime/owner-follow-recovery-556.mjs'
      - 'scripts/verify-556-owner-replay-reservation.mjs'
      - 'scripts/verify-560-owner-follow-full-isolated.mjs'
      - 'scripts/verify-561-owner-cost-reuse.mjs'
      - '.github/workflows/follow-031-owner-readonly.yml'
permissions:
  contents: read
jobs:
  follow-cooldown:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify terminal rejected unfollow restores baseline, pending state is explicit
        run: |
          set -euo pipefail
          node --check scripts/verify-031-follow-cooldown.mjs
          node scripts/verify-031-follow-cooldown.mjs
          node scripts/verify-030-follow-race.mjs
          node scripts/verify-556-owner-replay-reservation.mjs
          node scripts/verify-561-owner-cost-reuse.mjs
          npm ci --no-audit --no-fund
          node --no-warnings scripts/verify-560-owner-follow-full-isolated.mjs
          echo 'FOLLOW_031_SOURCE_ONLY_NO_D1_OR_HOSTING_CHANGE=PASS'
