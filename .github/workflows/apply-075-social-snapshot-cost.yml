name: Apply 075 Social Snapshot Cost Structure

on:
  push:
    branches: [work/social-snapshot-075-v2]
    paths:
      - '.deploy/apply-075-social-snapshot-cost.py'
      - '.github/workflows/apply-075-social-snapshot-cost.yml'
      - 'scripts/verify-075-social-snapshot-cost.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-075-social-snapshot-cost
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/social-snapshot-075-v2
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted 075 client changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/apply-075-social-snapshot-cost.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/services/exploreSocialService.ts')
          text = path.read_text(encoding='utf-8')
          old = "rawUids.reduce((acc: Record<string, boolean>, value: unknown) => {"
          new = "rawUids.reduce<Record<string, boolean>>((acc, value: unknown) => {"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('075 follow reducer type contract missing')
          PY

      - name: Apply UID-scoped like sync event guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          like_path = Path('src/services/exploreLikeService.ts')
          like = like_path.read_text(encoding='utf-8')
          marker = '// SORIDRAW_EXPLORE_UID_SCOPED_SYNC_EVENT_075_20260913'
          if marker not in like:
              like = replace_once(like,
                  '// SORIDRAW_EXPLORE_SOCIAL_SNAPSHOT_075_20260913\nconst EXPLORE_LIKE_CACHE_SCHEMA_VERSION',
                  '// SORIDRAW_EXPLORE_SOCIAL_SNAPSHOT_075_20260913\n' + marker + '\nconst EXPLORE_LIKE_CACHE_SCHEMA_VERSION',
                  'like marker')
              like = replace_once(like,
                  'type ExploreLikeSyncEventDetail = {\n  trackId: string;',
                  'type ExploreLikeSyncEventDetail = {\n  uid: string;\n  trackId: string;',
                  'like event uid type')
              like = replace_once(like,
                  'patches.forEach((patch) => dispatchLikeSync({\n      trackId: patch.trackId,',
                  'patches.forEach((patch) => dispatchLikeSync({\n      uid,\n      trackId: patch.trackId,',
                  'replay uid')
              like = replace_once(like,
                  'dispatchLikeSync({\n      trackId: result.trackId,\n      ownerUid: result.ownerUid,',
                  'dispatchLikeSync({\n      uid: user.uid,\n      trackId: result.trackId,\n      ownerUid: result.ownerUid,',
                  'account signal uid')
              like = replace_once(like,
                  'dispatchLikeSync({\n        ...visibleResult,\n        ownerUid,\n      });',
                  'dispatchLikeSync({\n        uid,\n        ...visibleResult,\n        ownerUid,\n      });',
                  'flush uid')
              like = replace_once(like,
                  'dispatchLikeSyncError({\n        trackId: firstPending.trackId,',
                  'dispatchLikeSyncError({\n        uid,\n        trackId: firstPending.trackId,',
                  'sync error uid')
              like_path.write_text(like, encoding='utf-8')

          page_path = Path('src/pages/ExplorePage.tsx')
          page = page_path.read_text(encoding='utf-8')
          page_marker = '// SORIDRAW_EXPLORE_UID_SCOPED_SYNC_EVENT_075_20260913'
          if page_marker not in page:
              page = replace_once(page,
                  '// SORIDRAW_EXPLORE_UID_SCOPED_LIKE_OVERLAY_075_20260913\n// Forced like-count recovery',
                  '// SORIDRAW_EXPLORE_UID_SCOPED_LIKE_OVERLAY_075_20260913\n' + page_marker + '\n// Forced like-count recovery',
                  'page marker')
              page = replace_once(page,
                  "  useEffect(() => onAuthStateChanged(auth, (currentUser) => {\n    setUser(currentUser);\n    likeHydrationKeyRef.current = '';\n    if (!currentUser) setLikedTrackIds({});\n  }), []);",
                  "  useEffect(() => onAuthStateChanged(auth, (currentUser) => {\n    setUser(currentUser);\n    likeHydrationKeyRef.current = '';\n    setLikedTrackIds({});\n  }), []);",
                  'auth switch clear')
              page = replace_once(page,
                  '      const detail = (event as CustomEvent<{\n        trackId?: string;',
                  '      const detail = (event as CustomEvent<{\n        uid?: string;\n        trackId?: string;',
                  'sync detail uid type')
              page = replace_once(page,
                  "      }>).detail;\n      const trackId = String(detail?.trackId || '').trim();\n      if (!trackId || typeof detail?.liked !== 'boolean') return;",
                  "      }>).detail;\n      if (!user?.uid || String(detail?.uid || '').trim() !== user.uid) return;\n      const trackId = String(detail?.trackId || '').trim();\n      if (!trackId || typeof detail?.liked !== 'boolean') return;",
                  'sync uid guard')
              page = replace_once(page,
                  "    const onLikeSyncError = (event: Event) => {\n      const detail = (event as CustomEvent<{ message?: string }>).detail;\n      setSocialNotice(String(detail?.message || '좋아요 서버 동기화를 재시도하고 있어요.'));\n    };",
                  "    const onLikeSyncError = (event: Event) => {\n      const detail = (event as CustomEvent<{ uid?: string; message?: string }>).detail;\n      if (!user?.uid || String(detail?.uid || '').trim() !== user.uid) return;\n      setSocialNotice(String(detail?.message || '좋아요 서버 동기화를 재시도하고 있어요.'));\n    };",
                  'sync error uid guard')
              page_path.write_text(page, encoding='utf-8')
          print('UID_SCOPED_LIKE_SYNC_EVENT=PASS')
          PY

      - name: Verify 075 Worker patch against canonical 041 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/worker075"
          mkdir -p "$RUNNER_TEMP/worker075"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/worker075/worker.js"
          (
            cd cloudflare/explore-worker
            SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/worker075" node patches/042-social-snapshot-write-compaction.mjs
          )
          node --check "$RUNNER_TEMP/worker075/worker.js"
          grep -Fq 'SORIDRAW_EXPLORE_SOCIAL_SNAPSHOT_WRITE_COMPACTION_042_20260913' "$RUNNER_TEMP/worker075/worker.js"
          grep -Fq 'SORIDRAW_EXPLORE_SOCIAL_SNAPSHOT_USER_QUEUE_042_20260913' "$RUNNER_TEMP/worker075/worker.js"
          grep -Fq '/v1/me/social-snapshot' "$RUNNER_TEMP/worker075/worker.js"
          grep -Fq 'enqueueExploreLikeUserQueue075' "$RUNNER_TEMP/worker075/worker.js"
          grep -Fq 'idleWriteZero: true' "$RUNNER_TEMP/worker075/worker.js"
          grep -Fq 'snapshotItem: feedItem' "$RUNNER_TEMP/worker075/worker.js"
          echo 'WORKER_042_STATIC=PASS'

      - name: Verify additive 075 D1 schema
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/social075.sqlite"
          sqlite3 "$db" < cloudflare/explore-worker/scripts/fixtures/canonical-schema.sql
          sqlite3 "$db" < cloudflare/explore-worker/migrations/20260913_01_explore_like_user_queue.sql
          sqlite3 "$db" "SELECT name FROM sqlite_schema WHERE type='table' AND name IN ('explore_like_user_queue_075','explore_like_user_queue_state_075') ORDER BY name;" > "$RUNNER_TEMP/social075.tables"
          grep -Fq 'explore_like_user_queue_075' "$RUNNER_TEMP/social075.tables"
          grep -Fq 'explore_like_user_queue_state_075' "$RUNNER_TEMP/social075.tables"
          test "$(sqlite3 "$db" 'SELECT COUNT(*) FROM explore_like_user_queue_state_075 WHERE id=1;')" = 1
          echo 'D1_075_ADDITIVE_SCHEMA=PASS'

      - name: Verify structural cost and reversal behavior
        run: python3 scripts/verify-075-social-snapshot-cost.py

      - name: Verify client contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SORIDRAW_EXPLORE_PERSONAL_SOCIAL_SNAPSHOT_075_20260913' src/services/exploreSocialSnapshotService.ts
          grep -Fq 'getExplorePersonalSocialSnapshot(user)' src/services/exploreLikeService.ts
          grep -Fq 'getExplorePersonalSocialSnapshot(user)' src/services/exploreSocialService.ts
          grep -Fq 'displayLikeCount: clampLikeCount(result.displayLikeCount)' src/services/exploreLikeService.ts
          grep -Fq 'SORIDRAW_EXPLORE_UID_SCOPED_LIKE_OVERLAY_075_20260913' src/pages/ExplorePage.tsx
          grep -Fq 'SORIDRAW_EXPLORE_UID_SCOPED_SYNC_EVENT_075_20260913' src/pages/ExplorePage.tsx
          grep -Fq 'SORIDRAW_EXPLORE_UID_SCOPED_SYNC_EVENT_075_20260913' src/services/exploreLikeService.ts
          grep -Fq 'uid: user.uid' src/services/exploreLikeService.ts
          grep -Fq "String(detail?.uid || '').trim() !== user.uid" src/pages/ExplorePage.tsx
          ! grep -Fq 'patchExploreFeedSessionCacheRow(requestUrl, track.id, { likeCount: result.likeCount });' src/pages/ExplorePage.tsx
          ! grep -Fq 'patchExploreFeedSessionCacheRow(requestUrl, trackId, { likeCount: nextCount });' src/pages/ExplorePage.tsx
          grep -Fq 'SORIDRAW_EXPLORE_TARGETED_PUBLICATION_CACHE_075_20260913' src/services/explorePublicationService.ts
          grep -Fq 'upsertExploreFeedSessionCacheRow(trackId' src/services/explorePublicationService.ts
          grep -Fq 'removeExploreFeedSessionCacheRow(resolvedTrackId)' src/services/explorePublicationService.ts
          grep -Fq 'patchExploreFeedSessionCachesRow(normalizedTrackId, nextOptions)' src/services/explorePublicationService.ts
          echo 'CLIENT_075_STATIC=PASS'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify change boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/pages/ExplorePage\.tsx|src/services/exploreLikeService\.ts|src/services/exploreSocialService\.ts|src/services/explorePublicationService\.ts|src/services/exploreSessionCache\.ts|src/services/exploreProfileFirstViewService\.ts)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected generated changes:'
            echo "$bad"
            exit 1
          fi
          echo 'NO_UI_CSS_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
          echo 'NO_FIREBASE_FUNCTIONS_CHANGE=true'
          echo 'NO_FIRESTORE_RULES_CHANGE=true'

      - name: Commit applied work branch source
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            src/pages/ExplorePage.tsx
            src/services/exploreLikeService.ts
            src/services/exploreSocialService.ts
            src/services/explorePublicationService.ts
            src/services/exploreSessionCache.ts
            src/services/exploreProfileFirstViewService.ts
          )
          if git diff --quiet -- "${tracked[@]}"; then
            echo '075 client changes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${tracked[@]}"
          git commit -m 'fix: scope like sync events to active uid'
          git push origin HEAD:work/social-snapshot-075-v2
