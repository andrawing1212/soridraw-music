name: Apply 103 Explore Like Event Batch

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-103-explore-like-event-batch.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-103-explore-like-event-batch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare 103 event-driven product source
        run: python3 .deploy/apply-103-explore-like-event-batch.py

      - name: Verify 102 + 103 Explore contracts
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-102-explore-public-like-parity.mjs
          node scripts/verify-103-explore-like-event-batch.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          echo 'CANONICAL_102_WORKER_UNCHANGED=PASS'

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Wrangler dry-run with Durable Object
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js deploy --config canonical/wrangler.preview.jsonc --dry-run
          echo 'DURABLE_OBJECT_DRY_RUN=PASS'

      - name: Verify product change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/services/exploreRevisionRequestCache\.ts|public/app-version\.json|cloudflare/explore-worker/canonical/preview-entry\.js|cloudflare/explore-worker/canonical/wrangler\.preview\.jsonc)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected product changes:'
            echo "$bad"
            exit 1
          fi
          echo 'NO_FIREBASE_FUNCTIONS_CHANGE=true'
          echo 'NO_FIRESTORE_RULES_CHANGE=true'
          echo 'NO_RTDB_RULES_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
          echo 'NO_UI_CSS_CHANGE=true'
          echo 'NO_DEPLOYMENT=true'

      - name: Commit PREVIEW 103 product source
        id: product
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            src/services/exploreRevisionRequestCache.ts
            public/app-version.json
            cloudflare/explore-worker/canonical/preview-entry.js
            cloudflare/explore-worker/canonical/wrangler.preview.jsonc
          )
          if git diff --quiet -- "${tracked[@]}"; then
            echo '103 product already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${tracked[@]}"
            git commit -m 'feat: batch Explore public likes on demand every five minutes'
            git push origin HEAD:preview
          fi
          product_sha="$(git rev-parse HEAD)"
          echo "sha=$product_sha" >> "$GITHUB_OUTPUT"
          echo "PRODUCT_SHA=$product_sha"

      - name: Update permanent release state
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/apply-103-explore-like-event-batch.py --docs '${{ steps.product.outputs.sha }}'
          git diff --check
          if git diff --quiet -- DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md; then
            echo '103 docs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md
          git commit -m 'docs: record 103 event-driven like batch candidate'
          git push origin HEAD:preview

      - name: Final summary
        run: |
          echo '103_SOURCE_APPLY=PASS'
          echo 'NO_DEPLOYMENT=true'
          echo 'TEST_PRODUCTION_UNCHANGED=true'
