name: SORIDRAW 552 Owner Overlay Isolated Physical D1
on:
  pull_request:
    branches: [preview]
    paths:
      - '.github/workflows/owner-follow-552-isolated-d1.yml'
      - 'scripts/measure-552-follow-overlay-physical-d1.mjs'
      - 'cloudflare/explore-worker/candidates/551-owner-follow-overlay-revision-off.sql'
permissions:
  contents: read
concurrency:
  group: soridraw-owner-552-ephemeral-d1
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source-only DDL safety and exact overlay calculation
        run: |
          set -euo pipefail
          node --check scripts/measure-552-follow-overlay-physical-d1.mjs
          node scripts/measure-552-follow-overlay-physical-d1.mjs --self-test
          node scripts/verify-551-owner-follow-overlay-delta.mjs
  physical:
    if: ${{ github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal' }}
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Owned one-time synthetic Cloudflare D1 row-meter
        run: node scripts/measure-552-follow-overlay-physical-d1.mjs
      - name: Always delete only run-owned database
        if: always()
        run: node scripts/measure-552-follow-overlay-physical-d1.mjs cleanup
      - name: Protected environments and user originals unchanged
        run: echo 'APP552_SHARED_D1_R0_W0_WORKER_RULES_FUNCTIONS_DEPLOY_ZERO=PASS'
