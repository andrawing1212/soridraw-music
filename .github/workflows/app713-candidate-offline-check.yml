name: APP713 isolated non-deployed follow intent tests
on:
  push:
    branches: [fix/app713-server-owned-follow]
    paths: ['.github/workflows/app713-candidate-offline-check.yml', 'cloudflare/explore-worker/runtime/owner-follow-*.mjs', 'scripts/verify-713-*.mjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run pure queue and authenticated ingress checks
        run: |
          node scripts/verify-713-follow-server-intent.mjs
          node scripts/verify-713-follow-click-ingress.mjs
