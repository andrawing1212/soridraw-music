name: Firebase Realtime Database Rules Deploy

on:
  issues:
    types: [opened]

concurrency:
  group: firebase-realtime-rules-deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-realtime-rules:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'DEPLOY FIREBASE REALTIME RULES 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.34.0

      - name: Deploy Realtime Database rules only
        id: deploy
        shell: bash
        run: |
          set +e
          firebase deploy \
            --only database \
            --project soridraw-app-866a5 \
            --non-interactive 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 60 deploy.log > deploy-tail.log
          exit 0

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        shell: bash
        run: |
          if [ "$EXIT_CODE" = "0" ]; then
            status=success
          else
            status=failure
          fi
          {
            echo "REALTIME_RULES_DEPLOY_RESULT status=${status} run_id=${RUN_ID}"
            echo
            echo '```text'
            cat deploy-tail.log 2>/dev/null || true
            echo '```'
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file comment.md
          if [ "$EXIT_CODE" != "0" ]; then
            exit "$EXIT_CODE"
          fi
