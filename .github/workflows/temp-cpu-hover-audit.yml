name: TEMP CPU Hover Audit
on:
  push:
    branches: [preview-cpu-hover-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect tooltip and card render lifecycle
        shell: bash
        run: |
          set -euo pipefail
          echo '=== App tooltip close / placement effects ==='
          sed -n '8040,8110p' src/App.tsx
          echo '=== App tooltip render ==='
          sed -n '18815,18885p' src/App.tsx
          echo '=== Favorites card render hover area ==='
          sed -n '6150,6485p' src/pages/FavoritesPage.tsx
          echo '=== Favorites list map / key / motion context ==='
          sed -n '6030,6225p' src/pages/FavoritesPage.tsx
          echo '=== Library card render hover area ==='
          sed -n '7140,7665p' src/pages/SunoLibraryPage.tsx
          echo '=== Animation presence / motion counts ==='
          for f in src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx; do
            echo "--- $f"
            printf 'AnimatePresence='; grep -c 'AnimatePresence' "$f" || true
            printf 'motion.='; grep -o 'motion\.[A-Za-z]*' "$f" | wc -l || true
            printf 'key={='; grep -c 'key={' "$f" || true
          done
          echo '=== Stable height use sites ==='
          grep -RIn 'useStableContentHeight' src/App.tsx src/pages src/components | head -n 200 || true
          echo '=== per-card Date.now hover IDs ==='
          grep -nE 'onMouseEnter.*Date\.now|onMouseMove.*setState|onPointerMove.*setState' src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx | head -n 240 || true
