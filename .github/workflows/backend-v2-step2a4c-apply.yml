name: SORIDRAW Backend V2 Step 2-A4c Apply

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4c-apply.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-backend-v2-step2a4c-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Apply 2-A4c Preview-only shadow mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          boundary = r'''// Backend V2 Step 2-A4c
// Central boundary for EXISTING V1 Recent/Music Note mutations.
// V1 stays authoritative. The registered Preview shadow hook is invoked only AFTER
// a V1 mutation resolves successfully, and hook failures never change V1 success.

import type { V2LiveMirrorOperation } from './v2LiveMutation';

export const BACKEND_V2_V1_MUTATION_MIRROR_ENABLED = true as const;

export type V1MutationDomain = 'recent' | 'musicNote';

export type V1RecentMutationOperation =
  | 'clear'
  | 'delete-item'
  | 'save-batch'
  | 'regenerate'
  | 'add-lyrics-language'
  | 'edit'
  | 'pre-favorite-edit';

export type V1MusicNoteMutationOperation =
  | 'save'
  | 'restore'
  | 'unsave'
  | 'permanent-delete'
  | 'update'
  | 'recovery-update'
  | 'bulk-delete'
  | 'bulk-lock'
  | 'bulk-unlock'
  | 'folder-update'
  | 'shared-note-save'
  | 'folder-rename'
  | 'folder-delete'
  | 'color-sync';

export type V1MutationOperation = V1RecentMutationOperation | V1MusicNoteMutationOperation;

export interface V1MutationMirrorTarget {
  targetSongId: string;
  operation: V2LiveMirrorOperation;
  sourceUpdatedAtMs: number;
  /** Exact V1 favorite document id when known. Never a cross-domain identity proof. */
  sourceDocumentId?: string;
}

export interface V1MutationBoundaryContext {
  domain: V1MutationDomain;
  operation: V1MutationOperation;
  uid: string;
  /** Existing V1 document IDs when already known. Never used as cross-domain identity proof. */
  documentIds?: readonly string[];
  /** Number of V1 content documents affected by this logical mutation. */
  affectedCount?: number;
  /** Stable-ID targets only. Payload is deliberately excluded and re-read from V1 after success. */
  mirrorTargets?: readonly V1MutationMirrorTarget[];
}

export type V1MutationWrite<T> = Promise<T> | (() => Promise<T>);
export type V1MutationPostSuccessHook = (
  context: Readonly<V1MutationBoundaryContext>,
  result: unknown,
) => void | Promise<void>;

let postSuccessHook: V1MutationPostSuccessHook | null = null;

export const registerV1MutationPostSuccessHook = (hook: V1MutationPostSuccessHook | null): void => {
  postSuccessHook = hook;
};

/**
 * V1-first boundary.
 * - V1 write is awaited exactly as before.
 * - only after V1 succeeds is the optional Preview mirror hook scheduled.
 * - the hook is best-effort and cannot reject/rollback the successful V1 mutation.
 * - V1 failure never invokes the mirror hook.
 */
export async function runV1MutationBoundary<T>(
  context: Readonly<V1MutationBoundaryContext>,
  writeV1: V1MutationWrite<T>,
): Promise<T> {
  const pending = typeof writeV1 === 'function' ? writeV1() : writeV1;
  const result = await pending;
  const hook = postSuccessHook;
  if (hook) {
    try {
      Promise.resolve(hook(context, result)).catch((error) => {
        console.warn('[Backend V2 2-A4c] Preview shadow mirror failed after V1 success.', error);
      });
    } catch (error) {
      console.warn('[Backend V2 2-A4c] Preview shadow mirror hook failed after V1 success.', error);
    }
  }
  return result;
}
'''
          Path('src/data/v1MutationBoundary.ts').write_text(boundary, encoding='utf-8')

          outbox_path = Path('src/data/indexedDbMirrorOutbox.ts')
          outbox = outbox_path.read_text(encoding='utf-8')
          outbox = outbox.replace(
              "export type V2MirrorOutboxRecord = V2MirrorMutationEnvelope & {\n  attemptCount: number;",
              "export type V2MirrorOutboxRecord = V2MirrorMutationEnvelope & {\n  /** Exact V1 favorite document id for bounded payload re-read; never song identity. */\n  sourceDocumentId?: string;\n  attemptCount: number;",
              1,
          )
          outbox = outbox.replace(
              "  async enqueue(input: V2MirrorMutationEnvelope): Promise<boolean> {",
              "  async enqueue(input: V2MirrorMutationEnvelope & { sourceDocumentId?: string }): Promise<boolean> {",
              1,
          )
          outbox = outbox.replace(
              "      const record: V2MirrorOutboxRecord = {\n        ...validated,\n        attemptCount: 0,",
              "      const sourceDocumentId = input.sourceDocumentId ? requireSegment(input.sourceDocumentId, 'sourceDocumentId') : undefined;\n      const record: V2MirrorOutboxRecord = {\n        ...validated,\n        ...(sourceDocumentId ? { sourceDocumentId } : {}),\n        attemptCount: 0,",
              1,
          )
          if "sourceDocumentId?: string" not in outbox:
              raise SystemExit('outbox sourceDocumentId patch failed')
          outbox_path.write_text(outbox, encoding='utf-8')

          mirror = r'''/*
 * SORIDRAW Backend V2 Step 2-A4c — Preview-only V1-first shadow mirror.
 *
 * SAFETY CONTRACT
 * - Activates only on the exact preview branch alias.
 * - V1 mutation must already have succeeded before this module receives work.
 * - Mirrors only explicit stable `sd_...` targets or newly saved Music Note docs carrying one.
 * - Historical positional `v1r_...` identities are never accepted as live targets.
 * - No V1 delete, no Functions/Hosting/Rules deploy, no startup Firestore collection scan.
 * - Durable IndexedDB outbox contains metadata/source locator only, never creative payload or secrets.
 * - Retry is bounded (max 6) with backoff; stale/duplicate mutations cannot overwrite newer V2 state.
 */

import { onAuthStateChanged } from 'firebase/auth';
import { doc, getDoc, runTransaction } from 'firebase/firestore';
import { auth, db } from '../firebase';
import { backendV2MirrorOutbox, type V2MirrorOutboxRecord } from './indexedDbMirrorOutbox';
import {
  compareV2MirrorVersion,
  createV2MirrorMutationEnvelope,
  isSoridrawSongId,
  type V2LiveMirrorOperation,
} from './v2LiveMutation';
import {
  registerV1MutationPostSuccessHook,
  type V1MutationBoundaryContext,
  type V1MutationMirrorTarget,
} from './v1MutationBoundary';

export const BACKEND_V2_PREVIEW_SHADOW_HOST = 'soridraw-music-git-preview-andrawing1212.vercel.app';
export const BACKEND_V2_PREVIEW_SHADOW_MAX_TARGETS_PER_MUTATION = 10;
export const BACKEND_V2_PREVIEW_SHADOW_RETRY_BATCH = 3;

const isPreviewShadowHost = (): boolean => (
  typeof window !== 'undefined'
  && window.location.hostname.toLowerCase() === BACKEND_V2_PREVIEW_SHADOW_HOST
);

export const BACKEND_V2_PREVIEW_SHADOW_MIRROR_RUNTIME_ENABLED = isPreviewShadowHost();

const retryTimers = new Map<string, number>();
const activeRetryUsers = new Set<string>();

const reservedPayloadKeys = new Set([
  'schemaVersion', 'musicNote', 'recentVisible', 'v2UpdatedAtMs', 'v2MutationId',
  'legacyRecentIndex', 'legacyFavoriteId', 'legacyFavoriteKey',
  'googleGeminiApiKey', 'geminiApiKey', 'apiKey', 'accessToken', 'idToken',
  'refreshToken', 'authorization', 'password', 'secret',
]);

const sanitizeMirrorPayload = (value: unknown): unknown => {
  if (Array.isArray(value)) return value.map(sanitizeMirrorPayload);
  if (!value || typeof value !== 'object') return value;
  const proto = Object.getPrototypeOf(value);
  if (proto !== Object.prototype && proto !== null) return value;
  const out: Record<string, unknown> = {};
  for (const [key, nested] of Object.entries(value as Record<string, unknown>)) {
    if (reservedPayloadKeys.has(key) || nested === undefined) continue;
    out[key] = sanitizeMirrorPayload(nested);
  }
  return out;
};

const getActiveMusicNoteState = (payload: Record<string, unknown> | null): boolean => {
  if (!payload) return false;
  return payload.saved !== false && payload.favoriteRemoved !== true;
};

const loadRecentPayload = async (uid: string, targetSongId: string): Promise<Record<string, unknown> | null> => {
  const snapshot = await getDoc(doc(db, 'user_recent_songs', uid));
  if (!snapshot.exists()) return null;
  const songs = Array.isArray(snapshot.data()?.songs) ? snapshot.data().songs : [];
  const found = songs.find((song: any) => String(song?.soridrawSongId || '').trim() === targetSongId);
  return found && typeof found === 'object' ? found as Record<string, unknown> : null;
};

const loadFavoritePayload = async (
  uid: string,
  sourceDocumentId: string,
  targetSongId?: string,
): Promise<Record<string, unknown> | null> => {
  const snapshot = await getDoc(doc(db, 'favorites', sourceDocumentId));
  if (!snapshot.exists()) return null;
  const data = snapshot.data() as Record<string, unknown>;
  if (String(data.uid || '') !== uid) return null;
  const stableId = String(data.soridrawSongId || '').trim();
  if (!isSoridrawSongId(stableId)) return null;
  if (targetSongId && stableId !== targetSongId) return null;
  return data;
};

const buildV2Patch = (
  record: V2MirrorOutboxRecord,
  payload: Record<string, unknown> | null,
  current: Record<string, unknown> | null,
): Record<string, unknown> => {
  const safePayload = payload ? sanitizeMirrorPayload(payload) as Record<string, unknown> : {};
  let recentVisible = current?.recentVisible === true;
  let musicNote = current?.musicNote === true;

  if (record.source === 'recent') {
    if (record.operation === 'recent-hide') recentVisible = false;
    else if (record.operation === 'upsert') recentVisible = true;
  }
  if (record.source === 'musicNote') {
    if (record.operation === 'music-note-save') musicNote = true;
    else if (record.operation === 'music-note-unsave') musicNote = false;
    else if (record.operation === 'upsert') musicNote = getActiveMusicNoteState(payload);
  }

  return {
    ...safePayload,
    soridrawSongId: record.targetSongId,
    schemaVersion: 2,
    musicNote,
    recentVisible,
    v2UpdatedAtMs: record.sourceUpdatedAtMs,
    v2MutationId: record.mutationId,
  };
};

const attemptMirror = async (
  record: V2MirrorOutboxRecord,
  cachedPayload?: Record<string, unknown> | null,
): Promise<'applied' | 'terminal' | 'failed'> => {
  try {
    let payload = cachedPayload;
    if (payload === undefined) {
      if (record.source === 'recent') {
        if (record.operation === 'recent-hide') payload = null;
        else payload = await loadRecentPayload(record.uid, record.targetSongId);
      } else if (record.source === 'musicNote') {
        if (!record.sourceDocumentId) return 'terminal';
        payload = await loadFavoritePayload(record.uid, record.sourceDocumentId, record.targetSongId);
      }
    }

    // A stale save/update retry must not resurrect an item that is no longer authoritative in V1.
    if (!payload && (record.operation === 'upsert' || record.operation === 'music-note-save')) {
      return 'terminal';
    }

    const targetRef = doc(db, 'users', record.uid, 'songs', record.targetSongId);
    const result = await runTransaction(db, async (transaction) => {
      const currentSnapshot = await transaction.get(targetRef);
      const current = currentSnapshot.exists() ? currentSnapshot.data() as Record<string, unknown> : null;
      if (current) {
        const decision = compareV2MirrorVersion(
          { sourceUpdatedAtMs: record.sourceUpdatedAtMs, mutationId: record.mutationId },
          {
            sourceUpdatedAtMs: Number(current.v2UpdatedAtMs || 0),
            mutationId: String(current.v2MutationId || ''),
          },
        );
        if (decision === 'duplicate' || decision === 'stale') return decision;
      }
      transaction.set(targetRef, buildV2Patch(record, payload ?? null, current), { merge: true });
      return 'applied' as const;
    });
    return result === 'applied' ? 'applied' : 'terminal';
  } catch (error) {
    console.warn('[Backend V2 2-A4c] shadow write attempt failed; V1 remains authoritative.', error);
    return 'failed';
  }
};

const scheduleNextRetry = async (uid: string): Promise<void> => {
  if (!BACKEND_V2_PREVIEW_SHADOW_MIRROR_RUNTIME_ENABLED || !uid) return;
  const existingTimer = retryTimers.get(uid);
  if (existingTimer !== undefined && typeof window !== 'undefined') window.clearTimeout(existingTimer);
  retryTimers.delete(uid);
  const pending = await backendV2MirrorOutbox.listPending(uid, {
    readyAtMs: Number.MAX_SAFE_INTEGER,
    limit: 1,
  });
  const next = pending[0];
  if (!next || next.status !== 'pending' || typeof window === 'undefined') return;
  const delay = Math.max(250, Math.min(300_000, next.nextAttemptAtMs - Date.now()));
  const timer = window.setTimeout(() => {
    retryTimers.delete(uid);
    void processPendingOutbox(uid);
  }, delay);
  retryTimers.set(uid, timer);
};

const finalizeAttempt = async (
  record: V2MirrorOutboxRecord,
  outcome: 'applied' | 'terminal' | 'failed',
): Promise<void> => {
  if (outcome === 'applied' || outcome === 'terminal') {
    await backendV2MirrorOutbox.remove(record.mutationId);
    return;
  }
  await backendV2MirrorOutbox.recordFailedAttempt(record.mutationId, Date.now());
};

async function processPendingOutbox(uid: string): Promise<void> {
  if (!BACKEND_V2_PREVIEW_SHADOW_MIRROR_RUNTIME_ENABLED || !uid || activeRetryUsers.has(uid)) return;
  activeRetryUsers.add(uid);
  try {
    const ready = await backendV2MirrorOutbox.listPending(uid, {
      readyAtMs: Date.now(),
      limit: BACKEND_V2_PREVIEW_SHADOW_RETRY_BATCH,
    });
    for (const record of ready) {
      const outcome = await attemptMirror(record);
      await finalizeAttempt(record, outcome);
    }
  } finally {
    activeRetryUsers.delete(uid);
    await scheduleNextRetry(uid);
  }
}

const enqueueAndAttempt = async (
  envelopeInput: {
    uid: string;
    source: 'recent' | 'musicNote';
    operation: V2LiveMirrorOperation;
    targetSongId: string;
    sourceUpdatedAtMs: number;
    sourceDocumentId?: string;
  },
  cachedPayload?: Record<string, unknown> | null,
): Promise<void> => {
  if (!isSoridrawSongId(envelopeInput.targetSongId)) return;
  const envelope = createV2MirrorMutationEnvelope({
    uid: envelopeInput.uid,
    targetKind: 'soridraw',
    targetSongId: envelopeInput.targetSongId,
    source: envelopeInput.source,
    operation: envelopeInput.operation,
    sourceUpdatedAtMs: envelopeInput.sourceUpdatedAtMs,
    enqueuedAtMs: Date.now(),
  });
  const queued = await backendV2MirrorOutbox.enqueue({
    ...envelope,
    ...(envelopeInput.sourceDocumentId ? { sourceDocumentId: envelopeInput.sourceDocumentId } : {}),
  });
  if (!queued) {
    console.warn('[Backend V2 2-A4c] durable outbox unavailable/full; skipping V2 write and keeping V1 authoritative.');
    return;
  }
  const record = await backendV2MirrorOutbox.get(envelope.mutationId);
  if (!record) return;
  const outcome = await attemptMirror(record, cachedPayload);
  await finalizeAttempt(record, outcome);
  await scheduleNextRetry(record.uid);
};

const normalizeExplicitTargets = (context: Readonly<V1MutationBoundaryContext>): V1MutationMirrorTarget[] => {
  const seen = new Set<string>();
  const out: V1MutationMirrorTarget[] = [];
  for (const target of context.mirrorTargets || []) {
    const id = String(target?.targetSongId || '').trim();
    if (!isSoridrawSongId(id) || seen.has(id)) continue;
    seen.add(id);
    out.push({ ...target, targetSongId: id });
    if (out.length >= BACKEND_V2_PREVIEW_SHADOW_MAX_TARGETS_PER_MUTATION) break;
  }
  return out;
};

const mirrorExplicitRecentTargets = async (
  context: Readonly<V1MutationBoundaryContext>,
  targets: V1MutationMirrorTarget[],
): Promise<void> => {
  const needsPayload = targets.some((target) => target.operation !== 'recent-hide');
  let recentSongs = new Map<string, Record<string, unknown>>();
  if (needsPayload) {
    const snapshot = await getDoc(doc(db, 'user_recent_songs', context.uid));
    const songs = snapshot.exists() && Array.isArray(snapshot.data()?.songs) ? snapshot.data().songs : [];
    recentSongs = new Map(
      songs
        .filter((song: any) => isSoridrawSongId(String(song?.soridrawSongId || '').trim()))
        .map((song: any) => [String(song.soridrawSongId).trim(), song as Record<string, unknown>]),
    );
  }
  for (const target of targets) {
    const payload = target.operation === 'recent-hide' ? null : (recentSongs.get(target.targetSongId) ?? null);
    await enqueueAndAttempt({
      uid: context.uid,
      source: 'recent',
      operation: target.operation,
      targetSongId: target.targetSongId,
      sourceUpdatedAtMs: target.sourceUpdatedAtMs,
    }, payload);
  }
};

const getResultDocumentId = (result: unknown): string | null => {
  if (!result || typeof result !== 'object') return null;
  const id = String((result as { id?: unknown }).id || '').trim();
  return id || null;
};

const mapMusicNoteOperation = (
  operation: V1MutationBoundaryContext['operation'],
  payload: Record<string, unknown> | null,
): V2LiveMirrorOperation | null => {
  if (operation === 'save' || operation === 'restore') return 'music-note-save';
  if (operation === 'unsave' || operation === 'permanent-delete') return 'music-note-unsave';
  if (operation === 'update' || operation === 'recovery-update') {
    return payload && getActiveMusicNoteState(payload) ? 'upsert' : 'music-note-unsave';
  }
  return null;
};

const mirrorMusicNoteMutation = async (
  context: Readonly<V1MutationBoundaryContext>,
  result: unknown,
  explicitTargets: V1MutationMirrorTarget[],
): Promise<void> => {
  // Bulk operations are intentionally V1-only in 2-A4c; their bounded catch-up belongs to 2-A4d.
  if (String(context.operation).startsWith('bulk-')) return;

  if (context.operation === 'permanent-delete' && explicitTargets.length) {
    for (const target of explicitTargets) {
      await enqueueAndAttempt({
        uid: context.uid,
        source: 'musicNote',
        operation: 'music-note-unsave',
        targetSongId: target.targetSongId,
        sourceUpdatedAtMs: target.sourceUpdatedAtMs,
        sourceDocumentId: target.sourceDocumentId,
      }, null);
    }
    return;
  }

  const ids = [...(context.documentIds || [])];
  if (context.operation === 'save') {
    const resultId = getResultDocumentId(result);
    if (resultId) ids.push(resultId);
  }
  const uniqueIds = [...new Set(ids.map((id) => String(id || '').trim()).filter(Boolean))]
    .slice(0, BACKEND_V2_PREVIEW_SHADOW_MAX_TARGETS_PER_MUTATION);

  for (const sourceDocumentId of uniqueIds) {
    const payload = await loadFavoritePayload(context.uid, sourceDocumentId);
    if (!payload) continue;
    const targetSongId = String(payload.soridrawSongId || '').trim();
    if (!isSoridrawSongId(targetSongId)) continue; // legacy favorite remains V1 fallback
    const operation = mapMusicNoteOperation(context.operation, payload);
    if (!operation) continue;
    await enqueueAndAttempt({
      uid: context.uid,
      source: 'musicNote',
      operation,
      targetSongId,
      sourceUpdatedAtMs: Date.now(),
      sourceDocumentId,
    }, payload);
  }
};

const handleV1Success = async (
  context: Readonly<V1MutationBoundaryContext>,
  result: unknown,
): Promise<void> => {
  if (!BACKEND_V2_PREVIEW_SHADOW_MIRROR_RUNTIME_ENABLED) return;
  const uid = String(context.uid || '').trim();
  if (!uid) return;
  const explicitTargets = normalizeExplicitTargets(context);
  if (context.domain === 'recent') {
    if (explicitTargets.length) await mirrorExplicitRecentTargets(context, explicitTargets);
  } else if (context.domain === 'musicNote') {
    await mirrorMusicNoteMutation(context, result, explicitTargets);
  }
  // Also drain at most three older ready mutations for this user; never scan Firestore collections.
  await processPendingOutbox(uid);
};

if (BACKEND_V2_PREVIEW_SHADOW_MIRROR_RUNTIME_ENABLED) {
  registerV1MutationPostSuccessHook(handleV1Success);
  onAuthStateChanged(auth, (user) => {
    if (user?.uid) void processPendingOutbox(user.uid);
  });
  if (typeof window !== 'undefined') {
    window.addEventListener('online', () => {
      const uid = auth.currentUser?.uid;
      if (uid) void processPendingOutbox(uid);
    });
  }
}
'''
          Path('src/data/v2PreviewShadowMirror.ts').write_text(mirror, encoding='utf-8')

          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global app
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              app = app.replace(old, new, 1)

          replace_once(
              "import { runV1MutationBoundary } from './data/v1MutationBoundary';",
              "import { runV1MutationBoundary, type V1MutationMirrorTarget } from './data/v1MutationBoundary';\nimport './data/v2PreviewShadowMirror';\nimport { createSoridrawSongId, isSoridrawSongId } from './data/v2LiveMutation';",
              'imports',
          )

          helper_anchor = "const RAP_APP_CHECK_RECAPTCHA_SITE_KEY = import.meta.env.VITE_RAP_APP_CHECK_RECAPTCHA_SITE_KEY?.trim() || '';"
          helper = r'''const getLiveSoridrawSongId = (song: any): string | null => {
  const value = String(song?.soridrawSongId || '').trim();
  return isSoridrawSongId(value) ? value : null;
};

const ensureLiveSoridrawSongId = <T extends Record<string, any>>(song: T): T => {
  if (!song || typeof song !== 'object') return song;
  if (getLiveSoridrawSongId(song)) return song;
  const soridrawSongId = createSoridrawSongId();
  try {
    (song as any).soridrawSongId = soridrawSongId;
    return song;
  } catch {
    return { ...song, soridrawSongId };
  }
};

const buildRecentMirrorTargets = (
  songs: readonly any[],
  operation: 'upsert' | 'recent-hide',
  sourceUpdatedAtMs = Date.now(),
): V1MutationMirrorTarget[] => {
  const seen = new Set<string>();
  const targets: V1MutationMirrorTarget[] = [];
  for (const song of songs || []) {
    const targetSongId = getLiveSoridrawSongId(song);
    if (!targetSongId || seen.has(targetSongId)) continue;
    seen.add(targetSongId);
    targets.push({ targetSongId, operation, sourceUpdatedAtMs });
    if (targets.length >= 10) break;
  }
  return targets;
};

'''
          replace_once(helper_anchor, helper + helper_anchor, 'helper insertion')

          # New Music Note saves receive one immutable provider-neutral ID before authoritative V1 persistence.
          replace_once(
              "      const createdAtMs = Date.now();\n      const resolvedGenre = getResolvedGenre(song);\n      const favoritePayload = sanitizeForFirestore({\n        uid: user.uid,",
              "      const createdAtMs = Date.now();\n      song = ensureLiveSoridrawSongId(song as any) as SongResult;\n      const favoriteSoridrawSongId = getLiveSoridrawSongId(song);\n      const resolvedGenre = getResolvedGenre(song);\n      const favoritePayload = sanitizeForFirestore({\n        uid: user.uid,\n        soridrawSongId: favoriteSoridrawSongId,",
              'favorite stable id',
          )

          # Permanent-delete must carry the already-known stable ID because the V1 doc no longer exists after success.
          replace_once(
              "await runV1MutationBoundary({ domain: 'musicNote', operation: 'permanent-delete', uid: user.uid, documentIds: [existingFav.id], affectedCount: 1 }, deleteDoc(doc(db, 'favorites', existingFav.id)));",
              "await runV1MutationBoundary({ domain: 'musicNote', operation: 'permanent-delete', uid: user.uid, documentIds: [existingFav.id], affectedCount: 1, mirrorTargets: buildRecentMirrorTargets([existingFav], 'recent-hide').map((target) => ({ ...target, operation: 'music-note-unsave' as const, sourceDocumentId: existingFav.id })) }, deleteDoc(doc(db, 'favorites', existingFav.id)));",
              'favorite permanent delete mirror',
          )

          # Clear/reset: only stable-ID recent objects are mirrored; legacy position-addressed records remain V1 fallback.
          replace_once(
              "await runV1MutationBoundary({ domain: 'recent', operation: 'clear', uid: userRef.current.uid, affectedCount: 0 }, setDoc(ref, { songs: [] }, { merge: true }));",
              "await runV1MutationBoundary({ domain: 'recent', operation: 'clear', uid: userRef.current.uid, affectedCount: 0, mirrorTargets: buildRecentMirrorTargets(historyRef.current, 'recent-hide') }, setDoc(ref, { songs: [] }, { merge: true }));",
              'reset clear mirror',
