name: Firebase Hosting Custom Preview

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/firebase-hosting-custom-preview.yml'

permissions:
  contents: write

concurrency:
  group: firebase-hosting-custom-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20

      - name: Patch Music Note Studio Catalog entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          source = path.read_text(encoding='utf-8')
          old = """  useEffect(() => {
    const isMusicNoteRoute = location.pathname === '/history';
    if (!isMusicNoteRoute) {
      if (typeof window !== 'undefined') {
        (window as any).__soridrawMusicNotePageActive = false;
      }
      return;
    }

    if (typeof window !== 'undefined') {
      (window as any).__soridrawMusicNotePageActive = true;
      window.dispatchEvent(new Event('soridraw:music-note-bundle-page-entry'));
    }

    if (!new URLSearchParams(location.search).has('note')) {
      markCacheDiagnostic('musicNote', 'CACHE', 0);
    }

    return () => {
      if (typeof window !== 'undefined') {
        (window as any).__soridrawMusicNotePageActive = false;
      }
    };
  }, [location.pathname, location.search]);"""
          new = """  useEffect(() => {
    // 1050: HistoryRouteWrapper is mounted only while Music Note is visible.
    // Studio embeds it at /studio, so pathname === /history cannot gate Catalog entry.
    if (typeof window !== 'undefined') {
      (window as any).__soridrawMusicNotePageActive = true;
      window.dispatchEvent(new Event('soridraw:music-note-bundle-page-entry'));
    }

    if (!new URLSearchParams(location.search).has('note')) {
      markCacheDiagnostic('musicNote', 'CACHE', 0);
    }

    return () => {
      if (typeof window !== 'undefined') {
        (window as any).__soridrawMusicNotePageActive = false;
      }
    };
  }, [location.pathname, location.search]);"""
          if old not in source:
              raise SystemExit('1050 Music Note route-only gate anchor missing')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'pathname === /history cannot gate Catalog entry' src/App.tsx
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "src/App.tsx "

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build preview app
        run: npm run build

      - name: Commit runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add src/App.tsx
          git commit -m 'fix(preview): start Music Note Catalog in Studio workspace'
          git push origin HEAD:preview
          echo "1050_RUNTIME_COMMIT=$(git rev-parse HEAD)"

      - name: Authenticate Google Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot official production before preview deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"

      - name: Deploy Firebase preview only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo '1050_FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact deployed preview build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok=yes
                  echo "1050_EXACT_BUILD_PASS=$url"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify official production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          cmp "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '1050_PRODUCTION_UNCHANGED=PASS'
