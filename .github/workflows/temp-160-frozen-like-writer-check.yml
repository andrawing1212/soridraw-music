name: TEMP 160 Frozen Worker Like Writer Compatibility
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-160-frozen-like-writer-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: f7fc25d5452b3313efa3cca53c180c5494cc9837
          path: frozen-test
          fetch-depth: 1
          sparse-checkout: cloudflare/explore-worker/canonical/preview-worker.js
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: e994340f3c4f6ac97f444f1ddf13053d3faffa71
          path: frozen-production
          fetch-depth: 1
          sparse-checkout: cloudflare/explore-worker/canonical/preview-worker.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check exact branch source and isolated 073/074 portability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cloudflare/explore-worker/canonical/preview-worker.js)" = 9e0048ac0d2e3540707930786d531b9bca3bccb7
          test "$(git hash-object frozen-test/cloudflare/explore-worker/canonical/preview-worker.js)" = 04586a5f203227d5cb02581d13f78a43b95053ce
          test "$(git hash-object frozen-production/cloudflare/explore-worker/canonical/preview-worker.js)" = 14b3e4f3211ee7dfe1fcf9fcf10c935b6ce000f6
          for env_name in test production; do
            mkdir -p "$RUNNER_TEMP/portable-$env_name"
            cp "frozen-$env_name/cloudflare/explore-worker/canonical/preview-worker.js" "$RUNNER_TEMP/portable-$env_name/worker.js"
            for patch in 073-server-like-queue-order.mjs 074-personal-like-r2-cas.mjs; do
              SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/portable-$env_name" node "cloudflare/explore-worker/patches/$patch"
            done
            node --check "$RUNNER_TEMP/portable-$env_name/worker.js"
            SORIDRAW_VERIFY_PORTABLE=1 SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/portable-$env_name/worker.js" node scripts/verify-128-like-concurrency.mjs
            echo "FROZEN_${env_name^^}_COMPATIBLE_WRITER_DRY_RUN=PASS"
          done
          test "$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | cut -d' ' -f1)" = b170d05385c3096a98033675a9acbb63b40148bf782017c326845b7ea4c17813
          echo 'FROZEN_MAIN_PRODUCTION_SOURCE_UNCHANGED=PASS'
      - name: Preview candidate generation plus old and new regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/new-preview"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/new-preview/worker.js"
          for patch in 072-personal-like-r2-revision.mjs 073-server-like-queue-order.mjs 074-personal-like-r2-cas.mjs 075-targeted-canonical-like-read.mjs 076-like-canonical-settlement-gate.mjs 077-legacy-like-queue-guard.mjs; do
            SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/new-preview" node "cloudflare/explore-worker/patches/$patch"
          done
          node --check "$RUNNER_TEMP/new-preview/worker.js"
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/new-preview/worker.js" node scripts/verify-128-like-concurrency.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/new-preview/worker.js" node scripts/verify-129-like-legacy-repair-gate.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/new-preview/worker.js" node scripts/verify-130-like-settlement-gate.mjs
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/new-preview/worker.js" node scripts/verify-131-legacy-like-queue-guard.mjs
          node scripts/verify-127-atomic-personal-like.mjs
          node scripts/verify-126-explore-entry-like-count.mjs
          node scripts/verify-125-like-preservation.mjs
          node scripts/verify-124-mobile-shared-cache-repair.mjs
          node scripts/verify-123-shared-like-cache-repair.mjs
          node scripts/verify-110-explore-liked-public-count.mjs
      - name: TypeScript and Build
        run: |
          npm run lint
          npm run build
      - name: No deploy
        run: echo 'DRY_RUN_ONLY=PASS NO_DATA_WRITES=PASS NO_DEPLOY=PASS'
