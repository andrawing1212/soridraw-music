name: TEMP CPU Hover Audit
on:
  push:
    branches: [preview-cpu-hover-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect idle pointer paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== App pointer tracker + hover setter ==='
          sed -n '7440,7565p' src/App.tsx
          echo '=== App document pointer listener around 21916 ==='
          sed -n '21780,22020p' src/App.tsx
          echo '=== App document pointer listener around 25731 ==='
          sed -n '25570,25810p' src/App.tsx
          echo '=== App mousemove around 26234 ==='
          sed -n '26180,26265p' src/App.tsx
          echo '=== Lite Studio pointer handler ==='
          sed -n '2110,2245p' src/components/studio/LiteStudioSplitWorkspace.tsx
          echo '=== Library/Favorites window pointer listeners ==='
          sed -n '6460,6555p' src/pages/SunoLibraryPage.tsx
          sed -n '5610,5705p' src/pages/FavoritesPage.tsx
          echo '=== Studio hover CSS high-cost props ==='
          grep -nE ':hover|backdrop-filter|filter:|box-shadow|transition' src/components/studio/studioLayout.css | head -n 420 || true
