name: TEMP Promote Explore Session Like 094

on:
  push:
    branches:
      - 'tmp/explore-session-like-batch-20260915'
    paths:
      - '.github/workflows/temp-explore-like-session-diag.yml'

permissions:
  contents: write

jobs:
  promote-verified-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Lock PREVIEW baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ec11473fa0ed6e34d1da8da35d6c637e516cb4b6"
          echo "PREVIEW_BASE=$(git rev-parse HEAD)"
      - name: Apply verified product commit only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git fetch origin tmp/explore-session-like-batch-20260915
          git cherry-pick d09e9544c506816fffe8a565fd340dd399d8da4f
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' \
            scripts/verify-094-explore-session-like-batch.mjs \
            scripts/verify-explore-like-cost-optimization.mjs \
            src/components/explore/ExploreShell.tsx \
            src/pages/ExplorePage.tsx \
            src/services/exploreLikeDisplayStateService.ts \
            src/services/exploreLikeService.ts | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          ! printf '%s\n' "$changed" | grep -E '(^|/)(database\.rules\.json|firestore\.rules|functions/|cloudflare/)' || exit 1
          git diff --check HEAD^
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Like regression tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-094-explore-session-like-batch.mjs
          node scripts/verify-explore-like-cost-optimization.mjs
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
      - name: Push PREVIEW code only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview
          test "$(git rev-parse origin/preview)" = "ec11473fa0ed6e34d1da8da35d6c637e516cb4b6"
          git push origin HEAD:preview
          echo "PREVIEW_PRODUCT_COMMIT=$(git rev-parse HEAD)"
