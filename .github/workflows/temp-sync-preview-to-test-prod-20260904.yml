name: TEMP Sync exact PREVIEW to TEST and PRODUCTION 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-preview-to-test-prod-20260904.yml'

permissions:
  contents: read

concurrency:
  group: temp-sync-preview-to-test-prod-20260904
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOURCE_SHA: 6ff8e6d90d03e44f1580712d3093681860288e6e
      HOSTING_PROJECT: soridraw
      TEST_CUSTOM_HOST: test.soridraw.com
      TEST_WEB_HOST: soridraw-test.web.app
      TEST_FIREBASE_HOST: soridraw-test.firebaseapp.com
      PROD_CUSTOM_HOST: soridraw.com
      PROD_WEB_HOST: soridraw.web.app
      PROD_FIREBASE_HOST: soridraw.firebaseapp.com
      TEST_EXPLORE_ORIGIN: https://soridraw-explore-test.andrawing1212.workers.dev
      PROD_EXPLORE_ORIGIN: https://soridraw-explore-api.andrawing1212.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout exact approved PREVIEW source
        uses: actions/checkout@v4
        with:
          ref: 6ff8e6d90d03e44f1580712d3093681860288e6e
          fetch-depth: 1

      - name: Assert PREVIEW has not moved
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/preview | awk '{print $1}')"
          echo "EXPECTED_PREVIEW=$SOURCE_SHA"
          echo "CURRENT_PREVIEW=$remote"
          test "$remote" = "$SOURCE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build exact PREVIEW
        run: npm run build

      - name: Build shared Firebase Functions source for parity check only
        run: |
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          echo 'FUNCTIONS_SOURCE_BUILD=PASS'
          echo 'FUNCTIONS_DEPLOYED=NO_SHARED_BACKEND_ALREADY_USED_BY_ALL_HOSTS'

      - name: Verify environment routing source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "host === 'test.soridraw.com'" src/config/exploreEnvironment.ts
          grep -Fq 'https://soridraw-explore-test.andrawing1212.workers.dev' src/config/exploreEnvironment.ts
          grep -Fq 'https://soridraw-explore-api.andrawing1212.workers.dev' src/config/exploreEnvironment.ts
          grep -Fq '"site": "soridraw-test"' firebase.hosting-test.json
          echo 'ENV_ROUTING_SOURCE=PASS'

      - name: Authenticate Google and Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install pinned Wrangler and prepare latest Explore Worker source
        working-directory: cloudflare/explore-worker
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run cf:prepare
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('.remote-worker/wrangler.jsonc','utf8'));
          if (cfg.name !== 'soridraw-explore-api') throw new Error(`Unexpected production Worker name: ${cfg.name}`);
          if (!fs.readFileSync('.remote-worker/worker.js','utf8').includes('handlePublicProfileFirstViewSnapshot')) {
            throw new Error('Latest prepared Worker is missing first-view endpoint marker.');
          }
          console.log('PREPARED_WORKER_SOURCE=PASS');
          NODE

      - name: Build isolated TEST Worker config without touching D1/R2 data
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1.json"
          node - "$RUNNER_TEMP/d1.json" <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(raw) ? raw : (raw.result || []);
          const db = rows.find(x => x.name === 'soridraw-explore-test-db');
          const id = db && (db.uuid || db.id || db.database_id);
          if (!id) throw new Error('TEST D1 database not found.');
          const cfg = JSON.parse(fs.readFileSync('.remote-worker/wrangler.jsonc','utf8'));
          cfg.name = 'soridraw-explore-test';
          cfg.workers_dev = true;
          cfg.d1_databases = (cfg.d1_databases || []).map(x => x.binding === 'DB' ? {...x, database_name:'soridraw-explore-test-db', database_id:id} : x);
          cfg.r2_buckets = (cfg.r2_buckets || []).map(x => x.binding === 'PROFILE_MEDIA' ? {...x, bucket_name:'soridraw-profile-media-test'} : x);
          if (!cfg.d1_databases.some(x => x.binding === 'DB' && x.database_id === id)) throw new Error('TEST DB binding rewrite failed.');
          if (!cfg.r2_buckets.some(x => x.binding === 'PROFILE_MEDIA' && x.bucket_name === 'soridraw-profile-media-test')) throw new Error('TEST R2 binding rewrite failed.');
          fs.writeFileSync('.remote-worker/wrangler.test.release.jsonc', JSON.stringify(cfg,null,2)+'\n');
          console.log('TEST_WORKER_CONFIG=PASS');
          NODE
          npx wrangler r2 bucket info soridraw-profile-media-test --json >/dev/null

      - name: Read-only D1 schema parity guard
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "soridraw-explore-test-db .remote-worker/wrangler.test.release.jsonc TEST" \
            "soridraw-explore-db .remote-worker/wrangler.jsonc PROD"; do
            set -- $pair
            db="$1"; cfg="$2"; label="$3"
            npx wrangler d1 execute "$db" --remote --command "SELECT COUNT(*) AS n FROM sqlite_schema WHERE type='table' AND name='public_profile_first_views';" --json --config "$cfg" > "$RUNNER_TEMP/${label}.schema.json"
            node - "$RUNNER_TEMP/${label}.schema.json" "$label" <<'NODE'
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            const env = process.argv[3];
            const e = Array.isArray(raw) ? raw[0] : raw;
            const rows = e?.results || e?.result?.[0]?.results || [];
            if (Number(rows?.[0]?.n || 0) !== 1) throw new Error(`${env} first-view schema missing`);
            console.log(`${env}_D1_SCHEMA=PASS`);
          NODE
          done
          echo 'D1_WRITE=0'
          echo 'D1_MIGRATION=0'

      - name: Deploy latest PREVIEW Explore backend to TEST Worker
        working-directory: cloudflare/explore-worker
        run: npx wrangler deploy --strict --config .remote-worker/wrangler.test.release.jsonc

      - name: Smoke TEST Explore Worker and latest route
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/test-feed.json" -D "$RUNNER_TEMP/test-feed.headers" -w '%{http_code}' -H "Origin: https://$TEST_CUSTOM_HOST" "$TEST_EXPLORE_ORIGIN/v1/feed?sort=latest&limit=1")"
          allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' "$RUNNER_TEMP/test-feed.headers")"
          test "$code" = '200'
          test "$allow" = "https://$TEST_CUSTOM_HOST"
          route_code="$(curl -sS -o "$RUNNER_TEMP/test-first-view.json" -w '%{http_code}' -H "Origin: https://$TEST_CUSTOM_HOST" "$TEST_EXPLORE_ORIGIN/v1/profiles/__soridraw_release_probe_missing__/first-view?limit=1" || true)"
          test "$route_code" = '404'
          echo 'TEST_EXPLORE_BACKEND=PASS'

      - name: Deploy exact PREVIEW build to Firebase TEST Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$HOSTING_PROJECT" --config firebase.hosting-test.json --non-interactive
          echo 'TEST_HOSTING_DEPLOY=PASS'

      - name: Verify TEST live files exactly match PREVIEW build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for host in "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" "$TEST_CUSTOM_HOST"; do
            live="$RUNNER_TEMP/${host//./-}.html"
            curl -fsS --retry 8 --retry-delay 5 -H 'Cache-Control: no-cache' "https://$host/?release=$SOURCE_SHA" -o "$live"
            live_sha="$(sha256sum "$live" | awk '{print $1}')"
            echo "TEST $host local=$local_sha live=$live_sha"
            test "$live_sha" = "$local_sha"
          done
          echo 'TEST_EXACT_PREVIEW_ASSET=PASS'

      - name: Verify shared Firebase Functions backend from TEST origin
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://us-central1-soridraw-app-866a5.cloudfunctions.net/rescueSunoTrackAudio'
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: https://$TEST_CUSTOM_HOST" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' "$endpoint")"
          test "$code" = '200' || test "$code" = '204'
          echo 'TEST_SHARED_FIREBASE_BACKEND=PASS'

      - name: Deploy latest PREVIEW Explore backend to PRODUCTION Worker
        working-directory: cloudflare/explore-worker
        env:
          SORIDRAW_ALLOW_PRODUCTION_WORKER_DEPLOY: '1'
        run: npm run cf:deploy

      - name: Smoke PRODUCTION Explore Worker and latest route
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/prod-feed.json" -D "$RUNNER_TEMP/prod-feed.headers" -w '%{http_code}' -H "Origin: https://$PROD_CUSTOM_HOST" "$PROD_EXPLORE_ORIGIN/v1/feed?sort=latest&limit=1")"
          allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' "$RUNNER_TEMP/prod-feed.headers")"
          test "$code" = '200'
          test "$allow" = "https://$PROD_CUSTOM_HOST"
          route_code="$(curl -sS -o "$RUNNER_TEMP/prod-first-view.json" -w '%{http_code}' -H "Origin: https://$PROD_CUSTOM_HOST" "$PROD_EXPLORE_ORIGIN/v1/profiles/__soridraw_release_probe_missing__/first-view?limit=1" || true)"
          test "$route_code" = '404'
          echo 'PROD_EXPLORE_BACKEND=PASS'

      - name: Deploy exact PREVIEW build to Firebase PRODUCTION Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$HOSTING_PROJECT" --config firebase.json --non-interactive
          echo 'PROD_HOSTING_DEPLOY=PASS'

      - name: Verify PRODUCTION live files exactly match PREVIEW build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for host in "$PROD_WEB_HOST" "$PROD_FIREBASE_HOST" "$PROD_CUSTOM_HOST"; do
            live="$RUNNER_TEMP/${host//./-}.html"
            curl -fsS --retry 8 --retry-delay 5 -H 'Cache-Control: no-cache' "https://$host/?release=$SOURCE_SHA" -o "$live"
            live_sha="$(sha256sum "$live" | awk '{print $1}')"
            echo "PROD $host local=$local_sha live=$live_sha"
            test "$live_sha" = "$local_sha"
          done
          echo 'PRODUCTION_EXACT_PREVIEW_ASSET=PASS'

      - name: Verify shared Firebase Functions backend from PRODUCTION origin
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://us-central1-soridraw-app-866a5.cloudfunctions.net/rescueSunoTrackAudio'
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: https://$PROD_CUSTOM_HOST" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' "$endpoint")"
          test "$code" = '200' || test "$code" = '204'
          echo 'PRODUCTION_SHARED_FIREBASE_BACKEND=PASS'

      - name: Result
        run: |
          echo "SOURCE_PREVIEW_SHA=$SOURCE_SHA"
          echo 'TEST_HOSTING_EXACT_PREVIEW=true'
          echo 'PRODUCTION_HOSTING_EXACT_PREVIEW=true'
          echo 'TEST_EXPLORE_WORKER_CURRENT=true'
          echo 'PRODUCTION_EXPLORE_WORKER_CURRENT=true'
          echo 'FIREBASE_FUNCTIONS_SHARED_BACKEND_SMOKE=true'
          echo 'FUNCTIONS_REDEPLOY=false'
          echo 'FIRESTORE_RULES_REDEPLOY=false'
          echo 'D1_DATA_WRITE=false'
          echo 'R2_DATA_WRITE=false'
