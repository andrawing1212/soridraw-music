name: Diagnose master permissions detail once

on:
  push:
    branches: [main]
    paths:
      - .deploy/diagnose-master-permissions-detail-trigger.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect focused excerpts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          requests = {
            'src/App.tsx': [
              r'const \[userRole', r'setUserRole', r'cachedUserRoleHint', r'onSnapshot\(\s*doc\(db, [\'\"]users',
              r'isAdminMenuUser', r'Admin Routes', r'AdminUserManagementPageLazy', r'/admin/users', r'관리자 메뉴', r'admin/users'
            ],
            'src/pages/AdminUserManagementPage.tsx': [
              r'const \[editRole', r'usersWithAuth', r'selectedIsProtected', r'currentAdmin', r'executeUpdate', r'handleUpdateUser',
              r'ROLE_LABELS', r'export default function', r'<AdminPageLayout'
            ],
            'src/pages/AdminAppSettingsPage.tsx': [r'export default', r'AdminPageLayout'],
            'src/pages/AdminSunoApiPage.tsx': [r'export default', r'AdminPageLayout'],
            'src/pages/AdminGeminiAuditPage.tsx': [r'export default', r'AdminPageLayout'],
            'src/pages/AdminVocalTonesPage.tsx': [r'export default', r'AdminPageLayout'],
            'src/pages/AdminSectionTagsPage.tsx': [r'export default', r'AdminPageLayout'],
          }

          output=[]
          for filename, patterns in requests.items():
            output.append(f'\n===== {filename} =====')
            path=Path(filename)
            if not path.exists():
              output.append('MISSING')
              continue
            lines=path.read_text(encoding='utf-8').splitlines()
            regexes=[re.compile(p,re.I) for p in patterns]
            hits=[]
            for i,line in enumerate(lines,1):
              if any(rx.search(line) for rx in regexes): hits.append(i)
            ranges=[]
            for i in hits:
              start=max(1,i-35); end=min(len(lines),i+70)
              if not ranges or start>ranges[-1][1]+1:
                ranges.append([start,end])
              else:
                ranges[-1][1]=max(ranges[-1][1],end)
            for start,end in ranges:
              output.append(f'--- lines {start}-{end} ---')
              for n in range(start,end+1): output.append(f'{n}: {lines[n-1]}')
          Path('.deploy/master-permission-detail.txt').write_text('\n'.join(output)+'\n',encoding='utf-8')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/master-permission-detail.txt
          git commit -m "chore: report master permission implementation details"
          git push origin HEAD:main
