name: Cost Zero Profile Revision Deploy

on:
  push:
    branches: [preview]
    paths:
      - 'cloudflare/explore-worker/patches/007-profile-revision-revalidation.mjs'
      - '.github/workflows/cost-zero-stage2a-profile-revision-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cost-zero-profile-revision-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare exact live Worker plus revision patch
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          npm install --no-audit --no-fund
          npm run cf:prepare
          node --check .remote-worker/worker.js
          grep -Fq 'readPublicProfileFirstViewRevisionOnly' .remote-worker/worker.js
          grep -Fq 'makePublicProfileFirstViewNotModified' .remote-worker/worker.js
          grep -Fq 'knownRevision' .remote-worker/worker.js
          grep -Fq 'X-SORIDRAW-Profile-Revision' .remote-worker/worker.js
          grep -Fq 'soridraw-profile-' .remote-worker/worker.js
          echo 'PROFILE_REVISION_SOURCE_VALIDATION=PASS'

      - name: Deploy only prepared Explore Worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:deploy
          echo 'EXPLORE_WORKER_PROFILE_REVISION_DEPLOY=PASS'

      - name: Re-read deployed Worker and verify persisted revision path
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .remote-worker
          npm run cf:prepare
          node --check .remote-worker/worker.js
          grep -Fq 'readPublicProfileFirstViewRevisionOnly' .remote-worker/worker.js
          grep -Fq 'makePublicProfileFirstViewNotModified' .remote-worker/worker.js
          grep -Fq 'NOT_MODIFIED_D1_REVISION' .remote-worker/worker.js
          grep -Fq 'X-SORIDRAW-Profile-Revision' .remote-worker/worker.js
          echo 'LIVE_PROFILE_REVISION_SOURCE=PASS'

      - name: Verify 200 revision plus conditional 304 without writes
        shell: bash
        run: |
          set -euo pipefail
          base='https://soridraw-explore-api.andrawing1212.workers.dev'
          origin='https://preview.soridraw.com'
          curl -fsS --max-time 30 -o "$RUNNER_TEMP/feed.json" \
            -H "Origin: $origin" -H 'Accept: application/json' \
            "$base/v1/feed?sort=latest&limit=1"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/feed.json','utf8'));
          const row=p?.data?.items?.[0];
          const uid=String(row?.ownerUid||row?.owner_uid||'').trim();
          if(!uid) throw new Error('No public owner UID for revision probe');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/uid.txt',uid);
          NODE
          uid="$(cat "$RUNNER_TEMP/uid.txt")"
          url="$base/v1/profiles/$uid/first-view?limit=50"

          status="$(curl -sS --max-time 30 -D "$RUNNER_TEMP/full.headers" -o "$RUNNER_TEMP/full.json" -w '%{http_code}' \
            -H "Origin: $origin" -H 'Accept: application/json' "$url")"
          test "$status" = '200'
          grep -q '"ok":true' "$RUNNER_TEMP/full.json"
          revision="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-profile-revision:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/full.headers" | tail -n1)"
          etag="$(awk 'BEGIN{IGNORECASE=1}/^etag:/{gsub("\r",""); $1=""; sub(/^ /,""); print}' "$RUNNER_TEMP/full.headers" | tail -n1)"
          writes="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/full.headers" | tail -n1)"
          test -n "$revision"
          test -n "$etag"
          test "${writes:-0}" = '0'
          echo "PROFILE_FULL status=$status revision=$revision d1_write=${writes:-0}"

          : > "$RUNNER_TEMP/rev.body"
          status304="$(curl -sS --max-time 30 -D "$RUNNER_TEMP/rev.headers" -o "$RUNNER_TEMP/rev.body" -w '%{http_code}' \
            -H "Origin: $origin" -H 'Accept: application/json' \
            "$url&knownRevision=$revision")"
          test "$status304" = '304'
          test ! -s "$RUNNER_TEMP/rev.body"
          revision304="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-profile-revision:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/rev.headers" | tail -n1)"
          etag304="$(awk 'BEGIN{IGNORECASE=1}/^etag:/{gsub("\r",""); $1=""; sub(/^ /,""); print}' "$RUNNER_TEMP/rev.headers" | tail -n1)"
          reads304="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/rev.headers" | tail -n1)"
          writes304="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/rev.headers" | tail -n1)"
          validation="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-profile-validation:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/rev.headers" | tail -n1)"
          test "$revision304" = "$revision"
          test -n "$etag304"
          test "${writes304:-0}" = '0'
          test "${reads304:-0}" = '0' -o "${reads304:-0}" = '1'
          test -n "$validation"
          echo "PROFILE_REVISION_304 status=$status304 revision=$revision304 validation=$validation d1_read=${reads304:-0} d1_write=${writes304:-0} body_bytes=$(wc -c < "$RUNNER_TEMP/rev.body")"
          echo 'PROFILE_REVISION_304=PASS'

      - name: Verify legacy normal GET remains compatible for production origin
        shell: bash
        run: |
          set -euo pipefail
          base='https://soridraw-explore-api.andrawing1212.workers.dev'
          origin='https://soridraw.com'
          uid="$(cat "$RUNNER_TEMP/uid.txt")"
          status="$(curl -sS --max-time 30 -D "$RUNNER_TEMP/prod.headers" -o "$RUNNER_TEMP/prod.json" -w '%{http_code}' \
            -H "Origin: $origin" -H 'Accept: application/json' \
            "$base/v1/profiles/$uid/first-view?limit=50")"
          test "$status" = '200'
          grep -q '"ok":true' "$RUNNER_TEMP/prod.json"
          allow="$(awk 'BEGIN{IGNORECASE=1}/^access-control-allow-origin:/{gsub("\r",""); print $2}' "$RUNNER_TEMP/prod.headers" | tail -n1)"
          test "$allow" = "$origin"
          echo 'PRODUCTION_ORIGIN_BACKWARD_COMPAT=PASS'

      - name: Safety result
        run: |
          echo 'D1_SCHEMA_MIGRATION=false'
          echo 'D1_BACKFILL=false'
          echo 'D1_READ_PATH_WRITES=false'
          echo 'KV_ADDED=false'
          echo 'FIRESTORE_CHANGE=false'
          echo 'FIREBASE_FUNCTIONS_DEPLOY=false'
          echo 'MAIN_CHANGE=false'
