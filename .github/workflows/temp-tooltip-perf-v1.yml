name: TEMP Tooltip Perf V1
permissions:
  contents: read
on:
  push:
    branches: [preview-tooltip-perf-v1]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-tooltip-perf-v1
      - name: Show tooltip and CPU V2 blocks
        shell: bash
        run: |
          set -euo pipefail
          echo '=== tooltip state block ==='
          grep -n -A90 -B20 "SORIDRAW_STUDIO_IDLE_HOVER_STABILIZE_982" src/App.tsx | head -n 140
          echo '=== tooltip render block ==='
          grep -n -A100 -B10 "Tooltip / Description Overlay" src/App.tsx | head -n 140
          echo '=== CPU-only CSS block ==='
          grep -n -A45 -B5 "983 — CPU-only idle pointer budget" src/components/studio/liteSplitWorkspace.css | head -n 80
