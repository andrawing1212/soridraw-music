name: Diagnose header auth rendering 20260725

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'DIAGNOSE HEADER AUTH 20260725 0641B'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect exact App.tsx ranges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('src/App.tsx').read_text(encoding='utf-8').splitlines()
          ranges = [(3080,3445),(5250,5450),(5450,5630)]
          out=[]
          for start,end in ranges:
              out.append(f'=== lines {start}-{end} ===')
              for n in range(start,min(end,len(lines))+1):
                  out.append(f'{n}: {lines[n-1]}')
          Path('header-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Report excerpts
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          split -b 55000 -d header-diagnostic.txt chunk-
          for f in chunk-*; do
            {
              echo '```text'
              cat "$f"
              echo
              echo '```'
            } > body.md
            gh issue comment "$ISSUE_URL" --body-file body.md
          done
