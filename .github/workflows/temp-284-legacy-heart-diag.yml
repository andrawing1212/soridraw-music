name: SORIDRAW app284 Legacy Heart Read-only Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app284-legacy-heart-diag.trigger'
      - '.github/workflows/temp-284-legacy-heart-diag.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate read-only diagnostic
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Compare broken legacy song with a normal linked recent song
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const admin = require('firebase-admin');
          admin.initializeApp({
            projectId: 'soridraw-app-866a5',
            databaseURL: 'https://soridraw-app-866a5-default-rtdb.firebaseio.com',
          });
          const db = admin.firestore();
          const rtdb = admin.database();
          const TARGET = '스쳐간 이름 뒤에';
          const h = (v) => {
            const s = String(v || '').trim();
            return s ? crypto.createHash('sha256').update(s).digest('hex').slice(0, 12) : '';
          };
          const ms = (v) => {
            if (!v) return 0;
            if (typeof v.toMillis === 'function') return v.toMillis();
            if (typeof v.seconds === 'number') return v.seconds * 1000;
            if (typeof v === 'number' && Number.isFinite(v)) return Math.floor(v);
            return 0;
          };
          const gen = (x) => {
            const a = x?.appliedKeywords || {};
            const batch = String(a.generationBatchId || '').trim();
            const index = Math.floor(Number(a.generationIndex || 0));
            return batch && index > 0 ? `generation:${h(batch)}:${index}` : '';
          };
          const row = (label, x, docId='') => ({
            label,
            title: String(x?.title || x?.koreanTitle || ''),
            docIdHash: h(docId || x?.firestoreId || x?.id),
            sourceIdHash: h(x?.sourceId || x?.taskId || x?.id),
            createdAtMs: Number(x?.createdAtMs || 0) || ms(x?.createdAt),
            generationKey: gen(x),
            soridrawSongIdHash: h(x?.soridrawSongId),
            recentSongSyncKeyHash: h(x?.recentSongSyncKey),
            favoriteFirestoreIdHash: h(x?.favoriteFirestoreId),
            favoriteKeyHash: h(x?.favoriteKey),
            recentLegacySourceIdHash: h(x?.recentLegacySourceId),
            recentLegacyCreatedAtMs: Number(x?.recentLegacyCreatedAtMs || 0),
            healed: Number(x?.recentFavoriteIdentityHealedAt || 0) > 0,
            explicitlyUnsaved: Number(x?.recentFavoriteExplicitlyUnsavedAt || 0) > 0,
            saved: x?.saved === true,
            favoriteRemoved: x?.favoriteRemoved === true,
            hidden: x?.hidden === true || x?.favoriteHidden === true,
          });

          (async () => {
            const [byTitle, byKo] = await Promise.all([
              db.collection('favorites').where('title', '==', TARGET).limit(10).get(),
              db.collection('favorites').where('koreanTitle', '==', TARGET).limit(10).get(),
            ]);
            const favMap = new Map();
            for (const doc of [...byTitle.docs, ...byKo.docs]) favMap.set(doc.id, doc);
            const favDocs = [...favMap.values()];
            if (!favDocs.length) throw new Error('target favorite not found by exact title');

            const uids = [...new Set(favDocs.map(d => String(d.data()?.uid || '').trim()).filter(Boolean))];
            const reports = [];
            for (const uid of uids.slice(0, 4)) {
              const uidFavs = favDocs.filter(d => String(d.data()?.uid || '').trim() === uid);
              const recentSnap = await db.collection('user_recent_songs').doc(uid).get();
              const recentData = recentSnap.exists ? recentSnap.data() || {} : {};
              const songs = Array.isArray(recentData.songs) ? recentData.songs : [];
              const targetSongs = songs.filter(s => [s?.title,s?.koreanTitle,s?.englishTitle].some(v => String(v||'').trim() === TARGET));

              let normalSong = songs.find(s => {
                if ([s?.title,s?.koreanTitle,s?.englishTitle].some(v => String(v||'').trim() === TARGET)) return false;
                return Boolean(s?.favoriteFirestoreId && gen(s));
              }) || null;
              let normalFav = null;
              if (normalSong?.favoriteFirestoreId) {
                const n = await db.collection('favorites').doc(String(normalSong.favoriteFirestoreId)).get();
                if (n.exists) normalFav = n;
              }

              const signalSnap = await rtdb.ref(`userSync/${uid}/musicNote`).get();
              const signal = signalSnap.exists() ? signalSnap.val() || {} : {};
              let signalItem = null;
              try { signalItem = signal.itemJson ? JSON.parse(signal.itemJson) : null; } catch {}
              const signalItems = Array.isArray(signalItem) ? signalItem : signalItem ? [signalItem] : [];

              reports.push({
                uidHash: h(uid),
                targetFavoriteCount: uidFavs.length,
                targetFavorites: uidFavs.map(d => row('target-favorite', d.data() || {}, d.id)),
                recentDocExists: recentSnap.exists,
                recentSongCount: songs.length,
                targetRecentCount: targetSongs.length,
                targetRecent: targetSongs.map(s => row('target-recent', s)),
                normalPair: normalSong ? {
                  recent: row('normal-recent', normalSong),
                  favorite: normalFav ? row('normal-favorite', normalFav.data() || {}, normalFav.id) : null,
                } : null,
                latestMusicNoteSignal: {
                  version: Number(signal.version || 0),
                  operation: String(signal.operation || ''),
                  removed: signal.removed === true,
                  documentIdHashes: Array.isArray(signal.documentIds) ? signal.documentIds.map(h) : [],
                  itemCount: signalItems.length,
                  items: signalItems.map(x => row('signal-item', x || {})),
                },
              });
            }

            console.log(JSON.stringify({
              diagnostic: 'app284-legacy-heart-readonly',
              targetTitle: TARGET,
              safety: {
                firestoreWrites: 0,
                firestoreDeletes: 0,
                rtdbWrites: 0,
                userIdsPrinted: false,
                rawDocumentIdsPrinted: false,
                maxTargetFavoriteReads: 20,
                exactRecentDocReadsPerCandidateUid: 1,
                exactNormalFavoriteReadPerCandidateUid: 1,
                exactRtdbSignalReadPerCandidateUid: 1,
              },
              reports,
            }, null, 2));
            await admin.app().delete();
          })().catch(async err => {
            console.error(err?.stack || err);
            try { await admin.app().delete(); } catch {}
            process.exit(1);
          });
          NODE
