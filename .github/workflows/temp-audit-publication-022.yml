name: SORIDRAW Audit Publication 022 PREVIEW

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read active Worker and best-effort D1 trigger schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit022
          node <<'NODE'
          const fs = require('fs');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER,DB=process.env.PREVIEW_DB_ID;
          const headers={Authorization:`Bearer ${T}`,'Content-Type':'application/json'};
          async function json(url,init={}){const r=await fetch(url,{...init,headers:{...headers,...(init.headers||{})}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,1000)}`);return x.result||x;}
          async function active(){const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;const ds=await json(base+'/deployments');const d=(ds.deployments||ds||[])[0];const a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage||0)-Number(x.percentage||0))[0];if(!a?.version_id)throw new Error('active version missing');const v=await json(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${a.version_id}?include=modules`);const mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];if(!m?.content_base64)throw new Error('main module missing');fs.writeFileSync('audit022/worker.js',Buffer.from(m.content_base64,'base64'));fs.writeFileSync('audit022/version.txt',a.version_id);}
          async function query(sql,name){try{const x=await json(`https://api.cloudflare.com/client/v4/accounts/${A}/d1/database/${DB}/query`,{method:'POST',body:JSON.stringify({sql})});fs.writeFileSync(`audit022/${name}.json`,JSON.stringify(x,null,2));}catch(e){fs.writeFileSync(`audit022/${name}.error.txt`,String(e?.message||e));}}
          (async()=>{await active();await query("SELECT name, sql FROM sqlite_master WHERE type='trigger' AND tbl_name='tracks' ORDER BY name","track_triggers");await query("PRAGMA table_info(tracks)","tracks_columns");console.log('READ_ONLY_AUDIT_022=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_publication_audit_022
          path: audit022
          retention-days: 7
