name: TEMP 079 Publication Trigger Live Check

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-079-publication-trigger-live-check.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Inspect live publication-related triggers read-only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT name,tbl_name,sql FROM sqlite_schema WHERE type='trigger' AND tbl_name IN ('tracks','track_stats','explore_derived_tracks','public_profiles','profile_stats','explore_derived_profiles','follows') ORDER BY tbl_name,name;" --json > "$RUNNER_TEMP/triggers.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/triggers.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          const legacy=rows.filter(r=>String(r.name||'').startsWith('trg_music_note_publication_bundle_'));
          console.log('LEGACY_PUBLICATION_BUNDLE_TRIGGER_COUNT='+legacy.length);
          console.log('RELEVANT_TRIGGER_COUNT='+rows.length);
          for(const r of rows) {
            const sql=String(r.sql||'');
            const writes=(sql.match(/\b(?:INSERT|UPDATE|DELETE)\b/gi)||[]).length;
            console.log(`TRIGGER=${r.name} TABLE=${r.tbl_name} WRITE_STATEMENTS=${writes}`);
            if (r.tbl_name==='tracks' || r.name==='explore032_derived_track_update') console.log('SQL='+sql.replace(/\s+/g,' '));
          }
          console.log('LIVE_TRIGGER_READONLY_CHECK=PASS');
          NODE
