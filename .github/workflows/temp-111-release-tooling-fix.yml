name: TEMP 111 Release Tooling Fix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-111-release-tooling-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Replace obsolete like display verifier with current 111 guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cloudflare-explore-preview-release.yml')
          text = p.read_text(encoding='utf-8')
          old = '            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-like-cost-optimization.mjs\n'
          new = '            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-111-explore-profile-negative-cache.mjs\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete verifier line, got {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'verify-111-explore-profile-negative-cache.mjs' .github/workflows/cloudflare-explore-preview-release.yml
          ! grep -q 'verify-explore-like-cost-optimization.mjs' .github/workflows/cloudflare-explore-preview-release.yml
          git config user.name soridraw-release-bot
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/cloudflare-explore-preview-release.yml
          git commit -m 'ci: refresh PREVIEW Worker release verifiers'
          git push origin HEAD:preview
          echo "RELEASE_TOOLING_SHA=$(git rev-parse HEAD)"
