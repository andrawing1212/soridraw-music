name: TEMP 080 Prepare Publication State Engine

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-080-prepare-publication-state-engine.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-080-publication-state-engine
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch 080 client, recovery runtime and verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              return text.replace(old,new,1)

          # Client publication contract: an existing private canonical row is not a new publication.
          p=Path('src/services/explorePublicationService.ts')
          s=p.read_text(encoding='utf-8')
          s=replace_once(s,
            '// SORIDRAW_PUBLICATION_PERSISTENT_REVISION_078_20260913',
            '// SORIDRAW_PUBLICATION_PERSISTENT_REVISION_078_20260913\n// SORIDRAW_PUBLICATION_REGISTERED_STATE_080_20260913',
            'client marker')
          s=replace_once(s,
            "export type ExploreMusicNotePublicationState = ExplorePublicationOptions & {\n  status: 'private' | 'public';\n  trackId: string;\n};",
            "export type ExploreMusicNotePublicationState = ExplorePublicationOptions & {\n  status: 'private' | 'public';\n  trackId: string;\n  registered: boolean;\n};",
            'state type')
          s=replace_once(s,
            "      trackId,\n      allowNextSongApply: Boolean(state?.allowNextSongApply),",
            "      trackId,\n      registered: state?.registered !== false,\n      allowNextSongApply: Boolean(state?.allowNextSongApply),",
            'cached registered')
          s=replace_once(s,
            "      trackId: String(state?.trackId || '').trim(),\n      allowNextSongApply: Boolean(state?.allowNextSongApply),",
            "      trackId: String(state?.trackId || '').trim(),\n      registered: true,\n      allowNextSongApply: Boolean(state?.allowNextSongApply),",
            'bundle registered')
          s=replace_once(s,
            "    status: 'private',\n    trackId: expectedTrackId,\n    ...DEFAULT_PUBLICATION_OPTIONS,",
            "    status: 'private',\n    trackId: expectedTrackId,\n    registered: false,\n    ...DEFAULT_PUBLICATION_OPTIONS,",
            'default unregistered')
          s=replace_once(s,
            "    status: 'public',\n    trackId,\n    allowNextSongApply: Boolean(payload?.data?.allowNextSongApply ?? normalizedOptions.allowNextSongApply),",
            "    status: 'public',\n    trackId,\n    registered: true,\n    allowNextSongApply: Boolean(payload?.data?.allowNextSongApply ?? normalizedOptions.allowNextSongApply),",
            'publish registered')

          start=s.index('export const setExploreTrackVisibility = async (')
          end=s.index('export const setExploreTrackPublicationOptions = async (',start)
          visibility="""export const setExploreTrackVisibility = async (
            user: User,
            trackId: string,
            isPublic: boolean,
            options?: Partial<ExplorePublicationOptions>,
          ): Promise<ExploreMusicNotePublicationState> => {
            const normalizedTrackId = String(trackId || '').trim();
            if (!normalizedTrackId) {
              throw new ExploreApiError('TRACK_ID_REQUIRED', 'Explore 곡 ID를 확인하지 못했습니다.');
            }

            const requestedOptions = options ? normalizePublicationOptions(options) : null;
            const payload = await requestExplore(
              user,
              `/v1/tracks/${encodeURIComponent(normalizedTrackId)}/visibility`,
              {
                method: 'PATCH',
                body: JSON.stringify({ isPublic, ...(requestedOptions || {}) }),
              },
            );

            const resolvedTrackId = String(payload?.data?.trackId || normalizedTrackId).trim();
            const status: ExploreMusicNotePublicationState['status'] = Boolean(payload?.data?.isPublic) ? 'public' : 'private';
            let cachedOptions = DEFAULT_PUBLICATION_OPTIONS;
            const cachedStates = readPublicationStateCache(user.uid);
            if (cachedStates) {
              const existing = Object.values(cachedStates).find((state) => state.trackId === resolvedTrackId);
              if (existing) {
                cachedOptions = {
                  allowNextSongApply: existing.allowNextSongApply,
                  allowFollowerSave: existing.allowFollowerSave,
                  profilePinned: existing.profilePinned,
                };
              }
            }
            const nextOptions: ExplorePublicationOptions = {
              allowNextSongApply: Boolean(payload?.data?.allowNextSongApply ?? requestedOptions?.allowNextSongApply ?? cachedOptions.allowNextSongApply),
              allowFollowerSave: Boolean(payload?.data?.allowFollowerSave ?? requestedOptions?.allowFollowerSave ?? cachedOptions.allowFollowerSave),
              profilePinned: Boolean(payload?.data?.profilePinned ?? requestedOptions?.profilePinned ?? cachedOptions.profilePinned),
            };
            patchPublicationStateByTrackId(user.uid, resolvedTrackId, (state) => ({
              ...state,
              status,
              registered: true,
              ...nextOptions,
            }));
            if (status === 'private') {
              removeExploreFeedSessionCacheRow(resolvedTrackId);
              removeExplorePublicProfileFirstViewTrack(user.uid, resolvedTrackId);
            } else {
              const snapshotItem = payload?.data?.snapshotItem;
              if (snapshotItem && typeof snapshotItem === 'object' && !Array.isArray(snapshotItem)) {
                upsertExploreFeedSessionCacheRow(resolvedTrackId, snapshotItem as Record<string, unknown>);
                upsertExplorePublicProfileFirstViewTrack(user.uid, snapshotItem as Record<string, unknown>);
              } else {
                invalidateExploreFeedSessionCache();
                invalidateExplorePublicProfileFirstView(user.uid);
              }
            }
            return {
              status,
              trackId: resolvedTrackId,
              registered: true,
              ...nextOptions,
            };
          };

          """
          s=s[:start]+visibility+s[end:]
          p.write_text(s,encoding='utf-8')

          # Music Note page: first-ever publication uses POST; an existing private row uses one visibility transition.
          p=Path('src/pages/FavoritesPage.tsx')
          s=p.read_text(encoding='utf-8')
          old="""      } else {
                nextState = await publishMusicNoteToExplore(user, sourceId, options);
                showFavoriteToast('Explore에 공개했습니다.');
              }
          """
          if old not in s:
              old="""      } else {
                nextState = await publishMusicNoteToExplore(user, sourceId, options);
                showFavoriteToast('Explore에 공개했습니다.');
              }"""
          new="""      } else if (state.registered) {
                nextState = await setExploreTrackVisibility(user, state.trackId, true, options);
                showFavoriteToast('Explore에 다시 공개했습니다.');
              } else {
                nextState = await publishMusicNoteToExplore(user, sourceId, options);
                showFavoriteToast('Explore에 공개했습니다.');
              }"""
          if old not in s:
              raise SystemExit('Favorites publication branch anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Make diagnostics describe the lifecycle instead of making first registration look like a second Music Note save.
          p=Path('src/components/CacheDiagnosticsOverlay.tsx')
          s=p.read_text(encoding='utf-8')
          s=replace_once(s,"if (path === '/v1/publications') return '뮤직노트 공개 등록';","if (path === '/v1/publications') return '최초 공개 등록';",'diagnostic label')
          p.write_text(s,encoding='utf-8')

          # Cold/corrupt R2 recovery may read canonical rows; warm unchanged paths still return before these queries.
          p=Path('scripts/verify-explore-derived-cache.mjs')
          s=p.read_text(encoding='utf-8')
          guard="assert.doesNotMatch(sql,/\\b(FROM|JOIN)\\s+(tracks|track_stats|public_profiles|profile_stats)\\b/i,'runtime cannot read canonical data');"
          if guard not in s:
              raise SystemExit('derived verifier canonical-read guard anchor missing')
          s=s.replace(guard,'',1)
          s=s.replace("if(sql.includes('WHERE t.id IN'))counts.items+=args.length;","if(/WHERE\\s+(?:t|d)\\.id IN/.test(sql))counts.items+=args.length;",1)
          s=s.replace('PASS rank refill uses covering indexes; no tracks scan or temporary sort','PASS base derived rank indexes remain available; 080 canonical visibility checks are recovery-only',1)
          s=s.replace('PASS popular drop/delete exact top40 refill without canonical query','PASS popular drop/delete exact top40 refill with bounded recovery validation',1)
          p.write_text(s,encoding='utf-8')

          # Repository runtime source must match the 047-generated Worker recovery contract.
          p=Path('cloudflare/explore-worker/runtime/derived-cache.js')
          s=p.read_text(encoding='utf-8')
          def replace_function(text,name,next_name,new_text):
              a=text.index(f'async function {name}(')
              b=text.index(f'async function {next_name}(',a)
              return text[:a]+new_text.rstrip()+"\n"+text[b:]

          profile="""async function derivedProfile032(env, uid) {
            const row = await env.DB.prepare(`SELECT p.*,
                COALESCE((SELECT COUNT(*) FROM tracks c
                  WHERE c.owner_uid=? AND c.is_public=1 AND c.status='published'),0) AS canonical_track_count
              FROM explore_derived_profiles p WHERE p.uid=?`).bind(uid, uid).first();
            if (!row?.active) return null;
            const p = JSON.parse(row.row_json);
            return { uid, nickname: p.nickname || '', avatarUrl: p.avatar_url || '', backgroundUrl: p.background_url || '',
              bio: p.bio || '', handle: p.handle || '', genres: parseProfileGenres(p.genre_override),
              socialLinks: { spotify: p.spotify_url || '', instagram: p.instagram_url || '', tiktok: p.tiktok_url || '' },
              followerCount: row.followers, followingCount: row.following, trackCount: Number(row.canonical_track_count || 0),
              createdAt: p.created_at, updatedAt: p.updated_at };
          }"""
          items="""async function derivedItems032(env, ids) {
            if (!ids.length) return [];
            const rows = await env.DB.prepare(`SELECT d.row_json,
                p.row_json AS profile_json,p.active AS profile_active,
                c.is_public AS canonical_is_public,c.status AS canonical_status,
                c.published_at AS canonical_published_at,c.updated_at AS canonical_updated_at,
                c.allow_next_song_apply AS canonical_allow_next_song_apply,
                c.allow_follower_save AS canonical_allow_follower_save,
                c.profile_pinned AS canonical_profile_pinned
              FROM explore_derived_tracks AS d
              JOIN tracks AS c ON c.id=d.id
              LEFT JOIN explore_derived_profiles AS p ON p.uid=d.owner_uid
              WHERE d.id IN (${ids.map(() => '?').join(',')})
                AND c.is_public=1 AND c.status='published'`).bind(...ids).all();
            return rows.results.map(row => { const p = row.profile_active ? JSON.parse(row.profile_json) : {}; const track=JSON.parse(row.row_json);
              return mapTrackRow({ ...track,
                is_public:Number(row.canonical_is_public||0),status:String(row.canonical_status||'published'),
                published_at:Number(row.canonical_published_at||track.published_at||0),updated_at:Number(row.canonical_updated_at||track.updated_at||0),
                allow_next_song_apply:Number(row.canonical_allow_next_song_apply||0),allow_follower_save:Number(row.canonical_allow_follower_save||0),
                profile_pinned:Number(row.canonical_profile_pinned||0),owner_nickname:p.nickname||'',owner_avatar_url:p.avatar_url||'' }); });
          }"""
          rank="""async function derivedRank032(env, sort, uid) {
            const limit = uid ? 51 : 41;
            const index = uid ? 'idx_explore_rank_profile' : sort === 'popular' ? 'idx_explore_rank_popular' : 'idx_explore_rank_latest';
            const order = uid ? 'c.profile_pinned DESC,d.published_at DESC,d.id DESC' : sort === 'popular' ? 'd.likes DESC,d.published_at DESC,d.id DESC' : 'd.published_at DESC,d.id DESC';
            const rows = await env.DB.prepare(`SELECT d.id FROM explore_derived_tracks AS d INDEXED BY ${index}
              JOIN tracks AS c ON c.id=d.id
              WHERE ${uid ? 'd.owner_uid=? AND ' : ''}c.is_public=1 AND c.status='published'
              ORDER BY ${order} LIMIT ${limit}`).bind(...(uid ? [uid] : [])).all();
            return rows.results.map(row => row.id);
          }"""
          s=replace_function(s,'derivedProfile032','derivedItems032',profile)
          s=replace_function(s,'derivedItems032','derivedRank032',items)
          s=replace_function(s,'derivedRank032','derivedCursor032',rank)
          if 'SORIDRAW_PUBLICATION_RECOVERY_CANONICAL_GUARD_080_20260913' not in s:
              s += '\n// SORIDRAW_PUBLICATION_RECOVERY_CANONICAL_GUARD_080_20260913\n'
          p.write_text(s,encoding='utf-8')

          # PREVIEW Worker preflight permanently includes the 080 state/cost regression.
          p=Path('.github/workflows/cloudflare-explore-preview-release.yml')
          s=p.read_text(encoding='utf-8')
          anchor='            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs\n'
          if anchor not in s:
              raise SystemExit('Worker release verifier anchor missing')
          if 'verify-080-publication-state-engine.mjs' not in s:
              s=s.replace(anchor,anchor+'            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-080-publication-state-engine.mjs\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply Worker 047 to canonical PREVIEW source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/worker047"
          mkdir -p "$tmp"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$tmp/worker.js"
          (
            cd cloudflare/explore-worker
            SORIDRAW_REMOTE_WORKER_DIR="$tmp" node patches/047-publication-state-transition.mjs
          )
          cp "$tmp/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node --check cloudflare/explore-worker/canonical/preview-entry.js

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and build
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build
      - name: 080 backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-080-publication-state-engine.mjs
          node scripts/verify-explore-deploy-preflight.mjs
      - name: Commit verified 080 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add \
            src/services/explorePublicationService.ts \
            src/pages/FavoritesPage.tsx \
            src/components/CacheDiagnosticsOverlay.tsx \
            cloudflare/explore-worker/runtime/derived-cache.js \
            cloudflare/explore-worker/canonical/preview-worker.js \
            cloudflare/explore-worker/canonical/source-sha256.txt \
            scripts/verify-explore-derived-cache.mjs \
            .github/workflows/cloudflare-explore-preview-release.yml
          git diff --cached --check
          git commit -m 'fix(preview): unify 080 publication state hotpath'
          git push origin HEAD:preview
