name: APP758 owner-follow PROD scope and rollback preflight (GET-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/app758-production-owner-follow-readonly.mjs'
      - 'scripts/verify-758-production-owner-follow-readonly.mjs'
      - '.github/workflows/app758-production-owner-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/app758-production-owner-follow-readonly.mjs'
      - '.github/workflows/app758-production-owner-readonly.yml'
permissions:
  contents: read
concurrency:
  group: soridraw-app758-owner-production-readonly
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Strict HOLD, rollback and owner safety checks
        run: |
          set -euo pipefail
          node --check scripts/app758-production-owner-follow-readonly.mjs
          node scripts/verify-758-production-owner-follow-readonly.mjs
  live:
    if: github.repository == 'andrawing1212/soridraw-music' &&
        github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Pin main, preview and production branch heads without side effects
        run: |
          set -euo pipefail
          git fetch origin main preview production --no-tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          echo "APP758_PREVIEW_SHA=$(git rev-parse refs/remotes/origin/preview)" >> "$GITHUB_ENV"
          echo "APP758_PROD_SHA=$(git rev-parse refs/remotes/origin/production)" >> "$GITHUB_ENV"
      - name: Guard-only tests (never change resources)
        run: node scripts/verify-758-production-owner-follow-readonly.mjs
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
      - name: GET only production Explore, preview owner and three shared function revisions
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          FIREBASE_ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/production | cut -f1)" = "$APP758_PROD_SHA"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$APP758_PREVIEW_SHA"
          node scripts/app758-production-owner-follow-readonly.mjs
          echo 'APP758_GET_ONLY=PASS; TEST_PRODUCTION_DEPLOY=0; SHARED_DATA_WRITES=0'
