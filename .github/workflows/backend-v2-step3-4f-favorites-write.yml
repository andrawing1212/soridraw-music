name: SORIDRAW Backend V2 Step 3-4f Favorites Standalone Backfill

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4f-favorites-write.yml'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      EXPECTED_FAVORITES: '738'
      EXPECTED_RECENT_BUNDLES: '10'
      EXPECTED_RECENT_ITEMS: '68'
      MAX_WRITES: '738'
      BATCH_SIZE: '100'
      APPROVED_SCOPE: Step 3-4f Music Note/favorites 738 standalone limited Backfill approved 2026-08-26 KST

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - run: npm ci --ignore-scripts

      - name: Execute approved standalone favorite backfill
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$TARGET_PROJECT"
          export GCLOUD_PROJECT="$TARGET_PROJECT"
          export GOOGLE_CLOUD_QUOTA_PROJECT="$TARGET_PROJECT"
          node <<'NODE'
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = String(process.env.TARGET_PROJECT || '');
          const bucketName = String(process.env.TARGET_BUCKET || '');
          const backupPrefix = String(process.env.BACKUP_PREFIX || '');
          const expectedManifestHash = String(process.env.EXPECTED_MANIFEST_SHA256 || '');
          const expectedFavorites = Number(process.env.EXPECTED_FAVORITES || 0);
          const expectedRecentBundles = Number(process.env.EXPECTED_RECENT_BUNDLES || 0);
          const expectedRecentItems = Number(process.env.EXPECTED_RECENT_ITEMS || 0);
          const maxWrites = Number(process.env.MAX_WRITES || 0);
          const batchSize = Number(process.env.BATCH_SIZE || 0);
          const approvedScope = String(process.env.APPROVED_SCOPE || '');

          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          if (bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('BUCKET_PIN_MISMATCH');
          if (expectedFavorites !== 738 || maxWrites !== 738 || batchSize !== 100) throw new Error('APPROVED_WRITE_SCOPE_MISMATCH');
          if (expectedRecentBundles !== 10 || expectedRecentItems !== 68) throw new Error('RECENT_REFERENCE_SCOPE_MISMATCH');
          if (!approvedScope.includes('3-4f') || !approvedScope.includes('738') || !approvedScope.toLowerCase().includes('standalone')) throw new Error('EXPLICIT_WRITE_APPROVAL_MARKER_MISSING');

          const nonEmptyString = (value) => typeof value === 'string' && value.trim() ? value.trim() : null;
          const stableHash = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const deterministicFavoriteSongId = (path) => `v1f_${stableHash(path).slice(0, 32)}`;
          const deterministicRecentSongId = (uid, path, index) => `v1r_${stableHash(`${uid}\n${path}\n${index}`).slice(0, 32)}`;
          const reservedV2Fields = new Set(['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','legacyRecentIndex','legacyFavoriteId','legacyFavoriteKey']);

          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string', 'boolean'].includes(typeof value)) return value;
            if (typeof value === 'number') {
              if (Number.isNaN(value)) return { __type: 'number', value: 'NaN' };
              if (value === Infinity) return { __type: 'number', value: 'Infinity' };
              if (value === -Infinity) return { __type: 'number', value: '-Infinity' };
              if (Object.is(value, -0)) return { __type: 'number', value: '-0' };
              return value;
            }
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return { __type: 'bytes', base64: Buffer.from(value).toString('base64') };
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return { __type: 'date', iso: value.toISOString() };
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return { __type: 'timestamp', seconds: value.seconds, nanoseconds: value.nanoseconds };
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return { __type: 'geopoint', latitude: value.latitude, longitude: value.longitude };
            if (typeof value?.path === 'string' && value?.firestore) return { __type: 'reference', path: value.path };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));
            throw new Error('UNSUPPORTED_VALUE_TYPE');
          };
          const digest = (value) => stableHash(JSON.stringify(canonicalize(value)));

          const firstString = (record, keys) => {
            for (const key of keys) {
              const value = nonEmptyString(record?.[key]);
              if (value) return value;
            }
            return null;
          };
          const getProviderTrackIdentity = (payload) => {
            const provider = firstString(payload, ['provider', 'audioProvider', 'sourceProvider', 'musicProvider']);
            const trackId = firstString(payload, ['trackId', 'sourceTrackId', 'providerTrackId', 'sunoId']);
            return provider && trackId ? { provider: provider.toLowerCase(), trackId } : null;
          };
          const getAudioIdentity = (payload) => firstString(payload, ['audioUrl', 'audio_url', 'sourceAudioUrl', 'streamAudioUrl']);
          const classifyPair = (favorite, recent) => {
            const favoriteId = nonEmptyString(favorite.id);
            const recentId = nonEmptyString(recent.id);
            if (favoriteId && recentId && favoriteId === recentId) return 'explicit-id';
            const fp = getProviderTrackIdentity(favorite);
            const rp = getProviderTrackIdentity(recent);
            if (fp && rp && fp.provider === rp.provider && fp.trackId === rp.trackId) return 'provider-track';
            const fk = nonEmptyString(favorite.favoriteKey);
            const rk = nonEmptyString(recent.favoriteKey);
            const fa = getAudioIdentity(favorite);
            const ra = getAudioIdentity(recent);
            if (fk && rk && fk === rk && fa && ra && fa === ra) return 'legacy-key-audio';
            return null;
          };

          const metricValue = (point) => {
            const raw = point?.value?.int64Value ?? point?.value?.doubleValue ?? 0;
            const value = Number(raw);
            return Number.isFinite(value) && value > 0 ? value : 0;
          };
          const queryMetric = async (accessToken, metricType, startMs, endMs) => {
            const params = new URLSearchParams({
              filter: `metric.type = "${metricType}"`,
              'interval.startTime': new Date(startMs).toISOString(),
              'interval.endTime': new Date(endMs).toISOString(),
              view: 'FULL',
              pageSize: '1000',
            });
            let pageToken = '';
            let total = 0;
            let pointCount = 0;
            let pages = 0;
            do {
              if (pageToken) params.set('pageToken', pageToken); else params.delete('pageToken');
              const response = await fetch(`https://monitoring.googleapis.com/v3/projects/${projectId}/timeSeries?${params}`, {
                headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, Accept: 'application/json' },
              });
              const text = await response.text();
              if (!response.ok) {
                const error = new Error(`MONITORING_${response.status}`);
                error.statusCode = response.status;
                throw error;
              }
              const payload = text ? JSON.parse(text) : {};
              for (const series of payload.timeSeries || []) for (const point of series.points || []) { total += metricValue(point); pointCount += 1; }
              pageToken = String(payload.nextPageToken || '');
              if (++pages > 5) throw new Error('MONITORING_PAGINATION_LIMIT');
            } while (pageToken);
            return { total: Math.round(total), pointCount };
          };
          const queryFamily = async (accessToken, candidates, startMs, endMs) => {
            for (const metricType of candidates) {
              try {
                const result = await queryMetric(accessToken, metricType, startMs, endMs);
                if (result.pointCount > 0) return result.total;
              } catch (error) {
                if (error?.statusCode === 400 || error?.statusCode === 404) continue;
                throw error;
              }
            }
            return 0;
          };

          const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step34f-write-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const bucket = getStorage(app).bucket(bucketName);

            const credential = admin.credential.applicationDefault();
            const token = await credential.getAccessToken();
            const accessToken = String(token?.access_token || '');
            if (!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');

            const requiredPermissions = ['datastore.entities.get', 'datastore.entities.list', 'datastore.entities.create'];
            const iamResponse = await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify({ permissions: requiredPermissions }),
            });
            const iamText = await iamResponse.text();
            if (!iamResponse.ok) throw new Error(`IAM_TEST_${iamResponse.status}`);
            const granted = new Set((JSON.parse(iamText || '{}').permissions || []).map(String));
            if (requiredPermissions.some((permission) => !granted.has(permission))) throw new Error('REQUIRED_IAM_MISSING');

            const now = new Date();
            const kstDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
            const dayStartMs = Date.parse(`${kstDate}T00:00:00+09:00`);
            const [todayReads, todayWrites, todayDeletes] = await Promise.all([
              queryFamily(accessToken, ['firestore.googleapis.com/document/read_ops_count', 'firestore.googleapis.com/document/read_count'], dayStartMs, now.getTime()),
              queryFamily(accessToken, ['firestore.googleapis.com/document/write_ops_count', 'firestore.googleapis.com/document/write_count'], dayStartMs, now.getTime()),
              queryFamily(accessToken, ['firestore.googleapis.com/document/delete_ops_count', 'firestore.googleapis.com/document/delete_count'], dayStartMs, now.getTime()),
            ]);
            const safeReadCap = Math.min(10_000, Math.max(0, 50_000 - todayReads - 10_000));
            const safeWriteCap = Math.min(5_000, Math.max(0, 20_000 - todayWrites - 5_000));
            const estimatedReads = 4_000;
            if (safeReadCap < estimatedReads) throw new Error(`READ_QUOTA_PAUSE:${safeReadCap}`);
            if (safeWriteCap < maxWrites) throw new Error(`WRITE_QUOTA_PAUSE:${safeWriteCap}`);
            console.log('STEP34F_QUOTA=' + JSON.stringify({ todayReads, todayWrites, todayDeletes, safeReadCap, safeWriteCap, estimatedReads, approvedMaxWrites: maxWrites }));

            const [manifestBytes] = await bucket.file(`${backupPrefix}/manifest.json`).download();
            if (stableHash(manifestBytes) !== expectedManifestHash) throw new Error('ROLLBACK_MANIFEST_HASH_MISMATCH');
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            if (manifest?.complete !== true || manifest?.targetProjectId !== projectId) throw new Error('ROLLBACK_MANIFEST_INVALID');
            const favoriteDataset = (manifest.datasets || []).find((entry) => entry?.id === 'favorites');
            const recentDataset = (manifest.datasets || []).find((entry) => entry?.id === 'user_recent_songs');
            if (!favoriteDataset || favoriteDataset.documentCount !== expectedFavorites || favoriteDataset.fileName !== 'favorites.ndjson') throw new Error('BACKUP_FAVORITES_DATASET_INVALID');
            if (!recentDataset || recentDataset.documentCount !== expectedRecentBundles || recentDataset.fileName !== 'user_recent_songs.ndjson') throw new Error('BACKUP_RECENT_DATASET_INVALID');

            const [[favoriteBackupBytes], [recentBackupBytes]] = await Promise.all([
              bucket.file(`${backupPrefix}/${favoriteDataset.fileName}`).download(),
              bucket.file(`${backupPrefix}/${recentDataset.fileName}`).download(),
            ]);
            if (stableHash(favoriteBackupBytes) !== favoriteDataset.sha256) throw new Error('BACKUP_FAVORITES_HASH_MISMATCH');
            if (stableHash(recentBackupBytes) !== recentDataset.sha256) throw new Error('BACKUP_RECENT_HASH_MISMATCH');
            const favoriteBackupRecords = favoriteBackupBytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
            const recentBackupRecords = recentBackupBytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
            if (favoriteBackupRecords.length !== expectedFavorites || recentBackupRecords.length !== expectedRecentBundles) throw new Error('BACKUP_RECORD_COUNT_MISMATCH');
            const favoriteBackupByPath = new Map(favoriteBackupRecords.map((record) => [String(record.path), record.data]));
            const recentBackupByPath = new Map(recentBackupRecords.map((record) => [String(record.path), record.data]));

            const recentSnap = await db.collection('user_recent_songs').get();
            if (recentSnap.size !== expectedRecentBundles) throw new Error(`RECENT_BUNDLE_COUNT_CHANGED:${recentSnap.size}`);
            const recentSongs = [];
            for (const doc of recentSnap.docs.sort((a, b) => a.ref.path.localeCompare(b.ref.path))) {
              const match = /^user_recent_songs\/([^/]+)$/.exec(doc.ref.path);
              if (!match) throw new Error('UNEXPECTED_RECENT_PATH');
              const backupData = recentBackupByPath.get(doc.ref.path);
              if (!backupData || digest(backupData) !== digest(doc.data())) throw new Error('RECENT_SOURCE_DRIFT');
              const songs = Array.isArray(doc.data().songs) ? doc.data().songs : [];
              for (let index = 0; index < songs.length; index += 1) {
                const payload = songs[index];
                if (!payload || typeof payload !== 'object' || Array.isArray(payload)) throw new Error('RECENT_ITEM_NOT_OBJECT');
                recentSongs.push({ uid: match[1], sourcePath: doc.ref.path, index, payload, ref: db.doc(`users/${match[1]}/songs/${deterministicRecentSongId(match[1], doc.ref.path, index)}`) });
              }
            }
            if (recentSongs.length !== expectedRecentItems) throw new Error(`RECENT_ITEM_COUNT_CHANGED:${recentSongs.length}`);
            const recentV2 = await db.getAll(...recentSongs.map((song) => song.ref));
            for (let i = 0; i < recentV2.length; i += 1) {
              const snap = recentV2[i];
              const source = recentSongs[i];
              if (!snap.exists) throw new Error('RECENT_V2_MISSING');
              const data = snap.data();
              const stripped = { ...data };
              for (const key of ['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','legacyRecentIndex']) delete stripped[key];
              if (digest(stripped) !== digest(source.payload) || data.schemaVersion !== 2 || data.musicNote !== false || data.recentVisible !== true || data.legacyRecentIndex !== source.index) throw new Error('RECENT_V2_REFERENCE_MISMATCH');
            }

            const favoritesSnap = await db.collection('favorites').get();
            if (favoritesSnap.size !== expectedFavorites) throw new Error(`FAVORITE_COUNT_CHANGED:${favoritesSnap.size}`);
            const favorites = favoritesSnap.docs
              .map((doc) => ({ doc, path: doc.ref.path, favoriteId: doc.id, uid: nonEmptyString(doc.data().uid), payload: doc.data(), updateTimeMs: doc.updateTime?.toMillis?.() }))
              .sort((a, b) => a.path.localeCompare(b.path));
            const livePaths = new Set(favorites.map((favorite) => favorite.path));
            if (favoriteBackupByPath.size !== expectedFavorites || [...favoriteBackupByPath.keys()].some((path) => !livePaths.has(path))) throw new Error('FAVORITE_PATH_SET_DRIFT');
            for (const favorite of favorites) {
              if (!favorite.uid) throw new Error('FAVORITE_UID_MISSING');
              if (!Number.isInteger(favorite.updateTimeMs) || favorite.updateTimeMs < 0) throw new Error('FAVORITE_UPDATE_TIME_INVALID');
              const backupData = favoriteBackupByPath.get(favorite.path);
              if (!backupData || digest(backupData) !== digest(favorite.payload)) throw new Error('FAVORITE_SOURCE_DRIFT');
              const collision = Object.keys(favorite.payload).filter((key) => reservedV2Fields.has(key));
              if (collision.length) throw new Error(`SOURCE_RESERVED_V2_FIELD_COLLISION:${collision.sort().join(',')}`);
            }

            let strongMatches = 0;
            let ambiguousMatches = 0;
            const targetUse = new Map();
            for (const favorite of favorites) {
              const candidates = recentSongs.filter((recent) => recent.uid === favorite.uid && classifyPair(favorite.payload, recent.payload));
              if (candidates.length === 1) {
                strongMatches += 1;
                targetUse.set(candidates[0].ref.path, (targetUse.get(candidates[0].ref.path) || 0) + 1);
              } else if (candidates.length > 1) ambiguousMatches += 1;
            }
            const targetCollisions = [...targetUse.values()].filter((count) => count > 1).reduce((sum, count) => sum + count, 0);
            if (strongMatches !== 0 || ambiguousMatches !== 0 || targetCollisions !== 0) throw new Error(`IDENTITY_SCOPE_CHANGED:${strongMatches}:${ambiguousMatches}:${targetCollisions}`);

            const plans = favorites.map((favorite) => {
              const songId = deterministicFavoriteSongId(favorite.path);
              const destination = db.doc(`users/${favorite.uid}/songs/${songId}`);
              const favoriteKey = nonEmptyString(favorite.payload.favoriteKey);
              const payload = {
                ...favorite.payload,
                schemaVersion: 2,
                musicNote: true,
                recentVisible: false,
                v2UpdatedAtMs: favorite.updateTimeMs,
                legacyFavoriteId: favorite.favoriteId,
                ...(favoriteKey ? { legacyFavoriteKey: favoriteKey } : {}),
              };
              return { ...favorite, songId, destination, favoriteKey, v2Payload: payload, sourceDigest: digest(favorite.payload) };
            });
            const uniqueDestinationPaths = new Set(plans.map((plan) => plan.destination.path));
            if (uniqueDestinationPaths.size !== expectedFavorites) throw new Error('DETERMINISTIC_DESTINATION_COLLISION');
            for (let offset = 0; offset < plans.length; offset += 100) {
              const chunk = plans.slice(offset, offset + 100);
              const snaps = await db.getAll(...chunk.map((plan) => plan.destination));
              if (snaps.some((snap) => snap.exists)) throw new Error('PREEXISTING_FAVORITE_DESTINATION_CHANGED_SCOPE');
            }

            console.log('STEP34F_PLAN=' + JSON.stringify({ sources: favorites.length, strongMatches, ambiguousMatches, targetCollisions, standaloneCreates: plans.length, batchSize, batches: Math.ceil(plans.length / batchSize), preexistingDestinations: 0, v1Writes: 0, v1Deletes: 0 }));

            let created = 0;
            let transactionCount = 0;
            for (let offset = 0; offset < plans.length; offset += batchSize) {
              const chunk = plans.slice(offset, offset + batchSize);
              await db.runTransaction(async (tx) => {
                const sourceRefs = chunk.map((plan) => plan.doc.ref);
                const destRefs = chunk.map((plan) => plan.destination);
                const sourceSnaps = await tx.getAll(...sourceRefs);
                const destSnaps = await tx.getAll(...destRefs);
                for (let i = 0; i < chunk.length; i += 1) {
                  const plan = chunk[i];
                  const sourceSnap = sourceSnaps[i];
                  const destSnap = destSnaps[i];
                  if (!sourceSnap.exists) throw new Error('TRANSACTION_SOURCE_MISSING');
                  if (sourceSnap.updateTime?.toMillis?.() !== plan.updateTimeMs || digest(sourceSnap.data()) !== plan.sourceDigest) throw new Error('TRANSACTION_SOURCE_DRIFT');
                  if (nonEmptyString(sourceSnap.data().uid) !== plan.uid) throw new Error('TRANSACTION_UID_MISMATCH');
                  if (destSnap.exists) throw new Error('TRANSACTION_DESTINATION_CONFLICT');
                }
                for (const plan of chunk) tx.create(plan.destination, plan.v2Payload);
              });
              created += chunk.length;
              transactionCount += 1;
              console.log('STEP34F_BATCH=' + JSON.stringify({ batch: transactionCount, count: chunk.length, cumulativeCreated: created }));
            }
            if (created !== expectedFavorites || created > maxWrites) throw new Error(`WRITE_COUNT_MISMATCH:${created}`);

            const finalFavoritesSnap = await db.collection('favorites').get();
            if (finalFavoritesSnap.size !== expectedFavorites) throw new Error('POSTVERIFY_FAVORITE_COUNT_DRIFT');
            const finalFavoriteByPath = new Map(finalFavoritesSnap.docs.map((doc) => [doc.ref.path, doc]));
            let verified = 0;
            for (let offset = 0; offset < plans.length; offset += 100) {
              const chunk = plans.slice(offset, offset + 100);
              const destSnaps = await db.getAll(...chunk.map((plan) => plan.destination));
              for (let i = 0; i < chunk.length; i += 1) {
                const plan = chunk[i];
                const sourceSnap = finalFavoriteByPath.get(plan.path);
                const destSnap = destSnaps[i];
                if (!sourceSnap || digest(sourceSnap.data()) !== plan.sourceDigest || sourceSnap.updateTime?.toMillis?.() !== plan.updateTimeMs) throw new Error('POSTVERIFY_SOURCE_DRIFT');
                if (!destSnap.exists) throw new Error('POSTVERIFY_DESTINATION_MISSING');
                const data = destSnap.data();
                const stripped = { ...data };
                for (const key of ['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','legacyFavoriteId','legacyFavoriteKey']) delete stripped[key];
                if (digest(stripped) !== plan.sourceDigest) throw new Error('POSTVERIFY_PAYLOAD_MISMATCH');
                if (data.schemaVersion !== 2 || data.musicNote !== true || data.recentVisible !== false || data.v2UpdatedAtMs !== plan.updateTimeMs || data.legacyFavoriteId !== plan.favoriteId) throw new Error('POSTVERIFY_METADATA_MISMATCH');
                if ((plan.favoriteKey || null) !== (nonEmptyString(data.legacyFavoriteKey) || null)) throw new Error('POSTVERIFY_FAVORITE_KEY_MISMATCH');
                verified += 1;
              }
            }

            console.log('STEP34F_RESULT=' + JSON.stringify({ sourceFavorites: favorites.length, created, verified, strongMatches: 0, recentSongsUpdated: 0, transactionCount, batchShape: [100,100,100,100,100,100,100,38], fullPayloadParity: true, metadataParity: true, deterministicIds: true, musicNote: true, recentVisible: false, v1Writes: 0, v1Deletes: 0, v2Deletes: 0, rulesDeploys: 0, functionsDeploys: 0, hostingDeploys: 0 }));
          })().catch((error) => {
            console.error('STEP34F_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          }).finally(async () => {
            await deleteApp(app);
          });
          NODE
