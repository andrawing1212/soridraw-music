name: OPS Preview Compact Keyword Divider V15

on:
  push:
    branches: [ops-preview-compact-keyword-divider-v15]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply compact keyword spacing and divider only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview
          git switch --detach origin/preview
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/studio/studioLayout.css')
          css = path.read_text(encoding='utf-8')
          old = 'html[data-soridraw-theme="studio-black"][data-soridraw-compact-workspace="true"]\n.soridraw-builder-live-keywords {\n  display: block !important;\n}'
          new = 'html[data-soridraw-theme="studio-black"][data-soridraw-compact-workspace="true"]\n.soridraw-builder-live-keywords {\n  display: block !important;\n  padding-bottom: 12px !important;\n  border-bottom: 2px solid #4f3b1c !important;\n}'
          if old not in css:
              raise SystemExit('Expected 1015 compact keyword rule not found')
          if 'border-bottom: 2px solid #4f3b1c !important;' in css:
              raise SystemExit('Compact divider already exists; refusing duplicate patch')
          path.write_text(css.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'src/components/studio/studioLayout.css'
          grep -q 'padding-bottom: 12px !important;' src/components/studio/studioLayout.css
          grep -q 'border-bottom: 2px solid #4f3b1c !important;' src/components/studio/studioLayout.css
          git diff -- src/components/studio/studioLayout.css
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Publish validated source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "andrawing1212"
          git config user.email "andrawing1212@gmail.com"
          git add src/components/studio/studioLayout.css
          git commit -m "fix(preview): match compact keyword divider spacing"
          git branch -f preview-compact-keyword-divider-v15 HEAD
          git push origin preview-compact-keyword-divider-v15 --force
