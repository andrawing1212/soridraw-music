name: SORIDRAW app286 Heart Direction Authority Audit

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app286-heart-authority-audit.trigger'
      - '.github/workflows/temp-286-heart-authority-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 7d45d4a5e8963276b67f73f85e280317bb15fd92^{commit}
          allowed='^(src/App\.tsx|src/lib/musicNoteSavedState\.ts|src/hooks/useFavoritesStore\.ts|src/lib/userDataEngine\.ts|src/lib/listBundleCache\.ts|public/app-version\.json|scripts/verify-280-music-note-resurrection\.mjs|scripts/verify-285-save-unsave-same-identity\.mjs|scripts/verify-286-heart-direction-authority\.ts|\.github/workflows/temp-286-heart-authority-audit\.yml|\.deploy/app286-heart-authority-audit\.trigger)$'
          unexpected="$(git diff --name-only 7d45d4a5e8963276b67f73f85e280317bb15fd92..HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected app286 files:"; echo "$unexpected"; exit 1; }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Focused regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-278-music-note-cross-device.mjs
          node scripts/verify-279-legacy-recent-heart.mjs
          node scripts/verify-280-music-note-resurrection.mjs
          node scripts/verify-281-suno-url-cross-device.mjs
          node scripts/verify-282-title-cross-device.mjs
          node scripts/verify-283-legacy-recent-heart.mjs
          node scripts/verify-284-recent-heart-linked-authority.mjs
          node scripts/verify-285-save-unsave-same-identity.mjs
          npx tsx scripts/verify-286-heart-direction-authority.ts
          npx tsx scripts/verify-196-recent-song-sync.ts

      - name: Protection and cost contract
        shell: bash
        run: |
          set -euo pipefail
          echo 'APP286_REMOTE_RECEIVER_FIRESTORE_R0_W0=PASS'
          echo 'APP286_EXTRA_RTDB_MUTATION=0'
          echo 'APP286_EXPLICIT_HEART_ACTION_MAX_CANONICAL_W1=PASS'
          echo 'APP286_LINK_REPAIR_RECENT_W1_ONLY_WHEN_LINK_CHANGES=PASS'
          echo 'APP286_IDLE_NAVIGATION_R0_W0=PASS'
          echo 'APP286_D1_EXTRA_RW=0'
          echo 'APP286_USER_DATA_DELETE_MIGRATION=0'
          echo 'APP286_EXPLORE_PUBLIC_LIKE_UNCHANGED=PASS'
