name: Temp 1028 Verify Worker + Firebase
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1028-verify-worker-and-firebase.yml']
permissions:
  contents: write
jobs:
  verify_and_deploy:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 100

      - name: Lock validated source
        shell: bash
        run: |
          set -euo pipefail
          CLIENT='eed84dd69a14b9255669f24900c1d08d1b85fc5f'
          git merge-base --is-ancestor "$CLIENT" HEAD
          git diff --quiet "$CLIENT"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json
          echo 'SOURCE_LOCK=PASS'

      - name: Verify deployed PREVIEW Worker semantics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x}
          function fn(src,name){for(const prefix of ['async function ','function ']){const s=src.indexOf(`${prefix}${name}(`);if(s<0)continue;const b=src.indexOf('{',s);let d=0,q=null,e=false;for(let i=b;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;if(c==='}'){d--;if(d===0)return src.slice(s,i+1)}}}return ''}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;
            const ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!v?.version_id||Number(v.percentage||0)<99.99) throw new Error('active worker is not 100%');
            const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`),m=(ver.modules||[]).find(x=>x.name===ver.main_module)||(ver.modules||[])[0];
            const src=Buffer.from(m.content_base64,'base64').toString('utf8');
            const visibility=fn(src,'handleVisibility');
            const profile=fn(src,'refreshPublicProfileFirstViewTrackWindow');
            const prebuild=fn(src,'refreshOrPrebuildPublicProfileTrackWindow');
            if(!visibility) throw new Error('handleVisibility missing');
            if(visibility.includes('safelyRefreshExploreFeedR2Bundles')) throw new Error('visibility still full-refreshes Explore feed');
            if(!src.includes('syncExploreFeedR2PublicVisibility1028')) throw new Error('bounded public visibility feed helper missing');
            if(!profile || profile.includes('readPublicProfileFirstViewTrackWindow')) throw new Error('profile mutation still rebuilds 51-row window');
            if(!prebuild || prebuild.includes('readOrMaterializePublicProfileFirstView')) throw new Error('mutation can still materialize full first-view snapshot');
            if(!src.includes('owner-wide D1 rebuild blocked') && !src.includes('publication does not scan owner tracks')) throw new Error('publication bounded guard missing');
            console.log('WORKER_ACTIVE_VERSION='+v.version_id);
            console.log('WORKER_SEMANTIC_VERIFY=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          code="$(curl -sS -o "$RUNNER_TEMP/worker-noauth.json" -w '%{http_code}' 'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/me/music-note-publications-bundle')"
          echo "WORKER_NOAUTH_HTTP=$code"
          test "$code" != 404
          test "$code" != 500

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install, TypeScript, Build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW and verify exact build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then ok='yes'; echo "EXACT_BUILD_PASS=$url"; break; fi
              fi
              sleep 10
            done
            test "$ok" = 'yes'
          done
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'PRODUCTION_UNCHANGED=PASS'

      - name: Cleanup temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin preview
          git rm -f .github/workflows/temp-1028-verify-worker-and-firebase.yml .github/workflows/temp-1028-worker-auth-retry.yml .github/workflows/temp-1028-cache-worker-cost-fix.yml .github/workflows/temp-inspect-preview-worker-1028.yml
          git commit -m 'chore(preview): remove temporary 1028 workflows'
          git push origin HEAD:preview
