name: SORIDRAW 091 Shared Like Count Repair
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-089-like-cross-device-repair.yml'
      - 'scripts/temp-089-like-cross-device-repair.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply 091 shared like count repair
        run: python3 scripts/temp-089-like-cross-device-repair.py
      - name: Align legacy 088 verifier with 091 layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-088-same-session-liked-heart.mjs')
          text = path.read_text()
          old = "assert.match(like, /const optimisticLikedCache = getLikedStateCache\\(user\\.uid\\);[\\s\\S]{0,180}optimisticLikedCache\\.set\\(normalizedTrackId, liked\\);[\\s\\S]{0,180}persistLikedStateCache\\(user\\.uid, optimisticLikedCache\\);/);"
          new = "assert.match(like, /const optimisticLikedCache = getLikedStateCache\\(user\\.uid\\);/);\nassert.match(like, /optimisticLikedCache\\.set\\(normalizedTrackId, liked\\);/);\nassert.match(like, /persistLikedStateCache\\(user\\.uid, optimisticLikedCache\\);/);"
          if text.count(old) != 1:
              raise SystemExit(f'088 verifier alignment expected 1 match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Like regressions and state machine
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
          node scripts/verify-087-liked-card-consistency.mjs
          node scripts/verify-088-same-session-liked-heart.mjs
          node scripts/verify-089-like-cross-device-consistency.mjs
          node scripts/verify-090-like-live-display.mjs
          node --experimental-strip-types scripts/verify-091-like-count-state-machine.mjs
          node scripts/verify-explore-like-cost-optimization.mjs
          node scripts/verify-081-page-exit-batch.mjs
          node scripts/verify-084-publication-write-returning.mjs
      - name: Commit 091 product code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add \
            src/services/exploreLikeDisplayStateService.ts \
            src/services/exploreLikeService.ts \
            src/services/exploreLikedTracksService.ts \
            src/pages/ExplorePage.tsx \
            public/app-version.json \
            scripts/verify-087-liked-card-consistency.mjs \
            scripts/verify-088-same-session-liked-heart.mjs \
            scripts/verify-089-like-cross-device-consistency.mjs \
            scripts/verify-090-like-live-display.mjs \
            scripts/verify-091-like-count-state-machine.mjs
          git diff --cached --check
          git commit -m 'fix(preview): unify like display counts 091'
          git push origin HEAD:preview
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
