name: SORIDRAW 098 Explore Like Atomic RTDB Merge

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-098-explore-like-device-signal.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-098-explore-like-atomic-rtdb
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply 098 atomic retained-signal merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/services/exploreLikeService.ts')
          source = path.read_text(encoding='utf-8')
          old_import = "import { ref as databaseRef, set as setRealtimeValue } from 'firebase/database';"
          new_import = "import { ref as databaseRef, runTransaction } from 'firebase/database';"
          if old_import not in source:
              raise SystemExit('098 preflight: RTDB import anchor missing')
          source = source.replace(old_import, new_import, 1)

          marker = '// SORIDRAW_EXPLORE_LIKE_REMOTE_PENDING_ACK_097_20260916\n'
          if marker not in source:
              raise SystemExit('098 preflight: 097 marker missing')
          source = source.replace(marker, marker + '// SORIDRAW_EXPLORE_LIKE_ATOMIC_SIGNAL_098_20260916\n', 1)

          start = source.find('const publishExploreLikeAccountSyncSignal = async (')
          end = source.find('\nconst buildAuthHeaders = async (user: User) => {', start)
          if start < 0 or end <= start:
              raise SystemExit('098 preflight: publisher range missing')

          replacement = dedent(r'''
          const publishExploreLikeAccountSyncSignal = async (
            user: User,
            batchEntries: ExploreLikePendingMutation[],
            results: Array<ExploreLikeBatchResult & { displayLikeCount?: number }>,
          ) => {
            if (!user?.uid || !results.length) return;
            const uid = user.uid;
            const ownerByTrack = new Map(batchEntries.map((pending) => [pending.trackId, pending.ownerUid]));
            const currentConfirmedResults: ExploreLikeAccountSyncResult[] = results.map((result) => ({
              ...result,
              ownerUid: ownerByTrack.get(result.trackId) || '',
            }));

            // 098: 093-097 could blind-overwrite another device's retained rows
            // because set() rebuilt the whole signal from only this browser's cache.
            // Merge the just-confirmed D1 batch against RTDB's actual latest value.
            // Firebase retries this transaction on concurrent PC/mobile writes.
            try {
              const transaction = await runTransaction(
                databaseRef(realtimeDb, `userSync/${uid}/exploreLike`),
                (currentValue) => {
                  const currentSignal = normalizeAccountSyncSignal(currentValue);
                  const mergedByTrack = new Map<string, ExploreLikeAccountSyncResult>();
                  for (const currentResult of currentConfirmedResults) {
                    mergedByTrack.set(currentResult.trackId, currentResult);
                  }
                  for (const existing of currentSignal?.results || []) {
                    if (mergedByTrack.size >= EXPLORE_LIKE_BATCH_MAX) break;
                    if (!mergedByTrack.has(existing.trackId)) mergedByTrack.set(existing.trackId, existing);
                  }
                  const previousVersion = Math.max(0, currentSignal?.version || 0);
                  const version = Math.max(Date.now(), previousVersion + 1);
                  return {
                    version,
                    previousVersion,
                    results: [...mergedByTrack.values()].slice(0, EXPLORE_LIKE_BATCH_MAX),
                  } satisfies ExploreLikeAccountSyncSignal;
                },
                { applyLocally: false },
              );

              const committedSignal = transaction.committed
                ? normalizeAccountSyncSignal(transaction.snapshot.val())
                : null;
              if (!committedSignal) return;
              setSeenAccountSignalVersion(uid, committedSignal.version);
              observedAccountSignalVersionByUid.set(
                uid,
                Math.max(observedAccountSignalVersionByUid.get(uid) || 0, committedSignal.version),
              );
            } catch (reason) {
              // D1 already acknowledged this batch; never undo canonical like data.
              console.warn('Explore account like atomic RTDB sync signal publish failed:', reason);
            }
          };
          ''').lstrip()
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')

          Path('scripts/verify-096-explore-like-cross-device-replay.mjs').write_text(dedent(r'''
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const service = readFileSync('src/services/exploreLikeService.ts', 'utf8');
          const start = service.indexOf('const publishExploreLikeAccountSyncSignal');
          const end = service.indexOf('const buildAuthHeaders', start);
          assert.ok(start >= 0 && end > start);
          const publisher = service.slice(start, end);
          assert.ok(service.includes('SORIDRAW_EXPLORE_LIKE_CROSS_DEVICE_REPLAY_096_20260915'));
          assert.ok(service.includes('SORIDRAW_EXPLORE_LIKE_ATOMIC_SIGNAL_098_20260916'));
          assert.ok(publisher.includes('runTransaction('));
          assert.ok(publisher.includes('normalizeAccountSyncSignal(currentValue)'));
          assert.ok(publisher.includes('currentSignal?.results || []'));
          assert.ok(publisher.includes('mergedByTrack.has(existing.trackId)'));
          assert.ok(publisher.includes('mergedByTrack.size >= EXPLORE_LIKE_BATCH_MAX'));
          assert.ok(publisher.includes('results: [...mergedByTrack.values()].slice(0, EXPLORE_LIKE_BATCH_MAX)'));
          assert.ok(!publisher.includes('Object.values(readAccountPatchCache(uid))'));
          assert.ok(!publisher.includes('setRealtimeValue('));
          assert.ok(!publisher.includes('requestExploreLike('));
          assert.ok(!publisher.includes('fetch('));
          assert.ok(!service.includes('firebase/firestore'));
          console.log('PASS 096/098: retained replay is atomically merged against RTDB latest state, max 50, with no D1/Firestore recovery read.');
          ''').lstrip(), encoding='utf-8')

          Path('scripts/verify-098-explore-like-atomic-signal.mjs').write_text(dedent(r'''
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const service = readFileSync('src/services/exploreLikeService.ts', 'utf8');
          const sync = readFileSync('src/services/userDomainSyncService.ts', 'utf8');
          const rules = readFileSync('database.rules.json', 'utf8');
          const start = service.indexOf('const publishExploreLikeAccountSyncSignal');
          const end = service.indexOf('const buildAuthHeaders', start);
          assert.ok(start >= 0 && end > start);
          const publisher = service.slice(start, end);
          assert.ok(service.includes("import { ref as databaseRef, runTransaction } from 'firebase/database';"));
          assert.ok(service.includes('SORIDRAW_EXPLORE_LIKE_ATOMIC_SIGNAL_098_20260916'));
          assert.ok(publisher.includes('databaseRef(realtimeDb, `userSync/${uid}/exploreLike`)'));
          assert.ok(publisher.includes('const currentConfirmedResults'));
          assert.ok(publisher.indexOf('for (const currentResult of currentConfirmedResults)') < publisher.indexOf('for (const existing of currentSignal?.results || [])'));
          assert.ok(publisher.includes('if (!mergedByTrack.has(existing.trackId))'));
          assert.ok(publisher.includes('const previousVersion = Math.max(0, currentSignal?.version || 0)'));
          assert.ok(publisher.includes('const version = Math.max(Date.now(), previousVersion + 1)'));
          assert.ok(publisher.includes('{ applyLocally: false }'));
          assert.ok(publisher.includes('transaction.snapshot.val()'));
          assert.ok(!publisher.includes('readAccountPatchCache(uid)'));
          assert.ok(!publisher.includes('setRealtimeValue('));
          assert.ok(!service.includes('exploreLikeDevices'));
          assert.ok(sync.includes('userSync/${safeUid}/exploreLike'));
          assert.ok(!sync.includes('exploreLikeDevices'));
          assert.ok(rules.includes('"exploreLike"'));
          assert.ok(!rules.includes('exploreLikeDevices'));
          assert.ok(rules.includes("$index.matches(/^(0|[1-9]|[1-4][0-9])$/)"));
          assert.ok(!publisher.includes('requestExploreLike('));
          assert.ok(!publisher.includes('fetch('));
          assert.ok(!service.includes('firebase/firestore'));

          const merge = (fresh, retained, max = 50) => {
            const map = new Map();
            fresh.forEach((row) => map.set(row.trackId, row));
            retained.forEach((row) => {
              if (map.size < max && !map.has(row.trackId)) map.set(row.trackId, row);
            });
            return [...map.values()].slice(0, max);
          };
          assert.deepEqual(
            merge([{ trackId: 'B', displayLikeCount: 1 }], [{ trackId: 'A', displayLikeCount: 1 }]),
            [{ trackId: 'B', displayLikeCount: 1 }, { trackId: 'A', displayLikeCount: 1 }],
          );
          assert.deepEqual(
            merge([{ trackId: 'A', displayLikeCount: 2 }], [{ trackId: 'A', displayLikeCount: 1 }, { trackId: 'B', displayLikeCount: 1 }]),
            [{ trackId: 'A', displayLikeCount: 2 }, { trackId: 'B', displayLikeCount: 1 }],
          );
          console.log('PASS 098: concurrent PC/mobile signals cannot blind-overwrite retained counts; current D1-confirmed batch wins and RTDB latest rows survive.');
          ''').lstrip(), encoding='utf-8')
          PY

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify 094-098 like path
        run: |
          node scripts/verify-094-explore-session-like-batch.mjs
          node scripts/verify-095-explore-like-zero-read-display.mjs
          node scripts/verify-096-explore-like-cross-device-replay.mjs
          node scripts/verify-097-explore-like-pending-ack.mjs
          node scripts/verify-098-explore-like-atomic-signal.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify cost and liked-profile regressions
        run: |
          node scripts/verify-explore-like-cost-optimization.mjs
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs

      - name: Guard exact product scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- database.rules.json src/services/userDomainSyncService.ts src/pages/ExplorePage.tsx
          git add src/services/exploreLikeService.ts scripts/verify-096-explore-like-cross-device-replay.mjs scripts/verify-098-explore-like-atomic-signal.mjs
          git diff --cached --check
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged.txt"
          test "$(cat "$RUNNER_TEMP/staged.txt")" = $'scripts/verify-096-explore-like-cross-device-replay.mjs\nscripts/verify-098-explore-like-atomic-signal.mjs\nsrc/services/exploreLikeService.ts'

      - name: Commit verified 098 product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: atomically merge Explore like sync signal'
          git push origin HEAD:preview
          echo "PRODUCT_SHA=$(git rev-parse HEAD)"
          echo 'NO_DEPLOY=true'
          echo 'NO_WORKER_CHANGE=true'
          echo 'NO_FUNCTIONS_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_FIRESTORE_CHANGE=true'
          echo 'NO_RTDB_RULE_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
