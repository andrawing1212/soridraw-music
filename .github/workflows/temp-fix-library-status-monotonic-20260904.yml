name: SORIDRAW Library Status Monotonic PREVIEW 2026-09-04

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-fix-library-status-monotonic-20260904.yml']

permissions:
  contents: write

jobs:
  fix-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 2

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Library status monotonic fix
        run: |
          set -euo pipefail
          python3 .deploy/temp-apply-library-status-monotonic-20260904.py
          git diff --check
          grep -Fq 'SORIDRAW_LIBRARY_STATUS_MONOTONIC_20260904' src/pages/SunoLibraryPage.tsx
          grep -Fq 'const hasStableLibraryResult = (group: any) => {' src/pages/SunoLibraryPage.tsx
          grep -Fq "return { status: 'completed' as string | null, raw: resolved.raw || '' };" src/pages/SunoLibraryPage.tsx
          echo 'PATCH_CHECK=PASS'

      - name: TypeScript and build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node .deploy/check-firebase-custom-preview.mjs
          echo 'BUILD_CHECK=PASS'

      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add src/pages/SunoLibraryPage.tsx
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'fix(preview): keep completed Library tracks out of generation state'
          git push origin HEAD:preview
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Snapshot production Hosting
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW Hosting
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify PREVIEW and production isolation
        run: |
          set -euo pipefail
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 30 "$url" -o "$RUNNER_TEMP/preview.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview.html"; then ok=yes; break; fi
              sleep 6
            done
            test "$ok" = yes
            echo "PREVIEW_SMOKE_PASS $url"
          done
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'PRODUCTION_UNCHANGED=PASS'
          echo "SOURCE_COMMIT=${SOURCE_COMMIT:-unknown}"
