name: Temp Audit Warm Cache Zero 1054

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-audit-warm-cache-zero-1054.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Print compact warm-cache findings
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          files=['src/App.tsx','src/lib/userDataEngine.ts','src/lib/userProfileCache.ts','src/lib/listBundleCache.ts','src/lib/firestoreMeasured.ts']
          needles=['writeUserProfileCache','USER_PROFILE_CACHE_EVENT','syncVersions','favoriteSyncSignalUpdatedAt','favoriteSyncSignal','markAdaptiveListIndexDirty','readAdaptiveListIndexDirtyRevision','readCatalogSnapshotCacheFirst','catalogRemoteValidatedSessionKeys','subscribeListBundle']
          for f in files:
              p=Path(f)
              if not p.exists(): continue
              lines=p.read_text(encoding='utf-8').splitlines()
              hits=[]
              for i,line in enumerate(lines,1):
                  if any(n in line for n in needles): hits.append(i)
              if not hits: continue
              print(f'FILE {f}')
              for i in hits[:100]:
                  lo=max(1,i-3); hi=min(len(lines),i+7)
                  print(f'-- {lo}:{hi} around {i} --')
                  for n in range(lo,hi+1): print(f'{n}: {lines[n-1]}')
          PY
