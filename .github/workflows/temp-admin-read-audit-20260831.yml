name: Temp Full Admin Read Audit 20260831

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-admin-read-audit-20260831.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Full admin route and read audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== APP SETTINGS STARTUP 5660-5795 ==='
          sed -n '5660,5795p' src/App.tsx
          echo
          echo '=== SECTION TAG STARTUP 7140-7225 ==='
          sed -n '7140,7225p' src/App.tsx
          echo
          echo '=== USER AUTH/LISTENER 6720-6835 ==='
          sed -n '6720,6835p' src/App.tsx
          echo
          echo '=== VOCAL TONES STARTUP 11480-11575 ==='
          sed -n '11480,11575p' src/App.tsx
          echo
          echo '=== ADMIN LAZY IMPORTS 2755-2790 ==='
          sed -n '2755,2790p' src/App.tsx
          echo
          echo '=== ADMIN ROUTES 18670-18730 ==='
          sed -n '18670,18730p' src/App.tsx
          echo
          echo '=== APP READ CACHE IMPORTS/USAGE ==='
          grep -nE "readFirestoreReadCache|writeFirestoreReadCache|FIRESTORE_READ_CACHE_TTL_MS|FIRESTORE_READ_CACHE_KEYS" src/App.tsx || true
          echo
          echo '=== ALL ADMIN PERMISSION/MENU REFERENCES ==='
          grep -RInE "vocalManagement|sectionTagManagement|/admin/(vocals|tags|sections)" src --include='*.tsx' --include='*.ts' || true
