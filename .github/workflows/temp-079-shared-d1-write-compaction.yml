name: TEMP 079 Shared D1 Write Compaction

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-079-shared-d1-write-compaction.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-shared-d1-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      EXPECTED_MIGRATION_BLOB: 9fee01ad58f6f74398af0517244c6ba2c9628922
      MAIN_SHA: 3b574c05589230f077eceff98190edd4b5195f75
      PRODUCTION_SHA: a8971fae1014ce107927fcfb5491d202d4c68fbe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact migration and branch guards
        shell: bash
        run: |
          set -euo pipefail
          file='cloudflare/explore-worker/migrations/20260913_03_music_note_write_compaction.sql'
          test "$(git hash-object "$file")" = "$EXPECTED_MIGRATION_BLOB"
          test "$(grep -c '^DROP TRIGGER IF EXISTS ' "$file")" -eq 4
          test "$(grep -c '^CREATE TRIGGER ' "$file")" -eq 4
          grep -q '^CREATE TRIGGER explore079_music_note_derived_track_insert' "$file"
          grep -q '^CREATE TRIGGER explore079_music_note_derived_track_update' "$file"
          ! grep -Eq '\b(?:DELETE FROM tracks|UPDATE tracks|INSERT INTO tracks|ALTER TABLE|DROP TABLE)\b' "$file"
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/production)" = "$PRODUCTION_SHA"
          echo '079_MIGRATION_STATIC_GUARD=PASS'
      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only live preflight and rollback capture
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import('./scripts/derived-deploy-preflight.mjs').then(m=>m.assertDerivedBaseD1Ready('./canonical/wrangler.preview.jsonc'))"
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT name,sql FROM sqlite_schema WHERE type='trigger' AND name IN ('explore032_derived_track_insert','explore032_derived_track_update','explore079_music_note_derived_track_insert','explore079_music_note_derived_track_update') ORDER BY name;" --json > "$RUNNER_TEMP/before079.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/before079.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          const by=new Map(rows.map(r=>[String(r.name),String(r.sql||'')]));
          if(by.has('explore079_music_note_derived_track_insert') || by.has('explore079_music_note_derived_track_update')) throw new Error('079 trigger unexpectedly already exists');
          for(const name of ['explore032_derived_track_insert','explore032_derived_track_update']) {
            if(!by.has(name)) throw new Error(`live trigger missing: ${name}`);
          }
          const insert=by.get('explore032_derived_track_insert');
          const update=by.get('explore032_derived_track_update');
          if(!insert.includes('explore_derived_state') || !insert.includes('explore_derived_changes') || !insert.includes('track_count')) throw new Error('live insert no longer matches approved 078/076 journal shape');
          if(!update.includes('explore_derived_state') || !update.includes('explore_derived_changes') || !update.includes('track_count')) throw new Error('live update no longer matches approved 078 journal shape');
          if((update.match(/NOT EXISTS/g)||[]).length!==2) throw new Error('078 conflict-safe update trigger prerequisite missing');
          const rollback=[
            'DROP TRIGGER IF EXISTS explore079_music_note_derived_track_insert;',
            'DROP TRIGGER IF EXISTS explore079_music_note_derived_track_update;',
            'DROP TRIGGER IF EXISTS explore032_derived_track_insert;',
            'DROP TRIGGER IF EXISTS explore032_derived_track_update;',
            insert+';',
            update+';',
            ''
          ].join('\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/rollback079.sql',rollback);
          console.log('079_LIVE_PREFLIGHT=PASS');
          NODE
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT seeded,seq FROM explore_derived_state WHERE id=1; SELECT revision FROM explore_shared_revision WHERE scope='global';" --json
          echo '079_READ_ONLY_PREFLIGHT=PASS'
      - name: Apply trigger-only compaction with rollback guard
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          MIG="$PWD/migrations/20260913_03_music_note_write_compaction.sql"
          applied=0
          rollback() {
            echo '079_POST_VERIFY_FAILED: restoring exact previous 078 trigger definitions'
            node "$WRANGLER" d1 execute DB --remote --config "$CFG" --file "$RUNNER_TEMP/rollback079.sql" --yes || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ] && [ "$applied" = 1 ]; then rollback; fi; exit "$status"' EXIT
          applied=1
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --file "$MIG" --yes
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT name,sql FROM sqlite_schema WHERE type='trigger' AND name IN ('explore032_derived_track_insert','explore032_derived_track_update','explore079_music_note_derived_track_insert','explore079_music_note_derived_track_update') ORDER BY name;" --json > "$RUNNER_TEMP/after079.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/after079.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          if(rows.length!==4) throw new Error(`expected four 079 trigger definitions, got ${rows.length}`);
          const by=new Map(rows.map(r=>[String(r.name),String(r.sql||'')]));
          for(const name of ['explore032_derived_track_insert','explore032_derived_track_update','explore079_music_note_derived_track_insert','explore079_music_note_derived_track_update']) {
            if(!by.has(name)) throw new Error(`post-apply trigger missing: ${name}`);
          }
          const normalInsert=by.get('explore032_derived_track_insert');
          const normalUpdate=by.get('explore032_derived_track_update');
          const musicInsert=by.get('explore079_music_note_derived_track_insert');
          const musicUpdate=by.get('explore079_music_note_derived_track_update');
          for(const sql of [normalInsert,normalUpdate]) {
            if(!sql.includes('explore_derived_state') || !sql.includes('explore_derived_changes')) throw new Error('non-Music journal compatibility missing');
          }
          for(const sql of [musicInsert,musicUpdate]) {
            if(sql.includes('explore_derived_state') || sql.includes('explore_derived_changes')) throw new Error('Music Note journal fanout still present');
            if(!sql.includes('track_count')) throw new Error('Music Note track_count maintenance missing');
            if(!sql.includes("'music_note'")) throw new Error('Music Note trigger guard missing');
          }
          if((normalUpdate.match(/NOT EXISTS/g)||[]).length!==2) throw new Error('non-Music 078 conflict safety lost');
          console.log('079_POST_APPLY_TRIGGER_VERIFY=PASS');
          NODE
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT seeded,seq FROM explore_derived_state WHERE id=1; SELECT revision FROM explore_shared_revision WHERE scope='global';" --json
          applied=0
          trap - EXIT
          echo '079_SHARED_D1_TRIGGER_COMPACTION=PASS'
      - name: Verify code branches unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/production)" = "$PRODUCTION_SHA"
          echo '079_TEST_PRODUCTION_BRANCHES_UNCHANGED=PASS'
