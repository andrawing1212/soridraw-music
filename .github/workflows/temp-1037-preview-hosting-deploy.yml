name: Temp 1037 Preview Hosting Deploy

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-1037-preview-hosting-deploy.yml'

permissions:
  contents: read

concurrency:
  group: temp-1037-preview-hosting-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_RUNTIME_HEAD: dc9ecba35ffffc58bd9ce262ee4d36ba5ba82b39
      EXPECTED_FIX_COMMIT: c78086869e135adf15f99a3acc1e6f4305b85975
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20

      - name: Guard exact runtime source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_FIX_COMMIT" HEAD
          git merge-base --is-ancestor "$EXPECTED_RUNTIME_HEAD" HEAD
          if ! git diff --quiet "$EXPECTED_RUNTIME_HEAD"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json; then
            echo 'Runtime source changed after validated 1037 head.'
            git diff --name-only "$EXPECTED_RUNTIME_HEAD"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json
            exit 2
          fi
          grep -q 'recoverMusicNoteCatalogFromCanonicalFirestore' src/lib/adaptiveListIndexV2.ts
          echo 'RUNTIME_GUARD=PASS'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production before deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Firebase PREVIEW Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project soridraw \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  echo "EXACT_BUILD_PASS=$url"
                  ok='yes'
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = 'yes'
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'PRODUCTION_UNCHANGED=PASS'

      - name: Result
        run: |
          echo 'PREVIEW_DEPLOYMENT=SUCCESS'
          echo 'URL=https://preview.soridraw.com/'
          echo 'Cloudflare/Functions were not redeployed because runtime source there did not change.'
