name: Firebase Test Cacheless Bootstrap Fix

on:
  workflow_dispatch:
  push:
    branches:
      - preview
    paths:
      - .github/workflows/firebase-test-cacheless-bootstrap-fix.yml

permissions:
  contents: read

concurrency:
  group: firebase-test-cacheless-bootstrap-fix
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout preview infra
        uses: actions/checkout@v4
        with:
          ref: preview
          path: infra

      - name: Checkout current Vercel test source
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply cacheless bootstrap patch
        run: python3 infra/.deploy/apply-firebase-test-cacheless-bootstrap.py app

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          cp infra/firebase.hosting-test.json app/firebase.hosting-test.json
          cd app
          git diff --check
          git diff --name-only | sort
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/App.tsx src/constants/emailVerification.ts src/firebase.js src/pages/SunoLibraryPage.tsx "
          if git diff -U0 -- src/App.tsx src/pages/SunoLibraryPage.tsx | grep '^+' | grep -E '(setDoc|addDoc|updateDoc|deleteDoc|writeBatch)\(' ; then
            echo 'Unexpected Firestore mutation in patch'
            exit 4
          fi
          echo 'PATCH_SCOPE=PASS'

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        working-directory: app
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build
        working-directory: app
        run: npm run build

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy isolated Firebase test Hosting
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-test.json --non-interactive
          echo 'FIREBASE_TEST_HOSTING_DEPLOY=PASS'

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw-test.web.app/ -o /tmp/test-web.html
          grep -q '<div id="root"></div>' /tmp/test-web.html
          curl -fsS --max-time 30 https://soridraw-test.firebaseapp.com/ -o /tmp/test-firebase.html
          grep -q '<div id="root"></div>' /tmp/test-firebase.html
          f_code="$(curl -sS -o /tmp/f-body -w '%{http_code}' -X OPTIONS -H 'Origin: https://soridraw-test.web.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' https://us-central1-soridraw-app-866a5.cloudfunctions.net/getSunoApiKeyStatus)"
          e_code="$(curl -sS -o /tmp/e-body -w '%{http_code}' -H 'Origin: https://soridraw-test.web.app' 'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1')"
          case "$f_code" in 200|204) ;; *) exit 8 ;; esac
          test "$e_code" = 200
          echo "FUNCTIONS_CORS=$f_code"
          echo "EXPLORE_CORS=$e_code"
          echo 'NO_FIRESTORE_WRITE=true'
          echo 'NO_RULES_DEPLOY=true'
          echo 'NO_FUNCTIONS_DEPLOY=true'
          echo 'NO_PRODUCTION_DEPLOY=true'
