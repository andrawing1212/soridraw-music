name: TEMP 250 Profile Revision Compatibility Verify

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-249-profile-trigger-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offline retirement verification
        run: node scripts/verify-250-profile-shared-revision-retire.mjs

      - name: Exact TEST and PRODUCTION compatibility audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --no-tags
          node <<'NODE'
          const {execFileSync}=require('child_process');
          const show=(ref,path)=>execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:32*1024*1024});
          const path='cloudflare/explore-worker/canonical/preview-worker.js';

          function functionText(src,name){
            const needles=[`async function ${name}(`,`function ${name}(`];
            let start=-1;
            for(const needle of needles){start=src.indexOf(needle);if(start>=0)break;}
            if(start<0) throw new Error('missing function '+name);
            const brace=src.indexOf('{',start);
            let depth=0,quote='',escape=false,comment='';
            for(let i=brace;i<src.length;i++){
              const ch=src[i],next=src[i+1];
              if(comment==='line'){if(ch==='\n')comment='';continue;}
              if(comment==='block'){if(ch==='*'&&next==='/'){comment='';i++;}continue;}
              if(quote){if(escape)escape=false;else if(ch==='\\')escape=true;else if(ch===quote)quote='';continue;}
              if(ch==='/'&&next==='/'){comment='line';i++;continue;}
              if(ch==='/'&&next==='*'){comment='block';i++;continue;}
              if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
              if(ch==='{')depth++;
              if(ch==='}'&&--depth===0)return {start,end:i+1,text:src.slice(start,i+1)};
            }
            throw new Error('unterminated function '+name);
          }

          for(const [label,ref,expectedVersion] of [
            ['TEST','origin/main','124'],
            ['PRODUCTION','origin/production','117'],
          ]){
            const src=show(ref,path);
            const version=JSON.parse(show(ref,'public/app-version.json')).version;
            if(String(version)!==expectedVersion) throw new Error(`${label} app version drift: ${version}`);
            const legacy=functionText(src,'readSharedDataRevision031');
            const withoutLegacy=src.slice(0,legacy.start)+src.slice(legacy.end);
            if(withoutLegacy.includes('readSharedDataRevision031(')) throw new Error(`${label} still calls global shared revision`);
            const feedCompat=functionText(src,'ensureExploreSharedFeedCache031').text;
            if(!feedCompat.includes('syncDerivedFeeds032')) throw new Error(`${label} feed compatibility is not derived-cursor based`);
            const feedRevision=functionText(src,'handleExploreFeedRevision019').text;
            if(!feedRevision.includes('syncDerivedCache032')) throw new Error(`${label} feed revision is not derived-cursor based`);
            if(!src.includes('readExploreSharedProfile060')) throw new Error(`${label} shared public-profile R2 reader missing`);
            console.log(`${label}_APP_VERSION=${version}`);
            console.log(`${label}_GLOBAL_SHARED_REVISION_CALLS=0`);
            console.log(`${label}_FEED_DERIVED_CURSOR=PASS`);
            console.log(`${label}_PROFILE_SHARED_R2=PASS`);
          }
          NODE

      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Read exact live D1 trigger baseline only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT name,sql FROM sqlite_schema
            WHERE type='trigger' AND name IN (
              'explore032_profile_update',
              'explore032_profile_delete',
              'explore032_derived_profile_update',
              'explore032_derived_profile_feed',
              'explore032_derived_track_insert',
              'explore079_music_note_derived_track_insert',
              'explore032_derived_track_update',
              'explore079_music_note_derived_track_update',
              'soridraw_shared_rev_public_profiles_au_051'
            ) ORDER BY name;
          " --json > "$RUNNER_TEMP/live-profile-triggers.json"

          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/live-profile-triggers.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          const by=new Map(rows.map(r=>[String(r.name||''),String(r.sql||'')]));
          for(const name of [
            'explore032_profile_update','explore032_profile_delete',
            'explore032_derived_profile_update','explore032_derived_profile_feed',
            'explore032_derived_track_insert','explore079_music_note_derived_track_insert',
            'explore032_derived_track_update','explore079_music_note_derived_track_update',
            'soridraw_shared_rev_public_profiles_au_051'
          ]) if(!by.get(name)) throw new Error('missing live trigger '+name);

          const profile=by.get('explore032_profile_update')||'';
          const derived=by.get('explore032_derived_profile_update')||'';
          const feed=by.get('explore032_derived_profile_feed')||'';
          const shared=by.get('soridraw_shared_rev_public_profiles_au_051')||'';

          if(!/AFTER\s+UPDATE\s+OF/i.test(profile)||/LEFT\s+JOIN\s+profile_stats/i.test(profile)) throw new Error('249 profile trigger baseline drift');
          if(!/AFTER\s+UPDATE\s+OF\s+followers\s*,\s*following/i.test(derived)) throw new Error('249 follower-only trigger drift');
          if(!/WHEN\s+0/i.test(feed)) throw new Error('249 inert feed trigger drift');
          if(!/source_type[\s\S]*music_note/i.test(by.get('explore079_music_note_derived_track_insert'))) throw new Error('079 insert protection missing');
          if(!/source_type[\s\S]*music_note/i.test(by.get('explore079_music_note_derived_track_update'))) throw new Error('079 update protection missing');

          const normalized=shared.replace(/["`]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
          const expected="create trigger soridraw_shared_rev_public_profiles_au_051 after update on public_profiles begin update explore_shared_revision set revision=revision+1,updated_at=cast(strftime('%s','now') as integer)*1000 where scope='global'; end";
          if(normalized!==expected) throw new Error('shared profile revision trigger exact SQL drift');
          console.log('250_LIVE_249_PROFILE_TRIGGERS=PASS');
          console.log('250_079_MUSIC_NOTE_PROTECTION=PASS');
          console.log('250_SHARED_PROFILE_REVISION_EXACT_BASELINE=PASS');
          console.log('SHARED_PROFILE_REVISION_TRIGGER_SQL_B64='+Buffer.from(shared).toString('base64'));
          console.log('REMOTE_D1_WRITES=0');
          NODE
