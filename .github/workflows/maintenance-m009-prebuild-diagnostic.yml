name: SORIDRAW Maintenance M-009 Prebuild Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m009-prebuild-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Prepare disposable semantic compatibility v5
        shell: bash
        run: |
          python3 .deploy/m009_diagnostic_compat.py
          python3 .deploy/m009_fix_generated_874.py
          python3 .deploy/m009_diagnostic_compat_late.py
          python3 -m py_compile .deploy/apply-874-build-safety.py .deploy/apply-901-music-note-10-incremental-sync.py .deploy/apply-905-recent-songs-cache-live-accounting.py .deploy/apply-910-recent-text-batch-unsave-fix.py .deploy/apply-912-heart-triggered-recent-save.py .deploy/apply-913-recent-save-runtime-fix.py

      - name: Execute complete real prebuild
        shell: bash
        run: |
          set -euo pipefail
          npm run prebuild > /tmp/m009.log 2>&1
          echo 'M009_PREBUILD_EXIT=0'
          tail -n 180 /tmp/m009.log

      - name: Audit generated Recent mutation boundary topology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          text = Path('src/App.tsx').read_text(encoding='utf-8')
          lines = text.splitlines()
          calls=[]
          for i,line in enumerate(lines):
              if 'persistRecentSongsDocument(' in line and 'const persistRecentSongsDocument' not in line:
                  lo=max(0,i-3); hi=min(len(lines),i+4)
                  ctx='\n'.join(lines[lo:hi])
                  calls.append({'line':i+1,'wrapped': 'runV1MutationBoundary' in ctx, 'context':ctx})
          helper = re.search(r"const persistRecentSongsDocument = async \(ref: any, songs: any\[\]\) => \{(?P<body>.*?)\n\};", text, re.S)
          if not helper: raise SystemExit('M009 generated recent helper missing')
          helper_body=helper.group('body')
          raw_helper_write='await setDoc(ref,' in helper_body
          unwrapped=[c for c in calls if not c['wrapped']]
          print('M009_RECENT_HELPER_AUDIT='+json.dumps({'callCount':len(calls),'wrappedCalls':len(calls)-len(unwrapped),'unwrappedCalls':len(unwrapped),'rawHelperWrite':raw_helper_write},ensure_ascii=False))
          for c in calls:
              print(f"--- persist call line {c['line']} wrapped={c['wrapped']} ---")
              print(c['context'])
          if unwrapped:
              raise SystemExit(f'M009 persist helper has unwrapped call-sites: {len(unwrapped)}')
          PY

      - name: Prove no Firebase change
        if: always()
        run: |
          echo 'M009_FIREBASE_DATA_READS=0'
          echo 'M009_FIREBASE_DATA_WRITES=0'
          echo 'M009_FIREBASE_DATA_DELETES=0'
          echo 'M009_RULES_DEPLOYS=0'
          echo 'M009_FUNCTIONS_DEPLOYS=0'
          echo 'M009_HOSTING_DEPLOYS=0'
