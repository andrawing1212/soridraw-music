name: Full release QA free plan preflight (read only)
on:
  push:
    branches: [qa/full-release-handoff-safety]
    paths: ['.github/workflows/full-release-qa-free-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'andrawing1212/soridraw-music' && github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Existing isolated QA subscription and original worker (GET only)
        env:
          CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const qa='b60fcd62c679c64db19f0b0e0c2f3429';
          const base='https://api.cloudflare.com/client/v4/accounts/'+qa;
          const token=process.env.CLOUDFLARE_QA_API_TOKEN;
          assert(token,'QA_EXISTING_READ_TOKEN_REQUIRED');
          const get=async path=>{
           const r=await fetch(base+path,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
           const j=await r.json().catch(()=>null);
           return {status:r.status,ok:r.ok&&j?.success===true,result:j?.result};
          };
          const d=await get('/workers/scripts/soridraw-owner-qa-583/deployments');
          const v=d.result?.deployments?.[0]?.versions;
          assert(d.ok&&v?.length===1&&v[0].version_id==='4ed70845-6a4b-4a80-9c51-ed95d0becc38'&&Number(v[0].percentage)===100,'QA_ORIGINAL_DRIFT');
          console.log('FULL_RELEASE_QA583_ORIGINAL_100=PASS');
          const r=await get('/subscriptions');
          console.log('FULL_RELEASE_QA_SUBSCRIPTION_HTTP='+r.status);
          if(!r.ok||!Array.isArray(r.result)){console.log('FULL_RELEASE_QA_FREE_PLAN=UNVERIFIED; NO_RESOURCES_CREATED');process.exitCode=2;}
          else{
           const rows=r.result.map(x=>({name:String(x.rate_plan?.public_name||x.rate_plan?.name||'').slice(0,120),planId:String(x.rate_plan?.id||'').slice(0,120),state:String(x.state||'').slice(0,30),price:typeof x.price==='number'?x.price:null}));
           console.log('FULL_RELEASE_QA_SUBSCRIPTION_SUMMARY '+JSON.stringify(rows));
           const workers=rows.filter(x=>/workers/i.test(x.name+' '+x.planId));
           const free=workers.some(x=>/free/i.test(x.name+' '+x.planId)&&x.price===0)&&!workers.some(x=>/paid|unbound|bundled/i.test(x.name+' '+x.planId)||x.price>0);
           console.log('FULL_RELEASE_QA_FREE_PLAN='+ (free?'EXPLICIT_FREE_RECORD':'UNVERIFIED')+'; NO_RESOURCES_CREATED');
           if(!free)process.exitCode=2;
          }
          NODE
