name: Stage3 Final Regression Verify

on:
  push:
    branches:
      - preview-stage3-final
    paths:
      - .deploy/stage3_regression_guard.py
      - .github/workflows/stage3-final-regression-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview-stage3-final
          fetch-depth: 0
      - name: Apply regression guards
        run: python3 .deploy/stage3_regression_guard.py
      - name: Cost and freshness assertions
        run: |
          grep -Fq 'skipBundleWrite: true' src/App.tsx
          grep -Fq 'favoriteTotalCount]);' src/pages/FavoritesPage.tsx
          grep -Fq 'ensureLibraryWorkspaceServerFirstPage(resolvedUser.uid, true)' src/pages/SunoLibraryPage.tsx
          if grep -Fq "scheduleListBundleWrite('library'" src/pages/SunoLibraryPage.tsx; then exit 1; fi
          if grep -Fq 'onSnapshot(pageQuery' src/pages/SunoLibraryPage.tsx; then exit 1; fi
          if grep -Fq 'limit(2000)' src/App.tsx; then exit 1; fi
          if grep -Fq 'limit(2000)' src/pages/SunoLibraryPage.tsx; then exit 1; fi
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit verified guards
        run: |
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(stage3): guard pagination cost and re-entry freshness'
          git push origin HEAD:preview-stage3-final
