name: Apply 104 Explore Like Window

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-104-explore-like-window.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-apply-104-explore-like-window
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted 104 patch
        run: python3 .deploy/apply-104-explore-like-window.py

      - name: Verify 104 contract
        run: node scripts/verify-104-explore-like-window.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify change boundary
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/services/exploreLikeService\.ts|src/pages/ExplorePage\.tsx|public/app-version\.json)$'
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev "$allowed"; then
            echo 'Unexpected product file change' >&2
            exit 1
          fi
          test -z "$(git diff --name-only -- cloudflare functions firestore.rules database.rules.json src/components src/styles)"
          echo 'CHANGE_BOUNDARY=PASS'
          echo 'NO_WORKER_CHANGE=true'
          echo 'NO_FIREBASE_FUNCTIONS_RULES_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
          echo 'NO_UI_CSS_CHANGE=true'

      - name: Commit product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/services/exploreLikeService.ts src/pages/ExplorePage.tsx public/app-version.json
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'fix: start Explore public like window on first change'
          git push origin HEAD:preview
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
