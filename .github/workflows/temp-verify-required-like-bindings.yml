name: TEMP Verify Required Like Bindings

on:
  push:
    branches:
      - fix/release-worker-required-like-bindings
    paths:
      - .github/workflows/temp-verify-required-like-bindings.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static release verification
        run: node scripts/verify-release-promotion-system.mjs
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Generate TEST/PRODUCTION dry-run configs
        shell: bash
        run: |
          set -euo pipefail
          node .deploy/release-worker-runtime.mjs test dry-run
          cp cloudflare/explore-worker/.release-system/test/wrangler.jsonc "$RUNNER_TEMP/test.json"
          node .deploy/release-worker-runtime.mjs production dry-run
          cp cloudflare/explore-worker/.release-system/production/wrangler.jsonc "$RUNNER_TEMP/production.json"
          for cfg in "$RUNNER_TEMP/test.json" "$RUNNER_TEMP/production.json"; do
            jq -e '.ratelimits[] | select(.name=="LIKE_RATE_LIMITER" and .namespace_id=="91054" and .simple.limit==60 and .simple.period==60)' "$cfg" >/dev/null
            jq -e '.durable_objects.bindings[] | select(.name=="EXPLORE_LIKE_BATCH_SCHEDULER" and .class_name=="ExploreLikeBatchScheduler103")' "$cfg" >/dev/null
            jq -e '.migrations[] | select(.new_sqlite_classes | index("ExploreLikeBatchScheduler103"))' "$cfg" >/dev/null
          done
          echo RELEASE_REQUIRED_LIKE_BINDINGS_DRY_RUN=PASS
