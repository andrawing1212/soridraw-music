name: Apply header refresh cache once

on:
  push:
    branches:
      - main
    paths:
      - .deploy/apply-header-refresh-cache-trigger.txt

concurrency:
  group: apply-header-refresh-cache-main-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply cached header identity rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          def replace_count(old: str, new: str, expected: int, label: str):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              text = text.replace(old, new)

          replace_once(
              "type AuthMode = 'login' | 'signup' | 'reset';\ntype EmailVerificationGate = 'idle' | 'checking' | 'required';\n\nconst getEmailVerificationCycleKey",
              """type AuthMode = 'login' | 'signup' | 'reset';
          type EmailVerificationGate = 'idle' | 'checking' | 'required';

          type CachedHeaderIdentity = {
            uid: string;
            displayName: string;
            photoURL: string;
          };

          const HEADER_IDENTITY_CACHE_KEY = 'soridraw_header_identity_v1';

          const getHeaderIdentityStorage = (): Storage | null => {
            if (typeof window === 'undefined') return null;
            try {
              return window.localStorage.getItem('rememberLogin') === 'true'
                ? window.localStorage
                : window.sessionStorage;
            } catch {
              return null;
            }
          };

          const readCachedHeaderIdentity = (): CachedHeaderIdentity | null => {
            const storage = getHeaderIdentityStorage();
            if (!storage) return null;
            try {
              const raw = storage.getItem(HEADER_IDENTITY_CACHE_KEY);
              if (!raw) return null;
              const parsed = JSON.parse(raw);
              const uid = String(parsed?.uid || '').trim();
              if (!uid) return null;
              return {
                uid,
                displayName: String(parsed?.displayName || 'My'),
                photoURL: String(parsed?.photoURL || ''),
              };
            } catch {
              return null;
            }
          };

          const getHeaderIdentityFromUser = (
            authUser: Pick<User, 'uid' | 'displayName' | 'photoURL'>,
          ): CachedHeaderIdentity => ({
            uid: authUser.uid,
            displayName: authUser.displayName || 'My',
            photoURL: authUser.photoURL || '',
          });

          const writeCachedHeaderIdentity = (identity: CachedHeaderIdentity) => {
            if (typeof window === 'undefined') return;
            try {
              const storage = getHeaderIdentityStorage();
              if (!storage) return;
              storage.setItem(HEADER_IDENTITY_CACHE_KEY, JSON.stringify(identity));
              const otherStorage = storage === window.localStorage
                ? window.sessionStorage
                : window.localStorage;
              otherStorage.removeItem(HEADER_IDENTITY_CACHE_KEY);
            } catch {}
          };

          const clearCachedHeaderIdentity = () => {
            if (typeof window === 'undefined') return;
            try { window.localStorage.removeItem(HEADER_IDENTITY_CACHE_KEY); } catch {}
            try { window.sessionStorage.removeItem(HEADER_IDENTITY_CACHE_KEY); } catch {}
          };

          const getEmailVerificationCycleKey""",
              'insert cached header identity helpers',
          )

          old_signature = "function Navigation({ user, handleLogin, isLoggingIn, handleLogout, isAdminUser, menuVisibility, menuAdminOnly, sunoLibrarySignal, sunoLibrarySignalDotClass, clearSunoLibrarySignal }: { user: User | null; handleLogin: () => void; isLoggingIn: boolean; handleLogout: () => void; isAdminUser: boolean; menuVisibility: NavigationMenuVisibility; menuAdminOnly: NavigationMenuAdminOnly; sunoLibrarySignal: 'generating' | 'completed' | null; sunoLibrarySignalDotClass: string; clearSunoLibrarySignal: () => void }) {"
          new_signature = """function Navigation({
            user,
            cachedHeaderIdentity,
            isAuthReady,
            handleLogin,
            isLoggingIn,
            handleLogout,
            isAdminUser,
            menuVisibility,
            menuAdminOnly,
            sunoLibrarySignal,
            sunoLibrarySignalDotClass,
            clearSunoLibrarySignal,
          }: {
            user: User | null;
            cachedHeaderIdentity: CachedHeaderIdentity | null;
            isAuthReady: boolean;
            handleLogin: () => void;
            isLoggingIn: boolean;
            handleLogout: () => void;
            isAdminUser: boolean;
            menuVisibility: NavigationMenuVisibility;
            menuAdminOnly: NavigationMenuAdminOnly;
            sunoLibrarySignal: 'generating' | 'completed' | null;
            sunoLibrarySignalDotClass: string;
            clearSunoLibrarySignal: () => void;
          }) {"""
          replace_once(old_signature, new_signature, 'expand Navigation props')

          replace_once(
              "  const profileTimeoutRef = useRef<NodeJS.Timeout | null>(null);\n  const isActivePath",
              """  const profileTimeoutRef = useRef<NodeJS.Timeout | null>(null);
            const headerIdentity = user
              ? getHeaderIdentityFromUser(user)
              : !isAuthReady
                ? cachedHeaderIdentity
                : null;
            const isHeaderAuthPending = !isAuthReady && !user && Boolean(cachedHeaderIdentity);
            const isActivePath""",
              'derive cached header identity',
          )

          replace_once(
              "  const goToTopNav = (path: string, options?: { clearSuno?: boolean }) => {\n    if (!user) {",
              """  const goToTopNav = (path: string, options?: { clearSuno?: boolean }) => {
              if (!isAuthReady) return;
              if (!user) {""",
              'guard navigation during auth restore',
          )

          replace_once(
              "        <div className=\"flex min-w-[176px] shrink-0 items-center justify-end gap-2.5\">\n          {user && (",
              "        <div className=\"flex min-w-[176px] shrink-0 items-center justify-end gap-2.5\">\n          {headerIdentity && (",
              'keep desktop site icons visible',
          )

          replace_once(
              "            </>\n          )}\n          {user ? (\n            <>",
              "            </>\n          )}\n          {headerIdentity ? (\n            <>",
              'keep desktop profile visible',
          )

          replace_once(
              "              {user ? (\n                <button",
              "              {headerIdentity ? (\n                <button",
              'keep mobile profile visible',
          )

          replace_once(
              "                  onClick={() => {\n                    setIsProfileOpen((prev) => !prev);\n                    setIsExpanded(false);\n                  }}",
              """                  onClick={() => {
                    if (!user || !isAuthReady) return;
                    setIsProfileOpen((prev) => !prev);
                    setIsExpanded(false);
                  }}""",
              'block profile menu until auth ready',
          )

          replace_count(
              "src={user.photoURL || 'https://picsum.photos/seed/user/100/100'}",
              "src={headerIdentity.photoURL || 'https://picsum.photos/seed/user/100/100'}",
              2,
              'use cached profile image',
          )
          replace_once(
              "{user.displayName || 'My'}",
              "{headerIdentity.displayName || 'My'}",
              'use cached display name',
          )

          replace_count(
              'className="h-full w-full object-cover"\n                  loading="lazy"',
              'className="h-full w-full object-cover"\n                  loading="eager"\n                  fetchPriority="high"',
              3,
              'eager-load three site icons',
          )

          replace_once(
              """src={headerIdentity.photoURL || 'https://picsum.photos/seed/user/100/100'}
                  alt="Profile"
                  className="h-[30px] w-[30px] shrink-0 rounded-xl object-cover"
                  referrerPolicy="no-referrer"""",
              """src={headerIdentity.photoURL || 'https://picsum.photos/seed/user/100/100'}
                  alt="Profile"
                  className="h-[30px] w-[30px] shrink-0 rounded-xl object-cover"
                  referrerPolicy="no-referrer"
                  loading="eager"
                  fetchPriority="high"""",
              'eager-load desktop profile image',
          )
          replace_once(
              """src={headerIdentity.photoURL || 'https://picsum.photos/seed/user/100/100'}
                    alt="Profile"
                    className="h-8 w-8 rounded-xl object-cover"
                    referrerPolicy="no-referrer"""",
              """src={headerIdentity.photoURL || 'https://picsum.photos/seed/user/100/100'}
                    alt="Profile"
                    className="h-8 w-8 rounded-xl object-cover"
                    referrerPolicy="no-referrer"
                    loading="eager"
                    fetchPriority="high"""",
              'eager-load mobile profile image',
          )

          replace_once(
              "  const [user, setUser] = useState<User | null>(null);",
              """  const [user, setUser] = useState<User | null>(() => auth.currentUser);
            const [cachedHeaderIdentity, setCachedHeaderIdentity] = useState<CachedHeaderIdentity | null>(
              readCachedHeaderIdentity,
            );""",
              'initialize auth and cached identity state',
          )

          replace_once(
              "    const unsubscribe = onAuthStateChanged(auth, (currentUser) => {\n      setUser(currentUser);\n      setIsAuthReady(true);",
              """    const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              if (currentUser) {
                const nextHeaderIdentity = getHeaderIdentityFromUser(currentUser);
                setCachedHeaderIdentity(nextHeaderIdentity);
                writeCachedHeaderIdentity(nextHeaderIdentity);
              } else {
                setCachedHeaderIdentity(null);
                clearCachedHeaderIdentity();
              }
              setIsAuthReady(true);""",
              'sync cached identity from auth listener',
          )

          explicit_logout_old = "      await presenceControllerRef.current?.stop();\n      presenceControllerRef.current = null;\n      await signOut(auth);"
          explicit_logout_new = """      await presenceControllerRef.current?.stop();
              presenceControllerRef.current = null;
              setCachedHeaderIdentity(null);
              clearCachedHeaderIdentity();
              await signOut(auth);"""
          explicit_count = text.count(explicit_logout_old)
          if explicit_count < 2:
              raise SystemExit(f'clear cached identity on explicit logout: expected at least 2 matches, found {explicit_count}')
          text = text.replace(explicit_logout_old, explicit_logout_new)

          replace_once(
              "      await presenceControllerRef.current?.stop().catch(() => {});\n      presenceControllerRef.current = null;\n      await signOut(auth).catch(() => {});",
              """      await presenceControllerRef.current?.stop().catch(() => {});
              presenceControllerRef.current = null;
              setCachedHeaderIdentity(null);
              clearCachedHeaderIdentity();
              await signOut(auth).catch(() => {});""",
              'clear cached identity on forced logout fallback',
          )

          replace_once(
              "      <Navigation user={user} handleLogin={handleLogin} isLoggingIn={isLoggingIn} handleLogout={handleLogout} isAdminUser={isAdminMenuUser} menuVisibility={menuVisibility} menuAdminOnly={menuAdminOnly} sunoLibrarySignal={sunoLibrarySignal} sunoLibrarySignalDotClass={sunoLibrarySignalDotClass} clearSunoLibrarySignal={clearSunoLibrarySignal} />",
              """      <Navigation
                user={user}
                cachedHeaderIdentity={cachedHeaderIdentity}
                isAuthReady={isAuthReady}
                handleLogin={handleLogin}
                isLoggingIn={isLoggingIn}
                handleLogout={handleLogout}
                isAdminUser={isAdminMenuUser}
                menuVisibility={menuVisibility}
                menuAdminOnly={menuAdminOnly}
                sunoLibrarySignal={sunoLibrarySignal}
                sunoLibrarySignalDotClass={sunoLibrarySignalDotClass}
                clearSunoLibrarySignal={clearSunoLibrarySignal}
              />""",
              'pass cached identity into Navigation',
          )

          replace_once(
              '                  aria-label="계정 메뉴"\n                  title="계정 메뉴"',
              '                  aria-label="계정 메뉴"\n                  title="계정 메뉴"\n                  aria-busy={isHeaderAuthPending}',
              'mark pending cached profile state',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Commit header refresh fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: keep header identity visible during auth restore"
          git push origin HEAD:main
