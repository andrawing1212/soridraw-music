name: SORIDRAW APP651 PREVIEW Follow primary row count fix
on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/app651-preview-follow-primary-returning.mjs'
      - '.github/workflows/follow-651-preview-rowcount-release.yml'
      - 'scripts/app650-follow-primary-rowcount.mjs'
      - 'scripts/verify-650-follow-primary-rowcount.py'
  push:
    branches: [preview]
    paths:
      - '.deploy/app651-preview-follow-rowcount.trigger'
permissions:
  contents: read
concurrency:
  group: soridraw-app651-preview-follow-one-module
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify one function patch and synthetic Follow/Unfollow/Refollow
        run: |
          set -euo pipefail
          node --check scripts/app651-preview-follow-primary-returning.mjs
          node scripts/app651-preview-follow-primary-returning.mjs --self-test
          python3 scripts/verify-650-follow-primary-rowcount.py
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 3, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require approved exact one-Worker follow-only trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview
          test "$(git diff --name-only HEAD^ HEAD)" = '.deploy/app651-preview-follow-rowcount.trigger'
          f=.deploy/app651-preview-follow-rowcount.trigger
          grep -Fxq 'director_approval=YES_PREVIEW_WORKER_ONE_FOLLOW_PRIMARY_ROWCOUNT' "$f"
          grep -Fxq "source_parent=$(git rev-parse HEAD^)" "$f"
          grep -Fxq 'safe_active_100=962ee432-fadb-456e-8836-50675aa76b84' "$f"
          grep -Fxq 'canary_active_0=6b13cde4-4a53-42d2-873f-361f7cf5a931' "$f"
          grep -Fxq 'preserve=D1_R2_Firebase_TEST_PRODUCTION_and_notification_triggers' "$f"
          echo "APP651_RELEASE_PARENT=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          node --check scripts/app651-preview-follow-primary-returning.mjs
          node scripts/app651-preview-follow-primary-returning.mjs --self-test
          python3 scripts/verify-650-follow-primary-rowcount.py
      - name: Stage exact one module from live safe PREVIEW Worker and switch only PREVIEW
        run: node scripts/app651-preview-follow-primary-returning.mjs --apply-once
