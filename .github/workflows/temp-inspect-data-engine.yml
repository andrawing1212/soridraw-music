name: Temp Inspect Data Engine Anchors

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-data-engine.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Inspect current data paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MUSIC NOTE CACHE BOOTSTRAP FULL ==='
          sed -n '9250,9475p' src/App.tsx
          echo '=== MUSIC NOTE UNSAVE FULL ==='
          sed -n '9980,10075p' src/App.tsx
          echo '=== LIBRARY SESSION + SAVE CACHE ==='
          sed -n '360,455p' src/pages/SunoLibraryPage.tsx
          sed -n '1470,1510p' src/pages/SunoLibraryPage.tsx
          echo '=== FUNCTIONS TAIL ==='
          tail -n 20 functions/src/index.ts
          echo '=== MEDIA ROUTES TAIL ==='
          tail -n 55 cloudflare/media-worker/src/index.js
