name: TEMP 366 Publication Public Regression Measure

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-366-publication-public-regression-measure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static 364 verifier
        shell: bash
        run: |
          set +e
          node scripts/verify-364-publication-read-compaction-compat.mjs > "$RUNNER_TEMP/verify-366.log" 2>&1
          code=$?
          echo "VERIFY_EXIT=$code" >> "$RUNNER_TEMP/verify-366.log"
          cat "$RUNNER_TEMP/verify-366.log"
          exit 0
      - name: Measure isolated 364 paths
        shell: bash
        run: |
          set +e
          node scripts/measure-362-isolated-publication-live-trigger-reads.mjs > "$RUNNER_TEMP/measure-366.log" 2>&1
          code=$?
          echo "MEASURE_EXIT=$code" >> "$RUNNER_TEMP/measure-366.log"
          cat "$RUNNER_TEMP/measure-366.log"
          exit 0
      - name: Persist measurement result
        shell: bash
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/verify-366.log"
            echo "---"
            cat "$RUNNER_TEMP/measure-366.log"
          } > .deploy/temp-366-publication-public-regression-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/temp-366-publication-public-regression-result.txt
          git commit -m "test(publication): record isolated 366 measurement"
          git push origin HEAD:preview
      - name: Cleanup temp D1
        if: always()
        run: node scripts/measure-362-isolated-publication-live-trigger-reads.mjs cleanup
