name: SORIDRAW 192 Navigation Visibility Release

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-192-navigation-settings-release.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-192-navigation-settings-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HOSTING_PROJECT: soridraw
      SHARED_DATA_PROJECT: soridraw-app-866a5
      PREVIEW_URL: https://preview.soridraw.com/
      TEST_URL: https://test.soridraw.com/
      PRODUCTION_URL: https://soridraw.com/
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Lock source and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/preview
          git rev-parse origin/main > "$RUNNER_TEMP/main-before.sha"
          git rev-parse origin/production > "$RUNNER_TEMP/production-before.sha"
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$TEST_URL" -o "$RUNNER_TEMP/test-before.html"
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$PRODUCTION_URL" -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/test-before.html" | awk '{print $1}' > "$RUNNER_TEMP/test-before.sha"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          test "$(node -e "process.stdout.write(String(require('./public/app-version.json').version||''))")" = "192"
          node scripts/verify-214-navigation-visibility-sync.mjs
          echo "LOCKED_RELEASE_SHA=$GITHUB_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build app
        run: npm run build

      - name: Protected app verifier
        run: node scripts/verify-213-explore-more-page-cache.mjs

      - name: Install Functions
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Build Functions exact deploy source
        run: npm --prefix functions run build

      - name: Verify only new callable contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'export const adminSetNavigationVisibility = onCall' functions/src/securedIndex.ts
          grep -Fq 'requireAdminCaller(request, "appSettings")' functions/src/securedIndex.ts
          grep -Fq 'publicSync/navigationVisibility' functions/src/securedIndex.ts
          echo 'FUNCTION_214_SOURCE=PASS'

      - name: Compile RTDB rules locally
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest emulators:exec             --only database             --project demo-soridraw-navigation-192             "node -e \"console.log('RTDB_RULES_COMPILE=PASS')\""

      - name: Authenticate Firebase shared backend
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Deploy only new navigation callable
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --project "$SHARED_DATA_PROJECT"             --config firebase.json             --only functions:adminSetNavigationVisibility             --non-interactive
          echo 'FUNCTION_ADMIN_SET_NAVIGATION_VISIBILITY_DEPLOY=PASS'

      - name: Deploy shared RTDB rules exact source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --project "$SHARED_DATA_PROJECT"             --config firebase.json             --only database             --non-interactive
          echo 'SHARED_RTDB_RULES_192_DEPLOY=PASS'

      - name: Seed tiny RTDB mirror from current Firestore authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('./functions/node_modules/firebase-admin');
          admin.initializeApp({
            projectId: 'soridraw-app-866a5',
            databaseURL: 'https://soridraw-app-866a5-default-rtdb.firebaseio.com',
          });
          const keys = ['home','explore','studio','musicNote','library','lab','myPage'];
          const defaultsVisible = {home:true, explore:true, studio:true, musicNote:true, library:false, lab:true, myPage:true};
          const defaultsAdmin = {home:false, explore:false, studio:false, musicNote:false, library:false, lab:false, myPage:false};
          (async () => {
            const snap = await admin.firestore().collection('app_settings').doc('navigation_visibility').get();
            const data = snap.exists ? (snap.data() || {}) : {};
            const visSrc = data.menuVisibility && typeof data.menuVisibility === 'object' ? data.menuVisibility : {};
            const admSrc = data.menuAdminOnly && typeof data.menuAdminOnly === 'object' ? data.menuAdminOnly : {};
            const menuVisibility = {};
            const menuAdminOnly = {};
            for (const key of keys) {
              menuVisibility[key] = typeof visSrc[key] === 'boolean'
                ? visSrc[key]
                : key === 'library' && typeof data.showSunoLibraryMenu === 'boolean'
                  ? data.showSunoLibraryMenu
                  : defaultsVisible[key];
              menuAdminOnly[key] = typeof admSrc[key] === 'boolean'
                ? admSrc[key]
                : key === 'library' && typeof data.sunoLibraryMenuAdminOnly === 'boolean'
                  ? data.sunoLibraryMenuAdminOnly
                  : defaultsAdmin[key];
            }
            const now = Date.now();
            const revision = now.toString(36) + '-seed192';
            await admin.database().ref('publicSync/navigationVisibility').set({
              revision, updatedAt: now, menuVisibility, menuAdminOnly,
            });
            const verify = (await admin.database().ref('publicSync/navigationVisibility').get()).val();
            if (!verify || verify.revision !== revision) throw new Error('RTDB navigation mirror seed verification failed');
            console.log('NAVIGATION_VISIBILITY_SEED=PASS');
            console.log('FIRESTORE_READ=1');
            console.log('FIRESTORE_WRITE=0');
            console.log('RTDB_MIRROR_WRITE=1');
          })().then(() => process.exit(0)).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Deploy PREVIEW Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --only hosting             --project "$HOSTING_PROJECT"             --config firebase.hosting-preview.json             --non-interactive
          echo 'FIREBASE_PREVIEW_192_DEPLOY=PASS'

      - name: Verify PREVIEW exact build and app version
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          ok=''
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$PREVIEW_URL" -o "$RUNNER_TEMP/preview.html"; then
              remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
              if [ "$remote_sha" = "$local_sha" ]; then ok=yes; break; fi
            fi
            sleep 2
          done
          test "$ok" = yes
          remote_version="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${PREVIEW_URL}app-version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).version||'')))")"
          test "$remote_version" = '192'
          echo "PREVIEW_APP_VERSION=$remote_version"
          echo 'PREVIEW_EXACT_BUILD=PASS'

      - name: Verify deployed navigation RTDB node
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('./functions/node_modules/firebase-admin');
          admin.initializeApp({
            projectId: 'soridraw-app-866a5',
            databaseURL: 'https://soridraw-app-866a5-default-rtdb.firebaseio.com',
          }, 'verify');
          (async () => {
            const value = (await admin.app('verify').database().ref('publicSync/navigationVisibility').get()).val();
            const keys = ['home','explore','studio','musicNote','library','lab','myPage'];
            if (!value?.revision) throw new Error('navigation revision missing');
            for (const key of keys) {
              if (typeof value?.menuVisibility?.[key] !== 'boolean') throw new Error('visibility key missing: '+key);
              if (typeof value?.menuAdminOnly?.[key] !== 'boolean') throw new Error('admin key missing: '+key);
            }
            console.log('LIVE_NAVIGATION_VISIBILITY_RTDB=PASS');
          })().then(() => process.exit(0)).catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify TEST and PRODUCTION code unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$TEST_URL" -o "$RUNNER_TEMP/test-after.html"
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$PRODUCTION_URL" -o "$RUNNER_TEMP/prod-after.html"
          test "$(sha256sum "$RUNNER_TEMP/test-after.html" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/test-before.sha")"
          test "$(sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/prod-before.sha")"
          echo 'TEST_PRODUCTION_CODE_HOSTING_UNCHANGED=PASS'
          echo 'NOTE_SHARED_FUNCTION_AND_RTDB_RULES_ARE_COMMON_BACKEND=true'

      - name: Release summary
        run: |
          echo "APP192_RELEASE_SHA=$GITHUB_SHA"
          echo 'OTHER_APP_FEATURES_UNCHANGED=true'
          echo 'CLOUDFLARE_WORKER_DEPLOY=false'
          echo 'D1_CHANGE=false'
          echo 'FIRESTORE_SCHEMA_CHANGE=false'
          echo 'USER_DATA_MIGRATION=false'
