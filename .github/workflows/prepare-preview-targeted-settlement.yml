name: SORIDRAW PREVIEW Targeted Settlement Candidate

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/prepare-preview-targeted-settlement.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-preview-targeted-settlement-candidate
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply only targeted settlement patch to pinned canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/soridraw-targeted-settlement"
          mkdir -p "$RUNNER_TEMP/soridraw-targeted-settlement"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/soridraw-targeted-settlement/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/soridraw-targeted-settlement" \
            node cloudflare/explore-worker/patches/090-targeted-personal-like-settlement.mjs
          node --check "$RUNNER_TEMP/soridraw-targeted-settlement/worker.js"
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/soridraw-targeted-settlement/worker.js" \
            node scripts/verify-210-targeted-personal-like-settlement.mjs
          echo 'TARGETED_SETTLEMENT_CANDIDATE=PASS'

      - name: Pin candidate canonical source
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/soridraw-targeted-settlement/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release-bot@users.noreply.github.com'
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git diff --cached --quiet && { echo 'No canonical change'; exit 0; }
          git commit -m 'infra(preview): pin targeted settlement Worker candidate'
          git push origin HEAD:preview
          echo 'TARGETED_SETTLEMENT_CANONICAL_COMMIT=PASS'
