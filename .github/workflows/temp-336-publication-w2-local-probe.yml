name: TEMP 336 Publication W2 Diagnostic Probe

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-336-publication-w2-local-probe.yml'
      - 'cloudflare/explore-worker/diagnostics/20261004_music_note_w2_cutover_local_baseline.sql'
      - 'cloudflare/explore-worker/diagnostics/20261004_music_note_w2_cutover_local_candidate.sql'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Guard diagnostic DB and measure baseline vs W2 candidate
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          BASE="$PWD/diagnostics/20261004_music_note_w2_cutover_local_baseline.sql"
          CANDIDATE="$PWD/diagnostics/20261004_music_note_w2_cutover_local_candidate.sql"

          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('canonical/wrangler.preview.jsonc','utf8'));
          const db=(cfg.d1_databases||[]).find(x=>x.binding==='DB');
          const rate=(cfg.d1_databases||[]).find(x=>x.binding==='RATE_DB');
          if(!db||!rate) throw new Error('DB/RATE_DB binding missing');
          if(rate.database_id===db.database_id) throw new Error('RATE_DB unexpectedly equals shared canonical DB');
          if(rate.database_name!=='soridraw-explore-preview-db') throw new Error('unexpected RATE_DB '+rate.database_name);
          console.log('DIAGNOSTIC_DB_GUARD=PASS '+rate.database_name);
          console.log('SHARED_CANONICAL_DB_UNTOUCHED='+db.database_name);
          NODE

          cleanup() {
            set +e
            node "$WRANGLER" d1 execute RATE_DB --remote --config "$CFG" --command "
              DROP TRIGGER IF EXISTS w2p336_track_insert;
              DROP TRIGGER IF EXISTS w2p336_track_update;
              DROP TRIGGER IF EXISTS w2p336_shared_rev_ai;
              DROP TRIGGER IF EXISTS w2p336_shared_rev_au;
              DROP TABLE IF EXISTS explore_derived_w2p336_tracks;
              DROP TABLE IF EXISTS w2p336_derived_tracks;
              DROP TABLE IF EXISTS w2p336_derived_profiles;
              DROP TABLE IF EXISTS w2p336_track_stats;
              DROP TABLE IF EXISTS w2p336_shared_revision;
              DROP TABLE IF EXISTS w2p336_tracks;
            " >/dev/null 2>&1
          }
          trap cleanup EXIT
          cleanup

          run_json() {
            local sql="$1"
            local out="$2"
            node "$WRANGLER" d1 execute RATE_DB --remote --config "$CFG" --command "$sql" --json > "$out"
          }

          meta_write() {
            node - "$1" <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=Array.isArray(raw)?raw:(raw?.result||[]);
          const metas=[];
          for(const item of rows){
            if(item?.meta) metas.push(item.meta);
            if(Array.isArray(item?.results)) for(const nested of item.results) if(nested?.meta) metas.push(nested.meta);
          }
          const values=metas.map(m=>Number(m.rows_written ?? m.rowsWritten ?? 0)).filter(Number.isFinite);
          if(!values.length) {
            console.error(JSON.stringify(raw));
            throw new Error('rows_written meta missing');
          }
          process.stdout.write(String(values.reduce((a,b)=>a+b,0)));
          NODE
          }

          setup_base() {
            node "$WRANGLER" d1 execute RATE_DB --remote --config "$CFG" --command="$(sed '/^[[:space:]]*--/d' "$BASE")" --json > "$RUNNER_TEMP/setup-base.json"
            run_json "SELECT name,type FROM sqlite_schema WHERE name LIKE 'w2p336_%' OR name LIKE 'idx_w2p336_%' ORDER BY type,name" "$RUNNER_TEMP/setup-schema.json"
            node - "$RUNNER_TEMP/setup-schema.json" <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=(Array.isArray(raw)?raw:(raw?.result||[])).flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          if(!rows.some(r=>r.name==='w2p336_tracks'&&r.type==='table')) throw new Error('w2p336_tracks setup missing');
          console.log('W2P336_FIXTURE_SETUP=PASS objects='+rows.length);
          NODE
          }

          INSERT_SQL="INSERT INTO w2p336_tracks(id,owner_uid,source_type,source_id,source_subtrack_key,title,cover_url,suno_url_primary,is_public,status,published_at,created_at,updated_at,primary_genre) VALUES('music_note_probe-user_note-new','probe-user','music_note','note-new','','Probe Song','https://example.test/a.webp','https://example.test/a.mp3',1,'published',3000,3000,3000,'Indie Pop')"
          SWAP_SQL="UPDATE w2p336_tracks SET cover_url='https://example.test/b.webp',suno_url_primary='https://example.test/b.mp3',updated_at=3100 WHERE id='music_note_probe-user_note-new'"
          VIS_SQL="UPDATE w2p336_tracks SET is_public=0,updated_at=3200 WHERE id='music_note_probe-user_note-new'"

          setup_base
          run_json "$INSERT_SQL" "$RUNNER_TEMP/base-insert.json"
          BASE_INSERT="$(meta_write "$RUNNER_TEMP/base-insert.json")"
          run_json "$SWAP_SQL" "$RUNNER_TEMP/base-swap.json"
          BASE_SWAP="$(meta_write "$RUNNER_TEMP/base-swap.json")"
          run_json "$VIS_SQL" "$RUNNER_TEMP/base-vis.json"
          BASE_VIS="$(meta_write "$RUNNER_TEMP/base-vis.json")"

          cleanup
          setup_base
          node "$WRANGLER" d1 execute RATE_DB --remote --config "$CFG" --command="$(sed '/^[[:space:]]*--/d' "$CANDIDATE")" --json > "$RUNNER_TEMP/setup-candidate.json"
          run_json "$INSERT_SQL" "$RUNNER_TEMP/cand-insert.json"
          CAND_INSERT="$(meta_write "$RUNNER_TEMP/cand-insert.json")"
          run_json "$SWAP_SQL" "$RUNNER_TEMP/cand-swap.json"
          CAND_SWAP="$(meta_write "$RUNNER_TEMP/cand-swap.json")"
          run_json "$VIS_SQL" "$RUNNER_TEMP/cand-vis.json"
          CAND_VIS="$(meta_write "$RUNNER_TEMP/cand-vis.json")"

          for value in "$BASE_INSERT" "$CAND_INSERT" "$BASE_SWAP" "$CAND_SWAP" "$BASE_VIS" "$CAND_VIS"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "INVALID_ROWS_WRITTEN=$value"; exit 1; }
          done

          echo "BASELINE_FIRST_PUBLICATION_W=$BASE_INSERT"
          echo "CANDIDATE_FIRST_PUBLICATION_W=$CAND_INSERT"
          echo "BASELINE_SOURCE_SWAP_W=$BASE_SWAP"
          echo "CANDIDATE_SOURCE_SWAP_W=$CAND_SWAP"
          echo "BASELINE_VISIBILITY_W=$BASE_VIS"
          echo "CANDIDATE_VISIBILITY_W=$CAND_VIS"

          test "$BASE_INSERT" -ge 10
          test "$CAND_INSERT" -le 2
          test "$BASE_SWAP" -ge 3
          test "$CAND_SWAP" -le 2
          test "$BASE_VIS" -ge 2
          test "$CAND_VIS" -le 2
          test "$CAND_INSERT" -lt "$BASE_INSERT"
          test "$CAND_SWAP" -lt "$BASE_SWAP"

          cleanup
          trap - EXIT
          echo 'DIAGNOSTIC_D1_W2_CUTOVER_MODEL=PASS'
          echo 'SHARED_USER_DATA_WRITES=0'
          echo 'USER_DATA_MIGRATION=0'
