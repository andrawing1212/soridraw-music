name: Diagnose Preview Pagination Runtime

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/diagnose-preview-pagination-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate base source
        run: npm run prebuild

      - name: Apply 984
        run: python3 .deploy/apply-984-music-note-server-first-more.py

      - name: Apply 985
        run: python3 .deploy/apply-985-music-note-normalized-page-chain.py

      - name: Check 986 Firestore import anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          firestore=list(re.finditer(r"import\s*\{(?P<body>.*?)\}\s*from\s*['\"]firebase/firestore['\"]\s*;", app, re.S))
          if not any('startAfter' in m.group('body') and 'getDocs' in m.group('body') for m in firestore): raise SystemExit(1)
          PY

      - name: Check 986 active save anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          active=len(re.findall(r'(?m)^[ \t]*saved: true,\n(?![ \t]*musicNoteListEligible:)', app))
          if active < 2: raise SystemExit(1)
          PY

      - name: Check 986 inactive save anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          inactive=len(re.findall(r'(?m)^[ \t]*saved: false,\n(?![ \t]*musicNoteListEligible:)', app))
          if inactive < 1: raise SystemExit(1)
          PY

      - name: Check 986 allowed-key anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          old="'hidden', 'favoriteHidden', 'favoriteRemoved', 'favoriteRemovedAt', 'saved', 'isLocked',"
          new="'hidden', 'favoriteHidden', 'favoriteRemoved', 'favoriteRemovedAt', 'saved', 'musicNoteListEligible', 'isLocked',"
          if old not in app and new not in app: raise SystemExit(1)
          PY

      - name: Check 986 Favorites data anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          checks=[
            "import { favoritesStore } from '../hooks/useFavoritesStore';\n",
            "  const [selectedSong, setSelectedSong] = useState<any | null>(null);\n",
            "      sourceType: 'shared_music_note',\n",
            """    const updates = {\n      hidden: true,\n      favoriteHidden: true,\n      isPublic: false,\n      deletedAt: serverTimestamp(),\n      trashedAt,\n    };""",
            """    const updates = {\n      hidden: false,\n      favoriteHidden: false,\n      deletedAt: null,\n      trashedAt: null,\n    };""",
          ]
          if any(x not in f for x in checks): raise SystemExit(1)
          PY

      - name: Check 986 Favorites UI anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          f=Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          if "  const canShowCachedMusicNoteMore = visibleCount < filteredFavorites.length;\n" not in f: raise SystemExit(1)
          m=re.search(r"(?P<head>  const canRequestMoreMusicNotePage = Boolean\(\n)(?P<body>.*?)(?P<tail>\n  \);)", f, re.S)
          if not m or '    hasMoreFavorites' not in m.group('body'): raise SystemExit(1)
          more='''          {shouldShowMusicNoteMoreButton && (\n            <div className="flex justify-center pt-1" data-selection-keep="true">'''
          if more not in f: raise SystemExit(1)
          PY

      - name: Check 986 loadMore anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          s='  const loadMoreFavorites = useCallback(async () => {'
          e='  const syncMusicNoteIncrementalFromRemoteVersion = useCallback'
          start=app.find(s); end=app.find(e,start)
          if start < 0 or end < 0 or 'SORIDRAW_985_MUSIC_NOTE_NORMALIZED_PAGE_CHAIN' not in app[start:end]: raise SystemExit(1)
          PY

      - name: Apply 986
        run: python3 .deploy/apply-986-music-note-active-only-pagination.py

      - name: Apply 980 Library recovery
        run: python3 .deploy/apply-980-library-pagination-metadata-recovery.py

      - name: Verify 986 bounded query and migration paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          favorites=Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          start=app.index('  const loadMoreFavorites = useCallback(async () => {')
          end=app.index('  const syncMusicNoteIncrementalFromRemoteVersion = useCallback',start)
          block=app[start:end]
          required=["where('musicNoteListEligible', '==', true)","orderBy('createdAtMs', 'desc')","orderBy(documentId(), 'desc')",'startAfter(cursorCreatedAtMs, cursorId)','limit(FAVORITES_PAGE_SIZE)','cursorItem?.firestoreId || cursorItem?.id','firestoreId: docSnap.id']
          if any(x not in block for x in required): raise SystemExit(1)
          if 'while (' in block or 'FAVORITES_PAGE_SIZE + 1' in block: raise SystemExit(1)
          ui=['musicNoteListEligible: false','musicNoteListEligible: true','musicNoteProfileCount','musicNoteRemainingCount','전체 {musicNoteProfileCount}곡 · 현재 {musicNoteCurrentCount}곡 · 남은 {musicNoteRemainingCount}곡']
          if any(x not in favorites for x in ui): raise SystemExit(1)
          PY

      - name: Typecheck and build generated source
        run: |
          npx tsc --noEmit
          npx vite build

      - name: Confirm read-only
        run: |
          echo 'READ-ONLY diagnostic only.'
          echo 'No Hosting deploy, Functions deploy, Firestore/index/Rules write, user-data migration, main change, or production change.'
