name: SORIDRAW Backend V2 Step 3-4e Recent Songs

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4e-recent-songs.yml'

permissions:
  contents: read

jobs:
  recent-songs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      EXPECTED_BUNDLE_COUNT: '10'
      EXPECTED_RECENT_ITEM_COUNT: '68'
      MAX_WRITES: '68'
      BATCH_SIZE: '25'
      APPROVED_SCOPE: 'Step 3-4e recent-song 68 limited Backfill approved 2026-08-26 KST'

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate exact Firebase project session
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Preflight IAM, free-tier headroom and rollback checkpoint
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$TARGET_PROJECT"
          export GCLOUD_PROJECT="$TARGET_PROJECT"
          export GOOGLE_CLOUD_QUOTA_PROJECT="$TARGET_PROJECT"
          node <<'NODE'
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = process.env.TARGET_PROJECT;
          const bucketName = process.env.TARGET_BUCKET;
          const backupPrefix = process.env.BACKUP_PREFIX;
          const expectedManifestHash = process.env.EXPECTED_MANIFEST_SHA256;
          const expectedBundles = Number(process.env.EXPECTED_BUNDLE_COUNT || 0);
          const expectedItems = Number(process.env.EXPECTED_RECENT_ITEM_COUNT || 0);
          const maxWrites = Number(process.env.MAX_WRITES || 0);
          const batchSize = Number(process.env.BATCH_SIZE || 0);
          const approvedScope = String(process.env.APPROVED_SCOPE || '');

          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          if (bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('BUCKET_PIN_MISMATCH');
          if (expectedBundles !== 10 || expectedItems !== 68 || maxWrites !== 68 || batchSize !== 25 || batchSize > 25) throw new Error('RECENT_CAP_MISMATCH');
          if (!approvedScope.includes('Step 3-4e') || !approvedScope.includes('68')) throw new Error('APPROVAL_SCOPE_MARKER_MISSING');

          const metricValue = (point) => {
            const raw = point?.value?.int64Value ?? point?.value?.doubleValue ?? 0;
            const value = Number(raw);
            return Number.isFinite(value) && value > 0 ? value : 0;
          };
          const now = new Date();
          const kstDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
          const dayStartMs = Date.parse(`${kstDate}T00:00:00+09:00`);
          const recentStartMs = now.getTime() - 10 * 60_000;

          const queryMetric = async (accessToken, metricType) => {
            const params = new URLSearchParams({
              filter: `metric.type = "${metricType}"`,
              'interval.startTime': new Date(dayStartMs).toISOString(),
              'interval.endTime': now.toISOString(),
              view: 'FULL',
              pageSize: '1000',
            });
            let pageToken = '';
            let today = 0;
            let recent = 0;
            let pointCount = 0;
            let pages = 0;
            do {
              if (pageToken) params.set('pageToken', pageToken); else params.delete('pageToken');
              const response = await fetch(`https://monitoring.googleapis.com/v3/projects/${projectId}/timeSeries?${params}`, {
                headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, Accept: 'application/json' },
              });
              const text = await response.text();
              if (!response.ok) {
                const error = new Error(`MONITORING_${response.status}`);
                error.statusCode = response.status;
                throw error;
              }
              const payload = text ? JSON.parse(text) : {};
              for (const series of payload.timeSeries || []) {
                for (const point of series.points || []) {
                  const value = metricValue(point);
                  const end = Date.parse(String(point?.interval?.endTime || ''));
                  today += value;
                  pointCount += 1;
                  if (Number.isFinite(end) && end >= recentStartMs) recent += value;
                }
              }
              pageToken = String(payload.nextPageToken || '');
              if (++pages > 5) throw new Error('MONITORING_PAGINATION_LIMIT');
            } while (pageToken);
            return { today: Math.round(today), recent: Math.round(recent), pointCount };
          };
          const queryFamily = async (accessToken, candidates) => {
            for (const metricType of candidates) {
              try {
                const result = await queryMetric(accessToken, metricType);
                if (result.pointCount > 0) return result;
              } catch (error) {
                if (error?.statusCode === 400 || error?.statusCode === 404) continue;
                throw error;
              }
            }
            return { today: 0, recent: 0, pointCount: 0 };
          };

          (async () => {
            const credential = admin.credential.applicationDefault();
            const token = await credential.getAccessToken();
            const accessToken = String(token?.access_token || '');
            if (!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');

            const requested = ['datastore.entities.get', 'datastore.entities.list', 'datastore.entities.create'];
            const iamResponse = await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify({ permissions: requested }),
            });
            const iamText = await iamResponse.text();
            if (!iamResponse.ok) throw new Error(`IAM_TEST_${iamResponse.status}`);
            const granted = new Set((JSON.parse(iamText || '{}').permissions || []).map(String));
            const missing = requested.filter((permission) => !granted.has(permission));
            console.log('RECENT_IAM=' + JSON.stringify({ get: granted.has(requested[0]), list: granted.has(requested[1]), create: granted.has(requested[2]) }));
            if (missing.length) throw new Error('RECENT_IAM_MISSING:' + missing.join(','));

            const [reads, writes, deletes] = await Promise.all([
              queryFamily(accessToken, ['firestore.googleapis.com/document/read_ops_count', 'firestore.googleapis.com/document/read_count']),
              queryFamily(accessToken, ['firestore.googleapis.com/document/write_ops_count', 'firestore.googleapis.com/document/write_count']),
              queryFamily(accessToken, ['firestore.googleapis.com/document/delete_ops_count', 'firestore.googleapis.com/document/delete_count']),
            ]);
            const safeReadCap = Math.min(10_000, Math.max(0, 50_000 - reads.today - 10_000));
            const safeWriteCap = Math.min(5_000, Math.max(0, 20_000 - writes.today - 4_000));
            const estimatedReads = 650;
            console.log('RECENT_QUOTA=' + JSON.stringify({ todayReads: reads.today, todayWrites: writes.today, todayDeletes: deletes.today, recent10mReads: reads.recent, recent10mWrites: writes.recent, safeReadCap, safeWriteCap, estimatedReads, maxWrites }));
            if (safeReadCap < estimatedReads || safeWriteCap < maxWrites) throw new Error('RECENT_QUOTA_PAUSE');

            const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step34e-preflight-${Date.now()}`);
            try {
              const bucket = getStorage(app).bucket(bucketName);
              const [manifestBytes] = await bucket.file(`${backupPrefix}/manifest.json`).download();
              const hash = crypto.createHash('sha256').update(manifestBytes).digest('hex');
              if (hash !== expectedManifestHash) throw new Error('ROLLBACK_MANIFEST_HASH_MISMATCH');
              const manifest = JSON.parse(manifestBytes.toString('utf8'));
              if (manifest?.complete !== true || manifest?.targetProjectId !== projectId) throw new Error('ROLLBACK_MANIFEST_INVALID');
              const recent = (manifest.datasets || []).find((entry) => entry?.id === 'user_recent_songs');
              if (!recent || recent.documentCount !== expectedBundles || recent.fileName !== 'user_recent_songs.ndjson') throw new Error('ROLLBACK_RECENT_DATASET_INVALID');
              console.log('RECENT_ROLLBACK=' + JSON.stringify({ available: true, manifestHashMatch: true, backupBundleCount: recent.documentCount }));
            } finally {
              await deleteApp(app);
            }
          })().catch((error) => {
            console.error('RECENT_PREFLIGHT_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          });
          NODE

      - name: Execute 68 recent-song limited backfill and verify parity
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$TARGET_PROJECT"
          export GCLOUD_PROJECT="$TARGET_PROJECT"
          node <<'NODE'
          const crypto = require('node:crypto');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = process.env.TARGET_PROJECT;
          const bucketName = process.env.TARGET_BUCKET;
          const backupPrefix = process.env.BACKUP_PREFIX;
          const expectedManifestHash = process.env.EXPECTED_MANIFEST_SHA256;
          const expectedBundles = Number(process.env.EXPECTED_BUNDLE_COUNT || 0);
          const expectedItems = Number(process.env.EXPECTED_RECENT_ITEM_COUNT || 0);
          const maxWrites = Number(process.env.MAX_WRITES || 0);
          const batchSize = Number(process.env.BATCH_SIZE || 0);
          if (projectId !== 'soridraw-app-866a5' || bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('EXECUTION_TARGET_MISMATCH');
          if (expectedBundles !== 10 || expectedItems !== 68 || maxWrites !== 68 || batchSize !== 25 || batchSize > 25) throw new Error('EXECUTION_CAP_MISMATCH');

          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string', 'boolean'].includes(typeof value)) return value;
            if (typeof value === 'number') {
              if (Number.isNaN(value)) return { __type: 'number', value: 'NaN' };
              if (value === Infinity) return { __type: 'number', value: 'Infinity' };
              if (value === -Infinity) return { __type: 'number', value: '-Infinity' };
              if (Object.is(value, -0)) return { __type: 'number', value: '-0' };
              return value;
            }
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return { __type: 'bytes', base64: Buffer.from(value).toString('base64') };
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return { __type: 'date', iso: value.toISOString() };
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return { __type: 'timestamp', seconds: value.seconds, nanoseconds: value.nanoseconds };
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return { __type: 'geopoint', latitude: value.latitude, longitude: value.longitude };
            if (typeof value?.path === 'string' && value?.firestore) return { __type: 'reference', path: value.path };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));
            throw new Error('UNSUPPORTED_RECENT_VALUE_TYPE');
          };
          const digest = (value) => crypto.createHash('sha256').update(JSON.stringify(canonicalize(value))).digest('hex');
          const stableHash = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const deterministicRecentSongId = (uid, recentDocumentPath, index) => `v1r_${stableHash(`${uid}\n${recentDocumentPath}\n${index}`).slice(0, 32)}`;
          const recentPattern = /^user_recent_songs\/([^/]+)$/;
          const reservedKeys = ['schemaVersion', 'musicNote', 'recentVisible', 'v2UpdatedAtMs', 'legacyRecentIndex'];
          const stripV2 = (data) => {
            const clone = { ...data };
            for (const key of reservedKeys) delete clone[key];
            return clone;
          };

          const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step34e-recent-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const bucket = getStorage(app).bucket(bucketName);

            const [manifestBytes] = await bucket.file(`${backupPrefix}/manifest.json`).download();
            const manifestHash = crypto.createHash('sha256').update(manifestBytes).digest('hex');
            if (manifestHash !== expectedManifestHash) throw new Error('EXECUTION_MANIFEST_HASH_MISMATCH');
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            const recentDataset = (manifest.datasets || []).find((entry) => entry?.id === 'user_recent_songs');
            if (!recentDataset || recentDataset.documentCount !== expectedBundles || recentDataset.fileName !== 'user_recent_songs.ndjson') throw new Error('EXECUTION_RECENT_BACKUP_DATASET_MISMATCH');

            const [recentBytes] = await bucket.file(`${backupPrefix}/${recentDataset.fileName}`).download();
            if (crypto.createHash('sha256').update(recentBytes).digest('hex') !== recentDataset.sha256) throw new Error('EXECUTION_RECENT_BACKUP_HASH_MISMATCH');
            const backupRecords = recentBytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
            if (backupRecords.length !== expectedBundles) throw new Error(`BACKUP_RECENT_BUNDLE_COUNT_CHANGED:${backupRecords.length}`);
            const backupByPath = new Map();
            for (const record of backupRecords) {
              const path = String(record?.path || '');
              if (!recentPattern.test(path) || !record?.data || typeof record.data !== 'object' || Array.isArray(record.data)) throw new Error('BACKUP_UNEXPECTED_RECENT_RECORD');
              if (backupByPath.has(path)) throw new Error('BACKUP_DUPLICATE_RECENT_PATH');
              backupByPath.set(path, record.data);
            }

            const liveSnap = await db.collection('user_recent_songs').get();
            if (liveSnap.size !== expectedBundles) throw new Error(`LIVE_RECENT_BUNDLE_COUNT_CHANGED:${liveSnap.size}`);
            const livePaths = liveSnap.docs.map((doc) => doc.ref.path).sort();
            const backupPaths = [...backupByPath.keys()].sort();
            if (JSON.stringify(livePaths) !== JSON.stringify(backupPaths)) throw new Error('LIVE_RECENT_PATH_SET_CHANGED');

            const sourceState = new Map();
            const targets = [];
            let totalItems = 0;
            for (const doc of liveSnap.docs.sort((a, b) => a.ref.path.localeCompare(b.ref.path))) {
              const path = doc.ref.path;
              const match = recentPattern.exec(path);
              if (!match) throw new Error('LIVE_UNEXPECTED_RECENT_PATH');
              const uid = match[1];
              const liveData = doc.data();
              const backupData = backupByPath.get(path);
              if (digest(liveData) !== digest(backupData)) throw new Error(`LIVE_RECENT_BUNDLE_DRIFT:${path}`);
              const songs = Array.isArray(liveData.songs) ? liveData.songs : [];
              sourceState.set(path, { hash: digest(liveData), updateMs: doc.updateTime.toMillis(), songsCount: songs.length });
              for (let index = 0; index < songs.length; index += 1) {
                const payload = songs[index];
                if (!payload || typeof payload !== 'object' || Array.isArray(payload)) throw new Error(`RECENT_ITEM_NOT_OBJECT:${path}:${index}`);
                for (const key of reservedKeys) if (Object.prototype.hasOwnProperty.call(payload, key)) throw new Error(`RECENT_RESERVED_KEY_COLLISION:${path}:${index}:${key}`);
                const songId = deterministicRecentSongId(uid, path, index);
                const destination = db.doc(`users/${uid}/songs/${songId}`);
                const expected = {
                  ...payload,
                  schemaVersion: 2,
                  musicNote: false,
                  recentVisible: true,
                  v2UpdatedAtMs: doc.updateTime.toMillis(),
                  legacyRecentIndex: index,
                };
                targets.push({ uid, sourcePath: path, sourceIndex: index, sourcePayload: payload, sourceHash: digest(payload), songId, destination, expected, expectedHash: digest(expected) });
              }
              totalItems += songs.length;
            }
            if (totalItems !== expectedItems || targets.length !== expectedItems) throw new Error(`LIVE_RECENT_ITEM_COUNT_CHANGED:${totalItems}`);
            if (new Set(targets.map((target) => target.destination.path)).size !== expectedItems) throw new Error('RECENT_DESTINATION_ID_COLLISION');

            const existingSnaps = await db.getAll(...targets.map((target) => target.destination));
            let preExistingIdentical = 0;
            for (let i = 0; i < existingSnaps.length; i += 1) {
              const snap = existingSnaps[i];
              const target = targets[i];
              if (!snap.exists) continue;
              if (digest(snap.data()) !== target.expectedHash) throw new Error(`RECENT_DESTINATION_CONFLICT:${target.destination.path}`);
              preExistingIdentical += 1;
            }
            const plannedCreates = expectedItems - preExistingIdentical;
            if (plannedCreates > maxWrites) throw new Error(`RECENT_WRITE_CAP_EXCEEDED:${plannedCreates}`);
            console.log('RECENT_PLAN=' + JSON.stringify({ bundles: liveSnap.size, recentItems: totalItems, destinations: targets.length, preExistingIdentical, plannedCreates, favoritesAccessed: 0 }));

            let created = 0;
            let identicalNoop = 0;
            let transactionCount = 0;
            for (let offset = 0; offset < targets.length; offset += batchSize) {
              const chunk = targets.slice(offset, offset + batchSize);
              const sourcePaths = [...new Set(chunk.map((target) => target.sourcePath))].sort();
              const chunkResult = await db.runTransaction(async (tx) => {
                const sourceRefs = sourcePaths.map((path) => db.doc(path));
                const sourceSnaps = await Promise.all(sourceRefs.map((ref) => tx.get(ref)));
                for (const snap of sourceSnaps) {
                  if (!snap.exists) throw new Error(`RECENT_SOURCE_MISSING_IN_TX:${snap.ref.path}`);
                  const state = sourceState.get(snap.ref.path);
                  if (!state || digest(snap.data()) !== state.hash || snap.updateTime.toMillis() !== state.updateMs) throw new Error(`RECENT_SOURCE_CHANGED_IN_TX:${snap.ref.path}`);
                }
                const destinationSnaps = await Promise.all(chunk.map((target) => tx.get(target.destination)));
                let txCreated = 0;
                let txNoop = 0;
                for (let i = 0; i < chunk.length; i += 1) {
                  const target = chunk[i];
                  const destinationSnap = destinationSnaps[i];
                  if (destinationSnap.exists) {
                    if (digest(destinationSnap.data()) !== target.expectedHash) throw new Error(`RECENT_DESTINATION_CONFLICT_IN_TX:${target.destination.path}`);
                    txNoop += 1;
                  } else {
                    tx.create(target.destination, target.expected);
                    txCreated += 1;
                  }
                }
                return { txCreated, txNoop };
              });
              created += chunkResult.txCreated;
              identicalNoop += chunkResult.txNoop;
              transactionCount += 1;
              if (created > maxWrites) throw new Error('RECENT_RUNTIME_WRITE_CAP_EXCEEDED');
            }

            const finalSourceSnap = await db.collection('user_recent_songs').get();
            if (finalSourceSnap.size !== expectedBundles) throw new Error('POST_SOURCE_BUNDLE_COUNT_CHANGED');
            for (const doc of finalSourceSnap.docs) {
              const state = sourceState.get(doc.ref.path);
              if (!state || digest(doc.data()) !== state.hash || doc.updateTime.toMillis() !== state.updateMs) throw new Error(`POST_V1_SOURCE_CHANGED:${doc.ref.path}`);
            }

            const finalDestinations = await db.getAll(...targets.map((target) => target.destination));
            for (let i = 0; i < finalDestinations.length; i += 1) {
              const snap = finalDestinations[i];
              const target = targets[i];
              if (!snap.exists) throw new Error(`POST_DESTINATION_MISSING:${target.destination.path}`);
              const data = snap.data();
              if (digest(data) !== target.expectedHash) throw new Error(`POST_DESTINATION_FULL_HASH_MISMATCH:${target.destination.path}`);
              if (digest(stripV2(data)) !== target.sourceHash) throw new Error(`POST_SOURCE_PAYLOAD_PARITY_MISMATCH:${target.destination.path}`);
              if (data.schemaVersion !== 2 || data.musicNote !== false || data.recentVisible !== true || data.legacyRecentIndex !== target.sourceIndex || data.v2UpdatedAtMs !== sourceState.get(target.sourcePath).updateMs) throw new Error(`POST_METADATA_MISMATCH:${target.destination.path}`);
            }

            console.log('RECENT_RESULT=' + JSON.stringify({
              sourceBundles: expectedBundles,
              sourceItems: expectedItems,
              destinationsVerified: expectedItems,
              created,
              identicalNoop,
              conflicts: 0,
              transactionCount,
              batchSize,
              v1Writes: 0,
              v1Deletes: 0,
              v2Deletes: 0,
              favoritesAccessed: 0,
              fullPayloadParity: true,
              deterministicIds: true,
              recentVisible: true,
              musicNoteMerged: false
            }));
          })().catch((error) => {
            console.error('RECENT_EXECUTION_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          }).finally(async () => {
            await deleteApp(app);
          });
          NODE

      - name: Final repository safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          echo 'RECENT_REPOSITORY_SIDE_EFFECTS=0'
