name: Temp 223 Explore Audio URL Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-223-explore-audio-url-readonly.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only inspect recent public audio fields
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT id,title,source_type,source_id,source_subtrack_index,source_subtrack_id,cover_url,
                   suno_url_primary,suno_url_secondary,published_at
            FROM tracks
            WHERE is_public=1 AND status='published'
            ORDER BY published_at DESC
            LIMIT 12;
          " --json > "$RUNNER_TEMP/audio-fields.json"
          cat "$RUNNER_TEMP/audio-fields.json"
      - name: Probe cover-derived Suno MP3 URLs without D1 writes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/mp3-urls.txt"
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/audio-fields.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          for(const row of rows.slice(0,3)) {
            const cover=String(row.cover_url||'');
            const match=cover.match(/image(?:_large)?_([0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/i);
            if(match) console.log('https://cdn1.suno.ai/'+match[1]+'.mp3');
          }
          NODE
          test -s "$RUNNER_TEMP/mp3-urls.txt"
          browser_ua='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          while IFS= read -r url; do
            code_plain="$(curl -sS -L -r 0-1 -o /dev/null -w '%{http_code}' "$url")"
            code_browser="$(curl -sS -L -A "$browser_ua" -H 'Origin: https://preview.soridraw.com' -r 0-1 -o /dev/null -w '%{http_code}' "$url")"
            code_suno_ref="$(curl -sS -L -A "$browser_ua" -H 'Referer: https://suno.com/' -r 0-1 -o /dev/null -w '%{http_code}' "$url")"
            echo "MP3_PROBE plain=$code_plain browser=$code_browser suno_ref=$code_suno_ref $url"
          done < "$RUNNER_TEMP/mp3-urls.txt"
          first_url="$(head -n1 "$RUNNER_TEMP/mp3-urls.txt")"
          first_id="$(basename "$first_url" .mp3)"
          meta_code="$(curl -sS -L -A "$browser_ua" -o "$RUNNER_TEMP/clip-meta.json" -w '%{http_code}' "https://studio-api-prod.suno.com/api/clip/$first_id")"
          echo "CLIP_META_PROBE code=$meta_code"
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/clip-meta.json','utf8'));
          console.log(JSON.stringify({
            id:p.id,
            title:p.title,
            audio_url:p.audio_url,
            media_urls:p.media_urls||p?.metadata?.media_urls||null,
            duration:p?.metadata?.duration||p.duration||null
          }));
          NODE
          node <<'NODE' > "$RUNNER_TEMP/media-urls.txt"
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/clip-meta.json','utf8'));
          const value=p.media_urls||p?.metadata?.media_urls||{};
          const urls=[];
          const walk=(v)=>{
            if(!v) return;
            if(typeof v==='string' && /^https:\/\//.test(v)) urls.push(v);
            else if(Array.isArray(v)) v.forEach(walk);
            else if(typeof v==='object') Object.values(v).forEach(walk);
          };
          walk(value);
          for(const u of [...new Set(urls)].slice(0,8)) console.log(u);
          NODE
          if test -s "$RUNNER_TEMP/media-urls.txt"; then
            while IFS= read -r url; do
              code="$(curl -sS -L -r 0-1 -o /dev/null -w '%{http_code}' "$url")"
              ctype="$(curl -sSI -L "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2;exit}')"
              echo "MEDIA_URL_PROBE code=$code type=$ctype $url"
            done < "$RUNNER_TEMP/media-urls.txt"
          fi
      - name: Inspect Suno share page for playable media without writes
        shell: bash
        run: |
          set -euo pipefail
          share_url="$(node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/audio-fields.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          console.log(String(rows[0]?.suno_url_primary||''));
          NODE
          )"
          test -n "$share_url"
          browser_ua='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          curl -sS -L -A "$browser_ua" -D "$RUNNER_TEMP/share-headers.txt" -o "$RUNNER_TEMP/share.html" "$share_url"
          echo "SHARE_FINAL_URL=$(curl -sS -L -A "$browser_ua" -o /dev/null -w '%{url_effective}' "$share_url")"
          echo "SHARE_HTTP=$(curl -sS -L -A "$browser_ua" -o /dev/null -w '%{http_code}' "$share_url")"
          grep -Eio 'https?://[^"'"'"' <>()]+\.(mp3|m4a)(\?[^"'"'"' <>()]+)?' "$RUNNER_TEMP/share.html" | head -n 12 || true
          grep -Eio '(og:audio|audio_url|audioUrl|stream_audio_url|streamAudioUrl)[^<]{0,500}' "$RUNNER_TEMP/share.html" | head -n 20 || true
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.env.RUNNER_TEMP+'/share.html','utf8');
          const patterns=[
            /<meta[^>]+property=["']og:audio(?::url)?["'][^>]+content=["']([^"']+)["']/ig,
            /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:audio(?::url)?["']/ig,
            /["']audio_url["']\s*:\s*["']([^"']+)["']/ig,
            /["']audioUrl["']\s*:\s*["']([^"']+)["']/ig,
            /https?:\\?\/\\?\/[^"'<> ]+\.mp3[^"'<> ]*/ig,
          ];
          const found=[];
          for(const re of patterns){
            let m;
            while((m=re.exec(html)) && found.length<30) found.push(m[1]||m[0]);
          }
          console.log('SHARE_MEDIA_CANDIDATES='+JSON.stringify([...new Set(found)].slice(0,20)));
          console.log('SHARE_HTML_BYTES='+Buffer.byteLength(html));
          NODE
      - name: Read-only compare PREVIEW Feed mapping
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=latest&limit=12&__diag223=${GITHUB_RUN_ID}" > "$RUNNER_TEMP/feed.json"
          node <<'NODE'
          const p=require(process.env.RUNNER_TEMP+'/feed.json');
          for(const row of p?.data?.items||[]) {
            console.log(JSON.stringify({
              id:row.id,title:row.title,sourceType:row.sourceType,sourceId:row.sourceId,
              sourceSubTrackIndex:row.sourceSubTrackIndex,sourceSubTrackId:row.sourceSubTrackId,coverUrl:row.coverUrl,
              sunoUrlPrimary:row.sunoUrlPrimary,openUrl:row.openUrl
            }));
          }
          NODE
