name: SORIDRAW app348 Restore Studio Heart Live Sync

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app348-studio-heart-live-sync.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-app348-studio-heart-live-sync
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Apply app348 focused restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          app_path = Path('src/App.tsx')
          sync_path = Path('src/services/userDomainSyncService.ts')
          verify_path = Path('scripts/verify-302-studio-heart-local-first-delayed-remote.mjs')
          version_path = Path('public/app-version.json')

          app = app_path.read_text(encoding='utf-8')
          sync = sync_path.read_text(encoding='utf-8')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              return text.replace(old, new, 1)

          app = once(
              app,
              "  publishMusicNoteSaveStateDelta,\n  publishRecentSongEditPreviewDelta,",
              "  publishMusicNoteSaveStateDelta,\n  publishMusicNoteHeartPreviewDelta,\n  publishRecentSongEditPreviewDelta,",
              'preview import',
          )

          app = once(
              app,
              "  const studioHeartIntentTimersRef = useRef<Map<string, number>>(new Map());",
              """  const studioHeartIntentTimersRef = useRef<Map<string, number>>(new Map());
            const studioHeartRemotePreviewRef = useRef<Map<string, {
              documentId: string;
              identityKey: string;
              desiredSaved: boolean;
              baselineFavorite: any | null;
              song: any;
              version: number;
            }>>(new Map());""",
              'remote preview ref',
          )

          app = once(
              app,
              """    const canonicalCurrent = uid
                ? stripStudioHeartPendingLayerFromFavorites(uid, current)
                : current;
              const resolved = typeof list === 'function' ? list(canonicalCurrent) : list;
              favoritesStore.setFavorites(
                uid ? overlayStudioHeartPendingIntentsOnFavorites(uid, resolved) : resolved,
              );""",
              """    const canonicalCurrent = uid
                ? stripStudioHeartPendingLayerFromFavorites(
                    uid,
                    stripStudioHeartRemotePreviewLayerFromFavorites(uid, current),
                  )
                : current;
              const resolved = typeof list === 'function' ? list(canonicalCurrent) : list;
              const withRemotePreview = uid
                ? overlayStudioHeartRemotePreviewsOnFavorites(uid, resolved)
                : resolved;
              favoritesStore.setFavorites(
                uid ? overlayStudioHeartPendingIntentsOnFavorites(uid, withRemotePreview) : withRemotePreview,
              );""",
              'favorites layering',
          )

          overlay_anchor = "  function overlayStudioHeartPendingIntentsOnFavorites(uid: string, list: any[]): any[] {"
          if app.count(overlay_anchor) != 1:
              raise SystemExit('local overlay anchor missing')

          remote_helpers = r"""
            function buildStudioHeartPreviewIdentity(source: any, fallbackDocumentId = ''): string {
              return String(
                buildRecentSongSyncKey(source)
                || getLiveSoridrawSongId(source)
                || fallbackDocumentId
                || '',
              ).trim();
            }

            function matchesStudioHeartPreviewIdentity(
              favorite: any,
              documentId: string,
              identityKey: string,
            ): boolean {
              const favoriteDocumentId = String(favorite?.firestoreId || favorite?.id || '').trim();
              if (documentId && favoriteDocumentId === documentId) return true;
              if (!identityKey) return false;
              return buildStudioHeartPreviewIdentity(favorite, favoriteDocumentId) === identityKey;
            }

            function stripStudioHeartRemotePreviewLayerFromFavorites(uid: string, list: any[]): any[] {
              const safeUid = String(uid || '').trim();
              const source = Array.isArray(list) ? list : [];
              if (!safeUid) return [...source];

              let next = source.filter((favorite: any) => favorite?.__studioHeartRemotePreviewLocal !== true);
              for (const preview of studioHeartRemotePreviewRef.current.values()) {
                const baseline = preview.baselineFavorite;
                if (!baseline || isFavoriteSoftRemoved(baseline)) continue;
                const exists = next.some((favorite: any) => matchesStudioHeartPreviewIdentity(
                  favorite,
                  preview.documentId,
                  preview.identityKey,
                ));
                if (exists) continue;
                const restored = { ...baseline };
                delete restored.__studioHeartRemotePreviewLocal;
                next = mergeFavoritePages([restored], next);
              }
              return sortFavoriteList(next);
            }

            function overlayStudioHeartRemotePreviewsOnFavorites(uid: string, list: any[]): any[] {
              const safeUid = String(uid || '').trim();
              let next = stripStudioHeartRemotePreviewLayerFromFavorites(safeUid, list);
              if (!safeUid) return next;

              const previews = [...studioHeartRemotePreviewRef.current.values()]
                .sort((left, right) => left.version - right.version);

              for (const preview of previews) {
                const currentFavorite = next.find((favorite: any) => matchesStudioHeartPreviewIdentity(
                  favorite,
                  preview.documentId,
                  preview.identityKey,
                )) || null;
                next = next.filter((favorite: any) => !matchesStudioHeartPreviewIdentity(
                  favorite,
                  preview.documentId,
                  preview.identityKey,
                ));

                if (!preview.desiredSaved) continue;

                const source = normalizeFavoriteTitleFields({
                  ...(preview.baselineFavorite || {}),
                  ...(preview.song || {}),
                  ...(currentFavorite || {}),
                } as any) as any;
                const createdAtMs = Number(
                  preview.baselineFavorite?.createdAtMs
                  || source?.createdAtMs
                  || 0,
                ) || Math.max(1, Number(source?.updatedAtMs || Date.now()));
                const optimisticFavorite = {
                  ...source,
                  id: preview.documentId,
                  firestoreId: preview.documentId,
                  uid: safeUid,
                  saved: true,
                  hidden: false,
                  favoriteHidden: false,
                  favoriteRemoved: false,
                  favoriteRemovedAt: null,
                  unsavedAt: null,
                  unlikedAt: null,
                  deletedAt: null,
                  trashedAt: null,
                  isPublic: source?.isPublic === true,
                  isLocked: source?.isLocked === true,
                  createdAtMs,
                  updatedAtMs: Math.max(createdAtMs, Number(source?.updatedAtMs || 0)),
                  favoriteKey: source?.favoriteKey || buildFavoriteIdentityKey(source),
                  searchTokens: source?.searchTokens || buildFavoriteSearchTokens(source),
                  __studioHeartRemotePreviewLocal: true,
                };
                next = mergeFavoritePages([optimisticFavorite], next);
              }

              return sortFavoriteList(next);
            }

            const applyRemoteStudioHeartPreview = (
              uid: string,
              remoteItem: any,
              remoteFavoriteId: string,
              desiredSaved: boolean,
              remoteVersion: number,
            ) => {
              const safeUid = String(uid || '').trim();
              const safeDocumentId = String(remoteFavoriteId || remoteItem?.firestoreId || remoteItem?.id || '').trim();
              if (!safeUid || !safeDocumentId || !Number.isFinite(remoteVersion) || remoteVersion <= 0) return;

              const identityKey = buildStudioHeartPreviewIdentity(remoteItem, safeDocumentId);
              const existing = studioHeartRemotePreviewRef.current.get(safeDocumentId);
              if (existing && existing.version >= remoteVersion) return;

              const canonicalBase = stripStudioHeartPendingLayerFromFavorites(
                safeUid,
                stripStudioHeartRemotePreviewLayerFromFavorites(safeUid, favoritesStore.getFavorites()),
              );
              const baselineFavorite = existing?.baselineFavorite ?? canonicalBase.find((favorite: any) => (
                !isFavoriteSoftRemoved(favorite)
                && matchesStudioHeartPreviewIdentity(favorite, safeDocumentId, identityKey)
              )) ?? null;

              studioHeartRemotePreviewRef.current.set(safeDocumentId, {
                documentId: safeDocumentId,
                identityKey,
                desiredSaved,
                baselineFavorite,
                song: remoteItem || {},
                version: Math.floor(remoteVersion),
              });
              setFavorites((previous) => previous);
            };

            const clearRemoteStudioHeartPreviewFromCanonical = (
              uid: string,
              documentIds: readonly string[],
              remoteItem?: any,
            ) => {
              const safeUid = String(uid || '').trim();
              if (!safeUid || studioHeartRemotePreviewRef.current.size === 0) return;
              const exactIds = new Set((Array.isArray(documentIds) ? documentIds : [])
                .map((value) => String(value || '').trim())
                .filter(Boolean));
              const remoteIdentityKey = remoteItem
                ? buildStudioHeartPreviewIdentity(
                    remoteItem,
                    String(remoteItem?.firestoreId || remoteItem?.id || '').trim(),
                  )
                : '';

              let changed = false;
              for (const [key, preview] of studioHeartRemotePreviewRef.current.entries()) {
                if (
                  exactIds.has(preview.documentId)
                  || (remoteIdentityKey && preview.identityKey === remoteIdentityKey)
                ) {
                  studioHeartRemotePreviewRef.current.delete(key);
                  changed = true;
                }
              }
              if (changed) setFavorites((previous) => previous);
            };

          """
          app = app.replace(overlay_anchor, remote_helpers + overlay_anchor, 1)

          app = once(
              app,
              """      writeMusicNoteSyncVersion(MUSIC_NOTE_LOCAL_SYNC_VERSION_STORAGE_BASE, uid, remoteVersion);
                writeMusicNoteSyncVersion(MUSIC_NOTE_RTDB_ACK_VERSION_STORAGE_BASE, uid, remoteVersion);""",
              """      clearRemoteStudioHeartPreviewFromCanonical(
                  uid,
                  Array.isArray(documentIds) ? documentIds : [],
                );
                writeMusicNoteSyncVersion(MUSIC_NOTE_LOCAL_SYNC_VERSION_STORAGE_BASE, uid, remoteVersion);
                writeMusicNoteSyncVersion(MUSIC_NOTE_RTDB_ACK_VERSION_STORAGE_BASE, uid, remoteVersion);""",
              'own canonical cleanup',
          )

          app = once(
              app,
              """      if (isHeartPreview) {
                if (remoteFavoriteId) {
                  supersedeStudioHeartIntentFromRemotePreview(uid, remoteFavoriteId, remoteVersion);
                }
                // The RTDB preview is fully consumed by Recent heart authority + exact link.
                // Keep canonical Music Note cache/version untouched until the trailing
                // favorites mutation succeeds and emits its normal save/unsave signal.
                writeMusicNoteSyncVersion(MUSIC_NOTE_RTDB_ACK_VERSION_STORAGE_BASE, uid, remoteVersion);
                markCacheDiagnostic('musicNote', 'SYNC', 0, 0);
                return;
              }""",
              """      if (isHeartPreview) {
                applyRemoteStudioHeartPreview(
                  uid,
                  remoteItem,
                  remoteFavoriteId,
                  isHeartPreviewSave,
                  remoteVersion,
                );
                if (remoteFavoriteId) {
                  supersedeStudioHeartIntentFromRemotePreview(uid, remoteFavoriteId, remoteVersion);
                }
                // app348: every signed-in device updates immediately; only the
                // canonical favorite write waits for the per-song 30s final state.
                writeMusicNoteSyncVersion(MUSIC_NOTE_RTDB_ACK_VERSION_STORAGE_BASE, uid, remoteVersion);
                markCacheDiagnostic('musicNote', 'SYNC', 0, 0);
                return;
              }""",
              'remote preview apply',
          )

          app = once(
              app,
              """          reconcileStudioHeartPendingFromCanonicalSignal(
                    uid,
                    remoteItem,
                    remoteFavoriteId || exactDocumentIds[0] || '',
                    canonicalRemoteSaved,
                  );""",
              """          reconcileStudioHeartPendingFromCanonicalSignal(
                    uid,
                    remoteItem,
                    remoteFavoriteId || exactDocumentIds[0] || '',
                    canonicalRemoteSaved,
                  );
                  clearRemoteStudioHeartPreviewFromCanonical(uid, exactDocumentIds, remoteItem);""",
              'canonical remote cleanup',
          )

          app = once(
              app,
              """    rememberRecentHeartAuthority(uid, intent.song, desiredSaved, safeDocumentId, now);
              setFavorites((previous) => previous);
              return true;""",
              """    rememberRecentHeartAuthority(uid, intent.song, desiredSaved, safeDocumentId, now);
              setFavorites((previous) => previous);
              void publishMusicNoteHeartPreviewDelta(uid, safeDocumentId, intent.song, desiredSaved)
                .then((version) => {
                  if (version > 0) rememberStudioHeartPreviewVersion(
                    uid,
                    safeDocumentId,
                    version,
                    desiredSaved,
                    now,
                  );
                })
                .catch((error) => console.warn('Studio heart live preview unavailable.', error));
              return true;""",
              'outgoing preview restore',
          )

          app_path.write_text(app, encoding='utf-8')

          start = sync.index('export const publishMusicNoteHeartPreviewDelta = async')
          end = sync.index('// app287', start)
          if start < 0 or end <= start:
              raise SystemExit('preview publisher block missing')
          block = sync[start:end]
          body_start = block.index('  const now = Date.now();')
          return_start = block.index('  return publishSignal({')
          if body_start < 0 or return_start <= body_start:
              raise SystemExit('preview publisher body anchors missing')

          new_body = r"""  const now = Date.now();
            const source = syncItem as Record<string, any>;
            const projected = projectMusicNoteItemForSignal(source, safeDocumentId) || {
              __catalogSummary: true,
              id: safeDocumentId,
              firestoreId: safeDocumentId,
              title: String(source.title || ''),
              koreanTitle: String(source.koreanTitle || ''),
              englishTitle: String(source.englishTitle || ''),
              soridrawSongId: String(source.soridrawSongId || '').trim() || null,
              recentSongSyncKey: String(source.recentSongSyncKey || '').trim() || null,
              recentLegacySourceId: String(source.recentLegacySourceId || '').trim() || null,
              recentLegacyCreatedAtMs: toSyncTimestamp(source.recentLegacyCreatedAtMs),
              imageUrl: source.imageUrl ?? source.image_url ?? null,
              coverUrl: source.coverUrl ?? null,
              thumbnailUrl: source.thumbnailUrl ?? null,
              sunoCoverUrl: source.sunoCoverUrl ?? null,
              sunoImageUrl: source.sunoImageUrl ?? null,
              sunoArtworkUrl: source.sunoArtworkUrl ?? null,
              sunoLinks: source.sunoLinks ?? null,
              sunoShareLinks: source.sunoShareLinks ?? null,
              mainSunoIndex: source.mainSunoIndex ?? null,
              createdAtMs: toSyncTimestamp(source.createdAtMs || source.createdAt),
              updatedAtMs: toSyncTimestamp(source.updatedAtMs || source.updatedAt),
            };
            const item = desiredSaved
              ? {
                  ...projected,
                  __studioHeartRemotePreview: true,
                  saved: true,
                  hidden: false,
                  favoriteHidden: false,
                  favoriteRemoved: false,
                  favoriteRemovedAt: null,
                  unsavedAt: null,
                  unlikedAt: null,
                }
              : {
                  ...projected,
                  __studioHeartRemotePreview: true,
                  saved: false,
                  hidden: false,
                  favoriteHidden: false,
                  favoriteRemoved: true,
                  favoriteRemovedAt: now,
                  unsavedAt: now,
                  unlikedAt: now,
                };
          """
          block = block[:body_start] + new_body + block[return_start:]
          sync = sync[:start] + block + sync[end:]
          sync_path.write_text(sync, encoding='utf-8')

          verifier = r"""import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const sync = fs.readFileSync('src/services/userDomainSyncService.ts', 'utf8');

          assert.ok(app.includes('const STUDIO_HEART_BATCH_MS = 30_000;'), '30-second canonical rule changed');

          const queueStart = app.indexOf('const queueStudioHeartPendingIntent = (');
          const queueEnd = app.indexOf('  useEffect(() => {', queueStart);
          assert.ok(queueStart >= 0 && queueEnd > queueStart, 'Studio heart queue missing');
          const queue = app.slice(queueStart, queueEnd);
          assert.ok(queue.includes('writeStudioHeartPendingIntent(intent);'), 'durable pending missing');
          assert.ok(queue.includes('scheduleStudioHeartPendingIntent(safeDocumentId);'), '30s trailing scheduler missing');
          assert.ok(queue.includes('setFavorites((previous) => previous);'), 'same-device immediate Music Note missing');
          assert.ok(queue.includes('publishMusicNoteHeartPreviewDelta(uid, safeDocumentId, intent.song, desiredSaved)'), 'PC-mobile immediate preview missing');
          assert.doesNotMatch(queue, /\b(?:getDoc|getDocs|setDoc|updateDoc|addDoc|deleteDoc)\s*\(/, 'preview queue added Firestore IO');

          const flushStart = app.indexOf('const flushStudioHeartPendingIntent = async');
          const flushEnd = app.indexOf('  const scheduleStudioHeartPendingIntent', flushStart);
          const flush = app.slice(flushStart, flushEnd);
          assert.ok(flush.includes('if (intent.desiredSaved === intent.baselineSaved)'), 'net-zero W0 guard missing');
          assert.ok(flush.includes('await toggleFavorite(commitSong'), 'canonical settlement missing');

          assert.ok(app.includes('function stripStudioHeartRemotePreviewLayerFromFavorites'), 'remote preview strip missing');
          assert.ok(app.includes('function overlayStudioHeartRemotePreviewsOnFavorites'), 'remote Music Note overlay missing');
          assert.ok(app.includes('__studioHeartRemotePreviewLocal: true'), 'remote preview marker missing');
          assert.ok(app.includes('applyRemoteStudioHeartPreview('), 'receiver immediate membership missing');
          assert.ok(app.includes('clearRemoteStudioHeartPreviewFromCanonical(uid, exactDocumentIds, remoteItem);'), 'canonical preview cleanup missing');
          assert.ok(app.includes('reconcileStudioHeartPendingFromCanonicalSignal('), 'app347 stale-state guard lost');

          const applyStart = app.indexOf('  const applyRemoteStudioHeartPreview = (');
          const applyEnd = app.indexOf('  const clearRemoteStudioHeartPreviewFromCanonical = (', applyStart);
          assert.ok(applyStart >= 0 && applyEnd > applyStart);
          assert.doesNotMatch(app.slice(applyStart, applyEnd), /\b(?:getDoc|getDocs|setDoc|updateDoc|addDoc|deleteDoc|fetch)\s*\(/, 'receiver preview added backend IO');

          const publishStart = sync.indexOf('export const publishMusicNoteHeartPreviewDelta = async');
          const publishEnd = sync.indexOf('// app287', publishStart);
          const publish = sync.slice(publishStart, publishEnd);
          assert.ok(publish.includes('projectMusicNoteItemForSignal(source, safeDocumentId)'), 'bounded Music Note media summary missing');
          assert.ok(publish.includes('__studioHeartRemotePreview: true'), 'remote preview marker missing');
          assert.ok(publish.includes("operation: desiredSaved ? 'heart-preview-save' : 'heart-preview-unsave'"), 'preview op changed');
          assert.doesNotMatch(publish, /\b(?:getDoc|getDocs|setDoc|updateDoc|addDoc|deleteDoc)\s*\(/, 'preview publisher added Firestore IO');

          assert.ok(sync.includes("signal.operation !== 'heart-preview-save'"), 'preview may advance canonical version');
          assert.ok(sync.includes("signal.operation !== 'heart-preview-unsave'"), 'preview unsave may advance canonical version');

          console.log('VERIFY_348_STUDIO_HEART_IMMEDIATE_CROSS_DEVICE=PASS');
          console.log('VERIFY_348_CANONICAL_30S_FINAL_STATE=PASS');
          console.log('VERIFY_348_REMOTE_MUSIC_NOTE_NO_FIRESTORE_IO=PASS');
          console.log('VERIFY_348_APP347_STALE_OVERWRITE_GUARD=PASS');
          """
          verify_path.write_text(verifier, encoding='utf-8')

          version = json.loads(version_path.read_text(encoding='utf-8'))
          if int(version.get('version', 0)) != 347:
              raise SystemExit(f"expected app347, got {version.get('version')}")
          version['version'] = 348
          version_path.write_text(json.dumps(version, indent=2) + '\n', encoding='utf-8')

          print('APP348_RESTORE_IMMEDIATE_CROSS_DEVICE_APPLY=PASS')
          PY

      - name: Focused regressions
        run: |
          set -euo pipefail
          node scripts/verify-302-studio-heart-local-first-delayed-remote.mjs
          node scripts/verify-289-music-note-compact-heart-sync.mjs
          node scripts/verify-291-recent-lyrics-live-preview.mjs
          node scripts/verify-347-studio-heart-reconcile.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit focused restore
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "soridraw-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/services/userDomainSyncService.ts public/app-version.json scripts/verify-302-studio-heart-local-first-delayed-remote.mjs
          git diff --cached --quiet && { echo "No product diff"; exit 1; }
          git commit -m "fix(preview): restore immediate cross-device Studio heart sync"
          git push origin HEAD:preview
