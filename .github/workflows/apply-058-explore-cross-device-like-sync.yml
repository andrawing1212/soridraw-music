name: Apply 058 Explore Cross Device Like Sync

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-058-explore-cross-device-like-sync.py'
      - '.github/workflows/apply-058-explore-cross-device-like-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-058-explore-cross-device-like-sync
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted cross-device like patch
        run: python3 .deploy/apply-058-explore-cross-device-like-sync.py

      - name: Verify targeted contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_ACCOUNT_SIGNAL_058_20260911' src/services/exploreLikeService.ts
          grep -Fq 'export const observeExploreLikeAccountSyncSignal' src/services/exploreLikeService.ts
          grep -Fq 'publishExploreLikeAccountSyncSignal' src/services/exploreLikeService.ts
          grep -Fq "updateDoc(doc(db, 'users', uid), { exploreLikeSyncSignal: signal })" src/services/exploreLikeService.ts
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_ACCOUNT_SIGNAL_058_20260911' src/App.tsx
          grep -Fq 'observeExploreLikeAccountSyncSignal(currentUser, data?.exploreLikeSyncSignal);' src/App.tsx
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_ACCOUNT_SIGNAL_058_20260911' src/pages/ExplorePage.tsx
          grep -Fq 'EXPLORE_LIKE_ACCOUNT_INVALIDATION_EVENT' src/pages/ExplorePage.tsx
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_ACCOUNT_SIGNAL_058_20260911' firestore.rules
          grep -Fq "'favoriteSyncSignal', 'favoriteSyncSignalUpdatedAt', 'exploreLikeSyncSignal'" firestore.rules
          grep -Fq 'request.resource.data.exploreLikeSyncSignal.results.size() <= 50' firestore.rules
          grep -Fq '"version": "058"' public/app-version.json
          if grep -Fq 'SORIDRAW_EXPLORE_LIKE_CROSS_DEVICE_REVALIDATION_058_20260911' src/services/exploreSessionCache.ts; then
            echo 'Old public-feed-driven revalidation still present'
            exit 1
          fi
          if grep -Fq 'revalidateChangedPersonalLikes' src/services/exploreSessionCache.ts; then
            echo 'Old public-feed personal-like fanout still present'
            exit 1
          fi
          if grep -Eq 'setInterval|setTimeout\([^,]+,[[:space:]]*(60000|[0-9]{1,5})' src/services/exploreSessionCache.ts; then
            echo 'Unexpected polling/timer introduced in session cache'
            exit 1
          fi
          echo 'ACCOUNT_SCOPED_CROSS_DEVICE_LIKE_SYNC=PASS'
          echo 'PUBLIC_FEED_FANOUT_REMOVED=PASS'
          echo 'NO_POLLING=PASS'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify change boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/services/exploreLikeService\.ts|src/services/exploreSessionCache\.ts|src/App\.tsx|src/pages/ExplorePage\.tsx|firestore\.rules|public/app-version\.json)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected source changes:'
            echo "$bad"
            exit 1
          fi
          echo 'NO_FIREBASE_FUNCTIONS_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_WORKER_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
          echo 'FIRESTORE_RULES_ADDITIVE_ONLY=true'

      - name: Commit actual PREVIEW source
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            src/services/exploreLikeService.ts
            src/services/exploreSessionCache.ts
            src/App.tsx
            src/pages/ExplorePage.tsx
            firestore.rules
            public/app-version.json
          )
          if git diff --quiet -- "${tracked[@]}"; then
            echo '058 already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${tracked[@]}"
          git commit -m 'fix: sync personal Explore likes across devices'
          git push origin HEAD:preview
