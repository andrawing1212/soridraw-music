name: SORIDRAW APP662 PREVIEW canonical multi-follow ACK
on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/lib/follow-canonical-counts-662.mjs'
      - 'scripts/verify-662-canonical-overlay-ack.mjs'
      - 'scripts/app662-preview-canonical-follow-worker.mjs'
      - '.github/workflows/app662-preview-canonical-follow-worker.yml'
  push:
    branches: [preview]
    paths: ['.deploy/app662-preview-canonical-follow.trigger']
permissions: {contents: read}
concurrency:
  group: soridraw-app662-canonical-follow-worker
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}",persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          node --check scripts/lib/follow-canonical-counts-662.mjs
          node --check scripts/app662-preview-canonical-follow-worker.mjs
          node scripts/verify-662-canonical-overlay-ack.mjs
  release:
    if: github.event_name == 'push' && github.repository == 'andrawing1212/soridraw-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}",fetch-depth: 3,persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact PREVIEW-only source and approved 1:N follow ACK trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview
          test "$(git diff --name-only HEAD^ HEAD)" = '.deploy/app662-preview-canonical-follow.trigger'
          f=.deploy/app662-preview-canonical-follow.trigger
          grep -Fxq 'approval=director_20261114_multifollow_correctness_preview' "$f"
          grep -Fxq "source_parent=$(git rev-parse HEAD^)" "$f"
          grep -Fxq 'old_worker=9e0f9a57-5da3-49c5-98ef-ffac999d3c39' "$f"
          grep -Fxq 'owner_worker_unchanged=142e7005-cf9c-4cc7-88fc-a786a8d35058' "$f"
          grep -Fxq 'scope=one_preview_worker_one_ack_module_only' "$f"
          grep -Fxq 'no_shared_user_data_rules_or_test_prod_change=true' "$f"
          echo "APP662_APPROVED_PARENT=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          node scripts/verify-662-canonical-overlay-ack.mjs
      - name: Exact active source, runtime, bindings and protected deployments preflight
        run: node scripts/app662-preview-canonical-follow-worker.mjs --preflight
      - name: Deploy one PREVIEW Worker source module with automatic rollback guard
        run: node scripts/app662-preview-canonical-follow-worker.mjs --apply-once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app662-preview-canonical-follow-result
          path: app662-worker-result.json
          if-no-files-found: ignore
          retention-days: 7
