name: Validate and handoff SORIDRAW 865

on:
  push:
    branches: [stage2-contract-align]
    paths:
      - .deploy/validate-handoff-865-trigger.txt

permissions:
  contents: write

jobs:
  validate-and-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build validation
        run: npm run build
      - name: Build exact main source ZIP
        run: git archive --format=zip --output=SORIDRAW_865_stage3_japanese_native_relation_final.zip HEAD
      - name: Upload exact source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_865_stage3_source
          path: SORIDRAW_865_stage3_japanese_native_relation_final.zip
          if-no-files-found: error
          retention-days: 7
      - name: Write validation result to staging branch
        run: |
          git config user.name "andrawing1212"
          git config user.email "andrawing1212@gmail.com"
          git fetch origin stage2-contract-align
          git checkout -B stage2-contract-align origin/stage2-contract-align
          printf 'status=success\nrun_id=%s\nsource_commit=070e26076ead6b0cf4b4a4f474e6b2a22656f388\nartifact_name=SORIDRAW_865_stage3_source\nlint=success\nbuild=success\n' "$GITHUB_RUN_ID" > .deploy/validate-handoff-865-result.txt
          git add .deploy/validate-handoff-865-result.txt
          git commit -m "chore(865): record validation and handoff result"
          git push origin HEAD:stage2-contract-align
