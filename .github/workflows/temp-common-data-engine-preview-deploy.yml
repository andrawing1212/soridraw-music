name: Temp Common Data Engine Preview Deploy

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-common-data-engine-preview-deploy.yml']

permissions:
  contents: read

concurrency:
  group: temp-common-data-engine-preview-deploy
  cancel-in-progress: false

jobs:
  validate_deploy_verify:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_SOURCE_COMMIT: 9b13bfee47e647a43bb2f1313845e0fc98709243
      MEDIA_WORKER_URL: https://soridraw-media-preview.andrawing1212.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30

      - name: Guard Stage 8 source and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_SOURCE_COMMIT" HEAD
          git diff --exit-code "$EXPECTED_SOURCE_COMMIT"..HEAD -- src functions/src cloudflare/media-worker package.json package-lock.json functions/package.json functions/package-lock.json firebase.hosting-preview.json
          test ! -e .deploy/apply-987-build-entry.py
          test ! -e .deploy/apply-987-preview-server-pagination-parity.py
          test ! -e .deploy/apply-1025-music-note-pagination-continuity.py
          test ! -e .deploy/apply-1027-music-note-cache-first-bounded-pagination.py
          test ! -e .deploy/apply-1027b-music-note-bounded-fallback-continuation.py
          test ! -e .deploy/apply-1028-cache-integrity-and-library-more.py
          test ! -e .deploy/apply-1029-first-bundle-integrity.py
          test ! -e .deploy/apply-1030-music-note-normalization-stage1.py
          test ! -e .deploy/apply-1030b-music-note-stage1-page-cache-reuse.py
          test ! -e .deploy/apply-1031-music-note-clean-bootstrap-legacy-axis.py
          test ! -e .deploy/apply-1032-pagination-more-visibility.py
          test ! -e .github/workflows/apply-987-preview-server-pagination.yml
          test ! -e .github/workflows/apply-1025-music-note-pagination-continuity.yml
          echo 'STAGE8_CLEANUP_GUARD=PASS'

      - name: Static common-engine and Recent-to-MusicNote guards
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SORIDRAW_USER_DATA_ENGINE_V1_20260906' src/lib/userDataEngine.ts >/dev/null
          grep -F "musicNote: { mode: 'catalog', renderBatchSize: 20 }" src/lib/userDataEngine.ts >/dev/null
          grep -F "library: { mode: 'catalog', renderBatchSize: 10 }" src/lib/userDataEngine.ts >/dev/null
          grep -F "recentSongs: { mode: 'hotSet'" src/lib/userDataEngine.ts >/dev/null
          grep -F 'readCatalogSnapshotCacheFirst' src/lib/userDataEngine.ts >/dev/null
          grep -F 'indexedDB.open' src/lib/userDataEngine.ts >/dev/null
          grep -F "url.pathname.startsWith('/v1/catalog/')" cloudflare/media-worker/src/index.js >/dev/null
          grep -F 'persistRecentSongsDocument' src/App.tsx >/dev/null
          grep -F 'buildRecentMirrorTargets' src/App.tsx >/dev/null
          grep -F 'favoriteSyncSignal' src/App.tsx >/dev/null
          grep -F "operation: 'music-note-unsave'" src/App.tsx >/dev/null
          ! grep -A25 -F 'const unsaveUpdates = sanitizeForFirestore({' src/App.tsx | grep -F 'createdAtMs: unsavedAt'
          ! grep -A25 -F 'const unsaveUpdates = sanitizeForFirestore({' src/App.tsx | grep -F 'createdAt: serverTimestamp()'
          test ! -e functions/src/previewAdaptiveListIndex.ts
          ! grep -F 'publishPreviewAdaptiveListIndexV2' functions/src/index.ts
          echo 'COMMON_ENGINE_STATIC_GUARDS=PASS'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: App build
        run: npm run build

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Functions build
        run: npm --prefix functions run build

      - name: Existing library backend test
        run: npm --prefix functions run test:library-bundle

      - name: Install and dry-run Cloudflare preview Worker
        working-directory: cloudflare/media-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          grep -F '"name": "soridraw-media-preview"' wrangler.jsonc >/dev/null
          grep -F '"bucket_name": "soridraw-media-preview"' wrangler.jsonc >/dev/null
          grep -F 'https://preview.soridraw.com' wrangler.jsonc >/dev/null
          ! grep -F '"name": "soridraw-media"' wrangler.jsonc
          echo 'CLOUDFLARE_PREVIEW_CONFIG_GUARD=PASS'

      - name: Snapshot production hosting and main
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          curl -fsS --max-time 30 https://api.github.com/repos/andrawing1212/soridraw-music/branches/main -o "$RUNNER_TEMP/main-before.json"
          node - "$RUNNER_TEMP/main-before.json" > "$RUNNER_TEMP/main-before.sha" <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!value?.commit?.sha) process.exit(2);
          process.stdout.write(value.commit.sha);
          NODE

      - name: Deploy Cloudflare PREVIEW media/catalog Worker
        working-directory: cloudflare/media-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          npm run deploy
          echo 'CLOUDFLARE_PREVIEW_DEPLOY=PASS'

      - name: Verify Cloudflare catalog route and R2 preview binding
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 30 "$MEDIA_WORKER_URL/health" -o "$RUNNER_TEMP/media-health.json" \
              && grep -q '"ok":true' "$RUNNER_TEMP/media-health.json" \
              && grep -q '"r2Binding":true' "$RUNNER_TEMP/media-health.json"; then
              break
            fi
            test "$attempt" != '12'
            sleep 5
          done
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/catalog-unauth.json" -D "$RUNNER_TEMP/catalog-unauth.headers" -w '%{http_code}' \
            -H 'Origin: https://preview.soridraw.com' \
            "$MEDIA_WORKER_URL/v1/catalog/musicNote")"
          echo "CATALOG_UNAUTH_HTTP=$code"
          test "$code" = '401'
          grep -qi '^access-control-allow-origin: https://preview.soridraw.com' "$RUNNER_TEMP/catalog-unauth.headers"
          echo 'CLOUDFLARE_CATALOG_LIVE_GUARD=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Remove obsolete preview-only Adaptive callable
        shell: bash
        run: |
          set -euo pipefail
          url='https://us-central1-soridraw-app-866a5.cloudfunctions.net/publishPreviewAdaptiveListIndexV2'
          before="$(curl -sS -o "$RUNNER_TEMP/old-callable-before.txt" -w '%{http_code}' --max-time 30 -X POST -H 'Content-Type: application/json' -H 'Origin: https://preview.soridraw.com' --data '{"data":{}}' "$url" || true)"
          echo "OBSOLETE_CALLABLE_BEFORE_HTTP=$before"
          if [ "$before" != '404' ]; then
            npx --yes firebase-tools@latest functions:delete publishPreviewAdaptiveListIndexV2 --region us-central1 --project soridraw-app-866a5 --force
          fi
          removed=''
          for attempt in $(seq 1 12); do
            after="$(curl -sS -o "$RUNNER_TEMP/old-callable-after.txt" -w '%{http_code}' --max-time 30 -X POST -H 'Content-Type: application/json' -H 'Origin: https://preview.soridraw.com' --data '{"data":{}}' "$url" || true)"
            echo "OBSOLETE_CALLABLE_AFTER_HTTP=$after"
            if [ "$after" = '404' ]; then removed=yes; break; fi
            sleep 10
          done
          test "$removed" = yes
          echo 'OBSOLETE_PREVIEW_FUNCTION_REMOVED=PASS'

      - name: Deploy Firebase PREVIEW hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact deployed PREVIEW build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok=yes
                  echo "EXACT_BUILD_PASS=$url"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify production and main unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          curl -fsS --max-time 30 https://api.github.com/repos/andrawing1212/soridraw-music/branches/main -o "$RUNNER_TEMP/main-after.json"
          node - "$RUNNER_TEMP/main-after.json" > "$RUNNER_TEMP/main-after.sha" <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!value?.commit?.sha) process.exit(2);
          process.stdout.write(value.commit.sha);
          NODE
          cmp "$RUNNER_TEMP/main-before.sha" "$RUNNER_TEMP/main-after.sha"
          echo 'PRODUCTION_HOSTING_UNCHANGED=PASS'
          echo 'MAIN_UNCHANGED=PASS'

      - name: Final deployment result
        run: |
          echo 'TARGET_BRANCH=preview'
          echo 'TARGET_HOST=https://preview.soridraw.com'
          echo 'CLOUDFLARE_WORKER=soridraw-media-preview'
          echo 'R2_BUCKET=soridraw-media-preview'
          echo 'FUNCTION_CHANGE=obsolete_preview_callable_removed_only'
          echo 'FIREBASE_HOSTING=PREVIEW'
          echo 'NO_MAIN_CHANGE=true'
          echo 'NO_PRODUCTION_CHANGE=true'
