name: SORIDRAW Recent language and Music Note membership regression
on:
  pull_request:
    branches: [preview]
    paths:
      - 'src/App.tsx'
      - 'src/services/userDomainSyncService.ts'
      - 'src/lib/recentSongCanonicalPreviewGuard453.ts'
      - 'src/lib/recentUnconfirmedRecovery436.ts'
      - 'src/lib/userDataEngine.ts'
      - 'src/data/v1MutationBoundary.ts'
      - 'scripts/verify-recent-language-trash-media-regression.mjs'
      - '.github/workflows/verify-recent-language-trash-media-regression.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          node scripts/verify-recent-language-trash-media-regression.mjs
          node scripts/verify-291-recent-lyrics-live-preview.mjs
          npx tsc --noEmit
          npm run build
