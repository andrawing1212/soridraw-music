      # Stage418: a release will edit shared RTDB rules only after comparing
      # the actual remote policy. Check the same condition here READ ONLY,
      # before any Worker/Hosting version is promoted.
      - name: Authenticate Firebase for read-only shared Rules audit
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Verify live shared RTDB Rules are additive-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds_path = os.environ.get('GOOGLE_GHA_CREDS_PATH') or os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
          if not creds_path:
              raise SystemExit('Firebase read-only credential path missing')
          creds = service_account.Credentials.from_service_account_file(
              creds_path,
              scopes=['https://www.googleapis.com/auth/firebase.database',
                      'https://www.googleapis.com/auth/userinfo.email'])
          creds.refresh(Request())
          url='https://soridraw-app-866a5-default-rtdb.firebaseio.com/.settings/rules.json'
          response=requests.get(url,params={'access_token':creds.token},timeout=30)
          if response.status_code != 200:
              raise SystemExit('Shared RTDB Rules read-only GET failed HTTP '+str(response.status_code))
          Path(os.environ['RUNNER_TEMP'], 'rtdb-live-418.json').write_text(
              response.text,encoding='utf-8')
          print('418_SHARED_RTDB_LIVE_READ_ONLY=PASS')
          PY
          node scripts/verify-418-rtdb-rules-delta.mjs "$RUNNER_TEMP/rtdb-live-418.json"
          node scripts/verify-434-publication-rtdb-additive.mjs --self-test
          node scripts/verify-434-publication-rtdb-additive.mjs \
            "$RUNNER_TEMP/rtdb-live-418.json" \
            "$RUNNER_TEMP/rtdb-candidate434-readonly.json" \
            "$RUNNER_TEMP/rtdb-mode434-readonly.txt"
          echo '434_SHARED_RTDB_PUBLICATION_ADDITIVE_READONLY_AUDIT=PASS'
      # One-shot non-mutating live Functions metadata inventory for app496.
      # Runs only on this exact diagnostic PR branch; no ongoing API polling.
      # Uses the Firebase-authenticated service token from the Rules audit.
      - name: App496 read-only actual Cloud Functions metadata inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/app496-live-function-metadata-readonly'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-496-live-cloud-functions-readonly.py --self-test
          python3 scripts/audit-496-live-cloud-functions-readonly.py
      - name: App497 frozen release attestation gap audit — EXPECTED RELEASE HOLD
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/app497-release-attestation-gaps'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-497-release-attestation-gaps.mjs --self-test
          git fetch --no-tags origin fix/app492-release-controller-partial-failure-guard
          test "$(git rev-parse FETCH_HEAD)" = "f521b9c8808397d47b596f840ff816cac374dd91"
          git show f521b9c8808397d47b596f840ff816cac374dd91:.github/workflows/soridraw-release-promotion.yml > "$RUNNER_TEMP/app497-frozen-controller.yml"
          node scripts/audit-497-release-attestation-gaps.mjs --workflow "$RUNNER_TEMP/app497-frozen-controller.yml"
          echo 'APP497_EXPECTED_RELEASE_GATE=HOLD;THIS_IS_NOT_A_DEPLOYMENT_PASS'
      - name: Confirm no product deployment
        run: echo '408_QUALITY=PASS;NO_DEPLOYMENT;NO_SHARED_DATA_CHANGE'
