name: Temporary Title Enter Production Deploy

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'PRODUCTION TITLE ENTER SAVE 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved title Enter save patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('src/App.tsx')
          source = path.read_text()
          original = path.read_bytes()
          current_blob = hashlib.sha1(f'blob {len(original)}\0'.encode() + original).hexdigest()
          expected_blob = 'cd09c47d9f6fbf5b4a4054e7be11875d4eecccf1'

          if 'handleRecentSongTitleInputKeyDown' not in source and current_blob != expected_blob:
              raise SystemExit(f'Unexpected App.tsx baseline: {current_blob}')

          if 'handleRecentSongTitleInputKeyDown' not in source:
              marker = "  const getStudioSongFingerprint = (song: SongResult | null | undefined): string => {\n"
              handler = """  const handleRecentSongTitleInputKeyDown = (event: React.KeyboardEvent<HTMLInputElement>) => {\n    if (event.key !== 'Enter' || event.nativeEvent.isComposing) return;\n    event.preventDefault();\n    event.stopPropagation();\n    void saveRecentSongEdit();\n  };\n\n"""
              if marker not in source:
                  raise SystemExit('Title save handler insertion point not found.')
              source = source.replace(marker, handler + marker, 1)

          targets = (
              "updateRecentSongTitleDraft('koreanTitle', event.target.value)",
              "updateRecentSongTitleDraft('secondaryTitle', event.target.value)",
              "{ ...prev, koreanTitle: event.target.value }",
              "{ ...prev, secondaryTitle: event.target.value }",
          )
          lines = source.splitlines(keepends=True)
          output = []
          inserted = 0
          for index, line in enumerate(lines):
              output.append(line)
              if any(target in line for target in targets):
                  next_line = lines[index + 1] if index + 1 < len(lines) else ''
                  if 'onKeyDown={handleRecentSongTitleInputKeyDown}' not in next_line:
                      indent = line[:len(line) - len(line.lstrip())]
                      output.append(f"{indent}onKeyDown={{handleRecentSongTitleInputKeyDown}}\n")
                      inserted += 1

          source = ''.join(output)
          if source.count('onKeyDown={handleRecentSongTitleInputKeyDown}') != 6:
              raise SystemExit('Expected six title input Enter handlers.')

          path.write_text(source)
          PY

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Commit approved app change to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No app change required."
          else
            git commit -m "feat: save edited generated titles with Enter"
            git push origin HEAD:main
          fi
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy official Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          channelId: live
          projectId: soridraw

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ TITLE_ENTER_PRODUCTION_SUCCESS sha=${DEPLOY_SHA} url=https://soridraw.web.app/"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ TITLE_ENTER_PRODUCTION_FAILED run_id=${{ github.run_id }}"
