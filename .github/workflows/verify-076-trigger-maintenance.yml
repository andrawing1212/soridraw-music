name: Verify 076 Trigger Maintenance Candidate

on:
  push:
    branches: [work/social-snapshot-075-v2]
    paths:
      - 'cloudflare/explore-worker/candidates/076-derived-trigger-compaction.sql'
      - 'scripts/verify-076-trigger-maintenance.py'
      - '.github/workflows/verify-076-trigger-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-076-trigger-maintenance
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: work/social-snapshot-075-v2
          fetch-depth: 0

      - name: Verify DDL data purity and rollback
        run: python3 scripts/verify-076-trigger-maintenance.py

      - name: Confirm no deployment surface
        shell: bash
        run: |
          set -euo pipefail
          echo 'SHARED_D1_EXECUTED=false'
          echo 'WORKER_DEPLOYED=false'
          echo 'FIREBASE_DEPLOYED=false'
          echo 'USER_DATA_CHANGED=false'
