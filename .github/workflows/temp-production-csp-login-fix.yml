name: Temporary Production CSP Login Fix

on:
  issues:
    types: [opened]

concurrency:
  group: temp-production-csp-login-fix
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-hosting:
    if: github.event.issue.title == 'PRODUCTION CSP LOGIN FIX RETRY2 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.34.0

      - name: Deploy Firebase Hosting only with diagnostics
        id: deploy
        shell: bash
        run: |
          set +e
          firebase deploy --only hosting --project soridraw-app-866a5 --non-interactive 2>&1 | tee firebase-deploy.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify production headers
        id: verify
        if: steps.deploy.outputs.exit_code == '0'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSIL --max-time 30 https://soridraw.web.app/)"
          printf '%s\n' "$headers"
          if printf '%s\n' "$headers" | grep -qi '^content-security-policy:'; then
            echo 'Unexpected Content-Security-Policy header remains.' >&2
            exit 1
          fi
          curl -fsS --max-time 30 https://soridraw.web.app/ >/dev/null

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          DEPLOY_CODE: ${{ steps.deploy.outputs.exit_code }}
          VERIFY: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          {
            if [[ "$DEPLOY_CODE" == "0" && "$VERIFY" == "success" ]]; then
              echo "✅ PRODUCTION_CSP_LOGIN_FIX_SUCCESS sha=${sha} url=https://soridraw.web.app/"
            else
              echo "❌ PRODUCTION_CSP_LOGIN_FIX_FAILED sha=${sha} deploy_code=${DEPLOY_CODE:-missing} verify=${VERIFY}"
              echo
              echo '```text'
              tail -n 80 firebase-deploy.log 2>/dev/null || true
              echo '```'
            fi
          } > issue-comment.md
          gh issue comment "$ISSUE_URL" --body-file issue-comment.md
          if [[ "$DEPLOY_CODE" != "0" || "$VERIFY" != "success" ]]; then
            exit 1
          fi
