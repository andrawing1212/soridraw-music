name: SORIDRAW 043 PRODUCTION Transparent Brand

on:
  push:
    branches: [release-043-production-transparent-brand]
    paths: ['.github/workflows/release-043-production-transparent-brand.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soridraw-043-production-transparent-brand
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAIN_BASE: 644e785c20df6b2c1f833e87a464423caceaa721
      PREVIEW_BASE: 3a7de5fe6afa90833acbda233aff78c549eb9183
      FIREBASE_PROJECT: soridraw
    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare 043 controller
        shell: bash
        run: |
          set -euo pipefail
          cp .deploy/043-apply.py "$RUNNER_TEMP/043-apply.py"
          echo 'CONTROLLER_PRODUCTION_043=PASS'

      - name: Checkout guarded main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main preview --quiet
          test "$(git rev-parse origin/main)" = "$MAIN_BASE"
          test "$(git rev-parse origin/preview)" = "$PREVIEW_BASE"
          git checkout -B production-043-work origin/main
          test -f public/brand/soridraw-favicon-test-042.png
          echo 'STATE_GUARD_043=PASS'

      - name: Apply PRODUCTION 043
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python "$RUNNER_TEMP/043-apply.py"
          grep -F '"name": "SORIDRAW"' public/manifest.production.json
          grep -F 'soridraw-app-production-043-512.png' public/manifest.production.json
          grep -F 'soridraw-favicon-production-043.png' index.html
          grep -F 'soridraw-production-043.ico' index.html
          grep -F '"043"' public/app-version.json
          grep -F "CURRENT_APP_VERSION = '043'" src/services/appUpdateNotice.ts
          echo 'APPLY_PRODUCTION_043=PASS'

      - name: Validate scope TypeScript build regression
        shell: bash
        run: |
          set -euo pipefail
          git add index.html public/app-version.json public/manifest.production.json src/services/appUpdateNotice.ts \
            public/brand/soridraw-favicon-production-043.png \
            public/brand/soridraw-app-production-043.png \
            public/brand/soridraw-app-production-043-256.png \
            public/brand/soridraw-app-production-043-512.png \
            public/brand/soridraw-production-043.ico
          git diff --quiet "$MAIN_BASE" -- src/App.tsx
          git diff --cached --name-only | sort > "$RUNNER_TEMP/changed.txt"
          printf '%s\n' \
            index.html \
            public/app-version.json \
            public/brand/soridraw-app-production-043-256.png \
            public/brand/soridraw-app-production-043-512.png \
            public/brand/soridraw-app-production-043.png \
            public/brand/soridraw-favicon-production-043.png \
            public/brand/soridraw-production-043.ico \
            public/manifest.production.json \
            src/services/appUpdateNotice.ts | sort > "$RUNNER_TEMP/allowed.txt"
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/changed.txt"
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-033-explore-feed-revision.mjs
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/dist-index.sha"
          echo 'VALIDATE_PRODUCTION_043=PASS'

      - name: Commit and push main for PRODUCTION
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release@users.noreply.github.com'
          git commit -m 'feat(production): transparent brand and update notice 043'
          FINAL_SHA="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_BASE"
          git push origin HEAD:refs/heads/main
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "MAIN_PRODUCTION_043=$FINAL_SHA"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PRODUCTION only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.json --non-interactive
          echo 'FIREBASE_PRODUCTION_043=PASS'

      - name: Verify live PRODUCTION
        shell: bash
        run: |
          set -euo pipefail
          expected_index="$(cat "$RUNNER_TEMP/dist-index.sha")"
          for origin in 'https://soridraw.web.app' 'https://soridraw.com'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/" -o "$RUNNER_TEMP/live-index.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/live-index.html" | awk '{print $1}')"
                if [ "$actual" = "$expected_index" ]; then ok=yes; break; fi
              fi
              sleep 4
            done
            test "$ok" = yes
            echo "PRODUCTION_INDEX_043_PASS=$origin"
          done

          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' 'https://soridraw.com/manifest.production.json' -o "$RUNNER_TEMP/live-manifest.json"
          cmp dist/manifest.production.json "$RUNNER_TEMP/live-manifest.json"
          grep -F '"name": "SORIDRAW"' "$RUNNER_TEMP/live-manifest.json"
          grep -F 'soridraw-app-production-043-512.png' "$RUNNER_TEMP/live-manifest.json"

          for file in \
            soridraw-favicon-production-043.png \
            soridraw-app-production-043.png \
            soridraw-app-production-043-256.png \
            soridraw-app-production-043-512.png \
            soridraw-production-043.ico; do
            curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://soridraw.com/brand/$file" -o "$RUNNER_TEMP/$file"
            cmp "dist/brand/$file" "$RUNNER_TEMP/$file"
          done
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' 'https://soridraw.com/app-version.json' -o "$RUNNER_TEMP/live-version.json"
          cmp dist/app-version.json "$RUNNER_TEMP/live-version.json"
          grep -F '"043"' "$RUNNER_TEMP/live-version.json"

          test "$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://test.soridraw.com/app-version.json | tr -d '\n ' | grep -o '042')" = '042'
          test "$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://preview.soridraw.com/app-version.json | tr -d '\n ' | grep -o '041')" = '041'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$FINAL_SHA"
          echo 'TEST_LIVE_STILL_042=PASS'
          echo 'PREVIEW_LIVE_STILL_041=PASS'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'WORKER_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'
          echo 'PRODUCTION_LIVE_043=PASS'

      - name: Package PRODUCTION ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="SORIDRAW_043_PRODUCTION_${FINAL_SHA:0:8}_2026-09-08.zip"
          git archive --format=zip --output="$ZIP" HEAD
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload PRODUCTION ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_043_PRODUCTION_${{ env.FINAL_SHA }}
          path: ${{ env.ZIP }}
          if-no-files-found: error
