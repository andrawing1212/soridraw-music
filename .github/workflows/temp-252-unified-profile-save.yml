name: TEMP 252 Unified Profile Save Verify

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/252-unified-profile-save.trigger'

permissions:
  contents: write

concurrency:
  group: soridraw-252-unified-profile-save
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock exact canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          grep -q 'SORIDRAW_UNIFIED_PROFILE_SAVE_252_20260930' cloudflare/explore-worker/canonical/preview-worker.js
          grep -q 'SORIDRAW_UNIFIED_PROFILE_SAVE_CLIENT_252_20260930' src/services/exploreSocialService.ts
          grep -q 'SORIDRAW_UNIFIED_PROFILE_SAVE_UI_252_20260930' src/components/explore/ExploreProfileEditModal.tsx
          echo '252_SOURCE_LOCK=PASS'

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify unified profile save
        run: |
          node scripts/verify-252-unified-profile-save.mjs
          node scripts/verify-explore-deploy-preflight.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Worker syntax and exact lock
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node --check cloudflare/explore-worker/canonical/preview-entry.js
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          test "$(node -e "process.stdout.write(String(require('./public/app-version.json').version || ''))")" = '249'
          echo '252_VERIFY_BUILD=PASS'

      - name: Commit source lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare/explore-worker/canonical/source-sha256.txt; then
            echo 'SOURCE_LOCK_ALREADY_CURRENT=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/explore-worker/canonical/source-sha256.txt
          git commit -m 'chore(preview): lock app249 unified profile worker'
          git push origin HEAD:preview
