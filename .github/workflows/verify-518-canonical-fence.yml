name: Verify app518 Canonical Music Note Catalog Fence (No Deploy)

on:
  pull_request:
    branches: [preview]
    paths:
      - 'cloudflare/media-worker/src/catalogCanonicalFence518.js'
      - 'scripts/verify-518-canonical-fence.mjs'
      - 'cloudflare/media-worker/src/catalogEventGate518.js'
      - 'cloudflare/media-worker/src/catalogJournalReconcile518.js'
      - 'cloudflare/media-worker/src/catalogAuthorityPolicy518.js'
      - 'cloudflare/media-worker/src/catalogD1Outbox518.js'
      - 'cloudflare/media-worker/src/catalogFirstChangeIndex518.js'
      - 'cloudflare/media-worker/src/catalogRemovalAuthority518.js'
      - 'cloudflare/media-worker/migrations/518_music_note_catalog_first_change_index.sql'
      - 'scripts/verify-518-first-change-index.mjs'
      - 'scripts/verify-518-first-change-index-sql.py'
      - 'scripts/verify-518-removal-authority.mjs'
      - 'cloudflare/media-worker/src/catalogDelivery518.js'
      - 'cloudflare/media-worker/src/catalogIndexAdvance518.js'
      - 'cloudflare/media-worker/src/catalogIndexedWriter518.js'
      - 'cloudflare/media-worker/src/catalogCompactionRecovery518.js'
      - 'cloudflare/media-worker/src/catalogHardDeleteReceipt518.js'
      - 'cloudflare/media-worker/src/catalogHardDeleteSource518.js'
      - 'functions/src/app518CanonicalSourceProvider.ts'
      - 'functions/scripts/test-app518-delete-event-epochs.cjs'
      - 'functions/src/app518ServerTransport.ts'
      - 'cloudflare/media-worker/src/catalogR2Provider518.js'
      - 'cloudflare/media-worker/src/catalogServerAuth518.js'
      - 'cloudflare/media-worker/src/catalogServerBridge518.js'
      - 'cloudflare/media-worker/src/catalogFirebaseFetcher518.js'
      - 'scripts/verify-518-r2-binding.mjs'
      - 'scripts/verify-518-server-transport.mjs'
      - 'scripts/verify-518-server-bridge.mjs'
      - 'scripts/verify-518-compaction-recovery.mjs'
      - 'scripts/verify-518-compaction-recovery-sql.py'
      - 'scripts/verify-518-hard-delete-receipt.mjs'
      - 'scripts/verify-518-hard-delete-source.mjs'
      - 'scripts/verify-518-indexed-writer.mjs'
      - 'scripts/verify-518-index-advance-sql.py'
      - 'scripts/verify-518-index-delta-recovery.mjs'
      - 'cloudflare/media-worker/migrations/518_music_note_catalog_outbox.sql'
      - 'scripts/verify-518-d1-outbox-sql.py'
      - 'scripts/verify-518-d1-outbox-adapter.mjs'
      - 'scripts/verify-518-d1-delivery-drain.mjs'
      - 'cloudflare/media-worker/src/index.js'
      - 'scripts/verify-518-worker-compat-switch.mjs'
      - 'scripts/verify-518-catalog-event-cost-gate.mjs'
      - 'scripts/verify-518-journal-cas-simulator.mjs'
      - 'scripts/verify-518-legacy-rebuild-redteam.mjs'
      - 'scripts/verify-518-head-capacity-redteam.mjs'
      - '.github/workflows/verify-518-canonical-fence.yml'
      - 'DOCS/APP518_MUSIC_NOTE_CATALOG_REPAIR_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-version-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact source version, stale save rejection, tombstones and cross-user safety
        run: |
          node scripts/verify-518-canonical-fence.mjs
          node scripts/verify-518-catalog-event-cost-gate.mjs
          node scripts/verify-518-journal-cas-simulator.mjs
          node scripts/verify-518-legacy-rebuild-redteam.mjs
          node scripts/verify-518-head-capacity-redteam.mjs
          node scripts/verify-518-worker-compat-switch.mjs
          node scripts/verify-518-d1-outbox-adapter.mjs
          node scripts/verify-518-d1-delivery-drain.mjs
          python3 scripts/verify-518-d1-outbox-sql.py
          node scripts/verify-518-first-change-index.mjs
          python3 scripts/verify-518-first-change-index-sql.py
          node scripts/verify-518-removal-authority.mjs
          node scripts/verify-518-index-delta-recovery.mjs
          node scripts/verify-518-indexed-writer.mjs
          python3 scripts/verify-518-index-advance-sql.py
          node scripts/verify-518-compaction-recovery.mjs
          python3 scripts/verify-518-compaction-recovery-sql.py
          node scripts/verify-518-hard-delete-receipt.mjs
          node scripts/verify-518-hard-delete-source.mjs
          node scripts/verify-518-r2-binding.mjs
          node scripts/verify-518-server-transport.mjs
          node scripts/verify-518-server-bridge.mjs
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          node functions/scripts/test-app518-delete-event-epochs.cjs
      - name: Protect existing next-song, publication, Music Note and local-first behaviors
        run: |
          node scripts/verify-204-explore-next-song-parity.mjs
          node scripts/verify-203-explore-action-visual-publication.mjs
          # Existing verify-211 has a PREVIEW baseline source-pattern mismatch.
          # Do not change working production code to satisfy that stale assertion.
          node scripts/verify-356-explore-immediate-social-ux.mjs
          node scripts/verify-349-studio-heart-settlement-media.mjs
          node scripts/verify-280-music-note-resurrection.mjs
          # Legacy verify-081 assumes synchronous publication mutation semantics
          # and fails on current PREVIEW too; protect Music Note batch via app031.
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-277-music-note-sync-cost.mjs
      - name: Verify app518 candidate changes ONLY isolated safety helpers, tests and docs
        run: |
          set -euo pipefail
          git fetch origin preview --no-tags
          git diff --name-only origin/preview...HEAD | while IFS= read -r file; do
            case "$file" in
              cloudflare/media-worker/src/catalogCanonicalFence518.js|cloudflare/media-worker/src/catalogEventGate518.js|cloudflare/media-worker/src/catalogJournalReconcile518.js|cloudflare/media-worker/src/catalogAuthorityPolicy518.js|cloudflare/media-worker/src/catalogD1Outbox518.js|cloudflare/media-worker/src/catalogFirstChangeIndex518.js|cloudflare/media-worker/src/catalogRemovalAuthority518.js|cloudflare/media-worker/migrations/518_music_note_catalog_first_change_index.sql|scripts/verify-518-first-change-index.mjs|scripts/verify-518-first-change-index-sql.py|scripts/verify-518-removal-authority.mjs|cloudflare/media-worker/src/catalogDelivery518.js|cloudflare/media-worker/src/catalogIndexAdvance518.js|cloudflare/media-worker/src/catalogIndexedWriter518.js|cloudflare/media-worker/src/catalogCompactionRecovery518.js|cloudflare/media-worker/src/catalogHardDeleteReceipt518.js|cloudflare/media-worker/src/catalogHardDeleteSource518.js|functions/src/app518CanonicalSourceProvider.ts|functions/scripts/test-app518-delete-event-epochs.cjs|functions/src/app518ServerTransport.ts|cloudflare/media-worker/src/catalogR2Provider518.js|cloudflare/media-worker/src/catalogServerAuth518.js|cloudflare/media-worker/src/catalogServerBridge518.js|cloudflare/media-worker/src/catalogFirebaseFetcher518.js|scripts/verify-518-r2-binding.mjs|scripts/verify-518-server-transport.mjs|scripts/verify-518-server-bridge.mjs|scripts/verify-518-compaction-recovery.mjs|scripts/verify-518-compaction-recovery-sql.py|scripts/verify-518-hard-delete-receipt.mjs|scripts/verify-518-hard-delete-source.mjs|scripts/verify-518-indexed-writer.mjs|scripts/verify-518-index-advance-sql.py|scripts/verify-518-index-delta-recovery.mjs|cloudflare/media-worker/migrations/518_music_note_catalog_outbox.sql|scripts/verify-518-d1-outbox-sql.py|scripts/verify-518-d1-outbox-adapter.mjs|scripts/verify-518-d1-delivery-drain.mjs|cloudflare/media-worker/src/index.js|scripts/verify-518-worker-compat-switch.mjs|scripts/verify-518-canonical-fence.mjs|scripts/verify-518-catalog-event-cost-gate.mjs|scripts/verify-518-journal-cas-simulator.mjs|scripts/verify-518-legacy-rebuild-redteam.mjs|scripts/verify-518-head-capacity-redteam.mjs|DOCS/APP518_MUSIC_NOTE_CATALOG_REPAIR_CONTRACT.md|.github/workflows/verify-518-canonical-fence.yml) ;;
              *) echo "APP518_UNAPPROVED_PRODUCT_OR_BACKEND_CHANGE=$file"; exit 2 ;;
            esac
          done
          echo APP518_EXISTING_PRODUCT_AND_DEPLOY_FILE_SCOPE=PASS
      - name: Verify no active canonical source writer/retry enabled
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'catalogJournalReconcile518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogD1Outbox518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogFirstChangeIndex518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogRemovalAuthority518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogDelivery518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogIndexAdvance518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogIndexedWriter518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogCompactionRecovery518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogHardDeleteReceipt518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogHardDeleteSource518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogR2Provider518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogServerAuth518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogServerBridge518' cloudflare/media-worker/src/index.js
          ! grep -q 'catalogFirebaseFetcher518' cloudflare/media-worker/src/index.js
          ! grep -q 'app518CanonicalSourceProvider' functions/src/index.ts
          ! grep -q 'app518ServerTransport' functions/src/index.ts
          ! grep -q 'CATALOG_SERVER_HMAC_518' cloudflare/media-worker/wrangler.jsonc
          ! grep -q 'catalogCanonicalFence518' cloudflare/media-worker/src/index.js
          ! grep -q 'SORIDRAW_CANONICAL_CATALOG_518' cloudflare/media-worker/wrangler.jsonc
          ! grep -q 'CATALOG_OUTBOX_518' cloudflare/media-worker/wrangler.jsonc
          echo 'APP518_NO_ACTIVE_CANONICAL_SYNC=PASS'
      - name: Verify no active app or Worker integration in the contract-only release
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'catalogCanonicalFence518' cloudflare/media-worker/src/index.js
          ! grep -q 'reconcile-exact' src/lib/userDataEngine.ts
          echo 'APP518_NO_LIVE_R2_WRITES_OR_AUTOMATIC_RECOVERY=PASS'
