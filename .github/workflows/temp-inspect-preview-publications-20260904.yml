name: SORIDRAW Inspect PREVIEW Publications 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-preview-publications-20260904.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inspect exact active PREVIEW publication handlers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,account='e1a30fc9ef497fda1d34f4ab3dc1da45',name='soridraw-explore-preview';
          async function j(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,1000));return x.result||x;}
          function fn(src,name){const re=new RegExp(`(?:async\\s+)?function\\s+${name}\\s*\\([^)]*\\)\\s*\\{`);const m=re.exec(src);if(!m)return `MISSING ${name}`;let i=m.index+m[0].length,d=1,q=null,esc=false;for(;i<src.length;i++){const c=src[i],n=src[i+1];if(q){if(esc){esc=false;continue}if(c==='\\\\'){esc=true;continue}if(c===q){q=null}continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){i=src.indexOf('\n',i);if(i<0)break;continue}if(c==='/'&&n==='*'){const e=src.indexOf('*/',i+2);i=e<0?src.length:e+1;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return src.slice(m.index,i+1)}return `UNTERMINATED ${name}`}
          (async()=>{const deps=await j(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`),d=(deps.deployments||deps||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0],ver=await j(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${v.version_id}?include=modules`),mod=(ver.modules||[]).find(m=>m.name===ver.main_module)||(ver.modules||[])[0],src=Buffer.from(mod.content_base64,'base64').toString('utf8');for(const n of ['handleMyPublications','handlePublication','handleVisibility','handlePublicationOptions','mapTrackRow'])console.log(`\n===== ${n} =====\n${fn(src,n)}\n`);console.log(`VERSION=${v.version_id}`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
