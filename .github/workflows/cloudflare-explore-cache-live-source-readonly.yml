name: Cloudflare Explore Cache Live Source Readonly

# Read-only bootstrap/diagnostic: capture the exact active PREVIEW Worker code.
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/cloudflare-explore-cache-live-source-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      # P0 cross-environment curation read audit. No deploy, no mutation,
      # no user-private Firebase reads, and no cache bootstrap on missing R2.
      - name: Checkout exact approved read-only audit source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded read-only curated probe
        run: |
          node --check scripts/diagnose-p0-curated-three-env-readonly.mjs
          node scripts/diagnose-p0-curated-three-env-readonly.mjs --self-test
          node --check scripts/verify-477-curated-active-writer-gate.mjs
          node scripts/verify-477-curated-active-writer-gate.mjs --self-test
          node --check scripts/verify-478-curated-race-rollback.mjs
          node scripts/verify-478-curated-race-rollback.mjs
      - name: Compare shared D1 curated membership and three real public environments
        id: curated_parity
        continue-on-error: true
        run: node scripts/diagnose-p0-curated-three-env-readonly.mjs
      - name: Capture exact active PREVIEW Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          mkdir -p "$GITHUB_WORKSPACE/cloudflare/explore-worker/.remote-worker"
          node <<'NODE'
          const fs = require('fs');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const worker = process.env.PREVIEW_WORKER;
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };

          async function get(url) {
            const response = await fetch(url, { headers });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`Cloudflare ${response.status}: ${text.slice(0,600)}`); }
            if (!response.ok || body.success === false) throw new Error(`Cloudflare ${response.status}: ${text.slice(0,800)}`);
            return body.result ?? body;
          }

          (async () => {
            const payload = await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/deployments`);
            const deployment = (payload.deployments || payload || [])[0];
            const active = [...(deployment?.versions || [])].sort((a,b) => Number(b.percentage || 0) - Number(a.percentage || 0))[0];
            if (!active?.version_id || Number(active.percentage || 0) < 99.99) throw new Error('No single active PREVIEW Worker version');
            const version = await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${worker}/versions/${active.version_id}?include=modules`);
            const modules = Array.isArray(version.modules) ? version.modules : [];
            if (modules.length !== 1) throw new Error(`Expected one self-contained Worker module, got ${modules.length}`);
            const source = Buffer.from(modules[0].content_base64 || '', 'base64').toString('utf8');
            if (source.length < 5000) throw new Error('Active PREVIEW Worker source unexpectedly small');
            fs.writeFileSync('cloudflare/explore-worker/.remote-worker/worker.js', source);
            fs.writeFileSync('cloudflare/explore-worker/.remote-worker/version.txt', String(active.version_id));
            console.log(`PREVIEW_ACTIVE_VERSION=${active.version_id}`);
            console.log(`PREVIEW_SOURCE_BYTES=${Buffer.byteLength(source)}`);
            console.log('PATCH_REPLAY=NO');
            console.log('WORKER_DEPLOY=NO');
            console.log('D1_WRITE=NO');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload exact active source
        uses: actions/upload-artifact@v4
        with:
          name: preview-worker-active-source
          path: |
            cloudflare/explore-worker/.remote-worker/worker.js
            cloudflare/explore-worker/.remote-worker/version.txt
          retention-days: 1

      # app476: only the three new curated rollout switches are checked.
      # No changes to Worker configuration, shared D1, or R2; log states
      # only, never the full settings response, secret contents or token.
      - name: Check actual PREVIEW curated rollout switches and bindings read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A = process.env.CLOUDFLARE_ACCOUNT_ID;
          const T = process.env.CLOUDFLARE_API_TOKEN;
          const worker = process.env.PREVIEW_WORKER;
          if (!A || !T || worker !== 'soridraw-explore-preview')
            throw Error('PREVIEW_CURATED_REMOTE_ACCESS_MISSING_476');
          const flags = [
            'SORIDRAW_CURATED_WRITER_SHADOW471',
            'SORIDRAW_CURATED_SHARED_V466',
            'SORIDRAW_CURATED_ALL_WRITERS_READY466',
          ];
          const requireBinding = (byName, name, type, field, expected) => {
            const item = byName.get(name);
            const actual = field === 'id'
              ? item?.id || item?.database_id || item?.uuid
              : field === 'bucket_name' ? item?.bucket_name || item?.bucket : item?.[field];
            if (!item || String(item.type || '') !== type
              || String(actual || '') !== expected)
              throw Error('PREVIEW_CURATED_BINDING_MISMATCH_476:' + name);
          };
          (async () => {
            const response = await fetch(
              'https://api.cloudflare.com/client/v4/accounts/' + A
                + '/workers/scripts/' + worker + '/settings', {
              headers: { Authorization: 'Bearer ' + T, Accept: 'application/json' },
            });
            if (!response.ok) throw Error('PREVIEW_CURATED_SETTINGS_HTTP_476:' + response.status);
            const payload = await response.json();
            if (payload?.success !== true || !Array.isArray(payload?.result?.bindings))
              throw Error('PREVIEW_CURATED_SETTINGS_INVALID_476');
            const bindings = payload.result.bindings;
            const byName = new Map();
            for (const binding of bindings) {
              const name = String(binding.name || '');
              if (!name || byName.has(name))
                throw Error('PREVIEW_CURATED_BINDING_DUPLICATE_476');
              byName.set(name, binding);
            }
            requireBinding(byName, 'DB', 'd1', 'id', '217ef5b1-5d80-4f7c-afc7-9e07eb05c06b');
            requireBinding(byName, 'RATE_DB', 'd1', 'id', 'aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f');
            requireBinding(byName, 'PROFILE_MEDIA', 'r2_bucket', 'bucket_name', 'soridraw-profile-media');
            requireBinding(byName, 'EXPLORE_CACHE', 'r2_bucket', 'bucket_name', 'soridraw-profile-media-preview');
            if (!byName.has('EXPLORE_LIKE_BATCH_SCHEDULER'))
              throw Error('PREVIEW_CURATED_DO_BINDING_MISSING_476');
            let safe = true;
            for (const name of flags) {
              const binding = byName.get(name);
              const status = !binding ? 'ABSENT_OFF'
                : binding.type === 'plain_text' && String(binding.text ?? binding.value ?? '') === '0'
                  ? 'EXPLICIT_OFF' : 'UNSAFE_OR_UNREADABLE';
              console.log('PREVIEW_' + name + '=' + status);
              if (status === 'UNSAFE_OR_UNREADABLE') safe = false;
            }
            console.log('PREVIEW_CURATED_CANONICAL_AND_LOCAL_BINDINGS=PASS');
            console.log('PREVIEW_CURATED_REMOTE_SETTINGS_READONLY=PASS');
            console.log('REMOTE_WRITES=0 WORKER_DEPLOY=0');
            if (!safe) throw Error('PREVIEW_CURATED_ROLLOUT_FLAGS_NOT_PROVEN_OFF_476');
            console.log('PREVIEW_CURATED_ROLLOUT_FLAGS_HARD_OFF=PASS');
          })().catch(error => { console.error(String(error.message || error)); process.exit(1); });
          NODE

      # Audit-only GET verification, never activates writers/readers or writes D1/R2.
      # A failed or unprovable old in-flight drain MUST remain a release HOLD.
      # Browser must execute the deployed Firebase guest app to prove the
      # actually selected curated API. All curated requests are intercepted,
      # and other Worker API requests are blocked (no extra D1 reads).
      - name: Install browser probe dependency (CI only)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      # app489: independent PREVIEW postflight within the existing read-only
      # audit; mobile/PC requests are intercepted before Worker/D1 access.
      # Keep full three-environment readiness HOLD as a separate gate.
      - name: Verify deployed PREVIEW Writer module and PC/mobile origin selection read-only
        id: preview_writer_postflight
        continue-on-error: true
        run: |
          node --check scripts/verify-489-preview-writer-postflight.mjs
          node scripts/verify-489-preview-writer-postflight.mjs --self-test
          node scripts/verify-489-preview-writer-postflight.mjs
      - name: Compare three active Worker writers and retirement proof read-only
        id: active_writer_gate
        continue-on-error: true
        run: node scripts/verify-477-curated-active-writer-gate.mjs

      - name: Enforce curated parity result after original source archive
        if: always()
        shell: bash
        run: |
          test "${{ steps.preview_writer_postflight.outcome }}" = success
          test "${{ steps.curated_parity.outcome }}" = success
          test "${{ steps.active_writer_gate.outcome }}" = success
          echo 'P0_CURATED_PARITY_FINAL=PASS'
