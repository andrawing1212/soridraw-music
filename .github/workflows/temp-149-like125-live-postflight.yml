name: TEMP 149 App125 Worker071 Live Postflight
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-149-like125-live-postflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2bc5ee3e1845e6abb6c573e468a711f40f41fd3
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm active versions and hosted app125
        shell: bash
        run: |
          set -euo pipefail
          active(){
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$1/deployments" | jq -er '.result.deployments[0].versions|max_by(.percentage)|select(.percentage>=99.99)|.version_id'
          }
          p="$(active soridraw-explore-preview)"
          t="$(active soridraw-explore-test)"
          r="$(active soridraw-explore-api)"
          test "$p" = a6fda48f-ec20-48b3-a08d-ef43128c2e43
          test "$t" = 6e8dca9c-2c58-42ea-ae7d-765e10afef8f
          test "$r" = d6b0a284-6e3c-4b57-aebf-0a7d1c3513e0
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          test "$expected" = b170d05385c3096a98033675a9acbb63b40148bf782017c326845b7ea4c17813
          test "$expected" = "$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | cut -d' ' -f1)"
          code="$(curl -fsS --max-time 20 -o "$RUNNER_TEMP/app149.html" -w '%{http_code}' -H 'Cache-Control: no-cache' https://preview.soridraw.com/)"
          test "$code" = 200
          version="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' https://preview.soridraw.com/app-version.json | node -pe "JSON.parse(require('fs').readFileSync(0)).version")"
          test "$version" = 125
          echo "LIVE_PREVIEW_WORKER_071=$p"
          echo "LIVE_APP_VERSION=$version"
          echo "TEST_PRODUCTION_WORKERS_UNCHANGED=PASS"
      - name: Read-only entire canonical 37 public tracks and known private track
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          npm install --no-audit --no-fund --package-lock=false
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$W" d1 execute DB --remote --config "$CFG" --command "SELECT t.id,COALESCE(s.like_count,0) AS canonical_count,(SELECT COUNT(*) FROM likes l WHERE l.track_id=t.id) AS relation_count,d.likes AS derived_count,json_extract(d.row_json,'$.like_count') AS derived_json_count FROM tracks t LEFT JOIN track_stats s ON s.track_id=t.id LEFT JOIN explore_derived_tracks d ON d.id=t.id WHERE t.is_public=1 AND t.status='published' LIMIT 201" --json > "$RUNNER_TEMP/canonical149.json"
          node "$W" d1 execute DB --remote --config "$CFG" --command "SELECT id,is_public FROM tracks WHERE updated_at=1789829348623 LIMIT 2" --json > "$RUNNER_TEMP/private149.json"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),root=process.env.RUNNER_TEMP;
          const publicRows=JSON.parse(fs.readFileSync(root+'/canonical149.json','utf8')).flatMap(x=>x.results||[]);
          if(publicRows.length!==37)throw Error('unexpected public population '+publicRows.length);
          for(const row of publicRows){
            const c=Number(row.canonical_count);
            if([row.relation_count,row.derived_count,row.derived_json_count].some(x=>Number(x)!==c))throw Error('D1 canonical/derived mismatch');
          }
          const rows=JSON.parse(fs.readFileSync(root+'/private149.json','utf8')).flatMap(x=>x.results||[]);
          if(rows.length!==1||Number(rows[0].is_public)!==0)throw Error('known private target changed');
          const id=String(rows[0].id||''),hash=crypto.createHash('sha256').update(id).digest('hex').slice(0,10);
          if(hash!=='1319e4479e')throw Error('private identity drift');
          fs.writeFileSync(root+'/private149.id',id);
          console.log('CANONICAL_37_LIKE_RELATION_DERIVED=PASS');
          console.log('PRIVATE_ORIGIN_UNCHANGED=PASS');
          NODE
      - name: Compare latest popular live Feed and R2 snapshots with D1
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          for sort in latest popular;do
            curl -fsS --retry 3 -D "$RUNNER_TEMP/api-$sort.head" -o "$RUNNER_TEMP/api-$sort.json" \
              -H 'Origin: https://preview.soridraw.com' \
              "$PREVIEW_BASE/v1/feed?sort=$sort&limit=40&__soridraw_r2_only=108"
            node "$W" r2 object get "soridraw-profile-media-preview/internal/explore/feed-v1/$sort-40.json" --file "$RUNNER_TEMP/local-$sort.json" --remote >/dev/null
            node "$W" r2 object get "soridraw-profile-media/internal/explore/shared-feed-v112/$sort-40.json" --file "$RUNNER_TEMP/shared-$sort.json" --remote >/dev/null
          done
          node <<'NODE'
          const fs=require('fs'),root=process.env.RUNNER_TEMP;
          const rows=JSON.parse(fs.readFileSync(root+'/canonical149.json','utf8')).flatMap(x=>x.results||[]);
          const reference=new Map(rows.map(x=>[String(x.id),Number(x.canonical_count)]));
          const privateId=fs.readFileSync(root+'/private149.id','utf8').trim();
          for(const scope of ['api','local','shared'])for(const sort of ['latest','popular']){
            const bundle=JSON.parse(fs.readFileSync(root+'/'+scope+'-'+sort+'.json','utf8'));
            if(bundle.ok===false)throw Error(scope+' '+sort+' API error');
            const items=bundle?.data?.items||bundle?.payload?.data?.items||[];
            if(items.length!==37||new Set(items.map(x=>String(x.id||x.trackId||''))).size!==37)throw Error(scope+' '+sort+' population drift');
            if(items.some(x=>String(x.id||x.trackId||'')===privateId))throw Error(scope+' '+sort+' private leak');
            for(const x of items){
              const id=String(x.id||x.trackId||''),count=Number(x.likeCount??x.stats?.likeCount??0);
              if(!reference.has(id)||reference.get(id)!==count)throw Error(scope+' '+sort+' like mismatch');
            }
            console.log('LIVE_PARITY scope='+scope+' sort='+sort+' count=37 canonicalLikes=PASS privateAbsent=PASS');
          }
          NODE
          for sort in latest popular;do
            head="$RUNNER_TEMP/api-$sort.head"
            read="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r","");print $2}' "$head"|tail -1)"
            write="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r","");print $2}' "$head"|tail -1)"
            test "$read" = 0
            test "$write" = 0
            echo "LIVE_$sort D1_R0_W0=PASS"
          done
          echo 'POSTFLIGHT_125_071=PASS D1_WRITE=0 R2_WRITE=0 FIREBASE_WRITE=0'
