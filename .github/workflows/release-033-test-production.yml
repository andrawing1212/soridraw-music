name: SORIDRAW 033 TEST PRODUCTION

on:
  push:
    branches:
      - release-033-test-production
    paths:
      - .deploy/release-033-cloudflare.mjs
      - .github/workflows/release-033-test-production.yml

permissions:
  contents: write

concurrency:
  group: soridraw-release-033-test-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PREVIEW_BASELINE_SHA: a51bc4032a68eafaba9a730dad9e124b204d99a7
      EXPECTED_MAIN_SHA: 77d57c5dd0af4f529f9bd0bd37b00e36f5b8b72c
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIREBASE_PROJECT: soridraw
      TEST_ORIGIN: https://test.soridraw.com
      TEST_WEB: https://soridraw-test.web.app
      PROD_ORIGIN: https://soridraw.com
      PROD_WEB: https://soridraw.web.app

    steps:
      - name: Checkout release control branch
        uses: actions/checkout@v4
        with:
          ref: release-033-test-production
          fetch-depth: 0

      - name: Guard validated PREVIEW 033 and current main
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PREVIEW_BASELINE_SHA^{commit}"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_BASELINE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          changed="$(git diff --name-only "$PREVIEW_BASELINE_SHA" HEAD | sort)"
          expected=$'.deploy/release-033-cloudflare.mjs\n.github/workflows/release-033-test-production.yml'
          test "$changed" = "$expected"
          echo 'RELEASE_033_GUARD=PASS'

      - name: Promote exact validated PREVIEW 033 tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release@users.noreply.github.com'
          git fetch origin main preview
          release_root="$RUNNER_TEMP/soridraw-main-033"
          rm -rf "$release_root"
          git worktree add -b release-main-033 "$release_root" origin/main
          cd "$release_root"
          git read-tree --reset -u "$PREVIEW_BASELINE_SHA"
          git add -A
          git commit -m 'release: promote validated PREVIEW 033 snapshot'
          release_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$PREVIEW_BASELINE_SHA^{tree}")"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$release_sha"
          echo "RELEASE_ROOT=$release_root" >> "$GITHUB_ENV"
          echo "MAIN_RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "MAIN_RELEASE_SHORT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_RELEASE_SHA=$release_sha"
          echo 'MAIN_TREE_EQUALS_PREVIEW_033=PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify exact main release and build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT"
          npm ci
          node .deploy/apply-033-explore-feed-revision.mjs
          git diff --exit-code -- src/pages/ExplorePage.tsx src/services/exploreSessionCache.ts
          npx tsc --noEmit
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-033-explore-feed-revision.mjs
          npm run build
          grep -R -q '/v1/feed-revision' dist/assets
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/release-index.sha"
          echo 'MAIN_033_TYPESCRIPT_BUILD_REGRESSION=PASS'

      - name: Set up Node.js 22 for Cloudflare
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT/cloudflare/explore-worker"
          npm install --no-audit --no-fund --package-lock=false

      - name: Snapshot PRODUCTION Hosting before TEST
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$PROD_WEB/" -o "$RUNNER_TEMP/prod-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          echo 'PRODUCTION_SNAPSHOT_BEFORE_TEST=PASS'

      - name: Deploy Explore TEST Worker 033
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_RELEASE_ROOT="$RELEASE_ROOT" node .deploy/release-033-cloudflare.mjs test

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase TEST Hosting
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-test.json --non-interactive
          echo 'FIREBASE_TEST_033_DEPLOY=PASS'

      - name: Verify TEST exact build and Explore revision
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for url in "$TEST_WEB/" "$TEST_ORIGIN/"; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${url}?release=033-${attempt}" -o "$RUNNER_TEMP/test-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/test-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 6
            done
            test "$ok" = yes
            echo "TEST_EXACT_BUILD_PASS=$url"
          done
          curl -fsS -D "$RUNNER_TEMP/test-rev.headers" -H "Origin: $TEST_ORIGIN" 'https://soridraw-explore-test.andrawing1212.workers.dev/v1/feed-revision?sort=latest' -o "$RUNNER_TEMP/test-rev.json"
          grep -q '"revision"' "$RUNNER_TEMP/test-rev.json"
          grep -qi '^x-soridraw-d1-read: 0' "$RUNNER_TEMP/test-rev.headers"
          grep -qi '^x-soridraw-d1-write: 0' "$RUNNER_TEMP/test-rev.headers"
          echo 'TEST_033_FULL_STACK=PASS'

      - name: Verify PRODUCTION unchanged after TEST
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$PROD_WEB/" -o "$RUNNER_TEMP/prod-mid.html"
          sha256sum "$RUNNER_TEMP/prod-mid.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-mid.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-mid.sha"
          echo 'PRODUCTION_UNCHANGED_AFTER_TEST=PASS'

      - name: Deploy Explore PRODUCTION Worker 033
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_RELEASE_ROOT="$RELEASE_ROOT" node .deploy/release-033-cloudflare.mjs production

      - name: Deploy Firebase PRODUCTION Hosting
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.json --non-interactive
          echo 'FIREBASE_PRODUCTION_033_DEPLOY=PASS'

      - name: Verify PRODUCTION exact build and Explore revision
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for url in "$PROD_WEB/" "$PROD_ORIGIN/"; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${url}?release=033-${attempt}" -o "$RUNNER_TEMP/prod-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/prod-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 6
            done
            test "$ok" = yes
            echo "PRODUCTION_EXACT_BUILD_PASS=$url"
          done
          curl -fsS -D "$RUNNER_TEMP/prod-rev.headers" -H "Origin: $PROD_ORIGIN" 'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed-revision?sort=latest' -o "$RUNNER_TEMP/prod-rev.json"
          grep -q '"revision"' "$RUNNER_TEMP/prod-rev.json"
          grep -qi '^x-soridraw-d1-read: 0' "$RUNNER_TEMP/prod-rev.headers"
          grep -qi '^x-soridraw-d1-write: 0' "$RUNNER_TEMP/prod-rev.headers"
          echo 'PRODUCTION_033_FULL_STACK=PASS'

      - name: Final release invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_RELEASE_SHA"
          cd "$RELEASE_ROOT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$PREVIEW_BASELINE_SHA^{tree}")"
          echo 'FINAL_MAIN_TREE_EQUALS_PREVIEW_033=PASS'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'
          echo 'FIRESTORE_DATA_MIGRATION=false'
          echo 'SORIDRAW_033_TEST_PRODUCTION=PASS'
