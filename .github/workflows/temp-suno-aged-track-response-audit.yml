name: Temp Suno Aged Track Response Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-suno-aged-track-response-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Authenticate Firebase read-only audit
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Inspect actual Library bundle recovery fields
        working-directory: functions
        env:
          FIREBASE_PROJECT_ID: soridraw-app-866a5
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/dev/null
          node <<'NODE'
          const admin=require('firebase-admin');
          if(!admin.apps.length) admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:process.env.FIREBASE_PROJECT_ID});
          const db=admin.firestore();
          const toMs=(v)=>{try{return v?.toMillis?.()||(typeof v==='number'?v:Date.parse(v||''))||0}catch{return 0}};
          const hasUrl=(d)=>Boolean(String(d?.audioUrl||d?.streamAudioUrl||'').trim()||(Array.isArray(d?.sunoData)&&d.sunoData.some(x=>String(x?.audioUrl||x?.streamAudioUrl||x?.sourceAudioUrl||x?.sourceStreamAudioUrl||'').trim())));
          (async()=>{
            const master=await db.collection('users').where('staffRole','==','master').limit(1).get();
            if(master.empty) throw new Error('master user not found');
            const uid=master.docs[0].id;
            const bundle=await db.collection('user_list_caches').doc(uid).collection('bundles').doc('library_latest_10_sets').get();
            if(!bundle.exists) throw new Error('library bundle missing');
            const data=bundle.data()||{};
            const items=Array.isArray(data.items)?data.items:[];
            console.log('BUNDLE_SCHEMA='+String(data.schemaVersion||''));
            console.log('BUNDLE_ITEM_COUNT='+items.length);
            console.log('BUNDLE_UPDATED_MIN_AGO='+(data.updatedAtMs?Math.round((Date.now()-Number(data.updatedAtMs))/60000):null));
            let i=0;
            for(const item of items){
              i++;
              const created=Number(item?.createdAtMs||0)||toMs(item?.createdAt);
              const taskId=String(item?.taskId||item?.requestPayload?.taskId||'').trim();
              const id=String(item?.id||item?.trackId||'').trim();
              console.log(`ITEM_${i}_HAS_ID=${Boolean(id)}`);
              console.log(`ITEM_${i}_HAS_TASK_ID=${Boolean(taskId)}`);
              console.log(`ITEM_${i}_TASK_ID_SOURCE=${item?.taskId?'top':item?.requestPayload?.taskId?'requestPayload':'none'}`);
              console.log(`ITEM_${i}_AGE_DAYS=${created?Math.floor((Date.now()-created)/86400000):null}`);
              console.log(`ITEM_${i}_STATUS=${String(item?.status||'')}`);
              console.log(`ITEM_${i}_HAS_AUDIO_URL=${hasUrl(item)}`);
              console.log(`ITEM_${i}_SUNO_DATA_COUNT=${Array.isArray(item?.sunoData)?item.sunoData.length:0}`);
            }
            console.log('READ_MAX=2');
            console.log('WRITES=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
