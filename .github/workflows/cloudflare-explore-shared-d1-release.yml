name: SORIDRAW Shared D1 Release

on:
  push:
    branches:
      - preview
    paths:
      - '.deploy/shared-d1-release.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-shared-d1-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      TEST_BASE: https://soridraw-explore-test.andrawing1212.workers.dev
      PRODUCTION_BASE: https://soridraw-explore-api.andrawing1212.workers.dev

    steps:
      - name: Checkout release trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact shared D1 release
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          trigger='.deploy/shared-d1-release.trigger'
          test -f "$trigger"
          target="$(sed -n 's/^product_code_target=//p' "$trigger" | tail -1 | tr -d '\r')"
          migration="$(sed -n 's/^migration=//p' "$trigger" | tail -1 | tr -d '\r')"
          blob="$(sed -n 's/^migration_blob=//p' "$trigger" | tail -1 | tr -d '\r')"
          verifier="$(sed -n 's/^verifier=//p' "$trigger" | tail -1 | tr -d '\r')"
          verifier_blob="$(sed -n 's/^verifier_blob=//p' "$trigger" | tail -1 | tr -d '\r')"
          mode="$(sed -n 's/^mode=//p' "$trigger" | tail -1 | tr -d '\r')"
          rollback="$(sed -n 's/^rollback=//p' "$trigger" | tail -1 | tr -d '\r')"
          rollback_blob="$(sed -n 's/^rollback_blob=//p' "$trigger" | tail -1 | tr -d '\r')"
          cutover_ms="$(sed -n 's/^cutover_ms=//p' "$trigger" | tail -1 | tr -d '\r')"
          approval="$(sed -n 's/^approval=//p' "$trigger" | tail -1 | tr -d '\r')"
          [ -n "$mode" ] || mode='additive'

          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$migration" =~ ^20[0-9]{6}_[0-9]{2}_[a-z0-9][a-z0-9_-]*\.sql$ ]]
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$verifier" ]; then
            [[ "$verifier" =~ ^scripts/[A-Za-z0-9_./-]+\.mjs$ ]]
            ! printf '%s' "$verifier" | grep -Fq '..'
            [[ "$verifier_blob" =~ ^[0-9a-f]{40}$ ]]
          else
            test -z "$verifier_blob"
          fi

          case "$mode" in
            additive)
              test -z "$rollback"
              test -z "$rollback_blob"
              test -z "$cutover_ms"
              ;;
            receipt390)
              test "$migration" = '20261008_01_like_intake_receipt_390_additive.sql'
              test "$verifier" = 'scripts/verify-393-receipt390-activation.mjs'
              test "$approval" = 'user_explicit_receipt390_schema_apply'
              test -z "$rollback"
              test -z "$rollback_blob"
              test -z "$cutover_ms"
              ;;
            publication_w2_cutover_373)
              test "$migration" = '20261007_01_first_publication_w2_cutover.sql'
              test "$rollback" = '20261007_01_first_publication_w2_cutover_rollback.sql'
              test "$verifier" = 'scripts/verify-373-first-publication-w2-cutover-release.mjs'
              test "$cutover_ms" = '1791309600000'
              test "$approval" = 'user_explicit_shared_d1_cutover_approved_2026-10-07T01:13:29+09:00'
              [[ "$rollback_blob" =~ ^[0-9a-f]{40}$ ]]
              ;;
            *)
              echo "Unsupported shared D1 release mode: $mode" >&2
              exit 1
              ;;
          esac

          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "$target" origin/preview
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
          echo "migration_blob=$blob" >> "$GITHUB_OUTPUT"
          echo "verifier=$verifier" >> "$GITHUB_OUTPUT"
          echo "verifier_blob=$verifier_blob" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"
          echo "rollback_blob=$rollback_blob" >> "$GITHUB_OUTPUT"
          echo "cutover_ms=$cutover_ms" >> "$GITHUB_OUTPUT"
          echo "approval=$approval" >> "$GITHUB_OUTPUT"
          git rev-parse origin/main > "$RUNNER_TEMP/main-before.sha"
          git rev-parse origin/production > "$RUNNER_TEMP/production-before.sha"
          echo "LOCKED_D1_RELEASE_TARGET=$target"
          echo "LOCKED_D1_MIGRATION=$migration"

      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Install receipt390 verifier tooling
        if: steps.resolve.outputs.mode == 'receipt390'
        run: npm ci --no-audit --no-fund

      - name: Verify exact migration source and additive-only contract
        if: steps.resolve.outputs.mode == 'additive'
        shell: bash
        env:
          MIGRATION_NAME: ${{ steps.resolve.outputs.migration }}
          MIGRATION_BLOB: ${{ steps.resolve.outputs.migration_blob }}
          VERIFIER_PATH: ${{ steps.resolve.outputs.verifier }}
          VERIFIER_BLOB: ${{ steps.resolve.outputs.verifier_blob }}
        run: |
          set -euo pipefail
          migration_path="cloudflare/explore-worker/migrations/$MIGRATION_NAME"
          test -f "$migration_path"
          test "$(git hash-object "$migration_path")" = "$MIGRATION_BLOB"

          if [ -n "$VERIFIER_PATH" ]; then
            test -f "$VERIFIER_PATH"
            test "$(git hash-object "$VERIFIER_PATH")" = "$VERIFIER_BLOB"
            node "$VERIFIER_PATH"
          fi

          MIGRATION_PATH="$migration_path" node <<'NODE'
          const fs = require('fs');
          const path = process.env.MIGRATION_PATH;
          const sql = fs.readFileSync(path, 'utf8');
          const cleaned = sql
            .replace(/\/\*[\s\S]*?\*\//g, ' ')
            .replace(/--.*$/gm, ' ')
            .trim();
          const statements = cleaned.split(';').map((s) => s.trim()).filter(Boolean);
          if (!statements.length) throw new Error('Migration has no SQL statements');

          const forbiddenWords = /\b(?:DROP|ALTER|INSERT|UPDATE|DELETE|REPLACE|PRAGMA|ATTACH|DETACH|VACUUM|REINDEX|TRIGGER|VIEW)\b/i;
          if (forbiddenWords.test(cleaned)) throw new Error('Only additive CREATE TABLE/INDEX DDL is allowed');

          const reserved = new Set([
            'tracks','track_stats','likes','public_profiles','profile_stats',
            'explore_derived_state','explore_derived_changes','explore_derived_tracks','explore_derived_profiles'
          ]);
          const tables = new Map();
          const indexes = new Map();
          for (const statement of statements) {
            let match = statement.match(/^CREATE\s+TABLE\s+IF\s+NOT\s+EXISTS\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(/i);
            if (match) {
              const name = match[1];
              if (!/^explore_[a-z0-9_]+$/i.test(name)) throw new Error(`New D1 table outside explore namespace: ${name}`);
              if (reserved.has(name.toLowerCase())) throw new Error(`Canonical/derived table may not be redefined: ${name}`);
              if (tables.has(name) || indexes.has(name)) throw new Error(`Duplicate migration object: ${name}`);
              tables.set(name, statement);
              continue;
            }
            match = statement.match(/^CREATE\s+INDEX\s+IF\s+NOT\s+EXISTS\s+([A-Za-z_][A-Za-z0-9_]*)\s+ON\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(/i);
            if (match) {
              const [, name, table] = match;
              if (!/^idx_explore_[a-z0-9_]+$/i.test(name)) throw new Error(`New D1 index outside explore namespace: ${name}`);
              if (indexes.has(name) || tables.has(name)) throw new Error(`Duplicate migration object: ${name}`);
              indexes.set(name, { statement, table });
              continue;
            }
            throw new Error(`Unsupported migration statement: ${statement.slice(0, 120)}`);
          }
          if (!tables.size) throw new Error('Migration must create at least one new table');
          for (const [name, info] of indexes) {
            if (!tables.has(info.table)) {
              console.error(`INDEX_TARGET_MUST_BE_NEW_TABLE index=${name} table=${info.table}`);
              throw new Error(`Index may only target a table created by the same migration: ${name}`);
            }
          }
          const objects = [
            ...[...tables].map(([name, statement]) => ({ type: 'table', name, statement })),
            ...[...indexes].map(([name, info]) => ({ type: 'index', name, table: info.table, statement: info.statement })),
          ];
          fs.mkdirSync('.shared-d1-release', { recursive: true });
          fs.writeFileSync('.shared-d1-release/objects.json', JSON.stringify(objects, null, 2));
          console.log(`ADDITIVE_DDL_STATIC_SAFETY=PASS objects=${objects.map((o) => `${o.type}:${o.name}`).join(',')}`);
          NODE

      - name: Verify exact app373 approved cutover sources
        if: steps.resolve.outputs.mode == 'publication_w2_cutover_373'
        shell: bash
        env:
          MIGRATION_NAME: ${{ steps.resolve.outputs.migration }}
          MIGRATION_BLOB: ${{ steps.resolve.outputs.migration_blob }}
          ROLLBACK_NAME: ${{ steps.resolve.outputs.rollback }}
          ROLLBACK_BLOB: ${{ steps.resolve.outputs.rollback_blob }}
          VERIFIER_PATH: ${{ steps.resolve.outputs.verifier }}
          VERIFIER_BLOB: ${{ steps.resolve.outputs.verifier_blob }}
          CUTOVER_MS: ${{ steps.resolve.outputs.cutover_ms }}
        run: |
          set -euo pipefail
          migration_path="cloudflare/explore-worker/migrations/$MIGRATION_NAME"
          rollback_path="cloudflare/explore-worker/migrations/$ROLLBACK_NAME"
          test -f "$migration_path"
          test -f "$rollback_path"
          test "$(git hash-object "$migration_path")" = "$MIGRATION_BLOB"
          test "$(git hash-object "$rollback_path")" = "$ROLLBACK_BLOB"
          test -f "$VERIFIER_PATH"
          test "$(git hash-object "$VERIFIER_PATH")" = "$VERIFIER_BLOB"
          node "$VERIFIER_PATH"
          grep -Fq "LOCKED_CUTOVER_MS=$CUTOVER_MS" "$migration_path"
          ! grep -Fq '__SORIDRAW_PUBLICATION_W2_CUTOVER_MS__' "$migration_path"
          echo 'APP373_EXACT_SOURCE_HASHES=PASS'


      - name: Verify exact receipt390 migration source
        if: steps.resolve.outputs.mode == 'receipt390'
        shell: bash
        env:
          MIGRATION_NAME: ${{ steps.resolve.outputs.migration }}
          MIGRATION_BLOB: ${{ steps.resolve.outputs.migration_blob }}
          VERIFIER_BLOB: ${{ steps.resolve.outputs.verifier_blob }}
        run: |
          set -euo pipefail
          migration_path="cloudflare/explore-worker/migrations/$MIGRATION_NAME"
          test "$(git hash-object "$migration_path")" = "$MIGRATION_BLOB"
          test "$(git hash-object scripts/verify-393-receipt390-activation.mjs)" = "$VERIFIER_BLOB"
          node cloudflare/explore-worker/scripts/receipt390-release.mjs verify-source "$migration_path"
          node scripts/verify-393-receipt390-activation.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {receiptObjects390} from './cloudflare/explore-worker/scripts/receipt390-release.mjs';
          fs.mkdirSync('.shared-d1-release',{recursive:true});
          fs.writeFileSync('.shared-d1-release/objects.json',JSON.stringify(receiptObjects390));
          NODE

      - name: Prepare shared D1 config and base read-only preflight
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .shared-d1-release
          cat > .shared-d1-release/wrangler.jsonc <<JSON
          {
            "name": "soridraw-shared-d1-maintenance",
            "main": "./placeholder.js",
            "compatibility_date": "2026-09-11",
            "d1_databases": [
              {"binding":"DB","database_name":"soridraw-explore-db","database_id":"${SHARED_D1_ID}"}
            ]
          }
          JSON
          node --input-type=module -e "import('./scripts/derived-deploy-preflight.mjs').then(m=>m.assertDerivedBaseD1Ready('.shared-d1-release/wrangler.jsonc'))"
          echo 'SHARED_D1_BASE_READONLY_PREFLIGHT=PASS'

      - name: Capture Worker consumers and live schema baseline
        if: steps.resolve.outputs.mode == 'additive' || steps.resolve.outputs.mode == 'receipt390'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:`Bearer ${token}`,Accept:'application/json'};
          async function get(url){const r=await fetch(url,{headers});const t=await r.text();let x;try{x=JSON.parse(t)}catch{throw new Error(`Cloudflare ${r.status}: ${t.slice(0,500)}`)}if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${t.slice(0,800)}`);return x.result??x;}
          async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(p.deployments||p||[])[0];const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];if(!v?.version_id||Number(v.percentage||0)<99.99)throw new Error(`No single active version for ${name}`);return String(v.version_id);}
          (async()=>{
            fs.mkdirSync('cloudflare/explore-worker/.shared-d1-release',{recursive:true});
            for(const [key,name] of [['preview',process.env.PREVIEW_WORKER],['test',process.env.TEST_WORKER],['production',process.env.PRODUCTION_WORKER]]){
              const version=await active(name);
              fs.writeFileSync(`cloudflare/explore-worker/.shared-d1-release/${key}-worker-before.txt`,version);
              console.log(`${key.toUpperCase()}_WORKER_CAPTURE=PASS version=${version}`);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          cp .shared-d1-release/objects.json cloudflare/explore-worker/.shared-d1-release/objects.json
          cd cloudflare/explore-worker
          cfg='.shared-d1-release/wrangler.jsonc'
          node <<'NODE' > .shared-d1-release/schema-query.sql
          const objects=require(process.cwd()+'/.shared-d1-release/objects.json');
          const quote=(s)=>`'${String(s).replaceAll("'","''")}'`;
          console.log(`SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE name IN (${objects.map(o=>quote(o.name)).join(',')}) ORDER BY type,name`);
          NODE
          node node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config "$cfg" --command "$(cat .shared-d1-release/schema-query.sql)" --json > .shared-d1-release/schema-before.json
          node <<'NODE'
          const fs=require('fs');
          const objects=require(process.cwd()+'/.shared-d1-release/objects.json');
          const raw=JSON.parse(fs.readFileSync('.shared-d1-release/schema-before.json','utf8'));
          const rows=raw.flatMap(x=>x?.results||[]);
          const normalize=(s)=>String(s||'').replace(/--.*$/gm,' ').replace(/\bIF\s+NOT\s+EXISTS\b/ig,' ').replace(/\s+/g,'').replace(/;+$/,'').toLowerCase();
          const existing=[];
          for(const object of objects){
            const row=rows.find(r=>String(r.name||'')===object.name);
            if(!row) continue;
            if(String(row.type||'')!==object.type) throw new Error(`Existing object type mismatch: ${object.name}`);
            if(normalize(row.sql)!==normalize(object.statement)) throw new Error(`Existing object SQL differs from approved migration: ${object.name}`);
            existing.push(object.name);
          }
          fs.writeFileSync('.shared-d1-release/existing-before.json',JSON.stringify(existing));
          console.log(`LIVE_SCHEMA_BASELINE=PASS preexisting=${existing.join(',')||'none'}`);
          NODE

      - name: Apply exact additive migration with rollback guard
        if: steps.resolve.outputs.mode == 'additive'
        shell: bash
        env:
          MIGRATION_NAME: ${{ steps.resolve.outputs.migration }}
        run: |
          set -euo pipefail
          root="$PWD"
          worker_dir="$PWD/cloudflare/explore-worker"
          cfg="$worker_dir/.shared-d1-release/wrangler.jsonc"
          migration="$worker_dir/migrations/$MIGRATION_NAME"
          rollback_file="$worker_dir/.shared-d1-release/rollback.sql"
          applied=0
          cd "$worker_dir"

          node <<'NODE'
          const fs=require('fs');
          const objects=require(process.cwd()+'/.shared-d1-release/objects.json');
          const existing=new Set(JSON.parse(fs.readFileSync('.shared-d1-release/existing-before.json','utf8')));
          const added=objects.filter(o=>!existing.has(o.name));
          const indexes=added.filter(o=>o.type==='index').reverse();
          const tables=added.filter(o=>o.type==='table').reverse();
          const ident=(s)=>`"${String(s).replaceAll('"','""')}"`;
          const sql=[...indexes.map(o=>`DROP INDEX IF EXISTS ${ident(o.name)};`),...tables.map(o=>`DROP TABLE IF EXISTS ${ident(o.name)};`)].join('\n');
          fs.writeFileSync('.shared-d1-release/rollback.sql',sql ? sql+'\n' : '');
          console.log(`ROLLBACK_NEW_OBJECTS_ONLY=${added.map(o=>o.name).join(',')||'none'}`);
          NODE

          rollback() {
            if [ -s "$rollback_file" ]; then
              echo 'POST_APPLY_CHECK_FAILED: removing only objects absent before this release'
              node "$worker_dir/node_modules/wrangler/bin/wrangler.js" d1 execute DB --remote --config "$cfg" --file "$rollback_file" --yes || true
            fi
          }
          trap 'status=$?; if [ "$status" -ne 0 ] && [ "$applied" = 1 ]; then rollback; fi; exit "$status"' EXIT

          applied=1
          node node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config "$cfg" --file "$migration" --yes

          node node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config "$cfg" --command "$(cat .shared-d1-release/schema-query.sql)" --json > .shared-d1-release/schema-after.json
          node <<'NODE'
          const fs=require('fs');
          const objects=require(process.cwd()+'/.shared-d1-release/objects.json');
          const raw=JSON.parse(fs.readFileSync('.shared-d1-release/schema-after.json','utf8'));
          const rows=raw.flatMap(x=>x?.results||[]);
          const normalize=(s)=>String(s||'').replace(/--.*$/gm,' ').replace(/\bIF\s+NOT\s+EXISTS\b/ig,' ').replace(/\s+/g,'').replace(/;+$/,'').toLowerCase();
          for(const object of objects){
            const row=rows.find(r=>String(r.name||'')===object.name);
            if(!row) throw new Error(`Postflight object missing: ${object.name}`);
            if(String(row.type||'')!==object.type) throw new Error(`Postflight type mismatch: ${object.name}`);
            if(normalize(row.sql)!==normalize(object.statement)) throw new Error(`Postflight SQL mismatch: ${object.name}`);
          }
          console.log(`SHARED_D1_ADDITIVE_POSTFLIGHT=PASS objects=${objects.map(o=>o.name).join(',')}`);
          NODE

          node --input-type=module -e "import('./scripts/derived-deploy-preflight.mjs').then(m=>m.assertDerivedBaseD1Ready('.shared-d1-release/wrangler.jsonc'))"

          cd "$root"
          for pair in \
            "preview|${PREVIEW_BASE}|https://preview.soridraw.com" \
            "test|${TEST_BASE}|https://test.soridraw.com" \
            "production|${PRODUCTION_BASE}|https://soridraw.com"; do
            name="${pair%%|*}"; rest="${pair#*|}"; base="${rest%%|*}"; origin="${rest#*|}"
            code="$(curl -sS -o "$RUNNER_TEMP/${name}-feed.json" -w '%{http_code}' -H "Origin: ${origin}" "${base}/v1/feed?sort=latest&limit=40")"
            test "$code" = 200
            echo "${name^^}_FEED_POST_D1_CHANGE=PASS"
          done

          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:`Bearer ${token}`,Accept:'application/json'};
          async function get(url){const r=await fetch(url,{headers});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,600));return x.result??x;}
          async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(p.deployments||p||[])[0];const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];return String(v?.version_id||'');}
          (async()=>{
            for(const [key,name] of [['preview',process.env.PREVIEW_WORKER],['test',process.env.TEST_WORKER],['production',process.env.PRODUCTION_WORKER]]){
              const now=await active(name);
              const before=fs.readFileSync(`cloudflare/explore-worker/.shared-d1-release/${key}-worker-before.txt`,'utf8').trim();
              if(now!==before)throw new Error(`${key} Worker changed during D1-only release`);
            }
            console.log('ALL_WORKER_VERSIONS_UNCHANGED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          echo 'MAIN_PRODUCTION_REFS_UNCHANGED=PASS'
          trap - EXIT
          echo 'SHARED_D1_ADDITIVE_RELEASE=PASS'

      - name: Apply exact receipt390 dormant schema with guarded partial-failure cleanup
        if: steps.resolve.outputs.mode == 'receipt390'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {applyReceiptSchema390} from './cloudflare/explore-worker/scripts/receipt390-release.mjs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'};
          const root=`https://api.cloudflare.com/client/v4/accounts/${account}`;
          const consumers=[['preview',process.env.PREVIEW_WORKER],['test',process.env.TEST_WORKER],['production',process.env.PRODUCTION_WORKER]];
          async function active(name) {
            const response=await fetch(`${root}/workers/scripts/${name}/deployments`,{headers});
            const body=await response.json();if(!response.ok||body.success===false)throw Error('Worker version read failed');
            const versions=(body.result.deployments||body.result||[])[0]?.versions||[];
            if(versions.length!==1||Number(versions[0].percentage)<99.99)throw Error('Single active Worker required');
            return versions[0].version_id;
          }
          async function unchanged() {
            for(const [key,name] of consumers) {
              const before=fs.readFileSync(`cloudflare/explore-worker/.shared-d1-release/${key}-worker-before.txt`,'utf8').trim();
              if(await active(name)!==before)throw Error('Worker changed during dormant receipt release');
            }
          }
          async function dormant() {
            await unchanged();
            for(const [,name] of consumers) {
              const response=await fetch(`${root}/workers/scripts/${name}/content`,{headers});
              if(!response.ok)throw Error('Dormant Worker source read failed');
              if((await response.text()).includes('explore_like_intake_receipts_390'))throw Error('Receipt-aware Worker already active; preserve schema');
            }
          }
          async function query(sql) {
            const response=await fetch(`${root}/d1/database/${process.env.SHARED_D1_ID}/query`,{
              method:'POST',headers,body:JSON.stringify({sql,params:[]})});
            const body=await response.json();
            if(!response.ok||body.success===false||!Array.isArray(body.result)||body.result.length!==1||
              body.result.some(row=>row.success!==true||!Array.isArray(row.results)))throw Error('Receipt D1 statement failed');
            return body.result.flatMap(row=>row.results||[]);
          }
          await applyReceiptSchema390(query,dormant);
          await unchanged();
          console.log('RECEIPT390_DORMANT_EXACT_SCHEMA=PASS');
          console.log('ALL_WORKER_VERSIONS_UNCHANGED=PASS');
          NODE
          for pair in \
            "preview|${PREVIEW_BASE}|https://preview.soridraw.com" \
            "test|${TEST_BASE}|https://test.soridraw.com" \
            "production|${PRODUCTION_BASE}|https://soridraw.com"; do
            name="${pair%%|*}"; rest="${pair#*|}"; base="${rest%%|*}"; origin="${rest#*|}"
            code="$(curl -sS -o "$RUNNER_TEMP/${name}-receipt-feed.json" -w '%{http_code}' -H "Origin: ${origin}" "${base}/v1/feed?sort=latest&limit=40")"
            test "$code" = 200
          done
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          echo 'MAIN_PRODUCTION_REFS_UNCHANGED=PASS'
          echo 'SHARED_D1_RECEIPT390_RELEASE=PASS'

      - name: Capture app373 live consumers and pre-cutover schema
        if: steps.resolve.outputs.mode == 'publication_w2_cutover_373'
        shell: bash
        env:
          CUTOVER_MS: ${{ steps.resolve.outputs.cutover_ms }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const shared=process.env.SHARED_D1_ID;
          const headers={Authorization:`Bearer ${token}`,Accept:'application/json'};
          async function get(url){const r=await fetch(url,{headers});const t=await r.text();let x;try{x=JSON.parse(t)}catch{throw new Error('Cloudflare '+r.status+': '+t.slice(0,500))}if(!r.ok||x.success===false)throw new Error('Cloudflare '+r.status+': '+t.slice(0,800));return x.result??x;}
          async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(p.deployments||p||[])[0];const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];if(!v?.version_id||Number(v.percentage||0)<99.99)throw new Error('No single active version for '+name);return String(v.version_id);}
          (async()=>{
            fs.mkdirSync('cloudflare/explore-worker/.shared-d1-release',{recursive:true});
            for(const [key,name] of [['preview',process.env.PREVIEW_WORKER],['test',process.env.TEST_WORKER],['production',process.env.PRODUCTION_WORKER]]){
              const version=await active(name);
              fs.writeFileSync(`cloudflare/explore-worker/.shared-d1-release/${key}-worker-before.txt`,version);
              const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
              const settings=await get(base+'/settings');
              const bindings=Array.isArray(settings.bindings)?settings.bindings:[];
              const db=bindings.find(b=>b.type==='d1'&&b.name==='DB');
              const media=bindings.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA');
              const vars=Object.fromEntries(bindings.filter(b=>b.type==='plain_text').map(b=>[String(b.name),String(b.text||b.value||'')]));
              const dbId=String(db?.id||db?.database_id||db?.uuid||'');
              const mediaName=String(media?.bucket_name||media?.bucket||media?.name||'');
              if(dbId!==shared)throw new Error(key+' Worker not bound to shared D1');
              if(mediaName!=='soridraw-profile-media')throw new Error(key+' Worker not bound to shared profile R2');
              for(const flag of ['SORIDRAW_R2_CATALOG_V1','SORIDRAW_R2_HYBRID_READ_V1','SORIDRAW_PUBLICATION_R2_ONLY_READ_V1']){
                if(String(vars[flag]||'')!=='1')throw new Error(key+' missing live R2 authority '+flag);
              }
              console.log(key.toUpperCase()+'_APP373_LIVE_CONSUMER=PASS version='+version);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          cd cloudflare/explore-worker
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/.shared-d1-release/wrangler.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE name IN (
              'idx_tracks_latest_order','idx_tracks_owner_latest','idx_tracks_owner_source','idx_tracks_primary_genre_latest',
              'explore032_track_insert','explore032_track_update','soridraw_shared_rev_tracks_ai_051','soridraw_shared_rev_tracks_au_051'
            ) ORDER BY type,name;
            SELECT COUNT(*) AS tracks_count FROM tracks;
            SELECT COUNT(*) AS derived_tracks_count FROM explore_derived_tracks;
            SELECT COUNT(*) AS derived_profiles_count FROM explore_derived_profiles;
            SELECT COUNT(*) AS post_cutoff_music_note_rows FROM tracks WHERE source_type='music_note' AND created_at>=${CUTOVER_MS};
            PRAGMA quick_check;
          " --json > "$RUNNER_TEMP/app373-preflight.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/app373-preflight.json','utf8'));
          const sets=raw.flatMap(x=>Array.isArray(x.results)?[x.results]:[]);
          const schema=sets[0]||[];
          const byName=new Map(schema.map(r=>[String(r.name||''),String(r.sql||'').replace(/\s+/g,' ').trim()]));
          const names=[
            'idx_tracks_latest_order','idx_tracks_owner_latest','idx_tracks_owner_source','idx_tracks_primary_genre_latest',
            'explore032_track_insert','explore032_track_update','soridraw_shared_rev_tracks_ai_051','soridraw_shared_rev_tracks_au_051'
          ];
          for(const name of names){
            const ddl=byName.get(name);
            if(!ddl)throw new Error('missing live pre-cutover object '+name);
            if(/source_type\s*<>\s*'music_note'\s+OR\s+created_at\s*</i.test(ddl))throw new Error('cutover already applied '+name);
          }
          const postCutoff=Number(sets[4]?.[0]?.post_cutoff_music_note_rows||0);
          if(postCutoff!==0)throw new Error('post-cutoff Music Note rows already exist before cutover: '+postCutoff);
          const quick=JSON.stringify(sets[5]||[]).toLowerCase();
          if(!quick.includes('ok'))throw new Error('pre-cutover quick_check failed '+quick);
          const counts={
            tracks:Number(sets[1]?.[0]?.tracks_count||0),
            derivedTracks:Number(sets[2]?.[0]?.derived_tracks_count||0),
            derivedProfiles:Number(sets[3]?.[0]?.derived_profiles_count||0)
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/app373-counts-before.json',JSON.stringify(counts));
          console.log('APP373_LIVE_PRECUTOVER_SCHEMA=PASS');
          console.log('APP373_POST_CUTOFF_ROWS_BEFORE=0');
          NODE

      - name: Apply app373 approved shared D1 cutover with rollback
        if: steps.resolve.outputs.mode == 'publication_w2_cutover_373'
        shell: bash
        env:
          MIGRATION_NAME: ${{ steps.resolve.outputs.migration }}
          ROLLBACK_NAME: ${{ steps.resolve.outputs.rollback }}
          CUTOVER_MS: ${{ steps.resolve.outputs.cutover_ms }}
        run: |
          set -euo pipefail
          root="$PWD"
          worker_dir="$PWD/cloudflare/explore-worker"
          WRANGLER="$worker_dir/node_modules/wrangler/bin/wrangler.js"
          CFG="$worker_dir/.shared-d1-release/wrangler.jsonc"
          MIG="$worker_dir/migrations/$MIGRATION_NAME"
          ROLLBACK="$worker_dir/migrations/$ROLLBACK_NAME"
          probe_id="__soridraw_app373_cost_probe__"
          applied=0
          cleanup_probe() {
            node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "DELETE FROM tracks WHERE id='$probe_id' AND owner_uid='__soridraw_app373_probe__';" --json >/dev/null 2>&1 || true
          }
          rollback_on_error() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$applied" = 1 ]; then
              cleanup_probe
              echo 'APP373_POSTCHECK_FAILED_ROLLBACK=START'
              node "$WRANGLER" d1 execute DB --remote --config "$CFG" --file "$ROLLBACK" --yes || true
              echo 'APP373_POSTCHECK_FAILED_ROLLBACK=ATTEMPTED'
            fi
            exit "$status"
          }
          trap rollback_on_error EXIT

          applied=1
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --file "$MIG" --yes

          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE name IN (
              'idx_tracks_latest_order','idx_tracks_owner_latest','idx_tracks_owner_source','idx_tracks_primary_genre_latest',
              'explore032_track_insert','explore032_track_update','soridraw_shared_rev_tracks_ai_051','soridraw_shared_rev_tracks_au_051'
            ) ORDER BY type,name;
            SELECT COUNT(*) AS tracks_count FROM tracks;
            SELECT COUNT(*) AS derived_tracks_count FROM explore_derived_tracks;
            SELECT COUNT(*) AS derived_profiles_count FROM explore_derived_profiles;
            PRAGMA quick_check;
          " --json > "$RUNNER_TEMP/app373-postflight.json"
          CUTOVER_MS="$CUTOVER_MS" node <<'NODE'
          const fs=require('fs');
          const cutoff=String(process.env.CUTOVER_MS);
          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/app373-counts-before.json','utf8'));
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/app373-postflight.json','utf8'));
          const sets=raw.flatMap(x=>Array.isArray(x.results)?[x.results]:[]);
          const schema=sets[0]||[];
          const byName=new Map(schema.map(r=>[String(r.name||''),String(r.sql||'').replace(/\s+/g,' ').trim()]));
          const names=[
            'idx_tracks_latest_order','idx_tracks_owner_latest','idx_tracks_owner_source','idx_tracks_primary_genre_latest',
            'explore032_track_insert','explore032_track_update','soridraw_shared_rev_tracks_ai_051','soridraw_shared_rev_tracks_au_051'
          ];
          for(const name of names){
            const ddl=byName.get(name);
            if(!ddl)throw new Error('post-cutover object missing '+name);
            if(!ddl.includes(cutoff))throw new Error('cutoff missing from '+name);
            if(!/source_type\s*<>\s*'music_note'\s+OR\s+(?:NEW\.)?created_at\s*</i.test(ddl))throw new Error('Music Note cutoff predicate missing '+name);
          }
          const after={
            tracks:Number(sets[1]?.[0]?.tracks_count||0),
            derivedTracks:Number(sets[2]?.[0]?.derived_tracks_count||0),
            derivedProfiles:Number(sets[3]?.[0]?.derived_profiles_count||0)
          };
          if(JSON.stringify(after)!==JSON.stringify(before))throw new Error('user/derived row counts changed '+JSON.stringify({before,after}));
          const quick=JSON.stringify(sets[4]||[]).toLowerCase();
          if(!quick.includes('ok'))throw new Error('post-cutover quick_check failed '+quick);
          console.log('APP373_SCHEMA_POSTFLIGHT=PASS');
          console.log('APP373_USER_ROWS_UNCHANGED=PASS');
          NODE

          probe_ms="$((CUTOVER_MS + 1))"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            INSERT INTO tracks(
              id,owner_uid,source_type,source_id,source_subtrack_key,title,cover_url,duration_seconds,
              suno_url_primary,search_text,is_public,status,published_at,created_at,updated_at,primary_genre
            ) VALUES(
              '$probe_id','__soridraw_app373_probe__','music_note','__soridraw_app373_probe__','','__app373_probe__','',1,
              'https://example.invalid/app373.mp3','__app373_probe__',1,'published',$probe_ms,$probe_ms,$probe_ms,'__probe__'
            );
          " --json > "$RUNNER_TEMP/app373-probe-insert.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/app373-probe-insert.json','utf8'));
          const entry=raw.find(x=>x?.success===true)||raw[0]||{};
          const w=Number(entry?.meta?.rows_written);
          const r=Number(entry?.meta?.rows_read||0);
          if(w>2||w<1)throw new Error('live first-publication cost expected W1~W2, got W'+w+' R'+r);
          console.log('APP373_LIVE_FIRST_PUBLIC_REMOTE_D1_W'+w+'=PASS rows_read='+r);
          console.log('APP373_LIVE_FIRST_PUBLIC_REMOTE_D1_W2=PASS');
          NODE
          cleanup_probe
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT COUNT(*) AS n FROM tracks WHERE id='$probe_id';" --json > "$RUNNER_TEMP/app373-probe-clean.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/app373-probe-clean.json','utf8')).flatMap(x=>x?.results||[]);
          if(Number(raw[0]?.n||0)!==0)throw new Error('app373 synthetic probe cleanup failed');
          console.log('APP373_SYNTHETIC_PROBE_CLEANUP=PASS');
          NODE

          for pair in \
            "preview|${PREVIEW_BASE}|https://preview.soridraw.com" \
            "test|${TEST_BASE}|https://test.soridraw.com" \
            "production|${PRODUCTION_BASE}|https://soridraw.com"; do
            name="${pair%%|*}"; rest="${pair#*|}"; base="${rest%%|*}"; origin="${rest#*|}"
            for sort in latest popular; do
              code="$(curl -sS -o "$RUNNER_TEMP/${name}-${sort}-373.json" -w '%{http_code}' -H "Origin: ${origin}" "${base}/v1/feed?sort=${sort}&limit=40")"
              test "$code" = 200
            done
            echo "${name^^}_APP373_FEED_POST_CUTOVER=PASS"
          done

          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:`Bearer ${token}`,Accept:'application/json'};
          async function get(url){const r=await fetch(url,{headers});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,600));return x.result??x;}
          async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(p.deployments||p||[])[0];const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];return String(v?.version_id||'');}
          (async()=>{
            for(const [key,name] of [['preview',process.env.PREVIEW_WORKER],['test',process.env.TEST_WORKER],['production',process.env.PRODUCTION_WORKER]]){
              const now=await active(name);
              const before=fs.readFileSync(`cloudflare/explore-worker/.shared-d1-release/${key}-worker-before.txt`,'utf8').trim();
              if(now!==before)throw new Error(key+' Worker changed during D1-only cutover');
            }
            console.log('APP373_ALL_WORKERS_UNCHANGED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          echo 'APP373_MAIN_PRODUCTION_REFS_UNCHANGED=PASS'
          applied=0
          trap - EXIT
          echo 'APP373_SHARED_D1_CUTOVER=PASS'
