name: SORIDRAW Deploy Section Tags Fix to PREVIEW 2026-09-04

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-fix-section-tags-bundle-20260904.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-section-tags-bundle-20260904
  cancel-in-progress: false

jobs:
  deploy-preview-hosting:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 8

      - name: Verify source continuity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='69640a5464ea94d20dc3f2fe03b5caf1703b429d'
          git cat-file -e "${SOURCE}^{commit}"
          git diff --quiet "$SOURCE" HEAD -- src functions firestore.rules package.json package-lock.json firebase.json firebase.hosting-preview.json
          grep -q "app_settings', 'section_tags_bundle" src/App.tsx
          grep -q 'export const syncSectionTagsBundle = functions' functions/src/index.ts
          grep -q "'section_tags_bundle'" firestore.rules
          grep -q '"site": "soridraw-preview"' firebase.hosting-preview.json
          echo '[Section tags bundle] source continuity PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and verify app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          test -f dist/index.html
          echo '[Section tags bundle] TypeScript + build PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Verify deployed backend Function
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest functions:list \
            --project soridraw-app-866a5 \
            --json > "$RUNNER_TEMP/functions.json"
          grep -q 'syncSectionTagsBundle' "$RUNNER_TEMP/functions.json"
          echo '[Section tags bundle] backend Function PASS'

      - name: Snapshot production before PREVIEW deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://soridraw.web.app/' -o "$RUNNER_TEMP/production-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"
          echo '[Section tags bundle] production snapshot PASS'

      - name: Deploy Firebase PREVIEW Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project soridraw \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo '[Section tags bundle] PREVIEW Hosting deploy PASS'

      - name: Smoke PREVIEW
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://preview.soridraw.com/' 'https://soridraw-preview.web.app/' 'https://soridraw-preview.firebaseapp.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 "$url" -o "$RUNNER_TEMP/preview.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview.html"; then
                ok='yes'
                echo "[Section tags bundle] Smoke PASS: $url"
                break
              fi
              sleep 5
            done
            test "$ok" = 'yes' || { echo "Preview smoke failed: $url"; exit 7; }
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://soridraw.web.app/' -o "$RUNNER_TEMP/production-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          cmp "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '[Section tags bundle] production Hosting unchanged PASS'

      - name: Result
        run: |
          echo 'Section tags aggregate bundle Firebase PREVIEW deployment COMPLETE.'
          echo 'Backend Function deployed, Firestore Rules deployed, 76-item aggregate seeded.'
          echo 'Expected cold browser path: app_settings:getDoc 1 instead of section_tags:getDocs 76.'
          echo 'No main, TEST, PRODUCTION, Cloudflare, migration, or canonical section_tags changes.'
