name: SORIDRAW QA Engine — Fast Preview
on:
  push:
    branches: [preview]
    paths:
      - 'scripts/soridraw-qa-engine.mjs'
      - '.github/workflows/qa-engine-preview.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'fast (offline) or full (includes TypeScript/Build; still no deployment)'
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
permissions:
  contents: read
concurrency:
  group: soridraw-qa-engine-fast-preview
  cancel-in-progress: true
jobs:
  fast-no-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Node 22 for isolated SQLite and syntax
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app only for explicitly selected full check
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
        run: npm ci --no-audit --no-fund
      - name: Run SORIDRAW QA engine
        env:
          QA_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'fast' }}
        run: node scripts/soridraw-qa-engine.mjs "$QA_PROFILE"
      - name: Confirm no deployment or shared-data changes
        run: echo 'FAST_QA_ONLY;RELEASE_UNVERIFIED;NO_DEPLOYMENT;NO_SHARED_MUTATION'
