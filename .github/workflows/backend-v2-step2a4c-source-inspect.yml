name: SORIDRAW Backend V2 Step 2-A4c Source Inspect

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4c-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
      - name: Print exact patch anchors
        shell: bash
        run: |
          set -euo pipefail
          echo '=== APP 500-545 firestore imports ==='
          sed -n '500,545p' src/App.tsx
          echo '=== APP 8820-9060 favorite save ==='
          sed -n '8820,9060p' src/App.tsx
          echo '=== APP 10680-10745 recent batch ==='
          sed -n '10680,10745p' src/App.tsx
          echo '=== APP 12320-12900 recent mutations ==='
          sed -n '12320,12900p' src/App.tsx
          echo '=== saveRecentSongsBatch references ==='
          grep -n -C 8 'saveRecentSongsBatch' src/App.tsx || true
          echo '=== favoritePayload references ==='
          grep -n -C 12 'favoritePayload' src/App.tsx || true
          echo '=== Song creation identity candidates ==='
          grep -n -C 8 -E 'const .*Song.*=|const song =|newSongs|generatedSongs|generationBatchId' src/App.tsx | head -900 || true
          echo '=== firebase module imports ==='
          grep -n -E "from './firebase|from \"./firebase|from './firebase.js|from \"./firebase.js" src/App.tsx || true
          echo '=== firebase module head ==='
          sed -n '1,180p' src/firebase.js 2>/dev/null || sed -n '1,180p' src/firebase.ts 2>/dev/null || true
