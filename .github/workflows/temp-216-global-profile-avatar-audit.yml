name: TEMP 216 Global Profile Avatar Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-216-global-profile-avatar-audit.yml'
      - 'scripts/verify-216-global-profile-avatar-authority.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Global avatar authority verifier
        run: node scripts/verify-216-global-profile-avatar-authority.mjs
      - name: Explore owner card verifier
        run: node scripts/verify-215-explore-profile-owner-card-sync.mjs
      - name: Frozen like regressions
        run: |
          node scripts/verify-190-like-card-authority.mjs
          node scripts/verify-192-cross-account-public-like-live.mjs
          node scripts/verify-197-new-public-track-like.mjs
      - name: Version and backend scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -e "process.stdout.write(String(require('./public/app-version.json').version || ''))")" = "194"
          git diff --exit-code f2966a6ba8777b5b4b2c4d16bb0251b7dd7016a3 HEAD -- cloudflare/explore-worker functions firestore.rules database.rules.json
          echo 'BACKEND_CODE_CHANGED=false'
          echo 'USER_CONTENT_MIGRATION=false'
          echo 'AUDIT_216=PASS'
