name: SORIDRAW 408 Targeted Like Repair Quality
on:
  push:
    branches: [preview]
    paths:
      - 'cloudflare/explore-worker/canonical/preview-entry.js'
      - 'cloudflare/explore-worker/canonical/preview-worker.js'
      - 'cloudflare/explore-worker/patches/060-shared-profile-r2-parity.mjs'
      - 'cloudflare/explore-worker/patches/062-shared-track-card-r2.mjs'
      - 'scripts/verify-412-shared-projection-cas.mjs'
      - 'src/services/exploreLikeService.ts'
      - 'scripts/verify-413-like-exit-flush.mjs'
      - 'scripts/verify-197-new-public-track-like.mjs'
      - 'public/app-version.json'
      - 'scripts/verify-127-atomic-personal-like.mjs'
      - 'scripts/verify-407-exact-191-replay-recovery.mjs'
      - 'scripts/verify-127-atomic-personal-like.mjs'
      - 'scripts/verify-175-explore-like-catalog-reentry.mjs'
      - '.github/workflows/verify-408-like-repair-code.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soridraw-408-preview-safe-repair
  cancel-in-progress: false
jobs:
  product-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout pinned code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app
        run: npm ci --no-audit --no-fund
      - name: Check exact entry syntax
        run: |
          node --check cloudflare/explore-worker/canonical/preview-entry.js
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node --check cloudflare/explore-worker/patches/060-shared-profile-r2-parity.mjs
          node --check cloudflare/explore-worker/patches/062-shared-track-card-r2.mjs
          node --check scripts/verify-412-shared-projection-cas.mjs
          node scripts/verify-412-shared-projection-cas.mjs
          node --check scripts/verify-413-like-exit-flush.mjs
          node scripts/verify-413-like-exit-flush.mjs
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Strict existing personal-like and catalog contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-127-atomic-personal-like.mjs
          node scripts/verify-175-explore-like-catalog-reentry.mjs
      - name: 191 and remaining frozen like contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-178-final-like-architecture.mjs
          node scripts/verify-191-bounded-public-like-convergence.mjs
          node scripts/verify-192-cross-account-public-like-live.mjs
          node scripts/verify-197-new-public-track-like.mjs
          node scripts/verify-390-like-acceptance-receipt.mjs
      - name: Confirm no product deployment
        run: echo '408_QUALITY=PASS;NO_DEPLOYMENT;NO_SHARED_DATA_CHANGE'
