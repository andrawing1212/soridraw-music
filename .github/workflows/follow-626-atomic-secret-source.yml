name: SORIDRAW APP626 Admin Atomic Inactive Secret Stage Syntax
on:
  push:
    branches: [feat/app600-owner-standalone-isolated]
    paths:
      - 'scripts/app626-stage-pinned-owner-secret-versions.mjs'
      - '.github/workflows/follow-626-atomic-secret-source.yml'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and node syntax validation only, no deployment or auth
        run: |
          set -euo pipefail
          node --check scripts/app626-stage-pinned-owner-secret-versions.mjs
          node scripts/app626-stage-pinned-owner-secret-versions.mjs --self-test
          grep -Fq "'/versions?deploy=false'" scripts/app626-stage-pinned-owner-secret-versions.mjs
          grep -Fq "type:'inherit',version_id:w.candidate" scripts/app626-stage-pinned-owner-secret-versions.mjs
          grep -Fq "type:'secret_text',text:secrets[name]" scripts/app626-stage-pinned-owner-secret-versions.mjs
          echo APP626_CODE_ONLY_SECRET_NOT_STORED=PASS
