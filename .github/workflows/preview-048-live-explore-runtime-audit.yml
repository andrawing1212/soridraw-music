name: SORIDRAW 048 Live Explore Runtime Audit
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/preview-048-live-explore-runtime-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - name: Audit live PREVIEW Explore Worker source shape
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,N=process.env.PREVIEW_WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status);return x.result||x;}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;
            const ds=await g(base+'/deployments');
            const d=(ds.deployments||ds||[])[0];
            const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            const v=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${active.version_id}?include=modules`);
            const mods=v.modules||[]; const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];
            const s=Buffer.from(m.content_base64,'base64').toString('utf8');
            const checks=[
              'SORIDRAW_EXPLORE_PRODUCTION_FEED_MIRROR_020_20260908',
              'EXPLORE_MIRROR_ROUTE_020',
              'EXPLORE_MIRROR_TARGETS_020',
              'fanoutExploreMirror020',
              'handleExploreMirrorRoute020',
              'handleExploreMirrorSyncRoute020',
              'X-SORIDRAW-Explore-Mirror',
              'fanoutExploreMirror020(env, source.id, false)',
              'SORIDRAW_EXPLORE_MIRROR_STRICT_SYNC_022_20260908',
              'targetCount: settled.length',
              'failures.length',
              'SORIDRAW_EXPLORE_MIRROR_SERVICE_BINDINGS_023_20260908',
              'EXPLORE_MIRROR_PREVIEW',
              'EXPLORE_MIRROR_TEST',
              'service.fetch(request)',
              'SORIDRAW_EXPLORE_PUBLIC_PROFILE_R2_MIRROR_PARITY_029_20260909'
            ];
            console.log('ACTIVE_VERSION='+active.version_id);
            console.log('SOURCE_SHA256='+crypto.createHash('sha256').update(s).digest('hex'));
            for(const q of checks){const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const n=(s.match(new RegExp(escaped,'g'))||[]).length;console.log(q+'='+n);}
            const settings=await g(base+'/settings');
            const bindings=Array.isArray(settings.bindings)?settings.bindings:[];
            console.log('BINDINGS='+bindings.map(b=>`${b.name}:${b.type}`).sort().join(','));
            console.log('COMPATIBILITY_DATE='+String(settings.compatibility_date||''));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
