name: SORIDRAW 534 Isolated Auth Firestore RTDB Lifecycle
# Single scoped run; source-only experiment on demo project. NO deployment.
on:
  pull_request:
    branches: [preview]
    types: [opened, reopened, synchronize]
    paths:
      - 'functions/src/ownerFollowLifecycle534.ts'
      - 'functions/src/index.ts'
      - 'scripts/test-534-owner-lifecycle-emulator.mjs'
      - 'scripts/emulator/app534.firebase.json'
      - 'scripts/emulator/app534.firestore.rules'
      - '.github/workflows/verify-534-isolated-lifecycle.yml'
permissions: {contents: read}
concurrency:
  group: soridraw-534-isolated-auth-lifecycle
  cancel-in-progress: false
jobs:
  emulator:
    if: github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == 'andrawing1212/soridraw-music' && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      APP534_ISOLATED_ONLY: 'yes'
      GCLOUD_PROJECT: demo-soridraw-owner-534
      FIREBASE_PROJECT_ID: demo-soridraw-owner-534
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm test-only repo/project guard
        run: |
          set -euo pipefail
          test "${GCLOUD_PROJECT}" = "demo-soridraw-owner-534"
          node --check scripts/test-534-owner-lifecycle-emulator.mjs
          node -e "const c=JSON.parse(require('fs').readFileSync('scripts/emulator/app534.firebase.json'));if(c.firestore.rules!=='app534.firestore.rules'||c.database.rules!=='app533.database.rules.json')process.exit(3)"
      - name: Install only compile and test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
      - name: Compile check for existing index and new lifecycle hook
        run: ./functions/node_modules/.bin/tsc --noEmit --project functions/tsconfig.json
      - name: Auth / Firestore / RTDB real emulators with strict demo ID
        run: |
          set -euo pipefail
          env -u GOOGLE_APPLICATION_CREDENTIALS -u FIREBASE_TOKEN npx --yes firebase-tools@14.23.0 emulators:exec \
            --project demo-soridraw-owner-534 \
            --config scripts/emulator/app534.firebase.json \
            --only auth,database,firestore \
            'env -u GOOGLE_APPLICATION_CREDENTIALS -u FIREBASE_TOKEN node --import tsx scripts/test-534-owner-lifecycle-emulator.mjs'
      - name: Confirm scope
        if: always()
        run: echo 'APP534_EMULATOR_ONLY_NO_SHARED_DB_WORKER_FUNCTIONS_RULES_HOSTING_OR_DEPLOY'
