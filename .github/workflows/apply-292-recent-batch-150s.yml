name: apply app292 recent edit 150s batch

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/apply-292-recent-batch-150s.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply 150-second Recent batch only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')
          old = 'const RECENT_SONG_TEXT_BATCH_MS = 60_000;'
          new = 'const RECENT_SONG_TEXT_BATCH_MS = 150_000;'
          if old not in app:
              raise SystemExit('expected 60s Recent batch constant missing')
          app = app.replace(old, new, 1)
          app = app.replace(
              '// 60-second trailing batch so title/prompt/lyrics edits collapse.',
              '// 150-second trailing batch so title/prompt/lyrics edits collapse.',
              1,
          )
          app_path.write_text(app, encoding='utf-8')

          verify_path = Path('scripts/verify-290-recent-edit-batch.mjs')
          verify = verify_path.read_text(encoding='utf-8')
          old_assert = "assert.match(app, /const RECENT_SONG_TEXT_BATCH_MS = 60_000;/);"
          new_assert = "assert.match(app, /const RECENT_SONG_TEXT_BATCH_MS = 150_000;/);"
          if old_assert not in verify:
              raise SystemExit('expected 60s verifier assertion missing')
          verify = verify.replace(old_assert, new_assert, 1)
          verify = verify.replace(
              "console.log('APP290_RECENT_EDIT_TRAILING_BATCH_60S=PASS');",
              "console.log('APP292_RECENT_EDIT_TRAILING_BATCH_150S=PASS');",
              1,
          )
          verify_path.write_text(verify, encoding='utf-8')

          version_path = Path('public/app-version.json')
          version = json.loads(version_path.read_text(encoding='utf-8'))
          if int(version.get('version', 0)) != 291:
              raise SystemExit(f"expected app291 before app292, got {version.get('version')}")
          version_path.write_text(json.dumps({'version': 292}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Recent 150s batch verifier
        run: node scripts/verify-290-recent-edit-batch.mjs

      - name: Studio heart batching regression
        run: node scripts/verify-290-studio-heart-batch.mjs

      - name: app291 lyrics live preview regression
        run: node scripts/verify-291-recent-lyrics-live-preview.mjs

      - name: app289 Music Note heart regression
        run: node scripts/verify-289-music-note-compact-heart-sync.mjs

      - name: Music Note detail batch regression
        run: node scripts/verify-031-music-note-detail-batched-draft.mjs

      - name: Build
        run: npm run build

      - name: Verify multi-song Recent batch shape
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const src = fs.readFileSync('src/App.tsx', 'utf8');
          const start = src.indexOf('const queueRecentSongTextWrite = useCallback');
          const end = src.indexOf('  useEffect(() => {', start);
          if (start < 0 || end < 0) throw new Error('queueRecentSongTextWrite block missing');
          const block = src.slice(start, end);
          if (!block.includes('recentSongTextWritePendingRef.current = {')) throw new Error('single UID pending aggregate missing');
          if (!block.includes('songs: nextSongs')) throw new Error('aggregate Recent songs snapshot missing');
          if (!block.includes('window.clearTimeout(recentSongTextWriteTimerRef.current)')) throw new Error('trailing timer reset missing');
          if (!block.includes('RECENT_SONG_TEXT_BATCH_MS')) throw new Error('150s timer usage missing');
          console.log('APP292_RECENT_MULTI_SONG_AGGREGATE_BATCH=PASS');
          NODE

      - name: Commit verified app292 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-292-recent-batch-150s.yml
          git add src/App.tsx scripts/verify-290-recent-edit-batch.mjs public/app-version.json
          git commit -m "perf(preview): set Recent edit batch to 150 seconds"
          git push origin HEAD:preview
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Trigger PREVIEW app292 release
        shell: bash
        run: |
          set -euo pipefail
          cat > .deploy/preview-app-release.trigger <<EOF
          app292-recent-edit-150s-release
          target_source=$SOURCE_SHA
          app_version=292
          scope=hosting-only
          deploy_shared_rtdb_rules=false
          no_user_data_migration=true
          EOF
          git add .deploy/preview-app-release.trigger
          git commit -m "release(preview): deploy app292 Recent 150s batch"
          git push origin HEAD:preview
          echo "RELEASE_SHA=$(git rev-parse HEAD)"
