name: Diagnose Preview Pagination Runtime

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/diagnose-preview-pagination-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate exact final source
        run: |
          set -euo pipefail
          npm run prebuild
          python3 .deploy/apply-984-music-note-server-first-more.py
          python3 .deploy/apply-985-music-note-normalized-page-chain.py
          python3 .deploy/apply-986-music-note-active-only-pagination.py
          python3 .deploy/apply-980-library-pagination-metadata-recovery.py
          grep -Fq 'SORIDRAW_985_MUSIC_NOTE_NORMALIZED_PAGE_CHAIN' src/App.tsx
          grep -Fq 'SORIDRAW_986_MUSIC_NOTE_ACTIVE_ONLY_PAGINATION' src/App.tsx
          grep -Fq 'musicNoteListEligible: false' src/pages/FavoritesPage.tsx
          grep -Fq 'musicNoteProfileCount' src/pages/FavoritesPage.tsx
          echo '[986 readonly] exact generated source: PASS'

      - name: Verify 986 bounded query and migration paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx').read_text(encoding='utf-8')
          favorites = Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          start = app.index('  const loadMoreFavorites = useCallback(async () => {')
          end = app.index('  const syncMusicNoteIncrementalFromRemoteVersion = useCallback', start)
          block = app[start:end]

          required_app = [
              "where('musicNoteListEligible', '==', true)",
              "orderBy('createdAtMs', 'desc')",
              "orderBy(documentId(), 'desc')",
              'startAfter(cursorCreatedAtMs, cursorId)',
              'limit(FAVORITES_PAGE_SIZE)',
              'cursorItem?.firestoreId || cursorItem?.id',
              'firestoreId: docSnap.id',
          ]
          for marker in required_app:
              if marker not in block:
                  raise SystemExit(f'missing 986 bounded-query marker: {marker}')
          if 'while (' in block:
              raise SystemExit('986 active path still contains a repeated scan loop')
          if 'FAVORITES_PAGE_SIZE + 1' in block:
              raise SystemExit('986 active path still reads look-ahead documents')

          required_favorites = [
              'musicNoteListEligible: false',
              'musicNoteListEligible: true',
              'musicNoteProfileCount',
              'musicNoteRemainingCount',
              '전체 {musicNoteProfileCount}곡 · 현재 {musicNoteCurrentCount}곡 · 남은 {musicNoteRemainingCount}곡',
          ]
          for marker in required_favorites:
              if marker not in favorites:
                  raise SystemExit(f'missing 986 Favorites marker: {marker}')

          print('[986 readonly] bounded active-only query + trash/restore + zero-read totals: PASS')
          PY

      - name: Typecheck and build generated source
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx vite build
          echo '[986 readonly] typecheck + Vite build: PASS'

      - name: Extract final pagination runtime gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              (Path('src/App.tsx'), [
                  'const hasCachedMusicNote',
                  'setHasMoreFavorites(bundle.hasMore)',
                  'const loadMoreFavoritesLegacy985',
                  'const loadMoreFavorites',
                  "where('musicNoteListEligible', '==', true)",
                  'favoritePaginationExhaustedRef.current',
              ]),
              (Path('src/pages/FavoritesPage.tsx'), [
                  'musicNoteProfileCount',
                  'musicNoteRemainingCount',
                  'canShowCachedMusicNoteMore',
                  'canRequestMoreMusicNotePage',
                  'shouldShowMusicNoteMoreButton',
                  'onLoadMoreFavorites',
              ]),
              (Path('src/pages/SunoLibraryPage.tsx'), [
                  'const startLibraryBundleVerification',
                  'session.hasMore = bundle.hasMore',
                  'workspaceLastTrackDocRef.current',
                  'setHasMoreWorkspaceServerTracks',
                  'hasMoreWorkspaceServerTracks',
              ]),
          ]

          for path, needles in targets:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              print(f'\n===== {path} =====')
              for needle in needles:
                  hits = [i for i,line in enumerate(lines) if needle in line]
                  print(f'\n--- needle={needle!r} hits={len(hits)} ---')
                  for i in hits[:8]:
                      lo=max(0,i-8); hi=min(len(lines),i+15)
                      print(f'### lines {lo+1}-{hi}')
                      for n in range(lo,hi):
                          print(f'{n+1}: {lines[n]}')
          PY

      - name: Confirm read-only
        run: |
          echo 'READ-ONLY diagnostic only.'
          echo 'No Hosting deploy, Functions deploy, Firestore/index/Rules write, user-data migration, main change, or production change.'
