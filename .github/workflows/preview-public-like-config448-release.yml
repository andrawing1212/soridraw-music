name: SORIDRAW PREVIEW Public Like Config 448 Release

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/preview-public-like-config448.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-preview-public-like-config448-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT: soridraw-app-866a5

    steps:
      - name: Resolve exact PREVIEW source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          trigger_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.deploy/preview-public-like-config448.trigger"
          target="$(curl -fsSL "$trigger_url" | sed -n 's/^product_code_target=//p' | tail -1 | tr -d '\r')"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Refuse unsafe scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "${{ steps.source.outputs.sha }}" origin/preview
          trigger="$RUNNER_TEMP/preview-public-like-config448.trigger"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.deploy/preview-public-like-config448.trigger" -o "$trigger"
          grep -Fxq 'target_function=publicLikeWindowConfig448Candidate' "$trigger"
          grep -Fxq 'shared_d1_change=false' "$trigger"
          grep -Fxq 'shared_rtdb_rules_change=false' "$trigger"
          grep -Fxq 'user_data_change=false' "$trigger"
          grep -Fxq 'test_production_change=false' "$trigger"
          git rev-parse origin/main > "$RUNNER_TEMP/main-before"
          git rev-parse origin/production > "$RUNNER_TEMP/prod-before"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and verify exact Function
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          grep -Fq 'publicLikeWindowConfig448Candidate' functions/lib/index.js
          grep -Fq 'readLikeBatchTimingAt416' functions/lib/exploreLikePublicConfig448.js
          node scripts/verify-448-common-public-like-window.mjs

          d=".preview-public-like-config448"
          rm -rf "$d"
          mkdir -p "$d/lib"
          cp functions/lib/exploreLikePublicConfig448.js "$d/lib/"
          cp functions/lib/exploreLikeBatchSettings416.js "$d/lib/"
          cp functions/lib/exploreLikeEnvironment416.js "$d/lib/"
          cat > "$d/package.json" <<'JSON'
          {
            "name":"soridraw-preview-public-like-config448",
            "private":true,
            "main":"lib/index.js",
            "engines":{"node":"22"},
            "dependencies":{
              "firebase-admin":"^12.0.0",
              "firebase-functions":"^4.5.0"
            }
          }
          JSON
          cat > "$d/lib/index.js" <<'NODE'
          "use strict";
          const admin=require("firebase-admin");
          admin.initializeApp({
            databaseURL:"https://soridraw-app-866a5-default-rtdb.firebaseio.com"
          });
          exports.publicLikeWindowConfig448Candidate =
            require("./exploreLikePublicConfig448").publicLikeWindowConfig448Candidate;
          NODE
          cat > preview.public-like-config448.firebase.json <<'JSON'
          {"functions":{"source":".preview-public-like-config448"}}
          JSON
          npm install --prefix "$d" --omit=dev --no-audit --no-fund
          node - <<'NODE'
          const mod=require('./.preview-public-like-config448/lib/index.js');
          if(Object.keys(mod).join(',')!=='publicLikeWindowConfig448Candidate')
            throw Error('448_SINGLE_FUNCTION_EXPORT_DRIFT');
          console.log('448_SINGLE_FUNCTION_EXPORT=PASS');
          NODE

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Deploy PREVIEW config Function only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --project "$FIREBASE_PROJECT"             --config preview.public-like-config448.firebase.json             --only functions:publicLikeWindowConfig448Candidate             --non-interactive
          echo '448_CONFIG_FUNCTION_DEPLOY=PASS'

      - name: Verify Function and protected refs
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe publicLikeWindowConfig448Candidate             --gen2 --region asia-northeast3 --project "$FIREBASE_PROJECT"             --format='value(state)' | grep -Fxq ACTIVE
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/prod-before")"
          echo '448_CONFIG_FUNCTION_ACTIVE=PASS'
          echo 'TEST_PRODUCTION_UNCHANGED=PASS'
