name: Temp Fix 1026 Music Note Order Axis

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-fix-music-note-order-axis-1026.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-fix-music-note-order-axis-1026
  cancel-in-progress: false

jobs:
  fix-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_BASE: 4767946b69dd2ff45d5f864a0ac6dbcfb64a2ccd
      HOSTING_PROJECT: soridraw
      PREVIEW_SITE: soridraw-preview
      PREVIEW_DEFAULT_HOST: soridraw-preview.web.app
      PREVIEW_CUSTOM_HOST: preview.soridraw.com
      PRODUCTION_HOST: soridraw.web.app
      FIRESTORE_PROJECT: soridraw-app-866a5
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30

      - name: Lock expected baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          grep -q 'SORIDRAW_MUSIC_NOTE_PAGINATION_CONTINUITY_1025 = true' src/App.tsx
          echo "BASE_HEAD=$(git rev-parse HEAD)"

      - name: Apply single chronological pagination axis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/App.tsx')
          text = app_path.read_text(encoding='utf-8')
          marker = 'SORIDRAW_MUSIC_NOTE_ORDER_AXIS_REPAIR_1026'

          if marker not in text:
              anchor = 'const SORIDRAW_MUSIC_NOTE_PAGINATION_CONTINUITY_1025 = true;\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'1026 marker anchor mismatch: {text.count(anchor)}')
              text = text.replace(anchor, anchor + 'const SORIDRAW_MUSIC_NOTE_ORDER_AXIS_REPAIR_1026 = true;\n', 1)

          def insert_created_at_ms_order(snippet: str, label: str) -> str:
              if "orderBy('createdAtMs', 'desc')" in snippet:
                  return snippet
              if "orderBy('createdAt', 'desc')" in snippet:
                  return snippet.replace("orderBy('createdAt', 'desc')", "orderBy('createdAtMs', 'desc')")
              pattern = re.compile(r"(?m)^(?P<indent>[ \t]*)where\('uid', '==', currentUser\.uid\),\n")
              match = pattern.search(snippet)
              if not match:
                  raise SystemExit(f'1026 {label}: uid query anchor missing')
              insertion = match.group(0) + match.group('indent') + "orderBy('createdAtMs', 'desc'),\n"
              return snippet[:match.start()] + insertion + snippet[match.end():]

          # 1) One-time bounded cache/bootstrap recovery: deterministic newest 20.
          fallback_start = text.find('const fallbackSnapshot = await getDocs(query(')
          if fallback_start < 0:
              raise SystemExit('1026 fallbackSnapshot start missing')
          fallback_end = text.find('));', fallback_start)
          if fallback_end < 0:
              raise SystemExit('1026 fallbackSnapshot end missing')
          fallback_end += 3
          fallback = text[fallback_start:fallback_end]
          fallback = insert_created_at_ms_order(fallback, 'fallbackSnapshot')
          text = text[:fallback_start] + fallback + text[fallback_end:]

          # 2) Normal first-page listener: same axis as rendering.
          bootstrap_start = text.find('const attachFavoritesSourceBootstrap902 = () => {')
          if bootstrap_start < 0:
              raise SystemExit('1026 bootstrap start missing')
          bootstrap_end = text.find('let musicNoteBundleMissingHandled', bootstrap_start)
          if bootstrap_end < 0:
              raise SystemExit('1026 bootstrap end missing')
          bootstrap = text[bootstrap_start:bootstrap_end]
          if "orderBy('createdAt', 'desc')" in bootstrap:
              bootstrap = bootstrap.replace("orderBy('createdAt', 'desc')", "orderBy('createdAtMs', 'desc')")
          if "orderBy('createdAtMs', 'desc')" not in bootstrap:
              raise SystemExit('1026 bootstrap createdAtMs order missing after patch')
          if "orderBy('createdAt', 'desc')" in bootstrap:
              raise SystemExit('1026 bootstrap mixed createdAt order remains')
          text = text[:bootstrap_start] + bootstrap + text[bootstrap_end:]

          # 3) More paging: both compatibility and ordered paths use createdAtMs.
          load_start = text.find('  const loadMoreFavorites = useCallback(async () => {')
          load_end = text.find('  const syncMusicNoteIncrementalFromRemoteVersion = useCallback', load_start)
          if load_start < 0 or load_end < 0:
              raise SystemExit(f'1026 loadMore anchors missing: {load_start}, {load_end}')
          block = text[load_start:load_end]

          fb_start = block.find('const fallbackQuery = scanCursor')
          fb_end = block.find('const snapshot = await getDocs(fallbackQuery)', fb_start)
          if fb_start < 0 or fb_end < 0:
              raise SystemExit('1026 compatibility fallback block missing')
          fb = block[fb_start:fb_end]
          fb_pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)where\('uid', '==', currentUser\.uid\),\n(?P<next>[ \t]*)(?=(?:startAfter\(scanCursor\)|limit\(FAVORITES_PAGE_SIZE\)))"
          )
          def add_fb_order(match):
              return match.group(0) + match.group('indent') + "orderBy('createdAtMs', 'desc'),\n" + match.group('next')
          fb, inserted = fb_pattern.subn(add_fb_order, fb)
          if inserted not in (0, 2):
              raise SystemExit(f'1026 compatibility order insertion count={inserted}')
          if fb.count("orderBy('createdAtMs', 'desc')") != 2:
              raise SystemExit(f'1026 compatibility createdAtMs count={fb.count("orderBy(\'createdAtMs\', \'desc\')") }')
          block = block[:fb_start] + fb + block[fb_end:]
          block = block.replace("orderBy('createdAt', 'desc')", "orderBy('createdAtMs', 'desc')")

          if "orderBy('createdAt', 'desc')" in block:
              raise SystemExit('1026 mixed createdAt axis remains in loadMore')
          if block.count("orderBy('createdAtMs', 'desc')") < 4:
              raise SystemExit(f'1026 loadMore createdAtMs count={block.count("orderBy(\'createdAtMs\', \'desc\')")}')
          text = text[:load_start] + block + text[load_end:]

          app_path.write_text(text, encoding='utf-8')
          print('Applied 1026: first page, compatibility paging, ordered paging all use createdAtMs.')
          PY

          cat > scripts/verify-music-note-pagination-order.mjs <<'NODE'
          import fs from 'node:fs';
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          if (!app.includes('SORIDRAW_MUSIC_NOTE_ORDER_AXIS_REPAIR_1026')) throw new Error('1026 marker missing');

          const fallbackStart = app.indexOf('const fallbackSnapshot = await getDocs(query(');
          const fallbackEnd = app.indexOf('));', fallbackStart) + 3;
          const fallback = app.slice(fallbackStart, fallbackEnd);
          if (!fallback.includes("orderBy('createdAtMs', 'desc')")) throw new Error('bounded first-page fallback is unordered');

          const bootstrapStart = app.indexOf('const attachFavoritesSourceBootstrap902 = () => {');
          const bootstrapEnd = app.indexOf('let musicNoteBundleMissingHandled', bootstrapStart);
          const bootstrap = app.slice(bootstrapStart, bootstrapEnd);
          if (!bootstrap.includes("orderBy('createdAtMs', 'desc')")) throw new Error('bootstrap not createdAtMs ordered');
          if (bootstrap.includes("orderBy('createdAt', 'desc')")) throw new Error('bootstrap still uses createdAt');

          const loadStart = app.indexOf('  const loadMoreFavorites = useCallback(async () => {');
          const loadEnd = app.indexOf('  const syncMusicNoteIncrementalFromRemoteVersion = useCallback', loadStart);
          if (loadStart < 0 || loadEnd < 0) throw new Error('loadMoreFavorites block missing');
          const block = app.slice(loadStart, loadEnd);
          if (block.includes("orderBy('createdAt', 'desc')")) throw new Error('mixed createdAt order remains in loadMore');
          const count = (block.match(/orderBy\('createdAtMs', 'desc'\)/g) || []).length;
          if (count < 4) throw new Error(`expected >=4 createdAtMs order clauses in loadMore, got ${count}`);
          console.log('MUSIC_NOTE_PAGINATION_ORDER_GUARD=PASS');
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Verify pagination regression guard
        run: node scripts/verify-music-note-pagination-order.mjs

      - name: Verify changed scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/App\.tsx|scripts/verify-music-note-pagination-order\.mjs)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed files:"; echo "$unexpected"; exit 3; }
          git diff --check

      - name: Authenticate Firebase and Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify live createdAtMs index is READY
        shell: bash
        run: |
          set -euo pipefail
          gcloud firestore indexes composite list --project "$FIRESTORE_PROJECT" --database='(default)' --format=json > "$RUNNER_TEMP/indexes.json"
          node - "$RUNNER_TEMP/indexes.json" <<'NODE'
          const fs = require('fs');
          const indexes = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const matches = indexes.filter((idx) => {
            const name = String(idx?.name || '');
            const group = String(idx?.collectionGroup || name.split('/collectionGroups/')[1]?.split('/')[0] || '');
            const fields = Array.isArray(idx?.fields) ? idx.fields : [];
            return group === 'favorites'
              && fields.some((f) => f.fieldPath === 'uid' && String(f.order || '').toUpperCase() === 'ASCENDING')
              && fields.some((f) => f.fieldPath === 'createdAtMs' && String(f.order || '').toUpperCase() === 'DESCENDING')
              && String(idx.state || '').toUpperCase() === 'READY';
          });
          if (matches.length !== 1) throw new Error(`READY uid+createdAtMs index count=${matches.length}`);
          console.log('LIVE_MUSIC_NOTE_CREATEDATMS_INDEX=READY');
          NODE

      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx scripts/verify-music-note-pagination-order.mjs
          git commit -m 'fix(music-note): restore chronological pagination axis'
          git push origin HEAD:preview
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assert isolated preview site exists
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest hosting:sites:list --project "$HOSTING_PROJECT" --json > "$RUNNER_TEMP/sites.json"
          node - "$RUNNER_TEMP/sites.json" "$PREVIEW_SITE" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const wanted = process.argv[3];
          const candidates = [payload?.result?.sites, payload?.result, payload?.sites, payload];
          const sites = candidates.find(Array.isArray) || [];
          const ids = sites.map((site) => {
            const raw = String(site?.site || site?.siteId || site?.id || site?.name || '');
            return raw.includes('/') ? raw.split('/').filter(Boolean).pop() : raw;
          }).filter(Boolean);
          if (!ids.includes('soridraw')) throw new Error('production site missing');
          if (!ids.includes(wanted)) throw new Error(`preview site ${wanted} missing`);
          console.log('PREVIEW_SITE_EXISTS=PASS');
          NODE

      - name: Snapshot production before preview deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "https://$PRODUCTION_HOST/" -o "$RUNNER_TEMP/prod-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Firebase PREVIEW hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$HOSTING_PROJECT" \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo 'FIREBASE_PREVIEW_HOSTING_DEPLOY=PASS'

      - name: Verify exact deployed preview build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          local_asset="$(grep -oE 'src="/assets/index-[^"]+\.js"' dist/index.html | head -n1 || true)"
          test -n "$local_asset"
          for host in "$PREVIEW_DEFAULT_HOST" "$PREVIEW_CUSTOM_HOST"; do
            ok=''
            for attempt in $(seq 1 18); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://$host/?verify1026=${GITHUB_RUN_ID}-${attempt}" -o "$RUNNER_TEMP/${host//./_}.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/${host//./_}.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/${host//./_}.html" | awk '{print $1}')"
                remote_asset="$(grep -oE 'src="/assets/index-[^"]+\.js"' "$RUNNER_TEMP/${host//./_}.html" | head -n1 || true)"
                if [ "$remote_sha" = "$local_sha" ] && [ "$remote_asset" = "$local_asset" ]; then
                  ok='yes'
                  echo "PREVIEW_EXACT_BUILD_PASS=https://$host/ ASSET=$remote_asset"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = 'yes' || { echo "Exact preview verification failed: $host"; exit 7; }
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "https://$PRODUCTION_HOST/" -o "$RUNNER_TEMP/prod-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'PRODUCTION_UNCHANGED=PASS'
          echo "DEPLOYED_SOURCE_COMMIT=$SOURCE_COMMIT"
          echo 'FUNCTIONS_DEPLOYED=false'
          echo 'FIRESTORE_INDEX_DEPLOYED=false'
          echo 'FIRESTORE_RULES_DEPLOYED=false'
          echo 'CLOUDFLARE_DEPLOYED=false'
          echo 'MAIN_CHANGED=false'
