name: Temp List Index Audit
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-list-index-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 2
      - name: Exact list mutation hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/App.tsx','src/pages/SunoLibraryPage.tsx']:
            p=Path(name); lines=p.read_text(encoding='utf-8').splitlines()
            print('===== '+name+' =====')
            for i,line in enumerate(lines,1):
              if any(x in line for x in ["scheduleListBundleWrite('library'", "scheduleListBundleWrite('musicNote'", 'runV1MutationBoundary(', "updateDoc(doc(db, 'suno_tracks'", 'saveWorkspaceCache(', 'writeWorkspace', 'setTracks(', 'setAllTracks(']):
                print(f'{i:06d}: {line}')
          PY
