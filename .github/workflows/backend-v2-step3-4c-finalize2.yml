name: SORIDRAW Backend V2 Step 3-4c Finalize 2

on:
  push:
    branches:
      - preview
    paths:
      - .github/workflows/backend-v2-step3-4c-finalize2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 2
      - name: Patch master plan
        run: python3 scripts/temp_backend_v2_step34c_finalize.py
      - name: Validate patch scope
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md"
          grep -Fq "Step 3-4c playlist-header limited backfill complete and verified" docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          grep -Fq "3-4d Playlist-item limited backfill" docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          grep -Fq "SORIDRAW_API_KEY_SECURITY_REQUIREMENTS.md" docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
      - name: Commit master update and remove temporary files
        run: |
          set -euo pipefail
          git rm .github/workflows/backend-v2-step3-4c-finalize2.yml scripts/temp_backend_v2_step34c_finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git commit -m "docs: mark Backend V2 Step 3-4c playlist headers complete"
          git push origin HEAD:preview
