name: APP795 exact active callsite source (read only)
on:
  push:
    branches: [prep/app795-active-follow-connection]
    paths:
      - 'scripts/app795-active-follow-callsites.mjs'
      - '.github/workflows/app795-active-follow-callsites.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/app795-active-follow-callsites.mjs
      - run: node scripts/app795-active-follow-callsites.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
