name: SORIDRAW Backend V2 Step 3-4 Backfill Safety Design

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4-backfill-safety-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate Google/Firebase session
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Static zero-mutation boundary check
        shell: bash
        run: |
          set -euo pipefail
          planner='backup_scripts/backend_v2_backfill_safety_plan.ts'
          contract='backup_scripts/backend_v2_backfill_safety_plan.contract.ts'
          test -f "$planner"
          test -f "$contract"
          ! grep -Eq "from ['\"]firebase|from ['\"]firebase-admin|require\(['\"]firebase|fetch\(|axios|XMLHttpRequest|setDoc|addDoc|updateDoc|deleteDoc|writeBatch|runTransaction|getFirestore" "$planner"
          grep -Fq 'actualBackfillExecutionAuthorized: false' "$planner"
          grep -Fq 'firestoreWrites: 0' "$planner"
          grep -Fq 'firestoreDeletes: 0' "$planner"
          grep -Fq 'STEP34_MAX_RUNTIME_WRITE_CAP = 1_000' "$planner"
          grep -Fq 'STEP34_RECOMMENDED_BATCH_SIZE = 100' "$planner"
          grep -Fq 'STEP34_CANARY_WRITE_CAP = 25' "$planner"

      - name: Run synthetic backfill safety contracts
        run: npx tsx backup_scripts/backend_v2_backfill_safety_plan.contract.ts

      - name: TypeScript baseline parity without repository lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx tsc --noEmit > /tmp/step34-tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'TypeScript check clean.'
          else
            error_count="$(grep -c 'error TS' /tmp/step34-tsc.log || true)"
            test "$error_count" -eq 2
            grep -Fq 'src/App.tsx(4449,33): error TS2367' /tmp/step34-tsc.log
            grep -Fq 'src/services/geminiService.ts(35129,5): error TS2322' /tmp/step34-tsc.log
            ! grep -Fq 'backup_scripts/backend_v2_backfill_safety_plan' /tmp/step34-tsc.log
            echo 'TypeScript baseline parity PASS: only the two pre-existing unrelated errors remain.'
          fi

      - name: Production build without repository lifecycle scripts
        run: npx vite build

      - name: Download exact verified Step 3-3 backup from Firebase Storage
        shell: bash
        run: |
          set -euo pipefail
          dir='/tmp/soridraw-step34-backup'
          rm -rf "$dir"
          mkdir -p "$dir"
          chmod 700 "$dir"
          node <<'NODE'
          const path = require('node:path');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getStorage } = require('firebase-admin/storage');
          const projectId = process.env.TARGET_PROJECT;
          const bucketName = process.env.TARGET_BUCKET;
          const prefix = process.env.BACKUP_PREFIX;
          const destination = '/tmp/soridraw-step34-backup';
          const files = [
            'manifest.json',
            'user_structures.ndjson',
            'user_recent_songs.ndjson',
            'favorites.ndjson',
            'playlist_lists.ndjson',
            'playlist_items.ndjson',
          ];
          const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `soridraw-step34-${Date.now()}`);
          (async () => {
            const bucket = getStorage(app).bucket(bucketName);
            const [exists] = await bucket.exists();
            if (!exists) throw new Error('Step 3-4 Storage source bucket is unavailable');
            for (const fileName of files) {
              await bucket.file(`${prefix}/${fileName}`).download({ destination: path.join(destination, fileName) });
            }
            console.log(`Downloaded verified backup files for offline analysis: ${files.length}`);
          })().finally(async () => {
            await deleteApp(app);
          }).catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Re-verify backup integrity before analysis
        run: npx tsx backup_scripts/backend_v2_verify_backup.ts --dir=/tmp/soridraw-step34-backup

      - name: Run exact backup offline backfill safety analysis
        shell: bash
        run: |
          set -euo pipefail
          npx tsx backup_scripts/backend_v2_backfill_safety_plan.ts \
            --dir=/tmp/soridraw-step34-backup \
            --output=/tmp/soridraw-step34-summary.json
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('/tmp/soridraw-step34-summary.json', 'utf8'));
          const allowedTopKeys = ['source', 'identity', 'projectedWrites', 'safety'];
          const actualTopKeys = Object.keys(summary).sort();
          if (JSON.stringify(actualTopKeys) !== JSON.stringify([...allowedTopKeys].sort())) {
            throw new Error('Unexpected summary shape');
          }
          if (summary.source.targetProjectId !== 'soridraw-app-866a5') throw new Error('Project mismatch');
          if (summary.source.manifestComplete !== true) throw new Error('Manifest incomplete');
          if (summary.safety.firestoreReads !== 0 || summary.safety.firestoreWrites !== 0 || summary.safety.firestoreDeletes !== 0) {
            throw new Error('Offline planner mutation boundary violated');
          }
          if (summary.safety.actualBackfillExecutionAuthorized !== false) throw new Error('Execution must remain unauthorized');
          console.log('--- SAFE AGGREGATE STEP 3-4 SUMMARY ---');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Confirm no repository or private-artifact side effects
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test ! -e ./soridraw-step34-summary.json
          rm -rf /tmp/soridraw-step34-backup /tmp/soridraw-step34-summary.json /tmp/step34-tsc.log
          echo 'Step 3-4 design validation PASS: source tree unchanged, no Firestore operation, no backup artifact uploaded.'
