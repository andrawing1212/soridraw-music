name: TEMP 078 D1 Trigger Readonly Diagnosis

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-078-d1-trigger-readonly-diagnosis.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read current shared D1 publication trigger schema only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          SQL="SELECT name,tbl_name,sql FROM sqlite_schema WHERE type='trigger' AND tbl_name IN ('tracks','explore_derived_tracks','public_profiles','explore_derived_profiles','track_stats') ORDER BY tbl_name,name;"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "$SQL" --json > "$RUNNER_TEMP/triggers.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/triggers.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          console.log('TRIGGER_COUNT='+rows.length);
          for(const row of rows){
            console.log('\n===TRIGGER '+row.name+' ON '+row.tbl_name+'===');
            console.log(String(row.sql||''));
          }
          NODE
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT seeded,seq FROM explore_derived_state WHERE id=1;" --json
          echo 'READ_ONLY_DIAGNOSIS=PASS'
