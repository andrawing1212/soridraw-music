name: Apply device count yellow UI once

on:
  push:
    branches:
      - main
    paths:
      - .deploy/apply-device-count-yellow-trigger.txt

concurrency:
  group: apply-device-count-yellow-main-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Change device count text to yellow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/AdminUserManagementPage.tsx')
          text = path.read_text(encoding='utf-8')
          old_mobile = 'className="mt-0.5 text-[9px] font-bold text-sky-300">{live.deviceCount}개 기기'
          new_mobile = 'className="mt-0.5 text-[9px] font-bold text-amber-300">{live.deviceCount}개 기기'
          old_desktop = 'className="text-[10px] font-bold text-sky-300">{live.deviceCount}개 기기'
          new_desktop = 'className="text-[10px] font-bold text-amber-300">{live.deviceCount}개 기기'

          if old_mobile not in text:
              raise SystemExit('mobile device-count text target not found')
          if old_desktop not in text:
              raise SystemExit('desktop device-count text target not found')

          text = text.replace(old_mobile, new_mobile, 1)
          text = text.replace(old_desktop, new_desktop, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Commit UI change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminUserManagementPage.tsx
          git commit -m "style: show device count in yellow"
          git push origin HEAD:main
