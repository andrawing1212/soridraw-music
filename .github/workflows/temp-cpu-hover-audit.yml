name: TEMP CPU Hover Audit
on:
  push:
    branches: [preview-cpu-hover-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deep inspect pointer listener / portal paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BRANCH / HEAD ==='
          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD
          echo '=== Native listener totals by hot page ==='
          for f in src/App.tsx src/pages/FavoritesPage.tsx src/pages/SunoLibraryPage.tsx src/components/studio/StudioSplitWorkspace.tsx src/components/studio/LiteStudioSplitWorkspace.tsx; do
            echo "--- $f"
            printf 'addEventListener='; grep -c 'addEventListener' "$f" || true
            printf 'removeEventListener='; grep -c 'removeEventListener' "$f" || true
            printf 'onMouseEnter='; grep -c 'onMouseEnter' "$f" || true
            printf 'onMouseLeave='; grep -c 'onMouseLeave' "$f" || true
            printf 'onPointerMove='; grep -c 'onPointerMove' "$f" || true
            printf 'createPortal='; grep -c 'createPortal' "$f" || true
            printf '<Portal='; grep -c '<Portal' "$f" || true
            printf 'StudioCenterModalPortal='; grep -c 'StudioCenterModalPortal' "$f" || true
          done
          echo '=== Favorites native listener lines ==='
          grep -nE 'addEventListener|removeEventListener|createPortal|<Portal|StudioCenterModalPortal|onMouseEnter|onMouseLeave|onPointerMove' src/pages/FavoritesPage.tsx | head -n 500 || true
          echo '=== Library native listener lines ==='
          grep -nE 'addEventListener|removeEventListener|createPortal|<Portal|StudioCenterModalPortal|onMouseEnter|onMouseLeave|onPointerMove' src/pages/SunoLibraryPage.tsx | head -n 500 || true
          echo '=== App hoveredItem references ==='
          grep -nE 'hoveredItem|setHoveredItem|studioDescriptionPointerRef|resolveStudioDescriptionPlacement' src/App.tsx | head -n 260 || true
          echo '=== React event prop counts Favorites ==='
          grep -oE 'on[A-Z][A-Za-z]+=' src/pages/FavoritesPage.tsx | sort | uniq -c | sort -nr | head -n 100 || true
          echo '=== React event prop counts Library ==='
          grep -oE 'on[A-Z][A-Za-z]+=' src/pages/SunoLibraryPage.tsx | sort | uniq -c | sort -nr | head -n 100 || true
          echo '=== Portal component definitions / imports ==='
          grep -RInE 'function Portal|const Portal|createPortal\(' src/App.tsx src/pages src/components | head -n 300 || true
