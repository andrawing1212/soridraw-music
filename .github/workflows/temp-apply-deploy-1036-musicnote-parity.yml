name: Temp Apply Deploy 1036 Music Note Parity

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-apply-deploy-1036-musicnote-parity.yml']

permissions:
  contents: write

concurrency:
  group: soridraw-1036-musicnote-parity-preview
  cancel-in-progress: false

jobs:
  apply_test_deploy:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_RUNTIME_BASE: 4791c721aa54a25798721c8437c7f685b121ea8f
      WORKER_URL: https://soridraw-media-preview.andrawing1212.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30

      - name: Guard runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_RUNTIME_BASE" HEAD
          git diff --exit-code "$EXPECTED_RUNTIME_BASE"..HEAD -- \
            src functions/src cloudflare/media-worker package.json package-lock.json \
            firebase.json firebase.hosting-preview.json firestore.rules firestore.indexes.json
          echo 'RUNTIME_BASE_GUARD=PASS'

      - name: Apply 1036 parity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/apply-1036-musicnote-library-parity.py

      - name: Structural cost and regression guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx').read_text(encoding='utf-8')
          fav = Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          eng = Path('src/lib/userDataEngine.ts').read_text(encoding='utf-8')
          worker = Path('cloudflare/media-worker/src/index.js').read_text(encoding='utf-8')

          assert 'attachFavoritesSourceBootstrap902' not in app, 'old paged Music Note bootstrap still exists'
          assert 'attachLegacyFavoritesFallback' not in app, 'legacy Music Note fallback still exists'
          lm = app.index('const loadMoreFavorites = useCallback')
          lm_end = app.index('const syncMusicNoteIncrementalFromRemoteVersion', lm)
          load_more = app[lm:lm_end]
          assert 'getDocs' not in load_more and "collection(db, 'favorites')" not in load_more, 'Music Note More still reads Firestore'
          assert 'musicNoteFullCatalogReadyUids' in app
          assert 'bundle.schemaVersion === 1001' in app
          assert 'clearMusicNotePaginationCursor(currentUser.uid)' in app
          assert "setHasMoreFavorites(false)" in app

          assert 'canRequestMoreMusicNotePage' not in fav
          assert 'onLoadMoreFavorites?.' not in fav
          assert '더보기 (20개 더 불러오기)' not in fav
          assert 'visibleCount < filteredFavorites.length' in fav

          assert "const CATALOG_SCHEMA_VERSION = 3 as const;" in eng
          assert "soridraw_user_data_engine_v3" in eng
          assert 'catalog auth headers unavailable after retry' in eng
          assert 'catalog snapshot read unavailable after retry' in eng

          assert 'const CATALOG_SCHEMA_VERSION = 3;' in worker
          assert 'catalog/v3/' in worker
          assert 'catalogSchemaVersion: CATALOG_SCHEMA_VERSION' in worker

          # Recent Songs <-> Music Note contract and media preservation must survive.
          for marker in ['buildRecentMirrorTargets', 'favoriteSyncSignal', 'music-note-unsave']:
              assert marker in app, f'recent/music-note integration marker missing: {marker}'
          for media in ['audioUrl', 'coverUrl', 'imageUrl', 'sunoAudioUrl', 'sunoCoverUrl']:
              assert media in app, f'Music Note media field missing: {media}'

          print('STRUCTURAL_GUARDS=PASS')
          PY

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: App build
        run: npm run build

      - name: Set up Node 22 for Functions and Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Functions build
        run: npm --prefix functions run build

      - name: Existing Library backend test
        run: npm --prefix functions run test:library-bundle

      - name: Cloudflare Worker dry-run
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/media-worker
          npm install --no-audit --no-fund --package-lock=false
          npm run check

      - name: Commit validated runtime source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add src/App.tsx src/pages/FavoritesPage.tsx src/lib/userDataEngine.ts cloudflare/media-worker/src/index.js
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(preview): make Music Note catalog authoritative'
          git push origin HEAD:preview
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Snapshot main and production
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote origin refs/heads/main | awk '{print $1}' > "$RUNNER_TEMP/main-before.sha"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Deploy Cloudflare PREVIEW Worker first
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          cd cloudflare/media-worker
          npm run deploy
          echo 'CLOUDFLARE_PREVIEW_DEPLOY=PASS'

      - name: Verify Cloudflare catalog V3
        shell: bash
        run: |
          set -euo pipefail
          ok=''
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 30 "$WORKER_URL/health" -o "$RUNNER_TEMP/health.json"; then
              cat "$RUNNER_TEMP/health.json"
              if grep -q '"r2Binding":true' "$RUNNER_TEMP/health.json" && grep -q '"catalogSchemaVersion":3' "$RUNNER_TEMP/health.json"; then
                ok=yes
                break
              fi
            fi
            sleep 6
          done
          test "$ok" = yes
          code="$(curl -sS -o "$RUNNER_TEMP/catalog-unauth.json" -w '%{http_code}' --max-time 30 -H 'Origin: https://preview.soridraw.com' "$WORKER_URL/v1/catalog/musicNote")"
          echo "CATALOG_UNAUTH_HTTP=$code"
          test "$code" = '401'
          echo 'CLOUDFLARE_CATALOG_V3_VERIFY=PASS'

      - name: Set up Node 20 for Firebase
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact deployed PREVIEW build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok=yes
                  echo "EXACT_BUILD_PASS=$url"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = yes
          done

      - name: Verify main and production unchanged
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote origin refs/heads/main | awk '{print $1}' > "$RUNNER_TEMP/main-after.sha"
          cmp "$RUNNER_TEMP/main-before.sha" "$RUNNER_TEMP/main-after.sha"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'MAIN_UNCHANGED=PASS'
          echo 'PRODUCTION_UNCHANGED=PASS'

      - name: Cleanup temporary 1036 files
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin preview
          git rm -f \
            .github/workflows/temp-audit-1036-library-parity.yml \
            .github/workflows/temp-audit-1036-parity-details.yml \
            .github/workflows/temp-apply-deploy-1036-musicnote-parity.yml \
            .deploy/apply-1036-musicnote-library-parity.py
          git commit -m 'chore(preview): remove temporary 1036 workflows and patch'
          git push origin HEAD:preview
          echo 'TEMP_CLEANUP=PASS'

      - name: Final result
        run: |
          echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          echo 'MUSIC_NOTE=FULL_CATALOG_AUTHORITATIVE_LOCAL_MORE_ONLY'
          echo 'CLOUDFLARE_PREVIEW=DEPLOYED_V3'
          echo 'FIREBASE_FUNCTIONS=UNCHANGED_NO_REDEPLOY'
          echo 'FIREBASE_PREVIEW_HOSTING=DEPLOYED_EXACT_BUILD'
          echo 'MAIN=UNCHANGED'
          echo 'PRODUCTION=UNCHANGED'
