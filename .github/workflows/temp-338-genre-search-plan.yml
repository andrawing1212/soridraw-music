name: TEMP 338 Genre Search Plan Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-338-genre-search-plan.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only genre query audit
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE (type='index' AND tbl_name IN ('tracks','track_tags')) ORDER BY tbl_name,name" --json > "$RUNNER_TEMP/indexes.json"
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/indexes.json','utf8')).flatMap(x=>x.results||[]);
          for(const r of rows) console.log('INDEX',r.tbl_name,r.name,String(r.sql||''));
          NODE
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN SELECT t.id FROM tracks t WHERE t.is_public=1 AND t.status='published' AND (t.primary_genre='Ballad' OR ((t.primary_genre IS NULL OR TRIM(t.primary_genre)='') AND EXISTS (SELECT 1 FROM track_tags tt WHERE tt.track_id=t.id AND tt.kind='genre' AND tt.value='Ballad'))) ORDER BY t.published_at DESC,t.id DESC LIMIT 41" --json > "$RUNNER_TEMP/oldplan.json"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN SELECT t.id FROM tracks t INDEXED BY idx_tracks_primary_genre_latest WHERE t.primary_genre='Ballad' AND t.is_public=1 AND t.status='published' ORDER BY t.published_at DESC,t.id DESC LIMIT 41" --json > "$RUNNER_TEMP/newplan.json"
          node - <<'NODE'
          const fs=require('fs');
          for(const n of ['oldplan','newplan']){
            const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json','utf8')).flatMap(x=>x.results||[]);
            console.log(n.toUpperCase(),rows.map(x=>x.detail).join(' | '));
          }
          NODE
          echo 'TEMP338_READONLY=PASS'
