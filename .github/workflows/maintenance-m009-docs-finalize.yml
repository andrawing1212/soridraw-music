name: SORIDRAW Maintenance M-009 Docs Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m009-docs-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0

      - name: Finalize M-009 docs and progress ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label} anchor mismatch: {count}')
              return text.replace(before, after, 1)

          # 1) M-009 result record
          p = Path('docs/SORIDRAW_MAINTENANCE_M009_VERCEL_PREBUILD_BLOCKER.md')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              'Status: OPEN / HIGH / BLOCKER BEFORE 2-A4c PREVIEW ACTIVATION',
              'Status: CLOSED / REPAIRED / VERIFIED READY BEFORE 2-A4c',
              'M009 status',
          )
          if '## 6. Completion — 2026-08-26' not in s:
              s += '''\n## 6. Completion — 2026-08-26\n\nM-009 is closed. The failure was caused by historical build-time source patchers assuming older source anchors after the runtime had evolved. The repair kept the prebuild chain and its existing functionality, but made only the conflicting historical patchers compatible with the current committed runtime/mutation-boundary structure.\n\nPermanent compatibility changes were made to:\n\n- `.deploy/apply-874-build-safety.py`\n- `.deploy/apply-901-music-note-10-incremental-sync.py`\n- `.deploy/apply-905-recent-songs-cache-live-accounting.py`\n- `.deploy/apply-910-recent-text-batch-unsave-fix.py`\n- `.deploy/apply-912-heart-triggered-recent-save.py`\n- `.deploy/apply-913-recent-save-runtime-fix.py`\n\nPermanent repair commit: `741a794ce9df7ccf724ff21e040c4a732b0c1968`.\n\nFinal clean-checkout validator run `32899355162` completed **SUCCESS** and proved:\n\n- the exact Vercel path `npm run build` passes from a clean `preview` checkout,\n- full `npx tsc --noEmit` passes after generated runtime patches,\n- generated recent-song `persistRecentSongsDocument()` calls remain inside `runV1MutationBoundary`,\n- 912/913 deferred `edit` / `pre-favorite-edit` semantics are validated as local pending state committed through the heart/flush boundary rather than falsely required as direct Firestore operation labels,\n- required Music Note mutation categories remain present,\n- V2 mirror remains OFF, runtime remains `v1-only`, V2 write gate OFF, V1 delete gate OFF, shadow/local-cache runtime gates OFF,\n- all six repaired Python deploy scripts compile,\n- Firebase data reads/writes/deletes caused by the validator were 0/0/0, and Rules/Functions/Hosting deploys were 0.\n\nThe first final validator attempt had already passed `npm run build` and full TypeScript but failed an overly literal safety assertion that expected `edit` and `pre-favorite-edit` to appear as direct Firestore operation labels. That validator was corrected to reflect the actual 912/913 design; the application/runtime was not weakened to satisfy the test.\n\nVercel deployment `dpl_HxskSRFFpEoUGaRYhcJWAHzH4DM8` for commit `649bd15b49456c979dc8b8b5211206d004bf0455` reached **READY** on the `preview` branch alias. This proves the repaired real Vercel build path is healthy. Subsequent M-009 workflow-cleanup/documentation commits are repository-only and must still be checked at the final branch HEAD before completion is reported.\n\nTemporary M-009 apply/diagnostic/clean-build workflows were removed after successful validation.\n\nM-009 no longer blocks Backend V2. **M-008 deployed Firestore Rules alignment is now the only current blocker before 2-A4c can be prepared, and it still requires its own separate explicit Rules-only approval.**\n'''
          p.write_text(s, encoding='utf-8')

          # 2) Maintenance backlog
          p = Path('docs/SORIDRAW_MAINTENANCE_BACKLOG.md')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              'Status: ACTIVE / GATE A REPO-SIDE SAFETY CLEARED / M-008 RULES + M-009 VERCEL PREBUILD BLOCK 2-A4c',
              'Status: ACTIVE / M-009 CLOSED / M-008 FIRESTORE RULES IS THE ONLY CURRENT 2-A4c BLOCKER',
              'backlog status',
          )
          s = replace_once(
              s,
              '- M-009 — **HIGH BLOCKER CONFIRMED**: Vercel Preview `npm run build` currently stops in the historical prebuild patch chain with `normal update updatedAtMs anchor mismatch: 0`; the same failure existed before the Gate A dependency lockfile change.',
              '- M-009 — **CLOSED**: historical prebuild patch compatibility was repaired without removing the chain; clean-checkout `npm run build`, full TypeScript, generated V1 mutation-boundary audit and Vercel Preview READY all passed.',
              'backlog checkpoint M009',
          )
          s = replace_once(
              s,
              'Therefore **2-A4c remains blocked**. M-009 Preview build health and M-008 Rules alignment must both be cleared before any 2-A4c write-capable workflow is created or armed.',
              'Therefore **2-A4c remains blocked by M-008 only**. No 2-A4c write-capable workflow may be created or armed until the separately approved Rules-only alignment is deployed and verified.',
              'backlog blocker paragraph',
          )
          old_row = '| M-009 | Vercel Preview `npm run build` fails in historical prebuild source-patch chain | HIGH / BLOCKER FOR 2-A4c | Vercel deployments for commits `c695776...` and `e505ce7...` both failed with `normal update updatedAtMs anchor mismatch: 0`. GitHub `npx vite build` passes because it bypasses npm lifecycle `prebuild`; therefore final Preview HEAD is not yet proven deployable through the real Vercel path. | **Before 2-A4c Preview activation.** Audit the exact stale patch owner, make only the minimum source/build-pipeline correction, require full `npm run build`, contracts and exact Vercel READY verification. No Firebase change in this fix. | **OPEN / HIGH BLOCKER** |'
          new_row = '| M-009 | Vercel Preview historical prebuild patch chain compatibility | HIGH / BLOCKER FOR 2-A4c | **Resolved.** Six conflicting historical patchers were made current-source compatible without removing the prebuild chain. Clean validator `32899355162` passed exact `npm run build`, full TypeScript, generated mutation-boundary/gate checks and script compilation; Vercel deployment for `649bd15...` reached READY. Firebase data/Rules/Functions/Hosting changes: 0. | Was mandatory before 2-A4c. Keep the repaired build-path validation in future release gates; do not reintroduce stale anchor assumptions. | **CLOSED — M-009 repair verified** |'
          s = replace_once(s, old_row, new_row, 'backlog M009 table')
          s = replace_once(
              s,
              'Post-Gate-A Vercel inspection found two Preview deployments failing before Vite with the same historical prebuild patch error: `normal update updatedAtMs anchor mismatch: 0`. This failure predates the Gate A dependency lockfile change. Full detail: `docs/SORIDRAW_MAINTENANCE_M009_VERCEL_PREBUILD_BLOCKER.md`.',
              'M-009 repair is complete. Permanent compatibility commit `741a794ce9df7ccf724ff21e040c4a732b0c1968`; final clean-checkout validator `32899355162` SUCCESS; Vercel deployment `dpl_HxskSRFFpEoUGaRYhcJWAHzH4DM8` for `649bd15...` READY. Full detail: `docs/SORIDRAW_MAINTENANCE_M009_VERCEL_PREBUILD_BLOCKER.md`.',
              'backlog M009 evidence',
          )
          old_order = '''3. **M-009 PREVIEW BUILD PIPELINE REPAIR REQUIRED NOW**\n   - audit the current `prebuild` patch chain,\n   - correct only the stale/required patch ownership,\n   - require the real `npm run build` path and exact Vercel Preview READY verification,\n   - no Firebase data/Rules/Functions/Hosting change in this repair.\n4. **M-008 RULES ALIGNMENT AFTER M-009**'''
          new_order = '''3. **M-009 PREVIEW BUILD PIPELINE REPAIR COMPLETE**\n   - historical prebuild compatibility repaired without removing required feature patches,\n   - exact clean `npm run build` + full TypeScript + generated mutation-boundary audit passed,\n   - Vercel Preview READY verified,\n   - temporary M-009 workflows removed; Firebase data/Rules/Functions/Hosting change 0.\n4. **M-008 RULES ALIGNMENT REQUIRED NOW**'''
          s = replace_once(s, old_order, new_order, 'backlog planned order')
          p.write_text(s, encoding='utf-8')

          # 3) Backend V2 Master Plan
          p = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              'Status: IMPLEMENTATION / Maintenance Gate A repo-side safety complete — full TypeScript is clean, dependency critical/high findings are 0/0, and Node24-compatible migration Action majors are verified; two blockers now remain before 2-A4c: M-009 Vercel Preview `npm run build` fails in the historical prebuild patch chain, and M-008 deployed Firestore Rules still lack the V2 canonical-song rule; Step 4 remains blocked',
              'Status: IMPLEMENTATION / M-009 Vercel Preview prebuild blocker closed — exact clean `npm run build`, full TypeScript, generated V1 mutation-boundary safety checks and Vercel Preview READY are verified; M-008 deployed Firestore Rules alignment is now the only current blocker before separately approved 2-A4c shadow writes; Step 4 remains blocked',
              'master status',
          )
          anchor = '- Full detail: `docs/SORIDRAW_BACKEND_V2_STEP2_A4B_V1_MUTATION_BOUNDARY_RESULT.md`.\n'
          addition = '''- Full detail: `docs/SORIDRAW_BACKEND_V2_STEP2_A4B_V1_MUTATION_BOUNDARY_RESULT.md`.\n\n### Maintenance M-009 complete — real Vercel prebuild path repaired and verified\n- Historical build-time patchers 874/901/905/910/912/913 were made compatible with the current committed mutation-boundary/runtime source; the required prebuild feature chain was not removed or globally bypassed.\n- Permanent compatibility commit: `741a794ce9df7ccf724ff21e040c4a732b0c1968`.\n- Final clean-checkout validator run `32899355162` SUCCESS: exact `npm run build`, full `tsc --noEmit`, generated Recent/Music Note V1 mutation-boundary checks, Backend V2 OFF gates and repaired-script syntax all passed.\n- The earlier final-validator failure was a false-negative assertion that treated 912/913 deferred local `edit` / `pre-favorite-edit` state as if it must be a direct Firestore operation label. The validator was corrected; runtime behavior was not weakened.\n- Vercel deployment `dpl_HxskSRFFpEoUGaRYhcJWAHzH4DM8` for commit `649bd15b49456c979dc8b8b5211206d004bf0455` reached READY on the Preview branch alias.\n- Temporary M-009 workflows were removed after validation. Firebase data IO and Rules/Functions/Hosting deploys caused by M-009 were all 0.\n- M-009 is closed. M-008 Rules alignment remains the only current blocker before 2-A4c preparation. Full detail: `docs/SORIDRAW_MAINTENANCE_M009_VERCEL_PREBUILD_BLOCKER.md`.\n'''
          s = replace_once(s, anchor, addition, 'master M009 insertion')
          s = replace_once(
              s,
              '### Step 2 — V2 code implementation on preview (2-A4b + Gate A repo-side safety complete; M-009 Preview build + M-008 Rules alignment + 2-A4c/d still gated) 🔄',
              '### Step 2 — V2 code implementation on preview (2-A4b + Gate A repo-side safety + M-009 Preview build repair complete; M-008 Rules alignment + 2-A4c/d still gated) 🔄',
              'master tracker heading',
          )
          s = replace_once(
              s,
              '    - [ ] M-009 Vercel Preview build blocker: real `npm run build` fails at `normal update updatedAtMs anchor mismatch: 0`; must be repaired and exact Preview READY verified before M-008 deployment/2-A4c activation.',
              '    - [x] M-009 Vercel Preview build blocker CLOSED: repaired historical prebuild compatibility; clean exact `npm run build`, full TypeScript, generated boundary/gate validation and Vercel Preview READY verified; Firebase changes 0.',
              'master tracker M009',
          )
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_MAINTENANCE_M009_VERCEL_PREBUILD_BLOCKER.md docs/SORIDRAW_MAINTENANCE_BACKLOG.md docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git diff --cached --check
          git commit -m 'docs: close M-009 and advance Backend V2 gate'
          git push origin HEAD:preview

      - name: Remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin preview
          git rm .github/workflows/maintenance-m009-docs-finalize.yml
          git commit -m 'chore: remove M-009 docs finalizer'
          git push origin HEAD:preview
