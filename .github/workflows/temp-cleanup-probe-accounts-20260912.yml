name: SORIDRAW Synthetic 044 Probe Cleanup

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-cleanup-probe-accounts-20260912.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate Firebase cleanup
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Reconfirm exact synthetic Firebase records are empty
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('firebase-admin');
          admin.initializeApp({ projectId: 'soridraw-app-866a5' });
          const db = admin.firestore();
          const auth = admin.auth();
          const DISPLAY = 'SORIDRAW 044 preview Probe';
          const expected = [
            ['soridraw044_preview_1788858037027_hz0rqi','soridraw044-preview-1788858037027-hz0rqi@example.invalid'],
            ['soridraw044_preview_1788859541129_1hs088','soridraw044-preview-1788859541129-1hs088@example.invalid'],
            ['soridraw044_preview_1788859809967_h2cqp0','soridraw044-preview-1788859809967-h2cqp0@example.invalid'],
          ];
          const emptySub = async (path) => (await db.collection(path).limit(1).get()).empty;
          const emptyRef = async (c,f,u) => (await db.collection(c).where(f,'==',u).limit(1).get()).empty;
          const noAuth = async (uid) => { try { await auth.getUser(uid); return false; } catch (e) { if (e?.code === 'auth/user-not-found') return true; throw e; } };
          (async () => {
            for (const [uid,email] of expected) {
              const snap = await db.collection('users').doc(uid).get();
              if (!snap.exists) throw new Error(`Expected probe user doc missing before cleanup: ${uid}`);
              const d = snap.data() || {};
              if (d.displayName !== DISPLAY || String(d.email || '').toLowerCase() !== email) throw new Error(`Marker mismatch: ${uid}`);
              if (String(d.role || 'free') !== 'free') throw new Error(`Unexpected role: ${uid}`);
              if (Number(d.songGeneratedCount || 0) !== 0 || Number(d.favoriteCount || 0) !== 0) throw new Error(`Nonzero content counters: ${uid}`);
              if (!(await noAuth(uid))) throw new Error(`Active Auth user exists: ${uid}`);
              const direct = await Promise.all(['user_recent_songs','user_structures','user_api_keys','gemini_request_guards'].map(c => db.collection(c).doc(uid).get()));
              if (direct.some(s => s.exists)) throw new Error(`Account-scoped direct data exists: ${uid}`);
              const subchecks = await Promise.all([
                emptySub(`users/${uid}/songs`), emptySub(`users/${uid}/playlists`), emptySub(`users/${uid}/settings`),
                emptySub(`suno_tracks/${uid}/tracks`), emptySub(`user_list_caches/${uid}/bundles`), emptySub(`user_playlists/${uid}/lists`),
              ]);
              if (subchecks.some(v => !v)) throw new Error(`Nested user content exists: ${uid}`);
              const refchecks = await Promise.all([
                emptyRef('favorites','uid',uid), emptyRef('suno_shares','ownerUid',uid), emptyRef('music_note_shares','ownerUid',uid),
                emptyRef('admin_permission_audit','targetUid',uid),
              ]);
              if (refchecks.some(v => !v)) throw new Error(`Referenced user content exists: ${uid}`);
            }
            console.log('FIREBASE_PREDELETE_GUARD=PASS');
            console.log(`CONFIRMED_SYNTHETIC_RECORDS=${expected.length}`);
          })().catch(e => { console.error('FIREBASE_PREDELETE_GUARD=FAIL', e?.stack || e); process.exit(1); });
          NODE

      - name: Reconfirm no shared D1 references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const uids = [
            'soridraw044_preview_1788858037027_hz0rqi',
            'soridraw044_preview_1788859541129_1hs088',
            'soridraw044_preview_1788859809967_h2cqp0',
          ];
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.SHARED_D1_ID}/query`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          const qi = v => `"${String(v).replaceAll('"','""')}"`;
          const qs = v => `'${String(v).replaceAll("'", "''")}'`;
          async function query(sql) {
            const r = await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({sql})});
            const text = await r.text(); const j = JSON.parse(text);
            if (!r.ok || j.success === false) throw new Error(`D1 ${r.status}: ${text.slice(0,800)}`);
            return (Array.isArray(j.result) ? j.result : [j.result]).flatMap(b => b?.results || []);
          }
          (async () => {
            const cols = ['uid','user_id','user_uid','owner_uid','author_uid','follower_uid','following_uid','target_uid','actor_uid','profile_uid'];
            const schema = await query("SELECT name, sql FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
            const inList = uids.map(qs).join(','); let hits = 0; let checks = 0;
            for (const row of schema) {
              const table=String(row.name||''), ddl=String(row.sql||'');
              for (const col of cols) {
                if (!table || !new RegExp(`(^|[^A-Za-z0-9_])${col}([^A-Za-z0-9_]|$)`,'i').test(ddl)) continue;
                checks += 1;
                const rows = await query(`SELECT COUNT(*) count FROM ${qi(table)} WHERE ${qi(col)} IN (${inList})`);
                hits += Number(rows[0]?.count || 0);
              }
            }
            if (hits !== 0) throw new Error(`D1 references appeared before cleanup: ${hits}`);
            console.log(`D1_PREDELETE_GUARD=PASS checks=${checks} hits=${hits}`);
          })().catch(e => { console.error('D1_PREDELETE_GUARD=FAIL',e?.stack||e); process.exit(1); });
          NODE

      - name: Delete only confirmed synthetic Firestore user documents
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('firebase-admin');
          admin.initializeApp({ projectId: 'soridraw-app-866a5' });
          const db = admin.firestore();
          const DISPLAY = 'SORIDRAW 044 preview Probe';
          const expected = [
            ['soridraw044_preview_1788858037027_hz0rqi','soridraw044-preview-1788858037027-hz0rqi@example.invalid'],
            ['soridraw044_preview_1788859541129_1hs088','soridraw044-preview-1788859541129-1hs088@example.invalid'],
            ['soridraw044_preview_1788859809967_h2cqp0','soridraw044-preview-1788859809967-h2cqp0@example.invalid'],
          ];
          (async () => {
            const batch = db.batch();
            for (const [uid,email] of expected) {
              const ref = db.collection('users').doc(uid);
              const snap = await ref.get();
              const d = snap.data() || {};
              if (!snap.exists || d.displayName !== DISPLAY || String(d.email || '').toLowerCase() !== email || String(d.role || 'free') !== 'free' || Number(d.songGeneratedCount || 0) !== 0 || Number(d.favoriteCount || 0) !== 0) {
                throw new Error(`Final marker guard refused deletion: ${uid}`);
              }
              batch.delete(ref);
            }
            await batch.commit();
            console.log(`DELETED_FIRESTORE_SYNTHETIC_USERS=${expected.length}`);
          })().catch(e => { console.error('SYNTHETIC_CLEANUP=FAIL',e?.stack||e); process.exit(1); });
          NODE

      - name: Postcheck cleanup
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('firebase-admin');
          admin.initializeApp({ projectId: 'soridraw-app-866a5' });
          const db = admin.firestore();
          const auth = admin.auth();
          const DISPLAY = 'SORIDRAW 044 preview Probe';
          const uids = [
            'soridraw044_preview_1788858037027_hz0rqi',
            'soridraw044_preview_1788859541129_1hs088',
            'soridraw044_preview_1788859809967_h2cqp0',
          ];
          (async () => {
            for (const uid of uids) {
              if ((await db.collection('users').doc(uid).get()).exists) throw new Error(`User doc still exists: ${uid}`);
              try { await auth.getUser(uid); throw new Error(`Auth unexpectedly exists: ${uid}`); }
              catch (e) { if (e?.code !== 'auth/user-not-found') throw e; }
            }
            const remaining = await db.collection('users').where('displayName','==',DISPLAY).limit(20).get();
            const exact = remaining.docs.filter(d => String((d.data()||{}).email||'').toLowerCase().startsWith('soridraw044-preview-'));
            if (exact.length) throw new Error(`Synthetic 044 probe docs remain: ${exact.length}`);
            console.log('SYNTHETIC_044_CLEANUP_POSTCHECK=PASS');
            console.log('REAL_USER_DATA_CHANGED=0');
            console.log('D1_ROWS_DELETED=0');
          })().catch(e => { console.error('SYNTHETIC_044_CLEANUP_POSTCHECK=FAIL',e?.stack||e); process.exit(1); });
          NODE
