name: TEMP Validate 054 Like Edge Rate Limit

on:
  push:
    branches:
      - work/054-like-edge-rate-limit
    paths:
      - '.deploy/validate-054-like-edge-rate-limit.trigger'

permissions:
  contents: write

concurrency:
  group: temp-validate-054-like-edge-rate-limit
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout 054 work branch
        uses: actions/checkout@v4
        with:
          ref: work/054-like-edge-rate-limit
          fetch-depth: 0

      - name: Set up Node.js 22 for sqlite fixtures
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Build 054 candidate Worker offline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-worker-054
          mkdir -p .tmp-worker-054
          cp cloudflare/explore-worker/canonical/preview-worker.js .tmp-worker-054/worker.js
          export SORIDRAW_REMOTE_WORKER_DIR="$PWD/.tmp-worker-054"
          node cloudflare/explore-worker/patches/054-explore-like-edge-rate-limit.mjs
          node --check .tmp-worker-054/worker.js
          echo "SORIDRAW_GENERATED_WORKER=$PWD/.tmp-worker-054/worker.js" >> "$GITHUB_ENV"

      - name: Verify 054 edge limiter and expected W1 hot path
        run: node scripts/verify-054-like-edge-rate-limit.mjs

      - name: Verify existing Explore like cost contract
        run: node scripts/verify-explore-like-cost-optimization.mjs

      - name: Verify W1 queue and deferred aggregation
        run: |
          node scripts/verify-explore-like-w1-queue.mjs
          node scripts/verify-explore-like-stable-boundary.mjs
          node scripts/verify-explore-like-compact-queue.mjs

      - name: Verify 085-091 like regressions
        run: |
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
          node scripts/verify-087-liked-card-consistency.mjs
          node scripts/verify-088-same-session-liked-heart.mjs
          node scripts/verify-089-like-cross-device-consistency.mjs
          node scripts/verify-090-like-live-display.mjs
          node scripts/verify-091-like-count-state-machine.mjs

      - name: Verify page-exit and publication regressions
        run: |
          node scripts/verify-081-page-exit-batch.mjs
          node scripts/verify-084-publication-write-returning.mjs

      - name: Set up Node.js 20 for app contract
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build app
        run: npm run build

      - name: Set up Node.js 22 for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Wrangler config without deploy
        working-directory: cloudflare/explore-worker/canonical
        run: npx --yes wrangler@4.102.0 deploy --dry-run --config wrangler.preview.jsonc

      - name: Pin validated 054 canonical Worker on work branch
        shell: bash
        run: |
          set -euo pipefail
          cp .tmp-worker-054/worker.js cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          git config user.name 'SORIDRAW Validation Bot'
          git config user.email 'soridraw-validation-bot@users.noreply.github.com'
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          if git diff --cached --quiet; then
            echo 'No canonical Worker change to commit.'
          else
            git commit -m 'build(worker): pin validated 054 candidate'
            git push origin HEAD:work/054-like-edge-rate-limit
          fi
          echo 'VALIDATE_054_COMPLETE=PASS'
