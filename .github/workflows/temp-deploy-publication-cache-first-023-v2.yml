name: SORIDRAW Publication Cache First 023 V2 PREVIEW

on:
  push:
    branches: [preview]

permissions:
  contents: read

concurrency:
  group: soridraw-publication-cache-first-023-v2-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_SHA: 4855e62601a9efa5b3b600ac42ca11174e8d186d
      MAIN_SHA: 49c799cbb46d137539f74a48c261f7256762336f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PROD_WORKER: soridraw-explore-api
      PREVIEW_DB_NAME: soridraw-explore-preview-db
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2: soridraw-profile-media-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Guard source and main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          actual="$(git diff --name-only "$BASE_SHA" HEAD | grep -v '^.github/workflows/temp-deploy-publication-cache-first-023-v2.yml$' | sort)"
          expected=$'cloudflare/explore-worker/patches/023-publication-cache-first-mutation.mjs\nsrc/components/CacheDiagnosticsOverlay.tsx'
          test "$actual" = "$expected"
          grep -Fq "if (path === '/v1/publications') return '뮤직노트 공개 등록';" src/components/CacheDiagnosticsOverlay.tsx
          grep -Fq 'SORIDRAW_PUBLICATION_CACHE_FIRST_MUTATION_023_20260907' cloudflare/explore-worker/patches/023-publication-cache-first-mutation.mjs
          echo 'SOURCE_GUARD=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: TypeScript and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
          node --check cloudflare/explore-worker/patches/023-publication-cache-first-mutation.mjs
          echo 'APP_VALIDATE=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Snapshot PREVIEW and PRODUCTION Workers
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .remote-worker && mkdir .remote-worker
          node <<'NODE'
          const fs=require('fs');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,P=process.env.PREVIEW_WORKER,PROD=process.env.PROD_WORKER;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,800)}`);return x.result||x;}
          async function active(name){const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${name}`;const ds=await get(base+'/deployments');const d=(ds.deployments||ds||[])[0];const a=[...(d?.versions||[])].sort((x,y)=>Number(y?.percentage||0)-Number(x?.percentage||0))[0];if(!a?.version_id||Number(a?.percentage||0)<99.99)throw new Error(`active version missing: ${name}`);return {base,version:a.version_id};}
          (async()=>{const preview=await active(P),prod=await active(PROD);fs.writeFileSync('.remote-worker/preview-before.txt',preview.version);fs.writeFileSync('.remote-worker/prod-before.txt',prod.version);const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${P}/versions/${preview.version}?include=modules`);const mods=v.modules||[];const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];if(!m?.content_base64)throw new Error('PREVIEW module missing');const src=Buffer.from(m.content_base64,'base64').toString('utf8');for(const token of ['publicationRepublishSemanticUnchanged022','visibilityTransitionOnly022','handlePublicationOptionsR2Core','handleVisibilityR2Core','patchExploreProfileR2Mutation019'])if(!src.includes(token))throw new Error(`prerequisite missing ${token}`);if(src.includes('publicationResolveProfileHandle023'))throw new Error('023 appears active before deploy; abort to avoid stacking');fs.writeFileSync('.remote-worker/original.js',src);fs.writeFileSync('.remote-worker/worker.js',src);const settings=await get(`${preview.base}/settings`);const config={name:P,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-09-04').slice(0,10),workers_dev:true,keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.PREVIEW_DB_NAME,database_id:process.env.PREVIEW_DB_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PREVIEW_R2}],observability:settings.observability&&typeof settings.observability==='object'?{enabled:settings.observability.enabled!==false}:{enabled:true}};if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)config.compatibility_flags=settings.compatibility_flags;fs.writeFileSync('.remote-worker/wrangler.jsonc',JSON.stringify(config,null,2));console.log(`[snapshot] preview=${preview.version} production=${prod.version}`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Apply and validate 023
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/023-publication-cache-first-mutation.mjs
          node --check .remote-worker/worker.js
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('.remote-worker/worker.js','utf8');
          function fn(name){let p=s.indexOf(`async function ${name}(`);if(p<0)p=s.indexOf(`function ${name}(`);if(p<0)throw new Error('missing '+name);const b=s.indexOf('{',p);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i],n=s[i+1];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){const z=s.indexOf('\n',i+2);i=z<0?s.length:z;continue}if(c==='/'&&n==='*'){const z=s.indexOf('*/',i+2);i=z<0?s.length:z+1;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(p,i+1)}throw new Error('unterminated '+name)}
          const transition=fn('applyPublicationVisibilityTransition021');
          const profile=fn('patchExploreProfileR2Mutation019');
          const priv=fn('handleMusicNotePrivate017');
          const opt=fn('handleMusicNotePublicationOptions017');
          const vis=fn('handleVisibilityR2Core');
          const optRoute=fn('handlePublicationOptionsR2Core');
          const pub=fn('handleMusicNotePublicationSingleWrite016');
          if(!transition.includes('SET is_public = 1, updated_at = ?')||!transition.includes('AND is_public <> 1')||!transition.includes('AND is_public <> 0'))throw new Error('visibility transition invariant failed');
          if(profile.includes('readExploreProfileCanonicalR2Bundle020')||profile.includes('writeExploreProfileAlias020')||!profile.includes('readExploreR2Json(env, exploreProfileR2Key(normalizedUid))'))throw new Error('profile R2 fast path invariant failed');
          if(!priv.includes("mutation: 'idempotent'")||!priv.includes('Promise.allSettled'))throw new Error('private fast path invariant failed');
          if(!opt.includes("mutation: 'idempotent'")||!opt.includes('Promise.allSettled'))throw new Error('option fast path invariant failed');
          if(vis.includes('public_profiles')||optRoute.includes('public_profiles'))throw new Error('hot-path profile join remains');
          if(!pub.includes('const publishedAt = Number(previous?.published_at || 0) > 0'))throw new Error('stable publication chronology missing');
          if(!s.includes('publicationResolveProfileHandle023'))throw new Error('023 runtime helper missing');
          console.log('WORKER_023_VALIDATE=PASS');
          NODE

      - name: Deploy and verify PREVIEW Worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          rollback(){ status=$?; if [ "$status" -ne 0 ] && [ "$deployed" = 1 ]; then cp .remote-worker/original.js .remote-worker/worker.js; npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc || true; fi; exit "$status"; }
          trap rollback EXIT
          npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc
          deployed=1
          sleep 4
          node <<'NODE'
          const fs=require('fs'),A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER;async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}`);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;const ds=await get(base+'/deployments');const d=(ds.deployments||ds||[])[0];const a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];const before=fs.readFileSync('.remote-worker/preview-before.txt','utf8').trim();if(!a?.version_id||a.version_id===before)throw new Error('PREVIEW version unchanged');const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${a.version_id}?include=modules`);const mods=v.modules||[];const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];const src=Buffer.from(m.content_base64,'base64').toString('utf8');for(const token of ['publicationResolveProfileHandle023','readExploreR2Json(env, exploreProfileR2Key(normalizedUid))','AND is_public <> 1','AND is_public <> 0'])if(!src.includes(token))throw new Error('deployed runtime missing '+token);fs.writeFileSync('.remote-worker/preview-after.txt',a.version_id);console.log('[deployed] preview='+a.version_id)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test "$(curl -sS -o /tmp/feed.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/feed?sort=latest&limit=1")" = '200'
          test "$(curl -sS -o /tmp/genres.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/genres")" = '200'
          test "$(curl -sS -o /tmp/pub.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" -H 'Content-Type: application/json' -X POST --data '{}' "$PREVIEW_BASE/v1/publications")" = '401'
          trap - EXIT
          echo 'PREVIEW_WORKER_DEPLOY=PASS'

      - name: Firebase auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot PRODUCTION Hosting and deploy PREVIEW Hosting
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          prod_sha="$(sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}')"
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                test "$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')" = "$local_sha" && ok=yes && break
              fi
              sleep 10
            done
            test "$ok" = yes
            echo "EXACT_BUILD_PASS=$url"
          done
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          test "$(sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}')" = "$prod_sha"
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'
          echo 'PRODUCTION_HOSTING_UNCHANGED=PASS'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'

      - name: Verify main and PRODUCTION Worker unchanged
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          node <<'NODE'
          const fs=require('fs'),A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PROD_WORKER;async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}`);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;const ds=await get(base+'/deployments');const d=(ds.deployments||ds||[])[0];const a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];const before=fs.readFileSync('.remote-worker/prod-before.txt','utf8').trim();if(a?.version_id!==before)throw new Error('PRODUCTION Worker changed');console.log('MAIN_PRODUCTION_WORKER_UNCHANGED=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Package clean deployed source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zipname="SORIDRAW_PREVIEW_023_publication_cache_first_$(git rev-parse --short=8 HEAD).zip"
          git archive --format=zip --output="$zipname" HEAD -- . ':(exclude).github/workflows/temp-deploy-publication-cache-first-023-v2.yml'
          test -s "$zipname"
          echo "ZIP_NAME=$zipname" >> "$GITHUB_ENV"
          sha256sum "$zipname"

      - uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_023_publication_cache_first
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
