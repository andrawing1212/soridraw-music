name: TEMP Verify 118 Explicit Like Intent
# rerun: 3

on:
  push:
    branches:
      - fix/explore-like-explicit-intent-118
    paths:
      - .github/workflows/temp-verify-118-explicit-like.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Explicit like intent regression
        run: node scripts/verify-118-explore-like-explicit-intent.mjs
      - name: Public count separation regression
        run: node scripts/verify-117-explore-public-count-cache-separation.mjs
      - name: Public count convergence regression
        run: node scripts/verify-116-explore-public-count-convergence.mjs
      - name: Worker desired-state queue regression
        run: node scripts/verify-explore-like-w1-queue.mjs
