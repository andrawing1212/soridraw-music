name: APP780 APP518 isolated QA inventory and bounded schema preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: soridraw-app780-app518-isolated-resource-inventory
  cancel-in-progress: false

jobs:
  qa_resource_inventory:
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-resources 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Existing isolated QA Cloudflare account metadata, strictly GET only
        env:
          CF_QA_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
          CF_QA_STORAGE_TOKEN: ${{ secrets.CLOUDFLARE_QA_STORAGE_READ_TOKEN }}
          CF_QA_ACCOUNT: b60fcd62c679c64db19f0b0e0c2f3429
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const ACCOUNT=process.env.CF_QA_ACCOUNT||'';
          const TOKEN=process.env.CF_QA_TOKEN||'';
          const STORAGE_TOKEN=process.env.CF_QA_STORAGE_TOKEN||'';
          const PRODUCTION='e1a30fc9ef497fda1d34f4ab3dc1da45';
          const SHA='864f796da24413309567198c9de502b13cdedd50';
          const report={scope:'APP780_APP518_QA_RESOURCE_INVENTORY_GET_ONLY',
            candidate_sha:SHA,production_account_touched:false,
            shared_data_reads:0,cloudflare_mutations:0,existing_qa_account_separate:false,
            qa_d1:'UNVERIFIED',qa_r2:'UNVERIFIED',qa_workers:'UNVERIFIED',
            firebase_qa_functions:'UNVERIFIED',billing_and_write_access:'UNVERIFIED',
            app518_live_ready:false};
          if(!/^[a-f0-9]{32}$/.test(ACCOUNT)||ACCOUNT===PRODUCTION||TOKEN.length<15){
            console.log(JSON.stringify({...report,hold:'ISOLATED_QA_ACCOUNT_OR_AUTH_UNVERIFIED'}));
            process.exitCode=2;
          }else{
            report.existing_qa_account_separate=true;
            report.qa_storage_read_token_configured=STORAGE_TOKEN.length>=15;
            const base='https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT;
            // Verify token types without printing token, id, account profile or policies.
            const verify=async(url)=>{
              try{
                const res=await fetch(url,{method:'GET',redirect:'error',
                  headers:{Authorization:'Bearer '+TOKEN,Accept:'application/json'},
                  signal:AbortSignal.timeout(12000)});
                if(res.status!==200)return {http:res.status,active:false};
                const data=await res.json();
                return {http:200,active:data?.success===true&&data?.result?.status==='active'};
              }catch{return {http:'NETWORK_HOLD',active:false}}
            };
            const [userVerify,accountVerify]=await Promise.all([
              verify('https://api.cloudflare.com/client/v4/user/tokens/verify'),
              verify(base+'/tokens/verify'),
            ]);
            report.token_verification={
              user_token:userVerify,account_token:accountVerify,
              used_for_worker_list_only:true,
            };
            const request=async(path)=>{
              const needsStorage=path.startsWith('/d1/')||path.startsWith('/r2/');
              const credential=needsStorage?STORAGE_TOKEN:TOKEN;
              if(credential.length<15)return {
                status:'HOLD_QA_STORAGE_READ_TOKEN_NOT_CONFIGURED',items:[]};
              try{
                const response=await fetch(base+path,{method:'GET',redirect:'error',
                  headers:{Authorization:'Bearer '+credential,Accept:'application/json'},
                  signal:AbortSignal.timeout(12000)});
                if(response.status!==200)return {status:'HOLD_METADATA_HTTP_'+response.status,items:[]};
                const payload=await response.json();
                if(payload?.success!==true)return {status:'HOLD_API_REJECTED',items:[]};
                const result=payload.result;
                const rows=Array.isArray(result)?result:
                  Array.isArray(result?.buckets)?result.buckets:
                  Array.isArray(result?.databases)?result.databases:
                  Array.isArray(result?.scripts)?result.scripts:null;
                if(!rows)return {status:'HOLD_UNEXPECTED_RESPONSE_SHAPE',items:[]};
                if(rows.length>100)return {status:'HOLD_PAGE_TOO_LARGE',items:[]};
                return {status:'PASS',items:rows};
              }catch{
                return {status:'HOLD_METADATA_NETWORK_OR_PARSE',items:[]};
              }
            };
            const [d1,r2,workers]=await Promise.all([
              request('/d1/database?per_page=100&page=1'),
              request('/r2/buckets?per_page=100'),
              request('/workers/scripts?per_page=100')
            ]);
            for(const [key,res] of [['qa_d1',d1],['qa_r2',r2],['qa_workers',workers]]){
              const named=res.items.filter(x=>
                /^soridraw-app518-qa(?:-|$)/.test(String(x?.name||x?.bucket_name||'')));
              report[key]={query:res.status,visible_count:res.items.length,
                explicit_app518_qa_candidate_count:named.length};
            }
            // APP518: pin the exact existing QA-only resources before any
            // independent one-song cloud QA is even considered. Count-only
            // evidence; do not print DB UUIDs, raw payloads, or credentials.
            const onlyOneExact=(resource,name,getName)=>
              resource.status==='PASS'&&resource.items.length===1&&
              getName(resource.items[0])===name;
            report.existing_qa_resources={
              d1_name_exact:onlyOneExact(d1,'soridraw-qa-app768-d1',x=>x?.name),
              r2_name_exact:onlyOneExact(r2,'soridraw-qa-app768-r2',x=>x?.name||x?.bucket_name),
              worker_name_exact:onlyOneExact(workers,'soridraw-owner-qa-583',x=>x?.name||x?.id),
            };
            report.existing_qa_resources_exact=Object.values(report.existing_qa_resources)
              .every(Boolean);
            // The preexisting single QA D1 does not prove the two distinct
            // account/outbox bindings required by APP518's manifest.
            report.app518_required_outbox_budget_pair_proved=false;
            report.hold=d1.status!=='PASS'||r2.status!=='PASS'||workers.status!=='PASS'
              ?'QA_RESOURCE_METADATA_INCOMPLETE'
              :d1.items.length===0||r2.items.length===0
                ?'APP518_QA_D1_OR_R2_NOT_PROVISIONED'
                :'EXACT_APP518_QA_RESOURCE_PROOF_AND_WRITE_BILLING_AUTH_STILL_REQUIRED';
            if(!report.existing_qa_resources_exact)
              report.hold='EXACT_PREEXISTING_QA_RESOURCE_NAMES_UNVERIFIED';
            // A different account and matching resource names cannot authorize
            // Cloudflare writes, Firebase service deployment, or real user data access.
            console.log(JSON.stringify(report));
          }
          NODE


  qa_schema_inventory:
    # One-shot schema read: Cloudflare D1 uses HTTP POST even for SQL SELECT.
    # Not a storage mutation, and separate from the original GET-only job.
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-schema 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Verify original QA Worker and exact D1 schema (bounded metadata only)
        env:
          CF_QA_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
          CF_QA_STORAGE_TOKEN: ${{ secrets.CLOUDFLARE_QA_STORAGE_READ_TOKEN }}
          CF_QA_DATA_TOKEN: ${{ secrets.CLOUDFLARE_QA_DATA_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const ACCOUNT='b60fcd62c679c64db19f0b0e0c2f3429';
          const PRODUCTION='e1a30fc9ef497fda1d34f4ab3dc1da45';
          const ORIGINAL_VERSION='4ed70845-6a4b-4a80-9c51-ed95d0becc38';
          const OLD_WORKER='soridraw-owner-qa-583',DB_NAME='soridraw-qa-app768-d1';
          const WORKER=process.env.CF_QA_WORKER_TOKEN||'';
          const STORAGE=process.env.CF_QA_STORAGE_TOKEN||'';
          const DATA=process.env.CF_QA_DATA_TOKEN||'';
          const BASE='https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT;
          const report={scope:'APP781_APP518_QA_D1_SCHEMA_AND_WORKER_READ_ONLY',
            production_account_touched:false,shared_user_rows_read:0,
            cloudflare_mutations:0,d1_sql_writes:0,app518_live_enabled:false,
            exact_qa_d1:false,original_qa_worker_protected:false,
            qa_schema:'UNVERIFIED',hold:'PREFLIGHT_NOT_COMPLETE'};
          const finish=()=>console.log(JSON.stringify(report));
          if(ACCOUNT===PRODUCTION||[WORKER,STORAGE,DATA].some(t=>t.length<20)){
            report.hold='QA_READ_OR_DATA_CREDENTIAL_MISSING';finish();process.exit(0);
          }
          const get=async(path,token)=>{
            const res=await fetch(BASE+path,{method:'GET',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              signal:AbortSignal.timeout(15000)});
            if(res.status!==200)return {ok:false,status:res.status};
            const body=await res.json().catch(()=>null);
            return {ok:body?.success===true,status:res.status,result:body?.result};
          };
          try{
            const [dbs,deploy,settings]=await Promise.all([
              get('/d1/database?per_page=100&page=1',STORAGE),
              get('/workers/scripts/'+OLD_WORKER+'/deployments',WORKER),
              get('/workers/scripts/'+OLD_WORKER+'/settings',WORKER)
            ]);
            const rows=Array.isArray(dbs.result)?dbs.result:
              Array.isArray(dbs.result?.databases)?dbs.result.databases:null;
            const versions=deploy.result?.deployments?.[0]?.versions;
            const bindings=settings.result?.bindings;
            const uniqueNames=Array.isArray(bindings)&&new Set(
              bindings.map(b=>b?.name)).size===bindings.length;
            const protectedBindings=uniqueNames&&bindings.length>=4&&bindings.length<=8
              &&bindings.some(b=>b.name==='OWNER558_DO'&&b.type==='durable_object_namespace')
              &&bindings.some(b=>b.name==='OWNER583_QA_CONFIG'&&b.type==='secret_text')
              &&bindings.every(b=>!['d1','r2_bucket'].includes(b.type));
            report.original_qa_worker_protected=deploy.ok&&settings.ok&&
              Array.isArray(versions)&&versions.length===1&&
              versions[0].version_id===ORIGINAL_VERSION&&
              Number(versions[0].percentage)>=99.99&&protectedBindings;
            report.exact_qa_d1=dbs.ok&&Array.isArray(rows)&&rows.length===1&&
              rows[0]?.name===DB_NAME&&
              /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(rows[0]?.uuid||'');
            if(!report.exact_qa_d1||!report.original_qa_worker_protected){
              report.hold='QA_ACCOUNT_D1_OR_PROTECTED_WORKER_NOT_PROVED';
              report.evidence={d1_get_http:dbs.status,worker_settings_http:settings.status,
                worker_deployment_http:deploy.status};
              finish();process.exit(0);
            }
            // Constant SQL only inspects SQLite schema labels. No user data.
            const sql="SELECT name FROM sqlite_master WHERE type='table' AND name IN ("+
              "'app768_qa_synthetic_follow','music_note_catalog_outbox_518',"+
              "'music_note_catalog_index_meta_518','music_note_catalog_daily_write_budget_518')"+
              " ORDER BY name LIMIT 8";
            const res=await fetch(BASE+'/d1/database/'+rows[0].uuid+'/query',{
              method:'POST',redirect:'error',
              headers:{Authorization:'Bearer '+DATA,Accept:'application/json',
                'Content-Type':'application/json'},
              body:JSON.stringify({sql}),signal:AbortSignal.timeout(15000)
            });
            if(res.status!==200){
              report.hold='QA_READONLY_D1_SCHEMA_QUERY_HTTP_'+res.status;
              finish();process.exit(0);
            }
            const body=await res.json().catch(()=>null);
            const q=Array.isArray(body?.result)&&body.result.length===1?
              body.result[0]:null;
            if(body?.success!==true||q?.success!==true||!Array.isArray(q.results)||
              q.results.length>8||q.results.some(x=>typeof x?.name!=='string')||
              Number(q.meta?.rows_written)!==0){
              report.hold='QA_D1_SCHEMA_RESPONSE_OR_W0_NOT_PROVED';
              finish();process.exit(2);
            }
            const names=new Set(q.results.map(x=>x.name));
            report.qa_schema={
              query:'PASS_SELECT_SCHEMA_ONLY',
              d1_meta_rows_written:0,
              known_app768_synthetic_table:names.has('app768_qa_synthetic_follow'),
              app518_outbox_table_present:names.has('music_note_catalog_outbox_518'),
              app518_index_table_present:names.has('music_note_catalog_index_meta_518'),
              app518_budget_table_present:names.has('music_note_catalog_daily_write_budget_518')
            };
            report.hold='APP518_EXACT_SOURCE_AND_WORKER_RELEASE_PROOF_REQUIRED';
            finish();
          }catch{
            report.hold='QA_READONLY_PREFLIGHT_NETWORK_OR_PARSE';finish();
            process.exit(0);
          }
          NODE


  qa_worker_dryrun:
    # Exact PR #528 candidate; cannot upload, deploy or route traffic.
    if: >-
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 528 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/app518-qa-bundle 864f796da24413309567198c9de502b13cdedd50'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 864f796da24413309567198c9de502b13cdedd50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin exact inert QA source and generate nondeployable template
        env:
          CF_QA_STORAGE_TOKEN: ${{ secrets.CLOUDFLARE_QA_STORAGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 864f796da24413309567198c9de502b13cdedd50
          node scripts/verify-518-isolated-qa-setup.mjs --self-test
          cd cloudflare/media-worker
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const t=JSON.parse(readFileSync('wrangler.app518-isolated-qa.jsonc.template','utf8'));
          assert.equal(t.main,'./src/app518IsolatedQaWorker518.js');
          assert.equal(t.workers_dev,false);
          assert.equal(t.keep_vars,false);
          t.name='soridraw-app518-qa-dryrun-only';
          t.account_id='b60fcd62c679c64db19f0b0e0c2f3429';
          t.vars.FIREBASE_PROJECT_ID='soridraw-app';
          t.vars.FIREBASE_PROJECT_NUMBER='1083981050742';
          t.vars.SORIDRAW_APP518_PILOT_UID='qa518-dryrun-owner';
          t.vars.SORIDRAW_APP518_PILOT_FAVORITE_ID='qa518-dryrun-song';
          t.vars.SORIDRAW_APP518_QA_ACCOUNT_ID_518=t.account_id;
          // Exact, GET-only Cloudflare QA lookup. Never access PRODUCTION.
          const account='b60fcd62c679c64db19f0b0e0c2f3429';
          const token=process.env.CF_QA_STORAGE_TOKEN||'';
          assert(token.length>=20,'QA_READ_TOKEN_MISSING');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          const get=async(path)=>{
            const resp=await fetch(base+path,{
              method:'GET',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              signal:AbortSignal.timeout(15000)
            });
            assert.equal(resp.status,200,'QA_BINDING_METADATA_HTTP');
            const body=await resp.json();
            assert.equal(body?.success,true,'QA_BINDING_METADATA_REJECTED');
            return body.result;
          };
          const [d,b]=await Promise.all([
            get('/d1/database?per_page=100&page=1'),
            get('/r2/buckets?per_page=100')
          ]);
          const databases=Array.isArray(d)?d:d?.databases;
          const buckets=Array.isArray(b)?b:b?.buckets;
          assert.equal(databases?.length,1,'QA_ONE_D1_EXACT');
          assert.equal(buckets?.length,1,'QA_ONE_R2_EXACT');
          assert.equal(databases[0]?.name,'soridraw-qa-app768-d1');
          assert.equal(buckets[0]?.name||buckets[0]?.bucket_name,'soridraw-qa-app768-r2');
          const uuid=databases[0]?.uuid;
          assert(/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(uuid||''),
            'QA_D1_UUID_INVALID');
          t.r2_buckets[0].bucket_name='soridraw-qa-app768-r2';
          assert.equal(t.d1_databases.length,2,'QA_APP518_EXACTLY_TWO_BINDINGS');
          for(const binding of t.d1_databases){
            assert(['CATALOG_OUTBOX_518','ACCOUNT_D1_BUDGET_518'].includes(binding.binding));
            binding.database_name='soridraw-qa-app768-d1';
            // Two isolated QA bindings to the same EXISTING D1; no new DB.
            binding.database_id=uuid;
          }
          for(const k of ['SORIDRAW_CANONICAL_CATALOG_518',
            'SORIDRAW_APP518_RELEASE_FENCES_VERIFIED',
            'SORIDRAW_D1_ALL_ACCOUNT_WRITERS_518',
            'SORIDRAW_D1_SHARED_ACCOUNT_LEDGER_518',
            'SORIDRAW_APP518_QA_RELEASE_518'])
            assert.equal(t.vars[k],'0');
          assert.equal(t.workers_dev,false);
          assert(!('routes' in t)&&!('triggers' in t));
          writeFileSync('wrangler.app518-dryrun-only.generated.json',JSON.stringify(t));
          console.log('APP518_QA_EXISTING_D1_R2_REAL_BINDING_CONFIG=PASS; TWO_D1_BINDINGS_ONE_EXISTING_QA_DATABASE; CLOUD_MUTATIONS=0');
          NODE
      - name: Bundle exact APP518 isolated QA Worker (Wrangler dry-run only)
        working-directory: cloudflare/media-worker
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-save
          npx --yes wrangler@4.147.0 deploy --dry-run \
            --config wrangler.app518-dryrun-only.generated.json \
            --outdir "$RUNNER_TEMP/app518-qa-inert-bundle"
          test -d "$RUNNER_TEMP/app518-qa-inert-bundle"
          echo 'APP518_REAL_WRANGLER_BUNDLE=PASS_DRY_RUN'
          echo 'APP518_QA_DEPLOY=0; FIREBASE_OR_CLOUDFLARE_CALLS=0; ACTIVE_GATES=OFF'
