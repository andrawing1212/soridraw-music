name: SORIDRAW APP665 active owner relay GET-only and candidate check
on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/app665-active-owner-relay-get.mjs'
      - '.github/workflows/app665-owner-relay-readonly.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/app665-active-owner-relay-get.mjs
