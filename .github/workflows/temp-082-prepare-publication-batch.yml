name: TEMP 082 Prepare Publication Batch

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-082-prepare-publication-batch.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-082-publication-batch
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Finalize 082 source and safety guards
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              return text.replace(old,new,1)

          # 1) Harden Worker 049 before it is ever canonicalized.
          p=Path('cloudflare/explore-worker/patches/049-publication-internal-batch-compaction.mjs')
          s=p.read_text(encoding='utf-8')
          if 'let canonicalReadOk = true;' not in s:
              s=replace_once(
                  s,
                  '    let canonicalRows = [];\n    try {',
                  '    let canonicalRows = [];\n    let canonicalReadOk = true;\n    try {',
                  'canonical read flag',
              )
              s=replace_once(
                  s,
                  "    } catch (error) {\n      for (const mutation of registeredMutations) {\n        resultsBySource.set(mutation.sourceId, {\n          ok: false,\n          sourceId: mutation.sourceId,\n          trackId: mutation.trackId,\n          status: mutation.status,\n          registered: true,\n          error: String(error?.message || error || 'PUBLICATION_BATCH_READ_FAILED'),\n        });\n      }\n    }\n\n    if (canonicalRows.length || registeredMutations.every((mutation) => resultsBySource.has(mutation.sourceId))) {",
                  "    } catch (error) {\n      canonicalReadOk = false;\n      for (const mutation of registeredMutations) {\n        resultsBySource.set(mutation.sourceId, {\n          ok: false,\n          sourceId: mutation.sourceId,\n          trackId: mutation.trackId,\n          status: mutation.status,\n          registered: true,\n          error: String(error?.message || error || 'PUBLICATION_BATCH_READ_FAILED'),\n        });\n      }\n    }\n\n    if (canonicalReadOk) {",
                  'canonical read branch',
              )
              s=replace_once(
                  s,
                  "        if (!statsReady) {\n          for (const item of direct) fallback.push(item);\n        } else {",
                  "        if (!statsReady) {\n          for (const item of direct) {\n            resultsBySource.set(item.mutation.sourceId, {\n              ok: false,\n              sourceId: item.mutation.sourceId,\n              trackId: item.mutation.trackId,\n              status: item.mutation.status,\n              registered: true,\n              error: 'PUBLICATION_BATCH_STATS_PREFLIGHT_FAILED',\n            });\n          }\n        } else {",
                  'stats failure retry guard',
              )
          p.write_text(s,encoding='utf-8')

          # 2) Long-absent/warm device must not trust stale local state when the shared R2 snapshot is missing.
          p=Path('src/services/explorePublicationService.ts')
          s=p.read_text(encoding='utf-8')
          if 'SORIDRAW_PUBLICATION_MISSING_R2_REPAIR_082_20260914' not in s:
              s=replace_once(
                  s,
                  "        if (!exists) {\n          publicationServerValidatedUids.add(uid);\n          return clonePublicationStates(cached);\n        }",
                  "        if (!exists) {\n          // SORIDRAW_PUBLICATION_MISSING_R2_REPAIR_082_20260914\n          // A missing shared snapshot is a repair signal, not proof that this device cache is current.\n          // Fall through to the bundle route; the Worker rebuilds once from canonical D1 and repopulates R2.\n          knownRevision = '';\n        }",
                  'missing R2 warm-cache repair',
              )
          p.write_text(s,encoding='utf-8')

          # 3) 082 is a real frontend behavior change, so expose an update to PREVIEW users.
          p=Path('public/app-version.json')
          s=p.read_text(encoding='utf-8')
          if '"082"' not in s:
              s=replace_once(s,'"081"','"082"','app version')
          p.write_text(s,encoding='utf-8')

          # 4) Keep the permanent cost verifier aligned with the release manifest.
          p=Path('scripts/verify-explore-like-cost-optimization.mjs')
          s=p.read_text(encoding='utf-8')
          old="""assert.equal(manifest.patches.at(-4), '045-publication-revision-metadata.mjs', '045 must remain before 046/047/048');
          assert.equal(manifest.patches.at(-3), '046-publication-write-compaction.mjs', '046 must remain before 047/048');
          assert.equal(manifest.patches.at(-2), '047-publication-state-transition.mjs', '047 must remain before 048');
          assert.equal(manifest.patches.at(-1), '048-page-exit-publication-batch.mjs', '048 page-exit publication batch must be final');"""
          new="""assert.equal(manifest.patches.at(-5), '045-publication-revision-metadata.mjs', '045 must remain before 046/047/048/049');
          assert.equal(manifest.patches.at(-4), '046-publication-write-compaction.mjs', '046 must remain before 047/048/049');
          assert.equal(manifest.patches.at(-3), '047-publication-state-transition.mjs', '047 must remain before 048/049');
          assert.equal(manifest.patches.at(-2), '048-page-exit-publication-batch.mjs', '048 must remain before 049');
          assert.equal(manifest.patches.at(-1), '049-publication-internal-batch-compaction.mjs', '049 internal publication batch must be final');"""
          if old in s:
              s=s.replace(old,new,1)
          elif "049 internal publication batch must be final" not in s:
              raise SystemExit('like verifier release-patch anchor missing')
          p.write_text(s,encoding='utf-8')

          # 5) Permanent 082 regression verifier.
          verifier=Path('scripts/verify-082-publication-batch.mjs')
          verifier.write_text(r'''import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const workerPath = process.env.SORIDRAW_GENERATED_WORKER || 'cloudflare/explore-worker/canonical/preview-worker.js';
          const worker = readFileSync(workerPath, 'utf8');
          const client = readFileSync('src/services/explorePublicationService.ts', 'utf8');
          const patch = readFileSync('cloudflare/explore-worker/patches/049-publication-internal-batch-compaction.mjs', 'utf8');
          const version = JSON.parse(readFileSync('public/app-version.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('cloudflare/explore-worker/release-patches.json', 'utf8'));

          const functionText = (source, name) => {
            const needles=[`async function ${name}(`,`function ${name}(`];
            let start=-1;
            for(const needle of needles){ start=source.indexOf(needle); if(start>=0) break; }
            assert.ok(start>=0,`missing function ${name}`);
            const brace=source.indexOf('{',start);
            let depth=0,quote='',escaped=false,comment='';
            for(let i=brace;i<source.length;i+=1){
              const c=source[i],n=source[i+1];
              if(comment==='line'){ if(c==='\n') comment=''; continue; }
              if(comment==='block'){ if(c==='*'&&n==='/'){comment='';i+=1;} continue; }
              if(quote){ if(escaped) escaped=false; else if(c==='\\') escaped=true; else if(c===quote) quote=''; continue; }
              if(c==='/'&&n==='/'){comment='line';i+=1;continue;}
              if(c==='/'&&n==='*'){comment='block';i+=1;continue;}
              if('"\'`'.includes(c)){quote=c;continue;}
              if(c==='{') depth+=1;
              if(c==='}'&&--depth===0) return source.slice(start,i+1);
            }
            throw new Error(`unterminated function ${name}`);
          };

          assert.equal(String(version.version),'082');
          assert.equal(manifest.patches.at(-1),'049-publication-internal-batch-compaction.mjs');
          assert.match(worker,/SORIDRAW_PUBLICATION_INTERNAL_BATCH_049_20260914/);
          assert.match(client,/SORIDRAW_PUBLICATION_MISSING_R2_REPAIR_082_20260914/);
          assert.match(client,/if \(!exists\) \{[\s\S]{0,500}knownRevision = '';/);
          assert.doesNotMatch(client,/if \(!exists\) \{\s*publicationServerValidatedUids\.add\(uid\);\s*return clonePublicationStates\(cached\);/);
          assert.match(client,/\/v1\/me\/music-note-publications-bundle/);

          const batch=functionText(worker,'handleMusicNotePublicationBatch048');
          assert.match(batch,/SELECT \* FROM tracks[\s\S]*owner_uid=\? AND id IN/);
          assert.match(batch,/env\.DB\.batch\(statements\)/);
          assert.match(batch,/if \(Number\(item\.row\.profile_pinned \|\| 0\) !== nextPinned\) \{ sets\.push\('profile_pinned=\?'\)/);
          assert.match(batch,/PUBLICATION_BATCH_STATS_PREFLIGHT_FAILED/);
          assert.doesNotMatch(batch,/buildMusicNotePublicationR2Payload/);
          const batchR2=functionText(worker,'syncMusicNotePublicationR2Batch049');
          assert.match(batchR2,/readMusicNotePublicationR2Payload/);
          assert.match(batchR2,/writeMusicNotePublicationR2Payload/);
          assert.doesNotMatch(batchR2,/buildMusicNotePublicationR2Payload/);
          const cold=functionText(worker,'handleMusicNotePublicationR2Bundle');
          assert.match(cold,/buildMusicNotePublicationR2Payload/,'cold/missing R2 must still rebuild once from canonical D1');
          const singleSync=functionText(worker,'syncMusicNotePublicationR2AfterMutation');
          assert.doesNotMatch(singleSync,/buildMusicNotePublicationR2Payload/,'mutation hot path must never owner-scan D1');
          assert.match(patch,/let canonicalReadOk = true;/);
          assert.match(patch,/PUBLICATION_BATCH_STATS_PREFLIGHT_FAILED/);
          console.log('PASS 082: registered publication changes share canonical reads/batch writes; missing R2 forces one canonical self-heal; healthy warm cache remains revision-first.');
          ''',encoding='utf-8')

          # 6) Make the permanent PREVIEW Worker gate run the 082 regression too.
          p=Path('.github/workflows/cloudflare-explore-preview-release.yml')
          s=p.read_text(encoding='utf-8')
          if 'verify-082-publication-batch.mjs' not in s:
              anchor='            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs\n'
              if anchor not in s:
                  raise SystemExit('worker release verifier anchor missing')
              s=s.replace(anchor,anchor+'            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-082-publication-batch.mjs\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply Worker 049 to canonical PREVIEW source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/worker049"
          mkdir -p "$tmp"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$tmp/worker.js"
          (
            cd cloudflare/explore-worker
            SORIDRAW_REMOTE_WORKER_DIR="$tmp" node patches/049-publication-internal-batch-compaction.mjs
          )
          cp "$tmp/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node --check cloudflare/explore-worker/canonical/preview-entry.js
          test "$(grep -c 'SORIDRAW_PUBLICATION_INTERNAL_BATCH_049_20260914' cloudflare/explore-worker/canonical/preview-worker.js)" = 1

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and build
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build

      - name: 082 cost and regression suite
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-080-publication-state-engine.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-082-publication-batch.mjs
          node scripts/verify-explore-deploy-preflight.mjs
          if git diff --name-only HEAD | grep -q '^cloudflare/explore-worker/migrations/'; then
            echo '082 must not change shared D1 migrations' >&2
            exit 1
          fi
          echo 'SHARED_D1_SCHEMA_CHANGE=0'

      - name: Commit verified 082 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add \
            cloudflare/explore-worker/patches/049-publication-internal-batch-compaction.mjs \
            cloudflare/explore-worker/canonical/preview-worker.js \
            cloudflare/explore-worker/canonical/source-sha256.txt \
            src/services/explorePublicationService.ts \
            public/app-version.json \
            scripts/verify-explore-like-cost-optimization.mjs \
            scripts/verify-082-publication-batch.mjs \
            .github/workflows/cloudflare-explore-preview-release.yml
          git diff --cached --check
          git commit -m 'fix(preview): compact 082 publication sync and repair stale snapshots'
          git push origin HEAD:preview
