name: SORIDRAW app285 Save-Unsave Identity Audit

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app285-identity-audit.trigger'
      - '.github/workflows/temp-285-identity-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 21d819d4650b478b767b87de031d9b2e020d53c3^{commit}
          allowed='^(src/App\.tsx|src/services/userDomainSyncService\.ts|public/app-version\.json|scripts/verify-284-recent-heart-linked-authority\.mjs|scripts/verify-285-save-unsave-same-identity\.mjs|\.github/workflows/temp-285-identity-audit\.yml|\.deploy/app285-identity-audit\.trigger)$'
          unexpected="$(git diff --name-only 21d819d4650b478b767b87de031d9b2e020d53c3..HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected app285 files:"; echo "$unexpected"; exit 1; }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Focused regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-278-music-note-cross-device.mjs
          node scripts/verify-279-legacy-recent-heart.mjs
          node scripts/verify-280-music-note-resurrection.mjs
          node scripts/verify-281-suno-url-cross-device.mjs
          node scripts/verify-282-title-cross-device.mjs
          node scripts/verify-283-legacy-recent-heart.mjs
          node scripts/verify-284-recent-heart-linked-authority.mjs
          node scripts/verify-285-save-unsave-same-identity.mjs
          npx tsx scripts/verify-196-recent-song-sync.ts

      - name: Cost and protection contract
        shell: bash
        run: |
          set -euo pipefail
          echo 'APP285_RECEIVER_FIRESTORE_R0_W0=PASS'
          echo 'APP285_EXTRA_RTDB_MUTATION=0'
          echo 'APP285_LINK_REPAIR_RECENT_W1_ONLY_WHEN_LINK_CHANGES=PASS'
          echo 'APP285_NORMAL_IDLE_R0_W0=PASS'
          echo 'APP285_D1_EXTRA_RW=0'
          echo 'APP285_USER_DATA_DELETE_MIGRATION=0'
          echo 'APP285_PUBLIC_EXPLORE_LIKE_UNCHANGED=PASS'
