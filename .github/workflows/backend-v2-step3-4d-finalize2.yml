name: SORIDRAW Backend V2 Step 3-4d Finalize 2

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4d-finalize2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Apply master patch
        run: python3 .deploy/backend_v2_step3_4d_master_patch.py
      - name: Validate
        run: |
          set -e
          git diff --exit-code -- . ':!docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md' ':!.deploy/backend_v2_step3_4d_master_patch.py' ':!.github/workflows/backend-v2-step3-4d-finalize2.yml'
          grep -F 'Step 3-4d playlist-item limited backfill complete and verified' docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md >/dev/null
          grep -F '3-4d Playlist-item limited backfill complete: 49 items' docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md >/dev/null
      - name: Commit and clean temporary helpers
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git rm .deploy/backend_v2_step3_4d_master_patch.py .github/workflows/backend-v2-step3-4d-finalize2.yml
          git commit -m 'docs: mark Backend V2 Step 3-4d playlist items complete'
          git push origin HEAD:preview
