name: SORIDRAW Stage4 Recent + MusicNote Safety 2026-09-05

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-stage4-recent-musicnote-safety-20260905.yml'

permissions:
  contents: write

jobs:
  apply-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 5

      - name: Verify expected baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0e3e05b25cbc1f1bd41470b091a3fe453525e378" || {
            echo "preview HEAD moved before stage4 apply; refusing stale patch"
            git rev-parse HEAD
            exit 20
          }

      - name: Apply bounded-cost and stale-write fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(before, after, 1)

          recent_anchor = "const getRecentSongsVersionStorageKey = (uid: string) => `${RECENT_SONGS_LOCAL_SYNC_VERSION_STORAGE_BASE}_${uid}`;\n"
          recent_helpers = recent_anchor + """const RECENT_SONGS_MUTATION_EPOCH_STORAGE_BASE = 'soridraw_recent_songs_mutation_epoch_v1';
          const recentSongsWriteQueues = new Map<string, Promise<any>>();

          const getRecentSongsMutationEpochStorageKey = (uid: string) => `${RECENT_SONGS_MUTATION_EPOCH_STORAGE_BASE}_${uid}`;
          const readRecentSongsMutationEpoch = (uid: string): number => {
            if (!uid || typeof localStorage === 'undefined') return 0;
            try {
              const value = Number(localStorage.getItem(getRecentSongsMutationEpochStorageKey(uid)) || 0);
              return Number.isFinite(value) && value >= 0 ? Math.floor(value) : 0;
            } catch {
              return 0;
            }
          };
          const bumpRecentSongsMutationEpoch = (uid: string): number => {
            if (!uid) return 0;
            const next = Math.max(Date.now(), readRecentSongsMutationEpoch(uid) + 1);
            if (typeof localStorage !== 'undefined') {
              try { localStorage.setItem(getRecentSongsMutationEpochStorageKey(uid), String(next)); } catch {}
            }
            return next;
          };
          """
          app = replace_once(app, recent_anchor, recent_helpers, 'recent mutation helpers')

          persist_start = app.index("const persistRecentSongsDocument = async (ref: any, songs: any[]) => {")
          persist_end = app.index("const SORIDRAW_904_MUSIC_NOTE_LAZY_BUNDLE_ENTRY_RUNTIME", persist_start)
          persist_replacement = """const persistRecentSongsDocument = async (
            ref: any,
            songs: any[],
            expectedMutationEpoch?: number,
          ): Promise<number | null> => {
            const uid = String(ref?.id || '').trim();

            const writeLatest = async (): Promise<number | null> => {
              if (
                uid
                && Number.isFinite(expectedMutationEpoch)
                && Number(expectedMutationEpoch) !== readRecentSongsMutationEpoch(uid)
              ) {
                return null;
              }

              const previousVersion = uid ? readRecentSongsLocalVersion(uid) : 0;
              const syncVersion = Math.max(Date.now(), previousVersion + 1);

              await setDoc(ref, sanitizeForFirestore({ songs, syncVersion }), { merge: true });
              markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);

              if (!uid) return syncVersion;
              writeRecentSongsLocalVersion(uid, syncVersion);

              try {
                await updateDoc(doc(db, 'users', uid), { 'syncVersions.recentSongs': syncVersion });
                const cachedProfile = readUserProfileCache(uid);
                if (cachedProfile) {
                  writeUserProfileCache(uid, {
                    ...(cachedProfile as any),
                    syncVersions: {
                      ...((cachedProfile as any)?.syncVersions || {}),
                      recentSongs: syncVersion,
                    },
                  });
                }
              } catch (error) {
                console.warn('Recent songs version signal publish failed.', error);
              }
              return syncVersion;
            };

            if (!uid) return writeLatest();

            const previousWrite = recentSongsWriteQueues.get(uid) || Promise.resolve();
            const queuedWrite = previousWrite
              .catch(() => undefined)
              .then(writeLatest);
            recentSongsWriteQueues.set(uid, queuedWrite);
            try {
              return await queuedWrite;
            } finally {
              if (recentSongsWriteQueues.get(uid) === queuedWrite) {
                recentSongsWriteQueues.delete(uid);
              }
            }
          };
          """
          app = app[:persist_start] + persist_replacement + app[persist_end:]

          app = replace_once(
              app,
              "const recentSongTextWritePendingRef = useRef<{ uid: string; songs: any[]; operation: 'regenerate' | 'edit' | 'pre-favorite-edit'; mirrorTargets?: V1MutationMirrorTarget[] } | null>(null);",
              "const recentSongTextWritePendingRef = useRef<{ uid: string; songs: any[]; operation: 'regenerate' | 'edit' | 'pre-favorite-edit'; mirrorTargets?: V1MutationMirrorTarget[]; mutationEpoch: number } | null>(null);",
              'recent pending type',
          )
          app = replace_once(
              app,
              "recentSongTextWritePendingRef.current = { uid, songs: nextSongs, operation, mirrorTargets };",
              "recentSongTextWritePendingRef.current = { uid, songs: nextSongs, operation, mirrorTargets, mutationEpoch: readRecentSongsMutationEpoch(uid) };",
              'recent pending capture epoch',
          )
          app = replace_once(
              app,
              """      const ref = doc(db, \"user_recent_songs\", pending.uid);
                await runV1MutationBoundary({ domain: 'recent', operation: pending.operation, uid: pending.uid, affectedCount: 1, mirrorTargets: pending.mirrorTargets }, persistRecentSongsDocument(ref, pending.songs));
                markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);""",
              """      if (pending.mutationEpoch !== readRecentSongsMutationEpoch(pending.uid)) return;
                const ref = doc(db, \"user_recent_songs\", pending.uid);
                const persistedVersion = await runV1MutationBoundary(
                  { domain: 'recent', operation: pending.operation, uid: pending.uid, affectedCount: 1, mirrorTargets: pending.mirrorTargets },
                  persistRecentSongsDocument(ref, pending.songs, pending.mutationEpoch),
                );
                if (!persistedVersion) return;
                markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);""",
              'recent pending stale guard',
          )

          app = replace_once(
              app,
              "  const canonicalNewSongs = newSongs.map((song) => ensureLiveSoridrawSongId(song));\n\n  const saveOperation = async () => {",
              "  const canonicalNewSongs = newSongs.map((song) => ensureLiveSoridrawSongId(song));\n  const recentMutationEpoch = readRecentSongsMutationEpoch(user.uid);\n\n  const saveOperation = async () => {",
              'recent batch capture epoch',
          )
          app = replace_once(
              app,
              """      await runV1MutationBoundary({ domain: 'recent', operation: 'save-batch', uid: user.uid, affectedCount: canonicalNewSongs.length, mirrorTargets }, persistRecentSongsDocument(ref, updatedSongs));
                markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);""",
              """      const persistedVersion = await runV1MutationBoundary(
                { domain: 'recent', operation: 'save-batch', uid: user.uid, affectedCount: canonicalNewSongs.length, mirrorTargets },
                persistRecentSongsDocument(ref, updatedSongs, recentMutationEpoch),
              );
              if (!persistedVersion) return;
              markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);""",
              'recent batch stale guard',
          )

          app = replace_once(
              app,
              """        const ref = doc(db, \"user_recent_songs\", user.uid);
                  await runV1MutationBoundary({ domain: 'recent', operation: 'delete-item', uid: user.uid, affectedCount: 1, mirrorTargets: buildRecentMirrorTargets([history[index]], 'recent-hide') }, persistRecentSongsDocument(ref, newHistory));
                  markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);""",
              """        const recentMutationEpoch = bumpRecentSongsMutationEpoch(user.uid);
                  recentSongTextWritePendingRef.current = null;
                  if (recentSongTextWriteTimerRef.current !== null) {
                    window.clearTimeout(recentSongTextWriteTimerRef.current);
                    recentSongTextWriteTimerRef.current = null;
                  }
                  const ref = doc(db, \"user_recent_songs\", user.uid);
                  await runV1MutationBoundary(
                    { domain: 'recent', operation: 'delete-item', uid: user.uid, affectedCount: 1, mirrorTargets: buildRecentMirrorTargets([history[index]], 'recent-hide') },
                    persistRecentSongsDocument(ref, newHistory, recentMutationEpoch),
                  );
                  markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);""",
              'recent single delete barrier',
          )

          app = replace_once(
              app,
              """          const ref = doc(db, \"user_recent_songs\", user.uid);
                    await runV1MutationBoundary({ domain: 'recent', operation: 'clear', uid: user.uid, affectedCount: 0, mirrorTargets: buildRecentMirrorTargets(history, 'recent-hide') }, setDoc(ref, { songs: [] }, { merge: true }));
                    markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);""",
              """          const recentMutationEpoch = bumpRecentSongsMutationEpoch(user.uid);
                    recentSongTextWritePendingRef.current = null;
                    if (recentSongTextWriteTimerRef.current !== null) {
                      window.clearTimeout(recentSongTextWriteTimerRef.current);
                      recentSongTextWriteTimerRef.current = null;
                    }
                    const ref = doc(db, \"user_recent_songs\", user.uid);
                    await runV1MutationBoundary(
                      { domain: 'recent', operation: 'clear', uid: user.uid, affectedCount: history.length, mirrorTargets: buildRecentMirrorTargets(history, 'recent-hide') },
                      persistRecentSongsDocument(ref, [], recentMutationEpoch),
                    );
                    markCacheDiagnostic('recentSongs', 'SYNC', 0, 1);""",
              'recent clear barrier',
          )

          app = replace_once(
              app,
              """      if (recentSongsSessionReadInFlightUids.has(user.uid)) return;
                recentSongsSessionReadInFlightUids.add(user.uid);

                void getDocFromServer(ref)""",
              """      if (recentSongsSessionReadInFlightUids.has(user.uid)) return;
                recentSongsSessionReadInFlightUids.add(user.uid);
                const recentReadMutationEpoch = readRecentSongsMutationEpoch(user.uid);

                void getDocFromServer(ref)""",
              'recent server read capture epoch',
          )
          app = replace_once(
              app,
              """          recentSongsSessionReadInFlightUids.delete(user.uid);
                    if (cancelledRecentSongsRead) return;
                    recentSongsSessionVerifiedUids.add(user.uid);""",
              """          recentSongsSessionReadInFlightUids.delete(user.uid);
                    if (cancelledRecentSongsRead) return;
                    if (recentReadMutationEpoch !== readRecentSongsMutationEpoch(user.uid)) return;
                    recentSongsSessionVerifiedUids.add(user.uid);""",
              'recent stale server response guard',
          )

          app = replace_once(
              app,
              "persistRecentSongsDocument(ref, next))\n            .then(() => markCacheDiagnostic('recentSongs', 'SYNC', 0, 1))",
              "persistRecentSongsDocument(ref, next, readRecentSongsMutationEpoch(user.uid)))\n            .then((version) => { if (version) markCacheDiagnostic('recentSongs', 'SYNC', 0, 1); })",
              'recent lyric language epoch',
          )

          app = replace_once(
              app,
              "import { auth, googleProvider, db, getFirebaseAppCheckToken } from './firebase';",
              "import { auth, googleProvider, db, functions, httpsCallable, getFirebaseAppCheckToken } from './firebase';",
              'firebase callable import',
          )

          bulk_start = app.index("  const clearAllFavorites = async () => {")
          bulk_end = app.index("  // Scroll to top on mount", bulk_start)
          bulk_replacement = r"""  type MusicNoteBulkOperation = 'clear-unlocked' | 'lock-all' | 'unlock-all';

          const runMusicNoteBulkOperation = async (operation: MusicNoteBulkOperation) => {
            if (!user?.uid) return { changedCount: 0, changedIds: [] as string[], version: 0 };

            const callable = httpsCallable(functions, 'processMusicNoteBulkPage');
            const changedIds = new Set<string>();
            let cursor: string | null = null;
            let latestVersion = 0;
            let pageCount = 0;

            while (pageCount < 1000) {
              const response: any = await callable({ operation, cursor, limit: 120 });
              const payload = (response?.data || {}) as any;
              const pageChangedIds = Array.isArray(payload.changedIds)
                ? payload.changedIds.map((value: unknown) => String(value || '').trim()).filter(Boolean)
                : [];
              pageChangedIds.forEach((id: string) => changedIds.add(id));
              latestVersion = Math.max(latestVersion, Number(payload.version || 0));

              if (payload.done === true) break;
              const nextCursor = String(payload.nextCursor || '').trim();
              if (!nextCursor || nextCursor === cursor) {
                throw new Error('Music Note bulk pagination did not advance.');
              }
              cursor = nextCursor;
              pageCount += 1;
            }

            if (pageCount >= 1000) {
              throw new Error('Music Note bulk pagination safety limit reached.');
            }

            if (latestVersion > 0) {
              writeMusicNoteSyncVersion(MUSIC_NOTE_REMOTE_SYNC_VERSION_STORAGE_BASE, user.uid, latestVersion);
              writeMusicNoteSyncVersion(MUSIC_NOTE_LOCAL_SYNC_VERSION_STORAGE_BASE, user.uid, latestVersion);
            }

            return { changedCount: changedIds.size, changedIds: Array.from(changedIds), version: latestVersion };
          };

          const clearAllFavorites = async () => {
            if (!user) return;
            if (userStatus === 'banned' && !isAdminUser) {
              showToast('차단된 계정입니다. 기능을 사용할 수 없습니다.');
              return;
            }

            try {
              const result = await runMusicNoteBulkOperation('clear-unlocked');
              if (result.changedCount === 0) {
                showToast('삭제할 수 있는 곡이 없습니다.');
                return;
              }

              const removedIds = new Set(result.changedIds);
              rememberFavoriteDeletedTombstones(user.uid, result.changedIds);
              setFavorites((previous) => {
                const next = (previous || []).filter((favorite) => !removedIds.has(String(favorite?.id || '')));
                writeFavoritesCache(user.uid, next);
                return next;
              });
              showToast(`${result.changedCount}개의 곡이 삭제되었습니다.`);
            } catch (error) {
              handleFirestoreError(error, OperationType.WRITE, 'favorites');
            }
          };

          const lockAllFavorites = async () => {
            if (!user) return;
            try {
              const result = await runMusicNoteBulkOperation('lock-all');
              if (result.changedCount === 0) {
                showToast('이미 모든 곡이 잠겨 있습니다.');
                return;
              }

              const changedIds = new Set(result.changedIds);
              setFavorites((previous) => {
                const next = (previous || []).map((favorite) => changedIds.has(String(favorite?.id || '')) ? { ...favorite, isLocked: true } : favorite);
                writeFavoritesCache(user.uid, next);
                return next;
              });
              showToast(`${result.changedCount}개의 곡이 잠금 설정되었습니다.`);
            } catch (error) {
              handleFirestoreError(error, OperationType.WRITE, 'favorites');
            }
          };

          const unlockAllFavorites = async () => {
            if (!user) return;
            try {
              const result = await runMusicNoteBulkOperation('unlock-all');
              if (result.changedCount === 0) {
                showToast('잠긴 곡이 없습니다.');
                return;
              }

              const changedIds = new Set(result.changedIds);
              setFavorites((previous) => {
                const next = (previous || []).map((favorite) => changedIds.has(String(favorite?.id || '')) ? { ...favorite, isLocked: false } : favorite);
                writeFavoritesCache(user.uid, next);
                return next;
              });
              showToast(`${result.changedCount}개의 곡이 잠금 해제되었습니다.`);
            } catch (error) {
              handleFirestoreError(error, OperationType.WRITE, 'favorites');
            }
          };

          """
          app = app[:bulk_start] + bulk_replacement + app[bulk_end:]
          app_path.write_text(app, encoding='utf-8')

          functions_path = Path('functions/src/index.ts')
          functions_source = functions_path.read_text(encoding='utf-8')
          marker = '// SORIDRAW_MUSIC_NOTE_BOUNDED_BULK_20260905'
          if marker in functions_source:
              raise SystemExit('bounded Music Note function already exists unexpectedly')

          functions_source += r"""

          // SORIDRAW_MUSIC_NOTE_BOUNDED_BULK_20260905
          type MusicNoteBulkOperation = 'clear-unlocked' | 'lock-all' | 'unlock-all';
          const MUSIC_NOTE_BULK_PAGE_LIMIT = 120;

          export const processMusicNoteBulkPage = onCall(
            { region: "us-central1" },
            async (request) => {
              const uid = String(request.auth?.uid || '').trim();
              if (!uid) throw new HttpsError('unauthenticated', 'Authentication is required.');

              const operation = String(request.data?.operation || '').trim() as MusicNoteBulkOperation;
              if (!['clear-unlocked', 'lock-all', 'unlock-all'].includes(operation)) {
                throw new HttpsError('invalid-argument', 'Unsupported Music Note bulk operation.');
              }

              const requestedLimit = Math.floor(Number(request.data?.limit || MUSIC_NOTE_BULK_PAGE_LIMIT));
              const pageSize = Math.max(1, Math.min(MUSIC_NOTE_BULK_PAGE_LIMIT, Number.isFinite(requestedLimit) ? requestedLimit : MUSIC_NOTE_BULK_PAGE_LIMIT));
              const cursor = String(request.data?.cursor || '').trim();

              const firestore = admin.firestore();
              let pageQuery = firestore.collection('favorites').where('uid', '==', uid).orderBy(admin.firestore.FieldPath.documentId()).limit(pageSize);
              if (cursor) pageQuery = pageQuery.startAfter(cursor);

              const snapshot = await pageQuery.get();
              const changedIds: string[] = [];
              const batch = firestore.batch();

              for (const snapshotDoc of snapshot.docs) {
                const data = snapshotDoc.data() || {};
                const isLocked = data.isLocked === true;
                if (operation === 'clear-unlocked') {
                  if (isLocked) continue;
                  batch.delete(snapshotDoc.ref);
                  changedIds.push(snapshotDoc.id);
                } else if (operation === 'lock-all') {
                  if (isLocked) continue;
                  batch.update(snapshotDoc.ref, { isLocked: true, updatedAtMs: Date.now() });
                  changedIds.push(snapshotDoc.id);
                } else {
                  if (!isLocked) continue;
                  batch.update(snapshotDoc.ref, { isLocked: false, updatedAtMs: Date.now() });
                  changedIds.push(snapshotDoc.id);
                }
              }

              let version = 0;
              if (changedIds.length > 0) {
                version = Date.now();
                const userRef = firestore.collection('users').doc(uid);
                const userPatch: Record<string, any> = { syncVersions: { musicNote: version }, favoriteSyncSignalUpdatedAt: version };
                if (operation === 'clear-unlocked') {
                  userPatch.favoriteCount = admin.firestore.FieldValue.increment(-changedIds.length);
                }
                batch.set(userRef, userPatch, { merge: true });
                await batch.commit();
              }

              const lastDoc = snapshot.docs[snapshot.docs.length - 1];
              const hasAnotherPage = snapshot.size === pageSize;
              return {
                ok: true,
                operation,
                processedCount: snapshot.size,
                changedCount: changedIds.length,
                changedIds,
                version,
                nextCursor: hasAnotherPage && lastDoc ? lastDoc.id : null,
                done: !hasAnotherPage,
              };
            },
          );
          """
          functions_path.write_text(functions_source, encoding='utf-8')

          current = app_path.read_text(encoding='utf-8')
          start = current.index("  type MusicNoteBulkOperation = 'clear-unlocked'")
          end = current.index("  // Scroll to top on mount", start)
          bulk = current[start:end]
          if "getDocs(" in bulk or "writeBatch(" in bulk:
              raise SystemExit('client Music Note bulk block still contains full read/batch logic')
          for required in ('RECENT_SONGS_MUTATION_EPOCH_STORAGE_BASE', 'recentSongsWriteQueues', 'recentReadMutationEpoch', 'processMusicNoteBulkPage'):
              if required not in current:
                  raise SystemExit(f'missing app safety marker: {required}')

          fn = functions_path.read_text(encoding='utf-8')
          for required in ('SORIDRAW_MUSIC_NOTE_BOUNDED_BULK_20260905', '.limit(pageSize)', 'MUSIC_NOTE_BULK_PAGE_LIMIT = 120', "where('uid', '==', uid)"):
              if required not in fn:
                  raise SystemExit(f'missing function safety marker: {required}')

          print('STAGE4_PATCH=PASS')
          PY

          git diff --check
          git diff --stat
          grep -Fq "RECENT_SONGS_MUTATION_EPOCH_STORAGE_BASE" src/App.tsx
          grep -Fq "processMusicNoteBulkPage" src/App.tsx
          grep -Fq "MUSIC_NOTE_BULK_PAGE_LIMIT = 120" functions/src/index.ts

      - name: Set up Node.js 20 for app checks
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: App TypeScript and production build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build

      - name: Static cost regression audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-broad-reads.mjs
          python3 <<'PY'
          from pathlib import Path
          s = Path('src/App.tsx').read_text(encoding='utf-8')
          a = s.index("  type MusicNoteBulkOperation = 'clear-unlocked'")
          b = s.index("  // Scroll to top on mount", a)
          bulk = s[a:b]
          assert "getDocs(" not in bulk
          assert "query(collection(db, 'favorites'), where('uid', '==', user.uid))" not in bulk
          assert "persistRecentSongsDocument(ref, pending.songs, pending.mutationEpoch)" in s
          assert "recentReadMutationEpoch !== readRecentSongsMutationEpoch(user.uid)" in s
          print('TARGETED_COST_AND_STALE_GUARDS=PASS')
          PY

      - name: Set up Node.js 22 for Functions
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Functions TypeScript build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix functions
          npm run build --prefix functions
          test -f functions/lib/securedIndex.js
          grep -Fq "processMusicNoteBulkPage" functions/lib/securedIndex.js

      - name: Authenticate Firebase backend
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy only bounded Music Note callable
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only functions:processMusicNoteBulkPage \
            --project soridraw-app-866a5 \
            --non-interactive
          echo 'FUNCTION_DEPLOY=processMusicNoteBulkPage:PASS'

      - name: Commit tested source to preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx functions/src/index.ts
          git diff --cached --check
          git commit -m 'fix(preview): bound Music Note bulk and block recent resurrection'
          git push origin HEAD:preview
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"

      - name: Result
        run: |
          echo 'STAGE4_SOURCE_PUSH=PASS'
          echo 'MAIN_CHANGED=false'
          echo 'PRODUCTION_CHANGED=false'
          echo 'Hosting will be handled by Firebase Hosting Custom Preview on the source push.'
