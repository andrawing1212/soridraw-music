name: APP713 emergency PREVIEW follow backend rollback
on:
  push:
    branches: [fix/app713-server-owned-follow]
    paths:
      - '.github/workflows/app713-emergency-revert.yml'
permissions: {contents: read}
concurrency:
  group: soridraw-app713-emergency-revert
  cancel-in-progress: false
jobs:
  rollback:
    if: github.repository == 'andrawing1212/soridraw-music' && github.event.head_commit.message == 'APP713_EMERGENCY_REVERT_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP713_ROLLBACK_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP713_APPROVED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5
      - uses: google-github-actions/setup-gcloud@v2
      - name: Restore both exact prior PREVIEW Cloudflare Worker versions
        run: node scripts/app713-emergency-revert-workers.mjs
      - name: Disable the newly created APP713 actor verifier
        if: always()
        run: python3 scripts/app713-canary-function-flag.py --disable
      - name: Restore original IAM of new verifier only
        if: always()
        run: python3 scripts/app713-emergency-revoke-invoker.py
