name: Temp 1030 Music Note Normalization Stage1
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1029-inspect-cache-flow.yml']
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 2
      - name: Guard current preview source
        shell: bash
        run: |
          test -f .deploy/apply-1030-music-note-normalization-stage1.py
          test -f scripts/verify-music-note-normalization-stage1.mjs
          grep -q 'SORIDRAW_MUSIC_NOTE_CACHE_INTEGRITY_1028' src/App.tsx
          if grep -q 'SORIDRAW_MUSIC_NOTE_NORMALIZATION_STAGE1_1030' src/App.tsx; then
            echo 'Stage1 already applied; continuing with verification.'
          fi
      - name: Apply Stage1 normalization
        run: python3 .deploy/apply-1030-music-note-normalization-stage1.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Existing Music Note pagination guard
        run: node scripts/verify-music-note-pagination-order.mjs
      - name: Stage1 normalization guard
        run: node scripts/verify-music-note-normalization-stage1.mjs
      - name: Static cost guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text()
          a=s.index('const loadMoreFavorites = useCallback(async () => {')
          b=s.index('const syncMusicNoteIncrementalFromRemoteVersion', a)
          block=s[a:b]
          assert block.count('await getDocs(') == 1, block.count('await getDocs(')
          assert 'while (' not in block and 'while(' not in block
          assert "orderBy('createdAtMs', 'desc')" in block
          assert 'limit(FAVORITES_PAGE_SIZE)' in block
          assert "scheduleListBundleWrite('musicNote', currentUser.uid, cachedFavs" not in s
          print('PASS static cost/data-safety guard')
          PY
      - name: Build
        run: npm run build
      - name: Commit and push App source
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo 'No App.tsx changes to commit.'
            exit 0
          fi
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add src/App.tsx
          git commit -m 'fix(music-note): normalize partial cache bootstrap safely'
          git push origin HEAD:preview
