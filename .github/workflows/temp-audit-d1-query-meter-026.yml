name: SORIDRAW Audit D1 Query Meter 026
on:
  push:
    branches: [preview]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TARGET_VERSION: 2593eda0-d810-4938-ad38-90614123339f
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inspect active diagnostic metering source
        run: |
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER,V=process.env.TARGET_VERSION;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`}}),x=await r.json();if(!r.ok||x.success===false)throw new Error('CF '+r.status);return x.result||x;}
          function fn(s,name){let p=s.indexOf(`function ${name}(`);if(p<0)p=s.indexOf(`async function ${name}(`);if(p<0)return '';const b=s.indexOf('{',p);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i],n=s[i+1];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='/'&&n==='/'){const z=s.indexOf('\n',i+2);i=z<0?s.length:z;continue}if(c==='/'&&n==='*'){const z=s.indexOf('*/',i+2);i=z<0?s.length:z+1;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(p,i+1)}return ''}
          (async()=>{const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${V}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0],s=Buffer.from(m.content_base64,'base64').toString('utf8');console.log('--- createMeteredD1 ---\n'+fn(s,'createMeteredD1'));for(const needle of ['X-SORIDRAW-D1-Read','X-SORIDRAW-CF-Diagnostics']){let from=0,n=0;while((from=s.indexOf(needle,from))>=0&&n<4){console.log(`--- ${needle} occurrence ${n+1} ---\n`+s.slice(Math.max(0,from-1400),Math.min(s.length,from+1800)));from+=needle.length;n++;}}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
