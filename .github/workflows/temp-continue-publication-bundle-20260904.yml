name: SORIDRAW Continue Publication Bundle PREVIEW 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-continue-publication-bundle-20260904.yml']
permissions:
  contents: read
concurrency:
  group: soridraw-publication-bundle-continuation-20260904
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PREVIEW_D1_NAME: soridraw-explore-preview
      PREVIEW_D1_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2_BUCKET: soridraw-profile-media-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 5
      - name: Verify source baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SORIDRAW_MUSIC_NOTE_PUBLICATION_BUNDLE_20260904' src/services/explorePublicationService.ts
          grep -q '/v1/me/music-note-publications-bundle' src/services/explorePublicationService.ts
          grep -q 'SORIDRAW_MUSIC_NOTE_PUBLICATION_BUNDLE_20260904' cloudflare/explore-worker/patches/007-music-note-publication-bundle.mjs
          test -f cloudflare/explore-worker/migrations/20260904_music_note_publication_bundle.sql
          echo '[Publication bundle] source baseline PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate migration locally
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import sqlite3, json
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          db.executescript('''CREATE TABLE tracks(id TEXT PRIMARY KEY, owner_uid TEXT, source_type TEXT, source_id TEXT, is_public INTEGER, allow_next_song_apply INTEGER, allow_follower_save INTEGER, profile_pinned INTEGER, updated_at INTEGER); INSERT INTO tracks VALUES ('m1','u1','music_note','n1',1,0,1,0,100),('m2','u1','music_note','n2',0,1,0,1,90),('s1','u1','suno','s1',1,0,0,0,80);''')
          db.executescript(Path('cloudflare/explore-worker/migrations/20260904_music_note_publication_bundle.sql').read_text())
          row=db.execute("SELECT states_json,item_count FROM music_note_publication_bundles WHERE owner_uid='u1'").fetchone(); states=json.loads(row[0]); assert row[1]==2 and set(states)=={'n1','n2'} and isinstance(states['n1'],dict)
          db.execute("UPDATE tracks SET is_public=0 WHERE id='m1'"); states=json.loads(db.execute("SELECT states_json FROM music_note_publication_bundles WHERE owner_uid='u1'").fetchone()[0]); assert states['n1']['status']=='private'
          db.execute("DELETE FROM tracks WHERE id='m2'"); row=db.execute("SELECT states_json,item_count FROM music_note_publication_bundles WHERE owner_uid='u1'").fetchone(); assert row[1]==1 and set(json.loads(row[0]))=={'n1'}
          print('[Publication bundle] local migration/trigger PASS')
          PY
      - name: Fetch exact active PREVIEW Worker and patch
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          rm -rf .remote-worker && mkdir -p .remote-worker
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;const deps=await get(`${base}/deployments`);const d=(deps.deployments||deps||[])[0];const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];if(!active?.version_id||Number(active.percentage||0)<99.99)throw new Error('No single active PREVIEW version');const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);const modules=ver.modules||[];if(!modules.length)throw new Error('No active modules');for(const mod of modules){const target=path.join('.remote-worker',mod.name||'worker.js');fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,Buffer.from(mod.content_base64,'base64'));}const main=ver.main_module||modules[0].name||'worker.js';const settings=await get(`${base}/settings`);const bindings=settings.bindings||[];const unknown=bindings.filter(b=>!['plain_text','secret_text','d1','r2_bucket'].includes(b.type));if(unknown.length)throw new Error(`Unsupported bindings ${JSON.stringify(unknown.map(b=>({type:b.type,name:b.name})))}`);const d1=bindings.find(b=>b.type==='d1'&&b.name==='DB'),r2=bindings.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA');if(!d1||(d1.id||d1.database_id)!==process.env.PREVIEW_D1_ID)throw new Error('D1 binding mismatch');if(!r2||r2.bucket_name!==process.env.PREVIEW_R2_BUCKET)throw new Error('R2 binding mismatch');const config={name,main:`./${main}`,compatibility_date:String(settings.compatibility_date||'2026-08-28').slice(0,10),keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.PREVIEW_D1_NAME,database_id:process.env.PREVIEW_D1_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PREVIEW_R2_BUCKET}]};if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)config.compatibility_flags=settings.compatibility_flags;fs.writeFileSync('.remote-worker/wrangler.jsonc',JSON.stringify(config,null,2)+'\n');console.log(`[Publication bundle] baseline=${active.version_id} main=${main}`);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test -s .remote-worker/worker.js
          node patches/007-music-note-publication-bundle.mjs
          grep -q 'SORIDRAW_MUSIC_NOTE_PUBLICATION_BUNDLE_20260904' .remote-worker/worker.js
          grep -q '/v1/me/music-note-publications-bundle' .remote-worker/worker.js
          echo '[Publication bundle] active PREVIEW Worker patch PASS'
      - name: Apply PREVIEW D1 derived cache migration
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          npx --yes wrangler@4 d1 execute DB --remote --config .remote-worker/wrangler.jsonc --file migrations/20260904_music_note_publication_bundle.sql
          echo '[Publication bundle] PREVIEW D1 migration PASS'
      - name: Verify D1 parity
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          npx --yes wrangler@4 d1 execute DB --remote --config .remote-worker/wrangler.jsonc --command "SELECT (SELECT COUNT(DISTINCT owner_uid) FROM tracks WHERE owner_uid IS NOT NULL AND owner_uid <> '') AS canonical_owners, (SELECT COUNT(*) FROM music_note_publication_bundles) AS bundle_owners, (SELECT COUNT(*) FROM tracks WHERE source_type='music_note' AND source_id IS NOT NULL AND source_id <> '') AS canonical_music_notes, (SELECT COALESCE(SUM(item_count),0) FROM music_note_publication_bundles) AS bundled_music_notes, (SELECT COUNT(*) FROM music_note_publication_bundles b WHERE json_valid(b.states_json)=0 OR b.item_count <> (SELECT COUNT(*) FROM json_each(b.states_json))) AS invalid_bundles;" > "$RUNNER_TEMP/parity.txt"
          cat "$RUNNER_TEMP/parity.txt"
          python3 - "$RUNNER_TEMP/parity.txt" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8').read(); vals={k:int(v) for k,v in re.findall(r'"(canonical_owners|bundle_owners|canonical_music_notes|bundled_music_notes|invalid_bundles)"\s*:\s*(\d+)',t)}
          need={'canonical_owners','bundle_owners','canonical_music_notes','bundled_music_notes','invalid_bundles'}
          if set(vals)<need: raise SystemExit(f'parity parse failed: {vals}')
          if vals['canonical_owners']!=vals['bundle_owners'] or vals['canonical_music_notes']!=vals['bundled_music_notes'] or vals['invalid_bundles']!=0: raise SystemExit(f'parity failed: {vals}')
          print('[Publication bundle] PREVIEW D1 parity PASS',vals)
          PY
      - name: Deploy PREVIEW Worker only
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          npx --yes wrangler@4 deploy --cwd .remote-worker --keep-vars
          echo '[Publication bundle] PREVIEW Worker deploy PASS'
      - name: Verify deployed PREVIEW Worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER;async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,1000));return x.result||x}(async()=>{const deps=await g(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(deps.deployments||deps||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0],ver=await g(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${v.version_id}?include=modules`),mod=(ver.modules||[]).find(m=>m.name===ver.main_module)||(ver.modules||[])[0],src=Buffer.from(mod.content_base64,'base64').toString('utf8');if(!src.includes('SORIDRAW_MUSIC_NOTE_PUBLICATION_BUNDLE_20260904')||!src.includes('/v1/me/music-note-publications-bundle'))throw new Error('deployed route missing');console.log(`[Publication bundle] deployed PREVIEW version=${v.version_id} PASS`);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          status="$(curl -sS -o "$RUNNER_TEMP/noauth.json" -w '%{http_code}' 'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/me/music-note-publications-bundle')"
          echo "[Publication bundle] route no-auth HTTP=$status"
          test "$status" != 404
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build final PREVIEW app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          grep -q '/v1/me/music-note-publications-bundle' src/services/explorePublicationService.ts
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Deploy Firebase PREVIEW Hosting and smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          for url in 'https://preview.soridraw.com/' 'https://soridraw-preview.web.app/' 'https://soridraw-preview.firebaseapp.com/'; do curl -fsS --max-time 30 "$url" -o "$RUNNER_TEMP/preview.html"; grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview.html"; echo "[Publication bundle] smoke PASS $url"; done
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo '[Publication bundle] production Hosting unchanged PASS'
      - name: Result
        run: |
          echo 'EXPECTED_COLD=Worker 1 / D1 read 1'
          echo 'EXPECTED_WARM=Worker 0 / D1 read 0'
          echo 'PREVIEW_ONLY=true'
