<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SORIDRAW Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">S</div>
        <div>
          <strong>SORIDRAW</strong>
          <span>Side Panel v114</span>
        </div>
      </div>
      <div class="actions">
        <button id="toggleEnv" title="환경 접기/펼치기">⌄</button>
        <button id="refresh" title="새로고침">↻</button>
        <button id="openTab" title="새 탭에서 열기">↗</button>
      </div>
    </header>

    <section id="envPanel" class="env">
      <button data-url="https://soridraw.web.app/?sidepanel=1">정식</button>
      <button data-url="https://soridraw-music.vercel.app/?sidepanel=1" class="active">테스트</button>
      <button data-url="https://soridraw-music-git-preview-andrawing1212.vercel.app/?sidepanel=1">프리뷰</button>
    </section>

    <main class="frame-wrap">
      <iframe id="appFrame" src="https://soridraw-music.vercel.app/?sidepanel=1" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    </main>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
