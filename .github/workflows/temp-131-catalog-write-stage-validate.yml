name: TEMP 131 Catalog Write Stage Validate

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-131-catalog-write-stage-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      EXPECTED_PREVIEW_VERSION: 4f8471e3-576f-49de-9f2c-c3863021bf3d
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
      SHARED_R2: soridraw-profile-media
      EXPECTED_CATALOG_OBJECTS: '432'

    steps:
      - name: Checkout exact staged-write source
        uses: actions/checkout@v4
        with:
          ref: ba723fb817aa2de99cf28821d85c48b4261455b8
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live staged flags and protected Workers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){
            const r=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
            const x=await r.json();
            if(!r.ok||x.success===false) throw new Error('Cloudflare '+r.status+': '+JSON.stringify(x).slice(0,1200));
            return x.result||x;
          }
          async function active(name){
            const x=await get('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+name+'/deployments');
            const d=(x.deployments||x||[])[0];
            const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!v?.version_id||Number(v.percentage||0)<99.99) throw new Error('No single active version for '+name);
            return v.version_id;
          }
          (async()=>{
            const preview=await active(process.env.PREVIEW_WORKER);
            const test=await active(process.env.TEST_WORKER);
            const prod=await active(process.env.PRODUCTION_WORKER);
            if(preview!==process.env.EXPECTED_PREVIEW_VERSION) throw new Error('PREVIEW version mismatch '+preview);
            fs.writeFileSync(process.env.RUNNER_TEMP+'/test.before',test);
            fs.writeFileSync(process.env.RUNNER_TEMP+'/prod.before',prod);
            const settings=await get('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+process.env.PREVIEW_WORKER+'/settings');
            const bindings=Array.isArray(settings.bindings)?settings.bindings:[];
            const value=(name)=>{
              const b=bindings.find(x=>x?.name===name);
              return String(b?.text??b?.value??b?.json??'').trim();
            };
            if(value('SORIDRAW_R2_CATALOG_V1')!=='1') throw new Error('catalog write flag is not ON');
            if(value('SORIDRAW_R2_CATALOG_READ_V1')==='1') throw new Error('catalog read flag unexpectedly ON');
            if(value('SORIDRAW_R2_FIRST_PUBLISHER_V1')==='1') throw new Error('first publisher flag unexpectedly ON');
            console.log('CATALOG_WRITE_FLAG=ON');
            console.log('CATALOG_READ_FLAG=OFF');
            console.log('FIRST_PUBLISHER_FLAG=OFF');
            console.log('PREVIEW_ACTIVE_VERSION='+preview);
            console.log('PROTECTED_TEST='+test);
            console.log('PROTECTED_PRODUCTION='+prod);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify 066/068 live integration contract
        shell: bash
        run: |
          set -euo pipefail
          worker=cloudflare/explore-worker/canonical/preview-worker.js
          grep -Fq 'SORIDRAW_R2_ORDERED_CATALOG_PHASE_A_066_20260919' "$worker"
          grep -Fq 'SORIDRAW_CATALOG_PUBLICATION_ARTIST_PARITY_068_20260919' "$worker"
          grep -Fq 'await syncExploreCatalogTrack066(env, incomingItem, { isPublic: true });' "$worker"
          grep -Fq 'await removeExploreCatalogTrack066(env, trackId);' "$worker"
          grep -Fq 'await patchExploreCatalogLike066(env, trackId, Math.max(0, Number(row?.likeCount || 0)));' "$worker"
          grep -Fq 'await syncExploreCatalogArtist066(env, profile);' "$worker"
          grep -Fq 'if (!isExploreR2CatalogReadEnabled066(env))' "$worker"
          echo 'CATALOG_MUTATION_INTEGRATION_CONTRACT=PASS'

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Run bounded synthetic catalog delta test on shared derived R2
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/stage131-token.txt"

          cat > .temp-131-stage.mjs <<'BOOT'
          import {
            EXPLORE_R2_CATALOG_ROOT_066,
            catalogMetaKey066,
            catalogMarkerKeys066,
            catalogArtistMetaKey066,
            catalogArtistMarkerKeys066,
            syncExploreCatalogTrack066,
            removeExploreCatalogTrack066,
            patchExploreCatalogLike066,
            syncExploreCatalogArtist066,
          } from './runtime/r2-catalog-v1.js';

          const TOKEN='__TOKEN__';
          const RUN='__RUN__';
          const TRACK='__soridraw_stage131_track_'+RUN;
          const OWNER='__soridraw_stage131_owner_'+RUN;
          const enc=(v)=>encodeURIComponent(String(v));
          const trackSuffix='/'+enc(TRACK)+'.json';
          const ownerSuffix='/'+enc(OWNER)+'.json';

          async function listAll(bucket){
            const out=[]; let cursor;
            for(let i=0;i<20;i++){
              const r=await bucket.list({prefix:EXPLORE_R2_CATALOG_ROOT_066+'/',limit:1000,cursor});
              out.push(...(r.objects||[]).map(x=>x.key));
              if(!r.truncated||!r.cursor) return out;
              cursor=r.cursor;
            }
            throw new Error('listAll exceeded rounds');
          }
          async function cleanup(bucket){
            const keys=(await listAll(bucket)).filter(k=>k.endsWith(trackSuffix)||k.endsWith(ownerSuffix));
            if(keys.length) await bucket.delete(keys);
            return keys.length;
          }
          async function exists(bucket,key){ return Boolean(await bucket.head(key)); }
          function assert(cond,msg){ if(!cond) throw new Error(msg); }
          function out(payload,status=200){ return new Response(JSON.stringify(payload),{status,headers:{'content-type':'application/json'}}); }

          export default {
            async fetch(request,env){
              if(request.method!=='POST') return out({ok:false,error:'method'},405);
              if(request.headers.get('x-stage-token')!==TOKEN) return out({ok:false,error:'forbidden'},403);
              const bucket=env.PROFILE_MEDIA;
              let baseline=0;
              try{
                await cleanup(bucket);
                const before=await listAll(bucket);
                baseline=before.length;
                assert(baseline===432,'baseline objects '+baseline);

                const baseTrack={
                  id:TRACK,
                  ownerUid:OWNER,
                  title:'stage131 alpha beta',
                  publishedAt:1700000000000,
                  likeCount:0,
                  profilePinned:false,
                  primaryGenre:'stage131 genre',
                };
                const pubMarkers=catalogMarkerKeys066(baseTrack);
                const pub=await syncExploreCatalogTrack066(env,baseTrack,{isPublic:true});
                assert(pub?.ok===true&&pub.changed===true,'publish result');
                let keys=await listAll(bucket);
                assert(keys.length===baseline+1+pubMarkers.length,'publish object count '+keys.length);
                assert(await exists(bucket,catalogMetaKey066(TRACK)),'publish meta missing');
                for(const key of pubMarkers) assert(await exists(bucket,key),'publish marker missing '+key);

                const same=await syncExploreCatalogTrack066(env,baseTrack,{isPublic:true});
                assert(same?.ok===true&&same.changed===false,'idempotent republish changed');
                keys=await listAll(bucket);
                assert(keys.length===baseline+1+pubMarkers.length,'idempotent object drift');

                const liked=await patchExploreCatalogLike066(env,TRACK,7);
                assert(liked?.ok===true&&liked.changed===true,'like patch failed');
                assert(Number(liked.added)===1&&Number(liked.removed)===1,'like patch not one-marker move');
                keys=await listAll(bucket);
                assert(keys.length===baseline+1+pubMarkers.length,'like object count drift');

                const priv=await removeExploreCatalogTrack066(env,TRACK);
                assert(priv?.ok===true,'private failed');
                const privateMeta=JSON.parse(await (await bucket.get(catalogMetaKey066(TRACK))).text());
                assert(privateMeta?.public===false,'private meta not false');
                assert(Array.isArray(privateMeta?.markerKeys)&&privateMeta.markerKeys.length===0,'private markers not empty');
                keys=await listAll(bucket);
                assert(keys.length===baseline+1,'private should keep only tombstone meta '+keys.length);

                const repubTrack={...baseTrack,likeCount:7};
                const repubMarkers=catalogMarkerKeys066(repubTrack);
                const repub=await syncExploreCatalogTrack066(env,repubTrack,{isPublic:true});
                assert(repub?.ok===true&&repub.changed===true,'republish failed');
                keys=await listAll(bucket);
                assert(keys.length===baseline+1+repubMarkers.length,'republish object count '+keys.length);

                const artistA={uid:OWNER,nickname:'Stage131 Artist A',handle:'stage131-a'};
                const aMarkers=catalogArtistMarkerKeys066(artistA);
                const a=await syncExploreCatalogArtist066(env,artistA);
                assert(a?.ok===true&&a.changed===true,'artist create failed');
                assert(aMarkers.length===2,'artist marker count');
                keys=await listAll(bucket);
                assert(keys.length===baseline+1+repubMarkers.length+1+aMarkers.length,'artist create object count');

                const artistB={uid:OWNER,nickname:'Stage131 Artist B',handle:'stage131-b'};
                const bMarkers=catalogArtistMarkerKeys066(artistB);
                const b=await syncExploreCatalogArtist066(env,artistB);
                assert(b?.ok===true&&b.changed===true,'artist edit failed');
                assert(Number(b.added)===2&&Number(b.removed)===2,'artist edit not targeted 2-for-2');
                for(const key of aMarkers) assert(!(await exists(bucket,key)),'old artist marker remains');
                for(const key of bMarkers) assert(await exists(bucket,key),'new artist marker missing');
                assert(await exists(bucket,catalogArtistMetaKey066(OWNER)),'artist meta missing');
                keys=await listAll(bucket);
                assert(keys.length===baseline+1+repubMarkers.length+1+bMarkers.length,'artist edit object drift');

                const removed=await cleanup(bucket);
                const after=await listAll(bucket);
                assert(after.length===baseline,'cleanup count '+after.length+' baseline '+baseline);
                return out({
                  ok:true,
                  baseline,
                  final:after.length,
                  publish:{added:pub.added,removed:pub.removed,markers:pubMarkers.length},
                  idempotentRepublish:{changed:same.changed},
                  like:{added:liked.added,removed:liked.removed},
                  private:{removed:priv.removed},
                  republish:{added:repub.added,removed:repub.removed,markers:repubMarkers.length},
                  artistCreate:{added:a.added,removed:a.removed},
                  artistEdit:{added:b.added,removed:b.removed},
                  cleanupRemoved:removed,
                });
              }catch(error){
                const removed=await cleanup(bucket).catch(()=>-1);
                return out({ok:false,error:String(error?.message||error),baseline,cleanupRemoved:removed},500);
              }
            }
          };
          BOOT
          node - "$TOKEN" "$GITHUB_RUN_ID" <<'NODE'
          const fs=require('fs');
          const [token,run]=process.argv.slice(2);
          const file='.temp-131-stage.mjs';
          let s=fs.readFileSync(file,'utf8');
          s=s.replace('__TOKEN__',token).replaceAll('__RUN__',run);
          fs.writeFileSync(file,s);
          NODE

          cat > .temp-131-wrangler.jsonc <<'JSON'
          {
            "name": "soridraw-temp-131-catalog-write-stage",
            "main": ".temp-131-stage.mjs",
            "compatibility_date": "2026-08-28",
            "r2_buckets": [
              {
                "binding": "PROFILE_MEDIA",
                "bucket_name": "soridraw-profile-media"
              }
            ]
          }
          JSON

          node --check .temp-131-stage.mjs
          DEV_PID=""
          cleanup_proc(){
            status=$?
            if [ -n "$DEV_PID" ]; then
              kill "$DEV_PID" >/dev/null 2>&1 || true
              wait "$DEV_PID" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup_proc EXIT
          node "$WRANGLER" dev --remote --config .temp-131-wrangler.jsonc --ip 127.0.0.1 --port 8791 > "$RUNNER_TEMP/stage131-dev.log" 2>&1 &
          DEV_PID=$!
          ready=0
          for i in $(seq 1 120); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8791/ || true)"
            if [ "$code" = 403 ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/stage131-dev.log"; exit 1; fi
          code="$(curl -sS -X POST -H "x-stage-token: $TOKEN" -o "$RUNNER_TEMP/stage131.json" -w '%{http_code}' http://127.0.0.1:8791/)"
          cat "$RUNNER_TEMP/stage131.json"
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/stage131.json','utf8'));
          if(x?.ok!==true||Number(x.baseline)!==432||Number(x.final)!==432) throw new Error('stage131 summary mismatch');
          if(x?.idempotentRepublish?.changed!==false) throw new Error('idempotent republish failed');
          if(Number(x?.like?.added)!==1||Number(x?.like?.removed)!==1) throw new Error('like delta not targeted');
          if(Number(x?.artistEdit?.added)!==2||Number(x?.artistEdit?.removed)!==2) throw new Error('artist edit delta not targeted');
          console.log('CATALOG_SYNTHETIC_PUBLISH=PASS');
          console.log('CATALOG_SYNTHETIC_PRIVATE=PASS');
          console.log('CATALOG_SYNTHETIC_REPUBLISH=PASS');
          console.log('CATALOG_SYNTHETIC_LIKE=PASS');
          console.log('CATALOG_SYNTHETIC_PROFILE_EDIT=PASS');
          console.log('CATALOG_BASELINE_RESTORED=432');
          NODE
          kill "$DEV_PID" >/dev/null 2>&1 || true
          wait "$DEV_PID" >/dev/null 2>&1 || true
          DEV_PID=""
          trap - EXIT

      - name: Live postflight cost and protected environments
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){
            const r=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
            const x=await r.json();
            if(!r.ok||x.success===false) throw new Error('Cloudflare '+r.status);
            return x.result||x;
          }
          async function active(name){
            const x=await get('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+name+'/deployments');
            const d=(x.deployments||x||[])[0];
            return [...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0]?.version_id||'';
          }
          (async()=>{
            const preview=await active(process.env.PREVIEW_WORKER);
            const test=await active(process.env.TEST_WORKER);
            const prod=await active(process.env.PRODUCTION_WORKER);
            if(preview!==process.env.EXPECTED_PREVIEW_VERSION) throw new Error('PREVIEW Worker changed');
            if(test!==fs.readFileSync(process.env.RUNNER_TEMP+'/test.before','utf8')) throw new Error('TEST Worker changed');
            if(prod!==fs.readFileSync(process.env.RUNNER_TEMP+'/prod.before','utf8')) throw new Error('PRODUCTION Worker changed');
            console.log('PROTECTED_WORKERS_UNCHANGED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          for sort in latest popular; do
            curl -fsS -D "$RUNNER_TEMP/$sort.head" -o "$RUNNER_TEMP/$sort.json" -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/feed?sort=$sort&limit=40&__soridraw_r2_only=131"
            reads="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r","");print $2}' "$RUNNER_TEMP/$sort.head" | tail -1)"
            writes="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r","");print $2}' "$RUNNER_TEMP/$sort.head" | tail -1)"
            test "$reads" = 0
            test "$writes" = 0
            echo "LIVE_$sort=D1_R0_W0"
          done
          echo 'CANONICAL_D1_WRITE=0'
          echo 'D1_SCHEMA_CHANGE=false'
          echo 'USER_ORIGIN_DATA_CHANGE=false'
          echo 'FIREBASE_CHANGE=false'
          echo 'TEST_PRODUCTION_CHANGE=false'
