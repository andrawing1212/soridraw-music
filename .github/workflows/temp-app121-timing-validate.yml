name: TEMP app121 timing validation

on:
  push:
    branches:
      - work/app121-like-30s-2m-timing

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: App 121 regression
        run: node scripts/verify-121-explore-like-timing-only.mjs
