name: SORIDRAW Backend V2 Step 3-4f Review Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4f-review-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Patch master status and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          text = p.read_text()
          replacements = [
              ('Status: IMPLEMENTATION / Step 3-4e recent-song limited backfill complete and independently verified — 68 canonical recent-origin V2 songs created with deterministic IDs, complete V1 payload preserved and V1 unchanged; Step 3-4f favorites/Music Note writes blocked pending a new read-only match/risk review and explicit approval', 'Status: IMPLEMENTATION / Step 3-4f read-only match/risk review complete — live 738 favorites exactly match the verified backup, 0 trusted recent-song matches, 738 standalone deterministic destinations currently absent; Step 3-4f writes blocked pending explicit approval for the exact 738-create scope'),
              ('### Step 3 — Backup, backfill and verification (3/6 complete; Step 3-4e complete, limited writes verified) 🔄', '### Step 3 — Backup, backfill and verification (3/6 complete; Step 3-4f read-only review complete, write approval pending) 🔄'),
              ('  - [ ] 3-4f Music Note/favorites limited backfill: 738 standalone-preserved songs unless stronger trusted identity is proven at execution time.', '  - [~] 3-4f Music Note/favorites: read-only live review SUCCESS — 738/738 sources unchanged from backup, all UIDs valid, 0 trusted matches to the 68 recent-origin V2 songs, 0 pre-existing standalone destinations/conflicts; exact 738 standalone create-only writes remain blocked pending explicit approval. Full detail: `docs/SORIDRAW_BACKEND_V2_STEP3_4F_READONLY_MATCH_RISK_REVIEW.md`.')
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected master-plan text not found: ' + old[:80])
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          rm .github/workflows/backend-v2-step3-4f-review-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md .github/workflows/backend-v2-step3-4f-review-finalize.yml
          git commit -m 'docs: finalize Step 3-4f read-only review status'
          git push origin HEAD:preview
