name: SORIDRAW 996 Suno Recovery Live Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-suno-recovery-live-diagnostic-996.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Authenticate to Firebase backend project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Read recent rescue Function request evidence
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="rescuesunotrackaudio" AND timestamp>="2026-08-31T22:45:00Z"' \
            --project=soridraw-app-866a5 \
            --limit=200 \
            --order=desc \
            --format=json > "$RUNNER_TEMP/rescue-logs.json"

          python3 - "$RUNNER_TEMP/rescue-logs.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1], encoding='utf-8'))
          print(f'[996] rows={len(rows)}')
          for row in rows:
              ts = row.get('timestamp', '')
              http = row.get('httpRequest') or {}
              status = http.get('status')
              method = http.get('requestMethod')
              url = http.get('requestUrl', '')
              text = row.get('textPayload') or ''
              js = row.get('jsonPayload') or {}
              message = js.get('message') if isinstance(js, dict) else ''
              if status is not None:
                  print(f'[996][request] {ts} {method} status={status} url={url}')
              if text:
                  print(f'[996][text] {ts} {text[:700]}')
              if message:
                  print(f'[996][json] {ts} {str(message)[:700]}')
          PY

      - name: Read getSunoTrackStatus request evidence
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="getsunotrackstatus" AND timestamp>="2026-08-31T22:45:00Z"' \
            --project=soridraw-app-866a5 \
            --limit=200 \
            --order=desc \
            --format=json > "$RUNNER_TEMP/status-logs.json"

          python3 - "$RUNNER_TEMP/status-logs.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1], encoding='utf-8'))
          print(f'[996-status] rows={len(rows)}')
          for row in rows:
              ts = row.get('timestamp', '')
              http = row.get('httpRequest') or {}
              status = http.get('status')
              method = http.get('requestMethod')
              url = http.get('requestUrl', '')
              text = row.get('textPayload') or ''
              js = row.get('jsonPayload') or {}
              message = js.get('message') if isinstance(js, dict) else ''
              if status is not None:
                  print(f'[996-status][request] {ts} {method} status={status} url={url}')
              if text:
                  print(f'[996-status][text] {ts} {text[:700]}')
              if message:
                  print(f'[996-status][json] {ts} {str(message)[:700]}')
          PY

      - name: Result
        run: echo '[996] Read-only live recovery evidence captured. No deploy or data write performed.'
