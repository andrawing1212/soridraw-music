name: OPS Inspect Vocal Add JSX

on:
  push:
    branches:
      - ops-preview-vocal-add-light-white-v12

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Print actual vocal add-member JSX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          lines = p.read_text(encoding='utf-8').splitlines()
          hits = [i for i,l in enumerate(lines) if 'data-vocal-add-member' in l or '남성 멤버 추가' in l or '여성 멤버 추가' in l]
          print('hits=', [i+1 for i in hits])
          shown=set()
          for i in hits:
              start=max(0,i-25); end=min(len(lines),i+30)
              key=(start,end)
              if key in shown: continue
              shown.add(key)
              print(f'\n--- lines {start+1}-{end} ---')
              for n in range(start,end):
                  print(f'{n+1:06d}: {lines[n]}')
          print('\n--- theme state candidates ---')
          for i,l in enumerate(lines):
              if any(k in l for k in ['isDarkMode', 'theme ===', 'currentTheme', 'data-soridraw-theme', 'studio-black']):
                  if abs(i - hits[0]) < 1200 if hits else False:
                      print(f'{i+1:06d}: {l}')
          PY
