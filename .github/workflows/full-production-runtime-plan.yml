name: Full production release existing runtime connection plan
on:
  push:
    branches: [prep/full-preview-production-parity]
    paths:
      - 'scripts/full-production-release-runtime-plan.mjs'
      - '.github/workflows/full-production-runtime-plan.yml'
permissions:
  contents: read
jobs:
  plan:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: google-github-actions/auth@v2
        id: firebase
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token
      - name: Resolve existing shared queue, cron, receiver and environment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
          EXISTING_RELEASE_SECRET: ${{ secrets.SORIDRAW_PRIVATE_BATCH416_HMAC_SECRET }}
        run: node scripts/full-production-release-runtime-plan.mjs
