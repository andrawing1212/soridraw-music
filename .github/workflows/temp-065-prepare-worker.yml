name: TEMP 065 Prepare Worker

on:
  push:
    branches: ['work/065-like-sync-count-cost']
    paths:
      - '.deploy/temp-065-prepare-worker.trigger'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: App TypeScript and build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

      - name: Fetch active PREVIEW Worker source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/worker065"
          node <<'NODE'
          import { writeFileSync } from 'node:fs';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker = process.env.PREVIEW_WORKER;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, Accept: 'application/json' };
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          const deployments = await fetch(`${api}/workers/scripts/${worker}/deployments`, { headers }).then(async r => {
            if (!r.ok) throw new Error(`deployments ${r.status}: ${await r.text()}`);
            return r.json();
          });
          const versions = deployments?.result?.deployments?.[0]?.versions || [];
          const active = [...versions].sort((a,b) => Number(b?.percentage||0)-Number(a?.percentage||0))[0];
          if (!active?.version_id || Number(active?.percentage||0) < 99.99) throw new Error('PREVIEW active Worker version not resolved');
          const version = await fetch(`${api}/workers/workers/${encodeURIComponent(worker)}/versions/${encodeURIComponent(active.version_id)}?include=modules`, { headers }).then(async r => {
            if (!r.ok) throw new Error(`version ${r.status}: ${await r.text()}`);
            return r.json();
          });
          const body = version?.result || version || {};
          const modules = Array.isArray(body.modules) ? body.modules : [];
          const main = String(body.main_module || modules[0]?.name || '');
          const module = modules.find(x => String(x?.name||'') === main) || modules[0];
          const content = String(module?.content_base64 || '');
          if (!content) throw new Error('PREVIEW active Worker source missing');
          let source = Buffer.from(content, 'base64').toString('utf8');
          if (!source.includes('SORIDRAW_EXPLORE_LIKE_USER_BATCH_034_20260911') && source.includes('handleLikeBatch034')) source += '\n// SORIDRAW_EXPLORE_LIKE_USER_BATCH_034_20260911\n';
          if (!source.includes('SORIDRAW_EXPLORE_LIKE_DEFERRED_AGGREGATE_035_20260911') && source.includes('processExploreLikeAggregateWave035')) source += '\n// SORIDRAW_EXPLORE_LIKE_DEFERRED_AGGREGATE_035_20260911\n';
          writeFileSync(`${process.env.RUNNER_TEMP}/worker065/worker.js`, source, 'utf8');
          console.log(`ACTIVE_PREVIEW_VERSION=${active.version_id}`);
          NODE

      - name: Apply 036 and verify generated Worker
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/worker065" node cloudflare/explore-worker/patches/036-explore-like-derived-intake.mjs
          node --check "$RUNNER_TEMP/worker065/worker.js"
          SORIDRAW_GENERATED_WORKER="$RUNNER_TEMP/worker065/worker.js" node scripts/verify-explore-like-cost-optimization.mjs
          cp "$RUNNER_TEMP/worker065/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-entry.js

      - name: Worker dry-run
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          (cd canonical && node ../node_modules/wrangler/bin/wrangler.js deploy --config wrangler.preview.jsonc --dry-run)

      - name: Commit prepared canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'soridraw-release-bot@users.noreply.github.com'
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          if git diff --cached --quiet; then
            echo 'No canonical Worker change produced.'
            exit 1
          fi
          git commit -m 'build: prepare PREVIEW 065 worker'
          git push origin HEAD:work/065-like-sync-count-cost
