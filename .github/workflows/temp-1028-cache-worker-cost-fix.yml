name: Temp 1028 Cache + Publication Cost Fix
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1028-cache-worker-cost-fix.yml']
permissions:
  contents: write
concurrency:
  group: soridraw-1028-cache-worker-cost-fix
  cancel-in-progress: false
jobs:
  fix_test_deploy:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
      D1_NAME: soridraw-explore-preview
      D1_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      R2_BUCKET: soridraw-profile-media-preview
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 80

      - name: Lock 1028 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='6101eb4575ab2e0979e1734eb09515f725128e99'
          git merge-base --is-ancestor "$BASE" HEAD
          test -f .deploy/apply-1028-cache-integrity-and-library-more.py
          test -f cloudflare/explore-worker/patches/009-publication-mutation-o1.mjs
          echo 'BASELINE_1028=PASS'

      - name: Apply client cache integrity fix
        run: python3 .deploy/apply-1028-cache-integrity-and-library-more.py

      - name: Client cost safety guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text()
          lib=Path('src/pages/SunoLibraryPage.tsx').read_text()
          bundle=Path('src/lib/listBundleCache.ts').read_text()
          s=app.index('  const loadMoreFavorites = useCallback(async () => {')
          e=app.index('  const syncMusicNoteIncrementalFromRemoteVersion',s)
          block=app[s:e]
          assert block.count('await getDocs(')==1
          assert 'while (' not in block and 'maxScanPages' not in block
          assert "orderBy('createdAtMs', 'desc')" in block
          assert 'limit(FAVORITES_PAGE_SIZE)' in block
          assert 'SORIDRAW_MUSIC_NOTE_CACHE_INTEGRITY_1028' in app
          assert 'hasOlderCachedRows' in lib
          assert "kind !== 'musicNote'" in bundle
          print('CLIENT_COST_GUARD=PASS')
          PY

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit validated client source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx src/pages/SunoLibraryPage.tsx src/lib/listBundleCache.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(cache): restore bounded Music Note and Library continuation'
            git push origin HEAD:preview
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build current PREVIEW Worker payload
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          rm -rf .remote-worker && mkdir -p .remote-worker
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;
            const ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!v?.version_id||Number(v.percentage||0)<99.99)throw new Error('active PREVIEW Worker is not 100%');
            const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`),mods=ver.modules||[];
            for(const m of mods){const p=path.join('.remote-worker',m.name||'worker.js');fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,Buffer.from(m.content_base64,'base64'))}
            const main=ver.main_module||mods[0]?.name||'worker.js',s=await g(`${base}/settings`),bs=s.bindings||[];
            const d1=bs.find(b=>b.type==='d1'&&b.name==='DB'),r2=bs.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA');
            if(!d1||(d1.id||d1.database_id)!==process.env.D1_ID)throw new Error('D1 mismatch');
            if(!r2||r2.bucket_name!==process.env.R2_BUCKET)throw new Error('R2 mismatch');
            const cfg={name:W,main:`./${main}`,compatibility_date:String(s.compatibility_date||'2026-08-28').slice(0,10),keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.D1_NAME,database_id:process.env.D1_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.R2_BUCKET}]};
            if(s.compatibility_flags?.length)cfg.compatibility_flags=s.compatibility_flags;
            fs.writeFileSync('.remote-worker/wrangler.jsonc',JSON.stringify(cfg,null,2)+'\n');
            console.log('WORKER_BASELINE='+v.version_id);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          grep -q 'refreshOrPrebuildPublicProfileTrackWindow' .remote-worker/worker.js
          grep -q 'syncMusicNotePublicationR2AfterMutation' .remote-worker/worker.js
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/009-publication-mutation-o1.mjs
          node --check .remote-worker/worker.js
          grep -q 'SORIDRAW_PUBLICATION_MUTATION_O1_009' .remote-worker/worker.js
          echo 'WORKER_O1_STATIC_GUARD=PASS'

      - name: Deploy Cloudflare PREVIEW Worker only
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          npx --yes wrangler@4 deploy --cwd .remote-worker --keep-vars
          cd ../..
          node <<'NODE'
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,900));return x.result||x}
          (async()=>{const ds=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0],ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`),m=(ver.modules||[]).find(x=>x.name===ver.main_module)||(ver.modules||[])[0],s=Buffer.from(m.content_base64,'base64').toString('utf8');if(!s.includes('SORIDRAW_PUBLICATION_MUTATION_O1_009'))throw new Error('009 marker missing after deploy');console.log('WORKER_DEPLOYED_VERSION='+v.version_id)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          code="$(curl -sS -o "$RUNNER_TEMP/worker-noauth.json" -w '%{http_code}' 'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/me/music-note-publications-bundle')"
          echo "WORKER_NOAUTH_HTTP=$code"
          test "$code" != 404
          test "$code" != 500

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW and verify exact build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then ok='yes'; echo "EXACT_BUILD_PASS=$url"; break; fi
              fi
              sleep 10
            done
            test "$ok" = 'yes'
          done
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo 'PRODUCTION_UNCHANGED=PASS'

      - name: Cleanup temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin preview
          git rm .github/workflows/temp-1028-cache-worker-cost-fix.yml
          git commit -m 'chore(preview): remove temporary 1028 workflow'
          git push origin HEAD:preview
