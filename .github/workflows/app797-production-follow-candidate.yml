name: APP797 existing follow writer production source candidate (read-only)
on:
  push:
    branches: [prep/production-follow-existing-writer]
    paths:
      - 'scripts/app797-build-production-follow-readonly.mjs'
      - 'scripts/verify-797-active-owner-connection.mjs'
      - '.github/workflows/app797-production-follow-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact active source and isolated owner connection; no cloud writes
        run: node scripts/app797-build-production-follow-readonly.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP797_EXISTING_BRIDGE_SECRET: ${{ secrets.SORIDRAW_OWNER_DO_BRIDGE_SECRET_600 }}
