name: TEMP Restore Explore Like Worker Bindings 117

on:
  push:
    branches:
      - release/restore-like-worker-bindings-117
    paths:
      - .github/workflows/temp-restore-like-worker-bindings-117.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      RELEASE_SOURCE_SHA: b9b612adbfe49a462c72c98f9efc65165d32b31c
    steps:
      - name: Checkout exact approved PREVIEW source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          node scripts/verify-release-promotion-system.mjs
          echo WORKER_BINDING_RELEASE_SOURCE=PASS

      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: D1 SELECT-only preflight
        shell: bash
        run: |
          set -euo pipefail
          node .deploy/release-worker-runtime.mjs test dry-run
          cfg="$PWD/cloudflare/explore-worker/.release-system/test/wrangler.jsonc"
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          node "$WRANGLER" d1 execute DB --remote --config "$cfg" --command "SELECT (SELECT COUNT(*) FROM sqlite_schema WHERE type='table' AND name IN ('explore_derived_state','explore_derived_changes','explore_derived_tracks','explore_derived_profiles','explore_like_batches_035','explore_like_processor_035')) AS required_tables,(SELECT seeded FROM explore_derived_state WHERE id=1) AS seeded" --json > "$RUNNER_TEMP/d1.json"
          node -e "const p=require(process.env.RUNNER_TEMP+'/d1.json'),r=p.flatMap(x=>x.results||[])[0];if(!r||+r.required_tables<6||+r.seeded!==1)throw Error('D1 preflight failed')"
          echo D1_SELECT_ONLY_PREFLIGHT=PASS

      - name: One-time TEST Durable Object migration and binding restore
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          active_version() {
            curl -fsS "${auth[@]}" "$api/workers/scripts/$1/deployments"               | jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id'
          }
          schedules() {
            curl -fsS "${auth[@]}" "$api/workers/scripts/$1/schedules"               | jq -c '.result | if type=="array" then . elif ((.schedules // null)|type)=="array" then .schedules else [] end | map({cron:(.cron // "")}) | map(select(.cron != "")) | sort_by(.cron)'
          }
          restore_schedules() {
            curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json'               --data "$2" "$api/workers/scripts/$1/schedules" >/dev/null
          }

          worker=soridraw-explore-test
          old_version="$(active_version "$worker")"
          old_schedules="$(schedules "$worker")"
          node .deploy/release-worker-runtime.mjs test dry-run
          cfg="$PWD/cloudflare/explore-worker/.release-system/test/wrangler.jsonc"
          deployed=false
          rollback() {
            code=$?
            set +e
            if [ "$deployed" = true ]; then
              node "$WRANGLER" rollback "$old_version" --name "$worker" --config "$cfg" --message "automatic rollback after failed TEST like-binding bootstrap" || true
              restore_schedules "$worker" "$old_schedules" || true
              echo TEST_WORKER_ROLLBACK=ATTEMPTED
            fi
            exit "$code"
          }
          trap rollback ERR

          node "$WRANGLER" deploy --config "$cfg"
          deployed=true
          restore_schedules "$worker" "$old_schedules"
          sleep 3
          new_version="$(active_version "$worker")"
          test "$new_version" != "$old_version"
          node .deploy/release-worker-runtime.mjs test verify

          curl -fsS "${auth[@]}" "$api/workers/scripts/$worker/settings" > "$RUNNER_TEMP/test-settings.json"
          jq -e '.result.bindings[] | select(.name=="LIKE_RATE_LIMITER" and .type=="ratelimit")' "$RUNNER_TEMP/test-settings.json" >/dev/null
          jq -e '.result.bindings[] | select(.name=="EXPLORE_LIKE_BATCH_SCHEDULER" and .type=="durable_object_namespace" and .class_name=="ExploreLikeBatchScheduler103")' "$RUNNER_TEMP/test-settings.json" >/dev/null

          trap - ERR
          echo "TEST_WORKER_BEFORE=$old_version"
          echo "TEST_WORKER_AFTER=$new_version"
          echo TEST_REQUIRED_LIKE_BINDINGS=PASS
          echo TEST_WORKER_VERIFY=PASS

      - name: One-time PRODUCTION Durable Object migration and binding restore
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          active_version() {
            curl -fsS "${auth[@]}" "$api/workers/scripts/$1/deployments"               | jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id'
          }
          schedules() {
            curl -fsS "${auth[@]}" "$api/workers/scripts/$1/schedules"               | jq -c '.result | if type=="array" then . elif ((.schedules // null)|type)=="array" then .schedules else [] end | map({cron:(.cron // "")}) | map(select(.cron != "")) | sort_by(.cron)'
          }
          restore_schedules() {
            curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json'               --data "$2" "$api/workers/scripts/$1/schedules" >/dev/null
          }

          worker=soridraw-explore-api
          old_version="$(active_version "$worker")"
          old_schedules="$(schedules "$worker")"
          node .deploy/release-worker-runtime.mjs production dry-run
          cfg="$PWD/cloudflare/explore-worker/.release-system/production/wrangler.jsonc"
          deployed=false
          rollback() {
            code=$?
            set +e
            if [ "$deployed" = true ]; then
              node "$WRANGLER" rollback "$old_version" --name "$worker" --config "$cfg" --message "automatic rollback after failed PRODUCTION like-binding bootstrap" || true
              restore_schedules "$worker" "$old_schedules" || true
              echo PRODUCTION_WORKER_ROLLBACK=ATTEMPTED
            fi
            exit "$code"
          }
          trap rollback ERR

          node "$WRANGLER" deploy --config "$cfg"
          deployed=true
          restore_schedules "$worker" "$old_schedules"
          sleep 3
          new_version="$(active_version "$worker")"
          test "$new_version" != "$old_version"
          node .deploy/release-worker-runtime.mjs production verify

          curl -fsS "${auth[@]}" "$api/workers/scripts/$worker/settings" > "$RUNNER_TEMP/prod-settings.json"
          jq -e '.result.bindings[] | select(.name=="LIKE_RATE_LIMITER" and .type=="ratelimit")' "$RUNNER_TEMP/prod-settings.json" >/dev/null
          jq -e '.result.bindings[] | select(.name=="EXPLORE_LIKE_BATCH_SCHEDULER" and .type=="durable_object_namespace" and .class_name=="ExploreLikeBatchScheduler103")' "$RUNNER_TEMP/prod-settings.json" >/dev/null

          trap - ERR
          echo "PRODUCTION_WORKER_BEFORE=$old_version"
          echo "PRODUCTION_WORKER_AFTER=$new_version"
          echo PRODUCTION_REQUIRED_LIKE_BINDINGS=PASS
          echo PRODUCTION_WORKER_VERIFY=PASS

      - name: Final three-environment binding audit
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for worker in soridraw-explore-preview soridraw-explore-test soridraw-explore-api; do
            body="$RUNNER_TEMP/$worker.json"
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$api/workers/scripts/$worker/settings" > "$body"
            jq -e '.result.bindings[] | select(.name=="LIKE_RATE_LIMITER" and .type=="ratelimit")' "$body" >/dev/null
            jq -e '.result.bindings[] | select(.name=="EXPLORE_LIKE_BATCH_SCHEDULER" and .type=="durable_object_namespace" and .class_name=="ExploreLikeBatchScheduler103")' "$body" >/dev/null
            echo "$worker REQUIRED_LIKE_BINDINGS=PASS"
          done
          echo THREE_ENV_REQUIRED_LIKE_BINDINGS=PASS
          echo HOSTING_CHANGE=NONE
          echo D1_DATA_MUTATION=NONE
          echo FUNCTIONS_RULES_CHANGE=NONE
