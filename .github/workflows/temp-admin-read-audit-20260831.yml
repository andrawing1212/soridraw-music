name: Temp Full Admin Read Audit 20260831

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-admin-read-audit-20260831.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Full admin route and read audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ADMIN RELATED FILES ==='
          find src -type f \( -name '*Admin*' -o -name '*Master*' \) | sort
          echo
          echo '=== ADMIN ROUTES / MENU REFERENCES ==='
          grep -RInE "(/admin/(users|api|app-settings|gemini-audit|sections|vocals|master)|Admin(User|Suno|App|Gemini|Section|Vocal)|MasterPermissions)" src --include='*.tsx' --include='*.ts' || true
          echo
          echo '=== FIRESTORE READS/LISTENERS IN ADMIN FILES ==='
          grep -RInE "\b(getDoc|getDocs|getDocFromServer|getDocsFromServer|onSnapshot|collection\(|query\()" src/pages src/components --include='*Admin*.tsx' --include='MasterPermissionsPage.tsx' || true
          echo
          echo '=== FUNCTIONS/FETCH IN ADMIN FILES ==='
          grep -RInE "httpsCallable|cloudfunctions|fetch\(" src/pages src/components --include='*Admin*.tsx' --include='MasterPermissionsPage.tsx' || true
          echo
          echo '=== APP STARTUP FIRESTORE READ/LISTENER CALLS ==='
          grep -nE "\b(getDoc|getDocs|getDocFromServer|getDocsFromServer|onSnapshot|collection\(|query\()" src/App.tsx || true
          echo
          echo '=== APP STARTUP ADMIN/SETTINGS REFERENCES ==='
          grep -nE "app_settings|user_structures|users|vocalTones|section_tags|navigation_visibility|lyric_cliche_guard" src/App.tsx || true
