name: SORIDRAW Backend V2 Step 3-4d Audit Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4d-audit-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Patch master plan with audit resolution and approval guard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          text = p.read_text()

          old_status = 'Status: IMPLEMENTATION / Step 3-4d playlist-item limited backfill complete and verified — 49 V2 playlist items created under 42 verified V2 playlist headers, V1 unchanged; awaiting approval for Step 3-4e recent-song limited backfill'
          new_status = 'Status: IMPLEMENTATION / Step 3-4d playlist-item limited backfill complete, verified and execution-origin audited — 49 V2 playlist items preserved under 42 verified V2 playlist headers, V1 unchanged; Step 3-4e writes blocked pending a new explicit approval after the Step 3-4d audit report'
          if old_status not in text:
              raise SystemExit('MASTER_STATUS_PATTERN_MISSING')
          text = text.replace(old_status, new_status, 1)

          anchor13 = '13. User Gemini/Suno/provider API keys must use encrypted-at-rest persistent storage only; plaintext must never be persisted, cached, logged or returned to the browser. Future proxy runtimes may decrypt only just-in-time for the outbound provider request and must discard plaintext references immediately. See `docs/SORIDRAW_API_KEY_SECURITY_REQUIREMENTS.md`.'
          rule14 = '14. A write-capable Backend V2 migration workflow must not be created, armed or auto-triggered before explicit approval for that exact write scope. Read-only plan/risk review and reporting come first; the temporary write workflow is created only after approval and removed immediately after verification.'
          if rule14 not in text:
              if anchor13 not in text:
                  raise SystemExit('MASTER_RULE13_PATTERN_MISSING')
              text = text.replace(anchor13, anchor13 + '\n' + rule14, 1)

          old_tracker = '  - [x] 3-4d Playlist-item limited backfill complete: 49 items created under their preserved playlist IDs after all 42 parent V2 playlist headers were re-verified; full payload/source/color/order parity verified and V1 remained unchanged.'
          new_tracker = '  - [x] 3-4d Playlist-item limited backfill complete: 49 items created under their preserved playlist IDs after all 42 parent V2 playlist headers were re-verified; full payload/source/color/order parity verified and V1 remained unchanged. Execution-origin audit resolved the later 98-item collection-group observation and added a stricter pre-approval workflow guard.'
          if old_tracker in text:
              text = text.replace(old_tracker, new_tracker, 1)

          detail_anchor = '- Full result: `docs/SORIDRAW_BACKEND_V2_STEP3_4D_PLAYLIST_ITEMS_RESULT.md`.'
          audit_line = '- Follow-up execution-origin audit matched all 49 V2 document create times to original run `32853791057`; later duplicate checks created 0 additional documents. The audit also found the original write run preceded the explicit approval currently visible in this conversation, so all remaining write steps now require the stronger pre-approval workflow guard. Full audit: `docs/SORIDRAW_BACKEND_V2_STEP3_4D_EXECUTION_AUDIT.md`.'
          if audit_line not in text:
              if detail_anchor not in text:
                  raise SystemExit('MASTER_STEP34D_DETAIL_ANCHOR_MISSING')
              text = text.replace(detail_anchor, detail_anchor + '\n' + audit_line, 1)

          gate_anchor = 'At every stage boundary:\n- no issue/direct check needed → request explicit approval for next operation,\n- direct user validation needed → stop and say exactly what must be checked,\n- risk/problem found → stop and report cause/options before any data change.'
          gate_new = gate_anchor + '\n- for any Firestore/RTDB/Storage data-writing migration step, do not create or arm an auto-triggering write workflow until that exact scope has been explicitly approved.'
          if 'do not create or arm an auto-triggering write workflow until that exact scope has been explicitly approved' not in text:
              if gate_anchor not in text:
                  raise SystemExit('MASTER_GATE_ANCHOR_MISSING')
              text = text.replace(gate_anchor, gate_new, 1)

          p.write_text(text)
          PY

      - name: Validate scope and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md"
          grep -q 'write-capable Backend V2 migration workflow must not be created' docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          grep -q 'SORIDRAW_BACKEND_V2_STEP3_4D_EXECUTION_AUDIT.md' docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git rm .github/workflows/backend-v2-step3-4d-audit-finalize.yml
          git commit -m 'docs: finalize Step 3-4d audit and approval guard'
          git push origin HEAD:preview
