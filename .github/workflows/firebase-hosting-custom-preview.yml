name: SORIDRAW PREVIEW App Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional exact commit SHA from preview history. Leave empty for latest preview.'
        required: false
        default: ''
  push:
    branches: [preview]
    paths:
      - '.deploy/preview-app-release.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-preview-app-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FIREBASE_PROJECT: soridraw
      SHARED_DATA_PROJECT: soridraw-app-866a5
      RTDB_RULES_URL: https://soridraw-app-866a5-default-rtdb.firebaseio.com/.settings/rules.json
      PREVIEW_URL: https://preview.soridraw.com/
      TEST_URL: https://test.soridraw.com/
      PRODUCTION_URL: https://soridraw.com/

    steps:
      - name: Checkout approved PREVIEW source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || 'preview' }}
          fetch-depth: 0

      - name: Lock source and protected refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main production --no-tags
          target="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$target" origin/preview
          echo "TARGET_SHA=$target" >> "$GITHUB_ENV"
          git rev-parse origin/main > "$RUNNER_TEMP/main-before.sha"
          git rev-parse origin/production > "$RUNNER_TEMP/production-before.sha"
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$TEST_URL" -o "$RUNNER_TEMP/test-before.html"
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PRODUCTION_URL" -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/test-before.html" | awk '{print $1}' > "$RUNNER_TEMP/test-before.sha"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          echo "LOCKED_PREVIEW_SHA=$target"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy shared RTDB rules when release requests public like live sync
        shell: bash
        run: |
          set -euo pipefail
          trigger_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.deploy/preview-app-release.trigger"
          if ! curl -fsSL "$trigger_url" | grep -Fxq 'deploy_shared_rtdb_rules=true'; then
            echo 'SHARED_RTDB_RULES_DEPLOY=SKIPPED'
            exit 0
          fi

          npx --yes firebase-tools@latest deploy \
            --only database \
            --project "$SHARED_DATA_PROJECT" \
            --config firebase.json \
            --non-interactive
          echo 'SHARED_RTDB_RULES_DEPLOY=PASS'

          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          path = os.environ.get('GOOGLE_GHA_CREDS_PATH') or os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
          if not path:
              raise SystemExit('service-account credential file missing')
          creds = service_account.Credentials.from_service_account_file(
              path,
              scopes=[
                  'https://www.googleapis.com/auth/firebase.database',
                  'https://www.googleapis.com/auth/userinfo.email',
              ],
          )
          creds.refresh(Request())
          if not creds.token:
              raise SystemExit('RTDB OAuth token unavailable')
          Path(os.environ['RUNNER_TEMP'], 'rtdb-access-token').write_text(creds.token, encoding='utf-8')
          PY
          token="$(cat "$RUNNER_TEMP/rtdb-access-token")"
          curl -fsS --max-time 30 "${RTDB_RULES_URL}?access_token=${token}" > "$RUNNER_TEMP/rtdb-rules-after.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          local = json.loads(Path('database.rules.json').read_text(encoding='utf-8'))
          remote = json.loads(Path(os.environ['RUNNER_TEMP'] + '/rtdb-rules-after.json').read_text(encoding='utf-8'))
          if remote != local:
              raise SystemExit('RTDB deployed rules do not match approved source')
          print('SHARED_RTDB_RULES_EXACT_MATCH=PASS')
          PY
          rm -f "$RUNNER_TEMP/rtdb-access-token"
          echo 'NO_USER_DATA_MIGRATION=true'

      - name: Deploy PREVIEW Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT" \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify PREVIEW exact build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          ok=''
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PREVIEW_URL" -o "$RUNNER_TEMP/preview.html"; then
              remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
              if [ "$remote_sha" = "$local_sha" ]; then
                ok=yes
                break
              fi
            fi
            sleep 2
          done
          test "$ok" = yes
          local_version="$(node -e "process.stdout.write(String(require('./public/app-version.json').version || ''))")"
          remote_version="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${PREVIEW_URL}app-version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).version||'')))")"
          test -n "$local_version"
          test "$remote_version" = "$local_version"
          echo "PREVIEW_APP_VERSION=$remote_version"
          echo "PREVIEW_EXACT_BUILD=PASS"

      - name: Verify TEST and PRODUCTION unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$TEST_URL" -o "$RUNNER_TEMP/test-after.html"
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PRODUCTION_URL" -o "$RUNNER_TEMP/prod-after.html"
          test "$(sha256sum "$RUNNER_TEMP/test-after.html" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/test-before.sha")"
          test "$(sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/prod-before.sha")"
          echo 'TEST_PRODUCTION_UNCHANGED=PASS'
