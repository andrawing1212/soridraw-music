name: TEMP 083 Prepare Publication PK Read

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-083-prepare-publication-pk-read.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create 083 primary-key batch read patch and guards
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          patch = r'''import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const remoteDir = process.env.SORIDRAW_REMOTE_WORKER_DIR;
          if (!remoteDir) throw new Error('SORIDRAW_REMOTE_WORKER_DIR is required.');
          const workerPath = join(remoteDir, 'worker.js');
          let source = readFileSync(workerPath, 'utf8');
          const MARKER = 'SORIDRAW_PUBLICATION_PK_BATCH_READ_050_20260914';
          if (source.includes(MARKER)) {
            console.log('[050] publication primary-key batch read already applied.');
            process.exit(0);
          }
          if (!source.includes('SORIDRAW_PUBLICATION_INTERNAL_BATCH_049_20260914')) {
            throw new Error('[050] Worker 049 prerequisite missing.');
          }

          const functionRange = (name) => {
            const needles = [`async function ${name}(`, `function ${name}(`];
            let start = -1;
            for (const needle of needles) {
              start = source.indexOf(needle);
              if (start >= 0) break;
            }
            if (start < 0) throw new Error(`[050] function missing: ${name}`);
            const brace = source.indexOf('{', start);
            let depth = 0, quote = '', escaped = false, comment = '';
            for (let index = brace; index < source.length; index += 1) {
              const char = source[index], next = source[index + 1];
              if (comment === 'line') { if (char === '\n') comment = ''; continue; }
              if (comment === 'block') { if (char === '*' && next === '/') { comment = ''; index += 1; } continue; }
              if (quote) {
                if (escaped) escaped = false;
                else if (char === '\\') escaped = true;
                else if (char === quote) quote = '';
                continue;
              }
              if (char === '/' && next === '/') { comment = 'line'; index += 1; continue; }
              if (char === '/' && next === '*') { comment = 'block'; index += 1; continue; }
              if ('"\'`'.includes(char)) { quote = char; continue; }
              if (char === '{') depth += 1;
              if (char === '}' && --depth === 0) return { start, end: index + 1, text: source.slice(start, index + 1) };
            }
            throw new Error(`[050] unterminated function: ${name}`);
          };

          const current = functionRange('handleMusicNotePublicationBatch048');
          let batch = current.text;
          const ownerScan = 'WHERE owner_uid=? AND id IN (';
          if ((batch.match(/WHERE owner_uid=\? AND id IN \(/g) || []).length !== 1) {
            throw new Error('[050] expected exactly one owner+id batch read anchor.');
          }
          batch = batch.replace(ownerScan, 'WHERE id IN (');
          const oldBind = `.bind(\n        authContext.uid,\n        ...trackIds,\n      ).all();\n      canonicalRows = rows.results || [];`;
          const newBind = `.bind(\n        ...trackIds,\n      ).all();\n      canonicalRows = (rows.results || []).filter(\n        (row) => String(row?.owner_uid || '') === authContext.uid,\n      );`;
          if (!batch.includes(oldBind)) throw new Error('[050] canonical batch bind anchor missing.');
          batch = batch.replace(oldBind, newBind);
          if (!batch.includes("WHERE id=? AND owner_uid=? AND source_type='music_note'")) {
            throw new Error('[050] write ownership guard must remain intact.');
          }
          source = source.slice(0, current.start) + batch + source.slice(current.end);
          source += `\n// ${MARKER}\n`;
          writeFileSync(workerPath, source, 'utf8');
          console.log('[050] registered publication batch canonical read now uses track primary keys; owner authorization is validated after read and remains in every UPDATE guard.');
          '''
          Path('cloudflare/explore-worker/patches/050-publication-primary-key-batch-read.mjs').write_text(patch, encoding='utf-8')

          manifest_path = Path('cloudflare/explore-worker/release-patches.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          name = '050-publication-primary-key-batch-read.mjs'
          if name not in manifest['patches']:
              manifest['patches'].append(name)
          if manifest['patches'][-1] != name:
              raise SystemExit('050 must be final release patch')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          verifier = r'''import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const workerPath = process.env.SORIDRAW_GENERATED_WORKER || 'cloudflare/explore-worker/canonical/preview-worker.js';
          const worker = readFileSync(workerPath, 'utf8');
          const manifest = JSON.parse(readFileSync('cloudflare/explore-worker/release-patches.json', 'utf8'));
          const release = readFileSync('.github/workflows/cloudflare-explore-preview-release.yml', 'utf8');

          const functionText = (source, name) => {
            const needles=[`async function ${name}(`,`function ${name}(`];
            let start=-1;
            for(const needle of needles){ start=source.indexOf(needle); if(start>=0) break; }
            assert.ok(start>=0,`missing function ${name}`);
            const brace=source.indexOf('{',start);
            let depth=0,quote='',escaped=false,comment='';
            for(let i=brace;i<source.length;i+=1){
              const c=source[i],n=source[i+1];
              if(comment==='line'){ if(c==='\n') comment=''; continue; }
              if(comment==='block'){ if(c==='*'&&n==='/'){comment='';i+=1;} continue; }
              if(quote){ if(escaped) escaped=false; else if(c==='\\') escaped=true; else if(c===quote) quote=''; continue; }
              if(c==='/'&&n==='/'){comment='line';i+=1;continue;}
              if(c==='/'&&n==='*'){comment='block';i+=1;continue;}
              if('"\'`'.includes(c)){quote=c;continue;}
              if(c==='{') depth+=1;
              if(c==='}'&&--depth===0) return source.slice(start,i+1);
            }
            throw new Error(`unterminated function ${name}`);
          };

          assert.equal(manifest.patches.at(-1), '050-publication-primary-key-batch-read.mjs');
          assert.match(worker, /SORIDRAW_PUBLICATION_PK_BATCH_READ_050_20260914/);
          const batch = functionText(worker, 'handleMusicNotePublicationBatch048');
          assert.match(batch, /SELECT \* FROM tracks\s+WHERE id IN/);
          assert.doesNotMatch(batch, /SELECT \* FROM tracks[\s\S]{0,120}WHERE owner_uid=\? AND id IN/);
          assert.match(batch, /canonicalRows = \(rows\.results \|\| \[\]\)\.filter/);
          assert.match(batch, /String\(row\?\.owner_uid \|\| ''\) === authContext\.uid/);
          assert.match(batch, /WHERE id=\? AND owner_uid=\? AND source_type='music_note'/);
          assert.match(release, /LIVE_PUBLICATION_PK_PLAN=PASS/);
          console.log('PASS 083: publication batch uses track PK lookup instead of owner-wide scan; authorization and write guard remain intact.');
          '''
          Path('scripts/verify-083-publication-pk-read.mjs').write_text(verifier, encoding='utf-8')

          p = Path('scripts/verify-explore-like-cost-optimization.mjs')
          s = p.read_text(encoding='utf-8')
          old = """assert.equal(manifest.patches.at(-5), '045-publication-revision-metadata.mjs', '045 must remain before 046/047/048/049');
          assert.equal(manifest.patches.at(-4), '046-publication-write-compaction.mjs', '046 must remain before 047/048/049');
          assert.equal(manifest.patches.at(-3), '047-publication-state-transition.mjs', '047 must remain before 048/049');
          assert.equal(manifest.patches.at(-2), '048-page-exit-publication-batch.mjs', '048 must remain before 049');
          assert.equal(manifest.patches.at(-1), '049-publication-internal-batch-compaction.mjs', '049 internal publication batch must be final');"""
          new = """assert.equal(manifest.patches.at(-6), '045-publication-revision-metadata.mjs', '045 must remain before 046/047/048/049/050');
          assert.equal(manifest.patches.at(-5), '046-publication-write-compaction.mjs', '046 must remain before 047/048/049/050');
          assert.equal(manifest.patches.at(-4), '047-publication-state-transition.mjs', '047 must remain before 048/049/050');
          assert.equal(manifest.patches.at(-3), '048-page-exit-publication-batch.mjs', '048 must remain before 049/050');
          assert.equal(manifest.patches.at(-2), '049-publication-internal-batch-compaction.mjs', '049 must remain before 050');
          assert.equal(manifest.patches.at(-1), '050-publication-primary-key-batch-read.mjs', '050 publication PK batch read must be final');"""
          if old not in s:
              raise SystemExit('release patch order anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('.github/workflows/cloudflare-explore-preview-release.yml')
          s = p.read_text(encoding='utf-8')
          if 'verify-083-publication-pk-read.mjs' not in s:
              anchor = '            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-082-publication-batch.mjs\n'
              if anchor not in s:
                  raise SystemExit('083 verifier workflow anchor missing')
              s = s.replace(anchor, anchor + '            SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-083-publication-pk-read.mjs\n', 1)
          if 'LIVE_PUBLICATION_PK_PLAN=PASS' not in s:
              anchor = '          node -e "const r=require(process.env.RUNNER_TEMP+\'/like035-state.json\');const rows=r.flatMap(x=>x.results||[]);if(!rows.some(x=>Number(x.id)===1))throw new Error(\'035 processor row missing\');const p=rows.find(x=>\'pending\' in x);console.log(\'LIVE_035_D1_STATE=PASS pending=\'+Number(p?.pending||0))"\n'
              if anchor not in s:
                  raise SystemExit('live plan workflow anchor missing')
              addition = '''          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN SELECT * FROM tracks WHERE id IN ('__a__','__b__','__c__')" --json > "$RUNNER_TEMP/publication-pk-plan.json"\n          node -e "const r=require(process.env.RUNNER_TEMP+'/publication-pk-plan.json');const detail=r.flatMap(x=>x.results||[]).map(x=>String(x.detail||'')).join(' | ');if(!detail.includes('sqlite_autoindex_tracks_1')||!detail.includes('(id=?)'))throw new Error('Publication PK lookup plan unavailable: '+detail);console.log('LIVE_PUBLICATION_PK_PLAN=PASS '+detail)"\n'''
              s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Worker 050 to canonical PREVIEW source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/worker050"
          mkdir -p "$tmp"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$tmp/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$tmp" node cloudflare/explore-worker/patches/050-publication-primary-key-batch-read.mjs
          cp "$tmp/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and build
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build

      - name: 083 regression suite
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-080-publication-state-engine.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-082-publication-batch.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-083-publication-pk-read.mjs
          node scripts/verify-explore-deploy-preflight.mjs
          if git diff --name-only HEAD | grep -q '^cloudflare/explore-worker/migrations/'; then
            echo '083 must not change shared D1 migrations' >&2
            exit 1
          fi
          echo 'SHARED_D1_SCHEMA_CHANGE=0'

      - name: Commit verified 083 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add \
            cloudflare/explore-worker/patches/050-publication-primary-key-batch-read.mjs \
            cloudflare/explore-worker/release-patches.json \
            cloudflare/explore-worker/canonical/preview-worker.js \
            cloudflare/explore-worker/canonical/source-sha256.txt \
            scripts/verify-explore-like-cost-optimization.mjs \
            scripts/verify-083-publication-pk-read.mjs \
            .github/workflows/cloudflare-explore-preview-release.yml
          git diff --cached --check
          git commit -m 'fix(preview): use PK reads for publication batch'
          git push origin HEAD:preview
