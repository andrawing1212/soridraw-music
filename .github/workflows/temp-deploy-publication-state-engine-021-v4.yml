name: SORIDRAW Deploy Publication State Engine 021 PREVIEW v4

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-deploy-publication-state-engine-021-v4.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEATURE_SHA: 2c0e1ddbbdb520025e817829e565ff52eefc0feb
      MAIN_SHA: 49c799cbb46d137539f74a48c261f7256762336f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PROD_WORKER: soridraw-explore-api
      PREVIEW_DB_NAME: soridraw-explore-preview-db
      PREVIEW_DB_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      PREVIEW_R2: soridraw-profile-media-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Guard feature and main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FEATURE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          grep -Fq 'SORIDRAW_PUBLICATION_STATE_TRANSITION_ENGINE_021_20260907' cloudflare/explore-worker/patches/021-publication-state-transition-engine.mjs
          node --check cloudflare/explore-worker/patches/021-publication-state-transition-engine.mjs
          echo 'GUARD=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Wrangler
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Fetch active PREVIEW Worker and production version
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .remote-worker && mkdir .remote-worker
          node <<'NODE'
          const fs = require('fs');
          const A = process.env.CLOUDFLARE_ACCOUNT_ID;
          const T = process.env.CLOUDFLARE_API_TOKEN;
          const P = process.env.PREVIEW_WORKER;
          const PROD = process.env.PROD_WORKER;
          async function get(url) {
            const r = await fetch(url, { headers: { Authorization: `Bearer ${T}`, Accept: 'application/json' } });
            const x = await r.json();
            if (!r.ok || x.success === false) throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,700)}`);
            return x.result || x;
          }
          async function active(name) {
            const base = `https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${name}`;
            const ds = await get(`${base}/deployments`);
            const d = (ds.deployments || ds || [])[0];
            const a = [...(d?.versions || [])].sort((x,y) => Number(y?.percentage || 0) - Number(x?.percentage || 0))[0];
            if (!a?.version_id || Number(a?.percentage || 0) < 99.99) throw new Error(`single active version missing for ${name}`);
            return { base, version: a.version_id };
          }
          (async () => {
            const preview = await active(P);
            const prod = await active(PROD);
            fs.writeFileSync('.remote-worker/preview-before.txt', preview.version);
            fs.writeFileSync('.remote-worker/prod-before.txt', prod.version);
            const v = await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${P}/versions/${preview.version}?include=modules`);
            const mods = v.modules || [];
            const main = mods.find((m) => m.name === (v.main_module || mods[0]?.name)) || mods[0];
            if (!main?.content_base64) throw new Error('PREVIEW main module missing');
            const src = Buffer.from(main.content_base64, 'base64').toString('utf8');
            for (const token of [
              'handleMusicNotePublicationSingleWrite016',
              'handleMusicNotePrivate017',
              'publicationCanonicalUnchanged016',
              'publicationReadState016',
              'patchExploreProfileR2Mutation019'
            ]) if (!src.includes(token)) throw new Error(`PREVIEW prerequisite missing ${token}`);
            if (src.includes('applyPublicationVisibilityTransition021')) throw new Error('021 helper unexpectedly active before deployment');
            fs.writeFileSync('.remote-worker/original.js', src);
            fs.writeFileSync('.remote-worker/worker.js', src);
            const settings = await get(`${preview.base}/settings`);
            const config = {
              name: P,
              main: './worker.js',
              compatibility_date: String(settings.compatibility_date || '2026-09-04').slice(0,10),
              workers_dev: true,
              keep_vars: true,
              d1_databases: [{ binding: 'DB', database_name: process.env.PREVIEW_DB_NAME, database_id: process.env.PREVIEW_DB_ID }],
              r2_buckets: [{ binding: 'PROFILE_MEDIA', bucket_name: process.env.PREVIEW_R2 }],
              observability: settings.observability && typeof settings.observability === 'object'
                ? { enabled: settings.observability.enabled !== false }
                : { enabled: true }
            };
            if (Array.isArray(settings.compatibility_flags) && settings.compatibility_flags.length) config.compatibility_flags = settings.compatibility_flags;
            fs.writeFileSync('.remote-worker/wrangler.jsonc', JSON.stringify(config, null, 2));
            console.log(`[before] preview=${preview.version} production=${prod.version}`);
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE

      - name: Apply and validate 021 engine
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/021-publication-state-transition-engine.mjs
          node --check .remote-worker/worker.js
          node <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('.remote-worker/worker.js','utf8');
          function fn(name){let p=s.indexOf(`async function ${name}(`);if(p<0)p=s.indexOf(`function ${name}(`);if(p<0)throw new Error('missing '+name);const b=s.indexOf('{',p);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(p,i+1)}throw new Error('unterminated '+name)}
          const hot=fn('handleMusicNotePublicationSingleWrite016'),priv=fn('handleMusicNotePrivate017'),engine=fn('applyPublicationVisibilityTransition021');
          if(!hot.includes('visibilityTransitionOnly021'))throw new Error('transition probe missing');
          if(!hot.includes('applyPublicationVisibilityTransition021'))throw new Error('publish transition missing');
          if(!priv.includes('applyPublicationVisibilityTransition021'))throw new Error('private transition missing');
          if((hot.match(/INSERT INTO tracks/g)||[]).length!==1)throw new Error('full UPSERT count changed');
          for(const bad of ['SELECT ','INSERT INTO','DELETE FROM','track_tags','track_stats'])if(engine.includes(bad))throw new Error('engine contains '+bad);
          console.log('ENGINE_STATIC_VALIDATE=PASS');
          NODE

      - name: Deploy and verify PREVIEW Worker
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$deployed" = 1 ]; then
              echo '[rollback] restoring previous PREVIEW Worker'
              cp .remote-worker/original.js .remote-worker/worker.js
              npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc || true
            fi
            exit "$status"
          }
          trap rollback EXIT
          npx wrangler deploy --strict --config .remote-worker/wrangler.jsonc
          deployed=1
          sleep 4
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PREVIEW_WORKER;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}`);return x.result||x;}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;const ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];if(!a?.version_id)throw new Error('active missing');const fs=require('fs'),before=fs.readFileSync('.remote-worker/preview-before.txt','utf8').trim();if(a.version_id===before)throw new Error('PREVIEW version unchanged');const v=await get(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${a.version_id}?include=modules`),mods=v.modules||[],m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0],s=Buffer.from(m.content_base64,'base64').toString('utf8');for(const token of ['applyPublicationVisibilityTransition021','visibilityTransitionOnly021','handleMusicNotePublicationSingleWrite016','handleMusicNotePrivate017'])if(!s.includes(token))throw new Error('deployed runtime missing '+token);console.log('[after] preview='+a.version_id)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test "$(curl -sS -o /tmp/feed.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/feed?sort=latest&limit=1")" = '200'
          test "$(curl -sS -o /tmp/genres.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" "$PREVIEW_BASE/v1/genres")" = '200'
          test "$(curl -sS -o /tmp/pub401.json -w '%{http_code}' -H "Origin: $PREVIEW_ORIGIN" -H 'Content-Type: application/json' -X POST --data '{}' "$PREVIEW_BASE/v1/publications")" = '401'
          test "$(curl -sS -o /tmp/site.html -w '%{http_code}' "$PREVIEW_ORIGIN")" = '200'
          trap - EXIT
          echo 'PREVIEW_WORKER_DEPLOY=PASS'

      - name: Verify main and production unchanged
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          node <<'NODE'
          const fs=require('fs'),A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PROD_WORKER;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}}),x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}`);return x.result||x;}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await get(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0],before=fs.readFileSync('.remote-worker/prod-before.txt','utf8').trim();if(a?.version_id!==before)throw new Error(`production changed ${before} -> ${a?.version_id}`);console.log('MAIN_PRODUCTION_UNCHANGED=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Package deployed source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zipname="SORIDRAW_PREVIEW_2c0e1ddb_publication_state_engine_021.zip"
          git archive --format=zip --output="$zipname" "$FEATURE_SHA" -- . ':(exclude).github/workflows/temp-deploy-publication-state-engine-021.yml' ':(exclude).github/workflows/temp-deploy-publication-state-engine-021-v4.yml'
          test -s "$zipname"
          echo "ZIP_NAME=$zipname" >> "$GITHUB_ENV"
          sha256sum "$zipname"

      - name: Upload deployed source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_publication_state_engine_021
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30
