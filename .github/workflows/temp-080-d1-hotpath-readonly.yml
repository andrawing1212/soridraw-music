name: TEMP 080 Publication D1 Hotpath Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-080-d1-hotpath-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read live publication hotpath schema only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE sql IS NOT NULL AND (tbl_name IN ('tracks','track_stats','public_profiles','profile_stats','explore_derived_tracks','explore_derived_profiles','explore_shared_revision') OR (type='trigger' AND (sql LIKE '%tracks%' OR sql LIKE '%explore_shared_revision%'))) ORDER BY type,tbl_name,name;" --json > "$RUNNER_TEMP/schema.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/schema.json','utf8'));
          const rows=raw.flatMap(x=>x.results||[]);
          for(const r of rows){
            console.log(`--- ${r.type} ${r.name} ON ${r.tbl_name} ---`);
            console.log(String(r.sql||''));
          }
          const trackIndexes=rows.filter(r=>r.type==='index'&&r.tbl_name==='tracks').map(r=>r.name);
          const trackTriggers=rows.filter(r=>r.type==='trigger'&&r.tbl_name==='tracks').map(r=>r.name);
          const derivedIndexes=rows.filter(r=>r.type==='index'&&r.tbl_name==='explore_derived_tracks').map(r=>r.name);
          console.log('TRACK_INDEXES='+JSON.stringify(trackIndexes));
          console.log('TRACK_TRIGGERS='+JSON.stringify(trackTriggers));
          console.log('DERIVED_TRACK_INDEXES='+JSON.stringify(derivedIndexes));
          console.log('REMOTE_D1_WRITES=0');
          NODE
