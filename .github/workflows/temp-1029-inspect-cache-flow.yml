name: Temp 1029 Inspect Cache Flow
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1029-inspect-cache-flow.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Print targeted cache schema and mutation flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path, needles in [
            ('src/App.tsx', ['MUSIC_NOTE_CACHE_SCHEMA', 'prepareMusicNoteCacheForUser', "const latestFavoritesForBundle = favoritesStore", 'const attachLegacyFavoritesFallback']),
            ('src/pages/SunoLibraryPage.tsx', ['LIBRARY_WORKSPACE_CACHE_SCHEMA', 'prepareLibraryWorkspaceCacheForUser', 'const bootstrapCachelessLibraryFromServerOnce']),
            ('src/lib/listBundleCache.ts', ['LIST_BUNDLE_SCHEMA_VERSION', 'const prepareItems', 'export const subscribeListBundle']),
          ]:
            s=Path(path).read_text()
            print('\n###',path)
            for n in needles:
              i=s.find(n)
              print('\n---',n,'@',i,'---')
              if i>=0: print(s[max(0,i-2200):i+6500])
          PY