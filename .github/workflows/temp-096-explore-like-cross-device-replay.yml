name: SORIDRAW 096 Explore Like Cross Device Replay

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-096-explore-like-cross-device-replay.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply 096 retained replay fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/exploreLikeService.ts')
          s = p.read_text()
          marker = '// SORIDRAW_EXPLORE_ACKNOWLEDGED_COUNT_094_20260915\n'
          assert marker in s
          s = s.replace(marker, marker + '// SORIDRAW_EXPLORE_LIKE_CROSS_DEVICE_REPLAY_096_20260915\n', 1)

          old = """  const version = Math.max(Date.now(), previousVersion + 1);\n  const ownerByTrack = new Map(batchEntries.map((pending) => [pending.trackId, pending.ownerUid]));\n  const signal: ExploreLikeAccountSyncSignal = {\n    version,\n    previousVersion,\n    results: results.map((result) => ({\n      ...result,\n      ownerUid: ownerByTrack.get(result.trackId) || '',\n    })),\n  };"""
          new = """  const version = Math.max(Date.now(), previousVersion + 1);\n  const ownerByTrack = new Map(batchEntries.map((pending) => [pending.trackId, pending.ownerUid]));\n\n  // 096: RTDB keeps only the latest signal object. If another device was asleep\n  // while this device flushed several separate boundary batches, publishing only\n  // the newest batch loses the earlier display-count deltas. Reuse the existing\n  // short-lived account patch cache as a rolling, unique-by-track replay window.\n  // The payload remains capped at the existing 50-result rules limit and adds no\n  // D1/Firestore read. Current results are inserted first so storage failure can\n  // never prevent the just-confirmed batch from being signalled.\n  const replayByTrack = new Map<string, ExploreLikeAccountSyncResult>();\n  results.forEach((result) => {\n    replayByTrack.set(result.trackId, {\n      ...result,\n      ownerUid: ownerByTrack.get(result.trackId) || '',\n    });\n  });\n  Object.values(readAccountPatchCache(uid))\n    .sort((a, b) => b.updatedAt - a.updatedAt)\n    .forEach((patch) => {\n      if (replayByTrack.has(patch.trackId) || replayByTrack.size >= EXPLORE_LIKE_BATCH_MAX) return;\n      replayByTrack.set(patch.trackId, {\n        trackId: patch.trackId,\n        ownerUid: patch.ownerUid,\n        liked: patch.liked,\n        likeCount: patch.likeCount,\n        ...(patch.displayLikeCount === undefined ? {} : { displayLikeCount: patch.displayLikeCount }),\n      });\n    });\n\n  const signal: ExploreLikeAccountSyncSignal = {\n    version,\n    previousVersion,\n    results: [...replayByTrack.values()].slice(0, EXPLORE_LIKE_BATCH_MAX),\n  };"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          Path('scripts/verify-096-explore-like-cross-device-replay.mjs').write_text("""import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nconst service = readFileSync('src/services/exploreLikeService.ts', 'utf8');\nconst rules = readFileSync('database.rules.json', 'utf8');\nassert.ok(service.includes('SORIDRAW_EXPLORE_LIKE_CROSS_DEVICE_REPLAY_096_20260915'));\nassert.ok(service.includes('Object.values(readAccountPatchCache(uid))'));\nassert.ok(service.includes('replayByTrack.has(patch.trackId)'));\nassert.ok(service.includes('replayByTrack.size >= EXPLORE_LIKE_BATCH_MAX'));\nassert.ok(service.includes('results: [...replayByTrack.values()].slice(0, EXPLORE_LIKE_BATCH_MAX)'));\nassert.ok(service.indexOf('results.forEach((result) =>') < service.indexOf('Object.values(readAccountPatchCache(uid))'));\nassert.ok(service.includes('rememberAccountSyncResults(uid, accountReplayResults);\\n    await publishExploreLikeAccountSyncSignal'));\nassert.ok(!service.includes('firebase/firestore'));\nassert.ok(!service.includes('getDocs('));\nassert.ok(!service.includes('collection('));\nassert.ok(rules.includes("$index.matches(/^(0|[1-9]|[1-4][0-9])$/)"));\nconsole.log('PASS 096: latest RTDB signal replays up to 50 recent unique acknowledged track states without D1/Firestore reads or rules expansion.');\n""")
          PY
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Verify 094 session batching
        run: node scripts/verify-094-explore-session-like-batch.mjs
      - name: Verify 095 zero-read display
        run: node scripts/verify-095-explore-like-zero-read-display.mjs
      - name: Verify 096 cross-device replay
        run: node scripts/verify-096-explore-like-cross-device-replay.mjs
      - name: Switch to Node 24 for like-cost verifier
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify like cost
        run: node scripts/verify-explore-like-cost-optimization.mjs
      - name: Verify liked profile regressions
        run: |
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
      - name: Commit verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/services/exploreLikeService.ts scripts/verify-096-explore-like-cross-device-replay.mjs
          test -n "$(git status --porcelain)"
          git commit -m 'fix: replay recent Explore like states across devices'
          git push origin HEAD:preview
