name: SORIDRAW Backend V2 Step 3-4f Result Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4f-result-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Finalize master plan and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          text = p.read_text()

          replacements = [
              (
                  "Status: IMPLEMENTATION / Step 3-4f read-only match/risk review complete — live 738 favorites exactly match the verified backup, 0 trusted recent-song matches, 738 standalone deterministic destinations currently absent; Step 3-4f writes blocked pending explicit approval for the exact 738-create scope",
                  "Status: IMPLEMENTATION / Step 3-4 limited backfill complete and independently verified — settings 3 + playlist headers 42 + playlist items 49 + recent songs 68 + standalone Music Note/favorites 738 migrated with V1 unchanged; Step 3-5 per-user automatic verification is next and starts read-only"
              ),
              (
                  "### Step 3 — Backup, backfill and verification (3/6 complete; Step 3-4f read-only review complete, write approval pending) 🔄",
                  "### Step 3 — Backup, backfill and verification (4/6 complete; Step 3-4 limited backfill complete and independently verified) 🔄"
              ),
              (
                  "- [~] 3-4 Rate-limited backfill within free-tier budget.",
                  "- [x] 3-4 Rate-limited backfill within free-tier budget."
              ),
              (
                  "  - [~] 3-4f Music Note/favorites: read-only live review SUCCESS — 738/738 sources unchanged from backup, all UIDs valid, 0 trusted matches to the 68 recent-origin V2 songs, 0 pre-existing standalone destinations/conflicts; exact 738 standalone create-only writes remain blocked pending explicit approval. Full detail: `docs/SORIDRAW_BACKEND_V2_STEP3_4F_READONLY_MATCH_RISK_REVIEW.md`.",
                  "  - [x] 3-4f Music Note/favorites complete: 738 standalone favorite-origin V2 songs created with deterministic `v1f_` IDs in eight bounded transactions (100×7 + 38); trusted recent-song merges 0, recent-origin updates 0, full payload/metadata parity verified, V1 favorites/recent sources unchanged. Independent read-only verification passed. Full detail: `docs/SORIDRAW_BACKEND_V2_STEP3_4F_FAVORITES_RESULT.md`."
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected master-plan text not found: {old[:80]}')
              text = text.replace(old, new, 1)

          marker = "\n### Step 4 — Preview validation (0/12) ⏳"
          addition = """

### Step 3-4f execution complete — standalone Music Note/favorites verified
- Explicitly approved write run `32870180096` completed SUCCESS after a fresh source/identity/quota/destination gate.
- 738 V1 favorites remained exactly aligned with the verified backup; trusted matches to the 68 recent-origin songs remained 0.
- Exactly 738 standalone V2 favorite-origin songs were created with deterministic IDs in eight bounded transactions: `100 + 100 + 100 + 100 + 100 + 100 + 100 + 38`.
- Every destination preserves the complete source payload and adds the finalized V2 metadata/provenance with `musicNote:true` and `recentVisible:false`.
- Independent read-only run `32870575956` verified all 738 favorite-origin V2 songs and all 68 recent-origin V2 songs: missing 0, payload mismatch 0, metadata mismatch 0, V1 favorite/recent drift 0.
- Firestore writes in the approved migration run: 738 V2 creates only. V1 writes/deletes 0/0; V2 deletes 0; Rules/Functions/Hosting deploy 0; main promotion 0.
- Temporary write/verify workflows were removed after verification. Full result: `docs/SORIDRAW_BACKEND_V2_STEP3_4F_FAVORITES_RESULT.md`.
"""
          if marker not in text:
              raise SystemExit('Step 4 marker not found')
          if '### Step 3-4f execution complete — standalone Music Note/favorites verified' not in text:
              text = text.replace(marker, addition + marker, 1)

          p.write_text(text)
          PY
          rm -f .github/workflows/backend-v2-step3-4f-result-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md .github/workflows/backend-v2-step3-4f-result-finalize.yml
          git commit -m 'docs: finalize verified Step 3-4f completion'
          git push origin HEAD:preview
