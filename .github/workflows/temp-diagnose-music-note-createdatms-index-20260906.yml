name: Temp Diagnose Music Note createdAtMs Index

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-diagnose-music-note-createdatms-index-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Authenticate backend Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read current Firestore composite indexes
        shell: bash
        run: |
          set -euo pipefail
          gcloud firestore indexes composite list \
            --project soridraw-app-866a5 \
            --database='(default)' \
            --format=json > "$RUNNER_TEMP/indexes.json"
          node - "$RUNNER_TEMP/indexes.json" <<'NODE'
          const fs = require('fs');
          const indexes = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const normalizeOrder = (value) => String(value || '').toUpperCase();
          const matches = indexes.filter((idx) => {
            const name = String(idx?.name || '');
            const group = String(idx?.collectionGroup || name.split('/collectionGroups/')[1]?.split('/')[0] || '');
            const fields = Array.isArray(idx?.fields) ? idx.fields : [];
            return group === 'favorites'
              && fields.some((f) => f.fieldPath === 'uid' && normalizeOrder(f.order) === 'ASCENDING')
              && fields.some((f) => f.fieldPath === 'createdAtMs' && normalizeOrder(f.order) === 'DESCENDING');
          });
          console.log(`MUSIC_NOTE_CREATEDATMS_INDEX_COUNT=${matches.length}`);
          for (const idx of matches) {
            console.log(`MUSIC_NOTE_CREATEDATMS_INDEX_STATE=${idx.state || 'UNKNOWN'}`);
            console.log(`MUSIC_NOTE_CREATEDATMS_INDEX_NAME=${idx.name || ''}`);
          }
          if (matches.length === 0) console.log('MUSIC_NOTE_CREATEDATMS_INDEX_STATUS=MISSING');
          else if (matches.some((idx) => String(idx.state || '').toUpperCase() === 'READY')) console.log('MUSIC_NOTE_CREATEDATMS_INDEX_STATUS=READY');
          else console.log('MUSIC_NOTE_CREATEDATMS_INDEX_STATUS=NOT_READY');
          NODE

      - name: Confirm read-only scope
        run: |
          echo 'READ_ONLY_DIAGNOSTIC=PASS'
          echo 'NO_FIRESTORE_WRITE=true'
          echo 'NO_INDEX_DEPLOY=true'
          echo 'NO_HOSTING_DEPLOY=true'
          echo 'NO_FUNCTIONS_DEPLOY=true'
