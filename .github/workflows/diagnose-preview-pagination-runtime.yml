name: Diagnose Preview Pagination Runtime

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/diagnose-preview-pagination-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate base source
        run: npm run prebuild

      - name: Apply 984
        run: python3 .deploy/apply-984-music-note-server-first-more.py

      - name: Apply 985
        run: python3 .deploy/apply-985-music-note-normalized-page-chain.py

      - name: Apply 986
        run: python3 .deploy/apply-986-music-note-active-only-pagination.py

      - name: Apply 980 Library recovery
        run: python3 .deploy/apply-980-library-pagination-metadata-recovery.py

      - name: Verify 986 bounded query and migration paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          favorites=Path('src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          start=app.index('  const loadMoreFavorites = useCallback(async () => {')
          end=app.index('  const syncMusicNoteIncrementalFromRemoteVersion = useCallback',start)
          block=app[start:end]
          required=[
            "where('musicNoteListEligible', '==', true)",
            "orderBy('createdAtMs', 'desc')",
            "orderBy(documentId(), 'desc')",
            'startAfter(cursorCreatedAtMs, cursorId)',
            'limit(FAVORITES_PAGE_SIZE)',
            'cursorItem?.firestoreId || cursorItem?.id',
            'firestoreId: docSnap.id',
          ]
          if any(x not in block for x in required): raise SystemExit('986 bounded-query marker missing')
          if 'while (' in block: raise SystemExit('986 repeated scan remains')
          if 'FAVORITES_PAGE_SIZE + 1' in block: raise SystemExit('986 look-ahead read remains')
          ui=[
            'musicNoteListEligible: false',
            'musicNoteListEligible: true',
            'musicNoteProfileCount',
            'musicNoteRemainingCount',
            '전체 {musicNoteProfileCount}곡 · 현재 {musicNoteCurrentCount}곡 · 남은 {musicNoteRemainingCount}곡',
          ]
          if any(x not in favorites for x in ui): raise SystemExit('986 Favorites marker missing')
          print('VERIFY_986_PASS')
          PY

      - name: Typecheck and build generated source
        run: |
          npx tsc --noEmit
          npx vite build

      - name: Confirm read-only
        run: |
          echo 'READ-ONLY diagnostic only.'
          echo 'No Hosting deploy, Functions deploy, Firestore/index/Rules write, user-data migration, main change, or production change.'
