name: SORIDRAW APP621 Human Admin Secret Staging Script Syntax
on:
  push:
    branches: [feat/app600-owner-standalone-isolated]
    paths:
      - 'scripts/app621-admin-stage-owner-secrets.sh'
      - '.github/workflows/follow-621-admin-script-source.yml'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove only inactive secret version operations and syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/app621-admin-stage-owner-secrets.sh
          grep -Fq 'APP624_CLOUDFLARE_CLI_LOGIN_SAVED=PASS' scripts/app621-admin-stage-owner-secrets.sh
          grep -Fq 'APP624_EXACT_ACCOUNT_MEMBERSHIP=PASS' scripts/app621-admin-stage-owner-secrets.sh
          grep -Fq 'APP624_SECRETS_STAGE=HOLD_PENDING_ATOMIC_VERSION_BINDING_PROOF' scripts/app621-admin-stage-owner-secrets.sh
          if grep -Eq '^[[:space:]]*npx[[:space:]].*\b(login|deploy|secret put|versions secret (put|bulk))\b' scripts/app621-admin-stage-owner-secrets.sh; then
            echo APP624_UNSAFE_AUTO_AUTH_OR_WRITE_FOUND
            exit 3
          fi
          echo APP624_NO_OAUTH_LOOP_NO_SECRET_WRITE_SOURCE=PASS
