name: SORIDRAW PREVIEW 029 MusicNote Library Fix

on:
  push:
    branches: [preview-029-fix]
    paths:
      - '.github/workflows/temp-preview-029-musicnote-library-fix.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-preview-029-musicnote-library-fix
  cancel-in-progress: false

jobs:
  fix-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_PREVIEW_SHA: 46174546a813b81641bac6050794c32969ec714d
      BASE_MAIN_SHA: da3f70ca3e8574f20a5eabf96a4c517c51b4038c
      FIREBASE_PROJECT: soridraw
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MEDIA_WORKER_URL: https://soridraw-media-preview.andrawing1212.workers.dev
    steps:
      - name: Checkout isolated work branch
        uses: actions/checkout@v4
        with:
          ref: preview-029-fix
          fetch-depth: 0

      - name: Guard exact PREVIEW and MAIN baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$BASE_PREVIEW_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          git diff --name-only "$BASE_PREVIEW_SHA" HEAD | sort > "$RUNNER_TEMP/bootstrap-files.txt"
          printf '%s\n' \
            '.deploy/apply-029-musicnote-library-fix.py' \
            '.github/workflows/temp-preview-029-musicnote-library-fix.yml' | sort > "$RUNNER_TEMP/bootstrap-expected.txt"
          cmp "$RUNNER_TEMP/bootstrap-expected.txt" "$RUNNER_TEMP/bootstrap-files.txt"
          echo 'BASELINE_GUARD_029=PASS'

      - name: Apply focused runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/apply-029-musicnote-library-fix.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-029-music-note-library.mjs')
          s = p.read_text(encoding='utf-8')
          old = "const workerLibraryStart = worker.indexOf('const LIBRARY_SUMMARY_KEYS');"
          new = "const workerLibraryStart = worker.indexOf('const LIBRARY_CATALOG_FIELDS');"
          if s.count(old) != 1:
              raise SystemExit(f'worker verifier anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          node scripts/verify-029-music-note-library.mjs
          echo 'PATCH_029=PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: TypeScript build and regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          node scripts/verify-029-music-note-library.mjs
          if [ -f scripts/verify-adaptive-list-index-v2.mjs ]; then node scripts/verify-adaptive-list-index-v2.mjs; fi
          if [ -f scripts/verify-runtime-environment-parity-028.mjs ]; then node scripts/verify-runtime-environment-parity-028.mjs; fi
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/local-index.sha"
          echo 'APP_BUILD_029=PASS'

      - name: Validate changed PREVIEW media Worker
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/media-worker
          npm install --no-audit --no-fund
          npm run check
          echo 'MEDIA_WORKER_DRYRUN_029=PASS'

      - name: Deploy and verify PREVIEW media Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cd cloudflare/media-worker
          npm run deploy | tee "$RUNNER_TEMP/media-worker-deploy.log"
          cd ../..
          ok=''
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$MEDIA_WORKER_URL/health" -o "$RUNNER_TEMP/media-health.json" \
              && grep -q '"ok":true' "$RUNNER_TEMP/media-health.json" \
              && grep -q '"r2Binding":true' "$RUNNER_TEMP/media-health.json"; then
              ok=yes
              break
            fi
            sleep 5
          done
          test "$ok" = yes
          code="$(curl -sS -o "$RUNNER_TEMP/media-options-body" -D "$RUNNER_TEMP/media-options-head" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://preview.soridraw.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
            "$MEDIA_WORKER_URL/v1/catalog/library")"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://preview.soridraw.com' "$RUNNER_TEMP/media-options-head"
          echo 'MEDIA_WORKER_PREVIEW_029=PASS'

      - name: Build clean PREVIEW commit without temporary runner files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Preview Bot'
          git config user.email 'soridraw-preview@users.noreply.github.com'
          rm -f .deploy/apply-029-musicnote-library-fix.py
          rm -f .github/workflows/temp-preview-029-musicnote-library-fix.yml
          git add -A
          tree_sha="$(git write-tree)"
          clean_sha="$(printf '%s\n' 'fix(preview): cache Music Note details and restore Library next-song apply' | git commit-tree "$tree_sha" -p "$BASE_PREVIEW_SHA")"
          echo "CLEAN_SHA=$clean_sha" >> "$GITHUB_ENV"

          git diff --name-only "$BASE_PREVIEW_SHA" "$clean_sha" | sort > "$RUNNER_TEMP/runtime-files.txt"
          printf '%s\n' \
            'cloudflare/media-worker/src/index.js' \
            'scripts/verify-029-music-note-library.mjs' \
            'src/components/GlobalPlayer.tsx' \
            'src/lib/musicNoteDetailCache.ts' \
            'src/lib/userDataEngine.ts' \
            'src/pages/FavoritesPage.tsx' \
            'src/pages/SunoLibraryPage.tsx' | sort > "$RUNNER_TEMP/runtime-expected.txt"
          cmp "$RUNNER_TEMP/runtime-expected.txt" "$RUNNER_TEMP/runtime-files.txt"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$BASE_PREVIEW_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo "CLEAN_PREVIEW_SHA=$clean_sha"
          echo 'CLEAN_TREE_029=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy validated frontend to Firebase PREVIEW
        shell: bash
        run: |
          set -euo pipefail
          production_before="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ | sha256sum | awk '{print $1}')"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-preview.json --non-interactive
          local_sha="$(cat "$RUNNER_TEMP/local-index.sha")"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/live-index.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/live-index.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  echo "PREVIEW_EXACT_BUILD_PASS=$url"
                  ok=yes
                  break
                fi
              fi
              sleep 8
            done
            test "$ok" = yes
          done
          production_after="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ | sha256sum | awk '{print $1}')"
          test "$production_before" = "$production_after"
          echo 'FIREBASE_PREVIEW_029=PASS'
          echo 'PRODUCTION_HOSTING_UNCHANGED_029=PASS'

      - name: Promote exact clean commit to PREVIEW only
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$CLEAN_SHA":refs/heads/preview
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$CLEAN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo 'PREVIEW_PROMOTION_029=PASS'
          echo 'MAIN_UNCHANGED_029=PASS'

      - name: Package clean PREVIEW ZIP
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=8 "$CLEAN_SHA")"
          zip_path="$RUNNER_TEMP/SORIDRAW_PREVIEW_029_${short}.zip"
          git archive --format=zip --output="$zip_path" "$CLEAN_SHA"
          sha256sum "$zip_path"
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo 'PREVIEW_ZIP_029=PASS'

      - name: Upload PREVIEW ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_029
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Final result
        shell: bash
        run: |
          set -euo pipefail
          echo "CLEAN_PREVIEW_SHA=$CLEAN_SHA"
          echo 'FIREBASE_HOSTING_CHANGED=true'
          echo 'CLOUDFLARE_MEDIA_SOURCE_CHANGED=true'
          echo 'CLOUDFLARE_MEDIA_DEPLOYED=true'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'
          echo 'EXPLORE_WORKER_CHANGED=false'
          echo 'TEST_CHANGED=false'
          echo 'PRODUCTION_CHANGED=false'
          echo 'SORIDRAW_PREVIEW_029=PASS'
