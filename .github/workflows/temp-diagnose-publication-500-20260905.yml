name: SORIDRAW Validate Publication Stage3.1 PREVIEW 2026-09-05
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-diagnose-publication-500-20260905.yml'
      - 'cloudflare/explore-worker/patches/018-publication-postwrite-500-and-retry-cost.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Fetch exact active PREVIEW Worker and dry-run 018
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          rm -rf .remote-worker && mkdir -p .remote-worker
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
            const deps=await get(`${base}/deployments`);const d=(deps.deployments||deps||[])[0];const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!active?.version_id||Number(active.percentage||0)<99.99)throw new Error('No single active PREVIEW version');
            const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);const mods=ver.modules||[];const main=mods.find(m=>m.name===(ver.main_module||mods[0]?.name))||mods[0];
            fs.writeFileSync('.remote-worker/worker.js',Buffer.from(main.content_base64,'base64'));
            console.log(`[Stage3.1] active=${active.version_id}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/018-publication-postwrite-500-and-retry-cost.mjs
          node --check .remote-worker/worker.js
      - name: Assert post-write failure and retry-cost invariants
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('.remote-worker/worker.js','utf8');
          function fn(name){const needles=[`async function ${name}(`,`function ${name}(`];let st=-1;for(const n of needles){st=s.indexOf(n);if(st>=0)break;}if(st<0)throw new Error('missing '+name);const b=s.indexOf('{',st);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i];if(q){if(e){e=false;continue;}if(c==='\\'){e=true;continue;}if(c===q)q=null;continue;}if(c==='"'||c==="'"||c==='`'){q=c;continue;}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(st,i+1);}throw new Error('unterminated '+name)}
          const feed=fn('invalidateExploreFeedEdgeCache');
          if(feed.includes('ALLOWED_ORIGINS'))throw new Error('feed invalidation still all-origin fanout');
          if(!feed.includes('Promise.allSettled'))throw new Error('feed invalidation can still reject mutation');
          const profile=fn('invalidatePublicProfileFirstViewEdgeCache');
          if(profile.includes('ALLOWED_ORIGINS'))throw new Error('profile invalidation still all-origin fanout');
          if(!profile.includes('Promise.allSettled'))throw new Error('profile invalidation can still reject');
          const state=fn('publicationReadState016');
          if(state.includes('track_stats'))throw new Error('publication read still touches track_stats');
          if(!state.includes('env.DB.batch'))throw new Error('track/profile reads are not batched');
          const hot=fn('handleMusicNotePublicationSingleWrite016');
          const idem=hot.indexOf('mutation: "idempotent"');
          const feedSync=hot.indexOf('syncExploreFeedR2Publication012');
          if(idem<0||feedSync<0||idem>feedSync)throw new Error('idempotent retry still performs derived sync');
          console.log('[Stage3.1] PASS: exact 500 cause removed; cache deletes current-origin/best-effort; track_stats read removed; identical retry exits before D1/R2 mutation work.');
          NODE
      - name: App build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
