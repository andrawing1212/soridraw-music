name: SORIDRAW 425 Live Like Cutover Readonly Audit
on:
  push:
    branches: [preview]
    paths:
      - 'scripts/audit-425-live-like-release-readonly.mjs'
      - '.github/workflows/audit-425-live-like-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soridraw-425-live-readonly
  cancel-in-progress: true
jobs:
  verify-real-active-worker-and-shared-d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audit can only read known scripts and SELECT from fixed shared D1
        run: |
          node --check scripts/audit-425-live-like-release-readonly.mjs
          if grep -E '(DELETE FROM|DROP TABLE|UPDATE .* SET|INSERT INTO|\.deploy/)' scripts/audit-425-live-like-release-readonly.mjs; then
            echo '425_UNAPPROVED_LIVE_MUTATION=FAIL'
            exit 1
          fi
      - name: Audit real active Cloudflare Worker versions and bounded D1 queue state
        run: node scripts/audit-425-live-like-release-readonly.mjs
      - name: Confirm test performed no release or shared data writes
        run: echo '425_READONLY_ONLY;NO_MUTATION;NO_DEPLOYMENT'
