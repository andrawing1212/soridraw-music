          block = r'''const flushCatalogPendingPublish = async (key: string): Promise<void> => {
  const pending = catalogPendingPublishes.get(key);
  if (!pending) return;
  const { kind, uid, sourceItems, options } = pending;
  const dirtyRevision = readAdaptiveListIndexDirtyRevision(kind, uid);
  if (dirtyRevision <= 0) {
    catalogPendingPublishes.delete(key);
    return;
  }

  const previous = await readCatalogSnapshot(kind, uid);
  if (!previous) {
    const rebuilt = await rebuildCatalogSnapshotFromServer(kind, uid);
    if (rebuilt) {
      clearAdaptiveListIndexDirtyRevision(kind, uid, dirtyRevision);
      catalogPendingPublishes.delete(key);
    } else {
      throw new Error(`catalog ${kind} rebuild failed`);
    }
    return;
  }

  const delta = buildCatalogDelta(previous, sourceItems, options);
  if (!delta.upserts.length && !delta.deletedIds.length) {
    clearAdaptiveListIndexDirtyRevision(kind, uid, dirtyRevision);
    catalogPendingPublishes.delete(key);
    return;
  }

  const result = await publishCatalogDelta(kind, uid, delta);
  if (!result) throw new Error(`catalog ${kind} delta publish failed`);
  if (result.conflict) {
    const rebuilt = await rebuildCatalogSnapshotFromServer(kind, uid);
    if (!rebuilt) throw new Error(`catalog ${kind} conflict rebuild failed`);
    clearAdaptiveListIndexDirtyRevision(kind, uid, dirtyRevision);
    catalogPendingPublishes.delete(key);
    return;
  }

  const canonicalItems = normalizeCatalogItems(result.items || []);
  const next: SoridrawCatalogSnapshot = {
    schemaVersion: 4,
    authority: 'server',
    kind,
    revision: Math.max(0, Math.floor(result.revision)),
    items: canonicalItems,
    itemCount: Number.isFinite(Number(result.itemCount)) ? Math.max(0, Math.floor(Number(result.itemCount))) : canonicalItems.length,
    complete: true,
    generatedAtMs: Date.now(),
  };
  const store = await openCatalogStore(kind, uid);
  await idbPut(store, CATALOG_META_KEY, next);
  if (result.syncToken !== undefined) await idbPut(store, CATALOG_SYNC_TOKEN_KEY, result.syncToken);
  if (result.deltaToken !== undefined) await idbPut(store, CATALOG_DELTA_TOKEN_KEY, result.deltaToken);
  clearAdaptiveListIndexDirtyRevision(kind, uid, dirtyRevision);
  catalogPendingPublishes.delete(key);
};

export const scheduleCatalogSnapshotPublishIfDirty = (
  kind: SoridrawCatalogKind,
  uid: string,
  sourceItems: any[],
  options: CatalogPublishOptions = {},
) => {
  if (!uid) return;
  const dirtyRevision = readAdaptiveListIndexDirtyRevision(kind, uid);
  if (dirtyRevision <= 0) return;
  const key = catalogKey(kind, uid);
  const existingTimer = catalogPublishTimers.get(key);
  if (existingTimer) clearTimeout(existingTimer);
  catalogPublishTimers.delete(key);
  catalogPendingPublishes.set(key, { kind, uid, sourceItems, options });
};

export const getPendingCatalogPublishCount = (uid: string): number => [...catalogPendingPublishes.values()]
  .filter((pending) => pending.uid === uid && readAdaptiveListIndexDirtyRevision(pending.kind, uid) > 0)
  .length;

export const flushPendingCatalogPublishes = async (uid: string): Promise<void> => {
  const keys = [...catalogPendingPublishes.entries()]
    .filter(([, pending]) => pending.uid === uid)
    .map(([key]) => key);
  for (const key of keys) await flushCatalogPendingPublish(key);
};

