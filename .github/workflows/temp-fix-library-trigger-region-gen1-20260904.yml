name: SORIDRAW Fix Library Trigger Region 2026-09-04

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-fix-library-trigger-region-gen1-20260904.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-fix-library-trigger-region-20260904
  cancel-in-progress: false

jobs:
  fix-region:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 5

      - name: Patch trigger to Firestore-local 1st gen
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const indexPath = 'functions/src/index.ts';
          let index = fs.readFileSync(indexPath, 'utf8');
          const importOld = 'import { onDocumentWritten } from "firebase-functions/v2/firestore";\n';
          if (!index.includes(importOld)) throw new Error('Expected v2 Firestore import not found');
          index = index.replace(importOld, '');

          const startOld = `export const syncSunoLibraryLatest10Bundle = onDocumentWritten(\n  {\n    document: "suno_tracks/{uid}/tracks/{trackId}",\n    region: "us-central1",\n  },\n  async (event) => {\n    const change = event.data;\n    if (!change) return;\n\n    const mutation: LibraryTrackMutation = {\n      trackId: String(event.params.trackId || "").trim(),`;
          const startNew = `export const syncSunoLibraryLatest10Bundle = functions\n  .region("asia-northeast3")\n  .firestore.document("suno_tracks/{uid}/tracks/{trackId}")\n  .onWrite(async (change, context) => {\n    const mutation: LibraryTrackMutation = {\n      trackId: String(context.params.trackId || "").trim(),`;
          if (!index.includes(startOld)) throw new Error('Expected v2 trigger start not found');
          index = index.replace(startOld, startNew);

          const uidOld = '    const uid = String(event.params.uid || "").trim();';
          const uidNew = '    const uid = String(context.params.uid || "").trim();';
          if (!index.includes(uidOld)) throw new Error('Expected event.params uid line not found');
          index = index.replace(uidOld, uidNew);

          const closeOld = '    });\n  },\n);\n\nconst getAuthProviderIds';
          const closeNew = '    });\n  });\n\nconst getAuthProviderIds';
          if (!index.includes(closeOld)) throw new Error('Expected v2 trigger closing not found');
          index = index.replace(closeOld, closeNew);
          fs.writeFileSync(indexPath, index);

          const testPath = 'functions/scripts/test-library-bundle-freshness.cjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const testStartOld = "  const start = source.indexOf('export const syncSunoLibraryLatest10Bundle = onDocumentWritten(');";
          const testStartNew = "  const start = source.indexOf('export const syncSunoLibraryLatest10Bundle = functions');";
          if (!test.includes(testStartOld)) throw new Error('Expected trigger test start not found');
          test = test.replace(testStartOld, testStartNew);

          const docAssertOld = "  assert.ok(trigger.includes('document: \"suno_tracks/{uid}/tracks/{trackId}\"'));\n  assert.ok(trigger.includes('region: \"us-central1\"'));";
          const docAssertNew = "  assert.ok(trigger.includes('.region(\"asia-northeast3\")'));\n  assert.ok(trigger.includes('.firestore.document(\"suno_tracks/{uid}/tracks/{trackId}\")'));\n  assert.ok(trigger.includes('.onWrite(async (change, context) => {'));";
          if (!test.includes(docAssertOld)) throw new Error('Expected old region assertions not found');
          test = test.replace(docAssertOld, docAssertNew);
          fs.writeFileSync(testPath, test);
          NODE

          git diff --check
          grep -q '.region("asia-northeast3")' functions/src/index.ts
          if grep -q 'firebase-functions/v2/firestore' functions/src/index.ts; then
            echo 'ERROR: v2 Firestore trigger import remains'
            exit 1
          fi
          echo '[Region fix] Library trigger moved to asia-northeast3 1st gen Firestore onWrite.'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm --prefix functions ci --no-audit --no-fund

      - name: Build and test Functions
        run: |
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle
          grep -q 'syncSunoLibraryLatest10Bundle' functions/lib/securedIndex.js
          grep -q 'asia-northeast3' functions/lib/securedIndex.js

      - name: Commit region correction to preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add functions/src/index.ts functions/scripts/test-library-bundle-freshness.cjs
          git commit -m 'fix(preview): colocate Library freshness trigger with Firestore'
          git push origin HEAD:preview
          echo '[Region fix] preview source correction pushed.'
