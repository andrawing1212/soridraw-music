name: SORIDRAW Backend V2 Step 2-A4d Docs Finalize V2

on:
  push:
    branches:
      - preview
    paths:
      - .github/workflows/backend-v2-step2a4d-docs-finalize-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0
      - name: Patch master
        run: python3 .deploy/patch-backend-v2-step2a4d-master.py
      - name: Validate
        run: |
          git diff --check
          grep -q "36 Music Note targets" docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          grep -q "STEP2_A4D_READONLY_GAP_REVIEW_RESULT" docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
      - name: Commit and clean temporary finalizer
        run: |
          rm .deploy/patch-backend-v2-step2a4d-master.py
          rm .github/workflows/backend-v2-step2a4d-docs-finalize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md .deploy/patch-backend-v2-step2a4d-master.py .github/workflows/backend-v2-step2a4d-docs-finalize-v2.yml
          git commit -m "docs: finalize Step 2-A4d read-only gap review"
          git push origin HEAD:preview
