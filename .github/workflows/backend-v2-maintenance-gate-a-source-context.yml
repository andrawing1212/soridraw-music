name: SORIDRAW Gate A Source Context

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-maintenance-gate-a-source-context.yml'

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
      - name: Print exact TypeScript error context only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== APP 4380-4465 ==='
          nl -ba src/App.tsx | sed -n '4380,4465p'
          echo '=== MODE TYPE/VALUES NEARBY ==='
          grep -n "pure-pane-hybrid\|tablet-touch-pure\|v2DragPerf" src/App.tsx | head -80 || true
          echo '=== GEMINI 35100-35155 ==='
          nl -ba src/services/geminiService.ts | sed -n '35100,35155p'
          echo '=== TYPES 300-410 ==='
          nl -ba src/types.ts | sed -n '300,410p'
          echo '=== SONGRESULT APPLIEDKEYWORDS REFERENCES ==='
          grep -n "appliedKeywords" src/types.ts | head -40 || true
