name: SORIDRAW Follow 031 Owner Count Scoped Readonly
on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/diagnose-follow-owner-031.mjs'
      - '.github/workflows/follow-031-owner-readonly.yml'
permissions:
  contents: read
jobs:
  targeted-follow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and run exact two-account canonical read only
        run: |
          set -euo pipefail
          node --check scripts/diagnose-follow-owner-031.mjs
          node scripts/diagnose-follow-owner-031.mjs --self-test
          node scripts/diagnose-follow-owner-031.mjs --live
          echo 'READ_ONLY_NO_D1_R2_ORIGINALS_MODIFIED=PASS'
