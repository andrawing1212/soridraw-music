name: Stage416 PREVIEW Readonly Settlement Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/stage416-preview-readonly-settlement-diagnostic.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-416-readonly-settlement-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout immutable preview
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Authenticate readonly log access
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Inspect active Functions and 90min Cloud Run error summaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,re,collections,datetime
          project='soridraw-app-866a5'
          names=[
            ('recordPrivateLike416','us-central1'),
            ('stage416SchedulePrivateWindowCandidate','us-central1'),
            ('stage416SettlePrivateWindowCandidate','us-central1'),
            ('privateLikeFinalReceipt416Candidate','asia-northeast3'),
          ]
          services=[]
          for name,region in names:
            p=subprocess.run(['gcloud','functions','describe',name,'--gen2',
              '--region',region,'--project',project,'--format=json'],
              capture_output=True,text=True)
            if p.returncode:
              print('FUNCTION_METADATA_UNAVAILABLE',name,'STATUS=ERROR')
              continue
            try:d=json.loads(p.stdout)
            except ValueError:
              print('FUNCTION_METADATA_BAD_JSON',name);continue
            url=str(d.get('serviceConfig',{}).get('service',''))
            service=url.rsplit('/',1)[-1] if url else ''
            if service:services.append(service)
            print('FUNCTION',name,'STATE',d.get('state','UNKNOWN'),'SERVICE',service,
              'UPDATED',d.get('updateTime','UNKNOWN'))
          if not services:
            raise SystemExit('NO_FUNCTION_METADATA_READ')
          clauses=' OR '.join('resource.labels.service_name="'+s+'"' for s in services)
          expr='resource.type="cloud_run_revision" AND ('+clauses+')'
          p=subprocess.run(['gcloud','logging','read',expr,'--project',project,
            '--freshness=100m','--limit=1200','--format=json'],
            capture_output=True,text=True)
          if p.returncode:
            print('CLOUD_LOGS_READ_UNAVAILABLE',' '.join(p.stderr.strip().split())[:220])
            raise SystemExit(31)
          logs=json.loads(p.stdout or '[]')
          print('RECENT_FUNCTION_LOG_ENTRIES',len(logs))
          byservice=collections.Counter()
          severities=collections.Counter()
          statuses=collections.Counter()
          errors=collections.Counter()
          samples=[]
          pattern=re.compile(r'416_[A-Z0-9_]{5,100}|(?:FAILED|UNAVAILABLE|PENDING|STILL_PENDING|COLD|CORRUPT|CONFLICT|STALE|DENIED|INVALID|RETRY)',re.I)
          for row in logs:
            s=row.get('resource',{}).get('labels',{}).get('service_name','unknown')
            sev=str(row.get('severity','DEFAULT'))
            byservice[s]+=1
            severities[(s,sev)]+=1
            status=row.get('httpRequest',{}).get('status')
            if status is not None:statuses[(s,str(status))]+=1
            payload=row.get('textPayload') or row.get('jsonPayload',{}).get('message') or ''
            if not isinstance(payload,str):payload=json.dumps(payload)
            matches=sorted(set(x.upper() for x in pattern.findall(payload)))
            for code in matches:errors[(s,code)]+=1
            if matches and len(samples)<25:samples.append((s,str(row.get('timestamp',''))[:19],matches[:5]))
          print('SERVICE_LOG_COUNTS',json.dumps(byservice,sort_keys=True))
          print('HTTP_STATUS_COUNTS',json.dumps({f'{a}/{b}':n for (a,b),n in statuses.items()},sort_keys=True))
          print('SEVERITY_COUNTS',json.dumps({f'{a}/{b}':n for (a,b),n in severities.items()},sort_keys=True))
          print('ERROR_CODE_COUNTS',json.dumps({f'{a}/{b}':n for (a,b),n in errors.items()},sort_keys=True))
          print('REDACTED_ERROR_TIMELINE',json.dumps(samples))
          # Extract ONLY the public non-delivery class, never its arguments,
          # UID, payload, route, sealed rows or task identifiers.
          status_counts=collections.Counter()
          status_pattern=re.compile(r'SETTLEMENT_TASK_NOT_DELIVERED\s+(RESCHEDULED|STALE|EMPTY)',re.I)
          for row in logs:
            if row.get('resource',{}).get('labels',{}).get('service_name')!='stage416settleprivatewindowcandidate':continue
            payload=row.get('textPayload') or row.get('jsonPayload',{}).get('message') or ''
            if isinstance(payload,dict):payload=str(payload.get('message',''))
            match=status_pattern.search(str(payload))
            if match:status_counts[match.group(1).upper()]+=1
          for kind in ('RESCHEDULED','STALE','EMPTY'):
            print('STAGE416_NONDELIVERY_'+kind+'='+str(status_counts[kind]))
          print('STAGE416_SETTLEMENT_NONDELIVERY_TOTAL='+str(sum(status_counts.values())))
          print('LOGS_READONLY_NO_UID_NO_PAYLOAD=PASS')
          PY

      - name: Inspect dedicated scheduler logs without global truncation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,collections,re
          project='soridraw-app-866a5'
          services=['stage416scheduleprivatewindowcandidate',
                    'stage416settleprivatewindowcandidate',
                    'recordprivatelike416']
          for service in services:
            expr='resource.type="cloud_run_revision" AND resource.labels.service_name="'+service+'"'
            p=subprocess.run(['gcloud','logging','read',expr,'--project',project,
              '--freshness=100m','--limit=600','--format=json'],
              capture_output=True,text=True)
            if p.returncode:raise SystemExit('STAGE416_SERVICE_LOG_READ_DENIED_'+service)
            rows=json.loads(p.stdout or '[]')
            http=collections.Counter(str((x.get('httpRequest') or {}).get('status') or '')
              for x in rows if (x.get('httpRequest') or {}).get('status') is not None)
            severity=collections.Counter(str(x.get('severity') or 'DEFAULT') for x in rows)
            # Never print request, payload, URL, UID, operation, IP or task identity.
            codes=collections.Counter()
            for item in rows:
              raw=item.get('textPayload') or (item.get('jsonPayload') or {}).get('message') or ''
              for word in set(re.findall(r'416_[A-Z0-9_]{4,80}',str(raw))):
                codes[word]+=1
            print('STAGE416_ISOLATED_SERVICE',service,'ENTRIES',len(rows),
              'HTTP',json.dumps(http,sort_keys=True),
              'SEVERITIES',json.dumps(severity,sort_keys=True),
              'SAFE_ERROR_CODES',json.dumps(codes,sort_keys=True),
              'MAY_BE_TRUNCATED',len(rows)>=600)
          print('STAGE416_ISOLATED_LOG_READONLY_NO_PAYLOAD=PASS')
          PY

      - name: Audit 24h Callable Scheduler and Task request counts read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,collections
          project='soridraw-app-866a5'
          services=[
            'recordprivatelike416',
            'stage416scheduleprivatewindowcandidate',
            'stage416settleprivatewindowcandidate',
          ]
          summary={}
          for service in services:
            expr=('resource.type="cloud_run_revision" AND '
                  'resource.labels.service_name="'+service+'" AND httpRequest.status:*')
            p=subprocess.run(['gcloud','logging','read',expr,'--project',project,
              '--freshness=24h','--limit=5000',
              '--format=json(timestamp,httpRequest.status,severity)'],
              capture_output=True,text=True)
            if p.returncode:
              raise SystemExit('STAGE416_24H_SERVICE_LOG_READ_DENIED_'+service)
            rows=json.loads(p.stdout or '[]')
            status=collections.Counter(
              str((row.get('httpRequest') or {}).get('status') or 'NONE') for row in rows)
            summary[service]={
              'requests':len(rows),
              'http':dict(sorted(status.items())),
              'mayBeTruncated':len(rows)>=5000,
            }
          print('STAGE416_24H_REQUEST_COUNTS='+json.dumps(summary,sort_keys=True))
          callable_count=summary['recordprivatelike416']['requests']
          scheduler_count=summary['stage416scheduleprivatewindowcandidate']['requests']
          settle_count=summary['stage416settleprivatewindowcandidate']['requests']
          print('STAGE416_24H_CALLABLE_ACTIVITY='+('YES' if callable_count>0 else 'NO'))
          print('STAGE416_24H_SCHEDULER_ACTIVITY='+('YES' if scheduler_count>0 else 'NO'))
          print('STAGE416_24H_SETTLE_ACTIVITY='+('YES' if settle_count>0 else 'NO'))
          print('STAGE416_24H_CALLABLE_WITH_ZERO_SCHEDULER='+
            ('YES' if callable_count>0 and scheduler_count==0 else 'NO'))
          print('STAGE416_24H_LOG_AUDIT_NO_UID_NO_PAYLOAD=PASS')
          PY

      - name: Inspect Eventarc transport subscription errors over 24h read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          project='soridraw-app-866a5'
          p=subprocess.run(['gcloud','functions','describe',
            'stage416SchedulePrivateWindowCandidate','--gen2','--region=us-central1',
            '--project',project,'--format=json'],capture_output=True,text=True)
          if p.returncode:
            raise SystemExit('STAGE416_EVENTARC_TRANSPORT_SOURCE_UNAVAILABLE')
          fn=json.loads(p.stdout or '{}')
          resource=str((fn.get('eventTrigger') or {}).get('trigger') or '')
          if '/triggers/' not in resource:
            raise SystemExit('STAGE416_EVENTARC_TRIGGER_RESOURCE_MISSING')
          parts=resource.split('/')
          location=parts[3]
          trigger_name=parts[-1]
          p=subprocess.run(['gcloud','eventarc','triggers','describe',trigger_name,
            '--location='+location,'--project',project,'--format=json'],
            capture_output=True,text=True)
          if p.returncode:
            raise SystemExit('STAGE416_EVENTARC_TRIGGER_READ_DENIED')
          trigger=json.loads(p.stdout or '{}')
          pubsub=(trigger.get('transport') or {}).get('pubsub') or {}
          subscription=str(pubsub.get('subscription') or '')
          topic=str(pubsub.get('topic') or '')
          print('STAGE416_EVENTARC_TRANSPORT_TOPIC_PRESENT='+str(bool(topic)).upper())
          print('STAGE416_EVENTARC_TRANSPORT_SUBSCRIPTION_PRESENT='+str(bool(subscription)).upper())
          if not subscription:
            print('STAGE416_EVENTARC_SUBSCRIPTION_ERROR_LOGS=UNAVAILABLE_NO_SUBSCRIPTION_FIELD')
            print('STAGE416_EVENTARC_TRANSPORT_READONLY=PASS')
            raise SystemExit(0)
          sub_id=subscription.rsplit('/',1)[-1]
          p=subprocess.run(['gcloud','pubsub','subscriptions','describe',sub_id,
            '--project',project,'--format=json'],capture_output=True,text=True)
          if p.returncode:
            print('STAGE416_EVENTARC_SUBSCRIPTION_DESCRIBE=UNAVAILABLE')
          else:
            info=json.loads(p.stdout or '{}')
            print('STAGE416_EVENTARC_SUBSCRIPTION_STATE='+
              str(info.get('state') or 'UNKNOWN'))
          expr=('resource.type="pubsub_subscription" AND '
                'resource.labels.subscription_id="'+sub_id+'" AND severity>=ERROR')
          p=subprocess.run(['gcloud','logging','read',expr,'--project',project,
            '--freshness=24h','--limit=200','--format=json(timestamp,severity)'],
            capture_output=True,text=True)
          if p.returncode:
            print('STAGE416_EVENTARC_SUBSCRIPTION_ERROR_LOGS=UNAVAILABLE')
          else:
            rows=json.loads(p.stdout or '[]')
            print('STAGE416_EVENTARC_SUBSCRIPTION_ERROR_COUNT_24H='+str(len(rows)))
            print('STAGE416_EVENTARC_SUBSCRIPTION_ERROR_MAY_BE_TRUNCATED='+
              str(len(rows)>=200).upper())
          print('STAGE416_EVENTARC_TRANSPORT_READONLY=PASS')
          PY

      - name: Classify 24h Scheduler timestamps and Settle outcomes read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,re,collections
          project='soridraw-app-866a5'
          def read(expr,limit=5000):
            p=subprocess.run(['gcloud','logging','read',expr,'--project',project,
              '--freshness=24h','--limit='+str(limit),'--format=json'],
              capture_output=True,text=True)
            if p.returncode:
              raise SystemExit('STAGE416_24H_TRACE_READ_DENIED')
            return json.loads(p.stdout or '[]')
          scheduler=read(
            'resource.type="cloud_run_revision" AND '
            'resource.labels.service_name="stage416scheduleprivatewindowcandidate" '
            'AND httpRequest.status:*',200)
          safe_sched=[{
            'at':str(row.get('timestamp',''))[:19],
            'http':str((row.get('httpRequest') or {}).get('status') or 'NONE'),
            'severity':str(row.get('severity') or 'DEFAULT'),
          } for row in sorted(scheduler,key=lambda x:x.get('timestamp',''))]
          print('STAGE416_24H_SCHEDULER_SAFE_TIMELINE='+json.dumps(safe_sched))
          settle=read(
            'resource.type="cloud_run_revision" AND '
            'resource.labels.service_name="stage416settleprivatewindowcandidate"',5000)
          classes=collections.Counter()
          pattern=re.compile(r'SETTLEMENT_TASK_NOT_DELIVERED\s+(RESCHEDULED|STALE|EMPTY)',re.I)
          error_codes=collections.Counter()
          errpat=re.compile(r'416_[A-Z0-9_]{4,80}')
          for row in settle:
            payload=row.get('textPayload') or (row.get('jsonPayload') or {}).get('message') or ''
            match=pattern.search(str(payload))
            if match:classes[match.group(1).upper()]+=1
            for code in set(errpat.findall(str(payload))):error_codes[code]+=1
          for kind in ('RESCHEDULED','STALE','EMPTY'):
            print('STAGE416_24H_SETTLE_'+kind+'='+str(classes[kind]))
          print('STAGE416_24H_SETTLE_NONDELIVERY_TOTAL='+str(sum(classes.values())))
          print('STAGE416_24H_SETTLE_SAFE_ERROR_CODES='+json.dumps(error_codes,sort_keys=True))
          print('STAGE416_24H_SETTLE_LOG_ENTRIES='+str(len(settle)))
          print('STAGE416_24H_SETTLE_MAY_BE_TRUNCATED='+str(len(settle)>=5000).upper())
          print('STAGE416_24H_TRACE_NO_UID_NO_TASK_ID_NO_PAYLOAD=PASS')
          PY

      - name: Audit 24h EMPTY timing distribution read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,re,collections
          project='soridraw-app-866a5'
          expr=('resource.type="cloud_run_revision" AND '
                'resource.labels.service_name="stage416settleprivatewindowcandidate"')
          p=subprocess.run(['gcloud','logging','read',expr,'--project',project,
            '--freshness=24h','--limit=5000','--format=json'],
            capture_output=True,text=True)
          if p.returncode: raise SystemExit('STAGE416_EMPTY_TIMELINE_READ_DENIED')
          rows=json.loads(p.stdout or '[]')
          pat=re.compile(r'SETTLEMENT_TASK_NOT_DELIVERED\s+EMPTY',re.I)
          times=[]
          per_hour=collections.Counter()
          for row in rows:
            payload=row.get('textPayload') or (row.get('jsonPayload') or {}).get('message') or ''
            if not pat.search(str(payload)): continue
            stamp=str(row.get('timestamp') or '')[:19]
            if stamp:
              times.append(stamp)
              per_hour[stamp[:13]]+=1
          times.sort()
          print('STAGE416_24H_EMPTY_COUNT='+str(len(times)))
          print('STAGE416_24H_EMPTY_FIRST='+str(times[0] if times else 'NONE'))
          print('STAGE416_24H_EMPTY_LAST='+str(times[-1] if times else 'NONE'))
          print('STAGE416_24H_EMPTY_PER_HOUR='+json.dumps(dict(sorted(per_hour.items()))))
          print('STAGE416_24H_EMPTY_SAFE_TIMES='+json.dumps(times))
          print('STAGE416_24H_EMPTY_TIMELINE_NO_UID_NO_TASK_ID_NO_PAYLOAD=PASS')
          PY

      - name: Verify callable-to-queue runtime identity without IAM changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          project='soridraw-app-866a5'
          names=['recordPrivateLike416','stage416SchedulePrivateWindowCandidate',
                 'stage416SettlePrivateWindowCandidate']
          identities={}
          for name in names:
            p=subprocess.run(['gcloud','functions','describe',name,'--gen2',
              '--region=us-central1','--project',project,'--format=json'],
              capture_output=True,text=True)
            if p.returncode:raise SystemExit('STAGE416_FUNCTION_IDENTITY_READ_DENIED_'+name)
            d=json.loads(p.stdout)
            if d.get('state')!='ACTIVE':raise SystemExit('STAGE416_FUNCTION_NOT_ACTIVE_'+name)
            account=d.get('serviceConfig',{}).get('serviceAccountEmail') or 'UNKNOWN'
            identities[name]=account
            print('STAGE416_FUNCTION_RUNTIME_IDENTITY',name,account)
          same=identities[names[0]]==identities[names[1]]!='UNKNOWN'
          print('STAGE416_CALLABLE_AND_SCHEDULER_SAME_SERVICE_ACCOUNT='+('YES' if same else 'NO'))
          print('STAGE416_TASK_CREATION_PERMISSION_INFERRED_ONLY_FROM_SCHEDULER_SUCCESS_NOT_TESTED')
          print('STAGE416_NO_IAM_MUTATION=PASS')
          PY

      - name: Check PREVIEW window onCreate Eventarc binding without mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          name='stage416SchedulePrivateWindowCandidate'
          project='soridraw-app-866a5'
          p=subprocess.run(['gcloud','functions','describe',name,'--gen2',
            '--region=us-central1','--project',project,'--format=json'],
            text=True,capture_output=True)
          if p.returncode:raise SystemExit('STAGE416_SCHEDULE_EVENTARC_DESCRIPTION_DENIED')
          d=json.loads(p.stdout)
          trigger=d.get('eventTrigger') or {}
          eventType=str(trigger.get('eventType') or '')
          filters=[{'attribute':str(x.get('attribute') or ''),
                   'value':str(x.get('value') or '')}
                   for x in (trigger.get('eventFilters') or [])]
          print('STAGE416_ONCREATE_FUNCTION_STATE='+str(d.get('state') or 'UNKNOWN'))
          print('STAGE416_ONCREATE_EVENT_TYPE='+eventType)
          print('STAGE416_ONCREATE_EVENT_FILTERS='+json.dumps(filters,sort_keys=True))
          print('STAGE416_ONCREATE_TRIGGER_REGION='+str(trigger.get('triggerRegion') or 'UNSET'))
          print('STAGE416_ONCREATE_TRIGGER_RESOURCE_PRESENT='+str(bool(trigger.get('trigger'))).upper())
          print('STAGE416_ONCREATE_SERVICE='+str(d.get('serviceConfig',{}).get('service','')).rsplit('/',1)[-1])
          if d.get('state')!='ACTIVE' or not trigger.get('trigger'):
            raise SystemExit('STAGE416_SCHEDULE_EVENTARC_NOT_ACTIVE')
          print('STAGE416_EVENTARC_BINDING_READONLY=PASS')
          PY

      - name: Inspect Eventarc trigger delivery conditions read only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          project='soridraw-app-866a5'
          p=subprocess.run(['gcloud','functions','describe','stage416SchedulePrivateWindowCandidate',
            '--gen2','--region=us-central1','--project',project,'--format=json'],
            capture_output=True,text=True)
          if p.returncode:raise SystemExit('STAGE416_EVENTARC_SOURCE_METADATA_UNAVAILABLE')
          src=json.loads(p.stdout or '{}')
          resource=str((src.get('eventTrigger') or {}).get('trigger') or '')
          if not resource.startswith('projects/'+project+'/locations/') or '/triggers/' not in resource:
            raise SystemExit('STAGE416_EVENTARC_TRIGGER_RESOURCE_INVALID')
          parts=resource.split('/')
          location=parts[3]
          name=parts[-1]
          # No trigger identifiers, private paths, UID or event payloads in CI logs.
          p=subprocess.run(['gcloud','eventarc','triggers','describe',name,
            '--location='+location,'--project',project,'--format=json'],
            capture_output=True,text=True)
          if p.returncode:
            print('STAGE416_EVENTARC_DELIVERY_CONDITIONS=UNVERIFIED_ACCESS')
            raise SystemExit('STAGE416_EVENTARC_CONDITION_READ_FAILED')
          info=json.loads(p.stdout or '{}')
          conditions=info.get('conditions') or {}
          if not isinstance(conditions,dict):
            raise SystemExit('STAGE416_EVENTARC_CONDITION_FORMAT_UNEXPECTED')
          # Deliberately expose only known-safe enum and boolean condition states.
          codes={}
          for key,value in conditions.items():
            if not isinstance(value,dict):continue
            code=str(value.get('code') or 'UNKNOWN')
            codes[str(key)]=code if code in ('OK','UNKNOWN','FAILED_PRECONDITION',
              'PERMISSION_DENIED','UNAVAILABLE','NOT_FOUND','INTERNAL') else 'OTHER'
          print('STAGE416_EVENTARC_CONDITION_COUNT='+str(len(codes)))
          print('STAGE416_EVENTARC_CONDITION_CODES='+json.dumps(codes,sort_keys=True))
          print('STAGE416_EVENTARC_TRANSPORT_TYPE='+str(
            ((info.get('transport') or {}).get('pubsub') or {}).get('topic') is not None).upper())
          if any(code not in ('OK','UNKNOWN') for code in codes.values()):
            raise SystemExit('STAGE416_EVENTARC_CONDITION_UNHEALTHY')
          print('STAGE416_EVENTARC_CONDITIONS_READONLY=PASS')
          print('STAGE416_EVENTARC_EVENT_DELIVERY_PROVEN=NO')
          PY

      - name: Confirm no mutation commands
        run: echo 'READONLY_DIAGNOSTIC=true;DEPLOY=0;DATABASE_WRITE=0'

      - name: Read 416 Master interval only (no account identifiers)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os,json,requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds_path=os.environ.get('GOOGLE_GHA_CREDS_PATH') or os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
          creds=service_account.Credentials.from_service_account_file(
            creds_path,scopes=['https://www.googleapis.com/auth/firebase.database',
                               'https://www.googleapis.com/auth/userinfo.email'])
          creds.refresh(Request())
          url='https://soridraw-app-866a5-default-rtdb.firebaseio.com/likeBatchTiming416/current.json'
          r=requests.get(url,params={'access_token':creds.token},timeout=20)
          if r.status_code!=200:raise SystemExit('TIMING_READ_FAILED_HTTP_'+str(r.status_code))
          d=r.json()
          if d is None:
            print('STAGE416_LIVE_TIMING=DEFAULT_PRIVATE5_PUBLIC5')
          else:
            print('STAGE416_LIVE_PRIVATE_MINUTES',d.get('privateMinutes','INVALID'))
            print('STAGE416_LIVE_PUBLIC_MINUTES',d.get('publicMinutes','INVALID'))
            print('STAGE416_LIVE_TIMING_VERSION',d.get('version','INVALID'))
          print('STAGE416_TIMING_READONLY=PASS')
          PY

      - name: Read Cloud Tasks queue status without task payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,datetime
          project='soridraw-app-866a5'
          p=subprocess.run(['gcloud','tasks','queues','list','--location=us-central1',
            '--project',project,'--format=json'],capture_output=True,text=True)
          if p.returncode:
            print('TASK_QUEUES_LIST_UNAVAILABLE',' '.join(p.stderr.split())[:180])
            raise SystemExit(32)
          qs=json.loads(p.stdout or '[]')
          wanted=[q for q in qs if 'stage416' in str(q.get('name','')).lower()]
          print('STAGE416_TASK_QUEUE_MATCHES',len(wanted))
          for queue in wanted:
            name=queue['name'].split('/')[-1]
            print('STAGE416_QUEUE_NAME',name,'STATE',queue.get('state','UNKNOWN'),
              'RATE',queue.get('rateLimits',{}).get('maxDispatchesPerSecond','UNKNOWN'))
            p=subprocess.run(['gcloud','tasks','list','--queue',name,
              '--location=us-central1','--project',project,'--format=json',
              '--limit=30'],capture_output=True,text=True)
            if p.returncode:
              print('STAGE416_TASK_LIST_UNAVAILABLE',name,' '.join(p.stderr.split())[:180])
              continue
            ts=json.loads(p.stdout or '[]')
            print('STAGE416_QUEUED_TASKS_SAMPLED',name,len(ts))
            for t in ts[:10]:
              # Task identifiers and any request payload are deliberately excluded.
              print('STAGE416_TASK_SCHEDULE',str(t.get('scheduleTime',''))[:19],
                'DISPATCHES',t.get('dispatchCount',0),
                'RESPONSES',t.get('responseCount',0),
                'STATUS_CODE',t.get('lastAttempt',{}).get('responseStatus',{}).get('code','NONE'))
          print('STAGE416_QUEUE_READONLY=PASS')
          PY

      - name: Read public derived signal timestamp only and task/final HTTP timeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,requests,datetime,json,subprocess,re
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds=service_account.Credentials.from_service_account_file(
            os.environ.get('GOOGLE_GHA_CREDS_PATH') or os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
            scopes=['https://www.googleapis.com/auth/firebase.database',
                    'https://www.googleapis.com/auth/userinfo.email'])
          creds.refresh(Request())
          endpoint='https://soridraw-app-866a5-default-rtdb.firebaseio.com/publicSync/exploreLike.json'
          response=requests.get(endpoint,params={'access_token':creds.token},timeout=20)
          if response.status_code!=200:
            raise SystemExit('PUBLIC_SIGNAL_READ_DENIED_HTTP_'+str(response.status_code))
          doc=response.json()
          if not isinstance(doc,dict):
            print('PUBLIC_SYNC_ROOT_ABSENT')
          else:
            rows=doc.get('rows') or []
            overflow=doc.get('overflow416') or []
            r=lambda x:list(x.values()) if isinstance(x,dict) else x if isinstance(x,list) else []
            at=doc.get('at')
            accepted=[x.get('at',0) for x in r(rows)+r(overflow) if isinstance(x,dict)]
            def stamp(t):
              return datetime.datetime.fromtimestamp(t/1000,datetime.timezone.utc).isoformat() if isinstance(t,(int,float)) and t>0 else 'NONE'
            print('PUBLIC_SIGNAL_LAST_PUBLISHED_UTC',stamp(at))
            print('PUBLIC_SIGNAL_VISIBLE_ROWS',len(r(rows)))
            print('PUBLIC_SIGNAL_OVERFLOW_ROWS',len(r(overflow)))
            print('PUBLIC_SIGNAL_MAX_ACCEPTED_UTC',stamp(max(accepted,default=0)))
            print('PUBLIC_SIGNAL_AGE_SECONDS',round((datetime.datetime.now(datetime.timezone.utc).timestamp()*1000-at)/1000) if isinstance(at,(int,float)) and at>0 else 'NONE')
          svcs=['stage416settleprivatewindowcandidate',
            'privatelikefinalreceipt416candidate','stage416scheduleprivatewindowcandidate']
          expr='resource.type="cloud_run_revision" AND ('+' OR '.join('resource.labels.service_name="'+s+'"' for s in svcs)+')'
          p=subprocess.run(['gcloud','logging','read',expr,'--project','soridraw-app-866a5',
            '--freshness=90m','--limit=120','--format=json'],capture_output=True,text=True)
          if p.returncode:raise SystemExit('CLOUD_FUNCTION_TIMELINE_READ_FAILED')
          entries=json.loads(p.stdout or '[]')
          errorpat=re.compile('416_[A-Z0-9_]{4,80}')
          for x in sorted(entries,key=lambda x:x.get('timestamp',''))[-30:]:
            name=x.get('resource',{}).get('labels',{}).get('service_name','?')
            status=x.get('httpRequest',{}).get('status','NO_HTTP')
            severity=x.get('severity','DEFAULT')
            payload=x.get('textPayload') or str(x.get('jsonPayload',{}).get('message',''))
            errors=list(dict.fromkeys(errorpat.findall(str(payload))))[:3]
            print('STAGE416_EVENT',x.get('timestamp','')[:19],name,'HTTP',status,
              'SEVERITY',severity,'ERROR_CODES',','.join(errors) or 'NONE')
          print('PUBLIC_BUS_AND_TASK_TIMELINE_READONLY=PASS')
          PY

