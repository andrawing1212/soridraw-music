name: APP797 existing follow writer production source candidate (read-only)
on:
  push:
    branches: [prep/production-follow-existing-writer]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/verify-797-production-follow-existing-writer.mjs
      - run: node scripts/app797-build-production-follow-readonly.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx scripts/verify-797-production-follow-hosts.ts
      - run: npm run lint
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npx --prefix functions tsc -p functions/tsconfig.json --noEmit
      - run: node scripts/verify-634-owner-follow-tab-optin.mjs && node scripts/verify-659-preview-owner-routing.mjs && node --import tsx scripts/verify-668-visitor-follow-signal.ts
