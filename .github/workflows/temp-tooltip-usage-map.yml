name: TEMP Tooltip Usage Map
permissions:
  contents: read
on:
  push:
    branches: [preview-tooltip-perf-v1]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-tooltip-perf-v1
      - name: Inspect tooltip dependencies
        shell: bash
        run: |
          set -euo pipefail
          for range in '7680,7720' '8048,8095' '10190,10260' '16465,16540' '21150,21235'; do
            echo "=== lines $range ==="
            sed -n "${range}p" src/App.tsx
          done
