name: TEMP Recover TEST 051 from proven TEST runtime

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-recover-test-051-20260909.yml'

permissions:
  contents: read

concurrency:
  group: temp-recover-test-051
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CF_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_DB_NAME: soridraw-explore-db
      PROD_DB_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
      TEST_DB_NAME: soridraw-explore-test-db
      TEST_DB_ID: 31817dbd-d06e-415e-9bc0-5553b0f5dc43
      PROD_R2: soridraw-profile-media
      TEST_R2: soridraw-profile-media-test
      TEST_WORKER: soridraw-explore-test
      PROD_WORKER: soridraw-explore-api
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      TEST_BASE: https://soridraw-explore-test.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
      TEST_ORIGIN: https://test.soridraw.com
      EXPECTED_MAIN_SHA: cb03e2eefcf6eaf2bc286668a2cc6b41414f1c5f
      EXPECTED_PROD_WORKER_VERSION: 07c11e5e-47a6-458b-a3a0-6e47b6c331e6
      BRAND_SHA: 644e785c20df6b2c1f833e87a464423caceaa721

    steps:
      - name: Checkout exact TEST source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate exact main 051 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(node -p "require('./public/app-version.json').version")" = '051'
          node scripts/verify-051-explore-shared-canonical-data.mjs
          node --check cloudflare/explore-worker/patches/031-explore-shared-canonical-data.mjs
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          echo 'RECOVERY_SOURCE_051_VALIDATION=PASS'

      - name: Lock PRODUCTION before recovery
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.com/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"
          node <<'NODE'
          const A=process.env.CF_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PROD_WORKER;
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status+' '+JSON.stringify(x).slice(0,700));return x.result||x;}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;const ds=await g(base+'/deployments');const d=(ds.deployments||ds||[])[0];const a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];if(a?.version_id!==process.env.EXPECTED_PROD_WORKER_VERSION)throw Error('PRODUCTION worker changed: '+a?.version_id);console.log('PRODUCTION_WORKER_LOCK=PASS '+a.version_id);})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Patch proven TEST runtime to 051 shared-data runtime
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false wrangler@4.102.0
          rm -rf .remote-test && mkdir .remote-test
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const A=process.env.CF_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.TEST_WORKER,headers={Authorization:`Bearer ${T}`};
          async function json(url){const r=await fetch(url,{headers:{...headers,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status+' '+JSON.stringify(x).slice(0,800));return x.result||x;}
          function safe(name){const s=String(name||'').replaceAll('\\','/').replace(/^\/+/, '');if(!s||s.includes('../'))throw Error('unsafe module '+name);return s;}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;
            const r=await fetch(base+'/content/v2',{headers});if(!r.ok)throw Error('TEST content/v2 '+r.status+' '+(await r.text()).slice(0,500));
            const ct=String(r.headers.get('content-type')||'').toLowerCase();let main='worker.js';
            if(ct.includes('multipart/form-data')){
              const form=await r.formData();let metadata={};const written=[];
              for(const [field,value] of form.entries()){
                if(typeof value==='string'){if(field==='metadata'&&value.trim())metadata=JSON.parse(value);continue;}
                const name=safe(value.name||field);const target=path.join('.remote-test',name);fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,Buffer.from(await value.arrayBuffer()));written.push(name);
              }
              main=safe(metadata.main_module||metadata.body_part||written[0]);
              if(!written.includes(main)){const m=written.find(x=>x.endsWith('/'+main));if(m)main=m;}
              if(written.length!==1||!written.includes(main))throw Error('expected one proven TEST runtime module, got '+JSON.stringify(written)+' main='+main);
              if(main!=='worker.js')fs.copyFileSync(path.join('.remote-test',main),'.remote-test/worker.js');
              console.log('TEST_BASE_RUNTIME_MODULE='+main);
            } else {
              fs.writeFileSync('.remote-test/worker.js',await r.text());
            }
            const s=fs.readFileSync('.remote-test/worker.js','utf8');
            for(const required of ['handleExploreFeedRevision019','handlePublicProfileFirstViewWithEdgeCache','fanoutExploreMirror020','enforceUserRateLimit'])if(!s.includes(required))throw Error('TEST baseline prerequisite missing '+required);
            if(s.includes('SORIDRAW_EXPLORE_SHARED_CANONICAL_DATA_031_20260909'))throw Error('TEST baseline unexpectedly already 051');
            const settings=await json(base+'/settings');
            fs.writeFileSync('.remote-test/settings.json',JSON.stringify(settings));
            console.log('TEST_PROVEN_BASELINE=PASS bytes='+s.length);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          export SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-test"
          node patches/031-explore-shared-canonical-data.mjs
          node --check .remote-test/worker.js
          grep -Fq 'SORIDRAW_EXPLORE_SHARED_CANONICAL_DATA_031_20260909' .remote-test/worker.js
          node <<'NODE'
          const fs=require('fs');const settings=JSON.parse(fs.readFileSync('.remote-test/settings.json','utf8'));
          const cfg={name:process.env.TEST_WORKER,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-08-28').slice(0,10),workers_dev:true,keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.PROD_DB_NAME,database_id:process.env.PROD_DB_ID},{binding:'RATE_DB',database_name:process.env.TEST_DB_NAME,database_id:process.env.TEST_DB_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.PROD_R2},{binding:'EXPLORE_CACHE',bucket_name:process.env.TEST_R2}],observability:settings.observability&&typeof settings.observability==='object'?{enabled:settings.observability.enabled!==false}:{enabled:true}};
          if(Array.isArray(settings.compatibility_flags)&&settings.compatibility_flags.length)cfg.compatibility_flags=settings.compatibility_flags;
          fs.writeFileSync('.remote-test/wrangler-test.jsonc',JSON.stringify(cfg,null,2));
          console.log('TEST_RUNTIME_051_PATCH=PASS');
          NODE

      - name: Deploy TEST Worker with shared canonical data
        shell: bash
        working-directory: cloudflare/explore-worker
        run: |
          set -euo pipefail
          npx wrangler deploy --strict --config .remote-test/wrangler-test.jsonc
          sleep 5
          node <<'NODE'
          const A=process.env.CF_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.TEST_WORKER;
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status+' '+JSON.stringify(x).slice(0,800));return x.result||x;}
          (async()=>{const s=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}/settings`),b=s.bindings||[];const check=(n,t,id)=>{const x=b.find(v=>v.name===n);if(!x||x.type!==t)throw Error('binding '+n+' '+JSON.stringify(x));if(id&&String(x.id||x.database_id||x.bucket_name||x.bucket||'')!==id)throw Error('target '+n+' '+JSON.stringify(x));};check('DB','d1',process.env.PROD_DB_ID);check('RATE_DB','d1',process.env.TEST_DB_ID);check('PROFILE_MEDIA','r2_bucket',process.env.PROD_R2);check('EXPLORE_CACHE','r2_bucket',process.env.TEST_R2);console.log('TEST_SHARED_BINDINGS=PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify PREVIEW and TEST Explore parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          async function feed(base,origin,sort){const rr=await fetch(base+'/v1/feed-revision?sort='+sort,{headers:{Origin:origin}});if(!rr.ok)throw Error('revision '+base+' '+rr.status);const rev=(await rr.json())?.data?.revision||'';const r=await fetch(base+'/v1/feed?sort='+sort+'&limit=40&__soridraw_revision='+encodeURIComponent(rev),{headers:{Origin:origin}});if(!r.ok)throw Error('feed '+base+' '+r.status);return (await r.json())?.data?.items||[];}
          async function profile(base,origin,ref){const u=new URL(base+'/v1/profiles/'+encodeURIComponent(ref)+'/first-view');u.searchParams.set('limit','50');u.searchParams.set('__soridraw_shared_profile','51');const r=await fetch(u,{headers:{Origin:origin}});if(!r.ok)throw Error('profile '+base+' '+r.status);return (await r.json())?.data||{};}
          const ids=x=>x.map(v=>String(v.id||v.trackId||''));
          (async()=>{let owners=[];for(const sort of ['latest','popular']){const [p,t]=await Promise.all([feed(process.env.PREVIEW_BASE,process.env.PREVIEW_ORIGIN,sort),feed(process.env.TEST_BASE,process.env.TEST_ORIGIN,sort)]);if(JSON.stringify(ids(p))!==JSON.stringify(ids(t)))throw Error(sort+' feed mismatch '+p.length+'/'+t.length);if(p.length!==30)throw Error(sort+' expected 30 got '+p.length);owners=[...new Set([...owners,...p.map(x=>String(x.ownerUid||x.owner_uid||'')).filter(Boolean)])];console.log('EXPLORE_'+sort.toUpperCase()+'_PREVIEW_TEST=PASS items='+p.length);}const counts=[];for(const ref of owners){const [p,t]=await Promise.all([profile(process.env.PREVIEW_BASE,process.env.PREVIEW_ORIGIN,ref),profile(process.env.TEST_BASE,process.env.TEST_ORIGIN,ref)]);const pi=p.items||[],ti=t.items||[];const pc=Number(p.profile?.trackCount??p.profile?.track_count??0),tc=Number(t.profile?.trackCount??t.profile?.track_count??0);if(pc!==tc||JSON.stringify(ids(pi))!==JSON.stringify(ids(ti)))throw Error('profile mismatch '+ref);if(pc!==pi.length)throw Error('profile count/items mismatch '+ref);counts.push(pc);}counts.sort((a,b)=>b-a);if(JSON.stringify(counts)!==JSON.stringify([18,11,1]))throw Error('profile counts '+JSON.stringify(counts));console.log('PUBLIC_PROFILE_PREVIEW_TEST=PASS counts='+JSON.stringify(counts));})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Build TEST 051 with approved TEST branding
        shell: bash
        run: |
          set -euo pipefail
          git restore .
          base="https://raw.githubusercontent.com/andrawing1212/soridraw-music/$BRAND_SHA"
          curl -fsSL "$base/public/manifest.test.json" -o public/manifest.test.json
          for file in soridraw-app-test-042.png soridraw-app-test-042-256.png soridraw-app-test-042-512.png soridraw-favicon-test-042.png soridraw-test-042.ico; do curl -fsSL "$base/public/brand/$file" -o "public/brand/$file"; done
          node <<'NODE'
          const fs=require('fs');let s=fs.readFileSync('index.html','utf8');const must=(a,b)=>{if(!s.includes(a))throw Error('brand anchor '+a);s=s.replace(a,b)};must('<title>SORIDRAW(P)</title>','<title>SORIDRAW(T)</title>');s=s.replaceAll('content="SORIDRAW(P)"','content="SORIDRAW(T)"');must('href="/brand/soridraw-favicon-preview-041.png"','href="/brand/soridraw-favicon-test-042.png"');must('href="/brand/soridraw-favicon-preview-041.png"','href="/brand/soridraw-test-042.ico"');must('href="/brand/soridraw-app-preview-041.png"','href="/brand/soridraw-app-test-042.png"');must('href="/manifest.preview.json"','href="/manifest.test.json"');s=s.replace("environment === 'preview' ? '/brand/soridraw-favicon-preview-041.png'", "environment === 'test' ? '/brand/soridraw-favicon-test-042.png' : environment === 'preview' ? '/brand/soridraw-favicon-preview-041.png'");s=s.replace("environment === 'preview' ? '/brand/soridraw-preview-041.ico' : faviconHref", "environment === 'test' ? '/brand/soridraw-test-042.ico' : environment === 'preview' ? '/brand/soridraw-preview-041.ico' : faviconHref");s=s.replace("environment === 'preview' ? '/brand/soridraw-app-preview-041.png'", "environment === 'test' ? '/brand/soridraw-app-test-042.png' : environment === 'preview' ? '/brand/soridraw-app-preview-041.png'");s=s.replace("environment === 'preview' ? '/manifest.preview.json'", "environment === 'test' ? '/manifest.test.json' : environment === 'preview' ? '/manifest.preview.json'");fs.writeFileSync('index.html',s);
          NODE
          npm run build
          grep -Fq 'soridraw-app-test-042.png' dist/index.html
          grep -Fq 'soridraw-app-test-042-512.png' dist/manifest.test.json
          echo 'TEST_051_BRAND_BUILD=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase TEST 051
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-test.json --non-interactive
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          ok=''
          for i in $(seq 1 15); do curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://test.soridraw.com/?r=$GITHUB_RUN_ID-$i" -o "$RUNNER_TEMP/test.html" || true; remote_sha="$(sha256sum "$RUNNER_TEMP/test.html" 2>/dev/null | awk '{print $1}' || true)"; if [ "$remote_sha" = "$local_sha" ]; then ok=yes; break; fi; sleep 5; done
          test "$ok" = yes
          v="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://test.soridraw.com/app-version.json?r=$GITHUB_RUN_ID" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          test "$v" = 051
          grep -Fq 'soridraw-app-test-042.png' "$RUNNER_TEMP/test.html"
          echo 'FIREBASE_TEST_051=PASS'
          echo 'TEST_EXACT_BUILD=PASS'

      - name: Final verification and PRODUCTION lock
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.com/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          node <<'NODE'
          const A=process.env.CF_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,N=process.env.PROD_WORKER;async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status);return x.result||x;}(async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`,ds=await g(base+'/deployments'),d=(ds.deployments||ds||[])[0],a=[...(d?.versions||[])].sort((x,y)=>Number(y.percentage)-Number(x.percentage))[0];if(a?.version_id!==process.env.EXPECTED_PROD_WORKER_VERSION)throw Error('PRODUCTION worker changed');console.log('PRODUCTION_WORKER_UNCHANGED=PASS '+a.version_id);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          echo 'PRODUCTION_HOSTING_UNCHANGED=PASS'
          echo 'MAIN_051_UNCHANGED=PASS'
          echo 'TEST_RELEASE_051_COMPLETE=true'
          echo 'SHARED_EXPLORE_CANONICAL_D1=true'
          echo 'PREVIEW_TEST_ENV_CACHE_SEPARATE=true'
          echo 'PRODUCTION_CODE_DEPLOY=false'
          echo 'PREVIEW_URL=https://preview.soridraw.com/'
          echo 'TEST_URL=https://test.soridraw.com/'
