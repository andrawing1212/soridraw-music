name: SORIDRAW APP618 Isolated Owner Worker Code Ready Runtime OFF
on:
  push:
    branches: [feat/app600-owner-standalone-isolated]
    paths:
      - 'cloudflare/owner-follow-worker/worker.mjs'
      - 'scripts/verify-600-owner-standalone-isolated.mjs'
      - 'scripts/app618-standalone-prepared-off.mjs'
      - '.github/workflows/follow-618-standalone-prepared-off.yml'
      - '.deploy/app618-standalone-prepared-off.trigger'
permissions:
  contents: read
concurrency:
  group: soridraw-app618-isolated-owner-runtime-off
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Only approved one-shot pin may deploy
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [ "$changed" != '.deploy/app618-standalone-prepared-off.trigger' ]; then
            echo deploy=false >> "$GITHUB_OUTPUT"
            echo APP618_NO_TRIGGER_NO_DEPLOY=PASS
            exit 0
          fi
          printf 'approved_parent=%s\n' "$(git rev-parse HEAD^)" | cmp -s - .deploy/app618-standalone-prepared-off.trigger
          diff="$(git diff --name-only aea4059d6f1bbf4a4ce0ad4787b29a941066e6f4 HEAD^)"
          for file in 'cloudflare/owner-follow-worker/worker.mjs' 'scripts/verify-600-owner-standalone-isolated.mjs' 'scripts/app618-standalone-prepared-off.mjs' '.github/workflows/follow-618-standalone-prepared-off.yml'; do
            grep -Fxq "$file" <<< "$diff"
          done
          test "$(printf '%s\n' "$diff" | wc -l)" -eq 4
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = 028e51a2d52b50e1f021dd6d689268518077c2e1
          echo deploy=true >> "$GITHUB_OUTPUT"
      - name: Scoped source and isolated owner DO regression
        run: |
          set -euo pipefail
          node --check cloudflare/owner-follow-worker/worker.mjs
          node --check scripts/app618-standalone-prepared-off.mjs
          node scripts/verify-600-owner-standalone-isolated.mjs
          node scripts/verify-601-owner-service-integration.mjs
          node scripts/app618-standalone-prepared-off.mjs --source-only
      - name: Build isolated owner Worker without network
        if: steps.gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          npm --prefix cloudflare/explore-worker install --ignore-scripts --no-audit --no-fund --package-lock=false
          mkdir -p "$RUNNER_TEMP/app618-dryrun"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            ./cloudflare/explore-worker/node_modules/.bin/wrangler deploy \
              --config cloudflare/owner-follow-worker/wrangler.candidate.jsonc \
              --dry-run --outdir "$RUNNER_TEMP/app618-dryrun"
      - name: Preflight the existing isolated OFF Worker and original Explore
        if: steps.gate.outputs.deploy == 'true'
        run: node scripts/app618-standalone-prepared-off.mjs --preflight
      - name: Code-only deploy, runtime OFF and no public routing
        if: steps.gate.outputs.deploy == 'true'
        run: ./cloudflare/explore-worker/node_modules/.bin/wrangler deploy --config cloudflare/owner-follow-worker/wrangler.candidate.jsonc
      - name: Verify old version rollback and unchanged Explore
        if: steps.gate.outputs.deploy == 'true'
        run: node scripts/app618-standalone-prepared-off.mjs --postflight
