name: SORIDRAW Deploy Explore Publication Fix PREVIEW 2026-09-04

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-deploy-explore-publication-preview-20260904.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
  CLOUDFLARE_WORKER: soridraw-explore-preview
  EXPECTED_OLD_VERSION: 095c8346-ce6c-48d5-9817-4bcc62f48f5c
  UPLOADED_VERSION: 8fb000d8-2685-4aa6-a410-e29b93684dcc

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify uploaded Worker version then deploy PREVIEW 100%
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,W=process.env.CLOUDFLARE_WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          const expected=process.env.EXPECTED_OLD_VERSION,newId=process.env.UPLOADED_VERSION;
          const api=async(url,options={})=>{const r=await fetch(url,{...options,headers:{Authorization:`Bearer ${T}`,...(options.headers||{})}});const text=await r.text();let x={};try{x=JSON.parse(text)}catch{};if(!r.ok||x.success===false)throw new Error(`Cloudflare ${options.method||'GET'} ${r.status}: ${text.slice(0,1200)}`);return x.result||x};
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;
            const deployments=await api(`${base}/deployments`); const current=(deployments.deployments||deployments||[])[0]; const active=[...(current?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(active?.version_id!==expected||Number(active?.percentage||0)<99.99) throw new Error(`active PREVIEW Worker changed: ${active?.version_id||'none'}`);

            const meta=await api(`${base}/versions/${newId}`); const bindings=Array.isArray(meta.resources?.bindings)?meta.resources.bindings:[]; const names=bindings.map(b=>String(b.name)).sort();
            const required=['BOOTSTRAP_TOKEN','DB','ENV_NAME','PROD_BASE','PROFILE_MEDIA','TARGET_BASE'].sort();
            if(JSON.stringify(names)!==JSON.stringify(required)) throw new Error(`uploaded binding parity failed: ${names}`);
            const moduleView=await api(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${newId}?include=modules`); const worker=(moduleView.modules||[]).find(m=>String(m.name||'')==='worker.js'); const src=Buffer.from(String(worker?.content_base64||''),'base64').toString('utf8');
            if(!src.includes('SORIDRAW_EXPLORE_PUBLICATION_INCREMENTAL_FEED_SYNC_012_20260904')) throw new Error('uploaded patch marker missing');
            if(!src.includes('const publicationFeedItem = mapTrackRow(storedOptions);')) throw new Error('uploaded incremental sync missing');

            await api(`${base}/deployments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy:'percentage',versions:[{percentage:100,version_id:newId}]})});
            let ok=false; for(let i=0;i<12;i++){const d=await api(`${base}/deployments`);const rows=d.deployments||d||[];if(rows.some(dep=>Array.isArray(dep.versions)&&dep.versions.some(v=>v.version_id===newId&&Number(v.percentage)>=99.99))){ok=true;break}await new Promise(r=>setTimeout(r,2000));}
            if(!ok) throw new Error('new version did not become active at 100%');
            console.log(`CLOUDFLARE_PREVIEW_DEPLOY=PASS version=${newId}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify PREVIEW Worker and app addresses
        run: |
          set -euo pipefail
          nonce="$(date +%s)"
          code="$(curl -sS --max-time 25 -H 'Origin: https://preview.soridraw.com' -H 'Accept: application/json' -D /tmp/explore-headers.txt -o /tmp/explore-feed.json -w '%{http_code}' "https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed?sort=latest&limit=40&verify=$nonce")"
          test "$code" = '200'
          node -e "const x=require('/tmp/explore-feed.json'); if(!x?.ok || !Array.isArray(x?.data?.items)) process.exit(1); console.log('EXPLORE_FEED_ITEMS='+x.data.items.length)"
          for url in 'https://soridraw-preview.web.app/' 'https://soridraw-preview.firebaseapp.com/' 'https://preview.soridraw.com/'; do
            body="$(mktemp)"; http="$(curl -L -sS --max-time 25 -o "$body" -w '%{http_code}' "$url")"; test "$http" = '200'; grep -Fq '<div id="root"></div>' "$body"; echo "PREVIEW_SMOKE=PASS $url";
          done
          echo 'CLOUDFLARE_PREVIEW_SMOKE=PASS'
