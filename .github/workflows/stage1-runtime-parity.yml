name: Stage1 Runtime Parity

on:
  push:
    branches: [preview-build-cleanup]
    paths:
      - '.github/workflows/stage1-runtime-parity.yml'

permissions:
  contents: read

jobs:
  compare-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout legacy preview
        uses: actions/checkout@v4
        with:
          ref: preview
          path: legacy

      - name: Checkout frozen cleanup branch
        uses: actions/checkout@v4
        with:
          ref: preview-build-cleanup
          path: frozen

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install legacy dependencies
        working-directory: legacy
        run: npm ci --no-audit --no-fund

      - name: Install frozen dependencies
        working-directory: frozen
        run: npm ci --no-audit --no-fund

      - name: Materialize legacy generated source
        working-directory: legacy
        run: npm run prebuild

      - name: Compare generated legacy source with frozen source
        shell: bash
        run: |
          set -euo pipefail
          diff -qr legacy/src frozen/src
          echo 'Generated src parity: PASS'

      - name: Build legacy runtime
        working-directory: legacy
        run: npm run build

      - name: Build frozen runtime
        working-directory: frozen
        run: npm run build

      - name: Compare dist byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          diff -qr legacy/dist frozen/dist
          (cd legacy/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/legacy.sha256"
          (cd frozen/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/frozen.sha256"
          cmp "$RUNNER_TEMP/legacy.sha256" "$RUNNER_TEMP/frozen.sha256"
          echo 'Runtime dist parity: PASS'
