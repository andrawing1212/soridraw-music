name: Approved exact production backend activation
on:
  push:
    branches: [release/full-production-backend-activation]
    paths:
      - '.github/workflows/full-production-backend-activation.yml'
permissions:
  contents: read
concurrency:
  group: soridraw-full-production-backend-activation
  cancel-in-progress: false
jobs:
  activate:
    if: >-
      github.repository == 'andrawing1212/soridraw-music' && github.actor == github.repository_owner && github.run_attempt == 1 && github.event.head_commit.message == 'release: approved exact production backend activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check scripts/full-production-backend-activation.mjs
          node --check scripts/verify-full-release-common-manifest-route.mjs
          npm install --prefix "$RUNNER_TEMP/manifest-local-deps" --no-save --no-package-lock --no-audit --no-fund miniflare@4.20260730.0
      - uses: google-github-actions/auth@v2
        id: firebase
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token
      - name: Exact preflight, active version switch, bounded live verification and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
        run: node scripts/full-production-backend-activation.mjs
