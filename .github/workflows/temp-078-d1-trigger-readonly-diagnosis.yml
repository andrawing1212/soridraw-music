name: TEMP 078 D1 Trigger Readonly Diagnosis

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-078-d1-trigger-readonly-diagnosis.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Inspect publication D1 schema and constraints only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE (type='table' AND name IN ('tracks','track_stats','public_profiles','explore_derived_tracks','explore_derived_profiles','explore_derived_changes','explore_derived_state','explore_shared_revision')) OR (type='index' AND tbl_name IN ('tracks','explore_derived_tracks','explore_derived_profiles','explore_derived_changes','explore_derived_state','explore_shared_revision')) ORDER BY type,tbl_name,name;" --json > "$RUNNER_TEMP/schema.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/schema.json','utf8'));
          for(const row of raw.flatMap(x=>x.results||[])){
            console.log('\n=== '+row.type+' '+row.name+' ON '+row.tbl_name+' ===');
            console.log(String(row.sql||''));
          }
          NODE
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "PRAGMA foreign_key_list(tracks); PRAGMA foreign_key_list(explore_derived_tracks); PRAGMA foreign_key_list(explore_derived_profiles); PRAGMA table_info(explore_derived_profiles);" --json
          echo 'READ_ONLY_SCHEMA_DIAGNOSIS=PASS'
