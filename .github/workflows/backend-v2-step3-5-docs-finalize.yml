name: SORIDRAW Backend V2 Step 3-5 Docs Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-5-docs-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Update master plan and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'Status: IMPLEMENTATION / Step 3-4 limited backfill complete and independently verified — settings 3 + playlist headers 42 + playlist items 49 + recent songs 68 + standalone Music Note/favorites 738 migrated with V1 unchanged; Step 3-5 per-user automatic verification is next and starts read-only',
                  'Status: IMPLEMENTATION / Step 3-5 per-user automatic verification complete — 10/10 migrated users passed and all 900 migrated V2 documents were accounted for with full payload/metadata parity and zero verification writes; Step 3-6 V1 retention / rollback safety confirmation is next and starts read-only'
              ),
              (
                  '### Step 3 — Backup, backfill and verification (4/6 complete; Step 3-4 limited backfill complete and independently verified) 🔄',
                  '### Step 3 — Backup, backfill and verification (5/6 complete; Step 3-5 per-user automatic verification complete) 🔄'
              ),
              (
                  '- [ ] 3-5 Per-user automatic verification.',
                  '- [x] 3-5 Per-user automatic verification complete: 10/10 migrated users passed; settings 3, playlist headers 42, playlist items 49, recent songs 68 and standalone Music Note/favorites 738 all matched expected V2 paths/counts/payload metadata with 0 error categories and 0 writes/deletes. Full detail: `docs/SORIDRAW_BACKEND_V2_STEP3_5_PER_USER_VERIFICATION_RESULT.md`.'
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one master-plan match, found {text.count(old)}: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/backend-v2-step3-5-docs-finalize.yml
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git commit -m 'docs: finalize Step 3-5 per-user verification status'
          git push origin HEAD:preview
