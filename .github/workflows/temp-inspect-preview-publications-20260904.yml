name: SORIDRAW Inspect PREVIEW Publications 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-preview-publications-20260904.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inspect active PREVIEW Worker bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account='e1a30fc9ef497fda1d34f4ab3dc1da45';
          const name='soridraw-explore-preview';
          async function j(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,1000));return x.result||x;}
          const s=await j(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/settings`);
          const safe=(s.bindings||[]).map(b=>({type:b.type,name:b.name,id:b.id||b.database_id||b.namespace_id||null,bucket_name:b.bucket_name||null,service:b.service||null,environment:b.environment||null}));
          console.log('COMPAT='+s.compatibility_date);
          console.log('FLAGS='+JSON.stringify(s.compatibility_flags||[]));
          console.log('BINDINGS='+JSON.stringify(safe));
          NODE
