name: TEMP 339 Genre Cost Bound Apply

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-339-genre-cost-bound.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-339-genre-cost-bound
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Apply and verify app339
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply_339_genre_cost_bound.py
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node scripts/verify-339-genre-cost-bound.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-336-r2-hybrid-read.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-197-new-public-track-like.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-210-targeted-personal-like-settlement.mjs
      - name: TypeScript and Build
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build
      - name: Commit verified product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-339-genre-cost-bound.yml
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git commit -m 'fix(preview): bound and cache Korean genre search'
          git push origin HEAD:preview
          echo "APP339_PRODUCT_COMMIT=$(git rev-parse HEAD)"
