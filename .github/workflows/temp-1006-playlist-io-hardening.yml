name: TEMP 1006 Playlist IO Hardening

on:
  push:
    branches: [preview-perf-memory-wav-stability]
    paths:
      - '.github/workflows/temp-1006-playlist-io-hardening.yml'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-perf-memory-wav-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply patch
        run: python3 .deploy/temp-1006-playlist-io-hardening.py
      - name: Verify scope
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          echo "changed=$changed"
          test "$changed" = "src/components/GlobalPlayer.tsx src/services/playlistService.ts "
          grep -q "resolvePlaylistInsertOrder" src/services/playlistService.ts
          grep -q "orderBy('order', 'desc'), limit(1)" src/services/playlistService.ts
          grep -q "where('sourceId', '==', sourceId), limit(8)" src/services/playlistService.ts
          grep -q "getPrimaryNormalPlaylist" src/components/GlobalPlayer.tsx
      - name: Verify IO contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/services/playlistService.ts').read_text()
          add=s[s.index('export const addPlaylistItem'):s.index('export const deletePlaylistItem')]
          move=s[s.index('export const movePlaylistItem'):s.index('export const updatePlaylistItemColor')]
          assert 'getDocs(itemsRef)' not in add
          assert 'getDocs(toItemsRef)' not in move
          assert add.count('setDoc(') == 1
          print('bounded playlist save/move IO contract: PASS')
          PY
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit verified source changes
        run: |
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/GlobalPlayer.tsx src/services/playlistService.ts
          git commit -m "fix(preview): bound playlist save reads to constant cost"
          git push origin HEAD:preview-perf-memory-wav-stability
