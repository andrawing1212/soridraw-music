name: Apply device count yellow UI once

on:
  push:
    branches:
      - main
    paths:
      - .deploy/apply-device-count-yellow-trigger.txt

concurrency:
  group: apply-device-count-yellow-main-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply UI patch
        shell: bash
        run: |
          git apply --check .deploy/admin-device-count-yellow.patch
          git apply .deploy/admin-device-count-yellow.patch

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Commit UI change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminUserManagementPage.tsx
          git commit -m "style: show device count in yellow"
          git push origin HEAD:main
