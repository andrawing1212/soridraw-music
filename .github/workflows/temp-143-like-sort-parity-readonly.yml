name: TEMP 143 Like Sort Parity Readonly
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-143-like-sort-parity-readonly.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9af867e37e967fe9ba7863e0cadcd878530409b2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only current feed snapshots and public API
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          for sort in latest popular; do
            node "$W" r2 object get "soridraw-profile-media/internal/explore/shared-feed-v112/$sort-40.json" --file "$RUNNER_TEMP/shared-$sort.json" --remote >/dev/null
            node "$W" r2 object get "soridraw-profile-media-preview/internal/explore/feed-v1/$sort-40.json" --file "$RUNNER_TEMP/local-$sort.json" --remote >/dev/null
            curl --retry 2 -sS -H 'Origin: https://preview.soridraw.com' -D "$RUNNER_TEMP/api-$sort.head" -o "$RUNNER_TEMP/api-$sort.json" "https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed?sort=$sort&limit=40&__soridraw_r2_only=108"
          done
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),root=process.env.RUNNER_TEMP;
          const get=(scope,sort)=>JSON.parse(fs.readFileSync(root+'/'+scope+'-'+sort+'.json','utf8'))?.payload?.data?.items || [];
          const idOf=x=>String(x?.id||x?.trackId||'').trim();
          const count=x=>Number(x?.likeCount??x?.like_count??x?.stats?.likeCount??x?.stats?.like_count??0);
          const hash=id=>crypto.createHash('sha256').update(id).digest('hex').slice(0,10);
          for(const scope of ['shared','local']){
            const latest=get(scope,'latest'),popular=get(scope,'popular');
            const top=new Map(popular.map(x=>[idOf(x),x]));
            let mismatch=0;
            for(const item of latest){
              const id=idOf(item),other=top.get(id);
              if(!other)continue;
              const a=count(item),b=count(other);
              if(a!==b){
                mismatch++;
                if(mismatch<=20)console.log('SORT_COUNT_MISMATCH scope='+scope+' hash='+hash(id)+' latest='+a+' popular='+b+' title='+JSON.stringify(String(item?.title||'').slice(0,90)));
              }
            }
            const onesLatest=latest.filter(x=>count(x)>0).length,onesPopular=popular.filter(x=>count(x)>0).length;
            console.log('SORT_SUMMARY scope='+scope+' latestItems='+latest.length+' popularItems='+popular.length+' nonzeroLatest='+onesLatest+' nonzeroPopular='+onesPopular+' overlappingMismatches='+mismatch);
          }
          for(const sort of ['latest','popular']){
            const api=JSON.parse(fs.readFileSync(root+'/api-'+sort+'.json','utf8'))?.data?.items||[];
            const shared=get('shared',sort);
            const byId=new Map(shared.map(x=>[idOf(x),x]));
            const diff=api.filter(x=>byId.has(idOf(x))&&count(x)!==count(byId.get(idOf(x))));
            console.log('API_SHARED_PARITY sort='+sort+' apiItems='+api.length+' mismatches='+diff.length+' apiNonzero='+api.filter(x=>count(x)>0).length);
          }
          NODE
      - name: Canonical D1 bounded targeted like count check
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          node "$W" d1 execute DB --remote --config "$PWD/canonical/wrangler.preview.jsonc" --command "SELECT t.id, COALESCE(s.like_count,0) AS like_count FROM tracks t LEFT JOIN track_stats s ON s.track_id=t.id WHERE t.is_public=1 ORDER BY t.published_at DESC LIMIT 40" --json > "$RUNNER_TEMP/d1-likes.json"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),root=process.env.RUNNER_TEMP;
          const rows=JSON.parse(fs.readFileSync(root+'/d1-likes.json','utf8')).flatMap(x=>x.results||[]);
          const latest=JSON.parse(fs.readFileSync(root+'/shared-latest.json','utf8'))?.payload?.data?.items||[];
          const popular=JSON.parse(fs.readFileSync(root+'/shared-popular.json','utf8'))?.payload?.data?.items||[];
          const hash=id=>crypto.createHash('sha256').update(id).digest('hex').slice(0,10);
          const idOf=x=>String(x?.id||x?.trackId||'').trim();
          const count=x=>Number(x?.likeCount??x?.like_count??x?.stats?.likeCount??0);
          const local=new Map(rows.map(x=>[String(x.id),Number(x.like_count||0)]));
          for(const [sort,items] of [['latest',latest],['popular',popular]]){
            let mismatch=0;
            for(const item of items){
              const id=idOf(item);
              if(!local.has(id))continue;
              if(count(item)!==local.get(id)){
                mismatch++;
                if(mismatch<=20)console.log('D1_COUNT_MISMATCH sort='+sort+' hash='+hash(id)+' canonical='+local.get(id)+' feed='+count(item));
              }
            }
            console.log('D1_PARITY sort='+sort+' compared='+items.filter(x=>local.has(idOf(x))).length+' mismatches='+mismatch);
          }
          console.log('D1_WRITE=0 R2_WRITE=0 DEPLOY=0');
          NODE
