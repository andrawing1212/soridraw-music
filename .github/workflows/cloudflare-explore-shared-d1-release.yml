name: SORIDRAW Shared D1 Release

on:
  push:
    branches:
      - preview
    paths:
      - '.deploy/shared-d1-release.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-shared-d1-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      APPROVED_MIGRATION: 20260911_01_explore_like_deferred_batches.sql
      APPROVED_MIGRATION_BLOB: b3f68fa1feee460c19a4a3c687ceb990509f23c9
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      TEST_BASE: https://soridraw-explore-test.andrawing1212.workers.dev
      PRODUCTION_BASE: https://soridraw-explore-api.andrawing1212.workers.dev

    steps:
      - name: Checkout release trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve approved shared D1 release
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          trigger='.deploy/shared-d1-release.trigger'
          test -f "$trigger"
          target="$(sed -n 's/^product_code_target=//p' "$trigger" | tail -1 | tr -d '\r')"
          migration="$(sed -n 's/^migration=//p' "$trigger" | tail -1 | tr -d '\r')"
          blob="$(sed -n 's/^migration_blob=//p' "$trigger" | tail -1 | tr -d '\r')"
          test "$migration" = "$APPROVED_MIGRATION"
          test "$blob" = "$APPROVED_MIGRATION_BLOB"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "$target" origin/preview
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
          git rev-parse origin/main > "$RUNNER_TEMP/main-before.sha"
          git rev-parse origin/production > "$RUNNER_TEMP/production-before.sha"
          echo "LOCKED_D1_RELEASE_TARGET=$target"

      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify migration source and fixtures
        shell: bash
        run: |
          set -euo pipefail
          migration="cloudflare/explore-worker/migrations/${{ steps.resolve.outputs.migration }}"
          test -f "$migration"
          test "$(git hash-object "$migration")" = "$APPROVED_MIGRATION_BLOB"
          node scripts/verify-explore-like-cost-optimization.mjs
          node <<'NODE'
          const fs=require('fs');
          const sql=fs.readFileSync('cloudflare/explore-worker/migrations/20260911_01_explore_like_deferred_batches.sql','utf8');
          const compact=sql.replace(/--.*$/gm,' ').replace(/\s+/g,' ').trim();
          for (const required of [
            'CREATE TABLE IF NOT EXISTS explore_like_batches_035',
            'CREATE INDEX IF NOT EXISTS idx_explore_like_batches_035_created',
            'CREATE TABLE IF NOT EXISTS explore_like_processor_035',
            'INSERT OR IGNORE INTO explore_like_processor_035'
          ]) if (!compact.includes(required)) throw new Error(`Missing approved 035 D1 object: ${required}`);
          if (/\b(?:DROP|ALTER|UPDATE|DELETE)\b/i.test(compact)) throw new Error('035 migration may not drop/alter/update/delete data');
          const forbidden=/(?:INSERT\s+(?:OR\s+IGNORE\s+)?INTO|CREATE\s+(?:TABLE|INDEX)\s+(?:IF\s+NOT\s+EXISTS\s+)?)(tracks|track_stats|likes|public_profiles|profile_stats|explore_derived_state|explore_derived_changes|explore_derived_tracks|explore_derived_profiles)\b/i;
          if (forbidden.test(compact)) throw new Error('035 migration may not mutate or redefine existing canonical/derived objects');
          console.log('MIGRATION_035_STATIC_SAFETY=PASS');
          NODE

      - name: Prepare shared D1 config and base read-only preflight
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .shared-d1-release
          cat > .shared-d1-release/wrangler.jsonc <<JSON
          {
            "name": "soridraw-shared-d1-maintenance",
            "main": "./placeholder.js",
            "compatibility_date": "2026-09-11",
            "d1_databases": [
              {"binding":"DB","database_name":"soridraw-explore-db","database_id":"${SHARED_D1_ID}"}
            ]
          }
          JSON
          node --input-type=module -e "import('./scripts/derived-deploy-preflight.mjs').then(m=>m.assertDerivedBaseD1Ready('.shared-d1-release/wrangler.jsonc'))"
          echo 'SHARED_D1_BASE_READONLY_PREFLIGHT=PASS'

      - name: Capture active Worker consumers and live D1 baseline
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:`Bearer ${token}`,Accept:'application/json'};
          async function get(url){const r=await fetch(url,{headers});const t=await r.text();let x;try{x=JSON.parse(t)}catch{throw new Error(`Cloudflare ${r.status}: ${t.slice(0,500)}`)}if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${t.slice(0,800)}`);return x.result??x;}
          async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(p.deployments||p||[])[0];const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];if(!v?.version_id||Number(v.percentage||0)<99.99)throw new Error(`No single active version for ${name}`);return String(v.version_id);}
          async function source(name,version){const v=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${version}?include=modules`);const mods=Array.isArray(v.modules)?v.modules:[];if(!mods.length)throw new Error(`No source modules for ${name}`);const main=mods.find(m=>m.name===v.main_module)||mods[0];return Buffer.from(main.content_base64||'','base64').toString('utf8');}
          (async()=>{
            for(const [key,name] of [['preview',process.env.PREVIEW_WORKER],['test',process.env.TEST_WORKER],['production',process.env.PRODUCTION_WORKER]]){
              const version=await active(name);
              fs.writeFileSync(`.shared-d1-release/${key}-worker-before.txt`,version);
              const src=await source(name,version);
              const derived=/EXPLORE_DERIVED_CONTRACT_032|explore_derived_state|explore_derived_changes/.test(src);
              if(derived && (!/scope\s*=\s*\?|WHERE scope=\?/.test(src) || !/seq>\?/.test(src))) throw new Error(`${name} derived cursor is not scope-local`);
              if(key==='preview' && /SORIDRAW_EXPLORE_LIKE_DEFERRED_AGGREGATE_035_20260911/.test(src)) throw new Error('PREVIEW Worker 035 is already active before shared D1 gate');
              console.log(`${key.toUpperCase()}_WORKER_COMPAT=PASS version=${version} derived032=${derived}`);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          cfg='.shared-d1-release/wrangler.jsonc'
          node node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config "$cfg" --command "SELECT type,name,sql FROM sqlite_schema WHERE name IN ('explore_like_batches_035','idx_explore_like_batches_035_created','explore_like_processor_035','explore032_derived_track_update') ORDER BY name" --json > .shared-d1-release/schema-before.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('.shared-d1-release/schema-before.json','utf8'));
          const rows=raw?.[0]?.results||[];
          const likeNames=new Set(['explore_like_batches_035','idx_explore_like_batches_035_created','explore_like_processor_035']);
          const present=rows.filter(r=>likeNames.has(String(r.name||'')));
          if(present.length!==0 && present.length!==3) throw new Error(`Partial 035 schema exists: ${present.map(r=>r.name).join(',')}`);
          const trigger=rows.find(r=>r.name==='explore032_derived_track_update')?.sql;
          if(!trigger) throw new Error('Required low-write derived trigger missing');
          const approved=fs.readFileSync('migrations/20260910_03_explore_like_write_optimization.sql','utf8').match(/CREATE TRIGGER(?: IF NOT EXISTS)?\s+explore032_derived_track_update[\s\S]*?END;/i)?.[0];
          const norm=s=>String(s||'').replace(/--.*$/gm,' ').replace(/\bIF NOT EXISTS\b/ig,' ').replace(/\s+/g,'').replace(/;+$/,'').toLowerCase();
          if(!approved || norm(trigger)!==norm(approved)) throw new Error('Live low-write trigger differs from approved 033 definition');
          fs.writeFileSync('.shared-d1-release/trigger-before.sql',trigger);
          fs.writeFileSync('.shared-d1-release/baseline-state.txt',present.length===3?'existing035':'fresh035');
          console.log(`LIKE035_SCHEMA_BASELINE=${present.length===3?'existing035':'fresh035'}`);
          NODE

          state="$(cat .shared-d1-release/baseline-state.txt)"
          if [ "$state" = existing035 ]; then
            node node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config "$cfg" --command "SELECT id,lease_until,owner FROM explore_like_processor_035 WHERE id=1; SELECT COUNT(*) AS pending FROM explore_like_batches_035" --json > .shared-d1-release/existing-state.json
            node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('.shared-d1-release/existing-state.json','utf8'));const sets=raw.flatMap(x=>Array.isArray(x?.results)?[x.results]:[]);const processor=sets.find(x=>x.some(r=>'lease_until' in r))?.[0];const pending=sets.find(x=>x.some(r=>'pending' in r))?.[0];if(Number(processor?.id)!==1)throw new Error('Existing 035 processor row invalid');if(Number(pending?.pending||0)!==0)throw new Error('Existing 035 queue is not empty before Worker activation');console.log('EXISTING_035_SCHEMA_EMPTY_QUEUE=PASS');"
          fi

      - name: Apply approved additive 035 migration with rollback guard
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          cfg='.shared-d1-release/wrangler.jsonc'
          migration="migrations/${{ steps.resolve.outputs.migration }}"
          state="$(cat .shared-d1-release/baseline-state.txt)"
          applied=0

          rollback() {
            echo 'POST_APPLY_CHECK_FAILED: removing newly-created 035 additive objects'
            cat > .shared-d1-release/rollback.sql <<'SQL'
          DROP INDEX IF EXISTS idx_explore_like_batches_035_created;
          DROP TABLE IF EXISTS explore_like_batches_035;
          DROP TABLE IF EXISTS explore_like_processor_035;
          SQL
            node node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config "$cfg" --file .shared-d1-release/rollback.sql --yes || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ] && [ "$applied" = 1 ]; then rollback; fi; exit "$status"' EXIT

          if [ "$state" = fresh035 ]; then
            node node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config "$cfg" --file "$migration" --yes
            applied=1
          else
            echo 'SHARED_D1_035_ALREADY_PRESENT=PASS'
          fi

          node --input-type=module -e "import('./scripts/derived-deploy-preflight.mjs').then(m=>m.assertDerivedD1Ready('.shared-d1-release/wrangler.jsonc'))"
          node node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --config "$cfg" --command "SELECT type,name,sql FROM sqlite_schema WHERE name IN ('explore_like_batches_035','idx_explore_like_batches_035_created','explore_like_processor_035','explore032_derived_track_update') ORDER BY name; SELECT id,lease_until,owner FROM explore_like_processor_035 WHERE id=1; SELECT COUNT(*) AS pending FROM explore_like_batches_035" --json > .shared-d1-release/postflight.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('.shared-d1-release/postflight.json','utf8'));
          const all=raw.flatMap(x=>x?.results||[]);
          for(const [type,name] of [['table','explore_like_batches_035'],['index','idx_explore_like_batches_035_created'],['table','explore_like_processor_035']]) {
            if(!all.some(r=>r.type===type&&r.name===name)) throw new Error(`035 postflight missing ${type}:${name}`);
          }
          const processor=all.find(r=>'lease_until' in r && Number(r.id)===1);
          if(!processor) throw new Error('035 processor row missing');
          const pending=all.find(r=>'pending' in r);
          if(Number(pending?.pending||0)!==0) throw new Error('035 queue must be empty before PREVIEW Worker activation');
          const trigger=all.find(r=>r.name==='explore032_derived_track_update')?.sql;
          const before=fs.readFileSync('.shared-d1-release/trigger-before.sql','utf8');
          const norm=s=>String(s||'').replace(/\s+/g,'').replace(/;+$/,'').toLowerCase();
          if(!trigger||norm(trigger)!==norm(before)) throw new Error('Existing low-write trigger changed during additive 035 migration');
          console.log('SHARED_D1_035_POSTFLIGHT=PASS');
          NODE

          for pair in \
            "preview|${PREVIEW_BASE}|https://preview.soridraw.com" \
            "test|${TEST_BASE}|https://test.soridraw.com" \
            "production|${PRODUCTION_BASE}|https://soridraw.com"; do
            name="${pair%%|*}"; rest="${pair#*|}"; base="${rest%%|*}"; origin="${rest#*|}"
            code="$(curl -sS -o "$RUNNER_TEMP/${name}-feed.json" -w '%{http_code}' -H "Origin: ${origin}" "${base}/v1/feed?sort=latest&limit=40")"
            test "$code" = 200
            echo "${name^^}_FEED_POST_D1_CHANGE=PASS"
          done

          for n in 1 2; do
            code="$(curl -sS -D "$RUNNER_TEMP/rev-${n}.head" -o "$RUNNER_TEMP/rev-${n}.json" -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "${PREVIEW_BASE}/v1/feed-revision?sort=latest")"
            test "$code" = 200
            [ "$n" = 1 ] && sleep 1 || true
          done
          read2="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r","");print $2}' "$RUNNER_TEMP/rev-2.head" | tail -1)"
          write2="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r","");print $2}' "$RUNNER_TEMP/rev-2.head" | tail -1)"
          test "$read2" = 0
          test "$write2" = 0
          echo "PREVIEW_WARM_REVISION_AFTER_D1=R${read2}/W${write2} PASS"

          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:`Bearer ${token}`,Accept:'application/json'};
          async function get(url){const r=await fetch(url,{headers});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,600));return x.result??x;}
          async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(p.deployments||p||[])[0];const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];return String(v?.version_id||'');}
          (async()=>{
            for(const [key,name] of [['preview',process.env.PREVIEW_WORKER],['test',process.env.TEST_WORKER],['production',process.env.PRODUCTION_WORKER]]){
              const now=await active(name);
              const before=fs.readFileSync(`.shared-d1-release/${key}-worker-before.txt`,'utf8').trim();
              if(now!==before)throw new Error(`${key} Worker changed during D1-only release`);
            }
            console.log('ALL_WORKER_VERSIONS_UNCHANGED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          echo 'MAIN_PRODUCTION_REFS_UNCHANGED=PASS'
          trap - EXIT
          echo 'SHARED_D1_035_RELEASE=PASS'
