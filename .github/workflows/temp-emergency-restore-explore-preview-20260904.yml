name: SORIDRAW Emergency Restore Explore PREVIEW 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-emergency-restore-explore-preview-20260904.yml']
permissions:
  contents: read
concurrency:
  group: soridraw-explore-preview-emergency-restore-20260904
  cancel-in-progress: false
jobs:
  restore:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
      BASELINE_VERSION: 5ca4a6c9-48b2-4554-af1b-1603425e514e
      D1_NAME: soridraw-explore-preview
      D1_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      R2_BUCKET: soridraw-profile-media-preview
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Restore exact known-good PREVIEW Worker source
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          rm -rf .remote-worker && mkdir -p .remote-worker
          node <<'NODE'
          const fs=require('fs'),path=require('path');const A=process.env.ACCOUNT,W=process.env.WORKER,V=process.env.BASELINE_VERSION,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${V}?include=modules`),mods=ver.modules||[];if(!mods.length)throw new Error('baseline modules missing');for(const m of mods){const p=path.join('.remote-worker',m.name||'worker.js');fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,Buffer.from(m.content_base64,'base64'))}const main=ver.main_module||mods[0].name||'worker.js',s=await g(`${base}/settings`),bs=s.bindings||[],d1=bs.find(b=>b.type==='d1'&&b.name==='DB'),r2=bs.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA'),unknown=bs.filter(b=>!['plain_text','secret_text','d1','r2_bucket'].includes(b.type));if(unknown.length)throw new Error('unsupported bindings');if(!d1||(d1.id||d1.database_id)!==process.env.D1_ID)throw new Error('D1 mismatch');if(!r2||r2.bucket_name!==process.env.R2_BUCKET)throw new Error('R2 mismatch');const cfg={name:W,main:`./${main}`,compatibility_date:String(s.compatibility_date||'2026-08-28').slice(0,10),keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.D1_NAME,database_id:process.env.D1_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.R2_BUCKET}]};if(s.compatibility_flags?.length)cfg.compatibility_flags=s.compatibility_flags;fs.writeFileSync('.remote-worker/wrangler.jsonc',JSON.stringify(cfg,null,2)+'\n');const src=fs.readFileSync('.remote-worker/worker.js','utf8');if(src.includes('/v1/internal/bootstrap-music-note-publication-bundles'))throw new Error('known-good baseline unexpectedly contains bootstrap route');console.log('BASELINE_SOURCE_READY='+V)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check .remote-worker/worker.js
          npx --yes wrangler@4 deploy --cwd .remote-worker --keep-vars
      - name: Verify bootstrap route is gone and baseline behavior restored
        shell: bash
        run: |
          set -euo pipefail
          boot="$(curl -sS -o "$RUNNER_TEMP/boot.json" -w '%{http_code}' -X POST 'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/internal/bootstrap-music-note-publication-bundles')"
          feed="$(curl -sS -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' 'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1')"
          echo "BOOTSTRAP_HTTP=$boot FEED_HTTP=$feed"
          test "$boot" = 404
          test "$feed" = 200
          echo 'EXPLORE_PREVIEW_BASELINE_RESTORED=true'
