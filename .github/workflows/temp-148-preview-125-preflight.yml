name: TEMP 148 App125 Worker071 Preflight
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-148-preview-125-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Same offline verification set as official Worker preflight
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            scripts/verify-111-explore-profile-negative-cache.mjs \
            scripts/verify-explore-derived-cache.mjs \
            scripts/verify-082-publication-batch.mjs \
            scripts/verify-083-publication-pk-read.mjs \
            scripts/verify-084-publication-write-returning.mjs \
            scripts/verify-085-liked-profile.mjs \
            scripts/verify-110-explore-liked-public-count.mjs \
            scripts/verify-109-mobile-feed-refresh-zero.mjs \
            scripts/verify-108-explore-feed-cache-recovery.mjs \
            scripts/verify-107-explore-direct-count-zero-read.mjs \
            scripts/verify-105-explore-like-1min.mjs \
            scripts/verify-102-explore-public-like-parity.mjs \
            scripts/verify-103-explore-like-event-batch.mjs \
            scripts/verify-explore-deploy-preflight.mjs \
            scripts/verify-123-shared-like-cache-repair.mjs \
            scripts/verify-124-mobile-shared-cache-repair.mjs \
            scripts/verify-125-like-preservation.mjs \
            scripts/verify-070-shared-feed-guard.mjs; do
            echo "VERIFY_FILE=$f"
            if [ "$f" = scripts/verify-070-shared-feed-guard.mjs ]; then
              SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node "$f"
            else
              node "$f"
            fi
          done
          echo 'ALL_OFFICIAL_RELEASE_PRECHECKS=PASS'
          echo 'DEPLOY=0 D1_WRITE=0 R2_WRITE=0'
