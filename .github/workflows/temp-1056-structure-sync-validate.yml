name: Temp 1056 Music Note Structure Sync Validate

on:
  push:
    branches: [preview-structure-sync-1056]
    paths: ['.github/workflows/temp-1056-structure-sync-validate.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: '50854d13fbc00e2e8af8c06b8bc1e621b91cb470'
      MAIN_SHA: '49c799cbb46d137539f74a48c261f7256762336f'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-structure-sync-1056
          fetch-depth: 40

      - name: Guard rollback baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          preview_sha="$(git ls-remote origin refs/heads/preview | awk '{print $1}')"
          test "$preview_sha" = "$BASE_SHA"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$MAIN_SHA"
          git diff --exit-code "$BASE_SHA"..HEAD -- src functions firestore.rules package.json package-lock.json firebase.json firebase.hosting-preview.json
          echo 'ROLLBACK_BASELINE_GUARD=PASS'

      - name: Apply exact 1056 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/temp_apply_1056.py
          python3 .deploy/temp_refine_1056.py
          echo 'STRUCTURE_SYNC_PATCH=APPLIED'

      - name: Static safety guards
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="firestore.rules functions/package.json functions/scripts/test-music-note-structure-sync.cjs functions/src/index.ts functions/src/musicNoteStructureSync.ts src/pages/FavoritesPage.tsx "
          test "$changed" = "$expected"
          ! grep -Fq "onSnapshot(" src/pages/FavoritesPage.tsx
          grep -Fq "getDocFromServer(doc(db, 'user_structures', uid))" src/pages/FavoritesPage.tsx
          grep -Fq "syncVersions?.musicNoteStructure" src/pages/FavoritesPage.tsx
          grep -Fq "musicNoteStructureVersion: structureVersion" src/pages/FavoritesPage.tsx
          grep -Fq "syncMusicNoteStructureVersion" functions/src/index.ts
          grep -Fq "musicNoteStructure" firestore.rules
          grep -Fq "publishMusicNoteToExplore" src/pages/FavoritesPage.tsx
          grep -Fq "createMusicNoteShareDocument" src/pages/FavoritesPage.tsx
          grep -Fq "hydrateCatalogFavorite(song).then((hydrated) => applyKeywordsToNext(hydrated))" src/pages/FavoritesPage.tsx
          echo 'STATIC_SAFETY_GUARDS=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: App TypeScript and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
          test -s dist/index.html
          echo 'APP_TYPESCRIPT_BUILD=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Functions build and regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:music-note-structure-sync
          npm --prefix functions run test:library-bundle
          grep -Fq "syncMusicNoteStructureVersion" functions/src/securedIndex.ts
          echo 'FUNCTIONS_STRUCTURE_AND_LIBRARY_TESTS=PASS'

      - name: Firestore rules local compile
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-soridraw --config firebase.json "echo FIRESTORE_RULES_EMULATOR=PASS"

      - name: Commit validated work tree and remove temp files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git rm .deploy/temp_apply_1056.py .deploy/temp_refine_1056.py .github/workflows/temp-1056-structure-sync-validate.yml
          git add firestore.rules functions/package.json functions/scripts/test-music-note-structure-sync.cjs functions/src/index.ts functions/src/musicNoteStructureSync.ts src/pages/FavoritesPage.tsx
          git commit -m 'feat(work): signal Music Note structure changes without live listener'
          git push origin HEAD:preview-structure-sync-1056
          echo "VALIDATED_WORK_COMMIT=$(git rev-parse HEAD)"
