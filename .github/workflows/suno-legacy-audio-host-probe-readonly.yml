name: SORIDRAW Legacy Audio Host Read-only Probe

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/suno-legacy-audio-host-probe-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate read-only probe
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Probe one legacy completed track without printing identifiers or URLs
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');
          admin.initializeApp({ projectId: 'soridraw-app-866a5' });
          const db = admin.firestore();
          const AUDIO_KEYS = new Set([
            'audioUrl','audio_url','streamAudioUrl','stream_audio_url','sourceAudioUrl','source_audio_url',
            'sourceStreamAudioUrl','source_stream_audio_url','musicUrl','music_url','downloadUrl','download_url',
            'playUrl','play_url','mediaUrl','media_url','mp3Url','mp3_url','url'
          ]);
          const hasText = (v) => typeof v === 'string' && v.trim().length > 0;
          const toMs = (v) => {
            if (!v) return 0;
            if (typeof v.toMillis === 'function') return v.toMillis();
            if (typeof v.seconds === 'number') return v.seconds * 1000;
            if (v instanceof Date) return v.getTime();
            if (typeof v === 'number' && Number.isFinite(v)) return v;
            return 0;
          };
          const collect = (root) => {
            const list = [];
            const seen = new Set();
            const walk = (value, path = '', depth = 0) => {
              if (!value || depth > 8) return;
              if (Array.isArray(value)) { value.forEach((child) => walk(child, path ? `${path}[]` : '[]', depth + 1)); return; }
              if (typeof value !== 'object') return;
              for (const [key, child] of Object.entries(value)) {
                const next = path ? `${path}.${key}` : key;
                if (AUDIO_KEYS.has(key) && hasText(child) && /^https?:\/\//i.test(child.trim())) {
                  const url = child.trim();
                  if (!seen.has(url)) {
                    seen.add(url);
                    let host = 'invalid';
                    try { host = new URL(url).host; } catch {}
                    list.push({ path: next, host, url });
                  }
                }
                if (child && typeof child === 'object') walk(child, next, depth + 1);
              }
            };
            walk(root);
            return list;
          };
          const probe = async (candidate) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 12000);
            const out = { fieldPath: candidate.path, host: candidate.host, status: null, finalHost: null, contentType: null, contentRange: null, bytes: 0, error: null };
            try {
              const res = await fetch(candidate.url, { method: 'GET', redirect: 'follow', signal: controller.signal, headers: { Range: 'bytes=0-63', 'User-Agent': 'SORIDRAW-legacy-readonly-probe/1.0' } });
              out.status = res.status;
              out.contentType = res.headers.get('content-type');
              out.contentRange = res.headers.get('content-range');
              try { out.finalHost = new URL(res.url).host; } catch {}
              if (res.body?.getReader) {
                const reader = res.body.getReader();
                const first = await reader.read();
                if (!first.done && first.value) out.bytes = first.value.byteLength || first.value.length || 0;
                try { await reader.cancel(); } catch {}
              }
            } catch (error) {
              out.error = error?.name || 'request_error';
            } finally { clearTimeout(timer); }
            return out;
          };

          (async () => {
            const snapshot = await db.collectionGroup('tracks').get();
            const cutoff = Date.now() - 90 * 86400000;
            let selected = null;
            for (const doc of snapshot.docs) {
              if (!String(doc.ref.path || '').startsWith('suno_tracks/')) continue;
              const data = doc.data() || {};
              if (String(data.status || '').trim().toLowerCase() !== 'completed') continue;
              const activity = Math.max(toMs(data.createdAt), toMs(data.updatedAt));
              if (!activity || activity >= cutoff) continue;
              const candidates = collect(data);
              if (!candidates.length) continue;
              if (!selected || activity < selected.activity) selected = { activity, candidates };
            }
            if (!selected) throw new Error('No completed >=90d legacy track with audio candidates found');
            const results = [];
            for (const candidate of selected.candidates.slice(0, 16)) results.push(await probe(candidate));
            console.log(JSON.stringify({
              tool: 'legacy-audio-host-readonly-probe',
              projectId: 'soridraw-app-866a5',
              safety: { firestoreWrites: 0, firestoreDeletes: 0, identifiersPrinted: false, audioUrlsPrinted: false, maxProbeBytesRequested: 64 },
              selectedAge: 'gte90d',
              candidateCount: selected.candidates.length,
              results
            }, null, 2));
          })().catch((error) => { console.error('legacy host probe failed:', error?.message || String(error)); process.exit(1); });
          NODE
