name: TEMP Validate Worker 055 Like W1 Intake

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-055-like-intake-w1.yml'
      - 'cloudflare/explore-worker/patches/055-explore-like-intake-w1-hotpath.mjs'
      - 'scripts/verify-055-like-intake-w1.mjs'
      - 'cloudflare/explore-worker/release-patches.json'

permissions:
  contents: write

concurrency:
  group: temp-055-like-intake-w1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply 055 to canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/explore-worker/patches/055-explore-like-intake-w1-hotpath.mjs
          tmp="$(mktemp -d)"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$tmp/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$tmp" node cloudflare/explore-worker/patches/055-explore-like-intake-w1-hotpath.mjs
          cp "$tmp/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js

      - name: Verify 055 cost and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-055-like-intake-w1.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-054-like-edge-rate-limit.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
          node scripts/verify-087-liked-card-consistency.mjs
          node scripts/verify-088-same-session-liked-heart.mjs
          node scripts/verify-089-like-cross-device-consistency.mjs
          node scripts/verify-090-liked-count-live-sync.mjs
          node scripts/verify-091-like-count-state-machine.mjs
          node scripts/verify-081-like-page-exit-batch.mjs
          node scripts/verify-084-publication-write-returning.mjs

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and Build
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build

      - name: Live D1 read-only W1 prerequisite and Worker dry-run
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "SELECT type,name,sql FROM sqlite_schema WHERE name IN ('explore_like_batches_069','explore_like_user_queue_075','idx_explore_like_user_queue_075_updated') ORDER BY name" --json > "$RUNNER_TEMP/like-w1-schema.json"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/like-w1-schema.json','utf8'));
          const rows=r.flatMap(x=>x.results||[]);
          const by=new Map(rows.map(x=>[String(x.name),x]));
          if(!by.has('explore_like_batches_069')) throw new Error('live 069 W1 queue missing');
          const sql=String(by.get('explore_like_batches_069').sql||'');
          if(!/WITHOUT ROWID/i.test(sql)) throw new Error('live 069 queue is not WITHOUT ROWID');
          if(!by.has('explore_like_user_queue_075')) throw new Error('legacy 075 queue missing');
          console.log('LIVE_069_W1_SCHEMA=PASS');
          console.log('LEGACY_075_DRAIN_SCHEMA=PASS');
          NODE
          (cd canonical && node ../node_modules/wrangler/bin/wrangler.js deploy --config wrangler.preview.jsonc --dry-run)

      - name: Verify generated boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(cloudflare/explore-worker/canonical/preview-worker\.js|cloudflare/explore-worker/canonical/source-sha256\.txt)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected generated changes:'
            echo "$bad"
            exit 1
          fi
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "WORKER_055_SHA256=$actual"
          echo 'NO_D1_MIGRATION=true'
          echo 'NO_FIREBASE_CHANGE=true'
          echo 'NO_UI_CHANGE=true'

      - name: Commit validated 055 canonical source
        shell: bash
        run: |
          set -euo pipefail
          files=(cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt)
          if git diff --quiet -- "${files[@]}"; then
            echo '055 canonical already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'fix(worker): use W1 queue for new like intake 055'
          git push origin HEAD:preview
