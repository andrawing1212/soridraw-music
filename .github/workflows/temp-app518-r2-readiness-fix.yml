name: APP518 QA R2 readiness and JWT error category source check
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/media-worker/src/app518QaR2Lifecycle518.js'
      - 'qa/app518/live/r2-run518.mjs'
      - 'qa/app518/live/verify-r2-lifecycle518.mjs'
      - '.github/workflows/temp-app518-r2-readiness-fix.yml'
permissions:
  contents: read
jobs:
  app518_r2_gate_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify bounded mock R2 lifecycle and Worker entry syntax
        run: |
          set -euo pipefail
          node qa/app518/live/verify-r2-lifecycle518.mjs
          node --check qa/app518/live/r2-run518.mjs
          node --check cloudflare/media-worker/src/app518QaR2Lifecycle518.js
