name: SORIDRAW 048 Live Explore Runtime Audit
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/preview-048-live-explore-runtime-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
    steps:
      - name: Audit active Explore Workers read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN;
          const targets=[
            ['PREVIEW',process.env.PREVIEW_WORKER],
            ['TEST',process.env.TEST_WORKER],
            ['PRODUCTION',process.env.PRODUCTION_WORKER],
          ];
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status+' '+JSON.stringify(x).slice(0,500));return x.result||x;}
          (async()=>{
            for(const [stage,N] of targets){
              const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;
              const ds=await g(base+'/deployments');
              const d=(ds.deployments||ds||[])[0];
              const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
              if(!active?.version_id||Number(active.percentage||0)<99.99) throw Error(stage+' no single active Worker');
              const v=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${active.version_id}?include=modules`);
              const mods=v.modules||[]; const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];
              const s=Buffer.from(m.content_base64,'base64').toString('utf8');
              console.log(`${stage}_ACTIVE_VERSION=${active.version_id}`);
              console.log(`${stage}_SOURCE_SHA256=${crypto.createHash('sha256').update(s).digest('hex')}`);
              for(const q of [
                'readFeedR2Revision077',
                '/v1/feed-revision',
                'explore_shared_revision',
                'explore_derived_tracks',
                'syncExploreFeedR2Publication043',
                'patchExploreProfileR2Publication043',
                'refreshSourceMedia',
                'suno_url_primary',
                'suno_url_secondary',
                'SORIDRAW_R2_ORDERED_CATALOG_PHASE_A_066_20260919',
                'isExploreR2CatalogEnabled066',
                'isExploreR2CatalogReadEnabled066',
                'isExploreR2FirstPublisherEnabled066',
                'handleCatalogFeed066',
                'handleCatalogProfileTracks066',
                'handleCatalogGenre066',
                'handleCatalogSearch066',
                'firstPublisherBootstrap066',
              ]){
                const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
                console.log(`${stage}_MARKER_${q.replace(/[^a-z0-9]+/gi,'_')}=${(s.match(new RegExp(escaped,'g'))||[]).length}`);
              }
              const settings=await g(base+'/settings');
              const bindings=Array.isArray(settings.bindings)?settings.bindings:[];
              const db=bindings.find(b=>b.type==='d1'&&b.name==='DB');
              const media=bindings.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA');
              const catalogFlags=Object.fromEntries(bindings
                .filter(b=>b.type==='plain_text' && /^(?:SORIDRAW_R2_(?:CATALOG|FIRST_PUBLISHER|HYBRID_READ)_V1|SORIDRAW_PUBLICATION_R2_ONLY_READ_V1)$/.test(String(b.name||'')))
                .map(b=>[String(b.name),String(b.text||b.value||'')]));
              const dbId=String(db?.id||db?.database_id||db?.uuid||'');
              const mediaName=String(media?.bucket_name||media?.bucket||media?.name||'');
              console.log(`${stage}_DB_ID=${dbId}`);
              console.log(`${stage}_PROFILE_MEDIA=${mediaName}`);
              console.log(`${stage}_R2_CATALOG_FLAGS=${JSON.stringify(catalogFlags)}`);
              if(dbId!==process.env.SHARED_D1_ID) throw Error(stage+' DB is not shared canonical D1');
              if(mediaName!=='soridraw-profile-media') throw Error(stage+' PROFILE_MEDIA is not shared canonical R2');
              for(const flag of ['SORIDRAW_R2_CATALOG_V1','SORIDRAW_R2_HYBRID_READ_V1','SORIDRAW_PUBLICATION_R2_ONLY_READ_V1']){
                if(String(catalogFlags[flag]||'')!=='1') throw Error(stage+' live cutover flag missing: '+flag);
              }
              for(const marker of ['SORIDRAW_R2_HYBRID_READ_336_20261004','SORIDRAW_PUBLICATION_R2_ONLY_READ_CUTOVER_358_20261005']){
                if(!s.includes(marker)) throw Error(stage+' live Worker marker missing: '+marker);
              }
              console.log(`${stage}_APP372_R2_CUTOVER_READINESS=PASS`);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Audit shared D1 track fanout read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,D=process.env.SHARED_D1_ID;
          const sql=`
            SELECT type,name,tbl_name,sql
            FROM sqlite_schema
            WHERE (type='trigger' AND (tbl_name='tracks' OR sql LIKE '%explore_shared_revision%'))
               OR (type='index' AND tbl_name='tracks')
            ORDER BY type,name
          `;
          (async()=>{
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${A}/d1/database/${D}/query`,{
              method:'POST',
              headers:{Authorization:`Bearer ${T}`,Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify({sql})
            });
            const x=await r.json();
            if(!r.ok||x.success===false) throw Error('D1 '+r.status+' '+JSON.stringify(x).slice(0,800));
            const rows=(x.result||[]).flatMap(v=>v?.results||[]);
            for(const row of rows){
              const sqlText=String(row.sql||'').replace(/\s+/g,' ').trim();
              console.log(`D1_${String(row.type||'').toUpperCase()} ${row.name} :: ${sqlText}`);
            }
            console.log('D1_READONLY_SCHEMA_AUDIT=PASS rows='+rows.length);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE


      - name: Audit first-publication fanout layers read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,D=process.env.SHARED_D1_ID;
          const sql=`
            SELECT type,name,tbl_name,sql
            FROM sqlite_schema
            WHERE tbl_name IN (
              'tracks',
              'explore_derived_tracks',
              'explore_derived_changes',
              'explore_derived_state',
              'explore_derived_profiles',
              'explore_shared_revision'
            )
              AND type IN ('index','trigger','table')
            ORDER BY tbl_name,type,name;
            PRAGMA index_list('tracks');
            PRAGMA index_list('explore_derived_tracks');
            PRAGMA index_list('explore_derived_changes');
            PRAGMA index_list('explore_derived_profiles');
          `;
          (async()=>{
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${A}/d1/database/${D}/query`,{
              method:'POST',
              headers:{Authorization:`Bearer ${T}`,Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify({sql})
            });
            const x=await r.json();
            if(!r.ok||x.success===false) throw Error('D1 '+r.status+' '+JSON.stringify(x).slice(0,800));
            const sets=(x.result||[]).map(v=>v?.results||[]);
            const schema=sets[0]||[];
            const groups=new Map();
            for(const row of schema){
              const key=String(row.tbl_name||'');
              if(!groups.has(key)) groups.set(key,[]);
              groups.get(key).push({
                type:String(row.type||''),
                name:String(row.name||''),
                sql:String(row.sql||'').replace(/\s+/g,' ').trim(),
              });
            }
            for(const [table,rows] of groups) console.log('FANOUT_SCHEMA_'+table+'='+JSON.stringify(rows));
            console.log('FANOUT_INDEX_LIST_tracks='+JSON.stringify(sets[1]||[]));
            console.log('FANOUT_INDEX_LIST_explore_derived_tracks='+JSON.stringify(sets[2]||[]));
            console.log('FANOUT_INDEX_LIST_explore_derived_changes='+JSON.stringify(sets[3]||[]));
            console.log('FANOUT_INDEX_LIST_explore_derived_profiles='+JSON.stringify(sets[4]||[]));
            const byName=new Map(schema.map(row=>[String(row.name||''),String(row.sql||'').replace(/\s+/g,' ').trim()]));
            for(const name of [
              'idx_tracks_latest_order',
              'idx_tracks_owner_latest',
              'idx_tracks_owner_source',
              'idx_tracks_primary_genre_latest',
              'explore032_track_insert',
              'explore032_track_update',
              'soridraw_shared_rev_tracks_ai_051',
              'soridraw_shared_rev_tracks_au_051',
            ]){
              const ddl=byName.get(name);
              if(!ddl) throw Error('APP372 live pre-cutover object missing: '+name);
              if(ddl.includes('__SORIDRAW_PUBLICATION_W2_CUTOVER_MS__') || /source_type\s*<>\s*'music_note'\s+OR\s+created_at\s*</i.test(ddl)){
                throw Error('APP372 cutover already applied unexpectedly: '+name);
              }
            }
            console.log('APP372_LIVE_PRECUTOVER_SCHEMA=PASS');
            console.log('APP372_SHARED_D1_CUTOVER_APPLIED=false');
            console.log('FIRST_PUBLICATION_FANOUT_READONLY=PASS');
            console.log('REMOTE_D1_WRITES=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
