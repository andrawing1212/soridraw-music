name: SORIDRAW Maintenance M-010 Ledger Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m010-ledger-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0
      - name: Record M-010 in maintenance ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/SORIDRAW_MAINTENANCE_BACKLOG.md')
          s=p.read_text(encoding='utf-8')
          anchor='| M-009 | Vercel Preview `npm run build` fails in historical prebuild source-patch chain | HIGH / BLOCKER FOR 2-A4c | Vercel deployments for commits `c695776...` and `e505ce7...` both failed with `normal update updatedAtMs anchor mismatch: 0`. GitHub `npx vite build` passes because it bypasses npm lifecycle `prebuild`; therefore final Preview HEAD is not yet proven deployable through the real Vercel path. | **Before 2-A4c Preview activation.** Audit the exact stale patch owner, make only the minimum source/build-pipeline correction, require full `npm run build`, contracts and exact Vercel READY verification. No Firebase change in this fix. | **OPEN / HIGH BLOCKER** |'
          row='| M-010 | Vercel project build runtime must migrate from repository-forced Node `20.x` to Node `24.x` | HIGH / PRE-GATE | Vercel warns that `package.json` Node 20 overrides the project Node24 setting and that deployments created on/after 2026-10-01 will fail. This is separate from the immediate M-009 prebuild-anchor failure. | **Before Step 5/main promotion and always before 2026-10-01.** Test Node24 install, TypeScript, contracts, real `npm run build`, Vercel READY and Functions tooling separation before changing the project runtime contract. | **OPEN / STEP-5 PRE-GATE / DEADLINE 2026-10-01** |'
          if s.count(anchor)!=1: raise SystemExit('M-009 table anchor mismatch')
          s=s.replace(anchor,anchor+'\n'+row,1)
          evidence='Post-Gate-A Vercel inspection also reported that repository `package.json` forces Node `20.x`, overriding the Vercel Project Setting `24.x`, and warned that deployments created on/after **2026-10-01** will fail unless the project runtime is migrated. Full detail: `docs/SORIDRAW_MAINTENANCE_M010_VERCEL_NODE24_MIGRATION.md`.'
          anchor2='Post-Gate-A Vercel inspection found two Preview deployments failing before Vite with the same historical prebuild patch error: `normal update updatedAtMs anchor mismatch: 0`. This failure predates the Gate A dependency lockfile change. Full detail: `docs/SORIDRAW_MAINTENANCE_M009_VERCEL_PREBUILD_BLOCKER.md`.'
          if s.count(anchor2)!=1: raise SystemExit('M-009 evidence anchor mismatch')
          s=s.replace(anchor2,anchor2+'\n\n### M-010\n\n'+evidence,1)
          old='   - M-002 review/clear remaining low/moderate dependency debt or explicitly justify bounded deferral,\n   - M-007 verify RTDB/free-tier observability,\n   - M-004 perform bundle optimization if Step 4 performance requires it.'
          new='   - M-002 review/clear remaining low/moderate dependency debt or explicitly justify bounded deferral,\n   - M-007 verify RTDB/free-tier observability,\n   - M-010 complete tested app-build runtime migration to Node24 before main promotion / 2026-10-01,\n   - M-004 perform bundle optimization if Step 4 performance requires it.'
          if s.count(old)!=1: raise SystemExit('Gate C anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_MAINTENANCE_BACKLOG.md
          git commit -m 'docs: add Vercel Node24 deadline M-010 to maintenance ledger'
          git push origin HEAD:preview
          git pull --rebase origin preview
          git rm .github/workflows/maintenance-m010-ledger-finalize.yml
          git commit -m 'chore: remove M-010 ledger finalizer'
          git push origin HEAD:preview
