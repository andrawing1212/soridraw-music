name: SORIDRAW PREVIEW Explore Derived Release

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/preview-explore-derived-release.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact audited preview commit to deploy (blank = pinned audited target)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: soridraw-preview-explore-derived-release
  cancel-in-progress: false

jobs:
  release-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AUDITED_TARGET_SHA: 686276700121ce8d5b2844cb608666c5b991c3be
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
      SHARED_D1_NAME: soridraw-explore-db
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com

    steps:
      - name: Resolve exact audited target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            target="${AUDITED_TARGET_SHA}"
          else
            target='${{ inputs.target_sha }}'
            if [ -z "$target" ]; then target="${AUDITED_TARGET_SHA}"; fi
          fi
          test "$target" = "${AUDITED_TARGET_SHA}"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$target"

      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Lock target and snapshot protected refs/sites
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${AUDITED_TARGET_SHA}"
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "$actual" origin/preview
          test "$(node -p "require('./public/app-version.json').version")" = '052'
          printf '%s\n' "$(git rev-parse origin/main)" > "$RUNNER_TEMP/main-before.sha"
          printf '%s\n' "$(git rev-parse origin/production)" > "$RUNNER_TEMP/production-branch-before.sha"
          for host in test.soridraw.com soridraw.com; do
            curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://$host/" -o "$RUNNER_TEMP/${host}.before.html"
            sha256sum "$RUNNER_TEMP/${host}.before.html" | awk '{print $1}' > "$RUNNER_TEMP/${host}.before.sha"
          done
          echo "AUDITED_TARGET=$actual"
          echo 'PROTECTED_BASELINES_SNAPSHOTTED=PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Validate app source and build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npx tsc --noEmit
          node scripts/verify-033-explore-feed-revision.mjs
          node scripts/verify-045-explore-active-revalidation.mjs
          node scripts/verify-048-explore-public-profile-parity.mjs
          node scripts/verify-049-explore-feed-integrity.mjs
          node scripts/verify-051-explore-shared-canonical-data.mjs
          node scripts/verify-explore-cache-mutations.mjs
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/preview-index.sha"
          git diff --exit-code -- src public cloudflare scripts package.json
          echo 'APP_TYPESCRIPT_BUILD_VERIFIERS=PASS'

      - name: Set up Node.js 22 for Worker
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker dependencies
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Prepare exact active PREVIEW Worker and preserve bindings
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          rm -rf .remote-worker
          mkdir -p .remote-worker
          node <<'NODE'
          const fs = require('fs');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const preview = process.env.PREVIEW_WORKER;
          const sharedId = process.env.SHARED_D1_ID;
          const auth = { Authorization: `Bearer ${token}`, Accept: 'application/json' };
          async function get(url) {
            const r = await fetch(url, { headers: auth });
            const text = await r.text();
            let x; try { x = JSON.parse(text); } catch { throw new Error(`Cloudflare ${r.status}: ${text.slice(0,800)}`); }
            if (!r.ok || x.success === false) throw new Error(`Cloudflare ${r.status}: ${text.slice(0,1200)}`);
            return x.result ?? x;
          }
          async function activeVersion(name) {
            const base = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
            const payload = await get(`${base}/deployments`);
            const deployments = payload.deployments || payload || [];
            const d = deployments[0];
            const v = [...(d?.versions || [])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];
            if (!v?.version_id || Number(v.percentage||0) < 99.99) throw new Error(`No single active 100% Worker version: ${name}`);
            return String(v.version_id);
          }
          (async()=>{
            const prodBefore = await activeVersion(process.env.PRODUCTION_WORKER);
            const testBefore = await activeVersion(process.env.TEST_WORKER);
            const previewBefore = await activeVersion(preview);
            fs.writeFileSync('.remote-worker/prod-before-version.txt', prodBefore);
            fs.writeFileSync('.remote-worker/test-before-version.txt', testBefore);
            fs.writeFileSync('.remote-worker/preview-before-version.txt', previewBefore);

            const version = await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${preview}/versions/${previewBefore}?include=modules`);
            const modules = Array.isArray(version.modules) ? version.modules : [];
            if (modules.length !== 1) throw new Error(`PREVIEW Worker must be a single module for safe patching; got ${modules.length}`);
            const mainName = version.main_module || modules[0]?.name;
            const main = modules.find(m=>m.name===mainName) || modules[0];
            if (!main?.content_base64) throw new Error('Active PREVIEW Worker source missing');
            const source = Buffer.from(main.content_base64, 'base64').toString('utf8');
            if (source.length < 5000) throw new Error('Active PREVIEW Worker source unexpectedly small');
            for (const required of ['handleFeedWithEdgeCache','handlePublicProfileFirstViewWithEdgeCache','exploreCacheBucket031']) {
              if (!source.includes(required)) throw new Error(`Active PREVIEW prerequisite missing: ${required}`);
            }
            fs.writeFileSync('.remote-worker/original.js', source);
            fs.writeFileSync('.remote-worker/worker.js', source);

            const base = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${preview}`;
            const settings = await get(`${base}/settings`);
            const bindings = Array.isArray(settings.bindings) ? settings.bindings : [];
            const allowed = new Set(['d1','r2_bucket','plain_text','secret_text']);
            const unsupported = bindings.filter(b=>!allowed.has(String(b.type||'')));
            if (unsupported.length) throw new Error(`Unsupported PREVIEW bindings: ${unsupported.map(b=>`${b.name}:${b.type}`).join(',')}`);
            const dbBinding = bindings.find(b=>b.name==='DB' && b.type==='d1');
            const dbId = String(dbBinding?.id || dbBinding?.database_id || dbBinding?.uuid || '');
            if (dbId !== sharedId) throw new Error(`PREVIEW DB is not approved shared canonical D1: ${dbId || 'missing'}`);
            for (const required of [['RATE_DB','d1'],['PROFILE_MEDIA','r2_bucket'],['EXPLORE_CACHE','r2_bucket']]) {
              const b = bindings.find(x=>x.name===required[0] && x.type===required[1]);
              if (!b) throw new Error(`Required PREVIEW binding missing: ${required[0]}:${required[1]}`);
            }

            const d1 = [];
            for (const b of bindings.filter(x=>x.type==='d1')) {
              const id = String(b.id || b.database_id || b.uuid || '');
              if (!id) throw new Error(`D1 binding id missing: ${b.name}`);
              const meta = await get(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${id}`);
              if (!meta?.name) throw new Error(`D1 database name missing for ${b.name}`);
              d1.push({ binding: b.name, database_name: meta.name, database_id: id });
            }
            const r2 = bindings.filter(x=>x.type==='r2_bucket').map(b=>{
              const bucket = String(b.bucket_name || b.bucket || '');
              if (!bucket) throw new Error(`R2 bucket name missing: ${b.name}`);
              return { binding: b.name, bucket_name: bucket };
            });
            const cfg = {
              name: preview,
              main: './worker.js',
              compatibility_date: String(settings.compatibility_date || '2026-09-09').slice(0,10),
              workers_dev: true,
              keep_vars: true,
              d1_databases: d1,
              r2_buckets: r2,
              observability: settings.observability && typeof settings.observability === 'object'
                ? { enabled: settings.observability.enabled !== false, ...(typeof settings.observability.head_sampling_rate === 'number' ? { head_sampling_rate: settings.observability.head_sampling_rate } : {}) }
                : { enabled: true }
            };
            if (Array.isArray(settings.compatibility_flags) && settings.compatibility_flags.length) cfg.compatibility_flags = settings.compatibility_flags;
            fs.writeFileSync('.remote-worker/wrangler.jsonc', JSON.stringify(cfg,null,2));
            fs.writeFileSync('.remote-worker/bindings-before.json', JSON.stringify(bindings.map(b=>({name:b.name,type:b.type,id:b.id||b.database_id||null,bucket_name:b.bucket_name||null})).sort((a,b)=>a.name.localeCompare(b.name))));
            console.log(`PREVIEW_WORKER_BEFORE=${previewBefore}`);
            console.log(`TEST_WORKER_BEFORE=${testBefore}`);
            console.log(`PRODUCTION_WORKER_BEFORE=${prodBefore}`);
            console.log('PREVIEW_SHARED_D1_BINDING=PASS');
            console.log('PREVIEW_BINDINGS_CAPTURED=PASS');
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE

      - name: Apply 031/032 to generated PREVIEW Worker and verify generated runtime
        shell: bash
        run: |
          set -euo pipefail
          export SORIDRAW_REMOTE_WORKER_DIR="$PWD/cloudflare/explore-worker/.remote-worker"
          node cloudflare/explore-worker/patches/031-explore-shared-canonical-data.mjs
          node cloudflare/explore-worker/patches/032-derived-change-cache.mjs
          node --check cloudflare/explore-worker/.remote-worker/worker.js
          grep -Fq 'SORIDRAW_EXPLORE_SHARED_CANONICAL_DATA_031_20260909' cloudflare/explore-worker/.remote-worker/worker.js
          grep -Fq 'SORIDRAW_DERIVED_CHANGE_CACHE_032' cloudflare/explore-worker/.remote-worker/worker.js
          grep -Fq 'async function derivedNext032(' cloudflare/explore-worker/.remote-worker/worker.js
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/.remote-worker/worker.js" node scripts/verify-explore-derived-cache.mjs
          node scripts/verify-explore-deploy-preflight.mjs
          echo 'GENERATED_PREVIEW_WORKER_032=PASS'

      - name: Apply approved additive shared D1 schema and one-time seed
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          before_json="$(npx wrangler d1 execute DB --remote --config .remote-worker/wrangler.jsonc --command "SELECT (SELECT COUNT(*) FROM public_profiles) AS public_profiles,(SELECT COUNT(*) FROM tracks) AS tracks,(SELECT COUNT(*) FROM follows) AS follows,(SELECT COUNT(*) FROM likes) AS likes" --json)"
          printf '%s\n' "$before_json" > "$RUNNER_TEMP/canonical-before.json"

          npx wrangler d1 execute DB --remote --config .remote-worker/wrangler.jsonc --file migrations/20260910_01_explore_derived_state.sql --yes
          npx wrangler d1 execute DB --remote --config .remote-worker/wrangler.jsonc --file migrations/20260910_02_explore_derived_seed.sql --yes

          after_json="$(npx wrangler d1 execute DB --remote --config .remote-worker/wrangler.jsonc --command "SELECT (SELECT COUNT(*) FROM public_profiles) AS public_profiles,(SELECT COUNT(*) FROM tracks) AS tracks,(SELECT COUNT(*) FROM follows) AS follows,(SELECT COUNT(*) FROM likes) AS likes" --json)"
          printf '%s\n' "$after_json" > "$RUNNER_TEMP/canonical-after.json"
          ready_json="$(npx wrangler d1 execute DB --remote --config .remote-worker/wrangler.jsonc --command "SELECT seeded,(SELECT COUNT(*) FROM explore_derived_profiles) AS derived_profiles,(SELECT COUNT(*) FROM explore_derived_tracks) AS derived_tracks FROM explore_derived_state WHERE id=1" --json)"
          printf '%s\n' "$ready_json" > "$RUNNER_TEMP/derived-ready.json"

          node <<'NODE'
          const fs=require('fs');
          const row=(p)=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return x?.[0]?.results?.[0]||null;};
          const before=row(process.env.RUNNER_TEMP+'/canonical-before.json');
          const after=row(process.env.RUNNER_TEMP+'/canonical-after.json');
          const ready=row(process.env.RUNNER_TEMP+'/derived-ready.json');
          if(!before||!after||JSON.stringify(before)!==JSON.stringify(after)) throw new Error(`Canonical counts changed: ${JSON.stringify({before,after})}`);
          if(Number(ready?.seeded)!==1) throw new Error(`seeded != 1: ${JSON.stringify(ready)}`);
          if(Number(ready?.derived_profiles)!==Number(after.public_profiles)) throw new Error(`Derived profile count mismatch: ${JSON.stringify(ready)}`);
          if(Number(ready?.derived_tracks)!==Number(after.tracks)) throw new Error(`Derived track count mismatch: ${JSON.stringify(ready)}`);
          console.log('CANONICAL_COUNTS_UNCHANGED=PASS '+JSON.stringify(after));
          console.log('DERIVED_SEED_READY=PASS '+JSON.stringify(ready));
          NODE
          echo 'SHARED_D1_ADDITIVE_MIGRATION_SEED=PASS'

      - name: Deploy PREVIEW Worker through mandatory D1 preflight and smoke
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$deployed" = '1' ]; then
              echo 'PREVIEW_WORKER_ROLLBACK=START'
              cp .remote-worker/original.js .remote-worker/worker.js
              node scripts/derived-deploy-preflight.mjs --config .remote-worker/wrangler.jsonc || true
              echo 'PREVIEW_WORKER_ROLLBACK=ATTEMPTED'
            fi
            exit "$status"
          }
          trap rollback EXIT

          node scripts/derived-deploy-preflight.mjs --config .remote-worker/wrangler.jsonc
          deployed=1
          sleep 4

          feed_code="$(curl -sS -D "$RUNNER_TEMP/feed-head.txt" -o "$RUNNER_TEMP/feed.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=latest&limit=5")"
          test "$feed_code" = '200'
          grep -qi '^access-control-allow-origin: https://preview.soridraw.com' "$RUNNER_TEMP/feed-head.txt"
          owner="$(node -e "const p=require(process.env.RUNNER_TEMP+'/feed.json'),x=p?.data?.items?.[0]||{};process.stdout.write(String(x.ownerUid||x.owner_uid||''))")"
          test -n "$owner"
          profile_code="$(curl -sS -D "$RUNNER_TEMP/profile-head.txt" -o "$RUNNER_TEMP/profile.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/profiles/${owner}/first-view?limit=50")"
          test "$profile_code" = '200'
          node -e "const p=require(process.env.RUNNER_TEMP+'/profile.json');if(!p?.data?.profile||!Array.isArray(p?.data?.items))process.exit(1)"

          for n in 1 2; do
            code="$(curl -sS -D "$RUNNER_TEMP/revision-${n}.head" -o "$RUNNER_TEMP/revision-${n}.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed-revision?sort=latest")"
            test "$code" = '200'
            grep -q '"revision"' "$RUNNER_TEMP/revision-${n}.json"
          done
          grep -i '^x-soridraw-d1-' "$RUNNER_TEMP/revision-2.head" || true

          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const h={Authorization:`Bearer ${token}`,Accept:'application/json'};
          async function get(url){const r=await fetch(url,{headers:h});const x=await r.json();if(!r.ok||x.success===false)throw Error(JSON.stringify(x).slice(0,800));return x.result??x;}
          async function active(name){const p=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(p.deployments||p||[])[0];const v=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];if(!v?.version_id||Number(v.percentage||0)<99.99)throw Error('active version missing '+name);return String(v.version_id);}
          (async()=>{
            const preview=await active(process.env.PREVIEW_WORKER),test=await active(process.env.TEST_WORKER),prod=await active(process.env.PRODUCTION_WORKER);
            const beforePreview=fs.readFileSync('.remote-worker/preview-before-version.txt','utf8').trim();
            const beforeTest=fs.readFileSync('.remote-worker/test-before-version.txt','utf8').trim();
            const beforeProd=fs.readFileSync('.remote-worker/prod-before-version.txt','utf8').trim();
            if(preview===beforePreview)throw Error('PREVIEW Worker version did not change');
            if(test!==beforeTest)throw Error('TEST Worker changed unexpectedly');
            if(prod!==beforeProd)throw Error('PRODUCTION Worker changed unexpectedly');
            const v=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${process.env.PREVIEW_WORKER}/versions/${preview}?include=modules`);
            const m=(v.modules||[]).find(x=>x.name===(v.main_module||(v.modules||[])[0]?.name))||(v.modules||[])[0];
            const source=Buffer.from(m?.content_base64||'','base64').toString('utf8');
            if(!source.includes('SORIDRAW_DERIVED_CHANGE_CACHE_032'))throw Error('Deployed PREVIEW Worker missing 032 marker');
            console.log('PREVIEW_WORKER_AFTER='+preview);
            console.log('TEST_WORKER_UNCHANGED=PASS');
            console.log('PRODUCTION_WORKER_UNCHANGED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          trap - EXIT
          touch .remote-worker/deploy-verified.marker
          echo 'PREVIEW_WORKER_032_DEPLOY_SMOKE=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy Firebase PREVIEW Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive
          echo 'FIREBASE_PREVIEW_DEPLOY=PASS'

      - name: Verify exact PREVIEW build and protected environments unchanged
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/preview-index.sha")"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${url}?derived-release=${attempt}" -o "$RUNNER_TEMP/preview-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/preview-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; echo "EXACT_PREVIEW_BUILD_PASS=$url"; break; fi
              fi
              sleep 8
            done
            test "$ok" = yes
          done
          version="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://preview.soridraw.com/app-version.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          test "$version" = '052'
          echo 'PREVIEW_VERSION_052=PASS'

          for host in test.soridraw.com soridraw.com; do
            curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://$host/" -o "$RUNNER_TEMP/${host}.after.html"
            sha256sum "$RUNNER_TEMP/${host}.after.html" | awk '{print $1}' > "$RUNNER_TEMP/${host}.after.sha"
            cmp "$RUNNER_TEMP/${host}.before.sha" "$RUNNER_TEMP/${host}.after.sha"
          done
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-branch-before.sha")"
          echo 'TEST_HOSTING_UNCHANGED=PASS'
          echo 'PRODUCTION_HOSTING_UNCHANGED=PASS'
          echo 'MAIN_BRANCH_UNCHANGED=PASS'
          echo 'PRODUCTION_BRANCH_UNCHANGED=PASS'
          echo 'FUNCTIONS_CHANGED=false'
          echo 'FIRESTORE_RULES_CHANGED=false'

      - name: Final release summary
        shell: bash
        run: |
          set -euo pipefail
          echo "PREVIEW_RELEASE_TARGET=$(git rev-parse HEAD)"
          echo 'D1_CHANGE=additive-derived-tables-triggers-and-approved-one-time-seed'
          echo 'CANONICAL_USER_DATA_DESTRUCTIVE_CHANGE=false'
          echo 'PREVIEW_WORKER_DEPLOYED=true'
          echo 'FIREBASE_PREVIEW_HOSTING_DEPLOYED=true'
          echo 'TEST_CODE_DEPLOYED=false'
          echo 'PRODUCTION_CODE_DEPLOYED=false'
          echo 'ACTUAL_HTTP_D1_ROWS_READ=not_independently_measured_by_this_workflow'
          echo 'PREVIEW_RELEASE=PASS'
