name: TEMP Deploy 054 Like Edge Rate Limit

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/deploy-054-like-edge-rate-limit.trigger'

permissions:
  contents: read

concurrency:
  group: temp-deploy-054-like-edge-rate-limit
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify locked 054 source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          grep -Fq 'SORIDRAW_EXPLORE_LIKE_EDGE_RATE_LIMIT_054_20260915' cloudflare/explore-worker/canonical/preview-worker.js
          grep -Fq 'LIKE_RATE_LIMITER' cloudflare/explore-worker/canonical/wrangler.preview.jsonc
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          echo "EXPECTED_SHA256=$expected"
          echo "ACTUAL_SHA256=$actual"
          test "$expected" = "$actual"
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-054-like-edge-rate-limit.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-explore-like-cost-optimization.mjs

      - name: Install Worker deploy dependency
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund

      - name: D1 read-only preflight and PREVIEW deploy
        working-directory: cloudflare/explore-worker
        run: node ./scripts/derived-deploy-preflight.mjs --config ./canonical/wrangler.preview.jsonc

      - name: Verify live PREVIEW Worker
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code="$(curl -sS -o "$RUNNER_TEMP/body.txt" -D "$RUNNER_TEMP/headers.txt" -w '%{http_code}' 'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed-revision?sort=latest' || true)"
            if [ "$code" = "200" ] && grep -Fiq 'X-SORIDRAW-CF-Worker: 1' "$RUNNER_TEMP/headers.txt"; then
              echo "PREVIEW_WORKER_HTTP=PASS"
              cat "$RUNNER_TEMP/headers.txt"
              cat "$RUNNER_TEMP/body.txt"
              exit 0
            fi
            sleep 3
          done
          echo 'PREVIEW_WORKER_HTTP=FAIL'
          cat "$RUNNER_TEMP/headers.txt" || true
          cat "$RUNNER_TEMP/body.txt" || true
          exit 1
