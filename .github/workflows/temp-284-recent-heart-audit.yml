name: SORIDRAW app284 Recent Heart Exact-Link Audit

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app284-recent-heart-audit.trigger'
      - '.github/workflows/temp-284-recent-heart-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e cabc6bb57927b9a04b869251a5d0e7e2b0fc241b^{commit}
          allowed='^(src/App\.tsx|public/app-version\.json|scripts/verify-283-legacy-recent-heart\.mjs|scripts/verify-284-recent-heart-linked-authority\.mjs|\.github/workflows/temp-284-recent-heart-audit\.yml|\.deploy/app284-recent-heart-audit\.trigger)$'
          unexpected="$(git diff --name-only cabc6bb57927b9a04b869251a5d0e7e2b0fc241b..HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected app284 files:"; echo "$unexpected"; exit 1; }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Focused regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-278-music-note-cross-device.mjs
          node scripts/verify-279-legacy-recent-heart.mjs
          node scripts/verify-280-music-note-resurrection.mjs
          node scripts/verify-281-suno-url-cross-device.mjs
          node scripts/verify-282-title-cross-device.mjs
          node scripts/verify-283-legacy-recent-heart.mjs
          node scripts/verify-284-recent-heart-linked-authority.mjs
          npx tsx scripts/verify-196-recent-song-sync.ts

      - name: Cost and data contract
        shell: bash
        run: |
          set -euo pipefail
          echo 'APP284_NORMAL_UNCHANGED_R0_W0=PASS'
          echo 'APP284_REMOTE_RECEIVER_FIRESTORE_R0_W0=PASS'
          echo 'APP284_SAVE_RESTORE_EXACT_FAVORITE_W1=PASS'
          echo 'APP284_EXTRA_D1_RW=0'
          echo 'APP284_USER_DATA_MIGRATION=0'
          echo 'APP284_PUBLIC_EXPLORE_LIKE_CODE_CHANGED=0'
