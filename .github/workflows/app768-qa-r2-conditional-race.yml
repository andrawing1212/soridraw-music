name: APP777 QA Firebase RS256 + common ingress offline safety
on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/app775-unified-follow-ingress.mjs'
      - 'scripts/app777-qa-signed-ingress.mjs'
      - 'scripts/verify-777-qa-signed-ingress-offline.mjs'
      - 'scripts/app783-qa-immutable-settled-history.mjs'
      - 'scripts/verify-783-qa-immutable-settled-history.mjs'
      - 'scripts/app777-qa-real-cloudshell-readonly.mjs'
      - 'scripts/app776-qa-integration-worker.mjs'
      - 'scripts/app776-qa-integration-runner.mjs'
      - 'scripts/verify-783-qa-worker-bridge.mjs'
      - 'scripts/app784-qa-unified-follow.mjs'
      - 'scripts/verify-784-qa-unified-follow.mjs'
      - 'scripts/verify-784-qa-http-offline.mjs'
      - 'scripts/app785-qa-follow-compatibility.mjs'
      - 'scripts/verify-785-qa-worker-bridge.mjs'
      - 'scripts/app788-qa-independent-owner-floor.mjs'
      - 'scripts/verify-788-qa-independent-owner-floor.mjs'
      - 'cloudflare/explore-worker/experiments/owner-follow-qa789-entry.mjs'
      - 'scripts/app789-qa-physical-runner.mjs'
      - 'scripts/verify-789-qa-physical-source.mjs'
      - 'scripts/verify-789-qa-local-runtime.mjs'
      - '.github/workflows/app768-qa-r2-conditional-race.yml'
permissions:
  contents: read
concurrency:
  group: soridraw-app768-r2-physical-qa
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request' && github.repository == 'andrawing1212/soridraw-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify APP777 QA project pin, RS256 signed evidence and fail-closed paths
        run: |
          set -euo pipefail
          node --check scripts/app775-unified-follow-ingress.mjs
          node --check scripts/app777-qa-signed-ingress.mjs
          node --check scripts/verify-777-qa-signed-ingress-offline.mjs
          node --check scripts/app777-qa-real-cloudshell-readonly.mjs
          node scripts/verify-775-unified-follow-ingress.mjs
          node scripts/verify-777-qa-signed-ingress-offline.mjs
          node --check scripts/app776-qa-integration-worker.mjs
          node --check scripts/app776-qa-integration-runner.mjs
          node scripts/verify-783-qa-immutable-settled-history.mjs
          node scripts/verify-783-qa-worker-bridge.mjs
          node --check scripts/app783-qa-immutable-settled-history.mjs
          node scripts/verify-783-qa-immutable-settled-history.mjs
          node --check scripts/app784-qa-unified-follow.mjs
          node scripts/verify-784-qa-unified-follow.mjs
          node scripts/verify-784-qa-http-offline.mjs
          node --check scripts/app785-qa-follow-compatibility.mjs
          node scripts/verify-785-qa-worker-bridge.mjs
          node --check scripts/app788-qa-independent-owner-floor.mjs
          node scripts/verify-788-qa-independent-owner-floor.mjs
          node --check scripts/app789-qa-physical-runner.mjs
          node --check cloudflare/explore-worker/experiments/owner-follow-qa789-entry.mjs
          node scripts/verify-789-qa-physical-source.mjs
          git fetch --no-tags origin 4363820117100cb03bcbc44a01e127aeb5de3cf4
          git worktree add --detach "$RUNNER_TEMP/app789-frozen" 4363820117100cb03bcbc44a01e127aeb5de3cf4
          cp cloudflare/explore-worker/experiments/owner-follow-qa789-entry.mjs "$RUNNER_TEMP/app789-frozen/cloudflare/explore-worker/experiments/"
          for file in app788-qa-independent-owner-floor.mjs app761-production-owner-do-runtime.mjs app755-production-owner-receipt.mjs app759-production-owner-alarm.mjs app767-r2-admission-candidate.mjs app783-qa-immutable-settled-history.mjs; do
            cp "scripts/$file" "$RUNNER_TEMP/app789-frozen/scripts/"
          done
          npx --yes esbuild@0.25.12 "$RUNNER_TEMP/app789-frozen/cloudflare/explore-worker/experiments/owner-follow-qa789-entry.mjs" --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/app789-qa-bundle-check.mjs
      - name: Reproduce APP789 on local workerd SQLite DO, D1, R2 (no cloud)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/app789-local" --no-save --no-package-lock --no-audit --no-fund miniflare@4.20260730.0
          node scripts/verify-789-qa-local-runtime.mjs /tmp/app789-qa-bundle-check.mjs "$RUNNER_TEMP/app789-local"
  live:
    if: false # APP785 QA exact one-shot PASS and exact cleanup complete; do not auto-repeat
    env:
      APP785_QA_APPROVAL: APP785_ISOLATED_ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact QA source revision and check offline safety
        env:
          COMMAND: '${{ github.event.comment.body }}'
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$COMMAND" | sed -nE 's|^/app785-qa ([0-9a-f]{40})$|\1|p')"
          test -n "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SHA"
          node --check scripts/app785-qa-follow-compatibility.mjs
          node --check scripts/app776-qa-integration-worker.mjs
          node --check scripts/app776-qa-integration-runner.mjs
          node scripts/verify-785-qa-worker-bridge.mjs
      - name: Inspect original APP583, QA D1/R2 isolation, insert one synthetic row
        env:
          CLOUDFLARE_ACCOUNT_ID: b60fcd62c679c64db19f0b0e0c2f3429
          CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
          CLOUDFLARE_QA_DATA_TOKEN: ${{ secrets.CLOUDFLARE_QA_DATA_TOKEN }}
          CLOUDFLARE_QA_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
        run: node scripts/app776-qa-integration-runner.mjs preflight
      - name: Bundle and upload ONE temporary QA HTTP Worker with QA-only D1/R2
        env:
          CLOUDFLARE_ACCOUNT_ID: b60fcd62c679c64db19f0b0e0c2f3429
          CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
          CLOUDFLARE_QA_DATA_TOKEN: ${{ secrets.CLOUDFLARE_QA_DATA_TOKEN }}
          CLOUDFLARE_QA_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/app776-single-run-state.json"
          npx --yes esbuild@0.25.12 scripts/app776-qa-integration-worker.mjs \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile=app776-qa-integration-worker.bundle.mjs
          node scripts/app776-qa-integration-runner.mjs upload
      - name: One-shot APP785 Cloudflare QA legacy and Accept negotiation
        env:
          CLOUDFLARE_ACCOUNT_ID: b60fcd62c679c64db19f0b0e0c2f3429
          CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
          CLOUDFLARE_QA_DATA_TOKEN: ${{ secrets.CLOUDFLARE_QA_DATA_TOKEN }}
          CLOUDFLARE_QA_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
        run: node scripts/app776-qa-integration-runner.mjs test785
      - name: Always purge exact synthetic R2 objects, D1 row and temporary Worker
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: b60fcd62c679c64db19f0b0e0c2f3429
          CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
          CLOUDFLARE_QA_DATA_TOKEN: ${{ secrets.CLOUDFLARE_QA_DATA_TOKEN }}
          CLOUDFLARE_QA_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
        run: node scripts/app776-qa-integration-runner.mjs cleanup

  physical789:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'andrawing1212/soridraw-music' &&
      github.actor == github.repository_owner &&
      github.event.issue.number == 1389 &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/app789-physical ')
    concurrency:
      group: soridraw-app736-qa-zero-traffic
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      APP789_QA_APPROVAL: APP789_EXISTING_RESOURCES_ONE_SHOT
      CLOUDFLARE_ACCOUNT_ID: b60fcd62c679c64db19f0b0e0c2f3429
      CLOUDFLARE_QA_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
      CLOUDFLARE_QA_DATA_TOKEN: ${{ secrets.CLOUDFLARE_QA_DATA_TOKEN }}
      CLOUDFLARE_QA_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin EXACT main, QA account, existing class, and scripts before any write
        env:
          DIRECTOR_COMMAND: '${{ github.event.comment.body }}'
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$DIRECTOR_COMMAND" | sed -nE 's|^/app789-physical ([0-9a-f]{40})$|\1|p')"
          test -n "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SHA"
          node scripts/verify-789-qa-physical-source.mjs
          node --check scripts/app789-qa-physical-runner.mjs
          node --check cloudflare/explore-worker/experiments/owner-follow-qa789-entry.mjs
      - name: GET-only verify original QA583 100 and exact existing namespace, D1 and R2; one synthetic row
        run: node scripts/app789-qa-physical-runner.mjs preflight
      - name: Bundle existing QA DO class with APP788 isolated R2 owner-floor runtime
        run: |
          set -euo pipefail
          git fetch --no-tags origin 4363820117100cb03bcbc44a01e127aeb5de3cf4
          git worktree add --detach "$RUNNER_TEMP/app789-frozen" 4363820117100cb03bcbc44a01e127aeb5de3cf4
          cp cloudflare/explore-worker/experiments/owner-follow-qa789-entry.mjs "$RUNNER_TEMP/app789-frozen/cloudflare/explore-worker/experiments/"
          for file in app788-qa-independent-owner-floor.mjs app761-production-owner-do-runtime.mjs app755-production-owner-receipt.mjs app759-production-owner-alarm.mjs app767-r2-admission-candidate.mjs app783-qa-immutable-settled-history.mjs; do
            cp "scripts/$file" "$RUNNER_TEMP/app789-frozen/scripts/"
          done
          npx --yes esbuild@0.25.12 "$RUNNER_TEMP/app789-frozen/cloudflare/explore-worker/experiments/owner-follow-qa789-entry.mjs" \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile=app789-qa-worker.bundle.mjs
      - name: Upload OFF candidate version with inherited DO namespace and QA D1/R2 only
        run: node scripts/app789-qa-physical-runner.mjs stage
      - name: Route QA583 original 100%, single APP789 candidate 0%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          CANDIDATE="$(node -e 'const s=require(process.env.RUNNER_TEMP+"/app789-physical-state.json");if(!/^[0-9a-f-]{36}$/i.test(s.candidate||""))process.exit(2);process.stdout.write(s.candidate)')"
          touch "$RUNNER_TEMP/app789-route-attempted"
          test -f "$RUNNER_TEMP/app789-frozen/cloudflare/explore-worker/wrangler.owner-qa-583.json"
          cd "$RUNNER_TEMP/app789-frozen/cloudflare/explore-worker"
          npx --yes wrangler@4.102.0 versions deploy \
            '4ed70845-6a4b-4a80-9c51-ed95d0becc38@100%' \
            "$CANDIDATE@0%" \
            --config wrangler.owner-qa-583.json --yes
          cd "$GITHUB_WORKSPACE"
          node scripts/app789-qa-physical-runner.mjs verifyDeployed
      - name: Physical QA real R2 owner floor CAS + QA D1 W1 + isolated owner DO
        run: node scripts/app789-qa-physical-runner.mjs test
      - name: ALWAYS wipe only exact run-owned DO key, R2 objects, D1 synthetic row
        if: always()
        run: node scripts/app789-qa-physical-runner.mjs cleanup
      - name: ALWAYS restore QA583 original single version 100 percent
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/app789-route-attempted" ]; then
            echo 'APP789_NO_QA_ROUTE_CHANGE_ATTEMPT'
            exit 0
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -f "$RUNNER_TEMP/app789-frozen/cloudflare/explore-worker/wrangler.owner-qa-583.json"
          cd "$RUNNER_TEMP/app789-frozen/cloudflare/explore-worker"
          npx --yes wrangler@4.102.0 versions deploy \
            '4ed70845-6a4b-4a80-9c51-ed95d0becc38@100%' \
            --config wrangler.owner-qa-583.json --yes
          echo 'APP789_ORIGINAL_QA583_ONLY_100_RESTORED'
      - name: ALWAYS read-only verify QA583 original version, exact bindings and traffic
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/app789-physical-state.json" ]; then
            node scripts/app789-qa-physical-runner.mjs verifyOriginal
          else
            echo 'APP789_NO_STATE_NO_QA_WRITE'
          fi
