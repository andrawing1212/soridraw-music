name: TEMP 109 Record Release State

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-109-record-release-state.trigger'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Record completed PREVIEW 109 release
        shell: python
        run: |
          from pathlib import Path

          current_path = Path('DOCS/CURRENT_RELEASE_STATE.md')
          current = current_path.read_text(encoding='utf-8')
          current = current.replace('최종 갱신: 2026-09-16 KST — PREVIEW 108 배포 완료', '최종 갱신: 2026-09-16 KST — PREVIEW 109 배포 완료', 1)
          marker = '> 새 채팅은 이 문서 + 실제 GitHub/Firebase/Cloudflare 상태를 기준으로 이어간다. 문서와 실제 상태가 다르면 실제 상태 우선.\n'
          if marker not in current:
              raise SystemExit('CURRENT_RELEASE_STATE insertion marker missing')
          section = r'''

          ## 0H. PREVIEW 109 — 모바일 stale 공개 숫자 1회 복구 + 새로고침 Firestore 반복 read 차단 배포 완료

          - **사용자 실사용 108 판정: FAIL → 109 수정.** PC에서는 Master/Admin 모두 같은 공개곡 좋아요 숫자 `1`이 보존됐지만, 모바일에서는 Master/Admin 모두 같은 곡이 `0`으로 남았다. 개인 heart 상태와 무관하게 모바일 공용 Feed 캐시가 오래된 공개 숫자를 계속 표시하는 현상으로 범위를 좁혔다.
          - 사용자 제공 새로고침 영상에서도 **hard refresh 때 Browser SDK Firestore read가 `users:onSnapshot` 기준 4 → 8로 증가**했고 D1 read/write는 0이었다. 즉 문제는 Explore D1이 아니라 앱 루트의 `users/{uid}` Firestore listener가 새로고침마다 다시 서버 snapshot을 받는 구조였다.
          - 109 제품 commit: `18bbe64274e1b37920dd89e11d39519a12f12636`.
          - 구현/검증 Run `35076421708` — **SUCCESS**. TypeScript PASS / Build PASS / 109·108·107·105·103 회귀 PASS / UID RTDB user-control revision foundation PASS / exact product boundary PASS.
          - PREVIEW App Release Run `35076764313` — **SUCCESS**. release source `6154c54c9303e4977261a7e5321778b538b794a7`, 실제 `https://preview.soridraw.com` 앱 버전 **109**, exact build hash PASS. TEST/PRODUCTION branch 및 실제 Hosting 비변경 PASS.
          - **모바일 stale 숫자 복구:** Explore Feed 로컬 cache data-contract를 schema `2 → 3`으로 한 번만 올렸다. 모바일에 남은 schema-2 stale payload는 109에서 1회 폐기하고, 기존 108의 **R2 snapshot 전용 경로**로 다시 채운다. 해당 cold refill 계약은 D1 read 0/write 0이며 108 실제 Worker smoke에서 R0/W0 확인된 경로를 그대로 사용한다.
          - 이 cache schema는 앱 버전과 연결하지 않는다. 109 이후 일반 앱 업데이트만으로 schema-3 캐시를 반복 폐기하지 않는다.
          - **새로고침 비용 수정:** 정상 로컬 사용자 프로필 cache가 있으면 hard refresh에서 `users/{uid}` Firestore listener를 즉시 다시 열지 않는다. 사용자 역할/상태/권한은 로컬 cache를 먼저 사용하고, 작은 UID 전용 RTDB `userControls/{uid}` revision 신호만 감시한다.
          - Firestore `users/{uid}` 재검증은 **로컬 profile cache miss / 실제 Admin·보안 control revision 변경 / 24시간 안전 재검증** 때만 허용한다. 단순 새로고침 반복은 Firestore R0을 목표로 한다.
          - 109 자동검증 결과: `MOBILE_STALE_SCHEMA_2=REJECTED_ONCE`, `COLD_REFILL=R2_SNAPSHOT_ONLY_D1_R0_W0_CONTRACT`, `WARM_REFRESH_FIRESTORE_USERS=R0_BY_GATE`, `ROOT_CONTROL_SIGNAL=UID_RTDB_ONLY`, `FUTURE_APP_VERSION_CACHE_COUPLING=NONE` PASS.
          - 공개 좋아요 숫자 직접 표시(107), 1분 event-driven like aggregate(105), 고정 cron 0, Durable Object v1(103)은 그대로 유지. PREVIEW Explore Worker는 재배포하지 않았으며 `d8eae38a-09a9-4f37-9500-57f217ee1d8c` 유지.
          - UI/CSS 변경 없음. Firebase Functions/Rules/RTDB Rules 변경 없음. D1 schema/migration/backfill 없음. 사용자 원본 데이터 복사/삭제/덮어쓰기 없음.
          - **실사용 검증 전:** 모바일 Master/Admin에서 기존 `0`이 `1`로 1회 정상 복구되는지, 재진입/새로고침 후 다시 `0`으로 돌아가지 않는지 확인 필요. 새로고침 Firestore `users:onSnapshot` 반복 증가도 사용자 진단창에서 다시 확인 필요. 자동계약은 PASS지만 실제 브라우저 반복 새로고침 R0은 사용자 실사용 검증 전이다.
          - TEST 승격 금지 유지. formal Work 독립 감사는 미실행.
          '''
          current = current.replace(marker, marker + section, 1)
          current_path.write_text(current, encoding='utf-8')

          next_path = Path('DOCS/NEXT_CODEX_TASK.md')
          next_path.write_text(r'''# SORIDRAW NEXT CODEX TASK

최종 갱신: 2026-09-16 KST

## 현재 기준

- branch: `preview`
- 109 제품 commit: `18bbe64274e1b37920dd89e11d39519a12f12636`
- PREVIEW release source: `6154c54c9303e4977261a7e5321778b538b794a7`
- PREVIEW app: **109**, `https://preview.soridraw.com`
- PREVIEW App Release Run: `35076764313` SUCCESS
- PREVIEW Explore Worker: `d8eae38a-09a9-4f37-9500-57f217ee1d8c` (109에서 재배포 없음)
- TEST/PRODUCTION: 비변경

## 108 실사용에서 확인된 문제

1. PC Master/Admin: 같은 공개곡 숫자 `1` 보존 PASS.
2. 모바일 Master/Admin: 같은 공개곡 숫자 `0` 유지 FAIL.
3. 사용자 영상: hard refresh 시 Browser SDK Firestore read가 `users:onSnapshot` 기준 `4 → 8` 증가. D1 R0/W0. 단순 새로고침이 Firestore read를 반복 발생시키는 구조 FAIL.

## 109 수정

- 모바일 stale Explore Feed cache schema-2를 한 번만 폐기하고 schema-3으로 전환. cold refill은 기존 R2 snapshot-only 경로를 사용하며 D1 R0/W0 계약 유지.
- 정상 local profile cache가 있으면 hard refresh에서 `users/{uid}` Firestore listener를 바로 열지 않는다.
- 역할/상태/권한은 local cache 우선, 변경 감지는 UID RTDB `userControls/{uid}` revision으로 처리.
- Firestore user doc 재확인은 cache miss / 실제 control revision / 24시간 안전 재검증에만 허용.
- 앱 버전 변경만으로 Explore cache를 반복 무효화하지 않음.
- UI/CSS, Worker, Functions, Rules, D1 schema, 사용자 원본 데이터 비변경.

## 다음 작업 — PREVIEW 109 실사용 검증만

코드 수정부터 하지 않는다.

1. 모바일 Master/Admin이 앱 109를 받은 뒤 상단 동일 공개곡 숫자가 `0 → 1`로 정상 복구되는지 확인.
2. 모바일 Explore 재진입/다른 페이지 이동/새로고침 뒤에도 숫자 `1`이 다시 `0`으로 되돌아가지 않는지 확인.
3. PC Master/Admin의 기존 `1` 표시가 그대로 유지되는지 확인.
4. 진단 초기화 후 **첫 정상 초기화가 끝난 상태**에서 hard refresh를 여러 번 반복. `users:onSnapshot` Browser SDK read가 새로고침 횟수만큼 계속 증가하면 FAIL. 정상 warm local-profile 상태에서는 단순 refresh Firestore read 0이 목표. 실제 control 변경 또는 24시간 안전 재확인은 예외.
5. D1은 warm Explore/refresh에서 R0/W0 유지해야 한다.
6. like/unlike 후 개인 heart 즉시 반영, 공개 숫자는 약 1분~1분10초 뒤 Master/Admin·PC/모바일·Feed/Profile에서 같은 최종값으로 수렴하는지 확인.

## 승격 조건

위 실사용 검증 전 `main`/TEST 승격 금지. 사용자가 `테스트배포`를 명확히 승인한 경우에만 검증된 PREVIEW 전체를 TEST로 승격한다. PRODUCTION은 별도 명확한 승인 전 금지.

## 주의

- 103 Durable Object migration `v1` 유지. pre-103 Worker 직접 rollback은 피하고 migration을 유지한 forward-compatible rollback 사용.
- formal Work 독립 감사는 아직 미실행.
''', encoding='utf-8')

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md
          git commit -m 'docs: record completed PREVIEW 109 release'
          git push origin HEAD:preview
