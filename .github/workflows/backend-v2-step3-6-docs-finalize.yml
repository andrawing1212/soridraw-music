name: SORIDRAW Backend V2 Step 3-6 Docs Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-6-docs-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - name: Update Master Plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("Status: IMPLEMENTATION / Step 3-5 per-user automatic verification complete — 10/10 migrated users passed and all 900 migrated V2 documents were accounted for with full payload/metadata parity and zero verification writes; Step 3-6 V1 retention / rollback safety confirmation is next and starts read-only", "Status: IMPLEMENTATION / Step 3 complete — V1 rollback source and Step 3-3 backup verified, but live V1 activity after backfill produced 3 new favorites and one rotated 10-item recent bundle while V2 runtime remains v1-only; Step 4 is blocked pending Step 2-A4 live mutation/sync risk review"),
              ("### Step 3 — Backup, backfill and verification (5/6 complete; Step 3-5 per-user automatic verification complete) 🔄", "### Step 3 — Backup, backfill and verification (6/6 complete; Step 3-6 rollback safety confirmed, live delta recorded) ✅"),
              ("- [ ] 3-6 V1 retention / rollback safety confirmation; no V1 deletion.", "- [x] 3-6 V1 retention / rollback safety confirmed: backed-up V1 records remain retained, the current V1 source remains live, the Step 3-3 backup is hash-valid/recoverable, and all V2/backfill/V1-delete runtime gates remain off. Read-only follow-up found normal post-backfill drift (3 new favorites and one rotated 10-item recent bundle), so Step 4 is blocked until Step 2-A4 live mutation/sync review. Full detail: `docs/SORIDRAW_BACKEND_V2_STEP3_6_V1_ROLLBACK_SAFETY_RESULT.md`."),
              ("### Step 4 — Preview validation (0/12) ⏳", "### Step 4 — Preview validation (0/12; blocked pending Step 2-A4 live mutation/sync review) ⏳"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'replacement anchor mismatch: {old[:80]!r} count={s.count(old)}')
              s = s.replace(old, new, 1)
          anchor = "12. A new adapter/helper must not introduce an unbounded startup query where V1 currently uses bounded/paginated reads."
          addition = "\n13. Suno Library remains isolated provider-specific private data in Firebase for now; preserve a clean boundary so it can be migrated independently later without touching canonical core songs.\n14. Explore/public-social traffic remains planned for Cloudflare Worker + D1 so public read growth does not consume the private Firestore budget.\n15. Every server/domain (Firebase, future Cloudflare/D1, and any future Library migration) must have explicit free-tier headroom monitoring, bounded bulk-operation gates, and cross-server connectivity/fallback verification before activation."
          if addition.strip() not in s:
              if s.count(anchor) != 1:
                  raise SystemExit(f'cost architecture anchor mismatch: {s.count(anchor)}')
              s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git commit -m 'docs: finalize Step 3-6 rollback status and server cost guards'
          git push origin HEAD:preview
      - name: Remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/backend-v2-step3-6-docs-finalize.yml
          git commit -m 'chore: remove Step 3-6 docs finalizer'
          git push origin HEAD:preview
