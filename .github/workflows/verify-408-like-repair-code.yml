          node scripts/verify-416-191-public-hold-guard.mjs
          node scripts/verify-444-stage416-master-public-e2e.mjs
          node scripts/verify-445-stage416-activation-release-infra.mjs
          node scripts/verify-416-public-function-inventory.mjs selftest
          node scripts/verify-441-stage416-public-manifest-scale.mjs
          node scripts/verify-416-private-final-publisher.mjs
          node scripts/verify-416-public-coalescing-gap.mjs
          node scripts/verify-416-finalize-e2e.mjs
          node scripts/verify-416-signed-worker-issuer.mjs
          node scripts/verify-416-complete-private-window.mjs
          node scripts/verify-416-private-deadline.mjs
