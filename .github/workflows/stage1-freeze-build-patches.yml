name: Stage1 Freeze Build Patches

on:
  push:
    branches: [preview-build-cleanup]
    paths:
      - '.github/workflows/stage1-freeze-build-patches.yml'
      - '.deploy/stage1-freeze-build-patches.py'

permissions:
  contents: write

concurrency:
  group: stage1-freeze-build-patches
  cancel-in-progress: false

jobs:
  freeze-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: preview-build-cleanup
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply legacy source patches exactly once
        run: npm run prebuild

      - name: Freeze generated runtime into real source and simplify scripts
        run: python3 .deploy/stage1-freeze-build-patches.py

      - name: Type check frozen source
        run: npx tsc --noEmit

      - name: Build frozen source - pass 1
        run: npm run build

      - name: Confirm build no longer mutates source
        shell: bash
        run: |
          set -euo pipefail
          before="$(git diff -- src package.json)"
          npm run build
          after="$(git diff -- src package.json)"
          if [ "$before" != "$after" ]; then
            echo 'ERROR: second build mutated source/package.json'
            git diff -- src package.json
            exit 1
          fi
          echo 'Second build source mutation check: PASS'

      - name: Commit frozen source on cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src DOCS/STAGE1_FREEZE_REPORT.md
          git commit -m 'refactor: freeze runtime patches into source'
          git push origin HEAD:preview-build-cleanup
