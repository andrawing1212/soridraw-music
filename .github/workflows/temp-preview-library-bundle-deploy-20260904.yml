name: SORIDRAW Preview Library Bundle Deploy 2026-09-04

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-preview-library-bundle-deploy-20260904.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-preview-library-bundle-deploy-20260904
  cancel-in-progress: false

jobs:
  verify-preview:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 5

      - name: Verify corrected source remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 873e1626a9c2c0f92160d46df2a97df126adad20^{commit}
          git diff --quiet 873e1626a9c2c0f92160d46df2a97df126adad20 HEAD -- src functions package.json package-lock.json firebase.json firebase.hosting-preview.json
          grep -q '.region("asia-northeast3")' functions/src/index.ts
          grep -q '.firestore.document("suno_tracks/{uid}/tracks/{trackId}")' functions/src/index.ts
          echo '[Preview verify] Corrected source unchanged: PASS'

      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Show deploy service account identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(`[Preview verify] Deploy service account: ${data.client_email}`);
          NODE

      - name: Verify deployed Function inventory and region
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest functions:list \
            --project soridraw-app-866a5 \
            --json > "$RUNNER_TEMP/functions-list.json"
          grep -q 'syncSunoLibraryLatest10Bundle' "$RUNNER_TEMP/functions-list.json"
          grep -q 'asia-northeast3' "$RUNNER_TEMP/functions-list.json"
          echo '[Preview verify] Function inventory/region: PASS'

      - name: Smoke test PREVIEW Hosting addresses
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://soridraw-preview.web.app/' 'https://soridraw-preview.firebaseapp.com/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 "$url" -o "$RUNNER_TEMP/preview-index.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview-index.html"; then
                ok='yes'
                echo "[Preview verify] Smoke PASS: $url"
                break
              fi
              sleep 10
            done
            test "$ok" = 'yes' || { echo "Preview smoke failed: $url"; exit 7; }
          done

      - name: Verify Explore PREVIEW and production boundary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o /dev/null
          explore_status="$(curl -sS -o "$RUNNER_TEMP/explore.txt" -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' 'https://soridraw-explore-preview.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1' || true)"
          test "$explore_status" = '200'
          echo '[Preview verify] Production reachable; Explore PREVIEW HTTP 200.'

      - name: Result
        run: |
          echo 'SORIDRAW PREVIEW Library bundle Function is deployed and verified.'
          echo 'Source: 873e1626a9c2c0f92160d46df2a97df126adad20'
          echo 'Function: syncSunoLibraryLatest10Bundle @ asia-northeast3 (1st Gen)'
          echo 'Hosting: existing PREVIEW build verified at all three addresses.'
          echo 'Artifact cleanup policy remains pending because the deploy service account lacks Artifact Registry repository update permission.'
          echo 'No IAM widening, Rules, migration, Cloudflare deploy, main, TEST, or PRODUCTION change.'
