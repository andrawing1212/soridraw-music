name: TEMP 078 Apply Client Cache Fix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-078-apply-client.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply 078 persistent publication cache patch
        run: node .deploy/apply-078-publication-persistent-revision.mjs
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Verify 078 cache invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SORIDRAW_PUBLICATION_PERSISTENT_REVISION_078_20260913' src/services/explorePublicationService.ts
          grep -q '/v1/me/music-note-publications-revision' src/services/explorePublicationService.ts
          ! grep -q '/v1/me/publications?' src/services/explorePublicationService.ts
          ! grep -q 'removeSoridrawPersistentCache' src/services/explorePublicationService.ts
          echo 'CLIENT_078_CACHE_VERIFY=PASS'
      - name: Commit prepared source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/services/explorePublicationService.ts
          git diff --cached --check
          git commit -m 'fix(preview): persist publication snapshot across app restarts'
          git fetch origin preview --no-tags
          git rebase origin/preview
          git push origin HEAD:preview
