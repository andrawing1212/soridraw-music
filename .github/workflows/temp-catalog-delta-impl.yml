name: Temp Catalog Delta Implementation

on:
  push:
    branches: [preview-catalog-delta-impl]
    paths: ['.github/workflows/temp-catalog-delta-impl.yml']

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-catalog-delta-impl
          fetch-depth: 30

      - name: Apply shared Base plus Delta implementation
        run: |
          python3 .deploy/apply-catalog-delta-1053.py
          python3 .deploy/fix-catalog-delta-1053.py

      - name: Structural guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SORIDRAW_CATALOG_BASE_DELTA_JOURNAL_1053' src/lib/userDataEngine.ts
          grep -q 'X-Soridraw-Require-Revision' src/lib/userDataEngine.ts
          grep -q "mode: 'delta'" src/lib/userDataEngine.ts
          grep -q 'CATALOG_JOURNAL_ENGINE_1053' cloudflare/media-worker/src/index.js
          grep -q "catalogDeltaMode: 'base+journal'" cloudflare/media-worker/src/index.js
          grep -q 'appendCatalogJournalDelta' cloudflare/media-worker/src/index.js
          grep -q 'CATALOG_JOURNAL_COMPACT_AFTER = 200' cloudflare/media-worker/src/catalogJournal.js
          ! grep -q 'const byId = new Map(current.items' cloudflare/media-worker/src/index.js
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: App TypeScript and Build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          echo '1053_APP=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Journal unit tests and Worker dry-run
        run: |
          node cloudflare/media-worker/scripts/test-catalog-journal-1053.mjs
          cd cloudflare/media-worker
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run
          echo '1053_WORKER=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Functions and Library regression
        run: |
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle
          echo '1053_FUNCTIONS=PASS'

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git rm .github/workflows/temp-catalog-delta-impl.yml .deploy/apply-catalog-delta-1053.py .deploy/fix-catalog-delta-1053.py
          git add src/lib/userDataEngine.ts cloudflare/media-worker/src/index.js cloudflare/media-worker/src/catalogJournal.js cloudflare/media-worker/scripts/test-catalog-journal-1053.mjs
          git diff --cached --check
          git commit -m 'feat(preview): add shared Catalog Base+Delta journal'
          git push origin HEAD:preview-catalog-delta-impl
          echo "FEATURE_COMMIT=$(git rev-parse HEAD)"
