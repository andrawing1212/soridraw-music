name: TEMP Inspect Music Note IO V2

on:
  push:
    branches: [preview-musicnote-save-unsave-io-v2]
    paths:
      - '.github/workflows/temp-inspect-musicnote-io-v2.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-musicnote-save-unsave-io-v2
      - name: Inspect exact Music Note mutation and reactive paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text(encoding='utf-8')
          lines=s.splitlines()
          def around(term, before=30, after=100):
            hits=[i for i,l in enumerate(lines,1) if term in l]
            print(f'\n===== {term} hits={hits} =====')
            for idx in hits:
              lo=max(1,idx-before); hi=min(len(lines),idx+after)
              for n in range(lo,hi+1): print(f'{n}: {lines[n-1]}')
          for term in [
            "scheduleListBundleWrite('musicNote'",
            "subscribeListBundle('musicNote'",
            'const syncMusicNoteIncrementalFromRemoteVersion',
            'const applyFavoriteSyncSignal',
            'function applyFavoriteSyncSignal',
            'favoriteSyncSignalUpdatedAt',
            'favoriteCount:',
            'setFavorites((prev)',
          ]:
            around(term)
          print('\n===== all favorite-related Firestore operations =====')
          for idx,line in enumerate(lines,1):
            if any(x in line for x in ["collection(db, 'favorites')", "doc(db, 'favorites'", "doc(db, 'users'", "user_list_caches"]):
              print(f'{idx}: {line}')
          PY
      - name: Inspect supporting stores and bundle cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in ['src/lib/listBundleCache.ts','src/lib/cacheDiagnostics.ts','src/lib/firestoreMeasured.ts']:
            print(f'\n######## {p} ########')
            s=Path(p).read_text(encoding='utf-8')
            for idx,line in enumerate(s.splitlines(),1):
              if any(x in line for x in ['scheduleListBundleWrite','subscribeListBundle','setDoc(','updateDoc(','onSnapshot(','hasPendingWrites','recordListenerSnapshot','writeListBundle','markFirestoreActual']):
                lo=max(1,idx-8); hi=min(len(s.splitlines()),idx+28)
                print(f'\n--- {idx}: {line.strip()} ---')
                ss=s.splitlines()
                for n in range(lo,hi+1): print(f'{n}: {ss[n-1]}')
          PY
      - name: Find favorites store implementation and subscriptions
        run: |
          grep -RIn --exclude-dir=node_modules -E "favoritesStore|favoriteSyncSignal|scheduleListBundleWrite\('musicNote'|subscribeListBundle\('musicNote'" src | head -n 600
