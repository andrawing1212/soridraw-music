name: TEMP 122 TEST visible like count readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-122-test-visible-like-count-readonly.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      TEST_BASE: https://soridraw-explore-test.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
      TEST_ORIGIN: https://test.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Read-only canonical counts and shared snapshots
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT t.id,t.title,
                   COALESCE(s.like_count,0) AS canonical_count,
                   (SELECT COUNT(*) FROM likes l WHERE l.track_id=t.id) AS relation_count,
                   COALESCE(d.likes,-1) AS derived_count,
                   t.published_at
            FROM tracks t
            LEFT JOIN track_stats s ON s.track_id=t.id
            LEFT JOIN explore_derived_tracks d ON d.id=t.id
            WHERE t.is_public=1
            ORDER BY t.published_at DESC
            LIMIT 20;
          " --json > "$RUNNER_TEMP/d1.json"

          curl -fsS -D "$RUNNER_TEMP/preview.headers" -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=latest&limit=40&__soridraw_r2_only=108" > "$RUNNER_TEMP/preview.json"
          curl -fsS -D "$RUNNER_TEMP/test.headers" -H "Origin: ${TEST_ORIGIN}" "${TEST_BASE}/v1/feed?sort=latest&limit=40&__soridraw_r2_only=108" > "$RUNNER_TEMP/test.json"
          curl -fsS -D "$RUNNER_TEMP/testrev.headers" -H "Origin: ${TEST_ORIGIN}" "${TEST_BASE}/v1/feed-revision?sort=latest" > "$RUNNER_TEMP/testrev.json"

          node <<'NODE'
          const fs=require('fs');
          const flat=p=>JSON.parse(fs.readFileSync(p,'utf8')).flatMap(x=>x?.results||[]);
          const d1=flat(process.env.RUNNER_TEMP+'/d1.json');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/preview.json','utf8'))?.data?.items||[];
          const t=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/test.json','utf8'))?.data?.items||[];
          const map=a=>new Map(a.map(x=>[String(x.id||x.trackId||''),x]));
          const pm=map(p), tm=map(t);
          console.log('=== VISIBLE LIKE COUNT PARITY ===');
          for(const row of d1){
            const pr=pm.get(String(row.id));
            const tr=tm.get(String(row.id));
            const pc=Number(pr?.likeCount ?? pr?.like_count ?? pr?.stats?.likeCount ?? pr?.stats?.like_count ?? -1);
            const tc=Number(tr?.likeCount ?? tr?.like_count ?? tr?.stats?.likeCount ?? tr?.stats?.like_count ?? -1);
            console.log(JSON.stringify({
              id:row.id,title:row.title,
              canonical:Number(row.canonical_count||0),
              relation:Number(row.relation_count||0),
              derived:Number(row.derived_count??-1),
              preview:pc,test:tc
            }));
          }
          console.log('PREVIEW_ITEMS='+p.length);
          console.log('TEST_ITEMS='+t.length);
          NODE
          echo "=== TEST REVISION ==="
          cat "$RUNNER_TEMP/testrev.json"
          echo
          grep -Ei 'x-soridraw-revision|x-soridraw-feed-revision|x-soridraw-feed-snapshot|x-soridraw-d1-read|cache-control' "$RUNNER_TEMP/test.headers" "$RUNNER_TEMP/testrev.headers" || true
