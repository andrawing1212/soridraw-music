name: Verify app519 PREVIEW Music Note Catalog pending recovery (No Deploy)
on:
  pull_request:
    branches: [preview]
    paths:
      - 'src/lib/userDataEngine.ts'
      - 'scripts/verify-519-catalog-pending-recovery.mjs'
      - '.github/workflows/verify-519-preview-catalog-pending.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-catalog-pending:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact pending queue merge, reload, retry and stale ACK
        run: node scripts/verify-519-catalog-pending-recovery.mjs
      - name: Preserve existing page-exit Catalog and Music Note draft behavior
        run: |
          node scripts/verify-081-page-exit-batch.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
      - name: Typecheck and build
        run: |
          npm run lint
          npm run build
