name: TEMP 107 Explore Cleanup

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-107-explore-cleanup.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply 107 cleanup
        run: python3 .deploy/temp-apply-107-explore-cleanup.py

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify 107
        run: node scripts/verify-107-explore-direct-count-zero-read.mjs

      - name: Verify existing Explore contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-105-explore-like-1min.mjs
          node scripts/verify-103-explore-like-event-batch.mjs
          node scripts/verify-102-explore-public-like-parity.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD -- | tee /tmp/changed.txt
          if grep -E '(^|/)(.*\.css|firebase.*rules|firestore.*rules|database.*rules|functions/|cloudflare/explore-worker/canonical/|cloudflare/explore-worker/patches/)' /tmp/changed.txt; then
            echo 'Unexpected UI/rules/functions/worker runtime change' >&2
            exit 1
          fi

      - name: Commit 107
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No 107 changes'; exit 1; }
          git commit -m 'fix: simplify Explore counts and warm profile cache'
          git push origin HEAD:preview
          echo "PRODUCT_107_SHA=$(git rev-parse HEAD)"
