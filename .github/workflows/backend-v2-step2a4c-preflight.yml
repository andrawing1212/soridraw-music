name: SORIDRAW Backend V2 Step 2-A4c Preflight

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4c-preflight.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-backend-v2-step2a4c-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5
      REQUIRED_RULES_SHA256: 4d9076eef20a71ad680b55ecc9acbe82e4aa08aa8138789c317476e66455e6dc
    steps:
      - name: Checkout exact preview
        uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 20.20.2
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Authenticate with existing service-account key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          create_credentials_file: true

      - name: Fresh quota gate and deployed Rules gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import urllib.parse
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          project = os.environ['FIREBASE_PROJECT_ID']
          required_rules_sha = os.environ['REQUIRED_RULES_SHA256']
          creds = service_account.Credentials.from_service_account_file(
              os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
              scopes=['https://www.googleapis.com/auth/cloud-platform'],
          )
          creds.refresh(Request())
          token = creds.token
          if not token:
              raise SystemExit('2-A4c OAuth token unavailable')
          headers = {'Authorization': f'Bearer {token}'}

          now = dt.datetime.now(dt.timezone.utc)
          start = now - dt.timedelta(hours=24)
          recent = now - dt.timedelta(minutes=15)

          def query_metric(candidates):
              last = None
              for metric in candidates:
                  params = {
                      'filter': f'metric.type = "{metric}"',
                      'interval.startTime': start.isoformat().replace('+00:00','Z'),
                      'interval.endTime': now.isoformat().replace('+00:00','Z'),
                      'view': 'FULL',
                      'pageSize': '1000',
                  }
                  url = f'https://monitoring.googleapis.com/v3/projects/{project}/timeSeries?{urllib.parse.urlencode(params)}'
                  r = requests.get(url, headers=headers, timeout=20)
                  if r.status_code in (400,404):
                      last = (metric, 0, 0, 0)
                      continue
                  r.raise_for_status()
                  data = r.json()
                  total = recent_total = points = 0
                  for series in data.get('timeSeries', []):
                      for p in series.get('points', []):
                          raw = p.get('value', {}).get('int64Value', p.get('value', {}).get('doubleValue', 0))
                          try: value = max(0, float(raw))
                          except Exception: value = 0
                          total += value
                          points += 1
                          end_time = p.get('interval', {}).get('endTime')
                          if end_time:
                              try:
                                  end_dt = dt.datetime.fromisoformat(end_time.replace('Z','+00:00'))
                                  if end_dt >= recent:
                                      recent_total += value
                              except Exception:
                                  pass
                  last = (metric, round(total), round(recent_total), points)
                  if points:
                      return last
              return last or (candidates[0],0,0,0)

          reads = query_metric(['firestore.googleapis.com/document/read_ops_count','firestore.googleapis.com/document/read_count'])
          writes = query_metric(['firestore.googleapis.com/document/write_ops_count','firestore.googleapis.com/document/write_count'])
          deletes = query_metric(['firestore.googleapis.com/document/delete_ops_count','firestore.googleapis.com/document/delete_count'])
          info = {
              'windowHours': 24,
              'reads': {'metric': reads[0], 'total': reads[1], 'recent15m': reads[2], 'points': reads[3]},
              'writes': {'metric': writes[0], 'total': writes[1], 'recent15m': writes[2], 'points': writes[3]},
              'deletes': {'metric': deletes[0], 'total': deletes[1], 'recent15m': deletes[2], 'points': deletes[3]},
              'policy': {'readsMax': 30000, 'writesMax': 10000, 'deletesMax': 5000},
          }
          print('A4C_FRESH_QUOTA=' + json.dumps(info, ensure_ascii=False))
          if reads[3] == 0 or writes[3] == 0:
              raise SystemExit('2-A4c quota gate blocked: monitoring read/write metric visibility incomplete')
          if reads[1] >= 30000 or writes[1] >= 10000 or deletes[1] >= 5000:
              raise SystemExit('2-A4c quota gate blocked: conservative 24h headroom insufficient')

          api = 'https://firebaserules.googleapis.com/v1'
          release = requests.get(f'{api}/projects/{project}/releases/cloud.firestore', headers=headers, timeout=20)
          release.raise_for_status()
          ruleset_name = release.json().get('rulesetName')
          if not ruleset_name:
              raise SystemExit('2-A4c deployed Rules release missing rulesetName')
          ruleset = requests.get(f'{api}/{ruleset_name}', headers=headers, timeout=20)
          ruleset.raise_for_status()
          files = ruleset.json().get('source', {}).get('files', [])
          if len(files) != 1:
              raise SystemExit(f'2-A4c deployed Rules file count unexpected: {len(files)}')
          content = files[0].get('content','').replace('\r\n','\n')
          sha = hashlib.sha256(content.encode('utf-8')).hexdigest()
          rules_info = {
              'ruleset': ruleset_name,
              'sha256': sha,
              'requiredSha256': required_rules_sha,
              'canonicalSong': 'match /songs/{songId}' in content,
              'v1Recent': 'match /user_recent_songs/{uid}' in content,
              'v1Favorites': 'match /favorites/{favoriteId}' in content,
          }
          print('A4C_DEPLOYED_RULES=' + json.dumps(rules_info, ensure_ascii=False))
          if sha != required_rules_sha:
              raise SystemExit('2-A4c Rules gate blocked: deployed Rules hash changed since M-008')
          if not all([rules_info['canonicalSong'], rules_info['v1Recent'], rules_info['v1Favorites']]):
              raise SystemExit('2-A4c Rules gate blocked: required canonical/V1 Rules marker absent')
          print('A4C_PREFLIGHT_GATES=PASS')
          PY

      - name: Inspect exact current V1 mutation boundary call-sites
        shell: bash
        run: |
          set -euo pipefail
          echo '=== App imports / boundary setup ==='
          grep -n -E "v1MutationBoundary|v2LiveMutation|indexedDbMirrorOutbox|firebase/firestore" src/App.tsx | head -80 || true
          echo '=== Boundary call-sites ==='
          grep -n -C 10 "runV1MutationBoundary" src/App.tsx || true
          echo '=== Stable ID occurrences ==='
          grep -n -C 6 "soridrawSongId\|ensureSoridrawSongId\|stableSongId" src/App.tsx || true
          echo '=== Current V2 runtime flags ==='
          grep -n -E "BACKEND_V2_RUNTIME_MODE|BACKEND_V2_WRITE_RUNTIME_ENABLED|BACKEND_V2_MIRROR_OUTBOX_RUNTIME_ENABLED|V1_DELETE_RUNTIME_ENABLED" src/data/v2LiveMutation.ts src/data/indexedDbMirrorOutbox.ts

      - name: Prove no Firebase data/deploy side effects
        if: always()
        shell: bash
        run: |
          echo 'A4C_PREFLIGHT_FIRESTORE_DOCUMENT_WRITES=0'
          echo 'A4C_PREFLIGHT_FIRESTORE_DOCUMENT_DELETES=0'
          echo 'A4C_PREFLIGHT_RULES_DEPLOYS=0'
          echo 'A4C_PREFLIGHT_FUNCTIONS_DEPLOYS=0'
          echo 'A4C_PREFLIGHT_HOSTING_DEPLOYS=0'
