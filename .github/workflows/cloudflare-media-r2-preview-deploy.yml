name: Cloudflare Media R2 Preview Deploy — Legacy HOLD

# app518 main-only safety gate.
# This default-branch workflow must not offer workflow_dispatch, trigger from
# preview pushes, read Cloudflare secrets, mutate R2, or deploy a Worker.
# The audited replacement controller is NOT activated by this change.
# Historical GitHub run re-runs and direct Cloudflare deploys remain separate
# operational risks: disabling this YAML does not revoke those permissions.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-media-r2-preview-deploy.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-media-r2-preview-deploy.yml'

permissions:
  contents: read

jobs:
  legacy-release-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm legacy preview Media release is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'LEGACY_MEDIA_PREVIEW_DIRECT_DEPLOY=DISABLED'
          echo 'NO_WORKER_DEPLOY=true'
          echo 'NO_R2_WRITE=true'
          echo 'NO_CLOUDFLARE_TOKEN=true'
          echo 'NO_MANUAL_RELEASE_ENTRYPOINT=true'
