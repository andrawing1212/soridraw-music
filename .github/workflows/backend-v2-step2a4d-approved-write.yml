name: SORIDRAW Backend V2 Step 2-A4d Approved Bounded Catch-up

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4d-approved-write.yml'

permissions:
  contents: read

jobs:
  catchup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: soridraw-app-866a5
      APPROVED_SCOPE: '2-A4d Music Note 36 bounded catch-up approved 2026-08-26 KST; 3 create + 33 musicNote false; Recent 0; V1 writes 0; V1 deletes 0; V2 deletes 0; no Rules Functions Hosting deploy'
      EXPECTED_FAVORITES: '742'
      EXPECTED_STABLE_FAVORITES: '1'
      EXPECTED_LEGACY_FAVORITES: '741'
      EXPECTED_LEGACY_ALIGNED: '705'
      EXPECTED_CREATES: '3'
      EXPECTED_FALSE_UPDATES: '33'
      EXPECTED_TOTAL_WRITES: '36'
      EXPECTED_RECENT_BUNDLES: '10'
      EXPECTED_RECENT_ITEMS: '68'
      EXPECTED_RECENT_STABLE_ITEMS: '0'
      EXPECTED_V2_BEFORE: '807'
      EXPECTED_V2_STABLE_BEFORE: '1'
      EXPECTED_V2_LEGACY_FAVORITE_BEFORE: '738'
      EXPECTED_V2_LEGACY_RECENT_BEFORE: '68'
      MAX_REVIEW_READS: '2000'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Fresh same-day Firestore quota gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check -q google-auth requests
          python3 - <<'PY'
          import datetime as dt
          import json, os, urllib.parse, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          project=os.environ['FIREBASE_PROJECT_ID']
          creds=service_account.Credentials.from_service_account_file(
              os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
              scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request())
          headers={'Authorization':f'Bearer {creds.token}','X-Goog-User-Project':project,'Accept':'application/json'}
          now=dt.datetime.now(dt.timezone.utc)
          kst=dt.timezone(dt.timedelta(hours=9))
          start=now.astimezone(kst).replace(hour=0,minute=0,second=0,microsecond=0).astimezone(dt.timezone.utc)

          def metric(candidates):
              last=(candidates[0],0,0)
              for name in candidates:
                  params={'filter':f'metric.type = "{name}"','interval.startTime':start.isoformat().replace('+00:00','Z'),'interval.endTime':now.isoformat().replace('+00:00','Z'),'view':'FULL','pageSize':'1000'}
                  r=requests.get(f'https://monitoring.googleapis.com/v3/projects/{project}/timeSeries?{urllib.parse.urlencode(params)}',headers=headers,timeout=20)
                  if r.status_code in (400,404):
                      continue
                  r.raise_for_status()
                  total=points=0
                  for series in r.json().get('timeSeries',[]):
                      for p in series.get('points',[]):
                          raw=p.get('value',{}).get('int64Value',p.get('value',{}).get('doubleValue',0))
                          try: total += max(0,float(raw))
                          except Exception: pass
                          points += 1
                  last=(name,round(total),points)
                  if points: return last
              return last

          reads=metric(['firestore.googleapis.com/document/read_ops_count','firestore.googleapis.com/document/read_count'])
          writes=metric(['firestore.googleapis.com/document/write_ops_count','firestore.googleapis.com/document/write_count'])
          deletes=metric(['firestore.googleapis.com/document/delete_ops_count','firestore.googleapis.com/document/delete_count'])
          safe_read_cap=min(10000,max(0,50000-reads[1]-10000))
          safe_write_cap=min(5000,max(0,20000-writes[1]-5000))
          result={'kstDate':now.astimezone(kst).date().isoformat(),'reads':reads[1],'writes':writes[1],'deletes':deletes[1],'safeReadCap':safe_read_cap,'safeWriteCap':safe_write_cap,'requiredReads':2000,'requiredWrites':36}
          print('A4D_WRITE_FRESH_QUOTA='+json.dumps(result,ensure_ascii=False))
          if reads[2] == 0 or writes[2] == 0:
              raise SystemExit('quota metrics incomplete')
          if safe_read_cap < 2000 or safe_write_cap < 36 or deletes[1] >= 5000:
              raise SystemExit('fresh quota gate blocked')
          print('A4D_WRITE_FRESH_QUOTA_GATE=PASS')
          PY

      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts

      - name: Reclassify exact candidates and execute one atomic 36-write transaction
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const projectId=process.env.FIREBASE_PROJECT_ID;
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          const approved=String(process.env.APPROVED_SCOPE||'');
          if (!approved.includes('36') || !approved.includes('3 create') || !approved.includes('33 musicNote false') || !approved.includes('Recent 0')) throw new Error('EXPLICIT_APPROVAL_MARKER_MISSING');

          initializeApp({credential:applicationDefault(),projectId});
          const db=getFirestore();
          const stable=/^sd_[0-9a-f]{32}$/;
          const reserved=new Set(['schemaVersion','musicNote','recentVisible','v2UpdatedAtMs','v2MutationId','legacyRecentIndex','legacyFavoriteId','legacyFavoriteKey']);
          const activeFavorite=(d)=>Boolean(d && d.saved !== false && d.favoriteRemoved !== true);
          const deterministicFavoriteSongId=(path)=>`v1f_${crypto.createHash('sha256').update(path).digest('hex').slice(0,32)}`;
          const norm=(v)=>{
            if (v === null || v === undefined) return v ?? null;
            if (typeof v?.toMillis === 'function') return {__timestampMs:v.toMillis()};
            if (typeof v?.path === 'string' && v.constructor?.name === 'DocumentReference') return {__ref:v.path};
            if (typeof v?.latitude === 'number' && typeof v?.longitude === 'number') return {__geo:[v.latitude,v.longitude]};
            if (Buffer.isBuffer(v) || v instanceof Uint8Array) return {__bytes:Buffer.from(v).toString('base64')};
            if (Array.isArray(v)) return v.map(norm);
            if (typeof v === 'object') {
              const out={}; for (const k of Object.keys(v).sort()) out[k]=norm(v[k]); return out;
            }
            return v;
          };
          const equal=(a,b)=>JSON.stringify(norm(a))===JSON.stringify(norm(b));
          const payloadMismatch=(src,dst)=>{
            if (!dst) return true;
            for (const [k,v] of Object.entries(src||{})) {
              if (reserved.has(k)) continue;
              if (!Object.prototype.hasOwnProperty.call(dst,k) || !equal(v,dst[k])) return true;
            }
            return false;
          };

          const [favSnap,recentSnap,v2Snap]=await Promise.all([
            db.collection('favorites').get(),
            db.collection('user_recent_songs').get(),
            db.collectionGroup('songs').get(),
          ]);
          const v2Docs=v2Snap.docs.filter(d=>/^users\/[^/]+\/songs\/[^/]+$/.test(d.ref.path));
          const v2ByStable=new Map();
          const v2ByLegacyFavorite=new Map();
          const v2ByPath=new Map(v2Docs.map(d=>[d.ref.path,d]));
          let v2Stable=0,v2LegacyFavorite=0,v2LegacyRecent=0;
          for (const d of v2Docs) {
            const data=d.data()||{};
            const uid=String(data.uid||d.ref.parent.parent?.id||'').trim();
            if (stable.test(d.id)) { v2Stable++; v2ByStable.set(`${uid}|${d.id}`,d); }
            const legacyId=String(data.legacyFavoriteId||'').trim();
            if (legacyId) { v2LegacyFavorite++; v2ByLegacyFavorite.set(`${uid}|${legacyId}`,d); }
            if (Object.prototype.hasOwnProperty.call(data,'legacyRecentIndex')) v2LegacyRecent++;
          }

          const creates=[]; const updates=[];
          const stats={total:favSnap.size,stableSource:0,stableAligned:0,stableMissing:0,stableMismatch:0,legacySource:0,legacyAligned:0,legacyMissing:0,legacyMismatch:0,payloadMismatch:0,missingUid:0};
          for (const sourceDoc of favSnap.docs) {
            const src=sourceDoc.data()||{};
            const uid=String(src.uid||'').trim();
            if (!uid) {stats.missingUid++; continue;}
            const sid=String(src.soridrawSongId||'').trim();
            const want=activeFavorite(src);
            if (stable.test(sid)) {
              stats.stableSource++;
              const target=v2ByStable.get(`${uid}|${sid}`);
              if (!target) {stats.stableMissing++; continue;}
              const p=payloadMismatch(src,target.data()); if (p) stats.payloadMismatch++;
              if (target.data().musicNote !== want || p) stats.stableMismatch++; else stats.stableAligned++;
              continue;
            }
            stats.legacySource++;
            const target=v2ByLegacyFavorite.get(`${uid}|${sourceDoc.id}`);
            if (!target) {
              stats.legacyMissing++;
              const targetId=deterministicFavoriteSongId(sourceDoc.ref.path);
              const targetPath=`users/${uid}/songs/${targetId}`;
              if (v2ByPath.has(targetPath)) throw new Error(`IDENTITY_COLLISION:${targetPath}`);
              if (!want) throw new Error('MISSING_LEGACY_TARGET_IS_NOT_ACTIVE');
              creates.push({uid,sourceDoc,targetId,targetPath});
              continue;
            }
            const expectedId=deterministicFavoriteSongId(sourceDoc.ref.path);
            if (target.id !== expectedId) throw new Error('LEGACY_TARGET_FORMULA_MISMATCH');
            const p=payloadMismatch(src,target.data()); if (p) stats.payloadMismatch++;
            const mismatch=target.data().musicNote !== want;
            if (!mismatch && !p) {stats.legacyAligned++; continue;}
            if (p) throw new Error('LEGACY_PAYLOAD_DRIFT');
            stats.legacyMismatch++;
            if (want || target.data().musicNote !== true || src.saved !== false || src.favoriteRemoved !== true) throw new Error('UNAPPROVED_LEGACY_STATE_DIRECTION');
            updates.push({uid,sourceDoc,targetRef:target.ref,targetId:target.id});
          }

          let recentItems=0,recentStable=0;
          for (const d of recentSnap.docs) {
            const songs=Array.isArray(d.data()?.songs)?d.data().songs:[];
            recentItems += songs.length;
            for (const song of songs) if (stable.test(String(song?.soridrawSongId||'').trim())) recentStable++;
          }

          const expected={
            favorites:Number(process.env.EXPECTED_FAVORITES),stableFavorites:Number(process.env.EXPECTED_STABLE_FAVORITES),legacyFavorites:Number(process.env.EXPECTED_LEGACY_FAVORITES),legacyAligned:Number(process.env.EXPECTED_LEGACY_ALIGNED),creates:Number(process.env.EXPECTED_CREATES),updates:Number(process.env.EXPECTED_FALSE_UPDATES),totalWrites:Number(process.env.EXPECTED_TOTAL_WRITES),recentBundles:Number(process.env.EXPECTED_RECENT_BUNDLES),recentItems:Number(process.env.EXPECTED_RECENT_ITEMS),recentStable:Number(process.env.EXPECTED_RECENT_STABLE_ITEMS),v2Before:Number(process.env.EXPECTED_V2_BEFORE),v2Stable:Number(process.env.EXPECTED_V2_STABLE_BEFORE),v2LegacyFavorite:Number(process.env.EXPECTED_V2_LEGACY_FAVORITE_BEFORE),v2LegacyRecent:Number(process.env.EXPECTED_V2_LEGACY_RECENT_BEFORE)
          };
          const snapshot={stats,creates:creates.length,updates:updates.length,totalWrites:creates.length+updates.length,recentBundles:recentSnap.size,recentItems,recentStable,v2Before:v2Docs.length,v2Stable,v2LegacyFavorite,v2LegacyRecent};
          console.log('A4D_WRITE_PREFLIGHT='+JSON.stringify(snapshot));
          const strictPass=
            stats.total===expected.favorites && stats.stableSource===expected.stableFavorites && stats.stableAligned===1 && stats.stableMissing===0 && stats.stableMismatch===0 && stats.legacySource===expected.legacyFavorites && stats.legacyAligned===expected.legacyAligned && stats.legacyMissing===expected.creates && stats.legacyMismatch===expected.updates && stats.payloadMismatch===0 && stats.missingUid===0 &&
            creates.length===expected.creates && updates.length===expected.updates && creates.length+updates.length===expected.totalWrites &&
            recentSnap.size===expected.recentBundles && recentItems===expected.recentItems && recentStable===expected.recentStable &&
            v2Docs.length===expected.v2Before && v2Stable===expected.v2Stable && v2LegacyFavorite===expected.v2LegacyFavorite && v2LegacyRecent===expected.v2LegacyRecent;
          if (!strictPass) throw new Error('APPROVED_36_IDENTITY_SNAPSHOT_DRIFT_STOP_BEFORE_WRITE');

          const identityLines=[
            ...creates.map(c=>`create|${c.uid}|${c.sourceDoc.id}|${c.targetId}`),
            ...updates.map(u=>`update-false|${u.uid}|${u.sourceDoc.id}|${u.targetId}`),
          ].sort();
          const candidateHash=crypto.createHash('sha256').update(identityLines.join('\n')).digest('hex');
          console.log('A4D_WRITE_CANDIDATE_HASH='+candidateHash);

          const writeMs=Date.now();
          await db.runTransaction(async tx=>{
            const sourceRefs=[...creates.map(c=>c.sourceDoc.ref),...updates.map(u=>u.sourceDoc.ref)];
            const targetRefs=[...creates.map(c=>db.doc(c.targetPath)),...updates.map(u=>u.targetRef)];
            const sourceSnaps=[]; const targetSnaps=[];
            for (const ref of sourceRefs) sourceSnaps.push(await tx.get(ref));
            for (const ref of targetRefs) targetSnaps.push(await tx.get(ref));

            for (let i=0;i<creates.length;i++) {
              const c=creates[i], s=sourceSnaps[i], t=targetSnaps[i];
              if (!s.exists || t.exists) throw new Error('CREATE_IDENTITY_DRIFT_IN_TRANSACTION');
              const src=s.data()||{};
              if (String(src.uid||'').trim()!==c.uid || stable.test(String(src.soridrawSongId||'').trim()) || !activeFavorite(src)) throw new Error('CREATE_SOURCE_DRIFT_IN_TRANSACTION');
            }
            for (let j=0;j<updates.length;j++) {
              const i=creates.length+j, u=updates[j], s=sourceSnaps[i], t=targetSnaps[i];
              if (!s.exists || !t.exists) throw new Error('UPDATE_IDENTITY_DRIFT_IN_TRANSACTION');
              const src=s.data()||{}, dst=t.data()||{};
              if (String(src.uid||'').trim()!==u.uid || stable.test(String(src.soridrawSongId||'').trim())) throw new Error('UPDATE_SOURCE_ID_DRIFT_IN_TRANSACTION');
              if (activeFavorite(src) || src.saved !== false || src.favoriteRemoved !== true) throw new Error('UPDATE_SOURCE_STATE_DRIFT_IN_TRANSACTION');
              if (String(dst.legacyFavoriteId||'').trim()!==s.id || t.id!==deterministicFavoriteSongId(s.ref.path) || dst.musicNote!==true || payloadMismatch(src,dst)) throw new Error('UPDATE_TARGET_DRIFT_IN_TRANSACTION');
            }

            for (let i=0;i<creates.length;i++) {
              const c=creates[i], src=sourceSnaps[i].data()||{};
              const favoriteKey=typeof src.favoriteKey==='string' && src.favoriteKey.trim()?src.favoriteKey.trim():null;
              tx.create(db.doc(c.targetPath),{
                ...src,
                schemaVersion:2,
                musicNote:true,
                recentVisible:false,
                v2UpdatedAtMs:writeMs,
                legacyFavoriteId:c.sourceDoc.id,
                ...(favoriteKey?{legacyFavoriteKey:favoriteKey}:{}),
              });
            }
            for (const u of updates) tx.update(u.targetRef,{musicNote:false,v2UpdatedAtMs:writeMs});
          });

          console.log('A4D_WRITE_EXECUTED='+JSON.stringify({creates:creates.length,updatesToMusicNoteFalse:updates.length,totalWrites:creates.length+updates.length,v1Writes:0,v1Deletes:0,v2Deletes:0,recentWrites:0,rulesDeploys:0,functionsDeploys:0,hostingDeploys:0,candidateHash}));
          if (creates.length+updates.length !== 36) throw new Error('POST_WRITE_COUNT_ASSERTION_FAILED');
          NODE

      - name: Prove approved write scope
        run: |
          echo 'A4D_V1_WRITES=0'
          echo 'A4D_V1_DELETES=0'
          echo 'A4D_V2_WRITES=36'
          echo 'A4D_V2_DELETES=0'
          echo 'A4D_RECENT_WRITES=0'
          echo 'A4D_RULES_DEPLOYS=0'
          echo 'A4D_FUNCTIONS_DEPLOYS=0'
          echo 'A4D_HOSTING_DEPLOYS=0'
