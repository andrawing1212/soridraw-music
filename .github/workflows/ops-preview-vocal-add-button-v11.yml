name: OPS Preview Vocal Add Button V11
on:
  push:
    branches: [ops-preview-vocal-add-button-v11]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply exact source fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview
          git switch --detach origin/preview
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git diff --check
          git diff -- src/App.tsx src/components/studio/studioLayout.css
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Publish validated source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add src/App.tsx src/components/studio/studioLayout.css
          git commit -m 'fix(preview): make light vocal add buttons truly white'
          git branch -f preview-vocal-add-light-source-v13 HEAD
          git push origin preview-vocal-add-light-source-v13 --force
