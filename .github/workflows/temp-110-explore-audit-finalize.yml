name: TEMP 110 Explore Audit Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-110-explore-audit-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Record audit and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python .audit/finalize-explore-110-audit.py
          rm -f .audit/finalize-explore-110-audit.py
          rm -f .github/workflows/temp-110-explore-full-readonly-audit.yml
          rm -f .github/workflows/temp-110-explore-audit-finalize.yml
          git diff --check
          git config user.name soridraw-audit-bot
          git config user.email actions@users.noreply.github.com
          git add DOCS/CURRENT_RELEASE_STATE.md DOCS/NEXT_CODEX_TASK.md .audit .github/workflows
          git commit -m "docs: record Explore 110 leak audit and clean temp files"
          git push origin HEAD:preview
          echo "FINAL_PREVIEW_HEAD=$(git rev-parse HEAD)"
