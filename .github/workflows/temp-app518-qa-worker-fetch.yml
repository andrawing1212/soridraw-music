name: APP518 QA Staged Fetch Source — One-shot
on:
  push:
    branches:
      - fix/app518-qa-worker-fetch-staging
    paths:
      - '.github/workflows/temp-app518-qa-worker-fetch.yml'
      - 'qa/app518/live/stage-pinned-worker518.mjs'
      - 'qa/app518/live/verify-signed-worker-entry518.mjs'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable candidate QA staging and deny HTTP redirects
        shell: bash
        run: |
          set -euo pipefail
          SHA=864f796da24413309567198c9de502b13cdedd50
          git cat-file -e "$SHA^{commit}"
          dir="$RUNNER_TEMP/app518-pinned-candidate"
          git worktree add --detach "$dir" "$SHA"
          npm --prefix "$dir/cloudflare/media-worker" install --ignore-scripts --no-audit --no-fund --no-save
          node --check qa/app518/live/stage-pinned-worker518.mjs
          node --check qa/app518/live/verify-signed-worker-entry518.mjs
          APP518_PINNED_CANDIDATE_DIR="$dir" node qa/app518/live/verify-signed-worker-entry518.mjs
          echo 'APP518_QA_FIREBASE_FETCH_STAGED_SOURCE=PASS; CLOUD_MUTATIONS=0'
