name: TEMP 084 Fix Patch Source

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/temp-084-fix.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix generated-template interpolation and validate patch syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('cloudflare/explore-worker/patches/051-publication-write-returning.mjs')
          text = path.read_text()
          replacements = {
              "sets.push(\\`${column}=?\\`);": "sets.push(\\`\\${column}=?\\`);",
              "guards.push(\\`${column}<>?\\`);": "guards.push(\\`\\${column}<>?\\`);",
          }
          for before, after in replacements.items():
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'084 interpolation anchor count={count}: {before}')
              text = text.replace(before, after)
          path.write_text(text)
          PY
          node --check cloudflare/explore-worker/patches/051-publication-write-returning.mjs
          tmp="$RUNNER_TEMP/worker051"
          mkdir -p "$tmp"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$tmp/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$tmp" node cloudflare/explore-worker/patches/051-publication-write-returning.mjs
          node --check "$tmp/worker.js"

      - name: Commit corrected patch source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'soridraw-release-bot'
          git config user.email 'soridraw-release-bot@users.noreply.github.com'
          git add cloudflare/explore-worker/patches/051-publication-write-returning.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_PATCH_CHANGE'; exit 1; }
          git commit -m 'fix(preview): correct 084 patch template escaping'
          git push origin HEAD:preview
          echo "PATCH_FIX_COMMIT=$(git rev-parse HEAD)"
