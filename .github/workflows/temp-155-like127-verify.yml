name: TEMP 155 Like127 Legacy and Retry Verification
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-155-like127-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: App127 and past regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-127-atomic-personal-like.mjs
          node scripts/verify-126-explore-entry-like-count.mjs
          node scripts/verify-125-like-preservation.mjs
          node scripts/verify-124-mobile-shared-cache-repair.mjs
          node scripts/verify-123-shared-like-cache-repair.mjs
          node scripts/verify-110-explore-liked-public-count.mjs
      - name: Worker072 candidate generate from unchanged 071
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | cut -d' ' -f1)"
          test "$actual" = b170d05385c3096a98033675a9acbb63b40148bf782017c326845b7ea4c17813
          mkdir -p "$RUNNER_TEMP/worker072"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$RUNNER_TEMP/worker072/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$RUNNER_TEMP/worker072" node cloudflare/explore-worker/patches/072-personal-like-r2-revision.mjs
          node --check "$RUNNER_TEMP/worker072/worker.js"
          node --check cloudflare/explore-worker/canonical/preview-entry.js
          node - "$RUNNER_TEMP/worker072/worker.js" <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync(process.argv[2],'utf8');
          const route=s.slice(s.indexOf('async function handleMyLikeRevision072('), s.indexOf('async function handleMyLikedTracks052('));
          if(!route.includes('requireExploreAuth(request)')||!route.includes('bucket.head(exploreLikeR2Key(authContext.uid))')||route.includes('env.DB')||route.includes('caches.default'))throw Error('072 private R2-only source invalid');
          const count=s.split('url.pathname === "/v1/me/likes-revision"').length-1;
          if(count!==1)throw Error('072 route count '+count);
          console.log('WORKER072_PRIVATE_REVISION_D1_R0_W0_STATIC=PASS');
          NODE
          echo 'WORKER071_SOURCE_UNCHANGED=PASS'
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Boundaries
        run: echo 'DRY_RUN_ONLY=PASS DEPLOY=0 USER_DATA_WRITE=0 TEST_PRODUCTION_UNCHANGED=PASS'
