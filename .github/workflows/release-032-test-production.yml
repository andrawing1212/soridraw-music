name: SORIDRAW 032 TEST PRODUCTION RELEASE

on:
  push:
    branches: [release-032-deploy-control]
    paths:
      - '.github/workflows/release-032-test-production.yml'

permissions:
  contents: read

concurrency:
  group: soridraw-032-test-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PREVIEW_SHA: 9f372b538a1f03eb7ac8c15a9a4b9d1141a36d65
      MAIN_RELEASE_SHA: 77d57c5dd0af4f529f9bd0bd37b00e36f5b8b72c
      FIREBASE_PROJECT: soridraw
      TEST_MEDIA_URL: https://soridraw-media-test.andrawing1212.workers.dev
      PROD_MEDIA_URL: https://soridraw-media.andrawing1212.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact approved MAIN release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_RELEASE_SHA }}
          fetch-depth: 0
          path: app

      - name: Guard approved PREVIEW and MAIN refs
        shell: bash
        run: |
          set -euo pipefail
          cd app
          test "$(git rev-parse HEAD)" = "$MAIN_RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_SHA"
          git fetch origin "$PREVIEW_SHA" --quiet
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse $PREVIEW_SHA^{tree})"
          echo 'SOURCE_GUARD_032=PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install exact dependencies
        working-directory: app
        run: npm ci

      - name: TypeScript and 029-032 regression checks
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          echo 'REGRESSION_029_032=PASS'

      - name: Build exact approved release
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/release-index.sha"
          echo 'BUILD_032=PASS'

      - name: Set up Node.js 22 for Cloudflare deploy
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy changed media Worker to TEST
        working-directory: app/cloudflare/media-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx wrangler deploy --env test
          echo 'CLOUDFLARE_TEST_DEPLOY_032=PASS'

      - name: Verify TEST media Worker
        shell: bash
        run: |
          set -euo pipefail
          ok=''
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 30 "$TEST_MEDIA_URL/health" -o "$RUNNER_TEMP/test-health.json" && grep -q '"ok":true' "$RUNNER_TEMP/test-health.json"; then ok=yes; break; fi
            sleep 4
          done
          test "$ok" = yes
          for path in musicNote library; do
            code="$(curl -sS --max-time 30 -o /dev/null -D "$RUNNER_TEMP/test-$path.headers" -w '%{http_code}' -X OPTIONS -H 'Origin: https://test.soridraw.com' -H 'Access-Control-Request-Method: GET' "$TEST_MEDIA_URL/v1/catalog/$path")"
            test "$code" = '204'
            grep -qi '^access-control-allow-origin: https://test.soridraw.com' "$RUNNER_TEMP/test-$path.headers"
          done
          echo 'CLOUDFLARE_TEST_VERIFY_032=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Verify TEST and PRODUCTION Hosting sites
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest hosting:sites:list --project "$FIREBASE_PROJECT" --json > "$RUNNER_TEMP/sites.json"
          node - "$RUNNER_TEMP/sites.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const arrays = [payload?.result?.sites, payload?.result, payload?.sites, payload];
          const sites = arrays.find(Array.isArray) || [];
          const ids = sites.map((site) => {
            const raw = String(site?.site || site?.siteId || site?.id || site?.name || '');
            return raw.includes('/') ? raw.split('/').filter(Boolean).pop() : raw;
          }).filter(Boolean);
          if (!ids.includes('soridraw-test')) throw new Error('soridraw-test Hosting site missing');
          if (!ids.includes('soridraw')) throw new Error('soridraw production Hosting site missing');
          console.log('FIREBASE_SITE_GUARD=PASS');
          NODE

      - name: Deploy exact build to Firebase TEST
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-test.json --non-interactive
          echo 'FIREBASE_TEST_DEPLOY_032=PASS'

      - name: Verify TEST exact build
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for origin in 'https://soridraw-test.web.app' 'https://test.soridraw.com'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/?release=032-$attempt" -o "$RUNNER_TEMP/test-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/test-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 5
            done
            test "$ok" = yes
            echo "TEST_FRONTEND_PASS=$origin"
          done
          echo 'TEST_FULL_STACK_032=PASS'

      - name: Deploy changed media Worker to PRODUCTION
        working-directory: app/cloudflare/media-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env production
          echo 'CLOUDFLARE_PRODUCTION_DEPLOY_032=PASS'

      - name: Verify PRODUCTION media Worker
        shell: bash
        run: |
          set -euo pipefail
          ok=''
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 30 "$PROD_MEDIA_URL/health" -o "$RUNNER_TEMP/prod-health.json" && grep -q '"ok":true' "$RUNNER_TEMP/prod-health.json"; then ok=yes; break; fi
            sleep 4
          done
          test "$ok" = yes
          for path in musicNote library; do
            code="$(curl -sS --max-time 30 -o /dev/null -D "$RUNNER_TEMP/prod-$path.headers" -w '%{http_code}' -X OPTIONS -H 'Origin: https://soridraw.com' -H 'Access-Control-Request-Method: GET' "$PROD_MEDIA_URL/v1/catalog/$path")"
            test "$code" = '204'
            grep -qi '^access-control-allow-origin: https://soridraw.com' "$RUNNER_TEMP/prod-$path.headers"
          done
          echo 'CLOUDFLARE_PRODUCTION_VERIFY_032=PASS'

      - name: Deploy exact build to Firebase PRODUCTION
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.json --non-interactive
          echo 'FIREBASE_PRODUCTION_DEPLOY_032=PASS'

      - name: Verify PRODUCTION exact build
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for origin in 'https://soridraw.web.app' 'https://soridraw.com'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/?release=032-$attempt" -o "$RUNNER_TEMP/prod-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/prod-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 5
            done
            test "$ok" = yes
            echo "PRODUCTION_FRONTEND_PASS=$origin"
          done
          echo 'PRODUCTION_FULL_STACK_032=PASS'

      - name: Final release result
        shell: bash
        run: |
          set -euo pipefail
          echo "PREVIEW_SHA=$PREVIEW_SHA"
          echo "MAIN_RELEASE_SHA=$MAIN_RELEASE_SHA"
          echo 'FUNCTIONS_CHANGED=false'
          echo 'RULES_CHANGED=false'
          echo 'EXPLORE_WORKER_CHANGED=false'
          echo 'MEDIA_WORKER_CHANGED=true'
          echo 'SORIDRAW_RELEASE_032_TEST_PRODUCTION=PASS'
