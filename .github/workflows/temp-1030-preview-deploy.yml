name: Temp 1030 Firebase Preview Deploy

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1030-preview-deploy.yml']

permissions:
  contents: read

concurrency:
  group: firebase-hosting-custom-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_APP_COMMIT: 8a32ebdd7bff3bde2d985e5a03633ea881a9f1ec
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20

      - name: Guard exact preview application source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_APP_COMMIT" HEAD
          if ! git diff --quiet "$EXPECTED_APP_COMMIT"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json scripts/verify-music-note-pagination-order.mjs scripts/verify-music-note-normalization-stage1.mjs; then
            echo 'Application source changed after the approved Stage1 commit.'
            git diff --name-only "$EXPECTED_APP_COMMIT"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json scripts/verify-music-note-pagination-order.mjs scripts/verify-music-note-normalization-stage1.mjs
            exit 2
          fi
          grep -q 'SORIDRAW_MUSIC_NOTE_NORMALIZATION_STAGE1_1030' src/App.tsx
          grep -q 'SORIDRAW_MUSIC_NOTE_STAGE1_PAGE_SIZED_CACHE_REUSE_1030B' src/App.tsx
          echo '[Stage1] exact application source guard: PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Music Note pagination safety guard
        run: node scripts/verify-music-note-pagination-order.mjs

      - name: Music Note normalization Stage1 guard
        run: node scripts/verify-music-note-normalization-stage1.mjs

      - name: Build preview app
        run: npm run build

      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production before preview deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/production-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"

      - name: Deploy Firebase PREVIEW hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project soridraw \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo '[Stage1] Firebase PREVIEW hosting deploy: PASS'

      - name: Verify exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok='yes'
                  echo "[Stage1] exact deployed build PASS: $url"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = 'yes' || { echo "Preview verification failed: $url"; exit 7; }
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' https://soridraw.web.app/ -o "$RUNNER_TEMP/production-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          cmp "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '[Stage1] production unchanged: PASS'

      - name: Result
        run: |
          echo 'Firebase PREVIEW deployment completed.'
          echo 'Preview URL: https://preview.soridraw.com/'
          echo 'No main, TEST, PRODUCTION, Functions, Firestore rules, Database rules, or Cloudflare deployment was performed.'
