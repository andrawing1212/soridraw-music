name: APP717 PREVIEW Follow Source GET-only
on:
  pull_request:
    branches: [preview]
    paths:
      - '.github/workflows/app717-follow-state-live-readonly.yml'
      - 'scripts/app717-preview-follow-state-readonly.mjs'
      - 'cloudflare/explore-worker/candidates/717-follow-state-target-postread.mjs'
permissions:
  contents: read
concurrency:
  group: soridraw-app717-readonly
  cancel-in-progress: false
jobs:
  readonly:
    if: github.event.pull_request.number == 1211 && github.event.pull_request.head.repo.full_name == 'andrawing1212/soridraw-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: GET-only actual PREVIEW Worker module and binding preflight
        run: |
          set -euo pipefail
          node --check scripts/app717-preview-follow-state-readonly.mjs
          node scripts/app717-preview-follow-state-readonly.mjs
