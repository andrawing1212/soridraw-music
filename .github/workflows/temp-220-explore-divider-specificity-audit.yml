name: TEMP 220 Explore Divider Specificity Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-220-explore-divider-specificity-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Specificity and scope guard
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'html[data-soridraw-theme="studio-black"] body #root .soridraw-app-root .soridraw-studio-page-frame[data-workspace-view="explore"]>.soridraw-studio-masthead-divider{display:none!important;right:0!important}' src/components/explore/explore.css
          git diff --exit-code c9e98ed5207f68fec87f1a01c8ba354e5f949710 HEAD -- src/components/studio/studioLayout.css src/pages/ExplorePage.tsx cloudflare/explore-worker functions firestore.rules database.rules.json
          echo 'EXPLORE_ONLY_DIVIDER_OVERRIDE=PASS'
          echo 'CANONICAL_STUDIO_DIVIDER_UNCHANGED=true'
          echo 'OTHER_PAGE_DIVIDER_UNCHANGED=true'
          echo 'SERVER_IO_CHANGED=false'
          echo 'AUDIT_220=PASS'
