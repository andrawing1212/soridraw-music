name: TEMP 338 Indexed Genre Fallback Apply

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-338-indexed-genre-fallback.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-338-indexed-genre-fallback
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply app338 Worker patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply_338_genre_indexed_fallback.py
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node scripts/verify-338-genre-indexed-fallback.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-336-r2-hybrid-read.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-197-new-public-track-like.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-210-targeted-personal-like-settlement.mjs
      - name: Verify live query plans are indexed only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN SELECT t.id FROM tracks t INDEXED BY idx_tracks_primary_genre_latest WHERE t.primary_genre='Ballad' AND t.is_public=1 AND t.status='published' ORDER BY t.published_at DESC,t.id DESC LIMIT 41" --json > "$RUNNER_TEMP/primary.json"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN SELECT t.id FROM track_tags tt INDEXED BY idx_track_tags_kind_value_track JOIN tracks t ON t.id=tt.track_id WHERE tt.kind='genre' AND tt.value='Ballad' AND (t.primary_genre IS NULL OR TRIM(t.primary_genre)='') AND t.is_public=1 AND t.status='published' ORDER BY t.published_at DESC,t.id DESC LIMIT 41" --json > "$RUNNER_TEMP/tags.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/primary.json','utf8')).flatMap(x=>x.results||[]).map(x=>String(x.detail||'')).join(' | ');
          const t=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/tags.json','utf8')).flatMap(x=>x.results||[]).map(x=>String(x.detail||'')).join(' | ');
          if(!p.includes('idx_tracks_primary_genre_latest') || /SCAN t\b/i.test(p)) throw Error('primary genre plan not indexed: '+p);
          if(!t.includes('idx_track_tags_kind_value_track') || /SCAN tt\b/i.test(t)) throw Error('tag genre plan not indexed: '+t);
          console.log('APP338_PRIMARY_GENRE_PLAN=PASS '+p);
          console.log('APP338_TAG_GENRE_PLAN=PASS '+t);
          NODE
      - name: Commit verified app338 product and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-338-indexed-genre-fallback.yml .github/workflows/temp-338-genre-search-plan.yml
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git commit -m 'fix(preview): index Korean genre fallback'
          git push origin HEAD:preview
          echo "APP338_PRODUCT_COMMIT=$(git rev-parse HEAD)"
