name: SORIDRAW Explore R2 Feed Like PREVIEW 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-deploy-explore-r2-feed-like-20260904.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
      D1_NAME: soridraw-explore-preview
      D1_ID: aaaa0fd9-1f34-4c97-9a41-11ef75d31f0f
      R2_BUCKET: soridraw-profile-media-preview
      BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      SEED_PATH: /__soridraw_seed_explore_cost_r2_20260904_a91f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare seed and final Workers from active PREVIEW
        shell: bash
        run: |
          set -euo pipefail
          seed_token="$(openssl rand -hex 24)"
          echo "SEED_TOKEN=$seed_token" >> "$GITHUB_ENV"
          rm -rf cloudflare/explore-worker/.cost-r2-temp cloudflare/explore-worker/.cost-r2-final
          mkdir -p cloudflare/explore-worker/.cost-r2-temp cloudflare/explore-worker/.cost-r2-final
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;
            const ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(!v?.version_id||Number(v.percentage||0)<99.99)throw new Error('active PREVIEW Worker is not 100%');
            const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`),mods=ver.modules||[];
            const settings=await g(`${base}/settings`),bindings=settings.bindings||[];
            const d1=bindings.find(b=>b.type==='d1'&&b.name==='DB'),r2=bindings.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA');
            if(!d1||(d1.id||d1.database_id)!==process.env.D1_ID)throw new Error('PREVIEW D1 binding mismatch');
            if(!r2||r2.bucket_name!==process.env.R2_BUCKET)throw new Error('PREVIEW R2 binding mismatch');
            for(const dir of ['cloudflare/explore-worker/.cost-r2-temp','cloudflare/explore-worker/.cost-r2-final']){
              for(const m of mods){const p=path.join(dir,m.name||'worker.js');fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,Buffer.from(m.content_base64,'base64'))}
              const main=ver.main_module||mods[0]?.name||'worker.js'; if(main!=='worker.js')throw new Error(`unexpected main ${main}`);
              const cfg={name:W,main:'./worker.js',compatibility_date:String(settings.compatibility_date||'2026-08-28').slice(0,10),keep_vars:true,d1_databases:[{binding:'DB',database_name:process.env.D1_NAME,database_id:process.env.D1_ID}],r2_buckets:[{binding:'PROFILE_MEDIA',bucket_name:process.env.R2_BUCKET}]};
              if(settings.compatibility_flags?.length)cfg.compatibility_flags=settings.compatibility_flags;
              fs.writeFileSync(path.join(dir,'wrangler.jsonc'),JSON.stringify(cfg,null,2)+'\n');
            }
            console.log('BASELINE_VERSION='+v.version_id);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/cloudflare/explore-worker/.cost-r2-temp" \
          SORIDRAW_EXPLORE_COST_SEED_PATH="$SEED_PATH" \
          SORIDRAW_EXPLORE_COST_SEED_TOKEN="$seed_token" \
          node cloudflare/explore-worker/patches/009-explore-r2-feed-like-bundles.mjs
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/cloudflare/explore-worker/.cost-r2-final" \
          node cloudflare/explore-worker/patches/009-explore-r2-feed-like-bundles.mjs
          node --check cloudflare/explore-worker/.cost-r2-temp/worker.js
          node --check cloudflare/explore-worker/.cost-r2-final/worker.js
          grep -Fq 'SORIDRAW_EXPLORE_R2_FEED_LIKE_BUNDLES_009_20260904' cloudflare/explore-worker/.cost-r2-final/worker.js
          grep -Fq 'X-SORIDRAW-Profile-Edge-Cache' cloudflare/explore-worker/.cost-r2-final/worker.js
          grep -Fq "headers.set('X-SORIDRAW-D1-Read', '0')" cloudflare/explore-worker/.cost-r2-final/worker.js
          if grep -Fq "$SEED_PATH" cloudflare/explore-worker/.cost-r2-final/worker.js; then echo 'seed path leaked into final source'; exit 1; fi
          echo 'SOURCE_PATCH_CHECK=PASS'
      - name: Deploy temporary seeder and materialize R2 bundles
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --cwd cloudflare/explore-worker/.cost-r2-temp --keep-vars
          ok=''
          for attempt in $(seq 1 15); do
            code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/seed.json" -w '%{http_code}' -X POST -H "X-SORIDRAW-Seed: $SEED_TOKEN" -H 'Origin: https://preview.soridraw.com' "$BASE$SEED_PATH" || true)"
            echo "seed attempt=$attempt status=$code"
            if [ "$code" = '200' ]; then ok=yes; break; fi
            sleep 4
          done
          test "$ok" = yes
          cat "$RUNNER_TEMP/seed.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/seed.json');if(!x.ok)process.exit(1);if(Number(x.data?.feed?.latest||0)<1||Number(x.data?.feed?.popular||0)<1)process.exit(2);if(Number(x.data?.likeBundles||0)<1)process.exit(3);console.log('SEED_PASS feedLatest='+x.data.feed.latest+' feedPopular='+x.data.feed.popular+' likeBundles='+x.data.likeBundles)"
      - name: Deploy final PREVIEW Worker and verify zero-D1 hot paths
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --cwd cloudflare/explore-worker/.cost-r2-final --keep-vars
          ok=''
          for attempt in $(seq 1 15); do
            seed="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/seed-final.json" -w '%{http_code}' -X POST "$BASE$SEED_PATH" || true)"
            feed="$(curl -sS --max-time 20 -D "$RUNNER_TEMP/feed-h1" -o "$RUNNER_TEMP/feed-b1" -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$BASE/v1/feed?sort=latest&limit=40&probe=r2-final-009" || true)"
            echo "verify attempt=$attempt seed=$seed feed=$feed"
            if [ "$seed" = '404' ] && [ "$feed" = '200' ]; then ok=yes; break; fi
            sleep 4
          done
          test "$ok" = yes
          tr -d '\r' < "$RUNNER_TEMP/feed-h1" > "$RUNNER_TEMP/feed-h1.clean"
          cat "$RUNNER_TEMP/feed-h1.clean" | grep -i 'x-soridraw' || true
          d1="$(awk -F': ' 'tolower($1)=="x-soridraw-d1-read"{print $2}' "$RUNNER_TEMP/feed-h1.clean" | tail -1)"
          r2b="$(awk -F': ' 'tolower($1)=="x-soridraw-r2-b"{print $2}' "$RUNNER_TEMP/feed-h1.clean" | tail -1)"
          edge="$(awk -F': ' 'tolower($1)=="x-soridraw-profile-edge-cache"{print $2}' "$RUNNER_TEMP/feed-h1.clean" | tail -1)"
          echo "FIRST_FEED d1=$d1 r2b=$r2b edge=$edge"
          test "${d1:-0}" = '0'
          test "${r2b:-0}" -ge 1
          code2="$(curl -sS --max-time 20 -D "$RUNNER_TEMP/feed-h2" -o /dev/null -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$BASE/v1/feed?sort=latest&limit=40&probe=r2-final-009")"
          test "$code2" = '200'
          tr -d '\r' < "$RUNNER_TEMP/feed-h2" > "$RUNNER_TEMP/feed-h2.clean"
          d12="$(awk -F': ' 'tolower($1)=="x-soridraw-d1-read"{print $2}' "$RUNNER_TEMP/feed-h2.clean" | tail -1)"
          r2b2="$(awk -F': ' 'tolower($1)=="x-soridraw-r2-b"{print $2}' "$RUNNER_TEMP/feed-h2.clean" | tail -1)"
          edge2="$(awk -F': ' 'tolower($1)=="x-soridraw-profile-edge-cache"{print $2}' "$RUNNER_TEMP/feed-h2.clean" | tail -1)"
          echo "SECOND_FEED d1=$d12 r2b=$r2b2 edge=$edge2"
          test "${d12:-0}" = '0'
          test "${r2b2:-0}" = '0'
          test "$edge2" = 'HIT'
          pop="$(curl -sS --max-time 20 -D "$RUNNER_TEMP/pop-h" -o /dev/null -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$BASE/v1/feed?sort=popular&limit=40&probe=r2-pop-009")"
          test "$pop" = '200'
          tr -d '\r' < "$RUNNER_TEMP/pop-h" > "$RUNNER_TEMP/pop-h.clean"
          pd1="$(awk -F': ' 'tolower($1)=="x-soridraw-d1-read"{print $2}' "$RUNNER_TEMP/pop-h.clean" | tail -1)"
          echo "POPULAR_FEED d1=$pd1"
          test "${pd1:-0}" = '0'
          echo 'FINAL_WORKER_ZERO_D1_VERIFY=PASS'
