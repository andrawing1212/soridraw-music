name: Music Note More Pagination Hotfix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/music-note-more-pagination-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: music-note-more-pagination-hotfix
  cancel-in-progress: false

jobs:
  fix-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20

      - name: Lock application baseline
        shell: bash
        run: |
          set -euo pipefail
          SAFE_BASE='5e411d235f36a50daa20483827f32430559c1f2d'
          git merge-base --is-ancestor "$SAFE_BASE" HEAD
          git diff --quiet "$SAFE_BASE"..HEAD -- src public index.html package.json package-lock.json vite.config.ts vite.config.js firebase.hosting-preview.json
          echo '[Music Note More] application baseline unchanged: PASS'

      - name: Apply bounded pagination patch
        run: python3 .deploy/apply-music-note-more-pagination-1024.py

      - name: Static safety guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SORIDRAW_MUSIC_NOTE_BOUNDED_MORE_RECOVERY_1024' src/App.tsx
          grep -q 'scanCount < 5' src/App.tsx
          grep -q 'favoriteLegacyPaginationCursorRef' src/App.tsx
          grep -q 'favoriteLegacyPaginationBufferRef' src/App.tsx
          grep -q 'RECENT_SONGS_MUTATION_EPOCH_STORAGE_BASE' src/App.tsx
          grep -q 'SORIDRAW_MUSIC_NOTE_PREVIEW_CACHE_RECOVERY_1023' src/App.tsx
          changed="$(git diff --name-only | sort)"
          expected=$'src/App.tsx\nsrc/pages/FavoritesPage.tsx'
          test "$changed" = "$expected"
          git diff -U0 -- src/App.tsx src/pages/FavoritesPage.tsx > "$RUNNER_TEMP/more.diff"
          if grep -E '^\+.*(deleteDoc\(|setDoc\(|updateDoc\(|writeBatch\(|addDoc\()' "$RUNNER_TEMP/more.diff"; then
            echo '[Music Note More] unexpected server mutation added'
            exit 4
          fi
          grep -q 'limit(FAVORITES_PAGE_SIZE)' src/App.tsx
          echo '[Music Note More] bounded reads only, no server writes/deletes: PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx src/pages/FavoritesPage.tsx
          git commit -m 'fix(music-note): restore bounded More pagination'
          git push origin HEAD:preview
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Snapshot production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"

      - name: Deploy Firebase PREVIEW only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project soridraw --config firebase.hosting-preview.json --non-interactive

      - name: Verify exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/index.html | awk '{print $1}')"
          for url in 'https://soridraw-preview.web.app/' 'https://preview.soridraw.com/'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/preview.html"; then
                remote_sha="$(sha256sum "$RUNNER_TEMP/preview.html" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then
                  ok='yes'
                  echo "[Music Note More] exact build PASS: $url"
                  break
                fi
              fi
              sleep 10
            done
            test "$ok" = 'yes'
          done

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          cmp "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '[Music Note More] production unchanged: PASS'

      - name: Cleanup temporary hotfix files
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin preview
          git rm .github/workflows/music-note-more-pagination-hotfix.yml .deploy/apply-music-note-more-pagination-1024.py
          git commit -m 'chore(preview): remove temporary Music Note More tools'
          git push origin HEAD:preview
