name: TEMP PREVIEW liked-tracks profile join hotfix

on:
  push:
    branches:
      - 'tmp/liked-tracks-profile-join-fix-20260915'
    paths:
      - '.github/workflows/temp-liked-tracks-profile-join-fix.yml'
      - 'scripts/temp-fix-liked-tracks-profile-join.mjs'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/liked-tracks-profile-join-fix-20260915
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply narrow Worker 056 hotfix
        run: node scripts/temp-fix-liked-tracks-profile-join.mjs

      - name: Install app dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Relevant Worker verifiers
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
          node scripts/verify-explore-like-cost-optimization.mjs
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "CANONICAL_SHA256_MATCH=PASS $actual"

      - name: PREVIEW D1 schema and SQL compile check read-only
        shell: bash
        run: |
          set -euo pipefail
          CFG='cloudflare/explore-worker/canonical/wrangler.preview.jsonc'
          OUT="$RUNNER_TEMP/public-profiles-schema.json"
          npx --yes wrangler@4 d1 execute DB --remote --config "$CFG" --command "PRAGMA table_info('public_profiles');" --json > "$OUT"
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/public-profiles-schema.json','utf8')).flatMap(x=>x.results||[]);
          const names=new Set(rows.map(r=>String(r.name||'')));
          for(const required of ['uid','nickname','avatar_url']) if(!names.has(required)) throw new Error('public_profiles missing column '+required);
          console.log('LIVE_PUBLIC_PROFILES_SCHEMA=PASS');
          NODE
          PLAN="$RUNNER_TEMP/liked-tracks-plan.json"
          npx --yes wrangler@4 d1 execute DB --remote --config "$CFG" --command "EXPLAIN QUERY PLAN WITH requested(id, sort_order) AS (VALUES ('__soridraw_probe__',0)) SELECT t.id,t.owner_uid,p.nickname AS owner_nickname,p.avatar_url AS owner_avatar_url,t.title,t.cover_url,t.suno_url_primary,t.suno_url_secondary,t.published_at,t.profile_pinned,COALESCE(s.like_count,0) AS like_count,r.sort_order FROM requested r JOIN tracks t ON t.id=r.id LEFT JOIN public_profiles p ON p.uid=t.owner_uid LEFT JOIN track_stats s ON s.track_id=t.id WHERE t.is_public=1 AND t.status='published' ORDER BY r.sort_order ASC;" --json > "$PLAN"
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/liked-tracks-plan.json','utf8')).flatMap(x=>x.results||[]);
          const detail=rows.map(r=>String(r.detail||'')).join(' | ');
          if(!detail) throw new Error('liked-tracks query plan missing');
          if(/SCAN\s+tracks/i.test(detail)) throw new Error('liked-tracks query unexpectedly scans tracks: '+detail);
          console.log('LIVE_LIKED_TRACKS_SQL_COMPILE=PASS '+detail);
          NODE

      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- dist
          git diff --check
          git diff --name-only
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt scripts/verify-085-liked-profile.mjs scripts/verify-086-liked-sync-repair.mjs | sort)"
          test "$changed" = "$expected"
          echo 'NARROW_DIFF=PASS'

      - name: Commit verified product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt scripts/verify-085-liked-profile.mjs scripts/verify-086-liked-sync-repair.mjs
          git commit -m 'fix: repair liked-tracks public profile lookup'
          git push origin HEAD:tmp/liked-tracks-profile-join-fix-20260915
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
