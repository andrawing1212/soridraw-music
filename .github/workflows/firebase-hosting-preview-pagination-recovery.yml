name: Firebase Preview Pagination Recovery

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-979-music-note-legacy-cache-cursor-recovery.py'
      - '.deploy/apply-980-library-pagination-metadata-recovery.py'
      - '.github/workflows/firebase-hosting-preview-pagination-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-preview-pagination-recovery
  cancel-in-progress: true

jobs:
  build-and-deploy-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Capture official production before preview deploy
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-before.html"
          sha256sum "$RUNNER_TEMP/prod-before.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-before.sha"

      - name: Generate final app source with existing build chain
        run: |
          set -euo pipefail
          npm run prebuild
          grep -Fq 'SORIDRAW_979_MUSIC_NOTE_LEGACY_CACHE_CURSOR_RECOVERY' src/App.tsx
          echo '[pagination] 979 generated: PASS'

      - name: Apply Library pagination metadata recovery
        run: |
          set -euo pipefail
          python3 .deploy/apply-980-library-pagination-metadata-recovery.py
          grep -Fq 'SORIDRAW_980_LIBRARY_PAGINATION_METADATA_RECOVERY' src/pages/SunoLibraryPage.tsx
          echo '[pagination] 980 generated: PASS'

      - name: Verify bounded pagination invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'favoritePaginationCursorRef.current = bundle.cursorCreatedAtMs > 0 ? new Date(bundle.cursorCreatedAtMs) : null;' src/App.tsx
          grep -Fq 'setHasMoreFavorites(bundle.hasMore);' src/App.tsx
          grep -Fq 'session.lastDoc = bundle.cursorCreatedAtMs > 0 ? new Date(bundle.cursorCreatedAtMs) : null;' src/pages/SunoLibraryPage.tsx
          grep -Fq 'session.hasMore = bundle.hasMore;' src/pages/SunoLibraryPage.tsx
          grep -Fq 'startAfter(workspaceLastTrackDocRef.current)' src/pages/SunoLibraryPage.tsx
          echo '[pagination] bounded bundle/page paths: PASS'

      - name: Locate old-song one-time-load UI in final generated source
        shell: bash
        run: |
          set +e
          echo '--- old-song UI matches (diagnostic only) ---'
          grep -RniE '14일|이전곡|1회 불러오|오래된 곡' src .deploy | head -n 80
          exit 0

      - name: Typecheck and build generated source
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx vite build
          echo '[pagination] typecheck + Vite build: PASS'

      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy only soridraw-preview Hosting site
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project soridraw \
            --config firebase.hosting-preview.json \
            --non-interactive
          echo '[pagination] preview Hosting deploy: PASS'

      - name: Smoke custom preview
        run: |
          set -euo pipefail
          ok=''
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 30 https://preview.soridraw.com/ -o "$RUNNER_TEMP/preview.html" \
              && grep -q '<div id="root"></div>' "$RUNNER_TEMP/preview.html"; then
              ok='yes'
              break
            fi
            sleep 10
          done
          test "$ok" = 'yes'
          echo '[pagination] preview.soridraw.com smoke: PASS'

      - name: Verify official production unchanged
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/prod-after.html"
          sha256sum "$RUNNER_TEMP/prod-after.html" | awk '{print $1}' > "$RUNNER_TEMP/prod-after.sha"
          cmp "$RUNNER_TEMP/prod-before.sha" "$RUNNER_TEMP/prod-after.sha"
          echo '[pagination] official Firebase production unchanged: PASS'

      - name: Result
        run: |
          echo 'Music Note + Library pagination metadata recovery deployed to soridraw-preview only.'
          echo 'No main change, production Hosting release, Functions deploy, Firestore/Database Rules change, or user-data migration in this workflow.'
