name: SORIDRAW Backend V2 Step 2-A4b Mutation Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2-a4b-mutation-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Enumerate direct recent and favorites writes only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          mutations = []
          exts = {'.ts', '.tsx', '.js', '.jsx'}
          write_re = re.compile(r'\b(?:setDoc|updateDoc|deleteDoc|addDoc)\s*\(|\bbatch\.(?:set|update|delete)\s*\(|\b(?:writeBatch|runTransaction)\s*\(')
          domain_re = re.compile(r'user_recent_songs|[\'\"]favorites[\'\"]|favoriteSyncSignal')

          for path in Path('src').rglob('*'):
              if path.suffix not in exts:
                  continue
              lines = path.read_text(encoding='utf-8', errors='ignore').splitlines()
              for i, line in enumerate(lines):
                  if not write_re.search(line):
                      continue
                  start = max(0, i - 8)
                  end = min(len(lines), i + 12)
                  nearby = '\n'.join(lines[start:end])
                  if not domain_re.search(nearby):
                      continue
                  # Find nearest enclosing named function/declaration heuristically.
                  owner = ''
                  for j in range(i, max(-1, i - 160), -1):
                      candidate = lines[j].strip()
                      if re.search(r'^(?:const\s+\w+\s*=\s*(?:useCallback\s*\()?\s*async|const\s+\w+\s*=\s*\(|async\s+function\s+\w+|function\s+\w+)', candidate):
                          owner = f'{j+1}:{candidate[:220]}'
                          break
                  mutations.append({
                      'file': str(path),
                      'line': i + 1,
                      'owner': owner,
                      'write': line.strip(),
                      'context': [f'{j+1}:{lines[j].strip()}' for j in range(start, end) if lines[j].strip()],
                  })

          print('STEP2A4B_DIRECT_WRITES=' + json.dumps(mutations, ensure_ascii=False))
          print('STEP2A4B_DIRECT_WRITE_SUMMARY=' + json.dumps({
              'count': len(mutations),
              'byFile': {p: sum(1 for m in mutations if m['file'] == p) for p in sorted(set(m['file'] for m in mutations))},
              'firebaseReads': 0,
              'firebaseWrites': 0,
              'firebaseDeletes': 0,
          }, ensure_ascii=False))
          PY
