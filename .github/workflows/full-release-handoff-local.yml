name: Full release handoff isolated local runtime
on:
  push:
    branches: [qa/full-release-handoff-safety]
    paths: ['scripts/full-release-shared-like-scheduler.mjs', 'scripts/verify-full-release-handoff-local.mjs']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/verify-full-release-shared-like-scheduler.mjs
      - run: npm install --prefix "$RUNNER_TEMP/full-release-local" --no-save --no-package-lock --no-audit --no-fund miniflare@4.20260730.0
      - run: node scripts/verify-full-release-handoff-local.mjs "$RUNNER_TEMP/full-release-local"
