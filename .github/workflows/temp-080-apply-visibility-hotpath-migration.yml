name: TEMP 329 Apply Publication Media Trigger Migration

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/app329-publication-media-trigger.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-329-shared-d1-publication-trigger
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      TEST_BASE: https://soridraw-explore-test.andrawing1212.workers.dev
      PRODUCTION_BASE: https://soridraw-explore-api.andrawing1212.workers.dev

    steps:
      - name: Checkout migration trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact audited source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          trigger='.deploy/app329-publication-media-trigger.trigger'
          target="$(sed -n 's/^product_code_target=//p' "$trigger" | tail -1 | tr -d '\r')"
          migration_blob="$(sed -n 's/^migration_blob=//p' "$trigger" | tail -1 | tr -d '\r')"
          audit_run="$(sed -n 's/^required_audit_run=//p' "$trigger" | tail -1 | tr -d '\r')"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$migration_blob" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$audit_run" | grep -Eq '^[0-9]+$'
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "$target" origin/preview
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "migration_blob=$migration_blob" >> "$GITHUB_OUTPUT"
          echo "audit_run=$audit_run" >> "$GITHUB_OUTPUT"
          git rev-parse origin/main > "$RUNNER_TEMP/main-before.sha"
          git rev-parse origin/production > "$RUNNER_TEMP/production-before.sha"
          echo "LOCKED_APP329_SOURCE=$target"
          echo "REQUIRED_AUDIT_RUN=$audit_run"

      - name: Checkout exact audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.target }}
          fetch-depth: 0

      - name: Verify locked migration source
        shell: bash
        env:
          EXPECTED_MIGRATION_BLOB: ${{ steps.source.outputs.migration_blob }}
        run: |
          set -euo pipefail
          MIG='cloudflare/explore-worker/migrations/20261004_01_publication_media_source_cost.sql'
          test -f "$MIG"
          test "$(git hash-object "$MIG")" = "$EXPECTED_MIGRATION_BLOB"
          node -e "const v=require('./public/app-version.json'); if(Number(v.version)!==329) throw new Error('app329 source required')"
          grep -Fq 'UPDATE explore_derived_tracks' "$MIG"
          grep -Fq 'OLD.suno_url_primary IS NOT NEW.suno_url_primary' "$MIG"
          echo 'APP329_MIGRATION_SOURCE_LOCK=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Snapshot protected Worker versions
        shell: bash
        run: |
          set -euo pipefail
          active_version() {
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json'               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$1/deployments"               | jq -er '.result.deployments[0].versions | max_by(.percentage) | select(.percentage >= 99.99) | .version_id'
          }
          active_version "$PREVIEW_WORKER" > "$RUNNER_TEMP/preview-worker-before.txt"
          active_version "$TEST_WORKER" > "$RUNNER_TEMP/test-worker-before.txt"
          active_version "$PRODUCTION_WORKER" > "$RUNNER_TEMP/production-worker-before.txt"
          echo 'WORKER_VERSION_SNAPSHOT=PASS'

      - name: Guard, migrate trigger only, verify, rollback on failure
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          MIG="$PWD/migrations/20261004_01_publication_media_source_cost.sql"

          query() {
            node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "$1" --json
          }

          query "SELECT name,sql FROM sqlite_schema WHERE type='trigger' AND name IN ('explore032_track_update','soridraw_shared_rev_tracks_au_051') ORDER BY name;" > "$RUNNER_TEMP/before-triggers.json"
          query "SELECT COUNT(*) AS track_count, COALESCE(SUM(is_public),0) AS public_sum, COALESCE(SUM(updated_at),0) AS updated_sum, COALESCE(SUM(length(title)+length(owner_uid)+length(source_id)),0) AS payload_sum FROM tracks; SELECT COUNT(*) AS derived_count, COALESCE(SUM(active),0) AS derived_active, COALESCE(SUM(published_at),0) AS derived_published, COALESCE(SUM(length(row_json)),0) AS derived_payload FROM explore_derived_tracks;" > "$RUNNER_TEMP/before-data.json"

          node <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/before-triggers.json','utf8')).flatMap(x=>x.results||[]);
          const current=rows.find(x=>x.name==='explore032_track_update');
          const shared=rows.find(x=>x.name==='soridraw_shared_rev_tracks_au_051');
          if(!current?.sql) throw new Error('explore032_track_update missing');
          if(!shared?.sql || !/explore_shared_revision/i.test(shared.sql)) throw new Error('protected shared revision trigger missing');
          const sql=current.sql;
          const already329=/UPDATE\s+explore_derived_tracks[\s\S]*SET\s+row_json\s*=\s*json_patch/i.test(sql)
            && /OLD\.suno_url_primary\s+IS\s+NOT\s+NEW\.suno_url_primary/i.test(sql);
          if(!already329){
            if(!/AFTER\s+UPDATE\s+OF/i.test(sql)) throw new Error('expected app080 column-scoped trigger before app329');
            for(const required of ['cover_url','duration_seconds','suno_url_primary','suno_url_secondary','title','status','published_at']){
              if(!new RegExp('\\b'+required+'\\b','i').test(sql)) throw new Error('app080 trigger contract missing '+required);
            }
            if(!/INSERT\s+INTO\s+explore_derived_tracks/i.test(sql)) throw new Error('app080 derived mirror maintenance missing');
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/migration-mode.txt',already329?'already329':'upgrade080');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/old-trigger.sql','DROP TRIGGER IF EXISTS explore032_track_update;\n'+sql+';\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/shared-before.txt',shared.sql);
          console.log('APP329_D1_PREFLIGHT=PASS mode='+(already329?'already329':'upgrade080'));
          console.log('USER_ROW_MUTATION_BEFORE=0');
          NODE

          migrated=0
          restore_old() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$migrated" = 1 ]; then
              echo 'APP329_TRIGGER_VERIFY_FAILED_ROLLBACK=START'
              node "$WRANGLER" d1 execute DB --remote --config "$CFG" --file "$RUNNER_TEMP/old-trigger.sql" --yes >/dev/null || true
              echo 'APP329_TRIGGER_ROLLBACK=ATTEMPTED'
            fi
            exit "$status"
          }
          trap restore_old EXIT

          if [ "$(cat "$RUNNER_TEMP/migration-mode.txt")" = 'upgrade080' ]; then
            node "$WRANGLER" d1 execute DB --remote --config "$CFG" --file "$MIG" --yes
            migrated=1
          else
            echo 'APP329_TRIGGER_MIGRATION=ALREADY_APPLIED'
          fi

          query "SELECT name,sql FROM sqlite_schema WHERE type='trigger' AND name IN ('explore032_track_update','soridraw_shared_rev_tracks_au_051') ORDER BY name;" > "$RUNNER_TEMP/after-triggers.json"
          query "SELECT COUNT(*) AS track_count, COALESCE(SUM(is_public),0) AS public_sum, COALESCE(SUM(updated_at),0) AS updated_sum, COALESCE(SUM(length(title)+length(owner_uid)+length(source_id)),0) AS payload_sum FROM tracks; SELECT COUNT(*) AS derived_count, COALESCE(SUM(active),0) AS derived_active, COALESCE(SUM(published_at),0) AS derived_published, COALESCE(SUM(length(row_json)),0) AS derived_payload FROM explore_derived_tracks;" > "$RUNNER_TEMP/after-data.json"

          node <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/after-triggers.json','utf8')).flatMap(x=>x.results||[]);
          const next=rows.find(x=>x.name==='explore032_track_update');
          const shared=rows.find(x=>x.name==='soridraw_shared_rev_tracks_au_051');
          if(!next?.sql) throw new Error('app329 trigger missing after migration');
          const sql=next.sql;
          if(!/AFTER\s+UPDATE\s+OF/i.test(sql)) throw new Error('app329 trigger must remain column scoped');
          const columnBlock=(sql.match(/AFTER\s+UPDATE\s+OF([\s\S]*?)ON\s+tracks/i)||[])[1]||'';
          for(const hot of ['is_public','updated_at','allow_next_song_apply','allow_follower_save','profile_pinned']){
            if(new RegExp('\\b'+hot+'\\b','i').test(columnBlock)) throw new Error('hot option column unexpectedly causes derived rewrite: '+hot);
          }
          for(const required of ['cover_url','duration_seconds','suno_url_primary','suno_url_secondary','title','status','published_at']){
            if(!new RegExp('\\b'+required+'\\b','i').test(columnBlock)) throw new Error('required app329 recovery column missing: '+required);
          }
          if(!/UPDATE\s+explore_derived_tracks[\s\S]*SET\s+row_json\s*=\s*json_patch/i.test(sql)) throw new Error('app329 narrow derived media patch missing');
          if(!/OLD\.suno_url_primary\s+IS\s+NOT\s+NEW\.suno_url_primary/i.test(sql)) throw new Error('app329 media change guard missing');
          if(!/INSERT\s+INTO\s+explore_derived_tracks/i.test(sql)) throw new Error('full derived fallback missing');

          const beforeShared=fs.readFileSync(process.env.RUNNER_TEMP+'/shared-before.txt','utf8');
          if(shared?.sql!==beforeShared) throw new Error('protected shared revision trigger changed');

          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/before-data.json','utf8')).flatMap(x=>x.results||[]);
          const after=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/after-data.json','utf8')).flatMap(x=>x.results||[]);
          const bTrack=before.find(x=>'track_count' in x), aTrack=after.find(x=>'track_count' in x);
          const bDerived=before.find(x=>'derived_count' in x), aDerived=after.find(x=>'derived_count' in x);
          for(const k of ['track_count','public_sum','updated_sum','payload_sum']){
            if(String(bTrack?.[k])!==String(aTrack?.[k])) throw new Error('canonical track data changed during trigger-only migration: '+k);
          }
          for(const k of ['derived_count','derived_active','derived_published','derived_payload']){
            if(String(bDerived?.[k])!==String(aDerived?.[k])) throw new Error('derived rows changed during trigger-only migration: '+k);
          }
          console.log('APP329_TRIGGER_CONTRACT=PASS');
          console.log('SHARED_REVISION_TRIGGER_UNCHANGED=PASS');
          console.log('CANONICAL_AND_DERIVED_ROWS_UNCHANGED=PASS');
          console.log('USER_ROW_MUTATION=0');
          NODE

          trap - EXIT
          echo 'APP329_D1_TRIGGER_MIGRATION=PASS'

      - name: Verify all Workers and protected refs unchanged
        shell: bash
        run: |
          set -euo pipefail
          active_version() {
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json'               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$1/deployments"               | jq -er '.result.deployments[0].versions | max_by(.percentage) | select(.percentage >= 99.99) | .version_id'
          }
          test "$(active_version "$PREVIEW_WORKER")" = "$(cat "$RUNNER_TEMP/preview-worker-before.txt")"
          test "$(active_version "$TEST_WORKER")" = "$(cat "$RUNNER_TEMP/test-worker-before.txt")"
          test "$(active_version "$PRODUCTION_WORKER")" = "$(cat "$RUNNER_TEMP/production-worker-before.txt")"

          for pair in             "preview|${PREVIEW_BASE}|https://preview.soridraw.com"             "test|${TEST_BASE}|https://test.soridraw.com"             "production|${PRODUCTION_BASE}|https://soridraw.com"; do
            name="${pair%%|*}"; rest="${pair#*|}"; base="${rest%%|*}"; origin="${rest#*|}"
            code="$(curl -sS -o "$RUNNER_TEMP/${name}-feed.json" -w '%{http_code}' -H "Origin: ${origin}" "${base}/v1/feed?sort=latest&limit=1")"
            test "$code" = 200
            echo "${name^^}_FEED_AFTER_TRIGGER=PASS"
          done

          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before.sha")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/production-before.sha")"
          echo 'ALL_WORKER_VERSIONS_UNCHANGED=PASS'
          echo 'MAIN_PRODUCTION_REFS_UNCHANGED=PASS'
