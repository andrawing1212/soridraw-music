name: TEMP 137 Private Only Repair
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-137-private-only-repair.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abe18c1060c89b724ebea87f5fcec2640593d2e6
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Exact canonical target preflight (SELECT only)
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          node "$W" d1 execute DB --remote --config "$PWD/canonical/wrangler.preview.jsonc" --command "SELECT id,is_public,updated_at FROM tracks WHERE updated_at=1789829348623 LIMIT 2" --json > "$RUNNER_TEMP/target137.json"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/target137.json','utf8'));
          if(r.length!==1||r[0].success===false)throw Error('D1 query failure');
          const x=r[0].results||[];
          if(x.length!==1||Number(x[0].is_public)!==0||Number(x[0].updated_at)!==1789829348623)throw Error('D1 target not stable and private');
          const id=String(x[0].id||'');if(!id||id.length>512)throw Error('invalid trackId');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/target-id137.json',JSON.stringify({trackId:id}));
          console.log('EXACT_PRIVATE_TARGET=PASS SHA10='+crypto.createHash('sha256').update(id).digest('hex').slice(0,10));
          NODE
      - name: Bounded shared R2 repair with private catalog guard and CAS
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          TOKEN="$(openssl rand -hex 32)"
          cat > .temp-137-worker.mjs <<'WORKER'
          const SECRET='__TOKEN__';
          const root='internal/explore/shared-feed-v112/';
          const normalized=x=>String(x?.id||x?.trackId||'').trim();
          const json=(x,status=200)=>new Response(JSON.stringify(x),{status,headers:{'content-type':'application/json'}});
          export default {async fetch(request,env){
            if(request.method!=='POST'||request.headers.get('x-secret')!==SECRET)return json({ok:false},403);
            try{
              const {trackId}=await request.json();
              if(!trackId||typeof trackId!=='string'||trackId.length>512)throw Error('bad id');
              const bucket=env.PROFILE_MEDIA;
              async function guard(){
                const object=await bucket.get('internal/explore/catalog-v1/meta/'+encodeURIComponent(trackId)+'.json');
                if(!object)throw Error('missing catalog meta');
                const meta=JSON.parse(await object.text());
                if(meta.trackId!==trackId||meta.public!==false||!Array.isArray(meta.markerKeys)||meta.markerKeys.length!==0)throw Error('canonical catalog state changed');
              }
              const results=[];
              await guard();
              for(const sort of ['latest','popular']){
                let finished=false;
                for(let attempt=0;attempt<8;attempt++){
                  await guard();
                  const key=root+sort+'-40.json';
                  const obj=await bucket.get(key);
                  if(!obj)throw Error('missing shared object '+sort);
                  const before=JSON.parse(await obj.text());
                  const items=before?.payload?.data?.items;
                  if(!Array.isArray(items)||![37,38].includes(items.length))throw Error('unexpected snapshot count '+sort);
                  const count=items.filter(x=>normalized(x)===trackId).length;
                  if(count===0&&items.length===37){
                    results.push({sort,before:37,after:37,changed:false});finished=true;break;
                  }
                  if(count!==1||items.length!==38)throw Error('unexpected private target count '+sort);
                  const filtered=items.filter(x=>normalized(x)!==trackId);
                  const next={...before,payload:{...before.payload,data:{...before.payload.data,items:filtered}},updatedAt:Date.now()};
                  const saved=await bucket.put(key,JSON.stringify(next),{
                    onlyIf:{etagMatches:obj.etag},
                    httpMetadata:{contentType:'application/json; charset=utf-8'},
                    customMetadata:{...(obj.customMetadata||{}),soridrawSharedFeed:'137',privateRepair:'single'},
                  });
                  if(!saved)continue;
                  const verifyObj=await bucket.get(key);
                  const verify=JSON.parse(await verifyObj.text())?.payload?.data?.items;
                  if(!Array.isArray(verify)||verify.length!==37||verify.some(x=>normalized(x)===trackId))throw Error('write postflight failed '+sort);
                  if(filtered.some((x,i)=>JSON.stringify(x)!==JSON.stringify(verify[i])))throw Error('other song changed '+sort);
                  results.push({sort,before:38,after:37,changed:true});finished=true;break;
                }
                if(!finished)throw Error('CAS retries exhausted '+sort);
              }
              await guard();
              return json({ok:true,results});
            }catch(e){return json({ok:false,error:String(e?.message||e)},500);}
          }};
          WORKER
          TOKEN="$TOKEN" node <<'NODE'
          const fs=require('fs'),f='.temp-137-worker.mjs';
          fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('__TOKEN__',process.env.TOKEN));
          NODE
          cat > .temp-137-config.jsonc <<'JSON'
          {"name":"soridraw-temp-137-private-repair","main":".temp-137-worker.mjs","compatibility_date":"2026-08-28","r2_buckets":[{"binding":"PROFILE_MEDIA","bucket_name":"soridraw-profile-media"}]}
          JSON
          node --check .temp-137-worker.mjs
          DEV_PID=""
          cleanup(){
            status=$?
            if [ -n "$DEV_PID" ];then kill "$DEV_PID" >/dev/null 2>&1||true;wait "$DEV_PID" >/dev/null 2>&1||true;fi
            exit "$status"
          }
          trap cleanup EXIT
          node "$W" dev --remote --config .temp-137-config.jsonc --ip 127.0.0.1 --port 8793 > "$RUNNER_TEMP/dev137.log" 2>&1 &
          DEV_PID=$!
          ready=0
          for n in $(seq 1 90);do
            code="$(curl -sS -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:8793/||true)"
            if [ "$code" = 403 ];then ready=1;break;fi
            sleep 1
          done
          if [ "$ready" != 1 ];then sed -n '1,100p' "$RUNNER_TEMP/dev137.log";exit 1;fi
          code="$(curl -sS -X POST -H "x-secret: $TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/target-id137.json" -o "$RUNNER_TEMP/repair137.json" -w '%{http_code}' http://127.0.0.1:8793/)"
          node <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/repair137.json','utf8'));
          if(!r.ok||r.results?.length!==2||r.results.some(x=>x.after!==37))throw Error('bounded repair failed '+String(r.error||'invalid result'));
          for(const x of r.results)console.log('TARGETED_PRIVATE_REPAIR sort='+x.sort+' before='+x.before+' after='+x.after+' changed='+x.changed);
          console.log('USER_ORIGIN_D1_WRITE=0; OTHER_TRACK_CHANGES=0');
          NODE
          test "$code" = 200
          kill "$DEV_PID" >/dev/null 2>&1||true
          wait "$DEV_PID" >/dev/null 2>&1||true
          DEV_PID=""
          trap - EXIT
      - name: Independent read-only postflight
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          W="$PWD/node_modules/wrangler/bin/wrangler.js"
          node "$W" d1 execute DB --remote --config "$PWD/canonical/wrangler.preview.jsonc" --command "SELECT id,is_public,updated_at FROM tracks WHERE updated_at=1789829348623 LIMIT 2" --json > "$RUNNER_TEMP/after-d1.json"
          for sort in latest popular;do
            node "$W" r2 object get "soridraw-profile-media/internal/explore/shared-feed-v112/$sort-40.json" --file "$RUNNER_TEMP/shared-$sort.json" --remote >/dev/null
          done
          node <<'NODE'
          const fs=require('fs'),root=process.env.RUNNER_TEMP,trackId=JSON.parse(fs.readFileSync(root+'/target-id137.json','utf8')).trackId;
          const rows=JSON.parse(fs.readFileSync(root+'/after-d1.json','utf8')).flatMap(x=>x.results||[]);
          if(rows.length!==1||rows[0].id!==trackId||Number(rows[0].is_public)!==0||Number(rows[0].updated_at)!==1789829348623)throw Error('canonical D1 changed');
          for(const sort of ['latest','popular']){
            const items=JSON.parse(fs.readFileSync(root+'/shared-'+sort+'.json','utf8'))?.payload?.data?.items||[];
            if(items.length!==37||items.some(x=>String(x.id||x.trackId||'')===trackId))throw Error('shared private leak '+sort);
            console.log('SHARED_'+sort.toUpperCase()+'_PRIVATE_ABSENT=PASS count='+items.length);
          }
          console.log('D1_ORIGIN_UNCHANGED=PASS; DEPLOY=0; FIREBASE=UNCHANGED');
          NODE
