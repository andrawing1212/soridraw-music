name: Firebase Hosting Main TEST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-hosting-main-test-canary-v2.yml'

permissions:
  contents: read

concurrency:
  group: firebase-hosting-main-test
  cancel-in-progress: false

jobs:
  deploy-main-to-firebase-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BACKEND_PROJECT: soridraw-app-866a5
      HOSTING_PROJECT: soridraw
      TEST_SITE: soridraw-test
      TEST_WEB_HOST: soridraw-test.web.app
      TEST_FIREBASE_HOST: soridraw-test.firebaseapp.com
      TEST_CUSTOM_HOST: test.soridraw.com
      APP_CHECK_SITE_KEY: 6Le6bGEtAAAAAOVROhuXew0lxJcpVNVwPZN0ZWKO

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build exact main
        run: npm run build

      - name: Verify TEST host recognition is already in source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'test.soridraw.com' src/firebase.js
          grep -Fq 'soridraw-test.web.app' src/firebase.js
          grep -Fq 'soridraw-test.firebaseapp.com' src/firebase.js
          grep -Fq 'https://test.soridraw.com' src/constants/emailVerification.ts
          grep -Fq 'https://soridraw-test.web.app' src/constants/emailVerification.ts
          grep -Fq 'https://soridraw-test.firebaseapp.com' src/constants/emailVerification.ts
          echo '[Firebase TEST] Source host recognition: PASS'

      - name: Authenticate Google and Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Mint OAuth access token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const credentialPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          if (!credentialPath) throw new Error('GOOGLE_APPLICATION_CREDENTIALS is missing');
          const serviceAccount = JSON.parse(fs.readFileSync(credentialPath, 'utf8'));
          const base64url = (input) => Buffer.from(input).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = base64url(JSON.stringify({
            iss: serviceAccount.client_email,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          }));
          const unsigned = `${header}.${payload}`;
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), serviceAccount.private_key).toString('base64url');
          const assertion = `${unsigned}.${signature}`;
          (async () => {
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion,
              }),
            });
            const body = await response.json();
            if (!response.ok || !body.access_token) throw new Error(`OAuth token exchange failed: HTTP ${response.status}`);
            console.log(`::add-mask::${body.access_token}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `ACCESS_TOKEN=${body.access_token}\n`);
            console.log('[Firebase TEST] OAuth token: PASS');
          })().catch((error) => {
            console.error(error?.message || error);
            process.exit(1);
          });
          NODE

      - name: Snapshot production before TEST deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"
          echo '[Firebase TEST] Production baseline captured.'

      - name: Assert isolated TEST Hosting site exists
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest hosting:sites:list --project "$HOSTING_PROJECT" --json > "$RUNNER_TEMP/firebase-sites.json"
          node - "$RUNNER_TEMP/firebase-sites.json" "$TEST_SITE" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const wanted = process.argv[3];
          const possible = [payload?.result?.sites, payload?.result, payload?.sites, payload];
          const sites = possible.find(Array.isArray) || [];
          const ids = sites.map((site) => {
            const raw = String(site?.site || site?.siteId || site?.id || site?.name || '');
            return raw.includes('/') ? raw.split('/').filter(Boolean).pop() : raw;
          }).filter(Boolean);
          console.log(`[Firebase TEST] Hosting sites: ${ids.join(',') || '(none)'}`);
          if (!ids.includes('soridraw')) throw new Error('Production Hosting site soridraw is missing; aborting.');
          if (!ids.includes(wanted)) throw new Error(`Isolated TEST site ${wanted} is missing; refusing automatic resource creation.`);
          console.log(`[Firebase TEST] Isolated TEST site ${wanted}: PASS`);
          NODE

      - name: Deploy main build to Firebase TEST only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$HOSTING_PROJECT" \
            --config firebase.hosting-test.json \
            --non-interactive
          echo '[Firebase TEST] Hosting-only deploy: PASS'

      - name: Ensure Firebase Auth TEST domains
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$BACKEND_PROJECT/config" \
            -o "$RUNNER_TEMP/auth-before.json"

          python3 - "$RUNNER_TEMP/auth-before.json" "$RUNNER_TEMP/auth-patch.json" "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" "$TEST_CUSTOM_HOST" <<'PY'
          import json, sys
          source, target, *wanted = sys.argv[1:]
          data=json.load(open(source, encoding='utf-8'))
          domains=list(dict.fromkeys([str(v).strip() for v in data.get('authorizedDomains', []) if str(v).strip()] + wanted))
          json.dump({'authorizedDomains': domains}, open(target, 'w', encoding='utf-8'), ensure_ascii=False)
          PY

          curl -fsS -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/auth-patch.json" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$BACKEND_PROJECT/config?updateMask=authorizedDomains" \
            -o "$RUNNER_TEMP/auth-after.json"

          python3 - "$RUNNER_TEMP/auth-after.json" "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" "$TEST_CUSTOM_HOST" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          domains=set(data.get('authorizedDomains', []))
          missing=[v for v in sys.argv[2:] if v not in domains]
          if missing: raise SystemExit(f'Firebase Auth TEST domains missing: {missing}')
          print('[Firebase TEST] Auth domains: PASS')
          PY

      - name: Extend App Check reCAPTCHA TEST domains when permitted
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/recaptcha-before.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://recaptchaenterprise.googleapis.com/v1/projects/$BACKEND_PROJECT/keys/$APP_CHECK_SITE_KEY")"
          if [ "$status" = '403' ]; then
            echo 'RECAPTCHA_POLICY_STATUS=permission-gated' >> "$GITHUB_ENV"
            echo '[Firebase TEST] reCAPTCHA policy permission-gated; IAM unchanged.'
            exit 0
          fi
          test "$status" = '200' || { echo "reCAPTCHA key read HTTP $status"; cat "$RUNNER_TEMP/recaptcha-before.json"; exit 6; }

          python3 - "$RUNNER_TEMP/recaptcha-before.json" "$RUNNER_TEMP/recaptcha-patch.json" "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" "$TEST_CUSTOM_HOST" <<'PY'
          import json, sys
          source, target, *wanted = sys.argv[1:]
          data=json.load(open(source, encoding='utf-8'))
          web=data.get('webSettings') or {}
          if web.get('allowAllDomains') is True:
              open(target, 'w', encoding='utf-8').write('')
              print('[Firebase TEST] reCAPTCHA allows all domains; patch not needed.')
              raise SystemExit(0)
          domains=list(dict.fromkeys([str(v).strip() for v in web.get('allowedDomains', []) if str(v).strip()] + wanted))
          json.dump({'name': data.get('name'), 'webSettings': {'allowedDomains': domains}}, open(target, 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          echo 'RECAPTCHA_POLICY_STATUS=readable' >> "$GITHUB_ENV"
          if [ -s "$RUNNER_TEMP/recaptcha-patch.json" ]; then
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/recaptcha-patch.json" \
              "https://recaptchaenterprise.googleapis.com/v1/projects/$BACKEND_PROJECT/keys/$APP_CHECK_SITE_KEY?updateMask=webSettings.allowedDomains" \
              -o "$RUNNER_TEMP/recaptcha-after.json"
            echo '[Firebase TEST] reCAPTCHA TEST domains: PASS'
          fi

      - name: Smoke TEST Firebase and custom domains
        shell: bash
        run: |
          set -euo pipefail
          for host in "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" "$TEST_CUSTOM_HOST"; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 "https://$host/" -o "$RUNNER_TEMP/test-$attempt.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/test-$attempt.html"; then
                ok=yes
                echo "[Firebase TEST] Smoke PASS: https://$host/"
                break
              fi
              sleep 10
            done
            test "$ok" = yes || { echo "TEST smoke failed: https://$host/"; exit 7; }
          done

      - name: Verify shared backend from custom TEST domain
        shell: bash
        run: |
          set -euo pipefail
          check_function() {
            local fn="$1"
            local code allow
            code="$(curl -sS -o /tmp/fn-body -D /tmp/fn-head -w '%{http_code}' -X OPTIONS \
              -H "Origin: https://$TEST_CUSTOM_HOST" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
              "https://us-central1-$BACKEND_PROJECT.cloudfunctions.net/$fn" || true)"
            allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/fn-head)"
            echo "[Firebase TEST] $fn CORS=$code allow=${allow:-none}"
            test "$code" = '204'
            test "$allow" = "https://$TEST_CUSTOM_HOST"
          }
          check_function getSunoApiKeyStatus
          check_function generateGeminiContent

          code="$(curl -sS -o /tmp/explore-body -D /tmp/explore-head -w '%{http_code}' \
            -H "Origin: https://$TEST_CUSTOM_HOST" \
            'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1' || true)"
          allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/explore-head)"
          echo "[Firebase TEST] Explore CORS=$code allow=${allow:-none}"
          test "$code" = '200'
          test "$allow" = "https://$TEST_CUSTOM_HOST"

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          diff -u "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '[Firebase TEST] Production checksum unchanged: PASS'
          echo 'FIREBASE_TEST_DEPLOY_COMPLETE=true'
          echo 'NO_FUNCTIONS_DEPLOY=true'
          echo 'NO_FIRESTORE_DEPLOY=true'
          echo 'NO_RULES_DEPLOY=true'
          echo 'NO_PRODUCTION_HOSTING_DEPLOY=true'
