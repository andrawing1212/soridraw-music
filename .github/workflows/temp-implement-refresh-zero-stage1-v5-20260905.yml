name: SORIDRAW Implement Refresh Zero Stage1 V5 2026-09-05
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-implement-refresh-zero-stage1-v5-20260905.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and validate bounded control foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-refresh-zero-stage1-foundation-20260905.py
          node scripts/verify-no-unbounded-user-song-bootstrap.mjs
          node scripts/verify-user-control-revision-foundation.mjs
          npm ci
          npx tsc --noEmit
          npm run build
          (cd functions && npm ci && npm run build)
      - name: Commit only validated stage1 product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add database.rules.json src/services/userControlRevisionService.ts functions/src/index.ts src/pages/AdminUserManagementPage.tsx src/pages/MasterPermissionsPage.tsx scripts/verify-user-control-revision-foundation.mjs
          git diff --cached --check
          git commit -m 'refactor(preview): add bounded user control revision foundation'
          git push origin preview
