name: SORIDRAW APP637 PREVIEW Live-Sourced Bridge OFF

on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/app637-preview-bridge-off-from-live.mjs'
      - '.github/workflows/follow-637-preview-live-bridge-off.yml'
  push:
    branches: [preview]
    paths:
      - '.deploy/app637-preview-live-bridge-off.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-app637-preview-bridge-off
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check one-flag safe recovery script
        run: |
          node --check scripts/app637-preview-bridge-off-from-live.mjs
          node scripts/app637-preview-bridge-off-from-live.mjs --self-test

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Require exact approval parent and three-file release scope
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/app637-preview-bridge-off-from-live.mjs
          node scripts/app637-preview-bridge-off-from-live.mjs --self-test
          test "$GITHUB_REF" = 'refs/heads/preview'
          test "$(git rev-parse HEAD^1)" = '2c1211d4a74f81b743f7dac110b1ed9731377eb9'
          file='.deploy/app637-preview-live-bridge-off.trigger'
          test -f "$file"
          grep -Fxq 'mode=stage-from-current-live-and-disable-only-bridge' "$file"
          grep -Fxq 'approved_preview_parent=2c1211d4a74f81b743f7dac110b1ed9731377eb9' "$file"
          grep -Fxq 'live_version=5d0f74b1-84bf-4f96-a9e4-51bea25736fa' "$file"
          expected="$(printf '%s\n' "$file" '.github/workflows/follow-637-preview-live-bridge-off.yml' 'scripts/app637-preview-bridge-off-from-live.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-only HEAD^1 HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual"
          echo 'APP637_PREVIEW_PARENT_AND_SCOPE=PASS'
          echo 'APP637_PARENT=2c1211d4a74f81b743f7dac110b1ed9731377eb9' >> "$GITHUB_ENV"
      - name: Clone active version, disable owner bridge only, verify exact source
        run: node scripts/app637-preview-bridge-off-from-live.mjs --apply-once
