          node scripts/verify-402-private-heart-count-pair.mjs
          node scripts/verify-416-canonical-no-early-flush.mjs
          node scripts/verify-416-server-rtdb-seal.mjs
          node scripts/verify-416-server-only-click.mjs
          node scripts/verify-416-private-callable-master.mjs
          node scripts/verify-416-private-handoff-atomic.mjs
          node scripts/verify-416-cross-env-ordering.mjs
          node scripts/verify-432-stage416-settlement-stale-cache.mjs
          node scripts/verify-433-stage416-public-5min-gap.mjs
          node scripts/verify-434-stage416-public-window-core.mjs
          node scripts/verify-435-stage416-public-window-register.mjs
          node scripts/verify-436-stage416-public-register-checkpoint.mjs
          node scripts/verify-437-stage416-public-projection.mjs
          node scripts/verify-438-stage416-public-release.mjs
