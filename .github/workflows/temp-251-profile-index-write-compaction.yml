name: TEMP 251 Profile Indexed-Write Compaction Apply

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-251-profile-index-write-compaction.py'

permissions:
  contents: write

concurrency:
  group: soridraw-251-profile-index-write-compaction
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact profile indexed-write compaction
        run: python .deploy/apply-251-profile-index-write-compaction.py
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify profile cost guards
        run: node scripts/verify-explore-deploy-preflight.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Worker syntax and lock
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          grep -q 'SORIDRAW_PROFILE_INDEXED_WRITE_COMPACTION_251_20260930' cloudflare/explore-worker/canonical/preview-worker.js
          echo PROFILE_251_CANONICAL_LOCK=PASS
      - name: Commit generated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             cloudflare/explore-worker/canonical/preview-worker.js             cloudflare/explore-worker/canonical/source-sha256.txt             scripts/verify-explore-deploy-preflight.mjs
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'perf(preview): avoid unchanged indexed profile writes'
          git push origin HEAD:preview
