name: SORIDRAW 089 Cross-device Like Repair
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-089-like-cross-device-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply 089 client consistency repair
        run: python3 scripts/temp-089-like-cross-device-repair.py
      - name: Align retained verifiers with 089 count rule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p87 = Path('scripts/verify-087-liked-card-consistency.mjs')
          s87 = p87.read_text()
          old87 = "assert.match(page, /setProfileLikedTracks\\(applyPersonalOverlay\\)/);"
          new87 = "assert.doesNotMatch(page, /setProfileLikedTracks\\(applyPersonalOverlay\\)/);"
          if s87.count(old87) != 1:
              raise SystemExit(f'087 verifier overlay assertion count={s87.count(old87)}')
          p87.write_text(s87.replace(old87, new87, 1))

          p88 = Path('scripts/verify-088-same-session-liked-heart.mjs')
          s88 = p88.read_text()
          old88 = "assert.match(page, /const normalizedLikedRows = normalizedRows\\.map/);"
          new88 = "assert.match(page, /const normalizedLikedRows = normalizedRows;/);"
          if s88.count(old88) != 1:
              raise SystemExit(f'088 verifier normalized rows assertion count={s88.count(old88)}')
          p88.write_text(s88.replace(old88, new88, 1))
          PY
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Like regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-085-liked-profile.mjs
          node scripts/verify-086-liked-sync-repair.mjs
          node scripts/verify-087-liked-card-consistency.mjs
          node scripts/verify-088-same-session-liked-heart.mjs
          node scripts/verify-089-like-cross-device-consistency.mjs
          node scripts/verify-explore-like-cost-optimization.mjs
          node scripts/verify-081-page-exit-batch.mjs
          node scripts/verify-084-publication-write-returning.mjs
      - name: Commit 089 product code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'andrawing1212'
          git config user.email 'andrawing1212@gmail.com'
          git add src/services/exploreLikeService.ts src/pages/ExplorePage.tsx public/app-version.json scripts/verify-087-liked-card-consistency.mjs scripts/verify-088-same-session-liked-heart.mjs scripts/verify-089-like-cross-device-consistency.mjs
          git diff --cached --check
          git commit -m 'fix(preview): unify cross-device like state and count 089'
          git push origin HEAD:preview
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
