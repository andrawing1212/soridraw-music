name: SORIDRAW Fix Stage4 Launcher 2026-09-05
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-fix-stage4-launcher-20260905.yml'
permissions:
  contents: write
jobs:
  fix-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20
      - name: Fix stage4 baseline guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/temp-stage4-recent-musicnote-safety-20260905.yml')
          s = p.read_text(encoding='utf-8')
          old = '''          test "$(git rev-parse HEAD)" = "0e3e05b25cbc1f1bd41470b091a3fe453525e378" || {
            echo "preview HEAD moved before stage4 apply; refusing stale patch"
            git rev-parse HEAD
            exit 20
          }
'''
          new = '''          git merge-base --is-ancestor 0e3e05b25cbc1f1bd41470b091a3fe453525e378 HEAD
          git diff --quiet 0e3e05b25cbc1f1bd41470b091a3fe453525e378..HEAD -- src/App.tsx functions/src/index.ts || {
            echo "preview source moved before stage4 apply; refusing stale patch"
            git diff --stat 0e3e05b25cbc1f1bd41470b091a3fe453525e378..HEAD -- src/App.tsx functions/src/index.ts
            exit 20
          }
'''
          if s.count(old) != 1:
              raise SystemExit('stage4 baseline guard anchor mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/temp-stage4-recent-musicnote-safety-20260905.yml
          git commit -m 'chore(preview): fix stage4 baseline guard'
          git push origin HEAD:preview
