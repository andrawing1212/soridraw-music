name: Temp 1051 Library Catalog Authority

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1051-library-catalog-authority.yml']

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PREVIEW_HEAD: 74b5155068784ba009bb5c8a535ccb7de2ae6c05
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 30

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PREVIEW_HEAD"

      - name: Make Library full Catalog authoritative and More local-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/SunoLibraryPage.tsx')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: anchor missing')
              s = s.replace(old, new, 1)

          once(
              "const SORIDRAW_923_FINAL_FIRESTORE_GUARD = true;\n",
              "const SORIDRAW_923_FINAL_FIRESTORE_GUARD = true;\nconst SORIDRAW_LIBRARY_FULL_CATALOG_AUTHORITY_1051 = true;\n",
              'marker',
          )

          start = s.index("  const tracksRef = collection(db, 'suno_tracks', uid, 'tracks');\n")
          end = s.index("\n  let libraryBundleReadInFlight = false;", start)
          s = s[:start] + "  // 1051: Library workspace no longer owns a Firestore page bootstrap.\n  // The shared server-authoritative Catalog is the only list source; durable cache is instant paint only.\n" + s[end:]

          old_ondata = '''        const list = Array.isArray(bundle.items) ? bundle.items : [];
        session.tracks = mergeLibraryLatestBundleWithCache(
          list,
          session.tracks,
          bundle.cursorCreatedAtMs,
          bundle.hasMore,
        );
        session.lastDoc = bundle.cursorCreatedAtMs > 0 ? new Date(bundle.cursorCreatedAtMs) : null;
        const hasOlderCachedRows = session.tracks.length > list.length;
        const isFullCatalogSnapshot = bundle.schemaVersion === 1001;
        session.hasMore = isFullCatalogSnapshot
          ? false
          : Boolean(bundle.hasMore || hasOlderCachedRows || list.length >= WORKSPACE_SERVER_PAGE_SIZE);
        session.paginationFallback = false;
        session.ready = true;
        saveLibraryWorkspaceTrackCache(uid, session.tracks);'''
          new_ondata = '''        const list = Array.isArray(bundle.items) ? bundle.items : [];
        const isFullCatalogSnapshot = bundle.schemaVersion === 1001;
        session.tracks = isFullCatalogSnapshot
          ? mergeLibraryWorkspaceSessionTracks(list, [])
          : mergeLibraryLatestBundleWithCache(list, session.tracks, bundle.cursorCreatedAtMs, bundle.hasMore);
        session.lastDoc = null;
        session.hasMore = isFullCatalogSnapshot ? false : Boolean(bundle.hasMore);
        session.paginationFallback = false;
        session.ready = true;
        saveLibraryWorkspaceTrackCache(uid, session.tracks);'''
          once(old_ondata, new_ondata, 'catalog onData authority')

          old_missing = '''      onMissing: (meta) => {
        libraryBundleReadInFlight = false;
        if (meta.fromCache) return;
        void bootstrapCachelessLibraryFromServerOnce();
      },
      onError: (error) => {
        libraryBundleReadInFlight = false;
        console.warn('Library bundle unavailable; using bounded source fallback.', error);
        void bootstrapCachelessLibraryFromServerOnce();
      },'''
          new_missing = '''      onMissing: (meta) => {
        libraryBundleReadInFlight = false;
        if (meta.fromCache) return;
        // Server Catalog missing: keep any durable local rows, but never fall back
        // to Firestore list paging. A later profile/version signal retries Catalog.
        session.hasMore = false;
        session.paginationFallback = false;
        session.ready = true;
        emitLibraryWorkspaceSession(session);
      },
      onError: (error) => {
        libraryBundleReadInFlight = false;
        console.warn('Library Catalog unavailable; keeping local cache without Firestore paging.', error);
        session.hasMore = false;
        session.paginationFallback = false;
        session.ready = true;
        emitLibraryWorkspaceSession(session);
      },'''
          once(old_missing, new_missing, 'remove bounded fallback')

          old_hydrate = '''        if (shouldVerifyLibraryBundle() && readRemoteLibraryVersion() > readLibraryBundleLocalSyncVersion(uid)) {
          startLibraryBundleVerification();
        }
        return;'''
          new_hydrate = '''        // A durable cache may paint instantly, but it never proves completeness.
        // Verify the shared Catalog once for this app session so a historical partial
        // workspace cache cannot become the authoritative Library list.
        startLibraryBundleVerification();
        return;'''
          once(old_hydrate, new_hydrate, 'always verify catalog after durable paint')

          load_start = s.index("  const loadMoreWorkspaceTracks = async () => {\n")
          load_end = s.index("\n  const playlistLiveModeActive", load_start)
          new_load = '''  const loadMoreWorkspaceTracks = async () => {
    // 1051: UI pagination only. The full Library Catalog is already in memory/IndexedDB.
    // Repeated More clicks must never issue a Firestore list query.
    setWorkspaceVisibleCount((prev) => Math.min(prev + WORKSPACE_PAGE_SIZE, filteredTracks.length));
  };
'''
          s = s[:load_start] + new_load + s[load_end:]

          # Old 10-row server paging constants are no longer a Library workspace source.
          s = s.replace("const WORKSPACE_SERVER_PAGE_SIZE = 10;\nconst WORKSPACE_SERVER_FETCH_SIZE = WORKSPACE_SERVER_PAGE_SIZE;\n", "")

          # Durable cache reconstruction must not manufacture a server cursor/hasMore signal.
          old_cursor = '''        const oldestCachedTrack = session.tracks[session.tracks.length - 1] || null;
        const cachedCursorMs = getLibraryWorkspaceTrackCreatedAtMs(oldestCachedTrack);
        // Reconstruct a bounded cursor from the durable cache so browser/app
        // restart never forces a full collection rebuild. At worst an exact
        // 10-item terminal cache can cause one bounded empty-page check.
        session.lastDoc = cachedCursorMs > 0 ? new Date(cachedCursorMs) : null;
        session.hasMore = session.tracks.length >= WORKSPACE_SERVER_PAGE_SIZE && cachedCursorMs > 0;'''
          new_cursor = '''        // Durable cache is instant paint only. Completeness is established only by
        // the shared Catalog verification below, never by reconstructing a Firestore cursor.
        session.lastDoc = null;
        session.hasMore = false;'''
          once(old_cursor, new_cursor, 'remove reconstructed server cursor')

          # Helper is no longer needed for runtime decision making after 1051.
          should_start = s.find("  const shouldVerifyLibraryBundle = () => {\n")
          if should_start != -1:
              should_end = s.index("\n\n  let libraryHydrationStarted", should_start)
              s = s[:should_start] + s[should_end+2:]

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          grep -q 'SORIDRAW_LIBRARY_FULL_CATALOG_AUTHORITY_1051' src/pages/SunoLibraryPage.tsx
          grep -q 'Repeated More clicks must never issue a Firestore list query' src/pages/SunoLibraryPage.tsx
          ! grep -q 'bootstrapCachelessLibraryFromServerOnce' src/pages/SunoLibraryPage.tsx
          ! grep -q 'WORKSPACE_SERVER_PAGE_SIZE' src/pages/SunoLibraryPage.tsx
          ! grep -q 'WORKSPACE_SERVER_FETCH_SIZE' src/pages/SunoLibraryPage.tsx
          test "$(git diff --name-only | tr '\n' ' ')" = "src/pages/SunoLibraryPage.tsx "

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: TypeScript and app build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
          test -s dist/index.html
          echo '1051_APP=PASS'

      - name: Functions build and Library regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle
          echo '1051_LIBRARY_TESTS=PASS'

      - name: Commit runtime change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add src/pages/SunoLibraryPage.tsx
          git commit -m 'fix(preview): make Library Catalog authoritative'
          git push origin HEAD:preview
          echo "1051_RUNTIME_COMMIT=$(git rev-parse HEAD)"
