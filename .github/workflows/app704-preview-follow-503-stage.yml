name: SORIDRAW APP704 PREVIEW Follow 503 Stage Diagnostic
on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/lib/follow-503-stage-704.mjs'
      - 'scripts/app704-preview-follow-503-stage-release.mjs'
      - 'scripts/verify-704-follow-stage-503.mjs'
      - '.github/workflows/app704-preview-follow-503-stage.yml'
  push:
    branches: [preview]
    paths:
      - '.deploy/app704-preview-follow-503-stage.trigger'
permissions:
  contents: read
concurrency:
  group: soridraw-app704-preview-follow-503-guard
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact follow guard compatibility and rollback script syntax
        run: |
          set -euo pipefail
          node --check scripts/lib/follow-503-stage-704.mjs
          node --check scripts/app704-preview-follow-503-stage-release.mjs
          node scripts/verify-704-follow-stage-503.mjs
          node scripts/verify-031-follow-cooldown.mjs
  release:
    if: github.event_name == 'push' && github.repository == 'andrawing1212/soridraw-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact authorized PREVIEW-only follow guard release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview
          test "$(git diff --name-only HEAD^1 HEAD)" = '.deploy/app704-preview-follow-503-stage.trigger'
          f=.deploy/app704-preview-follow-503-stage.trigger
          grep -Fxq 'approval=director_yes_20261117_follow_503_trace_preview_worker' "$f"
          grep -Fxq "source_parent=$(git rev-parse HEAD^1)" "$f"
          grep -Fxq 'expected_active=06567310-cb4e-455c-8a84-f02696823f4c' "$f"
          grep -Fxq 'scope=one_active_preview_module_503_stage_only' "$f"
          grep -Fxq 'shared_d1_r2_data_no_change=true' "$f"
          grep -Fxq 'test_production_owner_no_change=true' "$f"
          node --check scripts/lib/follow-503-stage-704.mjs
          node --check scripts/app704-preview-follow-503-stage-release.mjs
          node scripts/verify-704-follow-stage-503.mjs
          node scripts/verify-031-follow-cooldown.mjs
          echo "APP704_APPROVED_PARENT=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - name: Read-only active version, runtime, bindings and one-module patch preflight
        run: node scripts/app704-preview-follow-503-stage-release.mjs --preflight
      - name: Stage one PREVIEW Worker module and activate with rollback on failure
        run: node scripts/app704-preview-follow-503-stage-release.mjs --apply-once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app704-preview-follow-503-stage-result
          path: app704-worker-result.json
          if-no-files-found: ignore
          retention-days: 7
