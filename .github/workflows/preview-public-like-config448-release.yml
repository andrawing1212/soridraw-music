name: SORIDRAW PREVIEW Public Like Support Release

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/preview-public-like-config448.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-preview-public-like-support-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT: soridraw-app-866a5

    steps:
      - name: Resolve exact PREVIEW source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          trigger_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.deploy/preview-public-like-config448.trigger"
          raw="$(curl -fsSL "$trigger_url")"
          target="$(printf '%s\n' "$raw" | sed -n 's/^product_code_target=//p' | tail -1 | tr -d '\r')"
          fn="$(printf '%s\n' "$raw" | sed -n 's/^target_function=//p' | tail -1 | tr -d '\r')"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          case "$fn" in
            publicLikeWindowConfig448Candidate|publicLikeRelease416Candidate|masterGetLikeBatchTiming416|masterSetLikeBatchTiming416) ;;
            *) echo "REFUSE_TARGET_FUNCTION=$fn"; exit 3 ;;
          esac
          preflight="$(printf '%s\n' "$raw" | sed -n 's/^preflight_only=//p' | tail -1 | tr -d '\r')"
          case "$fn" in
            masterGetLikeBatchTiming416|masterSetLikeBatchTiming416)
              case "$preflight" in true|false) ;; *) echo "MASTER_PREFLIGHT_FLAG_REQUIRED"; exit 3 ;; esac
              ;;
            *) test -z "$preflight" || test "$preflight" = false ;;
          esac
          echo "preflight=$preflight" >> "$GITHUB_OUTPUT"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "fn=$fn" >> "$GITHUB_OUTPUT"
          echo "LOCKED_PUBLIC_LIKE_SUPPORT_SHA=$target"
          echo "LOCKED_PUBLIC_LIKE_SUPPORT_FUNCTION=$fn"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Refuse unsafe scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "${{ steps.source.outputs.sha }}" origin/preview
          trigger="$RUNNER_TEMP/preview-public-like-config448.trigger"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.deploy/preview-public-like-config448.trigger" -o "$trigger"
          grep -Fxq "target_function=${{ steps.source.outputs.fn }}" "$trigger"
          grep -Fxq 'shared_d1_change=false' "$trigger"
          grep -Fxq 'shared_rtdb_rules_change=false' "$trigger"
          grep -Fxq 'user_data_change=false' "$trigger"
          grep -Fxq 'test_production_change=false' "$trigger"
          git rev-parse origin/main > "$RUNNER_TEMP/main-before"
          git rev-parse origin/production > "$RUNNER_TEMP/prod-before"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and verify exact Function
        shell: bash
        run: |
          set -euo pipefail
          target_fn="${{ steps.source.outputs.fn }}"
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          node scripts/verify-448-common-public-like-window.mjs
          d=".preview-public-like-support"
          rm -rf "$d"
          mkdir -p "$d/lib"

          if [ "$target_fn" = 'publicLikeWindowConfig448Candidate' ]; then
            cp functions/lib/exploreLikePublicConfig448.js "$d/lib/"
            cp functions/lib/exploreLikeBatchSettings416.js "$d/lib/"
            cp functions/lib/exploreLikeEnvironment416.js "$d/lib/"
            cat > "$d/lib/index.js" <<'NODE'
          "use strict";
          const admin=require("firebase-admin");
          admin.initializeApp({
            databaseURL:"https://soridraw-app-866a5-default-rtdb.firebaseio.com"
          });
          exports.publicLikeWindowConfig448Candidate =
            require("./exploreLikePublicConfig448").publicLikeWindowConfig448Candidate;
          NODE
          elif [ "$target_fn" = 'masterGetLikeBatchTiming416' ] ||
               [ "$target_fn" = 'masterSetLikeBatchTiming416' ]; then
            node scripts/verify-416-like-batch-master.mjs
            cp functions/lib/exploreLikeBatchSettings416.js "$d/lib/"
            cp functions/lib/exploreLikeEnvironment416.js "$d/lib/"
            cat > "$d/lib/index.js" <<'NODE'
          "use strict";
          const admin=require("firebase-admin");
          const {onCall,HttpsError}=require("firebase-functions/v2/https");
          const {STAGE416_ENVIRONMENTS}=require("./exploreLikeEnvironment416");
          const {readLikeBatchTimingAt416,parseLikeBatchTiming416,changeLikeBatchTiming416}=
            require("./exploreLikeBatchSettings416");
          admin.initializeApp({
            databaseURL:"https://soridraw-app-866a5-default-rtdb.firebaseio.com"
          });
          const timingPath=STAGE416_ENVIRONMENTS.preview.timingPath;
          async function requireMaster(request){
            const uid=request.auth?.uid;
            if(!uid)throw new HttpsError("unauthenticated","관리자 로그인이 필요합니다.");
            const snap=await admin.firestore().collection("users").doc(uid).get();
            if(snap.data()?.staffRole!=="master")
              throw new HttpsError("permission-denied","마스터 권한이 필요합니다.");
            return uid;
          }
          exports.masterGetLikeBatchTiming416=onCall(
            {region:"us-central1"},async(request)=>{
              await requireMaster(request);
              return {ok:true,...await readLikeBatchTimingAt416(admin.database(),timingPath)};
            });
          exports.masterSetLikeBatchTiming416=onCall(
            {region:"us-central1"},async(request)=>{
              const uid=await requireMaster(request);
              try {
                const input=parseLikeBatchTiming416(request.data);
                const version=Number(request.data?.expectedVersion);
                const saved=await changeLikeBatchTiming416(
                  admin.database(),uid,input,version,Date.now(),timingPath);
                return {ok:true,...saved,effectiveForNewWindows:true};
              } catch(error) {
                const code=error instanceof Error?error.message:"unknown";
                if(code==="416_INVALID_MASTER_TIMING"||code==="416_INVALID_MASTER_WRITE")
                  throw new HttpsError("invalid-argument","저장 주기는 1·3·5·10·20분 중 선택해주세요.");
                if(code==="416_MASTER_VERSION_CONFLICT_OR_UNCHANGED")
                  throw new HttpsError("aborted","다른 관리자가 변경했습니다. 최신 설정을 다시 확인해주세요.");
                throw new HttpsError("unavailable","좋아요 저장 주기를 저장하지 못했습니다.");
              }
            });
          NODE
            # Only export the single target. Never deploy the other Master
            # Callable or the Stage416 private/public mutation handlers.
            node - "$d/lib/index.js" "$target_fn" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2],target=process.argv[3];
          const code=fs.readFileSync(file,'utf8');
          const other=target==='masterGetLikeBatchTiming416'
            ?'masterSetLikeBatchTiming416':'masterGetLikeBatchTiming416';
          fs.writeFileSync(file,code+[
            '', 'delete exports.'+other+';',
            'if(Object.keys(exports).join(",")!=="'+target+'")',
            '  throw new Error("MASTER_EXACT_EXPORT_DRIFT");',
            '',
          ].join('\n'));
          NODE
          else
            node scripts/verify-438-stage416-public-release.mjs
            node scripts/verify-439-stage416-public-release-routing.mjs
            node scripts/verify-416-public-function-inventory.mjs selftest
            grep -Fq 'SORIDRAW_PUBLIC_RELEASE416_ENDPOINT' cloudflare/explore-worker/canonical/wrangler.preview.jsonc
            cp functions/lib/exploreLikePublicReleaseEndpoint416.js "$d/lib/"
            cp functions/lib/exploreLikePublicRelease416.js "$d/lib/"
            cp functions/lib/exploreLikeEnvironment416.js "$d/lib/"
            cat > "$d/lib/index.js" <<'NODE'
          "use strict";
          const admin=require("firebase-admin");
          admin.initializeApp({
            databaseURL:"https://soridraw-app-866a5-default-rtdb.firebaseio.com"
          });
          exports.publicLikeRelease416Candidate =
            require("./exploreLikePublicReleaseEndpoint416").publicLikeRelease416Candidate;
          NODE
          fi

          cat > "$d/package.json" <<'JSON'
          {
            "name":"soridraw-preview-public-like-support",
            "private":true,
            "main":"lib/index.js",
            "engines":{"node":"22"},
            "dependencies":{
              "firebase-admin":"^12.0.0",
              "firebase-functions":"^4.5.0"
            }
          }
          JSON
          cat > preview.public-like-support.firebase.json <<'JSON'
          {"functions":{"source":".preview-public-like-support"}}
          JSON
          npm install --prefix "$d" --omit=dev --no-audit --no-fund
          node - "$target_fn" <<'NODE'
          const target=process.argv[2];
          const mod=require('./.preview-public-like-support/lib/index.js');
          if(Object.keys(mod).join(',')!==target)
            throw Error('PUBLIC_LIKE_SUPPORT_SINGLE_EXPORT_DRIFT');
          console.log('PUBLIC_LIKE_SUPPORT_SINGLE_EXPORT=PASS '+target);
          NODE

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Inspect PREVIEW Master timing Functions read-only
        if: contains(steps.source.outputs.fn, 'master')
        shell: bash
        run: |
          set -euo pipefail
          for fn in masterGetLikeBatchTiming416 masterSetLikeBatchTiming416; do
            if gcloud functions describe "$fn" --gen2 --region us-central1 \
              --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/$fn.json" 2>/dev/null; then
              node - "$RUNNER_TEMP/$fn.json" "$fn" <<'NODE'
          const v=require(process.argv[2]);
          console.log("LIVE_MASTER_FUNCTION="+process.argv[3]+":"+v.state+
            ":updated="+String(v.updateTime||"unknown"));
          NODE
            else
              echo "LIVE_MASTER_FUNCTION=$fn:MISSING_OR_UNREADABLE"
            fi
          done
          # Read-only recent failure categories only; never print UID, request
          # payload, log message, stored data or authentication tokens.
          for service in mastersetlikebatchtiming416 mastergetlikebatchtiming416; do
            gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=$service AND timestamp>=\"2026-10-16T04:30:00Z\" AND severity>=ERROR" \
              --project "$FIREBASE_PROJECT" --limit=10 --format=json \
              > "$RUNNER_TEMP/$service-err.json" 2>/dev/null || printf '[]' > "$RUNNER_TEMP/$service-err.json"
            node - "$RUNNER_TEMP/$service-err.json" "$service" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log("LIVE_MASTER_ERROR_EVENTS="+process.argv[3]+":"+
            (Array.isArray(rows)?rows.length:0));
          NODE
          done
          # Read only the small Master policy node. Never emit account UID,
          # raw audit rows, tokens, or other shared user data.
          node <<'NODE'
          const admin=require('./.preview-public-like-support/node_modules/firebase-admin');
          admin.initializeApp({databaseURL:"https://soridraw-app-866a5-default-rtdb.firebaseio.com"});
          (async()=>{
            const snap=await admin.database().ref('likeBatchTiming416/current').get();
            const v=snap.val();
            console.log('MASTER_TIMING_NODE_EXISTS='+Boolean(v));
            if(v&&typeof v==='object'){
              for(const k of ['privateMinutes','publicMinutes','version']){
                const n=Number(v[k]);
                console.log('MASTER_TIMING_'+k.toUpperCase()+'='+
                  (Number.isSafeInteger(n)?n:'INVALID'));
              }
              console.log('MASTER_TIMING_AUDIT_LENGTH='+
                (Array.isArray(v.audit)?v.audit.length:0));
            }
          })().catch(e=>{console.log('MASTER_TIMING_READONLY_STATUS=FAILED');process.exit(2)});
          NODE
          for service in mastersetlikebatchtiming416 mastergetlikebatchtiming416; do
            gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=$service AND timestamp>=\"2026-10-16T04:30:00Z\"" \
              --project "$FIREBASE_PROJECT" --limit=100 --format=json \
              > "$RUNNER_TEMP/$service-events.json" 2>/dev/null || printf '[]' > "$RUNNER_TEMP/$service-events.json"
            node - "$RUNNER_TEMP/$service-events.json" "$service" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const status={};
          for(const r of Array.isArray(rows)?rows:[]){
            const code=r?.httpRequest?.status;
            if(Number.isInteger(code)&&code>=100&&code<=599)
              status[String(code)]=(status[String(code)]||0)+1;
          }
          console.log('MASTER_REQUEST_HTTP_STATUS_COUNTS='+process.argv[3]+':'+JSON.stringify(status));
          NODE
          done
          echo 'MASTER_LIVE_READONLY_INSPECTION=PASS'

      - name: Deploy exact PREVIEW Function only
        if: steps.source.outputs.preflight != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_fn="${{ steps.source.outputs.fn }}"
          log="$RUNNER_TEMP/public-like-support-deploy.log"
          set +e
          npx --yes firebase-tools@latest deploy             --project "$FIREBASE_PROJECT"             --config preview.public-like-support.firebase.json             --only "functions:$target_fn"             --non-interactive --force 2>&1 | tee "$log"
          deploy_rc=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_rc" -ne 0 ]; then
            if grep -Fq 'Functions successfully deployed but could not set up cleanup policy' "$log"; then
              gcloud functions describe "$target_fn"                 --gen2 --region "$(case "$target_fn" in masterGetLikeBatchTiming416|masterSetLikeBatchTiming416) echo us-central1;; *) echo asia-northeast3;; esac)" --project "$FIREBASE_PROJECT"                 --format='value(state)' | grep -Fxq ACTIVE
              echo 'PUBLIC_LIKE_SUPPORT_DEPLOY=PASS_CLEANUP_POLICY_WARNING_ONLY'
            else
              exit "$deploy_rc"
            fi
          else
            echo 'PUBLIC_LIKE_SUPPORT_DEPLOY=PASS'
          fi

      - name: Verify Function and protected refs
        if: steps.source.outputs.preflight != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_fn="${{ steps.source.outputs.fn }}"
          gcloud functions describe "$target_fn"             --gen2 --region "$(case "$target_fn" in masterGetLikeBatchTiming416|masterSetLikeBatchTiming416) echo us-central1;; *) echo asia-northeast3;; esac)" --project "$FIREBASE_PROJECT"             --format=json > "$RUNNER_TEMP/public-like-support.json"
          node - "$RUNNER_TEMP/public-like-support.json" "$target_fn" <<'NODE'
          const d=require(process.argv[2]);
          const target=process.argv[3];
          if(String(d.state||'')!=='ACTIVE')throw Error(target+'_NOT_ACTIVE');
          if(target==='publicLikeRelease416Candidate'){
            const secrets=d?.serviceConfig?.secretEnvironmentVariables||[];
            if(!secrets.some(x=>String(x.secret||x.secretName||'').includes('SORIDRAW_PRIVATE_BATCH416_HMAC_SECRET')))
              throw Error('416_PUBLIC_RELEASE_SECRET_BINDING_MISSING');
          }
          console.log('PUBLIC_LIKE_SUPPORT_FUNCTION_ACTIVE=PASS '+target);
          NODE
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/prod-before")"
          echo 'TEST_PRODUCTION_UNCHANGED=PASS'
