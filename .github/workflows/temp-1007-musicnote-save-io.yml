name: TEMP 1007 Music Note Save IO

on:
  push:
    branches: [preview-musicnote-save-io-opt]
    paths:
      - '.github/workflows/temp-1007-musicnote-save-io.yml'

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-musicnote-save-io-opt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply bounded Music Note save patch
        run: python3 .deploy/temp-1007-musicnote-save-io.py
      - name: Verify exact scope and IO contract
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/App.tsx "
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text(encoding='utf-8')
          i=s.index('const findServerMatchingFavorites = async')
          j=s.index('const findServerExistingFavorite = async', i)
          block=s[i:j]
          assert "where('soridrawSongId', '==', stableSongId)" in block
          assert 'limit(2)' in block
          stable=block.index("where('soridrawSongId', '==', stableSongId)")
          legacy=block.index("where('favoriteKey', '==', songIdentityKey)")
          assert stable < legacy
          assert 'if (stableLookupSucceeded) return Array.from(matches.values());' in block
          # Legacy fallback is intentionally preserved only for old songs/query failure.
          assert "where('title', '==', titleCandidate)" in block
          # Save still performs exactly one favorite document write plus the existing
          # user sync/count write; no new write path was added.
          save_i=s.index('const createdAtMs = Date.now();', j)
          save_j=s.index("showToast('저장되었습니다.')", save_i)
          save=s[save_i:save_j]
          assert save.count("addDoc(collection(db, 'favorites')") == 1
          assert save.count("updateDoc(doc(db, 'users', user.uid)") == 1
          print('Music Note save IO contract: PASS')
          PY
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit verified source only
        run: |
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "perf(preview): bound recent-song Music Note save lookup"
          git push origin HEAD:preview-musicnote-save-io-opt
