name: SORIDRAW APP638 Existing Staged PREVIEW Bridge OFF

on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/app638-resume-staged-preview-bridge-off.mjs'
      - '.github/workflows/follow-638-stage-reuse-bridge-off.yml'
  push:
    branches: [preview]
    paths:
      - '.deploy/app638-stage-reuse-bridge-off.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-app638-owner-safe-off
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify staged version reuse code
        run: |
          node --check scripts/app638-resume-staged-preview-bridge-off.mjs
          node scripts/app638-resume-staged-preview-bridge-off.mjs --self-test

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Lock exact release scope and prior failed staging SHA
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/app638-resume-staged-preview-bridge-off.mjs
          node scripts/app638-resume-staged-preview-bridge-off.mjs --self-test
          test "$GITHUB_REF" = 'refs/heads/preview'
          test "$(git rev-parse HEAD^1)" = '72641805eae483592219e27ac4fbc4cd98fd17b8'
          file='.deploy/app638-stage-reuse-bridge-off.trigger'
          test -f "$file"
          grep -Fxq 'mode=reuse-existing-staged-version-only' "$file"
          grep -Fxq 'approved_preview_parent=72641805eae483592219e27ac4fbc4cd98fd17b8' "$file"
          expected="$(printf '%s\n' "$file" '.github/workflows/follow-638-stage-reuse-bridge-off.yml' 'scripts/app638-resume-staged-preview-bridge-off.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-only HEAD^1 HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual"
          echo 'APP638_EXACT_APPROVED_SCOPE=PASS'
          echo 'APP638_PARENT=72641805eae483592219e27ac4fbc4cd98fd17b8' >> "$GITHUB_ENV"
      - name: Verify old staged OFF Worker and deploy only if exact one is valid
        run: node scripts/app638-resume-staged-preview-bridge-off.mjs --apply-once
