name: Temp Package Preview 1054

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-package-preview-1054.yml']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 50

      - name: Archive exact clean deployed source
        shell: bash
        run: |
          set -euo pipefail
          TARGET='0a958376303dc7192368e4e47dbf9d2c52f124c7'
          git cat-file -e "$TARGET^{commit}"
          git archive --format=zip --prefix='SORIDRAW_PREVIEW_0a958376/' -o SORIDRAW_PREVIEW_0a958376_warm_cache_zero.zip "$TARGET"
          test -s SORIDRAW_PREVIEW_0a958376_warm_cache_zero.zip
          sha256sum SORIDRAW_PREVIEW_0a958376_warm_cache_zero.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PREVIEW_0a958376_warm_cache_zero
          path: SORIDRAW_PREVIEW_0a958376_warm_cache_zero.zip
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup temporary packaging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git rm .github/workflows/temp-package-preview-1054.yml
          git commit -m 'chore(preview): remove temporary ZIP packaging workflow'
          git push origin HEAD:preview
          echo "FINAL_PREVIEW_HEAD=$(git rev-parse HEAD)"
