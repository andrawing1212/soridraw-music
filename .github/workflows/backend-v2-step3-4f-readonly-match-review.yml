name: SORIDRAW Backend V2 Step 3-4f Readonly Match Review

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4f-readonly-match-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      EXPECTED_RECENT_BUNDLES: '10'
      EXPECTED_RECENT_ITEMS: '68'
      APPROVED_SCOPE: Step 3-4f read-only match and risk review approved 2026-08-26 KST

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - run: npm ci --ignore-scripts

      - name: Read-only live match and risk review
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$TARGET_PROJECT"
          export GCLOUD_PROJECT="$TARGET_PROJECT"
          export GOOGLE_CLOUD_QUOTA_PROJECT="$TARGET_PROJECT"
          node <<'NODE'
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = process.env.TARGET_PROJECT;
          const bucketName = process.env.TARGET_BUCKET;
          const backupPrefix = process.env.BACKUP_PREFIX;
          const expectedManifestHash = process.env.EXPECTED_MANIFEST_SHA256;
          const expectedRecentBundles = Number(process.env.EXPECTED_RECENT_BUNDLES || 0);
          const expectedRecentItems = Number(process.env.EXPECTED_RECENT_ITEMS || 0);
          const approvedScope = String(process.env.APPROVED_SCOPE || '');

          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          if (bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('BUCKET_PIN_MISMATCH');
          if (expectedRecentBundles !== 10 || expectedRecentItems !== 68) throw new Error('RECENT_SCOPE_MISMATCH');
          if (!approvedScope.includes('3-4f') || !approvedScope.toLowerCase().includes('read-only')) throw new Error('READONLY_APPROVAL_MARKER_MISSING');

          const asObject = (value) => value && typeof value === 'object' && !Array.isArray(value) ? value : null;
          const nonEmptyString = (value) => typeof value === 'string' && value.trim() ? value.trim() : null;
          const firstString = (record, keys) => {
            for (const key of keys) {
              const value = nonEmptyString(record?.[key]);
              if (value) return value;
            }
            return null;
          };
          const stableHash = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const deterministicRecentSongId = (uid, recentDocumentPath, index) => `v1r_${stableHash(`${uid}\n${recentDocumentPath}\n${index}`).slice(0, 32)}`;
          const deterministicFavoriteSongId = (favoriteDocumentPath) => `v1f_${stableHash(favoriteDocumentPath).slice(0, 32)}`;

          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string', 'boolean'].includes(typeof value)) return value;
            if (typeof value === 'number') {
              if (Number.isNaN(value)) return { __type: 'number', value: 'NaN' };
              if (value === Infinity) return { __type: 'number', value: 'Infinity' };
              if (value === -Infinity) return { __type: 'number', value: '-Infinity' };
              if (Object.is(value, -0)) return { __type: 'number', value: '-0' };
              return value;
            }
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return { __type: 'bytes', base64: Buffer.from(value).toString('base64') };
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return { __type: 'date', iso: value.toISOString() };
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return { __type: 'timestamp', seconds: value.seconds, nanoseconds: value.nanoseconds };
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return { __type: 'geopoint', latitude: value.latitude, longitude: value.longitude };
            if (typeof value?.path === 'string' && value?.firestore) return { __type: 'reference', path: value.path };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));
            throw new Error('UNSUPPORTED_VALUE_TYPE');
          };
          const digest = (value) => crypto.createHash('sha256').update(JSON.stringify(canonicalize(value))).digest('hex');

          const getProviderTrackIdentity = (payload) => {
            const provider = firstString(payload, ['provider', 'audioProvider', 'sourceProvider', 'musicProvider']);
            const trackId = firstString(payload, ['trackId', 'sourceTrackId', 'providerTrackId', 'sunoId']);
            if (!provider || !trackId) return null;
            return { provider: provider.toLowerCase(), trackId };
          };
          const getAudioIdentity = (payload) => firstString(payload, ['audioUrl', 'audio_url', 'sourceAudioUrl', 'streamAudioUrl']);
          const classifyPair = (favorite, recent) => {
            const favoriteId = nonEmptyString(favorite.id);
            const recentId = nonEmptyString(recent.id);
            if (favoriteId && recentId && favoriteId === recentId) return 'explicit-id';

            const favoriteProvider = getProviderTrackIdentity(favorite);
            const recentProvider = getProviderTrackIdentity(recent);
            if (favoriteProvider && recentProvider && favoriteProvider.provider === recentProvider.provider && favoriteProvider.trackId === recentProvider.trackId) return 'provider-track';

            const favoriteKey = nonEmptyString(favorite.favoriteKey);
            const recentKey = nonEmptyString(recent.favoriteKey);
            const favoriteAudio = getAudioIdentity(favorite);
            const recentAudio = getAudioIdentity(recent);
            if (favoriteKey && recentKey && favoriteKey === recentKey && favoriteAudio && recentAudio && favoriteAudio === recentAudio) return 'legacy-key-audio';
            return null;
          };
          const ruleRank = (rule) => rule === 'explicit-id' ? 3 : rule === 'provider-track' ? 2 : rule === 'legacy-key-audio' ? 1 : 0;

          const metricValue = (point) => {
            const raw = point?.value?.int64Value ?? point?.value?.doubleValue ?? 0;
            const value = Number(raw);
            return Number.isFinite(value) && value > 0 ? value : 0;
          };
          const queryMetric = async (accessToken, metricType, startMs, endMs, recentStartMs) => {
            const params = new URLSearchParams({
              filter: `metric.type = "${metricType}"`,
              'interval.startTime': new Date(startMs).toISOString(),
              'interval.endTime': new Date(endMs).toISOString(),
              view: 'FULL',
              pageSize: '1000',
            });
            let pageToken = '';
            let today = 0;
            let recent = 0;
            let pointCount = 0;
            let pages = 0;
            do {
              if (pageToken) params.set('pageToken', pageToken); else params.delete('pageToken');
              const response = await fetch(`https://monitoring.googleapis.com/v3/projects/${projectId}/timeSeries?${params}`, {
                headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, Accept: 'application/json' },
              });
              const text = await response.text();
              if (!response.ok) {
                const error = new Error(`MONITORING_${response.status}`);
                error.statusCode = response.status;
                throw error;
              }
              const payload = text ? JSON.parse(text) : {};
              for (const series of payload.timeSeries || []) {
                for (const point of series.points || []) {
                  const value = metricValue(point);
                  const end = Date.parse(String(point?.interval?.endTime || ''));
                  today += value;
                  pointCount += 1;
                  if (Number.isFinite(end) && end >= recentStartMs) recent += value;
                }
              }
              pageToken = String(payload.nextPageToken || '');
              if (++pages > 5) throw new Error('MONITORING_PAGINATION_LIMIT');
            } while (pageToken);
            return { today: Math.round(today), recent: Math.round(recent), pointCount };
          };
          const queryFamily = async (accessToken, candidates, startMs, endMs, recentStartMs) => {
            for (const metricType of candidates) {
              try {
                const result = await queryMetric(accessToken, metricType, startMs, endMs, recentStartMs);
                if (result.pointCount > 0) return result;
              } catch (error) {
                if (error?.statusCode === 400 || error?.statusCode === 404) continue;
                throw error;
              }
            }
            return { today: 0, recent: 0, pointCount: 0 };
          };

          const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step34f-readonly-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const bucket = getStorage(app).bucket(bucketName);

            const credential = admin.credential.applicationDefault();
            const token = await credential.getAccessToken();
            const accessToken = String(token?.access_token || '');
            if (!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');
            const requested = ['datastore.entities.get', 'datastore.entities.list'];
            const iamResponse = await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify({ permissions: requested }),
            });
            const iamText = await iamResponse.text();
            if (!iamResponse.ok) throw new Error(`IAM_TEST_${iamResponse.status}`);
            const granted = new Set((JSON.parse(iamText || '{}').permissions || []).map(String));
            if (requested.some((permission) => !granted.has(permission))) throw new Error('READONLY_IAM_MISSING');

            const now = new Date();
            const kstDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
            const dayStartMs = Date.parse(`${kstDate}T00:00:00+09:00`);
            const recentStartMs = now.getTime() - 10 * 60_000;
            const [reads, writes, deletes] = await Promise.all([
              queryFamily(accessToken, ['firestore.googleapis.com/document/read_ops_count', 'firestore.googleapis.com/document/read_count'], dayStartMs, now.getTime(), recentStartMs),
              queryFamily(accessToken, ['firestore.googleapis.com/document/write_ops_count', 'firestore.googleapis.com/document/write_count'], dayStartMs, now.getTime(), recentStartMs),
              queryFamily(accessToken, ['firestore.googleapis.com/document/delete_ops_count', 'firestore.googleapis.com/document/delete_count'], dayStartMs, now.getTime(), recentStartMs),
            ]);
            const safeReadCap = Math.min(10_000, Math.max(0, 50_000 - reads.today - 10_000));
            const estimatedReviewReads = 1900;
            if (safeReadCap < estimatedReviewReads) throw new Error('READONLY_QUOTA_PAUSE');
            console.log('FAVORITES_REVIEW_QUOTA=' + JSON.stringify({ todayReads: reads.today, todayWrites: writes.today, todayDeletes: deletes.today, recent10mReads: reads.recent, recent10mWrites: writes.recent, safeReadCap, estimatedReviewReads }));

            const [manifestBytes] = await bucket.file(`${backupPrefix}/manifest.json`).download();
            if (crypto.createHash('sha256').update(manifestBytes).digest('hex') !== expectedManifestHash) throw new Error('ROLLBACK_MANIFEST_HASH_MISMATCH');
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            if (manifest?.complete !== true || manifest?.targetProjectId !== projectId) throw new Error('ROLLBACK_MANIFEST_INVALID');
            const recentDataset = (manifest.datasets || []).find((entry) => entry?.id === 'user_recent_songs');
            const favoriteDataset = (manifest.datasets || []).find((entry) => entry?.id === 'favorites');
            if (!recentDataset || recentDataset.documentCount !== expectedRecentBundles || recentDataset.fileName !== 'user_recent_songs.ndjson') throw new Error('BACKUP_RECENT_DATASET_INVALID');
            if (!favoriteDataset || favoriteDataset.fileName !== 'favorites.ndjson') throw new Error('BACKUP_FAVORITE_DATASET_INVALID');

            const [[recentBackupBytes], [favoriteBackupBytes]] = await Promise.all([
              bucket.file(`${backupPrefix}/${recentDataset.fileName}`).download(),
              bucket.file(`${backupPrefix}/${favoriteDataset.fileName}`).download(),
            ]);
            if (crypto.createHash('sha256').update(recentBackupBytes).digest('hex') !== recentDataset.sha256) throw new Error('BACKUP_RECENT_HASH_MISMATCH');
            if (crypto.createHash('sha256').update(favoriteBackupBytes).digest('hex') !== favoriteDataset.sha256) throw new Error('BACKUP_FAVORITE_HASH_MISMATCH');
            const recentBackupRecords = recentBackupBytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
            const favoriteBackupRecords = favoriteBackupBytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
            const recentBackupByPath = new Map(recentBackupRecords.map((record) => [String(record.path), record.data]));
            const favoriteBackupByPath = new Map(favoriteBackupRecords.map((record) => [String(record.path), record.data]));

            const recentSnap = await db.collection('user_recent_songs').get();
            if (recentSnap.size !== expectedRecentBundles) throw new Error(`LIVE_RECENT_BUNDLE_COUNT_CHANGED:${recentSnap.size}`);
            const recentSongs = [];
            let recentSourceDrift = 0;
            for (const doc of recentSnap.docs.sort((a, b) => a.ref.path.localeCompare(b.ref.path))) {
              const match = /^user_recent_songs\/([^/]+)$/.exec(doc.ref.path);
              if (!match) throw new Error('UNEXPECTED_RECENT_PATH');
              const backupData = recentBackupByPath.get(doc.ref.path);
              if (!backupData || digest(backupData) !== digest(doc.data())) recentSourceDrift += 1;
              const songs = Array.isArray(doc.data().songs) ? doc.data().songs : [];
              for (let index = 0; index < songs.length; index += 1) {
                const payload = asObject(songs[index]);
                if (!payload) throw new Error('RECENT_ITEM_NOT_OBJECT');
                recentSongs.push({ uid: match[1], sourcePath: doc.ref.path, index, payload, ref: db.doc(`users/${match[1]}/songs/${deterministicRecentSongId(match[1], doc.ref.path, index)}`) });
              }
            }
            if (recentSongs.length !== expectedRecentItems) throw new Error(`LIVE_RECENT_ITEM_COUNT_CHANGED:${recentSongs.length}`);
            if (recentSourceDrift !== 0) throw new Error(`RECENT_SOURCE_DRIFT_AFTER_3_4E:${recentSourceDrift}`);

            const recentV2Snaps = await db.getAll(...recentSongs.map((song) => song.ref));
            let recentV2Missing = 0;
            let recentV2PayloadMismatch = 0;
            for (let index = 0; index < recentV2Snaps.length; index += 1) {
              const snap = recentV2Snaps[index];
              const source = recentSongs[index];
              if (!snap.exists) { recentV2Missing += 1; continue; }
              const data = snap.data();
              const stripped = { ...data };
              for (const key of ['schemaVersion', 'musicNote', 'recentVisible', 'v2UpdatedAtMs', 'legacyRecentIndex']) delete stripped[key];
              if (digest(stripped) !== digest(source.payload) || data.schemaVersion !== 2 || data.recentVisible !== true || data.musicNote !== false || data.legacyRecentIndex !== source.index) recentV2PayloadMismatch += 1;
            }
            if (recentV2Missing || recentV2PayloadMismatch) throw new Error(`RECENT_V2_CHECK_FAILED:${recentV2Missing}:${recentV2PayloadMismatch}`);

            const favoritesSnap = await db.collection('favorites').get();
            const favorites = favoritesSnap.docs.map((doc) => ({ path: doc.ref.path, favoriteId: doc.id, payload: doc.data(), uid: nonEmptyString(doc.data().uid) }));
            const liveFavoritePaths = new Set(favorites.map((favorite) => favorite.path));
            const backupFavoritePaths = new Set(favoriteBackupByPath.keys());
            let addedSinceBackup = 0;
            let missingSinceBackup = 0;
            let changedSinceBackup = 0;
            let unchangedSinceBackup = 0;
            for (const favorite of favorites) {
              const backupData = favoriteBackupByPath.get(favorite.path);
              if (!backupData) addedSinceBackup += 1;
              else if (digest(backupData) === digest(favorite.payload)) unchangedSinceBackup += 1;
              else changedSinceBackup += 1;
            }
            for (const path of backupFavoritePaths) if (!liveFavoritePaths.has(path)) missingSinceBackup += 1;

            const favoriteIdentityCoverage = {
              id: favorites.filter((f) => nonEmptyString(f.payload.id)).length,
              songId: favorites.filter((f) => nonEmptyString(f.payload.songId)).length,
              favoriteKey: favorites.filter((f) => nonEmptyString(f.payload.favoriteKey)).length,
              providerTrack: favorites.filter((f) => Boolean(getProviderTrackIdentity(f.payload))).length,
              audio: favorites.filter((f) => Boolean(getAudioIdentity(f.payload))).length,
            };
            const recentIdentityCoverage = {
              id: recentSongs.filter((s) => nonEmptyString(s.payload.id)).length,
              songId: recentSongs.filter((s) => nonEmptyString(s.payload.songId)).length,
              favoriteKey: recentSongs.filter((s) => nonEmptyString(s.payload.favoriteKey)).length,
              providerTrack: recentSongs.filter((s) => Boolean(getProviderTrackIdentity(s.payload))).length,
              audio: recentSongs.filter((s) => Boolean(getAudioIdentity(s.payload))).length,
            };

            let ambiguousMultipleRecentMatches = 0;
            const provisional = [];
            for (const favorite of favorites) {
              if (!favorite.uid) continue;
              const candidates = recentSongs
                .filter((recent) => recent.uid === favorite.uid)
                .map((recent) => ({ recent, rule: classifyPair(favorite.payload, recent.payload) }))
                .filter((entry) => Boolean(entry.rule));
              if (!candidates.length) continue;
              const bestRank = Math.max(...candidates.map((candidate) => ruleRank(candidate.rule)));
              const best = candidates.filter((candidate) => ruleRank(candidate.rule) === bestRank);
              if (best.length === 1) provisional.push({ favorite, recent: best[0].recent, rule: best[0].rule });
              else ambiguousMultipleRecentMatches += 1;
            }

            const byRecentTarget = new Map();
            for (const candidate of provisional) {
              const key = candidate.recent.ref.path;
              const list = byRecentTarget.get(key) || [];
              list.push(candidate);
              byRecentTarget.set(key, list);
            }
            const duplicateFavoriteTargetCollisions = [...byRecentTarget.values()].filter((items) => items.length > 1).reduce((sum, items) => sum + items.length, 0);
            const approvedStrongMatches = provisional.filter((candidate) => (byRecentTarget.get(candidate.recent.ref.path)?.length || 0) === 1);
            const explicitIdMatches = approvedStrongMatches.filter((match) => match.rule === 'explicit-id').length;
            const providerTrackMatches = approvedStrongMatches.filter((match) => match.rule === 'provider-track').length;
            const legacyKeyAudioMatches = approvedStrongMatches.filter((match) => match.rule === 'legacy-key-audio').length;

            const favoritesMissingUid = favorites.filter((favorite) => !favorite.uid).length;
            const favoritesWithUid = favorites.length - favoritesMissingUid;
            const standaloneFavorites = favorites.length - approvedStrongMatches.length;

            const standaloneRefs = favorites.filter((favorite) => favorite.uid && !approvedStrongMatches.some((match) => match.favorite.path === favorite.path)).map((favorite) => db.doc(`users/${favorite.uid}/songs/${deterministicFavoriteSongId(favorite.path)}`));
            let preexistingStandaloneDestinations = 0;
            let preexistingStandaloneConflicts = 0;
            for (let offset = 0; offset < standaloneRefs.length; offset += 100) {
              const refs = standaloneRefs.slice(offset, offset + 100);
              const snaps = await db.getAll(...refs);
              for (const snap of snaps) {
                if (!snap.exists) continue;
                preexistingStandaloneDestinations += 1;
                const data = snap.data();
                if (data?.schemaVersion !== 2 || data?.musicNote !== true) preexistingStandaloneConflicts += 1;
              }
            }

            const distinctUsers = new Set(favorites.filter((favorite) => favorite.uid).map((favorite) => favorite.uid)).size;
            const projectedWrites = {
              trustedRecentUpdates: approvedStrongMatches.length,
              standaloneCreates: standaloneRefs.length - preexistingStandaloneDestinations,
              blockedMissingUid: favoritesMissingUid,
              totalPotentialWrites: approvedStrongMatches.length + Math.max(0, standaloneRefs.length - preexistingStandaloneDestinations),
            };

            console.log('FAVORITES_MATCH_REVIEW=' + JSON.stringify({
              targetProject: projectId,
              mode: 'READ_ONLY',
              firestoreWrites: 0,
              firestoreDeletes: 0,
              storageWrites: 0,
              recent: { sourceBundles: recentSnap.size, sourceItems: recentSongs.length, v2Verified: recentV2Snaps.length, sourceDrift: recentSourceDrift, v2Missing: recentV2Missing, v2PayloadMismatch: recentV2PayloadMismatch, identityCoverage: recentIdentityCoverage },
              favorites: { liveCount: favorites.length, backupCount: favoriteBackupRecords.length, withUid: favoritesWithUid, missingUid: favoritesMissingUid, distinctUsers, addedSinceBackup, missingSinceBackup, changedSinceBackup, unchangedSinceBackup, identityCoverage: favoriteIdentityCoverage },
              matching: { approvedStrongMatches: approvedStrongMatches.length, explicitIdMatches, providerTrackMatches, legacyKeyAudioMatches, ambiguousMultipleRecentMatches, duplicateFavoriteTargetCollisions, standaloneFavorites },
              destinationRisk: { preexistingStandaloneDestinations, preexistingStandaloneConflicts, standaloneDestinationChecks: standaloneRefs.length },
              projectedWrites
            }));
          })().catch((error) => {
            console.error('FAVORITES_MATCH_REVIEW_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          }).finally(async () => {
            await deleteApp(app);
          });
          NODE
