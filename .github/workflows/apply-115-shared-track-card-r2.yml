name: Apply 115 Shared Track Card R2

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-115-shared-track-card-r2.trigger'

permissions:
  contents: write

concurrency:
  group: apply-115-shared-track-card-r2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply 115 manifest and version
        run: python3 .deploy/apply-115-shared-track-card-r2.py

      - name: Apply Worker patch 062
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/explore-worker/patches/062-shared-track-card-r2.mjs
          tmp="$(mktemp -d)"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$tmp/worker.js"
          SORIDRAW_REMOTE_WORKER_DIR="$tmp" node cloudflare/explore-worker/patches/062-shared-track-card-r2.mjs
          cp "$tmp/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js

      - name: Verify 115 contracts
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-115-shared-track-card-r2.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-114-shared-social-parity.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-113-shared-profile-parity.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-112-shared-feed-parity.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-085-liked-profile.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-055-like-intake-w1.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-080-publication-state-engine.mjs
          test "$(node -p "require('./public/app-version.json').version")" = '115'
          echo '115_STATIC_CONTRACT=PASS'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | grep -v '^dist/' || true)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(cloudflare/explore-worker/canonical/preview-worker\.js|cloudflare/explore-worker/canonical/source-sha256\.txt|cloudflare/explore-worker/release-patches\.json|public/app-version\.json)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected generated changes:'
            echo "$bad"
            exit 1
          fi
          echo 'NO_FIREBASE_FUNCTIONS_CHANGE=true'
          echo 'NO_FIRESTORE_RULES_CHANGE=true'
          echo 'NO_RTDB_RULES_CHANGE=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_USER_DATA_MIGRATION=true'
          echo 'NO_UI_CSS_CHANGE=true'
          echo 'NO_DEPLOYMENT=true'

      - name: Commit PREVIEW 115 source
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            cloudflare/explore-worker/canonical/preview-worker.js
            cloudflare/explore-worker/canonical/source-sha256.txt
            cloudflare/explore-worker/release-patches.json
            public/app-version.json
          )
          if git diff --quiet -- "${tracked[@]}"; then
            echo '115 already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${tracked[@]}"
          git commit -m 'fix: share liked track card cache across environments'
          git push origin HEAD:preview
