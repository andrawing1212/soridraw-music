name: Stage416 PREVIEW Existing Single Function Patch

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/stage416-preview-settle-one-function.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-stage416-preview-backend-release
  cancel-in-progress: false

jobs:
  single-function:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT: soridraw-app-866a5
      TASK_NAME: stage416SettlePrivateWindowCandidate
      TASK_REGION: us-central1

    steps:
      - name: Lock exact PREVIEW code and protected branches
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse unexpected source or environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = preview
          trigger=.deploy/stage416-preview-settle-one-function.trigger
          target="$(sed -n 's/^product_code_target=//p' "$trigger")"
          printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'
          test "$(grep -c '^product_code_target=' "$trigger")" -eq 1
          function_name="$(sed -n 's/^target_function=//p' "$trigger")"
          test "$(grep -c '^target_function=' "$trigger")" -eq 1
          case "$function_name" in
            stage416SettlePrivateWindowCandidate)
              grep -Fxq 'scope=preview_existing_settle_task_only' "$trigger" ;;
            recordPrivateLike416)
              grep -Fxq 'scope=preview_existing_private_click_only' "$trigger" ;;
            *) echo 'UNAPPROVED_FUNCTION_TARGET'; exit 21 ;;
          esac
          echo "PATCH_FUNCTION=$function_name" >> "$GITHUB_ENV"
          preflight_only="$(sed -n 's/^preflight_only=//p' "$trigger")"
          case "$preflight_only" in true|false) ;; *) echo 'INVALID_PREFLIGHT_FLAG'; exit 21;; esac
          echo "PREFLIGHT_ONLY=$preflight_only" >> "$GITHUB_ENV"
          grep -Fxq 'shared_d1_change=false' "$trigger"
          grep -Fxq 'shared_rtdb_rules_change=false' "$trigger"
          grep -Fxq 'worker_change=false' "$trigger"
          grep -Fxq 'hosting_change=false' "$trigger"
          git fetch origin preview main production --no-tags
          git merge-base --is-ancestor "$target" origin/preview
          test "$target" = "$(git rev-parse HEAD^)"
          git rev-parse origin/main > "$RUNNER_TEMP/main-before"
          git rev-parse origin/production > "$RUNNER_TEMP/prod-before"
          git checkout --detach "$target"
          grep -Fq "if(result.reason==='WAITING_FOR_PRIOR_SEAL')" functions/src/exploreLikePrivateDeadline416.ts
          grep -Fq "throw Error('416_WAITING_FOR_PRIOR_SEAL')" functions/src/exploreLikePrivateDeadline416.ts
          grep -Fq "if(result.reason==='NOT_DUE')" functions/src/exploreLikePrivateDeadline416.ts
          grep -Fq "const next=nowMs+Number(result.retryAfterMs||0)+1_000" functions/src/exploreLikePrivateDeadline416.ts
          grep -Fq "SETTLEMENT_TASK_NOT_DELIVERED" functions/src/exploreLikePrivateTask416.ts
          if [ "$function_name" = recordPrivateLike416 ]; then
            grep -Fq "requeueExpiredPrivateWindow416(uid,expiredWindowId,Date.now(),config)" functions/src/exploreLikePrivateCallable416.ts
            grep -Fq "const stableBucket=Math.floor(nowMs/60_000)*60_000+1_000" functions/src/exploreLikePrivateTask416.ts
            grep -Fq "expiredWindowId=previous.id" functions/src/exploreLikePrivateServerClick416.ts
          fi
          echo "LOCKED_ONE_FUNCTION_SOURCE=$target"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify exact like and task behavior
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/verify-416-server-only-click.mjs
          node scripts/verify-416-private-callable-master.mjs
          node scripts/verify-416-private-deadline.mjs
          node scripts/verify-416-private-task-routing.mjs
          node scripts/verify-416-private-final-publisher.mjs
          node scripts/verify-416-finalize-e2e.mjs
          node scripts/verify-401-cross-device-opposite-like.mjs
          node scripts/verify-402-private-heart-count-pair.mjs
          npm run lint
          npm run build
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          echo 'STAGE416_SINGLE_FUNCTION_PREFLIGHT=PASS'

      - name: Prepare only the approved pre-existing Function
        shell: bash
        run: |
          set -euo pipefail
          d=.stage416-single-patch
          mkdir -p "$d/lib"
          for file in exploreLikePrivateTask416 exploreLikePrivateDeadline416 \
             exploreLikePrivateCommit416 exploreLikePrivateSeal416 \
             exploreLikePrivateHandoff416; do
            cp "functions/lib/$file.js" "$d/lib/$file.js"
          done
          if [ "$PATCH_FUNCTION" = recordPrivateLike416 ]; then
            for file in exploreLikeBatchSettings416 exploreLikePrivateCallable416 \
               exploreLikePrivateServerClick416; do
              cp "functions/lib/$file.js" "$d/lib/$file.js"
            done
          fi
          cat > "$d/package.json" <<'JSON'
          {
            "name": "soridraw-stage416-single-patch",
            "private": true,
            "main": "lib/index.js",
            "engines": {"node":"22"},
            "dependencies": {
              "firebase-admin": "^12.0.0",
              "firebase-functions": "^4.5.0"
            }
          }
          JSON
          cat > "$d/lib/index.js" <<'NODE'
          "use strict";
          const admin=require("firebase-admin");
          admin.initializeApp({
            databaseURL:"https://soridraw-app-866a5-default-rtdb.firebaseio.com"
          });
          NODE
          if [ "$PATCH_FUNCTION" = recordPrivateLike416 ]; then
            cat >> "$d/lib/index.js" <<'NODE'
          const {onCall}=require("firebase-functions/v2/https");
          const {handleAuthenticatedPrivateClick416}=
            require("./exploreLikePrivateCallable416");
          exports.recordPrivateLike416=onCall(
            {region:"us-central1",enforceAppCheck:true},
            async(request)=>handleAuthenticatedPrivateClick416(admin.database(),request));
          NODE
          elif [ "$PATCH_FUNCTION" = stage416SettlePrivateWindowCandidate ]; then
            cat >> "$d/lib/index.js" <<'NODE'
          exports.stage416SettlePrivateWindowCandidate =
            require("./exploreLikePrivateTask416").stage416SettlePrivateWindowCandidate;
          NODE
          else
            echo 'STAGE416_SINGLE_SCOPE_DENIED'
            exit 42
          fi
          cat > stage416.single-patch.firebase.json <<'JSON'
          {"functions":{"source":".stage416-single-patch"}}
          JSON
          npm install --prefix "$d" --omit=dev --no-audit --no-fund
          env -u PATCH_FUNCTION node - "$PATCH_FUNCTION" <<'NODE'
          // Firebase's source analyzer may clear workflow-only environment vars.
          // Package discovery must still export exactly the pinned function.
          const expected=process.argv[2];
          const mod=require('./.stage416-single-patch/lib/index.js');
          if(Object.keys(mod).join(',')!==expected)
            throw Error('STAGE416_SINGLE_FUNCTION_EXPORT_SCOPE_DRIFT');
          console.log('STAGE416_ENV_INDEPENDENT_SINGLE_FUNCTION_EXPORT=PASS');
          NODE

      - name: Authenticate Firebase deploy principal
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          project_id: soridraw-app-866a5

      - name: Verify function identity and queue without mutations
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe "$PATCH_FUNCTION" --gen2 --region "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/function-before.json"
          gcloud functions describe "$TASK_NAME" --gen2 --region "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/task-before.json"
          gcloud tasks queues list --location "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/queue-before.json"
          node - "$RUNNER_TEMP/function-before.json" "$RUNNER_TEMP/task-before.json" "$RUNNER_TEMP/queue-before.json" <<'NODE'
          const fs=require('fs');
          const fn=JSON.parse(fs.readFileSync(process.argv[2]));
          const task=JSON.parse(fs.readFileSync(process.argv[3]));
          const q=JSON.parse(fs.readFileSync(process.argv[4])).find(x=>
            String(x.name||'').endsWith('/'+process.env.TASK_NAME));
          if(fn.state!=='ACTIVE'||task.state!=='ACTIVE'||q?.state!=='RUNNING')
            throw Error('STAGE416_FUNCTION_OR_QUEUE_NOT_READY');
          if(process.env.PATCH_FUNCTION==='recordPrivateLike416' &&
             (!fn.serviceConfig?.serviceAccountEmail||
              fn.serviceConfig.serviceAccountEmail!==task.serviceConfig?.serviceAccountEmail))
            throw Error('STAGE416_CALLABLE_SCHEDULER_ACCOUNT_MISMATCH');
          if(!task.serviceConfig?.secretEnvironmentVariables?.some(x=>
            String(x.secret||x.secretName||'').includes('SORIDRAW_PRIVATE_BATCH416_HMAC_SECRET')))
            throw Error('STAGE416_SETTLE_HMAC_SECRET_NOT_BOUND');
          console.log('STAGE416_SINGLE_FUNCTION_QUEUE_AND_IDENTITY_PREFLIGHT=PASS');
          NODE

      - name: Deploy only the approved existing PREVIEW Function
        if: env.PREFLIGHT_ONLY == 'false'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --project "$FIREBASE_PROJECT" \
            --config stage416.single-patch.firebase.json \
            --only "functions:$PATCH_FUNCTION" \
            --non-interactive --force
          echo 'PREVIEW_ONE_APPROVED_FUNCTION_DEPLOY=PASS'

      - name: Verify patched Function and protected environments
        if: env.PREFLIGHT_ONLY == 'false'
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe "$PATCH_FUNCTION" --gen2 --region "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/function-after.json"
          gcloud functions describe "$TASK_NAME" --gen2 --region "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/task-after.json"
          gcloud tasks queues list --location "$TASK_REGION" \
            --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/queue-after.json"
          node - "$RUNNER_TEMP/function-before.json" "$RUNNER_TEMP/function-after.json" "$RUNNER_TEMP/task-before.json" "$RUNNER_TEMP/task-after.json" "$RUNNER_TEMP/queue-after.json" <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync(process.argv[2]));
          const fn=JSON.parse(fs.readFileSync(process.argv[3]));
          const oldTask=JSON.parse(fs.readFileSync(process.argv[4]));
          const task=JSON.parse(fs.readFileSync(process.argv[5]));
          const queue=JSON.parse(fs.readFileSync(process.argv[6])).find(x=>
            String(x.name||'').endsWith('/'+process.env.TASK_NAME));
          if(fn.state!=='ACTIVE'||task.state!=='ACTIVE'||queue?.state!=='RUNNING')
            throw Error('STAGE416_FUNCTION_OR_QUEUE_BROKEN');
          if(before.name!==fn.name || before.serviceConfig?.serviceAccountEmail!==fn.serviceConfig?.serviceAccountEmail)
            throw Error('STAGE416_DEPLOYED_FUNCTION_IDENTITY_CHANGED');
          if(process.env.PATCH_FUNCTION==='recordPrivateLike416' &&
            oldTask.updateTime!==task.updateTime)
            throw Error('STAGE416_UNRELATED_TASK_FUNCTION_CHANGED');
          if(!task.serviceConfig?.secretEnvironmentVariables?.some(x=>
            String(x.secret||x.secretName||'').includes('SORIDRAW_PRIVATE_BATCH416_HMAC_SECRET')))
            throw Error('STAGE416_SETTLE_HMAC_SECRET_LOST');
          console.log('STAGE416_SINGLE_FUNCTION_POSTFLIGHT=PASS');
          NODE
          git fetch origin main production --no-tags
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-before")"
          test "$(git rev-parse origin/production)" = "$(cat "$RUNNER_TEMP/prod-before")"
          echo 'MAIN_PRODUCTION_UNCHANGED=PASS'
          echo 'NO_SHARED_D1_R2_RULES_WORKER_HOSTING_DATA_MUTATION=PASS'

      - name: Confirm preflight-only mode performs no deployment
        if: env.PREFLIGHT_ONLY == 'true'
        run: echo 'STAGE416_SINGLE_FUNCTION_PREFLIGHT_ONLY=PASS;FUNCTIONS_DEPLOY=0;SHARED_DATA_CHANGE=0'
