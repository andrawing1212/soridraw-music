name: SORIDRAW app273 shared-note legacy detail repair

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/repair-273-shared-note-detail.trigger'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      FIREBASE_PROJECT_ID: soridraw-app-866a5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Authenticate Firebase canonical data
        id: firebase-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token

      - name: Read currently shareable public Music Note tracks
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/cloudflare/explore-worker/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/cloudflare/explore-worker/canonical/wrangler.preview.jsonc"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "
            SELECT id,owner_uid,source_id
            FROM tracks
            WHERE source_type='music_note'
              AND is_public=1
              AND status='published'
              AND allow_follower_save=1
            ORDER BY id
            LIMIT 201;
          " --json > "$RUNNER_TEMP/app273-shareable.json"

      - name: Preflight exact stale shared-note copies
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          token=os.environ['FIREBASE_ACCESS_TOKEN']
          project=os.environ['FIREBASE_PROJECT_ID']
          d1_blocks=json.loads(Path(os.environ['RUNNER_TEMP']+'/app273-shareable.json').read_text())
          d1_rows=[r for b in d1_blocks for r in (b.get('results') or []) if r.get('id')]
          if len(d1_rows) > 200:
            raise SystemExit('APP273_FAIL_CLOSED_SHAREABLE_OVER_200')
          public={str(r['id']):r for r in d1_rows}

          def decode(v):
            if not isinstance(v,dict): return None
            if 'nullValue' in v: return None
            if 'stringValue' in v: return v.get('stringValue','')
            if 'booleanValue' in v: return bool(v.get('booleanValue'))
            if 'integerValue' in v: return int(v.get('integerValue','0'))
            if 'doubleValue' in v: return float(v.get('doubleValue',0))
            if 'timestampValue' in v: return v.get('timestampValue')
            if 'arrayValue' in v: return [decode(x) for x in (v.get('arrayValue',{}).get('values') or [])]
            if 'mapValue' in v:
              return {k:decode(x) for k,x in (v.get('mapValue',{}).get('fields') or {}).items()}
            return None

          def decode_doc(doc):
            return {k:decode(v) for k,v in (doc.get('fields') or {}).items()}

          def first(*vals):
            for v in vals:
              if isinstance(v,str) and v.strip(): return v.strip()
            return ''

          def source_lyrics(src):
            nested=src.get('lyrics') if isinstance(src.get('lyrics'),dict) else {}
            ko=first(src.get('editedKoreanLyrics'),src.get('koreanLyrics'),nested.get('korean'),nested.get('ko'))
            en=first(src.get('editedEnglishLyrics'),src.get('englishLyrics'),nested.get('english'),nested.get('foreign'),nested.get('en'))
            legacy=first(src.get('lyrics') if isinstance(src.get('lyrics'),str) else '',src.get('lyricsText'))
            if not ko and not en and legacy:
              if any('\uac00' <= ch <= '\ud7a3' for ch in legacy): ko=legacy
              else: en=legacy
            return {'korean':ko,'english':en}

          query={
            'structuredQuery':{
              'from':[{'collectionId':'favorites'}],
              'where':{'fieldFilter':{
                'field':{'fieldPath':'sourceType'},
                'op':'EQUAL',
                'value':{'stringValue':'shared_music_note'}
              }},
              'limit':201
            }
          }
          endpoint=f"https://firestore.googleapis.com/v1/projects/{urllib.parse.quote(project)}/databases/(default)/documents:runQuery"
          req=urllib.request.Request(endpoint,data=json.dumps(query).encode(),headers={
            'Authorization':f'Bearer {token}',
            'Accept':'application/json',
            'Content-Type':'application/json'
          },method='POST')
          with urllib.request.urlopen(req,timeout=30) as resp:
            rows=json.loads(resp.read().decode())

          docs=[r.get('document') for r in rows if r.get('document')]
          if len(docs)>200:
            raise SystemExit('APP273_FAIL_CLOSED_SHARED_DOCS_OVER_200')

          stats={
            'sharedDocsTotal':len(docs),
            'currentlyShareableMatched':0,
            'notCurrentlyShareableSkipped':0,
            'sourceMissing':0,
            'identityMismatch':0,
            'missingPromptCandidates':0,
            'missingLyricsCandidates':0,
            'repairDocuments':0,
          }
          repairs=[]

          for raw in docs:
            saved=decode_doc(raw)
            track_id=str(saved.get('exploreTrackId') or '').strip()
            if not track_id or track_id not in public:
              stats['notCurrentlyShareableSkipped']+=1
              continue
            pub=public[track_id]
            stats['currentlyShareableMatched']+=1
            source_id=str(pub.get('source_id') or '').strip()
            owner_uid=str(pub.get('owner_uid') or '').strip()
            saved_source=str(saved.get('originalFavoriteId') or '').strip()
            saved_owner=str(saved.get('ownerUid') or saved.get('originalOwnerUid') or '').strip()
            if not source_id or not owner_uid or (saved_source and saved_source != source_id) or (saved_owner and saved_owner != owner_uid):
              stats['identityMismatch']+=1
              continue

            url=f"https://firestore.googleapis.com/v1/projects/{urllib.parse.quote(project)}/databases/(default)/documents/favorites/{urllib.parse.quote(source_id)}"
            sreq=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
            try:
              with urllib.request.urlopen(sreq,timeout=20) as resp:
                source_raw=json.loads(resp.read().decode())
            except Exception as exc:
              if getattr(exc,'code',None)==404:
                stats['sourceMissing']+=1
                continue
              raise

            src=decode_doc(source_raw)
            source_owner=first(src.get('uid'),src.get('ownerUid'))
            if source_owner and source_owner != owner_uid:
              stats['identityMismatch']+=1
              continue

            wanted_prompt=first(src.get('prompt'))
            wanted_lyrics=source_lyrics(src)
            source_has_lyrics=bool(wanted_lyrics['korean'].strip() or wanted_lyrics['english'].strip())
            saved_prompt=first(saved.get('prompt'))
            saved_lyrics=saved.get('lyrics') if isinstance(saved.get('lyrics'),dict) else {}
            saved_has_lyrics=bool(first(saved_lyrics.get('korean'),saved_lyrics.get('english'),saved_lyrics.get('foreign')))

            patch={}
            if wanted_prompt and not saved_prompt:
              patch['prompt']=wanted_prompt
              stats['missingPromptCandidates']+=1
            if source_has_lyrics and not saved_has_lyrics:
              patch['lyrics']=wanted_lyrics
              stats['missingLyricsCandidates']+=1

            if patch:
              patch['sharedDetailVersion']=273
              repairs.append({
                'name':raw['name'],
                'fields':patch,
                'trackId':track_id,
              })

          stats['repairDocuments']=len(repairs)
          if stats['identityMismatch'] or stats['sourceMissing']:
            raise SystemExit('APP273_FAIL_CLOSED_SOURCE_OR_IDENTITY_MISMATCH='+json.dumps(stats,sort_keys=True))
          if len(repairs)>100:
            raise SystemExit('APP273_FAIL_CLOSED_REPAIR_OVER_100')
          Path(os.environ['RUNNER_TEMP']+'/app273-repairs.json').write_text(json.dumps(repairs,ensure_ascii=False))
          print('APP273_PREFLIGHT='+json.dumps(stats,sort_keys=True))
          print('APP273_FIRESTORE_PREFLIGHT_READ_ONLY=PASS')
          print('APP273_TARGETED_ONLY=PASS')
          PY

      - name: Apply only missing legacy detail fields
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          token=os.environ['FIREBASE_ACCESS_TOKEN']
          repairs=json.loads(Path(os.environ['RUNNER_TEMP']+'/app273-repairs.json').read_text())

          def encode(v):
            if isinstance(v,str): return {'stringValue':v}
            if isinstance(v,bool): return {'booleanValue':v}
            if isinstance(v,int): return {'integerValue':str(v)}
            if isinstance(v,dict): return {'mapValue':{'fields':{k:encode(x) for k,x in v.items()}}}
            raise TypeError(type(v))

          for row in repairs:
            fields=row['fields']
            masks='&'.join('updateMask.fieldPaths='+urllib.parse.quote(k,safe='') for k in fields)
            url='https://firestore.googleapis.com/v1/'+row['name']+'?'+masks
            body={'fields':{k:encode(v) for k,v in fields.items()}}
            req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/json',
              'Content-Type':'application/json'
            },method='PATCH')
            with urllib.request.urlopen(req,timeout=20) as resp:
              if resp.status not in (200,201):
                raise SystemExit('APP273_PATCH_FAILED')

          print('APP273_FIRESTORE_WRITES='+str(len(repairs)))
          print('APP273_ONLY_STALE_SHARED_NOTE_DOCS_WRITTEN=PASS')
          PY

      - name: Postcheck repaired shared-note copies
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          token=os.environ['FIREBASE_ACCESS_TOKEN']
          repairs=json.loads(Path(os.environ['RUNNER_TEMP']+'/app273-repairs.json').read_text())

          def decode(v):
            if not isinstance(v,dict): return None
            if 'stringValue' in v: return v.get('stringValue','')
            if 'integerValue' in v: return int(v.get('integerValue','0'))
            if 'mapValue' in v: return {k:decode(x) for k,x in (v.get('mapValue',{}).get('fields') or {}).items()}
            return None

          bad=0
          for row in repairs:
            url='https://firestore.googleapis.com/v1/'+row['name']
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=20) as resp:
              doc=json.loads(resp.read().decode())
            fields={k:decode(v) for k,v in (doc.get('fields') or {}).items()}
            if int(fields.get('sharedDetailVersion') or 0) != 273:
              bad+=1
              continue
            expected=row['fields']
            if 'prompt' in expected and not str(fields.get('prompt') or '').strip(): bad+=1
            if 'lyrics' in expected:
              lyr=fields.get('lyrics') if isinstance(fields.get('lyrics'),dict) else {}
              if not (str(lyr.get('korean') or '').strip() or str(lyr.get('english') or '').strip()): bad+=1
          if bad:
            raise SystemExit('APP273_POSTCHECK_FAILED_'+str(bad))
          print('APP273_POSTCHECK_REPAIRED='+str(len(repairs)))
          print('APP273_SHARED_NOTE_DETAIL_REPAIR=PASS')
          print('APP273_D1_WRITE=0')
          print('APP273_SCHEMA_MIGRATION=0')
          print('APP273_TEST_PRODUCTION_DEPLOY=0')
          PY
