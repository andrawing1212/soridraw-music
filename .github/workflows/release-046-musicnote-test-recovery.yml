name: SORIDRAW 046 Music Note TEST Recovery

on:
  push:
    branches: [diag-045-full-stack-parity-20260908]
    paths: ['.github/workflows/release-046-musicnote-test-recovery.yml']

permissions:
  contents: write

env:
  PREVIEW_BASE: 5008e9ba81fe3b1469e31dae15ee7384c6ecdcbc
  MAIN_BASE: 6d970b0acd182206307b49de23e91cc44c31163c
  FIREBASE_PROJECT: soridraw

jobs:
  recover-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact current baselines
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview main --quiet
          test "$(git rev-parse origin/preview)" = "$PREVIEW_BASE"
          test "$(git rev-parse origin/main)" = "$MAIN_BASE"
          echo BASELINE_GUARD=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate PREVIEW 046 candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B release-046-preview-work origin/preview
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/userDataEngine.ts')
          s=p.read_text()
          old="""    // Missing/stale/unknown proof still validates against the R2 Catalog.\n    // Do not pass the profile sync signal as a hard Worker rebuild requirement.\n    const remote = await readRemoteCatalogSnapshot(kind, uid, 0, local);"""
          new="""    // If the existing user-profile invalidation token proves this browser Catalog is stale,\n    // require that exact revision once. The Worker rebuilds only when its environment R2 is\n    // actually behind; after that, the warm-cache path returns CACHE with no Worker GET.\n    const hardRequiredRevision = knownRemoteRevision > 0\n      && (!local || knownRemoteRevision > local.revision)\n      ? knownRemoteRevision\n      : 0;\n    const remote = await readRemoteCatalogSnapshot(kind, uid, hardRequiredRevision, local);"""
          if old not in s: raise SystemExit('userDataEngine stale-revision anchor missing')
          p.write_text(s.replace(old,new,1))
          p=Path('src/services/appUpdateNotice.ts'); s=p.read_text();
          if "CURRENT_APP_VERSION = '045'" not in s: raise SystemExit('app version 045 anchor missing')
          p.write_text(s.replace("CURRENT_APP_VERSION = '045'","CURRENT_APP_VERSION = '046'",1))
          p=Path('public/app-version.json'); s=p.read_text();
          if '"version": "045"' not in s: raise SystemExit('public version 045 anchor missing')
          p.write_text(s.replace('"version": "045"','"version": "046"',1))
          PY
          cat > scripts/verify-046-catalog-stale-revision-rebuild.mjs <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('src/lib/userDataEngine.ts','utf8');
          for (const token of [
            'const hardRequiredRevision = knownRemoteRevision > 0',
            '&& (!local || knownRemoteRevision > local.revision)',
            'readRemoteCatalogSnapshot(kind, uid, hardRequiredRevision, local)',
            "headers['X-Soridraw-Require-Revision'] = String(hardMinimumRevision)",
            'canUseWarmCatalogWithoutRemote',
          ]) if(!source.includes(token)) throw new Error(`046 token missing: ${token}`);
          if(source.includes('readRemoteCatalogSnapshot(kind, uid, 0, local)')) throw new Error('046 old stale-loop call still present');
          console.log('CATALOG_STALE_REVISION_REBUILD_046=PASS');
          NODE
          npm ci
          npx tsc --noEmit
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-035-auth-nav-readiness.mjs
          node scripts/verify-045-explore-active-revalidation.mjs
          node scripts/verify-046-catalog-stale-revision-rebuild.mjs
          npm run build
          echo PREVIEW_046_VALIDATION=PASS
      - name: Commit validated 046 to PREVIEW
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release@users.noreply.github.com'
          git add src/lib/userDataEngine.ts src/services/appUpdateNotice.ts public/app-version.json scripts/verify-046-catalog-stale-revision-rebuild.mjs
          git commit -m 'fix(preview): rebuild stale environment catalog once 046'
          PREVIEW_046_SHA=$(git rev-parse HEAD)
          git push origin HEAD:preview
          echo "PREVIEW_046_SHA=$PREVIEW_046_SHA" >> "$GITHUB_ENV"
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
      - name: Deploy and verify PREVIEW 046
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-preview.json --non-interactive
          for i in $(seq 1 15); do
            body=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://preview.soridraw.com/app-version.json?release=046-$i" || true)
            echo "$body" | grep -q '"046"' && break
            sleep 4
          done
          echo "$body" | grep -q '"046"'
          echo PREVIEW_046_LIVE=PASS
      - name: Build exact MAIN candidate from validated PREVIEW patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B release-046-main-work origin/main
          for f in src/lib/userDataEngine.ts src/services/appUpdateNotice.ts public/app-version.json scripts/verify-046-catalog-stale-revision-rebuild.mjs; do
            mkdir -p "$(dirname "$f")"
            git show "$PREVIEW_046_SHA:$f" > "$f"
          done
          grep -F 'SORIDRAW(T)' index.html
          grep -F 'soridraw-favicon-test-042.png' index.html
          grep -F 'soridraw-favicon-production-043.png' index.html
          npx tsc --noEmit
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-035-auth-nav-readiness.mjs
          node scripts/verify-045-explore-active-revalidation.mjs
          node scripts/verify-046-catalog-stale-revision-rebuild.mjs
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/main046-index.sha"
          echo MAIN_046_CANDIDATE=PASS
      - name: Commit validated 046 to MAIN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release@users.noreply.github.com'
          git add src/lib/userDataEngine.ts src/services/appUpdateNotice.ts public/app-version.json scripts/verify-046-catalog-stale-revision-rebuild.mjs
          git commit -m 'release(main): promote Music Note stale-catalog recovery 046'
          MAIN_046_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "MAIN_046_SHA=$MAIN_046_SHA" >> "$GITHUB_ENV"
      - name: Deploy exact MAIN 046 build to TEST only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-test.json --non-interactive
          expected=$(cat "$RUNNER_TEMP/main046-index.sha")
          for origin in 'https://soridraw-test.web.app' 'https://test.soridraw.com'; do
            ok=''
            for i in $(seq 1 15); do
              if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$origin/?release=046-$i" -o "$RUNNER_TEMP/test046.html"; then
                actual=$(sha256sum "$RUNNER_TEMP/test046.html" | awk '{print $1}')
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 4
            done
            test "$ok" = yes
          done
          body=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://test.soridraw.com/app-version.json?release=046-final')
          echo "$body" | grep -q '"046"'
          echo TEST_046_LIVE=PASS
      - name: Verify Explore TEST receiver remains same runtime contract
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/explore-test-receiver.txt" -w '%{http_code}' -X POST -H 'Origin: https://test.soridraw.com' 'https://soridraw-explore-test.andrawing1212.workers.dev/__soridraw_explore_feed_mirror_020')
          test "$code" = 404
          echo EXPLORE_TEST_RECEIVER_AUTH_GUARD=PASS
          echo PRODUCTION_DEPLOY=NONE
