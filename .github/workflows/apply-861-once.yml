name: Apply SORIDRAW 861 once

on:
  push:
    branches: [preview]
    paths:
      - .deploy/apply-861-source-trigger.txt

permissions:
  contents: write

concurrency:
  group: apply-soridraw-861-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply 861 changes
        run: python3 .deploy/apply-861.py
      - name: Validate app build
        run: |
          npm ci
          npm run build
      - name: Validate Functions build
        run: |
          npm ci --prefix functions
          npm --prefix functions run build
      - name: Commit 861 source change
        run: |
          git config user.name "andrawing1212"
          git config user.email "andrawing1212@gmail.com"
          printf 'status=success\nversion=861\napp_build=success\nfunctions_build=success\nfinished_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/apply-861-source-result.txt
          git add src/services/geminiService.ts src/services/geminiModelPreferences.ts functions/scripts/apply-gemini-latency.cjs .deploy/apply-861-source-result.txt
          git diff --cached --check
          git commit -m "feat(861): Japanese semantic quality and 3.7 35s-45s policy"
          git push origin HEAD:preview
