name: SORIDRAW 558 Owner Follow Isolated Durable Object Physical Proof
on:
  pull_request:
    branches: [preview]
    paths:
      - '.github/workflows/owner-follow-558-isolated-do.yml'
      - 'scripts/measure-558-owner-do-physical.mjs'
      - 'cloudflare/explore-worker/experiments/owner-follow-isolated-558-entry.mjs'
permissions:
  contents: read
concurrency:
  group: soridraw-owner-558-run-owned
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify one-run synthetic-only Worker and original engine boundaries
        run: |
          set -euo pipefail
          node --check scripts/measure-558-owner-do-physical.mjs
          node --check cloudflare/explore-worker/experiments/owner-follow-isolated-558-entry.mjs
          node scripts/measure-558-owner-do-physical.mjs --self-test
  physical:
    if: ${{ github.event.pull_request.number == 914 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'candidate/app526-owner-follower-live-signal' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install exact pinned Wrangler only
        run: npm ci --prefix cloudflare/explore-worker --ignore-scripts --no-audit --no-fund
      - name: Real Cloudflare run-owned DO persistence alarm replay and cost bounds
        run: node scripts/measure-558-owner-do-physical.mjs
      - name: Always delete only exact run-owned synthetic DO class and Worker
        if: always()
        run: node scripts/measure-558-owner-do-physical.mjs cleanup
      - name: Confirm shared backends and live Workers untouched
        run: echo 'APP558_REAL_ISOLATED_DO_ONLY;SHARED_D1_R2_FUNCTIONS_RULES_WORKERS_HOSTING_UNCHANGED'
