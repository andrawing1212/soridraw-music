name: Temp 1046 Worker Catalog Handler Audit

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1046-worker-catalog-handler-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Print catalog handler and builder
        shell: bash
        run: |
          set -euo pipefail
          grep -n -B 35 -A 180 "getOrBuildCatalog\|handleCatalog\|buildCanonicalCatalog\|X-Soridraw-Known-Revision" cloudflare/media-worker/src/index.js | head -900
