name: SORIDRAW Backend V2 Step 3-4c Playlist Headers

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4c-playlist-headers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playlist-headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PROJECT: soridraw-app-866a5
      TARGET_BUCKET: soridraw-app-866a5.firebasestorage.app
      BACKUP_PREFIX: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z
      BACKUP_MANIFEST: backend-v2-backups/step3-3/backend-v2-backup-2026-08-25T09-20-03-568Z/manifest.json
      EXPECTED_MANIFEST_SHA256: 57cf21a6c2935c8fa658d5e925cf8424b8e54269b314f9e711feded870f49ebb
      EXPECTED_SOURCE_COUNT: '42'
      MAX_WRITES: '42'
      BATCH_SIZE: '21'

    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate exact Firebase project session
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Preflight IAM, free-tier headroom and rollback checkpoint
        shell: bash
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
          GOOGLE_CLOUD_QUOTA_PROJECT: soridraw-app-866a5
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = process.env.TARGET_PROJECT;
          const bucketName = process.env.TARGET_BUCKET;
          const manifestPath = process.env.BACKUP_MANIFEST;
          const expectedManifestHash = process.env.EXPECTED_MANIFEST_SHA256;
          const maxWrites = Number(process.env.MAX_WRITES || 0);
          const batchSize = Number(process.env.BATCH_SIZE || 0);
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          if (bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('BUCKET_PIN_MISMATCH');
          if (maxWrites !== 42 || batchSize !== 21 || batchSize > 25) throw new Error('PLAYLIST_CAP_MISMATCH');

          const metricValue = (point) => {
            const raw = point?.value?.int64Value ?? point?.value?.doubleValue ?? 0;
            const value = Number(raw);
            return Number.isFinite(value) && value > 0 ? value : 0;
          };
          const now = new Date();
          const kstDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
          const dayStartMs = Date.parse(`${kstDate}T00:00:00+09:00`);
          const recentStartMs = now.getTime() - 10 * 60_000;
          const queryMetric = async (accessToken, metricType) => {
            const params = new URLSearchParams({
              filter: `metric.type = "${metricType}"`,
              'interval.startTime': new Date(dayStartMs).toISOString(),
              'interval.endTime': now.toISOString(),
              view: 'FULL',
              pageSize: '1000',
            });
            let pageToken = '';
            let today = 0;
            let recent = 0;
            let pointCount = 0;
            let pages = 0;
            do {
              if (pageToken) params.set('pageToken', pageToken); else params.delete('pageToken');
              const response = await fetch(`https://monitoring.googleapis.com/v3/projects/${projectId}/timeSeries?${params}`, {
                headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, Accept: 'application/json' },
              });
              const text = await response.text();
              if (!response.ok) {
                const error = new Error(`MONITORING_${response.status}`);
                error.statusCode = response.status;
                throw error;
              }
              const payload = text ? JSON.parse(text) : {};
              for (const series of payload.timeSeries || []) {
                for (const point of series.points || []) {
                  const value = metricValue(point);
                  const end = Date.parse(String(point?.interval?.endTime || ''));
                  today += value;
                  pointCount += 1;
                  if (Number.isFinite(end) && end >= recentStartMs) recent += value;
                }
              }
              pageToken = String(payload.nextPageToken || '');
              if (++pages > 5) throw new Error('MONITORING_PAGINATION_LIMIT');
            } while (pageToken);
            return { today: Math.round(today), recent: Math.round(recent), pointCount };
          };
          const queryFamily = async (accessToken, candidates) => {
            for (const metricType of candidates) {
              try {
                const result = await queryMetric(accessToken, metricType);
                if (result.pointCount > 0) return result;
              } catch (error) {
                if (error?.statusCode === 400 || error?.statusCode === 404) continue;
                throw error;
              }
            }
            return { today: 0, recent: 0, pointCount: 0 };
          };

          (async () => {
            const credential = admin.credential.applicationDefault();
            const token = await credential.getAccessToken();
            const accessToken = String(token?.access_token || '');
            if (!accessToken) throw new Error('ACCESS_TOKEN_UNAVAILABLE');

            const requested = ['datastore.entities.get', 'datastore.entities.list', 'datastore.entities.create'];
            const iamResponse = await fetch(`https://cloudresourcemanager.googleapis.com/v1/projects/${projectId}:testIamPermissions`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify({ permissions: requested }),
            });
            const iamText = await iamResponse.text();
            if (!iamResponse.ok) throw new Error(`IAM_TEST_${iamResponse.status}`);
            const granted = new Set((JSON.parse(iamText || '{}').permissions || []).map(String));
            const missing = requested.filter((permission) => !granted.has(permission));
            console.log('PLAYLIST_HEADER_IAM=' + JSON.stringify({ get: granted.has(requested[0]), list: granted.has(requested[1]), create: granted.has(requested[2]) }));
            if (missing.length) throw new Error('PLAYLIST_HEADER_IAM_MISSING:' + missing.join(','));

            const [reads, writes, deletes] = await Promise.all([
              queryFamily(accessToken, ['firestore.googleapis.com/document/read_ops_count', 'firestore.googleapis.com/document/read_count']),
              queryFamily(accessToken, ['firestore.googleapis.com/document/write_ops_count', 'firestore.googleapis.com/document/write_count']),
              queryFamily(accessToken, ['firestore.googleapis.com/document/delete_ops_count', 'firestore.googleapis.com/document/delete_count']),
            ]);
            const safeReadCap = Math.min(10_000, Math.max(0, 50_000 - reads.today - 10_000));
            const safeWriteCap = Math.min(5_000, Math.max(0, 20_000 - writes.today - 4_000));
            const estimatedReads = 350;
            console.log('PLAYLIST_HEADER_QUOTA=' + JSON.stringify({ todayReads: reads.today, todayWrites: writes.today, todayDeletes: deletes.today, recent10mReads: reads.recent, recent10mWrites: writes.recent, safeReadCap, safeWriteCap, estimatedReads, maxWrites }));
            if (safeReadCap < estimatedReads || safeWriteCap < maxWrites) throw new Error('PLAYLIST_HEADER_QUOTA_PAUSE');

            const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step34c-preflight-${Date.now()}`);
            try {
              const [bytes] = await getStorage(app).bucket(bucketName).file(manifestPath).download();
              const hash = crypto.createHash('sha256').update(bytes).digest('hex');
              if (hash !== expectedManifestHash) throw new Error('ROLLBACK_MANIFEST_HASH_MISMATCH');
              const manifest = JSON.parse(bytes.toString('utf8'));
              if (manifest?.complete !== true || manifest?.targetProjectId !== projectId) throw new Error('ROLLBACK_MANIFEST_INVALID');
              const dataset = (manifest.datasets || []).find((entry) => entry?.id === 'playlist_lists');
              if (!dataset || dataset.documentCount !== 42 || dataset.fileName !== 'playlist_lists.ndjson') throw new Error('ROLLBACK_PLAYLIST_DATASET_INVALID');
              console.log('PLAYLIST_HEADER_ROLLBACK=' + JSON.stringify({ available: true, manifestHashMatch: true, backupPlaylistHeaders: dataset.documentCount }));
            } finally {
              await deleteApp(app);
            }
          })().catch((error) => {
            console.error('PLAYLIST_HEADER_PREFLIGHT_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          });
          NODE

      - name: Execute 42-header limited backfill in bounded transactions and verify parity
        shell: bash
        env:
          GOOGLE_CLOUD_PROJECT: soridraw-app-866a5
          GCLOUD_PROJECT: soridraw-app-866a5
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const projectId = process.env.TARGET_PROJECT;
          const bucketName = process.env.TARGET_BUCKET;
          const backupPrefix = process.env.BACKUP_PREFIX;
          const expectedManifestHash = process.env.EXPECTED_MANIFEST_SHA256;
          const expectedSourceCount = Number(process.env.EXPECTED_SOURCE_COUNT || 0);
          const maxWrites = Number(process.env.MAX_WRITES || 0);
          const batchSize = Number(process.env.BATCH_SIZE || 0);
          if (projectId !== 'soridraw-app-866a5' || bucketName !== 'soridraw-app-866a5.firebasestorage.app') throw new Error('EXECUTION_TARGET_MISMATCH');
          if (expectedSourceCount !== 42 || maxWrites !== 42 || batchSize !== 21 || batchSize > 25) throw new Error('EXECUTION_CAP_MISMATCH');

          const canonicalize = (value) => {
            if (value === null || value === undefined || ['string', 'boolean'].includes(typeof value)) return value;
            if (typeof value === 'number') {
              if (Number.isNaN(value)) return { __type: 'number', value: 'NaN' };
              if (value === Infinity) return { __type: 'number', value: 'Infinity' };
              if (value === -Infinity) return { __type: 'number', value: '-Infinity' };
              if (Object.is(value, -0)) return { __type: 'number', value: '-0' };
              return value;
            }
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return { __type: 'bytes', base64: Buffer.from(value).toString('base64') };
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value instanceof Date) return { __type: 'date', iso: value.toISOString() };
            if (typeof value?.seconds === 'number' && typeof value?.nanoseconds === 'number') return { __type: 'timestamp', seconds: value.seconds, nanoseconds: value.nanoseconds };
            if (typeof value?.latitude === 'number' && typeof value?.longitude === 'number') return { __type: 'geopoint', latitude: value.latitude, longitude: value.longitude };
            if (typeof value?.path === 'string' && value?.firestore) return { __type: 'reference', path: value.path };
            if (typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));
            throw new Error('UNSUPPORTED_PLAYLIST_VALUE_TYPE');
          };
          const digest = (value) => crypto.createHash('sha256').update(JSON.stringify(canonicalize(value))).digest('hex');
          const pathPattern = /^user_playlists\/([^/]+)\/lists\/([^/]+)$/;

          const app = initializeApp({ credential: applicationDefault(), projectId, storageBucket: bucketName }, `step34c-playlists-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const bucket = getStorage(app).bucket(bucketName);

            const [manifestBytes] = await bucket.file(`${backupPrefix}/manifest.json`).download();
            const manifestHash = crypto.createHash('sha256').update(manifestBytes).digest('hex');
            if (manifestHash !== expectedManifestHash) throw new Error('EXECUTION_MANIFEST_HASH_MISMATCH');
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            const dataset = (manifest.datasets || []).find((entry) => entry?.id === 'playlist_lists');
            if (!dataset || dataset.documentCount !== expectedSourceCount || dataset.fileName !== 'playlist_lists.ndjson') throw new Error('EXECUTION_BACKUP_DATASET_MISMATCH');

            const [playlistBytes] = await bucket.file(`${backupPrefix}/${dataset.fileName}`).download();
            const playlistHash = crypto.createHash('sha256').update(playlistBytes).digest('hex');
            if (playlistHash !== dataset.sha256) throw new Error('EXECUTION_PLAYLIST_BACKUP_HASH_MISMATCH');
            const backupRecords = playlistBytes.toString('utf8').split('\n').filter(Boolean).map((line) => JSON.parse(line));
            if (backupRecords.length !== expectedSourceCount) throw new Error(`BACKUP_SOURCE_COUNT_CHANGED:${backupRecords.length}`);
            const backupPaths = backupRecords.map((record) => String(record?.path || '')).sort();
            if (new Set(backupPaths).size !== expectedSourceCount) throw new Error('BACKUP_DUPLICATE_SOURCE_PATH');
            for (const path of backupPaths) if (!pathPattern.test(path)) throw new Error('BACKUP_UNEXPECTED_PLAYLIST_PATH');

            const liveSnapshot = await db.collectionGroup('lists').get();
            if (liveSnapshot.size !== expectedSourceCount) throw new Error(`LIVE_PLAYLIST_HEADER_COUNT_CHANGED:${liveSnapshot.size}`);
            const liveDocs = new Map();
            for (const doc of liveSnapshot.docs) {
              if (!pathPattern.test(doc.ref.path)) throw new Error('LIVE_UNEXPECTED_LIST_PATH:' + doc.ref.path);
              if (liveDocs.has(doc.ref.path)) throw new Error('LIVE_DUPLICATE_PLAYLIST_PATH');
              liveDocs.set(doc.ref.path, doc);
            }
            const livePaths = [...liveDocs.keys()].sort();
            if (JSON.stringify(livePaths) !== JSON.stringify(backupPaths)) throw new Error('LIVE_PLAYLIST_PATH_DELTA_DETECTED');

            const plans = [];
            for (const sourcePath of livePaths) {
              const match = sourcePath.match(pathPattern);
              if (!match) throw new Error('SOURCE_PATH_PARSE_FAILED');
              const uid = match[1];
              const playlistId = match[2];
              const sourceDoc = liveDocs.get(sourcePath);
              const sourceData = sourceDoc.data();
              const sourceHash = digest(sourceData);
              const sourceUpdateTime = sourceDoc.updateTime?.toMillis?.() ?? null;
              const destRef = db.doc(`users/${uid}/playlists/${playlistId}`);
              plans.push({ sourcePath, sourceRef: sourceDoc.ref, sourceData, sourceHash, sourceUpdateTime, destRef });
            }

            const preDestinations = await db.getAll(...plans.map((plan) => plan.destRef));
            let existingIdentical = 0;
            for (let index = 0; index < plans.length; index += 1) {
              const destSnap = preDestinations[index];
              if (destSnap.exists) {
                if (digest(destSnap.data()) !== plans[index].sourceHash) throw new Error('PLAYLIST_DESTINATION_CONFLICT:' + plans[index].destRef.path);
                existingIdentical += 1;
              }
            }
            const plannedCreates = plans.length - existingIdentical;
            if (plannedCreates > maxWrites) throw new Error('PLAYLIST_WRITE_CAP_EXCEEDED');

            for (let start = 0; start < plans.length; start += batchSize) {
              const chunk = plans.slice(start, start + batchSize);
              await db.runTransaction(async (tx) => {
                const sourceSnaps = await tx.getAll(...chunk.map((plan) => plan.sourceRef));
                const destSnaps = await tx.getAll(...chunk.map((plan) => plan.destRef));
                for (let i = 0; i < chunk.length; i += 1) {
                  const plan = chunk[i];
                  const sourceSnap = sourceSnaps[i];
                  const destSnap = destSnaps[i];
                  if (!sourceSnap.exists) throw new Error('TRANSACTION_SOURCE_MISSING:' + plan.sourcePath);
                  const currentSourceHash = digest(sourceSnap.data());
                  const currentUpdateTime = sourceSnap.updateTime?.toMillis?.() ?? null;
                  if (currentSourceHash !== plan.sourceHash || currentUpdateTime !== plan.sourceUpdateTime) throw new Error('TRANSACTION_SOURCE_CHANGED:' + plan.sourcePath);
                  if (destSnap.exists) {
                    if (digest(destSnap.data()) !== plan.sourceHash) throw new Error('TRANSACTION_DESTINATION_CONFLICT:' + plan.destRef.path);
                  } else {
                    tx.create(plan.destRef, plan.sourceData);
                  }
                }
              });
            }

            const sourceAfter = await db.getAll(...plans.map((plan) => plan.sourceRef));
            const destAfter = await db.getAll(...plans.map((plan) => plan.destRef));
            for (let index = 0; index < plans.length; index += 1) {
              const plan = plans[index];
              const sourceSnap = sourceAfter[index];
              const destSnap = destAfter[index];
              if (!sourceSnap.exists || !destSnap.exists) throw new Error('POSTVERIFY_MISSING_DOCUMENT');
              if (digest(sourceSnap.data()) !== plan.sourceHash) throw new Error('POSTVERIFY_V1_PAYLOAD_CHANGED:' + plan.sourcePath);
              if ((sourceSnap.updateTime?.toMillis?.() ?? null) !== plan.sourceUpdateTime) throw new Error('POSTVERIFY_V1_UPDATE_TIME_CHANGED:' + plan.sourcePath);
              if (digest(destSnap.data()) !== plan.sourceHash) throw new Error('POSTVERIFY_V2_PAYLOAD_MISMATCH:' + plan.destRef.path);
              const sourceId = plan.sourcePath.split('/').pop();
              const destId = plan.destRef.id;
              if (sourceId !== destId) throw new Error('PLAYLIST_ID_NOT_PRESERVED');
            }

            console.log('SORIDRAW_STEP3_4C_PLAYLIST_HEADERS=' + JSON.stringify({
              sourceDocuments: plans.length,
              created: plannedCreates,
              noOpExistingIdentical: existingIdentical,
              conflicts: 0,
              maxWriteCap: maxWrites,
              transactionBatchSize: batchSize,
              transactionBatches: Math.ceil(plans.length / batchSize),
              destination: 'users/{uid}/playlists/{playlistId}',
              idsPreserved: true,
              payloadParityVerified: true,
              v1Writes: 0,
              v1Deletes: 0,
              v2Deletes: 0,
              noTouchCollectionsAccessed: 0,
            }));
          })().finally(async () => {
            await deleteApp(app);
          }).catch((error) => {
            console.error('SORIDRAW_STEP3_4C_PLAYLIST_HEADERS_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          });
          NODE

      - name: Final repository side-effect check
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${GOOGLE_GHA_CREDS_PATH:-}" gha-creds-*.json
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi
          echo 'Step 3-4c playlist-header repository check PASS.'
