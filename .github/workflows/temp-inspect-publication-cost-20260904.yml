name: SORIDRAW Verify Publication Cost Guard PREVIEW 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-publication-cost-20260904.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: e1a30fc9ef497fda1d34f4ab3dc1da45
      WORKER: soridraw-explore-preview
      EXPECTED_ACTIVE: 39032e65-f53e-4de7-8925-b7f842b4efa4
      BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify active PREVIEW Worker behavior and public smoke
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.ACCOUNT,W=process.env.WORKER,T=process.env.CLOUDFLARE_API_TOKEN,BASE=process.env.BASE;
          async function g(u){const r=await fetch(u,{headers:{Authorization:`Bearer ${T}`,'Content-Type':'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`CF ${r.status}: ${JSON.stringify(x).slice(0,900)}`);return x.result||x}
          function functionText(src,name){let s=src.indexOf(`async function ${name}(`);if(s<0)s=src.indexOf(`function ${name}(`);if(s<0)throw new Error(name+' missing');const b=src.indexOf('{',s);let d=0,q=null,e=false;for(let i=b;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='{')d++;if(c==='}'&&--d===0)return src.slice(s,i+1)}throw new Error(name+' unterminated')}
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${W}`;
            const ds=await g(`${base}/deployments`),d=(ds.deployments||ds||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            if(v?.version_id!==process.env.EXPECTED_ACTIVE||Number(v.percentage||0)<99.99)throw new Error(`unexpected active ${v?.version_id} ${v?.percentage}`);
            const ver=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${W}/versions/${v.version_id}?include=modules`);
            const mod=(ver.modules||[]).find(m=>(m.name||'')==='worker.js')||(ver.modules||[])[0];if(!mod)throw new Error('worker.js missing');
            const src=Buffer.from(mod.content_base64,'base64').toString('utf8');
            for(const requiredFunction of ['getOrEnsurePublicationOwnerProfile013','publicationSearchChanged013','refreshPublicationTrackSearchIndex013','syncExploreFeedR2Publication012'])functionText(src,requiredFunction);
            const core=functionText(src,'handlePublicationR2Core');
            if(core.includes('await refreshTrackSearchIndex(env, source.id);'))throw new Error('legacy blocking FTS still active');
            const wrapper=functionText(src,'handlePublication');
            if(wrapper.includes('safelyRefreshExploreFeedR2Bundles'))throw new Error('normal publication still full-rescans feed');
            console.log('ACTIVE_VERSION='+v.version_id);
            console.log('PUBLICATION_012_013_BEHAVIOR_VERIFY=PASS');

            const feed=await fetch(`${BASE}/v1/feed?sort=latest&limit=40&probe=publication-final-verify3`,{headers:{Origin:'https://preview.soridraw.com',Accept:'application/json'}});
            if(feed.status!==200)throw new Error(`preview feed status ${feed.status}`);
            const d1=Number(feed.headers.get('x-soridraw-d1-read')||0);
            if(d1!==0)throw new Error(`preview feed D1 read ${d1}`);
            const pub=await fetch(`${BASE}/v1/publications`,{method:'POST',headers:{Origin:'https://preview.soridraw.com','Content-Type':'application/json'},body:'{}'});
            if(pub.status!==401)throw new Error(`publication auth gate status ${pub.status}`);
            const prod=await fetch('https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1',{headers:{Origin:'https://soridraw.com',Accept:'application/json'}});
            if(prod.status!==200)throw new Error(`production Explore status ${prod.status}`);
            console.log('PREVIEW_FEED_D1_ZERO=PASS');
            console.log('PUBLICATION_AUTH_GATE=PASS');
            console.log('PRODUCTION_EXPLORE_UNTOUCHED=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
