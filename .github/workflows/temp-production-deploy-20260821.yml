name: Approved Firebase Production Deploy 20260821

on:
  issues:
    types: [opened]

concurrency:
  group: approved-firebase-production-deploy-20260821
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-hosting:
    if: github.actor == 'andrawing1212' && github.event.issue.title == 'APPROVED PRODUCTION DEPLOY 20260821 1238'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Deploy official Firebase Hosting only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          channelId: live
          projectId: soridraw

      - name: Verify official production app
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o production-index.html
          grep -q '<div id="root"></div>' production-index.html

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue comment "$ISSUE_URL" --body "✅ PRODUCTION_DEPLOY_SUCCESS sha=$(git rev-parse HEAD) url=https://soridraw.web.app/ hosting_only=true"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue comment "$ISSUE_URL" --body "❌ PRODUCTION_DEPLOY_FAILED sha=$(git rev-parse HEAD) run_id=${{ github.run_id }}"
