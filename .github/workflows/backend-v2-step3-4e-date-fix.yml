name: SORIDRAW Backend V2 Step 3-4e Date Fix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4e-date-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md')
          text = p.read_text()
          old = 'Last updated: 2026-08-25 (KST)'
          new = 'Last updated: 2026-08-26 (KST)'
          if old not in text:
              raise SystemExit('MASTER_DATE_PATTERN_MISSING')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git rm .github/workflows/backend-v2-step3-4e-date-fix.yml
          git commit -m 'docs: correct Step 3-4e KST update date'
          git push origin HEAD:preview
