name: SORIDRAW Backend V2 Step 3-4d Origin Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step3-4d-origin-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_PROJECT: soridraw-app-866a5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Pin exact project
        shell: bash
        run: |
          echo "GCLOUD_PROJECT=${TARGET_PROJECT}" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=${TARGET_PROJECT}" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_QUOTA_PROJECT=${TARGET_PROJECT}" >> "$GITHUB_ENV"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Read-only Firestore timestamp and Cloud Logging audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('firebase-admin');
          const { initializeApp, applicationDefault, deleteApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');

          const projectId = process.env.TARGET_PROJECT;
          if (projectId !== 'soridraw-app-866a5') throw new Error('PROJECT_PIN_MISMATCH');
          const v1Pattern = /^user_playlists\/[^/]+\/lists\/[^/]+\/items\/[^/]+$/;
          const v2Pattern = /^users\/[^/]+\/playlists\/[^/]+\/items\/[^/]+$/;
          const iso = (ms) => Number.isFinite(ms) ? new Date(ms).toISOString() : null;
          const summarizeTimes = (docs) => {
            const creates = docs.map((d) => d.createTime?.toMillis?.()).filter(Number.isFinite).sort((a,b)=>a-b);
            const updates = docs.map((d) => d.updateTime?.toMillis?.()).filter(Number.isFinite).sort((a,b)=>a-b);
            const secondBuckets = new Map();
            for (const ms of creates) {
              const second = new Date(Math.floor(ms / 1000) * 1000).toISOString();
              secondBuckets.set(second, (secondBuckets.get(second) || 0) + 1);
            }
            return {
              count: docs.length,
              createMin: iso(creates[0]),
              createMax: iso(creates[creates.length - 1]),
              updateMin: iso(updates[0]),
              updateMax: iso(updates[updates.length - 1]),
              createSecondBuckets: [...secondBuckets.entries()].sort((a,b)=>a[0].localeCompare(b[0])),
            };
          };

          const app = initializeApp({ credential: applicationDefault(), projectId }, `step34d-origin-${Date.now()}`);
          (async () => {
            const db = getFirestore(app);
            const snapshot = await db.collectionGroup('items').get();
            const v1 = [];
            const v2 = [];
            let unexpected = 0;
            for (const doc of snapshot.docs) {
              if (v1Pattern.test(doc.ref.path)) v1.push(doc);
              else if (v2Pattern.test(doc.ref.path)) v2.push(doc);
              else unexpected += 1;
            }
            console.log('STEP34D_TIMESTAMP_AUDIT=' + JSON.stringify({ total: snapshot.size, v1: summarizeTimes(v1), v2: summarizeTimes(v2), unexpected }));

            const credential = admin.credential.applicationDefault();
            const token = await credential.getAccessToken();
            const accessToken = String(token?.access_token || '');
            const body = {
              resourceNames: [`projects/${projectId}`],
              filter: [
                'timestamp >= "2026-08-25T13:10:00Z"',
                'timestamp <= "2026-08-25T13:25:00Z"',
                'protoPayload.serviceName="firestore.googleapis.com"'
              ].join(' AND '),
              orderBy: 'timestamp asc',
              pageSize: 1000,
            };
            const response = await fetch('https://logging.googleapis.com/v2/entries:list', {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}`, 'X-Goog-User-Project': projectId, 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            const text = await response.text();
            if (!response.ok) {
              console.log('STEP34D_LOG_AUDIT=' + JSON.stringify({ available: false, status: response.status }));
              return;
            }
            const payload = text ? JSON.parse(text) : {};
            const aggregate = new Map();
            let matchedEntries = 0;
            for (const entry of payload.entries || []) {
              const proto = entry.protoPayload || {};
              const method = String(proto.methodName || 'unknown');
              const principal = String(proto.authenticationInfo?.principalEmail || 'unknown');
              const statusCode = proto.status?.code ?? 0;
              const key = `${method}|${principal}|${statusCode}`;
              aggregate.set(key, (aggregate.get(key) || 0) + 1);
              matchedEntries += 1;
            }
            console.log('STEP34D_LOG_AUDIT=' + JSON.stringify({ available: true, matchedEntries, aggregate: [...aggregate.entries()].sort() }));
          })().finally(async () => {
            await deleteApp(app);
          }).catch((error) => {
            console.error('STEP34D_ORIGIN_AUDIT_ERROR=' + String(error?.message || error));
            process.exitCode = 1;
          });
          NODE

      - name: Repository side-effect check
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${GOOGLE_GHA_CREDS_PATH:-}" gha-creds-*.json
          test -z "$(git status --porcelain --untracked-files=all)"
