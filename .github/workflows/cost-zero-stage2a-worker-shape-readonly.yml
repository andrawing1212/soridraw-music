name: Cost Zero Stage 2A Worker Shape Readonly

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/cost-zero-stage2a-worker-shape-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact live Worker source
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run cf:prepare
          node --check .remote-worker/worker.js
      - name: Print first-view live Worker materializer shapes
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('.remote-worker/worker.js','utf8');
          function extract(name){
            const needle = `async function ${name}(`;
            const start = src.indexOf(needle);
            if(start < 0) return null;
            const brace = src.indexOf('{', start);
            if(brace < 0) return null;
            let depth = 0, quote = null, esc = false;
            for(let i=brace;i<src.length;i++){
              const c=src[i];
              if(quote){
                if(esc){ esc=false; continue; }
                if(c==='\\'){ esc=true; continue; }
                if(c===quote){ quote=null; }
                continue;
              }
              if(c==='"'||c==="'"||c==='`'){ quote=c; continue; }
              if(c==='{') depth++;
              else if(c==='}'){
                depth--;
                if(depth===0) return src.slice(start,i+1);
              }
            }
            return src.slice(start, Math.min(src.length,start+32000));
          }
          const wanted = [
            'ensurePublicProfileFirstViewTable',
            'materializePublicProfileFirstView',
            'refreshPublicProfileFirstViewProfile',
            'refreshPublicProfileFirstViewTrackWindow',
            'patchPublicProfileFirstViewLikeCount',
            'handlePublicProfileFirstViewWithEdgeCache',
            'handlePublicProfileFirstViewSnapshot',
            'handlePublication',
            'handleVisibility',
            'handleLike',
          ];
          console.log('MATERIALIZER_MARKER='+src.includes('SORIDRAW_COST_ZERO_PROFILE_FIRST_VIEW_MATERIALIZER_004'));
          for(const n of wanted){
            const body=extract(n);
            if(!body){ console.log(`FUNCTION_MISSING ${n}`); continue; }
            console.log(`FUNCTION_BODY_START ${n}`);
            console.log(body.slice(0,32000));
            console.log(`FUNCTION_BODY_END ${n}`);
          }
          const routeLines = src.split('\n').filter(line => line.includes('first-view') || line.includes('handlePublicProfileFirstView'));
          console.log('ROUTE_LINES_START');
          console.log(routeLines.slice(-30).join('\n'));
          console.log('ROUTE_LINES_END');
          NODE
          echo 'READ_ONLY=true'
          echo 'NO_D1_WRITE_REQUESTED=true'
