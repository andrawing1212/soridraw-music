name: SORIDRAW Inspect PREVIEW Publications 2026-09-04
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-preview-publications-20260904.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inspect active PREVIEW publication route shape
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,account='e1a30fc9ef497fda1d34f4ab3dc1da45',name='soridraw-explore-preview';
          async function j(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(JSON.stringify(x).slice(0,1000));return x.result||x;}
          (async()=>{const deps=await j(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`);const d=(deps.deployments||deps||[])[0],v=[...(d.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0],ver=await j(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${v.version_id}?include=modules`),mod=(ver.modules||[]).find(m=>m.name===ver.main_module)||(ver.modules||[])[0],src=Buffer.from(mod.content_base64,'base64').toString('utf8'),lines=src.split(/\r?\n/);lines.forEach((line,i)=>{if(line.includes('/v1/me/publications')||line.includes('handleMyPublications')){const a=Math.max(0,i-8),b=Math.min(lines.length,i+18);console.log(`--- ${a+1}-${b} ---`);console.log(lines.slice(a,b).join('\n'));}});console.log(`VERSION=${v.version_id}`);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
