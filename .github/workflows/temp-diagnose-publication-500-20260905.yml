name: SORIDRAW Diagnose Publication 500 PREVIEW 2026-09-05
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-diagnose-publication-500-20260905.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Print exact active publication identity and invalidation paths
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          function functions(src){
            const out=[];const re=/(async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(/g;let m;
            while((m=re.exec(src))){const start=m.index,brace=src.indexOf('{',re.lastIndex);if(brace<0)continue;let d=0,q=null,e=false,end=-1;for(let i=brace;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue;}if(c==='\\'){e=true;continue;}if(c===q)q=null;continue;}if(c==='"'||c==="'"||c==='`'){q=c;continue;}if(c==='{')d++;else if(c==='}'&&--d===0){end=i+1;break;}}if(end>start)out.push({name:m[2],text:src.slice(start,end)});}
            return out;
          }
          (async()=>{
            const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;
            const deps=await get(`${base}/deployments`);const d=(deps.deployments||deps||[])[0];const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
            const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);const mods=ver.modules||[];const main=mods.find(m=>m.name===(ver.main_module||mods[0]?.name))||mods[0];const src=Buffer.from(main.content_base64,'base64').toString('utf8');
            const fns=functions(src),by=new Map(fns.map(f=>[f.name,f.text]));
            console.log(`[audit] active=${active.version_id} funcs=${fns.length}`);
            const wanted=['buildMusicNoteExploreSource','stableTrackId','buildTrackId','publicationCanonicalUnchanged016','publicationReadState016','invalidateExploreFeedEdgeCache','invalidatePublicProfileFirstViewEdgeCache','handleMusicNotePublicationSingleWrite016','handlePublicationR2Core','handleExploreRequest'];
            for(const n of wanted) console.log(`\n===== ${n} =====\n${by.get(n)||'[MISSING]'}\n===== END ${n} =====`);
            console.log('\n===== FUNCTIONS CONTAINING sourceId/id SHA/UUID =====');
            for(const f of fns){if(/randomUUID|crypto\.subtle|sourceId.*id|track.*hash|stable.*id/i.test(f.text)) console.log(`\n--- ${f.name} ---\n${f.text}`)}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
