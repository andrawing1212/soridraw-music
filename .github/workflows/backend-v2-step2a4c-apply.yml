      - name: Static safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          mirror=Path('src/data/v2PreviewShadowMirror.ts').read_text(encoding='utf-8')
          boundary=Path('src/data/v1MutationBoundary.ts').read_text(encoding='utf-8')
          outbox=Path('src/data/indexedDbMirrorOutbox.ts').read_text(encoding='utf-8')
          for marker in [
              "import './data/v2PreviewShadowMirror'",
              'ensureLiveSoridrawSongId',
              'soridrawSongId: favoriteSoridrawSongId',
              "operation: 'save-batch'",
              "operation: 'regenerate'",
              "operation: 'add-lyrics-language'",
              "operation: 'edit'",
              "operation: 'pre-favorite-edit'",
          ]:
              assert marker in app, marker
          for marker in [
              "BACKEND_V2_PREVIEW_SHADOW_HOST = 'soridraw-music-git-preview-andrawing1212.vercel.app'",
              'BACKEND_V2_PREVIEW_SHADOW_MAX_TARGETS_PER_MUTATION = 10',
              "targetKind: 'soridraw'",
              "operation === 'recent-hide'",
              "operation === 'music-note-unsave'",
              'processPendingOutbox',
              'runTransaction',
              'legacyRecentIndex',
          ]:
              assert marker in mirror, marker
          assert 'deleteDoc(' not in mirror
          assert "registerV1MutationPostSuccessHook" in boundary
          assert 'sourceDocumentId?: string' in outbox
          assert "startsWith('bulk-')" in mirror
          print('A4C_STATIC_SAFETY=PASS')
          PY
          git diff --check

      - name: Install and typecheck
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx tsc --noEmit

      - name: Pure boundary contract check
        shell: bash
        run: |
          set -euo pipefail
          npx tsx -e "import {registerV1MutationPostSuccessHook,runV1MutationBoundary} from './src/data/v1MutationBoundary.ts'; let seen=0; registerV1MutationPostSuccessHook(async()=>{seen++}); const v=await runV1MutationBoundary({domain:'recent',operation:'edit',uid:'u'},Promise.resolve(7)); await new Promise(r=>setTimeout(r,0)); if(v!==7||seen!==1) throw new Error('post-success hook failed'); seen=0; try{await runV1MutationBoundary({domain:'recent',operation:'edit',uid:'u'},Promise.reject(new Error('v1')))}catch{} await new Promise(r=>setTimeout(r,0)); if(seen!==0) throw new Error('mirror ran after V1 failure'); console.log('A4C_BOUNDARY_CONTRACT=PASS')"

      - name: Exact production build path
        run: npm run build

      - name: Post-build scope and safety verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'src/App.tsx','src/data/v1MutationBoundary.ts','src/data/indexedDbMirrorOutbox.ts','src/data/v2PreviewShadowMirror.ts'}
          if changed != expected:
              raise SystemExit(f'2-A4c scope mismatch after build: {sorted(changed)}')
          mirror=Path('src/data/v2PreviewShadowMirror.ts').read_text(encoding='utf-8')
          if 'deleteDoc(' in mirror or 'firebase-functions' in mirror:
              raise SystemExit('2-A4c forbidden mutation/dependency found')
          for path in ['firestore.rules','firestore.indexes.json','database.rules.json','functions/src/index.ts','firebase.json']:
              if subprocess.run(['git','diff','--quiet','HEAD','--',path]).returncode != 0:
                  raise SystemExit(f'2-A4c protected file changed: {path}')
          print('A4C_POST_BUILD_SCOPE=PASS')
          PY

