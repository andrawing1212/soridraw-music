name: TEMP Inspect Music Note IO V3

on:
  push:
    branches: [preview-musicnote-io-v3]
    paths:
      - '.github/workflows/temp-inspect-musicnote-io-v3.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-musicnote-io-v3
          fetch-depth: 0
      - name: Persist focused inspection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text(encoding='utf-8')
          lines=s.splitlines()
          ranges=[]
          terms=[
            'const toggleFavorite = async',
            'const syncMusicNoteIncrementalFromRemoteVersion = useCallback',
            "subscribeListBundle('musicNote'",
            "scheduleListBundleWrite('musicNote'",
            'const buildFavoriteSyncSignal',
          ]
          for term in terms:
            for idx,line in enumerate(lines,1):
              if term in line:
                lo=max(1,idx-140); hi=min(len(lines),idx+420)
                ranges.append((lo,hi,term,idx))
                break
          chunks=[]
          seen=[]
          for lo,hi,term,idx in ranges:
            if any(lo>=a and hi<=b for a,b in seen):
              continue
            seen.append((lo,hi))
            chunks.append(f'\n===== {term} @ {idx} =====\n')
            chunks.extend(f'{n}: {lines[n-1]}\n' for n in range(lo,hi+1))
          Path('.deploy/tmp-musicnote-io-v3.txt').write_text(''.join(chunks),encoding='utf-8')
          PY
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .deploy/tmp-musicnote-io-v3.txt
          git commit -m "chore(preview): persist Music Note IO v3 inspection"
          git push origin HEAD:preview-musicnote-io-v3