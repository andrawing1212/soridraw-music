name: TEMP 081 Run Extracted Page Exit Batch

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-081-run-extracted-page-exit-batch.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-081-page-exit-batch
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run 081 product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/temp-081-prepare-page-exit-batch.yml').read_text(encoding='utf-8')
          begin = src.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = src.index("\n          PY\n", begin)
          body = src[begin:end]
          body = body.replace('if retry_count != 1:', 'if retry_count != 2:', 1)
          body = body.replace('if schedule_count != 1:', 'if schedule_count not in (0, 1):', 1)
          body = body.replace(
              "s = replace_once(s, \"    setCloudflare(readCloudflareDiagnostics());\", \"    setCloudflare(readCloudflareDiagnostics());\\n    setPageSync(readPageSyncDiagnostics());\", 'overlay page sync initial')",
              "s = s.replace(\"    setCloudflare(readCloudflareDiagnostics());\", \"    setCloudflare(readCloudflareDiagnostics());\\n    setPageSync(readPageSyncDiagnostics());\", 2)",
              1,
          )
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply081.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply081.py

      - name: Align generated 081 patch with current runtime APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # App startup recovery must wait for Firebase Auth instead of referencing
          # App's later local `user` declaration.
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = """  useEffect(() => {
    if (!user?.uid) return;
    void recoverSoridrawPendingSync(user)
      .catch((error) => console.warn('[081] startup pending sync retained locally:', error));
  }, [user?.uid]);
"""
          new = """  useEffect(() => {
    const unsubscribePendingSync = auth.onAuthStateChanged((currentUser) => {
      if (!currentUser?.uid) return;
      void recoverSoridrawPendingSync(currentUser)
        .catch((error) => console.warn('[081] startup pending sync retained locally:', error));
    });
    return () => unsubscribePendingSync();
  }, []);
"""
          if old not in s:
              raise SystemExit('081 App startup recovery anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Reuse the current Catalog delta engine exactly. 081 changes only *when*
          # the already-verified delta publisher runs; it does not invent a second
          # Catalog API/cache implementation.
          p = Path('src/lib/userDataEngine.ts')
          s = p.read_text(encoding='utf-8')
          start = s.index('const flushCatalogPendingPublish = async (key: string): Promise<void> => {')
          end = s.index('export const getCatalogRenderBatchSize', start)
          block = r'''const flushCatalogPendingPublish = async (key: string): Promise<void> => {
  const pending = catalogPendingPublishes.get(key);
  if (!pending) return;
  const { kind, uid, sourceItems, options } = pending;
  const currentDirtyRevision = readAdaptiveListIndexDirtyRevision(kind);
  if (currentDirtyRevision <= 0) {
    catalogPendingPublishes.delete(key);
    return;
  }

  const previous = await readCatalogSnapshotFromLocalCache(kind, uid);
  const rebuild = async (minimumRevision: number) => {
    const rebuilt = await readRemoteCatalogSnapshot(kind, uid, Math.max(1, minimumRevision));
    if (!rebuilt) throw new Error(`catalog ${kind} rebuild failed`);
    clearAdaptiveListIndexDirtyRevision(kind, currentDirtyRevision);
    catalogPendingPublishes.delete(key);
  };

  // Never manufacture a complete Catalog from a partial compatibility list.
  if (!previous) {
    await rebuild(Math.max(Date.now(), currentDirtyRevision));
    return;
  }

  const projectedCount = normalizeCatalogItems(kind, sourceItems).length;
  const explicitComplete = options.complete === true;
  const explicitDeletedIds = Array.from(new Set(
    (Array.isArray(options.deletedIds) ? options.deletedIds : [])
      .map((id) => String(id || '').trim())
      .filter(Boolean)
  ));
  const looksCompleteAgainstPrevious = projectedCount >= Math.max(0, previous.itemCount - 2);
  const unexplainedMissingFromCompleteSource = explicitComplete
    && projectedCount + explicitDeletedIds.length < previous.itemCount;
  if ((!explicitComplete && !looksCompleteAgainstPrevious) || unexplainedMissingFromCompleteSource) {
    await rebuild(Math.max(Date.now(), previous.revision + 1));
    return;
  }

  const built = buildCatalogDelta(
    kind,
    previous,
    sourceItems,
    currentDirtyRevision,
    explicitDeletedIds,
  );
  if (!built) {
    await rebuild(Math.max(Date.now(), previous.revision + 1));
    return;
  }

  if (built.delta.upserts.length === 0 && built.delta.deletedIds.length === 0) {
    clearAdaptiveListIndexDirtyRevision(kind, currentDirtyRevision);
    catalogPendingPublishes.delete(key);
    return;
  }

  const published = await publishRemoteCatalogDelta(uid, built.delta);
  if (!published) throw new Error(`catalog ${kind} delta publish failed`);
  if (published.conflict) {
    await rebuild(Math.max(Date.now(), previous.revision + 1));
    return;
  }
  if (published.itemCount !== built.nextSnapshot.itemCount) {
    await rebuild(Math.max(1, published.revision));
    return;
  }

  const confirmedSnapshot: SoridrawCatalogSnapshot = {
    ...built.nextSnapshot,
    revision: published.revision,
  };
  await writeCatalogSnapshotToLocalCache(kind, uid, confirmedSnapshot);
  clearAdaptiveListIndexDirtyRevision(kind, currentDirtyRevision);
  catalogPendingPublishes.delete(key);
};

export const scheduleCatalogSnapshotPublishIfDirty = (
  kind: SoridrawCatalogKind,
  uid: string,
  sourceItems: any[],
  options: CatalogPublishOptions = {},
): void => {
  if (!uid || !Array.isArray(sourceItems) || !isPreviewCatalogEnabled()) return;
  const dirtyRevision = readAdaptiveListIndexDirtyRevision(kind);
  if (dirtyRevision <= 0) return;
  const key = catalogKey(kind, uid);
  const existingTimer = catalogPublishTimers.get(key);
  if (existingTimer) clearTimeout(existingTimer);
  catalogPublishTimers.delete(key);
  catalogPendingPublishes.set(key, {
    kind,
    uid,
    sourceItems: [...sourceItems],
    options: { ...options },
  });
};

export const getPendingCatalogPublishCount = (uid: string): number => [...catalogPendingPublishes.values()]
  .filter((pending) => pending.uid === uid && readAdaptiveListIndexDirtyRevision(pending.kind) > 0)
  .length;

export const flushPendingCatalogPublishes = async (uid: string): Promise<void> => {
  const keys = [...catalogPendingPublishes.entries()]
    .filter(([, pending]) => pending.uid === uid)
    .map(([key]) => key);
  for (const key of keys) await flushCatalogPendingPublish(key);
};

'''
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Worker 048 to canonical PREVIEW source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/worker048"
          mkdir -p "$tmp"
          cp cloudflare/explore-worker/canonical/preview-worker.js "$tmp/worker.js"
          (
            cd cloudflare/explore-worker
            SORIDRAW_REMOTE_WORKER_DIR="$tmp" node patches/048-page-exit-publication-batch.mjs
          )
          cp "$tmp/worker.js" cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node --check cloudflare/explore-worker/canonical/preview-entry.js

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and build
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build

      - name: 081 full regression and cost contract
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/cloudflare/explore-worker/canonical/preview-worker.js"
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-081-page-exit-batch.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-explore-derived-cache.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-080-publication-state-engine.mjs
          node scripts/verify-explore-deploy-preflight.mjs
          echo '081_PAGE_EXIT_BATCH_VERIFY=PASS'

      - name: Commit verified 081 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name andrawing1212
          git config user.email andrawing1212@gmail.com
          git add \
            src/services/exploreLikeService.ts \
            src/services/explorePublicationService.ts \
            src/lib/userDataEngine.ts \
            src/lib/musicNoteDetailDraft.ts \
            src/pages/FavoritesPage.tsx \
            src/pages/SunoLibraryPage.tsx \
            src/components/explore/ExploreShell.tsx \
            src/App.tsx \
            src/components/CacheDiagnosticsOverlay.tsx \
            cloudflare/explore-worker/canonical/preview-worker.js \
            cloudflare/explore-worker/canonical/source-sha256.txt \
            scripts/verify-031-music-note-detail-batched-draft.mjs \
            scripts/verify-032-music-note-detail-save-status.mjs \
            scripts/verify-explore-like-cost-optimization.mjs \
            scripts/verify-081-page-exit-batch.mjs
          git diff --cached --check
          git commit -m 'feat(preview): prepare 081 page-exit batch sync'
          git push origin HEAD:preview
