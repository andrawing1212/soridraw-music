name: TEMP 362 Isolated Publication Live Trigger Reads
# rerun compatibility v3

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-362-isolated-publication-live-trigger-reads.yml'

permissions:
  contents: read

concurrency:
  group: temp-362-isolated-publication-live-trigger-reads
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure isolated live publication trigger chain
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/measure-362-isolated-publication-live-trigger-reads.mjs
          node scripts/measure-362-isolated-publication-live-trigger-reads.mjs
      - name: Emergency cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/measure-362-isolated-publication-live-trigger-reads.mjs cleanup
