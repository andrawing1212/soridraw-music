name: TEMP W2 Phase B Diagnostics

on:
  push:
    branches:
      - work/publication-w2-r2-catalog-phase-a
    paths:
      - '.github/workflows/temp-125-d1-write-floor.yml'
      - 'scripts/verify-publication-w2-r2-catalog-phase-b.mjs'
      - 'scripts/verify-publication-w2-track-id-stability.mjs'
      - 'cloudflare/explore-worker/runtime/r2-catalog-v1.js'
      - 'cloudflare/explore-worker/patches/066-publication-r2-catalog-phase-a.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase_b:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45

    steps:
      - name: Checkout fixed Phase B source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Static verifier syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-publication-w2-r2-catalog-phase-b.mjs
          node --check scripts/verify-publication-w2-track-id-stability.mjs
          node --check cloudflare/explore-worker/runtime/r2-catalog-v1.js

      - name: R2 catalog integration
        run: node scripts/verify-publication-w2-r2-catalog-phase-b.mjs

      - name: Music Note trackId stability
        run: node scripts/verify-publication-w2-track-id-stability.mjs

      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Measure production-shape candidate in PREVIEW RATE_DB only
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"

          cleanup() {
            node "$WRANGLER" d1 execute RATE_DB --remote --config "$CFG" --command "
              DROP TRIGGER IF EXISTS diag125_track_insert;
              DROP TRIGGER IF EXISTS diag125_track_update;
              DROP TRIGGER IF EXISTS diag125_profile_count_ai;
              DROP TRIGGER IF EXISTS diag125_rev_ai;
              DROP TRIGGER IF EXISTS diag125_rev_au;
              DROP TABLE IF EXISTS diag125_derived;
              DROP TABLE IF EXISTS diag125_profiles;
              DROP TABLE IF EXISTS diag125_revision;
              DROP TABLE IF EXISTS diag125_tracks;
              DROP TABLE IF EXISTS diag125_search_fts;
            " --json >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          node "$WRANGLER" d1 execute RATE_DB --remote --config "$CFG" --command "
            CREATE TABLE diag125_tracks(
              id TEXT PRIMARY KEY NOT NULL,
              owner_uid TEXT NOT NULL,
              source_type TEXT NOT NULL,
              source_id TEXT NOT NULL,
              source_parent_id TEXT,
              legacy_global_id TEXT,
              source_subtrack_key TEXT NOT NULL DEFAULT '',
              source_subtrack_index INTEGER,
              source_subtrack_id TEXT,
              title TEXT NOT NULL DEFAULT '',
              description TEXT,
              cover_url TEXT NOT NULL DEFAULT '',
              duration_seconds REAL,
              lyrics TEXT,
              style TEXT,
              prompt TEXT,
              suno_url_primary TEXT NOT NULL DEFAULT '',
              suno_url_secondary TEXT,
              search_text TEXT NOT NULL DEFAULT '',
              is_public INTEGER NOT NULL DEFAULT 1,
              status TEXT NOT NULL DEFAULT 'published',
              published_at INTEGER NOT NULL,
              created_at INTEGER NOT NULL DEFAULT 0,
              updated_at INTEGER NOT NULL,
              allow_next_song_apply INTEGER NOT NULL DEFAULT 0,
              allow_follower_save INTEGER NOT NULL DEFAULT 0,
              profile_pinned INTEGER NOT NULL DEFAULT 0,
              share_schema_version INTEGER NOT NULL DEFAULT 0,
              share_payload_json TEXT,
              primary_genre TEXT
            );

            CREATE INDEX diag125_i1 ON diag125_tracks(published_at DESC,id DESC) WHERE source_type <> 'music_note';
            CREATE UNIQUE INDEX diag125_i2 ON diag125_tracks(legacy_global_id) WHERE source_type <> 'music_note';
            CREATE INDEX diag125_i3 ON diag125_tracks(owner_uid,published_at DESC) WHERE source_type <> 'music_note';
            CREATE INDEX diag125_i4 ON diag125_tracks(owner_uid,profile_pinned DESC,published_at DESC,id DESC) WHERE source_type <> 'music_note';
            CREATE UNIQUE INDEX diag125_i5 ON diag125_tracks(owner_uid,source_type,source_id,source_subtrack_key) WHERE source_type <> 'music_note';
            CREATE INDEX diag125_i6 ON diag125_tracks(owner_uid,suno_url_primary) WHERE source_type <> 'music_note';
            CREATE INDEX diag125_i7 ON diag125_tracks(primary_genre,published_at DESC,id DESC) WHERE source_type <> 'music_note';
            CREATE INDEX diag125_i8 ON diag125_tracks(source_type,published_at DESC) WHERE source_type <> 'music_note';
            CREATE INDEX diag125_i9 ON diag125_tracks(title COLLATE NOCASE) WHERE source_type <> 'music_note';

            CREATE TABLE diag125_revision(
              scope TEXT PRIMARY KEY,
              revision INTEGER NOT NULL DEFAULT 1,
              updated_at INTEGER NOT NULL DEFAULT 0
            );
            INSERT INTO diag125_revision(scope) VALUES('global');

            CREATE TABLE diag125_profiles(
              uid TEXT PRIMARY KEY,
              track_count INTEGER NOT NULL DEFAULT 0,
              updated_at INTEGER NOT NULL DEFAULT 0
            );
            INSERT INTO diag125_profiles(uid) VALUES('u-legacy');

            CREATE TABLE diag125_derived(
              id TEXT PRIMARY KEY NOT NULL,
              owner_uid TEXT NOT NULL,
              active INTEGER NOT NULL,
              published_at INTEGER NOT NULL
            );

            CREATE TRIGGER diag125_track_insert AFTER INSERT ON diag125_tracks
            WHEN NEW.source_type <> 'music_note'
            BEGIN
              INSERT INTO diag125_derived(id,owner_uid,active,published_at)
              VALUES(NEW.id,NEW.owner_uid,(NEW.is_public=1 AND NEW.status='published'),NEW.published_at);
            END;

            CREATE TRIGGER diag125_track_update AFTER UPDATE OF title,source_type,owner_uid,profile_pinned,primary_genre,published_at,status ON diag125_tracks
            WHEN NEW.source_type <> 'music_note'
            BEGIN
              INSERT INTO diag125_derived(id,owner_uid,active,published_at)
              VALUES(NEW.id,NEW.owner_uid,(NEW.is_public=1 AND NEW.status='published'),NEW.published_at)
              ON CONFLICT(id) DO UPDATE SET
                owner_uid=excluded.owner_uid,
                active=excluded.active,
                published_at=excluded.published_at;
            END;

            CREATE TRIGGER diag125_profile_count_ai AFTER INSERT ON diag125_tracks
            WHEN NEW.source_type <> 'music_note' AND NEW.is_public=1 AND NEW.status='published'
            BEGIN
              UPDATE diag125_profiles
              SET track_count=track_count+1,updated_at=NEW.updated_at
              WHERE uid=NEW.owner_uid;
            END;

            CREATE TRIGGER diag125_rev_ai AFTER INSERT ON diag125_tracks
            WHEN NEW.source_type <> 'music_note'
            BEGIN
              UPDATE diag125_revision
              SET revision=revision+1,updated_at=NEW.updated_at
              WHERE scope='global';
            END;

            CREATE TRIGGER diag125_rev_au AFTER UPDATE ON diag125_tracks
            WHEN NEW.source_type <> 'music_note'
            BEGIN
              UPDATE diag125_revision
              SET revision=revision+1,updated_at=NEW.updated_at
              WHERE scope='global';
            END;

            CREATE VIRTUAL TABLE diag125_search_fts USING fts5(
              track_id UNINDEXED,
              title,
              genre,
              artist,
              tokenize='unicode61'
            );
          " --json >/dev/null

          run_measure() {
            local name="$1"
            local sql="$2"
            node "$WRANGLER" d1 execute RATE_DB --remote --config "$CFG" --command "$sql" --json > "$RUNNER_TEMP/$name.json"
            NAME="$name" node <<'NODE'
          const fs=require('fs');
          const name=process.env.NAME;
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+name+'.json','utf8'));
          const entries=Array.isArray(raw)?raw:[raw];
          const metas=entries.map(x=>x.meta||{}).filter(Boolean);
          const sum=(key)=>metas.reduce((n,m)=>n+Number(m[key]||0),0);
          console.log(`PHASE_B_${name}=R${sum('rows_read')}_W${sum('rows_written')}_CHANGES${sum('changes')}`);
          NODE
          }

          run_measure FIRST_PUBLIC "INSERT INTO diag125_tracks(id,owner_uid,source_type,source_id,title,suno_url_primary,primary_genre,is_public,status,published_at,created_at,updated_at) VALUES('music_note_u1_s1','u1','music_note','s1','Title','audio','Pop',1,'published',100,100,100)"
          run_measure PRIVATE "UPDATE diag125_tracks SET is_public=0,updated_at=101 WHERE id='music_note_u1_s1' AND owner_uid='u1' AND source_type='music_note' AND is_public<>0"
          run_measure REPUBLISH "UPDATE diag125_tracks SET is_public=1,updated_at=102 WHERE id='music_note_u1_s1' AND owner_uid='u1' AND source_type='music_note' AND is_public<>1"
          run_measure NOOP "UPDATE diag125_tracks SET is_public=1,updated_at=103 WHERE id='music_note_u1_s1' AND owner_uid='u1' AND source_type='music_note' AND is_public<>1"

          run_measure LEGACY_INSERT "INSERT INTO diag125_tracks(id,owner_uid,source_type,source_id,legacy_global_id,title,suno_url_primary,primary_genre,is_public,status,published_at,created_at,updated_at) VALUES('legacy-1','u-legacy','suno_library','legacy-source','legacy-global-1','Legacy','audio-legacy','Pop',1,'published',90,90,90)"

          node "$WRANGLER" d1 execute RATE_DB --remote --config "$CFG" --command "
            SELECT
              (SELECT COUNT(*) FROM diag125_derived WHERE id='legacy-1') AS derived_rows,
              (SELECT track_count FROM diag125_profiles WHERE uid='u-legacy') AS legacy_track_count,
              (SELECT revision FROM diag125_revision WHERE scope='global') AS revision;
          " --json > "$RUNNER_TEMP/legacy_projection.json"

          NAME=FTS_INSERT run_measure FTS_INSERT "INSERT INTO diag125_search_fts(track_id,title,genre,artist) VALUES('probe','봄날의 노래','Pop','Artist')"
          NAME=FTS_DELETE run_measure FTS_DELETE "DELETE FROM diag125_search_fts WHERE track_id='probe'"

          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const dir=process.env.RUNNER_TEMP;
          function meter(name){
            const raw=JSON.parse(fs.readFileSync(path.join(dir,name+'.json'),'utf8'));
            const entries=Array.isArray(raw)?raw:[raw];
            const metas=entries.map(x=>x.meta||{});
            const sum=(k)=>metas.reduce((n,m)=>n+Number(m[k]||0),0);
            return {r:sum('rows_read'),w:sum('rows_written'),changes:sum('changes')};
          }
          const first=meter('FIRST_PUBLIC');
          const priv=meter('PRIVATE');
          const repub=meter('REPUBLISH');
          const noop=meter('NOOP');
          const legacy=meter('LEGACY_INSERT');
          if(first.w<1||first.w>2) throw new Error('FIRST_PUBLIC hard gate failed: '+JSON.stringify(first));
          if(priv.w<1||priv.w>2) throw new Error('PRIVATE hard gate failed: '+JSON.stringify(priv));
          if(repub.w<1||repub.w>2) throw new Error('REPUBLISH hard gate failed: '+JSON.stringify(repub));
          if(noop.w!==0) throw new Error('NOOP hard gate failed: '+JSON.stringify(noop));
          if(legacy.w<=2) throw new Error('legacy control did not exercise retained index/trigger writes: '+JSON.stringify(legacy));

          const projectionRaw=JSON.parse(fs.readFileSync(path.join(dir,'legacy_projection.json'),'utf8'));
          const entries=Array.isArray(projectionRaw)?projectionRaw:[projectionRaw];
          const row=entries.flatMap(x=>x.results||[])[0]||{};
          if(Number(row.derived_rows)!==1) throw new Error('legacy derived trigger missing');
          if(Number(row.legacy_track_count)!==1) throw new Error('legacy profile-count trigger missing');
          if(Number(row.revision)!==2) throw new Error('legacy revision trigger missing');

          console.log('PHASE_B_D1_HARD_GATE=PASS');
          console.log(`PHASE_B_EXACT=FIRST_R${first.r}_W${first.w},PRIVATE_R${priv.r}_W${priv.w},REPUBLISH_R${repub.r}_W${repub.w},NOOP_R${noop.r}_W${noop.w}`);
          console.log('PHASE_B_LEGACY_CONTROL=PASS');
          NODE

          grep -R "track_search_fts\|profile_search_fts" ../../cloudflare/explore-worker/runtime/r2-catalog-v1.js && {
            echo "R2 catalog runtime unexpectedly references D1 FTS" >&2
            exit 1
          } || true

          echo PHASE_B_RATE_DB_SCOPE=PREVIEW_RATE_DB_DIAGNOSTIC_ONLY
          echo PHASE_B_SHARED_CANONICAL_D1_WRITES=0
          echo PHASE_B_USER_DATA_WRITES=0

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Phase B safety boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(node -p "require('./public/app-version.json').version")" = "124"
          echo APP_VERSION=124
          echo SHARED_CANONICAL_D1_CHANGE=false
          echo USER_DATA_CHANGE=false
          echo FIREBASE_CHANGE=false
          echo FUNCTIONS_CHANGE=false
          echo UI_CSS_CHANGE=false
          echo DEPLOYMENT=false
          echo PRODUCTION_CHANGE=false
