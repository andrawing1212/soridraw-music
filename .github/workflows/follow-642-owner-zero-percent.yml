name: SORIDRAW APP642 PREVIEW One-Owner Bridge Zero Traffic

on:
  pull_request:
    branches: [preview]
    paths:
      - 'scripts/app642-preview-owner-0pct-bridge.mjs'
      - '.github/workflows/follow-642-owner-zero-percent.yml'
  push:
    branches: [preview]
    paths:
      - '.deploy/app642-owner-zero-percent.trigger'

permissions:
  contents: read

concurrency:
  group: soridraw-app642-owner-zero-percent
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify 0-percent one-owner staging source
        run: |
          node --check scripts/app642-preview-owner-0pct-bridge.mjs
          node scripts/app642-preview-owner-0pct-bridge.mjs --self-test

  stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Enforce exact one-shot scope, safe OFF baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/preview'
          test "$(git rev-parse HEAD^1)" = 'b64c722dfdb64f43ac0cd3683b83ddde55396ea0'
          node --check scripts/app642-preview-owner-0pct-bridge.mjs
          node scripts/app642-preview-owner-0pct-bridge.mjs --self-test
          file='.deploy/app642-owner-zero-percent.trigger'
          test -f "$file"
          grep -Fxq 'mode=existing-safe-off-100-plus-one-owner-zero-percent' "$file"
          grep -Fxq 'approved_preview_parent=b64c722dfdb64f43ac0cd3683b83ddde55396ea0' "$file"
          grep -Fxq 'safe_off_version=73f64a79-6cac-441b-9906-9ea9e32db66d' "$file"
          expected="$(printf '%s\n' "$file" '.github/workflows/follow-642-owner-zero-percent.yml' 'scripts/app642-preview-owner-0pct-bridge.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-only HEAD^1 HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo 'APP642_EXACT_SCOPE_AND_PARENT=PASS'
          echo 'APP642_PARENT=b64c722dfdb64f43ac0cd3683b83ddde55396ea0' >> "$GITHUB_ENV"
      - name: Upload exact source once, deploy 0 percent only
        run: node scripts/app642-preview-owner-0pct-bridge.mjs --stage-zero
