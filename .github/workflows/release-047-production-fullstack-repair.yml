name: SORIDRAW 047 PRODUCTION Full-stack Repair

on:
  push:
    branches: [diag-045-full-stack-parity-20260908]
    paths:
      - .github/workflows/release-047-production-fullstack-repair.yml

permissions:
  contents: read

concurrency:
  group: soridraw-047-production-fullstack-repair
  cancel-in-progress: false

env:
  PREVIEW_BASE: 1ad67ef12935e525734507644d280712f9d82384
  MAIN_BASE: 431ea22dfa238bfc89b6bde1fd7f3082cdfe10cf
  FIREBASE_PROJECT: soridraw
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45

jobs:
  repair_and_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve approved repair controller and guard exact state
        shell: bash
        run: |
          set -euo pipefail
          cp .deploy/release-047-production-fullstack-repair.mjs "$RUNNER_TEMP/release-047-production-fullstack-repair.mjs"
          git fetch origin main preview --quiet
          test "$(git rev-parse origin/main)" = "$MAIN_BASE"
          test "$(git rev-parse origin/preview)" = "$PREVIEW_BASE"
          test "$(curl -fsS --retry 3 -H 'Cache-Control: no-cache' 'https://preview.soridraw.com/app-version.json?t=047-prod-guard' | tr -d '\r\n ')" = '{"version":"047"}'
          test "$(curl -fsS --retry 3 -H 'Cache-Control: no-cache' 'https://test.soridraw.com/app-version.json?t=047-prod-guard' | tr -d '\r\n ')" = '{"version":"047"}'
          test "$(curl -fsS --retry 3 -H 'Cache-Control: no-cache' 'https://soridraw.com/app-version.json?t=047-prod-guard' | tr -d '\r\n ')" = '{"version":"045"}'
          echo 'PRODUCTION_047_BASELINE_GUARD=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Build and validate exact MAIN 047
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN_BASE"
          node --check "$RUNNER_TEMP/release-047-production-fullstack-repair.mjs"
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          node scripts/verify-029-music-note-library.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-032-music-note-detail-save-status.mjs
          node scripts/verify-033-explore-feed-revision.mjs
          node scripts/verify-035-auth-nav-readiness.mjs
          node scripts/verify-045-explore-active-revalidation.mjs
          node scripts/verify-046-catalog-stale-revision-rebuild.mjs
          node scripts/verify-047-stale-chunk-recovery.mjs
          node scripts/verify-runtime-environment-parity-028.mjs
          node --test test/catalogWarmCachePolicy.test.mjs
          npm run build
          test "$(cat dist/app-version.json | tr -d '\r\n ')" = '{"version":"047"}'
          grep -Fq 'SORIDRAW(T)' dist/index.html
          grep -Fq 'soridraw-favicon-test-042.png' dist/index.html
          grep -Fq 'soridraw-favicon-production-043.png' dist/index.html
          grep -Fq '"name": "SORIDRAW(T)"' dist/manifest.test.json
          grep -Fq '"name": "SORIDRAW"' dist/manifest.production.json
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/dist-index.sha"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/dist-tree.sha"
          echo 'MAIN_047_PRODUCTION_BUILD_VALIDATION=PASS'

      - name: Install pinned Cloudflare tooling
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          npm install --no-audit --no-fund --package-lock=false
          npx wrangler --version
          echo 'CLOUDFLARE_TOOLING_READY=PASS'

      - name: Restore production Explore Service Bindings and strict full sync
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node "$RUNNER_TEMP/release-047-production-fullstack-repair.mjs"

      - name: Confirm exact MAIN dist remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/dist-tree-before-prod.sha"
          cmp "$RUNNER_TEMP/dist-tree.sha" "$RUNNER_TEMP/dist-tree-before-prod.sha"
          test "$(git rev-parse HEAD)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_BASE"
          echo 'SAME_VALIDATED_DIST_BEFORE_PRODUCTION=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy exact MAIN 047 to Firebase PRODUCTION Hosting only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.json --non-interactive
          echo 'FIREBASE_PRODUCTION_047_HOSTING_DEPLOY=PASS'
          echo 'FUNCTIONS_DEPLOY=NONE'
          echo 'FIRESTORE_RULES_DEPLOY=NONE'

      - name: Verify live PRODUCTION 047 and final three-environment state
        shell: bash
        run: |
          set -euo pipefail
          expected_index="$(cat "$RUNNER_TEMP/dist-index.sha")"
          for origin in 'https://soridraw.web.app' 'https://soridraw.com'; do
            ok=''
            for attempt in $(seq 1 18); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/?t=047-$attempt" -o "$RUNNER_TEMP/prod047.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/prod047.html" | awk '{print $1}')"
                if [ "$actual" = "$expected_index" ]; then ok=yes; break; fi
              fi
              sleep 4
            done
            test "$ok" = yes
            echo "PRODUCTION_INDEX_047_PASS=$origin"
          done
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' 'https://soridraw.com/app-version.json?t=047-final' -o "$RUNNER_TEMP/prod-version.json"
          cmp dist/app-version.json "$RUNNER_TEMP/prod-version.json"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' 'https://soridraw.com/manifest.production.json?t=047-final' -o "$RUNNER_TEMP/prod-manifest.json"
          cmp dist/manifest.production.json "$RUNNER_TEMP/prod-manifest.json"
          grep -Fq '"name": "SORIDRAW"' "$RUNNER_TEMP/prod-manifest.json"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' 'https://soridraw.com/brand/soridraw-favicon-production-043.png?t=047-final' -o "$RUNNER_TEMP/prod-favicon.png"
          cmp dist/brand/soridraw-favicon-production-043.png "$RUNNER_TEMP/prod-favicon.png"
          test "$(curl -fsS -H 'Cache-Control: no-cache' 'https://preview.soridraw.com/app-version.json?t=047-final' | tr -d '\r\n ')" = '{"version":"047"}'
          test "$(curl -fsS -H 'Cache-Control: no-cache' 'https://test.soridraw.com/app-version.json?t=047-final' | tr -d '\r\n ')" = '{"version":"047"}'
          test "$(curl -fsS -H 'Cache-Control: no-cache' 'https://soridraw.com/app-version.json?t=047-final-2' | tr -d '\r\n ')" = '{"version":"047"}'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = "$PREVIEW_BASE"
          echo 'PREVIEW_TEST_PRODUCTION_047=PASS'
          echo 'PRODUCTION_LIVE_047=PASS'
