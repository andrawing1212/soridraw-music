name: TEMP Explore Like Session Diag

on:
  push:
    branches:
      - 'tmp/explore-session-like-batch-20260915'
    paths:
      - '.github/workflows/temp-explore-like-session-diag.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/explore-session-like-batch-20260915
          fetch-depth: 1
      - name: Inspect current like boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo '=== route/page sync usage ==='
          grep -R -n -C 10 "flushSoridrawPageSync\|recoverSoridrawPendingSync\|route-change" src/App.tsx src/main.tsx src/pages src/components || true
          echo '=== Explore like sync handler ==='
          sed -n '820,975p' src/pages/ExplorePage.tsx
          echo '=== like flush core ==='
          sed -n '520,865p' src/services/exploreLikeService.ts
