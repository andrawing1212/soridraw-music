name: Temp 1048 MusicNote Livepath Audit

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1048-musicnote-livepath-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Trace current Music Note bootstrap and Catalog callback
        shell: bash
        run: |
          set -euo pipefail
          echo '=== APP BOOTSTRAP 8950-9335 ==='
          sed -n '8950,9335p' src/App.tsx
          echo '=== APP COLD/PAGED QUERY MARKERS ==='
          grep -n -B 25 -A 55 -E "FAVORITES_PAGE_SIZE|MUSIC_NOTE_COLD|cold repair|cold bootstrap|limit\(60\)|limit\(FAVORITES|refreshFavoritesFromServerFirstPage|loadMoreFavorites|favoritePagination" src/App.tsx | head -1800 || true
          echo '=== AUTH STATE SETUP ==='
          grep -n -B 25 -A 50 -E "onAuthStateChanged|setUser\(|currentUser\.uid|subscribeListBundle\('musicNote'" src/App.tsx | head -1400 || true
          echo '=== ADAPTIVE BRIDGE ==='
          cat src/lib/adaptiveListIndexV2.ts
      - name: Probe deployed Worker health and Catalog CORS
        shell: bash
        run: |
          set -euo pipefail
          WORKER='https://soridraw-media-preview.andrawing1212.workers.dev'
          curl -fsS --max-time 30 "$WORKER/health"
          echo
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://preview.soridraw.com' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck,x-soridraw-known-revision' \
            "$WORKER/v1/catalog/musicNote")"
          echo "CATALOG_PREFLIGHT=$code"
          test "$code" = '204'
