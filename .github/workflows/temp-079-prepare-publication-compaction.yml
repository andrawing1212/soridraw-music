name: TEMP 079 Prepare Publication Compaction

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-079-prepare-publication-compaction.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-temp-079-publication-compaction
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Align verifier final patch contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-explore-like-cost-optimization.mjs')
          s=p.read_text()
          old="""assert.equal(manifest.patches.at(-2), '044-local-first-cost-hotpath.mjs', '044 local-first hotpath must remain directly before 045');
          assert.equal(manifest.patches.at(-1), '045-publication-revision-metadata.mjs', '045 publication revision metadata must be the final Worker release patch');"""
          new="""assert.equal(manifest.patches.at(-2), '045-publication-revision-metadata.mjs', '045 publication revision metadata must remain directly before 046');
          assert.equal(manifest.patches.at(-1), '046-publication-write-compaction.mjs', '046 publication write compaction must be the final Worker release patch');"""
          if s.count(old)!=1:
              raise SystemExit('079 verifier final patch anchor mismatch')
          p.write_text(s.replace(old,new))
          PY
      - name: Build canonical Worker 046
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-worker
          mkdir -p .tmp-worker
          cp cloudflare/explore-worker/canonical/preview-worker.js .tmp-worker/worker.js
          grep -q 'SORIDRAW_PUBLICATION_REVISION_METADATA_045_20260913' .tmp-worker/worker.js
          ! grep -q 'SORIDRAW_PUBLICATION_WRITE_COMPACTION_046_20260913' .tmp-worker/worker.js
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.tmp-worker" node cloudflare/explore-worker/patches/046-publication-write-compaction.mjs
          grep -q 'SORIDRAW_PUBLICATION_WRITE_COMPACTION_046_20260913' .tmp-worker/worker.js
          grep -q 'const visibilityOnly = Boolean(previous?.id)' .tmp-worker/worker.js
          grep -q "status = 'published'" .tmp-worker/worker.js
          node --check .tmp-worker/worker.js
          node --check cloudflare/explore-worker/canonical/preview-entry.js
      - name: Simulate live D1 publication writes locally
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="$PWD/node_modules/wrangler/bin/wrangler.js"
          CFG="$PWD/canonical/wrangler.preview.jsonc"
          SQL="SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE sql IS NOT NULL AND tbl_name IN ('tracks','track_stats','public_profiles','profile_stats','explore_derived_tracks','explore_derived_profiles','explore_derived_changes','explore_derived_state','explore_shared_revision') ORDER BY CASE type WHEN 'table' THEN 1 WHEN 'index' THEN 2 WHEN 'trigger' THEN 3 ELSE 4 END,name;"
          node "$WRANGLER" d1 execute DB --remote --config "$CFG" --command "$SQL" --json > "$RUNNER_TEMP/schema079.json"
          python3 <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          raw=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'schema079.json'),encoding='utf-8'))
          rows=[r for group in raw for r in group.get('results',[])]
          migration=Path('migrations/20260913_03_music_note_write_compaction.sql').read_text()

          def make(compact):
              db=sqlite3.connect(':memory:')
              db.execute('PRAGMA recursive_triggers=ON')
              for r in rows:
                  sql=r.get('sql')
                  if not sql: continue
                  if r.get('type')=='trigger' and r.get('name') in {
                      'explore032_derived_track_insert','explore032_derived_track_update',
                      'explore079_music_note_derived_track_insert','explore079_music_note_derived_track_update'
                  }:
                      continue
                  db.execute(sql)
              # Restore the current live 078 trigger pair before optional 079 replacement.
              for name in ('explore032_derived_track_insert','explore032_derived_track_update'):
                  found=[r for r in rows if r.get('type')=='trigger' and r.get('name')==name]
                  if len(found)!=1: raise RuntimeError(f'live trigger missing: {name}')
                  db.execute(found[0]['sql'])
              if compact:
                  db.executescript(migration)
              db.execute("INSERT OR IGNORE INTO explore_derived_state(id,seq,seeded) VALUES(1,0,1)")
              db.execute("INSERT OR IGNORE INTO explore_shared_revision(scope,revision,updated_at) VALUES('global',1,0)")
              db.execute("INSERT INTO public_profiles(uid,nickname,is_public,created_at,updated_at) VALUES('u','U',1,1,1)")
              db.execute("INSERT INTO profile_stats(uid,follower_count,following_count,updated_at) VALUES('u',0,0,1)")
              db.execute("INSERT INTO tracks(id,owner_uid,source_type,source_id,title,cover_url,suno_url_primary,search_text,is_public,status,published_at,created_at,updated_at) VALUES('t','u','music_note','s','T','','https://example.invalid/t','T',1,'published',1000,1000,1000)")
              db.execute("INSERT INTO track_stats(track_id,like_count,comment_count,play_count,updated_at) VALUES('t',0,0,0,1000)")
              db.commit()
              return db

          def transition(db, public, ts):
              before=db.total_changes
              if public:
                  db.execute("UPDATE tracks SET is_public=1,status='published',published_at=?,updated_at=? WHERE id='t' AND owner_uid='u'",(ts,ts))
              else:
                  db.execute("UPDATE tracks SET is_public=0,updated_at=? WHERE id='t' AND owner_uid='u'",(ts,))
              db.commit()
              return db.total_changes-before

          old=make(False)
          old_private=transition(old,False,2000)
          print('LIVE078_PRIVATE_LOGICAL_WRITES='+str(old_private))
          if old_private < 6:
              raise RuntimeError(f'expected old fanout >=6, got {old_private}')

          db=make(True)
          initial_seq=db.execute("SELECT seq FROM explore_derived_state WHERE id=1").fetchone()[0]
          initial_count=db.execute("SELECT track_count FROM explore_derived_profiles WHERE uid='u'").fetchone()[0]
          private_writes=transition(db,False,2000)
          private_seq=db.execute("SELECT seq FROM explore_derived_state WHERE id=1").fetchone()[0]
          private_count=db.execute("SELECT track_count FROM explore_derived_profiles WHERE uid='u'").fetchone()[0]
          private_active=db.execute("SELECT active FROM explore_derived_tracks WHERE id='t'").fetchone()[0]
          public_writes=transition(db,True,3000)
          public_seq=db.execute("SELECT seq FROM explore_derived_state WHERE id=1").fetchone()[0]
          public_count=db.execute("SELECT track_count FROM explore_derived_profiles WHERE uid='u'").fetchone()[0]
          public_active=db.execute("SELECT active FROM explore_derived_tracks WHERE id='t'").fetchone()[0]
          print('079_PRIVATE_LOGICAL_WRITES='+str(private_writes))
          print('079_PUBLIC_LOGICAL_WRITES='+str(public_writes))
          print('079_SEQ='+str((initial_seq,private_seq,public_seq)))
          print('079_TRACK_COUNT='+str((initial_count,private_count,public_count)))
          assert private_writes <= 4, private_writes
          assert public_writes <= 4, public_writes
          assert private_active == 0 and public_active == 1
          assert private_count == max(0, initial_count-1)
          assert public_count == initial_count
          assert private_seq == initial_seq and public_seq == initial_seq, (initial_seq,private_seq,public_seq)

          # Non-Music-Note transitions must keep the old journal behavior.
          db.execute("INSERT INTO tracks(id,owner_uid,source_type,source_id,title,cover_url,suno_url_primary,search_text,is_public,status,published_at,created_at,updated_at) VALUES('x','u','suno_library','x','X','','https://example.invalid/x','X',1,'published',4000,4000,4000)")
          db.execute("INSERT INTO track_stats(track_id,like_count,comment_count,play_count,updated_at) VALUES('x',0,0,0,4000)")
          db.commit()
          seq_before=db.execute("SELECT seq FROM explore_derived_state WHERE id=1").fetchone()[0]
          db.execute("UPDATE tracks SET is_public=0,updated_at=5000 WHERE id='x'")
          db.commit()
          seq_after=db.execute("SELECT seq FROM explore_derived_state WHERE id=1").fetchone()[0]
          assert seq_after > seq_before, (seq_before,seq_after)
          print('079_NON_MUSIC_JOURNAL_COMPAT=PASS')
          print('079_LOCAL_D1_SIMULATION=PASS')
          print('REMOTE_D1_WRITES=0')
          PY
      - name: Verify Worker and app regression suites
        shell: bash
        run: |
          set -euo pipefail
          SORIDRAW_GENERATED_WORKER="$PWD/.tmp-worker/worker.js" node scripts/verify-explore-like-cost-optimization.mjs
          SORIDRAW_GENERATED_WORKER="$PWD/.tmp-worker/worker.js" node scripts/verify-explore-derived-cache.mjs
          node scripts/verify-explore-deploy-preflight.mjs
          npx tsc --noEmit
          npm run build
          echo '079_REGRESSION_VERIFY=PASS'
      - name: Pin canonical Worker 046 and verifier
        shell: bash
        run: |
          set -euo pipefail
          cp .tmp-worker/worker.js cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          git diff --check
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release-bot@users.noreply.github.com'
          git add scripts/verify-explore-like-cost-optimization.mjs cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git commit -m 'fix(preview): pin 079 publication write compaction'
          git push origin HEAD:preview
          echo '079_CANONICAL_PIN=PASS'
