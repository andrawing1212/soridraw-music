name: Validate 068 Catalog Publication Artist Parity

on:
  push:
    branches:
      - work/catalog-first-publisher-artist-parity
    paths:
      - 'cloudflare/explore-worker/patches/068-catalog-publication-artist-parity.mjs'
      - 'cloudflare/explore-worker/release-patches.json'
      - 'scripts/verify-068-catalog-publication-artist-parity.mjs'
      - 'scripts/verify-publication-w2-r2-catalog-phase-a.mjs'
      - 'scripts/verify-067-like-075-shared-count-parity.mjs'
      - '.github/workflows/validate-068-catalog-publication-artist-parity.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Apply 068 to canonical Worker copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-068-worker
          mkdir -p .tmp-068-worker
          cp cloudflare/explore-worker/canonical/preview-worker.js .tmp-068-worker/worker.js
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.tmp-068-worker" node cloudflare/explore-worker/patches/068-catalog-publication-artist-parity.mjs
          node --check .tmp-068-worker/worker.js
          grep -Fq 'SORIDRAW_CATALOG_PUBLICATION_ARTIST_PARITY_068_20260919' .tmp-068-worker/worker.js
          grep -Fq 'SORIDRAW_R2_ORDERED_CATALOG_PHASE_A_066_20260919' .tmp-068-worker/worker.js
          grep -Fq 'SORIDRAW_LIKE_075_SHARED_COUNT_PARITY_067_20260919' .tmp-068-worker/worker.js
          echo 'WORKER_PATCH_068=PASS'

      - name: Verify 068 and catalog contracts
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/.tmp-068-worker/worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-068-catalog-publication-artist-parity.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-publication-w2-r2-catalog-phase-a.mjs
          node scripts/verify-publication-w2-r2-catalog-phase-b.mjs
          node scripts/verify-publication-w2-track-id-stability.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-067-like-075-shared-count-parity.mjs
          echo 'CATALOG_066_067_068_MATRIX=PASS'

      - name: Existing shared projection regressions
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/.tmp-068-worker/worker.js"
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-112-shared-feed-parity.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-113-shared-profile-parity.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-115-shared-track-card-r2.mjs
          SORIDRAW_GENERATED_WORKER="$generated" node scripts/verify-116-explore-public-count-convergence.mjs
          echo 'SHARED_PROJECTION_REGRESSION_MATRIX=PASS'

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(node -p "require('./public/app-version.json').version")" = "124"
          test "$(git diff --name-only HEAD^ HEAD -- 'src/**/*.css' 'src/**/*.scss' 'src/**/*.tsx' 'firebase*' 'firestore*' | wc -l)" -eq 0
          ! grep -Eiq 'CREATE[[:space:]]+(UNIQUE[[:space:]]+)?INDEX|DROP[[:space:]]+INDEX|CREATE[[:space:]]+TRIGGER|DROP[[:space:]]+TRIGGER|ALTER[[:space:]]+TABLE' cloudflare/explore-worker/patches/068-catalog-publication-artist-parity.mjs
          echo 'APP_VERSION=124'
          echo 'EXTRA_D1_READ_WRITE_068=0'
          echo 'D1_SCHEMA_CHANGE=false'
          echo 'USER_DATA_CHANGE=false'
          echo 'UI_CSS_CHANGE=false'
          echo 'FIREBASE_CHANGE=false'
          echo 'DEPLOYMENT=false'

      - name: Materialize verified 068 canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          cp .tmp-068-worker/worker.js cloudflare/explore-worker/canonical/preview-worker.js
          sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}' > cloudflare/explore-worker/canonical/source-sha256.txt
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          grep -Fq 'SORIDRAW_CATALOG_PUBLICATION_ARTIST_PARITY_068_20260919' cloudflare/explore-worker/canonical/preview-worker.js
          git add cloudflare/explore-worker/canonical/preview-worker.js cloudflare/explore-worker/canonical/source-sha256.txt
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: materialize verified 068 canonical Worker [skip ci]'
          git push origin HEAD:refs/heads/work/catalog-first-publisher-artist-parity
          echo "CANONICAL_068_SHA256=$(cat cloudflare/explore-worker/canonical/source-sha256.txt)"
          echo 'NO_DEPLOYMENT=true'
