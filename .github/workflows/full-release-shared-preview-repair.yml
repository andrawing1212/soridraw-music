name: PREVIEW common manifest read parity (approved exact release)
on:
  push:
    branches: [release/preview-common-manifest-parity]
    paths: ['.github/workflows/full-release-shared-preview-repair.yml']
permissions:
  contents: read
concurrency:
  group: soridraw-preview-explore-worker-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'andrawing1212/soridraw-music' && github.actor == github.repository_owner && github.run_attempt == 1 && github.event.head_commit.message == 'release: approved PREVIEW common manifest read parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact source and approved scope
        run: |
          node --check scripts/full-release-shared-preview-repair.mjs
          node --check cloudflare/explore-worker/canonical/preview-entry.js
      - name: Verify existing QA proof and activate only pinned PREVIEW Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/full-release-shared-preview-repair.mjs
