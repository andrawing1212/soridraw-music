name: SORIDRAW 048 Live Explore Runtime Audit
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/preview-048-live-explore-runtime-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      TEST_WORKER: soridraw-explore-test
      PRODUCTION_WORKER: soridraw-explore-api
      SHARED_D1_ID: 217ef5b1-5d80-4f7c-afc7-9e07eb05c06b
    steps:
      - name: Audit active Explore Workers read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN;
          const targets=[
            ['PREVIEW',process.env.PREVIEW_WORKER],
            ['TEST',process.env.TEST_WORKER],
            ['PRODUCTION',process.env.PRODUCTION_WORKER],
          ];
          async function g(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${T}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw Error('CF '+r.status+' '+JSON.stringify(x).slice(0,500));return x.result||x;}
          (async()=>{
            for(const [stage,N] of targets){
              const base=`https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${N}`;
              const ds=await g(base+'/deployments');
              const d=(ds.deployments||ds||[])[0];
              const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];
              if(!active?.version_id||Number(active.percentage||0)<99.99) throw Error(stage+' no single active Worker');
              const v=await g(`https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${N}/versions/${active.version_id}?include=modules`);
              const mods=v.modules||[]; const m=mods.find(x=>x.name===(v.main_module||mods[0]?.name))||mods[0];
              const s=Buffer.from(m.content_base64,'base64').toString('utf8');
              console.log(`${stage}_ACTIVE_VERSION=${active.version_id}`);
              console.log(`${stage}_SOURCE_SHA256=${crypto.createHash('sha256').update(s).digest('hex')}`);
              for(const q of [
                'readFeedR2Revision077',
                '/v1/feed-revision',
                'explore_shared_revision',
                'explore_derived_tracks',
                'syncExploreFeedR2Publication043',
                'patchExploreProfileR2Publication043',
                'refreshSourceMedia',
                'suno_url_primary',
                'suno_url_secondary',
              ]){
                const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,'\\              for(const q of [
                'readFeedR2Revision077',
                '/v1/feed-revision',
                'explore_shared_revision',
                'explore_derived_tracks',
                'syncExploreFeedR2Publication043',
                'patchExploreProfileR2Publication043',
                'refreshSourceMedia',
                'suno_url_primary',
                'suno_url_secondary',
              ]){
                const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
                console.log(`${stage}_MARKER_${q.replace(/[^a-z0-9]+/gi,'_')}=${(s.match(new RegExp(escaped,'g'))||[]).length}`);
              }
');
                console.log(`${stage}_MARKER_${q.replace(/[^a-z0-9]+/gi,'_')}=${(s.match(new RegExp(escaped,'g'))||[]).length}`);
              }
              if(stage!=='PREVIEW'){
                for(const needle of ['explore_shared_revision','explore_derived_tracks']){
                  let from=0,index=0;
                  while((from=s.indexOf(needle,from))>=0 && index<6){
                    const snippet=s.slice(Math.max(0,from-700),Math.min(s.length,from+1300)).replace(/\s+/g,' ');
                    console.log(`${stage}_CONTEXT_${needle}_${index}=${snippet}`);
                    from+=needle.length; index+=1;
                  }
                }
              }
              const settings=await g(base+'/settings');
              const bindings=Array.isArray(settings.bindings)?settings.bindings:[];
              const db=bindings.find(b=>b.type==='d1'&&b.name==='DB');
              const media=bindings.find(b=>b.type==='r2_bucket'&&b.name==='PROFILE_MEDIA');
              console.log(`${stage}_DB_ID=${String(db?.id||db?.database_id||db?.uuid||'')}`);
              console.log(`${stage}_PROFILE_MEDIA=${String(media?.bucket_name||media?.bucket||media?.name||'')}`);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Audit shared D1 track fanout read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN,D=process.env.SHARED_D1_ID;
          const sql=`
            SELECT type,name,tbl_name,sql
            FROM sqlite_schema
            WHERE (type='trigger' AND (tbl_name='tracks' OR sql LIKE '%explore_shared_revision%'))
               OR (type='index' AND tbl_name='tracks')
            ORDER BY type,name
          `;
          (async()=>{
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${A}/d1/database/${D}/query`,{
              method:'POST',
              headers:{Authorization:`Bearer ${T}`,Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify({sql})
            });
            const x=await r.json();
            if(!r.ok||x.success===false) throw Error('D1 '+r.status+' '+JSON.stringify(x).slice(0,800));
            const rows=(x.result||[]).flatMap(v=>v?.results||[]);
            for(const row of rows){
              const sqlText=String(row.sql||'').replace(/\s+/g,' ').trim();
              console.log(`D1_${String(row.type||'').toUpperCase()} ${row.name} :: ${sqlText}`);
            }
            console.log('D1_READONLY_SCHEMA_AUDIT=PASS rows='+rows.length);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
