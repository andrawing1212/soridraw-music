name: TEMP 1009 Music Note Bundle Write Cut

on:
  push:
    branches: [preview-musicnote-io-v3]
    paths:
      - '.github/workflows/temp-1009-musicnote-bundle-write-cut.yml'

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-musicnote-io-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply Music Note bundle write cut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text(encoding='utf-8')
          old="""              musicNoteBundleActiveUids.add(currentUser.uid);\n              musicNoteFreshBootstrapUids.delete(currentUser.uid);\n"""
          new="""              // 1009 — this bundle subscription is a one-shot bootstrap read, not a live mirror.\n              // Keep it inactive after hydration so a plain save/unsave does not rewrite the\n              // server list-cache document. Cross-device changes still use the 901 version\n              // signal + updatedAtMs delta query, so data safety/sync stays intact.\n              musicNoteBundleActiveUids.delete(currentUser.uid);\n              musicNoteFreshBootstrapUids.delete(currentUser.uid);\n"""
          if old not in s:
              raise SystemExit('1009 anchor missing or already changed')
          if s.count(old) != 1:
              raise SystemExit(f'1009 anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify scope and contracts
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/App.tsx"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text(encoding='utf-8')
          assert '1009 — this bundle subscription is a one-shot bootstrap read, not a live mirror.' in s
          assert 'musicNoteBundleActiveUids.add(currentUser.uid);' not in s
          assert "where('updatedAtMs', '>', localVersion)" in s
          assert "orderBy('updatedAtMs', 'asc')" in s
          assert 'originDeviceId && originDeviceId === getMusicNoteDeviceId()' in s
          assert "scheduleListBundleWrite('musicNote', uid, safeList" in s
          print('1009 contracts: PASS')
          PY
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit verified source only
        run: |
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "perf(preview): stop Music Note heart bundle rewrites"
          git push origin HEAD:preview-musicnote-io-v3