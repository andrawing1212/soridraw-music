name: Temporary Firebase Auth Template Configuration

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  configure-auth-template:
    if: github.event.issue.title == 'CONFIGURE SORIDRAW AUTH EMAIL TEMPLATE FINAL 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure verification email
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          ACCESS_TOKEN="$(gcloud auth application-default print-access-token)"
          BODY='<div style="font-family:Arial,Apple SD Gothic Neo,Noto Sans KR,sans-serif;background:#f5f5f5;padding:32px 16px"><div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e7e7e7;border-radius:16px;padding:32px;box-sizing:border-box"><div style="font-size:12px;font-weight:700;letter-spacing:3px;color:#a97700;margin-bottom:14px">SORIDRAW</div><h1 style="font-size:24px;line-height:1.4;margin:0 0 14px;color:#161616">이메일 인증을 완료해주세요</h1><p style="font-size:15px;line-height:1.8;color:#555;margin:0 0 24px">안녕하세요.<br>아래 버튼을 눌러 이메일 주소 인증을 완료해주세요.</p><a href="%LINK%" style="display:block;padding:15px 20px;border-radius:12px;background:#ffb400;color:#111;text-decoration:none;font-size:16px;font-weight:800;text-align:center;margin-bottom:24px">이메일 인증하기</a><p style="font-size:13px;line-height:1.7;color:#777;margin:0 0 24px">이 인증을 요청하지 않았다면 이 이메일을 무시하셔도 됩니다.</p><div style="border-top:1px solid #eee;padding-top:20px;font-size:13px;line-height:1.6;color:#555">감사합니다.<br><strong>SORIDRAW팀</strong></div></div></div>'

          jq -n \
            --arg name 'projects/soridraw-app-866a5/config' \
            --arg senderDisplayName 'SORIDRAW' \
            --arg subject 'SORIDRAW 이메일 인증을 완료해주세요' \
            --arg body "$BODY" \
            --arg callbackUri 'https://soridraw-music.vercel.app/auth/action' \
            '{name:$name,notification:{sendEmail:{verifyEmailTemplate:{senderDisplayName:$senderDisplayName,subject:$subject,body:$body,bodyFormat:"HTML"},callbackUri:$callbackUri}}}' > /tmp/config.json

          MASK='notification.sendEmail.verifyEmailTemplate.senderDisplayName%2Cnotification.sendEmail.verifyEmailTemplate.subject%2Cnotification.sendEmail.verifyEmailTemplate.body%2Cnotification.sendEmail.verifyEmailTemplate.bodyFormat%2Cnotification.sendEmail.callbackUri'

          set +e
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/config.json \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/soridraw-app-866a5/config?updateMask=${MASK}" \
            > /tmp/response.json 2> /tmp/error.txt
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            {
              echo '❌ AUTH_TEMPLATE_CONFIG_FAILED'
              echo
              echo '```text'
              cat /tmp/error.txt
              cat /tmp/response.json
              echo '```'
            } > /tmp/comment.md
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.md
            exit "$code"
          fi

          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            'https://identitytoolkit.googleapis.com/admin/v2/projects/soridraw-app-866a5/config' \
            > /tmp/verify.json

          jq -e '.notification.sendEmail.verifyEmailTemplate.senderDisplayName == "SORIDRAW" and .notification.sendEmail.verifyEmailTemplate.subject == "SORIDRAW 이메일 인증을 완료해주세요" and .notification.sendEmail.verifyEmailTemplate.bodyFormat == "HTML" and .notification.sendEmail.callbackUri == "https://soridraw-music.vercel.app/auth/action"' /tmp/verify.json >/dev/null

          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ AUTH_TEMPLATE_CONFIG_SUCCESS sender_display=SORIDRAW format=HTML action_url=https://soridraw-music.vercel.app/auth/action"

      - name: Report workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ AUTH_TEMPLATE_WORKFLOW_FAILED run_id=${{ github.run_id }}"
