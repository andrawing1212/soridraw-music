name: Temp 1027b Music Note Bounded Fallback

on:
  push:
    branches:
      - preview
    paths:
      - .github/workflows/temp-1027b-music-note-bounded-fallback.yml

permissions:
  contents: write

jobs:
  apply_test_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20
      - run: python .deploy/apply-1027b-music-note-bounded-fallback-continuation.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node scripts/verify-music-note-pagination-order.mjs
      - run: npm run build
      - name: Commit verified change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add src/App.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 2
          git commit -m 'fix(music-note): continue bounded fallback cursor safely'
          git push origin HEAD:preview
