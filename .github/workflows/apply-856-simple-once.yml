name: Apply SORIDRAW 856 simple once

on:
  push:
    branches: [preview]
    paths:
      - .deploy/apply-856-trigger2.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply patch
        run: python3 .deploy/apply-856.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name "andrawing1212"
          git config user.email "andrawing1212@gmail.com"
          printf 'status=success\nversion=856\napp_build=success\nfinished_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/apply-856-result.txt
          git add src/services/geminiService.ts .deploy/apply-856-result.txt
          git diff --cached --check
          git commit -m "fix(856): reject English-heavy Japanese lyric cards"
          git push origin HEAD:preview
