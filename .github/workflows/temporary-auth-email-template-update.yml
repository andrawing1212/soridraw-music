name: Temporary Auth Email Template Update

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  update-auth-email-template:
    if: github.event.issue.title == 'UPDATE SORIDRAW AUTH EMAIL TEMPLATE RETRY 20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}
          token_format: access_token

      - name: Update Firebase Auth verification email template
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BODY=$(cat <<'HTML'
          <!doctype html>
          <html lang="ko">
            <body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#161616;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:32px 16px;">
                <tr><td align="center">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e7e7e7;">
                    <tr><td style="padding:32px 32px 12px;font-size:12px;font-weight:700;letter-spacing:3px;color:#a97700;">SORIDRAW</td></tr>
                    <tr><td style="padding:0 32px 8px;font-size:24px;line-height:1.4;font-weight:800;">이메일 인증을 완료해주세요</td></tr>
                    <tr><td style="padding:0 32px 24px;font-size:15px;line-height:1.8;color:#555555;">안녕하세요.<br>아래 버튼을 눌러 이메일 주소 인증을 완료해주세요.</td></tr>
                    <tr><td align="center" style="padding:0 32px 28px;"><a href="%LINK%" style="display:block;width:100%;box-sizing:border-box;padding:15px 20px;border-radius:12px;background:linear-gradient(90deg,#ffd24f,#f46f92);color:#111111;text-decoration:none;font-size:16px;font-weight:800;text-align:center;">이메일 인증하기</a></td></tr>
                    <tr><td style="padding:0 32px 28px;font-size:13px;line-height:1.7;color:#777777;">이 인증을 요청하지 않았다면 이 이메일을 무시하셔도 됩니다.</td></tr>
                    <tr><td style="padding:22px 32px 30px;border-top:1px solid #eeeeee;font-size:13px;line-height:1.6;color:#555555;">감사합니다.<br><strong>SORIDRAW팀</strong></td></tr>
                  </table>
                </td></tr>
              </table>
            </body>
          </html>
          HTML
          )

          jq -n \
            --arg name "projects/soridraw-app-866a5/config" \
            --arg senderDisplayName "SORIDRAW" \
            --arg subject "SORIDRAW 이메일 인증을 완료해주세요" \
            --arg body "$BODY" \
            --arg callbackUri "https://soridraw-music.vercel.app/auth/action" \
            '{name:$name,notification:{sendEmail:{verifyEmailTemplate:{senderDisplayName:$senderDisplayName,subject:$subject,body:$body,bodyFormat:"HTML"},callbackUri:$callbackUri}}}' \
            > /tmp/auth-email-template.json

          UPDATE_MASK='notification.sendEmail.verifyEmailTemplate.senderDisplayName%2Cnotification.sendEmail.verifyEmailTemplate.subject%2Cnotification.sendEmail.verifyEmailTemplate.body%2Cnotification.sendEmail.verifyEmailTemplate.bodyFormat%2Cnotification.sendEmail.callbackUri'

          set +e
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/auth-email-template.json \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/soridraw-app-866a5/config?updateMask=${UPDATE_MASK}" \
            > /tmp/auth-email-template-response.json 2> /tmp/auth-email-template-error.txt
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            {
              echo '❌ AUTH_EMAIL_TEMPLATE_UPDATE_FAILED'
              echo
              echo '```text'
              cat /tmp/auth-email-template-error.txt
              cat /tmp/auth-email-template-response.json
              echo '```'
            } > /tmp/auth-email-template-comment.md
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/auth-email-template-comment.md
            exit "$code"
          fi

          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/soridraw-app-866a5/config" \
            > /tmp/auth-email-template-verify.json

          jq -e '.notification.sendEmail.verifyEmailTemplate.senderDisplayName == "SORIDRAW" and .notification.sendEmail.verifyEmailTemplate.subject == "SORIDRAW 이메일 인증을 완료해주세요" and .notification.sendEmail.verifyEmailTemplate.bodyFormat == "HTML" and .notification.sendEmail.callbackUri == "https://soridraw-music.vercel.app/auth/action"' /tmp/auth-email-template-verify.json >/dev/null

          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ AUTH_EMAIL_TEMPLATE_UPDATED sender_display=SORIDRAW subject='SORIDRAW 이메일 인증을 완료해주세요' format=HTML action_url=https://soridraw-music.vercel.app/auth/action"
