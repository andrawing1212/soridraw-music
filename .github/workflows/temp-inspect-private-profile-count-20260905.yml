name: SORIDRAW Inspect App Listener Tail 2026-09-05
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-private-profile-count-20260905.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 2 }
      - name: Inspect listener tail
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          lines=Path('src/App.tsx').read_text(encoding='utf-8').splitlines()
          for i in range(9047,min(9145,len(lines))): print(f'{i+1:05d}: {lines[i]}')
          PY
