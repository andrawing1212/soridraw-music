name: TEMP 139 070 Cross Env Dry Run
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-139-070-cross-env-dry-run.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d156e2ca289fdde1c4fa6d46f0955608c7cb7ada
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Worker tooling
        working-directory: cloudflare/explore-worker
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify canonical 070 source pin
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          test "$actual" = '91d154aaa9524dbf1349d48d0d14eadd09738602f103fedfbcf360270c340000'
          grep -q 'SORIDRAW_SHARED_FEED_LEGACY_WRITER_GUARD_070_20260919' cloudflare/explore-worker/canonical/preview-worker.js
          SORIDRAW_GENERATED_WORKER="$PWD/cloudflare/explore-worker/canonical/preview-worker.js" node scripts/verify-070-shared-feed-guard.mjs
          echo 'CANONICAL_070_PIN=PASS'
      - name: TEST live-binding reconstruction plus dry-run only
        shell: bash
        run: |
          set -euo pipefail
          before="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/soridraw-explore-test/deployments" | jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id')"
          echo "TEST_BEFORE=$before"
          node .deploy/release-worker-runtime.mjs test dry-run | tee "$RUNNER_TEMP/test-dry-run.log"
          after="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/soridraw-explore-test/deployments" | jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id')"
          test "$before" = "$after"
          grep -q 'SHARED_CANONICAL_BINDINGS=PASS' "$RUNNER_TEMP/test-dry-run.log"
          grep -q 'PROFILE_MEDIA:soridraw-profile-media' "$RUNNER_TEMP/test-dry-run.log"
          grep -q 'EXPLORE_CACHE:soridraw-profile-media-test' "$RUNNER_TEMP/test-dry-run.log"
          echo 'TEST_070_DRY_RUN_AND_BINDINGS=PASS'
      - name: PRODUCTION live-binding reconstruction plus dry-run only
        shell: bash
        run: |
          set -euo pipefail
          before="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/soridraw-explore-api/deployments" | jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id')"
          echo "PRODUCTION_BEFORE=$before"
          node .deploy/release-worker-runtime.mjs production dry-run | tee "$RUNNER_TEMP/prod-dry-run.log"
          after="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/soridraw-explore-api/deployments" | jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id')"
          test "$before" = "$after"
          grep -q 'SHARED_CANONICAL_BINDINGS=PASS' "$RUNNER_TEMP/prod-dry-run.log"
          grep -q 'PROFILE_MEDIA:soridraw-profile-media' "$RUNNER_TEMP/prod-dry-run.log"
          echo 'PRODUCTION_070_DRY_RUN_AND_BINDINGS=PASS'
      - name: Confirm no live deployment mutation
        shell: bash
        run: |
          set -euo pipefail
          echo 'TEST_DEPLOY=0 PRODUCTION_DEPLOY=0 D1_WRITE=0 R2_WRITE=0 FIREBASE=UNCHANGED'
