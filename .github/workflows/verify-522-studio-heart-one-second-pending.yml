name: Verify app522 Studio Heart 1s Pending Safety (No Deploy)
on:
  pull_request:
    branches: [preview]
    paths:
      - 'src/App.tsx'
      - 'src/lib/studioHeartBatch.ts'
      - 'scripts/verify-522-studio-heart-one-second-pending.mjs'
      - 'scripts/verify-523-studio-heart-ordering-safety.mjs'
      - 'src/lib/studioHeartCanonical523.ts'
      - 'firestore.rules'
      - 'scripts/verify-524-owner-heart-firestore-emulator.mjs'
      - 'src/services/userDomainSyncService.ts'
      - 'scripts/verify-290-studio-heart-batch.mjs'
      - 'scripts/verify-302-studio-heart-local-first-delayed-remote.mjs'
      - 'scripts/verify-349-studio-heart-settlement-media.mjs'
      - '.github/workflows/verify-522-studio-heart-one-second-pending.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-heart:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 1s settle + RTDB unconfirmed protection + serial newest click
        run: |
          node scripts/verify-522-studio-heart-one-second-pending.mjs
          node scripts/verify-523-studio-heart-ordering-safety.mjs
      - name: Protected heart and Music Note regressions
        run: |
          node scripts/verify-290-studio-heart-batch.mjs
          node scripts/verify-302-studio-heart-local-first-delayed-remote.mjs
          node scripts/verify-349-studio-heart-settlement-media.mjs
          node scripts/verify-347-studio-heart-reconcile.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
          node scripts/verify-521-music-note-catalog-automatic.mjs
      - name: Real Firestore Rules emulator — isolated demo project, never deploy
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @firebase/rules-unit-testing@5.0.2 firebase-tools@14.22.0
          npx firebase emulators:exec --only firestore --project demo-soridraw-app524 --non-interactive \
            "node scripts/verify-524-owner-heart-firestore-emulator.mjs"
      - name: TypeScript and Build
        run: |
          npm run lint
          npm run build
