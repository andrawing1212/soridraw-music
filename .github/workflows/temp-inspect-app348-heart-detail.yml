name: SORIDRAW inspect app348 heart detail source

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/inspect-app348-heart-detail.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - name: Print focused source blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def block(path, start, end, label):
              s=Path(path).read_text()
              a=s.find(start)
              b=s.find(end,a+len(start)) if a>=0 else -1
              print("\n===== "+label+" =====")
              print("START",a,"END",b)
              if a>=0:
                  if b<0: b=min(len(s),a+35000)
                  print(s[a:b][:35000])
          block('src/App.tsx','  const toggleFavorite = async','\n\n  const updateFavorite = async','APP_TOGGLE_FAVORITE')
          block('src/App.tsx','  const flushStudioHeartPendingIntent = async','\n\n  const scheduleStudioHeartPendingIntent','APP_HEART_FLUSH')
          block('src/App.tsx','  const applyRemoteStudioHeartPreview = (','\n\n  const clearRemoteStudioHeartPreviewFromCanonical','APP_REMOTE_PREVIEW')
          block('src/pages/FavoritesPage.tsx','  const saveFavoriteSunoShareUrls = async','\n\n  const saveFavoriteSunoShareUrl','PAGE_SUNO_SAVE')
          block('src/pages/FavoritesPage.tsx','  const openFavoriteDetail = async','\n\n  const executeFavoriteMenuAction','PAGE_DETAIL_OPEN')
          block('src/pages/FavoritesPage.tsx','  const scheduleFavoriteDetailFlush = () => {','\n\n  // Keep the Music Note row','PAGE_DETAIL_SCHEDULE')
          PY
