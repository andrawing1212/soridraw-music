name: Verify app521 Music Note automatic Catalog settlement (No Deploy)
on:
  pull_request:
    branches: [preview]
    paths:
      - 'src/lib/userDataEngine.ts'
      - 'cloudflare/media-worker/src/index.js'
      - 'scripts/verify-library-catalog-color-projection.mjs'
      - 'scripts/verify-canonical-color-event-delivery.mjs'
      - 'functions/src/colorCatalogEventPure.ts'
      - 'functions/src/colorCatalogPublisher.ts'
      - 'functions/src/colorCatalogOutbox.ts'
      - 'src/services/colorCatalogOutboxService.ts'
      - 'src/pages/FavoritesPage.tsx'
      - 'src/pages/SunoLibraryPage.tsx'
      - 'functions/src/index.ts'
      - 'functions/scripts/verify-color-canonical-events.cjs'
      - 'cloudflare/media-worker/src/colorRestoration.js'
      - 'scripts/verify-exact-color-restore-candidate.mjs'
      - 'scripts/verify-media-color-rollback-readonly.mjs'
      - '.deploy/release-media-worker-runtime.mjs'
      - 'src/App.tsx'
      - 'scripts/verify-521-music-note-catalog-automatic.mjs'
      - '.github/workflows/verify-521-music-note-catalog-automatic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  music-note-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Automatic post-commit Catalog settlement and stale signal protection
        run: node scripts/verify-521-music-note-catalog-automatic.mjs
      - name: Manual one-row canonical color restore candidate (default OFF, no deploy)
        run: node scripts/verify-exact-color-restore-candidate.mjs
      - name: Server-signed color delivery / R2 CAS (source-only)
        run: node scripts/verify-canonical-color-event-delivery.mjs
      - name: Firebase color publisher build and offline contract (no deploy)
        run: |
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          node functions/scripts/verify-color-canonical-events.cjs
      - name: Media Worker bundle dry-run (no Cloudflare upload or deployment)
        run: |
          npm --prefix cloudflare/media-worker install --no-audit --no-fund
          npm --prefix cloudflare/media-worker run check
      - name: Shared Media color rollback preflight guard (mock-only, no deploy)
        run: node scripts/verify-media-color-rollback-readonly.mjs --self-test
      - name: Live Media Worker deployment version inspection (GET only, PR 741)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 741 }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
        run: node scripts/verify-media-color-rollback-readonly.mjs --live-versions
      - name: Library canonical color projection (source only, zero deploy)
        run: |
          node --check cloudflare/media-worker/src/index.js
          node scripts/verify-library-catalog-color-projection.mjs
          node scripts/verify-356-shared-private-catalog-authority.mjs
      - name: Preserve existing Music Note queue, immediate RTDB and local draft
        run: |
          node scripts/verify-519-catalog-pending-recovery.mjs
          node scripts/verify-349-studio-heart-settlement-media.mjs
          node scripts/verify-031-music-note-detail-batched-draft.mjs
      - name: TypeScript and app build
        run: |
          npm run lint
          npm run build
