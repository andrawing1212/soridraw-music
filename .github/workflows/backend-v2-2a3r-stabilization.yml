name: SORIDRAW Backend V2 2-A3-R Stabilization

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.deploy/apply-backend-v2-2a3r-emergency.py'

permissions:
  contents: write

concurrency:
  group: soridraw-backend-v2-2a3r-stabilization
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Apply deterministic emergency patch
        id: patch
        run: python3 .deploy/apply-backend-v2-2a3r-emergency.py

      - name: Verify approved change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/firebase.js',
              'src/services/playlistService.ts',
              'src/pages/SunoLibraryPage.tsx',
              'src/lib/songUtils.ts',
              'functions/src/index.ts',
              'docs/SORIDRAW_BACKEND_V2_STEP2A3R_EMERGENCY_STABILIZATION.md',
              'docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected files changed: {sorted(unexpected)}')
          required = {
              'src/firebase.js',
              'src/services/playlistService.ts',
              'src/pages/SunoLibraryPage.tsx',
              'src/lib/songUtils.ts',
              'functions/src/index.ts',
              'docs/SORIDRAW_BACKEND_V2_STEP2A3R_EMERGENCY_STABILIZATION.md',
              'docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md',
          }
          missing = required - changed
          if missing:
              raise SystemExit(f'required emergency files not changed: {sorted(missing)}')
          for protected in ['src/App.tsx','firestore.rules','database.rules.json']:
              result = subprocess.run(['git','diff','--quiet','HEAD','--',protected])
              if result.returncode != 0:
                  raise SystemExit(f'protected file changed: {protected}')
          print('approved emergency scope verified')
          PY

      - name: Verify stabilization markers
        id: markers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            'src/firebase.js': [
              'isVercelPreviewApp',
              'soridraw-music-git-preview-andrawing1212.vercel.app',
              'isVercelPreviewApp || isVercelTestApp',
            ],
            'src/services/playlistService.ts': [
              'defaultPlaylistEnsurePromises',
              'ensureDefaultPlaylistsInternal',
              'defaultPlaylistEnsurePromises.delete(uid)',
            ],
            'src/pages/SunoLibraryPage.tsx': [
              'playlistLiveModeActive',
              '[user?.uid, playlistLiveModeActive, isSharedView]',
              "audioValidationStatus === 'pending_or_empty'",
            ],
            'src/lib/songUtils.ts': [
              'blob.size <= 0',
              'Audio download is empty',
            ],
            'functions/src/index.ts': [
              'probeSunoAudioUrlHasBytes',
              'findFirstUsableSunoAudioUrl',
              'audioValidationStatus',
              'verifiedAudioUrls',
              'reportedAudioUrls',
            ],
          }
          for file, markers in checks.items():
              source = Path(file).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in source:
                      raise SystemExit(f'missing marker {marker!r} in {file}')
          print('stabilization markers verified')
          PY

      - name: Set up Node.js 20 for frontend parity
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        id: install_frontend
        continue-on-error: true
        run: npm ci

      - name: Frontend type/lint check
        id: lint
        if: steps.install_frontend.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Frontend production build
        id: build
        if: steps.install_frontend.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Set up Node.js 22 for Functions source check
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        id: install_functions
        continue-on-error: true
        working-directory: functions
        run: npm ci

      - name: Functions TypeScript no-deploy check
        id: functions_typecheck
        if: steps.install_functions.outcome == 'success'
        continue-on-error: true
        working-directory: functions
        run: npx tsc --noEmit

      - name: Final safety gate
        id: final
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.patch.outcome }}' = success
          test '${{ steps.scope.outcome }}' = success
          test '${{ steps.markers.outcome }}' = success
          test '${{ steps.install_frontend.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.install_functions.outcome }}' = success
          test '${{ steps.functions_typecheck.outcome }}' = success
          echo '2-A3-R safety gate PASS; no Firebase deploy executed.'

      - name: Commit validated stabilization to preview
        if: steps.final.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/firebase.js \
            src/services/playlistService.ts \
            src/pages/SunoLibraryPage.tsx \
            src/lib/songUtils.ts \
            functions/src/index.ts \
            docs/SORIDRAW_BACKEND_V2_STEP2A3R_EMERGENCY_STABILIZATION.md \
            docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git commit -m "fix: stage 2-A3-R emergency stabilization"
          git push origin HEAD:preview
