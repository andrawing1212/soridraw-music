name: Explore Community Backend Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/explore-community-backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare exact live Worker source
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run cf:prepare
          node --check .remote-worker/worker.js

      - name: Print social mutation and route shapes
        working-directory: cloudflare/explore-worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('.remote-worker/worker.js','utf8');
          function extract(name){
            const needle = `async function ${name}(`;
            const start = src.indexOf(needle);
            if(start < 0) return null;
            const brace = src.indexOf('{', start);
            let depth = 0, quote = null, esc = false;
            for(let i=brace;i<src.length;i++){
              const c=src[i];
              if(quote){
                if(esc){ esc=false; continue; }
                if(c==='\\'){ esc=true; continue; }
                if(c===quote) quote=null;
                continue;
              }
              if(c==='"'||c==="'"||c==='`'){ quote=c; continue; }
              if(c==='{') depth++;
              else if(c==='}' && --depth===0) return src.slice(start,i+1);
            }
            return null;
          }
          const wanted = [
            'handleFollowState',
            'handleFollow',
            'handleLike',
            'patchPublicProfileFirstViewLikeCount',
            'refreshPublicProfileFirstViewProfile',
            'handlePublicProfileFirstViewSnapshot'
          ];
          for(const name of wanted){
            const body = extract(name);
            console.log(`=== ${name} ===`);
            console.log(body || 'MISSING');
          }
          console.log('=== SOCIAL ROUTES ===');
          console.log(src.split('\n').filter((line) => /follow|like|followers|following/.test(line) && /pathname|handle|\/v1\//.test(line)).slice(-120).join('\n'));
          console.log('=== TABLE TOKENS ===');
          const tables = [...new Set([...src.matchAll(/(?:FROM|INTO|UPDATE|TABLE IF NOT EXISTS)\s+([a-zA-Z0-9_]+)/g)].map(m=>m[1]))].filter(t=>/follow|like|profile|track/.test(t));
          console.log(tables.sort().join('\n'));
          NODE
          echo 'READ_ONLY=true'
          echo 'NO_DEPLOY=true'
          echo 'NO_D1_MUTATION=true'
