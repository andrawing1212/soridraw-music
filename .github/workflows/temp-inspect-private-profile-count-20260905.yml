name: SORIDRAW Inspect Private Cost Profile Count Refresh 2026-09-05
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-inspect-private-profile-count-20260905.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      SOUL_UID: 99rbjBuypFUkWELPbZ9uUDoqEna2
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inspect refresh users listener in current preview source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for p in ['src/App.tsx','src/lib/userProfileCache.ts']:
              text=Path(p).read_text(encoding='utf-8')
              print(f'===== {p} =====')
              needles=['onSnapshot', "doc(db, 'users'", 'readUserProfileCache', 'writeUserProfileCache', 'forceLogoutAt']
              lines=text.splitlines()
              hits=set()
              for i,line in enumerate(lines):
                  if any(n in line for n in needles):
                      for j in range(max(0,i-8),min(len(lines),i+14)): hits.add(j)
              for j in sorted(hits): print(f'{j+1:05d}: {lines[j]}')
          PY
      - name: Inspect active Worker profile and mutation cache paths
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1000)}`);return x.result||x;}
          function functions(src){const out=[];const re=/(async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(/g;let m;while((m=re.exec(src))){const st=m.index,b=src.indexOf('{',re.lastIndex);if(b<0)continue;let d=0,q=null,e=false,end=-1;for(let i=b;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue;}if(c==='\\'){e=true;continue;}if(c===q)q=null;continue;}if(c==='"'||c==="'"||c==='`'){q=c;continue;}if(c==='{')d++;else if(c==='}'&&--d===0){end=i+1;break;}}if(end>st)out.push({name:m[2],text:src.slice(st,end)});}return out;}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;const deps=await get(`${base}/deployments`);const d=(deps.deployments||deps||[])[0];const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];console.log('[active]',active.version_id);const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);const mods=ver.modules||[];const main=mods.find(m=>m.name===(ver.main_module||mods[0]?.name))||mods[0];const src=Buffer.from(main.content_base64,'base64').toString('utf8');const fns=functions(src);const names=['handleVisibilityR2Core','handleMusicNotePrivate017','invalidatePublicationProfileCaches017','materializePublicProfileFirstView','refreshPublicProfileFirstViewTrackWindow','writePublicProfileFirstViewSnapshot','readPublicProfileFirstViewRow','readPublicProfileFirstViewTrackWindow','prebuildPublicProfileFirstViewIfMissing','exploreProfileR2Key','syncExploreProfileR2FromD1','handlePublicProfile'];const map=new Map(fns.map(f=>[f.name,f.text]));for(const n of names)console.log(`\n===== ${n} =====\n${map.get(n)||'[MISSING]'}`);console.log('\n===== FIRST VIEW / PROFILE ROUTE LINES =====');src.split('\n').forEach((line,i)=>{if(/first-view|firstView|exploreProfileR2Key|\/v1\/profiles/.test(line))console.log(`${i+1}: ${line}`)});})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Compare current public profile count with Explore feed for Soulforce
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.PREVIEW_BASE, uid=process.env.SOUL_UID;
          async function j(path){const r=await fetch(base+path,{headers:{Origin:'https://preview.soridraw.com'}});const text=await r.text();let x=null;try{x=JSON.parse(text)}catch{};console.log(path,'HTTP',r.status);return {r,x,text};}
          const getItems=x=>Array.isArray(x?.data?.items)?x.data.items:Array.isArray(x?.items)?x.items:[];
          const ownerUid=item=>String(item?.ownerUid||item?.owner?.uid||item?.owner_uid||'');
          (async()=>{
            const paths=[`/v1/profiles/${encodeURIComponent(uid)}/first-view`,`/v1/profiles/${encodeURIComponent(uid)}`];
            for(const p of paths){const {r,x}=await j(p);if(r.ok){const items=getItems(x);const count=x?.data?.profile?.trackCount??x?.data?.trackCount??x?.profile?.trackCount??null;console.log('[profile]',p,'trackCount=',count,'items=',items.length,'nextCursor=',Boolean(x?.data?.nextCursor??x?.nextCursor));}}
            const {r,x}=await j('/v1/feed?sort=latest&limit=100');if(r.ok){const items=getItems(x);const owned=items.filter(it=>ownerUid(it)===uid);console.log('[feed] total=',items.length,'soulforce=',owned.length,'publicFlags=',owned.map(it=>[it?.id||it?.trackId,it?.isPublic,it?.status]));}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
