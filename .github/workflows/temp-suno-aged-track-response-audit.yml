name: Temp Suno Aged Track Response Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-suno-aged-track-response-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Authenticate Firebase read-only audit
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Inspect aged track recovery stamps
        working-directory: functions
        env:
          FIREBASE_PROJECT_ID: soridraw-app-866a5
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/dev/null
          node <<'NODE'
          const admin=require('firebase-admin');
          if(!admin.apps.length) admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:process.env.FIREBASE_PROJECT_ID});
          const db=admin.firestore();
          const toMs=(v)=>{try{return v?.toMillis?.()||(typeof v==='number'?v:Date.parse(v||''))||0}catch{return 0}};
          const minutesAgo=(v)=>{const ms=toMs(v);return ms?Math.round((Date.now()-ms)/60000):null};
          const oldCutoff=Date.parse('2026-08-15T00:00:00Z');
          (async()=>{
            const master=await db.collection('users').where('staffRole','==','master').limit(1).get();
            if(master.empty) throw new Error('master user not found');
            const uid=master.docs[0].id;
            const snap=await db.collection('suno_tracks').doc(uid).collection('tracks').orderBy('createdAt','asc').limit(12).get();
            const aged=snap.docs.map(d=>({data:d.data()||{}}))
              .filter(x=>x.data.taskId&&toMs(x.data.createdAt)>0&&toMs(x.data.createdAt)<oldCutoff)
              .filter(x=>['completed','complete','success','succeeded','processing'].includes(String(x.data.status||'').toLowerCase()));
            console.log('AGED_ROWS='+aged.length);
            let i=0;
            for(const x of aged){
              i++; const d=x.data; const api=d.apiStatusResponse||{}; const apiData=api?.data||{}; const apiResp=apiData?.response||{};
              console.log(`TRACK_${i}_AGE_DAYS=${Math.floor((Date.now()-toMs(d.createdAt))/86400000)}`);
              console.log(`TRACK_${i}_UPDATED_MIN_AGO=${minutesAgo(d.updatedAt)}`);
              console.log(`TRACK_${i}_RECOVERY_ATTEMPT_MIN_AGO=${minutesAgo(d.lastAudioUrlRecoveryAttemptAt)}`);
              console.log(`TRACK_${i}_RECOVERED_MIN_AGO=${minutesAgo(d.lastAudioUrlRecoveredAt)}`);
              console.log(`TRACK_${i}_STATUS=${String(d.status||'')}`);
              console.log(`TRACK_${i}_VALIDATION=${String(d.audioValidationStatus||'')}`);
              console.log(`TRACK_${i}_VERIFIED_COUNT=${Array.isArray(d.audioUrls)?d.audioUrls.filter(Boolean).length:0}`);
              console.log(`TRACK_${i}_REPORTED_COUNT=${Array.isArray(d.reportedAudioUrls)?d.reportedAudioUrls.filter(Boolean).length:0}`);
              console.log(`TRACK_${i}_API_CODE=${String(api?.code??apiData?.code??'')}`);
              console.log(`TRACK_${i}_API_STATUS=${String(api?.status||apiData?.status||apiResp?.status||'')}`);
              const msg=String(api?.msg||api?.message||apiData?.msg||apiData?.message||'').replace(/https?:\/\/\S+/g,'[URL]').slice(0,120);
              console.log(`TRACK_${i}_API_MSG=${msg}`);
            }
            console.log('READ_MAX=13');
            console.log('WRITES=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
