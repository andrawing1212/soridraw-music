name: Apply SORIDRAW 31 to main once

on:
  push:
    branches:
      - main
    paths:
      - .deploy/apply-soridraw-31-trigger.txt

concurrency:
  group: apply-soridraw-31-main-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact 30-to-31 patch
        shell: bash
        run: |
          git apply --check .deploy/soridraw31.patch
          git apply .deploy/soridraw31.patch
          sha256sum src/firebase.js src/services/presenceService.ts src/pages/MyPage.tsx src/App.tsx src/pages/AdminUserManagementPage.tsx

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Commit SORIDRAW 31
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/firebase.js src/services/presenceService.ts src/pages/MyPage.tsx src/App.tsx src/pages/AdminUserManagementPage.tsx
          git commit -m "fix: deploy SORIDRAW 31 login presence cleanup"
          git push origin HEAD:main
