name: SORIDRAW Runtime Parity 028 CONTINUE TEST PRODUCTION

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-runtime-parity-028-release.yml'

permissions:
  contents: write

concurrency:
  group: soridraw-runtime-parity-028
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FEATURE_SHA: 32b1f7088a4bf4003c52c3a4884b6f5023af15bf
      EXPECTED_MAIN_BEFORE: c64b13248d4024338345c67091fea8ecdeb58e69
      FIREBASE_PROJECT: soridraw
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_MEDIA_URL: https://soridraw-media-preview.andrawing1212.workers.dev
      TEST_MEDIA_URL: https://soridraw-media-test.andrawing1212.workers.dev
      PROD_MEDIA_URL: https://soridraw-media.andrawing1212.workers.dev
      TEST_MEDIA_BUCKET: soridraw-media-test
      PROD_MEDIA_BUCKET: soridraw-media
    steps:
      - name: Checkout PREVIEW continuation control
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Guard exact validated 028 feature and unchanged MAIN
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FEATURE_SHA"
          changed="$(git diff --name-only "$FEATURE_SHA" HEAD)"
          test "$changed" = '.github/workflows/temp-runtime-parity-028-release.yml'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_BEFORE"
          node scripts/verify-runtime-environment-parity-028.mjs
          echo 'CONTINUATION_GUARD_028=PASS'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Revalidate exact feature app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/feature-028"
          git worktree add --detach "$RUNNER_TEMP/feature-028" "$FEATURE_SHA"
          cd "$RUNNER_TEMP/feature-028"
          npm ci
          npx tsc --noEmit
          npm run build
          sha256sum dist/index.html | awk '{print $1}' > "$RUNNER_TEMP/release-index.sha"
          node scripts/verify-runtime-environment-parity-028.mjs
          echo 'FEATURE_APP_028=PASS'

      - name: Verify live PREVIEW frontend and media runtime
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for origin in 'https://soridraw-preview.web.app' 'https://preview.soridraw.com'; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/" -o "$RUNNER_TEMP/preview-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/preview-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 5
            done
            test "$ok" = yes
            echo "PREVIEW_FRONTEND_PASS=$origin"
          done
          curl -fsS --max-time 30 "$PREVIEW_MEDIA_URL/health" -o "$RUNNER_TEMP/preview-media-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/preview-media-health.json"
          code="$(curl -sS -o /dev/null -D "$RUNNER_TEMP/preview-media-options.headers" -w '%{http_code}' -X OPTIONS -H 'Origin: https://preview.soridraw.com' -H 'Access-Control-Request-Method: GET' "$PREVIEW_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://preview.soridraw.com' "$RUNNER_TEMP/preview-media-options.headers"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: https://preview.soridraw.com' "$PREVIEW_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '401'
          echo 'PREVIEW_LIVE_028=PASS'

      - name: Create exact approved MAIN snapshot from PREVIEW feature
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_BEFORE"
          rm -rf "$RUNNER_TEMP/main-028"
          git worktree add --detach "$RUNNER_TEMP/main-028" origin/main
          cd "$RUNNER_TEMP/main-028"
          git read-tree --reset -u "$FEATURE_SHA"
          rm -rf .github/workflows
          git checkout origin/main -- .github/workflows
          git add -A
          if ! git diff --cached --quiet "$FEATURE_SHA" -- . ':(exclude).github/workflows/**'; then
            echo 'MAIN candidate differs from validated PREVIEW outside workflow controls:'
            git diff --cached --name-only "$FEATURE_SHA" -- . ':(exclude).github/workflows/**'
            exit 1
          fi
          git config user.name 'SORIDRAW Release Bot'
          git config user.email 'soridraw-release@users.noreply.github.com'
          git commit -m 'release: promote full PREVIEW runtime parity 028'
          MAIN_RELEASE_SHA="$(git rev-parse HEAD)"
          echo "MAIN_RELEASE_SHA=$MAIN_RELEASE_SHA" >> "$GITHUB_ENV"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_BEFORE"
          git push origin HEAD:main
          echo "MAIN_RELEASE_SHA=$MAIN_RELEASE_SHA"

      - name: Validate exact MAIN release source and build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028"
          node scripts/verify-runtime-environment-parity-028.mjs
          npm ci
          npx tsc --noEmit
          npm run build
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          actual="$(sha256sum dist/index.html | awk '{print $1}')"
          test "$actual" = "$expected"
          echo 'MAIN_APP_028=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate MAIN Functions and media Worker source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028"
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix functions run test:library-bundle
          npm --prefix functions run test:music-note-structure-sync
          cd cloudflare/media-worker
          npm install --no-audit --no-fund
          npm run check
          node scripts/test-catalog-journal-1053.mjs
          npx wrangler deploy --dry-run --env test --outdir .dry-run-test
          npx wrangler deploy --dry-run --env production --outdir .dry-run-production
          echo 'MAIN_BACKEND_SOURCE_028=PASS'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Ensure and deploy TEST media runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028/cloudflare/media-worker"
          if npx wrangler r2 bucket info "$TEST_MEDIA_BUCKET" --json > "$RUNNER_TEMP/test-r2.json" 2>/dev/null; then
            echo "R2_BUCKET_EXISTS=$TEST_MEDIA_BUCKET"
          else
            npx wrangler r2 bucket create "$TEST_MEDIA_BUCKET" --location apac --storage-class Standard
            npx wrangler r2 bucket info "$TEST_MEDIA_BUCKET" --json > "$RUNNER_TEMP/test-r2.json"
            echo "R2_BUCKET_CREATED=$TEST_MEDIA_BUCKET"
          fi
          npx wrangler deploy --env test
          npx wrangler secret list --env test --format json > "$RUNNER_TEMP/test-media-secrets.json" || printf '[]' > "$RUNNER_TEMP/test-media-secrets.json"
          if node - "$RUNNER_TEMP/test-media-secrets.json" <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          process.exit(Array.isArray(list)&&list.some((item)=>item?.name==='MEDIA_SIGNING_SECRET')?0:1);
          NODE
          then
            echo 'TEST_MEDIA_SECRET_EXISTS=true'
          else
            openssl rand -hex 32 | npx wrangler secret put MEDIA_SIGNING_SECRET --env test
            echo 'TEST_MEDIA_SECRET_CREATED=true'
          fi
          curl -fsS --max-time 30 "$TEST_MEDIA_URL/health" -o "$RUNNER_TEMP/test-media-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/test-media-health.json"
          code="$(curl -sS -o /dev/null -D "$RUNNER_TEMP/test-media-options.headers" -w '%{http_code}' -X OPTIONS -H 'Origin: https://test.soridraw.com' -H 'Access-Control-Request-Method: GET' "$TEST_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://test.soridraw.com' "$RUNNER_TEMP/test-media-options.headers"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: https://test.soridraw.com' "$TEST_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '401'
          echo 'TEST_MEDIA_028=PASS'

      - name: Deploy and verify Firebase TEST
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.hosting-test.json --non-interactive
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for origin in 'https://soridraw-test.web.app' 'https://test.soridraw.com'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/" -o "$RUNNER_TEMP/test-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/test-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 5
            done
            test "$ok" = yes
            echo "TEST_FRONTEND_PASS=$origin"
          done
          echo 'FIREBASE_TEST_028=PASS'

      - name: TEST full-stack parity gate before PRODUCTION
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://test.soridraw.com/' -o /dev/null
          curl -fsS --max-time 30 "$TEST_MEDIA_URL/health" -o "$RUNNER_TEMP/test-health-gate.json"
          grep -q '"ok":true' "$RUNNER_TEMP/test-health-gate.json"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://test.soridraw.com' -H 'Access-Control-Request-Method: GET' "$TEST_MEDIA_URL/v1/catalog/library")"
          test "$code" = '204'
          echo 'TEST_FULL_STACK_028=PASS'

      - name: Ensure and deploy PRODUCTION media runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028/cloudflare/media-worker"
          if npx wrangler r2 bucket info "$PROD_MEDIA_BUCKET" --json > "$RUNNER_TEMP/prod-r2.json" 2>/dev/null; then
            echo "R2_BUCKET_EXISTS=$PROD_MEDIA_BUCKET"
          else
            npx wrangler r2 bucket create "$PROD_MEDIA_BUCKET" --location apac --storage-class Standard
            npx wrangler r2 bucket info "$PROD_MEDIA_BUCKET" --json > "$RUNNER_TEMP/prod-r2.json"
            echo "R2_BUCKET_CREATED=$PROD_MEDIA_BUCKET"
          fi
          npx wrangler deploy --env production
          npx wrangler secret list --env production --format json > "$RUNNER_TEMP/prod-media-secrets.json" || printf '[]' > "$RUNNER_TEMP/prod-media-secrets.json"
          if node - "$RUNNER_TEMP/prod-media-secrets.json" <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          process.exit(Array.isArray(list)&&list.some((item)=>item?.name==='MEDIA_SIGNING_SECRET')?0:1);
          NODE
          then
            echo 'PROD_MEDIA_SECRET_EXISTS=true'
          else
            openssl rand -hex 32 | npx wrangler secret put MEDIA_SIGNING_SECRET --env production
            echo 'PROD_MEDIA_SECRET_CREATED=true'
          fi
          curl -fsS --max-time 30 "$PROD_MEDIA_URL/health" -o "$RUNNER_TEMP/prod-media-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/prod-media-health.json"
          code="$(curl -sS -o /dev/null -D "$RUNNER_TEMP/prod-media-options.headers" -w '%{http_code}' -X OPTIONS -H 'Origin: https://soridraw.com' -H 'Access-Control-Request-Method: GET' "$PROD_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://soridraw.com' "$RUNNER_TEMP/prod-media-options.headers"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: https://soridraw.com' "$PROD_MEDIA_URL/v1/catalog/musicNote")"
          test "$code" = '401'
          echo 'PRODUCTION_MEDIA_028=PASS'

      - name: Deploy and verify Firebase PRODUCTION
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028"
          npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.json --non-interactive
          expected="$(cat "$RUNNER_TEMP/release-index.sha")"
          for origin in 'https://soridraw.web.app' 'https://soridraw.com'; do
            ok=''
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$origin/" -o "$RUNNER_TEMP/prod-live.html"; then
                actual="$(sha256sum "$RUNNER_TEMP/prod-live.html" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then ok=yes; break; fi
              fi
              sleep 5
            done
            test "$ok" = yes
            echo "PRODUCTION_FRONTEND_PASS=$origin"
          done
          echo 'FIREBASE_PRODUCTION_028=PASS'

      - name: PRODUCTION full-stack verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://soridraw.com/' -o /dev/null
          curl -fsS --max-time 30 "$PROD_MEDIA_URL/health" -o "$RUNNER_TEMP/prod-health-gate.json"
          grep -q '"ok":true' "$RUNNER_TEMP/prod-health-gate.json"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://soridraw.com' -H 'Access-Control-Request-Method: GET' "$PROD_MEDIA_URL/v1/catalog/library")"
          test "$code" = '204'
          echo 'PRODUCTION_FULL_STACK_028=PASS'

      - name: Package exact TEST and PRODUCTION release ZIPs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-028"
          short="$(git rev-parse --short=8 HEAD)"
          git archive --format=zip --output="$RUNNER_TEMP/SORIDRAW_TEST_028_${short}.zip" HEAD
          cp "$RUNNER_TEMP/SORIDRAW_TEST_028_${short}.zip" "$RUNNER_TEMP/SORIDRAW_PRODUCTION_028_${short}.zip"
          sha256sum "$RUNNER_TEMP/SORIDRAW_TEST_028_${short}.zip"
          sha256sum "$RUNNER_TEMP/SORIDRAW_PRODUCTION_028_${short}.zip"
          echo 'RELEASE_ZIPS_028=PASS'

      - name: Upload TEST ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_TEST_028
          path: ${{ runner.temp }}/SORIDRAW_TEST_028_*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload PRODUCTION ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORIDRAW_PRODUCTION_028
          path: ${{ runner.temp }}/SORIDRAW_PRODUCTION_028_*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Final release result
        shell: bash
        run: |
          set -euo pipefail
          echo "FEATURE_SHA=$FEATURE_SHA"
          echo "MAIN_RELEASE_SHA=$MAIN_RELEASE_SHA"
          echo 'PREVIEW_RUNTIME_PARITY=PASS'
          echo 'TEST_RUNTIME_PARITY=PASS'
          echo 'PRODUCTION_RUNTIME_PARITY=PASS'
          echo 'SORIDRAW_RELEASE_028=PASS'
