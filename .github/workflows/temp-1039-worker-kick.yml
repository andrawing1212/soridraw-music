name: Temp 1039 Worker Kick

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-1039-worker-kick.yml'

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://soridraw-media-preview.andrawing1212.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V4 source
        run: |
          grep -q "const CATALOG_SCHEMA_VERSION = 4;" cloudflare/media-worker/src/index.js
          grep -q "catalog/v4/" cloudflare/media-worker/src/index.js
      - name: Install and deploy PREVIEW Worker
        working-directory: cloudflare/media-worker
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run deploy
      - name: Verify V4 health
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$WORKER_URL/health" -o "$RUNNER_TEMP/health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/health.json"
          grep -q '"r2Binding":true' "$RUNNER_TEMP/health.json"
          grep -q '"catalogSchemaVersion":4' "$RUNNER_TEMP/health.json"
          cat "$RUNNER_TEMP/health.json"
          echo 'WORKER_V4_DEPLOY=PASS'
