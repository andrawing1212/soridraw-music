name: TEMP 111 Profile Negative Cache Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-111-profile-negative-cache-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CANDIDATE_SHA: caf8b1ef93f9567d32eb1f4fa795bdd25f5cdc00
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Independent candidate audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          printf 'CANDIDATE_COMMIT_CHANGED=%s\n' "${changed[*]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'cloudflare/explore-worker/canonical/preview-worker.js'
          test "${changed[1]}" = 'cloudflare/explore-worker/canonical/source-sha256.txt'

          expected="$(tr -d '[:space:]' < cloudflare/explore-worker/canonical/source-sha256.txt)"
          actual="$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | awk '{print $1}')"
          test "$expected" = "$actual"
          node --check cloudflare/explore-worker/canonical/preview-worker.js
          node --check cloudflare/explore-worker/canonical/preview-entry.js
          node scripts/verify-111-explore-profile-negative-cache.mjs
          node scripts/verify-110-explore-liked-public-count.mjs
          node scripts/verify-108-explore-feed-cache-recovery.mjs
          node scripts/verify-105-explore-like-1min.mjs
          node scripts/verify-102-explore-public-like-parity.mjs
          echo 'INDEPENDENT_STATIC_AUDIT=PASS'

      - name: Confirm current live 404 shape before deployment
        shell: bash
        run: |
          set -euo pipefail
          bad="__soridraw_111_predeploy_shape_$(date +%s)__"
          code="$(curl -sS -D "$RUNNER_TEMP/invalid.head" -o "$RUNNER_TEMP/invalid.json" -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/profiles/${bad}/first-view?limit=50")"
          echo "LIVE_PREDEPLOY_INVALID_HTTP=$code"
          test "$code" = 404
          cat "$RUNNER_TEMP/invalid.json"
          code_name="$(jq -r '.error.code // .code // empty' "$RUNNER_TEMP/invalid.json")"
          echo "LIVE_PREDEPLOY_INVALID_CODE=${code_name:-missing}"
          test "$code_name" = 'NOT_FOUND'
          r="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-read:/{gsub("\r","");print $2}' "$RUNNER_TEMP/invalid.head" | tail -1)"
          w="$(awk 'BEGIN{IGNORECASE=1}/^x-soridraw-d1-write:/{gsub("\r","");print $2}' "$RUNNER_TEMP/invalid.head" | tail -1)"
          echo "LIVE_PREDEPLOY_INVALID_D1R=${r:-missing} D1W=${w:-missing}"
          test "${w:-0}" = 0
          echo 'LIVE_404_SHAPE_COMPATIBLE=PASS'
