name: Cloudflare Media R2 Preview Deploy

# app517: NEVER deploy a Worker merely because source was merged into preview.
# Only a manual dispatch, with a pinned SHA and explicit deploy confirmation.
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/cloudflare-media-r2-preview-deploy.yml'
      - 'scripts/media-color-release-preflight.mjs'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Approved 40-character commit SHA on preview (not a branch)'
        required: true
        type: string
      approve_preview_deploy:
        description: 'DEPLOY_PREVIEW_MEDIA (preview only) or DEPLOY_ALL_SHARED_MEDIA_WORKERS (three-worker coordinated release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-media-r2-preview-deploy
  cancel-in-progress: false

jobs:
  color-release-inputs:
    # Capture only the active code and binding identities; never user objects.
    # A push to this workflow is READ ONLY, not a deployment trigger.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check read-only capture boundaries
        run: node scripts/media-color-release-preflight.mjs --self-test
      - name: Capture three active Media Worker sources and binding identities
        run: node scripts/media-color-release-preflight.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: media-color-release-inputs
          path: .media-color-preflight/
          retention-days: 1
          include-hidden-files: true
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_preview_deploy == 'DEPLOY_PREVIEW_MEDIA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BUCKET: soridraw-media-preview
      CATALOG_BUCKET: soridraw-user-catalog
      WORKER_URL: https://soridraw-media-preview.andrawing1212.workers.dev
    steps:
      - name: Checkout explicitly approved commit (no moving preview HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify SHA is exact and reachable from preview
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Expected exact 40-character commit SHA'; exit 2; }
          test "$(git rev-parse HEAD)" = "${APPROVED_SHA,,}" || { echo 'Checkout SHA mismatch'; exit 2; }
          git fetch origin preview --no-tags --quiet
          git merge-base --is-ancestor "$APPROVED_SHA" FETCH_HEAD || { echo 'SHA not in preview'; exit 2; }
          echo "APPROVED_PREVIEW_SHA=$APPROVED_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install media Worker dependencies
        working-directory: cloudflare/media-worker
        run: npm install --no-audit --no-fund

      - name: Validate Worker build
        working-directory: cloudflare/media-worker
        run: npm run check

      - name: Preflight shared Catalog authority compatibility (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-356-shared-private-catalog-authority.mjs

      - name: Verify existing private R2 bindings (no bucket creation)
        working-directory: cloudflare/media-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN unavailable'; exit 2; }
          npx wrangler r2 bucket info "$BUCKET" --json > "$RUNNER_TEMP/r2-info.json"
          npx wrangler r2 bucket info "$CATALOG_BUCKET" --json > "$RUNNER_TEMP/catalog-r2-info.json"
          node - "$RUNNER_TEMP/r2-info.json" "$RUNNER_TEMP/catalog-r2-info.json" <<'NODE'
          const fs = require('fs');
          const media = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const catalog = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if ((media.name || media.result?.name) !== 'soridraw-media-preview'
              || (catalog.name || catalog.result?.name) !== 'soridraw-user-catalog') {
            throw new Error('Unexpected preview R2 buckets');
          }
          console.log('EXISTING_R2_BINDINGS=PASS');
          NODE

      - name: Verify existing media signing secret (no secret creation)
        working-directory: cloudflare/media-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > "$RUNNER_TEMP/media-secrets.json"
          node - "$RUNNER_TEMP/media-secrets.json" <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(list) || !list.some((item) => item?.name === 'MEDIA_SIGNING_SECRET')) {
            throw new Error('Required stable MEDIA_SIGNING_SECRET missing; fail closed');
          }
          console.log('EXISTING_MEDIA_SIGNING_SECRET=PASS');
          NODE

      - name: Deploy preview media Worker with R2 binding
        working-directory: cloudflare/media-worker
        run: npm run deploy

      - name: Smoke Worker health and Preview CORS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$WORKER_URL/health" -o "$RUNNER_TEMP/health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/health.json"
          grep -q '"r2Binding":true' "$RUNNER_TEMP/health.json"
          grep -q '"automaticWavGeneration":false' "$RUNNER_TEMP/health.json"
          grep -q '"catalogBinding":true' "$RUNNER_TEMP/health.json"
          shared_flag="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('cloudflare/media-worker/wrangler.jsonc','utf8'));process.stdout.write(String(c.vars.SORIDRAW_SHARED_CATALOG_V1||''))")"
          test "$shared_flag" = '0' -o "$shared_flag" = '1'
          expected_mode='legacy-media'
          [ "$shared_flag" = '1' ] && expected_mode='shared-catalog'
          grep -q "\"catalogAuthorityMode\":\"$expected_mode\"" "$RUNNER_TEMP/health.json"
          node scripts/verify-356-shared-private-catalog-authority.mjs

          code="$(curl -sS -o "$RUNNER_TEMP/options-body" -D "$RUNNER_TEMP/options-head" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://preview.soridraw.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
            "$WORKER_URL/v1/archive/resolve")"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://preview.soridraw.com' "$RUNNER_TEMP/options-head"
          echo 'MEDIA_WORKER_HEALTH_CORS=PASS'

      - name: Safety result
        run: |
          echo 'TARGET_ENV=PREVIEW'
          echo 'R2_BUCKET=soridraw-media-preview'
          echo 'CATALOG_R2_BUCKET=soridraw-user-catalog'
          echo 'R2_PUBLIC_BUCKET=false'
          shared_flag="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('cloudflare/media-worker/wrangler.jsonc','utf8'));process.stdout.write(String(c.vars.SORIDRAW_SHARED_CATALOG_V1||''))")"
          echo "CATALOG_SHARED_CUTOVER=$([ "$shared_flag" = '1' ] && echo true || echo false)"
          echo 'LAZY_ARCHIVE_MIN_AGE_DAYS=14'
          echo 'AUTOMATIC_WAV_GENERATION=false'
          echo 'NO_MUSIC_API_CALL=true'
          echo 'NO_FIRESTORE_WRITE=true'
          echo 'NO_FIREBASE_FUNCTIONS_DEPLOY=true'
          echo 'NO_FIREBASE_HOSTING_DEPLOY=true'
          echo 'NO_MAIN_CHANGE=true'
          echo 'NO_PRODUCTION_CHANGE=true'


  deploy-shared-color:
    if: ${{ github.ref == 'refs/heads/preview' && inputs.approve_preview_deploy == 'DEPLOY_ALL_SHARED_MEDIA_WORKERS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      APPROVED_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Pin approved preview source and refuse drift
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Enforce exact SHA and manual production authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$GITHUB_SHA" = "$APPROVED_SHA"
          git fetch origin preview --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_SHA"
          echo 'PINNED_SHARED_MEDIA_SOURCE=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Media Worker tooling
        working-directory: cloudflare/media-worker
        run: npm install --no-audit --no-fund
      - name: Verify exact color compatibility source, no cutover queue
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-library-catalog-color-projection.mjs
          node scripts/verify-356-shared-private-catalog-authority.mjs
          node - <<'NODE'
          const fs=require('fs');
          const worker=fs.readFileSync('cloudflare/media-worker/src/index.js','utf8');
          if (/catalogCutoverHoldEnabled|persistCatalogCutoverPending/.test(worker))
            throw Error('CUTOVER_QUEUE_MUST_REMAIN_DISCONNECTED');
          const cfg=JSON.parse(fs.readFileSync('cloudflare/media-worker/wrangler.jsonc','utf8'));
          for(const env of [cfg,cfg.env.test,cfg.env.production]){
            if(env.vars.SORIDRAW_SHARED_CATALOG_V1!=='1'
              ||env.vars.SORIDRAW_CATALOG_CUTOVER_HOLD_V1!==undefined
              ||env.r2_buckets.find(b=>b.binding==='CATALOG')?.bucket_name!=='soridraw-user-catalog')
              throw Error('SHARED_COLOR_DEPLOY_CONFIG_DRIFT');
          }
          console.log('THREE_WORKER_COLOR_CODE_ONLY=PASS');
          NODE

      - name: Capture exact existing 100 percent active versions and bindings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/media-color-release-preflight.mjs
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('.media-color-preflight/summary.json','utf8'));
          const expected={
            preview:'83175bcc-fe25-4d17-86c0-1592e47d358e',
            test:'f0a86688-5ffc-42ed-aecd-c01f8c17c636',
            production:'2c2e3236-d9a6-4771-b2ba-7baff496145c'
          };
          if(rows.length!==3||rows.some(row=>row.activeVersion!==expected[row.stage]))
            throw Error('ACTIVE_WORKER_VERSION_CHANGED_SINCE_DIRECTOR_EVIDENCE');
          console.log('LIVE_ALL_THREE_PINNED_VERSIONS=PASS');
          NODE

      - name: Dry run all three variant bundles before touching traffic
        shell: bash
        run: |
          set -euo pipefail
          for stage in preview test production; do
            node .deploy/release-media-worker-runtime.mjs "$stage" dry-run | tee "$RUNNER_TEMP/$stage-dry.log"
          done
          for stage in preview test production; do
            prefix="$(echo "$stage" | tr '[:lower:]' '[:upper:]')"
            value="$(sed -n "s/^${prefix}_MEDIA_WORKER_CODE_SHA256=//p" "$RUNNER_TEMP/$stage-dry.log" | tail -1)"
            test -n "$value"
            if [ "$stage" = preview ]; then common_code="$value"; else test "$common_code" = "$value"; fi
          done
          echo 'THREE_IDENTICAL_COMPILED_WORKER_CODES=PASS'

      - name: Upload three inactive versions and confirm no traffic changed
        shell: bash
        run: |
          set -euo pipefail
          for stage in preview test production; do
            prefix="$(echo "$stage" | tr '[:lower:]' '[:upper:]')"
            node .deploy/release-media-worker-runtime.mjs "$stage" upload | tee "$RUNNER_TEMP/$stage-upload.log"
            before="$(sed -n "s/^${prefix}_MEDIA_WORKER_BEFORE=//p" "$RUNNER_TEMP/$stage-upload.log" | tail -1)"
            uploaded="$(sed -n "s/^${prefix}_MEDIA_WORKER_UPLOADED_VERSION=//p" "$RUNNER_TEMP/$stage-upload.log" | tail -1)"
            test -n "$before" && test -n "$uploaded" && test "$before" != "$uploaded"
            echo "$prefix""_BEFORE=$before" >> "$GITHUB_ENV"
            echo "$prefix""_UPLOADED=$uploaded" >> "$GITHUB_ENV"
          done
          echo 'SHARED_MEDIA_UPLOADS_INACTIVE=PASS'

      - name: Activate all three in sequence with automatic global emergency restore
        shell: bash
        run: |
          set -euo pipefail
          restore_all() {
            set +e
            failed=0
            # Emergency availability rollback only: legacy versions are NOT
            # color-safe; release remains FAILED and needs operator follow-up.
            for stage in production test preview; do
              case "$stage" in
                preview) old="$PREVIEW_BEFORE";;
                test) old="$TEST_BEFORE";;
                production) old="$PRODUCTION_BEFORE";;
              esac
              RELEASE_MEDIA_WORKER_VERSION="$old" node .deploy/release-media-worker-runtime.mjs "$stage" restore || failed=1
            done
            if [ "$failed" -ne 0 ]; then echo 'GLOBAL_EMERGENCY_RESTORE=FAILED'; fi
            return "$failed"
          }
          on_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then restore_all || true; fi
            exit "$status"
          }
          trap on_exit EXIT
          for stage in preview test production; do
            case "$stage" in
              preview) new="$PREVIEW_UPLOADED";;
              test) new="$TEST_UPLOADED";;
              production) new="$PRODUCTION_UPLOADED";;
            esac
            RELEASE_MEDIA_WORKER_VERSION="$new" node .deploy/release-media-worker-runtime.mjs "$stage" activate
          done
          for stage in preview test production; do
            node .deploy/release-media-worker-runtime.mjs "$stage" verify
          done
          trap - EXIT
          echo 'THREE_SHARED_COLOR_COMPAT_WORKERS_ACTIVE=PASS'
          echo 'NO_BULK_R2_D1_FIRESTORE_USER_DATA_OPERATION=PASS'
