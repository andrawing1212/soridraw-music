name: SORIDRAW 994 Rescue Endpoint Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-suno-wav-rescue-994-endpoint-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare Firebase and Cloud Run endpoints
        shell: bash
        run: |
          set -u
          for url in \
            'https://us-central1-soridraw-app-866a5.cloudfunctions.net/rescueSunoTrackAudio' \
            'https://rescuesunotrackaudio-kg5gftakjq-uc.a.run.app'; do
            status="$(curl -sS -o /tmp/body.txt -w '%{http_code}' -X OPTIONS \
              -H 'Origin: https://preview.soridraw.com' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
              "$url" || true)"
            echo "[994 endpoint] OPTIONS $url -> $status"
            head -c 240 /tmp/body.txt || true; echo
          done

      - name: Authenticate to Firebase backend project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Read real rescue request evidence from user test window
        shell: bash
        run: |
          set -euo pipefail
          for service in rescuesunotrackaudio getsunotrackstatus; do
            gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${service}\" AND timestamp>=\"2026-08-31T23:00:00Z\"" \
              --project=soridraw-app-866a5 \
              --limit=200 \
              --order=desc \
              --format=json > "/tmp/${service}.json"

            python3 - "/tmp/${service}.json" "$service" <<'PY'
          import json, sys
          path, service = sys.argv[1:3]
          rows = json.load(open(path, encoding='utf-8'))
          print(f'[994 live] service={service} rows={len(rows)}')
          for row in rows:
              ts = row.get('timestamp', '')
              http = row.get('httpRequest') or {}
              if http:
                  print(f"[994 live][request] {service} {ts} method={http.get('requestMethod')} status={http.get('status')} latency={http.get('latency','')}")
              text = row.get('textPayload') or ''
              if text:
                  print(f'[994 live][text] {service} {ts} {text[:900]}')
              js = row.get('jsonPayload') or {}
              if isinstance(js, dict):
                  msg = js.get('message') or js.get('msg') or ''
                  if msg:
                      print(f'[994 live][json] {service} {ts} {str(msg)[:900]}')
          PY
          done

      - name: Result
        run: echo '[994 live] Read-only diagnostic complete; no app/data/backend mutation performed.'
