name: Finalize master permissions 35

on:
  push:
    branches: [main]
    paths:
      - .deploy/finalize-master-permissions-35-trigger.txt

concurrency:
  group: finalize-master-permissions-35
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply approved 35th source patch
        shell: bash
        run: |
          base64 -d .deploy/master35-core.patch.gz.b64 | gzip -d > /tmp/master35.patch
          git apply --check /tmp/master35.patch
          git apply /tmp/master35.patch

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Verify approved web and Functions source
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          npm ci --prefix functions --no-audit --no-fund
          npm --prefix functions run build
          cp functions/src/index.ts /tmp/master35-functions-index-clean.ts

      - name: Inject temporary one-time master bootstrap Function
        shell: bash
        run: |
          BOOTSTRAP_TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$BOOTSTRAP_TOKEN" > /tmp/master35-bootstrap-token
          export BOOTSTRAP_TOKEN
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ['BOOTSTRAP_TOKEN']
          path = Path('functions/src/index.ts')
          with path.open('a', encoding='utf-8') as handle:
              handle.write(f'''\n\nexport const bootstrapRepresentativeMasterOnce = onRequest(\n  {{ region: "us-central1" }},\n  async (req, res) => {{\n    if (req.method !== "POST" || req.get("x-soridraw-bootstrap-token") !== {json.dumps(token)}) {{\n      res.status(403).json({{ ok: false }});\n      return;\n    }}\n    try {{\n      const authUser = await admin.auth().getUserByEmail("andrawing1212@gmail.com");\n      const permissions = {{ ...FULL_ADMIN_PERMISSIONS }};\n      const ref = admin.firestore().collection("users").doc(authUser.uid);\n      await ref.set({{\n        role: "admin",\n        staffRole: "master",\n        adminPermissions: permissions,\n        staffRoleUpdatedAt: admin.firestore.FieldValue.serverTimestamp(),\n        staffRoleUpdatedBy: authUser.uid,\n        masterBootstrapSource: "temporary-one-time-function",\n      }}, {{ merge: true }});\n      const snapshot = await ref.get();\n      const data = snapshot.data() || {{}};\n      const verified = data.role === "admin"\n        && data.staffRole === "master"\n        && Object.entries(permissions).every(([key, value]) => data.adminPermissions?.[key] === value);\n      if (!verified) throw new Error("MASTER_BOOTSTRAP_VERIFY_FAILED");\n      res.status(200).json({{ ok: true, uid: authUser.uid }});\n    }} catch (error: any) {{\n      console.error(error);\n      res.status(500).json({{ ok: false, error: error?.message || String(error) }});\n    }}\n  }}\n);\n''')
          PY
          npm --prefix functions run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Deploy invoke and delete temporary bootstrap Function
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            npx --yes firebase-tools@latest functions:delete bootstrapRepresentativeMasterOnce \
              --region us-central1 \
              --project soridraw-app-866a5 \
              --force || true
          }
          trap cleanup EXIT

          npx --yes firebase-tools@latest deploy \
            --only functions:bootstrapRepresentativeMasterOnce \
            --project soridraw-app-866a5 \
            --non-interactive

          TOKEN="$(cat /tmp/master35-bootstrap-token)"
          RESPONSE_FILE=/tmp/master35-bootstrap-response.json
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST \
            -H "x-soridraw-bootstrap-token: $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            'https://us-central1-soridraw-app-866a5.cloudfunctions.net/bootstrapRepresentativeMasterOnce')"

          if [ "$HTTP_CODE" != "200" ]; then
            cat "$RESPONSE_FILE"
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/master35-bootstrap-response.json', 'utf8'));
          if (!payload.ok || !payload.uid) {
            throw new Error(`MASTER_BOOTSTRAP_RESPONSE_INVALID: ${JSON.stringify(payload)}`);
          }
          console.log(`MASTER_BOOTSTRAP_SUCCESS uid=${payload.uid}`);
          NODE

          cleanup
          trap - EXIT
          cp /tmp/master35-functions-index-clean.ts functions/src/index.ts
          npm --prefix functions run build

      - name: Commit approved source and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            firestore.rules \
            functions/src/index.ts \
            src/App.tsx \
            src/components/AdminPageLayout.tsx \
            src/constants/adminPermissions.ts \
            src/pages/AdminSectionTagsPage.tsx \
            src/pages/AdminUserManagementPage.tsx \
            src/pages/AdminVocalTonesPage.tsx \
            src/pages/MasterPermissionsPage.tsx \
            src/types.ts

          rm -f .github/workflows/*master35*.yml
          rm -f .github/workflows/finalize-master-permissions-35.yml
          rm -f .deploy/*master35*
          rm -f .deploy/finalize-master-permissions-35-trigger.txt
          git add -A .github/workflows .deploy

          git commit -m "feat: add master and page-level admin permissions"
          git push origin HEAD:main
