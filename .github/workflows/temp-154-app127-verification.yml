name: TEMP 154 App127 Personal Like Verification
# rerun after fixing test syntax
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-154-app127-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: App127 and older liked/public count guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-127-atomic-personal-like.mjs
          node scripts/verify-126-explore-entry-like-count.mjs
          node scripts/verify-125-like-preservation.mjs
          node scripts/verify-124-mobile-shared-cache-repair.mjs
          node scripts/verify-123-shared-like-cache-repair.mjs
          node scripts/verify-110-explore-liked-public-count.mjs
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Worker release boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum cloudflare/explore-worker/canonical/preview-worker.js | cut -d' ' -f1)" = b170d05385c3096a98033675a9acbb63b40148bf782017c326845b7ea4c17813
          echo 'WORKER071_UNCHANGED=PASS'
          echo 'VERIFY_ONLY=PASS NO_DEPLOY=TRUE DATA_WRITE=0'
