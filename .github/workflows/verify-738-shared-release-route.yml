name: APP738 release route split offline only
on:
  pull_request:
    branches: [main]
    paths:
      - '.deploy/app738-shared-rtdb-rules.candidate.yml'
      - 'scripts/app738-shared-release-route.mjs'
      - 'scripts/verify-738-shared-release-route.mjs'
      - '.github/workflows/verify-738-shared-release-route.yml'
      - '.github/workflows/app738-preview-artifact.yml'
      - '.github/workflows/app738-hosting-writer.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: |
          node --check scripts/app738-shared-release-route.mjs
          node scripts/verify-738-shared-release-route.mjs
