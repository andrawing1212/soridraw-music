name: SORIDRAW Maintenance M-009 Prebuild Diagnostic

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/maintenance-m009-prebuild-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Capture exact Preview source state and 901 semantics
        shell: bash
        run: |
          set -euo pipefail
          echo "M009_HEAD=$(git rev-parse HEAD)"
          echo 'M009_PACKAGE_SCRIPTS_BEGIN'
          node -e "const p=require('./package.json'); console.log(JSON.stringify({prebuild:p.scripts?.prebuild,build:p.scripts?.build},null,2))"
          echo 'M009_PACKAGE_SCRIPTS_END'
          echo 'M009_901_INVOCATIONS_BEGIN'
          grep -RFn --include='*' 'apply-901-music-note-10-incremental-sync.py' .deploy package.json || true
          echo 'M009_901_INVOCATIONS_END'
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(encoding='utf-8')
          fb=Path('src/firebase.js').read_text(encoding='utf-8')
          checks={
            'marker901': 'SORIDRAW_901_MUSIC_NOTE_10_INCREMENTAL_SYNC' in app,
            'page_size_10': 'MUSIC_NOTE_PAGE_SIZE = 10' in app,
            'cache_ttl': 'MUSIC_NOTE_CACHE_TTL_MS' in app,
            'music_note_cache': 'musicNoteCache' in app,
            'next_cursor': 'musicNotesNextCursor' in app,
            'has_more': 'musicNotesHasMore' in app,
            'fresh_page': 'fetchFreshMusicNotePage' in app,
            'load_more': 'loadMoreMusicNoteFavorites' in app,
            'favorites_sync_version': "incrementUserSyncVersion(user.uid, 'favorites')" in app,
            'sync_versions_favorites': 'syncVersions.favorites' in app,
            'firebase_query_page': 'getDocumentsByQueryPage' in fb,
            'v1_mutation_boundary': 'runV1MutationBoundary' in app,
            'updated_at_ms_occurrences': app.count('updatedAtMs'),
          }
          import json
          print('M009_901_SEMANTICS='+json.dumps(checks,sort_keys=True))
          needle="await updateDoc(doc(db, 'favorites', id),"
          pos=app.find(needle)
          print('M009_NORMAL_UPDATE_NEEDLE_POS='+str(pos))
          if pos >= 0:
              lo=max(0,pos-1000); hi=min(len(app),pos+2200)
              print('M009_NORMAL_UPDATE_CONTEXT_BEGIN')
              print(app[lo:hi])
              print('M009_NORMAL_UPDATE_CONTEXT_END')
          print('M009_APP_MARKER_COUNT='+str(app.count('SORIDRAW_901_MUSIC_NOTE_10_INCREMENTAL_SYNC')))
          PY
          sha256sum src/App.tsx src/firebase.js > /tmp/m009-before.sha256
          git status --short

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Execute real prebuild path in disposable workspace
        shell: bash
        run: |
          set +e
          npm run prebuild > /tmp/m009-prebuild.log 2>&1
          code=$?
          set -e
          echo "M009_PREBUILD_EXIT=${code}"
          echo 'M009_PREBUILD_LOG_TAIL_BEGIN'
          tail -n 160 /tmp/m009-prebuild.log
          echo 'M009_PREBUILD_LOG_TAIL_END'
          echo 'M009_TRACKED_DIFF_BEGIN'
          git status --short
          git diff --stat
          git diff --name-only
          echo 'M009_TRACKED_DIFF_END'
          echo 'M009_HASH_AFTER_BEGIN'
          sha256sum src/App.tsx src/firebase.js
          echo 'M009_HASH_AFTER_END'
          if [ "$code" -eq 0 ]; then
            echo 'M009_PREBUILD_UNEXPECTEDLY_GREEN=true'
          fi

      - name: Prove disposable diagnostic made no repository/Firebase change
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'M009_FIREBASE_DATA_READS=0'
          echo 'M009_FIREBASE_DATA_WRITES=0'
          echo 'M009_FIREBASE_DATA_DELETES=0'
          echo 'M009_RULES_DEPLOYS=0'
          echo 'M009_FUNCTIONS_DEPLOYS=0'
          echo 'M009_HOSTING_DEPLOYS=0'
