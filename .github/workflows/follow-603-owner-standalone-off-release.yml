name: SORIDRAW APP603 Standalone Owner Worker OFF One-shot Release
on:
  push:
    branches: [feat/app600-owner-standalone-isolated]
    paths:
      - 'scripts/verify-603-standalone-off-release.mjs'
      - '.github/workflows/follow-603-owner-standalone-off-release.yml'
      - '.deploy/owner-follow-603-off-release.trigger'
permissions:
  contents: read
concurrency:
  group: soridraw-app603-first-deploy-off-only
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline safety gate and syntax
        run: |
          set -euo pipefail
          node --check scripts/verify-603-standalone-off-release.mjs
          node --check cloudflare/owner-follow-worker/worker.mjs
          node scripts/verify-603-standalone-off-release.mjs --self-test
  release:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One-use approval trigger and immutable parent verification
        id: gate
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [ "$changed" != '.deploy/owner-follow-603-off-release.trigger' ]; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo 'APP603_OFF_DEPLOY_NO_TRIGGER=PASS'
            exit 0
          fi
          test -f .deploy/owner-follow-603-off-release.trigger
          parent="$(git rev-parse HEAD^)"
          printf 'approved_source_commit=%s\n' "$parent" | cmp -s - .deploy/owner-follow-603-off-release.trigger
          test "$(git ls-remote origin refs/heads/preview | cut -f1)" = '028e51a2d52b50e1f021dd6d689268518077c2e1'
          echo "approved_parent=$parent" >> "$GITHUB_OUTPUT"
          echo 'release=true' >> "$GITHUB_OUTPUT"
          echo 'APP603_ONE_SHOT_TRIGGER_PARENT_AND_PREVIEW_FROZEN=PASS'
      - name: Bundle source-only candidate without any Cloudflare writes
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          npm --prefix cloudflare/explore-worker install --ignore-scripts --no-audit --no-fund --package-lock=false
          mkdir -p "$RUNNER_TEMP/app603-off-dry-run"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            ./cloudflare/explore-worker/node_modules/.bin/wrangler deploy \
            --config cloudflare/owner-follow-worker/wrangler.candidate.jsonc \
            --dry-run --outdir "$RUNNER_TEMP/app603-off-dry-run"
          echo 'APP603_WRANGLER_LOCAL_DRY_RUN=PASS'
      - name: Confirm no existing Worker collision and pin Explore release (Cloudflare GET only)
        if: steps.gate.outputs.release == 'true'
        env:
          APP603_APPROVED_PARENT: ${{ steps.gate.outputs.approved_parent }}
        run: |
          set -euo pipefail
          node scripts/verify-603-standalone-off-release.mjs --preflight
      - name: First deploy isolated OFF Worker only (never Explore/TEST/PRODUCTION)
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          ./cloudflare/explore-worker/node_modules/.bin/wrangler deploy \
            --config cloudflare/owner-follow-worker/wrangler.candidate.jsonc
          echo 'APP603_STANDALONE_OFF_WORKER_DEPLOY_COMMAND_RETURNED_SUCCESS'
      - name: Read-only verify new OFF version, namespace and existing Explore unchanged
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          node scripts/verify-603-standalone-off-release.mjs --postflight
          echo 'APP603_EXISTING_EXPLORE_DEPLOY_OR_BINDING_WRITE=ZERO'
          echo 'APP603_SHARED_D1_R2_FIREBASE_AND_USER_DATA_WRITE=ZERO'
