name: Firebase Hosting Main Test Canary

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - 'firebase.hosting-test.json'
      - '.github/workflows/firebase-hosting-main-test-canary.yml'

permissions:
  contents: read

concurrency:
  group: firebase-hosting-main-test-canary
  cancel-in-progress: true

jobs:
  deploy-main-to-firebase-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BACKEND_PROJECT: soridraw-app-866a5
      HOSTING_PROJECT: soridraw
      TEST_SITE: soridraw-test
      TEST_WEB_HOST: soridraw-test.web.app
      TEST_FIREBASE_HOST: soridraw-test.firebaseapp.com
      APP_CHECK_SITE_KEY: 6Le6bGEtAAAAAOVROhuXew0lxJcpVNVwPZN0ZWKO

    steps:
      - name: Checkout hosting migration infra from preview
        uses: actions/checkout@v4
        with:
          ref: preview
          path: infra

      - name: Checkout current Vercel test source from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply only Firebase-test-host compatibility in runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          firebase_path = Path('app/src/firebase.js')
          source = firebase_path.read_text(encoding='utf-8')
          old = 'const isVercelTestApp = currentHostname === "soridraw-music.vercel.app";\nconst isFirebaseHostedApp = currentHostname === "soridraw.web.app"'
          new = 'const isVercelTestApp = currentHostname === "soridraw-music.vercel.app";\nconst isFirebaseTestApp = currentHostname === "soridraw-test.web.app"\n  || currentHostname === "soridraw-test.firebaseapp.com";\nconst isFirebaseHostedApp = currentHostname === "soridraw.web.app"'
          if old not in source:
              raise SystemExit('firebase.js hosting anchor changed; refusing broad patch')
          source = source.replace(old, new, 1)
          old2 = 'const shouldInitializeAppCheck = isAiStudioPreview || isVercelTestApp || isFirebaseHostedApp;'
          new2 = 'const shouldInitializeAppCheck = isAiStudioPreview || isVercelTestApp || isFirebaseTestApp || isFirebaseHostedApp;'
          if old2 not in source:
              raise SystemExit('firebase.js App Check anchor changed; refusing broad patch')
          source = source.replace(old2, new2, 1)
          firebase_path.write_text(source, encoding='utf-8')

          email_path = Path('app/src/constants/emailVerification.ts')
          email = email_path.read_text(encoding='utf-8')
          anchor = "  'https://soridraw-music-git-preview-andrawing1212.vercel.app',\n"
          replacement = anchor + "  'https://soridraw-test.web.app',\n  'https://soridraw-test.firebaseapp.com',\n"
          if anchor not in email:
              raise SystemExit('emailVerification.ts hosting anchor changed; refusing broad patch')
          email = email.replace(anchor, replacement, 1)
          email_path.write_text(email, encoding='utf-8')
          PY

          cp infra/firebase.hosting-test.json app/firebase.hosting-test.json

          cd app
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/constants/emailVerification.ts\nsrc/firebase.js' || {
            echo 'Unexpected main-source changes in hosting canary workspace.'
            exit 3
          }
          git diff --check
          if git diff -- src/firebase.js src/constants/emailVerification.ts | grep -E '^[-+].*(favorites|library|firestore|query\(|getDocs|onSnapshot|limit\(|startAfter|orderBy)' >/dev/null; then
            echo 'Data-read logic token detected in hosting-only patch. Refusing deploy.'
            exit 4
          fi
          echo '[Hosting Test Canary] Main source frozen; only new Firebase test host recognition added in runner.'

      - name: Install current main dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Record existing main TypeScript debt without changing app code
        working-directory: app
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build current main exactly through its existing Vite path
        working-directory: app
        run: npm run build

      - name: Authenticate Google and Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SORIDRAW }}

      - name: Mint direct Google OAuth token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const credentialPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          if (!credentialPath) throw new Error('GOOGLE_APPLICATION_CREDENTIALS is missing');
          const serviceAccount = JSON.parse(fs.readFileSync(credentialPath, 'utf8'));
          const base64url = (input) => Buffer.from(input).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = base64url(JSON.stringify({
            iss: serviceAccount.client_email,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          }));
          const unsigned = `${header}.${payload}`;
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), serviceAccount.private_key).toString('base64url');
          const assertion = `${unsigned}.${signature}`;
          (async () => {
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth-grant-type:jwt-bearer',
                assertion,
              }),
            });
            const body = await response.json();
            if (!response.ok || !body.access_token) {
              throw new Error(`OAuth token exchange failed: HTTP ${response.status} ${JSON.stringify(body)}`);
            }
            console.log(`::add-mask::${body.access_token}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `ACCESS_TOKEN=${body.access_token}\n`);
            console.log('[Hosting Test Canary] Direct OAuth token: PASS');
          })().catch((error) => {
            console.error(error?.message || error);
            process.exit(1);
          });
          NODE

      - name: Snapshot Vercel test and official Firebase production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw-music.vercel.app/ -o "$RUNNER_TEMP/vercel-test.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/vercel-test.html"
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-before.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-before.html"
          sha256sum "$RUNNER_TEMP/production-before.html" | awk '{print $1}' > "$RUNNER_TEMP/production-before.sha"
          echo '[Hosting Test Canary] Existing Vercel test and Firebase production are reachable.'

      - name: Create isolated Firebase test Hosting site only if absent
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest hosting:sites:list --project "$HOSTING_PROJECT" --json > "$RUNNER_TEMP/firebase-sites.json"
          node - "$RUNNER_TEMP/firebase-sites.json" "$TEST_SITE" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const wanted = process.argv[3];
          const possible = [payload?.result?.sites, payload?.result, payload?.sites, payload];
          const sites = possible.find(Array.isArray) || [];
          const ids = sites.map((site) => {
            const raw = String(site?.site || site?.siteId || site?.id || site?.name || '');
            return raw.includes('/') ? raw.split('/').filter(Boolean).pop() : raw;
          }).filter(Boolean);
          console.log(`[Hosting Test Canary] Existing Hosting sites: ${ids.join(',') || '(none)'}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `TEST_SITE_EXISTS=${ids.includes(wanted) ? 'yes' : 'no'}\n`);
          if (!ids.includes('soridraw')) throw new Error('Official production Hosting site soridraw is missing; aborting.');
          NODE

          if [ "$TEST_SITE_EXISTS" != 'yes' ]; then
            npx --yes firebase-tools@latest hosting:sites:create "$TEST_SITE" --project "$HOSTING_PROJECT" --non-interactive
            echo '[Hosting Test Canary] Created isolated Firebase test Hosting site.'
          else
            echo '[Hosting Test Canary] Reusing existing isolated Firebase test Hosting site.'
          fi

      - name: Deploy current main build to Firebase test site only
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$HOSTING_PROJECT" \
            --config firebase.hosting-test.json \
            --non-interactive
          echo '[Hosting Test Canary] Firebase test Hosting deploy: PASS'

      - name: Add Firebase test hosts to Auth authorized domains
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$BACKEND_PROJECT/config" \
            -o "$RUNNER_TEMP/auth-config-before.json"

          python3 - "$RUNNER_TEMP/auth-config-before.json" "$RUNNER_TEMP/auth-domain-patch.json" "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" <<'PY'
          import json, sys
          source, target, *wanted = sys.argv[1:]
          data = json.load(open(source, encoding='utf-8'))
          domains = list(dict.fromkeys([str(v).strip() for v in data.get('authorizedDomains', []) if str(v).strip()] + wanted))
          with open(target, 'w', encoding='utf-8') as f:
              json.dump({'authorizedDomains': domains}, f, ensure_ascii=False)
          print(f'[Hosting Test Canary] Auth domains staged: {wanted}')
          PY

          curl -fsS -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/auth-domain-patch.json" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$BACKEND_PROJECT/config?updateMask=authorizedDomains" \
            -o "$RUNNER_TEMP/auth-config-after.json"

          python3 - "$RUNNER_TEMP/auth-config-after.json" "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          wanted = set(sys.argv[2:])
          domains = set(data.get('authorizedDomains', []))
          missing = sorted(wanted - domains)
          if missing:
              raise SystemExit(f'Firebase Auth test domains missing: {missing}')
          print('[Hosting Test Canary] Firebase Auth test domains: PASS')
          PY

      - name: Extend App Check reCAPTCHA domains when permitted
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/recaptcha-before.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://recaptchaenterprise.googleapis.com/v1/projects/$BACKEND_PROJECT/keys/$APP_CHECK_SITE_KEY")"

          if [ "$status" = '403' ]; then
            echo 'RECAPTCHA_POLICY_STATUS=permission-gated' >> "$GITHUB_ENV"
            echo '[Hosting Test Canary] reCAPTCHA policy permission-gated; no IAM widening performed.'
            exit 0
          fi
          test "$status" = '200' || { echo "reCAPTCHA key read HTTP $status"; cat "$RUNNER_TEMP/recaptcha-before.json"; exit 6; }

          python3 - "$RUNNER_TEMP/recaptcha-before.json" "$RUNNER_TEMP/recaptcha-patch.json" "$TEST_WEB_HOST" "$TEST_FIREBASE_HOST" <<'PY'
          import json, sys
          source, target, *wanted = sys.argv[1:]
          data = json.load(open(source, encoding='utf-8'))
          web = data.get('webSettings') or {}
          if web.get('allowAllDomains') is True:
              open(target, 'w', encoding='utf-8').write('')
              print('[Hosting Test Canary] reCAPTCHA allows all domains; patch not needed.')
              raise SystemExit(0)
          domains = list(dict.fromkeys([str(v).strip() for v in web.get('allowedDomains', []) if str(v).strip()] + wanted))
          with open(target, 'w', encoding='utf-8') as f:
              json.dump({'name': data.get('name'), 'webSettings': {'allowedDomains': domains}}, f, ensure_ascii=False)
          print(f'[Hosting Test Canary] reCAPTCHA domains staged: {wanted}')
          PY
          echo 'RECAPTCHA_POLICY_STATUS=readable' >> "$GITHUB_ENV"

          if [ -s "$RUNNER_TEMP/recaptcha-patch.json" ]; then
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/recaptcha-patch.json" \
              "https://recaptchaenterprise.googleapis.com/v1/projects/$BACKEND_PROJECT/keys/$APP_CHECK_SITE_KEY?updateMask=webSettings.allowedDomains" \
              -o "$RUNNER_TEMP/recaptcha-after.json"
            echo '[Hosting Test Canary] reCAPTCHA Enterprise test domains: PASS'
          fi

      - name: Smoke test Firebase test site
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://$TEST_WEB_HOST/" "https://$TEST_FIREBASE_HOST/"; do
            ok=''
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 30 "$url" -o "$RUNNER_TEMP/test-smoke.html" && grep -q '<div id="root"></div>' "$RUNNER_TEMP/test-smoke.html"; then
                ok='yes'
                echo "[Hosting Test Canary] Smoke PASS: $url"
                break
              fi
              sleep 10
            done
            test "$ok" = 'yes' || { echo "Firebase test smoke failed: $url"; exit 7; }
          done

      - name: Check shared backend boundaries from Firebase test origin
        shell: bash
        run: |
          set -euo pipefail
          function_status="$(curl -sS -o "$RUNNER_TEMP/function-cors.txt" -w '%{http_code}' -X OPTIONS \
            -H "Origin: https://$TEST_WEB_HOST" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck' \
            'https://us-central1-soridraw-app-866a5.cloudfunctions.net/getSunoApiKeyStatus' || true)"
          echo "[Hosting Test Canary] Functions CORS preflight HTTP: ${function_status:-network-error}"
          case "$function_status" in 200|204) ;; *) echo 'Functions CORS boundary is not ready for Firebase test origin.'; exit 8;; esac

          explore_status="$(curl -sS -o "$RUNNER_TEMP/explore-cors.txt" -w '%{http_code}' \
            -H "Origin: https://$TEST_WEB_HOST" \
            'https://soridraw-explore-api.andrawing1212.workers.dev/v1/feed?sort=latest&limit=1' || true)"
          echo "[Hosting Test Canary] Explore feed HTTP: ${explore_status:-network-error}"
          case "$explore_status" in 200) ;; *) echo 'Explore boundary is not ready for Firebase test origin.'; exit 9;; esac

      - name: Verify official Firebase production stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://soridraw.web.app/ -o "$RUNNER_TEMP/production-after.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/production-after.html"
          sha256sum "$RUNNER_TEMP/production-after.html" | awk '{print $1}' > "$RUNNER_TEMP/production-after.sha"
          cmp "$RUNNER_TEMP/production-before.sha" "$RUNNER_TEMP/production-after.sha"
          echo '[Hosting Test Canary] Official Firebase production unchanged: PASS'

      - name: Canary result
        run: |
          echo 'Firebase Hosting test canary completed.'
          echo 'Source baseline: current main (Vercel test app)'
          echo "Firebase test URL: https://$TEST_WEB_HOST/"
          echo "Backend remains: $BACKEND_PROJECT"
          echo "App Check policy inspection: ${RECAPTCHA_POLICY_STATUS:-not-run}"
          echo 'No Firestore/RTDB data migration, Rules deploy, Functions deploy, production Hosting release, or main-branch commit was performed.'
