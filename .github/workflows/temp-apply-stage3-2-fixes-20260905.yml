name: SORIDRAW Apply Stage3.2 Cost Cache Fixes 2026-09-05
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-apply-stage3-2-fixes-20260905.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e1a30fc9ef497fda1d34f4ab3dc1da45
      PREVIEW_WORKER: soridraw-explore-preview
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview, fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Apply frontend cache fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .deploy/apply-1020-refresh-zero-profile-swr.py
          grep -Fq 'SORIDRAW_ROOT_USER_REFRESH_ZERO_1020' src/App.tsx
          grep -Fq 'SORIDRAW_USER_PROFILE_REFRESH_ZERO_1020' src/lib/userProfileCache.ts
          grep -Fq 'SORIDRAW_PROFILE_CACHE_SWR_1020' src/services/exploreProfileFirstViewService.ts
          grep -Fq 'USER_PROFILE_SERVER_REVERIFY_MS = 5 * 60 * 1000' src/App.tsx
          grep -Fq 'PROFILE_FIRST_VIEW_SCHEMA_VERSION = 3' src/services/exploreProfileFirstViewService.ts
          grep -Fq 'requestMaterializedFirstView(normalizedRef, cached.revision)' src/services/exploreProfileFirstViewService.ts
      - name: TypeScript and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Dry-run Worker patch 019 against exact active PREVIEW runtime
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/explore-worker
          rm -rf .remote-worker && mkdir -p .remote-worker
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,name=process.env.PREVIEW_WORKER,token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const x=await r.json();if(!r.ok||x.success===false)throw new Error(`Cloudflare ${r.status}: ${JSON.stringify(x).slice(0,1200)}`);return x.result||x;}
          (async()=>{const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`;const deps=await get(`${base}/deployments`);const d=(deps.deployments||deps||[])[0];const active=[...(d?.versions||[])].sort((a,b)=>Number(b.percentage)-Number(a.percentage))[0];if(!active?.version_id||Number(active.percentage||0)<99.99)throw new Error('No single active PREVIEW version');const ver=await get(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${name}/versions/${active.version_id}?include=modules`);const mods=ver.modules||[];const main=mods.find(m=>m.name===(ver.main_module||mods[0]?.name))||mods[0];const src=Buffer.from(main.content_base64,'base64').toString('utf8');if(!src.includes('handleMusicNotePublicationSingleWrite016')||!src.includes('Promise.allSettled'))throw new Error('Stage3.1 active runtime missing');fs.writeFileSync(path.join('.remote-worker','worker.js'),src);console.log('[Stage3.2] active PREVIEW',active.version_id);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          SORIDRAW_REMOTE_WORKER_DIR="$PWD/.remote-worker" node patches/019-publication-profile-r2-delta.mjs
          node --check .remote-worker/worker.js
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('.remote-worker/worker.js','utf8');
          function fn(name){const ns=[`async function ${name}(`,`function ${name}(`];let st=-1;for(const n of ns){st=s.indexOf(n);if(st>=0)break;}if(st<0)throw new Error('missing '+name);const b=s.indexOf('{',st);let d=0,q=null,e=false;for(let i=b;i<s.length;i++){const c=s[i];if(q){if(e){e=false;continue;}if(c==='\\'){e=true;continue;}if(c===q)q=null;continue;}if(c==='"'||c==="'"||c==='`'){q=c;continue;}if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(st,i+1);}throw new Error('unterminated '+name)}
          const inv=fn('invalidatePublicationProfileCaches017');if(inv.includes('PROFILE_MEDIA.delete'))throw new Error('profile R2 still deleted');
          const delta=fn('patchExploreProfileR2Mutation019');if(delta.includes('env.DB'))throw new Error('profile delta touches D1');
          for(const n of ['handleMusicNotePublicationSingleWrite016','handleMusicNotePrivate017','handleMusicNotePublicationOptions017'])if(!fn(n).includes('patchExploreProfileR2Mutation019'))throw new Error(n+' missing profile delta');
          console.log('[Stage3.2] Worker profile delta invariants PASS');
          NODE
      - name: Commit applied frontend source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SORIDRAW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx src/lib/userProfileCache.ts src/services/exploreProfileFirstViewService.ts
          if git diff --cached --quiet; then
            echo 'No frontend source changes to commit.'
          else
            git commit -m 'fix(preview): cache refresh user state and revalidate public profiles'
            git push origin HEAD:preview
          fi
