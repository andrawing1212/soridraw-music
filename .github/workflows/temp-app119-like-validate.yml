name: TEMP app119 like validation

on:
  push:
    branches:
      - work/app119-like-20s-latest-cache

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: App 119 regression
        run: node scripts/verify-119-explore-like-20s-latest-cache.mjs
