name: TEMP 151 App125 Explore Warm Entry Code Verification
# rerun after updating the legacy 123 verifier for 126 stale-entry behavior
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-151-explore-warm-entry-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Cross-device like regression and prior release tests
        run: |
          set -euo pipefail
          node scripts/verify-126-explore-entry-like-count.mjs
          node scripts/verify-125-like-preservation.mjs
          node scripts/verify-123-shared-like-cache-repair.mjs
          node scripts/verify-124-mobile-shared-cache-repair.mjs
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Confirm audit-only no deploy or data writes
        run: echo 'VERIFY_ONLY=PASS DEPLOY=0 D1_WRITE=0 R2_WRITE=0 FIREBASE_WRITE=0'
