name: SORIDRAW Backend V2 Step 2-A4d Master Finalize

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/backend-v2-step2a4d-master-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'andrawing1212'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview
          fetch-depth: 1

      - name: Patch authoritative master only
        run: python3 .deploy/tmp_step2a4d_master_finalize.py

      - name: Commit master result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SORIDRAW_BACKEND_V2_MASTER_PLAN.md
          git diff --cached --quiet && { echo 'MASTER_NOT_CHANGED'; exit 1; }
          git commit -m 'docs: finalize Step 2-A4d bounded catch-up'
          git push origin HEAD:preview
