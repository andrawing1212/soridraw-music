name: Temp 1027 Music Note Cache First Fix

on:
  push:
    branches:
      - preview
    paths:
      - .github/workflows/temp-1027-music-note-cache-first.yml

permissions:
  contents: write

jobs:
  apply_test_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 20

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy/apply-1027-music-note-cache-first-bounded-pagination.py
          grep -q SORIDRAW_MUSIC_NOTE_ORDER_AXIS_REPAIR_1026 src/App.tsx
          if grep -q SORIDRAW_MUSIC_NOTE_CACHE_FIRST_BOUNDED_MORE_1027 src/App.tsx; then
            echo '1027 already applied; no second patch run needed.'
            exit 0
          fi
          echo BASE_GUARD=PASS

      - name: Apply 1027 patch
        run: python .deploy/apply-1027-music-note-cache-first-bounded-pagination.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Pagination safety regression
        run: node scripts/verify-music-note-pagination-order.mjs

      - name: Static cost guard
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; a=Path('src/App.tsx').read_text(); s=a.index('  const loadMoreFavorites = useCallback(async () => {'); e=a.index('  const syncMusicNoteIncrementalFromRemoteVersion = useCallback',s); b=a[s:e]; assert b.count('await getDocs(')==1; assert 'while (' not in b; assert 'maxScanPages' not in b; assert 'loadCompatibilityTail' not in b; assert \"orderBy('createdAtMs', 'desc')\" in b; assert 'limit(FAVORITES_PAGE_SIZE)' in b; assert 'startAfter(cursorSnapshot)' in b; print('MUSIC_NOTE_MORE_MAX_ONE_PAGE_QUERY=PASS')"

      - name: Build
        run: npm run build

      - name: Commit verified application change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add src/App.tsx scripts/verify-music-note-pagination-order.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 2
          git commit -m 'fix(music-note): make More cache-first and bounded'
          git push origin HEAD:preview
          echo COMMIT_PUSH=PASS
          echo FIREBASE_DEPLOYED=false
          echo FUNCTIONS_DEPLOYED=false
          echo FIRESTORE_RULES_DEPLOYED=false
          echo CLOUDFLARE_DEPLOYED=false
          echo MAIN_CHANGED=false
