name: Audit 116 Music Note Library Warm Cost

on:
  push:
    branches: [preview]
    paths:
      - '.deploy/audit-116-music-note-library-warm-cost.trigger'

permissions:
  contents: read

concurrency:
  group: audit-116-music-note-library-warm-cost
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify warm and cold read guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-116-music-note-library-warm-cost.mjs
          node scripts/verify-no-unbounded-user-song-bootstrap.mjs
          node scripts/verify-030-library-warm-cache-no-idle-read.mjs
          node scripts/verify-029-music-note-library.mjs
          echo '116_WARM_COST_STATIC_AUDIT=PASS'
          echo 'MUSIC_NOTE_CURRENT_SEMANTIC_GUARD=PASS'
          echo 'NO_FULL_USER_SONG_BOOTSTRAP=PASS'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify no product mutation
        shell: bash
        run: |
          set -euo pipefail
          echo 'Build may regenerate tracked dist/ output; audit source/config/backend changes separately.'
          git diff --check -- . ':(exclude)dist/**'
          git diff --quiet -- . ':(exclude)dist/**'
          test -z "$(git ls-files --others --exclude-standard | grep -v '^dist/' || true)"
          echo 'NO_PRODUCT_CODE_CHANGE=true'
          echo 'NO_FIREBASE_CHANGE=true'
          echo 'NO_FUNCTIONS_CHANGE=true'
          echo 'NO_CLOUDFLARE_DEPLOYMENT=true'
          echo 'NO_D1_SCHEMA_CHANGE=true'
          echo 'NO_USER_DATA_CHANGE=true'
          echo 'NO_DEPLOYMENT=true'
