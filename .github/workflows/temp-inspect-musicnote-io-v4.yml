name: TEMP Music Note IO V4 Patch Verify

on:
  push:
    branches: [preview-musicnote-io-v4]
    paths:
      - '.github/workflows/temp-inspect-musicnote-io-v4.yml'

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-musicnote-io-v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply same-device Music Note version sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text(encoding='utf-8')
          def replace_once(old,new,label):
              global s
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              s=s.replace(old,new,1)

          old_profile="""            const musicNoteRemoteVersion = Number(data?.syncVersions?.musicNote || data?.favoriteSyncSignalUpdatedAt || 0);\n            if (musicNoteRemoteVersion > 0) {\n              writeMusicNoteSyncVersion(MUSIC_NOTE_REMOTE_SYNC_VERSION_STORAGE_BASE, currentUser.uid, musicNoteRemoteVersion);\n              if (typeof window !== 'undefined') {\n                window.dispatchEvent(new CustomEvent(MUSIC_NOTE_SYNC_VERSION_EVENT, {\n                  detail: {\n                    uid: currentUser.uid,\n                    version: musicNoteRemoteVersion,\n                    originDeviceId: String(data?.favoriteSyncSignal?.originDeviceId || ''),\n                  },\n                }));\n              }\n            }\n"""
          new_profile="""            const musicNoteRemoteVersion = Number(data?.syncVersions?.musicNote || data?.favoriteSyncSignalUpdatedAt || 0);\n            if (musicNoteRemoteVersion > 0) {\n              const musicNoteOriginDeviceId = String(data?.favoriteSyncSignal?.originDeviceId || '');\n              writeMusicNoteSyncVersion(MUSIC_NOTE_REMOTE_SYNC_VERSION_STORAGE_BASE, currentUser.uid, musicNoteRemoteVersion);\n              // 1010 — the latest Music Note mutation came from this browser, so its\n              // local cache already contains that mutation. Advance the local version\n              // immediately even while Studio is open; otherwise the next heart click\n              // performs a redundant favorites duplicate-check query.\n              if (musicNoteOriginDeviceId && musicNoteOriginDeviceId === getMusicNoteDeviceId()) {\n                writeMusicNoteSyncVersion(MUSIC_NOTE_LOCAL_SYNC_VERSION_STORAGE_BASE, currentUser.uid, musicNoteRemoteVersion);\n              }\n              if (typeof window !== 'undefined') {\n                window.dispatchEvent(new CustomEvent(MUSIC_NOTE_SYNC_VERSION_EVENT, {\n                  detail: {\n                    uid: currentUser.uid,\n                    version: musicNoteRemoteVersion,\n                    originDeviceId: musicNoteOriginDeviceId,\n                  },\n                }));\n              }\n            }\n"""
          replace_once(old_profile,new_profile,'profile same-device version')

          old_gate="""    const uid = currentUser.uid;\n    if (typeof window !== 'undefined' && window.location.pathname !== '/history') {\n      return;\n    }\n    if (musicNoteBundleActiveUids.has(uid)) {\n"""
          new_gate="""    const uid = currentUser.uid;\n    // 1010 — own-device invalidation does not need a server delta query and is\n    // safe to acknowledge on every route because the successful local mutation\n    // already updated the cache before publishing the sync signal.\n    if (originDeviceId && originDeviceId === getMusicNoteDeviceId()) {\n      writeMusicNoteSyncVersion(MUSIC_NOTE_LOCAL_SYNC_VERSION_STORAGE_BASE, uid, remoteVersion);\n      markCacheDiagnostic('musicNote', 'CACHE', 0);\n      return;\n    }\n    if (typeof window !== 'undefined' && window.location.pathname !== '/history') {\n      return;\n    }\n    if (musicNoteBundleActiveUids.has(uid)) {\n"""
          replace_once(old_gate,new_gate,'same-device route gate')

          old_late="""    if (originDeviceId && originDeviceId === getMusicNoteDeviceId()) {\n      writeMusicNoteSyncVersion(MUSIC_NOTE_LOCAL_SYNC_VERSION_STORAGE_BASE, uid, remoteVersion);\n      markCacheDiagnostic('musicNote', 'CACHE', 0);\n      return;\n    }\n\n"""
          replace_once(old_late,'','remove late same-device guard')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify scope and contracts
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/App.tsx"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.tsx').read_text(encoding='utf-8')
          assert '1010 — the latest Music Note mutation came from this browser' in s
          assert '1010 — own-device invalidation does not need a server delta query' in s
          assert "const musicNoteOriginDeviceId = String(data?.favoriteSyncSignal?.originDeviceId || '')" in s
          assert 'musicNoteOriginDeviceId === getMusicNoteDeviceId()' in s
          assert "where('updatedAtMs', '>', localVersion)" in s
          assert 'canTrustRecentStudioLocalIdentity' in s
          assert 'hasMusicNotePayloadCache(user.uid)' in s
          assert "where('soridrawSongId', '==', stableSongId)" in s
          print('1010 contracts: PASS')
          PY
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit verified source only
        run: |
          git config user.name "SORIDRAW Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "perf(preview): skip same-device Music Note duplicate reads"
          git push origin HEAD:preview-musicnote-io-v4
