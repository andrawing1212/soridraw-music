name: Temp 1044 MusicNote Runtime Wire Audit

on:
  push:
    branches: [preview]
    paths: ['.github/workflows/temp-1044-musicnote-runtime-wire-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Trace Music Note runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PAGE ENTRY WIRING ==='
          grep -R -n -B 12 -A 24 "soridraw:music-note-bundle-page-entry\|__soridrawMusicNotePageActive" src/App.tsx src/lib/listBundleCache.ts src/pages/FavoritesPage.tsx || true
          echo '=== SUBSCRIBE WIRING ==='
          grep -R -n -B 15 -A 40 "subscribeListBundle('musicNote'\|subscribeListBundle(\"musicNote\"" src/App.tsx src || true
          echo '=== FAVORITES CACHE READS ==='
          grep -n -B 12 -A 30 "favoritesInMemoryCache\|readFavoritesCache\|loadFavoritesCache\|setFavorites(" src/App.tsx | head -700 || true
          echo '=== CATALOG CACHEFIRST ==='
          grep -n -B 10 -A 45 "readCatalogSnapshotCacheFirst" src/lib/userDataEngine.ts src/lib/adaptiveListIndexV2.ts || true
