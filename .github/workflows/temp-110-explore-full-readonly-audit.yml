name: TEMP 110 Explore Full Readonly Audit

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-110-explore-full-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PREVIEW_BASE: https://soridraw-explore-preview.andrawing1212.workers.dev
      PREVIEW_ORIGIN: https://preview.soridraw.com
    steps:
      - name: Inspect direct feed canonical and cache-buster cost
        shell: bash
        run: |
          set -euo pipefail
          for sort in latest popular; do
            for n in 1 2 3; do
              code="$(curl -sS -D "$RUNNER_TEMP/${sort}-${n}.head" -o /dev/null -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=${sort}&limit=40")"
              echo "CANONICAL_${sort}_${n}=HTTP${code}"
              grep -Ei '^x-soridraw-(d1|r2|edge)' "$RUNNER_TEMP/${sort}-${n}.head" || true
            done
            for n in 1 2 3; do
              code="$(curl -sS -D "$RUNNER_TEMP/${sort}-noise-${n}.head" -o /dev/null -w '%{http_code}' -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_BASE}/v1/feed?sort=${sort}&limit=40&noise=audit-${n}")"
              echo "NOISE_${sort}_${n}=HTTP${code}"
              grep -Ei '^x-soridraw-(d1|r2|edge)' "$RUNNER_TEMP/${sort}-noise-${n}.head" || true
            done
          done
